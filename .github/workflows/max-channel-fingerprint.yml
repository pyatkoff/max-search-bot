name: Compare MAX channel state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/max-channel-fingerprint.yml'
      - 'tools/cutover_channel_fingerprint.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "SSH key is invalid"; exit 1; }
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Compare aggregate MAX fingerprints
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          prod="${DEPLOY_USER}@${DEPLOY_HOST}"
          standby="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$prod" \
            'cd ~/www/anytour.online/max-search && /opt/php81/bin/php tools/cutover_channel_fingerprint.php max' > "$RUNNER_TEMP/legacy.json"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$standby" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/cutover_channel_fingerprint.php max' > "$RUNNER_TEMP/new.json"
          python3 - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          old=json.load(open(root+'/legacy.json'))['tables']
          new=json.load(open(root+'/new.json'))['tables']
          differ=False
          old_newer=False
          for table in sorted(set(old)|set(new)):
              a=old.get(table,{})
              b=new.get(table,{})
              same=a.get('sha256') == b.get('sha256')
              differ |= not same
              al=a.get('latest_at') or ''
              bl=b.get('latest_at') or ''
              older_side_newer = al > bl
              old_newer |= older_side_newer
              print('MAX_STATE_TABLE=%s,legacy_rows:%s,new_rows:%s,legacy_latest:%s,new_latest:%s,digest_same:%s,legacy_newer:%s' % (
                  table,a.get('row_count',0),b.get('row_count',0),al or 'none',bl or 'none','YES' if same else 'NO','YES' if older_side_newer else 'NO'))
          print('MAX_STATE_DIFFERS=' + ('YES' if differ else 'NO'))
          print('MAX_LEGACY_HAS_NEWER_TIMESTAMP=' + ('YES' if old_newer else 'NO'))
          PY
