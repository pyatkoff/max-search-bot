ial-hotel-8999-v1","aliases":["WALDORF ASTORIA RAS AL KHAIMAH"]},{"hotel_id":13835,"logical_id":"commercial-hotel-13835-v1","aliases":["EASTERN MANGROVES HOTEL & SPA BY ANANTARA"]},{"hotel_id":56236,"logical_id":"commercial-hotel-56236-v1","aliases":["RIXOS PREMIUM DUBAI"]},{"hotel_id":110597,"logical_id":"commercial-hotel-110597-v1","aliases":["ONE & ONLY ONE ZA ABEEL"]},{"hotel_id":2519,"logical_id":"commercial-hotel-2519-v1","aliases":["ATLANTIS THE PALM"]},{"hotel_id":2591,"logical_id":"commercial-hotel-2591-v1","aliases":["KEMPINSKI HOTEL & RESIDENCES PALM JUMEIRAH"]},{"hotel_id":2936,"logical_id":"commercial-hotel-2936-v1","aliases":["ONE & ONLY THE PALM"]},{"hotel_id":8945,"logical_id":"commercial-hotel-8945-v1","aliases":["ONE & ONLY ROYAL MIRAGE"]},{"hotel_id":13837,"logical_id":"commercial-hotel-13837-v1","aliases":["FAIRMONT THE PALM"]},{"hotel_id":77684,"logical_id":"commercial-hotel-77684-v1","aliases":["ANANTARA WORLD ISLANDS DUBAI RESORT"]},{"hotel_id":80431,"logical_id":"commercial-hotel-80431-v1","aliases":["RIXOS MARINA ABU DHABI"]},{"hotel_id":78845,"logical_id":"commercial-hotel-78845-v1","aliases":["JUMEIRAH LIVING MARINA GATE"]},{"hotel_id":8918,"logical_id":"commercial-hotel-8918-v1","aliases":["JUMEIRAH LIVING WORLD TRADE CENTRE RESIDENCE"]}]'''.encode()
          body=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='fd9b28dab2147f13f3b0d0f7f856b14392b141d2')exit(2);
          $rows=json_decode(base64_decode(INPUT_B64,true),true,64,JSON_THROW_ON_ERROR);
          if(count($rows)!==70||count(array_unique(array_column($rows,'hotel_id')))!==70)exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          $out=['mode'=>'READ_ONLY_REMAINING70_EXISTING_PUBLICATION_SCREEN','db_writes'=>0,'provider_calls'=>0,'sender_calls'=>0,'inspected_hotel_ids'=>array_column($rows,'hotel_id'),'matches'=>[]];
          try{
          foreach(['telegram'=>10,'max'=>9] as $platform=>$cid){
          $q=$pdo->prepare('SELECT pp.id,pp.current_version_id,v.snapshot_json FROM post_publications pp JOIN post_versions v ON v.id=pp.current_version_id WHERE pp.post_channel_id=? ORDER BY pp.id LIMIT 2000');$q->execute([$cid]);$existing=$q->fetchAll(PDO::FETCH_ASSOC);
          foreach($rows as $row){foreach($existing as $e){
          $s=json_decode($e['snapshot_json'],true,64,JSON_THROW_ON_ERROR);$text=(string)($s['text']??'');$meta=(array)($s['metadata']??[]);
          $reasons=[];$aliases=[];$first=explode("\n",$text,2)[0];
          if(($meta['logical_id']??'')===$row['logical_id'])$reasons[]='logical_id';
          if((int)($meta['hotel_catalog_id']??0)===(int)$row['hotel_id'])$reasons[]='native_id';
          foreach($row['aliases'] as $a)if($a!==''&&mb_strpos(mb_strtolower($first,'UTF-8'),mb_strtolower($a,'UTF-8'),0,'UTF-8')!==false){$reasons[]='alias';$aliases[]=$a;}
          if($reasons)$out['matches'][]=['hotel_id'=>$row['hotel_id'],'platform'=>$platform,'publication_id'=>(int)$e['id'],'version_id'=>(int)$e['current_version_id'],'source_native_hotel_id'=>$meta['hotel_catalog_id']??null,'first_lines'=>mb_substr($text,0,550,'UTF-8'),'post_url'=>$s['post_url']??null,'matched_by'=>array_values(array_unique($reasons)),'matched_aliases'=>$aliases];
          }}
          }
          $out['matched_hotel_ids']=array_values(array_unique(array_column($out['matches'],'hotel_id')));$out['ok']=true;
