.php?action=hotel_details&hotelId=76032","extra_sources":[],"photo_blob_sha":"fe89cfbd30b224fbcb38412c25071c3a9a09f9ad"},{"hotel_id":2478,"hotel":"Shangri-La Villingili Resort & Spa","aliases":["Shangri-La Villingili Resort & Spa","SHANGRI-LA'S VILLINGILI RESORT & SPA"],"text":"✈️ Туры в Shangri-La Villingili Resort & Spa\n📍 Атолл Адду, Мальдивы.\n\nУединённые виллы с собственными бассейнами на тропическом острове в атолле Адду. Курорт вновь принимает гостей, инфраструктура открывается поэтапно.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=2478","extra_sources":["https://www.shangri-la.com/en/landing/maldives-first-guests/","https://www.shangri-la.com/male/villingiliresort/"],"photo_blob_sha":"e7d201e2a1191f6c6a8abfe4b98c3a15b817369f"},{"hotel_id":132068,"hotel":"RAH GILI Maldives","aliases":["RAH GILI Maldives","RAH GILI MALDIVES"],"text":"✈️ Туры в RAH GILI Maldives\n📍 Южный Мале, Мальдивы.\n\nВиллы с частными бассейнами на острове Южного Мале. Домашний риф, спа и детский клуб для красивого отдыха вдвоём или всей семьёй среди океанских пейзажей.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=132068","extra_sources":["https://rahgili.com/media-centre/press-releases/rah-gili-maldives-set-to-redefine-luxury-with-six-private-islands-debut"],"photo_blob_sha":"9043016e4c165d528b02e969cfb93b2e95e46133"},{"hotel_id":158417,"hotel":"Cocomo Maldives","aliases":["Cocomo Maldives","COCOMO MALDIVES"],"text":"✈️ Туры в Cocomo Maldives\n📍 Остров Химмафуши, Мальдивы.\n\nОтдых на локальном острове Химмафуши для тех, кто хочет познакомиться с Мальдивами ближе. Открытый бассейн, ресторан и бикини-пляж примерно в 100 метрах от отеля.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=158417","extra_sources":[],"photo_blob_sha":"6002d3a43bf9e17513ae1022ba1eded29cd5893a"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          assert api('git/ref/heads/main')['object']['sha']==MAIN
          prior=api('actions/runs/44108174063')
          assert prior['conclusion']=='success' and prior['run_attempt']==1 and prior['head_sha']=='0bf0dfceaeee0b7b0bb9b5b3ab117ba3c7d104df'
          APP=pathlib.Path('pub/runtime-readonly.txt').read_text().strip()
          assert APP in ['fd9b28dab2147f13f3b0d0f7f856b14392b141d2',MAIN],('unexpected_runtime',APP)
          source=pathlib.Path('tools/direct_demand/operations')
          template=(source/'commercial-batch-template-20261102.php').read_text()
          assert hashlib.sha256(template.encode()).hexdigest()=='4c4aaa2e50155a69e8bd8b9f460777026735b0c51c3b2fc253cf0b7556e53ed5'
          assert subprocess.check_output(['git','hash-object',str(source/'prepare-commercial-batch.py')],text=True).strip()=='8df7a35474b138364b6e6c010af4fa484e350ddb'
          pairs=[('f0e04e9b4e0ed6859ced96279cbf0619931596e6','1982ff7368763edf8b7238c3142e3cc28579e991'),('db8181426091a685a79ee55991cde22671f0d9dd','7304af19cc19666f00ca4ead1b04c2bdce719646')]
          protected=re.findall(r'"([^"]+)"=>"([a-f0-9]{40})"',template);assert len(protected)==22
          for commit in set([APP,MAIN]):
              tree=api('git/trees/'+commit+'?recursive=1');assert not tree['truncated']
              actual={e['path']:e['sha'] for e in tree['tree']}
              for path,sha in protected:assert actual[path]==dict(pairs).get(sha,sha),('publisher_surface_drift',commit,path)
          rec=json.loads(pathlib.Path(PREFIX+'cover-receipt.json').read_bytes())
          assert len(rec['rows'])==65 and rec['prepared_count']==39 and rec['held_count']==26 and rec['sender_calls']==rec['feed_writes']==0
          assert len(INPUT)==38 and 43564 not in [r['hotel_id'] for r in INPUT]
          prepare=runpy.run_path(str(source/'prepare-commercial-batch.py'))['prepare']
          out=pathlib.Path('reserve38-accepted-source');out.mkdir()
          files={};batches=[]
          for i in range(0,len(INPUT),10):
              batch=14+i//10;items=INPUT[i:i+10]
              manifest={'schema_version':1,'operation':'commercial-hotel-batch-20261117-'+str(batch)+'-v1','state':'PREPARED_NOT_SENT','button_text':'✈️ Узнать стоимость тура','expected_new_full_pairs':len(items),'photo_freeze_commit':BASE,'native_id_namespace':'Tourvisor','rows':[]}
              for row in items:
                  hid=row['hotel_id'];receipt=next(x for x in rec['rows'] if x['id']==hid)
                  assert receipt['status']=='prepared_needs_visual_acceptance' and not receipt['send_allowed']
                  b=pathlib.Path(PREFIX+str(hid)+'.png').read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==row['photo_blob_sha']
                  assert hashlib.sha256(b).hexdigest()==receipt['png_sha256']
                  assert len(row['text'].encode('utf-16-le'))//2<=1024 and len(row['text'])>150
                  assert row['text'].startswith('✈️ Туры в '+row['hotel']+'\n📍 ') and 'Подберём тур на ваши даты.' in row['text']
                  manifest['rows'].append({'hotel_id':hid,'logical_id':'commercial-hotel-'+str(hid)+'-v1','aliases':row['aliases'],'text':row['text'],'text_sha256':hashlib.sha256(row['text'].encode()).hexdigest(),'photo_url':'https://raw.githubusercontent.com/pyatkoff/max-search-bot/'+BASE+'/'+PREFIX+str(hid)+'.png','photo_sha256':receipt['png_sha256'],'media_state':'REAL_OFFICIAL_PHOTOGRAPHY_BRANDED_COVER_VISUALLY_VERIFIED','sources':[row['source']]+row.get('extra_sources',[])})
              raw=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
              approval={'schema_version':1,'operation':manifest['operation'],'expected_installed_sha':APP,'hotel_ids':[r['hotel_id'] for r in items],'manifest_sha256':hashlib.sha256(raw).hexdigest()}
              php,report=prepare(template,raw,approval)
              for old,new in pairs:
                  assert php.count(old)==1 and php.count(new)==0
                  php=php.replace(old,new)
              files['p'+str(batch)+'-manifest.json']=raw
              files['p'+str(batch)+'-approval.json']=(json.dumps(approval,ensure_ascii=False,indent=2)+'\n').encode()
              files['p'+str(batch)+'-publisher-unexecuted.php']=php.encode()
