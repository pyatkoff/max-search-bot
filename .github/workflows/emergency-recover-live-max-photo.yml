name: Emergency recover live MAX photo

on:
  push:
    branches: [fix/max-live-media-recovery-20260923]
    paths:
      - '.github/workflows/emergency-recover-live-max-photo.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ddfad0adb5ea28a6c8bbadd1bd6dbcf59f4922d6
          persist-credentials: false

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/recover_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key"; else printf '%s\n' "$raw" | tr -d '\r' > "$key"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]]
            printf '%s\n' "$decoded" | tr -d '\r' > "$key"
          fi
          chmod 600 "$key"

      - name: Build read-only recovery helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/recover_live_photo.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $root='/var/www/anytoour/data/www/app.anytoour.ru';
          require $root.'/config.php';
          require $root.'/services/ConversationDb.php';
          require $root.'/services/MaxTransport.php';
          require $root.'/maxsearchclass.php';

          $pdo=ConversationDb::connection();
          $q=$pdo->prepare("SELECT id,conversation_id,external_message_id,text,metadata_json FROM messages
              WHERE channel='max' AND direction='inbound' AND sender_type='customer'
                AND text LIKE ? AND text LIKE ? AND text LIKE ?
              ORDER BY id DESC LIMIT 1");
          $q->execute(['%предложение%','%3-5.10%','%вылет%']);
          $anchor=$q->fetch(PDO::FETCH_ASSOC);
          if(!$anchor){fwrite(STDERR,"anchor_not_found\n");exit(20);}

          $q=$pdo->prepare("SELECT id,conversation_id,external_message_id,text,metadata_json FROM messages
              WHERE conversation_id=? AND direction='inbound' AND sender_type='customer'
              ORDER BY ABS(CAST(id AS SIGNED)-CAST(? AS SIGNED)), id ASC LIMIT 16");
          $q->execute([(int)$anchor['conversation_id'],(int)$anchor['id']]);
          $rows=$q->fetchAll(PDO::FETCH_ASSOC);

          $urls=[];$videoTokens=[];
          $collectUrls=function($value) use (&$collectUrls,&$urls): void {
              if(is_string($value) && preg_match('#^https://#i',trim($value))){$urls[]=trim($value);return;}
              if(is_array($value)) foreach($value as $v) $collectUrls($v);
          };
          $bestPath='';$bestSize=0;$bestMime='';
          echo "ANCHOR=1 ROWS=".count($rows)."\n";

          foreach($rows as $row){
              $offset=(int)$row['id']-(int)$anchor['id'];
              $meta=json_decode((string)($row['metadata_json']??''),true);
              $metaAttachments=is_array($meta['attachments']??null)?$meta['attachments']:[];
              $metaTypes=[];foreach($metaAttachments as $a)if(is_array($a))$metaTypes[]=(string)($a['type']??'');
              echo "ROW offset={$offset} text_len=".strlen((string)($row['text']??''))." mid=".((string)($row['external_message_id']??'')!==''?'1':'0')." meta_count=".count($metaAttachments)." meta_types=".implode(',',$metaTypes)."\n";
              if(is_array($meta)) $collectUrls($meta['attachments']??[]);
              $mid=trim((string)($row['external_message_id']??''));
              if($mid!==''){
                  $remote=MaxTransport::request(MaxSearchApi::$TV_API_URL,MAX_SEARCH_TOKEN,'GET','/messages/'.rawurlencode($mid),[],null,null);
                  if(is_array($remote)){
                      $types=[];$tokenValues=[];$walk=function($v) use (&$walk,&$types,&$tokenValues):void{if(!is_array($v))return;if(isset($v['type'])&&is_scalar($v['type']))$types[]=(string)$v['type'];if(isset($v['token'])&&is_scalar($v['token'])&&trim((string)$v['token'])!=='')$tokenValues[]=trim((string)$v['token']);foreach($v as $x)if(is_array($x))$walk($x);};$walk($remote);
                      $beforeUrlCount=count($urls);$collectUrls($remote);
                      foreach(array_values(array_unique($tokenValues)) as $videoToken){
                          $video=MaxTransport::request(MaxSearchApi::$TV_API_URL,MAX_SEARCH_TOKEN,'GET','/videos/'.rawurlencode($videoToken),[],null,null);
                          if(is_array($video))$collectUrls($video);
                      }
                      echo " API=1 types=".implode(',',array_values(array_unique($types)))." tokens=".count($tokenValues)." urls=".(count($urls)-$beforeUrlCount)."\n";
                  } else {
                      $err=MaxTransport::lastError();echo " API=0 category=".(string)($err['category']??'unknown')." http=".(int)($err['http_code']??0)."\n";
                  }
              }
              foreach(array_values(array_unique($videoTokens)) as $videoToken){
                  $video=MaxTransport::request(MaxSearchApi::$TV_API_URL,MAX_SEARCH_TOKEN,'GET','/videos/'.rawurlencode($videoToken),[],null,null);
                  if(is_array($video)){$collectUrls($video);echo " VIDEO_INFO=1\n";}else{$err=MaxTransport::lastError();echo " VIDEO_INFO=0 http=".(int)($err['http_code']??0)."\n";}
              }
              $videoTokens=[];
              foreach(array_values(array_unique($urls)) as $url){
                  $tmp='/tmp/recovered-candidate-'.bin2hex(random_bytes(4)).'.bin';
                  $ch=curl_init($url);$fp=fopen($tmp,'w+b');
                  curl_setopt_array($ch,MaxTlsConfig::curlOptions(false));
                  curl_setopt($ch,CURLOPT_HTTPHEADER,['Authorization: '.MAX_SEARCH_TOKEN,'Accept: */*']);
                  curl_setopt($ch,CURLOPT_FILE,$fp);curl_setopt($ch,CURLOPT_FOLLOWLOCATION,true);
                  curl_setopt($ch,CURLOPT_CONNECTTIMEOUT,8);curl_setopt($ch,CURLOPT_TIMEOUT,45);curl_setopt($ch,CURLOPT_MAXREDIRS,3);
                  $ok=curl_exec($ch);$http=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);$ctype=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
                  curl_close($ch);fflush($fp);$size=ftell($fp);fclose($fp);
                  if($ok!==false && $http>=200 && $http<300 && $size>0 && $size<=52428800){
                      $mime=strtolower(trim(explode(';',$ctype)[0]??''));
                      if(!str_starts_with($mime,'image/')){$fi=new finfo(FILEINFO_MIME_TYPE);$mime=(string)$fi->file($tmp);}
                      if((str_starts_with($mime,'image/')||str_starts_with($mime,'video/')) && $size>$bestSize){
                          if($bestPath!=='')@unlink($bestPath);
                          $bestPath=$tmp;$bestSize=$size;$bestMime=$mime;$tmp='';
                      }
                  }
                  if($tmp!=='')@unlink($tmp);
              }
              $urls=[];
          }
          if($bestPath!==''){
              $ext=['image/jpeg'=>'jpg','image/png'=>'png','image/gif'=>'gif','image/webp'=>'webp','image/tiff'=>'tif','image/heic'=>'heic','video/mp4'=>'mp4','video/quicktime'=>'mov','video/webm'=>'webm','video/x-matroska'=>'mkv'][$bestMime]??(str_starts_with($bestMime,'video/')?'video':'img');
              $final='/tmp/recovered-live-client-photo.'.$ext;rename($bestPath,$final);file_put_contents('/tmp/recovered-live-client-photo.path',$final);
              echo "RECOVERED=1\nMIME={$bestMime}\nBYTES={$bestSize}\n";exit(0);
          }
          fwrite(STDERR,"photo_not_recovered\n");
          exit(21);
          PHP

      - name: Recover exact live photo from MAX
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/recover_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          scp "${opts[@]}" "$RUNNER_TEMP/recover_live_photo.php" "$remote:/tmp/recover_live_photo.php"
          ssh "${opts[@]}" "$remote" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = "ddfad0adb5ea28a6c8bbadd1bd6dbcf59f4922d6"; php /tmp/recover_live_photo.php; rm -f /tmp/recover_live_photo.php'
          path="$(ssh "${opts[@]}" "$remote" 'cat /tmp/recovered-live-client-photo.path')"
          case "$path" in /tmp/recovered-live-client-photo.*) ;; *) echo invalid_path >&2; exit 1;; esac
          scp "${opts[@]}" "$remote:$path" "$RUNNER_TEMP/$(basename "$path")"
          ssh "${opts[@]}" "$remote" "rm -f '$path' /tmp/recovered-live-client-photo.path"
          ls -l "$RUNNER_TEMP"/recovered-live-client-photo.*

      - name: Upload recovered client photo
        uses: actions/upload-artifact@v4
        with:
          name: recovered-live-client-media
          path: ${{ runner.temp }}/recovered-live-client-photo.*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
