name: Compare cutover conversation stores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conversation-store-divergence.yml'
      - 'tools/cutover_data_snapshot.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "SSH key is invalid"; exit 1; }
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Capture aggregate snapshots
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd ~/www/anytour.online/max-search && /opt/php81/bin/php tools/cutover_data_snapshot.php' > "$RUNNER_TEMP/prod.json"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/cutover_data_snapshot.php' > "$RUNNER_TEMP/standby.json"
          python3 - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          prod=json.load(open(root+'/prod.json'))['tables']
          new=json.load(open(root+'/standby.json'))['tables']
          any_diff=False
          for table in sorted(set(prod)|set(new)):
              p=prod.get(table,{})
              n=new.get(table,{})
              pr=int(p.get('row_count',0)); nr=int(n.get('row_count',0))
              pm=int(p.get('max_id',0)); nm=int(n.get('max_id',0))
              diff=(pr!=nr or pm!=nm)
              any_diff |= diff
              print(f"STORE_TABLE={table},legacy_rows:{pr},new_rows:{nr},legacy_max_id:{pm},new_max_id:{nm},different:{'YES' if diff else 'NO'}")
          print('CONVERSATION_STORES_DIFFER=' + ('YES' if any_diff else 'NO'))
          PY
