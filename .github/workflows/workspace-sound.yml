name: Workspace incoming sound

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'manager/**'
      - 'services/ManagerIncomingNotificationService.php'
      - 'services/ProjectAccessService.php'
      - 'services/ManagerPushService.php'
      - 'services/ManagerPushConnectionService.php'
      - 'services/ManagerPushHealth.php'
      - 'migrations/039_manager_push_connections.sql'
      - 'services/IncomingUpdateDispatcher.php'
      - 'tests/notification-sound/**'
      - 'tests/mysql/manager-push-connections.php'
      - 'tests/visual/workspace-sound.spec.js'
      - '.github/workflows/workspace-sound.yml'
      - '.github/workflows/ci-change-scope.yml'
      - 'tools/ci_change_scope.js'
      - 'tests/run_ci_change_scope_regression.js'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  change-scope:
    uses: ./.github/workflows/ci-change-scope.yml

  sound:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Sound controller unit regression
        run: node tests/notification-sound/client.unit.js
      - name: Read-only authentication bootstrap regression
        run: php tests/notification-sound/bootstrap-readonly.php
      - name: Read-only feed regression
        run: php tests/notification-sound/feed.php
      - name: Start static fixtures
        if: success() || failure()
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/sound-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Touch, audio scheduling and deduplication
        if: success() || failure()
        run: npx playwright test tests/visual/workspace-sound.spec.js --browser=${{ matrix.browser }} --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-evidence-${{ matrix.browser }}-${{ github.sha }}
          path: sound-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7

  native-mysql:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sound-local-test-only
          MYSQL_DATABASE: sound_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psound-local-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Native auth, ordering and browser notification lifecycle
        env:
          SOUND_MYSQL_TEST: '1'
        run: |
          php tests/notification-sound/feed.php
          php tests/notification-sound/http.php
          php tests/mysql/manager-push-connections.php
