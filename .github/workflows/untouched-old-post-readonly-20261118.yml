name: Main AnyTour bounded read-only access diagnosis
on:
  push:
    branches: [audit/second-old-post-readonly-20261118]
    paths: ['.github/workflows/untouched-old-post-readonly-20261118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: main-anytour-readonly-diagnosis
  cancel-in-progress: false
jobs:
  read-only:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '4ea9e056b1b52d80589577264c399d8a1014e41a' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare bounded read-only diagnosis; no sender
        shell: bash
        run: |
          set -euo pipefail
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='bd8e248f7138ea75cb9fda2dcf44beb631c633a5')exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';require_once getcwd().'/integrations/ChannelPostApiTransport.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          $out=['mode'=>'MAIN_ANYTOUR_READ_ONLY','db_writes'=>0,'provider_write_attempts'=>0,'channels'=>[],'target_found'=>false];
          try{
          $q=$pdo->query("SELECT external_message_id FROM post_publications WHERE post_channel_id=4");$known=array_fill_keys($q->fetchAll(PDO::FETCH_COLUMN),true);
          $out['registered_count']=count($known);$out['pages']=[];$out['candidates']=[];
          $rights=ChannelPostApiTransport::buttonRequest('max','GET','/chats/-68765999669267/members/me',[],null);$out['membership']=['http'=>$rights['http'],'data'=>array_intersect_key($rights['data']??[],array_flip(['user_id','is_admin','is_owner','permissions']))];
          $before=strtotime('2026-10-01T00:00:00Z')*1000;
          for($page=0;$page<3;$page++){
          $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>-68765999669267,'from'=>$before,'count'=>100],null);$messages=$r['data']['messages']??[];$out['pages'][]=['http'=>$r['http'],'count'=>count($messages),'error'=>$r['data']['code']??null];if(!$messages)break;
          foreach($messages as $m){$mid=(string)($m['body']['mid']??'');$before=min($before,(int)($m['timestamp']??$before)-1);$types=array_column($m['body']['attachments']??[],'type');if(isset($known[$mid])||in_array('inline_keyboard',$types,true))continue;
          $out['candidates'][]=['mid'=>$mid,'url'=>$m['url']??null,'timestamp'=>$m['timestamp']??null,'date'=>gmdate('c',(int)(($m['timestamp']??0)/1000)),'registered'=>false,'sender'=>$m['sender']??null,'text'=>mb_substr((string)($m['body']['text']??''),0,1600),'attachment_types'=>$types];if(count($out['candidates'])>=3)break;
          }if(count($out['candidates'])>=3)break;
          }
          $out['ok']=true;
          }finally{$pdo->rollBack();}
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read main channel registry and provider metadata without writes
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = bd8e248f7138ea75cb9fda2dcf44beb631c633a5
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; test -z "$(git status --porcelain --untracked-files=no)"; php' < pub/read-only.php > pub/result.json
          cat pub/result.json
      - name: Preserve original diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-old-post-readonly-20261118
          path: pub/result.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
