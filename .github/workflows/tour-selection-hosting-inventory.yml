name: Selection existing hosting inventory

on:
  push:
    branches: [main, 'feat/selection-module-release-20261025']
    paths:
      - 'modules/tour-selections/hosting_inventory.php'
      - '.github/workflows/tour-selection-hosting-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/selection-module-release-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing public hosting names without changing configuration
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/selection_inventory_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/selection_inventory_known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'git -C /var/www/anytoour/data/www/app.anytoour.ru rev-parse HEAD' > "$RUNNER_TEMP/selection_inventory_source.txt"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" php < modules/tour-selections/hosting_inventory.php > "$RUNNER_TEMP/selection_hosting_inventory.json"
          python3 - "$RUNNER_TEMP/selection_hosting_inventory.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['ok'] and data['configuration_changed'] is False
          print(json.dumps(data,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: selection-hosting-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection_hosting_inventory.json
            ${{ runner.temp }}/selection_inventory_source.txt
          if-no-files-found: error
          retention-days: 14
