name: Read back the installed owner conversion registry once
on:
  push:
    branches: ['ops/modeled-delivery-registry-readback-20261103']
    paths: ['.github/workflows/modeled-delivery-registry-readback-20261103.yml']
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: modeled-delivery-registry-readback-20261103-original
      cancel-in-progress: false
    steps:
      - name: Verify original source and retain read-only intent
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const expected='33a6d4199e4309ed1314c29fd65e9d66976327c9';
            if(context.repo.owner!=='pyatkoff'||context.repo.repo!=='max-search-bot'||
                context.eventName!=='push'||context.ref!=='refs/heads/ops/modeled-delivery-registry-readback-20261103'||
                process.env.GITHUB_RUN_ATTEMPT!=='1')throw new Error('original_readback_required');
            const main=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(main.data.object.sha!==expected)throw new Error('current_main_changed');
            const commit=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            if(commit.data.parents.length!==1||commit.data.parents[0].sha!==expected)throw new Error('original_parent_required');
            const diff=await github.rest.repos.compareCommits({...context.repo,base:expected,head:context.sha});
            if(diff.data.total_commits!==1||diff.data.files?.length!==1||
                diff.data.files[0].filename!=='.github/workflows/modeled-delivery-registry-readback-20261103.yml'||
                diff.data.files[0].status!=='added')throw new Error('one_readback_helper_required');
            const fs=require('fs'),dir=process.env.RUNNER_TEMP+'/registry-readback';
            fs.mkdirSync(dir,{recursive:true,mode:0o700});
            fs.writeFileSync(dir+'/intent.json',JSON.stringify({operation:'owner-ledger-readback-20261103-original',
              run_id:context.runId,helper_sha:context.sha,expected_main:expected,date:'2026-11-03',
              max_pages:8,page_conversations:25,source_writes:false,customer_actions:false})+'\n',{mode:0o600});
            fs.writeFileSync(dir+'/receipt.json',JSON.stringify({schema_version:1,probe:'owner_delivery_registry',ok:false})+'\n',{mode:0o600});
      - name: Persist technical intent
        id: durable
        uses: actions/upload-artifact@v4
        with:
          name: modeled-registry-readback-intent
          path: ${{ runner.temp }}/registry-readback/intent.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify the installed page refuses anonymous access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          code="$(curl --max-time 15 --silent --show-error --output "$RUNNER_TEMP/registry-readback/anonymous-response" --write-out '%{http_code}' 'https://app.anytoour.ru/manager/assigned-value.php?view=delivery' 2>/dev/null)"
          rm -f "$RUNNER_TEMP/registry-readback/anonymous-response"
          if [[ "$code" != '401' && "$code" != '403' ]]; then
            echo 'owner_registry_http_protection_unconfirmed'
            exit 1
          fi
          echo 'OWNER_REGISTRY_HTTP=protected'
      - name: Prepare existing protected server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/registry-readback/key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read the exact installed registry and reconcile all bounded pages
        if: steps.durable.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: 33a6d4199e4309ed1314c29fd65e9d66976327c9
          INTENT_ARTIFACT_ID: ${{ steps.durable.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          cat > "$RUNNER_TEMP/registry-readback/program.php" <<'READBACK_PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          try{
              $root='/var/www/anytoour/data/www/app.anytoour.ru';
              if(PHP_SAPI!=='cli'||realpath(getcwd())!==realpath($root))throw new RuntimeException('scope');
              require $root.'/config.php';
              require_once $root.'/services/ConversationDb.php';
              require_once $root.'/services/ProjectAccessService.php';
              require_once $root.'/services/ModeledConversionDeliveryRegistry.php';
              if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('scope');
              $pdo=ConversationDb::connection();
              if($pdo->getAttribute(PDO::ATTR_DRIVER_NAME)!=='mysql'||$pdo->inTransaction())throw new RuntimeException('storage');
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              ProjectAccessService::initializeReadOnly();
              $authorize=static function():void{if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('scope');};
              $key=bin2hex(random_bytes(32));$input=['date'=>'2026-11-03','platform'=>'all'];
              $seen=[];$amount=0;$events=0;$expected=null;$complete=false;
              for($pageNo=0;$pageNo<8;$pageNo++){
                  $page=(new ModeledConversionDeliveryRegistry($pdo,$authorize,$key))->read($input,time());
                  if(($page['available']??false)!==true||($page['currency']??null)!=='RUB')throw new RuntimeException('unavailable');
                  $summary=$page['summary'];
                  $current=['events'=>$summary['events'],'conversations'=>$summary['conversations'],
                      'cents'=>(int)round($summary['value_rub']*100)];
                  if($expected===null)$expected=$current;
                  if($current!==$expected)throw new RuntimeException('changed_scope');
                  foreach($page['rows']as$row){
                      $id=(string)$row['conversation_id'];if(isset($seen[$id]))throw new RuntimeException('duplicate');
                      $seen[$id]=true;$amount+=(int)round($row['period_value_rub']*100);
                      foreach($row['events']as$event)if(($event['in_selected_day']??false)===true)$events++;
                  }
                  if(($page['pagination']['has_more']??true)===false){$complete=true;break;}
                  $cursor=$page['pagination']['next_cursor']??null;if(!is_string($cursor))throw new RuntimeException('cursor');
                  $input['cursor']=$cursor;unset($page);
              }
              if(!$complete||$expected===null||$expected['events']<1||count($seen)!==$expected['conversations']
                  ||$events!==$expected['events']||$amount!==$expected['cents']||$pdo->inTransaction())
                  throw new RuntimeException('reconciliation');
              echo '{"schema_version":1,"probe":"owner_delivery_registry","ok":true,"read_only":true,"reconciled":true}'.PHP_EOL;
          }catch(Throwable $ignored){
              echo '{"schema_version":1,"probe":"owner_delivery_registry","ok":false}'.PHP_EOL;
              exit(1);
          }
          READBACK_PHP
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          printf '%s\n' '{"schema_version":1,"probe":"owner_delivery_registry","ok":false}' > "$RUNNER_TEMP/registry-readback/receipt.json"
          if ! ssh -i "$RUNNER_TEMP/registry-readback/key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && git diff --quiet HEAD -- services/ModeledConversionDeliveryRegistry.php services/ModeledConversionValueContract.php services/InternalOwnerDialogueScope.php && timeout 45s php /dev/stdin && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" < "$RUNNER_TEMP/registry-readback/program.php" > "$RUNNER_TEMP/registry-readback/private-result.json" 2>/dev/null; then
            echo 'owner_registry_readback_failed'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/registry-readback/private-result.json" "$RUNNER_TEMP/registry-readback/receipt.json" <<'READBACK_RESULT'
          import json,sys
          try:
              with open(sys.argv[1],encoding='utf-8') as f: result=json.load(f)
              expected={'schema_version':1,'probe':'owner_delivery_registry','ok':True,'read_only':True,'reconciled':True}
              if result!=expected: raise ValueError('unconfirmed')
              with open(sys.argv[2],'w',encoding='utf-8') as f: json.dump(expected,f)
          except Exception:
              print('owner_registry_readback_unconfirmed')
              raise SystemExit(1)
          print('OWNER_DELIVERY_REGISTRY_READBACK=passed')
          READBACK_RESULT
      - name: Retain sanitized original result
        if: always() && steps.durable.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: modeled-registry-readback-receipt
          path: ${{ runner.temp }}/registry-readback/receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral connection and private read result
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/registry-readback/anonymous-response" "$RUNNER_TEMP/registry-readback/key" "$RUNNER_TEMP/registry-readback/program.php" "$RUNNER_TEMP/registry-readback/private-result.json"
