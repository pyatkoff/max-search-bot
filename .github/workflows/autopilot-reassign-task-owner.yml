name: Temporary reassign task owner patch

on:
  push:
    branches:
      - autopilot/reassign-open-task-owner

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task-owner-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/reassign-open-task-owner
          fetch-depth: 0
      - name: Patch reassignment transaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/ManagerConversationService.php')
          text = path.read_text()
          needle = "            $pdo->prepare('UPDATE conversations SET status=?,manager_id=? WHERE id=?')->execute(['manager',$targetManagerId,$conversationId]);\n            $pdo->prepare('INSERT INTO manager_assignments (conversation_id,manager_id,assignment_type) VALUES (?,?,?)')->execute([$conversationId,$targetManagerId,'admin_reassign']);"
          replacement = "            $pdo->prepare('UPDATE conversations SET status=?,manager_id=? WHERE id=?')->execute(['manager',$targetManagerId,$conversationId]);\n            $pdo->prepare(\"UPDATE lead_tasks SET assigned_manager_id=?,updated_at=UTC_TIMESTAMP() WHERE conversation_id=? AND status='open'\")->execute([$targetManagerId,$conversationId]);\n            $pdo->prepare('INSERT INTO manager_assignments (conversation_id,manager_id,assignment_type) VALUES (?,?,?)')->execute([$conversationId,$targetManagerId,'admin_reassign']);"
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one reassignment insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          Path('.github/workflows/autopilot-reassign-task-owner.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/ManagerConversationService.php .github/workflows/autopilot-reassign-task-owner.yml
          git commit -m "Keep open tasks with reassigned lead [task-owner-patched]"
          git push origin HEAD:autopilot/reassign-open-task-owner
