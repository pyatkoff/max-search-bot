name: Read-only ANEX archive live acceptance

on:
  push:
    branches: [analysis/telegram-anex-live-20261018]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: 9ed2ab244a4b4e1a704ac0841dba53a3e4280da8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fixed source and current main before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/analysis/telegram-anex-live-20261018'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          php -l tools/telegram_anex_live.php
      - name: Execute bounded SELECT-only acceptance with pinned SSH host
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          SSH_HOST_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/tg-archive-acceptance.XXXXXX")"
          echo "TG_ARCHIVE_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$private_dir/key"; else printf '%s\n' "$raw" | tr -d '\r' > "$private_dir/key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$private_dir/key"
          fi
          chmod 600 "$private_dir/key"
          ssh-keygen -y -f "$private_dir/key" >/dev/null
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          printf '%s %s\n' "$DEPLOY_HOST" "$SSH_HOST_KEY" > "$private_dir/known_hosts"
          chmod 600 "$private_dir/known_hosts"
          ssh_opts=(-i "$private_dir/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts" -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o LogLevel=ERROR)
          remote_ok=true
          timeout 45 ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; php -d display_errors=0 -d log_errors=0 /dev/stdin; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" < tools/telegram_anex_live.php > "$private_dir/result.json" 2> "$private_dir/stderr.txt" || remote_ok=false
          test "$remote_ok" = true
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          php -r '$j=json_decode(file_get_contents($argv[1]),true); if(!is_array($j)||($j["ok"]??false)!==true){echo "Archive check unavailable; private output not printed.\n";exit(1);} $allow=array_flip(["ok","source_project","checked_at_utc","connected","capture_enabled","shared","records","synthetic_test"]); echo json_encode(array_intersect_key($j,$allow),JSON_UNESCAPED_SLASHES)."\n";' "$private_dir/result.json"
      - name: Remove private runner files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${TG_ARCHIVE_PRIVATE_DIR:-}" in "$RUNNER_TEMP"/tg-archive-acceptance.*) ;; *) exit 0;; esac
          rm -f "$TG_ARCHIVE_PRIVATE_DIR/key" "$TG_ARCHIVE_PRIVATE_DIR/known_hosts" "$TG_ARCHIVE_PRIVATE_DIR/result.json" "$TG_ARCHIVE_PRIVATE_DIR/stderr.txt"
          rmdir "$TG_ARCHIVE_PRIVATE_DIR"

