name: Prepare retained W11 covers with the existing composer, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/fastfill-wave5-cover-adjust-20261117.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
      && github.event.before == '3148938a2fbdeab58b98871cd979e94adbbccdf9' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0
        requests==2.32.5
    - name: Prepare preserved licensed sources only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/direct_demand/operations/prepare-wave11-covers-20261118.py
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave11-cover-visual-review
        path: 'wave11/*.jpg

          wave11/receipt.json'
        retention-days: 30
        if-no-files-found: warn
