name: Read fixed owner Direct account feed metadata
on:
  push:
    branches: [audit/direct-feed-preflight-20261026]
    paths:
      - .github/workflows/direct-feed-preflight-readonly.yml
      - audit/direct-feed-readonly.py
      - audit/direct-feed-runner.py
permissions:
  contents: read
concurrency:
  group: direct-feed-preflight-owner-20261026
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read fixed client and feed metadata with existing server token
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: dcb631888baf53ab8d1e4378fd891c251785abf6dded391533874dafa1c015b3
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/direct-feed-runner.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-feed-preflight-owner-20261026
          path: encrypted-direct-feed/*.enc.json
          retention-days: 3
          if-no-files-found: error
