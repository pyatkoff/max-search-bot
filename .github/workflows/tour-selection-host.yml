name: Deploy dedicated selection host

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved editor-only PR head (empty for normal host reconciliation)
        required: false
      backend_sha:
        description: Exact current main and installed backend SHA
        required: false
      current_package:
        description: Expected currently active editor package ID
        required: false
      operation:
        description: Unique authorized publication operation, never reused after UNKNOWN
        required: false
      pull_request:
        description: Reviewed open same-repository PR with current-head required CI
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  host:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha == '' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Require current authoritative main before loading deployment credentials
        run: bash tools/verify_deploy_main_provenance.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Verify the exact independent public package and safe installation
        run: |
          set -euo pipefail
          python3 modules/tour-selections/build.py build --output "$RUNNER_TEMP/selection-public"
          python3 modules/tour-selections/build.py verify --output "$RUNNER_TEMP/selection-public"
          php modules/tour-selections/tests/test_deploy.php "$RUNNER_TEMP/selection-public/payload"
          python3 modules/tour-selections/build-editor.py build --output "$RUNNER_TEMP/selection-editor"
          python3 modules/tour-selections/build-editor.py verify --output "$RUNNER_TEMP/selection-editor"
          php modules/tour-selections/tests/test_editor_deploy.php "$RUNNER_TEMP/selection-editor"
      - name: Install only the owned tours host and enable links after strict hosted smoke
        env:
          DEPLOY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EDITOR_COMMON_OPERATION: common-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/selection-host-key"
          stage=''
          editor_installed=''
          editor_mode='normal'
          editor_expected=''
          [[ "$EDITOR_COMMON_OPERATION" =~ ^common-[0-9]+-[0-9]+$ ]]
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          if [[ "$DEPLOY_KEY" == *"PRIVATE KEY"* ]]; then
            if [[ "$DEPLOY_KEY" == *'\n'* ]]; then printf '%b\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"; else printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$DEPLOY_KEY" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/selection-host-known-hosts" -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          finish() {
            result=$?
            if [ "$result" -ne 0 ] && [ -n "$editor_installed" ]; then
              if [ "$editor_mode" = 'common' ]; then
                ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php rollback-common '$EDITOR_COMMON_OPERATION'" || true
              else
                ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php rollback" || true
              fi
            fi
            if [ "$result" -ne 0 ] && [ -n "$stage" ]; then
              ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy.php rollback" || true
            fi
            if [ -n "$stage" ]; then ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$stage'" || true; fi
            rm -f "$key_file"
            exit "$result"
          }
          trap finish EXIT
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && git diff --quiet && git diff --cached --quiet"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php common-status" > "$RUNNER_TEMP/editor-host-status.json"
          editor_mode="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok") is True and d.get("mode") in ("normal","common"); print(d["mode"])' "$RUNNER_TEMP/editor-host-status.json")"
          if [ "$editor_mode" = 'common' ]; then
            editor_expected="$(python3 -c 'import json,re,sys; d=json.load(open(sys.argv[1])); p=d.get("expected_current_package",""); assert re.fullmatch("[a-f0-9]{64}",p); print(p)' "$RUNNER_TEMP/editor-host-status.json")"
          fi
          stage="$(ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mktemp -d /tmp/selection-host-XXXXXXXX')"
          [[ "$stage" =~ ^/tmp/selection-host-[A-Za-z0-9]{8}$ ]]
          scp "${opts[@]}" "$RUNNER_TEMP/selection-public/payload/"{view.php,selection.css,activity.js,release.json} "$DEPLOY_USER@$DEPLOY_HOST:$stage/"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy.php install '$stage' '$EXPECTED_SHA'"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy.php activate && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" | tee "$RUNNER_TEMP/selection-host-receipt.json"
          scp -r "${opts[@]}" "$RUNNER_TEMP/selection-editor" "$DEPLOY_USER@$DEPLOY_HOST:$stage/editor"
          if [ "$editor_mode" = 'common' ]; then
            # A failed/lost install has an UNKNOWN result: do not replay it or
            # roll back an unconfirmed operation from this workflow.
            ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php install-common '$stage/editor' '$EXPECTED_SHA' '$editor_expected' '$EDITOR_COMMON_OPERATION'" | tee "$RUNNER_TEMP/editor-common-install.json"
            python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2])); assert a.get("ok") is True and a.get("package_id")==r["package_id"] and a.get("source")==sys.argv[3] and a.get("operation")==sys.argv[4]' "$RUNNER_TEMP/editor-common-install.json" "$RUNNER_TEMP/selection-editor/receipt.json" "$EXPECTED_SHA" "$EDITOR_COMMON_OPERATION"
            editor_installed=1
            ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php activate-common '$EDITOR_COMMON_OPERATION' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" | tee "$RUNNER_TEMP/selection-editor-host-receipt.json"
          else
            ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && python3 modules/tour-selections/build-editor.py verify --output '$stage/editor' && php modules/tour-selections/deploy-editor.php install '$stage/editor' '$EXPECTED_SHA'"
            editor_installed=1
            ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && php modules/tour-selections/deploy-editor.php activate && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" | tee "$RUNNER_TEMP/selection-editor-host-receipt.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: selection-host-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/selection-host-receipt.json
            ${{ runner.temp }}/selection-public/receipt.json
            ${{ runner.temp }}/selection-public/compatibility.json
            ${{ runner.temp }}/selection-editor-host-receipt.json
            ${{ runner.temp }}/selection-editor/receipt.json
            ${{ runner.temp }}/selection-editor/compatibility.json
            ${{ runner.temp }}/editor-host-status.json
          if-no-files-found: error
          retention-days: 14

  independent-editor:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.backend_sha }}
      EDITOR_SOURCE: ${{ inputs.source_sha }}
      CURRENT_PACKAGE: ${{ inputs.current_package }}
      EDITOR_OPERATION: ${{ inputs.operation }}
      EDITOR_PR: ${{ inputs.pull_request }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate explicit immutable publication inputs
        run: |
          python3 - <<'PY'
          import os,re
          for key, pattern in {'EXPECTED_SHA':r'[a-f0-9]{40}', 'EDITOR_SOURCE':r'[a-f0-9]{40}', 'CURRENT_PACKAGE':r'[a-f0-9]{64}', 'EDITOR_OPERATION':r'[A-Za-z0-9][A-Za-z0-9_-]{7,95}', 'EDITOR_PR':r'[1-9][0-9]{0,9}'}.items():
              if not re.fullmatch(pattern,os.environ[key]): raise SystemExit('Invalid publication input: '+key)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact authoritative main before loading publication credentials
        run: bash tools/verify_deploy_main_provenance.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: editor-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Build with trusted backend tools and admit exact source plus required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,os,pathlib
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location('trusted_builder',root/'modules/tour-selections/build-editor.py')
          pack=importlib.util.module_from_spec(spec);spec.loader.exec_module(pack)
          pack.build(root/'editor-candidate',pathlib.Path(os.environ['RUNNER_TEMP'])/'independent-editor')
          PY
          python3 modules/tour-selections/admit-editor.py --backend "$GITHUB_WORKSPACE" --candidate "$GITHUB_WORKSPACE/editor-candidate" --output "$RUNNER_TEMP/independent-editor" --backend-sha "$EXPECTED_SHA" --source-sha "$EDITOR_SOURCE" --current-package "$CURRENT_PACKAGE" --operation "$EDITOR_OPERATION" --pull-request "$EDITOR_PR" > "$RUNNER_TEMP/editor-source-admission.json"
          git -C editor-candidate bundle create "$RUNNER_TEMP/editor-source.bundle" HEAD
      - name: Install admitted component on unchanged backend with operation and package CAS
        env:
          DEPLOY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/independent-editor-key"
          stage=''
          installed=''
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          if [[ "$DEPLOY_KEY" == *"PRIVATE KEY"* ]]; then
            if [[ "$DEPLOY_KEY" == *'\n'* ]]; then printf '%b\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"; else printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"; fi
          else printf '%s' "$DEPLOY_KEY" | base64 --decode | tr -d '\r' > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/independent-editor-known-hosts" -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          finish() {
            result=$?
            if [ "$result" -ne 0 ] && [ -n "$installed" ]; then
              ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php modules/tour-selections/deploy-editor.php rollback-independent '$EDITOR_OPERATION'" || true
            fi
            if [ -n "$stage" ]; then ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$stage'" || true; fi
            rm -f "$key_file"
            exit "$result"
          }
          trap finish EXIT
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && git diff --quiet && git diff --cached --quiet"
          stage="$(ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mktemp -d /tmp/selection-host-XXXXXXXX')"
          [[ "$stage" =~ ^/tmp/selection-host-[A-Za-z0-9]{8}$ ]]
          scp "${opts[@]}" "$RUNNER_TEMP/editor-source.bundle" "$DEPLOY_USER@$DEPLOY_HOST:$stage/source.bundle"
          scp -r "${opts[@]}" "$RUNNER_TEMP/independent-editor" "$DEPLOY_USER@$DEPLOY_HOST:$stage/package"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "git -c core.hooksPath=/dev/null clone --no-checkout '$stage/source.bundle' '$stage/candidate' && git -C '$stage/candidate' -c core.hooksPath=/dev/null checkout --detach '$EDITOR_SOURCE'"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php modules/tour-selections/deploy-editor.php install-independent '$stage/package' '$stage/candidate' '$EXPECTED_SHA' '$EDITOR_SOURCE' '$CURRENT_PACKAGE' '$EDITOR_OPERATION'" | tee "$RUNNER_TEMP/editor-independent-install.json"
          installed=1
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php modules/tour-selections/deploy-editor.php activate-independent '$EDITOR_OPERATION' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'" | tee "$RUNNER_TEMP/editor-independent-active.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-editor-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/editor-source-admission.json
            ${{ runner.temp }}/independent-editor/receipt.json
            ${{ runner.temp }}/independent-editor/compatibility.json
            ${{ runner.temp }}/editor-independent-install.json
            ${{ runner.temp }}/editor-independent-active.json
          if-no-files-found: error
          retention-days: 14
