name: "#1566 Read the original Anantara MAX receipt and exact post"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-anantara-max-receipt.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '87e3683f04141bd43fe4e9bd9e517eaf8a85b716' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SELECT-only program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors', '0');
          ini_set('log_errors', '0');
          $result = ['ok'=>false, 'hotel_id'=>99713, 'provider_writes'=>0, 'db_writes'=>0];
          $stage = 'release';
          try {
              if (PHP_SAPI !== 'cli' || trim((string) shell_exec('git rev-parse HEAD')) !== 'fe623086b716b3077e4ec0d4551095fc63db37e3') {
                  throw new RuntimeException();
              }
              ob_start();
              try {
                  require getcwd() . '/config.php';
                  require_once getcwd() . '/services/ChannelPostEntryService.php';
                  require_once getcwd() . '/services/ChannelPostButtonTransport.php';
              } finally {
                  ob_end_clean();
              }
              $stage = 'read_original_receipt';
              $path = '/var/www/anytoour/data/channel-post-operations/issue1566-main-max-hotel-99713-v1/publication.json';
              if (realpath($path) !== $path || filesize($path) > 65536) {
                  throw new RuntimeException();
              }
              $receipt = json_decode(file_get_contents($path), true, 16, JSON_THROW_ON_ERROR);
              $mid = $receipt['message_id'] ?? '';
              $publicationId = (int) ($receipt['publication_id'] ?? 0);
              if ($receipt['hotel_id'] !== 99713 || !preg_match('/\Amid\.[0-9a-f]{32}\z/D', $mid) || $publicationId <= 0) {
                  throw new RuntimeException();
              }
              $result['message_id'] = $mid;
              $result['publication_id'] = $publicationId;
              $result['original_stage'] = $receipt['state'];
              $stage = 'database_and_native_post';
              $pdo = ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry = new ChannelPostRegistryService($pdo);
              $post = $registry->publication($publicationId);
              if (!$post || $post['external_message_id'] !== $mid || $post['channel_id'] !== '-68765999669267'
                  || !str_contains($post['snapshot']['text'] ?? '', 'Anantara Mina Al Arab Ras Al Khaimah')) {
                  throw new RuntimeException();
              }
              $native = ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.$mid,[],null);
              $message = $native['data'] ?? [];
              $snapshot = ChannelPostIncomingAdapter::maxSnapshot($message);
              if (($native['http'] ?? 0) !== 200 || !is_array($snapshot)
                  || (string) ($message['recipient']['chat_id'] ?? '') !== $post['channel_id'] || ($message['body']['mid'] ?? '') !== $mid
                  || $snapshot['text'] !== $post['snapshot']['text'] || hash('sha256', $snapshot['text']) !== ($receipt['caption_sha256'] ?? '')
                  || !preg_match('~\Ahttps://max[.]ru/anytour/[A-Za-z0-9_-]+\z~D', $snapshot['post_url'])) {
                  throw new RuntimeException();
              }
              $resolved = ChannelPostEntryService::resolve('max', $post['start_payload'], $registry);
              $result['post_url'] = $snapshot['post_url'];
              $result['version_id'] = (int) $post['version_id'];
              $result['config_version'] = (int) $post['channel']['config_version'];
              $result['registry_content_hash'] = $post['content_hash'];
              $result['provider_content_fingerprint'] = ChannelPostIncomingAdapter::contentFingerprint($snapshot);
              $result['state'] = $post['state'];
              $result['reason'] = $post['error_reason'];
              $result['button_writes'] = (int) $post['write_attempts'];
              $result['button_verified'] = ChannelPostIncomingAdapter::containsOnlyButton(
                  $snapshot, ChannelPostButtonTransport::buttonUrl($post), $post['channel']['button_text']
              );
              $result['entry_verified'] = (int) ($resolved['publication_id'] ?? 0) === $publicationId
                  && (int) ($resolved['version_id'] ?? 0) === (int) $post['version_id'];
              $result['photo_count'] = count(array_filter($snapshot['attachments'], static fn ($item) => $item['type'] === 'image'));
              $pdo->rollBack();
              $result['ok'] = true;
          } catch (Throwable) {
              if (isset($pdo) && $pdo->inTransaction()) {
                  $pdo->rollBack();
              }
              $result['error_stage'] = $stage;
          }
          echo json_encode($result, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), PHP_EOL;
          exit($result['ok'] ? 0 : 2);
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Check only existing Anantara message and contextual button
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); assert d["ok"]; print(json.dumps(d))'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-anantara-max-readback
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
