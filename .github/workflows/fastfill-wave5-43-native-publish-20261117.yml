cfcf177386e8f8a921dbc6bf66fd26a0dc9f79c565be81b5"}''')
          BATCHES=json.loads(r'''[{"batch":36,"operation":"commercial-hotel-batch-20261117-36-v1","ids":[74110,113553,115812,121699,140013,143372,15852,2986,4203,4403],"rows":10,"publisher_sha256":"81cca85acec7bd2d68d9dfdef71f1060e17c0964d11097cdbf7c10cf8e33e2d4"},{"batch":37,"operation":"commercial-hotel-batch-20261117-37-v1","ids":[8105,8169,15857,23264,23738,23755,70050,4235,8170,22777],"rows":10,"publisher_sha256":"c0c23483b28c1fe88c4e87775c70181ab3df51d94b3ea996c9db2151d7cf8b80"},{"batch":38,"operation":"commercial-hotel-batch-20261117-38-v1","ids":[22845,8019,13935,47185,49176,49287,55570,53706,23756,40895],"rows":10,"publisher_sha256":"c90433734b7b013dd61cdd1473b66d39082ffd4b4ae7edd1f561f563f397ec72"},{"batch":39,"operation":"commercial-hotel-batch-20261117-39-v1","ids":[43494,52090,66666,68971,74114,79323,79954,80233,110848,111489],"rows":10,"publisher_sha256":"30b9c14e2e0f9b06247f4a8ab22d77d48d24e85194ec349e692d576773b8ca44"},{"batch":40,"operation":"commercial-hotel-batch-20261117-40-v1","ids":[118713,119052,127988],"rows":3,"publisher_sha256":"0a569d30df3c57eded46d5b3a983ff3c5bcdeb6557a5b447084424f011e42653"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          r=api('actions/runs/44145217016');assert r['conclusion']=='success' and r['run_attempt']==1 and r['head_sha']=='0b39116264a72d56d377b90ff64f8ef8ccc8e584'
          old=api('actions/runs/44139041068');assert old['conclusion']=='success' and old['run_attempt']==1 and old['head_sha']==APP
          d=api('contents/deploy_status.json?ref=diagnostics');d=json.loads(base64.b64decode(d['content']))
          rr=d['repository_release'];assert d['sha']==rr['application_sha']==rr['repository_sha']==APP and rr['kind']=='installed'
          assert str(rr['release']['run_id'])=='44139041068' and rr['release']['run_attempt']==1
          assert all(v['result']=='success' for v in rr['stages'].values())
          required={'.github/workflows/deploy.yml','.github/workflows/retired-domain-guard.yml','.github/workflows/max-tls-preflight.yml','.github/workflows/max-production-health.yml','.github/workflows/telegram-production-health.yml','.github/workflows/publish-conversation-diagnostics.yml','.github/workflows/live-session-diagnostics.yml','.github/workflows/tour-selection-host.yml','.github/workflows/modeled-conversion-monitor.yml'}
          gates={g['path']:g for g in rr['closure']['gates']};assert required.issubset(gates)
          for path in required:
              g=gates[path];assert g['conclusion']=='success' and g['head_sha']==APP and g['run_attempt']==1
          a=api('actions/artifacts/14354874542')
          assert not a['expired'] and a['workflow_run']['id']==44145217016 and a['digest']=='sha256:bdaf26dc9f22916a837a702db18403c3b5fe6f0f86fa3c810282ac01e647ee4b'
          raw=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14354874542/zip'],timeout=90)
          assert hashlib.sha256(raw).hexdigest()=='bdaf26dc9f22916a837a702db18403c3b5fe6f0f86fa3c810282ac01e647ee4b'
          p=pathlib.Path('pub');p.mkdir();(p/'source.zip').write_bytes(raw)
          with zipfile.ZipFile(p/'source.zip') as z:
