name: Cutover DB sync readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          STANDBY_DEPLOY_SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$STANDBY_DEPLOY_HOST"
          test -n "$STANDBY_DEPLOY_USER"
          test -n "$STANDBY_DEPLOY_SSH_KEY"

      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Inspect production database export prerequisites
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd ~/www/anytour.online/max-search; command -v mysqldump >/dev/null; /opt/php81/bin/php tools/conversation_db.php check >/dev/null; /opt/php81/bin/php tools/conversation_db.php migration-status >/dev/null; test -w /tmp; echo PROD_DB_SYNC_PREREQUISITES=OK; command -v mysqldump | sed 's#^#PROD_MYSQLDUMP=#'; df -Pk /tmp | tail -1 | awk '{print \"PROD_TMP_FREE_KB=\"\$4}'"

      - name: Inspect standby database import prerequisites
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; command -v mysql >/dev/null; command -v mysqldump >/dev/null; php tools/conversation_db.php check >/dev/null; php tools/conversation_db.php migration-status >/dev/null; php tools/standalone_readiness.php | grep -qx 'STANDALONE_READY=YES'; test -w /tmp; echo STANDBY_DB_SYNC_PREREQUISITES=OK; command -v mysql | sed 's#^#STANDBY_MYSQL=#'; command -v mysqldump | sed 's#^#STANDBY_MYSQLDUMP=#'; df -Pk /tmp | tail -1 | awk '{print \"STANDBY_TMP_FREE_KB=\"\$4}'"

      - name: Confirm read-only policy
        shell: bash
        run: |
          echo "CUTOVER_DB_SYNC_READINESS=YES"
          echo "This workflow only checks binaries, DB connectivity, migration status, standalone readiness and temporary-space availability."
          echo "It does not dump/import databases, freeze traffic, change webhooks, start cron, or mutate application data."
