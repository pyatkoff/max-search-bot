              receipt['operator_verified']=True;verify_source(root);receipt['source_verified']=True
              php="<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');ini_set('log_errors','0');error_reporting(0);\n$level=ob_get_level();ob_start(static fn(string $s):string=>'');\n$ok=false;$posted=false;$intent=false;$ackSaved=false;$readonly=false;$stage='bootstrap';$lock=null;\ntry{\n $root='/var/www/anytoour/data/www/app.anytoour.ru';$expected='__EXPECTED_SHA__';$deadline=microtime(true)+150;\n $source=function()use($root,$expected):void{\n   $p=proc_open(['/usr/bin/git','-C',$root,'rev-parse','HEAD'],[0=>['pipe','r'],1=>['pipe','w'],2=>['pipe','w']],$pipes);\n   if(!is_resource($p))throw new RuntimeException();fclose($pipes[0]);$head=trim((string)stream_get_contents($pipes[1],128));fclose($pipes[1]);fclose($pipes[2]);\n   if(proc_close($p)!==0||$head!==$expected)throw new RuntimeException();\n };\n $source();require $root.'/config.php';require_once $root.'/services/ProjectAccessService.php';\n if(ProjectConfig::projectId()!=='anytour'||(string)METRIKA_COUNTER_ID!=='98615635'||posix_geteuid()!==1012)throw new RuntimeException();\n ProjectAccessService::initializeReadOnly();$pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$readonly=true;\n require_once $root.'/services/ModeledConversionWireValue.php';require_once $root.'/services/ModeledConversionVisitProof.php';\n require_once $root.'/services/ModeledConversionValueExport.php';require_once $root.'/maxsearchclass.php';\n $stage='lock';$dir=dirname(ModeledConversionVisitProof::path());$path=$dir.'/refresh.lock';\n if(is_link($dir)||is_link($path)||(fileperms($dir)&0777)!==0700||(fileperms($path)&0777)!==0600\n   ||fileowner($dir)!==posix_geteuid()||fileowner($path)!==posix_geteuid())throw new RuntimeException();\n $lock=fopen($path,'r+');if($lock===false)throw new RuntimeException();\n $until=microtime(true)+25;$acquired=false;do{$acquired=flock($lock,LOCK_EX|LOCK_NB);if(!$acquired)usleep(100000);}while(!$acquired&&microtime(true)<$until);\n if(!$acquired)throw new RuntimeException();\n $stage='settings';$settings=ModeledConversionValueExport::settings($pdo);\n if(($settings['mode']??null)!=='send'||($settings['goal_id']??null)!=='678187097'||($settings['goal_intent']??null)!=='verified'\n  ||($settings['contract_version']??null)!==ModeledConversionValueContract::VERSION)throw new RuntimeException();\n $api=new MetrikaOfflineClient('98615635',(string)METRIKA_OAUTH_TOKEN,null,$deadline);\n if((string)($api->modeledValueGoalStatus()['id']??'')!=='678187097')throw new RuntimeException();\n $stage='cohort';$cache=ModeledConversionVisitProof::readCache(time());\n if(($cache['available']??false)!==true||($cache['receipt']['followup_checkpoint_at']??null)!=='2026-11-09T17:53:11Z')throw new RuntimeException();\n $cut=(new DateTimeImmutable('2026-11-09T17:53:11Z'))->getTimestamp();\n $from=(new DateTimeImmutable('@'.$cut))->setTimezone(new DateTimeZone('Europe/Kaliningrad'))->setTime(0,0)->getTimestamp();\n $ledger=ModeledConversionVisitProof::ledger($pdo);$keys=[];\n foreach($ledger as$r){\n   if((int)($r['claimed_at_unix']??0)<$from||(int)$r['claimed_at_unix']>$cut\n     ||((int)($r['value_processed_at_unix']??0)>0&&(int)$r['value_processed_at_unix']<=$cut)\n     ||($r['upload_status']??null)!=='LINKAGE_FAILURE')continue;\n   $prior=ModeledConversionVisitProof::prior($r,time());$a=$prior['event']['failure_audit']??null;\n   if(is_array($a)&&($a['wire_collision_rows']??0)>0&&($a['eligible_at_upload']??false)===true\n      &&in_array($a['diagnosis']??null,['wire_collision','wire_value_reported'],true))$keys[ModeledConversionWireValue::key($r)]=true;\n }\n if(!$keys||count($keys)>4)throw new RuntimeException();\n $stage='plans';$plans=[];$eligible=new ReflectionMethod(ModeledConversionValueExport::class,'eligible');$export=new ModeledConversionValueExport($pdo);\n $gate=static fn(string $chat):bool=>MaxSearchApi::metrikaGoalAllowed($chat);\n foreach(array_keys($keys)as$key){\n   $members=[];foreach($ledger as$r)if((string)($r['upload_id']??'')!==''&&ModeledConversionWireValue::key($r)===$key)$members[]=$r;\n   $plan=ModeledConversionWireValue::plan($members,time());$first=$members[0];\n   foreach($members as$r)if(!$eligible->invoke($export,$r,$gate))throw new RuntimeException();\n   $existing=ModeledConversionWireValue::read($first);\n   if($existing!==null){\n     $state=ModeledConversionWireValue::observe($first,$ledger,$api,time());$intent=true;\n     if(!in_array($state,['accepted','processed'],true))throw new RuntimeException();\n     $ackSaved=true;continue;\n   }\n   $sameClient=[];foreach($ledger as$r)if((string)($r['client_id']??'')===$first['client_id']&&(string)($r['upload_id']??'')!=='')$sameClient[]=$r;\n   if(count($sameClient)!==count($members))throw new RuntimeException();\n   foreach($members as$r){\n     $p=$api->poll((string)$r['upload_id']);\n     if(!is_array($p)||($p['comment']??null)!==MetrikaOfflineClient::comment($r)\n       ||!in_array($p['status']??null,['PROCESSED','LINKAGE_FAILURE'],true)\n       ||(int)($p['source_quantity']??0)!==1||(int)($p['line_quantity']??0)!==1)throw new RuntimeException();\n   }\n   $visits=$api->modeledClientVisits($first['client_id'],(int)$first['event_unix'],time());\n   if(($visits['status']??null)!=='ok')throw new RuntimeException();$prior=[];\n   foreach($visits['visits']as$v){$at=strtotime($v['started_at']);if($at!==false&&$at<=(int)$first['event_unix']&&time()-$at<=21*86400)$prior[]=$at;}\n   if(!$prior)throw new RuntimeException();\n   $goals=$api->modeledValueVisits($first['client_id'],(int)$settings['activated_at_unix'],time());\n   if(($goals['status']??null)!=='ok')throw new RuntimeException();\n   $reaches=0;$revenue=0;foreach($goals['visits']as$v){$reaches+=(int)$v['goal_reaches'];$revenue+=(float)$v['revenue_rub'];}\n   if($reaches===1&&abs($revenue-$plan['total_rub'])<0.005)continue; // Already present: no correction POST.\n   $old=0;foreach($members as$r)if(($r['upload_status']??null)==='PROCESSED')$old+=(int)$r['value_rub'];\n   if($reaches!==($old>0?1:0)||abs($revenue-$old)>=0.005||$plan['total_rub']<=$old)throw new RuntimeException();\n   $plans[]=['members'=>$members,'plan'=>$plan,'before_reaches'=>$reaches,'before_rub'=>$revenue];\n }\n $stage='admission';\n foreach($plans as$work){\n   $source();$current=ModeledConversionValueExport::settings($pdo);\n   if(($current['mode']??null)!=='send'||($current['goal_id']??null)!=='678187097')throw new RuntimeException();\n   foreach($work['members']as$r)if(!$eligible->invoke($export,$r,$gate))throw new RuntimeException();\n   $first=$work['members'][0];$plan=$work['plan'];\n   if(ModeledConversionWireValue::read($first)!==null)throw new RuntimeException();\n   $j=['version'=>'modeled_wire_correction_v1','wire_key'=>$plan['wire_key'],'members'=>$plan['members'],\n     'total_rub'=>$plan['total_rub'],'comment'=>$plan['comment'],'state'=>'sending','upload_id'=>null,'upload_status'=>null,\n     'sent_at_unix'=>time(),'checked_at_unix'=>time(),'source_sha'=>$expected,'csv_sha256'=>hash('sha256',$plan['csv']),\n     'before_goal_reaches'=>$work['before_reaches'],'before_goal_rub'=>$work['before_rub']];\n   $stage='sending';ModeledConversionWireValue::save($first,$j);$intent=true;\n   $posted=true;try{$ack=$api->uploadModeledWireCorrection($work['members'],time());}catch(Throwable $e){$ack=['outcome'=>'unknown'];}\n   $stage='receipt';\n   if(($ack['outcome']??null)==='accepted'){\n     $j['upload_id']=(string)$ack['upload_id'];$j['upload_status']=$ack['status'];\n     $j['state']=$ack['status']==='PROCESSED'?'processed':($ack['status']==='LINKAGE_FAILURE'?'failed':'accepted');$ackSaved=true;\n   }else $j['state']=($ack['outcome']??null)==='rejected'?'failed':'unknown';\n   $j['checked_at_unix']=time();ModeledConversionWireValue::save($first,$j);\n   if(!in_array($j['state'],['accepted','processed'],true))throw new RuntimeException();\n }\n $ok=true;$stage='done';\n}catch(Throwable $ignored){}\nfinally{if(is_resource($lock)){flock($lock,LOCK_UN);fclose($lock);}}\nwhile(ob_get_level()>$level)ob_end_clean();\necho json_encode(['ok'=>$ok,'provider_write_requests'=>$posted,'source_writes'=>false,'private_intent_saved'=>$intent,\n'acknowledgement_saved'=>$ackSaved,'database_read_only'=>$readonly,'stage'=>$stage],JSON_THROW_ON_ERROR).\"\\n\";exit($ok?0:1);\n".replace('__EXPECTED_SHA__',CONTRACT['source_commit'])
              command=['/usr/bin/php','-d','auto_prepend_file=','-d','auto_append_file=','-d','opcache.enable_cli=0','-d','display_errors=0','-d','log_errors=0']
