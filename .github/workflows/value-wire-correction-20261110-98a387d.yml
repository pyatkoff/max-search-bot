              assert isinstance(proof,dict) and set(proof)==keys and all(isinstance(v,bool) for k,v in proof.items() if k!='stage') and proof['stage'] in ['not_started','bootstrap','lock','settings','cohort','plans','admission','sending','receipt','done']
              print(json.dumps(proof,separators=(',',':')))
              raise SystemExit(0 if result.returncode==0 and proof['ok'] else 1)
          except Exception:
