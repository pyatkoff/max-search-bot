ыми двориками для уединённого отдыха в Дананге. Рядом песчаный пляж, а спа и оздоровительные программы помогут посвятить отпуск себе.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=7443","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=7443"],"photo_blob_sha":"bbeed510ffbf9186f74fd43d605d017ca12bf4a0"},{"hotel_id":43689,"hotel":"Fusion Resort Cam Ranh","aliases":["Fusion Resort Cam Ranh","FUSION RESORT CAM RANH"],"text":"✈️ Туры в Fusion Resort Cam Ranh\n📍 Камрань, Вьетнам.\n\nКамрань для спокойного отдыха у моря: бассейны, спа, просторные сьюты и виллы. Песчаный пляж рядом, а для семей есть детский бассейн и игровая площадка.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=43689","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=43689"],"photo_blob_sha":"404f2124c7bcb233904dc346c159fa4743b58cf5"},{"hotel_id":54914,"hotel":"The Anam Cam Ranh","aliases":["The Anam Cam Ranh","THE ANAM RESORT"],"text":"✈️ Туры в The Anam Cam Ranh\n📍 Камрань, Вьетнам.\n\nКолониальная атмосфера, зелёные лужайки и песчаный Бай Дай. Три бассейна, рестораны и спа для неспешного отпуска в Камрани; для детей работает клуб.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=54914","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=54914","https://theanam.com/the-anam-cam-ranh/"],"photo_blob_sha":"9397a00f380576c03dd99263443950ef32bbff91"},{"hotel_id":57672,"hotel":"JW Marriott Phu Quoc Emerald Bay Resort & Spa","aliases":["JW Marriott Phu Quoc Emerald Bay Resort & Spa","JW MARRIOTT PHU QUOC EMERALD BAY RESORT & SPA"],"text":"✈️ Туры в JW Marriott Phu Quoc Emerald Bay Resort & Spa\n📍 Фукуок, Вьетнам.\n\nФукуок с необычной архитектурой, яркими интерьерами и песчаным пляжем Кхем. Три бассейна, рестораны и спа превращают отпуск в особое событие, а детям понравится собственный клуб.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=57672","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=57672"],"photo_blob_sha":"a102fb5a37ba3df10bf995245e0666fde549a47a"},{"hotel_id":61583,"hotel":"Dusit Princess Moonrise Beach Resort","aliases":["Dusit Princess Moonrise Beach Resort","DUSIT PRINCESS MOONRISE BEACH RESORT"],"text":"✈️ Туры в Dusit Princess Moonrise Beach Resort\n📍 Фукуок, Вьетнам.\n\nСпокойный Фукуок на песчаном побережье с бассейном и морскими видами. Ресторан, бары и спа для неспешных дней вдвоём; до аэропорта около пяти километров.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=61583","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=61583"],"photo_blob_sha":"c0aa488337fb9c4090e9fe9246493a81a004ed22"},{"hotel_id":14130,"hotel":"InterContinental Danang Sun Peninsula Resort","aliases":["InterContinental Danang Sun Peninsula Resort","INTERCONTINENTAL DANANG SUN PENINSULA RESORT","INTERCONTINENTAL DANANG"],"text":"✈️ Туры в InterContinental Danang Sun Peninsula Resort\n📍 Дананг, Вьетнам.\n\nУединённая бухта полуострова Сон Тра, тропическая зелень и панорамы моря. Песчаный пляж, рестораны и спа для особенного отпуска, а для детей есть клуб и бассейн.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=14130","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=14130"],"photo_blob_sha":"f280e39cbc510eda1ae0fa0d5d9b64262fc39184"},{"hotel_id":46747,"hotel":"Meliá Danang Beach Resort","aliases":["Meliá Danang Beach Resort","MELIA DANANG BEACH RESORT"],"text":"✈️ Туры в Meliá Danang Beach Resort\n📍 Дананг, Вьетнам.\n\nПляж Нон Нуок для долгих прогулок, бассейны и рестораны среди зелени. Для семей есть детский клуб и площадка, а для более уединённого отдыха можно выбрать категорию The Level.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=46747","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=46747"],"photo_blob_sha":"987e3c90618a10376f235d1acb6adfe6ffc075a2"},{"hotel_id":71241,"hotel":"Mövenpick Resort Waverly Phu Quoc","aliases":["Mövenpick Resort Waverly Phu Quoc","MOVENPICK RESORT WAVERLY PHU QUOC"],"text":"✈️ Туры в Mövenpick Resort Waverly Phu Quoc\n📍 Фукуок, Вьетнам.\n\nФукуок у песчаного побережья Онг Ланг с двумя бассейнами и спа. Можно выбрать семейный номер или виллу, а дни у моря дополнить занятиями в детском клубе и отдыхом в саду.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=71241","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=71241"],"photo_blob_sha":"348cfb5077241d978d47e91b804fcec75bda6446"},{"hotel_id":108234,"hotel":"Nha Trang Marriott Resort & Spa Hon Tre Island","aliases":["Nha Trang Marriott Resort & Spa Hon Tre Island","NHA TRANG MARRIOTT RESORT & SPA HON TRE ISLAND","Vinpearl Discovery Rockside Nha Trang"],"text":"✈️ Туры в Nha Trang Marriott Resort & Spa Hon Tre Island\n📍 Нячанг, Вьетнам.\n\nОстров Хон Тре для отдыха вдали от городской суеты: песчаный пляж, бассейны и рестораны среди зелени. Есть номера и просторные виллы для отпуска вдвоём или всей семьёй.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=108234","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=108234","https://www.marriott.com/en-us/hotels/cxrht-nha-trang-marriott-resort-and-spa-hon-tre-island/overview/"],"photo_blob_sha":"9c0255256b04fb4c6e97dd2356e66d16a4b9243f"},{"hotel_id":4919,"hotel":"Furama Resort Danang","aliases":["Furama Resort Danang","FURAMA RESORT"],"text":"✈️ Туры в Furama Resort Danang\n📍 Дананг, Вьетнам.\n\nЗелёный курорт у песчаного пляжа Дананга с двумя бассейнами и ресторанами разных кухонь. Детские клубы и площадка дополняют семейный отпуск, а взрослые могут выбрать спа.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4919","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4919"],"photo_blob_sha":"c60eb3ea7985103a56a6659fc7112a3d951743ce"},{"hotel_id":82212,"hotel":"Mövenpick Resort Phan Thiet","aliases":["Mövenpick Resort Phan Thiet","MOVENPICK RESORT PHAN THIET"],"text":"✈️ Туры в Mövenpick Resort Phan Thiet\n📍 Фантьет, Вьетнам.\n\nОтель-замок с карибскими мотивами в комплексе NovaWorld Phan Thiet. Песчаный пляж, бассейн и рестораны для необычного семейного отпуска; детям пригодятся площадка и собственный бассейн.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=82212","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=82212"],"photo_blob_sha":"a0ee65e4bf9b8f47def29341d154505654ee221c"},{"hotel_id":7449,"hotel":"Hyatt Regency Danang Resort & Spa","aliases":["Hyatt Regency Danang Resort & Spa","HYATT REGENCY DANANG RESORT & SPA"],"text":"✈️ Туры в Hyatt Regency Danang Resort & Spa\n📍 Дананг, Вьетнам.\n\nДананг для семейного отпуска у песчаного пляжа: бассейны, водная горка и детский клуб. Можно выбрать номер, резиденцию с кухней или виллу и совместить пляжные дни с поездкой в Хойан.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=7449","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=7449"],"photo_blob_sha":"a8b87ce013d701865c0ceb8c1ca4a8486a53b053"},{"hotel_id":69260,"hotel":"Radisson Blu Resort Cam Ranh","aliases":["Radisson Blu Resort Cam Ranh","RADISSON BLU RESORT CAM RANH"],"text":"✈️ Туры в Radisson Blu Resort Cam Ranh\n📍 Камрань, Вьетнам.\n\nКамрань для ярких семейных каникул: песчаный пляж, бассейны и аквапарк. Детский клуб, рестораны и спа помогут чередовать развлечения и спокойный отдых у моря.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=69260","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=69260"],"photo_blob_sha":"6a04f3c99a709562b023449cf6d73f901d793b2e"},{"hotel_id":47460,"hotel":"Vinpearl Resort & Spa Ha Long","aliases":["Vinpearl Resort & Spa Ha Long","VINPEARL RESORT & SPA HA LONG"],"text":"✈️ Туры в Vinpearl Resort & Spa Ha Long\n📍 Ханой, Вьетнам.\n\nОтпуск на отдельном острове Реу в бухте Халонг: песчаные пляжи, сады и бассейны. Рестораны, спа и детский клуб позволяют провести несколько неспешных дней с морскими панорамами.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=47460","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=47460"],"photo_blob_sha":"922cd1a51cdd8a73472a24b96f1d5c4bdcbe3e48"},{"hotel_id":64775,"hotel":"Oceanami Villas & Beach Club","aliases":["Oceanami Villas & Beach Club","OCEANAMI VILLAS & BEACH CLUB"],"text":"✈️ Туры в Oceanami Villas & Beach Club\n📍 Вунг Тау, Вьетнам.\n\nВиллы среди зелени у побережья Лонг Хай для отдыха своей компанией или семьёй. Пляж, бассейн, теннис и спа помогут чередовать активные дни и неспешное время у моря.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=64775","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=64775"],"photo_blob_sha":"0bbbdc8a9bc9b4601616b52d3de3a698e9aecc43"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          prior=api('actions/runs/44118440800');assert prior['conclusion']=='success' and prior['run_attempt']==1 and prior['head_sha']=='9391791ef8d0ea4c306d205987c864e3bfca1324'
          screenrun=api('actions/runs/44119142887');assert screenrun['conclusion']=='success' and screenrun['run_attempt']==1 and screenrun['head_sha']=='172354fd8295b0769eda4ad27d3ac99b945a489d'
          artifact=api('actions/artifacts/14344033080');assert not artifact['expired'] and artifact['workflow_run']['id']==44119142887 and artifact['digest']=='sha256:66593774c3236f41ed51afd24e08a40405b432c47afd16c1f0c4df34f62ddf30'
          screenzip=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14344033080/zip'],timeout=90)
          assert hashlib.sha256(screenzip).hexdigest()=='66593774c3236f41ed51afd24e08a40405b432c47afd16c1f0c4df34f62ddf30'
          with zipfile.ZipFile(io.BytesIO(screenzip)) as z:
              assert z.testzip() is None and z.namelist()==['wave3-80-screen.json']
              screenbytes=z.read('wave3-80-screen.json');screen=json.loads(screenbytes)
          assert screen['ok'] and screen['matches']==screen['matched_hotel_ids']==[] and len(screen['inspected_hotel_ids'])==80
          assert screen['sender_calls']==screen['db_writes']==screen['provider_calls']==0 and screen['trusted_component_files']==22
          APP=pathlib.Path('pub/runtime-readonly.txt').read_text().strip();assert APP==EXPECTED_APP
          MAIN=api('git/ref/heads/main')['object']['sha']
          source=pathlib.Path('tools/direct_demand/operations')
          template=(source/'commercial-batch-template-20261102.php').read_text()
          assert hashlib.sha256(template.encode()).hexdigest()=='4c4aaa2e50155a69e8bd8b9f460777026735b0c51c3b2fc253cf0b7556e53ed5'
          assert subprocess.check_output(['git','hash-object',str(source/'prepare-commercial-batch.py')],text=True).strip()=='8df7a35474b138364b6e6c010af4fa484e350ddb'
          pairs=[('f0e04e9b4e0ed6859ced96279cbf0619931596e6','1982ff7368763edf8b7238c3142e3cc28579e991'),('db8181426091a685a79ee55991cde22671f0d9dd','7304af19cc19666f00ca4ead1b04c2bdce719646')]
          protected=re.findall(r'"([^"]+)"=>"([a-f0-9]{40})"',template);assert len(protected)==22
          for commit in set([APP,MAIN]):
              tree=api('git/trees/'+commit+'?recursive=1');assert not tree['truncated']
              actual={e['path']:e['sha'] for e in tree['tree']}
              for path,sha in protected:assert actual[path]==dict(pairs).get(sha,sha),('publisher_surface_drift',commit,path)
          phototree=api('git/trees/'+PHOTO+'?recursive=1');assert not phototree['truncated'];photoblobs={e['path']:e['sha'] for e in phototree['tree']}
          rec=json.loads(pathlib.Path(PREFIX+'cover-receipt.json').read_bytes())
          assert len(rec['rows'])==80 and rec['prepared_count']==73 and rec['held_count']==7 and rec['sender_calls']==rec['feed_writes']==0
          assert len(INPUT)==len(set(r['hotel_id'] for r in INPUT))==72 and 52251 not in [r['hotel_id'] for r in INPUT]
          assert set(r['hotel_id'] for r in INPUT).issubset(set(screen['inspected_hotel_ids']))
          prepare=runpy.run_path(str(source/'prepare-commercial-batch.py'))['prepare']
          out=pathlib.Path('wave3-72-accepted-source');out.mkdir();files={};batches=[]
          for i in range(0,len(INPUT),10):
              batch=19+i//10;items=INPUT[i:i+10]
              manifest={'schema_version':1,'operation':'commercial-hotel-batch-20261117-'+str(batch)+'-v1','state':'PREPARED_NOT_SENT','button_text':'✈️ Узнать стоимость тура','expected_new_full_pairs':len(items),'photo_freeze_commit':PHOTO,'native_id_namespace':'Tourvisor','rows':[]}
              for row in items:
                  hid=row['hotel_id'];receipt=next(x for x in rec['rows'] if x['id']==hid)
                  assert receipt['status']=='prepared_needs_visual_acceptance' and not receipt['send_allowed']
                  name=PREFIX+str(hid)+'.png';b=pathlib.Path(name).read_bytes()
                  assert photoblobs[name]==row['photo_blob_sha']==hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  assert hashlib.sha256(b).hexdigest()==receipt['png_sha256'] and len(receipt['photo_sources'])==3
                  assert len(row['text'].encode('utf-16-le'))//2<=1024 and len(row['text'])>150
                  assert row['text'].startswith('✈️ Туры в '+row['hotel']+'\n📍 ') and 'Подберём тур на ваши даты.' in row['text']
