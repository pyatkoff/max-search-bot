ort","INTERCONTINENTAL PATTAYA RESORT","SHERATON PATTAYA RESORT"],"text":"✈️ Туры в InterContinental Pattaya Resort\n📍 Паттайя, Таиланд.\n\nТропический сад на склоне с панорамой Сиамского залива, три бассейна и спа. Подойдёт для спокойного отдыха с красивыми видами; у моря оборудована пляжная платформа, к воде ведут ступени.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=792","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=792"],"photo_blob_sha":"c0a6682067af2db25bcfb83b7571cb0debd8bde9"},{"hotel_id":2984,"hotel":"Hua Hin Marriott Resort & Spa","aliases":["Hua Hin Marriott Resort & Spa","HUA HIN MARRIOTT RESORT & SPA"],"text":"✈️ Туры в Hua Hin Marriott Resort & Spa\n📍 Хуа Хин, Таиланд.\n\nМоре и городской Хуахин в одном отпуске. Песчаный пляж перед отелем, бассейны для спокойного и семейного отдыха, детские горки и клуб: каждому найдётся любимое место.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=2984","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=2984"],"photo_blob_sha":"048c27ef76c7fcb407456d392047a5ac4d15dce6"},{"hotel_id":4202,"hotel":"Amari Vogue Krabi","aliases":["Amari Vogue Krabi","AMARI VOGUE RESORT"],"text":"✈️ Туры в Amari Vogue Krabi\n📍 Краби, Таиланд.\n\nКамерный отдых у пляжа Туб Каек среди зелени и морских пейзажей Краби. Бассейн, тайская атмосфера, рестораны и спа для неспешных дней вдвоём.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4202","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4202"],"photo_blob_sha":"65cbcb0e0682c9ca3ecd3bfc3b4918e9e4487767"},{"hotel_id":7898,"hotel":"Centara Grand Beach Resort & Villas Hua Hin","aliases":["Centara Grand Beach Resort & Villas Hua Hin","CENTARA GRAND BEACH RESORT & VILLA HUA HIN"],"text":"✈