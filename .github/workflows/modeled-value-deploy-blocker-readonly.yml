name: Diagnose modeled-value deployment blocker read-only
on:
  push:
    branches: [ops/value-hotel-health-readonly-20261103]
    paths: ['.github/workflows/modeled-value-deploy-blocker-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare existing ephemeral server credential
        env:
          READ_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/value_read_key"
          if [[ "$READ_KEY" == *"PRIVATE KEY"* ]]; then
            if [[ "$READ_KEY" == *'\n'* ]]; then printf '%b\n' "$READ_KEY" | tr -d '\r' > "$key_path"; else printf '%s\n' "$READ_KEY" | tr -d '\r' > "$key_path"; fi
          else printf '%s' "$READ_KEY" | base64 --decode | tr -d '\r' > "$key_path"; fi
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
      - name: Read exact installed health and normalized hold flags
        env:
          READ_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          READ_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: e77909a76b9df3fd5694c7a5f88993e83b3f0ed4
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/value_read_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$READ_USER@$READ_HOST" bash -s -- "$EXPECTED_SHA" <<'READ_REMOTE'
          set -eu
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$1"
          php <<'READ_PHP'
          <?php
          ini_set('display_errors','0'); ini_set('log_errors','0'); error_reporting(0);
          $out=['inspection'=>'read_only_no_tick','provider_calls'=>0]; $phase='bootstrap'; $pdo=null;
          try {
              require 'config.php';
              require_once 'services/ProjectAccessService.php';
              require_once 'services/HotelWorkHealth.php';
              require_once 'services/HotelServerRuntimeConfig.php';
              ProjectAccessService::initializeReadOnly();
              $health=HotelWorkHealth::snapshot();
              $out['worker_state']=in_array($health['state']??null,['ok','failed','running','awaiting_connection'],true)?$health['state']:'unknown';
              $out['worker_stage']=in_array($health['stage']??null,['bootstrap','server_cycle','subscription','delivery','complete'],true)?$health['stage']:'unknown';
              $phase='runtime_configuration'; $cfg=HotelServerRuntimeConfig::load(getcwd());
              $out['runtime_configuration']=$cfg===null?'absent':'valid';
              $phase='read_only_database'; $pdo=ConversationDb::connection();
              if($pdo->inTransaction())throw new DomainException('database_transaction_active');
              $pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
              $q=$pdo->query("SELECT campaign_id,bootstrap_sha256,state,reserved_calls,reserved_tokens,reserved_micros,CASE WHEN JSON_VALID(plan_bytes) THEN JSON_EXTRACT(plan_bytes,'$.limits') ELSE NULL END AS limits_json FROM hotel_server_campaigns WHERE enabled=1 LIMIT 2");
              $rows=$q->fetchAll(PDO::FETCH_ASSOC);$q->closeCursor();
              $out['single_enabled_campaign']=count($rows)===1;
              if(count($rows)===1){
                  $r=$rows[0];
                  try{require_once 'services/HotelServerCycle.php';$view=(new HotelServerCycle($pdo,new HotelServerLane($pdo)))->status($r['campaign_id']);$out['campaign_projection_readable']=($view['state']??null)===$r['state'];}catch(Throwable $ignoredProjection){$out['campaign_projection_readable']=false;}
                  $limits=is_string($r['limits_json'])?json_decode($r['limits_json'],true):null;
                  $out['campaign_state']=in_array($r['state'],['ready','unknown','reviewed','hold','complete','disabled','author_done'],true)?$r['state']:'other';
                  $out['runtime_pin_matches']=$cfg===null?null:($cfg['campaign_id']===$r['campaign_id']&&$cfg['bootstrap_sha256']===$r['bootstrap_sha256']);
                  $out['deadline_reached']=is_int($limits['deadline']??null)?time()>=$limits['deadline']:null;
                  $out['next_call_over_limit']=is_int($limits['max_calls']??null)?(int)$r['reserved_calls']+1>$limits['max_calls']:null;
                  $out['next_tokens_over_limit']=is_int($limits['tokens_per_call']??null)&&is_int($limits['max_tokens']??null)?(int)$r['reserved_tokens']+$limits['tokens_per_call']>$limits['max_tokens']:null;
                  $out['next_cost_over_limit']=is_int($limits['micros_per_call']??null)&&is_int($limits['max_micros']??null)?(int)$r['reserved_micros']+$limits['micros_per_call']>$limits['max_micros']:null;
              }
              $pdo->rollBack();$out['ok']=true;
          }catch(Throwable $error){
              if($pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();
              $out['ok']=false;$out['phase']=$phase;
              $allowed=['hotel_runtime_application_required','hotel_runtime_private_file_required','hotel_runtime_configuration_changed','hotel_runtime_configuration_invalid','database_transaction_active'];
              $out['reason']=in_array($error->getMessage(),$allowed,true)?$error->getMessage():'inspection_unavailable';
              $out['error_class']=$error instanceof PDOException?'PDOException':($error instanceof DomainException?'DomainException':'other');
          }
          echo json_encode($out,JSON_UNESCAPED_SLASHES).PHP_EOL;
          READ_PHP
          READ_REMOTE
      - name: Remove ephemeral server credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/value_read_key"
