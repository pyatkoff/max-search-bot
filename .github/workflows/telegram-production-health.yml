name: Inspect production Telegram webhook
run-name: "${{ github.event_name == 'workflow_run' && format('deploy-proof:v1:{0}:{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || 'Inspect production Telegram webhook' }}"

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact production source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          upstream_run_id=none
          upstream_run_attempt=none
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              metadata="$(jq -er '
                if .action == "completed"
                  and .workflow_run.name == "Deploy production"
                  and .workflow_run.status == "completed"
                  and .workflow_run.conclusion == "success"
                  and .workflow_run.head_repository.full_name == "pyatkoff/max-search-bot"
                  and .workflow_run.head_branch == "main"
                  and (.workflow_run.event == "push" or .workflow_run.event == "workflow_dispatch")
                  and (.workflow_run.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (.workflow_run.id | type == "number" and . >= 1 and . == floor)
                  and (.workflow_run.run_attempt | type == "number" and . >= 1 and . == floor)
                then [.workflow_run.head_sha, .workflow_run.id, .workflow_run.run_attempt] | @tsv
                else error("untrusted_production_deploy_event") end
              ' "$GITHUB_EVENT_PATH")"
              IFS=$'\t' read -r target_sha upstream_run_id upstream_run_attempt <<< "$metadata"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = 'refs/heads/main'
              target_sha="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported production gate event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\nupstream_run_id=%s\nupstream_run_attempt=%s\n' "$target_sha" "$upstream_run_id" "$upstream_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'Selected production source: event=%s upstream_run_id=%s upstream_run_attempt=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$upstream_run_id" "$upstream_run_attempt" "$target_sha"

      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Verify exact source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Resolve accepted repository and application
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment_release.js resolve-consumer >> "$GITHUB_OUTPUT"

      - name: Prepare SSH private key
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "STANDBY_DEPLOY_SSH_KEY is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Wait for exact active-server SHA
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.release.outputs.application_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          for attempt in $(seq 1 30); do
            deployed_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" 'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Active server SHA verified: $deployed_sha"
              exit 0
            fi
            echo "Waiting for active-server SHA $EXPECTED_SHA (current: ${deployed_sha:-unavailable}, attempt $attempt/30)"
            sleep 5
          done
          echo "Active server did not reach expected SHA" >&2
          exit 1

      - name: Inspect Telegram webhook and exercise real controller smoke
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          health_file="$RUNNER_TEMP/telegram-active-health.json"
          smoke_file="$RUNNER_TEMP/telegram-start-smoke.txt"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/telegram_webhook_status.php' > "$health_file"
          cat "$health_file"
          grep -Fq '"url": "https://app.anytoour.ru/telegram_webhook.php"' "$health_file"
          grep -Fq '"pending_update_count": 0' "$health_file"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/telegram_start_smoke.php' > "$smoke_file"
          cat "$smoke_file"
          grep -Fq 'TELEGRAM START SMOKE: OK' "$smoke_file"

      - name: Inspect dedicated archive status and protected entry points without writes
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/telegram_archive_bot_status.php'
          response="$RUNNER_TEMP/telegram-archive-anonymous.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' 'https://app.anytoour.ru/manager/telegram-archive-api.php')"
          test "$status" = '401'
          php -r '$j=json_decode(file_get_contents($argv[1]),true);exit(($j["ok"]??true)===false&&($j["error"]??"")==="unauthorized"?0:1);' "$response"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' 'https://app.anytoour.ru/telegram_archive_webhook.php')"
          test "$status" = '405'
          echo 'TELEGRAM ARCHIVE PROTECTED ENTRY POINTS: OK'
