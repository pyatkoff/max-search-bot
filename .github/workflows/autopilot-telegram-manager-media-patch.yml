name: Temporary Telegram manager media patch

on:
  push:
    branches:
      - autopilot/telegram-manager-media

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tg-manager-media-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/telegram-manager-media
          fetch-depth: 0
      - name: Patch manager media channel support and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('services/ManagerOutboundService.php')
          s=p.read_text()
          old="""        $channel=strtolower((string)$c['channel']);
        if($channel!=='max'){
            self::$lastFailure=['category'=>'unsupported','http_code'=>0,'message'=>'Медиа сейчас поддерживается только для MAX','channel'=>$channel,'project_key'=>(string)$c['project_key']];
            return false;
        }
        $suspended=self::unresolvedSuspendedFailure($conversationId,(string)$c['project_key']);
        if($suspended){self::$lastFailure=$suspended;return false;}
        $type=self::attachmentTypeForMime($mimeType);
        $adapter=new MaxMessengerAdapter(null,null,'manager');
        $safeCaption=trim($caption)!==''?htmlspecialchars(trim($caption),ENT_QUOTES|ENT_SUBSTITUTE,'UTF-8'):'';
        $ok=$adapter->sendMedia($c['external_chat_id'],$type,$filePath,$fileName,$mimeType,$safeCaption,$previewUrl);
        if($ok){
            ConversationControlService::event($conversationId,'manager_message','manager',$managerId,['channel'=>'max','project_key'=>(string)$c['project_key'],'media_type'=>$type]);
            MetrikaConversionGoalService::managerReply($conversationId);
            return true;
        }
        return self::recordFailure($conversationId,$managerId,'max',(string)$c['project_key'],['media_type'=>$type]);
"""
          new="""        $channel=strtolower((string)$c['channel']);
        if(!in_array($channel,['max','telegram'],true)){
            self::$lastFailure=['category'=>'unsupported','http_code'=>0,'message'=>'Медиа для этого канала пока не поддерживается','channel'=>$channel,'project_key'=>(string)$c['project_key']];
            return false;
        }
        if($channel==='max'){
            $suspended=self::unresolvedSuspendedFailure($conversationId,(string)$c['project_key']);
            if($suspended){self::$lastFailure=$suspended;return false;}
        }
        $type=self::attachmentTypeForMime($mimeType);
        $adapter=$channel==='max'?new MaxMessengerAdapter(null,null,'manager'):new TelegramMessengerAdapter(null,'manager');
        $safeCaption=trim($caption)!==''?htmlspecialchars(trim($caption),ENT_QUOTES|ENT_SUBSTITUTE,'UTF-8'):'';
        $ok=$adapter->sendMedia($c['external_chat_id'],$type,$filePath,$fileName,$mimeType,$safeCaption,$previewUrl);
        if($ok){
            ConversationControlService::event($conversationId,'manager_message','manager',$managerId,['channel'=>$channel,'project_key'=>(string)$c['project_key'],'media_type'=>$type]);
            MetrikaConversionGoalService::managerReply($conversationId);
            return true;
        }
        return self::recordFailure($conversationId,$managerId,$channel,(string)$c['project_key'],['media_type'=>$type]);
"""
          if s.count(old)!=1: raise SystemExit(f'outbound block count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/run_manager_media_regression.php')
          x=t.read_text()
          x=x.replace("$maxAdapterSource = (string)file_get_contents(__DIR__ . '/../integrations/MaxMessengerAdapter.php');", "$maxAdapterSource = (string)file_get_contents(__DIR__ . '/../integrations/MaxMessengerAdapter.php');\n$telegramAdapterSource = (string)file_get_contents(__DIR__ . '/../integrations/TelegramMessengerAdapter.php');")
          oldcheck="mediaCheck('outbound media is restricted to owned MAX conversation', strpos($outboundSource, '$channel!==\\'max\\'') !== false && strpos($outboundSource, '(int)$c[\\'manager_id\\']!==$managerId') !== false, true);"
          newchecks="""mediaCheck('outbound media is restricted to owned supported conversation', strpos($outboundSource, "in_array($channel,['max','telegram'],true)") !== false && strpos($outboundSource, '(int)$c[\\'manager_id\\']!==$managerId') !== false, true);
mediaCheck('manager outbound media selects MAX or Telegram adapter', strpos($outboundSource, "$channel==='max'?new MaxMessengerAdapter") !== false && strpos($outboundSource, "new TelegramMessengerAdapter(null,'manager')") !== false, true);
mediaCheck('Telegram media maps normalized types to Bot API methods', strpos($telegramAdapterSource, "'image'=>'sendPhoto'") !== false && strpos($telegramAdapterSource, "'video'=>'sendVideo'") !== false && strpos($telegramAdapterSource, "'audio'=>'sendAudio'") !== false && strpos($telegramAdapterSource, "'file'=>'sendDocument'") !== false, true);
mediaCheck('Telegram media uses multipart CURLFile upload', strpos($telegramAdapterSource, 'new CURLFile(') !== false && strpos($telegramAdapterSource, 'CURLOPT_POSTFIELDS, $multipart ? $payload') !== false, true);
mediaCheck('Telegram outbound history stores attachment preview metadata', strpos($telegramAdapterSource, "ConversationRecorder::outbound('telegram'") !== false && strpos($telegramAdapterSource, "['attachments'=>[$attachment]]") !== false && strpos($telegramAdapterSource, "$attachment['url']=trim($previewUrl)") !== false, true);"""
          if oldcheck not in x: raise SystemExit('old media ownership assertion not found')
          x=x.replace(oldcheck,newchecks,1)
          t.write_text(x)
          Path('.github/workflows/autopilot-telegram-manager-media-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/ManagerOutboundService.php tests/run_manager_media_regression.php .github/workflows/autopilot-telegram-manager-media-patch.yml
          git commit -m "Enable manager media replies in Telegram [tg-manager-media-patched]"
          git push origin HEAD:autopilot/telegram-manager-media
