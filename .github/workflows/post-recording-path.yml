name: Read one post-recording ordinary path
on:
  push:
    branches: [audit/post-recording-path-20261027]
    paths: [.github/workflows/post-recording-path.yml]
permissions:
  contents: read
concurrency:
  group: anytour-post-recording-path-20261027
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = 5b85bf8c19f773a55e678e072af99d292ec25fb7
      - name: Prepare existing identity and strict canonical pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$K" == *"PRIVATE KEY"* ]]; then printf '%b\n' "$K" | tr -d '\r' > "$RUNNER_TEMP/membership-key"; else printf '%s' "$K" | base64 --decode > "$RUNNER_TEMP/membership-key"; fi
          chmod 600 "$RUNNER_TEMP/membership-key"
          ssh-keygen -y -f "$RUNNER_TEMP/membership-key" >/dev/null
          python3 - "$TARGET" "$RUNNER_TEMP/membership-hosts" <<'PY'
          import base64,hashlib,socket,subprocess,sys
          host,dest=sys.argv[1:]
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:raise SystemExit('canonical_target_changed')
          pinned=[]
          for _ in range(2):
              scan=subprocess.run(['ssh-keyscan','-t','ed25519','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0].startswith('#'):continue
                  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError:continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0' and line not in pinned:pinned.append(line)
              if pinned:break
          if not pinned:raise SystemExit('canonical_host_pin_not_seen')
          open(dest,'w').write('\n'.join(pinned)+'\n')
          PY
      - name: One read-only metadata snapshot
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/membership-read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
           chdir('/var/www/anytoour/data/www/app.anytoour.ru');
           $pins=json_decode('{"cron_metrika.php":"9dd5b8577ba41e50a4d4268ea2fef113eeb6ab2e0d111e0c62846c374bacfaff","services/ConversationRecordClock.php":"877cb2c608e1fd315b84adef894f22c41d3be8446c6fd17725495245e7a1df30","services/ConversationRecorder.php":"16988fd17e2225bc6dd632327a9bff8e41eaee18b17b2e1b95900eda200535ad","services/ConversationControlService.php":"6bc60b0b70495c802a7c0c2a458a14e4453fd7937dae11790f5d7d03ac6b6c9c","services/MaxChannelConversionOutbox.php":"c07a622ade56dab76f16da0d0980c7c7f00346cfb1ac4f0157707331d6d56fc7","services/MaxChannelConversionWorker.php":"c4df6e7d78bc68c8f7b831bb888f7af82b9935f7da7ed0ef91f21342072b4c25","services/MaxMembershipReceiptJournal.php":"ca4f351b583563dd1946a46a84cc9e5b08424b9646800babfb72443588c28cd1","services/ModeledConversionStream.php":"feb879fdde35e358f06b9e19538653351ce21287ee5af53921d70f64a0cd5350","tools/profile_conversion_journal.py":"466ad5af6848502436cb3369e39653e9db3b73455021e768c5c2ab30125d3179"}',true,16,JSON_THROW_ON_ERROR);
           foreach($pins as$file=>$hash)if(!hash_equals($hash,hash_file('sha256',$file)))throw new RuntimeException('source_pin');
           require_once 'config.php';require_once 'services/ProjectAccessService.php';require_once 'services/ConversationDb.php';
           if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('project');
           ProjectAccessService::initializeReadOnly();$p=ConversationDb::connection();
           $p->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();
           $after=strtotime('2026-10-27T11:13:37Z');
           $settings=$p->query("SELECT mode,goal_set,membership_receipts_activated_at_unix AS membership_activation FROM max_channel_attribution_settings WHERE project_key='anytour' AND counter_id='98615635'")->fetch(PDO::FETCH_ASSOC);
           $activation=(int)$settings['membership_activation'];
           $states=array_fill_keys(['pending','ready','uploading','accepted','processed','unknown','unmatched','failed','expired','retired'],0);
           $q=$p->prepare("SELECT state,COUNT(*) AS n FROM max_channel_conversion_outbox WHERE project_key='anytour' AND counter_id='98615635' AND platform='max' AND event_unix>=? GROUP BY state LIMIT 11");$q->execute([$activation]);foreach($q->fetchAll(PDO::FETCH_ASSOC)as$r){if(!array_key_exists($r['state'],$states))throw new RuntimeException('state');$states[$r['state']]=(int)$r['n'];}
           $processor=[];foreach(['stream','profiles']as$kind){$table=$kind==='stream'?'modeled_conversion_stream_state':'modeled_conversion_profiles_state';$r=$p->query("SELECT enabled,ticks,last_receipt_json FROM $table WHERE project_key='anytour'")->fetch(PDO::FETCH_ASSOC);$j=json_decode($r['last_receipt_json']??'{}',true,32);
           $v=['enabled'=>(bool)($r['enabled']??false),'ticks'=>(int)($r['ticks']??0)];foreach(['observed_at_unix','new_revisions','native_rows_read','processed_revisions','profiles_written','pending_revisions','journal_rows_read','payload_bytes']as$k)if(isset($j[$k])&&is_int($j[$k])&&$j[$k]>=0)$v[$k]=$j[$k];$v['limit_reached']=($j['limit_reached']??null);$processor[$kind]=$v;}
           $q=$p->prepare("SELECT source_kind,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_timestamp_basis')) AS basis,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.event_type')) AS event_type FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND observed_at_unix>=? ORDER BY id DESC LIMIT 51");$q->execute([$after]);$rows=$q->fetchAll(PDO::FETCH_ASSOC);$limited=count($rows)>50;$rows=array_slice($rows,0,50);
           $window=['after_unix'=>$after,'rows'=>count($rows),'limited'=>$limited,'canonical_recording_unix_rows'=>0,'subscription_rows'=>0,'retention_rows'=>0];
           foreach($rows as$r){if($r['basis']==='canonical_recording_unix_v1')$window['canonical_recording_unix_rows']++;if($r['source_kind']==='event'&&$r['event_type']==='channel_subscription_observed')$window['subscription_rows']++;if($r['source_kind']==='event'&&$r['event_type']==='channel_retention_30m_observed')$window['retention_rows']++;}
           $q=$p->prepare("SELECT JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.early_signals.subscription.state')) AS subscription,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.early_signals.retention_30m.state')) AS retention FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND observed_at_unix>=? ORDER BY id DESC LIMIT 3");$q->execute([$after]);$rows=$q->fetchAll(PDO::FETCH_ASSOC);
           $profiles=['rows'=>count($rows),'subscription_known'=>0,'retention_known'=>0,'unknown_or_unavailable'=>0];foreach($rows as$r){$known=0;if($r['subscription']==='subscribed'){$profiles['subscription_known']++;$known++;}if(in_array($r['retention'],['retained','not_retained'],true)){$profiles['retention_known']++;$known++;}if($known<2)$profiles['unknown_or_unavailable']++;}
           $p->rollBack();
           $scheduler=['available'=>false];$f=@fopen('metrika_upload.log','rb');
           if($f){$before=fstat($f);$offset=max(0,$before['size']-65536);fseek($f,$offset);$raw=stream_get_contents($f,65536);$end=fstat($f);fclose($f);$stable=true;foreach(['dev','ino','size','mtime','ctime']as$k)if($before[$k]!==$end[$k])$stable=false;
           if($stable){$lines=explode("\n",$raw);if($offset>0)array_shift($lines);array_pop($lines);$lines=array_slice($lines,-512);
           foreach(array_reverse($lines)as$line){if(!preg_match('/^([0-9-]{10} [0-9:]{8}) MAX_CHANNEL (.+)$/D',$line,$m))continue;$j=json_decode($m[2],true,16);
           if(!is_array($j)||!in_array($j['mode']??null,['off','collect','send'],true)){$scheduler=['available'=>true,'outcome'=>'background_failed','wallclock'=>$m[1]];break;}
           $scheduler=['available'=>true,'outcome'=>'ordinary_result','wallclock'=>$m[1],'php_timezone'=>date_default_timezone_get(),'clock_basis'=>'current_PHP_writer_timezone_not_historical_proof','mode'=>$j['mode'],'log_mtime_unix'=>$end['mtime'],'collected'=>is_int($j['collected']??null)?$j['collected']:null,'errors'=>is_int($j['errors']??null)?$j['errors']:null,'collection_error'=>isset($j['collection_error'])?'source_capture_failed':null,'membership'=>[]];
           foreach(['inserted','unchanged','conflicts','errors']as$k){$v=$j['membership'][$k]??null;$scheduler['membership'][$k]=is_int($v)&&$v>=0?$v:null;}break;
           }}else{$scheduler=['available'=>false,'reason'=>'log_changed'];}}
           $out=['purpose'=>'post_recording_clock_ordinary_path','sampled_at'=>gmdate('Y-m-d\TH:i:s\Z'),'runtime_pins'=>count($pins),'settings'=>$settings,'postactivation_MAX_queue_states'=>$states,'processors'=>$processor,'admitted_journal_window'=>$window,'postcutoff_profile_ROWS'=>$profiles,'ordinary_scheduler'=>$scheduler,'native_source_reads'=>0,'texts_values_ids_returned'=>0,'database_writes'=>0,'manual_ticks'=>0,'API_POST_model_provider_customer_calls'=>0];
           $json=json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);if(strlen($json)>65536)throw new RuntimeException('output');echo $json,"\n";
          }catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();fwrite(STDERR,"post_recording_path_failed\n");exit(1);}
          PHP
          php -l "$RUNNER_TEMP/membership-read.php"
          ssh -i "$RUNNER_TEMP/membership-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/membership-hosts" -o ConnectTimeout=10 "$USER@$TARGET" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = 5b85bf8c19f773a55e678e072af99d292ec25fb7; php -d display_errors=0 -d log_errors=0; test "$(git rev-parse HEAD)" = 5b85bf8c19f773a55e678e072af99d292ec25fb7' < "$RUNNER_TEMP/membership-read.php" > "$RUNNER_TEMP/membership-metadata.json"
          python3 - "$RUNNER_TEMP/membership-metadata.json" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(raw)<=65536
          obj=json.loads(raw)
          assert obj['native_source_reads']==obj['texts_values_ids_returned']==obj['database_writes']==obj['manual_ticks']==obj['API_POST_model_provider_customer_calls']==0
          print(json.dumps(obj,ensure_ascii=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post-recording-path-${{ github.run_id }}
          path: ${{ runner.temp }}/membership-metadata.json
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/membership-key" "$RUNNER_TEMP/membership-hosts" "$RUNNER_TEMP/membership-read.php" "$RUNNER_TEMP/membership-metadata.json"
