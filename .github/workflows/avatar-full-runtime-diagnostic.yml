name: Isolated full-avatar acceptance diagnostic
on:
  push:
    branches: [diagnostic/max-full-avatar-runtime-20261015]
    paths: ['.github/workflows/avatar-full-runtime-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: isolated-owner-full-avatar-acceptance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify authoritative main before credentials
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/pyatkoff/max-search-bot.git refs/heads/main | cut -f1)" = '84425f3f78b7b10ea1c404be83d677ac278ee1bb'
      - name: Prepare existing deployment SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Invalid deployment SSH key'; exit 2; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: One bounded fixed-owner adapter check with redacted output
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = '84425f3f78b7b10ea1c404be83d677ac278ee1bb'
          git diff --quiet
          git diff --cached --quiet
          php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          $result=['diagnostic'=>'fixed-owner-full-avatar','ok'=>false];
          try {
              $root='/var/www/anytoour/data/www/app.anytoour.ru';
              require_once $root.'/config.php';
              require_once $root.'/services/ConversationDb.php';
              require_once $root.'/integrations/MaxPrivateAvatarProbe.php';
              require_once $root.'/integrations/MaxCustomerAvatarAdapter.php';
              $db=ConversationDb::connection();
              $target=(new ReflectionMethod(MaxPrivateAvatarProbe::class,'target'))->invoke(new MaxPrivateAvatarProbe($db));
              if (!is_array($target) || (string)$target['id']!=='2' || $target['project_key']!=='anytour' || $target['channel']!=='max' || $target['original_display_name']!=='Pavel') throw new RuntimeException('fixed_target_unavailable');
              $channel=$db->query("SELECT customer_channel_id FROM conversations WHERE id=2 AND project_key='anytour' AND channel='max' LIMIT 1")->fetchColumn();
              $key=hash('sha256',json_encode(['full-v1','max-private-v1','anytour','max',(string)$target['external_user_id'],2,(int)$channel,0],JSON_THROW_ON_ERROR));
              $path=sys_get_temp_dir().'/max-search-bot-manager-avatars-'.substr(hash('sha256',$root),0,16).'/full-'.(hexdec(substr($key,0,4))%32).'.json';
              $cached=is_file($path)&&!is_link($path)&&filesize($path)<1500000?json_decode((string)file_get_contents($path),true):null;
              $result['cache']=['matching'=>is_array($cached)&&($cached['key']??'')===$key,'positive'=>isset($cached['bytes']),'fresh'=>($cached['expires']??0)>time()];
              $receipts=[];
              $exchange=new ReflectionMethod(MaxCustomerAvatarAdapter::class,'exchange');
              $resolver=new ReflectionMethod(MaxCustomerAvatarAdapter::class,'resolve');
              $adapter=new MaxCustomerAvatarAdapter(
                  static function(string $url,array $options) use(&$receipts,$exchange):array {
                      $kind=isset($options[CURLOPT_RESOLVE])?'image':(str_contains($url,'/chats/')?'chat':'message');
                      $body='';$original=$options[CURLOPT_WRITEFUNCTION];
                      $options[CURLOPT_WRITEFUNCTION]=static function($handle,string $chunk) use(&$body,$original,$kind):int {if ($kind==='chat'&&strlen($body)+strlen($chunk)<=65536) $body.=$chunk;return $original($handle,$chunk);};
                      $started=microtime(true);$receipt=$exchange->invoke(null,$url,$options);
                      $summary=['kind'=>$kind,'http_status'=>$receipt['http_status']??0,'ssl_verify'=>$receipt['ssl_verify_result']??-1,'transport_error'=>$receipt['transport_error']??true,'milliseconds'=>(int)((microtime(true)-$started)*1000)];
                      if ($kind==='chat') {$data=json_decode($body,true);$full=$data['dialog_with_user']['full_avatar_url']??null;$parts=is_string($full)?parse_url($full):false;$summary+=['full_present'=>is_string($full)&&$full!=='','full_allowed'=>MaxCustomerAvatarAdapter::imageUrl($full),'full_https'=>is_array($parts)&&($parts['scheme']??'')==='https','full_expected_host'=>is_array($parts)&&($parts['host']??'')==='i.oneme.ru'];}
                      $receipts[]=$summary;return $receipt;
                  },
                  static function(string $host,int $budget) use($resolver,&$receipts):array {$ips=$resolver->invoke(null,$host,$budget);$receipts[]=['kind'=>'dns','count'=>count($ips)];return $ips;}
              );
              $bytes=$adapter->photo((string)$target['external_user_id'],(string)$target['external_message_id'],1048576,true);
              $info=is_string($bytes)?@getimagesizefromstring($bytes):false;
              $result+=['receipts'=>$receipts,'downloaded'=>is_string($bytes),'bytes'=>is_string($bytes)?strlen($bytes):0,'width'=>$info[0]??0,'height'=>$info[1]??0,'mime'=>$info['mime']??null];
              $result['ok']=is_string($bytes)&&$info!==false;
          } catch(Throwable $e) {$result['reason']='diagnostic_unavailable';}
          echo json_encode($result,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES)."\n";
          PHP
          REMOTE
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
