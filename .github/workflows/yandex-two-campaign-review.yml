name: Read two Yandex campaign click totals
on:
  push:
    branches: [audit/direct-minus-review-20260928]
    paths: [.github/workflows/yandex-two-campaign-review.yml, audit/yandex-clicks-readonly.py]
permissions:
  contents: read
concurrency:
  group: yandex-two-campaign-clicks-readonly
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read aggregate on established server
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/read_key"
          raw="$SSH_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key"; else printf '%s\n' "$raw" | tr -d '\r' > "$key"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key"
          fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          timeout 120s ssh "${opts[@]}" "$SSH_USER@$SSH_HOST" 'cd /var/www/anytoour/data/www/d.anytoour.ru && .venv/bin/python -I -B -' < audit/yandex-clicks-readonly.py > yandex-clicks.json
          python3 - <<'PY'
          import json
          j=json.load(open('yandex-clicks.json'))
          assert j.get('ok') is True
          assert set(j.get('campaigns',{}))=={'714260445','714320748'}
          assert j.get('server_writes') is False and j.get('advertising_writes') is False and j.get('token_exported') is False
          PY
          cat yandex-clicks.json
      - name: Retain aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yandex-clicks-funnel-readonly
          path: yandex-clicks.json
          retention-days: 3
          if-no-files-found: error
