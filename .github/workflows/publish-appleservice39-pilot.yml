name: Inspect exact AppleService39 native image
run-name: Read one AppleService39 native image format
on:
  push:
    branches: [content/appleservice39-native-image-read-20261114]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: appleservice39-content
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql,gd
          coverage: none
      - name: Validate exact content source and completed application checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/content/appleservice39-native-image-read-20261114
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = e5c93a27aa46f197a3d2e02e7a536ed5de8cd672
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_restore_model_images.php)"
          php -l tools/appleservice39_restore_model_images.php
          php tools/appleservice39_restore_model_images.php --self-test
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const event=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            d.requireValue(event.created===true&&event.deleted===false&&event.forced===false&&event.before==='0'.repeat(40)&&event.after===process.env.GITHUB_SHA,'untrusted_content_creation');
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='e5c93a27aa46f197a3d2e02e7a536ed5de8cd672','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='content/appleservice39-native-image-read-20261114'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_content_run');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha==='e5c93a27aa46f197a3d2e02e7a536ed5de8cd672'&&receipt.run_id==='43587651928'&&receipt.install_attempt===1,'actual_application_changed');
            const proof=await d.deploymentProof(api,receipt);
            d.requireValue(proof.run.id===Number('43587651928')&&proof.attempt===1&&proof.run.conclusion==='success','actual_installation_checks_unconfirmed');
            const {release:r}=d.validateRelease(location.record);
            d.requireValue(r.kind==='installed'&&r.application_sha==='e5c93a27aa46f197a3d2e02e7a536ed5de8cd672'&&r.repository_sha==='e5c93a27aa46f197a3d2e02e7a536ed5de8cd672'&&r.closure.binding.comment_id===6775467253&&r.closure.binding.pr===1531&&r.closure.binding.head_sha==='35f11dff3fde5b928a2d62c2c68fb986ad26625d','wrong_content_installation_binding');
            await d.authenticatePublication(api,location,{closed:true});
            const owner=await api('GET',base+'/issues/comments/6775467253');
            d.requireValue(owner.user.id===226193297&&owner.body==='PR1531: установлено, выпуск свободен','technical_release_not_closed');
            await d.requireOps(api,receipt.sha);
            console.log(JSON.stringify({ok:true,scope:'approved_images_only_37_existing_posts',actual_application_sha:receipt.sha,installation_run:receipt.run_id,actual_checks:'success',app_release_or_slot_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Read one native image and preserve every original row
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_restore_model_images_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          result=0
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin --inspect-native-image' < tools/appleservice39_restore_model_images.php > "$RUNNER_TEMP/appleservice39-media-result.jsonl" || result=$?
          python3 - "$RUNNER_TEMP/appleservice39-media-result.jsonl" <<'PYREPORT'
          import json,sys
          def summary(value):
              if isinstance(value,dict):
                  return {k:summary(v) for k,v in value.items() if 'base64' not in k.lower() and k.lower() not in ('bytes','data','native_bytes','token','upload_token','signed_url')}
              if isinstance(value,list):
                  return [summary(v) for v in value]
              if isinstance(value,str) and len(value)>2048:
                  return '[large field retained in artifact]'
              return value
          for line in open(sys.argv[1],encoding='utf-8'):
              try:
                  item=json.loads(line)
              except json.JSONDecodeError:
                  print(json.dumps({'ok':False,'reason':'invalid_result_line'}))
                  continue
              print(json.dumps(summary(item),ensure_ascii=False))
          PYREPORT
          exit "$result"
      - name: Retain original native image readbacks and exact comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appleservice39-approved-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/appleservice39-media-result.jsonl
          if-no-files-found: ignore
          retention-days: 30

