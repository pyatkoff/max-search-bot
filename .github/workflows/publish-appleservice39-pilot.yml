name: Republish the four approved AppleService39 MAX devices
run-name: Publish four AppleService39 MAX cards after deployment
on:
  push:
    branches: [content/appleservice39-republish-four-devices-20261119-confirmed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  observe:
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql
          coverage: none
      - name: Validate exact content source and completed application checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/content/appleservice39-republish-four-devices-20261119-confirmed
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = fe623086b716b3077e4ec0d4551095fc63db37e3
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_republish_requested_devices.php)"
          php -l tools/appleservice39_republish_requested_devices.php
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const event=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            d.requireValue(event.sender?.id===226193297&&event.created===true&&event.deleted===false&&event.forced===false&&event.before==='0'.repeat(40)&&event.after===process.env.GITHUB_SHA,'untrusted_content_creation');
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='fe623086b716b3077e4ec0d4551095fc63db37e3','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.actor?.id===226193297&&own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='content/appleservice39-republish-four-devices-20261119-confirmed'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_content_run');
            const predecessor=await api('GET',base+'/actions/runs/44495554135/attempts/1/jobs');
            const unsent=predecessor.jobs.find(job=>job.id===135471017572&&job.name==='observe');
            d.requireValue(unsent?.conclusion==='skipped'&&(unsent.steps?.length??0)===0,'previous_publication_may_have_written');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha==='fe623086b716b3077e4ec0d4551095fc63db37e3'&&receipt.install_attempt===1,'actual_application_changed');
            const proof=await d.deploymentProof(api,receipt);
            d.requireValue(proof.run.id===Number(receipt.run_id)&&proof.attempt===1&&proof.run.conclusion==='success','actual_installation_checks_unconfirmed');
            const {release:r}=d.validateRelease(location.record);
            d.requireValue(r.kind==='installed'&&r.application_sha==='fe623086b716b3077e4ec0d4551095fc63db37e3'&&r.repository_sha==='fe623086b716b3077e4ec0d4551095fc63db37e3'&&r.closure.binding.comment_id===6650664504&&r.closure.binding.pr===1624&&r.closure.binding.head_sha==='e25f3838899ec0462137c645678a79ca15d7d45f','wrong_content_installation_binding');
            await d.authenticatePublication(api,location,{closed:true});
            const owner=await api('GET',base+'/issues/comments/6650664504');
            d.requireValue(owner.user.id===226193297&&owner.body==='PR1624: установлено, выпуск свободен','technical_release_not_closed');
            await d.requireOps(api,receipt.sha);
            console.log(JSON.stringify({ok:true,scope:'four_fixed_max_devices',actual_application_sha:receipt.sha,installation_run:receipt.run_id,actual_checks:'success',app_release_or_slot_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Publish the four approved MAX posts and verify their native receipts
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_republish_four_devices_key"
          host_scan="$RUNNER_TEMP/appleservice39_republish_four_devices_scan"
          known_hosts="$RUNNER_TEMP/appleservice39_republish_four_devices_hosts"
          trap 'rm -f "$key_file" "$host_scan" "$known_hosts"' EXIT
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9_.:-]+$ && "$DEPLOY_HOST" != -* ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$DEPLOY_HOST" > "$host_scan" 2>/dev/null || true
          python3 - "$host_scan" "$known_hosts" <<'PYPIN'
          import base64,hashlib,pathlib,sys
          pin='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0'
          matches=[]
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'): continue
              try: fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2],validate=True)).digest()).decode().rstrip('=')
              except Exception: continue
              if fingerprint==pin: matches.append(line)
          if not matches: raise SystemExit('host_continuity_pin_mismatch')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(matches)+'\n')
          PYPIN
          result=0
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o GlobalKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin --apply' < tools/appleservice39_republish_requested_devices.php > "$RUNNER_TEMP/appleservice39-republish-four-devices-result.jsonl" || result=$?
          python3 - "$RUNNER_TEMP/appleservice39-republish-four-devices-result.jsonl" <<'PYREPORT'
          import json,sys
          def summary(value):
              if isinstance(value,dict):
                  return {k:summary(v) for k,v in value.items() if 'base64' not in k.lower() and k.lower() not in ('bytes','data','native_bytes','native_text','native_markup','token','upload_token','signed_url')}
              if isinstance(value,list):
                  return [summary(v) for v in value]
              if isinstance(value,str) and len(value)>2048:
                  return '[large field retained in artifact]'
              return value
          for line in open(sys.argv[1],encoding='utf-8'):
              try:
                  item=json.loads(line)
              except json.JSONDecodeError:
                  print(json.dumps({'ok':False,'reason':'invalid_result_line'}))
                  continue
              print(json.dumps(summary(item),ensure_ascii=False))
          PYREPORT
          exit "$result"
      - name: Retain MAX publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appleservice39-republish-four-devices-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/appleservice39-republish-four-devices-result.jsonl
          if-no-files-found: ignore
          retention-days: 30
