name: Publish approved AppleService39 pilot
run-name: Finish AppleService39 in its independent content lane
on:
  push:
    branches: [audit/appleservice39-content-finish-20261112]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: appleservice39-content
  cancel-in-progress: false
jobs:
  retire_prepublication_wait:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Retire only our own superseded pre-publication wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const base='https://api.github.com/repos/pyatkoff/max-search-bot';
          async function api(method,path){
            const r=await fetch(base+path,{method,headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(!r.ok)throw Error('own_wait_api_'+r.status);
            return r.status===204||r.status===202?null:r.json();
          }
          function requireValue(x,s){if(!x)throw Error(s);}
          async function inspect(){
            const r=await api('GET','/actions/runs/43230081352'),j=await api('GET','/actions/runs/43230081352/attempts/1/jobs?per_page=100');
            requireValue(r.head_sha==='b08dcb977f7b0a2c8cf977bff7fc11ca5bc9f0de'&&r.head_branch==='audit/appleservice39-owner-retry-20261112'&&r.event==='push'&&r.run_attempt===1&&r.head_repository.full_name==='pyatkoff/max-search-bot','old_operation_changed');
            requireValue(j.total_count===j.jobs.length&&j.jobs.length<=1,'old_jobs_unknown');
            for(const job of j.jobs){
              requireValue(job.run_attempt===1&&Array.isArray(job.steps),'old_steps_unknown');
              const privateStep=job.steps.find(s=>s.name==='Apply one owner-authorized replacement and finish canonical coverage');
              requireValue(privateStep&&(privateStep.conclusion==='skipped'||privateStep.started_at===null&&privateStep.status==='pending'),'old_private_step_attempted');
            }
            return r;
          }
          (async()=>{
            requireValue(process.env.GITHUB_REPOSITORY==='pyatkoff/max-search-bot'&&process.env.GITHUB_EVENT_NAME==='push'&&process.env.GITHUB_REF==='refs/heads/audit/appleservice39-content-finish-20261112'&&process.env.GITHUB_RUN_ATTEMPT==='1','untrusted_content_operation');
            let r=await inspect();
            if(r.status!=='completed'){
              try{await api('POST','/actions/runs/43230081352/cancel');}
              catch(e){const now=await inspect();if(now.status!=='completed')throw e;}
              for(let i=0;i<40;i++){r=await inspect();if(r.status==='completed')break;await new Promise(q=>setTimeout(q,2000));}
            }
            requireValue(r.status==='completed'&&['cancelled','failure'].includes(r.conclusion),'old_wait_not_terminal');
            await inspect();
            console.log(JSON.stringify({ok:true,superseded_run:43230081352,private_step_never_started:true,publication_writes:0,content_lane:'appleservice39-content'}));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS
  observe:
    needs: retire_prepublication_wait
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql
          coverage: none
      - name: Validate exact replacement source and current accepted installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/appleservice39-content-finish-20261112
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 6e1c61915d0afc35ec8198d59021fe5a6bddadb6
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_owner_retry.php)"
          php -l tools/appleservice39_owner_retry.php
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='6e1c61915d0afc35ec8198d59021fe5a6bddadb6','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='audit/appleservice39-content-finish-20261112'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_readonly_run');
            const original=await api('GET',base+'/actions/runs/43208426540/attempts/1');
            d.runIdentity(original,{id:43208426540,attempt:1,head:'0a397bd1b2b84648bd5ca23dcd113d567d0cc5bd',workflow:'.github/workflows/publish-appleservice39-pilot.yml',event:'workflow_dispatch',conclusion:'failure'});
            let result;
            for(let attempt=0;attempt<30;attempt++){
              const fresh=await api('GET',base+'/git/ref/heads/main');
              d.requireValue(fresh.object.sha===ref.object.sha,'current_main_changed');
              try{const location=await d.readRecord(api);result=await d.resolveCurrent(api,{sha:ref.object.sha},location);break;}
              catch(e){if(e.code!=='release_pending'&&e.message!=='release_pending')throw e;console.log('Waiting for the already running current installation');await new Promise(r=>setTimeout(r,10000));}
            }
            d.requireValue(result!==undefined,'accepted_installation_not_ready');
            d.requireValue(result.ready===true&&result.perform_actions===true&&result.application_sha===ref.object.sha,'accepted_application_required');
            await d.requireOps(api,result.application_sha);
            console.log(JSON.stringify({ok:true,observation_only:true,application_sha:result.application_sha,original_run:43208426540,provider_writes:0,database_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Apply one owner-authorized replacement and finish canonical coverage
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_owner_retry_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin' < tools/appleservice39_owner_retry.php
