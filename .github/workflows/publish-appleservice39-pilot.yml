name: Inspect AppleService39 existing menu artwork
run-name: Inspect published AppleService39 menu cover only
on:
  push:
    branches: [audit/appleservice39-menu-style-20261112]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact approved cover without publication credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install Pillow
          python - <<'PY'
          import base64,hashlib,io
          from pathlib import Path
          from PIL import Image
          b=Path('resources/appleservice39/search-intent-v1/covers/menu.png').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='2f580bbf4f0963f5a37be34db455527aa8f650597801b7d0b6e81dce790a8681'
          im=Image.open(io.BytesIO(b)).convert('RGB')
          im.thumbnail((850,850))
          buf=io.BytesIO();im.save(buf,format='JPEG',quality=90)
          print('AS39_MENU_PREVIEW_BEGIN')
          encoded=base64.b64encode(buf.getvalue()).decode()
          for pos in range(0,len(encoded),4096): print(encoded[pos:pos+4096])
          print('AS39_MENU_PREVIEW_END')
          print('SOURCE_ONLY_NO_PROVIDER_OR_DATABASE_WRITES')
          PY
