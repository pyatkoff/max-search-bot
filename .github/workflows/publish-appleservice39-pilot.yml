name: Publish approved AppleService39 pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/AppleService39Pilot*.php'
      - 'services/ProjectMaxConnection.php'
      - 'integrations/AppleService39ChannelTransport.php'
      - 'resources/appleservice39/pilot/**'
      - 'resources/appleservice39/landing-v2/**'
      - 'resources/appleservice39-pilot-entries.json'
      - 'migrations/095_appleservice39_pilot_publications.sql'
      - 'tools/publish_appleservice39_pilot.php'
      - 'tools/deployment_release.js'
      - 'tests/run_appleservice39_publisher_regression.php'
      - 'tests/mysql/appleservice39-publisher.php'
      - 'tests/required_checks_manifest.php'
      - '.github/workflows/publish-appleservice39-pilot.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed reviewed pilot operation; unknown outcomes never repeat a write
        type: choice
        options: [inspect, prepare, publish, finalize, pin, reconcile, landing_inspect, landing_prepare, landing_apply, landing_reconcile]
        required: true
        default: inspect
      expected_application_sha:
        description: Full accepted application SHA returned by release provenance
        type: string
        required: true
      channel_id:
        description: Exact negative numeric ID of channel_appleservice39ru, verified natively before any write
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  regression:
    name: AppleService39 pilot publication regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - name: Verify fixed content, identities, one-attempt holds and real-link readbacks
        run: |
          php -l tools/publish_appleservice39_pilot.php
          php tests/run_appleservice39_publisher_regression.php

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify current repository provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Resolve the accepted repository and actual application
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment_release.js resolve-consumer >> "$GITHUB_OUTPUT"

      - name: Validate the exact fixed operation before deployment credentials
        env:
          OPERATION: ${{ inputs.operation }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          EXPECTED_APPLICATION_SHA: ${{ inputs.expected_application_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY_SHA: ${{ steps.release.outputs.repository_sha }}
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
          RELEASE_READY: ${{ steps.release.outputs.ready }}
          PERFORM_ACTIONS: ${{ steps.release.outputs.perform_actions }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHANNEL_ID" =~ ^-[1-9][0-9]{0,18}$ ]]
          case "$OPERATION" in inspect|prepare|publish|finalize|pin|reconcile|landing_inspect|landing_prepare|landing_apply|landing_reconcile) ;; *) exit 2 ;; esac
          test "$RELEASE_READY" = true
          test "$PERFORM_ACTIONS" = true
          test "$WORKFLOW_SHA" = "$REPOSITORY_SHA"
          test "$EXPECTED_APPLICATION_SHA" = "$APPLICATION_SHA"

      - name: Prepare the existing deployment SSH credential
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/appleservice39_pilot_deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Invalid deployment SSH key'; exit 2; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Run the installed fixed pilot operation once
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_APPLICATION_SHA: ${{ inputs.expected_application_sha }}
          OPERATION: ${{ inputs.operation }}
          CHANNEL_ID: ${{ inputs.channel_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHANNEL_ID" =~ ^-[1-9][0-9]{0,18}$ ]]
          case "$OPERATION" in inspect|prepare|publish|finalize|pin|reconcile|landing_inspect|landing_prepare|landing_apply|landing_reconcile) ;; *) exit 2 ;; esac
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(-i "$RUNNER_TEMP/appleservice39_pilot_deploy_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no)
          command="cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/publish_appleservice39_pilot.php $OPERATION --expected-sha=$EXPECTED_APPLICATION_SHA --channel-id=$CHANNEL_ID"
          result=0
          ssh "${ssh_options[@]}" "$remote" "$command" || result=$?
          if [[ "$result" != 0 && "$OPERATION" != inspect && "$OPERATION" != landing_inspect ]]; then
            # A lost result permits one inspection, never a repeated mutation.
            inspection_mode=inspect
            if [[ "$OPERATION" == landing_* ]]; then inspection_mode=landing_inspect; fi
            inspection="cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/publish_appleservice39_pilot.php $inspection_mode --expected-sha=$EXPECTED_APPLICATION_SHA --channel-id=$CHANNEL_ID"
            ssh "${ssh_options[@]}" "$remote" "$inspection" || true
          fi
          exit "$result"

      - name: Remove the ephemeral runner SSH credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/appleservice39_pilot_deploy_key"
