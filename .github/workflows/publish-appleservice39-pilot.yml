name: Check AppleService39 release admission
on:
  push:
    branches: [audit/appleservice39-notify-release-admission-20261119]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check production release admission without changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/appleservice39-notify-release-admission-20261119
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = eb7ab9472e6b556812dc3d209a155d291c2077b6
          node tools/release_priority.js --admit 1624 e25f3838899ec0462137c645678a79ca15d7d45f eb7ab9472e6b556812dc3d209a155d291c2077b6
