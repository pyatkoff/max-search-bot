name: Audit AppleService39 client path and reviews label
run-name: Audit AppleService39 customer path and update reviews label
on:
  push:
    branches: [audit/appleservice39-customer-path-readback-20261112]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: appleservice39-content
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3
          coverage: none
      - name: Validate exact replacement source and current accepted installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/appleservice39-customer-path-readback-20261112
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 6e1c61915d0afc35ec8198d59021fe5a6bddadb6
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_customer_path.php)"
          php -l tools/appleservice39_customer_path.php
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='6e1c61915d0afc35ec8198d59021fe5a6bddadb6','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='audit/appleservice39-customer-path-readback-20261112'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_readonly_run');
            const original=await api('GET',base+'/actions/runs/43233934004/attempts/1');
            d.runIdentity(original,{id:43233934004,attempt:1,head:'49217957d2db026fa49f6e5bba610584baad7d26',workflow:'.github/workflows/publish-appleservice39-pilot.yml',event:'push',branch:'audit/appleservice39-channel-notify-20261112',conclusion:'success'});
            const prior=await api('GET',base+'/actions/runs/43248200837/attempts/1');
            d.runIdentity(prior,{id:43248200837,attempt:1,head:'b5c9fe782e3ab03e9db906f5b1e1fdaddf77a74d',workflow:'.github/workflows/publish-appleservice39-pilot.yml',event:'push',branch:'audit/appleservice39-customer-path-20261112',conclusion:'failure'});
            const priorJobs=d.boundedList(await api('GET',base+'/actions/runs/43248200837/attempts/1/jobs?per_page=100'),'jobs','prior_jobs_unknown');
            const priorJob=priorJobs.find(j=>j.id===131286521101);
            d.requireValue(priorJob&&priorJob.status==='completed'&&priorJob.steps.some(s=>s.name==='Verify isolated launch and repair handoff behavior'&&s.conclusion==='success'),'accepted_isolated_proof_missing');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha===ref.object.sha,'actual_application_changed');
            await d.deploymentProof(api,receipt);
            await d.requireOps(api,receipt.sha);
            const result={application_sha:receipt.sha};
            console.log(JSON.stringify({ok:true,observation_only:true,application_sha:result.application_sha,original_run:43233934004,provider_writes:0,database_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Audit published customer routes and update only reviews label
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_menu_reviews_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin' < tools/appleservice39_customer_path.php
