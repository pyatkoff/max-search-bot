name: Update AppleService39 captions and iPhone 17 choices
run-name: Align nine AppleService39 captions and preserve iPhone 17 service context
on:
  push:
    branches: [content/appleservice39-caption-and-17-services-20261113]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: appleservice39-content
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql
          coverage: none
      - name: Validate exact content source and completed application checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/content/appleservice39-caption-and-17-services-20261113
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 1fcff4e4b3c771c38d5b2a3c87bc4fb95531c60e
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_post_polish.php)"
          php -l tools/appleservice39_post_polish.php
          php tools/appleservice39_post_polish.php --self-test
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const event=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            d.requireValue(event.created===true&&event.deleted===false&&event.forced===false&&event.before==='0'.repeat(40)&&event.after===process.env.GITHUB_SHA,'untrusted_content_creation');
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='1fcff4e4b3c771c38d5b2a3c87bc4fb95531c60e','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='content/appleservice39-caption-and-17-services-20261113'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_content_run');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha==='1fcff4e4b3c771c38d5b2a3c87bc4fb95531c60e'&&receipt.run_id==='43398534056'&&receipt.install_attempt===1,'actual_application_changed');
            const proof=await d.deploymentProof(api,receipt);
            d.requireValue(proof.run.id===Number('43398534056')&&proof.attempt===1&&proof.run.conclusion==='success','actual_installation_checks_unconfirmed');
            const {release:r}=d.validateRelease(location.record);
            d.requireValue(r.kind==='installed'&&r.application_sha==='1fcff4e4b3c771c38d5b2a3c87bc4fb95531c60e'&&r.repository_sha==='1fcff4e4b3c771c38d5b2a3c87bc4fb95531c60e'&&r.closure.binding.comment_id===6650664504&&r.closure.binding.pr===1524&&r.closure.binding.head_sha==='25b01edd0a84bec80cae8402b572373f843eff7f','wrong_content_installation_binding');
            await d.authenticatePublication(api,location,{closed:true});
            const owner=await api('GET',base+'/issues/comments/6650664504');
            d.requireValue(owner.user.id===226193297&&owner.body==='PR1524: установлено, выпуск свободен','technical_release_not_closed');
            await d.requireOps(api,receipt.sha);
            console.log(JSON.stringify({ok:true,scope:'nine_caption_and_iphone17_text_only',actual_application_sha:receipt.sha,installation_run:receipt.run_id,actual_checks:'success',app_release_or_slot_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Edit nine existing native posts once and verify all 69
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_post_polish_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin' < tools/appleservice39_post_polish.php
