name: Repair remaining AppleService39 public links
run-name: Repair remaining 68 AppleService39 posts after accepted canary
on:
  push:
    branches: [content/appleservice39-public-links-remaining68-20261116]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: appleservice39-content
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql
          coverage: none
      - name: Validate exact content source and completed application checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/content/appleservice39-public-links-remaining68-20261116
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d1fdf7cfeb774adb68879386e75a79ef4c49efec
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/publish-appleservice39-pilot.yml tools/appleservice39_public_links.php)"
          php -l tools/appleservice39_public_links.php
          php tools/appleservice39_public_links.php --self-test
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const event=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            d.requireValue(event.created===true&&event.deleted===false&&event.forced===false&&event.before==='0'.repeat(40)&&event.after===process.env.GITHUB_SHA,'untrusted_content_creation');
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha==='d1fdf7cfeb774adb68879386e75a79ef4c49efec','current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='content/appleservice39-public-links-remaining68-20261116'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_content_run');
            const canary=await api('GET',base+'/actions/runs/43878334512');
            d.requireValue(canary.id===43878334512&&canary.event==='push'&&canary.run_attempt===1&&canary.status==='completed'&&canary.conclusion==='success'&&canary.head_sha==='98cac2bad12980c6198fab8982a37dcda15e2f4a'&&canary.head_branch==='content/appleservice39-public-links-canary-20261116'&&canary.head_repository.full_name===d.REPOSITORY,'accepted_canary_run_changed');
            const canarySource=await api('GET',base+'/git/commits/98cac2bad12980c6198fab8982a37dcda15e2f4a');
            d.requireValue(canarySource.tree.sha==='754687798ccfe249f9be7b5c73c8a45ae62bcfc0'&&canarySource.parents.length===1&&canarySource.parents[0].sha==='e64ca705fb91463362b73c3531c162af77503f35','accepted_canary_source_changed');
            const canaryJobs=await api('GET',base+'/actions/runs/43878334512/attempts/1/jobs');
            d.requireValue(canaryJobs.total_count===1&&canaryJobs.jobs.length===1&&canaryJobs.jobs[0].id===133337205815&&canaryJobs.jobs[0].status==='completed'&&canaryJobs.jobs[0].conclusion==='success'&&canaryJobs.jobs[0].steps.every(s=>s.status==='completed'&&s.conclusion==='success'),'accepted_canary_native_job_changed');
            const artifact=await api('GET',base+'/actions/artifacts/14231880110');
            d.requireValue(artifact.id===14231880110&&artifact.expired===false&&artifact.digest==='sha256:726d70273ab280c24b34f04b66af32761872561de3741e6742d268782fd6b9b5'&&artifact.workflow_run.id===43878334512&&artifact.workflow_run.head_sha==='98cac2bad12980c6198fab8982a37dcda15e2f4a','accepted_canary_artifact_changed');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha==='d1fdf7cfeb774adb68879386e75a79ef4c49efec'&&receipt.run_id==='43878664287'&&receipt.install_attempt===1,'actual_application_changed');
            const proof=await d.deploymentProof(api,receipt);
            d.requireValue(proof.run.id===Number('43878664287')&&proof.attempt===1&&proof.run.conclusion==='success','actual_installation_checks_unconfirmed');
            const {release:r}=d.validateRelease(location.record);
            d.requireValue(r.kind==='installed'&&r.application_sha==='d1fdf7cfeb774adb68879386e75a79ef4c49efec'&&r.repository_sha==='d1fdf7cfeb774adb68879386e75a79ef4c49efec'&&r.closure.binding.comment_id===6682640708&&r.closure.binding.pr===1561&&r.closure.binding.head_sha==='18c718b6edfad0189863c453371d655b362749af','wrong_content_installation_binding');
            await d.authenticatePublication(api,location,{closed:true});
            const owner=await api('GET',base+'/issues/comments/6650664504');
            d.requireValue(owner.user.id===226193297&&owner.body==='PR1539: установлено, выпуск свободен','technical_release_not_closed');
            await d.requireOps(api,receipt.sha);
            console.log(JSON.stringify({ok:true,scope:'remaining68_existing_posts_after_accepted_canary',actual_application_sha:receipt.sha,installation_run:receipt.run_id,actual_checks:'success',app_release_or_slot_writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Edit remaining 68 once; preserve images and CTA; reread all 69 posts
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/appleservice39_public_links_remaining68_key"
          host_scan="$RUNNER_TEMP/appleservice39_public_links_remaining68_scan"
          known_hosts="$RUNNER_TEMP/appleservice39_public_links_remaining68_hosts"
          trap 'rm -f "$key_file" "$host_scan" "$known_hosts"' EXIT
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9_.:-]+$ && "$DEPLOY_HOST" != -* ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$DEPLOY_HOST" > "$host_scan" 2>/dev/null || true
          python3 - "$host_scan" "$known_hosts" <<'PYPIN'
          import base64,hashlib,pathlib,sys
          pin='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0'
          matches=[]
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'): continue
              try: fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2],validate=True)).digest()).decode().rstrip('=')
              except Exception: continue
              if fingerprint==pin: matches.append(line)
          if not matches: raise SystemExit('host_continuity_pin_mismatch')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(matches)+'\n')
          PYPIN
          result=0
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o GlobalKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'php /dev/stdin --apply-remaining' < tools/appleservice39_public_links.php > "$RUNNER_TEMP/appleservice39-public-links-remaining68-result.jsonl" || result=$?
          python3 - "$RUNNER_TEMP/appleservice39-public-links-remaining68-result.jsonl" <<'PYREPORT'
          import json,sys
          def summary(value):
              if isinstance(value,dict):
                  return {k:summary(v) for k,v in value.items() if 'base64' not in k.lower() and k.lower() not in ('bytes','data','native_bytes','native_text','native_markup','token','upload_token','signed_url')}
              if isinstance(value,list):
                  return [summary(v) for v in value]
              if isinstance(value,str) and len(value)>2048:
                  return '[large field retained in artifact]'
              return value
          for line in open(sys.argv[1],encoding='utf-8'):
              try:
                  item=json.loads(line)
              except json.JSONDecodeError:
                  print(json.dumps({'ok':False,'reason':'invalid_result_line'}))
                  continue
              print(json.dumps(summary(item),ensure_ascii=False))
          PYREPORT
          exit "$result"
      - name: Retain original 68-edit receipts and full 69-post native audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appleservice39-public-links-remaining68-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/appleservice39-public-links-remaining68-result.jsonl
          if-no-files-found: ignore
          retention-days: 30
