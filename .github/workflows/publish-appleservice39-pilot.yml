name: Check AppleService39 caption edit plans
on:
  push:
    branches: [quality/appleservice39-post-polish-plan-20261113]
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Verify nine full caption plans and all retained native navigation links
        run: |
          php -l tools/appleservice39_post_polish.php
          php tools/appleservice39_post_polish.php --self-test
