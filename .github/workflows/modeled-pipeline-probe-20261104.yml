name: Probe modeled pipeline technical metadata once

on:
  push:
    branches: [ops/modeled-pipeline-probe-20261104]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/modeled-pipeline-probe-20261104' && github.run_attempt == 1
    concurrency:
      group: anytour-modeled-pipeline-read-only-probe-20261104
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ACCEPTED_MAIN_SHA: '117d884bef3174b7dd5976b5e354811f3edc8e83'
    steps:
      - name: Checkout this one original probe commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository event original attempt main ancestry and sole path
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/ops/modeled-pipeline-probe-20261104'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg sha "$GITHUB_SHA" '
            .repository.full_name=="pyatkoff/max-search-bot" and
            .ref=="refs/heads/ops/modeled-pipeline-probe-20261104" and
            .deleted==false and .forced==false and .after==$sha
          ' "$GITHUB_EVENT_PATH" >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r head parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$head" = "$GITHUB_SHA"
          test "$parent" = "$ACCEPTED_MAIN_SHA"
          test -z "$extra"
          test "$(git diff --name-only "$ACCEPTED_MAIN_SHA" HEAD)" = '.github/workflows/modeled-pipeline-probe-20261104.yml'
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionPipelineMonitorStatus.php")" = '062c44b820f6f7c2612a259a8cd3996c7f745272'
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionStatusBudget.php")" = 'dab2be9be5f148b945a27df6befe60ed7f7a19be'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$ACCEPTED_MAIN_SHA" refs/remotes/origin/main

      - name: Prepare existing SSH credential only on the GitHub runner
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/modeled-pipeline-probe-key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Read technical pipeline metadata once without running a cycle
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'READ_ONLY_PROBE'
          import json,os,pathlib,subprocess
          REMOTE="set -euo pipefail\nexport GIT_OPTIONAL_LOCKS=0\nroot='/var/www/anytoour/data/www/app.anytoour.ru'\ncd \"$root\"\nfence() {\n  test \"$(pwd -P)\" = \"$root\"\n  for path in services/ModeledConversionPipelineMonitorStatus.php services/ModeledConversionStatusBudget.php; do\n    test -f \"$path\"\n    test ! -L \"$path\"\n  done\n  test \"$(git hash-object -- services/ModeledConversionPipelineMonitorStatus.php)\" = '062c44b820f6f7c2612a259a8cd3996c7f745272'\n  test \"$(git hash-object -- services/ModeledConversionStatusBudget.php)\" = 'dab2be9be5f148b945a27df6befe60ed7f7a19be'\n  git diff --quiet HEAD -- services/ModeledConversionPipelineMonitorStatus.php services/ModeledConversionStatusBudget.php\n}\nfence\nresult=\"$(/usr/bin/php <<'OBSERVER_PHP'\n<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');\nerror_reporting(0);\n$root='/var/www/anytoour/data/www/app.anytoour.ru';\n$project='anytour';$counter='98615635';\n$authorize=static function()use($root,$project,$counter):void {\n    if(PHP_SAPI!=='cli'||realpath((string)getcwd())!==$root||$project!=='anytour'||$counter!=='98615635')\n        throw new RuntimeException('probe_scope');\n};\ntry {\n    $authorize();\n    require_once $root.'/services/ModeledConversionPipelineMonitorStatus.php';\n    $now=time();\n    $status=ModeledConversionPipelineMonitorStatus::read(new ModeledConversionStatusBudget(),$authorize,$now);\n    $known=['delivery_tick_stale','profile_tick_stale','delivery_tick_errors','profile_tick_errors',\n        'profile_disabled','ready_queue_stale','upload_outcome_unknown','api_row_rejected','report_unavailable',\n        'storage_unavailable','configuration_unavailable','invalid_clock','health_metadata_unavailable'];\n    $flags=$status['flags'];\n    if(!is_array($flags)||!array_is_list($flags)||count($flags)>20)throw new RuntimeException('probe_flags');\n    foreach($flags as$flag)if(!is_string($flag)||!in_array($flag,$known,true))throw new RuntimeException('probe_flags');\n    $out=['schema_version'=>1,'project'=>$project,'counter_id'=>$counter,'probe_completed'=>true,\n        'observed_at'=>gmdate('Y-m-d\\TH:i:s\\Z',$now)];\n    foreach(['available','active','reason','origin','activated_at','waiting_first_tick','checked_at','fresh',\n        'status','notification','last_notification_at','source_sha','cycle_id','ok'] as$key)$out[$key]=$status[$key];\n    $out['flags']=$flags;\n    $out['scheduled']=[];\n    foreach(['available','last_checked_at','fresh','success_streak','regular'] as$key)\n        $out['scheduled'][$key]=$status['scheduled'][$key];\n    $checks=$status['scheduled']['checks'];\n    if(!is_array($checks)||!array_is_list($checks)||count($checks)>3)throw new RuntimeException('probe_checks');\n    $out['scheduled']['checks']=[];\n    foreach($checks as$check){\n        $item=[];\n        foreach(['cycle_id','checked_at','status','ok','source_sha'] as$key)$item[$key]=$check[$key];\n        $out['scheduled']['checks'][]=$item;\n    }\n    $authorize();\n    echo json_encode($out,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES),\"\\n\";\n} catch(Throwable $ignored) {\n    exit(1);\n}\nOBSERVER_PHP\n)\"\nfence\ntest \"$(printf '%s' \"$result\" | wc -c)\" -le 8192\nprintf '%s\\n' \"$result\"\n"
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"modeled-pipeline-probe.json"
          out={"schema_version":1,"project":"anytour","counter_id":"98615635",
               "probe_completed":False,"reason":"technical_probe_unavailable"}
          exit_code=1
          try:
              command=["ssh","-i",str(pathlib.Path(os.environ["RUNNER_TEMP"])/"modeled-pipeline-probe-key"),
                       "-o","BatchMode=yes","-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null",
                       "-o","ConnectTimeout=10",os.environ["DEPLOY_USER"]+"@"+os.environ["DEPLOY_HOST"],
                       "timeout 12s bash -s"]
              result=subprocess.run(command,input=REMOTE.encode("utf-8"),stdout=subprocess.PIPE,
                                    stderr=subprocess.DEVNULL,timeout=15,check=False)
              if result.returncode!=0 or len(result.stdout)>8192:
                  raise ValueError("probe_unavailable")
              value=json.loads(result.stdout)
              expected={"schema_version","project","counter_id","probe_completed","observed_at","available","active",
                        "reason","origin","activated_at","waiting_first_tick","checked_at","fresh","status","notification",
                        "last_notification_at","source_sha","cycle_id","ok","flags","scheduled"}
              if not isinstance(value,dict) or set(value)!=expected or value["schema_version"]!=1 or \
                 value["project"]!="anytour" or value["counter_id"]!="98615635" or value["probe_completed"] is not True:
                  raise ValueError("probe_scope")
              out=value
              exit_code=0
          except Exception:
              pass
          output.write_text(json.dumps(out,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          output.chmod(0o600)
          print(json.dumps(out,sort_keys=True,separators=(",",":")))
          raise SystemExit(exit_code)
          READ_ONLY_PROBE

      - name: Retain technical projection only
        if: always() && steps.provenance.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: modeled-pipeline-technical-probe
          path: ${{ runner.temp }}/modeled-pipeline-probe.json
          retention-days: 3
          if-no-files-found: error

      - name: Remove ephemeral SSH credential
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/modeled-pipeline-probe-key"
