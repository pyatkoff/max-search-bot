name: Publish conversation diagnostics

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Capture redacted conversation snapshot
        id: conversations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          capture_stdout: true
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            /opt/php81/bin/php export_debug_logs.php >/dev/null
            base64 -w0 diag-tdxAcIvIkZwuvgwq86B1x9fFMJo3GfRa-conversations.json

      - name: Publish snapshot
        env:
          CONVERSATIONS_B64: ${{ steps.conversations.outputs.stdout }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONVERSATIONS_B64"
          printf '%s' "$CONVERSATIONS_B64" | base64 --decode > conversations.json
          php -r '$j=json_decode(file_get_contents("conversations.json"),true); if(!is_array($j)||empty($j["ok"])) exit(1);'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          git add conversations.json
          git commit -m "Update production conversation diagnostics" || true
          git push origin diagnostics
