name: Publish production diagnostics

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-diagnostics
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify current main before private capture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA"

      - name: Prepare evidence encryption
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/evidence-python"
          "$RUNNER_TEMP/evidence-python/bin/pip" install --disable-pip-version-check --only-binary=:all: --require-hashes -q -r tools/requirements-encrypted-evidence.txt

      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Verify deployed SHA and capture production
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          deployed=""
          for attempt in $(seq 1 60); do
            deployed="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && git rev-parse HEAD" 2>/dev/null || true)"
            if [ "$deployed" = "$TARGET_SHA" ]; then break; fi
            sleep 5
          done
          test "$deployed" = "$TARGET_SHA"

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/production_snapshot.php" > production_snapshot.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/live_session_snapshot.php 1" > live_session_report.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/live_session_snapshot.php today" > daily_session_report.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/live_session_snapshot.php yesterday" > yesterday_session_report.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/export_handoff_snapshot.php" > handoff.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/website_production_smoke.php" > website_smoke.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php tools/architecture_inventory.php --compact" > architecture_inventory.json
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && {
            printf '%s\\n' 'CRON_METRIKA_ENTRIES';
            crontab -l 2>/dev/null | grep -E '(^|[[:space:]])([^#[:space:]]*/)?(cron_metrika\.php|metrika_queue\.php)([[:space:]]|$)' || true;
            printf '%s ' 'QUEUE_BYTES'; stat -c '%s' metrika_offline_queue.csv 2>/dev/null || printf '0'; printf '\\n';
            printf '%s ' 'PROCESSING_BYTES'; stat -c '%s' metrika_offline_processing.csv 2>/dev/null || printf '0'; printf '\\n';
            printf '%s ' 'QUEUE_MTIME'; stat -c '%y' metrika_offline_queue.csv 2>/dev/null || printf 'missing'; printf '\\n';
            printf '%s\\n' 'UPLOAD_LOG_TAIL';
            tail -n 20 metrika_upload.log 2>/dev/null | sed -E 's/(yclid|token|authorization)[^[:space:]]*/\\1=[redacted]/gi' || true;
          }" > metrika_delivery_diagnostic.txt

          php -r '$j=json_decode(file_get_contents("production_snapshot.json"),true); if(!is_array($j)||empty($j["ok"])) {fwrite(STDERR,"snapshot_not_ok\n");exit(1);} if((string)($j["production"]["sha"]??"")!==(string)getenv("TARGET_SHA")){fwrite(STDERR,"production_sha_mismatch\n");exit(1);} foreach(($j["migrations"]??[]) as $m){if(empty($m["applied"])||empty($m["checksum_ok"])){fwrite(STDERR,"migration_health_failed: ".($m["version"]??"unknown")."\n");exit(1);}} if(empty($j["health"]["manager_visibility_ok"])){fwrite(STDERR,"manager_visibility_health_failed\n");exit(1);} if(empty($j["health"]["admin_project_access_ok"])){fwrite(STDERR,"admin_project_access_health_failed\n");exit(1);} if(empty($j["health"]["website_attribution_ok"])){fwrite(STDERR,"website_attribution_health_failed\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("live_session_report.json"),true); if(!is_array($j)||empty($j["ok"])||!isset($j["summary"],$j["sessions"])) {fwrite(STDERR,"live_session_snapshot_contract_failed\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("daily_session_report.json"),true); if(!is_array($j)||empty($j["ok"])||($j["window_type"]??"")!=="calendar_day"||($j["timezone"]??"")!=="Europe/Kaliningrad"||!isset($j["summary"]["calendar_day"]["conversations_started"],$j["summary"]["calendar_day"]["manager_requested"],$j["summary"]["calendar_day"]["manager_replied"])) {fwrite(STDERR,"daily_session_snapshot_contract_failed\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("yesterday_session_report.json"),true); if(!is_array($j)||empty($j["ok"])||($j["window_type"]??"")!=="calendar_day"||($j["timezone"]??"")!=="Europe/Kaliningrad"||!isset($j["summary"]["calendar_day"]["conversations_started"],$j["summary"]["calendar_day"]["manager_requested"],$j["summary"]["calendar_day"]["manager_replied"])) {fwrite(STDERR,"yesterday_session_snapshot_contract_failed\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("handoff.json"),true); if(!is_array($j)||empty($j["ok"])) exit(1);'
          cat website_smoke.json
          php -r '$j=json_decode(file_get_contents("website_smoke.json"),true); if(!is_array($j)||empty($j["ok"])) {fwrite(STDERR,"website_production_smoke_failed\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("architecture_inventory.json"),true); if(!is_array($j)||empty($j["ok"])||!isset($j["areas"],$j["hotspots"],$j["signals"]["runtime_ddl"],$j["signals"]["direct_sql_writes"])) {fwrite(STDERR,"architecture_inventory_contract_failed\n");exit(1);}'
          test -s metrika_delivery_diagnostic.txt
          cat metrika_delivery_diagnostic.txt
          printf '{"sha":"%s","migration":"success","snapshot":"success","live_sessions":"success","daily_sessions":"success","yesterday_sessions":"success","architecture_inventory":"success","website_smoke":"success","health":"success","reported_at":"%s"}\n' "$TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops_status.json
          php tools/compose_autopilot_snapshot.php production_snapshot.json live_session_report.json handoff.json website_smoke.json ops_status.json daily_session_report.json architecture_inventory.json > autopilot_snapshot.private.json
          php tools/sanitize_public_diagnostics.php autopilot_snapshot.private.json > autopilot_snapshot.json
          php -r '$j=json_decode(file_get_contents("autopilot_snapshot.json"),true); if(!is_array($j)||empty($j["ok"])||(int)($j["schema_version"]??0)!==1){fwrite(STDERR,"autopilot_snapshot_contract_failed\n");exit(1);} if((string)($j["production"]["sha"]??"")!==(string)getenv("TARGET_SHA")){fwrite(STDERR,"autopilot_snapshot_sha_mismatch\n");exit(1);} if((int)($j["migrations"]["pending"]??-1)!==0||(int)($j["migrations"]["checksum_failures"]??-1)!==0){fwrite(STDERR,"autopilot_snapshot_migration_health_failed\n");exit(1);} if(!isset($j["daily"]["summary"]["calendar_day"]["conversations_started"],$j["daily"]["summary"]["calendar_day"]["manager_requested"])) {fwrite(STDERR,"autopilot_snapshot_daily_missing\n");exit(1);} if(!isset($j["architecture"]["signal_counts"]["runtime_ddl"],$j["architecture"]["signal_counts"]["direct_sql_writes"])) {fwrite(STDERR,"autopilot_snapshot_architecture_missing\n");exit(1);}'

          out_dir="$RUNNER_TEMP/production-diagnostics-out"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          cp architecture_inventory.json ops_status.json autopilot_snapshot.json "$out_dir/"

          # Only ciphertext leaves this job. Public reports keep their existing sanitizer.
          "$RUNNER_TEMP/evidence-python/bin/python" tools/encrypted_dialogue_evidence.py encrypt \
            --recipient docs/diagnostics-recipient.txt --sha "$TARGET_SHA" \
            --live live_session_report.json --today daily_session_report.json \
            --yesterday yesterday_session_report.json \
            --output "$RUNNER_TEMP/dialogue-evidence.age"
          rm -f "$RUNNER_TEMP/deploy_key"

      - name: Publish production snapshot
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/production-diagnostics-out"
          test -s "$out_dir/architecture_inventory.json"
          test -s "$out_dir/ops_status.json"
          test -s "$out_dir/autopilot_snapshot.json"

          rm -f production_snapshot.json live_session_report.json daily_session_report.json yesterday_session_report.json handoff.json website_smoke.json architecture_inventory.json ops_status.json autopilot_snapshot.private.json autopilot_snapshot.json metrika_delivery_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          rm -rf production-diagnostics
          find . -maxdepth 1 -type f -name '*.json' ! -name 'deploy_status.json' ! -name 'ops_status.json' ! -name 'autopilot_snapshot.json' ! -name 'architecture_inventory.json' ! -name 'public_live_status.json' ! -name 'public_daily_status.json' -delete
          cp "$out_dir/architecture_inventory.json" .
          cp "$out_dir/ops_status.json" .
          cp "$out_dir/autopilot_snapshot.json" .
          git add -A
          git commit -m "Update production diagnostics for ${TARGET_SHA}" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then exit 0; fi
            git pull --rebase origin diagnostics
          done
          exit 1

      - name: Upload encrypted dialogue evidence
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-dialogue-evidence-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dialogue-evidence.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Metrika delivery diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: metrika-delivery-diagnostic-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrika_delivery_diagnostic.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove private capture files
        if: always()
        shell: bash
        run: |
          rm -f production_snapshot.json live_session_report.json daily_session_report.json yesterday_session_report.json handoff.json autopilot_snapshot.private.json
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/dialogue-evidence.age"
          rm -rf "$RUNNER_TEMP/evidence-python"
