d1b3a16179ddf3702fadc5e40"},{"hotel_id":79954,"hotel":"Park Hyatt Bangkok","aliases":["Park Hyatt Bangkok","PARK HYATT BANGKOK"],"text":"✈️ Туры в Park Hyatt Bangkok\n📍 Бангкок, Таиланд.\n\nБангкок над Central Embassy: выразительная архитектура, бассейн, рестораны и спа. Подойдёт тем, кто хочет совместить городской шопинг с красивыми вечерами и комфортным отдыхом.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=79954","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=79954"],"photo_blob_sha":"348a033e1db79ee916ebf10e72a395377d18a333"},{"hotel_id":80233,"hotel":"Avani Sukhumvit Bangkok Hotel","aliases":["Avani Sukhumvit Bangkok Hotel","AVANI SUKHUMVIT BANGKOK"],"text":"✈️ Туры в Avani Sukhumvit Bangkok Hotel\n📍 Бангкок, Таиланд.\n\nБангкок с прямым выходом к BTS On Nut: удобно отправляться за городскими впечатлениями. После прогулок ждут бассейн, ресторан, бар и фитнес, а в номерах можно отдохнуть от суеты.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=80233","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=80233"],"photo_blob_sha":"32b061426f2a93943e90b29f02617210c2da7ac4"},{"hotel_id":110848,"hotel":"Kimpton Maa Lai Bangkok","aliases":["Kimpton Maa Lai Bangkok","KIMPTON MAA LAI BANGKOK AN IHG HOTEL"],"text":"✈️ Туры в Kimpton Maa Lai Bangkok\n📍 Бангкок, Таиланд.\n\nДизайнерский Бангкок на улице Сой Тонсон: стильные номера, открытый бассейн, спа и фитнес. Для тех, кто ценит необычные интерьеры и хочет приятно чередовать городские прогулки с отдыхом.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=110848","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=110848"],"photo_blob_sha":"cf73fde2468d48cb190303824097fb64470fdadd"},{"hotel_id":111489,"hotel":"Fusion Original Saigon Centre","aliases":["Fusion Original Saigon Centre","FUSION ORIGINAL SAIGON CENTRE HO CHI MINH"],"text":"✈️ Туры в Fusion Original Saigon Centre\n📍 Хошимин, Вьетнам.\n\nХошимин в самом Saigon Centre: яркие дизайнерские интерьеры, открытый бассейн с городским видом и ресторан. Рядом магазины Takashimaya и достопримечательности центрального района.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=111489","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=111489"],"photo_blob_sha":"e2a62876e78c85957eceefdda47f66973141b430"},{"hotel_id":118713,"hotel":"InterContinental Bangkok Sukhumvit","aliases":["InterContinental Bangkok Sukhumvit","INTERCONTINENTAL BANGKOK SUKHUMVIT"],"text":"✈️ Туры в InterContinental Bangkok Sukhumvit\n📍 Бангкок, Таиланд.\n\nБангкок на Сукхумвит неподалёку от BTS Thong Lo. Номера с городскими видами, бассейн, спа и рестораны. Подойдёт, чтобы совмещать прогулки, покупки и комфортный отдых в отеле.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=118713","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=118713"],"photo_blob_sha":"b213b0e4d47d7b99683508e1956675ae77b5059d"},{"hotel_id":119052,"hotel":"Hyatt Regency Bangkok Sukhumvit","aliases":["Hyatt Regency Bangkok Sukhumvit","HYATT REGENCY BANGKOK SUKHUMVIT"],"text":"✈️ Туры в Hyatt Regency Bangkok Sukhumvit\n📍 Бангкок, Таиланд.\n\nБангкок рядом с BTS Nana: удобно отправляться на прогулки и за покупками. В отеле есть открытый бассейн, рестораны и Spectrum Lounge & Bar для красивого завершения городского дня.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=119052","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=119052"],"photo_blob_sha":"7d6b0ffd622d5488fb3df8144bc65fc77f807373"},{"hotel_id":127988,"hotel":"JW Marriott Hotel & Suites Saigon","aliases":["JW Marriott Hotel & Suites Saigon","JW MARRIOTT HOTEL & SUITES SAIGON","InterContinental Saigon","INTERCONTINENTAL ASIANA SAIGON","INTERCONTINENTAL SAIGON AN IHG HOTEL"],"text":"✈️ Туры в JW Marriott Hotel & Suites Saigon\n📍 Хошимин, Вьетнам.\n\nВ центре Хошимина рядом с M Plaza Saigon и историческими достопримечательностями. Просторные номера, открытый бассейн, спа и рестораны для комфортной городской поездки вдвоём или семьёй.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=127988","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=127988","https://www.marriott.com/offers/jw-season-of-festivities-off-260847/sgnjs-jw-marriott-hotel-and-suites-saigon"],"photo_blob_sha":"36558627b640c67984408d0558da744467348aca"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          prior=api('actions/runs/44142065912');assert prior['conclusion']=='success' and prior['run_attempt']==1 and prior['head_sha']=='1b5783306314d858c3bc9e044acda196ddbd7756'
          correction=api('actions/runs/44144368845');assert correction['conclusion']=='success' and correction['run_attempt']==1 and correction['head_sha']=='10f8833199235b338527e0fc52edc52dc3ee3914'
          artifact=api('actions/artifacts/14355570585');assert not artifact['expired'] and artifact['workflow_run']['id']==44142065912 and artifact['digest']=='sha256:66047c22e4b5a619ed0c5d429a66bedda4e7e40b00100e602dc4155e957f8902'
          screenzip=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14355570585/zip'],timeout=90)
          assert hashlib.sha256(screenzip).hexdigest()=='66047c22e4b5a619ed0c5d429a66bedda4e7e40b00100e602dc4155e957f8902'
          with zipfile.ZipFile(io.BytesIO(screenzip)) as z:
              assert z.testzip() is None and z.namelist()==['wave5-65-screen.json']
              screenbytes=z.read('wave5-65-screen.json');screen=json.loads(screenbytes)
          assert screen['ok'] and screen['matched_hotel_ids']==[111948] and len(screen['matches'])==2 and len(screen['inspected_hotel_ids'])==65
          assert screen['sender_calls']==screen['db_writes']==screen['provider_calls']==0 and screen['trusted_component_files']==22
          APP=pathlib.Path('pub/runtime-readonly.txt').read_text().strip();assert APP==EXPECTED_APP
          MAIN=api('git/ref/heads/main')['object']['sha']

          release=api('actions/runs/44139041068');assert release['conclusion']=='success' and release['run_attempt']==1 and release['head_sha']==APP
          deployed=json.loads(base64.b64decode(api('contents/deploy_status.json?ref=diagnostics')['content']));rr=deployed['repository_release']
          assert deployed['sha']==rr['application_sha']==rr['repository_sha']==APP and rr['kind']=='installed' and str(rr['release']['run_id'])=='44139041068'
          assert all(s['result']=='success' for s in rr['stages'].values())
          required={'.github/workflows/deploy.yml','.github/workflows/retired-domain-guard.yml','.github/workflows/max-tls-preflight.yml','.github/workflows/max-production-health.yml','.github/workflows/telegram-production-health.yml','.github/workflows/publish-conversation-diagnostics.yml','.github/workflows/live-session-diagnostics.yml','.github/workflows/tour-selection-host.yml','.github/workflows/modeled-conversion-monitor.yml'}
          gates={g['path']:g for g in rr['closure']['gates']};assert required.issubset(gates)
          assert all(gates[path]['conclusion']=='success' and gates[path]['head_sha']==APP and gates[path]['run_attempt']==1 for path in required)

          source=pathlib.Path('tools/direct_demand/operations')
          template=(source/'commercial-batch-template-20261102.php').read_text()
          assert hashlib.sha256(template.encode()).hexdigest()=='4c4aaa2e50155a69e8bd8b9f460777026735b0c51c3b2fc253cf0b7556e53ed5'
          assert subprocess.check_output(['git','hash-object',str(source/'prepare-commercial-batch.py')],text=True).strip()=='8df7a35474b138364b6e6c010af4fa484e350ddb'
          pairs=[('f0e04e9b4e0ed6859ced96279cbf0619931596e6','1982ff7368763edf8b7238c3142e3cc28579e991'),('db8181426091a685a79ee55991cde22671f0d9dd','7304af19cc19666f00ca4ead1b04c2bdce719646')]
          protected=re.findall(r'"([^"]+)"=>"([a-f0-9]{40})"',template);assert len(protected)==22
          for commit in set([APP,MAIN]):
              tree=api('git/trees/'+commit+'?recursive=1');assert not tree['truncated']
              actual={e['path']:e['sha'] for e in tree['tree']}
              for path,sha in protected:assert actual[path]==dict(pairs).get(sha,sha),('publisher_surface_drift',commit,path)
          phototree=api('git/trees/'+PHOTO+'?recursive=1');assert not phototree['truncated'];photoblobs={e['path']:e['sha'] for e in phototree['tree']}
          rec=json.loads(pathlib.Path(PREFIX+'cover-receipt.json').read_bytes())
          assert len(rec['rows'])==65 and rec['prepared_count']==44 and rec['held_count']==21 and rec['sender_calls']==rec['feed_writes']==0
          correction_receipt=pathlib.Path(PREFIX+'photo-correction-receipt.json').read_bytes()
          assert subprocess.check_output(['git','hash-object',PREFIX+'photo-correction-receipt.json'],text=True).strip()=='7ea856d71062a4311e438ed624980630dd92e6bd'
          assert set(c['id'] for c in json.loads(correction_receipt)['changes'])=={4235,43494,110848,115812}
          assert len(INPUT)==len(set(r['hotel_id'] for r in INPUT))==43 and 4269 not in [r['hotel_id'] for r in INPUT]
          assert set(r['hotel_id'] for r in INPUT).issubset(set(screen['inspected_hotel_ids']))
          prepare=runpy.run_path(str(source/'prepare-commercial-batch.py'))['prepare']
          out=pathlib.Path('wave5-43-accepted-source');out.mkdir();files={};batches=[]
          for i in range(0,len(INPUT),10):
              batch=36+i//10;items=INPUT[i:i+10]
              manifest={'schema_version':1,'operation':'commercial-hotel-batch-20261117-'+str(batch)+'-v1','state':'PREPARED_NOT_SENT','button_text':'✈️ Узнать стоимость тура','expected_new_full_pairs':len(items),'photo_freeze_commit':PHOTO,'native_id_namespace':'Tourvisor','rows':[]}
              for row in items:
                  hid=row['hotel_id'];receipt=next(x for x in rec['rows'] if x['id']==hid)
                  assert receipt['status']=='prepared_needs_visual_acceptance' and not receipt['send_allowed']
                  name=PREFIX+str(hid)+'.png';b=pathlib.Path(name).read_bytes()
                  assert photoblobs[name]==row['photo_blob_sha']==hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  assert hashlib.sha256(b).hexdigest()==receipt['png_sha256'] and len(receipt['photo_sources'])==3
                  assert len(row['text'].encode('utf-16-le'))//2<=1024 and len(row['text'])>150
                  assert row['text'].startswith('✈️ Туры в '+row['hotel']+'\n📍 ') and 'Подберём тур на ваши даты.' in row['text']
                  manifest['rows'].append({'hotel_id':hid,'logical_id':'commercial-hotel-'+str(hid)+'-v1','aliases':row['aliases'],'text':row['text'],'text_sha256':hashlib.sha256(row['text'].encode()).hexdigest(),'photo_url':'https://raw.githubusercontent.com/pyatkoff/max-search-bot/'+PHOTO+'/'+name,'photo_sha256':receipt['png_sha256'],'media_state':'REAL_OFFICIAL_PHOTOGRAPHY_BRANDED_COVER_VISUALLY_VERIFIED','sources':row['sources']})
              raw=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
              approval={'schema_version':1,'operation':manifest['operation'],'expected_installed_sha':APP,'hotel_ids':[r['hotel_id'] for r in items],'manifest_sha256':hashlib.sha256(raw).hexdigest()}
              php,report=prepare(template,raw,approval)
              for a,b in pairs:
                  assert php.count(a)==1 and php.count(b)==0;php=php.replace(a,b)
              files['p'+str(batch)+'-manifest.json']=raw;files['p'+str(batch)+'-approval.json']=(json.dumps(approval,ensure_ascii=False,indent=2)+'\n').encode();files['p'+str(batch)+'-publisher-unexecuted.php']=php.encode()
              batches.append({'batch':batch,'operation':manifest['operation'],'ids':approval['hotel_ids'],'rows':len(items),'publisher_sha256':hashlib.sha256(php.encode()).hexdigest()})
          files['provider-facts.json']=pathlib.Path(PREFIX+'provider-facts.json').read_bytes();files['cover-receipt-original.json']=pathlib.Path(PREFIX+'cover-receipt.json').read_bytes()
          files['runtime-readonly.txt']=pathlib.Path('pub/runtime-readonly.txt').read_bytes();files['native-screen-original.json']=screenbytes
          files['photo-correction-receipt.json']=correction_receipt
          held=json.loads(r'''[{"id":64764,"name":"Vinpearl Hue Hotel","reason":"legacy_vinpearl_hue_vs_current_melia_vinpearl113553_requires_reuse"},{"id":78858,"name":"Vinpearl Discovery Golflink Nha Trang","reason":"legacy_discovery_golflink_related_hon_tre_identity_requires_separate_admission"},{"id":111948,"name":"Vinpearl Landmark 81, Autograph Collection","reason":"existing_native_or_alias_publication"},{"id":123000,"name":"Four Points by Sheraton Lang Son","reason":"AssertionError:no_paid_provider_photo_source"},{"id":126643,"name":"Ixora Ho Tram By Fusion","reason":"related_ixora_within_existing_grand_ho_tram15862_requires_separate_property_admission"},{"id":129437,"name":"Intercontinental Residences Nha Trang By Ihg","reason":"related_residences_vs_existing_intercontinental_nha_trang_requires_separate_admission"},{"id":131851,"name":"Pullman Hai Phong Grand","reason":"AssertionError:no_paid_provider_photo_source"},{"id":142314,"name":"Sheraton Can Tho","reason":"AssertionError:no_paid_provider_photo_source"},{"id":155460,"name":"Best Western Premier Imperial Dalat","reason":"AssertionError:no_paid_provider_photo_source"},{"id":159699,"name":"Pullman Ninh Binh","reason":"AssertionError:no_paid_provider_photo_source"},{"id":162521,"name":"Meliá Vinpearl Tay Ninh","reason":"AssertionError:no_paid_provider_photo_source"},{"id":164863,"name":"Sofitel Central Hua Hin","reason":"old_sofitel_central_hua_hin_vs_published_centara_grand8127_requires_reuse"},{"id":168069,"name":"Park Hyatt Phu Quoc","reason":"current_operating_status_and_real_photo_source_not_accepted_opening_status_requires_confirmation"},{"id":23737,"name":"Intercontinental Asiana Saigon","reason":"former_intercontinental_asiana_saigon_vs_current_jw127988_requires_reuse"},{"id":107086,"name":"Hyatt Regency West Hanoi","reason":"AssertionError:no_paid_provider_photo_source"},{"id":108097,"name":"Sofitel Sukhumvit","reason":"potential_duplicate_sofitel_sukhumvit_vs8169_requires_reuse"},{"id":111949,"name":"Intercontinental Saigon An Ihg Hotel","reason":"former_intercontinental_saigon_vs_current_jw127988_requires_reuse"},{"id":111954,"name":"Intercontinental Residences Saigon An Ihg Hotel","reason":"related_intercontinental_residences_saigon_vs_jw127988_requires_separate_admission"},{"id":112556,"name":"InterContinental Hanoi Landmark72","reason":"AssertionError:no_paid_provider_photo_source"},{"id":142814,"name":"Dusit Le Palais Tu Hoa Hanoi","reason":"AssertionError:no_paid_provider_photo_source"},{"id":163057,"name":"Intercontinental Bangkok Phloen Chit","reason":"potential_duplicate_phloen_chit_vs_intercontinental_bangkok2986_requires_identity_confirmation"},{"hotel_id":4269,"reason":"paid source facts describe1970/2014 former Dusit Thani Bangkok and gallery shows former interiors; current rebuilt hotel photographs/native binding not accepted"}]''')
