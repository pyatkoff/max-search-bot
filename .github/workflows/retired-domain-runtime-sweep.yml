name: Retired domain runtime sweep

on:
  push:
    branches: [cleanup/remove-retired-domain-everywhere]
    paths:
      - '.github/workflows/retired-domain-runtime-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-retired-domain-everywhere
          fetch-depth: 0

      - name: Replace retired host outside workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          old = 'anytour' + '.online'
          replacements = [
              (f'/var/www/545v0023442/data/www/{old}/max-search', '/var/www/anytoour/data/www/app.anytoour.ru'),
              (f'~/www/{old}/max-search', '/var/www/anytoour/data/www/app.anytoour.ru'),
              (f'www/{old}/max-search', '/var/www/anytoour/data/www/app.anytoour.ru'),
              (f'https://www.{old}/max-search/', 'https://app.anytoour.ru/'),
              (f'https://{old}/max-search/', 'https://app.anytoour.ru/'),
              (f'https://www.{old}', 'https://www.anytoour.ru'),
              (f'admin@{old}', 'admin@anytoour.ru'),
              (f'https://{old}', 'https://app.anytoour.ru'),
              (old, 'app.anytoour.ru'),
          ]
          changed=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              path=Path(raw.decode())
              if str(path).startswith('.github/workflows/'):
                  continue
              try: data=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              new=data
              for before,after in replacements: new=new.replace(before,after)
              if new!=data:
                  path.write_text(new,encoding='utf-8')
                  changed.append(str(path))
          print('CHANGED_FILES='+str(len(changed)))
          for p in changed: print(p)
          PY

      - name: Commit runtime sweep
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows'
          git commit -m 'Remove retired domain from runtime tests and docs'
          git push origin HEAD:cleanup/remove-retired-domain-everywhere
