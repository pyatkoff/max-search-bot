name: Cutover data audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Read production snapshot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd ~/www/anytour.online/max-search; /opt/php81/bin/php tools/cutover_data_snapshot.php" > "$RUNNER_TEMP/prod.json"
          python3 -m json.tool "$RUNNER_TEMP/prod.json" >/dev/null

      - name: Read standby snapshot
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/cutover_data_snapshot.php" > "$RUNNER_TEMP/standby.json"
          python3 -m json.tool "$RUNNER_TEMP/standby.json" >/dev/null

      - name: Compare snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          with open(os.path.join(root, 'prod.json'), encoding='utf-8') as f:
              prod = json.load(f)
          with open(os.path.join(root, 'standby.json'), encoding='utf-8') as f:
              standby = json.load(f)

          print('CUTOVER_DATA_AUDIT')
          print('production_database=' + str(prod.get('database', '')))
          print('standby_database=' + str(standby.get('database', '')))
          print('table\tproduction\tstandby\tdelta\tprod_max_id\tstandby_max_id')
          all_equal = True
          for table in prod.get('tables', {}):
              p = prod['tables'][table]
              s = standby.get('tables', {}).get(table, {'row_count': -1, 'max_id': -1})
              delta = int(p['row_count']) - int(s['row_count'])
              equal = int(p['row_count']) == int(s['row_count']) and int(p['max_id']) == int(s['max_id'])
              all_equal = all_equal and equal
              print(f"{table}\t{p['row_count']}\t{s['row_count']}\t{delta}\t{p['max_id']}\t{s['max_id']}")
          print('CUTOVER_DATA_MATCH=' + ('YES' if all_equal else 'NO'))
          print('NOTE=Mismatch is expected before the final frozen production dump; this workflow is read-only and never performs cutover.')
          PY
