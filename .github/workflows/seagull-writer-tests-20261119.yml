name: Seagull offline exact executor validation
on:
  push:
    branches: [audit/seagull-writer-tests-20261119]
    paths: ['.github/workflows/seagull-writer-tests-20261119.yml']
permissions:
  contents: read
jobs:
  validate-only:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PHP syntax and exact negative scope checks only, no runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir pub
          python3 - <<'PY'
          import base64,pathlib
          pathlib.Path('pub/writer.php').write_bytes(base64.b64decode(''))
          pathlib.Path('pub/scope-tests.php').write_bytes(base64.b64decode(''))
          PY
          php -l pub/writer.php
          php pub/scope-tests.php
