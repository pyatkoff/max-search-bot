      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring
          coverage: none
      - name: Read the existing50 small-channel posts with bounded public GET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pub
          cat > /tmp/hotel-reserve50-public.php <<'PHP'
          <?php
          declare(strict_types=1);
          function requireRead(bool $ok, string $reason): void
          {
              if (!$ok) throw new RuntimeException($reason);
          }
          function jsonRead(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);
          }
          function reasonRead(Throwable $e): string
          {
              return get_class($e) === RuntimeException::class
