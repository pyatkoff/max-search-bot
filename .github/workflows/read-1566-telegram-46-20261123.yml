name: "#1566 Read saved1981 source and old957 photos without server access"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '1350fb49087058eb13b4d7504cfb867906e277da' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the two photos from the exact original public observation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/15057327244/zip > "$RUNNER_TEMP/public.zip"
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json,os,urllib.request,urllib.parse,urllib.error,datetime,re
          zpath=pathlib.Path(os.environ['RUNNER_TEMP'],'public.zip')
          raw=zpath.read_bytes()
          assert len(raw)==8923 and hashlib.sha256(raw).hexdigest()=='9f132c15b2c96253a9f32ad5fee1445ce88d0a2a78c8fedc542b100023c5867e'
          with zipfile.ZipFile(zpath) as z:
              assert z.namelist()==['prepared4-pair-public.json'] and z.testzip() is None
              data=z.read('prepared4-pair-public.json')
          assert hashlib.sha256(data).hexdigest()=='e7dbe7c5a5ab167b11722402ee4bab051c39e878493c0b56c2194b61535945c8'
          d=json.loads(data)
          assert d['native_run_id']=='45688118739' and d['reader_source_sha']=='1350fb49087058eb13b4d7504cfb867906e277da'
          rows=[r for r in d['rows'] if r['hotel_id']==1981]
          assert len(rows)==2 and {r['role'] for r in rows}=={'source','target'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          out={'issue':1566,'operation':'existing_reader_prepared1981_photo_observation','original_public_run':'45688118739','original_public_artifact':15057327244,'native_run_id':os.environ['GITHUB_RUN_ID'],'reader_source_sha':os.environ['GITHUB_SHA'],'write_admission':False,'server_calls':0,'provider_writes':0,'production_writes':0,'rows':[]}
          for r in rows:
              v=r['public'];url=v['photo_url'];u=urllib.parse.urlsplit(url)
              assert v['single_photo'] is True and r['message_id']==('25' if r['role']=='source' else '957')
              assert u.scheme=='https' and not u.username and not u.password and u.port is None
              assert re.fullmatch(r'(?:[a-z0-9-]+\.)*(?:cdn-telegram\.org|telegram-cdn\.org|telesco\.pe)',u.hostname)
              try:
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as response:
                      assert response.status==200
                      body=response.read(2000001)
              except urllib.error.HTTPError as e:
                  if e.code==429:
                      out['retry_after_raw']=e.headers.get('Retry-After')
                      out['host_hold']=u.hostname
                      break
                  raise
              assert 0<len(body)<=2000000
              ext=('jpg' if body.startswith(b'\xff\xd8\xff') else 'png' if body.startswith(b'\x89PNG\r\n\x1a\n') else 'webp' if body[:4]==b'RIFF' and body[8:12]==b'WEBP' else None)
              assert ext is not None
              name=r['role']+'-1981-'+r['message_id']+'.'+ext
              pathlib.Path('pub',name).write_bytes(body)
              out['rows'].append({'hotel_id':1981,'role':r['role'],'channel':r['channel'],'message_id':r['message_id'],'public_url':v['url'],'photo_url_sha256':hashlib.sha256(url.encode()).hexdigest(),'caption_sha256':v['caption_sha256'],'published_unixtime':v['published_unixtime'],'path':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          out['read_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path('pub/photos.json').write_text(json.dumps(out,ensure_ascii=False))
          print(json.dumps({'downloaded':len(out['rows']),'write_admission':False,'server_calls':0,'retry_after':out.get('retry_after_raw')}))
          assert len(out['rows'])==2 and 'host_hold' not in out
          PY
      - name: Preserve original public photos for independent visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/*
          retention-days: 7
          if-no-files-found: error
