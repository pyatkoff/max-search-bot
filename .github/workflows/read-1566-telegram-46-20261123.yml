name: "#1566 Match legacy Telegram buttons to the existing route without changing posts"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '6d5a31a36590a4d4b6e148954768f9bf9e35fc3c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Correlate target records with authenticated saved public images and keyboards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,subprocess,zipfile
          from collections import Counter
          from pathlib import Path
          def api(path):
              return subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}"],timeout=25)
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def original(run_id,artifact_id,head,expected,size,member):
              run=json.loads(api(f'actions/runs/{run_id}'))
              assert run['head_sha']==head and run['conclusion']=='success' and run['run_attempt']==1 and run['actor']['id']==226193297
              meta=json.loads(api(f'actions/artifacts/{artifact_id}'))
              assert meta['workflow_run']['id']==run_id and not meta['expired'] and meta['size_in_bytes']==size and meta['digest']=='sha256:'+expected
              raw=api(f'actions/artifacts/{artifact_id}/zip')
              assert len(raw)==size and digest(raw)==expected
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert archive.testzip() is None and archive.namelist().count(member)==1
                  assert 0 < archive.getinfo(member).file_size <= 6000000
                  return json.loads(archive.read(member))
          scope={1701,1702,1705,1706,1712,1713,1725}
          registry=original(45804994534,15108278922,'6d5a31a36590a4d4b6e148954768f9bf9e35fc3c',
              '6f60cbe7bd822267742ffdcdcc712e7ec968a205acdcb0f9243ea43361e3d0b8',1527,'registry.json')
          assert registry['ok'] is True and registry['write_admission'] is False
          known={int(row['target_mid']):row for row in registry['rows']}
          assert set(known)==scope
          old=[
              (45793051934,15103676430,'76b976406945de03bf273bf1884c56a9c65d004f','3d06b3fc214abd2ed02dc435ce50379d66ccf017900f9846eaee8d9bc351758b',438249),
              (45747718941,15083853001,'4a80c9b86444d30462e8371f8be9c854a3aebbe5','a5f9edd963c476f4e3f003f4f83007644e2b4d607fa9c49a608dad52fcf14d77',711069),
          ]
          public={}
          for run_id,artifact_id,head,zip_sha,size in old:
              d=original(run_id,artifact_id,head,zip_sha,size,'archive-windows.json')
              assert d['write_admission'] is False and d['native_run_id']==str(run_id) and d['reader_source_sha']==head
              for row in d['rows']:
                  mid=int(row['target_message_id'])
                  if mid in scope and mid not in public:
                      public[mid]=(run_id,row['public'])
          assert set(public)==scope
          generic=digest(b'https://t.me/anyru_bot?start=tg_anytour_msk')
          rows=[]
          for mid in sorted(scope):
              run_id,r=public[mid]
              buttons=r['buttons']
              assert r['single_photo'] and len(buttons)>0 and all(len(b['url_sha256'])==64 for b in buttons)
              state=('one_recorded_generic_route' if len(buttons)==1 and buttons[0]['url_sha256']==generic else 'multiple_or_other_legacy_routes')
              entry={'target_mid':mid,'public_archive_run':run_id,'keyboard_type':state,
                     'buttons':[{'label':b['text'],'url_sha256':b['url_sha256'],'canonical_generic':b['url_sha256']==generic,
                                 'has_hotel_token':b.get('hotel_url') is not None} for b in buttons],
                     'caption_sha256':r['caption_sha256'],'photo_marker_sha256':r['photo_marker_sha256'],
                     'caption_entry_link_count':len(r.get('caption_links',[])),
                     'registry':known[mid],'write_admission':False}
              rows.append(entry)
              print(json.dumps(entry,ensure_ascii=False))
          out={'status':'evidence_only','rows':rows,'keyboard_types':dict(Counter(r['keyboard_type'] for r in rows)),
               'telegram_requests':0,'production_writes':0,'provider_writes':0,'write_admission':False}
          Path('target-keyboards.json').write_text(json.dumps(out,ensure_ascii=False))
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-legacy-keyboard-canonical-routing-evidence
          path: target-keyboards.json
          retention-days: 7
          if-no-files-found: error
