name: "#1566 Continue native observation of original unresolved fifteen Telegram transfers"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.before == '16647d7f5cb89523600aa79cea7126a17b169d43' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact existing release admission code
        uses: actions/checkout@v4
        with:
          ref: 878c680627d54297c364254687577a03ac5aef6b
          persist-credentials: false
      - name: Wait for the original source checks and verify ordinary ROUTE release admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ROUTE_HEAD: e97ca8ac147cee8fd2db9149994d7026ca5378cc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "878c680627d54297c364254687577a03ac5aef6b"
          for run in 45582243573 45582243537; do
            while true; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.head_sha, .event, (.run_attempt|tostring), .status, (.conclusion // "-")] | @tsv')"
              IFS=$'\t' read -r head event attempt status conclusion <<< "$result"
              test "$head" = "$EXPECTED_ROUTE_HEAD"
              test "$event" = 'pull_request'
              test "$attempt" = '1'
              if [[ "$status" == 'completed' ]]; then
                test "$conclusion" = 'success'
                break
              fi
              sleep 20
            done
          done
          node tools/release_priority.js --admit 1699 "$EXPECTED_ROUTE_HEAD" 878c680627d54297c364254687577a03ac5aef6b
