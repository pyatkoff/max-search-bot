name: "#1566 Read original1727 installation and technical closure"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'd4f6f6c6851020239f5fc7a16e55c9cbdabe72ba' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Check out the exact merged existing canonical resolver
        uses: actions/checkout@v4
        with:
          ref: 703b239adbcfb1f480265f3a7beea566f6d07002
          persist-credentials: false
      - name: Observe only the original1727 deploy and original technical closer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pub
          node - <<'NODE'
          const fs=require('node:fs'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN),root=R.API_ROOT;
            const sha='703b239adbcfb1f480265f3a7beea566f6d07002',deploy='45687100028';
            const begun=performance.now();let closer;
            for(let observation=0;observation<61;observation++){
              if((await api('GET',root+'/git/ref/heads/main')).object.sha!==sha)throw Error('main_changed');
              const original=await api('GET',root+'/actions/runs/'+deploy);
              if(String(original.id)!==deploy||original.run_attempt!==1||original.head_sha!==sha||original.event!=='push'||original.path!=='.github/workflows/deploy.yml')throw Error('original_deploy_changed');
              if(original.status==='completed'&&original.conclusion!=='success')throw Error('original_deploy_not_successful');
              if(original.status==='completed'){
                const inventory=await api('GET',root+'/actions/runs?head_sha='+sha+'&per_page=100');
                if(!Array.isArray(inventory.workflow_runs)||inventory.total_count!==inventory.workflow_runs.length||inventory.workflow_runs.length>=100)throw Error('incomplete_native_inventory');
                const matches=inventory.workflow_runs.filter(x=>x.path==='.github/workflows/modeled-conversion-value-export.yml'&&x.event==='workflow_run'&&x.display_title==='deploy-proof:v1:'+deploy+':1');
                if(matches.length>1)throw Error('ambiguous_original_closer');
                if(matches.length===1){
                  closer=matches[0];
                  if(closer.run_attempt!==1||closer.head_sha!==sha)throw Error('original_closer_changed');
                  if(closer.status==='completed'){
                    if(closer.conclusion!=='success')throw Error('original_closer_not_successful');
                    break;
                  }
                }
              }
              if(observation===60||performance.now()-begun>1200000)throw Error('original_technical_acceptance_still_pending');
              console.log(JSON.stringify({read_only:true,observation,original_deploy:deploy,deploy_status:original.status,closer_id:closer?.id||null,closer_status:closer?.status||null}));
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            if(!closer||closer.status!=='completed'||closer.conclusion!=='success')throw Error('original_terminal_not_proved');
            const before=await R.readRecord(api),r=R.validateRelease(before.record).release;
            if(r.repository_sha!==sha||r.application_sha!==sha||r.kind!=='installed'||r.release.run_id!==deploy||r.release.run_attempt!==1
              ||r.closure?.run_id!==String(closer.id)||r.closure?.binding?.pr!==1727||r.closure?.binding?.comment_id!==6818332618
              ||r.closure?.binding?.owner_id!==226193297||r.closure?.binding?.head_sha!=='5ce043349e1d5ede9bd02c4b71e52bf2a3c01fb4'
              ||r.closure?.binding?.updated_at!=='2026-11-25T19:37:25Z')throw Error('original1727_record_changed');
            const resolved=await R.resolveCurrent(api,{sha},before);
            if(!resolved.ready||resolved.repository_sha!==sha||resolved.application_sha!==sha)throw Error('original1727_not_canonically_accepted');
            const publisher=await api('GET',root+'/issues/comments/6818332618');
            if(publisher.user.id!==226193297||publisher.body!=='PR1727: установлено, выпуск свободен')throw Error('own_publisher_not_technically_free');
            const after=await R.readRecord(api);
            if(before.blob!==after.blob||before.record_digest!==after.record_digest||(await api('GET',root+'/git/ref/heads/main')).object.sha!==sha)throw Error('accepted_record_changed');
            const proof={read_only:true,write_admission:false,provider_writes:0,production_writes:0,pr:1727,original_deploy:deploy,original_closer:String(closer.id),repository_sha:sha,application_sha:sha,technical_acceptance_complete:true,canonical:resolved,record_commit:before.commit,record_blob:before.blob,record_digest:before.record_digest,publisher:{id:publisher.id,owner:publisher.user.id,body:publisher.body,updated_at:publisher.updated_at},native_run_id:process.env.GITHUB_RUN_ID,reader_source_sha:process.env.GITHUB_SHA,checked_at_utc:new Date().toISOString()};
            fs.writeFileSync('pub/accepted1727.json',JSON.stringify(proof)+'\n');
            console.log(JSON.stringify({accepted:true,sha,original_deploy:deploy,original_closer:closer.id,write_admission:false}));
          }
          check().catch(e=>{console.error('original1727_read_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Preserve original canonical1727 acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/accepted1727.json
          retention-days: 7
          if-no-files-found: warn
