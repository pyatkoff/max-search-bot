name: "#1566 Prove the real Telegram hotel reservation regression before and after the fix"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '7fefeea019fb07df9bfd6307f51011d133b0108f' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the observed failing application
        uses: actions/checkout@v4
        with:
          ref: 69e41c8011b4c67692f631cf435dd20d90676c72
          path: before
          persist-credentials: false
      - name: Check out the exact repaired HOTELS branch
        uses: actions/checkout@v4
        with:
          ref: ec912e8874e8a0f16ddd1df26c82ffd497d99074
          path: after
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, curl, dom
          coverage: none
      - name: Run the same reservation test against both revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('after/tests/run_ranked_telegram_cli_regression.js').read_text()
          prefix = "const registryOrder = spawnSync('php', ['-r', String.raw`"
          assert text.count(prefix) == 1
          script = text.split(prefix,1)[1].split('`], {cwd: root',1)[0]
          assert 'The real JAZ Lamaya packet would fail' in script
          Path('registry-test.php').write_text('<?php\ndeclare(strict_types=1);\n'+script)
          PY
          if (cd before && php ../registry-test.php) > "$RUNNER_TEMP/before.txt" 2>&1; then
            echo 'The test failed to reproduce the original refusal.'; exit 1
          fi
          grep -F 'The real JAZ Lamaya packet would fail the strict reservation callback' "$RUNNER_TEMP/before.txt"
          (cd after && php -l tools/anytour_existing_post_batch.php && php ../registry-test.php)
          echo 'Real packet fails on the original code and passes on the repaired code.'
      - name: Run the existing ranked Telegram packet and CLI suite
        working-directory: after
        run: node tests/run_ranked_telegram_cli_regression.js
