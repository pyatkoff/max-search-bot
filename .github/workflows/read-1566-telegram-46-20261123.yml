name: "#1566 Pick commercial legacy target candidates from the eleven new windows"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '76b976406945de03bf273bf1884c56a9c65d004f' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read the exact frozen active plans for exclusions
        uses: actions/checkout@v4
        with:
          ref: 43c684f3d220f4808efe898d1ba14608f960fda7
          path: accepted
          persist-credentials: false
      - name: Classify new evidence without Telegram requests or production access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              return subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],timeout=35)
          run=json.loads(get('actions/runs/45793051934'))
          assert run['head_sha']=='76b976406945de03bf273bf1884c56a9c65d004f' and run['run_attempt']==1 and run['conclusion']=='success'
          assert run['actor']['id']==226193297 and run['event']=='push'
          info=json.loads(get('actions/artifacts/15103676430'))
          digest='3d06b3fc214abd2ed02dc435ce50379d66ccf017900f9846eaee8d9bc351758b'
          assert info['workflow_run']['id']==run['id'] and not info['expired'] and info['digest']=='sha256:'+digest
          raw=get('actions/artifacts/15103676430/zip')
          assert len(raw)==info['size_in_bytes']==438249 and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert 'archive-windows.json' in archive.namelist() and archive.testzip() is None
              assert archive.getinfo('archive-windows.json').file_size<=6000000
              document=json.loads(archive.read('archive-windows.json'))
          assert document['native_run_id']==str(run['id']) and document['reader_source_sha']==run['head_sha']
          assert document['write_admission'] is False and document['provider_writes']==0
          known={1058,1099,1103,1109,1111,1535,1559,1584,1585,1620,1651,1653,1654,1664,1665,1679,1695,1696,1713,1725}
          for file in sorted(Path('accepted/config').glob('anytour*.json')):
              if file.stat().st_size>500000:
                  continue
              obj=json.loads(file.read_bytes())
              if isinstance(obj,dict):
                  known.update(int(row['target_message_id']) for row in obj.get('rows',[])
                      if isinstance(row,dict) and str(row.get('target_message_id','')).isdigit())
          scopes=Counter()
          mask=re.compile(r'отзыв|гости (?:отмечают|рассказывают)|впечатл|туристы (?:вернул|поделил)|наш[аеи]? менеджер|'
              r'загадк|поздравл|с праздником|угада[йе]|розыгрыш|голосуй|конкурс|доминикан',re.I)
          sold=re.compile(r'от [\d\s]+\s*(?:₽|RUB)|(?:₽|RUB)|вылет|стоимость|ночей',re.I)
          hotel_cta=re.compile(r'рассчитать на мои даты|в этот отель|узнать стоимость тура|хочу в этот отель',re.I)
          leads=[]
          for row in document['rows']:
              mid=int(row['target_message_id'])
              public=row.get('public',{})
              caption=public.get('caption') or ''
              labels=[b.get('text','') for b in public.get('buttons',[]) if isinstance(b,dict)]
              scope=('known' if mid in known else
                  'occupied_hotel' if any(hotel_cta.search(label) for label in labels) or 'Подберём тур на ваши даты' in caption else
                  'protection_or_editorial' if mask.search(caption) else
                  'other_format' if not public.get('single_photo') else
                  'other_single_photo' if not sold.search(caption) else
                  'commercial_keyboard_review' if labels else 'commercial_empty_keyboard_review')
              scopes[scope]+=1
              if scope.startswith('commercial_'):
                  lead={'mid':mid,'scope':scope,'caption':caption[:1800],'buttons':labels,'date':public.get('published_at'),
                      'caption_sha256':public.get('caption_sha256'),'photo_marker_sha256':public.get('photo_marker_sha256'),
                      'caption_links':len(public.get('caption_links',[])),'write_admission':False}
                  leads.append(lead)
                  print(json.dumps(lead,ensure_ascii=False))
          out={'archive_run':run['id'],'observed':len(document['rows']),'windows':len(document['windows']),
              'windows_http_200':sum(w.get('http')==200 for w in document['windows']),'scope':dict(scopes),
              'native_ready':0,'telegram_requests':0,'provider_writes':0,'write_admission':False}
          Path('pub').mkdir()
          Path('pub/next-archive-candidates.json').write_text(json.dumps({**out,'leads':leads},ensure_ascii=False))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Preserve the gap shortlist with exact references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-next-archive-shortlist
          path: pub/next-archive-candidates.json
          retention-days: 7
          if-no-files-found: error
