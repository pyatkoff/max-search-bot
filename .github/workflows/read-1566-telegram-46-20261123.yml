name: "#1566 Continue native observation of thirty previously prepared commercial Telegram candidates"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.before == '1f0ab0a8024f6a473e5658026715d3b91a02c51e' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the exact candidate packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out main for the existing release verifier
        uses: actions/checkout@v4
        with:
          ref: main
          path: accepted
          persist-credentials: false
      - name: Require current accepted release and actual application
        working-directory: accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export READ_REPOSITORY_SHA="$(git rev-parse HEAD)"
          node - <<'NODE'
          const fs = require('node:fs')
          const R = require('./tools/deployment_release')
          const P = require('./tools/release_priority')
          async function check() {
            const expected = process.env.READ_REPOSITORY_SHA
            const token = process.env.GITHUB_TOKEN
            const api = R.makeReadApi(token)
            const current = async () => (await api('GET', R.API_ROOT+'/git/ref/heads/main')).object.sha
            if (!/^[a-f0-9]{40}$/.test(expected) || await current() !== expected) throw Error('main_changed')
            const parent=R.API_ROOT+'/actions/runs/45385556709'
            const run=await api('GET',parent)
            const artifacts=(await api('GET',parent+'/artifacts?per_page=10')).artifacts
            if (run.id!==45385556709 || run.repository.id!==1342493152 || run.head_sha!=='9838b4301727c7969ad0ff4dc585460c5d27986a' || run.head_branch!=='audit/anytour-hotel-ads-20261117' || run.event!=='push' || run.run_attempt!==1 || run.status!=='completed' || run.conclusion!=='success') throw Error('demand_rank_run_changed')
            if (artifacts.length!==1 || artifacts[0].id!==14915463382 || artifacts[0].name!=='first-party-hotel-entry-rank' || artifacts[0].expired || artifacts[0].digest!=='sha256:b41f4d47c1041204ed6830730d7ab8805af15a0647787aa5658eecca398314fe') throw Error('demand_rank_artifact_changed')
            const stopped=R.API_ROOT+'/actions/runs/45403192159'
            const previousRead=await api('GET',stopped)
            const oldArtifacts=(await api('GET',stopped+'/artifacts?per_page=10')).artifacts
            if(previousRead.head_sha!=='c31f69d4dcc5707669c643ee7ecd516ba1e3e027' || previousRead.head_branch!=='ops/1566-telegram-46-native-read-20261123' || previousRead.run_attempt!==1 || previousRead.repository.id!==1342493152 || previousRead.status!=='completed' || previousRead.conclusion!=='success' || oldArtifacts.length!==1 || oldArtifacts[0].id!==14923997818 || oldArtifacts[0].digest!=='sha256:c937ea1b3d3e7f1c0caa8c5b4a70c18e84a61f09ac120dade5e6000c7bb72a14') throw Error('previous_read_changed')
            const stoppedSide=R.API_ROOT+'/actions/runs/45516928385'
            const stoppedSideRun=await api('GET',stoppedSide)
            R.runIdentity(stoppedSideRun,{id:45516928385,attempt:1,head:'bb37e203976b58e4e2fd108f77ec79250d8cd8e1',workflow:'.github/workflows/read-1566-telegram-46-20261123.yml',event:'push',branch:'ops/1566-telegram-46-native-read-20261123',conclusion:'failure'})
            const stoppedJobs=R.boundedList(await api('GET',stoppedSide+'/attempts/1/jobs?per_page=100'),'jobs','previous_native_read_incomplete')
            if(stoppedJobs.length!==1||stoppedJobs[0].id!==138878647602||stoppedJobs[0].conclusion!=='failure')throw Error('previous_native_read_changed')
            const stoppedSteps=stoppedJobs[0].steps
            const stoppedGate=stoppedSteps.filter(s=>s.name==='Require current accepted release and actual application'&&s.conclusion==='failure')
            const notExecuted=['Bind immutable packet to the admitted release and native run','Pin established SSH host continuity and authentication identity','Read one new hotel source and its exact historical Telegram target']
            if(stoppedGate.length!==1||notExecuted.some(name=>stoppedSteps.filter(s=>s.name===name&&s.conclusion==='skipped'&&s.number>stoppedGate[0].number).length!==1))throw Error('previous_native_read_executed_or_unknown')
            if(R.boundedList(await api('GET',stoppedSide+'/artifacts?per_page=100'),'artifacts','previous_native_artifacts_incomplete').length!==0)throw Error('previous_native_observation_requires_readback')
            const prior9=R.API_ROOT+'/actions/runs/45528209335'
            const prior9Run=await api('GET',prior9)
            R.runIdentity(prior9Run,{id:45528209335,attempt:1,head:'6d2d191a95cf85829a6045fedebcaec5225ab78a',workflow:'.github/workflows/read-1566-telegram-46-20261123.yml',event:'push',branch:'ops/1566-telegram-46-native-read-20261123',conclusion:'success'})
            const prior9Jobs=R.boundedList(await api('GET',prior9+'/attempts/1/jobs?per_page=100'),'jobs','prior9_jobs_incomplete')
            if(prior9Jobs.length!==1||prior9Jobs[0].id!==138916711801||prior9Jobs[0].conclusion!=='success'||prior9Jobs[0].steps.filter(s=>s.name==='Read the nine prepared sources and historical targets without mutation'&&s.conclusion==='success').length!==1)throw Error('prior9_observation_changed')
            const prior9Artifacts=R.boundedList(await api('GET',prior9+'/artifacts?per_page=100'),'artifacts','prior9_artifacts_incomplete')
            if(prior9Artifacts.length!==1||prior9Artifacts[0].id!==14982204723||prior9Artifacts[0].size_in_bytes!==19890||prior9Artifacts[0].digest!=='sha256:cae7d3109ea5d55ae76d3d7a3e65549514c9a62b8419d99ec593a562cbe4e12f'||prior9Artifacts[0].expired)throw Error('prior9_original_changed')
            const prior5=R.API_ROOT+'/actions/runs/45531105688'
            const prior5Run=await api('GET',prior5)
            R.runIdentity(prior5Run,{id:45531105688,attempt:1,head:'1f0ab0a8024f6a473e5658026715d3b91a02c51e',workflow:'.github/workflows/read-1566-telegram-46-20261123.yml',event:'push',branch:'ops/1566-telegram-46-native-read-20261123',conclusion:'success'})
            const prior5Jobs=R.boundedList(await api('GET',prior5+'/attempts/1/jobs?per_page=100'),'jobs','prior5_jobs_incomplete')
            if(prior5Jobs.length!==1||prior5Jobs[0].id!==138926334781||prior5Jobs[0].conclusion!=='success'||prior5Jobs[0].steps.filter(s=>s.name==='Read the five frozen sources and historical targets without mutation'&&s.conclusion==='success').length!==1)throw Error('prior5_observation_changed')
            const prior5Artifacts=R.boundedList(await api('GET',prior5+'/artifacts?per_page=100'),'artifacts','prior5_artifacts_incomplete')
            if(prior5Artifacts.length!==1||prior5Artifacts[0].id!==14985261108||prior5Artifacts[0].size_in_bytes!==12179||prior5Artifacts[0].digest!=='sha256:931e597d9b937ad98cdcbdbfbd6a4f6c3e050c1f79bc4de9f8d2de59c0f7ca49'||prior5Artifacts[0].expired)throw Error('prior5_original_changed')
            const observed = await R.readRecord(api)
            const resolution = await R.resolveCurrent(api, {sha:expected}, observed)
            if (!resolution.ready || resolution.repository_sha !== expected || !/^[a-f0-9]{40}$/.test(resolution.application_sha)) throw Error('accepted_release_mismatch')
            await P.verifyPreviousRelease({repository:R.REPOSITORY,baseSha:expected}, token, fetch)
            const latest = await R.readRecord(api)
            if (latest.blob !== observed.blob || latest.record_digest !== observed.record_digest || await current() !== expected) throw Error('accepted_release_changed')
            fs.appendFileSync(process.env.GITHUB_ENV, 'REPOSITORY_SHA='+expected+'\nAPPLICATION_SHA='+resolution.application_sha+'\n')
          }
          check().catch(error => { console.error('read_release_refused', error.code || 'release_not_accepted'); process.exitCode=1 })
          NODE
      - name: Bind immutable packet to the admitted release and native run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = 'add19ac114d99ed1aef2bd36cac7c0596728454e'
          mkdir pub
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php')
          program=p.read_text()
          for name,pattern in [('APPLICATION_SHA',r'[a-f0-9]{40}'),('REPOSITORY_SHA',r'[a-f0-9]{40}'),('NATIVE_RUN_ID',r'[1-9][0-9]{0,19}')]:
              value=os.environ['GITHUB_RUN_ID' if name=='NATIVE_RUN_ID' else name]
              assert re.fullmatch(pattern,value) and program.count('__'+name+'__') == 1
              program=program.replace('__'+name+'__',value)
          pathlib.Path('pub/read-only.php').write_text(program)
          PY
          php -l pub/read-only.php
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('pub/read-only.php').read_text()
          a=re.search(r'function publicRetryLimit\([\s\S]*?(?=\nfunction runtimeRead)',s).group()
          b=re.search(r'function publicEvidence\([\s\S]*?(?=\nfunction publicRead)',s).group()
          stub="""<?php
          function reasonRead(Throwable $e): string { return $e->getMessage(); }
          function publicRead(string $channel,string $message): array {
           global $publicAttempts,$publicRateLimit;
           $publicAttempts++;
           if($message==='429') { $publicRateLimit=publicRetryLimit('17',1700000000); throw new RuntimeException('public_rate_limited'); }
           return ['url'=>'fixture','single_photo'=>true];
          }
          """
          checks="""
          function verifyFixture(bool $ok): void { if(!$ok)throw new RuntimeException('readonly_rate_contract_failed'); }
          verifyFixture(publicRetryLimit('17',1700000000)['resume_not_before_unix']===1700000017);
          verifyFixture(publicRetryLimit('Tue, 14 Nov 2023 22:14:20 GMT',1700000000)['retry_after_seconds']===60);
          verifyFixture(publicRetryLimit('0',1700000000)['retry_after_seconds']===0);
          verifyFixture(publicRetryLimit('tomorrow',1700000000)['resume_not_before_unix']===null);
          verifyFixture(publicRetryLimit('-1',1700000000)['retry_after_seconds']===null);
          verifyFixture(publicRetryLimit("17\\r\\nInject",1700000000)['retry_after_raw']===null);
          $publicAttempts=0; $publicRateLimit=null;
          $r=publicEvidence('fixture','ok'); verifyFixture($r['ok']&&$r['http_attempts']===1&&$publicAttempts===1);
          $r=publicEvidence('fixture','429'); verifyFixture(!$r['ok']&&$r['http_attempts']===1&&$publicAttempts===2);
          $r=publicEvidence('fixture','remaining'); verifyFixture(!$r['ok']&&$r['http_attempts']===0&&$publicAttempts===2&&$r['reason']==='public_retry_after_held');
          echo "READONLY_PUBLIC_429_CONTRACT=PASS\\n";
          """
          pathlib.Path('pub/read-rate-fixture.php').write_text(stub+a+b+checks)
          PY
          php pub/read-rate-fixture.php
          rm -f pub/read-rate-fixture.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read the thirty prepared sources and historical targets without mutation
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          status=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json || status=$?
          python3 - <<'PY'
          import json
          d=json.load(open('pub/registry.json'))
          if not d['ok']: print(json.dumps({k:d[k] for k in ('failure_stage','failure_reason') if k in d}))
          assert d['ok'] and d['operation']=='hotel_archive_telegram_ranked_registry'
          assert d['production_writes']==d['provider_writes']==d['bot_starts']==0
          assert [r['hotel_id'] for r in d['rows']]==[1501,2514,8964,1962,65020,36451,278,143372,7985,68984,233,66860,119046,37396,95159,57217,2931,98713,54914,4294,61591,2559,61760,1582,140013,262,71241,1292,20971,82751]
          assert [int(r['target_message_id']) for r in d['rows']]==[1047,1058,1103,1109,1548,1584,1585,1586,1620,1651,1653,1654,1665,1679,1695,1696,1700,1705,1706,1709,1723,1724,1735,1739,1741,1742,1743,1744,1746,1748]
          assert 0 < d['public_get_attempts'] <= 60
          assert d['public_get_attempts']==sum(r[p]['http_attempts'] for r in d['rows'] for p in ('source_public','target_public'))
          assert all(not r['preview_ready'] and 'prepared_target_snapshot_not_bound' in r['preview_blockers'] for r in d['rows'])
          assert isinstance(d['price_lease_held_ms'],int) and isinstance(d['read_elapsed_ms'],int)
          print(json.dumps({'checkpoint_sha256':d['checkpoint_sha256'],'read_at_utc':d['read_at_utc'],'rows':[{'hotel_id':r['hotel_id'],'target_message_id':r['target_message_id'],'preview_ready':r['preview_ready'],'blockers':r['preview_blockers'],'source_publication_id':(r['source_native'] or {}).get('publication_id'),'target_publication_id':(r['target_native'] or {}).get('publication_id')} for r in d['rows']]}))
          PY
          test "$status" -eq 0
      - name: Save the bounded native observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php





