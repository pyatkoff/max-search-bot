name: "#1566 Filter saved Telegram targets accepted by the current editor"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '0f60899e5b38f24bd635a63d0bee29b68851c376' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify the saved evidence without Telegram or production requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path
          
          def api(path):
              return subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}"],timeout=25)
          
          def original(run_id, artifact_id, head, expected, size):
              run = json.loads(api(f'actions/runs/{run_id}'))
              assert run['head_sha'] == head and run['conclusion'] == 'success'
              assert run['run_attempt'] == 1 and run['actor']['id'] == 226193297
              meta = json.loads(api(f'actions/artifacts/{artifact_id}'))
              assert meta['workflow_run']['id'] == run_id and meta['workflow_run']['head_sha'] == head
              assert not meta['expired'] and meta['size_in_bytes'] == size and meta['digest'] == 'sha256:' + expected
              raw = api(f'actions/artifacts/{artifact_id}/zip')
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == expected
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  member = 'archive-windows.json'
                  assert len(archive.infolist()) <= 80 and sum(n.file_size for n in archive.infolist()) <= 20000000
                  assert archive.testzip() is None and archive.namelist().count(member) == 1
                  assert 0 < archive.getinfo(member).file_size <= 6000000
                  result = json.loads(archive.read(member))
              assert result['native_run_id'] == str(run_id) and result['reader_source_sha'] == head
              assert result['write_admission'] is False and result.get('provider_writes') == 0
              return result
          
          sources = [
              (45712028502,15068705593,'7bcb1a2bc75307c9fbfb0883c9e63e5a06b34ecf','fae24abadd6f99b39097879138ccfb9066503f2a80b578275d8bf8088d26f190',189033),
              (45712298154,15069010253,'c4fb63bf63544006c3de711d3d48c9b8d807ee8f','2afa5644b95e3f2f4226c995491336e94eb1f9e8227c8bc65db66c642af7ea7f',172556),
              (45747718941,15083853001,'4a80c9b86444d30462e8371f8be9c854a3aebbe5','a5f9edd963c476f4e3f003f4f83007644e2b4d607fa9c49a608dad52fcf14d77',711069),
              (45747898971,15083559015,'e728c0aff8d2656c8529b299ceb5adfba99e214d','2c4919e754273a8bee9c63704eff165800e67d118f07c66eeee7f2b09ff6c875',379064),
              (45793051934,15103676430,'76b976406945de03bf273bf1884c56a9c65d004f','3d06b3fc214abd2ed02dc435ce50379d66ccf017900f9846eaee8d9bc351758b',438249),
          ]
          observations = defaultdict(list)
          for source in sources:
              result = original(*source)
              for row in result['rows']:
                  mid = str(row['target_message_id'])
                  assert re.fullmatch(r'[1-9][0-9]{0,9}', mid)
                  observations[int(mid)].append((source[0], row))
          
          reserved = {288, 292, 328, 476, 567, 588, 774, 831, 842, 862, 912, 957,
                      1047, 1058, 1083, 1535, 1666, 1701, 1702, 1705, 1706, 1712, 1713, 1725}
          protected = re.compile(r'отзыв|впечатлен|впечатлён|наши турист|наша турист|туристы вернул|туристы поделил|видео|видеотур|наш менеджер|лично проверил|по мнению|делится|рекомендуют|booking\s*[0-9]', re.I)
          commercial = re.compile(r'горящ|подборк|пут[её]вк|предложени|туры?\b|стоимост|\bцен[ауы]|\b₽|брониров|вылет|бюджет|приобрест|поездк', re.I)
          hexhash = re.compile(r'[a-f0-9]{64}')
          counts = Counter()
          candidates = []
          for mid, copies in sorted(observations.items()):
              bodies = [row['public'] for _, row in copies if isinstance(row.get('public'), dict)]
              if mid in reserved:
                  counts['known_held_or_completed'] += 1
              elif not bodies or any(body.get('url') != f'https://t.me/anytour/{mid}' for body in bodies):
                  counts['no_exact_identity'] += 1
              elif any(row.get('protected_text_hint') is True for _, row in copies) or any(protected.search(body.get('caption') or '') for body in bodies):
                  counts['protected_text'] += 1
              elif any(body.get('single_photo') is not True or body.get('video_count') != 0 or body.get('roundvideo_count') != 0 for body in bodies):
                  counts['other_media'] += 1
              elif any(body.get('buttons') != [] or body.get('caption_links') != [] for body in bodies):
                  counts['keyboard_or_caption_link'] += 1
              elif not all(commercial.search(body.get('caption') or '') for body in bodies):
                  counts['unclassified_text'] += 1
              else:
                  identity = {(b.get('caption_sha256'), b.get('photo_marker_sha256'), b.get('published_unixtime')) for b in bodies}
                  if len(identity) != 1:
                      counts['conflicting_snapshots'] += 1
                      continue
                  caption_sha, photo_sha, published = next(iter(identity))
                  if not (isinstance(published, int) and published > 0 and all(hexhash.fullmatch(x or '') for x in (caption_sha,photo_sha))):
                      counts['no_exact_identity'] += 1
                      continue
                  counts['public_candidates'] += 1
                  candidates.append({'target_mid':mid,'caption_sha256':caption_sha,'photo_marker_sha256':photo_sha,
                                     'published_unixtime':published,'archive_runs':sorted({n for n,row in copies if isinstance(row.get('public'),dict)}),
                                     'native_occupancy_verified':False,'actual_photo_review_complete':False,'write_admission':False})
          assert sum(counts.values()) == len(observations)
          result = {'issue':1566,'operation':'saved_empty_keyboard_candidates','write_admission':False,
                    'production_writes':0,'provider_writes':0,'server_calls':0,'telegram_reads':0,'unique_mids':len(observations),
                    'source_runs':[s[0] for s in sources],'counts':dict(counts),'candidates':candidates}
          Path('target-candidates.json').write_text(json.dumps(result, separators=(',',':')) + '\n')
          print(json.dumps({k:v for k,v in result.items() if k != 'candidates'}, sort_keys=True))
          print('candidate_mids=' + ','.join(str(r['target_mid']) for r in candidates))
          PY
      - name: Preserve the candidate facts for the existing writer preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-existing-editor-candidates
          path: target-candidates.json
          if-no-files-found: error
          retention-days: 7
