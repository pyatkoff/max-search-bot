name: "#1566 Read the fourteen additional source publications from the accepted demand snapshot"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
# Bounded reads of 14 published sources; no provider writes; strict actual application fences.
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '80d3824cb0d8e89dbe3893fc6071a985d70594be' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact candidate packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out main for the existing release verifier
        uses: actions/checkout@v4
        with:
          ref: 1e9a88c7418f8e1af171571ef1df66f2856968e4
          path: accepted
          persist-credentials: false
      - name: Authenticate original1724 terminal before bounded host observation
        working-directory: accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN), before=await R.readRecord(api);
            const r=R.validateRelease(before.record).release, expected='1e9a88c7418f8e1af171571ef1df66f2856968e4';
            if(r.repository_sha!==expected||r.application_sha!==expected||r.kind!=='installed'||
              r.release.run_id!=='45883181416'||r.release.run_attempt!==1||r.closure?.run_id!=='45885250607'||
              r.closure?.binding?.pr!==1724||r.closure?.binding?.comment_id!==6818332618||
              r.closure?.binding?.owner_id!==226193297)throw Error('original1724_changed');
            const resolved=await R.resolveCurrent(api,{sha:expected},before);
            if(!resolved.ready||resolved.repository_sha!==expected||resolved.application_sha!==expected)throw Error('installation_not_accepted');
            const main=(await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha;
            if(main!==expected)throw Error('main_changed');
            const after=await R.readRecord(api);
            if(before.blob!==after.blob||before.record_digest!==after.record_digest)throw Error('accepted_record_changed');
            fs.mkdirSync('../pub',{recursive:true});
            fs.writeFileSync('../pub/accepted-read-admission.json',JSON.stringify({read_only:true,current_main_sha:main,
              application_sha:expected,write_admission:false,canonical:resolved,record_commit:before.commit,record_blob:before.blob,
              original_installation_deploy:r.release.run_id,original_closer:r.closure.run_id,checked_at_utc:new Date().toISOString()})+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'REPOSITORY_SHA='+expected+'\nAPPLICATION_SHA='+expected+'\n');
          }
          check().catch(e=>{console.error('readonly_accepted_installation_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Bind immutable packet to the admitted release and native run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = '9931623d23b085d2f344dde163b8d75e6982a753'
          mkdir -p pub
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php')
          program=p.read_text()
          for name,pattern in [('APPLICATION_SHA',r'[a-f0-9]{40}'),('REPOSITORY_SHA',r'[a-f0-9]{40}'),('NATIVE_RUN_ID',r'[1-9][0-9]{0,19}')]:
              value=os.environ['GITHUB_RUN_ID' if name=='NATIVE_RUN_ID' else name]
              assert re.fullmatch(pattern,value) and program.count('__'+name+'__') == 1
              program=program.replace('__'+name+'__',value)
          # Execute the reviewed reader helpers for source-only preparation.
          # Preserve candidate holds and read-only SQL.
          assert program.count("$out=['schema'=>1") == 1
          program=program[:program.index("$out=['schema'=>1")]
          entry=r'''
          $out=['schema'=>1,'issue'=>1566,'operation'=>'hotel_rank14_source_preparation','ok'=>false,
            'repository_sha'=>REPOSITORY_SHA,'application_sha'=>APPLICATION_SHA,'native_run_id'=>NATIVE_RUN_ID,
            'production_writes'=>0,'provider_writes'=>0,'bot_starts'=>0,'write_admission'=>false,'rows'=>[]];
          $pdo=null;$start=hrtime(true);
          try {
            runtimeRead();
            requireRead(realpath(OPERATIONS)===OPERATIONS,'operations_root_changed');
            $out['resources_before']=resourcesRead();
            $out['resource_budget']=serverReadBudgetRead($out['resources_before']);
            requireRead($out['resource_budget']['allowed'],'server_resource_hold');
            ob_start();try{
              require APP.'/config.php';
              require_once APP.'/services/ProjectConfig.php';
              require_once APP.'/services/ChannelPostRegistryService.php';
              require_once APP.'/services/ChannelPostButtonTransport.php';
              require_once APP.'/services/ChannelPostRuntime.php';
              require_once APP.'/hotel-posts-telegram-main19.php';
            }finally{ob_end_clean();}
            requireRead(ProjectConfig::projectId()==='anytour','project_changed');
            $feed=anytourTelegramFeedOfferUrls(anytourTelegramFeedRead());
            $routes=anytourTelegramFeedDestinationPosts($feed);
            $pdo=ConversationDb::connection();
            $pdo->exec('SET SESSION TRANSACTION READ ONLY');
            $registry=new ChannelPostRegistryService($pdo);
            $channel=$registry->channel('anytour','telegram','anyru_bot','-1001845835645');
            requireRead(is_array($channel)&&(int)$channel['id']===6,'channel_identity_changed');
            $out['mysql_before']=mysqlResourcesRead($pdo);
            $transactionStart=hrtime(true);
            $pdo->beginTransaction();
            $ranked=json_decode(<<<'HOTEL_RANK_SCOPE'
          [{"hotel_id":7458,"source_mid":"684","name":"Four Seasons Resort The Nam Hai, Hoi An","dialogues":3},{"hotel_id":1569,"source_mid":"571","name":"Utopia World","dialogues":2},{"hotel_id":1033,"source_mid":"212","name":"Barut Hemera","dialogues":1},{"hotel_id":1096,"source_mid":"302","name":"Club Hotel Phaselis Rose","dialogues":1},{"hotel_id":1124,"source_mid":"421","name":"Club Hotel Sidelya","dialogues":1},{"hotel_id":1143,"source_mid":"235","name":"Crystal Paraiso Aqua Collection","dialogues":1},{"hotel_id":1149,"source_mid":"741","name":"Qvor Kirman Premium","dialogues":1},{"hotel_id":1196,"source_mid":"440","name":"Viking Garden Hotel & Spa","dialogues":1},{"hotel_id":1246,"source_mid":"351","name":"Holiday Park Resort","dialogues":1},{"hotel_id":1257,"source_mid":"251","name":"Bellis Deluxe Hotel","dialogues":1},{"hotel_id":1258,"source_mid":"280","name":"IC Hotels Green Palace","dialogues":1},{"hotel_id":1354,"source_mid":"197","name":"Mirage Park Resort","dialogues":1},{"hotel_id":1420,"source_mid":"540","name":"Papillon Ayscha","dialogues":1},{"hotel_id":1456,"source_mid":"362","name":"Sealife Kemer Resort","dialogues":1}]
          HOTEL_RANK_SCOPE,true,32,JSON_THROW_ON_ERROR);
            $sourceReady=0;
            $largeDuplicate=$pdo->prepare("SELECT p.id FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id=6 AND (JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id'))=? OR JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.logical_id')) IN (?,?)) LIMIT 2");
            foreach($ranked as $rank) {
              if((hrtime(true)-$transactionStart)>750000000){$out['remaining_reason']='bounded_transaction_budget';break;}
              $hotel=(int)$rank['hotel_id'];
              $item=$rank+['write_admission'=>false,'public_preimage_checked'=>false];
              try{
                requireRead($hotel>0&&!preg_match('~доминикан|dominican|punta cana~iu',$rank['name']),'excluded_country');
                $feedUrl=$feed['tg_'.$hotel]??null;$routeUrl=$routes['tg_'.$hotel]??null;
                $item+=['feed_source_url'=>$feedUrl,'current_destination'=>$routeUrl];
                requireRead(is_string($feedUrl)&&preg_match('~\\Ahttps://t\\.me/any_toour/([1-9][0-9]{0,9})\\z~D',$feedUrl,$match)===1,'source_not_current_small_feed');
                $sourceMid=$match[1];
                requireRead($sourceMid===$rank['source_mid'],'source_mid_changed_since_public_read');
                $largeDuplicate->execute([(string)$hotel,'commercial-hotel-'.$hotel.'-v1','commercial-main-hotel-'.$hotel.'-v1']);
                $item['hotel_existing_large_matches']=count($largeDuplicate->fetchAll(PDO::FETCH_COLUMN));
                requireRead($item['hotel_existing_large_matches']===0,'hotel_already_reserved_or_published');
                requireRead($routeUrl===$feedUrl,'route_already_changed_or_unconfirmed');
                $source=publicationRead($pdo,$registry,10,$sourceMid);
                requireRead(is_array($source),'source_native_publication_unavailable');
                $media=$source['attachments']??[];
                $item+=['source_mid'=>$sourceMid,'source_publication_id'=>$source['publication_id'],
                  'source_version_id'=>$source['version_id'],'source_content_hash'=>$source['content_hash'],
                  'source_caption_sha256'=>$source['caption_sha256'],
                  'source_exact_hotel'=>(int)($source['hotel_id']??0)===$hotel,
                  'source_sent'=>$source['state']==='sent','source_one_live_button'=>$source['current_token_resolves']&&$source['one_expected_button'],
                  'source_held'=>$source['native_claim_held_or_unknown'],
                  'source_reusable_photo'=>count($media)===1&&($media[0]['reusable_telegram_photo']??false)];
                requireRead($item['source_exact_hotel']&&$item['source_sent']&&$item['source_one_live_button']&&!$item['source_held']&&$item['source_reusable_photo'],'source_current_identity_hold');
                $item+=['preparation_state'=>'native_source_candidate','next_gate'=>'compare_published_preimage_and_find_reviewed_target'];
                ++$sourceReady;
              }catch(Throwable $e){$item['hold_reason']=reasonRead($e);}
              $out['rows'][]=$item;
            }
            $out['rank_scope_count']=count($ranked);$out['rank_observed_count']=count($out['rows']);
            $out['native_source_candidates']=$sourceReady;$out['candidate_pairs_prepared']=0;$out['ready_to_write']=0;
            $out['demand_source']='original44654456925/artifact14592532135; issue1566/comment7201739471';
            $out['demand_period_moscow']='2026-11-13/2026-11-19';$out['offer_clicks_verified']=false;
                      $pdo->rollBack();
            $out['transaction_ms']=round((hrtime(true)-$transactionStart)/1000000,2);
            $out['mysql_after']=mysqlResourcesRead($pdo);
            runtimeRead();
            $out['ok']=true;
          }catch(Throwable $e){$out['failure_reason']=reasonRead($e);}
          finally {if($pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();}
          $out['resources_after']=resourcesRead();
          $out['elapsed_ms']=round((hrtime(true)-$start)/1000000,2);
          echo jsonRead($out),PHP_EOL;
          exit($out['ok']?0:2);
          '''
          pathlib.Path('pub/read-only.php').write_text(program+entry)
          PY
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Observe the fourteen exact sources, current registry and route without writing
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          status=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json || status=$?
          python3 - <<'PY'
          import json
          d=json.load(open('pub/registry.json'))
          assert d['operation']=='hotel_rank14_source_preparation' and d['issue']==1566
          assert d['production_writes']==d['provider_writes']==d['bot_starts']==0 and d['write_admission'] is False
          print(json.dumps(d,ensure_ascii=False))
          PY
          test "$status" -eq 0
      - name: Preserve the original bounded source observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-source-target-preparation
          path: |
            pub/registry.json
            pub/accepted-read-admission.json
          retention-days: 7
          if-no-files-found: warn

