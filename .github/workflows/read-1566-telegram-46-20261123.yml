name: "#1566 Read the actual Vilamendhoo advertising route and both public receipts"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '3d21cbcf0f04709a2b83898337b7718a7680a48c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61e05da2e6bcf88082a9a6bb46858d05040a603f
          persist-credentials: false
      - name: Read current route and verify its evidence without sending Telegram calls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          from tools.verify_installed_telegram_routes import get_ad
          def raw(path):
              return subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}"],timeout=25)
          def report(run_id,artifact_id,digest):
              run=json.loads(raw(f'actions/runs/{run_id}'))
              meta=json.loads(raw(f'actions/artifacts/{artifact_id}'))
              assert run['run_attempt']==1 and run['status']=='completed' and meta['workflow_run']['id']==run_id
              content=raw(f'actions/artifacts/{artifact_id}/zip')
              assert meta['digest']=='sha256:'+digest and hashlib.sha256(content).hexdigest()==digest
              with zipfile.ZipFile(io.BytesIO(content)) as z:
                  assert z.namelist()==['ranked-public-readback.json'] and z.testzip() is None
                  result=json.loads(z.read('ranked-public-readback.json'))
              assert result['run_id']=='45799514607' and result['artifact_id']=='15106696904'
              assert result['provider_write_attempts']==0 and result['read_only'] is True
              return result
          early=report(45799596463,15106048310,'4e9072d5a6aa20e7284a2b154d6f4c7ce02d6be0c4870d9d008ec63f2368b0d1')
          late=report(45799877337,15107016255,'8b0d8d0e8520bad522b5d70c4ab2f7f890b44effbf075455566ed763e976b46d')
          old=next(iter(early['plans'].values()))
          now=next(iter(late['plans'].values()))
          assert now['public_verified']==1 and now['verified_destinations']==[{'hotel_id':2490,
              'source_url':'https://t.me/any_toour/685','post_url':'https://t.me/anytour/912','publication_id':3877,'version_id':17257}]
          route=get_ad({'offer_id':'tg_2490','post_url':'https://t.me/anytour/912'})
          out={'transfer_run':45799514607,'first_public_run':45799596463,'first_public_checks':old['results'],
              'independent_repeat':45799877337,'public_verified':now['public_verified'],'route':route,'writes':0}
          print(json.dumps(out,ensure_ascii=False))
          Path('receipt.json').write_text(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-vilamendhoo-route-read
          path: receipt.json
          retention-days: 7
          if-no-files-found: error
