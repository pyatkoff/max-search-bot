name: "#1566 Prepare ranked Telegram transfer data"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['config/anytour_ranked_reader_pairs.json', '.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
# Bounded selection of existing Telegram pairs. Only the accepted application may be observed over SSH.
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.deleted == false && github.event.after == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact candidate packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit the exact data-only change and validate the candidate packet
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          MANIFEST = 'config/anytour_ranked_reader_pairs.json'
          WORKFLOW = '.github/workflows/read-1566-telegram-46-20261123.yml'
          READER = 'tools/direct_demand/operations/read-1566-telegram-46-20261123.php'
          WORKFLOW_UPGRADE_PARENT = 'af4bf3b062986e848c2b81a13954435281c32e47'
          WORKFLOW_UPGRADE_MANIFEST = '90a7ec7eba5029b59764b69d198c97ae5d4cae47'
          LEGACY_OBSERVATION_UPGRADE_PARENT = '496781f9b2978308a5d08a796588f112c6db0192'
          SOURCE_IDENTITY_PAIR = {
              'hotel_id': 61591,
              'source_mid': '390',
              'source_publication_id': None,
              'target_mid': '1723',
              'target_published_unixtime': 1789806371,
              'target_caption_sha256': '80ee79942213ba727e2eb6e6ba8166dd8a57ae04b80b97cc792dbceebb4a5946',
              'target_photo_marker_sha256': 'd85aced32b96ce675cb067e10c4d41f8d283f4d1a21efdb2bc61f80eef73c267',
          }
          # Only hash-backed legacy targets admitted here. No arbitrary MID or href.
          # /1723: 15083853001 public DOM, 15028802242 paired views, 15266837922 native source.
          LEGACY_TARGETS = {61591: {
              'row': dict(SOURCE_IDENTITY_PAIR, source_publication_id=876),
              'price_href_sha256': '246a9ed6444e8978100b5adabb68f4c90bd924380e018df647a98e1d31d75b3b',
              'keyboard_href_sha256': '5a7e4f1dc3c08a29a685cbcaf0e01d6a190d0c1c7c192b00d766f245ee557e2a',
          }}
          FIELDS = {
              'hotel_id', 'source_mid', 'source_publication_id', 'target_mid',
              'target_published_unixtime', 'target_caption_sha256', 'target_photo_marker_sha256',
          }

          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args]).decode()

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate JSON field')
                  result[key] = value
              return result

          def check():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              before, head = event['before'], os.environ['GITHUB_SHA']
              assert re.fullmatch(r'[a-f0-9]{40}', before) and re.fullmatch(r'[a-f0-9]{40}', head)
              assert event['after'] == head and git('rev-parse', 'HEAD').strip() == head
              assert git('rev-list', '--parents', '-n', '1', head).split() == [head, before]
              changes = set(git('diff-tree', '--no-commit-id', '--no-renames', '--name-status', '-r',
                                before, head).splitlines())
              expected = ({'M\t' + WORKFLOW, 'M\t' + MANIFEST} if before == WORKFLOW_UPGRADE_PARENT
                          else {'M\t' + MANIFEST})
              if before == LEGACY_OBSERVATION_UPGRADE_PARENT:
                  expected |= {'M\t' + WORKFLOW, 'M\t' + READER}
              assert changes == expected, 'unexpected commit scope'
              assert re.fullmatch(r'100644 blob [a-f0-9]{40}\t' + re.escape(MANIFEST) + r'\n',
                                  git('ls-tree', head, '--', MANIFEST))
              if before == WORKFLOW_UPGRADE_PARENT:
                  assert git('hash-object', MANIFEST).strip() == WORKFLOW_UPGRADE_MANIFEST
              raw = Path(MANIFEST).read_bytes()
              assert 0 < len(raw) <= 8192
              packet = json.loads(raw, object_pairs_hook=unique_object)
              assert type(packet) is dict and set(packet) == {'schema', 'pairs'}
              assert type(packet['schema']) is int and packet['schema'] in (1, 2)
              legacy_target_only = packet['schema'] == 2
              if before == LEGACY_OBSERVATION_UPGRADE_PARENT:
                  assert legacy_target_only
              rows = packet['pairs']
              assert type(rows) is list and 1 <= len(rows) <= 5
              identity_only = not legacy_target_only and rows == [SOURCE_IDENTITY_PAIR]
              normalized = {}
              source_mids, target_mids, publications = set(), set(), set()
              for row in rows:
                  assert type(row) is dict and set(row) == FIELDS
                  hotel, publication, date = (row[key] for key in
                                              ('hotel_id', 'source_publication_id', 'target_published_unixtime'))
                  assert all(type(n) is int and 0 < n <= 2147483647 for n in (hotel, date))
                  if identity_only:
                      assert publication is None
                  else:
                      assert type(publication) is int and 0 < publication <= 2147483647
                  source, target = row['source_mid'], row['target_mid']
                  assert all(type(n) is str and re.fullmatch(r'[1-9][0-9]{0,9}', n)
                             for n in (source, target))
                  assert hotel not in normalized and publication not in publications
                  assert source not in source_mids and target not in target_mids
                  caption, photo = row['target_caption_sha256'], row['target_photo_marker_sha256']
                  assert all(type(n) is str and re.fullmatch(r'[a-f0-9]{64}', n) for n in (caption, photo))
                  source_mids.add(source)
                  target_mids.add(target)
                  publications.add(publication)
                  normalized[hotel] = dict(source=source, source_publication=publication, target=target,
                                           target_date=date, target_caption=caption, target_photo=photo)
                  if identity_only:
                      normalized[hotel]['source_identity_only'] = True
                  if legacy_target_only:
                      proof = LEGACY_TARGETS.get(hotel)
                      assert proof is not None and row == proof['row'], 'unreviewed legacy target'
                      normalized[hotel]['legacy_target_observation'] = {
                          k: proof[k] for k in ('price_href_sha256', 'keyboard_href_sha256')}
              digest = hashlib.sha256(raw).hexdigest()
              Path('pub/validated-pairs.json').write_text(json.dumps(normalized, separators=(',', ':')))
              with Path(os.environ['GITHUB_ENV']).open('a') as output:
                  output.write('RANKED_READER_PACKET_SHA=' + digest + '\n')
                  output.write('RANKED_LEGACY_TARGET_ONLY=' + ('1' if legacy_target_only else '0') + '\n')
              print(f'Authenticated candidate data {digest}: {len(normalized)} pair(s)')

          check()
          PY
      - name: Check out main for the existing release verifier
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          path: accepted
          persist-credentials: false
      - name: Authenticate the current accepted release before bounded host observation
        working-directory: accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const release = require('./tools/deployment_release');

          function currentMain(api) {
            return api('GET', release.API_ROOT + '/git/ref/heads/main').then(ref => ref.object.sha);
          }

          async function check() {
            const repositorySha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const api = release.makeReadApi(process.env.GITHUB_TOKEN);
            if (!release.sha(repositorySha) || await currentMain(api) !== repositorySha) {
              throw Error('main_changed');
            }

            const before = await release.readRecord(api);
            const { release: accepted, installation } = release.validateRelease(before.record);
            if (accepted.release.run_attempt !== 1) throw Error('unsupported_installation_attempt');
            let resolved;
            let observationOnly = false;
            const exactInstallation = accepted.kind === 'installed' &&
              accepted.repository_sha === accepted.application_sha;
            const pendingExactInstall = accepted.phase === 'pending_closure' && exactInstallation;
            const pendingCurrentInstall = pendingExactInstall && accepted.repository_sha === repositorySha;
            // The canonical resolver accepts a verified installation without a release-slot
            // binding. A previously accepted installation can support observation only.
            const unboundExactInstall = pendingExactInstall &&
              await release.currentBinding(api, accepted.repository_sha) === null;
            if ((accepted.phase === 'pending_terminal' && release.positive(accepted.closure?.run_id)) ||
                unboundExactInstall) {
              await release.requireAncestry(api, accepted.repository_sha, repositorySha);
              resolved = await release.resolveCurrent(api, { sha: accepted.repository_sha }, before);
              if (!resolved.ready || resolved.repository_sha !== accepted.repository_sha ||
                  resolved.application_sha !== accepted.application_sha || resolved.kind !== accepted.kind) {
                throw Error('installation_not_accepted');
              }
              if (unboundExactInstall && !pendingCurrentInstall) observationOnly = true;
            } else if (pendingCurrentInstall) {
              // The verified installation may be observed, with no write admission.
              await release.authenticatePublication(api, before);
              await release.requireOps(api, repositorySha);
              observationOnly = true;
              resolved = { repository_sha: repositorySha, application_sha: repositorySha,
                kind: accepted.kind, ready: false, perform_actions: false };
            } else {
              throw Error('current_release_terminal_unavailable');
            }

            // Retain interoperability with installed publisher workflows from before
            // snapshot support, so an independent reader rollout does not stop writes.
            const writerPath = release.PREFIX + 'edit-1566-ranked-46-historical-telegram.yml';
            const writer = await api('GET', release.API_ROOT + '/contents/' + writerPath
              + '?ref=' + resolved.application_sha);
            if (writer?.type !== 'file' || writer.path !== writerPath || writer.encoding !== 'base64'
                || typeof writer.content !== 'string' || !Number.isSafeInteger(writer.size)
                || writer.size < 1 || writer.size > 64000) {
              throw Error('installed_writer_contract_unconfirmed');
            }
            const writerBytes = Buffer.from(writer.content.replace(/\n/g, ''), 'base64');
            if (writerBytes.length !== writer.size || release.gitBlob(writerBytes) !== writer.sha) {
              throw Error('installed_writer_contract_changed');
            }
            const readOnlySnapshot = writerBytes.includes('--allow-read-only-snapshot');
            if (observationOnly && !readOnlySnapshot) throw Error('installed_snapshot_not_supported');

            const after = await release.readRecord(api);
            if (before.blob !== after.blob || before.record_digest !== after.record_digest) {
              throw Error('accepted_record_changed');
            }
            if (await currentMain(api) !== repositorySha) throw Error('main_changed');

            const baselineCurrent = !observationOnly && resolved.repository_sha === repositorySha &&
              resolved.application_sha === repositorySha;
            if (process.env.RANKED_LEGACY_TARGET_ONLY === '1' &&
                (!baselineCurrent || !readOnlySnapshot || accepted.phase !== 'pending_terminal' ||
                 !release.positive(accepted.closure?.run_id))) {
              throw Error('legacy_observation_requires_current_closed_app');
            }
            fs.mkdirSync('../pub', { recursive: true });
            fs.writeFileSync('../pub/accepted-read-admission.json', JSON.stringify({
              read_only: true, current_main_sha: repositorySha, application_sha: resolved.application_sha,
              read_only_snapshot: readOnlySnapshot,
              observation_only: observationOnly,
              write_admission: false, baseline_current_for_writer: baselineCurrent, canonical: resolved,
              record_commit: before.commit, record_blob: before.blob,
              original_installation_deploy: installation.run_id,
              original_closer: accepted.closure?.run_id ?? null, checked_at_utc: new Date().toISOString()
            }) + '\n');
            console.log('Accepted Telegram read baseline', repositorySha, resolved.application_sha,
              installation.run_id, accepted.closure?.run_id ?? null, 'current_for_writer=' + baselineCurrent,
              'observation_only=' + observationOnly);
            fs.appendFileSync(process.env.GITHUB_ENV,
              'REPOSITORY_SHA=' + repositorySha + '\nAPPLICATION_SHA=' + resolved.application_sha +
              '\nRANKED_BASELINE_CURRENT=' + (baselineCurrent ? '1' : '0') +
              '\nRANKED_READ_ONLY_SNAPSHOT=' + (readOnlySnapshot ? '1' : '0') +
              '\nRANKED_OBSERVATION_ONLY=' + (observationOnly ? '1' : '0') + '\n');
          }
          check().catch(error => {
            console.error('readonly_accepted_installation_refused', error.code || error.message);
            process.exitCode = 1;
          });
          NODE
      - name: Bind immutable packet to the admitted release and native run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = 'fb737675bd373f53195584bba01916484d133665'
          mkdir -p pub
          python3 - <<'PY'
          import base64,os,pathlib,re
          p=pathlib.Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php')
          program=p.read_text()
          for name,pattern in [('APPLICATION_SHA',r'[a-f0-9]{40}'),('REPOSITORY_SHA',r'[a-f0-9]{40}'),('NATIVE_RUN_ID',r'[1-9][0-9]{0,19}')]:
              value=os.environ['GITHUB_RUN_ID' if name=='NATIVE_RUN_ID' else name]
              assert re.fullmatch(pattern,value) and program.count('__'+name+'__') == 1
              program=program.replace('__'+name+'__',value)
          baseline = os.environ['RANKED_BASELINE_CURRENT']
          snapshot = os.environ['RANKED_READ_ONLY_SNAPSHOT']
          observation = os.environ['RANKED_OBSERVATION_ONLY']
          assert all(value in ('0', '1') for value in (baseline, snapshot, observation))
          assert observation != '1' or (baseline, snapshot) == ('0', '1')
          # Execute the reviewed reader helpers for the admitted candidate packet.
          # Candidate holds and SQL read-only mode remain mandatory.
          assert program.count("$out=['schema'=>1") == 1
          program=program[:program.index("$out=['schema'=>1")]
          entry=r'''function rankedPreparationAdmission(array $blockers,bool $snapshot,bool $shared,bool $baselineCurrent,bool $observationOnly=false):array {
           $prepared=$blockers===[];
           if(!$snapshot&&!$shared)$blockers[]='price_shared_lease_not_acquired';
           if($observationOnly||(!$snapshot&&!$baselineCurrent))$blockers[]='accepted_application_not_current_for_writer';
           return ['preparation_ready'=>$prepared,'preview_ready'=>$blockers===[],'preview_blockers'=>$blockers];
          }
          function assertTelegramPriceLeaseInode($file, string $path): void {
           clearstatcache(true,$path);
           $current=lstat($path);
           $opened=fstat($file);
           requireRead(!is_link($path)&&is_array($current)&&is_array($opened)
             &&$current['dev']===$opened['dev']&&$current['ino']===$opened['ino'],'price_editor_lease_unknown');
          }
          function tryLegacyTelegramSharedPriceLease($file,string $path):bool {
           assertTelegramPriceLeaseInode($file,$path);
           if(flock($file,LOCK_SH|LOCK_NB,$wouldBlock)){
            assertTelegramPriceLeaseInode($file,$path);
            return true;
           }
           requireRead($wouldBlock===1,'price_editor_lease_unknown');
           return false;
          }
          $snapshot=__RANKED_READ_ONLY_SNAPSHOT__;
          $observationOnly=__RANKED_OBSERVATION_ONLY__;
          $out=['schema'=>1,'issue'=>1566,'operation'=>'hotel_archive_telegram_ranked_registry','ok'=>false,
           'repository_sha'=>$snapshot?APPLICATION_SHA:REPOSITORY_SHA,'application_sha'=>APPLICATION_SHA,
           'observed_main_sha'=>REPOSITORY_SHA,'native_run_id'=>NATIVE_RUN_ID,'native_run_attempt'=>1,
           'production_writes'=>0,'provider_writes'=>0,'bot_starts'=>0,'write_admission'=>false,
           'baseline_current_for_writer'=>__RANKED_BASELINE_CURRENT__,
           'observation_only'=>$observationOnly,
           'reader_packet_sha256'=>'__RANKED_READER_PACKET_SHA__','rows'=>[]];
          $pdo=null;$lock=null;$acquired=null;$rates=[];$start=hrtime(true);$stage='runtime';
          $pairs=json_decode(base64_decode('__VALIDATED_RANKED_PAIRS__',true),true,16,JSON_THROW_ON_ERROR);
          $identityOnly=count($pairs)===1&&($pairs[61591]['source_identity_only']??false)===true;
          $legacyTargetOnly=$pairs!==[]&&count(array_filter($pairs,static fn(array $pair):bool=>isset($pair['legacy_target_observation'])))===count($pairs);
          if($identityOnly){
           $out['source_identity_only']=true;
           $out['observation_only']=true;
           $out['baseline_current_for_writer']=false;
          }
          if($legacyTargetOnly){
           $out['legacy_target_observation_only']=true;
           $out['legacy_evidence_complete']=false;
           $out['observation_only']=true;
           $out['baseline_current_for_writer']=false;
          }
          try {
           runtimeRead();requireRead(realpath(OPERATIONS)===OPERATIONS,'operations_root_changed');
           for($sample=0;$sample<3;++$sample){
            if($sample>0)sleep(20);
            $out['resources_before']=resourcesRead();
            $out['resource_budget']=serverReadBudgetRead($out['resources_before']);
            $pressure=[];
            foreach(['cpu','io'] as $kind) {
             $value=@file_get_contents('/proc/pressure/'.$kind,false,null,0,512);
             $pressure[$kind]=is_string($value)&&preg_match('/^some avg10=([0-9]+(?:\.[0-9]+)?) /',$value,$m)
                ? (float)$m[1] : null;
            }
            $out['resource_observations'][]=$out['resource_budget']+[
             'memory_available_kb'=>$out['resources_before']['memory_kb']['MemAvailable'],
             'pressure_some_avg10'=>$pressure];
            if($out['resource_budget']['allowed'])break;
           }
           requireRead($out['resource_budget']['allowed'],'server_resource_hold');
           runtimeRead();
           if($identityOnly){
            $stage='source_identity_390';
            requireRead($pairs[61591]['source']==='390'&&$pairs[61591]['source_publication']===null,'source_identity_scope_changed');
            ob_start();try{
             require APP.'/config.php';
             require_once APP.'/services/ProjectConfig.php';
             require_once APP.'/services/ChannelPostRegistryService.php';
             require_once APP.'/services/ChannelPostButtonTransport.php';
            }finally{ob_end_clean();}
            requireRead(ProjectConfig::projectId()==='anytour','project_changed');
            $pdo=ConversationDb::connection();
            $pdo->exec('SET SESSION TRANSACTION READ ONLY');
            $pdo->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');
            $pdo->beginTransaction();
            $registry=new ChannelPostRegistryService($pdo);
            $source=$registry->channel('anytour','telegram','anyru_bot','-1002262666616');
            requireRead(is_array($source)&&(int)$source['id']===10,'channel_identity_changed');
            $found=publicationRead($pdo,$registry,10,'390');
            requireRead(is_array($found)&&$found['post_url']==='https://t.me/any_toour/390','source_native_publication_unavailable');
            $catalog=$found['hotel_id'];
            requireRead($catalog===null||(is_int($catalog)&&$catalog>0)||(is_string($catalog)&&preg_match('/\A[1-9][0-9]{0,11}\z/D',$catalog)===1),'invalid_native_hotel_identity');
            $out['source_identity']=['hotel_id'=>61591,'source_message_id'=>'390',
             'publication_id'=>$found['publication_id'],'version_id'=>$found['version_id'],'state'=>$found['state'],
             'native_hotel_catalog_id'=>$catalog,'native_claim_held_or_unknown'=>$found['native_claim_held_or_unknown']];
            $pdo->rollBack();
           }else{
           $prior=[];$public=[];$stage='bounded_public';
           foreach($pairs as $hotel=>$pair){
            $prior[$hotel]=telegramMediaOperationRead($pair['target']);
            [$sp,$tp]=telegramPreparedPairPublicRead($pair,$prior[$hotel],static function(string $channel,string $message)use(&$rates,$pair,$legacyTargetOnly):array{
             $legacyProof=$channel==='anytour'?($pair['legacy_target_observation']??null):null;
             $views=[];foreach(['embed','archive'] as $kind){
              $url=$kind==='embed'?'https://t.me/'.$channel.'/'.$message.'?embed=1&mode=tme':'https://t.me/s/'.$channel.'?before='.((int)$message+1);
              $raw=captionPublicBytes($url,$rates);
              try{
               requireRead($raw['ok'],'pair_public_unavailable');$views[$kind]=parsePublicRead($raw['body'],$channel,$message);
               if($legacyProof!==null)$views[$kind]['legacy_links']=legacyTargetPublicLinksRead($raw['body'],$message,$legacyProof);
              }
              catch(Throwable $e){return ['ok'=>false,'reason'=>reasonRead($e),'http'=>$raw['http']??null,
                'retry_after'=>$legacyTargetOnly?legacyRetryAfterRead($raw['retry_after']??null):($raw['retry_after']??null)]
                  +($legacyProof!==null?['partial_views'=>legacyTargetPartialViewsRead($views)]:[]);}
             }
             try{
              if($legacyProof!==null)return legacyTargetPublicEvidenceRead($views['embed'],$views['archive'],$pair);
              $v=corroborateTargetKeyboard($views['embed'],$views['archive']);
              requireRead($views['embed']['photo_marker_sha256']===$views['archive']['photo_marker_sha256'],'public_photo_changed');
              $v['ok']=true;return $v;
             }catch(Throwable $e){return ['ok'=>false,'reason'=>reasonRead($e)]
               +($legacyProof!==null?['partial_views'=>legacyTargetPartialViewsRead($views)]:[]);}
            });$public[$hotel]=['source'=>$sp,'target'=>$tp];
            if($legacyTargetOnly)$out['legacy_public_observations'][]=['hotel_id'=>$hotel,'target_message_id'=>$pair['target'],
              'target'=>$tp,'source'=>array_intersect_key($sp,array_flip(['ok','reason','http','retry_after','caption_sha256','photo_marker_sha256']))];
           }
           ob_start();try{require APP.'/config.php';require_once APP.'/services/ProjectConfig.php';
           require_once APP.'/services/ChannelPostRegistryService.php';require_once APP.'/services/ChannelPostButtonTransport.php';require_once APP.'/services/ChannelPostRuntime.php';}finally{ob_end_clean();}
           requireRead(ProjectConfig::projectId()==='anytour','project_changed');
           require_once APP.'/hotel-posts-telegram-main19.php';$xml=anytourTelegramFeedRead();$feed=anytourTelegramFeedOfferUrls($xml);$routes=anytourTelegramFeedDestinationPosts($feed);
           $out['current_feed_sha256']=hash('sha256',$xml);$out['feed_count']=count($feed);
           $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$registry=new ChannelPostRegistryService($pdo);
           $target=$registry->channel('anytour','telegram','anyru_bot','-1001845835645');
           $source=$registry->channel('anytour','telegram','anyru_bot','-1002262666616');
           requireRead(is_array($target)&&(int)$target['id']===6&&$target['source_key']==='tg_anytour_msk'&&is_array($source)&&(int)$source['id']===10,'channel_identity_changed');
           $out['target_channel']=['registry_id'=>6,'chat_id'=>'-1001845835645','url'=>'https://t.me/anytour','config_version'=>(int)$target['config_version'],'button_text'=>$target['button_text'],'bot_url'=>$target['bot_url']];
           $currentPin=null;$legacyPinObserved=false;$username=false;$observedBotId=null;$stage='native_read_rights';
           $readTransport=static function(string $platform,string $method,string $path,array $query,?array $body)
               use(&$currentPin,&$legacyPinObserved,&$username,&$observedBotId,&$out,$legacyTargetOnly):array{
            requireRead($platform==='telegram'&&$method==='POST'&&$query===[]&&in_array($path,['getMe','getChatMember','getChat'],true)&&($path==='getMe'||(string)($body['chat_id']??'')==='-1001845835645'),'provider_read_scope_changed');
            $r=ChannelPostApiTransport::buttonRequest($platform,$method,$path,$query,$body);
