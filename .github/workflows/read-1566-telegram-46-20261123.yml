name: "#1566 Read exact1720 terminal and current protocol admission"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'c58cfc3ae048d6c58fee576f0dbad5b8fbcb64e4' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0d31903c21d1630fbdf0338cdd0511ba618f6df
          persist-credentials: false
      - name: Authenticate original terminal then obtain fresh read-only admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),R=require('./tools/deployment_release'),P=require('./tools/release_priority');
          async function main(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN);
            const before=await R.readRecord(api);
            const current=await R.resolveCurrent(api,{sha:'84c8422b39c755b5c7ad396f05a58cf5870c9bec'},before);
            if(!current.ready||current.application_sha!=='84c8422b39c755b5c7ad396f05a58cf5870c9bec')
              throw Error('original1720_not_canonically_accepted');
            const closure=before.record.repository_release.closure;
            if(closure.run_id!=='45624842154'||closure.recovery?.source_sha!=='a0d31903c21d1630fbdf0338cdd0511ba618f6df'
              ||closure.recovery?.original_run_id!=='45599238649')throw Error('terminal_lineage_changed');
            const admission=await P.runGuard({env:process.env,fetchImpl:global.fetch,
              admission:{repository:'pyatkoff/max-search-bot',prNumber:1725,
                headSha:'a0d31903c21d1630fbdf0338cdd0511ba618f6df',
                baseSha:'84c8422b39c755b5c7ad396f05a58cf5870c9bec'}});
            if(!admission.allowed)throw Error('protocol_admission_refused');
            fs.mkdirSync('pub',{recursive:true});
            fs.writeFileSync('pub/reader-admission.json',JSON.stringify({read_only:true,production_writes:0,
              provider_calls:0,sql_queries:0,server_calls:0,write_admission:false,
              original1720:current,record_commit:before.commit,record_blob:before.blob,record_digest:before.record_digest,
              terminal_run_id:closure.run_id,admission,checked_at_utc:new Date().toISOString()})+'\n');
            console.log(JSON.stringify({canonical_original_accepted:current.ready,application_sha:current.application_sha,
              admission,production_writes:0,provider_calls:0,sql_queries:0,server_calls:0}));
          }
          main().catch(e=>{console.error(e.code||e.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/reader-admission.json
          retention-days: 7
          if-no-files-found: warn
