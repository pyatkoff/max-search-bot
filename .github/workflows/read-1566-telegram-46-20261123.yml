name: "#1566 Verify data input inspection without production access"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'cdef904756264da2a6bf085142db4fc96aad91cd' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2b54a4cec61a2a3b06cbcecbef2964144c9bd25
          persist-credentials: false
      - name: Verify exact source and run seven offline packet scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2b54a4cec61a2a3b06cbcecbef2964144c9bd25
          test "$(git hash-object tools/validate_ranked_telegram_input.py)" = 5c241c6fa044400d2446b1c8c2aa13b04948c5c6
          test "$(git hash-object tests/test_ranked_telegram_data_input.py)" = b0d96f05edf1de669762e622960d0867703c7ace
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_ranked_telegram_data_input.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==7 and not result.skipped
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source=='e2b54a4cec61a2a3b06cbcecbef2964144c9bd25'
          files={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in
            ['tools/validate_ranked_telegram_input.py','tests/test_ranked_telegram_data_input.py']}
          proof={'schema':1,'issue':1566,'operation':'hotel_ranked_data_input_offline_verification',
            'native_run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'reader_source_sha':os.environ['GITHUB_SHA'],'tested_source_sha':source,
            'tests_run':result.testsRun,'test_failures':len(result.failures),'test_errors':len(result.errors),
            'test_skips':len(result.skipped),'file_sha256':files,'evidence_only':True,
            'approval_verified':False,'write_admission':False,'production_writes':0,'provider_calls':0,
            'server_calls':0,'sql_queries':0,'price_lease_acquisitions':0,'manager2_http_calls':0}
          pathlib.Path('pub').mkdir()
          pathlib.Path('pub/data-input-test-proof.json').write_text(json.dumps(proof)+'\n')
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/data-input-test-proof.json
          retention-days: 7
          if-no-files-found: error
