name: "#1566 Check final ordinary 1729 admission"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
# Exact read-only release admission; no publisher claim or business write.
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '08a9c289e0a0bc1de9a5110f2ed5ab2afc5fd35c' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out accepted current main
        uses: actions/checkout@v4
        with:
          ref: 4d1ac4a25c5403223d3811e61def23040b1872e3
          persist-credentials: false
      - name: Run the existing ordinary release admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1729 486ad11f6011ddf64d85149ee172132aaca3e012 4d1ac4a25c5403223d3811e61def23040b1872e3
