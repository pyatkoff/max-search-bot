name: '#1566 Match five saved legacy-photo candidates to current feed without writes'
'on':
  push:
    branches:
    - ops/1566-telegram-46-native-read-20261123
    paths:
    - .github/workflows/read-1566-telegram-46-20261123.yml
permissions:
  contents: read
jobs:
  registry:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event.repository.id == 1342493152 && github.actor == 'pyatkoff' && github.event.sender.id == 226193297 && github.event.created == false && github.event.forced == false && github.event.before == '174521ecb83710b7cc70f40750cec2915c75fe57' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - name: Read one current feed; match five already reviewed captions; no provider writes
      env:
        PYTHONUNBUFFERED: '1'
      run: "python3 - <<'PY'\nimport os,json,hashlib,re,ssl,urllib.request,urllib.error,xml.etree.ElementTree as ET,datetime,email.utils\nfrom pathlib import Path\nout={'schema':1,'issue':1566,'operation':'existing_legacy_photo_feed_matching','native_run_id':os.environ['GITHUB_RUN_ID'],'reader_source_sha':os.environ['GITHUB_SHA'],'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'write_admission':False,'provider_writes':0,'production_writes':0,'sql_queries':0,'manager2_http_calls':0,'complete_ready_pair_count':0,'rows':[]}\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*args,**kwargs):return None\nopener=urllib.request.build_opener(NoRedirect,urllib.request.HTTPSHandler(context=ssl.create_default_context()))\nurl='https://app.anytoour.ru/feed/hotel-posts-telegram.xml'\ntry:\n try:\n  with opener.open(urllib.request.Request(url,headers={'User-Agent':'AnyTour-HOTEL-readonly/1.0'}),timeout=35) as resp:\n   out['feed_http']=resp.status;raw=resp.read(5000001)\n\
        \ except urllib.error.HTTPError as e:\n  out['feed_http']=e.code;out['retry_after_raw']=e.headers.get('Retry-After');raise RuntimeError('feed_http_hold')\n if len(raw)>5000000:raise RuntimeError('feed_size_limit')\n out['feed_bytes']=len(raw);out['feed_sha256']=hashlib.sha256(raw).hexdigest()\n if b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():raise RuntimeError('feed_declaration_refused')\n root=ET.fromstring(raw);offers=root.findall('.//offer');out['feed_offer_count']=len(offers)\n if len(offers)!=1055:raise RuntimeError('feed_count_changed')\n used={}\n for e in offers:\n  link=e.findtext('url','').strip();m=re.fullmatch(r'https://t\\.me/anytour/([1-9][0-9]{0,9})',link)\n  if m:used[m.group(1)]=e.attrib.get('id')\n out['current_large_feed_target_count']=len(used)\n specs=[('1077','Regalia Gold',r'regalia\\s+gold'),('1572','Sanya Yalong Bay Swiss & Mercure',r'(?:sanya.*yalong.*(?:swiss|mercure)|(?:swiss|mercure).*yalong)'),('1583','Mangrove Tree Resort Yalong Bay',r'(?:mangrove.*yalong|yalong.*mangrove)'),('1584','Em\
        \ Oi Hotel',r'\\bem\\s+oi\\b'),('1585','Invidia Coral Beach Tiran',r'(?:invidia.*tiran|coral\\s+beach.*tiran)')]\n for mid,label,pattern in specs:\n  matches=[]\n  for e in offers:\n   name=(e.findtext('name','')+' '+e.findtext('model','')).strip()\n   if not re.search(pattern,name,re.I):continue\n   desc=e.findtext('description','');link=e.findtext('url','').strip()\n   matches.append({'offer_id':e.attrib.get('id'),'name':name,'url':link,'url_sha256':hashlib.sha256(link.encode()).hexdigest(),'picture':e.findtext('picture',''),'description_sha256':hashlib.sha256(desc.encode()).hexdigest(),'price_present':e.find('price') is not None,'small_post_links':sorted(set(re.findall(r'https://t\\.me/any_toour/[1-9][0-9]*',desc)))})\n  out['rows'].append({'target_message_id':mid,'archived_hotel_name':label,'feed_target_occupied':mid in used,'occupying_offer_id':used.get(mid),'matching_offer_count':len(matches),'matching_offers':matches,'native_identity_confirmed':False,'native_rights_confirmed':False,'actual_photo_review_complete':False,'write_admission':False})\n\
        \ out['ok']=True\nexcept Exception as e:\n out['ok']=False;out['hold_reason']=str(e) if isinstance(e,RuntimeError) else type(e).__name__\nPath('pub').mkdir(exist_ok=True)\nPath('pub/legacy-photo-feed-matching.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\\n')\nprint(json.dumps({'ok':out['ok'],'feed_http':out.get('feed_http'),'feed_offer_count':out.get('feed_offer_count'),'hold_reason':out.get('hold_reason'),'rows':[{'mid':r['target_message_id'],'matches':r['matching_offer_count'],'occupied':r['feed_target_occupied']} for r in out['rows']]}))\nif not out['ok']:raise SystemExit(1)\nPY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hotel-legacy-photo-feed-matching
        path: pub/legacy-photo-feed-matching.json
        if-no-files-found: error
        retention-days: 14
