name: "#1566 Continue native observation of original unresolved fifteen Telegram transfers"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.before == '218ceaaa8d88a3f77e926a88f4ff6dca83980ff1' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out the exact standard release verifier
        uses: actions/checkout@v4
        with:
          ref: 6194e13ac5af4ba53263284a3a3002f7d6d22b31
          persist-credentials: false
      - name: Verify ordinary release admission for the current Telegram editor fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6194e13ac5af4ba53263284a3a3002f7d6d22b31"
          for run in 45584600698 45584600846; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.head_sha, .event, (.run_attempt|tostring), .status, .conclusion]|join(":")')" \
              = '84a468d4118d6139119d09ee57d61585de0c39bb:pull_request:1:completed:success'
          done
          slot="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/6818332618" --jq .body)"
          test "$slot" = 'PR1699: установлено, выпуск свободен'
          node tools/release_priority.js --admit 1720 84a468d4118d6139119d09ee57d61585de0c39bb 6194e13ac5af4ba53263284a3a3002f7d6d22b31
