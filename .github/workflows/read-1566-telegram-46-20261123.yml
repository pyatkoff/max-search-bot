name: Read the original Telegram 1047 public keyboard
on:
  push:
    branches: [audit/anytour-publisher-keyboard-1047-20261126]
permissions:
  contents: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' && github.repository_id == '1342493152' &&
      github.event.repository.full_name == 'pyatkoff/max-search-bot' && github.event.repository.id == 1342493152 &&
      github.event_name == 'push' && github.ref == 'refs/heads/audit/anytour-publisher-keyboard-1047-20261126' &&
      github.actor == 'pyatkoff' && github.actor_id == '226193297' && github.triggering_actor == 'pyatkoff' &&
      github.event.sender.login == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == true && github.event.deleted == false && github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up the existing public reader PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, mbstring
          coverage: none
          tools: none
      - name: Read the one public archive page and retain only MID1047
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir evidence
          cat > "$RUNNER_TEMP/read-public-1047.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $report = ['schema'=>1, 'operation'=>'telegram_1047_public_keyboard_read',
              'source_sha'=>getenv('GITHUB_SHA'), 'native_run_id'=>getenv('GITHUB_RUN_ID'),
              'native_run_attempt'=>(int)getenv('GITHUB_RUN_ATTEMPT'), 'message_id'=>'1047',
              'url'=>'https://t.me/s/anytour?before=1048', 'ok'=>false,
              'public_get_attempts'=>0, 'production_writes'=>0, 'provider_writes'=>0,
              'provider_credentials_loaded'=>false, 'http'=>null, 'body_sha256'=>null,
              'body_complete'=>false, 'node_saved'=>false];
          $body = ''; $overflow = false; $curl = null;
          $need = static function (bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          };
          try {
              // No application bootstrap, token, SSH, redirects, retry or fallback.
              $curl = curl_init($report['url']);
              $need($curl !== false, 'public_transport_unavailable');
              curl_setopt_array($curl, [CURLOPT_HTTPGET=>true, CURLOPT_FOLLOWLOCATION=>false,
                  CURLOPT_MAXREDIRS=>0, CURLOPT_PROTOCOLS=>CURLPROTO_HTTPS,
                  CURLOPT_SSL_VERIFYPEER=>true, CURLOPT_SSL_VERIFYHOST=>2,
                  CURLOPT_CONNECTTIMEOUT=>5, CURLOPT_TIMEOUT=>20, CURLOPT_USERAGENT=>'Mozilla/5.0',
                  CURLOPT_WRITEFUNCTION=>static function ($unused, string $part) use (&$body, &$overflow): int {
                      if (strlen($body) + strlen($part) > 1500000) { $overflow = true; return 0; }
                      $body .= $part; return strlen($part);
                  }]);
              $report['public_get_attempts'] = 1;
              $response = curl_exec($curl);
              $report['http'] = (int)curl_getinfo($curl, CURLINFO_HTTP_CODE);
              $report['curl_errno'] = curl_errno($curl);
              $report['body_bytes'] = strlen($body);
              $report['body_complete'] = $response !== false && $report['curl_errno'] === 0 && !$overflow;
              $report[$report['body_complete'] ? 'body_sha256' : 'partial_body_sha256'] = hash('sha256', $body);
              curl_close($curl); $curl = null;
              $need(!$overflow, 'public_body_limit_exceeded');
              $need($report['body_complete'], 'public_transport_failed');
              $need($report['http'] === 200, 'public_http_not_200');
              $doc = new DOMDocument('1.0', 'UTF-8');
              $need(@$doc->loadHTML('<?xml encoding="UTF-8">'.$body,
                  LIBXML_NONET | LIBXML_NOERROR | LIBXML_NOWARNING), 'public_html_invalid');
              $xp = new DOMXPath($doc);
              $nodes = $xp->query('//*[@data-post="anytour/1047"]');
              $need($nodes !== false && $nodes->length === 1, 'public_identity_unconfirmed');
              $node = $nodes->item(0);
              $foreign = $xp->query('.//*[@data-post and @data-post!="anytour/1047"]', $node);
              $need($foreign !== false && $foreign->length === 0, 'nested_foreign_post_refused');
              $html = $doc->saveHTML($node);
              $need(is_string($html) && strlen($html) <= 250000, 'public_node_limit_exceeded');
              $need(file_put_contents('evidence/1047-node.html', $html) === strlen($html), 'public_node_save_failed');
              $report['node_saved'] = true;
              $report['node_sha256'] = hash('sha256', $html);
              $report['node_bytes'] = strlen($html);
              $cls = static fn(string $c): string => 'contains(concat(" ",normalize-space(@class)," ")," '.$c.' ")';
              $rows = $xp->query('.//*['.$cls('tgme_widget_message_inline_row').']', $node);
              $buttons = $xp->query('.//*['.$cls('tgme_widget_message_inline_button').']', $node);
              $need($rows !== false && $buttons !== false, 'public_keyboard_query_failed');
              $report['row_count'] = $rows->length;
              $report['button_count'] = $buttons->length;
              $report['rows'] = []; $report['buttons'] = [];
              foreach ($rows as $i=>$row) {
                  if ($i >= 64) break;
                  $direct = $xp->query('./*['.$cls('tgme_widget_message_inline_button').']', $row);
                  $report['rows'][] = ['index'=>$i, 'direct_button_count'=>$direct === false ? null : $direct->length];
              }
              foreach ($buttons as $i=>$button) {
                  if ($i >= 64) break;
                  $values = ['tag'=>$button->nodeName, 'class'=>$button->getAttribute('class'),
                      'href'=>$button->hasAttribute('href') ? $button->getAttribute('href') : null,
                      'text'=>trim($button->textContent),
                      'onclick'=>$button->hasAttribute('onclick') ? $button->getAttribute('onclick') : null];
                  $entry = ['index'=>$i, 'truncated_fields'=>[]];
                  foreach ($values as $key=>$value) {
                      $limit = $key === 'href' ? 2048 : 512;
                      if (is_string($value) && mb_strlen($value, 'UTF-8') > $limit) {
                          $entry['truncated_fields'][] = $key;
                          $value = mb_substr($value, 0, $limit, 'UTF-8');
                      }
                      $entry[$key] = $value;
                  }
                  $report['buttons'][] = $entry;
              }
              $report['rows_truncated'] = $rows->length > 64;
              $report['buttons_truncated'] = $buttons->length > 64;
              $report['ok'] = true;
          } catch (Throwable $error) {
              $message = $error->getMessage();
              $report['reason'] = $error instanceof RuntimeException && preg_match('/\A[a-z_]{3,80}\z/D', $message)
                  ? $message : 'public_read_failed';
          } finally {
              if ($curl !== null && $curl !== false) curl_close($curl);
              $report['finished_at_utc'] = gmdate(DATE_ATOM);
              $json = json_encode($report, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR)."\n";
              if (file_put_contents('evidence/read.json', $json) !== strlen($json)) exit(3);
          }
          echo json_encode(['ok'=>$report['ok'], 'http'=>$report['http'],
              'public_get_attempts'=>$report['public_get_attempts'], 'reason'=>$report['reason'] ?? null]), "\n";
          exit($report['ok'] ? 0 : 2);
          PHP
          php "$RUNNER_TEMP/read-public-1047.php"
      - name: Preserve the bounded public read including a failure reason
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publisher-keyboard-1047-public-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
