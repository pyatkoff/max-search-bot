name: "#1566 Read final ordinary1727 admission"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '1482b4a7df44767b062f21ae55f00b1ee68abd47' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the accepted existing admission mechanism
        uses: actions/checkout@v4
        with:
          ref: 251331bb4cb4984e34e3c24e82fb8c2e7fdb29fe
          persist-credentials: false
      - name: Read exact source CI and final ordinary1727 admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pub
          node - <<'NODE'
          const fs=require('node:fs'),P=require('./tools/release_priority'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN),root=R.API_ROOT;
            const head='5ce043349e1d5ede9bd02c4b71e52bf2a3c01fb4',base='251331bb4cb4984e34e3c24e82fb8c2e7fdb29fe';
            const pr=await api('GET',root+'/pulls/1727');
            if(pr.state!=='open'||pr.draft||pr.head.sha!==head||pr.base.sha!==base)throw Error('target_changed');
            const checks=[];
            for(const [id,path] of [['45684106075','.github/workflows/regression-tests.yml'],['45684106158','.github/workflows/retired-domain-guard.yml']]){
              const run=await api('GET',root+'/actions/runs/'+id);
              if(run.head_sha!==head||run.event!=='pull_request'||run.run_attempt!==1||run.path!==path||run.status!=='completed'||run.conclusion!=='success')throw Error('required_ci_not_complete');
              checks.push({id,path,status:run.status,conclusion:run.conclusion,head_sha:run.head_sha});
            }
            const publisher=await api('GET',root+'/issues/comments/6818332618');
            if(publisher.user.id!==226193297||publisher.body!=='PR1725: установлено, выпуск свободен'||publisher.updated_at!=='2026-11-25T13:56:45Z')throw Error('own_publisher_changed');
            const result=await P.runGuard({env:process.env,fetchImpl:fetch,admission:{repository:'pyatkoff/max-search-bot',prNumber:1727,headSha:head,baseSha:base}});
            fs.writeFileSync('pub/admission.json',JSON.stringify({read_only:true,provider_writes:0,production_writes:0,pr:1727,head,base,checks,publisher:{id:publisher.id,owner:publisher.user.id,body:publisher.body,updated_at:publisher.updated_at},result,checked_at_utc:new Date().toISOString()})+'\n');
            console.log(JSON.stringify({read_only:true,pr:1727,head,base,result}));
            if(!result.allowed)throw Error('ordinary_admission_refused');
          }
          check().catch(e=>{console.error('ordinary1727_read_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Preserve exact original admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-ordinary1727-admission
          path: pub/admission.json
          retention-days: 7
          if-no-files-found: warn
