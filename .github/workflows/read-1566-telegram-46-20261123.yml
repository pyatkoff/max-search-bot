name: "#1566 Inspect the full saved captions of the oldest shortlist candidates"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'eee490b15651ef26f8d9b8ad5a2950c166ad4240' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Review the already saved captions without re-reading Telegram
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, zipfile
          repo=os.environ['GITHUB_REPOSITORY']
          def read(path):
              return subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],timeout=30)
          run=json.loads(read('actions/runs/45790642573'))
          assert run['head_sha']=='16b928414298b1f4dc59f2f43f79a5a4f710f4fe' and run['run_attempt']==1
          assert run['conclusion']=='success' and run['actor']['id']==226193297 and run['event']=='push'
          info=json.loads(read('actions/artifacts/15102278365'))
          digest='e78fdcf0edd83a7c0b6afc0126c8eca386e5861bfc672ef484a3ff8377d95912'
          assert info['workflow_run']['id']==run['id'] and not info['expired'] and info['digest']=='sha256:'+digest
          raw=read('actions/artifacts/15102278365/zip')
          assert len(raw)==info['size_in_bytes']==5567 and hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.namelist()==['legacy-keyboard-shortlist.json'] and archive.testzip() is None
              assert archive.getinfo(archive.namelist()[0]).file_size<=100000
              report=json.loads(archive.read(archive.namelist()[0]))
          assert report['write_admission'] is False and report['feed']['status']=='ok'
          forbidden=re.compile(r'поздрав|юбиле|с днем|с днём|конкурс|розыгрыш|отзыв|истори[яию] турист|скриншот|победител',re.I)
          offer_text=re.compile(r'₽|\d\s*руб|стоимость|цен[аы]|вылет|на\s+[1-9][0-9]?\s*ноч',re.I)
          for row in report['other_commercial_candidates']:
              caption=row['caption_preview']
              assert row['native_ready'] is False
              print(json.dumps({**row,'number_or_date_in_caption':bool(offer_text.search(caption)),
                  'editorial_text_hint':bool(forbidden.search(caption))},ensure_ascii=False))
          print(json.dumps({'saved_candidates_reviewed':len(report['other_commercial_candidates']),
              'authenticated_artifact':15102278365,'full_replacement_only':True,'writes':0,'telegram_requests':0},ensure_ascii=False))
          PY
