name: "#1566 Read both existing campaign destinations after the Telegram observer release"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '782d81aefed1523a8618c33828276ff1fd865e39' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a491c8abd5c1af826afbb9b817b3d9ab09a2a502
          persist-credentials: false
      - name: Read only the current established campaign destinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.verify_installed_telegram_routes import get_ad
          targets=[('tg_2490','912'),('tg_42647','957')]
          report={'routes':[get_ad({'offer_id':x,'post_url':'https://t.me/anytour/'+y}) for x,y in targets],
                  'writes':0,'read_only':True}
          print(json.dumps(report,ensure_ascii=False))
          Path('route-status.json').write_text(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-public-route-status-after-1739
          path: route-status.json
          retention-days: 7
          if-no-files-found: error
