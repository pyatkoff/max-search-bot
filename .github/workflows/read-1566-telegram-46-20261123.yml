name: "#1566 Check the exact four commercially worded posts for protected text"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'c8828b7f88433902192078cf111bfd9a00bdbed8' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact existing Telegram plans for exclusion
        uses: actions/checkout@v4
        with:
          ref: 43c684f3d220f4808efe898d1ba14608f960fda7
          path: accepted
          persist-credentials: false
      - name: Inspect full captions from unchanged archive receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile
          
          repo = os.environ["GITHUB_REPOSITORY"]
          workflow = ".github/workflows/read-1566-telegram-46-20261123.yml"
          base = Path("accepted/config")
          expected = [[45747718941,15083853001,"4a80c9b86444d30462e8371f8be9c854a3aebbe5",711069,"a5f9edd963c476f4e3f003f4f83007644e2b4d607fa9c49a608dad52fcf14d77"],[45747898971,15083559015,"e728c0aff8d2656c8529b299ceb5adfba99e214d",379064,"2c4919e754273a8bee9c63704eff165800e67d118f07c66eeee7f2b09ff6c875"],[45745214387,15082428655,"25147cfb950c4f114df0fc15bc688bd06814e264",303175,"b579c38168e5f79421c4344d95945555cbd25554e6c487d88dca3465eff82a84"]]
          blocked = {220, 567, 588, 727, 831, 842, 907, 957, 1012, 1016, 1042, 1047,
                     1058, 1089, 1099, 1103, 1109, 1111, 1136, 1535, 1559, 1584, 1585, 1586,
                     1620, 1651, 1653, 1654, 1664, 1665, 1679, 1695, 1696}
          checked_plans = 0
          for file in sorted(base.glob("anytour*.json")):
              if file.stat().st_size > 500000:
                  continue
              data = json.loads(file.read_bytes())
              if isinstance(data, dict):
                  for row in data.get("rows", []):
                      if isinstance(row, dict) and str(row.get("target_message_id", "")).isdigit():
                          blocked.add(int(row["target_message_id"]))
                  checked_plans += 1
          
          def gh(resource):
              return subprocess.check_output(["gh", "api", f"repos/{repo}/{resource}"], timeout=50)
          
          guard = re.compile(r"отзыв|впечатлен|впечатлён|делимс[яь] впечатлен|наш[аи]? турист|туристы поделил|туристы вернул|"
                             r"менеджер.{0,12}рассказ|мы (?:отдыхали|побывали)|с дн[её]м|поздравляем|розыгрыш|конкурс|доминикан", re.I)
          commercial = re.compile(r"\bRUB\b|₽|\d\s*руб|вылет|тур[а-яё]*|путешеств|отел|курорт|отдых", re.I)
          seen, source_rows, scope, reviewed = set(), [], {}, {}
          for run_id, artifact_id, head, size, digest in expected:
              run = json.loads(gh(f"actions/runs/{run_id}"))
              assert run["id"] == run_id and run["head_sha"] == head and run["run_attempt"] == 1
              assert run["conclusion"] == "success" and run["actor"]["id"] == 226193297
              assert run["event"] == "push" and run["path"] == workflow
              meta = json.loads(gh(f"actions/artifacts/{artifact_id}"))
              assert not meta["expired"] and meta["workflow_run"]["id"] == run_id
              assert meta["size_in_bytes"] == size and meta["digest"] == f"sha256:{digest}"
              raw = gh(f"actions/artifacts/{artifact_id}/zip")
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert archive.testzip() is None
                  names = [n for n in archive.namelist() if n.rsplit("/", 1)[-1] == "archive-windows.json"]
                  assert len(names) == 1, (run_id, "missing or ambiguous archive projection", archive.namelist()[:25])
                  assert archive.getinfo(names[0]).file_size <= 16000000, (run_id, "archive projection too large", archive.getinfo(names[0]).file_size)
                  document = json.loads(archive.read(names[0]))
              assert document["native_run_id"] == str(run_id) and document["reader_source_sha"] == head
              assert document["write_admission"] is False
              source_rows.append({"run":run_id, "artifact":artifact_id, "rows":len(document["rows"])})
              for row in document["rows"]:
                  mid = int(row["target_message_id"])
                  seen.add(mid)
                  public = row.get("public", {})
                  original = 'saved_plan_or_hold' if mid in blocked else 'not_supported_or_parse_unavailable' if not public.get('single_photo') else 'legacy_keyboard' if public.get('buttons') else 'single_photo_empty_keyboard'
                  scope[mid] = original
                  if original != 'single_photo_empty_keyboard' or mid not in {951,966,1049,1115}:
                      continue
                  caption=public.get('caption','')
                  if not isinstance(caption,str):
                      continue
                  entry={'target_mid':mid,'public_run':run_id,'caption':caption[:3000],'date':public.get('published_at'),
                         'caption_sha256':public.get('caption_sha256'),'photo_marker_sha256':public.get('photo_marker_sha256'),
                         'caption_entry_links':len(public.get('caption_links',[])),
                         'has_editorial_hint':bool(guard.search(caption) or re.search(r'угада|загад|розыгрыш|играем|поздрав|поздравляем|счастья|игра\b|конкурс|юбилей|поделитесь|в комментар',caption,re.I)),
                         'has_sale_hint':bool(re.search(r'вылет|стоимость|₽|RUB|цена|за двоих|заброниров',caption,re.I)),
                         'write_admission':False}
                  if mid not in reviewed or reviewed[mid]['public_run']<run_id:
                      reviewed[mid]=entry
          result={'rows':[reviewed[mid] for mid in sorted(reviewed)],'rows_reviewed':len(reviewed),
                  'source_receipts':source_rows,'write_admission':False,'telegram_requests':0,'provider_writes':0}
          Path('pub').mkdir()
          Path('pub/no-keyboard-review.json').write_text(json.dumps(result,ensure_ascii=False))
          for row in result['rows']:
              print(json.dumps(row,ensure_ascii=False))
          print(json.dumps({k:v for k,v in result.items() if k!='rows'},ensure_ascii=False))
          PY
      - name: Preserve the unfiltered public inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-exact-content-protection
          path: pub/no-keyboard-review.json
          retention-days: 7
          if-no-files-found: error
