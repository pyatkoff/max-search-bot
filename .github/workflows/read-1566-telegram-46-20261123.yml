name: "#1566 Build and validate the Vilamendhoo data packet from the original receipt"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '60b9a3583ee89fcbf5723dc06530b433d9905f9d' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61e05da2e6bcf88082a9a6bb46858d05040a603f
          persist-credentials: false
      - name: Compile the exact approved pair, with zero provider and production writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          from tools.validate_ranked_telegram_input import git_blob, registry, compare, inspect_input
          def gh(path):
              return subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}"],timeout=25)
          def sha(value):
              return hashlib.sha256(value).hexdigest()
          def pack(document):
              return json.dumps(document,ensure_ascii=False,separators=(',',':')).encode()
          run=json.loads(gh('actions/runs/45799015244'))
          job=json.loads(gh('actions/jobs/139837020284'))
          step='Read source 685 and commercial post 912 without provider writes'
          assert run['conclusion']=='success' and run['head_sha']=='60b9a3583ee89fcbf5723dc06530b433d9905f9d' and run['actor']['id']==226193297 and run['run_attempt']==1
          assert job['conclusion']=='success' and job['run_id']==run['id'] and [s['conclusion'] for s in job['steps'] if s['name']==step]==['success']
          info=json.loads(gh('actions/artifacts/15105658225'))
          assert not info['expired'] and info['workflow_run']['id']==run['id'] and info['size_in_bytes']==5939
          expected='fd89fb3296ee4a6b091e5f1b3ef718b52ea419cc498c56ddac6b6899a95f5e94'
          raw=gh('actions/artifacts/15105658225/zip')
          assert len(raw)==5939 and info['digest']=='sha256:'+expected and sha(raw)==expected
          Path('pub').mkdir()
          archive=Path('pub/original.zip')
          archive.write_bytes(raw)
          with zipfile.ZipFile(io.BytesIO(raw)) as zipped:
              assert zipped.namelist()==['registry.json'] and zipped.testzip() is None
              raw_registry=zipped.read('registry.json')
          data=json.loads(raw_registry)
          assert len(data['rows'])==1 and data['write_admission'] is False
          proof={'run_id':str(run['id']),'run_attempt':1,'artifact_id':info['id'],'artifact_zip_sha256':expected,
                 'registry_sha256':sha(raw_registry),'checkpoint_sha256':data['checkpoint_sha256'],
                 'repository_sha':'61e05da2e6bcf88082a9a6bb46858d05040a603f','application_sha':'61e05da2e6bcf88082a9a6bb46858d05040a603f'}
          index={'schema':1,'native_preflight':proof,
                 'native_source':{'head_sha':run['head_sha'],'job_id':job['id'],'step':step,'artifact_name':info['name']},
                 'native_zip_bytes':len(raw),'plans':[]}
          by_hotel,channel=registry(archive,index)
          prior=by_hotel[2490]
          assert prior['source_message_id']=='685' and prior['target_message_id']=='912'
          assert all(x is True for x in prior['prepared_assessment']['checks'].values())
          source=prior['source_public']; target=prior['target_public']; native=prior['source_native']; photo=native['attachments'][0]
          assert target['caption_sha256']=='3cd892fca7a6be4c3e7acff75c693632e3d8b4b6503df46ebe102c8ebf43ac62'
          assert target['photo_marker_sha256']=='6a6cfef412570cbe77299c1590db24716f89330b07613b5411ae38cb4d35b049'
          caption='Vilamendhoo Maldives Resort Island\n📍 Атолл Южный Ари, Мальдивы.\n\nОстровной курорт для тех, кто любит снорклинг. Домашний риф, песчаный берег и виллы у лагуны позволяют проводить большую часть дня у воды.\n\nПодберём тур на ваши даты.'
          approved={'hotel_id':2490,'source_message_id':'685','source_publication_id':native['publication_id'],
                    'source_version_id':native['version_id'],'source_content_hash':native['content_hash'],
                    'source_caption_sha256':source['caption_sha256'],'source_file_id_sha256':photo['file_id_sha256'],
                    'source_file_unique_id_sha256':photo['file_unique_id_sha256'],'source_photo_marker_sha256':source['photo_marker_sha256'],
                    'target_message_id':'912','target_published_unixtime':target['published_unixtime'],
                    'target_caption_sha256':target['caption_sha256'],'target_photo_marker_sha256':target['photo_marker_sha256'],
                    'target_config_version':channel['config_version'],'next_caption':caption,'next_caption_sha256':sha(caption.encode()),
                    'button_text':channel['button_text'],'bot_url':channel['bot_url'],'price_template':'','price_record_id':None}
          compare(approved,prior,channel)
          plan={'schema':1,'operation':'anytour_hotel_transfer_ranked_45799015244','execution':'explicit_owner_apply_only',
                'native_preflight':proof,'monitor_source_url':None,'price_policy':'omit_previous_price_keep_hotel_calculation_button','rows':[approved]}
          plan_path='config/anytour_ranked_pairs_45799015244.json'
          index_path='config/anytour_ranked_index_45799015244.json'
          pb=pack(plan)
          Path(plan_path).write_bytes(pb)
          index['plans']=[{'path':plan_path,'bytes':len(pb),'git_blob':git_blob(pb),'sha256':sha(pb)}]
          ib=pack(index)
          Path(index_path).write_bytes(ib)
          out=inspect_input(sha(ib),archive,Path.cwd(),index_path)
          assert len(out['chunks'])==1 and out['chunks'][0]['messages']==['912']
          for path, raw in ((plan_path,pb),(index_path,ib)):
              print(json.dumps({'file':path,'bytes':raw.decode(),'sha256':sha(raw),'git_blob':git_blob(raw)},ensure_ascii=False,separators=(',',':')))
          print(json.dumps(out,ensure_ascii=False))
          PY
