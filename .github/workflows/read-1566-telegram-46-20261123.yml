name: "#1566 Validate existing reader resource budget without production load"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.before == '5386be53bb46e8f8a0391263e3c0453f3826aa26' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Lint the same bounded reader without SSH, database or provider calls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = 'd5df2d7c81f9863084845bcfc15e374afbd499ef'
          php -l tools/direct_demand/operations/read-1566-telegram-46-20261123.php
          mkdir -p pub
          python3 - <<'PYFIX'
          from pathlib import Path
          s=Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php').read_text()
          a=s.index('function serverReadBudgetRead(');b=s.index('function runtimeRead()',a)
          fn=s[a:b]
          tests="""
          function checkBudget(bool $ok):void{if(!$ok)throw new RuntimeException('resource_budget_contract_failed');}
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[65.2]])['allowed']===false);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[2.66]])['allowed']===true);
          checkBudget(serverReadBudgetRead(['cpu_count'=>null,'load_average'=>[2.66]])['allowed']===false);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>null])['allowed']===false);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[INF]])['allowed']===false);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[-1]])['allowed']===false);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[6]])['allowed']===true);
          checkBudget(serverReadBudgetRead(['cpu_count'=>4,'load_average'=>[6.01]])['allowed']===false);
          echo json_encode(['ok'=>true,'operation'=>'offline_existing_reader_resource_budget','checks'=>8,'production_writes'=>0,'provider_calls'=>0]),PHP_EOL;
          """
          Path('pub/budget-test.php').write_text('<?php\n'+fn+tests)
          assert s.index("requireRead($out['resource_budget']['allowed'],'server_resource_hold')")<s.index("$stage='public_caption_read'")<s.index("$pdo->beginTransaction()")
          PYFIX
          php pub/budget-test.php > pub/resource-budget.json
          cat pub/resource-budget.json
          rm pub/budget-test.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1566-telegram-ranked-preflight
          path: pub/resource-budget.json
          retention-days: 7
          if-no-files-found: warn
