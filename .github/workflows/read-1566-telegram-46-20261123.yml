name: "#1566 Observe capacity in the latest AnyTour archive"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.deleted == false && github.event.after == github.sha &&
      github.event.before == '45245022df3f3d7f4027bf448355c974ea0c5c96' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the exact read-only observation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact single-file forward change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '45245022df3f3d7f4027bf448355c974ea0c5c96'
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = $'M\t.github/workflows/read-1566-telegram-46-20261123.yml'
      - name: Set up the original public archive reader
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring
          coverage: none
        env:
          fail-fast: true
      - name: Read up to two latest archive pages and retain a sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub
          cat > "$RUNNER_TEMP/observe-newest-archive.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function requireRead(bool $ok, string $reason): void
          {
              if (!$ok) throw new RuntimeException($reason);
          }
          function jsonRead(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);
          }
          function reasonRead(Throwable $e): string
          {
              return get_class($e) === RuntimeException::class
                  && preg_match('/\A[a-z_]{1,100}\z/D', $e->getMessage()) === 1 ? $e->getMessage() : 'read_evidence_unavailable';
          }
          function publicRetryLimit(?string $raw, int $now): array
          {
              if ($raw !== null && (strlen($raw)>160 || preg_match('/\A[\x20-\x7E]*\z/D',$raw)!==1)) $raw=null;
              $seconds = null;
              if ($raw !== null && preg_match('/\A[0-9]{1,8}\z/D',$raw) === 1) $seconds=(int)$raw;
              elseif ($raw !== null) {
                  $when=DateTimeImmutable::createFromFormat(DateTimeInterface::RFC7231,$raw,new DateTimeZone('UTC'));
                  if ($when!==false && $when->format(DateTimeInterface::RFC7231)===$raw) $seconds=max(0,$when->getTimestamp()-$now);
              }
              return ['observed_at_utc'=>gmdate(DATE_ATOM,$now), 'retry_after_raw'=>$raw,
                  'retry_after_seconds'=>$seconds, 'resume_not_before_unix'=>$seconds===null?null:$now+$seconds];
          }
          function captionPublicBytes(string $url,array &$rates,int $limit=1000000):array{
           $host=(string)parse_url($url,PHP_URL_HOST);if(isset($rates[$host]))return ['ok'=>false,'reason'=>'public_retry_after_held','retry_after'=>$rates[$host],'http_attempts'=>0];
           $body='';$retry=null;$c=curl_init($url);curl_setopt_array($c,[CURLOPT_FOLLOWLOCATION=>false,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>15,CURLOPT_USERAGENT=>'Mozilla/5.0',CURLOPT_HEADERFUNCTION=>static function($c,string $line)use(&$retry):int{if(stripos($line,'retry-after:')===0)$retry=trim(substr($line,12));return strlen($line);},CURLOPT_WRITEFUNCTION=>static function($c,string $chunk)use(&$body,$limit):int{if(strlen($body)+strlen($chunk)>$limit)return 0;$body.=$chunk;return strlen($chunk);}]);$ok=curl_exec($c)!==false&&curl_errno($c)===0;$status=(int)curl_getinfo($c,CURLINFO_HTTP_CODE);curl_close($c);
           if($status===429)$rates[$host]=publicRetryLimit($retry,time());return ['ok'=>$ok&&$status===200,'http'=>$status,'body'=>$body,'body_sha256'=>hash('sha256',$body),'http_attempts'=>1,'retry_after'=>$status===429?$rates[$host]:null];
          }
          
          function publicShape(DOMXPath $xpath, DOMNode $node): array
          {
              $class = static fn(string $name): string=>'contains(concat(" ",normalize-space(@class)," ")," '.$name.' ")';
              $count = static function (string $query) use ($xpath, $node): int {
                  $matches = $xpath->query($query, $node);
                  requireRead($matches !== false && $matches->length <= 100, 'archive_shape_unbounded');
                  return $matches->length;
              };
              $photos = $count('.//*['.$class('tgme_widget_message_photo_wrap').']');
              $grouped = $count('.//*['.$class('tgme_widget_message_grouped').']') > 0;
              $circle = $count('.//*['.$class('tgme_widget_message_roundvideo').']') > 0;
              $video = $count('.//video|.//*['.$class('tgme_widget_message_video_thumb').']') > 0;
              $audio = $count('.//audio|.//*['.$class('tgme_widget_message_voice').']') > 0;
              $other = $count('.//*['.$class('tgme_widget_message_document').' or '.$class('tgme_widget_message_location').']') > 0;
              $videoShape = $circle ? 'video_circle' : 'video';
              $media = match (true) {
                  $grouped && ($circle || $video)=>'grouped_with_video',
                  $circle || $video=>$videoShape,
                  $audio || $other=>'other_media',
                  $grouped && $photos >= 2=>'photo_album',
                  !$grouped && $photos === 1=>'single_photo',
                  default=>'other_or_unknown',
              };
              $keyboard = $xpath->query('.//a['.$class('tgme_widget_message_inline_button').']', $node);
              requireRead($keyboard !== false && $keyboard->length <= 20, 'public_keyboard_unbounded');
              $buttonShape = match ($keyboard->length) {
                  0=>'empty',
                  1=>match (true) {
                      preg_match('~\Ahttps://t\.me/anyru_bot\?start=p_[A-Za-z0-9_-]{8,60}\z~D', $keyboard->item(0)->getAttribute('href')) === 1=>'single_hotel',
                      $keyboard->item(0)->getAttribute('href') === 'https://t.me/anyru_bot?start=tg_anytour_msk'=>'single_generic_tour_start',
                      default=>'single_other',
                  },
                  default=>'multiple',
              };
              return ['media_shape'=>$media,'visible_photos'=>$photos,'visible_buttons'=>$keyboard->length,'keyboard_shape'=>$buttonShape];
          }
          
          function newestCapacityReceipt(callable $read, string $run, string $reader): array
          {
              $archivedMax = 1806;
              $windowUpper = 1899;
              $baseUrl = 'https://t.me/s/anytour';
              $before = null;
              $allMids = [];
              $windows = [];
              $attempts = 0;
              $stop = 'page_bound';
              for ($page = 1; $page <= 2; $page++) {
                  $readResult = $read($before === null ? $baseUrl : $baseUrl.'?before='.$before);
                  $status = $readResult['http'];
                  $attempts += $readResult['http_attempts'];
                  $retry = $readResult['retry_after'] ?? [];
                  $window = ['before'=>$before,'http'=>$status,'body_sha256'=>$readResult['body_sha256'],
                      'retry_after_seconds'=>$retry['retry_after_seconds'] ?? null,
                      'resume_not_before_unix'=>$retry['resume_not_before_unix'] ?? null,
                      'visible_exact_mids'=>[],'shapes'=>[]];
                  if (!$readResult['ok']) {
                      $stop = match ($status) {
                          403=>'public_forbidden_no_repeat',
                          429=>'public_retry_after_held',
                          default=>'archive_window_unavailable',
                      };
                      $window['hold_reason'] = $stop;
                      $windows[] = $window;
                      break;
                  }
          
                  $mids = [];
                  $shapes = [];
                  try {
                      requireRead($readResult['body'] !== '', 'archive_html_invalid');
                      $doc = new DOMDocument();
                      $prior = libxml_use_internal_errors(true);
                      try { $loaded = $doc->loadHTML($readResult['body'], LIBXML_NONET); }
                      finally { libxml_clear_errors(); libxml_use_internal_errors($prior); }
                      requireRead($loaded, 'archive_html_invalid');
                      $xpath = new DOMXPath($doc);
                      $nodes = $xpath->query('//*[@data-post]');
                      requireRead($nodes !== false && $nodes->length > 0 && $nodes->length <= 100, 'archive_unbounded_or_empty');
                      foreach ($nodes as $node) {
                          if (!preg_match('~\Aanytour/([1-9][0-9]{0,9})\z~D', $node->getAttribute('data-post'), $match)) continue;
                          $mid = (int)$match[1];
                          requireRead(!isset($mids[$mid]) && ($before === null || $mid < $before), 'archive_cursor_or_identity_changed');
                          $mids[$mid] = true;
                          try { $shape = publicShape($xpath,$node); }
                          catch (Throwable $error) { $shape = ['shape_hold_reason'=>reasonRead($error)]; }
                          $shapes[$mid] = ['mid'=>$mid] + $shape;
                      }
                      requireRead($mids !== [], 'archive_channel_identity_missing');
                  } catch (RuntimeException $error) {
                      $stop = reasonRead($error);
                      $window['hold_reason'] = $stop;
                      $windows[] = $window;
                      break;
                  }
          
                  ksort($shapes,SORT_NUMERIC);
                  $visible = array_keys($shapes);
                  $allMids += $mids;
                  $window['visible_exact_mids'] = $visible;
                  $window['shapes'] = array_values($shapes);
                  $windows[] = $window;
                  $before = min($visible);
                  if ($before <= $archivedMax + 1) {
                      $stop = 'retained_archive_boundary_reached';
                      break;
                  }
              }
              $visible = array_keys($allMids);
              sort($visible,SORT_NUMERIC);
              return ['schema'=>1,'issue'=>1566,'operation'=>'hotel_newest_archive_capacity_observation',
                  'native_run_id'=>$run,'reader_source_sha'=>$reader,'read_at_utc'=>gmdate(DATE_ATOM),
                  'write_admission'=>false,'provider_writes'=>0,'production_writes'=>0,'server_calls'=>0,'sql_queries'=>0,
                  'max_http_attempts'=>2,'http_attempts'=>$attempts,'stop_reason'=>$stop,'windows'=>$windows,
                  'previous_exact_max_mid'=>$archivedMax,'previous_window_upper'=>$windowUpper,
                  'max_visible_mid'=>$visible === [] ? null : max($visible),
                  'visible_exact_mids'=>$visible,
                  'new_exact_mids'=>array_values(array_filter($visible,static fn(int $mid): bool=>$mid > $archivedMax)),
                  'beyond_previous_window_mids'=>array_values(array_filter($visible,static fn(int $mid): bool=>$mid > $windowUpper))];
          }
          
          $rates = [];
          $receipt = newestCapacityReceipt(
              static function (string $url) use (&$rates): array { return captionPublicBytes($url,$rates); },
              (string)getenv('GITHUB_RUN_ID'),
              (string)getenv('GITHUB_SHA'),
          );
          requireRead(file_put_contents('pub/archive-newest-capacity.json',jsonRead($receipt)."\n") !== false,
              'observation_save_failed');
          echo jsonRead(['windows'=>count($receipt['windows']),'http_attempts'=>$receipt['http_attempts'],
              'max_visible_mid'=>$receipt['max_visible_mid'],'stop_reason'=>$receipt['stop_reason'],
              'write_admission'=>false])."\n";
          PHP
          php -l "$RUNNER_TEMP/observe-newest-archive.php"
          php "$RUNNER_TEMP/observe-newest-archive.php"
      - name: Preserve only the sanitized newest-capacity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-newest-capacity
          path: pub/archive-newest-capacity.json
          retention-days: 7
          if-no-files-found: error
