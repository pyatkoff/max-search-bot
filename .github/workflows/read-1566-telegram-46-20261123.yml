name: "#1566 Inspect actual photos of ten saved commercial targets"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'fd22921e5c1b5b09a61e9bb11707d7972f05b1b8' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authenticate existing receipts and download only actual saved images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, zipfile, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          ROOT=Path('pub'); ROOT.mkdir()
          def api(p): return subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+p],timeout=30)
          def receipt(run, artifact, head, size, sha):
              r=json.loads(api('actions/runs/'+str(run)))
              assert r['run_attempt']==1 and r['head_sha']==head and r['conclusion']=='success' and r['actor']['id']==226193297
              assert r['repository']['full_name']==r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
              a=json.loads(api('actions/artifacts/'+str(artifact)))
              assert not a['expired'] and a['workflow_run']['id']==run and a['workflow_run']['head_sha']==head and a['size_in_bytes']==size and a['digest']=='sha256:'+sha
              b=api('actions/artifacts/'+str(artifact)+'/zip'); assert len(b)==size and hashlib.sha256(b).hexdigest()==sha
              z=zipfile.ZipFile(io.BytesIO(b)); assert z.testzip() is None and sum(i.file_size for i in z.infolist())<20000000
              return z
          archive=receipt(45712298154,15069010253,'c4fb63bf63544006c3de711d3d48c9b8d807ee8f',172556,'2afa5644b95e3f2f4226c995491336e94eb1f9e8227c8bc65db66c642af7ea7f')
          d=json.loads(archive.read('archive-windows.json')); assert d['native_run_id']=='45712298154'
          native=receipt(45808887211,15110777634,'0f60899e5b38f24bd635a63d0bee29b68851c376',1529,'2fbd4640a824d9d6b01b7918500b3b12f3b718084206454938722899ea3bf49a')
          n=json.loads(native.read('registry.json')); assert n['ok'] and n['provider_writes']==n['production_writes']==0 and not n['write_admission']
          mids=[1749,1748,1747,1746,1743,1742,1741,1739,1735,1734]
          by={int(r['target_mid']):r for r in n['rows']}; saved={int(r['target_message_id']):r for r in d['rows']}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw): return None
          opener=urllib.request.build_opener(NoRedirect()); holds={}; out=[]; gets=0
          for mid in mids:
              t=by[mid]; assert not t['registry_publication_present'] and not t['native_registry_identity_ambiguous'] and not t['prior_media_operation_hold'] and t['canonical_route_count']==0
              p=saved[mid]['public']; assert p['single_photo'] and p['other_media_count']==0 and len(p['buttons'])==1 and p['buttons'][0]['url_sha256']=='5a7e4f1dc3c08a29a685cbcaf0e01d6a190d0c1c7c192b00d766f245ee557e2a'
              row={'target_mid':mid,'caption':p['caption'],'caption_sha256':p['caption_sha256'],'photo_marker_sha256':p['photo_marker_sha256'],'published_unixtime':p['published_unixtime'],'button_sha256':p['buttons'][0]['url_sha256'],'native_inventory_run':45808887211,'current_public_revalidated':False,'write_admission':False}
              url=p['photo_url']; u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and not u.username and not u.password and u.port is None and re.fullmatch(r'(?:[a-z0-9-]+\.)*(?:telesco\.pe|cdn-telegram\.org|telegram-cdn\.org)',u.hostname or '')
              if u.hostname in holds:
                  row['hold']='retry_after_host_hold'; out.append(row); continue
              try:
                  gets+=1
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as response:
                      assert response.status==200; b=response.read(1000001); assert 0<len(b)<=1000000
                  ext='jpg' if b.startswith(b'\xff\xd8\xff') else 'png' if b.startswith(b'\x89PNG\r\n\x1a\n') else None
                  assert ext is not None
                  filename=f'target-{mid}.{ext}'; (ROOT/filename).write_bytes(b)
                  row['photo']={'path':filename,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              except urllib.error.HTTPError as e:
                  row['hold']='photo_http_'+str(e.code)
                  if e.code==429:
                      holds[u.hostname]={'retry_after_raw':e.headers.get('Retry-After'),'no_retry':True}
              except Exception:
                  row['hold']='photo_read_unavailable'
              out.append(row)
          report={'operation':'hotel_saved_target_actual_photo_preparation','native_run_id':os.environ['GITHUB_RUN_ID'],'reader_source_sha':os.environ['GITHUB_SHA'],'source_archive_run':45712298154,'target_inventory_run':45808887211,'write_admission':False,'provider_writes':0,'production_writes':0,'server_calls':0,'telegram_post_reads':0,'photo_gets':gets,'retry_after_holds':holds,'rows':out}
          (ROOT/'photos.json').write_text(json.dumps(report,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'rows':len(out),'downloaded':sum('photo' in r for r in out),'held':sum('hold' in r for r in out),'write_admission':False}))
          
          PY
      - name: Preserve existing preparation evidence and photographs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-saved-target-photo-preparation
          path: pub/*
          if-no-files-found: error
          retention-days: 7
