name: "#1566 Read only three existing small MAX and Telegram caption pairs"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
# Bounded reads of the same two prepared pairs; no provider writes; strict actual application fences.
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '3bfa5e6007344001b2b1f8c95e3e27cb62ca8609' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact candidate packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out main for the existing release verifier
        uses: actions/checkout@v4
        with:
          ref: 58f15d1a147353a4b807f122525d75e1f4f35c1c
          path: accepted
          persist-credentials: false
      - name: Authenticate original1732 terminal before bounded host observation
        working-directory: accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN);
            const before=await R.readRecord(api);
            const r=R.validateRelease(before.record).release;
            const expected='58f15d1a147353a4b807f122525d75e1f4f35c1c';
            if(r.repository_sha!==expected||r.application_sha!==expected||r.kind!=='installed'
              ||r.release.run_id!=='45712137845'||r.release.run_attempt!==1
              ||r.closure?.binding?.pr!==1732
              ||r.closure?.binding?.comment_id!==7077907800
              ||r.closure?.binding?.owner_id!==226193297
              ||r.closure?.binding?.head_sha!=='0fc466a23ca54ec7db7eccf8dccffdb0205dfcad'
              ||r.closure?.binding?.updated_at!=='2026-11-25T22:18:18Z')throw Error('original1732_changed');
            const resolved=await R.resolveCurrent(api,{sha:expected},before);
            if(!resolved.ready||resolved.repository_sha!==expected||resolved.application_sha!==expected)
              throw Error('original1732_not_canonically_accepted');
            const main=(await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha;
            const after=await R.readRecord(api);
            if(before.blob!==after.blob||before.record_digest!==after.record_digest)throw Error('accepted_record_changed');
            fs.mkdirSync('../pub',{recursive:true});
            fs.writeFileSync('../pub/accepted-read-admission.json',JSON.stringify({read_only:true,
              current_main_sha:main,observed_repository_sha:expected,application_sha:expected,
              technical_acceptance_complete:true,write_admission:false,canonical:resolved,
              record_commit:before.commit,record_blob:before.blob,record_digest:before.record_digest,
              original_installation_deploy:'45712137845',original_closer:r.closure.run_id,
              original_guard_pr:1732,checked_at_utc:new Date().toISOString()})+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'REPOSITORY_SHA='+expected+'\nAPPLICATION_SHA='+expected+'\n');
          }
          check().catch(e=>{console.error('readonly_accepted_installation_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Bind immutable packet to the admitted release and native run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = '9931623d23b085d2f344dde163b8d75e6982a753'
          mkdir -p pub
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php')
          program=p.read_text()
          for name,pattern in [('APPLICATION_SHA',r'[a-f0-9]{40}'),('REPOSITORY_SHA',r'[a-f0-9]{40}'),('NATIVE_RUN_ID',r'[1-9][0-9]{0,19}')]:
              value=os.environ['GITHUB_RUN_ID' if name=='NATIVE_RUN_ID' else name]
              assert re.fullmatch(pattern,value) and program.count('__'+name+'__') == 1
              program=program.replace('__'+name+'__',value)
          # Execute the reviewed reader helpers for the same two prepared pairs.
          # Preserve candidate holds, read-only SQL and the shared PRICE lease.
          assert program.count("$out=['schema'=>1") == 1
          program=program[:program.index("$out=['schema'=>1")]
          entry=r'''
          function editorialPhoto(array $s): ?string {
           $a=$s['attachments']??[];
           if(count($a)!==1||($a[0]['type']??'')!=='image')return null;
           $id=$a[0]['photo_id']??$a[0]['file_unique_id']??null;
           return is_string($id)?hash('sha256',($a[0]['provider']??'').':'.$id):null;
          }
          $scope=[102203=>['telegram'=>'1561','max'=>'AaHwVf1OCGc'],37931=>['telegram'=>'1554','max'=>'AaHwVbsRYzs'],102201=>['telegram'=>'1580','max'=>'AaHwWbJMJac']];
          $out=['schema'=>1,'issue'=>1566,'operation'=>'hotel_existing_small_caption_context','ok'=>false,
           'repository_sha'=>REPOSITORY_SHA,'application_sha'=>APPLICATION_SHA,'native_run_id'=>NATIVE_RUN_ID,
           'production_writes'=>0,'provider_writes'=>0,'bot_starts'=>0,'write_admission'=>false,'rows'=>[]];
          $pdo=null;$rates=[];$start=hrtime(true);$stage='runtime';$pubs=[];
          try {
           runtimeRead();$out['resources_before']=resourcesRead();
           $out['resource_budget']=serverReadBudgetRead($out['resources_before']);requireRead($out['resource_budget']['allowed'],'server_resource_hold');
           ob_start();try{require APP.'/config.php';require_once APP.'/services/ProjectConfig.php';require_once APP.'/services/ChannelPostRegistryService.php';require_once APP.'/services/ChannelPostButtonTransport.php';require_once APP.'/services/ChannelPostRuntime.php';require_once APP.'/services/ChannelPostEntryService.php';require_once APP.'/services/ChannelPostAdminService.php';require_once APP.'/integrations/ChannelPostApiTransport.php';}finally{ob_end_clean();}
           requireRead(ProjectConfig::projectId()==='anytour','project_changed');
           $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$registry=new ChannelPostRegistryService($pdo);
           $out['mysql_before']=mysqlResourcesRead($pdo);$stage='bounded_registry';$pdo->beginTransaction();
           foreach($scope as $hotel=>$ids)foreach(['telegram','max'] as $platform){
            $url=$platform==='telegram'?'https://t.me/any_toour/'.$ids[$platform]:'https://max.ru/channel_anytour/'.$ids[$platform];
            $row=['hotel_id'=>$hotel,'platform'=>$platform,'post_url'=>$url,'ok'=>false];
            try{
             $channel=$platform==='telegram'?10:9;
             $q=$pdo->prepare("SELECT p.id FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id AND v.publication_id=p.id WHERE p.post_channel_id=? AND JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.post_url'))=? LIMIT 2");
             $q->execute([$channel,$url]);$found=$q->fetchAll(PDO::FETCH_COLUMN);requireRead(count($found)===1,'small_pair_url_not_unique');
             $p=$registry->publication((int)$found[0]);$s=$p['snapshot']??[];
             requireRead(is_array($p)&&$p['project_key']==='anytour'&&$p['platform']===$platform&&(int)$p['channel']['id']===$channel&&$p['state']==='sent'&&($s['post_url']??null)===$url,'small_pair_identity_changed');
             $native=$s['metadata']['hotel_catalog_id']??null;$logical=$s['metadata']['logical_id']??null;
             requireRead((int)$native===$hotel&&$logical==='commercial-hotel-'.$hotel.'-v1','small_hotel_identity_changed');
             if($platform==='telegram')requireRead($p['message_id']===$ids[$platform]&&$p['bot_key']==='anyru_bot','small_telegram_identity_changed');
             $q=$pdo->prepare("SELECT COUNT(*) FROM post_versions WHERE publication_id=? AND (state IN ('claimed','write_started','unknown') OR claim_token IS NOT NULL OR claimed_at IS NOT NULL)");$q->execute([$p['publication_id']]);$active=(int)$q->fetchColumn();
             $button=ChannelPostButtonTransport::buttonUrl($p);$resolved=ChannelPostEntryService::resolve($platform,$p['start_payload'],$registry);
             $same=is_array($resolved)&&(int)$resolved['publication_id']===(int)$p['publication_id']&&(int)$resolved['version_id']===(int)$p['version_id'];
             $pubs[$hotel.':'.$platform]=$p;
             $row+=['publication_id'=>(int)$p['publication_id'],'version_id'=>(int)$p['version_id'],'content_hash'=>$p['content_hash'],'message_id'=>$p['message_id'],'channel_id'=>$p['channel_id'],'bot_key'=>$p['bot_key'],'source_key'=>$p['source_key'],'native_hotel_id'=>$native,'logical_id'=>$logical,'state'=>$p['state'],'published_at'=>$s['published_at']??null,'caption'=>$s['text']??'','caption_sha256'=>hash('sha256',$s['text']??''),'markup'=>$s['markup']??null,'entities'=>$s['entities']??null,'attachments_sha256'=>hash('sha256',jsonRead($s['attachments']??[])),'attachment_types'=>array_column($s['attachments']??[],'type'),'photo_signature_sha256'=>editorialPhoto($s),'button_url'=>$button,'button_text'=>$p['channel']['button_text'],'one_expected_button'=>ChannelPostIncomingAdapter::containsOnlyButton($s,$button,$p['channel']['button_text']),'current_token_resolves'=>$same,'active_or_unknown_versions'=>$active,'monitor_price_record_id'=>$s['metadata']['monitor_price_record_id']??null,'caption_correction_operation'=>$s['metadata']['caption_correction_operation']??null,'receipt_sha256'=>hash('sha256',jsonRead($p['receipt'])),'native_snapshot_verified'=>true];$row['ok']=true;
            }catch(Throwable $e){$row['hold_reason']=reasonRead($e);}
            $out['rows'][]=$row;
           }
           $pdo->rollBack();$out['mysql_after']=mysqlResourcesRead($pdo);
           // All provider HTTP occurs after the bounded SQL transaction has ended.
           requireRead(!$pdo->inTransaction(),'external_http_inside_transaction');$stage='independent_live_reads';
           foreach($out['rows'] as &$row){
            if(!$row['ok'])continue;$hotel=$row['hotel_id'];$platform=$row['platform'];$p=$pubs[$hotel.':'.$platform];
            try{
             if($platform==='max'){
              $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.$p['message_id'],[],null);
              if(($r['http']??0)===429){$row['retry_after']=$r['data']['parameters']['retry_after']??null;throw new RuntimeException('provider_retry_after_hold');}
              requireRead(empty($r['transport_error'])&&($r['http']??0)===200&&is_array($r['data']??null),'small_max_live_unavailable');$m=$r['data'];
              requireRead(($m['body']['mid']??null)===$p['message_id']&&(string)($m['recipient']['chat_id']??'')===$p['channel_id'],'small_max_live_identity_changed');
              $live=ChannelPostIncomingAdapter::maxSnapshot($m);$row['live_caption']=$live['text']??null;$row['live_caption_sha256']=hash('sha256',$live['text']??'');$row['live_photo_signature_sha256']=editorialPhoto($live);
              $row['live_matches_native']=$row['live_caption_sha256']===$row['caption_sha256']&&$row['live_photo_signature_sha256']===$row['photo_signature_sha256']&&($live['post_url']??null)===$row['post_url']&&ChannelPostIncomingAdapter::containsOnlyButton($live,$row['button_url'],$row['button_text']);
             }else{
              $raw=captionPublicBytes($row['post_url'].'?embed=1&mode=tme',$rates);requireRead($raw['ok'],'small_telegram_public_unavailable');$live=parsePublicRead($raw['body'],'any_toour',$scope[$hotel]['telegram']);$row['public']=$live;$row['live_caption']=$live['caption'];$row['live_caption_sha256']=$live['caption_sha256'];
              $row['live_matches_native']=$row['live_caption_sha256']===$row['caption_sha256'];$row['live_photo_native_equivalence']='not_proven_by_public_url';
             }
            }catch(Throwable $e){$row['live_hold_reason']=reasonRead($e);$row['live_matches_native']=false;}
           }unset($row);
           runtimeRead();$out['ok']=true;
          }catch(Throwable $e){$out['failure_stage']=$stage;$out['failure_reason']=reasonRead($e);}
          finally{if($pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();}
          $out['resources_after']=resourcesRead();$out['read_at_utc']=gmdate(DATE_ATOM);$out['read_elapsed_ms']=(int)((hrtime(true)-$start)/1000000);echo jsonRead($out),PHP_EOL;exit($out['ok']?0:2);
          '''
          pathlib.Path('pub/read-only.php').write_text(program+entry)
          PY
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read three exact small pairs without publication or full PRICE journal scan
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          status=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json || status=$?
          python3 - <<'PY'
          import json
          d=json.load(open('pub/registry.json'))
          assert d['operation']=='hotel_existing_small_caption_context' and d['issue']==1566
          assert d['production_writes']==d['provider_writes']==d['bot_starts']==0 and d['write_admission'] is False
          print(json.dumps({'ok':d['ok'],'failure_stage':d.get('failure_stage'),'reason':d.get('failure_reason'),'rows':[{'hotel_id':r['hotel_id'],'platform':r['platform'],'native':r['ok'],'live':r.get('live_matches_native'),'hold':r.get('hold_reason',r.get('live_hold_reason'))} for r in d['rows']]}))
          PY
          test "$status" -eq 0
      - name: Preserve the original bounded pair observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-preflight
          path: |
            pub/registry.json
          retention-days: 7
          if-no-files-found: warn

