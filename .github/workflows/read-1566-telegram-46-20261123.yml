name: "#1566 Preflight Utopia World in historical Telegram post 674"
on:
  push:
    branches: [ops/1566-telegram-46-native-read-20261123]
    paths: ['.github/workflows/read-1566-telegram-46-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
# Bounded read of one existing Telegram pair; no provider writes; strict actual application fences.
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '7e8dc1f8636c1f6279a26af711d2dc905c13024f' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact candidate packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out main for the existing release verifier
        uses: actions/checkout@v4
        with:
          ref: 1e9a88c7418f8e1af171571ef1df66f2856968e4
          path: accepted
          persist-credentials: false
      - name: Authenticate original1724 terminal before bounded host observation
        working-directory: accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN), before=await R.readRecord(api);
            const r=R.validateRelease(before.record).release, expected='1e9a88c7418f8e1af171571ef1df66f2856968e4';
            if(r.repository_sha!==expected||r.application_sha!==expected||r.kind!=='installed'||
              r.release.run_id!=='45883181416'||r.release.run_attempt!==1||r.closure?.run_id!=='45885250607'||
              r.closure?.binding?.pr!==1724||r.closure?.binding?.comment_id!==6818332618||
              r.closure?.binding?.owner_id!==226193297)throw Error('original1724_changed');
            const resolved=await R.resolveCurrent(api,{sha:expected},before);
            if(!resolved.ready||resolved.repository_sha!==expected||resolved.application_sha!==expected)throw Error('installation_not_accepted');
            const main=(await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha;
            if(main!==expected)throw Error('main_changed');
            const after=await R.readRecord(api);
            if(before.blob!==after.blob||before.record_digest!==after.record_digest)throw Error('accepted_record_changed');
            fs.mkdirSync('../pub',{recursive:true});
            fs.writeFileSync('../pub/accepted-read-admission.json',JSON.stringify({read_only:true,current_main_sha:main,
              application_sha:expected,write_admission:false,canonical:resolved,record_commit:before.commit,record_blob:before.blob,
              original_installation_deploy:r.release.run_id,original_closer:r.closure.run_id,checked_at_utc:new Date().toISOString()})+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'REPOSITORY_SHA='+expected+'\nAPPLICATION_SHA='+expected+'\n');
          }
          check().catch(e=>{console.error('readonly_accepted_installation_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Bind immutable packet to the admitted release and native run
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git hash-object tools/direct_demand/operations/read-1566-telegram-46-20261123.php)" = '9931623d23b085d2f344dde163b8d75e6982a753'
          mkdir -p pub
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path('tools/direct_demand/operations/read-1566-telegram-46-20261123.php')
          program=p.read_text()
          for name,pattern in [('APPLICATION_SHA',r'[a-f0-9]{40}'),('REPOSITORY_SHA',r'[a-f0-9]{40}'),('NATIVE_RUN_ID',r'[1-9][0-9]{0,19}')]:
              value=os.environ['GITHUB_RUN_ID' if name=='NATIVE_RUN_ID' else name]
              assert re.fullmatch(pattern,value) and program.count('__'+name+'__') == 1
              program=program.replace('__'+name+'__',value)
          # Execute the reviewed reader helpers for source-only preparation.
          # Preserve candidate holds and read-only SQL.
          assert program.count("$out=['schema'=>1") == 1
          program=program[:program.index("$out=['schema'=>1")]
          entry=r'''
          $out=['schema'=>1,'issue'=>1566,'operation'=>'hotel_exact_1569_674_pair_read','ok'=>false,
            'repository_sha'=>REPOSITORY_SHA,'application_sha'=>APPLICATION_SHA,'native_run_id'=>NATIVE_RUN_ID,
            'production_writes'=>0,'provider_writes'=>0,'bot_starts'=>0,'write_admission'=>false,'rows'=>[]];
          $pdo=null;$lock=null;$start=hrtime(true);$rates=[];
          $pair=['source'=>'571','source_publication'=>1262,'target'=>'674','target_date'=>1718108038,
            'target_caption'=>'daca99cd3dd8604db0d9ef6a52d09f1c7a283d479901779ab84e77c4fe38cd2e',
            'target_photo'=>'981199596f1f20ff68516b556b5cd4763d714e519f72e1d05d1d388a181dbacc'];
          try {
            runtimeRead();
            requireRead(realpath(OPERATIONS)===OPERATIONS,'operations_root_changed');
            $out['resource_budget']=serverReadBudgetRead(resourcesRead());
            requireRead($out['resource_budget']['allowed'],'server_resource_hold');
            $prior=telegramMediaOperationRead($pair['target']);
            [$sp,$tp]=telegramPreparedPairPublicRead($pair,$prior,static function(string $channel,string $message)use(&$rates):array {
              try {
                $snapshots=[];
                foreach(['embed','archive'] as $kind) {
                  $url=$kind==='embed'?'https://t.me/'.$channel.'/'.$message.'?embed=1&mode=tme':
                    'https://t.me/s/'.$channel.'?before='.((int)$message+1);
                  $read=captionPublicBytes($url,$rates);
                  requireRead($read['ok'],'pair_public_unavailable');
                  $snapshots[$kind]=parsePublicRead($read['body'],$channel,$message);
                }
                $seen=corroborateTargetKeyboard($snapshots['embed'],$snapshots['archive']);
                $seen['ok']=true;
                return $seen;
              } catch(Throwable $e) {return ['ok'=>false,'reason'=>reasonRead($e)];}
            });
            $out['public_evidence']=['source'=>array_intersect_key($sp,array_flip(['ok','reason','caption_sha256','published_unixtime','single_photo'])),
              'target'=>array_intersect_key($tp,array_flip(['ok','reason','caption_sha256','published_unixtime','single_photo','photo_marker_sha256'])),
              'target_buttons'=>isset($tp['buttons'])?count($tp['buttons']):null];
            ob_start();try {
              require APP.'/config.php';
              require_once APP.'/services/ProjectConfig.php';
              require_once APP.'/services/ChannelPostRegistryService.php';
              require_once APP.'/services/ChannelPostButtonTransport.php';
              require_once APP.'/services/ChannelPostRuntime.php';
              require_once APP.'/hotel-posts-telegram-main19.php';
              require_once APP.'/tools/anytour_existing_post_batch.php';
            } finally {ob_end_clean();}
            requireRead(ProjectConfig::projectId()==='anytour','project_changed');
            $feed=anytourTelegramFeedOfferUrls(anytourTelegramFeedRead());
            $routes=anytourTelegramFeedDestinationPosts($feed);
            $pdo=ConversationDb::connection();
            $pdo->exec('SET SESSION TRANSACTION READ ONLY');
            $registry=new ChannelPostRegistryService($pdo);
            $rights=\AnyTour\ExistingPostBatch\transferChannelRights($registry);
            $out['native_channel_rights']=(int)($rights['id']??0)===6;
            $lease=OPERATIONS.'/monitor-price-after-collection-v1.jsonl';
            requireRead(!is_link($lease)&&is_file($lease),'price_editor_lease_unknown');
            $lock=fopen($lease,'rb');
            requireRead(is_resource($lock)&&flock($lock,LOCK_SH|LOCK_NB),'price_editor_busy_or_unknown');
            runtimeRead();
            $pdo->beginTransaction();
            $out['rows'][]=telegramPreparedPairNativeRead(1569,$pair,['source'=>$sp,'target'=>$tp],$prior,
              $out['native_channel_rights'],$feed,$routes,
              static fn(int $hotel,array $params):array=>telegramPreparedPairTargetRead($pdo,$registry,$hotel,$params),
              static fn(int $hotel,array $params):array=>telegramPreparedPairSourceRead($pdo,$registry,$hotel,$params),
              'telegramMediaOperationRead');
            $pdo->rollBack();
            runtimeRead();
            $out['ok']=true;
          } catch(Throwable $e) {$out['failure_reason']=reasonRead($e);}
          finally {
            if($pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();
            if(is_resource($lock)){flock($lock,LOCK_UN);fclose($lock);}
          }
          $out['public_retry_after_holds']=$rates;
          $out['elapsed_ms']=(int)((hrtime(true)-$start)/1000000);
          echo jsonRead($out),PHP_EOL;
          exit($out['ok']?0:2);
          '''
          pathlib.Path('pub/read-only.php').write_text(program+entry)
          PY
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Observe exact source 571 and target 674 without writing
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          status=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json || status=$?
          python3 - <<'PY'
          import json
          d=json.load(open('pub/registry.json'))
          assert d['operation']=='hotel_exact_1569_674_pair_read' and d['issue']==1566
          assert d['production_writes']==d['provider_writes']==d['bot_starts']==0 and d['write_admission'] is False
          print(json.dumps(d,ensure_ascii=False))
          PY
          test "$status" -eq 0
      - name: Preserve the original bounded source observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-telegram-ranked-source-target-preparation
          path: |
            pub/registry.json
            pub/accepted-read-admission.json
          retention-days: 7
          if-no-files-found: warn

