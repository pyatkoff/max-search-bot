name: "#1566 Move three hotel cards into exact existing MAX photo posts"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/edit-1566-historical-max-photo-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  edit_existing:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '12b7a16d91500ee027e175618c53ed87362d4d68' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout the release used by the original source audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4980fac645b5e81878b1280fc3ea079b1b187623
          persist-credentials: false
          path: accepted-release
      - name: Bind the same three plans to the accepted release and fresh native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scope=tools/direct_demand/operations/max-existing-photo/scope-commercial-albums-20261125.json
          test "$(git hash-object "$scope")" = c2bfcce7329f8de60c5d21a3c15f62cae6ea7489
          mkdir -p pub
          node - <<'NODE'
          const R=require('./accepted-release/tools/deployment_release')
          const api=R.makeReadApi(process.env.GH_TOKEN)
          const {setTimeout:wait}=require('node:timers/promises')
          const {writeFileSync}=require('node:fs')
          async function run() {
            const main='4980fac645b5e81878b1280fc3ea079b1b187623', root=R.API_ROOT, id=45588255112
            for(let n=0;n<68;n++) {
              if ((await api('GET',root+'/git/ref/heads/main')).object.sha!==main) throw Error('main_changed')
              const x=await api('GET',root+'/actions/runs/'+id)
              if(x.repository.id!==1342493152||x.head_sha!=='fa9ec3612d6a15f7bd52212fe141c50241f51aa5'||x.run_attempt!==1||x.event!=='push'||x.path!=='.github/workflows/read-1566-max-archive-20261123.yml') throw Error('native_run_changed')
              if(x.status==='completed') {
                if(x.conclusion!=='success') throw Error('native_read_failed')
                const slot=await api('GET',root+'/issues/comments/6928374515')
                if(slot.user.id!==226193297||slot.body!=='PR1711: установлено, выпуск свободен') throw Error('publisher_busy_or_changed')
                const artifact=await api('GET',root+'/actions/runs/'+id+'/artifacts?per_page=30')
                const jobs=await api('GET',root+'/actions/runs/'+id+'/attempts/1/jobs?per_page=100')
                const z=artifact.artifacts[0], j=jobs.jobs[0]
                if(artifact.total_count!==1||z.expired||z.name!=='max-commercial-album-sources'||!/^sha256:[a-f0-9]{64}$/.test(z.digest)||!Number.isSafeInteger(z.id)||z.workflow_run.id!==id||
                  jobs.total_count!==1||j.conclusion!=='success'||!Number.isSafeInteger(j.id)) throw Error('native_artifact_changed')
                const record=await R.readRecord(api)
                const actual=await R.resolveCurrent(api,{sha:main},record)
                if(!actual.ready||actual.repository_sha!==main||!/^[a-f0-9]{40}$/.test(actual.application_sha))throw Error('application_unaccepted')
                writeFileSync('pub/live-binding.json',JSON.stringify({job:j.id,artifact:z.id,digest:z.digest.slice(7),slot:slot.body,app:actual.application_sha,main}))
                return
              }
              if(n<67)await wait(15000)
            }
            throw Error('native_read_timeout')
          }
          run().catch(e=>{console.error(e.message);process.exitCode=1})
          NODE
          artifact="$(python3 -c 'import json; print(json.load(open("pub/live-binding.json"))["artifact"])')"
          gh api "/repos/pyatkoff/max-search-bot/actions/artifacts/$artifact/zip" > pub/native.zip
          python3 - "$scope" <<'PY'
          import hashlib,json,os,pathlib,re,sys,zipfile
          b=json.loads(pathlib.Path('pub/live-binding.json').read_bytes())
          archive=pathlib.Path('pub/native.zip')
          assert archive.stat().st_size<300000 and hashlib.sha256(archive.read_bytes()).hexdigest()==b['digest']
          with zipfile.ZipFile(archive) as z:
              assert z.namelist()==['registry.json'] and z.getinfo('registry.json').file_size<=2000000
              content=z.read('registry.json')
          read=json.loads(content)
          assert read['ok'] and read['operation']=='max_commercial_album_sources_read_only' and read['target_editor_rights'] is True
          assert read['repository_sha']==b['main'] and read['application_sha']==b['app']
          assert read['provider_writes']==read['db_writes']==read['bot_starts']==0
          assert read['button_text']=='✈️ Рассчитать на мои даты' and len(read['rows'])==3
          expected={r['hotel_id']:r for r in read['rows']}
          path=pathlib.Path(sys.argv[1])
          scope=json.loads(path.read_bytes())
          assert [r['hotel_id'] for r in scope['rows']]==[107938,954,73055] and set(expected)=={107938,954,73055}
          for r in scope['rows']:
              proof=expected[r['hotel_id']]
              for key in ('source_id','source_mid','target_mid','target_url'):
                  assert proof[key]==r[key]
              assert proof['target_matches_native_archive'] and proof['source_photo_matches_registry'] and proof['source_name_in_native_caption']
              assert proof['source_held']==proof['target_occupied']==proof['target_or_hotel_registry_conflicts']==0
              assert re.fullmatch('[a-f0-9]{64}',proof['original_legacy_identity_sha256'])
              r['original_legacy_identity_sha256']=proof['original_legacy_identity_sha256']
          digest=hashlib.sha256(content).hexdigest()
          scope['native_source']={'operation':read['operation'],'run_id':45588255112,'attempt':1,'job_id':b['job'],'artifact_id':b['artifact'],
              'zip_sha256':b['digest'],'json_sha256':digest,'repository_sha':b['main'],'application_sha':b['app'],'workflow_head':'fa9ec3612d6a15f7bd52212fe141c50241f51aa5'}
          scope['publisher']['body']=b['slot']
          scope['price_review']['source_versions']=[{'hotel_id':r['hotel_id'],'version':r['source_version'],'stored_price_observation':r['observed_source_price_stamp']} for r in read['rows']]
          scope['price_review']['checked_utc']=read['observed_utc']
          path.write_text(json.dumps(scope,ensure_ascii=False,indent=2)+'\n')
          for k in (b['main'],b['app'],digest):
              assert re.fullmatch('[a-f0-9]{40}|[a-f0-9]{64}',k)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"ALBUM_NATIVE_SHA={digest}\nALBUM_APP={b['app']}\nALBUM_REPO={b['main']}\n")
          PY
      - name: Verify the receipts, current release and existing publisher before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/direct_demand/operations/max-existing-photo/admit.js
      - name: Verify the existing editor and stage the three matched plans
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub/stage
          src=tools/direct_demand/operations/max-existing-photo
          php tests/run_1566_max_existing_photo_batch.php
          python3 tests/run_1566_max_existing_photo_partial.py
          for file in "$src"/*.php; do php -l "$file"; done
          install -m600 "$src"/{editor.php,batch_input.php,batch_entry.php,observe_pair.php,run_batch.py} pub/stage/
          install -m600 "$src"/scope-commercial-albums-20261125.json pub/stage/scope.json
          cp pub/stage/scope.json pub/manifest.json
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14910511299/zip > pub/archive.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          stage=pathlib.Path('pub/stage')
          scope_bytes=(stage/'scope.json').read_bytes()
          scope=json.loads(scope_bytes)
          for key,zip_hash,json_hash,output in [
              ('archive',scope['archive_sha256'],scope['archive_registry_sha256'],'native-targets.json'),
              ('native',scope['native_source']['zip_sha256'],scope['native_source']['json_sha256'],'native-source.json')]:
              artifact=pathlib.Path('pub/'+key+'.zip')
              assert artifact.stat().st_size<300000 and hashlib.sha256(artifact.read_bytes()).hexdigest()==zip_hash
              with zipfile.ZipFile(artifact) as z:
                  assert z.namelist()==['registry.json'] and z.getinfo('registry.json').file_size<=2000000
                  data=z.read('registry.json')
              assert hashlib.sha256(data).hexdigest()==json_hash
              (stage/output).write_bytes(data)
          entry=stage/'batch_entry.php'
          src=entry.read_text()
          src,count=re.subn(r"(const MAX_BATCH_SCOPE_SHA256 = ')[a-f0-9]{64}(')",lambda m:m[1]+hashlib.sha256(scope_bytes).hexdigest()+m[2],src)
          assert count==1
          entry.write_text(src)
          PY
          php -l pub/stage/batch_entry.php
          php pub/stage/editor.php --batch-plan pub/stage/native-targets.json pub/stage/native-source.json "$ALBUM_NATIVE_SHA" "$ALBUM_REPO" "$ALBUM_APP" > pub/batch-plan.json
          python3 - <<'PY'
          import json
          data=json.load(open('pub/batch-plan.json'))
          assert data['ready']==[107938,954,73055] and not data['held'] and data['provider_writes']==0
          PY
          cat > pub/stage/execute.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          stage="$(cd -- "$1" && pwd -P)"
          cd /var/www/anytoour/data/www/app.anytoour.ru
          app="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["native_source"]["application_sha"])' "$stage/scope.json")"
          test "$(git rev-parse HEAD)" = "$app"
          python3 "$stage/run_batch.py" "$stage"
          SH
          bash -n pub/stage/execute.sh
          tar -C pub/stage -cf pub/approved.tar editor.php batch_input.php batch_entry.php observe_pair.php scope.json native-targets.json native-source.json run_batch.py execute.sh
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Recheck the publisher immediately before transferring the sealed plans
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/direct_demand/operations/max-existing-photo/admit.js
      - name: Edit only each verified existing ID and capture its independent receipt
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'bash -c '"'"'set -euo pipefail; umask 077; stage=$(mktemp -d /tmp/anytour-1566-old-max.XXXXXXXX); trap "rm -f -- \"$stage\"/*; rmdir -- \"$stage\"" EXIT; tar --no-same-owner --no-same-permissions -C "$stage" -xf -; bash "$stage/execute.sh" "$stage"'"'"'' < pub/approved.tar | tee pub/native-results.txt
          python3 - <<'PY'
          import json,pathlib
          expected = [r['hotel_id'] for r in json.loads(pathlib.Path('pub/manifest.json').read_bytes())['rows']]
          rows = []
          for line in pathlib.Path('pub/native-results.txt').read_text().splitlines():
              if not line.startswith('RESULT '):
                  continue
              _, hotel, payload = line.split(' ', 2)
              d = json.loads(payload)
              assert d['hotel'] == int(hotel) and d.get('new_posts', 0) == 0 and d.get('ad_writes', 0) == 0
              assert d['state'] in {'existing_max_message_updated_and_verified','stopped_before_edit','held_no_retry','untouched','unobserved'}
              rows.append(d)
          assert [r['hotel'] for r in rows] == expected
          accepted = [r['hotel'] for r in rows if r['state'] == 'existing_max_message_updated_and_verified']
          summary = {'state':'complete' if len(accepted)==len(expected) else 'partial' if accepted else 'none_accepted','native_accepted':accepted,'rows':rows}
          pathlib.Path('pub/summary.json').write_text(json.dumps(summary,indent=2))
          print('Native confirmations', len(accepted), 'of', len(expected), accepted)
          PY
      - name: Read each same public MAX address independently
        if: always()
        run: |
          set -euo pipefail
          umask 077
          test -f pub/native-results.txt || exit 0
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,re,time
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from datetime import datetime,timezone
          original=json.loads(Path('pub/manifest.json').read_text())['rows']
          native=[json.loads(line.split(' ',2)[2]) for line in Path('pub/native-results.txt').read_text().splitlines() if line.startswith('RESULT ')]
          accepted={r['hotel'] for r in native if r.get('state')=='existing_max_message_updated_and_verified'}
          plans=[{'id':r['hotel_id'],'url':r['target_url'],'title':r['name'],'caption':r['caption_without_price']} for r in original if r['hotel_id'] in accepted]
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hide=0; self.meta={}
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.hide+=1
                  if t=='meta':
                      d=dict(a)
                      key=d.get('property') or d.get('name')
                      if key: self.meta[key]=d.get('content','')
              def handle_endtag(self,t):
                  if t in ('script','style') and self.hide: self.hide-=1
              def handle_data(self,v):
                  if not self.hide and v.strip(): self.parts.append(v.strip())
          def norm(v):
              return re.sub(r'\s+',' ',v).strip()
          def read(row):
              try:
                  req=urllib.request.Request(row['url'],headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(3000001)
                      status,url=r.status,r.geturl()
                  assert len(raw)<=3000000 and url==row['url']
                  p=Page();p.feed(raw.decode('utf-8'))
                  visible=norm('\n'.join(p.parts).split('Другие публикации канала',1)[0])
                  declared=norm(p.meta.get('og:description',''))
                  exact=norm(row['caption'])
                  out={'hotel_id':row['id'],'url':url,'http':status,'named':row['title'] in visible or row['title'] in declared,
                       'caption_matches':exact in visible or exact in declared,'photo_preview':bool(p.meta.get('og:image')),
                       'public_button_label_visible':'Рассчитать на мои даты' in visible,
                       'page_sha256':hashlib.sha256(raw).hexdigest(),
                       'escaped_variant_visible': '&amp;' in visible or '&amp;' in declared}
                  out['verified']=out['named'] and out['caption_matches'] and out['photo_preview']
                  return out
              except (OSError,ValueError,AssertionError) as e:
                  return {'hotel_id':row['id'],'url':row['url'],'error':type(e).__name__,'verified':False}
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(read,plans))
          if not all(r['verified'] for r in results):
              time.sleep(5)
              results=[r if r['verified'] else read(p) for r,p in zip(results,plans)]
          out={'observed_utc':datetime.now(timezone.utc).isoformat(),'rows':results,'writes':0,'ad_clicks':0}
          Path('pub/observation.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX_COMMERCIAL_ALBUM_PUBLIC_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Preserve exact original receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-max-edits-existing-only
          path: |
            pub/manifest.json
            pub/native-results.txt
            pub/summary.json
            pub/observation.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
