name: "#1566 Test the sealed plans for both untouched existing MAX posts"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/edit-1566-historical-max-photo-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  edit_existing:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '439f1b7c4e1ea9cd382d04174a7e3529a9d28d49' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify both existing editor inputs on the original authenticated archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          php tests/run_1566_max_existing_photo_batch.php
          python3 tests/run_1566_max_existing_photo_partial.py
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14910511299/zip > original.zip
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,re,zipfile
          scope=json.loads(pathlib.Path('tools/direct_demand/operations/max-existing-photo/scope-rixos-mairid-20261125.json').read_bytes())
          data=pathlib.Path('original.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()==scope['archive_sha256']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.namelist()==['registry.json']
              raw=z.read('registry.json')
          archive=json.loads(raw)
          assert archive['history_complete'] and archive['native_run_id']==scope['archive_run_id']
          assert archive['production_writes']==archive['provider_writes']==0
          assert hashlib.sha256(raw).hexdigest()==scope['archive_registry_sha256']
          plans=scope['rows']
          assert [r['hotel_id'] for r in plans]==[2575,47025]
          assert all(len({r[key] for r in plans})==2 for key in ('source_id','source_mid','target_mid','target_url'))
          joined=[]
          for r in plans:
              matches=[a for a in archive['rows'] if a['mid']==r['target_mid']]
              assert len(matches)==1
              a=matches[0]
              photo_count=r.get('target_photo_count',1)
              assert a['media']==['image']*photo_count and not any(a[k] for k in ('registered','keyboard_present','linked_message'))
              assert a['published_ms']==r['target_ms'] and a['url']==r['target_url'] and a['fingerprint']==r['target_fingerprint']
              assert r['name'].lower() in r['caption_without_price'].splitlines()[0].lower()
              assert not re.search(r'https?://|₽|\b(?:RUB|EUR|USD)\b',r['caption_without_price'],re.I)
              for field,kind in [('target','anytour'),('source','channel_anytour')]:
                  expected=base64.urlsafe_b64encode(bytes.fromhex(r[field+'_mid'][-16:])).rstrip(b'=').decode()
                  assert r[field+'_url']=='https://max.ru/'+kind+'/'+expected
              joined.append({'hotel_id':r['hotel_id'],'target_url':r['target_url'],'target_mid':r['target_mid'],'photos':photo_count})
          print('MAX_TWO_ARCHIVE_INPUTS='+json.dumps({'rows':joined,'writes':0,'provider_calls':0},separators=(',',':')))
          PY
