name: "#1566 Apply only Rixos to the independently confirmed commercial MAX post"
on:
  pull_request:
    branches: [audit/1566-main-hotel-registry-20261119]
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/edit-1566-historical-max-photo-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  validate_source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check the real batch input and the three-phase runner
        run: |
          php tests/run_1566_max_existing_photo_batch.php
          python3 -B tests/run_1566_max_existing_photo_partial.py
          bash -n tools/direct_demand/operations/max-existing-photo/run_remote_batch.sh

  prepare:
    if: >-
      github.event_name == 'push' && github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '8e2b2fe1eaea7e4299e40a57a072e90c0c6a66da' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      prepared: ${{ steps.seal.outputs.prepared }}
      archive_sha: ${{ steps.seal.outputs.archive_sha }}
      receipt_sha: ${{ steps.seal.outputs.receipt_sha }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
      admission_sha: ${{ steps.seal.outputs.admission_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aceadeddd35a89307a9a307e891214d9c0be2af6
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f0ac8ff44afc64386be1802068102ccc9c0a55d4
          path: approved-editor
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false
      - name: Authenticate the original reads and compile the single approved input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub/stage
          cat > pub/admit.cjs <<'NODE'
          const R=require('../tools/deployment_release')
          const P=require('../tools/release_priority')
          const api=R.makeReadApi(process.env.GITHUB_TOKEN)
          const root=R.API_ROOT, app='aceadeddd35a89307a9a307e891214d9c0be2af6'
          function check(ok,reason){if(!ok)throw Error(reason)}
          async function run(){
            const fresh=Date.parse('2026-11-26T13:44:17+00:00')
            check(Date.now()>=fresh&&Date.now()-fresh<=720000,'route_receipt_stale')
            const [main,hotelSlot,releaseSlot]=await Promise.all([api('GET',root+'/git/ref/heads/main'),
              api('GET',root+'/issues/comments/6818332618'),api('GET',root+'/issues/comments/6682640708')])
            check(main.object.sha===app&&hotelSlot.user.id===226193297&&hotelSlot.body==='PR1741: установлено, выпуск свободен'
              &&releaseSlot.user.id===226193297&&releaseSlot.body==='PR1742: установлено, выпуск свободен','shared_release_changed')
            const record=await R.readRecord(api)
            const current=await R.resolveCurrent(api,{sha:app},record)
            check(current.ready&&current.repository_sha===app&&current.application_sha===app,'current_release_changed')
            await P.verifyPreviousRelease({repository:R.REPOSITORY,baseSha:app},process.env.GITHUB_TOKEN,fetch)
          }
          async function receipt(id,head,path,jobId,artifactId,digest,name){
            const base=root+'/actions/runs/'+id
            const [r,j,a]=await Promise.all([api('GET',base),api('GET',base+'/attempts/1/jobs?per_page=100'),api('GET',base+'/artifacts?per_page=100')])
            check(r.id===id&&r.repository.id===1342493152&&r.actor.id===226193297&&r.head_sha===head&&r.path===path
              &&r.event==='push'&&r.run_attempt===1&&r.status==='completed'&&r.conclusion==='success','original_read_changed')
            check(j.total_count===1&&j.jobs[0].id===jobId&&j.jobs[0].conclusion==='success','original_job_changed')
            const file=a.artifacts[0]
            check(a.total_count===1&&file.id===artifactId&&file.name===name&&file.expired===false
              &&file.digest==='sha256:'+digest&&file.workflow_run.id===id&&file.workflow_run.head_sha===head,'original_artifact_changed')
          }
          async function all(){
            if(process.argv[2]==='verify-originals') await Promise.all([
              receipt(45630394590,'3a9195debcfbeb703a220895871f5a40a61d3010','.github/workflows/read-1566-max-archive-20261123.yml',139261677044,15032515599,'354407dec77c2ffc3b8ed739e5a3f3aac422a0120578c0501183bbe36ea8d795','issue-1566-main-max-archive-inventory'),
              receipt(45831791225,'8e2b2fe1eaea7e4299e40a57a072e90c0c6a66da','.github/workflows/read-1566-old-ordinary-max-posts.yml',139950158848,15122044230,'cf071668969c0fad12759f53aa241f8f76e5e512fd1cfd003c97c31cfa4a3f5f','max-commercial-album-sources')
            ])
            await run()
          }
          all().catch(error=>{console.error(error.code||error.message);process.exitCode=1})
          NODE
          node pub/admit.cjs verify-originals
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15032515599/zip > pub/old.zip
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15122044230/zip > pub/native.zip
          src=approved-editor/tools/direct_demand/operations/max-existing-photo
          php approved-editor/tests/run_1566_max_existing_photo_batch.php
          python3 approved-editor/tests/run_1566_max_existing_photo_partial.py
          install -m600 "$src"/{editor.php,batch_input.php,batch_entry.php,observe_pair.php} pub/stage/
          install -m600 workflow-source/tools/direct_demand/operations/max-existing-photo/run_batch.py pub/stage/
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          stage=pathlib.Path('pub/stage')
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def receipt(name,expected):
              filename=pathlib.Path('pub',name+'.zip')
              assert filename.stat().st_size<300000 and digest(filename.read_bytes())==expected
              with zipfile.ZipFile(filename) as archive:
                  assert archive.namelist()==['registry.json'] and archive.getinfo('registry.json').file_size<=2000000
                  return archive.read('registry.json')
          old_sha='354407dec77c2ffc3b8ed739e5a3f3aac422a0120578c0501183bbe36ea8d795'
          native_sha='cf071668969c0fad12759f53aa241f8f76e5e512fd1cfd003c97c31cfa4a3f5f'
          old=receipt('old',old_sha)
          native=receipt('native',native_sha)
          assert digest(native)=='347b85aab1607c2c03cf0b8d8b7fe303e5c4081ca762513d9ca30102ab16bb62'
          read=json.loads(native)
          row=json.loads(r'''{"hotel_id":2575,"name":"Rixos Al Mairid Ras Al Khaimah","source_id":1342,"source_mid":"mid.ffffb6caf0606fed01a1d46c23c52cc7","source_url":"https://max.ru/channel_anytour/AaHUbCPFLMc","target_mid":"mid.ffffc1752b045fed019aca84b9721cb5","target_url":"https://max.ru/anytour/AZrKhLlyHLU","target_ms":1764334287218,"target_fingerprint":"e3795cf0d15eac4e3ac05abea6a3d79d9b706416b7926a7d6234bd8f6c5658cc","caption_without_price":"✈️ Туры в Rixos Al Mairid Ras Al Khaimah\n📍 Рас-эль-Хайма, ОАЭ\nПесчаный пляж и номера в виллах для семейного отдыха у моря.","original_legacy_identity_sha256":"06c4ed395de06cf877c2b9e7332f7bbfa4f6f4fcc83cb9338c2400a607562b2b"}''')
          app='aceadeddd35a89307a9a307e891214d9c0be2af6'
          assert read['ok'] and read['target_editor_rights'] and read['archive_run']==45630394590
          assert read['application_sha']==read['repository_sha']==app
          assert read['provider_writes']==read['db_writes']==read['bot_starts']==0
          assert read['button_text']=='✈️ Рассчитать на мои даты' and len(read['rows'])==1
          proof=read['rows'][0]
          assert all(proof[k]==row[k] for k in ('hotel_id','source_id','source_mid','target_mid','target_url','original_legacy_identity_sha256'))
          assert proof['target_occupied']==proof['source_held']==proof['target_or_hotel_registry_conflicts']==0
          assert proof['source_hotel_id_matches'] is False and proof['source_catalog_id']==0
          assert proof['readable_source_hotel_identity'] and proof['source_button_resolves_publication']
          assert proof['source_photo_matches_registry'] and proof['target_matches_native_archive']
          route={'repository':'pyatkoff/tour-max','run_id':45832028822,'job_id':139950987300,'observed_utc':'2026-11-26T13:44:17+00:00','write_calls':0}
          scope={'version':1,'archive_run_id':'45630394590','archive_sha256':old_sha,'archive_registry_sha256':digest(old),
              'rows':[row],'native_source':{'operation':read['operation'],'run_id':45831791225,'attempt':1,'job_id':139950158848,
              'workflow_head':'8e2b2fe1eaea7e4299e40a57a072e90c0c6a66da','artifact_id':15122044230,'zip_sha256':native_sha,'json_sha256':digest(native),
              'repository_sha':app,'application_sha':app},'route_readback':route,
              'price_review':{'mode':'caption_without_fixed_price'}}
          encoded=(json.dumps(scope,ensure_ascii=False,indent=2)+'\n').encode()
          (stage/'scope.json').write_bytes(encoded)
          (stage/'native-targets.json').write_bytes(old)
          (stage/'native-source.json').write_bytes(native)
          pathlib.Path('pub/manifest.json').write_bytes(encoded)
          entry=stage/'batch_entry.php'
          code,count=re.subn(r"(const MAX_BATCH_SCOPE_SHA256 = ')[a-f0-9]{64}(')",lambda m:m[1]+digest(encoded)+m[2],entry.read_text())
          assert count==1
          entry.write_text(code)
          PY
          php -l pub/stage/batch_entry.php
          php pub/stage/editor.php --batch-plan pub/stage/native-targets.json pub/stage/native-source.json 347b85aab1607c2c03cf0b8d8b7fe303e5c4081ca762513d9ca30102ab16bb62 aceadeddd35a89307a9a307e891214d9c0be2af6 aceadeddd35a89307a9a307e891214d9c0be2af6 > pub/batch-plan.json
          python3 - <<'PY'
          import json
          d=json.load(open('pub/batch-plan.json'))
          assert d['provider_writes']==0 and {int(k) for k in d['ready']}=={2575} and not d['held']
          PY
          cat > pub/stage/execute.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          stage="$(cd -- "$1" && pwd -P)"
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = 'aceadeddd35a89307a9a307e891214d9c0be2af6'
          case "$2" in
            prepare) python3 "$stage/run_batch.py" "$stage" --prepare ;;
            apply) python3 "$stage/run_batch.py" "$stage" --apply-prepared "$stage/preparation.json" "$3" ;;
            *) exit 2 ;;
          esac
          SH
          tar -C pub/stage -cf pub/approved.tar editor.php batch_input.php batch_entry.php observe_pair.php scope.json native-targets.json native-source.json run_batch.py execute.sh
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        run: bash workflow-source/tools/direct_demand/operations/max-existing-photo/run_remote_batch.sh pin-host
      - name: Prepare native checkpoints without editing posts
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash workflow-source/tools/direct_demand/operations/max-existing-photo/run_remote_batch.sh prepare - \
            < pub/approved.tar > pub/preparation.json
      - name: Bind the preparation to its exact package
        id: seal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          pub=pathlib.Path('pub')
          manifest=json.loads((pub/'manifest.json').read_bytes())
          receipt=json.loads((pub/'preparation.json').read_bytes())
          assert receipt['contract']=='anytour-max-transfer-preparation-v1' and receipt['provider_writes']==0
          rows=receipt['rows']
          assert [r['hotel_id'] for r in rows]==[r['hotel_id'] for r in manifest['rows']]
          ready=sum(r['state']=='ready_read_only' for r in rows)
          print(f'Native checkpoints ready: {ready}/{len(rows)}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('prepared='+str(ready>0).lower(),file=out)
              for key,name in (('archive_sha','approved.tar'),('receipt_sha','preparation.json'),
                               ('manifest_sha','manifest.json'),('admission_sha','admit.cjs')):
                  print(key+'='+hashlib.sha256((pub/name).read_bytes()).hexdigest(),file=out)
          PY
      - name: Store the exact inputs and native preparation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-max-prepared-${{ github.run_attempt }}
          path: |
            pub/approved.tar
            pub/admit.cjs
            pub/manifest.json
            pub/preparation.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove runner-only connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
  edit_existing:
    needs: prepare
    if: needs.prepare.outputs.prepared == 'true'
    concurrency:
      group: anytour-authorized-channel-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aceadeddd35a89307a9a307e891214d9c0be2af6
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false
      - name: Retrieve this run's prepared batch
        uses: actions/download-artifact@v4
        with:
          name: issue-1566-max-prepared-${{ github.run_attempt }}
          path: pub
      - name: Verify the prepared bytes before loading the publisher credentials
        env:
          ARCHIVE_SHA: ${{ needs.prepare.outputs.archive_sha }}
          RECEIPT_SHA: ${{ needs.prepare.outputs.receipt_sha }}
          MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
          ADMISSION_SHA: ${{ needs.prepare.outputs.admission_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for digest in "$ARCHIVE_SHA" "$RECEIPT_SHA" "$MANIFEST_SHA" "$ADMISSION_SHA"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          cd pub
          printf '%s  %s\n' "$ARCHIVE_SHA" approved.tar "$RECEIPT_SHA" preparation.json \
            "$MANIFEST_SHA" manifest.json "$ADMISSION_SHA" admit.cjs | sha256sum --check --strict
          tar -rf approved.tar preparation.json
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        run: bash workflow-source/tools/direct_demand/operations/max-existing-photo/run_remote_batch.sh pin-host
      - name: Recheck accepted release and slot immediately before the existing writer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node pub/admit.cjs
      - name: Edit only each verified existing ID and capture its independent receipt
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          RECEIPT_SHA: ${{ needs.prepare.outputs.receipt_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash workflow-source/tools/direct_demand/operations/max-existing-photo/run_remote_batch.sh apply "$RECEIPT_SHA" \
            < pub/approved.tar | tee pub/native-results.txt
          python3 - <<'PY'
          import json,pathlib
          expected = [r['hotel_id'] for r in json.loads(pathlib.Path('pub/manifest.json').read_bytes())['rows']]
          rows = []
          for line in pathlib.Path('pub/native-results.txt').read_text().splitlines():
              if not line.startswith('RESULT '):
                  continue
              _, hotel, payload = line.split(' ', 2)
              d = json.loads(payload)
              assert d['hotel'] == int(hotel) and d.get('new_posts', 0) == 0 and d.get('ad_writes', 0) == 0
              assert d['state'] in {'existing_max_message_updated_and_verified','stopped_before_edit','held_no_retry','untouched','unobserved'}
              rows.append(d)
          assert [r['hotel'] for r in rows] == expected
          accepted = [r['hotel'] for r in rows if r['state'] == 'existing_max_message_updated_and_verified']
          summary = {'state':'complete' if len(accepted)==len(expected) else 'partial' if accepted else 'none_accepted','native_accepted':accepted,'rows':rows}
          pathlib.Path('pub/summary.json').write_text(json.dumps(summary,indent=2))
          print('Native confirmations', len(accepted), 'of', len(expected), accepted)
          PY
      - name: Preserve exact native writer receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-max-native-${{ github.run_attempt }}
          path: |
            pub/manifest.json
            pub/native-results.txt
            pub/summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
  observe_public:
    needs: [prepare, edit_existing]
    if: always() && needs.prepare.result == 'success' && (needs.edit_existing.result == 'success' || needs.edit_existing.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve only the native writer receipts
        uses: actions/download-artifact@v4
        with:
          name: issue-1566-max-native-${{ github.run_attempt }}
          path: pub
      - name: Read each same public MAX address independently
        env:
          MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          umask 077
          test -f pub/native-results.txt || exit 0
          [[ "$MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$MANIFEST_SHA" pub/manifest.json | sha256sum --check --strict
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,re,time
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from datetime import datetime,timezone
          original=json.loads(Path('pub/manifest.json').read_text())['rows']
          native=[json.loads(line.split(' ',2)[2]) for line in Path('pub/native-results.txt').read_text().splitlines() if line.startswith('RESULT ')]
          accepted={r['hotel'] for r in native if r.get('state')=='existing_max_message_updated_and_verified'}
          plans=[{'id':r['hotel_id'],'url':r['target_url'],'title':r['name'],'caption':r['caption_without_price']} for r in original if r['hotel_id'] in accepted]
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hide=0; self.meta={}
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.hide+=1
                  if t=='meta':
                      d=dict(a)
                      key=d.get('property') or d.get('name')
                      if key: self.meta[key]=d.get('content','')
              def handle_endtag(self,t):
                  if t in ('script','style') and self.hide: self.hide-=1
              def handle_data(self,v):
                  if not self.hide and v.strip(): self.parts.append(v.strip())
          def norm(v):
              return re.sub(r'\s+',' ',v).strip()
          def read(row):
              try:
                  req=urllib.request.Request(row['url'],headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(3000001)
                      status,url=r.status,r.geturl()
                  assert len(raw)<=3000000 and url==row['url']
                  p=Page();p.feed(raw.decode('utf-8'))
                  visible=norm('\n'.join(p.parts).split('Другие публикации канала',1)[0])
                  declared=norm(p.meta.get('og:description',''))
                  exact=norm(row['caption'])
                  out={'hotel_id':row['id'],'url':url,'http':status,'named':row['title'] in visible or row['title'] in declared,
                       'caption_matches':exact in visible or exact in declared,'photo_preview':bool(p.meta.get('og:image')),
                       'public_button_label_visible':'Рассчитать на мои даты' in visible,
                       'page_sha256':hashlib.sha256(raw).hexdigest(),
                       'escaped_variant_visible': '&amp;' in visible or '&amp;' in declared}
                  out['verified']=out['named'] and out['caption_matches'] and out['photo_preview']
                  return out
              except (OSError,ValueError,AssertionError) as e:
                  return {'hotel_id':row['id'],'url':row['url'],'error':type(e).__name__,'verified':False}
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(read,plans))
          if not all(r['verified'] for r in results):
              time.sleep(5)
              results=[r if r['verified'] else read(p) for r,p in zip(results,plans)]
          out={'observed_utc':datetime.now(timezone.utc).isoformat(),'rows':results,'writes':0,'ad_clicks':0}
          Path('pub/observation.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX_COMMERCIAL_ALBUM_PUBLIC_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Preserve exact original receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-max-edits-existing-only
          path: |
            pub/manifest.json
            pub/native-results.txt
            pub/summary.json
            pub/observation.json
          retention-days: 7
          if-no-files-found: warn
