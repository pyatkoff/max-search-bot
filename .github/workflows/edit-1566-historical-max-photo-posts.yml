name: "#1566 Compile the three existing MAX editor plans without writes"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/edit-1566-historical-max-photo-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  edit_existing:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '196b379a830a2888ba3858ee4bfa9b475080dc3f' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the existing editor and stage the three matched plans
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub/stage
          src=tools/direct_demand/operations/max-existing-photo
          php tests/run_1566_max_existing_photo_batch.php
          python3 tests/run_1566_max_existing_photo_partial.py
          for file in "$src"/*.php; do php -l "$file"; done
          install -m600 "$src"/{editor.php,batch_input.php,batch_entry.php,observe_pair.php,run_batch.py} pub/stage/
          install -m600 "$src"/scope-commercial-albums-20261125.json pub/stage/scope.json
          test "$(git hash-object pub/stage/scope.json)" = c2bfcce7329f8de60c5d21a3c15f62cae6ea7489
          cp pub/stage/scope.json pub/manifest.json
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14910511299/zip > pub/archive.zip
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15009736629/zip > pub/native.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          stage=pathlib.Path('pub/stage')
          scope_bytes=(stage/'scope.json').read_bytes()
          scope=json.loads(scope_bytes)
          for key,zip_hash,json_hash,output in [
              ('archive',scope['archive_sha256'],scope['archive_registry_sha256'],'native-targets.json'),
              ('native',scope['native_source']['zip_sha256'],scope['native_source']['json_sha256'],'native-source.json')]:
              artifact=pathlib.Path('pub/'+key+'.zip')
              assert artifact.stat().st_size<300000 and hashlib.sha256(artifact.read_bytes()).hexdigest()==zip_hash
              with zipfile.ZipFile(artifact) as z:
                  assert z.namelist()==['registry.json'] and z.getinfo('registry.json').file_size<=2000000
                  data=z.read('registry.json')
              assert hashlib.sha256(data).hexdigest()==json_hash
              (stage/output).write_bytes(data)
          entry=stage/'batch_entry.php'
          src=entry.read_text()
          src,count=re.subn(r"(const MAX_BATCH_SCOPE_SHA256 = ')[a-f0-9]{64}(')",lambda m:m[1]+hashlib.sha256(scope_bytes).hexdigest()+m[2],src)
          assert count==1
          entry.write_text(src)
          PY
          php -l pub/stage/batch_entry.php
          php pub/stage/editor.php --batch-plan pub/stage/native-targets.json pub/stage/native-source.json 4260de9aa1bd0bbc75fa4b38f42110e4cb1325b25e1b9491b62f210c6a8d81ca 6194e13ac5af4ba53263284a3a3002f7d6d22b31 6194e13ac5af4ba53263284a3a3002f7d6d22b31 > pub/batch-plan.json
          python3 - <<'PY'
          import json
          data=json.load(open('pub/batch-plan.json'))
          assert data['ready']==[107938,954,73055] and not data['held'] and data['provider_writes']==0
          PY
          cat > pub/stage/execute.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          stage="$(cd -- "$1" && pwd -P)"
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = 6194e13ac5af4ba53263284a3a3002f7d6d22b31
          python3 "$stage/run_batch.py" "$stage"
          SH
          bash -n pub/stage/execute.sh
          tar -C pub/stage -cf pub/approved.tar editor.php batch_input.php batch_entry.php observe_pair.php scope.json native-targets.json native-source.json run_batch.py execute.sh
      - name: Report sealed editor plans without server writes
        run: cat pub/batch-plan.json
