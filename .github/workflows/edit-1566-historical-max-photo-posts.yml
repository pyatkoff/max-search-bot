name: "#1566 Apply fresh PRICE only to the two verified existing MAX posts"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/edit-1566-historical-max-photo-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  verify_price:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '2e400d92c85012e8adfaa5d8886a49be147a326b' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout the exact PRICE release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ad970aaa2c89ccc6eb2fcded3c56b5146fffeaf5
          persist-credentials: false
          path: accepted-release
      - name: Await the exact installed release and official end of its write slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub
          cat > pub/price-admit.cjs <<'NODE'
          const R=require('../accepted-release/tools/deployment_release');
          const P=require('../accepted-release/tools/release_priority');
          const token=process.env.GH_TOKEN;
          const api=R.makeReadApi(token);
          const wait=require('node:timers/promises').setTimeout;
          const root=R.API_ROOT, sha='ad970aaa2c89ccc6eb2fcded3c56b5146fffeaf5', runId=45629187135;
          async function check() {
            const [head, slot, run] = await Promise.all([
              api('GET',root+'/git/ref/heads/main'),
              api('GET',root+'/issues/comments/6928374515'),
              api('GET',root+'/actions/runs/'+runId)
            ]);
            if(head.object.sha!==sha || slot.user.id!==226193297 ||
                run.id!==runId || run.repository.id!==1342493152 || run.head_sha!==sha ||
                run.path!=='.github/workflows/deploy.yml' || run.event!=='push' || run.run_attempt!==1)
              throw Error('release_identity_changed');
            if (run.status==='completed' && run.conclusion!=='success')
              throw Error('deployment_failed');
            if (slot.body==='PR1719: выпуск занят' ||
                (slot.body==='PR1719: установлено, выпуск свободен' && run.status!=='completed')) return false;
            if (slot.body!=='PR1719: установлено, выпуск свободен') throw Error('release_slot_changed');
            const record=await R.readRecord(api);
            const binding=await R.resolveCurrent(api,{sha},record);
            if (!binding.ready) return false;
            if (binding.repository_sha!==sha || binding.application_sha!==sha) throw Error('installed_release_changed');
            await P.verifyPreviousRelease({repository:R.REPOSITORY,baseSha:sha},token,fetch);
            return true;
          }
          async function admit(once) {
            const limit=3;
            for(let n=0;n<limit;n++) {
              try {
                if(await check()) {
                  console.log('PRICE_RELEASE_ACCEPTED '+sha);
                  return;
                }
              } catch(error) {
                if(error.message!=='record_changed') throw error;
              }
              if(n+1<limit) await wait(1500);
            }
            throw Error('write_slot_or_release_not_ready');
          }
          admit(process.argv[2]==='--once').catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
          node pub/price-admit.cjs
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Recheck release and call the installed PRICE writer for existing MAX publications 3835 and 3828
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          cat > pub/price-scope.sh <<'SH'
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "ad970aaa2c89ccc6eb2fcded3c56b5146fffeaf5"
          mode="$1"
          publication="$2"
          case "$mode/$publication" in
            inspect/3835|inspect/3828|apply/3835|apply/3828) ;;
            *) exit 41 ;;
          esac
          php tools/apply_promoted_hotel_prices.php "--$mode-max-publication" "$publication"
          SH
          for pair in 2470:3835 65877:3828; do
            hotel="$(cut -d: -f1 <<< "$pair")"
            id="$(cut -d: -f2 <<< "$pair")"
            node pub/price-admit.cjs --once
            inspect="pub/price-inspect-$id.txt"
            result="pub/price-result-$id.txt"
            if ! ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" "bash -s -- inspect $id" < pub/price-scope.sh > "$inspect"; then
              printf 'PRICE_INSPECTION_HELD=%s %s\n' "$id" "$(cat "$inspect")"
              continue
            fi
            eligible="$(python3 - "$hotel" "$id" "$inspect" <<'PY'
          from pathlib import Path
          import json,sys
          prefix="PROMOTED_HOTEL_PRICE_RESULT="
          lines=[line[len(prefix):] for line in Path(sys.argv[3]).read_text().splitlines() if line.startswith(prefix)]
          assert len(lines)==1
          data=json.loads(lines[0])
          assert data["mode"]=="--inspect-max-publication"
          rows=data["rows"]
          if len(rows)!=1:
              print("held")
          else:
              row=rows[0]
              assert (row["hotel"],row["platform"],row["publication"])==(int(sys.argv[1]),"max",int(sys.argv[2]))
              print(row["result"])
          PY
          )" || { printf 'PRICE_INSPECTION_UNCONFIRMED=%s\n' "$id"; continue; }
            printf 'PRICE_INSPECTION=%s %s\n' "$id" "$eligible"
            if [[ "$eligible" != eligible ]]; then continue; fi
            node pub/price-admit.cjs --once
            if ! ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" "bash -s -- apply $id" < pub/price-scope.sh > "$result"; then
              printf 'PRICE_APPLY_STOPPED=%s %s\n' "$id" "$(cat "$result")"
              continue
            fi
            python3 - "$hotel" "$id" "$result" <<'PY'
          from pathlib import Path
          import json,sys
          prefix="PROMOTED_HOTEL_PRICE_RESULT="
          lines=[line[len(prefix):] for line in Path(sys.argv[3]).read_text().splitlines() if line.startswith(prefix)]
          assert len(lines)==1
          data=json.loads(lines[0])
          assert data["mode"]=="--apply-max-publication"
          assert len(data["rows"])==1
          row=data["rows"][0]
          assert (row["hotel"],row["platform"],row["publication"])==(int(sys.argv[1]),"max",int(sys.argv[2]))
          print("EXISTING_MAX_PRICE_RECEIPT="+json.dumps(row,ensure_ascii=False,separators=(",",":")))
          PY
          done
      - name: Preserve the original receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-max-price-3835-and-3828
          path: pub/price-*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove runner-only connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
