name: Bootstrap Alisha manager

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-manager-alisha.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]]
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Create Alisha manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            /opt/php81/bin/php -r '
              require "config.php";
              require "services/ConversationDb.php";
              require "services/ProjectAccessService.php";
              require "services/ManagerAuthService.php";
              ManagerAuthService::ensureSchema();
              $pdo=ConversationDb::connection();
              $hash=base64_decode("JDJ5JDEyJHhNZDA5bm4vRjFVQ2RhVTk5c1B3RS5zRlNrQUIydWpFOThpdkdZVDhJeXBZVGl5OEx1SW4u");
              $q=$pdo->prepare("SELECT id FROM managers WHERE login=? LIMIT 1");
              $q->execute(["Alisha"]);
              $id=(int)$q->fetchColumn();
              if($id>0){
                $pdo->prepare("UPDATE managers SET password_hash=?,display_name=?,role=?,is_active=1 WHERE id=?")->execute([$hash,"Alisha","manager",$id]);
              }else{
                $pdo->prepare("INSERT INTO managers (login,password_hash,display_name,role,is_active) VALUES (?,?,?,?,1)")->execute(["Alisha",$hash,"Alisha","manager"]);
                $id=(int)$pdo->lastInsertId();
              }
              $projectId=ProjectAccessService::ensureCurrentProject();
              $pdo->prepare("INSERT IGNORE INTO manager_projects (manager_id,project_id) VALUES (?,?)")->execute([$id,$projectId]);
              echo "ALISHA_MANAGER_OK id={$id} project_id={$projectId}\n";
            '
