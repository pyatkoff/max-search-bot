name: "HOTEL MAX 1741 — fresh ordinary release admission"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-main-hotel-registry.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.repository.id == 1342493152 && github.event.created == false &&
      github.event.forced == false && github.event.before == '0adac62ca03184afc5bb2f670fc61119be2c9dfc' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2959179c360d359481dcf0ae47d0c2ef496237dd
          persist-credentials: false
      - name: Authenticate the installed release and existing publisher before MAX merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1741 5a195d0da5686de8ec6d5aab10ecf88764eca66b 2959179c360d359481dcf0ae47d0c2ef496237dd
