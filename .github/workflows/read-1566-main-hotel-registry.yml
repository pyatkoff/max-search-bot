name: "HOTEL MAX 1741 — continuing release admission"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-main-hotel-registry.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.repository.id == 1342493152 && github.event.created == false &&
      github.event.forced == false && github.event.before == '68ee7d1060a9d53ede0eeab1caf22b09a2fa605b' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2959179c360d359481dcf0ae47d0c2ef496237dd
          persist-credentials: false
      - name: Authenticate the installed release and existing publisher before MAX merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1741 5a195d0da5686de8ec6d5aab10ecf88764eca66b 2959179c360d359481dcf0ae47d0c2ef496237dd --publisher 6818332618 226193297 2026-11-26T11:38:05Z
