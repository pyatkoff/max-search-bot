name: "#1566 Read-only proof of the MAX writer installation gate"

on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-old-ordinary-max-posts.yml']

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false

jobs:
  verify_installation_gate:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '7aa82490db544be4b71be9f0a248880605d8fb51' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bdc596e797992bf50de409f9ff6e094a4ccfd623
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d69f952dd15ce7fadd0e8de93642a7cb127a32b1
          path: publisher
          persist-credentials: false
      - name: Exercise only the publisher's installation authentication on the original Stella evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bdc596e797992bf50de409f9ff6e094a4ccfd623'
          test "$(git -C publisher rev-parse HEAD)" = 'd69f952dd15ce7fadd0e8de93642a7cb127a32b1'
          umask 077
          mkdir pub
          python3 - <<'PY'
          import pathlib, textwrap
          workflow=pathlib.Path("publisher/.github/workflows/edit-1566-historical-max-photo-posts.yml").read_text()
          script=workflow.split("cat > pub/admit.cjs <<'NODE'\n",1)[1].split("          NODE\n",1)[0]
          code=textwrap.dedent(script)
          start="  const location=await R.readRecord(api)\n"
          stop="\n}\nasync function receipt"
          assert code.count(start)==1 and code.count(stop)==1
          installation=code[code.index(start):code.index(stop)]
          assert "current.application_sha===native.application_sha" in installation
          target=pathlib.Path("pub/check-installation.cjs")
          target.write_text("""
          const R=require('../tools/deployment_release')
          const read=R.makeReadApi(process.env.GITHUB_TOKEN)
          const native={repository_sha:'7243c698598a1fa9d8cd935ce05df3758d21ec7c',application_sha:'7243c698598a1fa9d8cd935ce05df3758d21ec7c'}
          const api=Object.assign((method,resource,...args)=>{
            if(method!=='GET'||/\/git\/refs?\/heads\/main(?:$|\?)|\/issues\/comments\/(?:6818332618|6682640708)(?:$|\?)/.test(resource))
              throw Error('unexpected_shared_release_dependency')
            return read(method,resource,...args)
          },read)
          function check(ok,reason){if(!ok)throw Error(reason)}
          ;(async ()=>{
          """+installation+"""
          })().catch(error=>{console.error(error.code||error.message);process.exitCode=1})
          """)
          PY
          node pub/check-installation.cjs
          echo 'MAX_INSTALLATION_GATE_CHECK_ONLY=1; shared_slot_reads=0; provider_writes=0'
