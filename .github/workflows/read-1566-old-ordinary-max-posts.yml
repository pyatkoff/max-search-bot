name: "#1566 Distinguish commercial photo offers from protected MAX posts"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-old-ordinary-max-posts.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == '58f081826d1587c8e3318f64d140de137df3808e' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the original archive and classify old single-photo descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          p="$(mktemp -d)"
          trap 'rm -rf "$p"' EXIT
          export READ_DIR="$p"
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45630394590 > "$p/run.json"
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45630394590/attempts/1/jobs > "$p/jobs.json"
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15032515599 > "$p/artifact.json"
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15032515599/zip > "$p/archive.zip"
          python3 - <<'PY'
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import json
          import os
          import re

          root = Path(os.environ["READ_DIR"])
          run = json.loads((root / "run.json").read_bytes())
          jobs = json.loads((root / "jobs.json").read_bytes())
          artifact = json.loads((root / "artifact.json").read_bytes())
          run_id = 45630394590
          run_head = "3a9195debcfbeb703a220895871f5a40a61d3010"
          digest = "354407dec77c2ffc3b8ed739e5a3f3aac422a0120578c0501183bbe36ea8d795"
          assert (run["id"], run["head_sha"], run["head_branch"], run["run_attempt"], run["event"], run["conclusion"]) == (
              run_id, run_head, "ops/1566-max-archive-inventory-20261123", 1, "push", "success")
          assert run["path"] == ".github/workflows/read-1566-max-archive-20261123.yml"
          assert run["repository"]["id"] == 1342493152 and run["actor"]["id"] == 226193297
          assert jobs["total_count"] == 1 and len(jobs["jobs"]) == 1
          job = jobs["jobs"][0]
          assert (job["id"], job["run_id"], job["head_sha"], job["run_attempt"], job["conclusion"]) == (
              139261677044, run_id, run_head, 1, "success")
          assert artifact["id"] == 15032515599 and artifact["name"] == "issue-1566-main-max-archive-inventory"
          assert artifact["expired"] is False and artifact["workflow_run"]["id"] == run_id
          assert artifact["digest"] == "sha256:" + digest and artifact["size_in_bytes"] == 25899
          assert sha256((root / "archive.zip").read_bytes()).hexdigest() == digest
          with ZipFile(root / "archive.zip") as archive:
              assert archive.namelist() == ["registry.json"] and archive.getinfo("registry.json").file_size <= 1_000_000
              registry = json.loads(archive.read("registry.json"))
          assert registry["ok"] is True and registry["history_complete"] is True
          assert registry["price_content_shared_lease"] is True and str(registry["native_run_id"]) == str(run_id)
          assert registry["production_writes"] == registry["provider_writes"] == 0

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.meta = {}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta" and attrs.get("property"):
                      self.meta[attrs["property"]] = attrs.get("content", "")

          protected = re.compile(
              r"отзыв|отдыхал[аи]?|мы отдых|мы жили|вернул[аи]сь|вернулся|наш[аи]? турист|от турист|"
              r"видео|влог|обзор от менеджера|доминикан|пунта.кан|"
              r"мы побывали|мы были|нам понравил|наша поездка|мой отпуск", re.I)
          amount = re.compile(r"\bцен[аы]\b|стоимость|₽|руб[.л]|(?:от\s+)?\d[\d\s ]{1,9}(?:тыс\.?|[кk]\b)", re.I)
          trip = {
              "departure": re.compile(r"вылет|перел[её]т|авиабил", re.I),
              "duration": re.compile(r"\d+\s+(?:ноч(?:ь|и|ей)|дн(?:я|ей))", re.I),
              "travelers": re.compile(r"за двоих|на двоих|два взрослых|за человека|на человека", re.I),
              "meal": re.compile(r"вс[её] включено|завтраки|полупансион|ультра|питание", re.I),
              "booking": re.compile(r"заброниров|брониру|рассчита|подбер[её]м|пакетн\w+ тур|горящ\w+ тур|отправлени[ея]", re.I),
          }

          def classify(description):
              if not description:
                  return "description_missing", []
              if protected.search(description):
                  return "protected_content", []
              flags = [key for key, pattern in trip.items() if pattern.search(description)]
              if (amount.search(description) and len(flags) >= 2) or (
                  {"departure", "duration"}.issubset(flags) and bool({"meal", "travelers", "booking"}.intersection(flags))
              ):
                  return "commercial_single_photo", flags
              return "insufficient_commercial_evidence", flags

          assert classify("Отзывы. Вылет завтра на 7 ночей, цена за двоих")[0] == "protected_content"
          assert classify("Вылет из Москвы на 7 ночей, всё включено")[0] == "commercial_single_photo"
          assert classify("Отель недели. Красивый пляж")[0] == "insufficient_commercial_evidence"

          def check(row):
              url = row["url"]
              assert re.fullmatch(r"https://max\.ru/anytour/[A-Za-z0-9_-]{11}", url)
              out = {key: row[key] for key in ("url", "mid", "published_ms", "fingerprint")}
              try:
                  with urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"}),
                               timeout=8) as response:
                      assert response.geturl() == url and response.status == 200
                      body = response.read(3_000_001)
                  assert len(body) <= 3_000_000
                  public = Page()
                  public.feed(body.decode("utf-8"))
                  description = re.sub(r"\s+", " ", public.meta.get("og:description", "")).strip()
                  result, signals = classify(description)
                  if result == "commercial_single_photo":
                      if not public.meta.get("og:image"):
                          result = "image_not_visible"
                      else:
                          out.update(signals=signals, description_sha256=sha256(description.encode()).hexdigest(),
                                     excerpt=description[:240])
                  return out | {"classification": result}
              except HTTPError as error:
                  if error.code == 429:
                      return out | {"classification": "rate_limited", "retry_after": error.headers.get("Retry-After")}
                  return out | {"classification": "public_read_unavailable"}
              except (OSError, ValueError, AssertionError):
                  return out | {"classification": "public_read_unavailable"}

          archive_rows = registry["rows"]
          assert len(archive_rows) == 351
          eligible = [row for row in archive_rows if row["status"] == "needs_content_and_route_review"]
          assert len(eligible) == 21 and len({row["mid"] for row in eligible}) == 21
          assert all(row["registered"] is False and row["keyboard_present"] is False
                     and row["linked_message"] is False and row["media"] == ["image"] for row in eligible)
          result = []
          with ThreadPoolExecutor(max_workers=3) as pool:
              for start in range(0, len(eligible), 3):
                  slice_result = list(pool.map(check, eligible[start:start+3]))
                  result.extend(slice_result)
                  if any(row["classification"] == "rate_limited" for row in slice_result):
                      break
          counts = dict(Counter(row["classification"] for row in result))
          summary = {
              "archive_run_id": run_id, "original_artifact_sha256": digest, "archive_messages": len(archive_rows),
              "old_single_photos_considered": len(eligible), "publicly_checked": len(result), "counts": counts,
              "candidate_rows": [row for row in result if row["classification"] == "commercial_single_photo"],
              "unavailable": [row for row in result if row["classification"] in ("rate_limited","public_read_unavailable")],
              "source_or_editor_rights_verified": False, "writes": 0,
          }
          Path("max-commercial-evidence.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          print("MAX_COMMERCIAL_EVIDENCE=" + json.dumps(summary, ensure_ascii=False, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@ea165f8d65b75b540449e92b4886f43607fa02
        with:
          name: max-commercial-photo-evidence
          path: max-commercial-evidence.json
          retention-days: 7
