name: "#1566 Read Stella Makadi after the accepted #1712 release"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-old-ordinary-max-posts.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'e67eeca9611ccae4a9153527a051495bdefed9b1' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact installed provenance source
        uses: actions/checkout@v4
        with:
          ref: 7243c698598a1fa9d8cd935ce05df3758d21ec7c
          persist-credentials: false
      - name: Verify current main and accepted application without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7243c698598a1fa9d8cd935ce05df3758d21ec7c'
          node - <<'NODE'
          const R = require('./tools/deployment_release')
          const expected = '7243c698598a1fa9d8cd935ce05df3758d21ec7c'
          async function read() {
            const api = R.makeReadApi(process.env.GITHUB_TOKEN)
            const current = async () => (await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha
            if (await current() !== expected) throw Error('changed_release')
            const prior = R.API_ROOT+'/actions/runs/45630394590'
            const archive = await api('GET',prior)
            const receipts = await api('GET',prior+'/artifacts?per_page=30')
            const digest = 'sha256:354407dec77c2ffc3b8ed739e5a3f3aac422a0120578c0501183bbe36ea8d795'
            if (archive.id!==45630394590 || archive.head_sha!=='3a9195debcfbeb703a220895871f5a40a61d3010' || archive.run_attempt!==1 ||
                archive.repository.id!==1342493152 || archive.head_branch!=='ops/1566-max-archive-inventory-20261123' ||
                archive.status!=='completed' || archive.conclusion!=='success' || receipts.total_count!==1 ||
                receipts.artifacts[0].id!==15032515599 || receipts.artifacts[0].digest!==digest ||
                receipts.artifacts[0].expired || receipts.artifacts[0].name!=='issue-1566-main-max-archive-inventory') throw Error('previous_archive_unverified')
                        {
              if (await current() !== expected) throw Error('changed_release')
              const install = await api('GET',R.API_ROOT+'/actions/runs/45914493233')
              if (install.id !== 45914493233 || install.repository.id !== 1342493152 ||
                  install.head_sha !== expected || install.run_attempt !== 1 ||
                  install.event !== 'push' || install.path !== '.github/workflows/deploy.yml') throw Error('installation_identity_changed')
              if (install.status === 'completed') {
                if (install.conclusion !== 'success') throw Error('current_installation_failed')
                try {
                  const record = await R.readRecord(api)
                  const actual = await R.resolveCurrent(api, {sha:expected}, record)
                  if (!actual.ready || !/^[a-f0-9]{40}$/.test(actual.application_sha) ||
                      actual.repository_sha !== expected) throw Error('accepted_release_mismatch')
                  // Read a stable registry snapshot. Live admission still rechecks the pair.
                  // Publisher admission remains in the write workflow.
                  const latest = await R.readRecord(api)
                  if (record.blob !== latest.blob || record.record_digest !== latest.record_digest ||
                      await current() !== expected) throw Error('accepted_release_changed')
                  require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'VERIFIED_MAX_APP='+actual.application_sha+'\n')
                  console.log('MAX_STELLA_RELEASE_ACCEPTED='+expected)
                  return
                } catch (error) {
                  if (!['release_pending','diagnostics_unconfirmed','accepted_release_mismatch','record_changed'].includes(error.code || error.message)) throw error
                }
              }
              
            }
            throw Error('current_installation_timeout')
          }
          read().catch(e=>{console.error('release_refused='+(e.code||e.message||'accepted_release_unavailable'));process.exitCode=1})
          NODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 59d8e86437049fb0a859fea8072624aa8a4763a8
          path: album-editor
          persist-credentials: false
      - name: Stage read-only invocation of the existing hotel observer
        shell: bash
        env:
          NATIVE_REPO: 7243c698598a1fa9d8cd935ce05df3758d21ec7c
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/reader-tail.php <<'PHP'
          $root='/var/www/anytoour/data/www/app.anytoour.ru';
          $app='VERIFIED_NATIVE_APP_PIN';
          $out=['ok'=>false,'operation'=>'max_commercial_album_sources_read_only','repository_sha'=>'VERIFIED_NATIVE_REPO_PIN','application_sha'=>$app,
              'archive_run'=>45630394590,'provider_writes'=>0,'db_writes'=>0,'bot_starts'=>0,'rows'=>[]];
          ob_start();
          try {
              maxEditInstalled($app);
              require $root.'/config.php';
              require_once $root.'/services/ChannelPostRuntime.php';
              require_once $root.'/services/ChannelPostEntryService.php';
              require_once $root.'/services/ChannelPostAutomationService.php';
              require_once $root.'/services/MaxTransport.php';
              require_once $root.'/tools/anytour_existing_post_max_transfer.php';
              $db=ConversationDb::connection();
              maxEditNeed($db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY') !== false
                  && $db->beginTransaction(), 'read_only_snapshot_unavailable');
              try {
                  $registry=new ChannelPostRegistryService($db);
                  $channel=$registry->channel(MAX_PROJECT,'max',MAX_BOT,MAIN_MAX);
                  $out['channel_id_in_registry']=$channel['id']??null;
                  $out['button_text']=$channel['button_text']??null;
                  maxEditNeed(is_array($channel)&&(int)$channel['id']===MAIN_REGISTRY
                      &&is_string($out['button_text'])&&trim($out['button_text'])!=='','main_channel_edit_not_ready');
                  $out['channel_config_version']=(int)$channel['config_version'];
                  maxTransferNativeEditor($channel,['channel_id'=>MAIN_MAX,'config_version'=>$out['channel_config_version']]);
                  $out['target_editor_rights']=true;
                  foreach (json_decode('[{"hotel_id":466,"name":"Stella Makadi Beach Resort & Spa","source_id":1057,"source_url":"https://max.ru/channel_anytour/AaG31NW7Nsc","target_mid":"mid.ffffc1752b045fed01a0aa565299012a","target_url":"https://max.ru/anytour/AaCqVlKZASo","target_ms":1789564179097,"target_fingerprint":"3104fbf1774231d929e73be1ab8a798957954757269336833ed428ab64549b2d","target_photo_count":6}]',true,16,JSON_THROW_ON_ERROR) as $row) {
                      try {
                          $source=$registry->publication($row['source_id']);
                          $mid=$source['message_id']??null;
                          maxEditNeed(is_string($mid)&&maxEditUrl($mid,HOTEL_MAX)===$row['source_url'],
                              'source_url_registry_mismatch');
                          $row['source_mid']=$mid;
                          $out['resolved_source_mid']=$mid;
                          $proof=maxBatchObservePair($db,$registry,$channel,$row);

                          $identity=[];foreach (['hotel_id','source_id','source_mid','native_source_date_ms','source_version','source_content_sha256','source_photo_sha256','source_caption_sha256','target_mid'] as $key) $identity[]=$proof[$key]??null;
                          $proof['original_legacy_identity_sha256']=hash('sha256',maxEditJson($identity));
                          $out['rows'][]=$proof;
                      } catch (Throwable $e) {
                          $out['row_errors'][$row['hotel_id']]=preg_match('/\A[a-z_]{3,85}\z/D',$e->getMessage())?$e->getMessage():'read_unavailable';
                      }
                  }
                  $out['ok']=true;
              } finally { $db->rollBack(); }
              maxEditInstalled($app);
              $out['observed_utc']=gmdate(DATE_ATOM);
          } catch (Throwable $e) {
              $out['ok']=false;
              $out['failure']=preg_match('/\A[a-z_]{3,85}\z/D',$e->getMessage())?$e->getMessage():'read_unavailable';
          }
          ob_end_clean();
          echo maxEditJson($out),PHP_EOL;
          exit($out['ok']?0:2);
          PHP
          python3 - <<'PY'
          import os,pathlib,re
          home=pathlib.Path('album-editor/tools/direct_demand/operations/max-existing-photo')
          editor=(home/'editor.php').read_text().split("if (PHP_SAPI !== 'cli' || realpath(",1)[0]
          observer=(home/'observe_pair.php').read_text().split('declare(strict_types=1);',1)[1]
          tail=pathlib.Path('pub/reader-tail.php').read_text()
          match={'VERIFIED_NATIVE_APP_PIN':os.environ['VERIFIED_MAX_APP'],'VERIFIED_NATIVE_REPO_PIN':os.environ['NATIVE_REPO']}
          for key,val in match.items():
              assert re.fullmatch('[a-f0-9]{40}',val) and tail.count(key)==1
              tail=tail.replace(key,val)
          pathlib.Path('pub/source-reader.php').write_text(editor+observer+'\n'+tail)
          PY
          php -l pub/source-reader.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read the exact source, target and rights from a read-only snapshot
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/source-reader.php > pub/registry.json || true
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('pub/registry.json').read_bytes()
          d=json.loads(raw)
          print('MAX_ALBUM_SCOPED_READ='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
          print('MAX_ALBUM_SCOPED_SHA256='+hashlib.sha256(raw).hexdigest())
          assert d['ok'] and d['provider_writes']==0 and d['db_writes']==0
          assert [row['hotel_id'] for row in d['rows']] == [466] or set(d.get('row_errors',{})) == {'466'}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-commercial-album-sources
          path: pub/registry.json
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/source-reader.php
