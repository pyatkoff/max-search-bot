name: "#1566 Verify the exact Rixos pair on the newly installed application"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-old-ordinary-max-posts.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.event.created == false && github.event.forced == false &&
      github.event.before == 'ca301b432629498821f1957c703963ba28846bd1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare the exact read-only target and source registry lookup
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/native-photo.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          $app = 'aceadeddd35a89307a9a307e891214d9c0be2af6';
          $target = 'mid.ffffc1752b045fed019aca84b9721cb5';
          $source = 'mid.ffffb6caf0606fed01a1d46c23c52cc7';
          $result = ['ok'=>false,'installed_sha'=>$app,'write_admission'=>false,'writes'=>0,
              'hotel_id'=>2575,'source_id'=>1342,'target_mid'=>$target];
          $lease = null;
          try {
              $checkout = static fn(): string => trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD'));
              if ($checkout() !== $app) throw new RuntimeException('installed_release_changed');
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
              } finally { ob_end_clean(); }
              if (ProjectConfig::projectId() !== 'anytour') throw new RuntimeException('wrong_project');
              $path = '/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl';
              if (!is_file($path) || is_link($path)) throw new RuntimeException('lease_missing');
              $lease = fopen($path,'rb');
              if (!is_resource($lease)) throw new RuntimeException('lease_missing');
              $deadline = hrtime(true) + 8000000000;
              while (!flock($lease,LOCK_SH|LOCK_NB)) {
                  if (hrtime(true) >= $deadline) throw new RuntimeException('editor_busy');
                  usleep(250000);
              }
              $pdo = ConversationDb::connection();
              $pdo->exec('SET TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              try {
                  $stmt = $pdo->prepare('SELECT id,current_version_id FROM post_publications WHERE post_channel_id=4 AND external_message_id=?');
                  $stmt->execute([$target]);
                  $targetRows = $stmt->fetchAll(PDO::FETCH_ASSOC);
                  $registry = new ChannelPostRegistryService($pdo);
                  $origin = $registry->publication(1342);
                  $exactSource = is_array($origin) && $origin['platform']==='max'
                      && $origin['state']==='sent' && (string)$origin['channel_id']==='-80492244209683'
                      && ($origin['message_id']??$origin['external_message_id']??null)===$source
                      && ($origin['snapshot']['post_url']??null)==='https://max.ru/channel_anytour/AaHUbCPFLMc'
                      && (int)($origin['snapshot']['metadata']['hotel_catalog_id']??0)===2575;
                  $result += ['target_registry_rows'=>$targetRows,'source_identity_verified'=>$exactSource,
                      'source_registry_version'=>$exactSource?(int)$origin['version_id']:null];
              } finally { $pdo->rollBack(); }
              if ($checkout() !== $app) throw new RuntimeException('installed_release_changed');
              $result['ok'] = true;
          } catch(Throwable $error) {
              $result['reason'] = preg_match('/\A[a-z_]{3,50}\z/D',$error->getMessage()) ? $error->getMessage() : 'registry_read_unavailable';
          } finally {
              if (is_resource($lease)) fclose($lease);
          }
          echo json_encode($result,JSON_THROW_ON_ERROR),PHP_EOL;
          exit($result['ok'] ? 0 : 2);
          PHP
          php -l "$RUNNER_TEMP/native-photo.php"
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read only the exact source and candidate in the official publication registry
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
           -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
           -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          rc=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < "$RUNNER_TEMP/native-photo.php" > native-photo-evidence.json || rc=$?
          if test -s native-photo-evidence.json; then cat native-photo-evidence.json; fi
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-native-single-photo-evidence
          path: native-photo-evidence.json
          retention-days: 7
      - name: Remove runner connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/native-photo.php"
