!in_array($t[$i+3]??null,[',',';'],true))configFail('config_literal_required');\n            $save($token[1],$t[$i+2]??null);continue;\n        }\n        $isDefine=is_array($token)&&(($token[0]===T_STRING&&strtolower($token[1])==='define')\n            ||(defined('T_NAME_FULLY_QUALIFIED')&&$token[0]===T_NAME_FULLY_QUALIFIED&&strtolower($token[1])==='\\\\define'));\n        if(!$isDefine||($t[$i+1]??null)!=='('||!is_array($t[$i+2]??null)||$t[$i+2][0]!==T_CONSTANT_ENCAPSED_STRING)continue;\n        $name=literalString($t[$i+2]);if(!isset($wanted[$name]))continue;\n        if(($t[$i+3]??null)!==','||($t[$i+5]??null)!==')')configFail('config_literal_required');\n        $save($name,$t[$i+4]??null);\n    }\n    foreach(['CONVERSATION_DB_HOST','CONVERSATION_DB_NAME','CONVERSATION_DB_USER','CONVERSATION_DB_PASS']as$name){\n        if(!array_key_exists($name,$found))configFail('config_required_define_missing');\n        if($found[$name]==='')configFail('config_required_define_empty');\n    }\n    $charset=$found['CONVERSATION_DB_CHARSET']??'utf8mb4';\n    if(trim($charset)==='')$charset='utf8mb4';\n    if(!in_array(strtolower($charset),['utf8','utf8mb3','utf8mb4'],true))configFail('config_charset_unsupported');\n    $found['CONVERSATION_DB_CHARSET']=$charset;\n    if(strpbrk($found['CONVERSATION_DB_HOST'].$found['CONVERSATION_DB_NAME'],\";\\r\\n\")!==false)configFail('config_dsn_unsafe');\n    return$found;\n}\nfunction verifyCanonicalLoader(string $raw,string $external):void{\n    $tokens=token_get_all($raw);if(count($tokens)>30000)configFail('config_loader_token_limit');$t=[];\n    foreach($tokens as$token)if(!is_array($token)||!in_array($token[0],[T_WHITESPACE,T_COMMENT,T_DOC_COMMENT],true))$t[]=$token;\n    $wanted=array_fill_keys(['CONVERSATION_DB_HOST','CONVERSATION_DB_NAME','CONVERSATION_DB_USER','CONVERSATION_DB_PASS','CONVERSATION_DB_CHARSET'],true);$recognized=false;$inConst=false;$dynamicReference=false;$bindings=[];\n    foreach($t as$i=>$token){\n        if(!i