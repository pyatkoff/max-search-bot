NCAPSED_STRING){\n                    $literal=literalString($part);\n                    $marker=match($literal){$external=>'E','/config/max-search.php'=>'S','/../../config/max-search.php'=>'R','/../config/max-search.php'=>'P',default=>'!'};\n                    $shape.=$marker;\n                }elseif($part[0]===T_VARIABLE)$shape.='V'.$part[1];\n                elseif($part[0]===T_DIR)$shape.='D';\n                elseif($part[0]===T_FILE)$shape.='F';\n                elseif($part[0]===T_STRING&&strtolower($part[1])==='dirname')$shape.='dirname';\n                elseif($part[0]===T_LNUMBER&&in_array($part[1],['2','3'],true))$shape.=$part[1];\n                else{$shape='!';break;}\n            }elseif(in_array($part,['(',')',',','.'],true))$shape.=$part;\n            else{$shape='!';break;}\n        }\n        if(!$ended)continue;\n        while(strlen($shape)>1&&$shape[0]==='('&&substr($shape,-1)===')')$shape=substr($shape,1,-1);\n        if(str_starts_with($shape,'V$')){\n            $name=substr($shape,1);$binding=$bindings[$name]??null;\n            if($binding===null||$binding['updates']!==1||!$binding['literal']||$binding['at']>=$i){$dynamicReference=true;continue;}\n            $recognized=true;\n        }elseif(in_array($shape,['E','dirname(D,2).S','dirname(dirname(D)).S','dirname(F,3).S','dirname(dirname(dirname(F))).S','D.R','dirname(D).P'],true))$recognized=true;\n    }\n    if(!$recognized)configFail($dynamicReference?'config_loader_dynamic_reference':'config_loader_reference_missing');\n}\nfunction exactKeys(array $value,array $expected):bool{$actual=array_keys($value);sort($actual);sort($expected);return$actual===$expected;}\n\nfunction need(bool $ok):void{if(!$ok)throw new RuntimeException();}\nfunction countValue(mixed $v,int $cap=1000000000):int{need(is_int($v)&&$v>=0&&$v<=$cap);return$v;}\nfunction instant(mixed $v):int{\n    need(is_string($v)&&preg_match('/\\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\\z/D',$v)===1);\n    $t=strtotime($v);need(is_int($t)&&$t>=946684800&&gmdate('Y-m-d\\TH:i:s\\Z',$t)===$v);return$t;\n}\nfunction decimalId(mixed $v,bool $zero=false):bool{return is_string($v)&&preg_match($zero?'/\\A(?:0|[1-9][0-9]{0,19})\\z/D':'/\\A[1-9][0-9]{0,19}\\z/D',$v)===1;}\nfunction decimalOrder(string $a,string $b):int{return strlen($a)<=>strlen($b)?:strcmp($a,$b);}\nfunction shaValue(mixed $v):bool{return is_string($v)&&preg_match('/\\A[0-9a-f]{64}\\z/D',$v)===1;}\nfunction centsValue(mixed $v):int{\n    need((is_int($v)||is_float($v))&&is_finite((float)$v)&&$v>=0&&$v<=1000000000000);\n    $c=round($v*100);need(abs($v*100-$c)<=0.01);return(int)$c;\n}\nfunction summaryValue(mixed $v):array{\n    need(is_array($v)&&exactKeys($v,['events','conversations','value_rub']));\n    $n=countValue($v['events']);$c=countValue($v['conversations']);$money=centsValue($v['value_rub']);\n    need($c<=$n&&$n<=$c*6&&($n===0?($c===0&&$money===0):($money>0&&$money<=$n*2500000)));\n    return[$n,$c,$money];\n}\nfunction groupValue(mixed $v,?string $basis=null):array{\n    need(is_array($v)&&exactKeys($v,$basis===null?['events','conversations','value_rub','by_platform','origins']:['basis','events','conversations','value_rub','by_platform','origins']));\n    if($basis!==null)need($v['basis']===$basis);\n    need(is_array($v['by_platform'])&&exactKeys($v['by_platform'],['max','telegram'])&&is_array($v['origins'])&&exactKeys($v['origins'],['live','historical_review']));\n    $all=summaryValue(array_intersect_key($v,array_fill_keys(['events','conversations','value_rub'],true)));\n    $max=summaryValue($v['by_platform']['max']);$tg=summaryValue($v['by_platform']['telegram']);\n    $live=summaryValue($v['origins']['live']);$history=summaryValue($v['origins']['historical_review']);\n    need($max[0]+$tg[0]===$all[0]&&$max[1]+$tg[1]===$all[1]&&$max[2]+$tg[2]===$all[2]);\n    need($live[0]+$history[0]===$all[0]&&$live[2]+$history[2]===$all[2]&&max($live[1],$history[1])<=$all[1]);\n    return$all;\n}\nfunction valida