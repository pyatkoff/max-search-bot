name: Accept installed daily reconciliation and forecast follow-up views

on:
  push:
    branches: [ops/modeled-daily-reconciliation-installed-acceptance-20261105]
    paths: ['.github/workflows/modeled-daily-reconciliation-installed-acceptance-20261105.yml']

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/modeled-daily-reconciliation-installed-acceptance-20261105' && github.run_attempt == 1
    concurrency:
      group: anytour-modeled-daily-reconciliation-installed-acceptance-20261105
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ACCEPTED_MAIN_SHA: '35a5e84cef118132bf9377ef7c9226028750b8a1'
      EXPECTED_READER_BLOB: '05998002b54a5a1017325b7877807891aa56ec01'
      EXPECTED_VIEW_BLOB: 'fc1fb20362cd35116535a6b7da297a67a8436c3a'
      EXPECTED_CONTROLLER_BLOB: 'cb0ab15b07329285d9c87875c971af73bb29fa2b'
      EXPECTED_OWNER_SCOPE_BLOB: '42b442b37b8e09b9e08d2c4f667440cfbd1aa6cb'
      EXPECTED_FORECAST_READER_BLOB: '0820ec9e8c4bd12609c1a73866a86568da5e1b1f'
      EXPECTED_FORECAST_VIEW_BLOB: '44fc7313c8fd8b59694c03de6ab40e0233d81908'
    steps:
      - name: Checkout this one original audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository event original attempt main ancestry and sole path
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/ops/modeled-daily-reconciliation-installed-acceptance-20261105'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          for value in "$ACCEPTED_MAIN_SHA" "$EXPECTED_READER_BLOB" "$EXPECTED_VIEW_BLOB" "$EXPECTED_CONTROLLER_BLOB" "$EXPECTED_OWNER_SCOPE_BLOB" "$EXPECTED_FORECAST_READER_BLOB" "$EXPECTED_FORECAST_VIEW_BLOB"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
          jq -e --arg sha "$GITHUB_SHA" '
            .repository.full_name=="pyatkoff/max-search-bot" and
            .ref=="refs/heads/ops/modeled-daily-reconciliation-installed-acceptance-20261105" and
            .deleted==false and .forced==false and .after==$sha
          ' "$GITHUB_EVENT_PATH" >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r head parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$head" = "$GITHUB_SHA"
          test "$parent" = "$ACCEPTED_MAIN_SHA"
          test -z "$extra"
          test "$(git diff --name-only "$ACCEPTED_MAIN_SHA" HEAD)" = '.github/workflows/modeled-daily-reconciliation-installed-acceptance-20261105.yml'
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionDailyReconciliationReader.php")" = "$EXPECTED_READER_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionDailyReconciliationView.php")" = "$EXPECTED_VIEW_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:manager/assigned-value.php")" = "$EXPECTED_CONTROLLER_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/InternalOwnerDialogueScope.php")" = "$EXPECTED_OWNER_SCOPE_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionForecastPaymentReader.php")" = "$EXPECTED_FORECAST_READER_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionForecastPaymentView.php")" = "$EXPECTED_FORECAST_VIEW_BLOB"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$ACCEPTED_MAIN_SHA"

      - name: Prepare existing connection and pinned host
        env:
          CONNECTION_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$CONNECTION_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/modeled-daily-reconciliation-installed-acceptance-key"; else printf '%s\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/modeled-daily-reconciliation-installed-acceptance-key"; fi
          else
            printf '%s' "$raw" | base64 --decode >"$RUNNER_TEMP/modeled-daily-reconciliation-installed-acceptance-key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/modeled-daily-reconciliation-installed-acceptance-key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['CONNECTION_HOST'];user=os.environ['CONNECTION_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          approved=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':approved.append(line)
          assert approved,'Existing host continuity mismatch; STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/modeled-daily-reconciliation-installed-acceptance-hosts').write_text('\n'.join(approved)+'\n')
          PY

      - name: Read only installed daily and forecast views and emit technical receipts
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'MODELED_DAILY_ACCEPTANCE'
          import datetime as dt,json,os,pathlib,re,subprocess
          HELPER="<?php\ndeclare(strict_types=1);\n/** Installed-only technical acceptance. Source values and HTML stay in server RAM. */\nini_set('display_errors','0');ini_set('log_errors','0');error_reporting(E_ALL);set_error_handler(static function():bool{return true;});\n$initialBuffer=ob_get_level();ob_start();$root='/var/www/anytoour/data/www/app.anytoour.ru';\n$checks=array_fill_keys(['fixed_project','established_application_cli_actor','passive_config_parser','canonical_external_loader','literal_credentials_parsed','private_config_unchanged','external_config_unchanged','canonical_classes_loaded','fresh_pdo','read_only_session','query_budget_compatible','reader_envelopes_valid','reader_transactions_closed','metric_conservation_valid','renderers_accept_valid_pages','cursor_and_scope_continuation_valid','export_settings_fixed_unchanged','pdo_attributes_unchanged','transaction_closed','read_only_restored','query_limit_restored','no_source_output'],false);\n$out=['schema_version'=>1,'ok'=>false,'installed_passed'=>false,'reason'=>'bootstrap_unavailable',\n    'checked_at'=>gmdate('Y-m-d\\TH:i:s\\Z'),'checks'=>$checks,'reports'=>[]];\n$pdo=null;$priorStatementClass=null;$priorErrorMode=null;$priorEmulate=null;$priorReadOnly=null;$readOnlyVariable=null;$priorMax=null;\n$configHash=null;$externalHash=null;$externalPath='/var/www/anytoour/data/config/max-search.php';$success=false;\nfinal class ConfigLiteralFailure extends RuntimeException{\n    public string $closedCode;\n    public function __construct(string $code){parent::__construct();$this->closedCode=$code;}\n}\nfunction configFail(string $code):void{throw new ConfigLiteralFailure($code);}\nfunction privateConfig(string $path):string{\n    clearstatcache(true,$path);$st=lstat($path);\n    if(!$st||is_link($path)||realpath($path)!==$path||($st['mode']&0170000)!==0100000||$st['size']<1||$st['size']>262144)throw new RuntimeException();\n    $raw=file_get_contents($path);if(!is_string($raw)||strlen($raw)!==$st['siz