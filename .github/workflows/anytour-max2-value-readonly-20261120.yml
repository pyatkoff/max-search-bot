name: Read AnyTour max2 and modeled value for the requested week
on:
  push:
    branches: [audit/anytour-max2-value-20261120]
    paths:
      - .github/workflows/anytour-max2-value-readonly-20261120.yml
      - audit/anytour-max2-value-20261120-reader.py
      - audit/anytour-max2-value-20261120-runner.py
      - audit/test_anytour_max2_value_20261120.py
permissions:
  contents: read
concurrency:
  group: anytour-max2-value-owner-20261120
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.run_attempt == '1' && github.event.created == true && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the bounded read with mocked API responses
        run: python3 -m unittest discover -s audit -p test_anytour_max2_value_20261120.py
      - name: Read the fixed counter with existing server credentials
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 91959e63e963a537ff16ad32a603c76684a804acebbf73b35124e4097732c3bc
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/anytour-max2-value-20261120-runner.py
      - name: Retain the encrypted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-max2-value-98615635-20261112-20261118
          path: encrypted-max2-value/*.enc.json
          retention-days: 3
          if-no-files-found: error
