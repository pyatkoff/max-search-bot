name: Probe one owner-supplied MAX channel post

on:
  push:
    branches: [test/max-channel-button-20261014]
    paths:
      - tools/max_channel_button_probe.php
      - tests/run_max_channel_button_probe.php
      - .github/workflows/max-channel-button-probe.yml

permissions:
  contents: read

concurrency:
  group: max-channel-button-owner-test-20261014
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/test/max-channel-button-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify scoped CLI syntax and safety regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/max_channel_button_probe.php
          php tests/run_max_channel_button_probe.php

      - name: Prepare established SSH key
        env:
          PROBE_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/max_probe_key"
          raw="$PROBE_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "Configured SSH key is unavailable"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect exact test post with configured bot
        env:
          PROBE_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          PROBE_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${PROBE_USER}@${PROBE_HOST}"
          remote_tmp=''
          preserve_backup=0
          cleanup() {
            if [[ "$remote_tmp" =~ ^/tmp/max-channel-probe\.[A-Za-z0-9]+$ ]]; then
              if [[ "$preserve_backup" == 1 ]]; then
                echo "Private original retained for reconciliation: $remote_tmp/original.json"
              else
                ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/max_probe_key" "$remote" "rm -rf -- '$remote_tmp'" >/dev/null 2>&1 || true
              fi
            fi
            rm -f "$RUNNER_TEMP/max_probe_key" "$RUNNER_TEMP/max-probe-result.json"
          }
          trap cleanup EXIT
          remote_tmp="$(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/max_probe_key" "$remote" 'umask 077; mktemp -d /tmp/max-channel-probe.XXXXXXXX' 2>/dev/null)"
          [[ "$remote_tmp" =~ ^/tmp/max-channel-probe\.[A-Za-z0-9]+$ ]] || { echo "Private probe directory unavailable"; exit 1; }
          scp -q -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/max_probe_key" tools/max_channel_button_probe.php "$remote:$remote_tmp/max_channel_button_probe.php"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/max_probe_key" "$remote" "chmod 700 '$remote_tmp/max_channel_button_probe.php'" >/dev/null 2>&1
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/max_probe_key" "$remote" "php '$remote_tmp/max_channel_button_probe.php' --expected-sha=e826839c71c0cc2a0939fd5e8b1093f317dd5592 --inspect-only 2>/dev/null" > "$RUNNER_TEMP/max-probe-result.json" 2>/dev/null
          probe_rc=$?
          set -e
          if [[ "$probe_rc" != 0 ]]; then preserve_backup=1; fi
          python3 - "$RUNNER_TEMP/max-probe-result.json" "$probe_rc" <<'PY'
          import json, sys
          try:
              summary = json.load(open(sys.argv[1]))
              if not isinstance(summary, dict):
                  raise ValueError()
          except Exception:
              print(json.dumps({'status': 'failed', 'reason': 'probe_output_unavailable', 'remote_exit': int(sys.argv[2])}))
              raise SystemExit(1)
          allowed = {'status','reason','bot_match','rights','request_count','write_attempts','write_response','http_results','image_count_before','image_count_after','image_ids_before','image_ids_after','image_ids_equal','text_hash_equal','markup_hash_equal','link_hash_equal','original_keyboard_equal','keyboard_verified','private_backup_saved','attachment_schema','request_mapping_ready','mapping_block_reason','mode','post_match','channel_match','server_sha_match','installed_sha','expected_sha','target_url','target_channel','attachments_before','attachments_after'}
          safe = {k: v for k, v in summary.items() if k in allowed}
          safe['remote_exit'] = int(sys.argv[2])
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY
          if [[ "$probe_rc" != 0 ]]; then
            preserve_backup="$(python3 - "$RUNNER_TEMP/max-probe-result.json" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
              print(1 if data.get('write_attempts', 0) > 0 else 0)
          except Exception:
              print(1)
          PY
            )"
          fi
          exit "$probe_rc"
