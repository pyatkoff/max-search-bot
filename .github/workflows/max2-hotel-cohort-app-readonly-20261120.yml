name: MAX2 hotel app cohort read 20261120
on:
  push:
    branches: [audit/max2-hotel-cohort-app-fixture-20261120]
    paths:
      - .github/workflows/max2-hotel-cohort-app-readonly-20261120.yml
      - audit/max2-hotel-cohort-20261120/app/program.php
      - audit/max2-hotel-cohort-20261120/app/tests.php
      - audit/max2-hotel-cohort-20261120/app/runner.py
      - audit/max2-hotel-cohort-20261120/app/validation.py
permissions:
  contents: read
  actions: read
concurrency:
  group: max2-hotel-cohort-app-20261120
  cancel-in-progress: false
jobs:
