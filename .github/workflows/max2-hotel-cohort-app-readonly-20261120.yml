      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max2-hotel-app-20261112-20261118-encrypted
          path: encrypted-max2-hotel-app/*.enc.json
          retention-days: 3
          if-no-files-found: error
