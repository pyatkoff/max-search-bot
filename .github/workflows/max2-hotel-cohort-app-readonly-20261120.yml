        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audit/max2-hotel-cohort-20261120/app/runner.py admit
      - name: Read bounded cohort and seal private report
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          REPORT_PUBLIC_KEY_B64: 
