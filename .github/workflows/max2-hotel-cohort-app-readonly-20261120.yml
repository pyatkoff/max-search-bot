    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROGRAM_SHA256: 800cdd3e1b2a40bf1499b9d0d644ba08033e0ff8a532f65d140a3f80f07a2475
      TESTS_SHA256: c6c380d1bdcabd38d33f0f0810e7e8a65a9d9efc9533e1b1481549e2df841de3
      RUNNER_SHA256: 08f3962b9276271328a845d3a21334ddbef6cf1f96f3335d7b6527bcd48c9fa3
      VALIDATION_SHA256: 60fc06476b3c489c9df0d76c8b91c36ff6ef100ef72fb0117fa1024cfb28c717
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
