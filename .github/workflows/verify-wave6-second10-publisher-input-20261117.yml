name: Validate next ten publication inputs and freeze approved photos
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/verify-wave6-second10-publisher-input-20261117.yml']
permissions:
  actions: read
  contents: write
jobs:
  accept-second-ten:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '4572ef85f686a2f9414e86a73bc563fd589f21de' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: tools/direct_demand/operations
      - name: Validate immutable sources and assemble the original sender input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess
          import zipfile
          
          REPO = 'pyatkoff/max-search-bot'
          HEAD = os.environ['GITHUB_SHA']
          BRANCH = 'audit/content100-bot-publication-20261101'
          APP = 'f47fe6cff229bbec1e998f17896d1a858ce5a3d9'
          IDS = [73082,2603,78834,79460,109586,2404,2602,11751,11775,12126]
          EDITORIAL = {row["hotel_id"]:row for row in json.loads(r'''[{"hotel_id":73082,"name":"Hilton Abu Dhabi Yas Island","location":"остров Яс, ОАЭ","body":"Днём можно отправиться в Ferrari World или Warner Bros. World, а вечером вернуться к бассейну на набережной Яс-Бей. За каждую ночь проживания зарегистрированным гостям доступен один из тематических парков острова. Удобный вариант для поездки с детьми, когда в планах больше одного парка.","official_sources":["https://www.hilton.com/en/hotels/auhyihi-hilton-abu-dhabi-yas-island/yas-theme-parks/","https://www.hilton.com/en/hotels/auhyihi-hilton-abu-dhabi-yas-island/"],"aliases":["HILTON ABU DHABI YAS ISLAND","Hilton Abu Dhabi Yas Island"],"caption":"✈️ Туры в Hilton Abu Dhabi Yas Island\n📍 остров Яс, ОАЭ.\n\nДнём можно отправиться в Ferrari World или Warner Bros. World, а вечером вернуться к бассейну на набережной Яс-Бей. За каждую ночь проживания зарегистрированным гостям доступен один из тематических парков острова. Удобный вариант для поездки с детьми, когда в планах больше одного парка.\n\nПодберём тур на ваши даты."},{"hotel_id":2603,"name":"Le Royal Méridien Beach Resort & Spa","location":"Дубай, ОАЭ","body":"К пляжу Джумейры можно выйти прямо из сада отеля. После моря удобно перебраться к одному из трёх бассейнов, а когда захочется городских прогулок, рядом квартал JBR. Хороший выбор для тех, кто хочет пожить у моря и гулять по Дубаю без долгих поездок.","official_sources":["https://www.marriott.com/en-us/hotels/dxbbm-le-royal-meridien-beach-resort-and-spa/overview/","https://www.marriott.com/en-us/hotels/dxbbm-le-royal-meridien-beach-resort-and-spa/experiences/"],"aliases":["LE ROYAL MERIDIEN BEACH RESORT & SPA","Le Royal Méridien Beach Resort & Spa"],"caption":"✈️ Туры в Le Royal Méridien Beach Resort & Spa\n📍 Дубай, ОАЭ.\n\nК пляжу Джумейры можно выйти прямо из сада отеля. После моря удобно перебраться к одному из трёх бассейнов, а когда захочется городских прогулок, рядом квартал JBR. Хороший выбор для тех, кто хочет пожить у моря и гулять по Дубаю без долгих поездок.\n\nПодберём тур на ваши даты."},{"hotel_id":78834,"name":"Club Med Seychelles","location":"остров Сент-Анн, Сейшелы","body":"Вокруг острова Сент-Анн раскинулся морской национальный парк. По воде можно пройти на каяке с прозрачным дном, а сушу исследовать пешком. Подойдёт семье, которой хочется чередовать пляжные дни с прогулками по тропическому острову.","official_sources":["https://www.clubmed.co.uk/r/seychelles/y","https://www.spga.gov.sc/news/2025-03/spga-and-club-med-seychelles-forge-new-partnership-protect-ste-anne-marine-park"],"aliases":["CLUB MED SEYCHELLES","Club Med Seychelles"],"caption":"✈️ Туры в Club Med Seychelles\n📍 остров Сент-Анн, Сейшелы.\n\nВокруг острова Сент-Анн раскинулся морской национальный парк. По воде можно пройти на каяке с прозрачным дном, а сушу исследовать пешком. Подойдёт семье, которой хочется чередовать пляжные дни с прогулками по тропическому острову.\n\nПодберём тур на ваши даты."},{"hotel_id":79460,"name":"Renaissance Bali Nusa Dua Resort","location":"Нуса-Дуа, Индонезия","body":"Отель стоит на холме над Нуса-Дуа, откуда открывается вид на побережье. Дети могут провести время в Lava Land и поплавать в своём бассейне, пока взрослые отдыхают у воды или выбирают балийский массаж в спа.","official_sources":["https://www.marriott.com/en-us/hotels/dpsnd-renaissance-bali-nusa-dua-resort/overview/"],"aliases":["RENAISSANCE BALI NUSA DUA RESORT","Renaissance Bali Nusa Dua Resort"],"caption":"✈️ Туры в Renaissance Bali Nusa Dua Resort\n📍 Нуса-Дуа, Индонезия.\n\nОтель стоит на холме над Нуса-Дуа, откуда открывается вид на побережье. Дети могут провести время в Lava Land и поплавать в своём бассейне, пока взрослые отдыхают у воды или выбирают балийский массаж в спа.\n\nПодберём тур на ваши даты."},{"hotel_id":109586,"name":"Vida Creek Beach","location":"Дубай, ОАЭ","body":"У бассейна с видом на лагуну видно высотки Дубай-Крик-Харбора. Можно провести утро у воды, а вечером взять велосипед и покататься по району. Этот вариант подойдёт тем, кто хочет совместить отдых у бассейна и прогулки по современному Дубаю.","official_sources":["https://www.vidahotels.com/en/hotels/vida-creek-beach/amenities/","https://www.vidahotels.com/en/hotels/vida-creek-beach/wellness/"],"aliases":["VIDA CREEK BEACH","Vida Creek Beach"],"caption":"✈️ Туры в Vida Creek Beach\n📍 Дубай, ОАЭ.\n\nУ бассейна с видом на лагуну видно высотки Дубай-Крик-Харбора. Можно провести утро у воды, а вечером взять велосипед и покататься по району. Этот вариант подойдёт тем, кто хочет совместить отдых у бассейна и прогулки по современному Дубаю.\n\nПодберём тур на ваши даты."},{"hotel_id":2404,"name":"The Westin Resort Nusa Dua, Bali","location":"Нуса-Дуа, Индонезия","body":"Здесь удобно чередовать пляж Нуса-Дуа и дни у бассейна. Взрослые могут поплавать в бассейне с морской водой, а дети провести время в Westin Family Kids Club или покататься с горки в детском бассейне. Всё это рядом, поэтому каждый может отдыхать в своём темпе.","official_sources":["https://www.marriott.com/en-us/hotels/dpswi-the-westin-resort-nusa-dua-bali/experiences/","https://www.marriott.com/en-us/hotels/dpswi-the-westin-resort-nusa-dua-bali/overview/"],"aliases":["THE WESTIN RESORT NUSA DUA","The Westin Resort Nusa Dua, Bali"],"caption":"✈️ Туры в The Westin Resort Nusa Dua, Bali\n📍 Нуса-Дуа, Индонезия.\n\nЗдесь удобно чередовать пляж Нуса-Дуа и дни у бассейна. Взрослые могут поплавать в бассейне с морской водой, а дети провести время в Westin Family Kids Club или покататься с горки в детском бассейне. Всё это рядом, поэтому каждый может отдыхать в своём темпе.\n\nПодберём тур на ваши даты."},{"hotel_id":2602,"name":"Le Méridien Mina Seyahi Beach Resort & Waterpark","location":"Дубай, ОАЭ","body":"В Jungle Bay есть водные горки и игровые зоны, так что с детьми можно провести часть дня в аквапарке, а потом вернуться к морю. Удобный вариант для семьи, которая хочет совместить пляж и водные развлечения в одном отеле.","official_sources":["https://www.marriott.com/en-us/hotels/dxbms-le-meridien-mina-seyahi-beach-resort-and-waterpark/waterpark/","https://www.marriott.com/en-us/hotels/dxbms-le-meridien-mina-seyahi-beach-resort-and-waterpark/overview/"],"aliases":["LE MERIDIEN MINA SEYAHI BEACH RESORT & WATERPARK","Le Méridien Mina Seyahi Beach Resort & Waterpark"],"caption":"✈️ Туры в Le Méridien Mina Seyahi Beach Resort & Waterpark\n📍 Дубай, ОАЭ.\n\nВ Jungle Bay есть водные горки и игровые зоны, так что с детьми можно провести часть дня в аквапарке, а потом вернуться к морю. Удобный вариант для семьи, которая хочет совместить пляж и водные развлечения в одном отеле.\n\nПодберём тур на ваши даты."},{"hotel_id":11751,"name":"Hilton Mauritius Resort & Spa","location":"Флик-ан-Флак, Маврикий","body":"На западном берегу Маврикия день приятно закончить прямо на пляже, глядя, как солнце садится над океаном. Для тихого отдыха вдвоём есть отдельный панорамный бассейн только для взрослых, а на ужин можно выбрать столик у воды.","official_sources":["https://www.hilton.com/en-gb/hotels/mruhihi-hilton-mauritius-resort-and-spa/things-to-do/","https://www.hilton.com/en/hotels/mruhihi-hilton-mauritius-resort-and-spa/dining/"],"aliases":["HILTON MAURITIUS RESORT & SPA","Hilton Mauritius Resort & Spa"],"caption":"✈️ Туры в Hilton Mauritius Resort & Spa\n📍 Флик-ан-Флак, Маврикий.\n\nНа западном берегу Маврикия день приятно закончить прямо на пляже, глядя, как солнце садится над океаном. Для тихого отдыха вдвоём есть отдельный панорамный бассейн только для взрослых, а на ужин можно выбрать столик у воды.\n\nПодберём тур на ваши даты."},{"hotel_id":11775,"name":"Maritim Resort & Spa Mauritius","location":"Балаклава, Маврикий","body":"Утром можно искупаться в Черепашьей бухте, а после пляжа прогуляться по тропическому саду к руинам Балаклавы XVIII века. На территории устраивают пикники в саду и ужины на берегу. Подойдёт тем, кому на острове интересны и море, и история.","official_sources":["https://www.maritim.com/en/hotels/mauritius/hotel-mauritius/hotel-overview","https://www.maritim.com/en/hotels/mauritius/hotel-mauritius/restaurants-bars/maritim-moments"],"aliases":["MARITIM RESORT & SPA MAURITIUS","Maritim Resort & Spa Mauritius"],"caption":"✈️ Туры в Maritim Resort & Spa Mauritius\n📍 Балаклава, Маврикий.\n\nУтром можно искупаться в Черепашьей бухте, а после пляжа прогуляться по тропическому саду к руинам Балаклавы XVIII века. На территории устраивают пикники в саду и ужины на берегу. Подойдёт тем, кому на острове интересны и море, и история.\n\nПодберём тур на ваши даты."},{"hotel_id":12126,"name":"LUX* South Ari Atoll","location":"Южный Ари, Мальдивы","body":"Остров можно объехать на велосипеде, останавливаясь у пляжа и лагуны. Для более активного дня отель организует выход на традиционной лодке дони с морским биологом на поиски китовых акул. Хороший выбор, если на Мальдивах хочется провести время и на берегу, и под водой.","official_sources":["https://www.luxresorts.com/en/maldives/resort/luxsouthariatoll/sports-leisure","https://www.luxresorts.com/en/travel-experiences/luxsouthariatoll-whalesharktrip"],"aliases":["LUX* SOUTH ARI ATOLL RESORTS & VILLAS","LUX* South Ari Atoll"],"caption":"✈️ Туры в LUX* South Ari Atoll\n📍 Южный Ари, Мальдивы.\n\nОстров можно объехать на велосипеде, останавливаясь у пляжа и лагуны. Для более активного дня отель организует выход на традиционной лодке дони с морским биологом на поиски китовых акул. Хороший выбор, если на Мальдивах хочется провести время и на берегу, и под водой.\n\nПодберём тур на ваши даты."}]''')}
          KNOWN_PIN_CHANGES = [["f5975ab95de5f45e087eb7a0f768f566c5bca648","c6386e155d42bc83970edc95f35b3ebeb5140533"],["f0e04e9b4e0ed6859ced96279cbf0619931596e6","1982ff7368763edf8b7238c3142e3cc28579e991"],["db8181426091a685a79ee55991cde22671f0d9dd","94fb1988ac8caf90dc5103aa23c58e7aad6ea691"]]
          PREFIX = '.github/traffic-publish/commercial-wave6-second10-20261117'
          OPERATION = 'commercial-hotel-batch-20261117-43-v1'
          
          
          def api(path, method='GET', body=None, timeout=120):
              cmd = ['gh', 'api', '--method', method, f'repos/{REPO}/{path}']
              stdin = None
              if body is not None:
                  cmd.extend(['--input', '-'])
                  stdin = json.dumps(body).encode()
              return subprocess.check_output(cmd, input=stdin, timeout=timeout)
          
          
          def info(path, method='GET', body=None):
              return json.loads(api(path, method, body))
          
          
          def digest(content):
              return hashlib.sha256(content).hexdigest()
          
          
          def get_artifact(run, artifact, expected):
              item = info(f'actions/artifacts/{artifact}')
              if item['workflow_run']['id'] != run or item['digest'] != 'sha256:' + expected or item['expired']:
                  raise ValueError('artifact lineage changed')
              run_info = info(f'actions/runs/{run}')
              if run_info.get('conclusion') != 'success' or run_info.get('run_attempt') != 1:
                  raise ValueError('source workflow did not finish successfully')
              raw = api(f'actions/artifacts/{artifact}/zip', timeout=130)
              if digest(raw) != expected:
                  raise ValueError('artifact archive checksum differs')
              return zipfile.ZipFile(io.BytesIO(raw))
          
          
          source = Path('tools/direct_demand/operations')
          intake = Path('tools/direct_demand/operations/commercial-expansion-wave6-100-native-candidates-20261117.json').read_bytes()
          drafts = json.loads(intake)
          assert set(IDS).isdisjoint(drafts['editorial_batch']['order'])
          assert len(EDITORIAL) == 10
          by_id = {row['native_tourvisor_id']: row for row in drafts['rows']}
          registry_zip = get_artifact(44180890584, 14371762403, 'b0cff80d071712d29b9bfc236e7c481a52217f915f909909b51f65c18ffb88e3')
          registry_bytes = registry_zip.read('registry-receipt.json')
          registry = json.loads(registry_bytes)
          assert set(IDS) <= set(registry['native_hotel_ids'])
          assert registry['installed_sha'] == 'f8c9a48625c599090c826c25e1480864e136f4e7' and set(registry['channels']) == {'telegram', 'max'}
          assert not set(IDS) & {row['requested_id'] for row in registry['matches']}
          
          review_zip = get_artifact(44179714212, 14372210778, '9d80583d7f1d0e8bb2d10840457395600454546c5adf244d0388ddd718a69870')
          cover_receipt_bytes = review_zip.read('receipt.json')
          cover_receipt = json.loads(cover_receipt_bytes)
          assert cover_receipt['input_sha256'] == digest(intake)
          reviewed = {row['native_tourvisor_id']: row for row in cover_receipt['rows']}
          photos = get_artifact(44179714212, 14372685196, '309598a906c0cc704afcd3068993524135d3fb7de9b3c36cc366fc23f629d28c')
          
          main = info('git/ref/heads/main')['object']['sha']
          assert main == APP
          app_tree = info('git/trees/' + APP + '?recursive=1')
          assert not app_tree['truncated']
          live_pins = {entry['path']:entry['sha'] for entry in app_tree['tree']}
          template_path = source / 'commercial-batch-template-20261102.php'
          template = template_path.read_text(encoding='utf-8')
          original_pins = re.findall(r'"([^"]+)"=>"([a-f0-9]{40})"',template)
          assert len(original_pins) == 22
          for name, original in original_pins:
              assert live_pins[name] == dict(KNOWN_PIN_CHANGES).get(original, original)
          assert subprocess.check_output(['git','hash-object',str(source/'prepare-commercial-batch.py')],text=True).strip()=='8df7a35474b138364b6e6c010af4fa484e350ddb'
          
          repo_entries = []
          manifest = {'schema_version':1,'operation':OPERATION,'state':'PREPARED_NOT_SENT',
                      'button_text':'✈️ Узнать стоимость тура','expected_new_full_pairs':len(IDS),'rows':[]}
          for hotel_id in IDS:
              row, evidence = by_id[hotel_id], reviewed[hotel_id]
              assert row['stage'] == 'editorial_and_visual_review'
              edit = EDITORIAL[hotel_id]
              assert evidence['status'] == 'preview_ready' and evidence['publication_allowed'] is False
              path = f'{PREFIX}/{hotel_id}.png'
              original = photos.read(f'{hotel_id}.png')
              assert original.startswith(b'\x89PNG\r\n\x1a\n') and digest(original) == evidence['png_sha256']
              assert len(evidence['photo_sources']) == 3
              assert all(photo['source_url'] in row['source_photo_samples'] for photo in evidence['photo_sources'])
              blob = info('git/blobs','POST',{'content':base64.b64encode(original).decode(),'encoding':'base64'})
              git_digest=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
              assert blob['sha'] == git_digest
              repo_entries.append({'path':path,'mode':'100644','type':'blob','sha':git_digest})
              caption = edit['caption']
              manifest['rows'].append({'hotel_id':hotel_id,'logical_id':f'commercial-hotel-{hotel_id}-v1',
                        'aliases':edit['aliases'], 'text':caption,
                        'text_sha256':digest(caption.encode()), 'photo_path':path, 'photo_sha256':digest(original),
                        'media_state':'REAL_OFFICIAL_PHOTOGRAPHY_BRANDED_COVER_VISUALLY_VERIFIED',
                        'sources':edit['official_sources']+[row['profile_url']]+[p['source_url'] for p in evidence['photo_sources']]})
          
          assert info('git/ref/heads/' + BRANCH)['object']['sha'] == HEAD
          parent = info('git/commits/' + HEAD)
          tree = info('git/trees','POST',{'base_tree':parent['tree']['sha'],'tree':repo_entries})
          frozen = info('git/commits','POST',{'message':'HOTEL CONTENT: freeze visually checked covers for ten hotels', 'tree':tree['sha'],'parents':[HEAD]})['sha']
          manifest['photo_freeze_commit'] = frozen
          manifest['native_id_namespace'] = 'Tourvisor'
          for row in manifest['rows']:
              row['photo_url'] = f"https://raw.githubusercontent.com/{REPO}/{frozen}/{row.pop('photo_path')}"
          
          raw=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          approval={'schema_version':1,'operation':OPERATION,'expected_installed_sha':APP,'hotel_ids':IDS,'manifest_sha256':digest(raw)}
          prepare=runpy.run_path(str(source/'prepare-commercial-batch.py'))['prepare']
          php, _=prepare(template,raw,approval)
          for previous, current in KNOWN_PIN_CHANGES:
              assert php.count(previous) == 1 and php.count(current) == 0
              php=php.replace(previous,current)
          
          output=Path('accepted-source')
          output.mkdir()
          package={'manifest.json':raw,'approval.json':(json.dumps(approval,ensure_ascii=False,indent=2)+'\n').encode(),
                   'publisher-unexecuted.php':php.encode(),'registry-receipt.json':registry_bytes,
                   'image-receipt.json':cover_receipt_bytes}
          for name, content in package.items():
              (output / name).write_bytes(content)
          
          assert info('git/ref/heads/' + BRANCH)['object']['sha'] == HEAD
          assert info('git/ref/heads/main')['object']['sha'] == APP
          receipt={'state':'SECOND_TEN_SOURCE_VERIFIED_COVERS_STAGED', 'operation':OPERATION, 'native_hotel_ids':IDS,
                    'expected_app_sha':APP,'cover_commit':frozen,'poster_calls':0,'feed_writes':0,
                    'source_sha256':{name:digest(content) for name,content in package.items()}}
          (output/'source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt))
          PY
          php -l accepted-source/publisher-unexecuted.php
      - name: Preserve the verified source package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial-wave6-second10-accepted-source
          path: accepted-source/
          retention-days: 30
          if-no-files-found: warn
