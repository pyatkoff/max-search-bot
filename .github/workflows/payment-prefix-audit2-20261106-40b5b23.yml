)\"):\n        e[\"hold_active\"]=False\n    e[\"hold_policy\"]=has(r\"холд|предавторизац|замороз|заморож|заблокир\") and not e[\"hold_active\"]\n    e[\"hold_released\"]=has(r\"(?:деньг\\w*|средств\\w*|сумм\\w*).{0,35}(?:разморожены|разблокированы|снова доступны|вновь доступны)|(?:разморозили|разблокировали).{0,35}(?:деньг|средств)\")\n    e[\"hold_release_promised\"]=has(r\"(?:отменю|отменим|разморозим|разморозят|разблокируем|будут доступны).{0,65}(?:заморож|средств|деньг)|(?:деньг\\w*|средств\\w*).{0,50}(?:разморозятся|будут доступны|будут разморожены)\")\n    uncertain=has(r\"\\b(?:если|когда|после того как|в случае|надо|нужно|можно|можете|должны|должен|будет|будут|будем|буду)\\b\")\n    question=\"?\" in t\n    negated=has(r\"\\bне (?:оплат|оплачен|поступ|прош|получ|спис|вернул|возвращ|отмен|аннулир)\")\n    if not uncertain and not question and not negated:\n        e[\"payment_claim\"]=role==\"customer\" and has(r\"\\b(?:оплатил[аи]?|оплачено|я оплатил[аи]?|перевел[аи]? (?:деньги|сумму)|деньги отправил[аи]?)\\b\")\n        e[\"manager_ack\"]=role==\"manager\" and has(r\"(?:оплат\\w*.{0,18}(?:вижу|получил|получена|получили)|вижу.{0,18}оплат)\")\n        e[\"posted_receipt\"]=has(r\"(?:деньг\\w*|средств\\w*|оплат\\w*|платеж\\w*).{0,28}(?:поступили|зачислены|зачислена|прошла успешно|успешно проведен|окончательно списаны|успешно списаны)|получил[аи]? (?:ваш )?платеж\")\n        e[\"booking_cancelled\"]=has(r\"(?:тур|бронь|бронирование|заявка|договор).{0,30}(?:отменен[аоы]?|аннулирован[аоы]?)|(?:отменили|аннулировали).{0,30}(?:тур|бронь|бронирование|заявку|договор)\")\n        e[\"refund_received\"]=has(r\"(?:деньги|средства|оплату).{0,25}(?:вернули|возвратили)|(?:возврат|деньги|средства).{0,25}(?:поступил[аи]?|вернул[а-я]*|зачислен[аоы]?)|(?:получил[аи]?|получили).{0,15}возврат\")\n    e[\"refund_requested\"]=has(r\"возврат|вернуть деньг|верните деньг\") and not e[\"refund_received\"]\n    e[\"cancellation_requested\"]=has(r\"отменить|отмените|отменяйте|аннулировать|аннулируйте\") and not e[\"booking_cancelled\"]\n    return e\ndef trajectory(atoms,events):\n    valid=[(a,events.get(a[\"ref\"])) for a in atoms if events.get(a[\"ref\"],{}).get(\"valid\") and a[\"at\"] is not None]\n    counts=collections.Counter(k for a,e in valid for k,v in e[\"events\"].items() if v)\n    reliable=[(a,e) for a,e in valid if a[\"version_at\"]==a[\"at\"] and a[\"status\"]==\"scanned\" and a[\"role\"]!=\"unknown\" and not any(a[\"flags\"].get(k) for k in (\"reversed_clock\",\"unknown_time\",\"quoted_or_relayed\",\"past_trip\",\"unresolved_trip_boundary\",\"party_change_unresolved\",\"product_changed_or_alternative\",\"source_namespace_barrier\"))]\n    candidates=[]\n    for a,e in reliable:\n        posted=e[\"events\"][\"posted_receipt\"]\n        pair_times=[b[\"at\"] for b,f in reliable if\n            (e[\"events\"][\"payment_claim\"] or e[\"events\"][\"manager_ack\"]) and\n            b[\"role\"]!=a[\"role\"] and abs(b[\"at\"]-a[\"at\"])<=259200 and\n            (f[\"events\"][\"payment_claim\"] if a[\"role\"]==\"manager\" else f[\"events\"][\"manager_ack\"])]\n        paired=bool(pair_times)\n        if not (posted or paired):continue\n        # A later explicit description of a hold corrects an earlier ambiguous \"I see payment\".\n        holds=[b[\"at\"] for b,f in reliable if f[\"events\"][\"hold_active\"]]\n        last_hold=max(holds,default=None)\n        explicit_after_hold=posted and (last_hold is None or a[\"at\"]>last_hold)\n        if last_hold is not None and not explicit_after_hold:continue\n        candidates.append(a[\"at\"] if posted else max(a[\"at\"],min(pair_times)))\n    received=min(candidates,default=None)\n    cancelled=any(e[\"events\"][\"booking_cancelled\"] for a,e in reliable if received is None or a[\"at\"]>=received)\n    refunded=any(e[\"events\"][\"refund_received\"] for a,e in reliable if received is None or a[\"at\"]>=received)\n    if received is not None:category=\"received_then_refunded\" if refunded else \"received_then_cancelled\" if cancelled else \"received_without_known_reversal\"\n    elif counts[\"hold_active\"] or counts[\"hold_released\"]:category=\"hold_or_release_without_posted_receipt\"\n    elif counts[\"refund_received\"]:category=\"refund_evidence_without_resolved_prior_receipt\"\n    elif counts[\"booking_cancelled\"]:category=\"cancellation_without_resolved_receipt\"\n    elif counts[\"payment_claim\"] or counts[\"manager_ack\"] or counts[\"posted_receipt\"]:category=\"payment_statement_uncorroborated\"\n    else:category=\"no_resolved_payment_statement\"\n    return {\"category\":category,\"received_at\":received,\"event_counts\":dict(counts),\"cancelled\":cancelled,\"refunded\":refunded,\"matched_records\":len(valid),\"reliable_records\":len(reliable)}\ndef verify_tests():\n    assert classify(\"Оплатила\",\"customer\")[\"payment_claim\"]\n    assert not classify(\"Если оплатила?\",\"customer\")[\"payment_claim\"]\n    assert not classify(\"Не оплатила\",\"customer\")[\"payment_claim\"]\n    assert classify(\"Оплату вижу\",\"manager\")[\"manager_ack\"]\n    assert not classify(\"Оплату вижу\",\"customer\")[\"manager_ack\"]\n    assert classify(\"Если не согласны, отменю замороженные денежные средства и они вновь будут доступны на карте.\",\"manager\")[\"hold_active\"]\n    assert not classify(\"Средства будут заморожены при оплате\",\"manager\")[\"hold_active\"]\n    assert classify(\"Средства будут заморожены при оплате\",\"manager\")[\"hold_policy\"]\n    assert classify(\"Деньги разморожены\",\"manager\")[\"hold_released\"]\n    assert classify(\"Деньги вернули на карту\",\"customer\")[\"refund_received\"]\n    assert not classify(\"Верните деньги\",\"customer\")[\"refund_received\"]\n    assert classify(\"Верните деньги\",\"customer\")[\"refund_requested\"]\n    assert classify(\"Бронь отменена\",\"manager\")[\"booking_cancelled\"]\n    assert not classify(\"Если бронь отменена, деньги вернутся\",\"manager\")[\"booking_cancelled\"]\n    assert classify(\"Отмените бронь\",\"customer\")[\"cancellation_requested\"]\n    def a(ref,role,at):return {\"ref\":ref,\"role\":role,\"at\":at,\"version_at\":at,\"status\":\"scanned\",\"flags\":{}}\n    atoms=[a(\"1\",\"customer\",1),a(\"2\",\"manager\",2),a(\"3\",\"manager\",3)]\n    ev=lambda x:{\"valid\":True,\"events\":classify(*x)}\n    events={\"1\":ev((\"Оплатила\",\"customer\")),\"2\":ev((\"Оплату вижу\",\"manager\"))}\n    assert trajectory(atoms,events)[\"received_at\"]==2\n    events[\"3\"]=ev((\"Средства заморожены\",\"manager\"))\n    assert trajectory(atoms,events)[\"received_at\"] is None\n    events[\"3\"]=ev((\"Бронь отменена\",\"manager\"))\n    assert trajectory(atoms,events)[\"category\"]==\"received_then_cancelled\"\n    events[\"3\"]=ev((\"Деньги вернули на карту\",\"manager\"))\n    assert trajectory(atoms,events)[\"category\"]==\"received_then_refunded\"\n    assert not classify(\"Оплатила\",\"customer\",{\"quoted_or_relayed\":True})[\"payment_claim\"]\ndef signal_utility(rows,common_module):\n    dev=common_module.normalized_rows([r for r in rows if r[\"assignment\"]==\"development\"])\n    control=common_module.normalized_rows([r for r in rows if r[\"assignment\"]==\"control\"])\n    pos_dev={r[\"group_key\"] for r,w in dev if r[\"label\"]==1};pos_ctrl={r[\"group_key\"] for r,w in control if r[\"label\"]==1}\n    result={\"target\":PROTOCOL[\"target\"],\"development_groups\":len({r[\"group_key\"] for r,w in dev}),\"control_groups\":len({r[\"group_key\"] for r,w in control}),\"development_positive_groups\":len(pos_dev),\"control_positive_groups\":len(pos_ctrl),\"control_previously_exposed\":True,\"true_purchase_calibrated\":False,\"feature_results\":{}}\n    if len(pos_dev)<8 or len(pos_ctrl)<8 or not any(r[\"label\"]==0 for r,w in dev):\n        result[\"status\"]=\"insufficient_strict_positive_groups\"\n        for f in FEATURES:result[\"feature_results\"][f]={\"development_positive_groups\":len({r[\"group_key\"] for r,w in dev if r[\"label\"]==1 and r[\"features\"][f]}),\"control_positive_groups\":len({r[\"group_key\"] for r,w in control if r[\"label\"]==1 and r[\"features\"][f]}),\"useful_beyond_stage\":False}\n        return result\n    common=common_module.learn_common(dev)\n    total=sum(w for r,w in dev)\n    for f in FEATURES:\n        coefficient=0.0\n        compressed=collections.defaultdict(lambda:[0.0,0.0])\n        for r,w in dev:\n            offset=common_module.base_logit(r,common)+(math.log(.25) if r[\"explicit_decline\"] else 0)\n            compressed[(round(offset,12),int(bool(r[\"features\"][f])))][0]+=w\n            compressed[(round(offset,12),int(bool(r[\"features\"][f])))][1]+=w*r[\"label\"]\n        for it in range(200):\n            grad=sum(x*(common_module.sigmoid(offset+coefficient*x)*weight-target) for (offset,x),(weight,target) in compressed.items())/total\n            coefficient-=.25*(grad+.05*coefficient)\n        grouped=collections.defaultdict(lambda:[0.0,0.0])\n        for r,w in control:\n            b=common_module.base_logit(r,common)+(math.log(.25) if r[\"explicit_decline\"] else 0)\n            old=common_module.row_losses(r[\"label\"],common_module.sigmoid(b))[1]\n            new=common_module.row_losses(r[\"label\"],common_module.sigmoid(b+coefficient*bool(r[\"features\"][f])))[1]\n            grouped[r[\"group_key\"]][0]+=w*(new-old);grouped[r[\"group_key\"]][1]+=w\n        diffs=[x/y for x,y in grouped.values()]\n        delta=sum(diffs)/len(diffs);rng=random.Random(128937);boots=[]\n        for unused in range(1000):boots.append(sum(diffs[rng.randrange(len(diffs))] for g in diffs)/len(diffs))\n        boots.sort();alpha=PROTOCOL[\"multiple_comparison_alpha\"];lower=boots[int(len(boots)*alpha/2)];upper=boots[min(len(boots)-1,int(len(boots)*(1-alpha/2)))]\n        pd=len({r[\"group_key\"] for r,w in dev if r[\"label\"]==1 and r[\"features\"][f]});pc=len({r[\"group_key\"] for r,w in control if r[\"label\"]==1 and r[\"features\"][f]})\n        result[\"feature_results\"][f]={\"development_positive_groups\":pd,\"control_positive_groups\":pc,\"logloss_delta\":delta,\"adjusted_interval\":[lower,upper],\"useful_beyond_stage\":bool(pd>=5 and pc>=3 and upper<0 and delta< -1e-6)}\n    result[\"status\"]=\"retrospective_group_control_completed\"\n    return result\n"
