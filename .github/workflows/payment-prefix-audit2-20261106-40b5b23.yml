;\n   if($row&&hash_equals($case['case_key'],hash_hmac('sha256',\"archive-case-v1\\0\".$row['account_id'].\"\\0\".$row['chat_id'],$salt))){\n     $a=(string)$row['account_id'];$c=(string)$row['chat_id'];\n     $position=['f'=>$input['fence'],'a'=>$a,'c'=>$c,'n'=>'0','scope_digest'=>$input['scope_digest']];\n     while(true){\n       if(++$pages>10000||hrtime(true)-$started>1500000000000)throw new RuntimeException();\n       $page=$reader->operatorStudyPage($auth,$position,1);$window=$page['windows'][0]??null;\n       if(!$window||$window['account_id']!==$a||$window['chat_id']!==$c)break;\n       foreach($window['messages']as$m){if(++$total>200000)throw new RuntimeException();$out(['type'=>'message','case_key'=>$case['case_key'],'message'=>$m]);}\n       if($window['chat_window_complete']){$complete=true;break;}\n       $next=$page['next_position'];if(!is_array($next)||$next['n']===$position['n'])throw new RuntimeException();$position=$next;\n     }\n   }\n   $out(['type'=>'case_complete','case_key'=>$case['case_key'],'complete'=>$complete]);\n }\n $auth();$out(['type'=>'complete','ok'=>true,'database_read_only'=>true]);\n while(ob_get_level()>$ob)ob_end_clean();\n}catch(Throwable $e){while(ob_get_level()>$ob)ob_end_clean();echo \"{\\\"type\\\":\\\"failed\\\",\\\"ok\\\":false}\\n\";exit(1);}\n"
