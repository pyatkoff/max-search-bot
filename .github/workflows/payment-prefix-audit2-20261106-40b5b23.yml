name: Private payment lifecycle and within-stage audit
on:
  push:
    branches: [ops/payment-prefix-audit2-20261106-40b5b23]
    paths: [.github/workflows/payment-prefix-audit2-20261106-40b5b23.yml]
permissions:
  contents: read
concurrency:
  group: anytour-private-archive-predictive-study
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/payment-prefix-audit2-20261106-40b5b23' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the one purpose source envelope
        env:
          API_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: 40b5b2325776930c2b45eee829a1abb86da3fa1f
        run: |
          set -euo pipefail
