name: Retired domain final sweep

on:
  push:
    branches: [cleanup/remove-retired-domain-final]
    paths: ['.github/workflows/retired-domain-final-sweep.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-retired-domain-final
          fetch-depth: 0
      - name: List remaining retired-host references
        shell: bash
        run: |
          set -euo pipefail
          retired="anytour"".online"
          echo '=== WORKFLOW MATCHES ==='
          git grep -n -F "$retired" -- '.github/workflows/**' || true
          echo '=== ALL TRACKED MATCHES ==='
          git grep -n -F "$retired" -- . || true
