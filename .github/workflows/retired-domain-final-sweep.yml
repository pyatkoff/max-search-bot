name: Retired domain final sweep

on:
  push:
    branches: [cleanup/remove-retired-domain-final]
    paths: ['.github/workflows/retired-domain-final-sweep.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-retired-domain-final
          fetch-depth: 0
      - name: Replace retired host outside workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          old='anytour'+'.online'
          repl=[
            (f'/var/www/545v0023442/data/www/{old}/max-search','/var/www/anytoour/data/www/app.anytoour.ru'),
            (f'~/www/{old}/max-search','/var/www/anytoour/data/www/app.anytoour.ru'),
            (f'www/{old}/max-search','/var/www/anytoour/data/www/app.anytoour.ru'),
            (f'https://www.{old}/max-search/','https://app.anytoour.ru/'),
            (f'https://{old}/max-search/','https://app.anytoour.ru/'),
            (f'https://www.{old}','https://www.anytoour.ru'),
            (f'admin@{old}','admin@anytoour.ru'),
            (f'https://{old}','https://app.anytoour.ru'),
            (old,'app.anytoour.ru'),
          ]
          changed=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not raw: continue
            p=Path(raw.decode())
            if str(p).startswith('.github/workflows/'): continue
            try: data=p.read_text('utf-8')
            except (UnicodeDecodeError,OSError): continue
            new=data
            for a,b in repl: new=new.replace(a,b)
            if new!=data:
              p.write_text(new,'utf-8'); changed.append(str(p))
          print('CHANGED_FILES='+str(len(changed)))
          print('\n'.join(changed))
          PY
      - name: Commit source sweep
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/'
          git commit -m 'Remove retired domain from runtime tests and docs'
          git push origin HEAD:cleanup/remove-retired-domain-final
