        \ 'commercial-hotel-1598-v1', 'commercial-hotel-2932-v1', 'commercial-hotel-44480-v1', 'commercial-hotel-68218-v1',\
        \ 'commercial-hotel-64753-v1', 'commercial-hotel-23199-v1', 'commercial-hotel-1488-v1'],true))exit(2);\n }\n}finally{$pdo->rollBack();}\n\
        echo json_encode(['scope'=>[68217,72203,1590,2484,4514,2625,64582,12143,17569,69077,1675,4454,2846,47026,2447,5406,64072,67402,2244,2423,26062,51257,75786,1598,2932,44480,68218,64753,23199,1488],'existing_native_publications'=>0,'db_writes'=>0,'provider_calls'=>0],JSON_THROW_ON_ERROR),PHP_EOL;\n\
        '''\nfor group in GROUPS:\n    group_ids=json.dumps(group['hotel_ids'],separators=(',',':'))\n    group_logical=str(['commercial-hotel-'+str(i)+'-v1'\
