        \ 'commercial-hotel-64072-v1', 'commercial-hotel-67402-v1', 'commercial-hotel-2244-v1', 'commercial-hotel-2423-v1',\
        \ 'commercial-hotel-26062-v1', 'commercial-hotel-51257-v1', 'commercial-hotel-75786-v1', 'commercial-hotel-1598-v1',\
