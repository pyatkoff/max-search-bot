        assert r['new_posts']==r['post_write_attempts']==20 and r['reused']==0 and len(r['posts'])==20\nexpected=set([13841,2805,8978,45152,1670,229,58676,67004,79279,36541]);manifest=json.loads((p/'manifest.json').read_bytes());rows={x['hotel_id']:x\
        \ for x in manifest['rows']}\nby=collections.defaultdict(set)\nfor x in r['posts']:\n    assert x['state']=='sent'\
