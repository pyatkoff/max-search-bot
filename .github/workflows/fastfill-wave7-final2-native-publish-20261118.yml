      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport base64\nfrom concurrent.futures import ThreadPoolExecutor\n\
        import hashlib\nimport io\nimport json\nfrom pathlib import Path\nimport subprocess\nimport zipfile\n\nREPO = 'pyatkoff/max-search-bot'\n\
        COMMIT = '1930f462559423492e7d60d66776ed8bf77bacbd'\nAPP = 'bd8e248f7138ea75cb9fda2dcf44beb631c633a5'\nORIGIN = 'dd3cfd891542a6b8d588611507b8caa1e4e5e610'\n\
        GROUPS = json.loads('''[{\"number\":113,\"operation\":\"commercial-hotel-batch-20261118-113-v1\",\"hotel_ids\":[11821,15794,2856,44409,54252,64066,2273,36549,2868,11760]},{\"\
        number\":114,\"operation\":\"commercial-hotel-batch-20261118-114-v1\",\"hotel_ids\":[5390,151010,57332,67096,78714,80894,118530,2507,11796,2434]},{\"\
        number\":115,\"operation\":\"commercial-hotel-batch-20261118-115-v1\",\"hotel_ids\":[8892,8953,11755,15788,17368,39191,43657,52872,11829,52217]},{\"\
        number\":116,\"operation\":\"commercial-hotel-batch-20261118-116-v1\",\"hotel_ids\":[57680,113788,12141,45663,2414,33639,45674]}]''')\n\
        EXPECTED = json.loads('''{\"registry-receipt.json\":\"a581396d926bfe8d64caf1179b0d9c1980de57a7518b525c1c802a27e73a7d0d\"\
