        \        assert approval['manifest_sha256']==digest((directory/'manifest.json').read_bytes())\n        assert manifest['photo_freeze_commit']==COMMIT\n\
        \        assert len(manifest['rows'])==len(entry['hotel_ids']) and [x['hotel_id'] for x in manifest['rows']]==approval['hotel_ids']==entry['hotel_ids']\n\
        \        media.extend(manifest['rows'])\n\nguard=r'''<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');\n\
        if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='bd8e248f7138ea75cb9fda2dcf44beb631c633a5')exit(2);\n\
        ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();\n\
        \n$old='/var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261118-119-v1';\nif(!is_dir($old)||is_link($old)||is_link($old.'/publication-summary.json')||is_link($old.'/three-hotels.lock'))exit(2);\n\
        $lock=fopen($old.'/three-hotels.lock','r');if(!$lock||!flock($lock,LOCK_SH|LOCK_NB))exit(2);\n$files=array_map('basename',glob($old.'/*'));sort($files);if($files!==['publication-summary.json','three-hotels.lock'])exit(2);\n\
        if(hash_file('sha256',$old.'/publication-summary.json')!=='6997d0e4646852fa8e4fa69ebe7690cffefa223c5673dd261dbe53d67d9f9d73')exit(2);\n\
        $prior=json_decode(file_get_contents($old.'/publication-summary.json'),true,64,JSON_THROW_ON_ERROR);\nif(($prior['operation']??null)!=='commercial-hotel-batch-20261118-119-v1'||($prior['post_write_attempts']??null)!==0||($prior['ok']??null)!==false||($prior['error']??null)!=='channel_rights_not_ready'||count($prior['posts']??[])!==0)exit(2);\n\
        flock($lock,LOCK_UN);fclose($lock);\n\n$pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ\
