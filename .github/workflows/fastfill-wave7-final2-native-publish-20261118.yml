name: Publish 35 W17 hotels through 4 sequential original bounded operations
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'cbc04bda9b73dc6250b630fd7523f6be16c6d156'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
        sparse-checkout: .github/workflows
    - name: Verify 35 source-bound inputs, photos, current release and countries
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport base64\nfrom concurrent.futures import ThreadPoolExecutor\n\
        import hashlib\nimport io\nimport json\nfrom pathlib import Path\nimport subprocess\nimport zipfile\n\nREPO = 'pyatkoff/max-search-bot'\n\
        COMMIT = 'ff847cbdc99d9bb4134ee7526064a0d1377a082a'\nAPP = 'bd8e248f7138ea75cb9fda2dcf44beb631c633a5'\nORIGIN = 'cbc04bda9b73dc6250b630fd7523f6be16c6d156'\n\
        GROUPS = json.loads('''[{\"number\":109,\"operation\":\"commercial-hotel-batch-20261118-109-v1\",\"hotel_ids\":[2413,2634,2666,8876,26061,35165,2672,62503,32230,128515]},{\"\
        number\":110,\"operation\":\"commercial-hotel-batch-20261118-110-v1\",\"hotel_ids\":[8934,15758,45573,69846,2412,66289,11761,11866,32213,83646]},{\"\
        number\":111,\"operation\":\"commercial-hotel-batch-20261118-111-v1\",\"hotel_ids\":[15916,32571,1385,1635,2855,11876,74239,75746,80074,146570]},{\"\
        number\":112,\"operation\":\"commercial-hotel-batch-20261118-112-v1\",\"hotel_ids\":[11800,11758,11767,2693,11748]}]''')\n\
        EXPECTED = json.loads('''{\"registry-receipt.json\":\"8e9d2eab572cf1ce8be374c70193b2370906435c66553263504e1f8618284417\"\
        ,\"image-receipt.json\":\"c4481a548e492cba2935996b1ca6508e614b0ee3c1eda614df4f4abf8e22d532\",\"p109-manifest.json\"\
        :\"a40c9071252be4a341882c482e8d51a5c14914bf202b98a31cd56337286d83e2\",\"p109-approval.json\":\"77da8fdbb9cc84b3d9840ad6189c1160ad860ed7d5596dd655fe76617953a478\"\
