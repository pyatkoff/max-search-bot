                  media.extend(manifest['rows'])
          
          guard=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2')exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          try{
           $q=$pdo->query('SELECT v.snapshot_json FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id IN (9,10)');
           foreach($q->fetchAll(PDO::FETCH_COLUMN) as $encoded){
            $snapshot=json_decode($encoded,true,64,JSON_THROW_ON_ERROR);
            $metadata=$snapshot['metadata']??[];
            if(in_array((int)($metadata['hotel_catalog_id']??0),[35174,64061,78938,2921,2437,2462,11749,11774,11786,11802,56078,64360,11743,2483,11744,11788,11794,51240,2477,57802,5399,11832,46068,15799,82676,122961,64124,71388,79690,126132,11781,58743,60233,64955,109335,2424,2429,60231,2803,2826,11765,11773,11873,43238,43701,45544,2433,11770,11742],true))exit(2);
            if(in_array((string)($metadata['logical_id']??''),['commercial-hotel-35174-v1', 'commercial-hotel-64061-v1', 'commercial-hotel-78938-v1', 'commercial-hotel-2921-v1', 'commercial-hotel-2437-v1', 'commercial-hotel-2462-v1', 'commercial-hotel-11749-v1', 'commercial-hotel-11774-v1', 'commercial-hotel-11786-v1', 'commercial-hotel-11802-v1', 'commercial-hotel-56078-v1', 'commercial-hotel-64360-v1', 'commercial-hotel-11743-v1', 'commercial-hotel-2483-v1', 'commercial-hotel-11744-v1', 'commercial-hotel-11788-v1', 'commercial-hotel-11794-v1', 'commercial-hotel-51240-v1', 'commercial-hotel-2477-v1', 'commercial-hotel-57802-v1', 'commercial-hotel-5399-v1', 'commercial-hotel-11832-v1', 'commercial-hotel-46068-v1', 'commercial-hotel-15799-v1', 'commercial-hotel-82676-v1', 'commercial-hotel-122961-v1', 'commercial-hotel-64124-v1', 'commercial-hotel-71388-v1', 'commercial-hotel-79690-v1', 'commercial-hotel-126132-v1', 'commercial-hotel-11781-v1', 'commercial-hotel-58743-v1', 'commercial-hotel-60233-v1', 'commercial-hotel-64955-v1', 'commercial-hotel-109335-v1', 'commercial-hotel-2424-v1', 'commercial-hotel-2429-v1', 'commercial-hotel-60231-v1', 'commercial-hotel-2803-v1', 'commercial-hotel-2826-v1', 'commercial-hotel-11765-v1', 'commercial-hotel-11773-v1', 'commercial-hotel-11873-v1', 'commercial-hotel-43238-v1', 'commercial-hotel-43701-v1', 'commercial-hotel-45544-v1', 'commercial-hotel-2433-v1', 'commercial-hotel-11770-v1', 'commercial-hotel-11742-v1'],true))exit(2);
           }
          }finally{$pdo->rollBack();}
          echo json_encode(['scope'=>[35174,64061,78938,2921,2437,2462,11749,11774,11786,11802,56078,64360,11743,2483,11744,11788,11794,51240,2477,57802,5399,11832,46068,15799,82676,122961,64124,71388,79690,126132,11781,58743,60233,64955,109335,2424,2429,60231,2803,2826,11765,11773,11873,43238,43701,45544,2433,11770,11742],'existing_native_publications'=>0,'db_writes'=>0,'provider_calls'=>0],JSON_THROW_ON_ERROR),PHP_EOL;
          '''
          for group in GROUPS:
              group_ids=json.dumps(group['hotel_ids'],separators=(',',':'))
              group_logical=str(['commercial-hotel-'+str(i)+'-v1' for i in group['hotel_ids']])
              scoped=guard.replace('[35174,64061,78938,2921,2437,2462,11749,11774,11786,11802,56078,64360,11743,2483,11744,11788,11794,51240,2477,57802,5399,11832,46068,15799,82676,122961,64124,71388,79690,126132,11781,58743,60233,64955,109335,2424,2429,60231,2803,2826,11765,11773,11873,43238,43701,45544,2433,11770,11742]',group_ids).replace("['commercial-hotel-35174-v1', 'commercial-hotel-64061-v1', 'commercial-hotel-78938-v1', 'commercial-hotel-2921-v1', 'commercial-hotel-2437-v1', 'commercial-hotel-2462-v1', 'commercial-hotel-11749-v1', 'commercial-hotel-11774-v1', 'commercial-hotel-11786-v1', 'commercial-hotel-11802-v1', 'commercial-hotel-56078-v1', 'commercial-hotel-64360-v1', 'commercial-hotel-11743-v1', 'commercial-hotel-2483-v1', 'commercial-hotel-11744-v1', 'commercial-hotel-11788-v1', 'commercial-hotel-11794-v1', 'commercial-hotel-51240-v1', 'commercial-hotel-2477-v1', 'commercial-hotel-57802-v1', 'commercial-hotel-5399-v1', 'commercial-hotel-11832-v1', 'commercial-hotel-46068-v1', 'commercial-hotel-15799-v1', 'commercial-hotel-82676-v1', 'commercial-hotel-122961-v1', 'commercial-hotel-64124-v1', 'commercial-hotel-71388-v1', 'commercial-hotel-79690-v1', 'commercial-hotel-126132-v1', 'commercial-hotel-11781-v1', 'commercial-hotel-58743-v1', 'commercial-hotel-60233-v1', 'commercial-hotel-64955-v1', 'commercial-hotel-109335-v1', 'commercial-hotel-2424-v1', 'commercial-hotel-2429-v1', 'commercial-hotel-60231-v1', 'commercial-hotel-2803-v1', 'commercial-hotel-2826-v1', 'commercial-hotel-11765-v1', 'commercial-hotel-11773-v1', 'commercial-hotel-11873-v1', 'commercial-hotel-43238-v1', 'commercial-hotel-43701-v1', 'commercial-hotel-45544-v1', 'commercial-hotel-2433-v1', 'commercial-hotel-11770-v1', 'commercial-hotel-11742-v1']",group_logical)
              (root/('guard-readonly-p'+str(group['number'])+'.php')).write_text(scoped)
          def verify_photo(row):
              url=f"https://raw.githubusercontent.com/{REPO}/{COMMIT}/.github/traffic-publish/commercial-wave10-20261118/{row['hotel_id']}.png"
              assert row['photo_url']==url
              data=subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20',url],timeout=25)
              assert digest(data)==row['photo_sha256']
          
          import urllib.request
          countries=json.loads('''{"35174": 8, "64061": 8, "78938": 8, "2921": 8, "2437": 8, "2462": 8, "11749": 27, "11774": 27, "11786": 27, "11802": 27, "56078": 8, "64360": 27, "11743": 27, "2483": 8, "11744": 27, "11788": 27, "11794": 27, "51240": 12, "2477": 8, "57802": 12, "5399": 12, "11832": 28, "46068": 8, "15799": 27, "82676": 12, "122961": 12, "64124": 8, "71388": 12, "79690": 8, "126132": 8, "11781": 27, "58743": 8, "60233": 8, "64955": 8, "109335": 12, "2424": 8, "2429": 8, "60231": 8, "2803": 12, "2826": 12, "11765": 27, "11773": 27, "11873": 28, "43238": 12, "43701": 12, "45544": 12, "2433": 8, "11770": 27, "11742": 27}''')
          for row in media:
