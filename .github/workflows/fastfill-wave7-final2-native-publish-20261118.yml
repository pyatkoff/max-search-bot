        \ and run['run_attempt']==1\na=info('actions/artifacts/14478822807')\nassert not a['expired'] and a['workflow_run']['id']==44415416635\
        \ and a['digest']=='sha256:70f6a5bd8268fa96f1274d968bd789087263e0b86be3333a25ace79e4d35412a'\nraw=api('actions/artifacts/14478822807/zip')\n\
        assert digest(raw)=='70f6a5bd8268fa96f1274d968bd789087263e0b86be3333a25ace79e4d35412a'\nroot=Path('pub')\nroot.mkdir()\n\
