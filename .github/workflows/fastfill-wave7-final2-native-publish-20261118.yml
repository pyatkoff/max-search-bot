name: Publish three accepted post-W20 hotels P1 ONCE with native readback
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/fastfill-wave7-final2-native-publish-20261118.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-three-once:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
      && github.event.before == 'd53fa27da4856f6de5ad3990ef1933a7c8914a99' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Require exact accepted source, current release, countries, covers and
        four material checks
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport subprocess,json,base64,hashlib,io,zipfile,pathlib,urllib.request,os\n\
        REPO='pyatkoff/max-search-bot';APP='9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e';IDS=[116719,28569,32354]\n\
        def api(p):return subprocess.check_output(['gh','api','repos/'+REPO+'/'+p],timeout=80)\n\
        def data(p):return json.loads(api(p))\ndef digest(b):return hashlib.sha256(b).hexdigest()\n\
        assert data('git/ref/heads/main')['object']['sha']==APP\nassert data('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA']\n\
        d=json.loads(base64.b64decode(data('contents/deploy_status.json?ref=diagnostics')['content']));release=d['repository_release']\n\
        assert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP\n\
        assert str(release['release']['run_id'])=='44595114412' and all(s['result']=='success'\
        \ for s in release['stages'].values())\nrequired={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml','telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml','tour-selection-host.yml','modeled-conversion-monitor.yml'}\n\
        g={v['path'].rsplit('/',1)[-1]:v for v in release['closure']['gates']};assert\
        \ required<=g.keys() and all(g[x]['conclusion']=='success' and g[x]['head_sha']==APP\
        \ and g[x]['run_attempt']==1 for x in required)\nassert 'PR1631: установлено,\
        \ выпуск свободен' in data('issues/comments/6682640708')['body']\nrun=data('actions/runs/44607203617');assert\
        \ run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1\
        \ and run['head_sha']=='d53fa27da4856f6de5ad3990ef1933a7c8914a99'\na=data('actions/artifacts/14571405162');assert\
        \ a['workflow_run']['id']==44607203617 and a['digest']=='sha256:f6190ce9f29665e6c6c91c9eb786c32d514eae84b8de2c96c69c841f1f662b5a'\
        \ and not a['expired']\nb=api('actions/artifacts/14571405162/zip');assert\
        \ digest(b)=='f6190ce9f29665e6c6c91c9eb786c32d514eae84b8de2c96c69c841f1f662b5a'\n\
        with zipfile.ZipFile(io.BytesIO(b)) as z:\n receipt=z.read('source-receipt.json');assert\
        \ digest(receipt)=='72f2ecc0a1464aebd5460420217c71657caa95d69009f2642b739f6b592ae969'\n\
        \ r=json.loads(receipt);assert r['state']=='POSTW20_SOURCE_ACCEPTED_COVERS_STAGED'\
        \ and r['expected_app_sha']==APP and r['native_hotel_ids']==IDS and r['poster_calls']==0\
        \ and r['feed_writes']==0 and r['telegram_disable_notification'] is True\n\
        \ assert set(z.namelist())==set(r['source_sha256'])|{'source-receipt.json'}\n\
        \ contents={n:z.read(n) for n in r['source_sha256']};assert all(digest(v)==r['source_sha256'][n]\
        \ for n,v in contents.items())\n q=json.loads(contents['qualification-receipt.json']);assert\
        \ set(q)==set(map(str,IDS))\n for review in q.values():\n  assert review['operational_review']['status']=='confirmed_open'\
        \ and review['operational_review']['current_identity_verified'] and review['operational_review']['material_conditions_verified']\
        \ and not review['operational_review']['future_opening_or_rebrand_unresolved']\n\
        \  checks=review['material_checks'];assert set(checks)=={'beach','waterpark','kids_club','pools'}\
        \ and all(v['status'] in ['verified','not_applicable'] and v['evidence'] and\
        \ v['sources'] for v in checks.values())\n root=pathlib.Path('pub/p1');root.mkdir(parents=True)\n\
        \ for out,name in {'manifest.json':'p1-manifest.json','approval.json':'p1-approval.json','wave2-once.php':'p1-publisher-unexecuted.php'}.items():(root/out).write_bytes(contents[name])\n\
        \ (root/'source-receipt.json').write_bytes(receipt)\n assert b\"'disable_notification'=>'true'\"\
        \ in contents['p1-publisher-unexecuted.php']\n manifest=json.loads(contents['p1-manifest.json']);approval=json.loads(contents['p1-approval.json'])\n\
        \ assert manifest['operation']==approval['operation']=='commercial-hotel-batch-20261119-1-v1'\
        \ and manifest['state']=='PREPARED_NOT_SENT'\n assert approval['manifest_sha256']==digest(contents['p1-manifest.json'])\
        \ and approval['expected_installed_sha']==APP and approval['hotel_ids']==IDS\n\
        \ assert [x['hotel_id'] for x in manifest['rows']]==IDS\n for row in manifest['rows']:\n\
        \  with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(row['hotel_id']),timeout=30)\
        \ as resp:actual=json.load(resp)\n  assert actual['id']==row['hotel_id'] and\
        \ actual['country']['id']==r['countries'][str(row['hotel_id'])]!=11\n  b=subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','30',row['photo_url']],timeout=35);assert\
        \ digest(b)==row['photo_sha256']\nassert data('git/ref/heads/main')['object']['sha']==APP\n\
        assert data('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA']\n\
        print('THREE_SOURCE_INPUTS_CURRENT_RELEASE_COUNTRIES_AND_FOUR_MATERIAL_CHECKS_VERIFIED')\n\
        \nPY\ncat > pub/guard-readonly-p1.php <<'PHP'\n<?php\ndeclare(strict_types=1);\n\
        \nini_set('display_errors', '0');\n$installed = trim((string)shell_exec('git\
        \ rev-parse HEAD'));\nif (PHP_SAPI !== 'cli' || $installed !== '9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e')\
        \ {\n    fwrite(STDERR, \"Installed application changed before registry read\\\
        n\");\n    exit(2);\n}\nif (trim((string)shell_exec('git status --porcelain\
        \ --untracked-files=no')) !== '') {\n    fwrite(STDERR, \"Tracked production\
        \ files differ from the installed release\\n\");\n    exit(2);\n}\n$pins =\
        \ json_decode(base64_decode('',\
        \ true), true, 64, JSON_THROW_ON_ERROR);\nforeach ($pins as $path => $expected)\
        \ {\n    if (trim((string)shell_exec('git hash-object -- ' . escapeshellarg($path)))\
        \ !== $expected) {\n        throw new RuntimeException('Pinned publication\
        \ component differs from the installed release');\n    }\n}\n$manifest = [[116719,['Bliss\
        \ Hoi An','Bliss HoiAn']],[28569,['Twin Lotus']],[32354,['Phu Quoc Eco Beach','Eco\
        \ Beach Resort']]];\n\nob_start();\nrequire getcwd() . '/config.php';\nrequire_once\
        \ getcwd() . '/services/ChannelPostRuntime.php';\nob_end_clean();\n\n$pdo\
        \ = ConversationDb::connection();\n$pdo->exec('SET SESSION TRANSACTION READ\
        \ ONLY');\n$pdo->beginTransaction();\n$result = ['installed_sha' => $installed,\
        \ 'checked_at' => gmdate(DATE_ATOM),\n    'native_hotel_ids' => array_column($manifest,\
        \ 0), 'channels' => [], 'matches' => []];\ntry {\n    $query = $pdo->prepare('SELECT\
        \ p.id, p.current_version_id, v.snapshot_json\n        FROM post_publications\
        \ p JOIN post_versions v ON v.id = p.current_version_id\n        WHERE p.post_channel_id\
        \ = ? ORDER BY p.id');\n    foreach (['telegram' => 10, 'max' => 9] as $platform\
        \ => $channel) {\n        $query->execute([$channel]);\n        $rows = $query->fetchAll(PDO::FETCH_ASSOC);\n\
        \        if (count($rows) < 1692) {\n            throw new RuntimeException('Publication\
        \ registry is below the verified baseline');\n        }\n        $result['channels'][$platform]\
        \ = count($rows);\n        foreach ($rows as $record) {\n            $post\
        \ = json_decode($record['snapshot_json'], true, 64, JSON_THROW_ON_ERROR);\n\
        \            $title = explode(\"\\n\", (string)($post['text'] ?? ''), 2)[0];\n\
        \            $metadata = $post['metadata'] ?? [];\n            $native = (int)($metadata['hotel_catalog_id']\
        \ ?? 0);\n            $result['rows'][] = ['platform'=>$platform,'publication_id'=>(int)$record['id'],'native_id'=>$native,'logical_id'=>(string)($metadata['logical_id']??''),'title'=>$title];\n\
        \            foreach ($manifest as [$id, $aliases]) {\n                $reason\
        \ = [];\n                if ($native === $id || ($metadata['logical_id'] ??\
        \ '') === \"commercial-hotel-$id-v1\") {\n                    $reason[] =\
        \ 'identity';\n                }\n                foreach ($aliases as $alias)\
        \ {\n                    if ($alias !== '' && mb_stripos($title, $alias, 0,\
        \ 'UTF-8') !== false) {\n                        $reason[] = 'title';\n  \
        \                      break;\n                    }\n                }\n\
        \                if ($reason !== []) {\n                    $result['matches'][]\
        \ = ['requested_id' => $id, 'registry_hotel_id' => $native,\n            \
        \            'platform' => $platform, 'publication_id' => (int)$record['id'],\n\
        \                        'version_id' => (int)$record['current_version_id'],\
        \ 'reason' => $reason,\n                        'title' => mb_substr($title,\
        \ 0, 180, 'UTF-8')];\n                }\n            }\n        }\n    }\n\
        } finally {\n    $pdo->rollBack();\n}\necho json_encode($result, JSON_UNESCAPED_UNICODE\
        \ | JSON_THROW_ON_ERROR), PHP_EOL;\nPHP\nphp -l pub/p1/wave2-once.php\nphp\
        \ -l pub/guard-readonly-p1.php\n"
    - name: Pin established SSH host continuity and authentication identity
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE']\
        \ or '')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or\
        \ '')\nPY\nif [[ \"$KEY_VALUE\" == *\"PRIVATE KEY\"* ]]; then\n  if [[ \"\
        $KEY_VALUE\" == *'\\n'* ]]; then printf '%b\\n' \"$KEY_VALUE\" | tr -d '\\\
        r' > \"$RUNNER_TEMP/channel_key\"; else printf '%s\\n' \"$KEY_VALUE\" | tr\
        \ -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse printf '%s' \"$KEY_VALUE\"\
        \ | base64 --decode > \"$RUNNER_TEMP/channel_key\"; fi\nchmod 600 \"$RUNNER_TEMP/channel_key\"\
        \nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\npython3 - <<'PY'\n\
        import base64,hashlib,os,pathlib,subprocess\nscan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]\n\
        for s in scan.stdout.splitlines():\n    q=s.split()\n    if len(q)<3 or q[0].startswith('#'):continue\n\
        \    try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')\n\
        \    except Exception:continue\n    if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)\n\
        assert found,'HOST_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(found)+'\\n')\nprint('ESTABLISHED_HOST_PIN_VERIFIED')\nPY\n"
    - name: P1 fresh read-only admission for exactly 3 hotels
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,subprocess\nbase='repos/pyatkoff/max-search-bot'\n\
        def data(path):\n    return json.loads(subprocess.check_output(['gh','api',base+'/'+path],timeout=40))\n\
        assert data('git/ref/heads/main')['object']['sha']=='9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e'\n\
        import urllib.request\ncountries={'116719':16,'28569':2,'32354':16}\nfor hotel_id\
        \ in [116719, 28569, 32354]:\n    with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(hotel_id),timeout=30)\
        \ as response:\n        actual=json.load(response)\n    assert actual['id']==hotel_id\
        \ and actual['country']['id']==countries[str(hotel_id)] and actual['country']['id']!=11\n\
        feed=data('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')\n\
        active=[x['id'] for x in feed['workflow_runs'] if x['status'] in {'requested','queued','in_progress','waiting','pending'}]\n\
        if active:\n    raise SystemExit('Current feed owner has an active operation:\
        \ '+str(active))\nPY\noptions=(-i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes\
        \ -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes\
        \ -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"$RUNNER_TEMP/channel_known_hosts\"\
        \ -o ServerAliveInterval=15 -o ServerAliveCountMax=2)\nssh \"${options[@]}\"\
        \ \"$USER_VALUE@$HOST_VALUE\" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR\
        \ GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY\
        \ GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0; app=/var/www/anytoour/data/www/app.anytoour.ru;\
        \ test -d \"$app/.git\" && test ! -L \"$app\"; cd \"$app\"; test \"$(git rev-parse\
        \ HEAD)\" = 9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e; test -z \"$(git status\
        \ --porcelain --untracked-files=no)\"; test ! -e /var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261119-1-v1;\
        \ command -v php >/dev/null; printf \"CURRENT_PRODUCTION_SOURCE_VERIFIED\\\
        \\n\"' > pub/p1/preflight.txt\ngrep -Fx 'CURRENT_PRODUCTION_SOURCE_VERIFIED'\
        \ pub/p1/preflight.txt\nssh \"${options[@]}\" \"$USER_VALUE@$HOST_VALUE\"\
        \ 'set -eu; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/guard-readonly-p1.php\
        \ > pub/p1/absence-checkpoint.json\npython3 -c 'import json; d=json.load(open(\"\
        pub/p1/absence-checkpoint.json\")); assert d[\"native_hotel_ids\"]==[116719,28569,32354]\
        \ and not d[\"matches\"]'\n"
    - name: P1 invoke original bounded publisher ONCE; no retry
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
        -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15
        -o ServerAliveCountMax=2)

        rc=0

        ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" ''set -eu; unset GIT_DIR GIT_WORK_TREE
        GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY
        GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru;
        php'' < pub/p1/wave2-once.php > pub/p1/original-native-output.jsonl || rc=$?

        printf ''%s\n'' "$rc" > pub/p1/original-exit.txt

        cat pub/p1/original-native-output.jsonl

        exit "$rc"

        '
    - name: P1 verify all 6 actual posts before the next original operation
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport collections,hashlib,json,pathlib\n\
        p=pathlib.Path('pub/p1')\nlines=[json.loads(l) for l in (p/'original-native-output.jsonl').read_text().splitlines()\
        \ if l.strip().startswith('{')]\nassert (p/'original-exit.txt').read_text().strip()=='0'\
        \ and lines\nr=lines[-1];assert r['ok'] and r['operation']=='commercial-hotel-batch-20261119-1-v1'\
        \ and r['installed_sha']=='9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e'\nassert\
        \ r['new_posts']==r['post_write_attempts']==6 and r['reused']==0 and len(r['posts'])==6\n\
        expected=set([116719,28569,32354]);manifest=json.loads((p/'manifest.json').read_bytes());rows={x['hotel_id']:x\
        \ for x in manifest['rows']}\nby=collections.defaultdict(set)\nfor x in r['posts']:\n\
        \    assert x['state']=='sent' and x['body_photo_button_verified'] and not\
        \ x['reused']\n    assert x['hotel_id'] in expected and x['platform'] in ['max','telegram']\n\
        \    assert x['button_text']=='✈️ Узнать стоимость тура'\n    assert all(x[k]==rows[x['hotel_id']][k]\
        \ for k in ['logical_id','text_sha256','photo_sha256','photo_url'])\n    assert\
        \ x['source_key']==('max_anytour_msk1' if x['platform']=='max' else 'tg_anytour_msk')\n\
        \    assert x['channel_id']==('-80492244209683' if x['platform']=='max' else\
        \ '-1002262666616')\n    assert x['post_url'].startswith('https://max.ru/channel_anytour/'\
        \ if x['platform']=='max' else 'https://t.me/any_toour/')\n    assert x['button_url'].startswith('https://max.ru/id9704048781_1_bot?start=p_'\
        \ if x['platform']=='max' else 'https://t.me/anyru_bot?start=p_')\n    by[x['platform']].add(x['hotel_id'])\n\
        assert by['max']==by['telegram']==expected and len(set(x['post_url'] for x\
        \ in r['posts']))==6\nout={'state':'6_NATIVE_POSTS_VERIFIED','unique_new_hotels':3,'telegram':3,'max':3,'operation':r['operation'],'original_output_sha256':hashlib.sha256((p/'original-native-output.jsonl').read_bytes()).hexdigest(),'feed_rows_added':0,'posts':r['posts']}\n\
        (p/'terminal-verified.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\\\
        n')\nprint('P1_NATIVE_POSTS_VERIFIED '+json.dumps({'hotels':3,'original_output_sha256':out['original_output_sha256']},separators=(',',':')))\n\
        PY\n"
    - name: P1 preserve original one-attempt outcome including UNKNOWN
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: postw20-p1-native-one-attempt-20261119
        path: 'pub/p1/preflight.txt

          pub/p1/original-native-output.jsonl

          pub/p1/original-exit.txt

          pub/p1/terminal-verified.json

          pub/p1/manifest.json

          pub/p1/approval.json

          pub/p1/source-receipt.json

          '
        retention-days: 30
        if-no-files-found: warn
    - name: Remove runner-only key and unexecuted source files
      if: always()
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/p*/wave2-once.php
        pub/source.zip
