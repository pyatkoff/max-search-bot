name: Publish 37 W18 hotels through 4 sequential original bounded operations
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'dd3cfd891542a6b8d588611507b8caa1e4e5e610'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
        sparse-checkout: .github/workflows
