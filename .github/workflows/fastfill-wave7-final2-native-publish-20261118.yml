        number\":120,\"operation\":\"commercial-hotel-batch-20261118-120-v1\",\"hotel_ids\":[1675,4454,2846,47026,2447,5406,64072,67402,2244,2423]},{\"\
        number\":121,\"operation\":\"commercial-hotel-batch-20261118-121-v1\",\"hotel_ids\":[26062,51257,75786,1598,2932,44480,68218,64753,23199,1488]}]''')\n\
