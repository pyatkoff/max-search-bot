name: Publish 11 W19 hotels through 2 sequential original bounded operations
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '0b2b943c8e322656f59de7f42e7e17a0b5c7daee'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
        sparse-checkout: .github/workflows
    - name: Verify 11 source-bound inputs, photos, current release and countries
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport base64\nfrom concurrent.futures import ThreadPoolExecutor\n\
        import hashlib\nimport io\nimport json\nfrom pathlib import Path\nimport subprocess\nimport zipfile\n\nREPO = 'pyatkoff/max-search-bot'\n\
        COMMIT = '9548c5d5b65ecba2356470b4ea6ea022fed6aa46'\nAPP = 'bd8e248f7138ea75cb9fda2dcf44beb631c633a5'\nORIGIN = '0b2b943c8e322656f59de7f42e7e17a0b5c7daee'\n\
        GROUPS = json.loads('''[{\"number\":117,\"operation\":\"commercial-hotel-batch-20261118-117-v1\",\"hotel_ids\":[13841,2805,8978,45152,1670,229,58676,67004,79279,36541]},{\"\
        number\":118,\"operation\":\"commercial-hotel-batch-20261118-118-v1\",\"hotel_ids\":[79154]}]''')\nEXPECTED = json.loads('''{\"\
        registry-receipt.json\":\"a531ee7e141cf284a7140c58c6998429806503ffa1d9baee23a640e85109c38b\",\"image-receipt.json\"\
        :\"fc3cc5c70e10739a8281277386d9178b6c7f20ef9f0004651f77f980228fd8a7\",\"p117-manifest.json\":\"3314c75abbb1521ddfdbbd455f16939b9f83a66fdaebf5a541a5b287a182faf9\"\
        ,\"p117-approval.json\":\"51e6b11210437f09f9bd5e57eb97b376e146f9eed81b51bd182144a5ca8ae27a\",\"p117-publisher-unexecuted.php\"\
        :\"418869bfb3f9488ee2dbf5250d47db171b571e34321fd22f8078f929d4aef14c\",\"p118-manifest.json\":\"586e04057bd6f858f09e5f5decad4f2de5e3c1859aaa6145ba9e6d48f44dcc07\"\
        ,\"p118-approval.json\":\"8abf01abb9f0d6c1f33a179e400033723b87e3b1b1f0263e9337dba5db165011\",\"p118-publisher-unexecuted.php\"\
        :\"c9b51a2d485f989b4b2323f7330893575e15b2ac6c9db670a1c79ed90f953ad4\"}''')\n\ndef api(path):\n    return subprocess.check_output(['gh','api',f'repos/{REPO}/{path}'],timeout=70)\n\
        \ndef info(path):\n    return json.loads(api(path))\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\
        \nassert info('git/ref/heads/main')['object']['sha']==APP\nd=json.loads(base64.b64decode(info('contents/deploy_status.json?ref=diagnostics')['content']))\n\
        release=d['repository_release']\nassert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP\n\
        assert str(release['release']['run_id'])=='44329290180' and all(s['result']=='success' for s in release['stages'].values())\n\
        required={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml',\n         \
        \ 'telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml',\n      \
        \    'tour-selection-host.yml','modeled-conversion-monitor.yml'}\ngates={g['path'].rsplit('/',1)[-1]:g for g in release['closure']['gates']}\n\
        assert required <= gates.keys()\nassert all(gates[p]['conclusion']=='success' and gates[p]['head_sha']==APP and gates[p]['run_attempt']==1\
        \ for p in required)\n\nrun=info('actions/runs/44408299531')\nassert run['conclusion']=='success' and run['head_sha']==ORIGIN\
        \ and run['run_attempt']==1\na=info('actions/artifacts/14475292772')\nassert not a['expired'] and a['workflow_run']['id']==44408299531\
        \ and a['digest']=='sha256:96b907f9660c9754d7c979f6bda2ac66d7c239cff26dfd3347dffaa4ee08093f'\nraw=api('actions/artifacts/14475292772/zip')\n\
        assert digest(raw)=='96b907f9660c9754d7c979f6bda2ac66d7c239cff26dfd3347dffaa4ee08093f'\nroot=Path('pub')\nroot.mkdir()\n\
        media=[]\nwith zipfile.ZipFile(io.BytesIO(raw)) as archive:\n    assert set(archive.namelist())==set(EXPECTED)|{'source-receipt.json'}\n\
        \    contents={name:archive.read(name) for name in archive.namelist()}\n    assert all(digest(contents[name])==sha\
        \ for name,sha in EXPECTED.items())\n    assert digest(contents['source-receipt.json'])=='5ac78ce8e55fd0ca1858bef9803aad31dd3a5cae81e421f0eb07a45a74a4d8e4'\n\
        \    receipt=json.loads(contents['source-receipt.json'])\n    assert receipt['state']=='WAVE19_SOURCE_ACCEPTED_COVERS_STAGED'\n\
        \    assert receipt['expected_app_sha']==APP and receipt['cover_commit']==COMMIT and receipt['groups']==GROUPS\n \
        \   assert receipt['telegram_disable_notification'] is True\n    assert receipt['notification_policy_evidence']=='OFFLINE_REQUEST_PAYLOAD_TEST_PASS'\n\
        \    assert receipt['template_sha256']=='426b57458bf31eb5c96a85ba9c54df9d8939d885ba706b6de26b026b16a04041'\n    (root/'accepted-source-receipt.json').write_bytes(contents['source-receipt.json'])\n\
        \    for entry in GROUPS:\n        number=entry['number']\n        assert b\"'disable_notification'=>'true'\" in contents[f'p{number}-publisher-unexecuted.php'],\
        \ 'MISSING_TELEGRAM_SILENT_LITERAL'\n        directory=root/f'p{number}'\n        directory.mkdir()\n        mapping={'manifest.json':f'p{number}-manifest.json','approval.json':f'p{number}-approval.json',\n\
        \                 'wave2-once.php':f'p{number}-publisher-unexecuted.php','source-receipt.json':'source-receipt.json'}\n\
        \        for name,source_name in mapping.items():\n            (directory/name).write_bytes(contents[source_name])\n\
        \        manifest=json.loads((directory/'manifest.json').read_bytes())\n        approval=json.loads((directory/'approval.json').read_bytes())\n\
        \        assert manifest['operation']==approval['operation']==entry['operation']\n        assert manifest['state']=='PREPARED_NOT_SENT'\
        \ and manifest['button_text']=='✈️ Узнать стоимость тура'\n        assert approval['expected_installed_sha']==APP\n\
        \        assert approval['manifest_sha256']==digest((directory/'manifest.json').read_bytes())\n        assert manifest['photo_freeze_commit']==COMMIT\n\
        \        assert len(manifest['rows'])==len(entry['hotel_ids']) and [x['hotel_id'] for x in manifest['rows']]==approval['hotel_ids']==entry['hotel_ids']\n\
        \        media.extend(manifest['rows'])\n\nguard=r'''<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');\n\
        if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='bd8e248f7138ea75cb9fda2dcf44beb631c633a5')exit(2);\n\
        ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();\n\
        $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();\ntry{\n\
        \ $q=$pdo->query('SELECT v.snapshot_json FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id\
        \ WHERE p.post_channel_id IN (9,10)');\n foreach($q->fetchAll(PDO::FETCH_COLUMN) as $encoded){\n  $snapshot=json_decode($encoded,true,64,JSON_THROW_ON_ERROR);\n\
        \  $metadata=$snapshot['metadata']??[];\n  if(in_array((int)($metadata['hotel_catalog_id']??0),[13841,2805,8978,45152,1670,229,58676,67004,79279,36541,79154],true))exit(2);\n\
        \  if(in_array((string)($metadata['logical_id']??''),['commercial-hotel-13841-v1', 'commercial-hotel-2805-v1', 'commercial-hotel-8978-v1',\
        \ 'commercial-hotel-45152-v1', 'commercial-hotel-1670-v1', 'commercial-hotel-229-v1', 'commercial-hotel-58676-v1',\
        \ 'commercial-hotel-67004-v1', 'commercial-hotel-79279-v1', 'commercial-hotel-36541-v1', 'commercial-hotel-79154-v1'],true))exit(2);\n\
        \ }\n}finally{$pdo->rollBack();}\necho json_encode(['scope'=>[13841,2805,8978,45152,1670,229,58676,67004,79279,36541,79154],'existing_native_publications'=>0,'db_writes'=>0,'provider_calls'=>0],JSON_THROW_ON_ERROR),PHP_EOL;\n\
        '''\nfor group in GROUPS:\n    group_ids=json.dumps(group['hotel_ids'],separators=(',',':'))\n    group_logical=str(['commercial-hotel-'+str(i)+'-v1'\
        \ for i in group['hotel_ids']])\n    scoped=guard.replace('[13841,2805,8978,45152,1670,229,58676,67004,79279,36541,79154]',group_ids).replace(\"\
        ['commercial-hotel-13841-v1', 'commercial-hotel-2805-v1', 'commercial-hotel-8978-v1', 'commercial-hotel-45152-v1',\
        \ 'commercial-hotel-1670-v1', 'commercial-hotel-229-v1', 'commercial-hotel-58676-v1', 'commercial-hotel-67004-v1',\
        \ 'commercial-hotel-79279-v1', 'commercial-hotel-36541-v1', 'commercial-hotel-79154-v1']\",group_logical)\n    (root/('guard-readonly-p'+str(group['number'])+'.php')).write_text(scoped)\n\
        def verify_photo(row):\n    url=f\"https://raw.githubusercontent.com/{REPO}/{COMMIT}/.github/traffic-publish/commercial-wave19-20261118/{row['hotel_id']}.png\"\
        \n    assert row['photo_url']==url\n    data=subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20',url],timeout=25)\n\
        \    assert digest(data)==row['photo_sha256']\n\nimport urllib.request\ncountries=json.loads('''{\"13841\": 9, \"\
        2805\": 12, \"8978\": 9, \"45152\": 9, \"1670\": 4, \"229\": 1, \"58676\": 12, \"67004\": 4, \"79279\": 9, \"36541\"\
        : 27, \"79154\": 28}''')\nfor row in media:\n    with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(row['hotel_id']),timeout=30)\
        \ as response:\n        actual=json.load(response)\n    assert actual['id']==row['hotel_id'] and actual['country']['id']==countries[str(row['hotel_id'])]\
        \ and actual['country']['id']!=11\nassert len(media)==11 and len({row['hotel_id'] for row in media})==11\nwith ThreadPoolExecutor(max_workers=6)\
        \ as pool:\n    list(pool.map(verify_photo,media))\nPY\nfor file in pub/p*/wave2-once.php; do php -l \"$file\"; done\n\
        for file in pub/guard-readonly-p*.php; do php -l \"$file\"; done\n"
    - name: Pin established SSH host continuity and authentication identity
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE']\
        \ or '')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')\nPY\nif [[ \"$KEY_VALUE\" == *\"PRIVATE\
        \ KEY\"* ]]; then\n  if [[ \"$KEY_VALUE\" == *'\\n'* ]]; then printf '%b\\n' \"$KEY_VALUE\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"\
        ; else printf '%s\\n' \"$KEY_VALUE\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse printf '%s' \"$KEY_VALUE\"\
        \ | base64 --decode > \"$RUNNER_TEMP/channel_key\"; fi\nchmod 600 \"$RUNNER_TEMP/channel_key\"\nssh-keygen -y -f \"\
        $RUNNER_TEMP/channel_key\" >/dev/null\npython3 - <<'PY'\nimport base64,hashlib,os,pathlib,subprocess\nscan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]\n\
        for s in scan.stdout.splitlines():\n    q=s.split()\n    if len(q)<3 or q[0].startswith('#'):continue\n    try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')\n\
        \    except Exception:continue\n    if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)\n\
        assert found,'HOST_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(found)+'\\n')\nprint('ESTABLISHED_HOST_PIN_VERIFIED')\nPY\n"
    - name: P117 fresh read-only admission for exactly 10 hotels
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,subprocess\nbase='repos/pyatkoff/max-search-bot'\ndef data(path):\n\
        \    return json.loads(subprocess.check_output(['gh','api',base+'/'+path],timeout=40))\nassert data('git/ref/heads/main')['object']['sha']=='bd8e248f7138ea75cb9fda2dcf44beb631c633a5'\n\
        import urllib.request\ncountries={'13841': 9, '2805': 12, '8978': 9, '45152': 9, '1670': 4, '229': 1, '58676': 12,\
        \ '67004': 4, '79279': 9, '36541': 27, '79154': 28}\nfor hotel_id in [13841, 2805, 8978, 45152, 1670, 229, 58676,\
        \ 67004, 79279, 36541]:\n    with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(hotel_id),timeout=30)\
        \ as response:\n        actual=json.load(response)\n    assert actual['id']==hotel_id and actual['country']['id']==countries[str(hotel_id)]\
        \ and actual['country']['id']!=11\nfeed=data('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')\n\
        active=[x['id'] for x in feed['workflow_runs'] if x['status'] in {'requested','queued','in_progress','waiting','pending'}]\n\
        if active:\n    raise SystemExit('Current feed owner has an active operation: '+str(active))\nPY\noptions=(-i \"$RUNNER_TEMP/channel_key\"\
        \ -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null\
        \ -o UserKnownHostsFile=\"$RUNNER_TEMP/channel_known_hosts\" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)\n\
        ssh \"${options[@]}\" \"$USER_VALUE@$HOST_VALUE\" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE\
        \ GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0;\
        \ app=/var/www/anytoour/data/www/app.anytoour.ru; test -d \"$app/.git\" && test ! -L \"$app\"; cd \"$app\"; test \"\
        $(git rev-parse HEAD)\" = bd8e248f7138ea75cb9fda2dcf44beb631c633a5; test -z \"$(git status --porcelain --untracked-files=no)\"\
        ; test ! -e /var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261118-117-v1; command -v php\
        \ >/dev/null; printf \"CURRENT_PRODUCTION_SOURCE_VERIFIED\\\\n\"' > pub/p117/preflight.txt\ngrep -Fx 'CURRENT_PRODUCTION_SOURCE_VERIFIED'\
        \ pub/p117/preflight.txt\nssh \"${options[@]}\" \"$USER_VALUE@$HOST_VALUE\" 'set -eu; cd /var/www/anytoour/data/www/app.anytoour.ru;\
        \ php' < pub/guard-readonly-p117.php > pub/p117/absence-checkpoint.json\npython3 -c 'import json; d=json.load(open(\"\
        pub/p117/absence-checkpoint.json\")); assert d[\"scope\"]==[13841,2805,8978,45152,1670,229,58676,67004,79279,36541]\
        \ and d[\"existing_native_publications\"]==d[\"db_writes\"]==d[\"provider_calls\"]==0'\n"
    - name: P117 invoke original bounded publisher ONCE; no retry
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15
        -o ServerAliveCountMax=2)

        rc=0

        ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" ''set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE
        GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru;
        php'' < pub/p117/wave2-once.php > pub/p117/original-native-output.jsonl || rc=$?

        printf ''%s\n'' "$rc" > pub/p117/original-exit.txt

        cat pub/p117/original-native-output.jsonl

        exit "$rc"

        '
    - name: P117 verify all 20 actual posts before the next original operation
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport collections,hashlib,json,pathlib\np=pathlib.Path('pub/p117')\nlines=[json.loads(l)\
