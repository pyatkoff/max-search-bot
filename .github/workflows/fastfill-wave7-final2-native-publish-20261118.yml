name: Publish44 reviewed hotels in five sequential original operations
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-wave7-final2-native-publish-20261118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '68ad0ac8b92d5ca847466c1bbf8ded58ba2faae6' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Verify44 source-bound inputs, photos, current release and countries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import io
          import json
          from pathlib import Path
          import subprocess
          import zipfile
          
          REPO = 'pyatkoff/max-search-bot'
          COMMIT = '949e286dae2ffe31a5bf4113b38060d71506194c'
          APP = 'cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          ORIGIN = '68ad0ac8b92d5ca847466c1bbf8ded58ba2faae6'
          GROUPS = json.loads('''[{"number":61,"operation":"commercial-hotel-batch-20261118-61-v1","hotel_ids":[30609,2139,59539,1083,3418,1108,103733,76819,2643,58808]},{"number":62,"operation":"commercial-hotel-batch-20261118-62-v1","hotel_ids":[77650,24940,76112,356,1000,23285,23287,28505,40880,44491]},{"number":63,"operation":"commercial-hotel-batch-20261118-63-v1","hotel_ids":[1489,2584,78929,372,1618,44669,56003,70138,1064,1111]},{"number":64,"operation":"commercial-hotel-batch-20261118-64-v1","hotel_ids":[39260,75042,67099,67048,63106,65906,104048,122841,32333,79974]},{"number":65,"operation":"commercial-hotel-batch-20261118-65-v1","hotel_ids":[2583,75800,76311,16776]}]''')
          EXPECTED = json.loads('''{"registry-receipt.json":"eb0f27dbd2b65b7848eb41b99582fcfaa8a86c047717ecd09e9c99c1e76b51ec","image-receipt.json":"51b93c5ebb70396103e23fd3cca735f4d251040816ea822084d248f2a7f7c508","p61-manifest.json":"0b870ab85b4982f4eae11da4534d74844e85a3f85a775ee5d02da76909a4c60c","p61-approval.json":"d87fdadb75a4a080a65168132a75c2e511809d978c85ffd5a3566286a9c720be","p61-publisher-unexecuted.php":"3bd1c62c7cce230e34a4b49ac2f3a5f85a795b12b473f41ed3776cbc21a335df","p62-manifest.json":"14f352686f256ab5f94577f6e71a16ed946ac90fd973ef741f6e7763cbcf05bb","p62-approval.json":"1c116f4838b45a6e56d8b00e29c6514c79f305592395632910e63cae8a62ec79","p62-publisher-unexecuted.php":"1ff9819d79886894866080690e05df3017bae389ccda13e5358fd90e3c52fa54","p63-manifest.json":"4695e5cf0b7c7482d13ea0771482d232d10ef0be539bd7810fa96f17ed5e518b","p63-approval.json":"0866e45d4b68c8498496201432c38ad1b2544847f26023b64c063501cc8a343c","p63-publisher-unexecuted.php":"725ad0daf9345a5446ab965e96828ae7ada09ceb423f1dfdb946c0e384c039dc","p64-manifest.json":"37a1e14326b22ee75e2c6ab5fe919a3b795b7cf1cf93f6a24f3bf0b325fe8c6a","p64-approval.json":"2cacf6111f0948f71a84985f20f7b9012746ada85312ce403ab49466281739ac","p64-publisher-unexecuted.php":"83a3b2616709d1716b336ef7e53f2e41518cef0155667bbed3e621b969b1a60e","p65-manifest.json":"6ce668fef837cea00ef787490098259271852125026fe445c5e761d9167b1413","p65-approval.json":"b72126816c7149cb0b82e2fd14d86e0d335a6d088c457b5938aa8b1c8008c310","p65-publisher-unexecuted.php":"aea01439f34b7f3c73cc55d5cd3bbb4b41a7e5c0bc075d5a2e52fbb4c202ba72"}''')
          
          def api(path):
              return subprocess.check_output(['gh','api',f'repos/{REPO}/{path}'],timeout=70)
          
          def info(path):
              return json.loads(api(path))
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          assert info('git/ref/heads/main')['object']['sha']==APP
          d=json.loads(base64.b64decode(info('contents/deploy_status.json?ref=diagnostics')['content']))
          release=d['repository_release']
          assert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP
          assert str(release['release']['run_id'])=='44187866614' and all(s['result']=='success' for s in release['stages'].values())
          required={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml',
                    'telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml',
                    'tour-selection-host.yml','modeled-conversion-monitor.yml'}
          gates={g['path'].rsplit('/',1)[-1]:g for g in release['closure']['gates']}
          assert required <= gates.keys()
          assert all(gates[p]['conclusion']=='success' and gates[p]['head_sha']==APP and gates[p]['run_attempt']==1 for p in required)
          
          run=info('actions/runs/44229888518')
          assert run['conclusion']=='success' and run['head_sha']==ORIGIN and run['run_attempt']==1
          a=info('actions/artifacts/14394263509')
          assert not a['expired'] and a['workflow_run']['id']==44229888518 and a['digest']=='sha256:6cbc1c9d374b05548b1be91fc3bcaf2f9203c3cdad1e1a6de16e355cf58e1776'
          raw=api('actions/artifacts/14394263509/zip')
          assert digest(raw)=='6cbc1c9d374b05548b1be91fc3bcaf2f9203c3cdad1e1a6de16e355cf58e1776'
          root=Path('pub')
          root.mkdir()
          media=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert set(archive.namelist())==set(EXPECTED)|{'source-receipt.json'}
              contents={name:archive.read(name) for name in archive.namelist()}
              assert all(digest(contents[name])==sha for name,sha in EXPECTED.items())
              assert digest(contents['source-receipt.json'])=='e1bfb07a46922ea6df063778a2ca9af1ecb4b4ef70b198d96e49549e32aa3875'
              receipt=json.loads(contents['source-receipt.json'])
              assert receipt['state']=='WAVE9_SOURCE_ACCEPTED_COVERS_STAGED'
              assert receipt['expected_app_sha']==APP and receipt['cover_commit']==COMMIT and receipt['groups']==GROUPS
              (root/'accepted-source-receipt.json').write_bytes(contents['source-receipt.json'])
              for entry in GROUPS:
                  number=entry['number']
                  directory=root/f'p{number}'
                  directory.mkdir()
                  mapping={'manifest.json':f'p{number}-manifest.json','approval.json':f'p{number}-approval.json',
                           'wave2-once.php':f'p{number}-publisher-unexecuted.php','source-receipt.json':'source-receipt.json'}
                  for name,source_name in mapping.items():
                      (directory/name).write_bytes(contents[source_name])
                  manifest=json.loads((directory/'manifest.json').read_bytes())
                  approval=json.loads((directory/'approval.json').read_bytes())
                  assert manifest['operation']==approval['operation']==entry['operation']
                  assert manifest['state']=='PREPARED_NOT_SENT' and manifest['button_text']=='✈️ Узнать стоимость тура'
                  assert approval['expected_installed_sha']==APP
                  assert approval['manifest_sha256']==digest((directory/'manifest.json').read_bytes())
                  assert manifest['photo_freeze_commit']==COMMIT
                  assert len(manifest['rows'])==len(entry['hotel_ids']) and [x['hotel_id'] for x in manifest['rows']]==approval['hotel_ids']==entry['hotel_ids']
                  media.extend(manifest['rows'])
          
          guard=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2')exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          try{
           $q=$pdo->query('SELECT v.snapshot_json FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id IN (9,10)');
           foreach($q->fetchAll(PDO::FETCH_COLUMN) as $encoded){
            $snapshot=json_decode($encoded,true,64,JSON_THROW_ON_ERROR);
            $metadata=$snapshot['metadata']??[];
            if(in_array((int)($metadata['hotel_catalog_id']??0),[30609,2139,59539,1083,3418,1108,103733,76819,2643,58808,77650,24940,76112,356,1000,23285,23287,28505,40880,44491,1489,2584,78929,372,1618,44669,56003,70138,1064,1111,39260,75042,67099,67048,63106,65906,104048,122841,32333,79974,2583,75800,76311,16776],true))exit(2);
            if(in_array((string)($metadata['logical_id']??''),['commercial-hotel-30609-v1', 'commercial-hotel-2139-v1', 'commercial-hotel-59539-v1', 'commercial-hotel-1083-v1', 'commercial-hotel-3418-v1', 'commercial-hotel-1108-v1', 'commercial-hotel-103733-v1', 'commercial-hotel-76819-v1', 'commercial-hotel-2643-v1', 'commercial-hotel-58808-v1', 'commercial-hotel-77650-v1', 'commercial-hotel-24940-v1', 'commercial-hotel-76112-v1', 'commercial-hotel-356-v1', 'commercial-hotel-1000-v1', 'commercial-hotel-23285-v1', 'commercial-hotel-23287-v1', 'commercial-hotel-28505-v1', 'commercial-hotel-40880-v1', 'commercial-hotel-44491-v1', 'commercial-hotel-1489-v1', 'commercial-hotel-2584-v1', 'commercial-hotel-78929-v1', 'commercial-hotel-372-v1', 'commercial-hotel-1618-v1', 'commercial-hotel-44669-v1', 'commercial-hotel-56003-v1', 'commercial-hotel-70138-v1', 'commercial-hotel-1064-v1', 'commercial-hotel-1111-v1', 'commercial-hotel-39260-v1', 'commercial-hotel-75042-v1', 'commercial-hotel-67099-v1', 'commercial-hotel-67048-v1', 'commercial-hotel-63106-v1', 'commercial-hotel-65906-v1', 'commercial-hotel-104048-v1', 'commercial-hotel-122841-v1', 'commercial-hotel-32333-v1', 'commercial-hotel-79974-v1', 'commercial-hotel-2583-v1', 'commercial-hotel-75800-v1', 'commercial-hotel-76311-v1', 'commercial-hotel-16776-v1'],true))exit(2);
           }
          }finally{$pdo->rollBack();}
          echo json_encode(['scope'=>[30609,2139,59539,1083,3418,1108,103733,76819,2643,58808,77650,24940,76112,356,1000,23285,23287,28505,40880,44491,1489,2584,78929,372,1618,44669,56003,70138,1064,1111,39260,75042,67099,67048,63106,65906,104048,122841,32333,79974,2583,75800,76311,16776],'existing_native_publications'=>0,'db_writes'=>0,'provider_calls'=>0],JSON_THROW_ON_ERROR),PHP_EOL;
          '''
          for group in GROUPS:
              group_ids=json.dumps(group['hotel_ids'],separators=(',',':'))
              group_logical=str(['commercial-hotel-'+str(i)+'-v1' for i in group['hotel_ids']])
              scoped=guard.replace('[30609,2139,59539,1083,3418,1108,103733,76819,2643,58808,77650,24940,76112,356,1000,23285,23287,28505,40880,44491,1489,2584,78929,372,1618,44669,56003,70138,1064,1111,39260,75042,67099,67048,63106,65906,104048,122841,32333,79974,2583,75800,76311,16776]',group_ids).replace("['commercial-hotel-30609-v1', 'commercial-hotel-2139-v1', 'commercial-hotel-59539-v1', 'commercial-hotel-1083-v1', 'commercial-hotel-3418-v1', 'commercial-hotel-1108-v1', 'commercial-hotel-103733-v1', 'commercial-hotel-76819-v1', 'commercial-hotel-2643-v1', 'commercial-hotel-58808-v1', 'commercial-hotel-77650-v1', 'commercial-hotel-24940-v1', 'commercial-hotel-76112-v1', 'commercial-hotel-356-v1', 'commercial-hotel-1000-v1', 'commercial-hotel-23285-v1', 'commercial-hotel-23287-v1', 'commercial-hotel-28505-v1', 'commercial-hotel-40880-v1', 'commercial-hotel-44491-v1', 'commercial-hotel-1489-v1', 'commercial-hotel-2584-v1', 'commercial-hotel-78929-v1', 'commercial-hotel-372-v1', 'commercial-hotel-1618-v1', 'commercial-hotel-44669-v1', 'commercial-hotel-56003-v1', 'commercial-hotel-70138-v1', 'commercial-hotel-1064-v1', 'commercial-hotel-1111-v1', 'commercial-hotel-39260-v1', 'commercial-hotel-75042-v1', 'commercial-hotel-67099-v1', 'commercial-hotel-67048-v1', 'commercial-hotel-63106-v1', 'commercial-hotel-65906-v1', 'commercial-hotel-104048-v1', 'commercial-hotel-122841-v1', 'commercial-hotel-32333-v1', 'commercial-hotel-79974-v1', 'commercial-hotel-2583-v1', 'commercial-hotel-75800-v1', 'commercial-hotel-76311-v1', 'commercial-hotel-16776-v1']",group_logical)
              (root/('guard-readonly-p'+str(group['number'])+'.php')).write_text(scoped)
          def verify_photo(row):
              url=f"https://raw.githubusercontent.com/{REPO}/{COMMIT}/.github/traffic-publish/commercial-wave9-20261118/{row['hotel_id']}.png"
              assert row['photo_url']==url
              data=subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20',url],timeout=25)
              assert digest(data)==row['photo_sha256']
          
          import urllib.request
          countries=json.loads('''{"30609": 4, "2139": 4, "59539": 9, "1083": 4, "3418": 4, "1108": 4, "103733": 1, "76819": 1, "2643": 9, "58808": 4, "77650": 4, "24940": 9, "76112": 4, "356": 1, "1000": 4, "23285": 9, "23287": 9, "28505": 4, "40880": 4, "44491": 9, "1489": 4, "2584": 9, "78929": 9, "372": 1, "1618": 4, "44669": 9, "56003": 4, "70138": 4, "1064": 4, "1111": 4, "39260": 1, "75042": 4, "67099": 9, "67048": 4, "63106": 4, "65906": 4, "104048": 1, "122841": 1, "32333": 9, "79974": 1, "2583": 9, "75800": 1, "76311": 1, "16776": 4}''')
          for row in media:
              with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(row['hotel_id']),timeout=30) as response:
                  actual=json.load(response)
              assert actual['id']==row['hotel_id'] and actual['country']['id']==countries[str(row['hotel_id'])] and actual['country']['id']!=11
          assert len(media)==44 and len({row['hotel_id'] for row in media})==44
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(verify_photo,media))
          PY
          for file in pub/p*/wave2-once.php; do php -l "$file"; done
          for file in pub/guard-readonly-p*.php; do php -l "$file"; done
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: P61 fresh read-only admission for exactly 10 hotels
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          base='repos/pyatkoff/max-search-bot'
          def data(path):
              return json.loads(subprocess.check_output(['gh','api',base+'/'+path],timeout=40))
          assert data('git/ref/heads/main')['object']['sha']=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          import urllib.request
          countries={'30609': 4, '2139': 4, '59539': 9, '1083': 4, '3418': 4, '1108': 4, '103733': 1, '76819': 1, '2643': 9, '58808': 4, '77650': 4, '24940': 9, '76112': 4, '356': 1, '1000': 4, '23285': 9, '23287': 9, '28505': 4, '40880': 4, '44491': 9, '1489': 4, '2584': 9, '78929': 9, '372': 1, '1618': 4, '44669': 9, '56003': 4, '70138': 4, '1064': 4, '1111': 4, '39260': 1, '75042': 4, '67099': 9, '67048': 4, '63106': 4, '65906': 4, '104048': 1, '122841': 1, '32333': 9, '79974': 1, '2583': 9, '75800': 1, '76311': 1, '16776': 4}
          for hotel_id in [30609, 2139, 59539, 1083, 3418, 1108, 103733, 76819, 2643, 58808]:
              with urllib.request.urlopen('https://anytoour.ru/api-v2.php?action=hotel_details&hotelId='+str(hotel_id),timeout=30) as response:
                  actual=json.load(response)
              assert actual['id']==hotel_id and actual['country']['id']==countries[str(hotel_id)] and actual['country']['id']!=11
          feed=data('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')
          active=[x['id'] for x in feed['workflow_runs'] if x['status'] in {'requested','queued','in_progress','waiting','pending'}]
          if active:
              raise SystemExit('Current feed owner has an active operation: '+str(active))
          PY
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0; app=/var/www/anytoour/data/www/app.anytoour.ru; test -d "$app/.git" && test ! -L "$app"; cd "$app"; test "$(git rev-parse HEAD)" = cc017ee5bb669f4c7c13efc91d5c5812a50e55f2; test -z "$(git status --porcelain --untracked-files=no)"; test ! -e /var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261118-61-v1; command -v php >/dev/null; printf "CURRENT_PRODUCTION_SOURCE_VERIFIED\\n"' > pub/p61/preflight.txt
          grep -Fx 'CURRENT_PRODUCTION_SOURCE_VERIFIED' pub/p61/preflight.txt
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/guard-readonly-p61.php > pub/p61/absence-checkpoint.json
          python3 -c 'import json; d=json.load(open("pub/p61/absence-checkpoint.json")); assert d["scope"]==[30609,2139,59539,1083,3418,1108,103733,76819,2643,58808] and d["existing_native_publications"]==d["db_writes"]==d["provider_calls"]==0'
      - name: P61 invoke original bounded publisher ONCE; no retry
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          rc=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/p61/wave2-once.php > pub/p61/original-native-output.jsonl || rc=$?
          printf '%s\n' "$rc" > pub/p61/original-exit.txt
          cat pub/p61/original-native-output.jsonl
          exit "$rc"
      - name: P61 verify all 20 actual posts before the next original operation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,pathlib
          p=pathlib.Path('pub/p61')
