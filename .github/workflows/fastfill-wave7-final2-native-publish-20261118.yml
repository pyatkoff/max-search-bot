        for b in rec['groups']:\n    p=root/('p'+str(b['number']));r=json.loads((p/'terminal-verified.json').read_bytes())\n\
        \    assert r['unique_new_hotels']==len(b['hotel_ids']) and r['operation']==b['operation']\n    assert r['original_output_sha256']==hashlib.sha256((p/'original-native-output.jsonl').read_bytes()).hexdigest()\n\
        \    posts+=r['posts'];operations.append({k:r[k] for k in ['operation','unique_new_hotels','original_output_sha256']})\n\
        assert len(posts)==70 and len(set(p['post_url'] for p in posts))==70 and len(set(p['hotel_id'] for p in posts))==35\n\
        out={'state':'WAVE17_PAIRED_HOTELS_70_POSTS_NATIVE_VERIFIED','unique_new_hotels':35,'telegram':35,'max':35,'paired_total_before':1579,'paired_total_after':1614,'feed_rows_added':0,'operations':operations,'posts':posts}\n\
        (root/'wave17-native-verified.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\\n')\nprint('FINAL2_NATIVE_VERIFIED_JSON\
        \ '+json.dumps({k:v for k,v in out.items() if k!='posts'},separators=(',',':')))\nPY\n"
    - name: Preserve final logical batch receipt
