name: Publish49 reviewed hotels in five sequential original operations
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-wave7-final2-native-publish-20261118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '728590b7c04d2eead9b8e5c60b2339de3b251f4f' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Verify49 source-bound inputs, photos, current release and countries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import io
          import json
          from pathlib import Path
          import subprocess
          import zipfile
          
          REPO = 'pyatkoff/max-search-bot'
          COMMIT = 'e7892329c8e5fb11ccdc5d4fe65d6d73b24c6ced'
          APP = 'cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          ORIGIN = '728590b7c04d2eead9b8e5c60b2339de3b251f4f'
          GROUPS = json.loads('''[{"number":66,"operation":"commercial-hotel-batch-20261118-66-v1","hotel_ids":[35174,64061,78938,2921,2437,2462,11749,11774,11786,11802]},{"number":67,"operation":"commercial-hotel-batch-20261118-67-v1","hotel_ids":[56078,64360,11743,2483,11744,11788,11794,51240,2477,57802]},{"number":68,"operation":"commercial-hotel-batch-20261118-68-v1","hotel_ids":[5399,11832,46068,15799,82676,122961,64124,71388,79690,126132]},{"number":69,"operation":"commercial-hotel-batch-20261118-69-v1","hotel_ids":[11781,58743,60233,64955,109335,2424,2429,60231,2803,2826]},{"number":70,"operation":"commercial-hotel-batch-20261118-70-v1","hotel_ids":[11765,11773,11873,43238,43701,45544,2433,11770,11742]}]''')
          EXPECTED = json.loads('''{"registry-receipt.json":"abb2f4677433009ce5e2023d3d9b27cdc2190f759af267bdb9152e5162e907c7","image-receipt.json":"51205dd4c98fbfbeec50b079d8d211f9187bff7870cd032e84a4af77370a3a7d","p66-manifest.json":"8748943f6a9f1cbc83e0ba2b7e9cf47e7a76ba3a45220c5828503dd3b804e97d","p66-approval.json":"c5661a01ddd59bdf632baa6a9912738b6a2c3cc1a7a726b8dc0b693e0dab6524","p66-publisher-unexecuted.php":"a3dc0640b804b4ac16e7fb8578625b75a6d903223b479091848493988a076973","p67-manifest.json":"95a85e137582efe918064bef3eb94b20cfc4b848238011aa3c5f7af6b2668022","p67-approval.json":"0d25a268e6ebfd871e08a1d69660b3c7c0c8f58a4134f60d0515c07e230a5a40","p67-publisher-unexecuted.php":"2d9a10990f9785e716ee20fa5955327006bd4806011c4e855268cf14d77ab74e","p68-manifest.json":"c02e88667bc5d169ce2c794fc451e89dcb9a37ee2b629bcfd5e4ef3d1a6bc076","p68-approval.json":"e72840a9d186d18f3766c294c7c01612722f1a30d78fb064c4e5b14db9c40791","p68-publisher-unexecuted.php":"6856e90fb90535a034f4a65781855ec96fdfb072e5fde1f640dc906982de009a","p69-manifest.json":"31acb664409bd99dd5684a5145cae2b92a5cdc8e1ccac321800ded7e0163c3f4","p69-approval.json":"7713627d313773fb3da001128681a3bdcadbf9830c7181f2dc5f65dee90658ec","p69-publisher-unexecuted.php":"5216342f77e8238185b57ec171319ed308738dc713324b33a9f9dea73e1c6f52","p70-manifest.json":"de5f04e5a5ddd83154dbf086d068cce5ef3c6b4c193b45eb9ddd1426c5e3a709","p70-approval.json":"b0caa9e39e25b508f147f9319d7dda6bbeb5c237a675997a3653a52d1412a64b","p70-publisher-unexecuted.php":"808df644b17074306aae4fecf8c986eb758647c2586a933f31bd33b95f684e8a"}''')
          
          def api(path):
              return subprocess.check_output(['gh','api',f'repos/{REPO}/{path}'],timeout=70)
          
          def info(path):
              return json.loads(api(path))
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          assert info('git/ref/heads/main')['object']['sha']==APP
          d=json.loads(base64.b64decode(info('contents/deploy_status.json?ref=diagnostics')['content']))
          release=d['repository_release']
          assert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP
          assert str(release['release']['run_id'])=='44187866614' and all(s['result']=='success' for s in release['stages'].values())
          required={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml',
                    'telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml',
                    'tour-selection-host.yml','modeled-conversion-monitor.yml'}
          gates={g['path'].rsplit('/',1)[-1]:g for g in release['closure']['gates']}
          assert required <= gates.keys()
          assert all(gates[p]['conclusion']=='success' and gates[p]['head_sha']==APP and gates[p]['run_attempt']==1 for p in required)
          
          run=info('actions/runs/44275055053')
          assert run['conclusion']=='success' and run['head_sha']==ORIGIN and run['run_attempt']==1
          a=info('actions/artifacts/14414087565')
          assert not a['expired'] and a['workflow_run']['id']==44275055053 and a['digest']=='sha256:0d35aaa0c7cfa6cc5d5ca1292aed7adf164252ffad234d8bb55e147063932738'
          raw=api('actions/artifacts/14414087565/zip')
          assert digest(raw)=='0d35aaa0c7cfa6cc5d5ca1292aed7adf164252ffad234d8bb55e147063932738'
          root=Path('pub')
          root.mkdir()
          media=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert set(archive.namelist())==set(EXPECTED)|{'source-receipt.json'}
              contents={name:archive.read(name) for name in archive.namelist()}
              assert all(digest(contents[name])==sha for name,sha in EXPECTED.items())
              assert digest(contents['source-receipt.json'])=='2be85763633155f9bd270639ffc041676bec8a66fa8e412d20bf20ed8b509820'
              receipt=json.loads(contents['source-receipt.json'])
              assert receipt['state']=='WAVE10_SOURCE_ACCEPTED_COVERS_STAGED'
              assert receipt['expected_app_sha']==APP and receipt['cover_commit']==COMMIT and receipt['groups']==GROUPS
              (root/'accepted-source-receipt.json').write_bytes(contents['source-receipt.json'])
              for entry in GROUPS:
                  number=entry['number']
                  directory=root/f'p{number}'
                  directory.mkdir()
                  mapping={'manifest.json':f'p{number}-manifest.json','approval.json':f'p{number}-approval.json',
                           'wave2-once.php':f'p{number}-publisher-unexecuted.php','source-receipt.json':'source-receipt.json'}
                  for name,source_name in mapping.items():
                      (directory/name).write_bytes(contents[source_name])
