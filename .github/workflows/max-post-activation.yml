name: Read owner test MAX post entry
on:
  push:
    branches: [test/max-post-activation-20261014]
    paths:
      - .github/workflows/max-post-activation.yml
      - tools/channel_post_activation.php
permissions:
  contents: read
concurrency:
  group: max-post-channel-owner-activation-20261014
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/test/max-post-activation-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check scoped readback script
        run: php -l tools/channel_post_activation.php
      - name: Verify authoritative application main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)
          test "$current" = a0d7988398a7cf3413a1352c9624a91bc7586859
      - name: Prepare established SSH key
        env:
          ACTIVATION_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/activation_key"
          raw="$ACTIVATION_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 1
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Verify actual post button and native entry
        env:
          ACTIVATION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          ACTIVATION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$ACTIVATION_USER@$ACTIVATION_HOST"
          opts=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/activation_key")
          remote_tmp=''
          cleanup() {
            if [[ "$remote_tmp" =~ ^/tmp/channel-post-activation\.[A-Za-z0-9]+$ ]]; then ssh "${opts[@]}" "$remote" "rm -rf -- '$remote_tmp'" >/dev/null 2>&1 || true; fi
            rm -f "$RUNNER_TEMP/activation_key"
          }
          trap cleanup EXIT
          remote_tmp=$(ssh "${opts[@]}" "$remote" 'umask 077; mktemp -d /tmp/channel-post-activation.XXXXXXXX')
          [[ "$remote_tmp" =~ ^/tmp/channel-post-activation\.[A-Za-z0-9]+$ ]] || exit 1
          scp -q "${opts[@]}" tools/channel_post_activation.php "$remote:$remote_tmp/readback.php"
          ssh "${opts[@]}" "$remote" "php '$remote_tmp/readback.php' --expected-sha=a0d7988398a7cf3413a1352c9624a91bc7586859 --require-enabled"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            cd /var/www/anytoour/data/www/app.anytoour.ru
            test "$(git rev-parse HEAD)" = a0d7988398a7cf3413a1352c9624a91bc7586859
            git diff --quiet && git diff --cached --quiet
            opdir=/var/www/anytoour/data/channel-post-operations
            CHANNEL_POST_WEBHOOK_STATE_DIR="$opdir/webhook" php tools/channel_post_webhook_updates.php max --reconcile
            php tools/channel_post_worker.php --platform=max
          '
      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/activation_key"
