name: Read PR1702 vhost response evidence and two local offers
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/read-1664-serving-host-listeners.yml]
permissions: {}
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read bounded vhost counts and two loopback offers
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$USER_VALUE@$HOST_VALUE" 'timeout 115s env PYTHONDONTWRITEBYTECODE=1 python3 -' <<'REMOTE'
          import collections
          import datetime as dt
          import hashlib
          import http.client
          import json
          import os
          import re
          import shlex
          import stat
          import subprocess
          import time
          
          APP = '/var/www/anytoour/data/www/app.anytoour.ru'
          HOST = 'app.anytoour.ru'
          SHA = '32155b9eb2c8606b61554951bfdc988d70bbcb39'
          LOGS = {key: '/var/www/httpd-logs/'+HOST+'.'+key+'.log' for key in ('access','error')}
          VHOST = '/etc/nginx/vhosts/anytoour/'+HOST+'.conf'
          NGINX = '/etc/nginx/nginx.conf'
          WINDOWS = {'installation': ('14:51:45','14:53:15'), 'preflight': ('14:57:05','14:58:35'), 'root_head': ('15:02:30','15:04:00')}
          def emit(kind, **values):
              print(json.dumps({'kind':kind, **values}, sort_keys=True), flush=True)
          def git(*args):
              return subprocess.run(['git','--no-optional-locks','-C',APP,*args],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=10)
          def guard():
              head = git('rev-parse','HEAD')
              if head.returncode or head.stdout.decode().strip() != SHA:
                  raise SystemExit('checkout_changed')
              clean = []
              for options in ([], ['--cached']):
                  result = git('diff','--quiet','--no-ext-diff','--no-textconv',*options)
                  clean.append({0:'clean',1:'dirty'}.get(result.returncode,'unknown'))
              return clean
          def read(path, limit, tail=False):
              if path not in [*LOGS.values(),VHOST,NGINX]:
                  raise ValueError('outside_scope')
              try:
                  real = os.path.realpath(path)
                  if real != path and (path in LOGS.values() or not real.startswith('/etc/nginx/')):
                      return '', 'different_path'
                  fd = os.open(real,os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW)
                  with os.fdopen(fd,'rb') as f:
                      meta = os.fstat(f.fileno())
                      if not stat.S_ISREG(meta.st_mode):
                          return '', 'not_regular'
                      if meta.st_size>limit and not tail:
                          return '', 'size_limit'
                      offset=max(0,meta.st_size-limit)
                      f.seek(offset)
                      if offset: f.readline(limit)
                      return f.read(limit).decode('utf-8','replace'), 'read'
              except (OSError,ValueError) as e:
                  return '',type(e).__name__
          def stamp(line):
              matched = re.search(r'\[(\d{2}/[A-Za-z]{3}/\d{4}:\d\d:\d\d:\d\d [+-]\d{4})\]',line)
              if matched:
                  return dt.datetime.strptime(matched[1],'%d/%b/%Y:%H:%M:%S %z').astimezone(dt.timezone.utc)
              matched = re.search(r'\b(\d{4}/\d\d/\d\d \d\d:\d\d:\d\d)\b',line)
              if matched:
                  return dt.datetime.strptime(matched[1],'%Y/%m/%d %H:%M:%S').astimezone(dt.timezone.utc)
              matched=re.search(r'\[([A-Za-z]{3} [A-Za-z]{3}\s+\d{1,2} \d\d:\d\d:\d\d)(?:\.\d+)? (\d{4})\]',line)
              if matched:
                  return dt.datetime.strptime(matched[1]+' '+matched[2],'%a %b %d %H:%M:%S %Y').astimezone(dt.timezone.utc)
              return None
          def configured_fields():
              site, status=read(VHOST,131072)
              declarations = re.findall(r'(?m)^\s*access_log\s+([^;]+);',site)
              names=set()
              for declaration in declarations:
                  parts=shlex.split(declaration)
                  if parts and parts[0]==LOGS['access']:
                      names.add(parts[1] if len(parts)>1 and '=' not in parts[1] else 'combined')
              all_conf, config_status=read(NGINX,131072)
              known={}; flags={}
              for name in names:
                  if name=='combined':
                      flags['combined']=[]
                      continue
                  if not re.fullmatch(r'[a-zA-Z0-9_]+',name): continue
                  declaration=re.search(r'(?ms)^\s*log_format\s+'+re.escape(name)+r'\s+(.+?);',all_conf)
                  if not declaration:
                      flags['unresolved_custom']=[];continue
                  fmt=''.join(x for x in shlex.split(declaration[1]) if not x.startswith('escape='))
                  fields=re.findall(r'\$(\w+)',fmt)
                  durations=[k for k in ('request_time','upstream_connect_time','upstream_header_time','upstream_response_time') if k in fields]
                  flags['custom']=durations
                  parts=re.split(r'(\$\w+)',fmt)
                  seen=set();pattern=[]
                  for part in parts:
                      field=part[1:]
                      if part.startswith('$'):
                          pattern.append('(?P<'+field+'>.*?)' if field not in seen else '.*?')
                          seen.add(field)
                      else:
                          pattern.append(re.escape(part))
                  if durations and 'request' in fields and 'status' in fields:
                      known[name]=(re.compile('^'+''.join(pattern)+'$'),durations)
              emit('vhost_log_format',vhost_state=status,global_format_state=config_status,format_metadata=flags)
              return known
          def log_view():
              known=configured_fields()
              patterns={
                  'upstream_header_timeout':r'upstream timed out.*reading response header',
                  'upstream_connect_timeout':r'upstream timed out.*connecting to upstream',
                  'upstream_refusal':r'connect\(\).*failed.*(?:refused|111)|failed to make connection to backend|AH00957',
                  'upstream_no_live':r'no live upstreams','upstream_closed':r'upstream prematurely closed|failed to read FastCGI header',
                  'apache_capacity':r'reached MaxRequestWorkers|MaxRequestWorkers setting|scoreboard is full|AH00161|AH00484',
                  'fpm_capacity':r'reached pm\.max_children|seems busy.*spawning','nginx_capacity':r'worker_connections are not enough',
                  'fcgid_capacity':r'fcgid.*(?:process slot|MaxProcesses|spawn.*fail|busy timeout)'}
              for kind,path in LOGS.items():
                  raw,state=read(path,4194304,True)
                  counts=collections.Counter();times=collections.defaultdict(list)
                  first=None;last=None
                  for line in raw.splitlines():
                      try: at=stamp(line)
                      except ValueError: continue
                      if not at: continue
                      first=at if first is None else min(first,at);last=at if last is None else max(last,at)
                      if at.strftime('%Y-%m-%d')!='2026-11-24': continue
                      windows=[w for w,(lo,hi) in WINDOWS.items() if lo<=at.strftime('%H:%M:%S')<=hi]
                      if not windows: continue
                      for w in windows:
                          counts[w+'.lines']+=1
                          if kind=='error':
                              prefix=re.split(r',\s*(?:client|server|request|upstream|host|referrer):|, referer:|\sreferer:',line,maxsplit=1)[0]
                              for label,pat in patterns.items():
                                  if re.search(pat,prefix,re.I): counts[w+'.'+label]+=1
                              continue
                          req=re.search(r'"HEAD (/(?:structured_events\.log)?) HTTP/[0-9.]+"\s+(\d{3})',line)
                          if not req: continue
                          category='root' if req[1]=='/' else 'guard'
                          key=w+'.'+category+'.http'+req[2];counts[key]+=1
                          for regex,fields in known.values():
                              m=regex.fullmatch(line)
                              if not m or m['status']!=req[2] or m['request']!='HEAD '+req[1]+' HTTP/'+m['request'].rsplit('/',1)[-1]: continue
                              for field in fields:
                                  timing=m[field]
                                  if re.fullmatch(r'\d{1,6}(?:\.\d{1,6})?',timing):
                                      times[key+'.'+field].append(float(timing))
                  emit('window_totals',log_kind=kind,state=state,coverage_begin=first.isoformat() if first else None,coverage_end=last.isoformat() if last else None,counters=dict(counts),timing_summaries={k:{'n':len(v),'min':min(v),'max':max(v)} for k,v in times.items()},raw_lines=0)
          def offer(hotel, target):
              conn=http.client.HTTPConnection('127.0.0.1',80,timeout=8)
              begin=time.monotonic()
              try:
                  code='tg_'+str(hotel)
                  conn.request('GET','/hotel-posts-telegram-main19.php?offer='+code,headers={'Host':HOST,'Accept':'application/json','Connection':'close'})
                  r=conn.getresponse();first_byte=time.monotonic()-begin
                  body=r.read(65537);value={}
                  if len(body)<=65536:
                      try: decoded=json.loads(body);value=decoded if isinstance(decoded,dict) else {}
                      except (ValueError,UnicodeDecodeError): pass
                  cache=r.getheader('Cache-Control','').lower()
                  directives=[p.strip() for p in cache.split(',') if re.fullmatch(r'(?:public|private|no-store|no-cache|must-revalidate|(?:s-)?max-age=\d{1,8})',p.strip())]
                  age=r.getheader('Age','')
                  emit('loopback_offer',hotel=hotel,http=r.status,first_byte_seconds=round(first_byte,6),total_seconds=round(time.monotonic()-begin,6),expected_post=target,expected_post_matches=value.get('post_url')=='https://t.me/anytour/'+str(target),offer_matches=value.get('offer_id')==code,cache_control=directives,age_seconds=int(age) if age.isdigit() and len(age)<=8 else None)
              except (OSError,http.client.HTTPException) as exc:
                  emit('loopback_offer',hotel=hotel,error=type(exc).__name__,total_seconds=round(time.monotonic()-begin,6))
              finally:
                  conn.close()
          emit('checkout',sha=SHA,worktree_index=guard())
          log_view()
          offer(64918,1020)
          offer(996,1063)
          emit('finished',sha=SHA,worktree_index=guard(),public_requests=0)
          REMOTE
      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"

