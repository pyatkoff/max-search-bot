name: Read only forecast reader failure diagnosis
on:
  push:
    branches: [ops/forecast-reader-diagnosis-20261106-b6da9d5]
    paths: [.github/workflows/forecast-reader-diagnosis-20261106-b6da9d5.yml]
permissions:
  contents: read
concurrency:
  group: anytour-private-archive-predictive-study
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/forecast-reader-diagnosis-20261106-b6da9d5' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the one purpose source envelope
        env:
          API_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: b6da9d558d10078e630073d015114ec76fa6d7ad
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess,urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL)
          try:
              expected=os.environ['ACCEPTED_MAIN_SHA']
              head=os.environ['GITHUB_SHA']
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              assert len(expected)==40 and all(c in '0123456789abcdef' for c in expected)
              assert event['repository']['full_name']=='pyatkoff/max-search-bot'
              assert event['ref']=='refs/heads/ops/forecast-reader-diagnosis-20261106-b6da9d5'
              assert event['before']==expected and event['after']==head
              assert not event.get('forced') and not event.get('deleted')
              assert git('rev-parse','HEAD').decode().strip()==head
              assert git('rev-list','--parents','-n','1',head).decode().split()==[head,expected]
              changed=git('diff','--name-status',expected,head).decode()
              assert changed=='A\t.github/workflows/forecast-reader-diagnosis-20261106-b6da9d5.yml\n'
              request=urllib.request.Request(
                  'https://api.github.com/repos/pyatkoff/max-search-bot/git/ref/heads/main',
                  headers={'Authorization':'Bearer '+os.environ['API_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert json.load(response)['object']['sha']==expected
              paths=["services/ModeledConversionForecastStatusReader.php","services/ModeledConversionStatusBudget.php","services/ModeledConversionStatusMcpAdapter.php","services/ManagerPreparationMcpService.php","services/ManagerPreparationOAuth.php","services/ProjectAccessService.php","services/ModeledConversionDealValue.php"]
              hashes={}
              for name in paths:
                  source=git('show',expected+':'+name)
                  path=pathlib.Path(name)
                  assert stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
                  assert path.read_bytes()==source
                  hashes[name]=hashlib.sha256(source).hexdigest()
              destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-source.json'
              destination.write_text(json.dumps({'source_commit':expected,'hashes':hashes},separators=(',',':')))
              destination.chmod(0o600)
          except Exception:
              print('{"ok":false,"source_envelope_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"source_envelope_verified":true}')
          PY
      - name: Prepare the existing identity and strict canonical host pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,re,socket,subprocess
          try:
              host=os.environ['TARGET']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host)
              assert {a[4][0] for a in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}=={'5.45.122.54'}
              key=os.environ['K']
              raw=key.replace('\\n','\n').replace('\r','').encode() if 'PRIVATE KEY' in key else base64.b64decode(key,validate=True)
              keypath=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-key'
              keypath.write_bytes(raw.rstrip(b'\n')+b'\n')
              keypath.chmod(0o600)
              check=subprocess.run(['ssh-keygen','-y','-f',str(keypath)],capture_output=True,timeout=10)
              assert check.returncode==0
              approved=set()
              for attempt in range(2):
                  try:
                      scan=subprocess.run(['ssh-keyscan','-t','ed25519','-T','10',host],capture_output=True,text=True,timeout=30)
                      lines=scan.stdout.splitlines()
                  except subprocess.TimeoutExpired as error:
                      output=error.stdout or b''
                      lines=(output.decode(errors='replace') if isinstance(output,bytes) else output).splitlines()
                  for line in lines:
                      fields=line.split()
                      if len(fields)!=3 or fields[1]!='ssh-ed25519':continue
                      try:
                          material=base64.b64decode(fields[2],validate=True)
                      except ValueError:continue
                      fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(material).digest()).decode().rstrip('=')
                      if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':
                          approved.add(host+' ssh-ed25519 '+fields[2])
                  if approved:break
              assert len(approved)==1
              known=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-hosts'
              known.write_text('\n'.join(sorted(approved))+'\n')
              known.chmod(0o600)
          except Exception:
              print('{"ok":false,"canonical_host_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"canonical_host_verified":true}')
          PY
      - name: Perform the finite build with a technical receipt
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_ACCOUNT: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,re,socket,subprocess
          try:
              host=os.environ['TARGET']
              account=os.environ['SSH_ACCOUNT']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host)
              assert re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}',account)
              assert {a[4][0] for a in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}=={'5.45.122.54'}
              temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
              contract=json.loads((temporary/'study-source.json').read_text())
              remote_header='CONTRACT='+repr(contract)+'\nRUN_ID="readonly-budget-diagnosis"\n'
              remote_body=r"""
          import hashlib,json,os,pathlib,stat,subprocess,sys
          receipt={'ok':False,'operator_verified':False,'source_verified':False,'reader_completed':False,'response_within_cap':False,'byte_limit':False,'time_limit':False,'database_read_only':False,'reason':'none','stage':'operator','error_type':'none','error_file':'none','error_line':0}
          def verify_source(root):
              environment=dict(os.environ)
              environment['GIT_OPTIONAL_LOCKS']='0'
              head=subprocess.check_output(['/usr/bin/git','-C',str(root),'rev-parse','HEAD'],
                                           stderr=subprocess.DEVNULL,timeout=10,env=environment).decode().strip()
              assert head==CONTRACT['source_commit']
              for arguments in (['diff','--quiet','HEAD'],['diff','--cached','--quiet']):
                  subprocess.run(['/usr/bin/git','-C',str(root),*arguments],stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL,timeout=10,check=True,env=environment)
              for name,digest in CONTRACT['hashes'].items():
                  path=root/name
                  assert path.resolve()==path and stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          try:
              root=pathlib.Path('/var/www/anytoour/data/www/app.anytoour.ru')
              assert root.resolve()==root and root.stat().st_uid==1012 and os.geteuid()==1012
              receipt['operator_verified']=True
              verify_source(root)
              receipt['source_verified']=True
              php="<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');ini_set('log_errors','0');error_reporting(0);\n$level=ob_get_level();ob_start(static fn(string $x):string=>'');\n$out=['ok'=>false,'reader_completed'=>false,'response_within_cap'=>false,'byte_limit'=>false,'time_limit'=>false,'database_read_only'=>false,'reason'=>'none','stage'=>'bootstrap','error_type'=>'none','error_file'=>'none','error_line'=>0];\ntry{\n require '/var/www/anytoour/data/www/app.anytoour.ru/config.php';\n require_once '/var/www/anytoour/data/www/app.anytoour.ru/services/ProjectAccessService.php';\n require_once '/var/www/anytoour/data/www/app.anytoour.ru/services/ModeledConversionForecastStatusReader.php';\n if(posix_geteuid()!==1012||ProjectConfig::projectId()!=='anytour')throw new RuntimeException();\n ProjectAccessService::initializeReadOnly();\n $pdo=ConversationDb::connection();\n $pdo->exec('SET SESSION TRANSACTION READ ONLY');$out['database_read_only']=true;\n $auth=static function():void{if(posix_geteuid()!==1012||ProjectConfig::projectId()!=='anytour')throw new DomainException();};\n $budget=new ModeledConversionStatusBudget();\n $out['stage']='reader';\n $result=(new ModeledConversionForecastStatusReader($pdo,$auth,$budget))->read();\n $out['reader_completed']=true;\n $out['response_within_cap']=strlen(json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR))<=30000;\n $out['stage']='complete';$out['ok']=true;\n}catch(ModeledConversionStatusLimit $e){\n $out['byte_limit']=$e->reason==='byte_limit';$out['time_limit']=$e->reason==='time_limit';\n $out['reason']=in_array($e->reason,['byte_limit','time_limit'],true)?$e->reason:'unknown';\n $stages=['ModeledConversionForecastStatusReader'=>'forecast','ModeledConversionValueDeliveryReader'=>'value_delivery','ModeledConversionInputDiagnosisReader'=>'input_diagnosis','ModeledConversionLatencyReader'=>'latency','ModeledConversionDailyDeliveryReader'=>'daily_delivery','ModeledConversionTelegramLinkageReader'=>'telegram_linkage','ModeledConversionDeliveryHealth'=>'monitor'];\n foreach($e->getTrace()as$frame){$c=$frame['class']??'';if(isset($stages[$c])){$out['stage']=$stages[$c];break;}}\n $out['ok']=true;\n}catch(Throwable $e){$out['reason']='read_failed';$out['ok']=true;$classes=['Error','TypeError','ValueError','PDOException','RuntimeException','InvalidArgumentException','DomainException'];$type=get_class($e);$out['error_type']=in_array($type,$classes,true)?$type:'other';$file=substr($e->getFile(),strlen('/var/www/anytoour/data/www/app.anytoour.ru/'));$out['error_file']=preg_match('~\\\\A(?:services|manager/lib)/[A-Za-z0-9_]+[.]php\\\\z~D',$file)===1?$file:'other';$out['error_line']=$e->getLine();}\nwhile(ob_get_level()>$level)ob_end_clean();\necho json_encode($out,JSON_THROW_ON_ERROR).\"\\n\";\n"
              process=subprocess.run(['/usr/bin/php','-d','auto_prepend_file=','-d','auto_append_file=','-d','opcache.enable_cli=0','-d','display_errors=0','-d','log_errors=0'],input=php.encode(),capture_output=True,timeout=30)
              assert len(process.stdout)<=8192 and len(process.stderr)<=8192
              proof=json.loads(process.stdout)
              assert set(proof)=={'ok','reader_completed','response_within_cap','byte_limit','time_limit','database_read_only','reason','stage','error_type','error_file','error_line'}
              assert all(isinstance(v,bool) for k,v in proof.items() if k not in ('reason','stage','error_type','error_file','error_line'))
              assert proof['reason'] in ['none','byte_limit','time_limit','unknown','read_failed']
              assert proof['stage'] in ['bootstrap','reader','forecast','value_delivery','input_diagnosis','latency','daily_delivery','telegram_linkage','monitor','complete']
              assert proof['error_type'] in ['none','Error','TypeError','ValueError','PDOException','RuntimeException','InvalidArgumentException','DomainException','other']
              assert proof['error_file']=='none' or proof['error_file']=='other' or re.fullmatch(r'(?:services|manager/lib)/[A-Za-z0-9_]+[.]php',proof['error_file'])
              assert isinstance(proof['error_line'],int) and 0<=proof['error_line']<=100000
              receipt.update(proof)
              verify_source(root)
          except Exception:
              receipt['ok']=False
          print(json.dumps(receipt,separators=(',',':')))
          sys.exit(0 if receipt['ok'] else 1)
          """
              command=['ssh','-i',str(temporary/'study-key'),
                       '-o','BatchMode=yes','-o','IdentitiesOnly=yes',
                       '-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(temporary/'study-hosts'),
                       '-o','HostKeyAlgorithms=ssh-ed25519','-o','ConnectTimeout=10',
                       '-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3',
                       account+'@'+host,'/usr/bin/python3 -I -B -']
              result=subprocess.run(command,input=(remote_header+remote_body).encode(),
                                    capture_output=True,timeout=120)
              assert len(result.stdout)<=8192 and len(result.stderr)<=8192
              proof=json.loads(result.stdout)
              keys=set(["ok","operator_verified","source_verified","reader_completed","response_within_cap","byte_limit","time_limit","database_read_only","reason","stage","error_type","error_file","error_line"])
              assert isinstance(proof,dict) and set(proof)==keys and all(isinstance(v,bool) for k,v in proof.items() if k not in ('reason','stage','error_type','error_file','error_line'))
              assert proof['reason'] in ['none','byte_limit','time_limit','unknown','read_failed']
              assert proof['stage'] in ['operator','bootstrap','reader','forecast','value_delivery','input_diagnosis','latency','daily_delivery','telegram_linkage','monitor','complete']
              print(json.dumps(proof,separators=(',',':')))
              raise SystemExit(0 if result.returncode==0 and proof['ok'] else 1)
          except Exception:
              print('{"ok":false,"technical_receipt_verified":false}')
              raise SystemExit(1)
          PY
      - name: Remove runner credentials and temporary technical files
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('study-key','study-hosts','study-source.json'):
              (temporary/name).unlink(missing_ok=True)
          print('{"ok":true,"runner_credentials_removed":true}')
          PY
