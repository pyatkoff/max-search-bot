пуск, а песчаный пляж находится примерно в 50 метрах через дорогу.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4076","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4076"],"photo_blob_sha":"2e97e9d909c3bba0c6be2fe97522ae9ae697ba49"},{"hotel_id":4077,"hotel":"Six Senses Ninh Van Bay","aliases":["Six Senses Ninh Van Bay","SIX SENSES NINH VAN BAY"],"text":"✈️ Туры в Six Senses Ninh Van Bay\n📍 Нячанг, Вьетнам.\n\nУединённая бухта Нинь Ван для красивого отпуска среди тропической природы. Виллы с бассейнами, песчаный пляж, рестораны и спа; в курорт добираются на катере.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4077","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=4077"],"photo_blob_sha":"665a86defe706732a7c15a8ff26881959247325c"},{"hotel_id":131884,"hotel":"Courtyard by Marriott Danang Han River","aliases":["Courtyard by Marriott Danang Han River","COURTYARD BY MARRIOTT DANANG HAN RIVER"],"text":"✈️ Туры в Courtyard by Marriott Danang Han River\n📍 Дананг, Вьетнам.\n\nДананг на берегу реки Хан с бассейном, рестораном и баром на крыше. Морские дни можно чередовать с городскими прогулками: до пляжа Ми Кхе около трёх километров.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=131884","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=131884"],"photo_blob_sha":"c3ce84254d7f174f19901b375c255656a72241e9"},{"hotel_id":70778,"hotel":"Vinpearl Sealink Nha Trang","aliases":["Vinpearl Sealink Nha Trang","VINPEARL SEALINK NHA TRANG"],"text":"✈️ Туры в Vinpearl Sealink Nha Trang\n📍 Нячанг, Вьетнам.\n\nОстров Хон Тре для семейного отпуска у собственного песчаного пляжа. Есть просторные виллы с двумя и тремя спальнями, бассейн и ресторан; островной отдых легко дополнить поездками по заливу.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=70778","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=70778"],"photo_blob_sha":"fe429bbdb28363f735909bdd433865485a9f46cd"},{"hotel_id":126417,"hotel":"Radisson RED Danang","aliases":["Radisson RED Danang","RADISSON RED DANANG HOTEL"],"text":"✈️ Туры в Radisson RED Danang\n📍 Дананг, Вьетнам.\n\nЯркий Дананг с современными номерами, бассейном и баром на крыше. Ресторан и спа дополняют отпуск, а песчаный пляж находится примерно в 50 метрах через дорогу.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=126417","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=126417"],"photo_blob_sha":"0569acbe4abbdce26fac595a7268d9521bd3d815"},{"hotel_id":52256,"hotel":"Pullman Vung Tau","aliases":["Pullman Vung Tau","PULLMAN VUNG TAU"],"text":"✈️ Туры в Pullman Vung Tau\n📍 Вунг Тау, Вьетнам.\n\nСовременный Вунгтау для выходных на побережье или неспешного городского отпуска. Бассейн, рестораны, спа и просторные зоны отдыха помогают переключиться после прогулок и поездок.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=52256","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=52256"],"photo_blob_sha":"5c845de374871e79f265407b37219508f1ca2e91"},{"hotel_id":65253,"hotel":"Vinpearl Wonderworld Phu Quoc","aliases":["Vinpearl Wonderworld Phu Quoc","VINPEARL WONDERWORLD PHU QUOC","VINPEARL DISCOVERY 1"],"text":"✈️ Туры в Vinpearl Wonderworld Phu Quoc\n📍 Фукуок, Вьетнам.\n\nПросторные виллы с двумя, тремя и четырьмя спальнями для каникул всей семьёй. Бассейн, рестораны и детский клуб; до песчаного пляжа около 300 метров, есть шаттл.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=65253","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=65253"],"photo_blob_sha":"c28929e923d20bc5be70537459a31d7f9cfc1327"},{"hotel_id":15862,"hotel":"InterContinental Grand Ho Tram","aliases":["InterContinental Grand Ho Tram","INTERCONTINENTAL GRAND HO TRAM","THE GRAND HO TRAM STRIP"],"text":"✈️ Туры в InterContinental Grand Ho Tram\n📍 Хо Трам, Вьетнам.\n\nХо Трам для насыщенного семейного отпуска: бассейны, водные горки и детский клуб. Просторные номера, выбор ресторанов и спа помогут чередовать активные дни и спокойный отдых.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=15862","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=15862"],"photo_blob_sha":"1f757e7882706ff61ae86e27cecbc3b379645d23"},{"hotel_id":41494,"hotel":"Amanoi","aliases":["Amanoi","AMANOI"],"text":"✈️ Туры в Amanoi\n📍 Бухта Винь Хи, Вьетнам.\n\nВиллы с бассейнами на зелёных склонах над бухтой Винь Хи для уединённого отпуска. Спа, рестораны и морские панорамы; к пляжному клубу и песчано-галечному берегу курсируют багги.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=41494","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=41494"],"photo_blob_sha":"2cd4c022667cfa3df284e63f35d835e09ed4c487"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          prior=api('actions/runs/44128332213');assert prior['conclusion']=='success' and prior['run_attempt']==1 and prior['head_sha']=='62c19a4113b894e1901046de73620749b9c977cc'
