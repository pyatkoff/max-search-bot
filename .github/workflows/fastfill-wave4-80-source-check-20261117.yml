name: One-shot FASTFILL wave4-80 editorial and unchanged publisher source acceptance
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-wave4-80-source-check-20261117.yml']
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'e53eede2df5dbc5da5f72b04c0ac8777819cd8dc' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            tools/direct_demand/operations
            .github/traffic-publish/commercial-wave4-100-20261117
      - name: Reuse original unchanged publisher preparation controls
        run: python3 tools/direct_demand/operations/check-commercial-batch-preparation.py
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read-only installed application and clean tracked files; no deployment
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pub
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0; app=/var/www/anytoour/data/www/app.anytoour.ru; test -d "$app/.git" && test ! -L "$app"; cd "$app"; test -z "$(git status --porcelain --untracked-files=no)"; git rev-parse HEAD' > pub/runtime-readonly.txt
          cat pub/runtime-readonly.txt
      - name: Accept reviewed80 exact source bytes; unchanged bounded publisher, no sends
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e53eede2df5dbc5da5f72b04c0ac8777819cd8dc
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,re,runpy,subprocess,zipfile
          PHOTO='e53eede2df5dbc5da5f72b04c0ac8777819cd8dc';PREFIX='.github/traffic-publish/commercial-wave4-100-20261117/';EXPECTED_APP='3ffab7f2e2d01c8cd35144fba621897e4ad75e5d'
          INPUT=json.loads(r'''[{"hotel_id":22718,"hotel":"Avani+ Mai Khao Phuket Suites & Villas","aliases":["Avani+ Mai Khao Phuket Suites & Villas","AVANI+ MAI KHAO PHUKET SUITES & VILLAS"],"text":"✈️ Туры в Avani+ Mai Khao Phuket Suites & Villas\n📍 Пхукет, Таиланд.\n\nПросторные сьюты и виллы для семейного Пхукета: бассейн среди зелени, детский клуб и рестораны. В сьютах есть оборудованная кухня, а до песчаного Май Као около 300 метров через дорогу.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=22718","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=22718","https://www.avanihotels.com/uploads/minor/avani/documents/vmai/hotel-info/avani-mai-khao-phuket-suites-and-villa-fact-sheet.pdf?la=en"],"photo_blob_sha":"f00e3a9303903786e7f0eb46f9f4748b2990b3f9"},{"hotel_id":541,"hotel":"Amari Pattaya","aliases":["Amari Pattaya","AMARI OCEAN PATTAYA","AMARI ORCHID OCEAN TOWER","Amari Ocean Pattaya"],"text":"✈️ Туры в Amari Pattaya\n📍 Паттайя, Таиланд.\n\nСемейная Паттайя с бассейнами, водными развлечениями и детским клубом. Рестораны и спа помогут отдохнуть между прогулками, а городской песчаный пляж находится примерно в 150 метрах через дорогу.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=541","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=541","https://www.amari.com/pattaya"],"photo_blob_sha":"f0c7188df2088907d0b8a1460d4ec22b786a2fba"},{"hotel_id":2006,"hotel":"Centara Grand Beach Resort Phuket","aliases":["Centara Grand Beach Resort Phuket","CENTARA GRAND BEACH RESORT PHUKET"],"text":"✈️ Туры в Centara Grand Beach Resort Phuket\n📍 Пхукет, Таиланд.\n\nКарон для ярких семейных каникул: пляж перед отелем, бассейны и аквапарк с ленивой рекой. Пока дети заняты в клубе и на игровых площадках, взрослые могут выбрать спа или ужин у моря.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=2006","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=2006"],"photo_blob_sha":"9c495e72c2642f9c7b992915d513423e979dc8f6"},{"hotel_id":9385,"hotel":"Cape Dara Resort","aliases":["Cape Dara Resort","CAPE DARA RESORT"],"text":"✈️ Туры в Cape Dara Resort\n📍 Паттайя, Таиланд.\n\nМорские панорамы северной Паттайи, два бассейна и рестораны для красивого отпуска. Есть детский клуб и спа-процедуры. У отеля галечный берег, поэтому бассейны особенно кстати.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=9385","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=9385"],"photo_blob_sha":"1b2f5bd76d9cb6683f56494b0bfda2811fda86d7"},{"hotel_id":3006,"hotel":"Angsana Villas Resort Phuket","aliases":["Angsana Villas Resort Phuket","ANGSANA VILLAS RESORT PHUKET","OUTRIGGER LAGUNA RESORT AND VILLA"],"text":"✈️ Туры в Angsana Villas Resort Phuket\n📍 Пхукет, Таиланд.\n\nПросторные сьюты и виллы в районе Лагуна для отдыха семьёй или своей компанией. Два бассейна, детский клуб и возможность пользоваться шаттлом по комплексу помогут провести отпуск в спокойном ритме.\n\nПодберём тур на ваши даты. Нажмите кнопку под постом.","source":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=3006","sources":["https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=3006","https://www.angsana.com/contact-us"],"photo_blob_sha":"65f3bc7d9e1988b5095ebf638b13cd9119dbf0e1"},{"hotel_id":82422,"hotel":"Avani Chaweng Samui Hotel & Beach Club","aliases":["Avani Chaweng Samui Hotel & Beach Club","AVANI CHAWENG SAMUI HOTEL & BEACH CLUB ADULTS ONLY"],"text":"✈️ Туры в Avani Chaweng Samui Hotel & Beach Club\n📍 Самуи, Таиланд.\n\nСамуи для гостей от 18 лет: бассейн, пляжный клуб SEEN и песчаный Чавенг. Подойдёт для отпуска вдвоём или с друзьями, когда хочется совместить море и оживлённу