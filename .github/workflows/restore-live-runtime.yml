name: Restore live runtime after deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-live-runtime.yml'
      - 'tools/standby_enable_standalone.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-search-runtime-recovery
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NEW_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "Invalid SSH key"; exit 1; }
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$NEW_KEY" "$RUNNER_TEMP/new_key"

      - name: Wait for exact new-server SHA
        env:
          NEW_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$NEW_USER@$NEW_HOST"
          for attempt in $(seq 1 40); do
            deployed="$(ssh -i "$RUNNER_TEMP/new_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" 'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              echo "NEW_SERVER_SHA_VERIFIED=$deployed"
              exit 0
            fi
            echo "Waiting for exact SHA $EXPECTED_SHA (current: ${deployed:-unavailable}, attempt $attempt/40)"
            sleep 5
          done
          echo "New server did not reach exact SHA" >&2
          exit 1

      - name: Verify new endpoint is sole MAX owner
        env:
          NEW_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$NEW_USER@$NEW_HOST"
          ssh -i "$RUNNER_TEMP/new_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            php tools/max_webhook_status.php >/tmp/max-runtime-recovery-health.json
            php -r '\''$d=json_decode(file_get_contents("/tmp/max-runtime-recovery-health.json"),true); $u=$d["subscription_urls"]??[]; if(empty($d["ok"])||($d["reason"]??"")!=="healthy"||($d["subscription_count"]??0)!==1||count($u)!==1||($u[0]??"")!=="https://app.anytoour.ru/webhook.php"){exit(1);} echo "MAX_NEW_ONLY_HEALTH=OK\n";'\''
            php tools/lead_bridge_probe.php
          '

      - name: Restore MAX live processing state
        env:
          NEW_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$NEW_USER@$NEW_HOST"
          ssh -i "$RUNNER_TEMP/new_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -euo pipefail
            cd /var/www/anytoour/data/www/app.anytoour.ru
            state="$(php tools/max_shadow_mode.php --status)"
            echo "$state"
            if [[ "$state" != "MAX_SHADOW_MODE=OFF" ]]; then
              export MAX_SEARCH_ALLOW_STANDBY_CONFIG_WRITE=1
              php tools/max_shadow_mode.php --live | grep -qx "MAX_SHADOW_MODE=OFF"
              php tools/max_shadow_mode.php --commit | grep -qx "MAX_SHADOW_COMMIT=OK"
            fi
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=OFF"
            echo "MAX_LIVE_PROCESSING=RESTORED"
          '

      - name: Install single followup cron owner on new server
        env:
          LEGACY_HOST: ${{ secrets.DEPLOY_HOST }}
          LEGACY_USER: ${{ secrets.DEPLOY_USER }}
          NEW_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          legacy="$LEGACY_USER@$LEGACY_HOST"
          new="$NEW_USER@$NEW_HOST"
          legacy_raw="$(ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$legacy" 'crontab -l 2>/dev/null || true')"
          legacy_matches="$(printf '%s\n' "$legacy_raw" | grep -E '(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)' || true)"
          legacy_count="$(printf '%s\n' "$legacy_matches" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          echo "LEGACY_FOLLOWUP_CRON_COUNT=$legacy_count"
          [[ "$legacy_count" == "0" ]]
          ssh -i "$RUNNER_TEMP/new_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$new" '
            set -euo pipefail
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l 2>/dev/null >"$before" || true
            cp "$before" "$after"
            sed -i -E "/cron_followup\.php/d;/# max-search-bot followup owner/d" "$after"
            {
              echo "# max-search-bot followup owner"
              echo "* * * * * flock -n /tmp/max-search-followup-cron.lock /usr/bin/php /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.php >> /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.cron.log 2>&1"
            } >>"$after"
            rollback() { crontab "$before" || true; rm -f "$before" "$after"; }
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -E "(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            trap - ERR
            rm -f "$before" "$after"
            echo "NEW_FOLLOWUP_CRON_COUNT=1"
          '
          echo "BOT_CRON_OWNERSHIP=NEW_ONLY"

      - name: Final runtime verification
        env:
          NEW_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$NEW_USER@$NEW_HOST"
          ssh -i "$RUNNER_TEMP/new_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=OFF"
            php tools/lead_bridge_probe.php
            crontab -l | grep -Fq "/var/www/anytoour/data/www/app.anytoour.ru/cron_followup.php"
            echo "NEW_RUNTIME_RECOVERY=COMPLETE"
          '
