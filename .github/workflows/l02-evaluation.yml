name: Private manager AI L02 Luna-Sol Standard evaluation
on:
  push:
    branches: ['analysis/manager-ai-l02-20261019']
    paths: ['.github/l02-task.json','.github/workflows/l02-evaluation.yml','tools/l02_eval.php','tools/l02_envelope.cjs','tools/l02_queue.py','tests/l02_checks.php','tools/l02_source.json']
permissions:
  contents: read
concurrency:
  group: private-manager-ai-l02
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify source before any credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/analysis/manager-ai-l02-20261019'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -l tools/l02_eval.php >/dev/null
          php tests/l02_checks.php gpt-6-luna
          php tests/l02_checks.php gpt-6.1-sol
          node tools/l02_envelope.cjs test
          node -e "process.stdout.write(require('./tools/l02_envelope.cjs').makeBundle())" | php -l >/dev/null
          python3 tools/l02_queue.py --self-test
      - name: Set private runtime directory
        shell: bash
        run: echo "PRIVATE_DIR=$RUNNER_TEMP/private-manager-ai-l02" >> "$GITHUB_ENV"
      - name: Validate public task and exact bundle
        id: task
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node tools/l02_envelope.cjs validate
          php -l "$PRIVATE_DIR/remote.php" >/dev/null
      - name: Verify authoritative main
        if: steps.task.outputs.phase != 'cleanup' && steps.task.outputs.phase != 'collect'
        env:
          PRODUCTION_SHA: ${{ steps.task.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PRODUCTION_SHA"
      - name: Prepare existing SSH identity privately
        if: steps.task.outputs.valid == 'true' && steps.task.outputs.phase != 'verify'
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$PRIVATE_DIR/ssh_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$PRIVATE_DIR/ssh_key"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$PRIVATE_DIR/ssh_key"
          fi
          chmod 600 "$PRIVATE_DIR/ssh_key"
          ssh-keygen -y -f "$PRIVATE_DIR/ssh_key" >/dev/null 2>&1
      - name: Run reviewed private CLI
        id: remote
        if: steps.task.outputs.valid == 'true' && steps.task.outputs.phase != 'verify'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          PHASE: ${{ steps.task.outputs.phase }}
          TASK_TOKEN: ${{ steps.task.outputs.task_token }}
          PRODUCTION_SHA: ${{ steps.task.outputs.production_sha }}
          CANDIDATE_SHA: ${{ steps.task.outputs.candidate_sha }}
          BUNDLE_SHA: ${{ steps.task.outputs.source_bundle_sha256 }}
          RECIPIENT_SHA: ${{ steps.task.outputs.recipient_sha256 }}
          CASE_COUNT: ${{ steps.task.outputs.case_count }}
          PARALLELISM: ${{ steps.task.outputs.parallelism }}
          STAGE: ${{ steps.task.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          ssh_opts=(-i "$PRIVATE_DIR/ssh_key" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$PRIVATE_DIR/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PreferredAuthentications=publickey)
          if [ "$PHASE" != 'prepare' ]; then
            node tools/l02_envelope.cjs pin
            ssh_opts+=(-o StrictHostKeyChecking=yes)
          fi
          if [ "$PHASE" = 'prepare' ] || [ "$PHASE" = 'evaluate' ]; then
            deployed="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && git rev-parse HEAD" 2>/dev/null)"
            test "$deployed" = "$PRODUCTION_SHA"
          fi
          ssh_opts+=(-o StrictHostKeyChecking=yes)
          echo 'ran=true' >> "$GITHUB_OUTPUT"
          remote_ok=true
          timeout 2520 ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$root' && php -d display_errors=0 -d log_errors=0 /dev/stdin --phase='$PHASE' --task-token='$TASK_TOKEN' --production-sha='$PRODUCTION_SHA' --candidate-sha='$CANDIDATE_SHA' --bundle-sha256='$BUNDLE_SHA' --recipient-sha256='$RECIPIENT_SHA' --case-count='$CASE_COUNT' --parallelism='$PARALLELISM' --stage='$STAGE'" \
            < "$PRIVATE_DIR/remote.php" > "$PRIVATE_DIR/remote-output.jsonl" 2> "$PRIVATE_DIR/remote-stderr.txt" || remote_ok=false
          if [ "$PHASE" = 'prepare' ] && [ "$remote_ok" = true ]; then
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 --connect-timeout 5 --max-filesize 8192 --noproxy '*' \
              "https://app.anytoour.ru/manager2/assets/manager-l02-proof-$TASK_TOKEN.json" > "$PRIVATE_DIR/https-proof.json" 2> "$PRIVATE_DIR/https-stderr.txt"
            cmp -s "$PRIVATE_DIR/https-proof.json" "$PRIVATE_DIR/remote-output.jsonl"
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$root/manager2/assets/manager-l02-proof-$TASK_TOKEN.json'" >/dev/null 2>/dev/null
          fi
          deployed_ok=false
          after="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && git rev-parse HEAD" 2>/dev/null || true)"
          if [ "$after" = "$PRODUCTION_SHA" ]; then deployed_ok=true; fi
          main_ok=false
          if git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main && [ "$(git rev-parse refs/remotes/origin/main)" = "$PRODUCTION_SHA" ]; then main_ok=true; fi
          printf '{"remote_ok":%s,"deployed_ok":%s,"main_ok":%s}\n' "$remote_ok" "$deployed_ok" "$main_ok" > "$PRIVATE_DIR/execution.json"
          if [ "$PHASE" = 'prepare' ] || [ "$PHASE" = 'cleanup' ]; then test "$remote_ok" = true; fi
      - name: Validate proof or encrypt results
        id: package
        if: always() && steps.remote.outputs.ran == 'true'
        shell: bash
        run: node tools/l02_envelope.cjs finish
      - name: Upload public preparation or cleanup receipt
        if: steps.task.outputs.phase == 'prepare' || steps.task.outputs.phase == 'cleanup'
        uses: actions/upload-artifact@v4
        with:
          name: manager-l02-public-${{ steps.task.outputs.phase }}-${{ steps.task.outputs.task_token }}
          path: |
            ${{ env.PRIVATE_DIR }}/prepared.json
            ${{ env.PRIVATE_DIR }}/cleanup.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload encrypted private results
        if: always() && steps.package.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manager-l02-private-${{ steps.task.outputs.task_token }}
          path: ${{ env.PRIVATE_DIR }}/results.enc.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Require complete output
        if: steps.task.outputs.phase == 'evaluate'
        shell: bash
        run: test "$(cat "$PRIVATE_DIR/complete")" = true
      - name: Remove runner private material
        if: always()
        shell: bash
        run: |
          if [ -n "${PRIVATE_DIR:-}" ]; then rm -rf "$PRIVATE_DIR"; fi
