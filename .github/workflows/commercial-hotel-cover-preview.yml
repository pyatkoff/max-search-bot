name: Prepare hotel gallery previews

on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths:
      - 'tools/direct_demand/operations/commercial-expansion-wave*-native-candidates-*.json'

permissions:
  contents: read

jobs:
  prepare-gallery-previews:
    if: github.repository == 'pyatkoff/max-search-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
            .github/traffic-publish/brand
      - name: Install cover composer dependencies
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0 requests==2.32.5
      - name: Render covers from the changed hotel intake
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "$PREVIOUS_HEAD^{commit}"
          mapfile -t manifests < <(git diff --name-only --diff-filter=AM "$PREVIOUS_HEAD" "$GITHUB_SHA" -- 'tools/direct_demand/operations/commercial-expansion-wave*-native-candidates-*.json')
          if [ "${#manifests[@]}" -ne 1 ]; then
            printf '%s\n' "Expected exactly one added or edited hotel intake"
            exit 1
          fi
          python3 tools/direct_demand/operations/prepare-commercial-gallery-covers.py "${manifests[0]}" .github/traffic-publish/brand/anytour-logo-white.png preview
      - name: Keep the review sheets and photo sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-gallery-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview/review/
          retention-days: 30
          if-no-files-found: warn
      - name: Keep the individual covers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-gallery-covers-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview/covers/
          retention-days: 30
          if-no-files-found: warn
