name: Read-only Direct demand export

on:
  push:
    branches: [audit/direct-demand-20261022]
    paths:
      - .github/workflows/direct-demand-readonly.yml
      - tools/direct_demand/remote_collect.py

permissions:
  contents: read

concurrency:
  group: direct-demand-readonly-20261022
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect existing Direct account statistics
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/direct_demand_key"
          trap 'rm -f "$key_file"' EXIT
          if [[ -z "$DEPLOY_SSH_KEY_VALUE" || -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" ]]; then
            echo 'Direct export: existing SSH connection unavailable' >&2
            exit 1
          fi
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          mkdir -m 700 direct-demand-output
          ssh -i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -I -B -S -' < tools/direct_demand/remote_collect.py > direct-demand-output/report.json 2> "$RUNNER_TEMP/direct-demand-ssh.log" || capture_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('direct-demand-output/report.json')
          try:
              data = json.loads(path.read_text())
          except (OSError, ValueError):
              data = {'status': 'FAILED', 'problems': ['SSH_OR_COLLECTOR_NO_VALID_REPORT']}
              path.write_text(json.dumps(data))
          summary = {key: data.get(key) for key in ('status', 'campaign_ids', 'date1', 'date2', 'row_count', 'config_unchanged', 'problems')}
          summary['pagination_complete'] = data.get('coverage', {}).get('pagination_complete', False)
          print(json.dumps(summary, ensure_ascii=False))
          if data.get('status') != 'COLLECTED':
              raise SystemExit(1)
          PY
          test "${capture_status:-0}" = 0

      - name: Save private report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-demand-20261022-${{ github.run_id }}-${{ github.run_attempt }}
          path: direct-demand-output/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary report and SSH output
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/direct_demand_key" "$RUNNER_TEMP/direct-demand-ssh.log"
          rm -rf direct-demand-output
