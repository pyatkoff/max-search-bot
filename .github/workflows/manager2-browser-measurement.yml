name: Manager2 browser measurement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'tools/measure_manager2_browser.js'
      - 'tools/fixtures/manager2_browser_measurement.js'
      - 'tests/visual/fixtures/personal-workspace.js'
      - 'docs/manager2-browser-measurement.md'
      - '.github/workflows/manager2-browser-measurement.yml'
  workflow_dispatch:
    inputs:
      product_sha:
        description: 'Exact deployed source SHA; empty uses this workflow SHA'
        required: false
        type: string

permissions:
  contents: read
  packages: read

# Read-only evidence has its own group; it cannot cancel a deployment.
concurrency:
  group: manager2-measurement-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  PRODUCT_SHA: ${{ inputs.product_sha || github.event.pull_request.base.sha || github.sha }}

jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned measurement library
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Capture anonymous static input and verify source hashes
        run: >-
          node tools/measure_manager2_browser.js --capture --capture-only
          --product-sha "$PRODUCT_SHA" --assets measurement-input
          --output measurement-capture
      - uses: actions/upload-artifact@v4
        with:
          name: manager2-measurement-input-${{ github.sha }}
          path: measurement-input/
          if-no-files-found: error
          retention-days: 30

  browser:
    needs: input
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: ['390', '430', '768', '1440', '390-short']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "/opt/manager2-qa/run {0}"
    timeout-minutes: 20
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the prepared native runtime
        run: node /opt/manager2-qa/verify-runtime.js --require-source
      - uses: actions/download-artifact@v4
        with:
          name: manager2-measurement-input-${{ github.sha }}
          path: measurement-input
      - name: Check draft protocol or measure the full synthetic series
        env:
          ENGINE: ${{ matrix.engine }}
          WIDTH: ${{ matrix.width }}
          SAMPLES: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '1' || '30' }}
          WARMUPS: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '1' || '3' }}
          COLD: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '1' || '3' }}
        run: >-
          node tools/measure_manager2_browser.js --engine "$ENGINE"
          --widths "$WIDTH"
          --product-sha "$PRODUCT_SHA" --assets measurement-input
          --output measurement-result --samples "$SAMPLES" --warmups "$WARMUPS" --cold "$COLD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager2-measurement-${{ matrix.engine }}-${{ matrix.width }}-${{ github.sha }}
          path: measurement-result/
          if-no-files-found: error
          retention-days: 30
