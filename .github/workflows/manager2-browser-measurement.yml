name: Manager2 WebKit progress diagnostic
on:
  push:
    branches: [perf/manager2-wk-watchdog-debug-20261018]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned WebKit
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: Original synchronous function costs
        run: >-
          node tools/measure_manager2_browser.js --capture --engine webkit
          --product-sha d0e3a8d25708b0a29ab48351a14e778a42cc6b6b
          --widths 390 --samples 3 --warmups 1 --cold 1
          --assets diagnostic-input --output diagnostic-original
      - name: Paired batch-reset control on the same host
        run: >-
          node tools/measure_manager2_browser.js --engine webkit --batch-reset
          --product-sha d0e3a8d25708b0a29ab48351a14e778a42cc6b6b
          --widths 390 --samples 3 --warmups 1 --cold 1
          --assets diagnostic-input --output diagnostic-batch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager2-webkit-progress-${{ github.sha }}
          path: |
            diagnostic-original/
            diagnostic-batch/
          if-no-files-found: error
          retention-days: 30
