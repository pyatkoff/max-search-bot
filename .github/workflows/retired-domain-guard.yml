name: Retired domain guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired host references
        shell: bash
        run: |
          set -euo pipefail
          retired="anytour"".online"
          if git grep -n -F "$retired" -- .; then
            echo 'Retired host reference found in tracked source' >&2
            exit 1
          fi
          echo 'RETIRED_DOMAIN_REFERENCES=0'
