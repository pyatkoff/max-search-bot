name: Inspect MAX shadow delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/max-shadow-delivery.yml'
      - 'handlers/MaxUpdateHandler.php'
      - 'tools/standby_enable_standalone.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "STANDBY_DEPLOY_SSH_KEY is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect recent shadow markers only
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            echo "SHADOW_DIAGNOSTIC_SHA=$(git rev-parse HEAD)"
            if [ ! -f tmp_in.txt ]; then
              echo "SHADOW_DELIVERY_OBSERVED=NO"
              echo "SHADOW_MARKER_COUNT=0"
              exit 0
            fi
            count=$(grep -c "SHADOW_UPDATE_RECEIVED type=" tmp_in.txt || true)
            echo "SHADOW_MARKER_COUNT=$count"
            if [ "$count" -eq 0 ]; then
              echo "SHADOW_DELIVERY_OBSERVED=NO"
              exit 0
            fi
            echo "SHADOW_DELIVERY_OBSERVED=YES"
            # Emit only timestamp + update type marker. Never print raw webhook payloads.
            grep "SHADOW_UPDATE_RECEIVED type=" tmp_in.txt | tail -n 10 | sed -E "s/^([0-9:. ]+)--- SHADOW_UPDATE_RECEIVED type=([A-Za-z0-9_]+).*$/SHADOW_RECENT=timestamp:\1,type:\2/"
          '
