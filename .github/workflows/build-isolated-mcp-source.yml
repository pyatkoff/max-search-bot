name: Verify isolated MCP review repairs once
on:
  push:
    branches: [ops/build-isolated-mcp-20261029]
    paths: [.github/workflows/build-isolated-mcp-source.yml]
permissions:
  contents: write
concurrency:
  group: isolated-mcp-source-20261029
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.run_attempt == 1 && github.event.before == '6d575a5bfb2410c50581320073a0f8cc8c387906' && github.event.head_commit.message == 'build: validate isolated route boundaries and publish review repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: e4cf7473103aa3a748e697dd7aa8ef73b3491d38
      INTEGRATION: 8e913ab3fa9f72a5159197946e96620c4afa2ce5
      TARGET: feature/isolated-replies-hotels-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e4cf7473103aa3a748e697dd7aa8ef73b3491d38
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Apply exact source repairs without production access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" "$INTEGRATION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit "$INTEGRATION"
          for script in fix_isolated_mcp_review.py fix_isolated_mcp_fixture_compat.py fix_isolated_mcp_boundary_test.py; do
            git show "$GITHUB_SHA:tools/$script" > "$RUNNER_TEMP/$script"
            python3 "$RUNNER_TEMP/$script"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          p=Path('tests/run_manager_preparation_oauth_regression.php')
          text=p.read_text()
          old="if (!in_array($action,['/manager/ai-oauth.php?action=authorize','/manager/development-oauth.php?action=authorize'],true))"
          new="if (!in_array($action,['/manager/ai-oauth.php?action=authorize','/manager/development-oauth.php?action=authorize','/manager/replies-oauth.php?action=authorize','/manager/hotels-oauth.php?action=authorize'],true))"
          if text.count(old)!=1: raise SystemExit('Consent helper marker changed')
          p.write_text(text.replace(old,new))
          p=Path('tests/run_manager_preparation_health_regression.php')
          text=p.read_text()
          old='public function __construct(private $connectionActive=null)'
          new='public function __construct($pdo=null,private $connectionActive=null)'
          if text.count(old)!=1: raise SystemExit('Health fixture constructor marker changed')
          p.write_text(text.replace(old,new))
          p=Path('tests/run_manager_http_boundary_regression.php')
          text=p.read_text()
          if text.count("'private const REPLY_TOOLS='")!=1: raise SystemExit('Boundary constant marker changed')
          p.write_text(text.replace("'private const REPLY_TOOLS='","'public const REPLY_TOOLS='"))
          for path in json.load(open('split_review_paths.json')):
              if path.endswith('.php'):
                  subprocess.run(['php','-l',path],check=True)
          PY
      - name: Full manager regressions including isolated OAuth HTTP and cron health
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/manager-regressions.log"
          if php tests/run_required_group.php manager > "$log" 2>&1; then
            grep -E 'SEPARATED MCP:|manager preparation OAuth checks|preparation MCP regression|HOTEL WORK QUEUE:|TOTAL.*hotel|REQUIRED CHECK GROUPS PASSED' "$log" || true
            tail -n 4 "$log"
          else
            tail -n 70 "$log"
            exit 1
          fi
      - name: Publish tested repair to the existing candidate only
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)"
          test "$current" = "$BASE"
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('split_review_paths.json'))
          allowed={'services/ManagerPreparationOAuth.php','services/ManagerPreparationMcpService.php','tests/run_separated_mcp_regression.php','tests/run_manager_preparation_oauth_regression.php','docs/SEPARATED_REPLIES_HOTELS_MCP.md','tests/run_manager_preparation_health_regression.php','tests/run_hotel_work_health_regression.php','tests/run_manager_http_boundary_regression.php'}
          for profile in ('replies','hotels'):
              allowed.add(f'.well-known/oauth-authorization-server/manager/{profile}-oauth.php')
              allowed.add(f'.well-known/oauth-protected-resource/manager/{profile}-mcp.php')
          if set(paths)!=allowed: raise SystemExit('Repair scope mismatch')
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          git commit -m 'fix: isolate reply unsubscribe and preserve unresolved event authority'
          candidate="$(git rev-parse HEAD)"
          git push origin "$candidate:refs/heads/$TARGET"
          echo "CANDIDATE_SHA=$candidate"
          git diff --stat "$INTEGRATION" "$candidate"
