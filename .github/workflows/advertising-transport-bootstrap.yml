name: Provision private advertising receiver identity
on:
  push:
    branches: [audit/advertising-transport-bootstrap-20261026]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_RUNTIME_SHA: 104727bde18708586dc6e9c07fd230a96c414d72
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/transport_bootstrap_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo invalid_existing_identity; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Provision fixed private receiver keys without enabling delivery
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,socket,subprocess,hashlib,base64,json
          from pathlib import Path
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];expected=os.environ['EXPECTED_RUNTIME_SHA']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host) or not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}',user) or not re.fullmatch(r'[a-f0-9]{40}',expected):raise SystemExit('invalid_fixed_target')
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:raise SystemExit('canonical_target_changed')
          pinned=[]
          for attempt in range(2):
              scan=subprocess.run(['ssh-keyscan','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  p=line.split()
                  if len(p)!=3 or p[0].startswith('#'):continue
                  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(p[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError:continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':pinned.append(line)
              if pinned:break
          if not pinned:raise SystemExit('canonical_host_pin_not_seen')
          temp=Path(os.environ['RUNNER_TEMP']);known=temp/'transport_bootstrap_hosts';known.write_text('\n'.join(pinned)+'\n');known.chmod(0o600)
          pins={"services/AdvertisingVisitTransport.php":"a60378fc7692418c3bed37cd8f59b3a1ab409315","services/AdvertisingVisitFeedProtocol.php":"08579591f1c2069bae3cfd027f1f71203b9fe319","services/AdvertisingVisitContract.php":"c38a4d4ba4af9fcd10e9efade1e4aadf4dc3a7f4","services/AdvertisingVisitImportService.php":"07549d3080f3c55d5bd39b78bea65aeed4aeb721","services/AdvertisingVisitJournalReader.php":"f32aa830d85bfc1459767636e646a121a5046445","services/AdvertisingVisitRepository.php":"efce3a4a75299bd666868cae02a19813147f8b82","services/ProjectConfig.php":"538b596981f2c61fbf524e18756bf672578948f6","services/TourSearchHandoffService.php":"4db4da454a9a9403935e0139441650066c30627a","tools/advertising_visit_transport.php":"5f754f6dd2bb5172887bb3bd02b0004daa1acd29","cron_metrika.php":"5ef30a50e7732e51741875203b07d7de90c937b0"}
          commands=['set -euo pipefail','cd /var/www/anytoour/data/www/app.anytoour.ru',f'test "$(git rev-parse HEAD)" = "{expected}"']
          for path,sha in pins.items():
              if not re.fullmatch(r'[A-Za-z0-9_./-]+',path) or '..' in path or not re.fullmatch(r'[a-f0-9]{40}',sha):raise SystemExit('invalid_source_pin')
              commands.append(f'test "$(git hash-object {path})" = "{sha}"')
          commands+=['php tools/advertising_visit_transport.php status','php tools/advertising_visit_transport.php key-init','php tools/advertising_visit_transport.php status',f'test "$(git rev-parse HEAD)" = "{expected}"']
          run=subprocess.run(['ssh','-i',str(temp/'transport_bootstrap_key'),'-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=10',user+'@'+host,'bash -se'],input='\n'.join(commands)+'\n',capture_output=True,text=True,timeout=65)
          if run.returncode or run.stderr:raise SystemExit('private_receiver_bootstrap_failed')
          lines=run.stdout.splitlines()
          if len(lines)!=3:raise SystemExit('unexpected_bootstrap_output')
          before,public,after=map(json.loads,lines)
          if before.get('enabled') is not False or after.get('enabled') is not False or after.get('initialized') is not True or after.get('last_run') is not None or public.get('status')!='initialized':raise SystemExit('unexpected_activation_or_state')
          if set(public)!={'status','request_public_key','response_public_key','public_fingerprint'} or any(not re.fullmatch(r'[a-f0-9]{64}',public[k]) for k in ['request_public_key','response_public_key','public_fingerprint']):raise SystemExit('public_key_contract_failed')
          pair={k:public[k] for k in ['request_public_key','response_public_key']}
          if hashlib.sha256(json.dumps(pair,separators=(',',':')).encode()).hexdigest()!=public['public_fingerprint']:raise SystemExit('public_fingerprint_failed')
          print(json.dumps({'installed_sha':expected,'run_id':os.environ['GITHUB_RUN_ID'],'source_pins_verified':len(pins),'receiver_preexisting':before.get('initialized'),'receiver_ready':True,'enabled':False,'keys':pair,'public_fingerprint':public['public_fingerprint'],'source_reads':0,'database_writes':False,'conversion_uploads':0},sort_keys=True))
          PY
      - name: Remove runner-only private deployment identity
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/transport_bootstrap_key" "$RUNNER_TEMP/transport_bootstrap_hosts"
