name: Deploy standby

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standby-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Run required checks
        run: bash tests/run_required_checks.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check standby configuration
        id: config
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          STANDBY_DEPLOY_SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$STANDBY_DEPLOY_HOST" ] && [ -n "$STANDBY_DEPLOY_USER" ] && [ -n "$STANDBY_DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Standby deployment is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Standby deployment skipped: STANDBY_DEPLOY_HOST / STANDBY_DEPLOY_USER / STANDBY_DEPLOY_SSH_KEY are not all configured."
          fi

      - name: Prepare standby SSH private key
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          raw="$STANDBY_DEPLOY_SSH_KEY"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Sync standby checkout
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; git fetch origin main; if ! git diff --quiet || ! git diff --cached --quiet; then echo 'ERROR: tracked standby drift detected'; git status --short; exit 1; fi; git cat-file -e '$EXPECTED_SHA^{commit}'; git reset --hard '$EXPECTED_SHA'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; echo standby_sha=\$(git rev-parse HEAD)"

      - name: Apply standby database migrations
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/conversation_db.php migrate"

      - name: Standby non-invasive smoke
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; php -l manager/index.php; php -l manager/api.php; php -l webhook.php; php -l telegram_webhook.php; echo 'standby_smoke=success'"

      - name: Enable standalone mode on new server
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; export MAX_SEARCH_ALLOW_STANDBY_CONFIG_WRITE=1; php tools/standby_enable_standalone.php --enable; if php tools/standalone_readiness.php; then php tools/standby_enable_standalone.php --commit; echo standalone_mode=ready; else php tools/standby_enable_standalone.php --rollback; exit 1; fi'

      - name: Probe lead bridge from new server
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/lead_bridge_probe.php'

      - name: Promote MAX processing when new server is sole owner
        if: steps.config.outputs.enabled == 'true'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_deploy_key"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            health=$(php tools/max_webhook_status.php)
            printf "%s\n" "$health"
            if printf "%s\n" "$health" | grep -Fq '"ok": true' \
              && printf "%s\n" "$health" | grep -Fq '"reason": "healthy"' \
              && printf "%s\n" "$health" | grep -Fq '"expected_url": "https://app.anytoour.ru/webhook.php"'; then
              export MAX_SEARCH_ALLOW_STANDBY_CONFIG_WRITE=1
              php tools/standby_max_shadow_mode.php --off | grep -qx 'MAX_SHADOW_MODE=OFF'
              echo max_runtime=active_single_owner
            else
              echo max_runtime=shadow_or_not_owner
            fi
          '

      - name: Confirm new-server runtime policy
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          echo "New-server code, migrations and standalone configuration are synchronized."
          echo "The readiness doctor and authenticated read-only lead bridge probe are green."
          echo "MAX processing is promoted only when the new webhook is the verified sole MAX owner; dual/legacy states remain shadow-safe."
          echo "This workflow does not install, start or restart cron workers."
