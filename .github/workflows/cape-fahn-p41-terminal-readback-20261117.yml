  "jobs": {
    "native-receipts-and-public-feeds": {
      "if": "github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '80c0a045b5442d44c5861e227466ea5a6ae26d2f' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Authenticate original native receipts, read current public XML and stage exact git proof",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport base64,collections,datetime,hashlib,io,json,os,pathlib,subprocess,urllib.request,xml.etree.ElementTree as ET,zipfile\nREPO='pyatkoff/max-search-bot'\nSOURCE=os.environ['GITHUB_SHA']\nTARGET='tools/direct_demand/operations/cape-fahn-p41-publication-receipt-20261117.json'\ndef api(path,body=None):\n args=['gh','api','repos/'+REPO+'/'+path]\n if body is not None:args+=['--method','POST','--input','-']\n return json.loads(subprocess.check_output(args,input=None if body is None else json.dumps(body).encode(),timeout=60))\nrun=api('actions/runs/44160991120')\nassert run['head_sha']=='80c0a045b5442d44c5861e227466ea5a6ae26d2f' and run['run_attempt']==1 and run['conclusion']=='success'\njobs=api('actions/runs/44160991120/attempts/1/jobs?per_page=100')\nassert jobs['total_count']==1 and len(jobs['jobs'])==1\njob=jobs['jobs'][0]\nassert job['id']==134314437575 and job['conclusion']=='success' and job['head_sha']==run['head_sha']\nassert all(x['conclusion']=='success' for x in job['steps'])\nmeta=api('actions/artifacts/14363730772')\nassert not meta['expired'] and meta['workflow_run']['id']==run['id'] and meta['workflow_run']['head_sha']==run['head_sha']\nassert meta['digest']=='sha256:4ce0543fdba62969f537a9e6efa6c6e14a4bb5dba738a8977faa7f6a940b327e'\nraw=subprocess.check_output(['gh','api','repos/'+REPO+'/actions/artifacts/14363730772/zip'],timeout=60)\nassert len(raw)==meta['size_in_bytes'] and hashlib.sha256(raw).hexdigest()==meta['digest'][7:]\nwith zipfile.ZipFile(io.BytesIO(raw)) as z:\n assert z.testzip() is None\n files={}\n for n in z.namelist():\n  name=pathlib.PurePosixPath(n).name\n  assert name not in files\n  files[name]=z.read(n)\nterm=json.loads(files['terminal-verified.json'])\nassert term['state']=='CAPE_FAHN_PAIR_NATIVE_VERIFIED' and term['paired_hotels']==1000 and term['previous_paired_hotels']==999\nassert term['new_max_posts']==term['reused_telegram_posts']==term['recovered_button_edits']==1\nassert term['original_failed_p27_not_replayed'] and term['feed_writes']==term['price_writes']==term['application_installs']==0\nassert all(hashlib.sha256(files[n]).hexdigest()==h for n,h in term['files'].items())\nbefore=json.loads(files['cape-before.json']);after=json.loads(files['cape-after.json'])\nassert before['db_writes']==before['provider_calls']==after['db_writes']==after['provider_calls']==0\nfor k in ['publication_id','version_id','config_version','message_id','text_sha256','content_hash','snapshot_sha256','token_sha256','failure_receipt_sha256','original_p27_file_sha256']:\n assert before[k]==after[k],k\nassert after['publication_id']==1947 and after['version_id']==7476 and after['message_id']=='901' and after['write_attempts']==1\nassert after['failure_receipt_sha256']=='ac5f9bcbd2c09aa540bd5d1f6775ef9287d07aac59bf47d2c1f29494aa1ba9f5'\nassert after['original_p27_file_sha256']=='67cec32a35e6b702b568d6ab3df96457e21bd81ea07cde11809c24c84845037c'\nassert after['button_verified'] and after['content_preserved']\nposts=term['posts'];assert len(posts)==2 and {p['platform'] for p in posts}=={'max','telegram'}\nassert all(p['hotel_id']==66375 and p['state']=='sent' and p['body_photo_button_verified'] for p in posts)\nassert next(p for p in posts if p['platform']=='max')['post_url']=='https://max.ru/channel_anytour/AaHrBmGMXn8'\nassert next(p for p in posts if p['platform']=='telegram')['post_url']=='https://t.me/any_toour/901'\noriginal=api('actions/runs/44133796626')\nassert original['run_attempt']==1 and original['conclusion']=='failure' and original['head_sha']=='7971139fa1c6b10dfee2fe8afea5b528dd7a30d0'\nprior_item=api('contents/tools/direct_demand/operations/fastfill-wave5-43-publication-receipt-20261117.json?ref=21b3964dcd2b4875129fa5971544047640ce86a2')\nprior_raw=base64.b64decode(prior_item['content'])\nassert hashlib.sha256(prior_raw).hexdigest()=='84a122bffc2d4782ae7f145f1e303b86932adaecba25cbb2876fd4bca5d800d7'\nprior=json.loads(prior_raw)\nassert prior['paired_total_after']==999 and prior['prior_unfinished_cape_fahn']['hotel_id']==66375\nold_missing=prior['advertising_status']['missing_native_hotel_ids']\nassert len(old_missing)==len(set(old_missing))==339 and 66375 not in old_missing\nscope=old_missing+[66375]\nobservation={'mode':'PUBLIC_XML_READ_ONLY','observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'business_writes':0,'feeds':[]}\npresent_sets=[]\nfor name,platform in [('hotel-posts-telegram.xml','telegram'),('hotel-posts-max.xml','max'),('hotel-posts-all.xml','all')]:\n url='https://app.anytoour.ru/feed/'+name\n with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AnyTour-approved-feed-readback/1.0'}),timeout=60) as response:\n  assert response.status==200\n  body=response.read()\n ids=[o.attrib['id'] for o in ET.fromstring(body).findall('.//offer')]\n duplicates=[i for i,n in collections.Counter(ids).items() if n>1]\n assert not duplicates\n present=set(h for h in scope if ('tg_'+str(h) in ids if platform=='telegram' else 'max_'+str(h) in ids if platform=='max' else 'tg_'+str(h) in ids and 'max_'+str(h) in ids))\n present_sets.append(present)\n observation['feeds'].append({'name':name,'url':url,'offers':len(ids),'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body),\n  'by_platform':dict(collections.Counter(i.split('_',1)[0] for i in ids)),'duplicate_offer_ids':duplicates,'scope_present_native_ids':sorted(present),'cape_fahn_present':66375 in present})\ncovered=set.intersection(*present_sets)\nmissing=[h for h in scope if h not in covered]\nreceipt={'state':'CAPE_FAHN_COMPLETE_PAIR_NATIVE_VERIFIED','hotel_id':66375,'hotel':'Cape Fahn Hotel','paired_total_before':999,'paired_total_after':1000,\n 'unique_completed_pairs':1,'new_max_posts':1,'reused_telegram_posts':1,'telegram_button_edits':1,'posts':posts,\n 'original_native':{'run_id':44160991120,'attempt':1,'job_id':134314437575,'source_sha':'80c0a045b5442d44c5861e227466ea5a6ae26d2f','artifact_id':14363730772,'archive_sha256':meta['digest'][7:]},\n 'source_approval':json.loads(files['source-receipt.json']),'native_terminal':term,'recovered_telegram':{'before':before,'after':after},\n 'original_p27':{'run_id':44133796626,'attempt':1,'conclusion':'failure','replayed':False,'original_failed_operation_file_sha256':after['original_p27_file_sha256']},\n 'application':{'pr':1612,'source_sha':'8734fbfd029dd9541c57b742636025aa35a5100c','merge_sha':'96765e518d7cdc0d7db95a49628994de28f01c4d','deploy_run_id':44157731738,'closer_run_id':44160338481,'publisher_comment_id':6958375681,'native_accepted_resolution':json.loads(files['release-admission.json'])},\n 'prior_receipt':{'commit':'21b3964dcd2b4875129fa5971544047640ce86a2','path':prior_item['path'],'sha256':hashlib.sha256(prior_raw).hexdigest()},\n 'feeds_readback':observation,'advertising_status':{'published_unique_hotels':1000,'telegram_feed_offers':observation['feeds'][0]['offers'],'max_feed_offers':observation['feeds'][1]['offers'],\n  'combined_feed_offers':observation['feeds'][2]['offers'],'missing_complete_pairs':len(missing),'missing_native_hotel_ids':missing,'feed_writes_in_this_work':0,'price_writes_in_this_work':0,\n  'original_route_owner_frozen_inventory':217,'frozen217_not_expanded':True,'separate_extension_count_after_cape_fahn':123,'extension_added_native_ids':[66375],'price_freshness':'NOT_CONFIRMED_BY_PRICE_OWNER'},\n 'business_operations_complete':True}\nout=pathlib.Path('terminal');out.mkdir()\nserialized=json.dumps(receipt,ensure_ascii=False,indent=2)+'\\n'\n(out/'receipt.json').write_text(serialized)\n(out/'feed-readback.json').write_text(json.dumps(observation,indent=2)+'\\n')\nbase=api('git/commits/'+SOURCE)\ntree=api('git/trees',{'base_tree':base['tree']['sha'],'tree':[{'path':TARGET,'mode':'100644','type':'blob','content':serialized}]})\ncommit=api('git/commits',{'message':'Retain actual Cape Fahn pair completing 1000 published hotels and fresh feed coverage','tree':tree['sha'],'parents':[SOURCE]})\nstage={'state':'UNREFERENCED_NATIVE_VERIFIED_CAPE_FAHN_RECEIPT','source_commit':SOURCE,'staged_commit':commit['sha'],'staged_tree':tree['sha'],'path':TARGET,'receipt_sha256':hashlib.sha256(serialized.encode()).hexdigest(),\n 'paired_total':1000,'new_max_posts':1,'telegram_button_edits':1,'cape_fahn_unfinished':0,'missing_feed_pairs':len(missing),'feed_counts':[x['offers'] for x in observation['feeds']],'observed_at':observation['observed_at']}\n(out/'stage.json').write_text(json.dumps(stage,indent=2)+'\\n')\nprint('CAPE_TERMINAL_STAGE_JSON '+json.dumps(stage,separators=(',',':')))\nprint('CAPE_TERMINAL_FEEDS_JSON '+json.dumps(observation,separators=(',',':')))\nPY\n"
        },
        {
          "name": "Preserve native proof and unchanged business state",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cape-fahn-p41-terminal-readback-20261117",
            "path": "terminal/*",
            "retention-days": 30,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
