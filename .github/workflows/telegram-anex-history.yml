name: One-use private ANEX Telegram history import

on:
  push:
    branches: [analysis/telegram-anex-history-20261018]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 21d7dffd46f55c81f0780d179f60f99cd3a4f364
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fixed source and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/analysis/telegram-anex-history-20261018'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          php -l tools/telegram_anex_history_remote.php
          /usr/bin/python3 -m py_compile tools/telegram_anex_history_runner.py
          /usr/bin/python3 -c 'import runpy; runpy.run_path("tools/telegram_anex_history_runner.py")["load_manifest"]()'
      - name: Verify existing cryptography runtime
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.asymmetric import rsa'
      - name: Receive three encrypted ANEX parts and import once
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/telegram_anex_history_runner.py
