name: MAX owner avatar probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/MaxPrivateAvatarProbe.php'
      - 'tools/max_private_avatar_probe.php'
      - 'tests/run_max_private_avatar_probe_regression.php'
      - 'tests/run_max_owner_avatar_workflow_regression.py'
      - '.github/workflows/max-owner-avatar-probe.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full installed main SHA
        type: string
        required: true
      confirm_owner_test:
        description: Resolve one owner message and query its MAX private-chat photo once
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: max-owner-avatar-probe
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite
          coverage: none
      - name: Verify bounded provider request and read-only identity binding
        run: php tests/run_max_private_avatar_probe_regression.php
      - name: Verify fixed manual workflow command and stop gates
        run: python3 tests/run_max_owner_avatar_workflow_regression.py

  owner-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_owner_test == true
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact repository source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Resolve accepted repository and application
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment_release.js resolve-consumer >> "$GITHUB_OUTPUT"

      - name: Validate exact installed main SHA before loading credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY_SHA: ${{ steps.release.outputs.repository_sha }}
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
          RELEASE_READY: ${{ steps.release.outputs.ready }}
          PERFORM_ACTIONS: ${{ steps.release.outputs.perform_actions }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REPOSITORY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$RELEASE_READY" = true
          test "$PERFORM_ACTIONS" = true
          test "$WORKFLOW_SHA" = "$REPOSITORY_SHA"
          test "$EXPECTED_SHA" = "$APPLICATION_SHA"

      - name: Prepare existing deployment SSH key
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Invalid deployment SSH key'; exit 2; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Run one fixed read-only owner probe with redacted output
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$expected_sha"
          git diff --quiet
          git diff --cached --quiet
          php tools/max_private_avatar_probe.php --expected-sha="$expected_sha" --confirm-owner-test
          REMOTE

      - name: Remove ephemeral SSH key
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true' && (always())
        shell: bash
        run: rm -f "$RUNNER_TEMP/deploy_key"
