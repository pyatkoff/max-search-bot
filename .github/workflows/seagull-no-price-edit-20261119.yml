name: Seagull exact existing pair caption revision without price
on:
  push:
    branches: [audit/seagull-no-price-edit-20261119]
    paths: ['.github/workflows/seagull-no-price-edit-20261119.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  seagull-caption-only:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '1c83652c4a3ae7669be428c541a056341401b29d' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Lint exact writer and negative scope tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir pub
          python3 - <<'PY'
          import base64,pathlib
          pathlib.Path('pub/writer.php').write_bytes(base64.b64decode(''))
          pathlib.Path('pub/scope-tests.php').write_bytes(base64.b64decode(''))
          PY
          php -l pub/writer.php
          php pub/scope-tests.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Edit one authorized existing pair once and verify canonical contexts
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = 1c83652c4a3ae7669be428c541a056341401b29d
          python3 - <<'PY'
          import subprocess,json
          def info(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p]))
          import hashlib
          handoff=info('issues/comments/6996301251')
          assert handoff['updated_at']=='2026-11-19T01:55:53Z' and hashlib.sha256(handoff['body'].encode()).hexdigest()=='3cf3ad1e6d9f07979c3ce4efd678171c24a2fd4dafb577070da25ec39e159da8', 'SEAGULL_HANDOFF_CHANGED_STOP'
          price=json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/poisk-turov-test/actions/runs/44439035841']))
          assert price['status']=='completed' and price['conclusion']=='success' and price['run_attempt']==1 and price['head_sha']=='97fe6c6d7841edd0b7e5b7337f781f4e343a3280', 'PRICE_HANDOFF_TERMINAL_CHANGED_STOP'
          for rid in [44438778455,44440606717]:
              r=info('actions/runs/'+str(rid))
              assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']=='1c83652c4a3ae7669be428c541a056341401b29d', 'INSTALLED_RELEASE_NOT_TERMINAL_STOP'
          r=info('actions/runs/44440882107')
          assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']=='3bb605ccc3144c5179c491bf7e8114a90e671116' and r['run_attempt']==1, 'FINAL_ADMISSION_NOT_VERIFIED_STOP'
          PY
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; test -z "$(git status --porcelain --untracked-files=no)"; php' < pub/writer.php > pub/result.json
          cat pub/result.json
      - name: Preserve original diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seagull-no-price-edit-20261119
          path: pub/result.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
