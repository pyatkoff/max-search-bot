name: One-shot FASTFILL 38 paired hotels in four original bounded operations
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-reserve38-native-publish-20261117.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-four-sequential-once:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '739151a8a1dd637a661fbd086c997458ec7f76ef' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Authenticate all accepted source bytes for four fixed bounded operations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^)" = 739151a8a1dd637a661fbd086c997458ec7f76ef
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zipfile
          APP='fd9b28dab2147f13f3b0d0f7f856b14392b141d2';MAIN='cece6e7bd9b1d1b8984a14df2910c8a1d36e900f'
          EXPECTED=json.loads(r'''{"p14-manifest.json":"d002d9f000840aa80c41a0c64217ba70b578996c41f1ed7ce9f3678cfe914ca9","p14-approval.json":"d80276bdc4853201a7548ea8cd8e987d018fdb235bd4ab3af0b65b94360aa320","p14-publisher-unexecuted.php":"330ee72b4e6166648f99800502e2b31f6442418b1f5c2ce52d2c2291f820d626","p15-manifest.json":"a6dfc981fe926307e1ea995b83d33c9c02ba494127abbd0f539928a87acfde64","p15-approval.json":"23d134797acfb6880cc77982921023c756182bd3607cc50e92d23995eebcdbbd","p15-publisher-unexecuted.php":"94e636ff43952ae7054fd9c0b911c4c5ff31b2c4a6e8b019a077946891281889","p16-manifest.json":"1467c107e05d1b8743de974d6d8832cd0d093736c2f27797c914e91683f8736a","p16-approval.json":"5f2da7216f6213bd69dc9a83cde8406a94312e8bd7f98e740c50f3e6752a2d64","p16-publisher-unexecuted.php":"338a6bb494263c1ba0a218505001ea58c177701db1a6a718c6220c9b76de0d3c","p17-manifest.json":"cd531e8d4cbdbea8150de2d241673381b536e14fdd5feac1a7269f535713c87c","p17-approval.json":"cd1e77492261ea5e541f1bb30b5061861886eee775a1ee7db2f39442f549950a","p17-publisher-unexecuted.php":"9ec4c01b9ececb2425280a0d0d998614fb114546efa68b169e746649ee92de57","provider-facts.json":"4779d8078373f73f16d1d85a920b3823b7919afab5a806cb29f0fabe6d1a5da8","cover-receipt-original.json":"7c5dff93d1ab4842f1bf92a0f5847b488bcb98e942721e70fcee7b8d7568857d","runtime-readonly.txt":"6033ec39b3254c37e93fe336948cade59a0e0ef1f96936f1b2847530843b567b"}''')
          BATCHES=json.loads(r'''[{"batch":14,"operation":"commercial-hotel-batch-20261117-14-v1","ids":[37172,17683,28662,83059,75658,60787,2592,2681,49850,65031],"rows":10,"publisher_sha256":"330ee72b4e6166648f99800502e2b31f6442418b1f5c2ce52d2c2291f820d626"},{"batch":15,"operation":"commercial-hotel-batch-20261117-15-v1","ids":[4522,8916,13840,99319,110940,102527,103272,32226,69179,112603],"rows":10,"publisher_sha256":"94e636ff43952ae7054fd9c0b911c4c5ff31b2c4a6e8b019a077946891281889"},{"batch":16,"operation":"commercial-hotel-batch-20261117-16-v1","ids":[77942,46724,13996,63901,13845,45287,44984,23290,38640,128487],"rows":10,"publisher_sha256":"338a6bb494263c1ba0a218505001ea58c177701db1a6a718c6220c9b76de0d3c"},{"batch":17,"operation":"commercial-hotel-batch-20261117-17-v1","ids":[68939,77515,69774,23283,76032,2478,132068,158417],"rows":8,"publisher_sha256":"9ec4c01b9ececb2425280a0d0d998614fb114546efa68b169e746649ee92de57"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          assert api('git/ref/heads/main')['object']['sha']==MAIN
          r=api('actions/runs/44109891905');assert r['conclusion']=='success' and r['run_attempt']==1 and r['head_sha']=='739151a8a1dd637a661fbd086c997458ec7f76ef'
          old=api('actions/runs/44079440323');assert old['conclusion']=='success' and old['run_attempt']==1 and old['head_sha']==APP
          a=api('actions/artifacts/14338739687')
          assert not a['expired'] and a['workflow_run']['id']==44109891905 and a['digest']=='sha256:4d57f6a2ecf472caefc6a305f49849dff95b0ee7ac76dacd28c4b95697e338d2'
          raw=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14338739687/zip'],timeout=90)
          assert hashlib.sha256(raw).hexdigest()=='4d57f6a2ecf472caefc6a305f49849dff95b0ee7ac76dacd28c4b95697e338d2'
          p=pathlib.Path('pub');p.mkdir()
          (p/'source.zip').write_bytes(raw)
          with zipfile.ZipFile(p/'source.zip') as z:
              assert z.testzip() is None and set(z.namelist())==set(EXPECTED)|{'receipt.json'}
              blobs={n:z.read(n) for n in EXPECTED};rec=json.loads(z.read('receipt.json'))
          assert rec['state']=='THIRTY_EIGHT_EDITORIAL_ACCEPTED_EXISTING_PUBLISHER_SOURCE_ONLY'
          assert rec['runtime_sha']==APP and rec['main_sha']==MAIN and rec['total_rows']==38
          assert rec['batches']==BATCHES and rec['files']==EXPECTED and rec['send_attempts']==rec['feed_writes']==0
          assert all(hashlib.sha256(v).hexdigest()==EXPECTED[n] for n,v in blobs.items())
          assert len(set(i for b in BATCHES for i in b['ids']))==38 and all(1<=b['rows']<=10 for b in BATCHES)
          for batch in BATCHES:
              n='p'+str(batch['batch']);q=p/n;q.mkdir()
              m=blobs[n+'-manifest.json'];a=json.loads(blobs[n+'-approval.json']);manifest=json.loads(m)
              assert manifest['expected_new_full_pairs']==batch['rows'] and manifest['operation']==a['operation']==batch['operation']
              assert [r['hotel_id'] for r in manifest['rows']]==a['hotel_ids']==batch['ids']
              assert a['expected_installed_sha']==APP and a['manifest_sha256']==hashlib.sha256(m).hexdigest()
              php=blobs[n+'-publisher-unexecuted.php']
              assert hashlib.sha256(php).hexdigest()==batch['publisher_sha256']
              assert php.count(b"const EXPECTED_INSTALLED_SHA='fd9b28dab2147f13f3b0d0f7f856b14392b141d2';")==1
              assert b"const MANIFEST_BASE64='"+base64.b64encode(m)+b"';" in php
              (q/'manifest.json').write_bytes(m);(q/'approval.json').write_bytes(blobs[n+'-approval.json'])
              (q/'source-receipt.json').write_text(json.dumps(rec,indent=2)+'\n')
              (q/'wave2-once.php').write_bytes(php);(q/'wave2-once.php').chmod(0o600)
          (p/'accepted-source-receipt.json').write_text(json.dumps(rec,indent=2)+'\n')
          print('RESERVE38_EXACT_SOURCE_ARTIFACT_VERIFIED_NO_REGENERATION')
          
          PY
          for p in pub/p*/wave2-once.php; do php -l "$p"; done
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
