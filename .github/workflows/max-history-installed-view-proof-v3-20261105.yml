name: Verify installed MAX history viewing with canonical external configuration

on:
  push:
    branches: [ops/max-history-installed-view-proof-v3-20261105]
    paths: ['.github/workflows/max-history-installed-view-proof-v3-20261105.yml']

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/max-history-installed-view-proof-v3-20261105' && github.run_attempt == 1
    concurrency:
      group: anytour-max-history-installed-view-proof-v3-20261105
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ACCEPTED_MAIN_SHA: '95dcf9893fb161b1e4fb52c02ad2d982604e7518'
      EXPECTED_CLIENT_BLOB: '998a4164647f7fb605a12ca52f247606d6c82bb4'
      EXPECTED_VIEW_BLOB: '1a9465bff3ec897d03660823fabbf2f4ccfc5493'
      EXPECTED_CONTROLLER_BLOB: '9effaf51b53f83e9dbf1857eacaf68b0efa6189e'
      EXPECTED_REGISTRY_BLOB: 'c8418ad957b7b85fcba3a7456a873320c87a4eff'
    steps:
      - name: Checkout this one original audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository event original attempt main ancestry and sole path
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/ops/max-history-installed-view-proof-v3-20261105'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          for value in "$ACCEPTED_MAIN_SHA" "$EXPECTED_CLIENT_BLOB" "$EXPECTED_VIEW_BLOB" "$EXPECTED_CONTROLLER_BLOB" "$EXPECTED_REGISTRY_BLOB"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
          jq -e --arg sha "$GITHUB_SHA" '
            .repository.full_name=="pyatkoff/max-search-bot" and
            .ref=="refs/heads/ops/max-history-installed-view-proof-v3-20261105" and
            .deleted==false and .forced==false and .after==$sha
          ' "$GITHUB_EVENT_PATH" >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r head parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$head" = "$GITHUB_SHA"
          test "$parent" = "$ACCEPTED_MAIN_SHA"
          test -z "$extra"
          test "$(git diff --name-only "$ACCEPTED_MAIN_SHA" HEAD)" = '.github/workflows/max-history-installed-view-proof-v3-20261105.yml'
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/MaxTrackerLookupClient.php")" = "$EXPECTED_CLIENT_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/MaxMemberHistoryView.php")" = "$EXPECTED_VIEW_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:manager/assigned-value.php")" = "$EXPECTED_CONTROLLER_BLOB"
          test "$(git rev-parse "$ACCEPTED_MAIN_SHA:services/ModeledConversionValueRegistry.php")" = "$EXPECTED_REGISTRY_BLOB"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$ACCEPTED_MAIN_SHA"

      - name: Prepare existing connection and pinned host
        env:
          CONNECTION_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$CONNECTION_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/max-history-installed-view-proof-key"; else printf '%s\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/max-history-installed-view-proof-key"; fi
          else
            printf '%s' "$raw" | base64 --decode >"$RUNNER_TEMP/max-history-installed-view-proof-key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/max-history-installed-view-proof-key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['CONNECTION_HOST'];user=os.environ['CONNECTION_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          approved=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':approved.append(line)
          assert approved,'Existing host continuity mismatch; STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/max-history-installed-view-proof-hosts').write_text('\n'.join(approved)+'\n')
          PY
      - name: Verify the installed signed HTTPS history page private projection and pure renderer
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'MAX_HISTORY_INSTALLED_PROOF'
