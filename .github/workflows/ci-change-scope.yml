name: Select CI scope

on:
  workflow_call:
    outputs:
      mode:
        description: Audited component change or conservative full coverage
        value: ${{ jobs.scope.outputs.mode }}
      tour-proof:
        description: Also commission the scoped tour runner when its CI rules change
        value: ${{ jobs.scope.outputs.tour-proof }}
      backend:
        description: Full server coverage or audited selection styling only
        value: ${{ jobs.scope.outputs.backend }}
      browser:
        description: Required browser scope, or none for audited CLI-only tests
        value: ${{ jobs.scope.outputs.browser }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      tour-proof: ${{ steps.scope.outputs.tour-proof }}
      backend: ${{ steps.scope.outputs.backend }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every PR has required regression on this same merge commit. Only its
      # scope call owns the identical policy selftests; these three known
      # companions still run the selector. Manual/unknown callers validate.
      - name: Verify CI selection rules
        if: github.event_name != 'pull_request' || !contains(fromJSON('["Workspace V2 visual QA","Workspace incoming sound","Channel post context"]'), github.workflow)
        run: |
          node tests/run_ci_change_scope_regression.js
          node tests/check_ci_public_manifest_scope.js
          node tests/check_ci_selection_style_scope.js
          node tests/check_ci_cli_tests_scope.js
          node tests/run_oauth_browser_report_regression.js
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 tests/check_ci_workflow_scopes.py
      - name: Select from the complete base and head diff
        id: scope
        run: |
          result="$(node tools/ci_change_scope.js)"
          printf '%s\n' "$result"
          CI_SCOPE_RESULT="$result" node -e '
            const result = JSON.parse(process.env.CI_SCOPE_RESULT);
            const backend = result.mode === "tour-selection" && result.backend === "selection-style" ? "selection-style" : "full";
            const browser = result.browser === undefined ? result.mode : result.browser;
            const cliOnly = result.mode === "tour-selection" && result.backend === "full" &&
              result.reason === "selection_cli_tests_only" && result.proveTourSelection === false && browser === "none";
            if (!["full", "oauth", "tour-selection"].includes(result.mode) ||
                (browser !== result.mode && !cliOnly)) throw new Error("Invalid browser scope");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `backend=${backend}\nbrowser=${browser}\n`);
          '
