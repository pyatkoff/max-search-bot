name: Verify the two Telegram targets after PR1672
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/read-1672-transfer-public-outcome.yml]
permissions: {}
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Compare native keyboards across both public preview formats
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$USER_VALUE@$HOST_VALUE" 'bash -s' <<'REMOTE'
          set -eu
          cd /var/www/anytoour/data/www/app.anytoour.ru
          php -d display_errors=0 <<'PHP'
          <?php
          namespace AnyTour\ExistingPostBatch;
          
          require 'tools/anytour_existing_post_batch.php';
          
          transferRuntime(getcwd(), 'de6282c79cf533e316980a765acdd58a5227b05d');
          $rows = [];
          foreach (['997'=>'45272173038','862'=>null] as $message => $run) {
              $id = (string)$message;
              $path = POST_OPS.'/anytour-issue1566-historical-tg-media-'.$id.'-v1/receipt.jsonl';
              requirePost(is_file($path) && realpath($path) === $path, 'transfer_journal_unavailable');
              $raw = file_get_contents($path, false, null, 0, 1_000_001);
              requirePost(is_string($raw) && strlen($raw) <= 1_000_000, 'transfer_journal_event_unbounded');
              $events = array_map(static fn(string $line): array => json_decode($line, true, 64, JSON_THROW_ON_ERROR),
                  explode("\n", rtrim($raw, "\r\n")));
              $journal = array_column($events, null, 'state');
              $ok = $journal['native_and_registry_verified'] ?? [];
              $button = $journal['identity_reserved']['reservation']['button_url'] ?? null;
              $native = $journal['provider_response_saved']['response']['data']['result']['reply_markup']['inline_keyboard'][0][0] ?? [];
              requirePost(($ok['message_id'] ?? null) === $id && is_string($button)
                  && ($run === null || ($journal['intent_saved']['execution']['native_run_id'] ?? null) === $run),
                  'transfer_original_journal_mismatch');
              $item = ['message_id'=>$id,'native_button_exact'=>($native['url'] ?? null) === $button,
                  'native_button_text_exact'=>($native['text'] ?? null) === $journal['intent_saved']['row']['button_text']];
              $views = ['widget'=>'https://t.me/anytour/'.$id.'?embed=1&mode=tme',
                  'channel_preview'=>'https://t.me/s/anytour/'.$id];
              foreach ($views as $name => $url) {
                  $context = stream_context_create(['http'=>['method'=>'GET','timeout'=>12,'follow_location'=>0,
                      'header'=>"User-Agent: Mozilla/5.0\r\n"], 'ssl'=>['verify_peer'=>true,'verify_peer_name'=>true]]);
                  $body = @file_get_contents($url, false, $context, 0, 1_000_001);
                  $result = ['read'=>is_string($body) && strlen($body) <= 1_000_000,'post_found'=>false,
                      'explicit_button_link'=>false];
                  if ($result['read']) {
                      $doc = new \DOMDocument('1.0', 'UTF-8');
                      $prior = libxml_use_internal_errors(true);
                      try {
                          if ($doc->loadHTML($body, LIBXML_NONET)) {
                              $xpath = new \DOMXPath($doc);
                              $nodes = $xpath->query('//*[@data-post="anytour/'.$id.'"]');
                              $result['post_found'] = $nodes && $nodes->length === 1;
                              if ($result['post_found']) {
                                  foreach ($xpath->query('.//a[@href]', $nodes->item(0)) as $link) {
                                      if ($link->getAttribute('href') === $button) $result['explicit_button_link'] = true;
                                  }
                              }
                          }
                      } finally {
                          libxml_clear_errors();
                          libxml_use_internal_errors($prior);
                      }
                  }
                  $item[$name] = $result;
              }
              $rows[] = $item;
          }
          echo json_encode(['button_comparison'=>$rows,'provider_writes'=>0,'production_writes'=>0], JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          REMOTE
      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
