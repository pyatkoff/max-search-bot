name: MAX attribution existing goals read only
on:
  push:
    branches: [test/max-attribution-integration-preflight-20261015]
    paths: [.github/workflows/max-attribution-goals-read.yml]
permissions:
  contents: read
concurrency:
  group: max-attribution-control
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare existing canonical deployment identity
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          raw="$KEY_VALUE"; key="$RUNNER_TEMP/key"
          if [[ "$raw" == *'PRIVATE KEY'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key"; else printf '%s' "$raw" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Read exact goal readiness without changing goals or uploads
        env:
          HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = "e7b3eb4267624cf3edf1d82ccc3e3cce4f4f953e"; php -d display_errors=0 -d log_errors=0' <<'PHP'
          <?php
          ini_set('display_errors','0');ini_set('log_errors','0');error_reporting(0);
          try{
            require 'config.php';require 'services/MetrikaOfflineClient.php';
            $counter=(string)METRIKA_COUNTER_ID;if($counter!=='98615635')throw new RuntimeException('counter');
            $ch=curl_init('https://api-metrika.yandex.net/management/v1/counter/'.$counter.'/goals');
            curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_PROTOCOLS=>CURLPROTO_HTTPS,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>15,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_HTTPHEADER=>['Authorization: OAuth '.(string)METRIKA_OAUTH_TOKEN,'Accept: application/json']]);
            $body=curl_exec($ch);$http=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);$errno=curl_errno($ch);$ssl=(int)curl_getinfo($ch,CURLINFO_SSL_VERIFYRESULT);curl_close($ch);
            $d=is_string($body)&&strlen($body)<=1048576?json_decode($body,true):null;$goals=is_array($d['goals']??null)?$d['goals']:[];
            $targets=[];foreach(MaxChannelConversionOutbox::TARGETS as $t)$targets[$t]=['matching_goals'=>0,'goal_types'=>[],'condition_types'=>[],'ready'=>false];
            foreach($goals as $g)foreach((array)($g['conditions']??[]) as $c){
              $target=(string)($c['url']??'');if(!array_key_exists($target,$targets))continue;
              $v=&$targets[$target];$v['matching_goals']++;$v['goal_types'][]=(string)($g['type']??'');$v['condition_types'][]=(string)($c['type']??'');
              if(($g['type']??'')==='action'&&($c['type']??'')==='exact')$v['ready']=true;unset($v);
            }
            echo json_encode(['ok'=>$http===200&&$errno===0,'http'=>$http,'transport_error'=>$errno,'ssl_verify'=>$ssl,'api_error_codes'=>array_values(array_filter(array_map(static fn($e)=>is_array($e)?(string)($e['error_type']??''):'',(array)($d['errors']??[])))),'goal_count'=>count($goals),'targets'=>$targets,'goal_writes'=>0,'conversion_requests'=>0])."\n";
          }catch(Throwable $ignored){echo "{\"ok\":false,\"reason\":\"goal_readiness_probe_failed\",\"goal_writes\":0,\"conversion_requests\":0}\n";exit(1);}
          PHP
      - name: Remove temporary SSH credential
        if: always()
        run: python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"key"); os.path.exists(p) and os.unlink(p)'
