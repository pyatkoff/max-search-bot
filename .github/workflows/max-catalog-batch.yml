name: Close verified owner MAX catalogue publication operation
on:
  push:
    branches: [audit/max-catalog-batch-20261025]
    paths: [.github/workflows/max-catalog-batch.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-catalog-batch-envelope-20261025
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 158ce9723e29c97bd82dfcd8002ca2485d88f7e1
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/max-catalog-batch-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_PRODUCTION_SHA }}
          persist-credentials: false
      - name: Verify current released production source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          conclusion=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$conclusion" = success
      - name: Prepare bounded receipt closure
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/channel-probe.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          $dir='/tmp/anytour-channel-batch-20261025-v1';$f=null;
          try{
           if(is_link($dir)||!is_dir($dir)||is_link($dir.'/publication-receipt.json'))throw new RuntimeException();
           $f=fopen($dir.'/publication-receipt.json','r+');if(!$f||!flock($f,LOCK_EX|LOCK_NB))throw new RuntimeException();
           $s=json_decode(stream_get_contents($f),true,64,JSON_THROW_ON_ERROR);
           $ids=['alma_cam_ranh'=>55,'EG_family'=>56,'phuket_five_naiyang_kata_karon'=>57];
           if(($s['operation']??'')!=='channel-batch-20261025-v1'||($s['channel_id']??'')!=='-80492244209683'||count($s['posts']??[])!==3)throw new RuntimeException();
           foreach($ids as $key=>$id){$p=$s['posts'][$key]??[];if(($p['state']??'')!=='verified'||(int)($p['receipt']['publication_id']??0)!==$id||empty($p['receipt']['canonical_token_resolved']))throw new RuntimeException();unset($s['posts'][$key]['upload_token']);}
           $s['operation_closed']=true;$s['transient_upload_tokens_removed']=true;
           if(!rewind($f)||!ftruncate($f,0))throw new RuntimeException();$raw=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);if(fwrite($f,$raw)!==strlen($raw)||!fflush($f)||(function_exists('fsync')&&!fsync($f)))throw new RuntimeException();
           $path=$dir.'/envelope-key.pem';if(is_link($path))throw new RuntimeException();if(is_file($path)&&!unlink($path))throw new RuntimeException();
           echo json_encode(['ok'=>true,'operation'=>'channel-batch-20261025-v1','target'=>'https://max.ru/channel_anytour','operation_closed'=>true,'transient_key_removed'=>!is_file($path),'receipt_retained'=>true,'post_write_attempts'=>0,'upload_attempts'=>0,'posts'=>[]]),PHP_EOL;
          }catch(Throwable $e){echo json_encode(['ok'=>false,'error'=>'bounded_cleanup_failed']),PHP_EOL;exit(2);}finally{if(is_resource($f)){flock($f,LOCK_UN);fclose($f);}}
          
          PHP
          php -l "$RUNNER_TEMP/channel-probe.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Close verified receipt and remove transient encryption material
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-probe.php" > "$RUNNER_TEMP/channel-probe.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-probe.json')as f:d=json.load(f)
          assert d['ok'] is True and d['operation']=='channel-batch-20261025-v1' and d['operation_closed'] is True and d['transient_key_removed'] is True
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-probe.php" "$RUNNER_TEMP/channel-probe.json"
