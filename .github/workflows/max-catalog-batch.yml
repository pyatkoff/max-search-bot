name: Read back owner MAX catalogue uncertain attempt
on:
  push:
    branches: [audit/max-catalog-batch-20261025]
    paths: [.github/workflows/max-catalog-batch.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-catalog-batch-envelope-20261025
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 158ce9723e29c97bd82dfcd8002ca2485d88f7e1
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/max-catalog-batch-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current released production source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          conclusion=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$conclusion" = success
      - name: Prepare reviewed encrypted batch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,base64,os,hashlib,pathlib
          rows=[('alma_cam_ranh','82f2a59190f5ea359bb9b1ee621bf25ec147a2899b3de223fdd099f3559e8b2f'),('EG_family','0e9f4fd37129e7c43c3950b76c6f7c9023ce04943d53f25826c9615c960adeed'),('phuket_five_naiyang_kata_karon','71e08af20e4692dc359381255da06ec1ac5121fba4b1d2a5e85ce7a44b83d764')]
          envelopes=[]
          for key,digest in rows:
            raw=pathlib.Path('.github/traffic-publish/'+key+'.encrypted.json').read_bytes()
            assert hashlib.sha256(raw).hexdigest()==digest
            envelopes.append(json.loads(raw))
          encoded=base64.b64encode(json.dumps(envelopes,separators=(',',':')).encode()).decode()
          script=pathlib.Path('tools/direct_demand/operations/publish-channel-batch.php').read_text()
          assert script.startswith('<?php\ndeclare(strict_types=1);\n')
          header="<?php\ndeclare(strict_types=1);\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst ENVELOPES_BASE64='"+encoded+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel-probe.php').write_text(header+script.split('<?php\ndeclare(strict_types=1);\n',1)[1])
          PY
          php -l "$RUNNER_TEMP/channel-probe.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Read exact uncertain attempt without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-probe.php" > "$RUNNER_TEMP/channel-probe.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-probe.json')as f:d=json.load(f)
          assert d['operation']=='channel-batch-20261025-v1' and d['target']=='https://max.ru/channel_anytour' and d['post_write_attempts']<=3 and d['upload_attempts']<=3 and len(d['posts'])<=3
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-probe.php" "$RUNNER_TEMP/channel-probe.json"
