          import collections,hashlib,json,pathlib
          p=pathlib.Path('pub/p58')
          lines=[json.loads(l) for l in (p/'original-native-output.jsonl').read_text().splitlines() if l.strip().startswith('{')]
          assert (p/'original-exit.txt').read_text().strip()=='0' and lines
          r=lines[-1];assert r['ok'] and r['operation']=='commercial-hotel-batch-20261118-58-v1' and r['installed_sha']=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          assert r['new_posts']==r['post_write_attempts']==8 and r['reused']==8 and len(r['posts'])==16
          expected=set([236,13853,48795,12104,2686,1518,64330,57682]);manifest=json.loads((p/'manifest.json').read_bytes());rows={x['hotel_id']:x for x in manifest['rows']}
          prior=json.loads(pathlib.Path('pub/original-telegram-receipts.json').read_bytes())
          by=collections.defaultdict(set)
          for x in r['posts']:
              assert x['state']=='sent' and x['body_photo_button_verified'] and x['reused']==(x['platform']=='telegram')
              assert x['hotel_id'] in expected and x['platform'] in ['max','telegram']
