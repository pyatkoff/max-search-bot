name: Read only previous V1 cohort visit reconciliation
on:
  push:
    branches: [ops/v1-six-receipt-read-20261106-521e5b0]
    paths: [.github/workflows/v1-six-receipt-read-20261106-521e5b0.yml]
permissions:
  contents: read
concurrency:
  group: anytour-private-archive-predictive-study
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/v1-six-receipt-read-20261106-521e5b0' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the one purpose source envelope
        env:
          API_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: 521e5b00fd9f5ac7307a8ec1033752e07ac9aab5
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess,urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL)
          try:
              expected=os.environ['ACCEPTED_MAIN_SHA']
              head=os.environ['GITHUB_SHA']
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              assert len(expected)==40 and all(c in '0123456789abcdef' for c in expected)
              assert event['repository']['full_name']=='pyatkoff/max-search-bot'
              assert event['ref']=='refs/heads/ops/v1-six-receipt-read-20261106-521e5b0'
              assert event['before']==expected and event['after']==head
              assert not event.get('forced') and not event.get('deleted')
              assert git('rev-parse','HEAD').decode().strip()==head
              assert git('rev-list','--parents','-n','1',head).decode().split()==[head,expected]
              changed=git('diff','--name-status',expected,head).decode()
              assert changed=='A\t.github/workflows/v1-six-receipt-read-20261106-521e5b0.yml\n'
              request=urllib.request.Request(
                  'https://api.github.com/repos/pyatkoff/max-search-bot/git/ref/heads/main',
                  headers={'Authorization':'Bearer '+os.environ['API_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert json.load(response)['object']['sha']==expected
              paths=["services/MetrikaOfflineClient.php","services/ModeledConversionValueContract.php","services/ProjectAccessService.php","services/ModeledConversionValueExport.php"]
              hashes={}
              for name in paths:
                  source=git('show',expected+':'+name)
                  path=pathlib.Path(name)
                  assert stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
                  assert path.read_bytes()==source
                  hashes[name]=hashlib.sha256(source).hexdigest()
              destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-source.json'
              destination.write_text(json.dumps({'source_commit':expected,'hashes':hashes},separators=(',',':')))
              destination.chmod(0o600)
          except Exception:
              print('{"ok":false,"source_envelope_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"source_envelope_verified":true}')
          PY
      - name: Prepare the existing identity and strict canonical host pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,re,socket,subprocess
          try:
              host=os.environ['TARGET']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host)
              assert {a[4][0] for a in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}=={'5.45.122.54'}
              key=os.environ['K']
              raw=key.replace('\\n','\n').replace('\r','').encode() if 'PRIVATE KEY' in key else base64.b64decode(key,validate=True)
              keypath=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-key'
              keypath.write_bytes(raw.rstrip(b'\n')+b'\n')
              keypath.chmod(0o600)
              check=subprocess.run(['ssh-keygen','-y','-f',str(keypath)],capture_output=True,timeout=10)
              assert check.returncode==0
              approved=set()
              for attempt in range(2):
                  try:
                      scan=subprocess.run(['ssh-keyscan','-t','ed25519','-T','10',host],capture_output=True,text=True,timeout=30)
                      lines=scan.stdout.splitlines()
                  except subprocess.TimeoutExpired as error:
                      output=error.stdout or b''
                      lines=(output.decode(errors='replace') if isinstance(output,bytes) else output).splitlines()
                  for line in lines:
                      fields=line.split()
                      if len(fields)!=3 or fields[1]!='ssh-ed25519':continue
                      try:
                          material=base64.b64decode(fields[2],validate=True)
                      except ValueError:continue
                      fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(material).digest()).decode().rstrip('=')
                      if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':
                          approved.add(host+' ssh-ed25519 '+fields[2])
                  if approved:break
              assert len(approved)==1
              known=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-hosts'
              known.write_text('\n'.join(sorted(approved))+'\n')
              known.chmod(0o600)
          except Exception:
              print('{"ok":false,"canonical_host_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"canonical_host_verified":true}')
          PY
      - name: Perform the finite build with a technical receipt
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_ACCOUNT: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
