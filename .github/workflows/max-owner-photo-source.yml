name: Fixed public hotel photo source probe

on:
  push:
    branches: [analysis/max-owner-photo-source-20261021]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: f72ba88acde604840197de8c1daaea1dc3b362a4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and current main before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_ACTOR" = 'pyatkoff'
          test "$GITHUB_ACTOR_ID" = '226193297'
          test "$GITHUB_REF" = 'refs/heads/analysis/max-owner-photo-source-20261021'
          test "$GITHUB_WORKFLOW_REF" = 'pyatkoff/max-search-bot/.github/workflows/max-owner-photo-source.yml@refs/heads/analysis/max-owner-photo-source-20261021'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          php -l tools/max_owner_photo_source_probe.php
      - name: GET only three fixed public hotel photos with pinned SSH
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          SSH_HOST_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/max-photo-source.XXXXXX")"
          echo "MAX_PHOTO_SOURCE_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$private_dir/key"; else printf '%s\n' "$raw" | tr -d '\r' > "$private_dir/key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$private_dir/key"
          fi
          chmod 600 "$private_dir/key"
          ssh-keygen -y -f "$private_dir/key" >/dev/null
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          printf '%s %s\n' "$DEPLOY_HOST" "$SSH_HOST_KEY" > "$private_dir/known_hosts"
          chmod 600 "$private_dir/known_hosts"
          ssh_opts=(-i "$private_dir/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts" -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o LogLevel=ERROR)
          timeout 70 ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; git diff --quiet; git diff --cached --quiet; php -d display_errors=0 -d log_errors=0 /dev/stdin; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; git diff --quiet; git diff --cached --quiet" < tools/max_owner_photo_source_probe.php > "$private_dir/result.json" 2> "$private_dir/stderr.txt"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          python3 - "$private_dir/result.json" <<'PY'
          import json,re,sys
          value=json.load(open(sys.argv[1]))
          assert type(value) is dict and set(value)=={'state','requests','photos'}
          assert value['state'] in {'blocked','complete','inconclusive'}
          assert type(value['requests']) is int and value['requests'] in {0,3}
          assert type(value['photos']) is list and len(value['photos'])==value['requests']
          for index,item in enumerate(value['photos'],1):
              assert type(item) is dict and set(item)=={'index','http_status','curl_code','tls_verified','complete','mime','signature','width','height','bytes','sha256'}
              assert item['index']==index
              assert type(item['http_status']) is int and 0<=item['http_status']<=599
              assert type(item['curl_code']) is int and 0<=item['curl_code']<=999
              assert type(item['tls_verified']) is bool and type(item['complete']) is bool
              assert item['mime'] in {'image/png','image/jpeg','other'} and item['signature'] in {'png','jpeg','other'}
              for dim in ('width','height'): assert item[dim] is None or type(item[dim]) is int and 0<item[dim]<=100000
              assert type(item['bytes']) is int and 0<=item['bytes']<=5*1024*1024
              assert type(item['sha256']) is str and re.fullmatch('[0-9a-f]{64}',item['sha256'])
          print(json.dumps(value,separators=(',',':')))
          PY
      - name: Remove private runner files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${MAX_PHOTO_SOURCE_PRIVATE_DIR:-}" in "$RUNNER_TEMP"/max-photo-source.*) ;; *) exit 0;; esac
          rm -f "$MAX_PHOTO_SOURCE_PRIVATE_DIR/key" "$MAX_PHOTO_SOURCE_PRIVATE_DIR/known_hosts" "$MAX_PHOTO_SOURCE_PRIVATE_DIR/result.json" "$MAX_PHOTO_SOURCE_PRIVATE_DIR/stderr.txt"
          rmdir "$MAX_PHOTO_SOURCE_PRIVATE_DIR"
