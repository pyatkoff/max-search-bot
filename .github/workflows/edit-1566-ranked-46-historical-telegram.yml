name: "#1566 Apply approved ranked Telegram hotel transfers"
on:
  push:
    branches: [ops/anytour-hotel-ranked-46-apply-20261123, ops/anytour-hotel-ranked-37-continue-20261123, ops/anytour-hotel-ranked-resume-20261124, "ops/anytour-hotel-ranked-after-*", "ops/anytour-hotel-ranked-plan-*"]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  transfer:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      ((github.event.created == true && github.event.before == '0000000000000000000000000000000000000000') ||
       (github.ref == 'refs/heads/ops/anytour-hotel-ranked-after-45372056681' && github.event.created == false &&
        github.event.forced == false && github.event.before == 'dca4085f9a63ac1e7a5179c2a9b1b20febce4f82')) &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out the native run source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve accepted repository and application
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment_release.js resolve-consumer >> "$GITHUB_OUTPUT"
      - name: Require exact APPLY admission before loading credentials
        env:
          READY: ${{ steps.release.outputs.ready }}
          PERFORM_ACTIONS: ${{ steps.release.outputs.perform_actions }}
          WRITE_OPERATION: ${{ steps.release.outputs.write_operation }}
          GH_TOKEN: ${{ github.token }}
          INDEX_SHA: ${{ steps.release.outputs.ranked_index_digest }}
          NATIVE_ARTIFACT_ID: ${{ steps.release.outputs.ranked_artifact_id }}
          PARENT_EVIDENCE: ${{ steps.release.outputs.parent_evidence }}
          REPOSITORY_SHA: ${{ steps.release.outputs.repository_sha }}
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$READY" = true
          test "$PERFORM_ACTIONS" = true
          case "$GITHUB_REF:$WRITE_OPERATION" in
            refs/heads/ops/anytour-hotel-ranked-46-apply-20261123:hotel_ranked_46_transfer|refs/heads/ops/anytour-hotel-ranked-plan-*:hotel_ranked_approved_input)
              check=--check-ranked-transfer-plan ;;
            refs/heads/ops/anytour-hotel-ranked-37-continue-20261123:hotel_ranked_37_continuation)
              check=--check-ranked-continuation ;;
            refs/heads/ops/anytour-hotel-ranked-resume-20261124:hotel_ranked_resume)
              check=--check-ranked-resume ;;
            refs/heads/ops/anytour-hotel-ranked-after-*:hotel_ranked_unreached)
              check=--check-ranked-unreached ;;
            *) exit 2 ;;
          esac
          test "$REPOSITORY_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$APPLICATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          umask 077
          mkdir pub
          # The resolver authenticates this native evidence before SSH credentials are available.
          printf '%s' "$PARENT_EVIDENCE" > "$RUNNER_TEMP/ranked-parent.json"
          [[ "$INDEX_SHA" =~ ^[a-f0-9]{64}$ && "$NATIVE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/ranked-native.zip"
          python3 tools/validate_ranked_telegram_input.py "$INDEX_SHA" "$RUNNER_TEMP/ranked-native.zip" > "$RUNNER_TEMP/ranked-chunks.json"
          jq -er '.[].sha256' "$RUNNER_TEMP/ranked-chunks.json" > "$RUNNER_TEMP/ranked-digests"
          while read -r digest; do
            php tools/anytour_existing_post_batch.php "$check" "$digest" < "$RUNNER_TEMP/ranked-parent.json" > "pub/check-$digest.json"
          done < "$RUNNER_TEMP/ranked-digests"
          python3 - <<'PY'
          import json, os, pathlib
          chunks=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'ranked-chunks.json').read_bytes())
          out={}
          for item in chunks:
              if os.environ['WRITE_OPERATION'] in {'hotel_ranked_37_continuation','hotel_ranked_resume'}:
                  item['hotels']=item['hotels'][3:]
                  item['messages']=item['messages'][3:]
                  item['operation']='anytour_hotel_transfer_ranked_resume_20261124' if os.environ['WRITE_OPERATION']=='hotel_ranked_resume' else 'anytour_hotel_transfer_ranked_remaining37_20261123'
              digest=item['sha256']
              checked=json.loads(pathlib.Path('pub/check-'+digest+'.json').read_bytes())
              if os.environ['WRITE_OPERATION']=='hotel_ranked_unreached':
                  parent=json.loads(os.environ['PARENT_EVIDENCE'])
                  assert checked.get('parent_run_id')==parent['parent_run_id']==os.environ['GITHUB_REF_NAME'].rsplit('-',1)[1]
                  remaining=parent['summary']['unreached']
                  assert 0 < len(remaining) < len(item['hotels']) and remaining==item['hotels'][-len(remaining):]
                  item['hotels']=remaining
                  item['messages']=item['messages'][-len(remaining):]
                  item['operation']='anytour_hotel_transfer_ranked_unreached_v1'
              assert checked['ok'] is True and checked['mode']=='offline_plan_check' and checked['operation']==item['operation']
              assert checked['production_writes']==checked['provider_writes']==0 and checked['plan_sha256']==digest
              assert [r['hotel_id'] for r in checked['rows']]==item['hotels']
              assert [r['target_url'] for r in checked['rows']]==['https://t.me/anytour/'+m for m in item['messages']]
              out[digest]={'state':'not_started','hotel_ids':item['hotels'],'message_ids':item['messages'],'operation':item['operation']}
          pathlib.Path('pub/summary.json').write_text(json.dumps(out))
          PY
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      # The branch is created once only after the owner's separate approval of
      # this exact plan. Installing this workflow does not create that branch.
      - name: Apply the installed editor once and retain its original receipts
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$APPLICATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          apply=--apply-ranked-transfer
          if [[ "$GITHUB_REF" == refs/heads/ops/anytour-hotel-ranked-37-continue-20261123 ]]; then
            apply=--apply-ranked-continuation
          elif [[ "$GITHUB_REF" == refs/heads/ops/anytour-hotel-ranked-resume-20261124 ]]; then
            apply=--apply-ranked-resume
          elif [[ "$GITHUB_REF" == refs/heads/ops/anytour-hotel-ranked-after-* ]]; then
            apply=--apply-ranked-unreached
          fi
          remote='set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru'
          while read -r digest; do
            python3 - "$digest" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('pub/summary.json')
          summary=json.loads(p.read_bytes())
          assert summary[sys.argv[1]]['state']=='not_started','chunk_replay_forbidden'
          summary[sys.argv[1]]['state']='invoked_requires_readback'
          p.write_text(json.dumps(summary))
          PY
            status=0
            ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" "$remote; php tools/anytour_existing_post_batch.php $apply $digest $APPLICATION_SHA $GITHUB_RUN_ID" < "$RUNNER_TEMP/ranked-parent.json" > "pub/result-$digest.json" || status=$?
            python3 - "$digest" "$status" <<'PY'
          import json, os, pathlib, sys
          digest,status=sys.argv[1],int(sys.argv[2])
          summary=pathlib.Path('pub/summary.json')
          states=json.loads(summary.read_bytes())
          state=states[digest]
          item={'hotels':state['hotel_ids'],'messages':state['message_ids'],'operation':state['operation']}
          p=pathlib.Path('pub/result-'+digest+'.json')
          assert 0<p.stat().st_size<=1000000,'original_result_missing_or_unbounded_requires_readback'
          d=json.loads(p.read_bytes())
          if not isinstance(d.get('results'),list):
              state['state']='requires_original_journals'
              summary.write_text(json.dumps(states))
              raise SystemExit('result_inconclusive_do_not_replay')
          rows=d['results']
          assert d.get('native_run_id')==os.environ['GITHUB_RUN_ID'] and d.get('application_sha')==os.environ['APPLICATION_SHA']
          assert d.get('operation')==item['operation'] and d.get('plan_sha256')==digest
          if item['operation']=='anytour_hotel_transfer_ranked_unreached_v1':
              assert d.get('parent_run_id')==os.environ['GITHUB_REF_NAME'].rsplit('-',1)[1]
          assert len(rows)<=len(item['hotels']) and [r['hotel_id'] for r in rows]==item['hotels'][:len(rows)]
          assert [r['message_id'] for r in rows]==item['messages'][:len(rows)]
          assert d.get('supplier_requests')==d.get('bot_starts')==0
          confirmed=[]
          held=[]
          isolated_transport_loss=False
          public_holds={
              'public_post_missing','public_identity_changed',
              'transfer_source_public_changed','transfer_target_public_changed',
              'transfer_target_keyboard_changed',
          }
          for i,row in enumerate(rows):
              assert row['url']=='https://t.me/anytour/'+item['messages'][i]
              if row.get('ok') is True:
                  assert row['state']=='native_and_registry_verified' and row['provider_write_attempts']==1
                  assert row['hotel_id_verified'] and row['photo_caption_button_verified'] and row['original_message_id_and_date_preserved']
                  confirmed.append(row['hotel_id'])
              else:
                  assert row.get('ok') is False
                  if i!=len(rows)-1:
                      assert (os.environ['GITHUB_REF'] in {'refs/heads/ops/anytour-hotel-ranked-37-continue-20261123','refs/heads/ops/anytour-hotel-ranked-resume-20261124'}
                              or os.environ['GITHUB_REF'].startswith(('refs/heads/ops/anytour-hotel-ranked-after-', 'refs/heads/ops/anytour-hotel-ranked-plan-')))
                      rejected=row['state']=='provider_message_id_rejected' and row['provider_write_attempts']==1
                      stale=(row['state']=='held_before_provider' and row.get('reason')=='transfer_source_revision_advanced'
                             and row['provider_write_attempts']==0 and ('reserved_publication_id' not in row
                             or (row.get('source_revision_hold_recorded') is True and type(row['reserved_publication_id']) is int
                             and row['reserved_publication_id']>0)))
                      isolated=(not isolated_transport_loss and row['state']=='response_saved_completion_requires_readback'
                                and row.get('reason')=='hotel_transfer_response_unconfirmed'
                                and row['provider_write_attempts']==1 and row.get('shared_access_rechecked') is True)
                      local_hold=(row['state']=='held_before_provider' and row['provider_write_attempts']==0
                                  and 'reserved_publication_id' not in row and row.get('reason') in {
                                  'transfer_target_identity_exists','transfer_hotel_already_in_large_channel','transfer_target_editor_busy',
                                  'transfer_ranked_source_offer_changed','transfer_ranked_target_in_use'} | public_holds)
                      prior=(row['state']=='held_before_provider' and row['provider_write_attempts']==0
                             and row.get('reason') in {'transfer_current_run_journal_requires_readback','transfer_previous_run_journal_requires_readback'}
                             and (row.get('reason')!='transfer_previous_run_journal_requires_readback' or os.environ['GITHUB_REF']=='refs/heads/ops/anytour-hotel-ranked-resume-20261124')
                             and row.get('prior_terminal_state') in {'native_and_registry_verified','provider_message_id_rejected','response_saved_completion_requires_readback'}
                             and len(row.get('prior_journal_sha256',''))==64
                             and all(ch in '0123456789abcdef' for ch in row['prior_journal_sha256']))
                      prewrite=(row['state']=='held_before_provider' and row['provider_write_attempts']==0
                                and row.get('reason') in public_holds and row.get('local_prewrite_hold_recorded') is True
                                and type(row.get('reserved_publication_id')) is int and row['reserved_publication_id']>0)
                      previous_target=(os.environ['GITHUB_REF'].startswith('refs/heads/ops/anytour-hotel-ranked-plan-')
                                       and row['state']=='held_before_provider' and row['provider_write_attempts']==0
                                       and 'reserved_publication_id' not in row and row.get('reason')=='transfer_previous_operation_do_not_replay')
                      assert rejected or stale or isolated or local_hold or prior or prewrite or previous_target,'nonlocal_error_must_end_batch'
                      isolated_transport_loss |= isolated
                  held.append({k:row[k] for k in ('hotel_id','message_id','state','reason','reserved_publication_id',
                      'provider_write_attempts','shared_access_rechecked','shared_access_error','prior_journal_sha256','prior_terminal_state','prior_public_readback_verified','prior_readback_reason','local_prewrite_hold_recorded') if k in row})
          assert d.get('provider_write_attempts')==sum(r['provider_write_attempts'] for r in rows)
          ok=status==0 and d.get('ok') is True and confirmed==item['hotels'] and not held
          state.update(state='complete' if ok else 'partial_requires_readback',confirmed=confirmed,held=held,unreached=item['hotels'][len(rows):])
          if d.get('state')=='not_started_editor_busy':
              assert os.environ['GITHUB_REF'].startswith('refs/heads/ops/anytour-hotel-ranked-plan-') and status==2
              assert d.get('ok') is False and d.get('reason')=='transfer_content_editor_busy' and rows==[] and d['provider_write_attempts']==0
              state.update(state='not_started_editor_busy',reason=d['reason'])
          summary.write_text(json.dumps(states))
          print(json.dumps(state))
          if not ok:
              raise SystemExit('held_or_partial_do_not_replay')
          PY
          done < "$RUNNER_TEMP/ranked-digests"
      - name: Save the original sanitized transfer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-hotel-ranked-46-transfer
          path: pub/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/ranked-parent.json"
