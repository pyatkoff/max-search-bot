name: Temporary unresolved source contract fix

on:
  push:
    branches:
      - autopilot/unresolved-source-visibility

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[source-contract-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/unresolved-source-visibility
          fetch-depth: 0
      - name: Update shared Workspace regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/run_manager_workspace_v2_regression.php')
          s=p.read_text()
          old="strpos($ui,'c.origin_label')!==false"
          new="strpos($ui,'originText(c)')!==false"
          if s.count(old)!=1: raise SystemExit(f'contract anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/autopilot-unresolved-source-contract-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/run_manager_workspace_v2_regression.php .github/workflows/autopilot-unresolved-source-contract-fix.yml
          git commit -m "Update Workspace source projection contract [source-contract-fixed]"
          git push origin HEAD:autopilot/unresolved-source-visibility
