name: Adopt the already approved Apple catalogue on exact PR1712
on:
  push:
    branches: [ops/adopt-approved-apple-catalogue-1712-20261127]
    paths: ['.github/workflows/adopt-approved-apple-catalogue-1712.yml']
permissions:
  contents: read
jobs:
  adopt:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '7243c698598a1fa9d8cd935ce05df3758d21ec7c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Select the same 15 approved entries and verify both catalogue readers
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          trap 'rm -f -- "$key_file"' EXIT
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s -- 7243c698598a1fa9d8cd935ce05df3758d21ec7c' <<'REMOTE'
          set -euo pipefail
          app=/var/www/anytoour/data/www/app.anytoour.ru
          cd -P "$app"
          app="$(pwd -P)"
          expected_app="$1"
          approved=898a8550075eb9d52658cf8ad6de7ae35fa6cb11f1fa4a0dd075d709e6ab7f03
          data=resources/appleservice39-pilot-entries.json
          reader=services/AppleService39PilotCatalog.php
          release_root=../max-search-bot-private-logs/appleservice39-catalogue-releases
          operation=apple-adopt-898a8550-20261127
          test "$(git rev-parse HEAD)" = "$expected_app"
          git diff --quiet
          git diff --cached --quiet
          test ! -L "$release_root/current" -a ! -e "$release_root/current"
          test ! -L "$release_root/pending.json" -a ! -e "$release_root/pending.json"
          test "$(sha256sum "$data" | cut -d' ' -f1)" = "$approved"
          reader_pin="$(sha256sum "$reader" | cut -d' ' -f1)"
          catalogue_probe() {
            php -r '
              require "services/AppleService39PilotCatalog.php";
              $rows = AppleService39PilotCatalog::entries();
              if (count($rows) !== 15) exit(1);
              foreach ($rows as $row) {
                $max = AppleService39PilotCatalog::resolve(AppleService39PilotCatalog::PROJECT,
                  AppleService39PilotCatalog::BOT, $row["start_payload"]);
                $telegram = AppleService39PilotCatalog::landingEntryForPost($row["post_id"]);
                if ($max !== $row || $telegram !== $row) exit(1);
              }
              echo hash("sha256",json_encode($rows,JSON_THROW_ON_ERROR));
            '
          }
          other_versions() {
            sha256sum knowledge/hotels/catalogue.json manager/assets/workspace-v2.js "$reader" "$data" || return
            local hotel_pointer=../max-search-bot-private-logs/hotel-catalogue-releases/current
            if [[ -L "$hotel_pointer" ]]; then readlink "$hotel_pointer"; else printf '%s\n' bundled; fi
          }
          before="$(catalogue_probe)"
          [[ "$before" =~ ^[a-f0-9]{64}$ ]]
          other_before="$(other_versions)"
          node tools/appleservice39_catalogue_release.js activate "$app" "$expected_app" bundled "$data" "$approved" "$operation"
          canonical_releases="$(realpath "$release_root")"
          if ! (
            test "$(git rev-parse HEAD)" = "$expected_app" &&
            test "$(catalogue_probe)" = "$before" &&
            test "$(other_versions)" = "$other_before" &&
            test "$(readlink "$release_root/current")" = "$canonical_releases/$approved-$reader_pin" &&
            bash -c 'source tools/deploy_hotel_catalogue_guard.sh; deploy_hotel_catalogue_guard "$PWD" "$1"' check "$expected_app"
          ); then
            node tools/appleservice39_catalogue_release.js rollback "$app" "$expected_app" "$operation" apple-adopt-guard-rollback-20261127
            exit 1
          fi
          printf '%s\n' apple_independent_catalogue_ready_15_same_entries
          REMOTE
