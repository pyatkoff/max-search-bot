name: Confirm public Stella transfer from original 45372514171
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/verify-1672-telegram-public.yml]
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '8809aad881ea7aab6cd2e28cdb974e8770409f50' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3e1a9bdf29dd0d7530fe6b3b393f1286834d092
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring
          coverage: none
      - name: Authenticate the original partial transfer and its exact immutable receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,hashlib,zipfile,io,pathlib
          def api(p):
              return subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=40)
          r=json.loads(api('actions/runs/45372514171'))
          assert r['head_sha']=='e3e1a9bdf29dd0d7530fe6b3b393f1286834d092' and r['head_branch']=='ops/anytour-hotel-prewrite-resume-20261124'
          assert r['event']=='push' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/edit-1566-next-historical-telegram.yml' and r['actor']['login']=='pyatkoff'
          j=json.loads(api('actions/jobs/138370105187'))
          assert j['run_id']==r['id'] and j['name']=='transfer' and j['status']=='completed' and j['conclusion']=='success'
          steps={s['name']:s for s in j['steps']}
          assert steps['Apply the installed editor once and retain its original receipts']['conclusion']=='success'
          assert steps['Save the original sanitized transfer result']['conclusion']=='success'
          a=json.loads(api('actions/artifacts/14909996692'))
          digest='4315c3e1e6b66d11c6a8c413ad886537d0de69ae219e864bf2ffd62a57b27ee4'
          assert not a['expired'] and a['size_in_bytes']==1053 and a['digest']=='sha256:'+digest and a['workflow_run']['id']==r['id']
          b=api('actions/artifacts/14909996692/zip')
          assert len(b)==1053 and hashlib.sha256(b).hexdigest()==digest
          plan='c71a7e945c0978910267ecb729dd25449a45b66e5fa4874c669c7592fae27aab'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert set(z.namelist())=={'plan-check.json','result.json'} and len(z.namelist())==2
              d=json.loads(z.read('result.json'))
          assert d['native_run_id']=='45372514171' and d['application_sha']==r['head_sha'] and d['plan_sha256']==plan
          assert d['operation']=='anytour_hotel_transfer_stella_alternate_20261123' and d['provider_write_attempts']==1
          assert d['supplier_requests']==d['bot_starts']==0
          rows=[x for x in d['results'] if x.get('ok') is True]
          assert [x['hotel_id'] for x in rows]==[466]
          assert [x['message_id'] for x in rows]==['925']
          for x in rows:
              assert x['state']=='native_and_registry_verified' and x['provider_write_attempts']==1
              assert x['hotel_id_verified'] and x['photo_caption_button_verified'] and x['original_message_id_and_date_preserved']
          pathlib.Path('ranked-native-confirmed.json').write_text(json.dumps(rows))
          print('ORIGINAL_RECEIPT_AUTHENTICATED_ONE_STELLA_NO_REPLAY')
          PY
      - name: Read only the confirmed Stella destination post
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'tools/anytour_existing_post_batch.php';
          use function AnyTour\ExistingPostBatch\{requirePost,transferPlanFromBytes,parseTransferPublic,transferReason};
          $digest='c71a7e945c0978910267ecb729dd25449a45b66e5fa4874c669c7592fae27aab';
          $raw=file_get_contents('config/anytour_stella_alternate_20261123.json');
          $plan=transferPlanFromBytes($raw,$digest,$digest);
          $by=[];
          foreach($plan['rows'] as $row)$by[$row['hotel_id']]=$row;
          $native=json_decode(file_get_contents('ranked-native-confirmed.json'),true,64,JSON_THROW_ON_ERROR);
          $results=[];
          foreach($native as $n){
              $r=$by[$n['hotel_id']];
              requirePost($r['target_message_id']===$n['message_id'],'native_target_mismatch');
              $out=['hotel_id'=>$n['hotel_id'],'message_id'=>$n['message_id'],'url'=>$n['url'],
                  'publication_id'=>$n['publication_id'],'version_id'=>$n['version_id'],
                  'native_photo_exact'=>true,'applied'=>false];
              try {
                  $body='';
                  $client=curl_init('https://t.me/s/anytour?before='.((int)$r['target_message_id']+1));
                  curl_setopt_array($client,[CURLOPT_FOLLOWLOCATION=>false,CURLOPT_CONNECTTIMEOUT=>5,
                      CURLOPT_TIMEOUT=>20,CURLOPT_USERAGENT=>'Mozilla/5.0',
                      CURLOPT_WRITEFUNCTION=>static function($c,string $part)use(&$body):int{
                          if(strlen($body)+strlen($part)>1000000)return 0;
                          $body.=$part;return strlen($part);
                      }]);
                  $ok=curl_exec($client);$http=curl_getinfo($client,CURLINFO_HTTP_CODE);curl_close($client);
                  requirePost($ok!==false&&$http===200,'public_history_unavailable');
                  $p=parseTransferPublic($body,'anytour',$r['target_message_id'],$digest);
                  $out['caption']=$p['caption_sha256']===$r['next_caption_sha256'];
                  $out['new_photo']=$p['single_photo']&&$p['photo_marker_sha256']!==$r['target_photo_marker_sha256'];
                  $out['original_date']=$p['published_unixtime']===$r['target_published_unixtime'];
                  $out['visible_button_count']=count($p['buttons']);
                  $out['hotel_button']=count($p['buttons'])===1
                      &&$p['buttons'][0]['hotel_url']===$n['button_url']
                      &&$p['buttons'][0]['text']===$r['button_text'];
                  $out['published_at']=$p['published_at'];
                  $out['html_sha256']=$p['html_sha256'];
                  $out['caption_sha256']=$p['caption_sha256'];
                  $out['button_url_sha256']=count($p['buttons'])===1?$p['buttons'][0]['url_sha256']:null;
                  $out['applied']=$out['caption']&&$out['new_photo']&&$out['original_date']&&$out['hotel_button'];
                  if($out['applied'])$out['verified_at_utc']=gmdate(DATE_ATOM);
              } catch(Throwable $e) {$out['error']=transferReason($e);}
              $results[]=$out;
          }
          $out=['original_run_id'=>'45372514171','application_sha'=>'e3e1a9bdf29dd0d7530fe6b3b393f1286834d092',
              'read_only'=>true,'provider_write_attempts'=>0,'supplier_requests'=>0,'bot_starts'=>0,
              'results'=>$results,'public_verified'=>count(array_filter($results,static fn($r)=>$r['applied'])),
              'unknown_excluded'=>[],'verified_at_utc'=>gmdate(DATE_ATOM)];
          file_put_contents('public-stella-45372514171.json',json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit(count($results)===1&&$out['public_verified']===1?0:1);
          PHP
      - name: Save the exact public readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stella-45372514171-public-readback
          path: public-stella-45372514171.json
          retention-days: 7
          if-no-files-found: warn
