name: Controlled hotel knowledge model comparison

on:
  push:
    branches: [audit/hotel-reference-control-20261025]

permissions:
  contents: read

concurrency:
  group: hotel-reference-controlled-model-check
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_INSTALLED_SHA: 5924fbfc707db1819418c312309ecdb052c4ade7
      EXPECTED_CONTROL_SHA256: 3f58c218d166f247577ee95d2ec75187929014085670818431a6bb425d0dcc8c
    steps:
      - name: Checkout the accepted installed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_INSTALLED_SHA }}
          fetch-depth: 0
      - name: Verify current main and prepare the exact synthetic control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          [[ "$EXPECTED_INSTALLED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_CONTROL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_INSTALLED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_INSTALLED_SHA"
          cat > "$RUNNER_TEMP/control.php" <<'CONTROL_PHP'
          <?php
          declare(strict_types=1);
          
          /**
           * One-shot synthetic model-use comparison, not a customer/selector acceptance.
           * Run only after the exact approved source is installed. No bootstrap or DB.
           */
          ini_set('display_errors', '0');
          error_reporting(0);
          umask(0077);
          
          const APP_ROOT = '/var/www/anytoour/data/www/app.anytoour.ru';
          const CONTROL_SCHEMA = 'hotel_reference_synthetic_model_control_v1';
          const MAX_RECEIPT_BYTES = 65536;
          
          function encoded(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);
          }
          
          function publicFailure(string $reason, string $sha = ''): never
          {
              echo encoded(['schema'=>CONTROL_SCHEMA, 'status'=>'held', 'reason'=>$reason,
                  'expected_installed_sha'=>$sha, 'model_calls_started_this_invocation'=>0, 'automatic_retry_allowed'=>false])."\n";
              exit(2);
          }
          
          /** Bounded fixed command, without a shell or dynamic executable/arguments. */
          function installedSha(): ?string
          {
              $process = proc_open(['git', 'rev-parse', 'HEAD'], [0=>['pipe','r'],1=>['pipe','w'],2=>['pipe','w']], $pipes, APP_ROOT);
              if (!is_resource($process)) return null;
              fclose($pipes[0]);
              $value = stream_get_contents($pipes[1], 128); fclose($pipes[1]);
              stream_get_contents($pipes[2], 1024); fclose($pipes[2]);
              $status = proc_close($process);
              $sha = trim(is_string($value) ? $value : '');
              return $status === 0 && preg_match('/\A[a-f0-9]{40}\z/D', $sha) === 1 ? $sha : null;
          }
          
          /** Flush the attempt marker before each possible paid call; never retry it. */
          function saveReceipt($stream, array $receipt): void
          {
              $bytes = encoded($receipt)."\n";
              if (strlen($bytes) > MAX_RECEIPT_BYTES || !rewind($stream) || !ftruncate($stream, 0)
                  || fwrite($stream, $bytes) !== strlen($bytes) || !fflush($stream)
                  || (function_exists('fsync') && !fsync($stream))) throw new RuntimeException('receipt_write_failed');
          }
          
          $expected = $argv[1] ?? '';
          if (count($argv) !== 2 || !is_string($expected) || preg_match('/\A[a-f0-9]{40}\z/D', $expected) !== 1) publicFailure('invalid_expected_sha');
          if (realpath((string)getcwd()) !== realpath(APP_ROOT) || installedSha() !== $expected) publicFailure('installed_source_mismatch', $expected);
          
          $directory = '/tmp/anytour-hotel-model-control';
          if (!file_exists($directory) && !mkdir($directory, 0700)) publicFailure('private_directory_unavailable', $expected);
          $stat = @lstat($directory);
          if (!is_array($stat) || ($stat['mode'] & 0170000) !== 0040000 || ($stat['mode'] & 0777) !== 0700
              || (function_exists('posix_geteuid') && $stat['uid'] !== posix_geteuid())) publicFailure('private_directory_invalid', $expected);
          
          $path = $directory.'/'.$expected.'.json';
          $stream = @fopen($path, 'x');
          if (!is_resource($stream)) publicFailure('existing_or_unavailable_receipt_do_not_repeat', $expected);
          if (!chmod($path, 0600) || !flock($stream, LOCK_EX | LOCK_NB)) { fclose($stream); publicFailure('private_receipt_unavailable', $expected); }
          
          $receipt = ['schema'=>CONTROL_SCHEMA, 'status'=>'claimed_before_model_calls', 'installed_sha'=>$expected,
              'started_at_utc'=>gmdate('Y-m-d\TH:i:s\Z'), 'model_calls_started'=>0, 'automatic_retry_allowed'=>false,
              'scope'=>'Synthetic frozen transcript and synthetic trusted capability only; no real customer, native inquiry or UI acceptance.',
              'results'=>[]];
          
          try {
              saveReceipt($stream, $receipt);
              // The installed config contains definitions. Suppress accidental output;
              // neither it nor runtime/database bootstrap is copied or returned.
              ob_start();
              try { require APP_ROOT.'/config.php'; }
              finally { ob_end_clean(); }
              require APP_ROOT.'/services/ManagerAiDraftService.php';
          
              $context = ['conversation_id'=>900001, 'as_of_message_id'=>903, 'history_incomplete'=>false,
                  'media_unread'=>false, 'selections_link_unread'=>false, 'messages'=>[
                      ['id'=>901, 'sender_type'=>'customer', 'event_type'=>'message',
                          'text'=>'Нас двое взрослых и ребёнок 8 лет. Смотрим Family Suite в SUNRISE Arabian Beach Resort. Между спальнями есть запираемая дверь? Есть ли окно в детской спальне? Подтверждено ли, что ребёнка поселят в этот номер?'],
                      ['id'=>902, 'sender_type'=>'manager', 'event_type'=>'message',
                          'text'=>'В подборке есть вариант Family Suite. Условия выбранного тарифа ещё требуют проверки.'],
                      ['id'=>903, 'sender_type'=>'customer', 'event_type'=>'unknown',
                          'text'=>'Обращение из веб-подборки · вариант 1: SUNRISE ARABIAN BEACH RESORT 5★'],
                  ]];
              $selector = ['project_key'=>'anytour',
                  'source_identity'=>['adapter'=>'tourvisor-snapshot-v1','hotel'=>'9374','country'=>'1'],
                  'selected_hotel'=>'SUNRISE ARABIAN BEACH RESORT', 'selected_room'=>'Family Suite',
                  'provenance'=>['message_id'=>903, 'event_id'=>990001,
                      'publication_sha256'=>hash('sha256','explicitly-synthetic-publication-v1'),
                      'source_sha256'=>hash('sha256','explicitly-synthetic-source-v1')]];
              $hotel = ManagerHotelKnowledge::capture($selector, time());
              if (($hotel['status'] ?? null) !== 'available' || count($hotel['facts'] ?? []) !== 3
                  || count($hotel['sources'] ?? []) !== 3 || ($hotel['hotel_ref'] ?? null) !== ['catalog'=>'anytour','id'=>1554]) {
                  throw new RuntimeException('accepted_group_unavailable');
              }
              $class = new ReflectionClass(ManagerAiDraftReferenceContext::class);
              $reference = $class->newInstanceWithoutConstructor();
              $binding = (new ReflectionMethod(ManagerAiDraftReferenceContext::class,'binding'))->invoke(null,$context);
              $class->getConstructor()->invoke($reference, $binding, ['hotel_reference'=>$hotel]);
              $baseline = ManagerAiDraftService::prepareInput($context);
              $candidate = ManagerAiDraftService::prepareInput($context,null,null,$reference);
              if (!isset($baseline['context'],$candidate['context']) || ($baseline['preflight'] ?? null) !== null
                  || ($candidate['preflight'] ?? null) !== null || !empty($baseline['images']) || !empty($candidate['images'])
                  || ($candidate['context']['hotel_reference']['status'] ?? null) !== 'available') throw new RuntimeException('prepared_input_unavailable');
              $plainCandidate = $candidate['context']; unset($plainCandidate['hotel_reference']);
              if ($plainCandidate !== $baseline['context']) throw new RuntimeException('non_hotel_context_difference');
          
              $receipt['frozen_context'] = $context;
              $receipt['frozen_context_sha256'] = hash('sha256', encoded($context));
              $receipt['selector_kind'] = 'explicitly_synthetic_capability_not_native_SQL_proof';
              $receipt['bundle_sha256'] = hash_file('sha256', APP_ROOT.'/knowledge/hotels/anytour-1554-family-suite.json');
              $receipt['binding_revision'] = $hotel['binding_revision'];
              $receipt['knowledge_revision'] = $hotel['knowledge_revision'];
              $receipt['hotel_policy_sha256'] = hash('sha256', ManagerHotelKnowledge::instructions());
              $receipt['candidate_claim_ids'] = array_column($hotel['facts'],'id');
              $receipt['candidate_source_ids'] = array_column($hotel['sources'],'id');
              $receipt['candidate_admission'] = $candidate['hotel_reference_admission'];
              $receipt['status'] = 'preflight_complete';
              saveReceipt($stream, $receipt);
          
              foreach (['before'=>null, 'after'=>$reference] as $arm=>$capability) {
                  $prepared = $arm === 'before' ? $baseline : $candidate;
                  $instructions = ManagerAiDraftService::instructions($prepared['context']);
                  $body = ManagerDraftClient::requestBody($instructions,$prepared['context'],[]);
                  if (($body['model'] ?? null) !== 'gpt-6.1-sol' || ($body['reasoning']['effort'] ?? null) !== 'low'
                      || ($body['service_tier'] ?? null) !== 'default' || ($body['store'] ?? null) !== false
                      || strlen(encoded($body)) > ManagerDraftClient::MAX_REQUEST_BYTES || installedSha() !== $expected) {
                      throw new RuntimeException('effective_profile_or_source_mismatch');
                  }
                  $receipt['status'] = 'model_call_started_outcome_unknown';
                  $receipt['model_calls_started']++;
                  $receipt['results'][$arm] = ['state'=>'started_outcome_unknown',
                      'request_sha256'=>hash('sha256', encoded($body)),
                      'instructions_sha256'=>hash('sha256',$instructions),
                      'requested_profile'=>['model'=>$body['model'],'reasoning'=>$body['reasoning'],'service_tier'=>$body['service_tier'],'store'=>$body['store']],
                      'model_metadata'=>null];
                  saveReceipt($stream, $receipt);
                  $metadata = null;
                  $started = microtime(true);
                  $result = ManagerAiDraftService::generate($context,
                      static function(string $policy,array $payload,array $images) use (&$metadata,$body):array {
                          if (ManagerDraftClient::requestBody($policy,$payload,$images) !== $body) return ['_error'=>'provider_unavailable'];
                          return ManagerDraftClient::requestJson($policy,$payload,static function(array $value) use (&$metadata):void { $metadata=$value; },$images);
                      },null,null,$capability);
                  $receipt['results'][$arm] += ['duration_ms'=>(int)round((microtime(true)-$started)*1000)];
                  $receipt['results'][$arm]['state'] = !empty($result['ok']) ? 'validated_response' : 'error_or_unknown';
                  $receipt['results'][$arm]['model_metadata'] = $metadata;
                  $receipt['results'][$arm]['validated_result_or_safe_error'] = $result;
                  $receipt['results'][$arm]['installed_sha_after_call'] = installedSha();
                  $receipt['status'] = 'arm_finished';
                  saveReceipt($stream,$receipt);
                  if ($receipt['results'][$arm]['installed_sha_after_call'] !== $expected) throw new RuntimeException('installed_source_changed');
                  if (empty($result['ok'])) throw new RuntimeException('arm_not_validated_do_not_continue');
              }
              $receipt['status'] = 'control_completed_requires_independent_content_review';
              $receipt['finished_at_utc'] = gmdate('Y-m-d\TH:i:s\Z');
              $receipt['model_use_accepted'] = null;
              $receipt['natural_customer_or_UI_confirmation'] = false;
              saveReceipt($stream,$receipt);
              echo encoded($receipt)."\n";
          } catch (Throwable $ignored) {
              // A call already marked started stays unknown unless its response was saved.
              // Do not expose provider bodies, configuration, exception text or stack traces.
              $receipt['status'] = 'control_stopped_no_automatic_retry';
              $receipt['finished_at_utc'] = gmdate('Y-m-d\TH:i:s\Z');
              try { saveReceipt($stream,$receipt); } catch (Throwable $alsoIgnored) {}
              echo encoded($receipt)."\n";
              exit(2);
          } finally {
              flock($stream,LOCK_UN);
              fclose($stream);
          }
          CONTROL_PHP
          test "$(sha256sum "$RUNNER_TEMP/control.php" | cut -d' ' -f1)" = "$EXPECTED_CONTROL_SHA256"
          chmod 600 "$RUNNER_TEMP/control.php"
      - name: Prepare the existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Canonical SSH identity unavailable'; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Check installed source and perform at most two unsent synthetic model calls
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          # Only the separately reviewed synthetic program goes to a mode-0600
          # temporary file. No application, config or database data is copied.
          remote_script="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; cd '$root'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_INSTALLED_SHA'; git diff --quiet; git diff --cached --quiet; mktemp /tmp/hotel-reference-control-$EXPECTED_INSTALLED_SHA.XXXXXX.php")"
          [[ "$remote_script" =~ ^/tmp/hotel-reference-control-[a-f0-9]{40}\.[A-Za-z0-9]{6}\.php$ ]]
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; cat > '$remote_script'; chmod 600 '$remote_script'; test \"\$(sha256sum '$remote_script' | cut -d' ' -f1)\" = '$EXPECTED_CONTROL_SHA256'" < "$RUNNER_TEMP/control.php"
          set +e
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; cd '$root'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_INSTALLED_SHA'; git diff --quiet; git diff --cached --quiet; php '$remote_script' '$EXPECTED_INSTALLED_SHA' 2>/dev/null" > "$RUNNER_TEMP/hotel-model-control.json"
          status=$?
          set -e
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/control.php"
          # Provider errors/outcome-unknown must remain visible, not retried.
          python3 - "$RUNNER_TEMP/hotel-model-control.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.stat().st_size > 65536:
              raise SystemExit('Synthetic receipt exceeds approved bound')
          d = json.loads(p.read_text())
          assert d['schema'] == 'hotel_reference_synthetic_model_control_v1'
          assert d.get('model_calls_started', 0) <= 2
          print(json.dumps({'status': d['status'], 'calls_started': d.get('model_calls_started', 0), 'automatic_retry_allowed': False}))
          PY
          exit "$status"
      - name: Preserve the synthetic-only result for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-model-control-${{ env.EXPECTED_INSTALLED_SHA }}
          path: ${{ runner.temp }}/hotel-model-control.json
          if-no-files-found: warn
          retention-days: 7
