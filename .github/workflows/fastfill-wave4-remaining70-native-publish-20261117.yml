          rd=api('actions/runs/44135479839')
          assert rd['head_sha']=='1ae1426be5140e830aac037b5a192a64f1260f07' and rd['run_attempt']==1 and rd['conclusion']=='success'
          ar=api('actions/artifacts/14352400936')
          assert not ar['expired'] and ar['workflow_run']['id']==44135479839 and ar['digest']=='sha256:68b6b7b15b785452bff436893c754d2434e574d2686188e2c8cc02364c9c3ce9'
          rb=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14352400936/zip'],timeout=90)
          assert hashlib.sha256(rb).hexdigest()=='68b6b7b15b785452bff436893c754d2434e574d2686188e2c8cc02364c9c3ce9'
          with zipfile.ZipFile(io.BytesIO(rb)) as z:
