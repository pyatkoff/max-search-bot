name: Autopilot origin entry channel
on:
  push:
    branches: [autopilot/origin-entry-channel-label]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/origin-entry-channel-label
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply bounded patch and regression
        run: php tools/patch_origin_entry_channel.php
      - name: Commit source changes and remove helper
        run: |
          rm tools/patch_origin_entry_channel.php .github/workflows/autopilot-origin-entry-channel.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/ManagerConversationService.php services/ManagerLeadInboxService.php manager/pipeline-api.php tests/run_manager_workspace_v2_origin_regression.php tools/patch_origin_entry_channel.php .github/workflows/autopilot-origin-entry-channel.yml
          git commit -m "Surface entry channel in manager origin labels"
          git push origin HEAD:autopilot/origin-entry-channel-label
