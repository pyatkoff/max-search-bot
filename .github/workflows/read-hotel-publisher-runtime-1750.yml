name: Read installed hotel publisher runtime for PR1750
on:
  push:
    branches: [ops/read-hotel-publisher-runtime-1750-20261127]
    paths: ['.github/workflows/read-hotel-publisher-runtime-1750.yml']
permissions:
  contents: read
jobs:
  publisher-runtime:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'bdc596e797992bf50de409f9ff6e094a4ccfd623' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the installed publisher runtime
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          trap 'rm -f -- "$key_file"' EXIT
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s -- bdc596e797992bf50de409f9ff6e094a4ccfd623' <<'REMOTE'
          set -euo pipefail
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$1"
          command -v node >/dev/null || { echo hotel_publisher_runtime_node_missing; exit 1; }
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 16) process.exit(1)'
          node --check tools/hotel_catalogue_release.js
          php -r 'require "services/ManagerHotelKnowledge.php"; exit(is_callable([ManagerHotelKnowledge::class, "validateReleaseAdditions"]) ? 0 : 1);'
          command -v flock >/dev/null
          releases="../max-search-bot-private-logs/hotel-catalogue-releases"
          test -d "$releases" -a -w "$releases"
          test -f "$releases/operation.lock" -a ! -L "$releases/operation.lock"
          test ! -e "$releases/pending.json" -a ! -L "$releases/pending.json"
          printf '%s\n' 'hotel_publisher_runtime_ready'
          REMOTE
