name: Read bounded Metrika queue clock metadata
on:
  push:
    branches: [audit/metrika-clock-metadata-20261026]
permissions:
  contents: read
concurrency:
  group: anytour-metrika-clock-metadata
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin current installed main before credentials
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = '6010fd982619ceeb3dbfa609308468a241966806'
      - name: Prepare existing canonical SSH credential
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read aggregate queue clock metadata only
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
           chdir('/var/www/anytoour/data/www/app.anytoour.ru');
           require_once 'config.php';
           $now=time();$out=['ok'=>true,'available'=>true,'mode'=>'read_only','cli_timezone'=>date_default_timezone_get(),'ini_timezone'=>(string)ini_get('date.timezone'),'observed_at_utc'=>gmdate('Y-m-d\\TH:i:s\\Z',$now),'files'=>[],'rows_read'=>0,'bytes_read'=>0,'writes'=>0,'api_calls'=>0];
           $paths=['queue'=>'metrika_offline_queue.csv','processing'=>'metrika_offline_processing.csv'];$before=[];
           foreach($paths as$kind=>$path){clearstatcache(true,$path);if(is_link($path))throw new RuntimeException('unsafe');$s=@stat($path);$before[$kind]=$s?[$s['ino'],$s['size'],$s['mtime']]:null;if($s&&$s['size']>65536)throw new RuntimeException('bound');}
           foreach($paths as$kind=>$path){
            $s=$before[$kind];if(!$s){$out['files'][$kind]=['status'=>'missing'];continue;}
            if($out['bytes_read']+$s[1]>65536)throw new RuntimeException('bound');
            $h=fopen($path,'rb');if(!$h||!flock($h,LOCK_SH|LOCK_NB))throw new RuntimeException('busy');
            try {
             $st=fstat($h);if([$st['ino'],$st['size'],$st['mtime']]!==$s)throw new RuntimeException('changed');
             $raw=$s[1]?fread($h,$s[1]):'';if(strlen($raw)!==$s[1])throw new RuntimeException('changed');$out['bytes_read']+=strlen($raw);
             $f=fopen('php://temp','r+');fwrite($f,$raw);rewind($f);
             $v=['status'=>'read','rows'=>0,'data_rows'=>0,'future_rows'=>0,'invalid_rows'=>0,'formats'=>[],'first_future_line'=>null,'maximum_future_seconds'=>null,'minimum_age_seconds'=>null];
             while(($row=fgetcsv($f))!==false){
              if(++$out['rows_read']>100)throw new RuntimeException('bound');$v['rows']++;
              $date=trim((string)($row[2]??''));if($date===''||strcasecmp($date,'DateTime')===0)continue;
              $v['data_rows']++;$numeric=preg_match('/^\\d{9,12}$/',$date)===1;
              $format=$numeric?'numeric_epoch':(preg_match('/^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$/',$date)?'naive_wall_clock':'other');
              $v['formats'][$format]=($v['formats'][$format]??0)+1;
              $at=$numeric?(int)$date:strtotime($date);
              if($at===false||$at<=0){$v['invalid_rows']++;continue;}
              $age=$now-$at;$v['minimum_age_seconds']=$v['minimum_age_seconds']===null?$age:min($v['minimum_age_seconds'],$age);
              if($at>$now){$v['future_rows']++;$v['first_future_line']=$v['first_future_line']??$v['rows'];$v['maximum_future_seconds']=max($v['maximum_future_seconds']??0,$at-$now);}
             }fclose($f);$out['files'][$kind]=$v;
            }finally{flock($h,LOCK_UN);fclose($h);}
           }
           foreach($paths as$kind=>$path){clearstatcache(true,$path);$s=@stat($path);$after=$s?[$s['ino'],$s['size'],$s['mtime']]:null;if($after!==$before[$kind])throw new RuntimeException('changed');}
           echo json_encode($out,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }catch(Throwable $e){echo json_encode(['ok'=>true,'available'=>false,'reason'=>in_array($e->getMessage(),['bound','busy','changed','unsafe'],true)?$e->getMessage():'unavailable','automatic_retry'=>false,'writes'=>0,'api_calls'=>0]).PHP_EOL;}
          
          PHP
          opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          dir="/tmp/anytour-metrika-clock-${GITHUB_RUN_ID}"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; umask 077; mkdir '$dir'; chmod 700 '$dir'"
          trap 'ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$dir/read.php\"; rmdir \"$dir\"" >/dev/null 2>&1 || true' EXIT
          scp "${opts[@]}" "$RUNNER_TEMP/read.php" "$DEPLOY_USER@$DEPLOY_HOST:$dir/read.php"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '6010fd982619ceeb3dbfa609308468a241966806'; php -d display_errors=0 '$dir/read.php'; test \"\$(git rev-parse HEAD)\" = '6010fd982619ceeb3dbfa609308468a241966806'"
      - name: Remove runner credential and temporary audit code
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/read.php"
