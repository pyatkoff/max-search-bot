name: One-shot W4 correct2 reviewed covers with original composer; no sends
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-wave4-cover-adjust-20261117.yml']
permissions:
  contents: write
jobs:
  original-source-cover-adjust:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' &&
      github.event.before == '5f0f2d78eb97f051a34f4fedb98e5cf33fc58a55' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
            .github/traffic-publish/brand
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 requests==2.32.5
      - name: Recompose only two exact same-property covers; do not call publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,runpy,subprocess
          from PIL import Image,ImageDraw
          CHOICES=json.loads(r'''[{"id":22718,"indices":[0,7,2],"row":{"work_id":"W4_001","tourvisor_id":22718,"native_tourvisor_id":22718,"expected_name":"AVANI+ MAI KHAO PHUKET SUITES & VILLAS","provider_name":"AVANI+ MAI KHAO PHUKET SUITES & VILLAS","provider_country":"Таиланд","country":"TH","country_id":2,"region":"Пхукет","region_id":8,"category":5,"rating":4.9,"source_catalogue_url":"https://anytoour.ru/data/hotel-search-v1.php?q=Avani&countryId=2&limit=20","source_api_url":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=22718","hotel":"Avani+ Mai Khao Phuket Suites & Villas","aliases":["Avani+ Mai Khao Phuket Suites & Villas","AVANI+ MAI KHAO PHUKET SUITES & VILLAS"],"editorial_hold":null,"first_photo_urls":["https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601550.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601551.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601552.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601553.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601554.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601555.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601556.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/anantara-vacation-club-102601557.jpg"]}},{"id":47213,"indices":[4,6,7],"row":{"work_id":"W4_053","tourvisor_id":47213,"native_tourvisor_id":47213,"expected_name":"CHIANG MAI MARRIOTT (EX. LE MERIDIEN CHIANG MAI)","provider_name":"CHIANG MAI MARRIOTT (EX. LE MERIDIEN CHIANG MAI)","provider_country":"Таиланд","country":"TH","country_id":2,"region":"Чианг Май","region_id":519,"category":5,"rating":0,"source_catalogue_url":"https://anytoour.ru/data/hotel-search-v1.php?q=Le+Meridien&countryId=2&limit=20","source_api_url":"https://anytoour.ru/api-v2.php?action=hotel_details&hotelId=47213","hotel":"Chiang Mai Marriott Hotel","aliases":["Chiang Mai Marriott Hotel","CHIANG MAI MARRIOTT","LE MERIDIEN CHIANG MAI"],"editorial_hold":null,"first_photo_urls":["https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-8.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-0.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-1.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-2.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-3.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-4.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-5.jpg","https://static.tourvisor.ru/hotel_pics/verybig/2/le-meridien-chiang-mai-6.jpg"]}}]''')
          HEAD=os.environ['GITHUB_SHA'];REPO='pyatkoff/max-search-bot';PREFIX='.github/traffic-publish/commercial-wave4-100-20261117/'
          def api(method,path,obj=None):
              c=['gh','api','--method',method,'repos/'+REPO+'/'+path]
              if obj is not None:c+=['--input','-']
              return json.loads(subprocess.check_output(c,input=None if obj is None else json.dumps(obj).encode(),timeout=60))
          raw=base64.b64decode(api('GET','git/blobs/7b54b837d565823c9b8fe4d2e0dd3f7c777d3033')['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='7b54b837d565823c9b8fe4d2e0dd3f7c777d3033'
          rec=json.loads(raw);assert rec['prepared_count']==81 and rec['held_count']==19 and len(rec['rows'])==100
          source='tools/direct_demand/operations/prepare-wave2-native-tourvisor-covers-20261117.py'
          assert subprocess.check_output(['git','hash-object',source],text=True).strip()=='1d084059cd9ed24783fa7355acde9fddba992559'
          m=runpy.run_path(source);logo_raw=pathlib.Path('.github/traffic-publish/brand/anytour-logo-white.png').read_bytes();assert hashlib.sha256(logo_raw).hexdigest()==m['LOGO_SHA256']
          logo=Image.open(io.BytesIO(logo_raw)).convert('RGBA');root=pathlib.Path('cover-adjust');root.mkdir();changes=[]
          canvas=Image.new('RGB',(1080,580),'white');draw=ImageDraw.Draw(canvas)
          for n,c in enumerate(CHOICES):
              r=c['row'];hid=c['id'];prior=next(x for x in rec['rows'] if x['id']==hid);assert prior['status']=='prepared_needs_visual_acceptance' and not prior['send_allowed']
              assert len(c['indices'])==len(set(c['indices']))==3;images=[];sources=[]
              for i in c['indices']:
                  url=r['first_photo_urls'][i];assert m['check_photo_url'](url)==r['country_id']
                  im,proof=m['download_photo'](url);images.append(im);sources.append(proof)
              b=m['encode_png'](m['draw_cover'](r['hotel'],images,logo.copy()));(root/(str(hid)+'.png')).write_bytes(b)
              change={'id':hid,'original_png_sha256':prior['png_sha256'],'selected_original_gallery_indices':c['indices'],'original_photo_sources':prior['photo_sources'],'corrected_png_sha256':hashlib.sha256(b).hexdigest(),'photo_sources':sources,'reason':'same_property_non_generic_current_brand_neutral_images_after_visual_review'}
              prior['png_sha256']=change['corrected_png_sha256'];prior['bytes']=len(b);prior['photo_sources']=sources;prior['visual_source_correction']=change;changes.append(change)
              draw.text((n*540+7,7),'TV'+str(hid)+' CORRECTED',font=m['font'](18),fill='black')
              with Image.open(io.BytesIO(b)) as im:canvas.paste(im.convert('RGB').resize((540,540),Image.Resampling.LANCZOS),(n*540,32))
          canvas.save(root/'qa-corrected-2.jpg',quality=94)
          rec['qa_corrections']=[{'path':PREFIX+'qa-corrected-2.jpg','ids':[c['id'] for c in CHOICES]}]
          (root/'cover-receipt.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          (root/'photo-correction-receipt.json').write_text(json.dumps({'state':'TWO_RECOMPOSED_COVERS_PENDING_FINAL_VISUAL_ACCEPTANCE','original_profile_cover_commit':'d865a543817ee5806c4565fbcb53fab5f69dad23','original_cover_receipt_git_blob':'7b54b837d565823c9b8fe4d2e0dd3f7c777d3033','gallery_review_run':44130549530,'changes':changes,'provider_profile_calls':0,'native_sends':0},ensure_ascii=False,indent=2)+'\n')
          assert api('GET','git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==HEAD
          parent=api('GET','git/commits/'+HEAD);entries=[]
          for f in root.iterdir():
              b=f.read_bytes();blob=api('POST','git/blobs',{'content':base64.b64encode(b).decode(),'encoding':'base64'});entries.append({'path':PREFIX+f.name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('POST','git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('POST','git/commits',{'message':'HOTEL W4: recompose2 exact licensed same-property covers after visual review; no posts','tree':tree['sha'],'parents':[HEAD]})
          print('W4_COVER_ADJUST_STAGE_JSON '+json.dumps({'source_commit':HEAD,'staged_commit':commit['sha'],'files':entries,'corrected_ids':[c['id'] for c in CHOICES],'prepared_count':81,'held_count':19,'native_sends':0},separators=(',',':')))
          PY
      - name: Preserve exact correction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastfill-wave4-two-corrected-covers-20261117
          path: cover-adjust/*
          retention-days: 30
          if-no-files-found: warn
