name: Manager question census (one-shot aggregate-only)

on:
  push:
    branches: [diagnose/manager-question-census-780-20260921]

permissions:
  contents: read
  actions: read

concurrency:
  group: manager-question-census-780-20260921
  cancel-in-progress: false

jobs:
  census:
    if: github.repository == 'pyatkoff/max-search-bot' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: c1235a1f99519f45033edb521d117233a4207fb4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify diagnostic source and offline behavior
        shell: bash
        run: |
          set -euo pipefail
          echo 'c688cb9de8fe4b581ceb13ded55e795e062d3b1ffa5e92fa726dfcee86038a1c  tools/manager_question_census.php' | sha256sum -c -
          php -l tools/manager_question_census.php
          php tests/run_manager_question_census_regression.php
      - name: Require exact current main and fresh successful production capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/diagnostics:refs/remotes/origin/diagnostics
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git show refs/remotes/origin/diagnostics:autopilot_snapshot.json > "$RUNNER_TEMP/preflight.json"
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.request
          sha=os.environ['EXPECTED_MAIN_SHA']
          j=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'preflight.json').read_text())
          assert j['production']['sha']==sha and j['ok'] is True
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(j['generated_at'])
          assert -300 <= age.total_seconds() <= 3600
          assert j['migrations']['pending']==0 and j['migrations']['checksum_failures']==0
          for key in ('manager_visibility_ok','manager_lead_detail_ok','handoff_integrity_ok','admin_project_access_ok','website_attribution_ok'):
              assert j['health'][key] is True
          # Human-response/no-subscription warnings are not silently relabelled green.
          for run in (35597473302,35597473479,35597473282,35597473262,35597659355):
              req=urllib.request.Request(f'https://api.github.com/repos/pyatkoff/max-search-bot/actions/runs/{run}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=15) as response: r=json.load(response)
              assert r['head_sha']==sha and r['status']=='completed' and r['conclusion']=='success'
          print('Exact-main production preflight passed')
          PY
      - name: Read aggregate census without server file or data writes
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/census_key"
          trap 'rm -f "$key_file"' EXIT
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          unset raw DEPLOY_SSH_KEY_VALUE
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          # Program arrives over stdin; it is not copied to the checkout or webroot.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/anytoour/data/www/app.anytoour.ru && MANAGER_QUESTION_CENSUS_COLLECT=1 php -d display_errors=0 -d log_errors=0" < tools/manager_question_census.php > "$RUNNER_TEMP/manager-question-census.json"
      - name: Validate output allowlist before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'manager-question-census.json')
          assert p.stat().st_size < 32768
          j=json.loads(p.read_text())
          assert set(j)==set('ok schema_version generated_at production_sha window basis method early_basis prior_mentions_are_not_confirmed_answers read_only transcripts_exported conversation_limit message_limit selected_conversations conversation_cap_reached excluded channels'.split())
          assert j['ok'] is True and j['schema_version']==1 and j['production_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert j['basis']=='new_non_test_conversations_with_recorded_manager_message_before_cutoff'
          assert j['method']=='fixed_lexical_signals_v1_not_semantic_review'
          assert j['early_basis']=='first_three_recorded_manager_messages'
          assert j['read_only'] is True and j['transcripts_exported'] is False and j['prior_mentions_are_not_confirmed_answers'] is True
          assert j['conversation_limit']==300 and j['message_limit']==1000
          assert type(j['selected_conversations']) is int and 0<=j['selected_conversations']<=300
          assert type(j['conversation_cap_reached']) is bool
          assert j['window']=={'timezone':'Europe/Kaliningrad','local_from':'2026-09-07','local_until_exclusive':'2026-09-21','since_utc':'2026-09-06 22:00:00','until_utc_exclusive':'2026-09-20 22:00:00'}
          dt=datetime.datetime.fromisoformat(j['generated_at'])
          assert -300<=(datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()<=3600
          assert set(j['excluded'])=={'message_cap','oversized_or_malformed'}
          assert all(type(v) is int and 0<=v<=300 for v in j['excluded'].values())
          assert set(j['channels'])=={'max','telegram','website'}
          scalars=set('conversations manager_messages customer_messages bot_messages question_messages unclassified_question_messages conversations_with_bot_before_manager conversations_with_question conversations_with_customer_message_after_manager'.split())
          topics=set('budget departure destination dates nights party child_ages hotel_preferences meal flight_preferences booking contact'.split())
          topic_keys=set('question_conversations early_question_conversations early_with_prior_customer_topic_mention early_with_prior_bot_topic_mention'.split())
          for c in j['channels'].values():
              assert set(c)==scalars|{'topics'}
              assert all(type(c[k]) is int and 0<=c[k]<=300000 for k in scalars)
              assert set(c['topics'])==topics
              for t in c['topics'].values():
                  assert set(t)==topic_keys and all(type(v) is int and 0<=v<=c['conversations'] for v in t.values())
                  assert t['early_question_conversations']<=t['question_conversations']
                  assert t['early_with_prior_customer_topic_mention']<=t['early_question_conversations']
                  assert t['early_with_prior_bot_topic_mention']<=t['early_question_conversations']
          assert sum(c['conversations'] for c in j['channels'].values())+sum(j['excluded'].values())==j['selected_conversations']
          print(json.dumps(j,ensure_ascii=True,indent=2))
          PY
      - name: Save aggregate-only result
        uses: actions/upload-artifact@v4
        with:
          name: manager-question-census-780-${{ github.run_id }}
          path: ${{ runner.temp }}/manager-question-census.json
          retention-days: 7
          if-no-files-found: error
      - name: Cleanup runner files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/census_key" "$RUNNER_TEMP/preflight.json" "$RUNNER_TEMP/manager-question-census.json"
