name: Audit enabled MAX publication buttons 20261020
on:
  push:
    branches: [test/max-post-button-20261020]
    paths: [.github/workflows/max-post-button-20261020.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-post-button-20261020
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 654eb9d88f24c0f0287426861a7928ca3af7076b
jobs:
  inspect:
    if: github.ref == 'refs/heads/test/max-post-button-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 654eb9d88f24c0f0287426861a7928ca3af7076b
      - name: Verify authoritative release before read-only diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          current=$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)
          test "$current" = "$EXPECTED_PRODUCTION_SHA"
          release=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=50" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$release" = success
      - name: Prepare fixed read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/post-diagnostic.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          $out=['ok'=>false,'mode'=>'read_only','database_writes'=>0,'provider_writes'=>0,'channels'=>[]];
          try{
           $root=getcwd();ob_start();try{require $root.'/config.php';}finally{ob_end_clean();}
           require_once $root.'/services/ChannelPostRuntime.php';
           $identity=ChannelPostRuntime::identity('max');
           if(!$identity||$identity['project_key']!=='anytour')throw new RuntimeException();
           $pdo=ConversationDb::connection();$registry=new ChannelPostRegistryService($pdo);
           $pdo->exec('START TRANSACTION READ ONLY');
           $q=$pdo->prepare("SELECT c.* FROM post_channels c JOIN projects p ON p.id=c.project_id JOIN conversation_sources s ON s.id=c.source_id AND s.project_id=c.project_id WHERE p.project_key=? AND p.is_active=1 AND c.platform='max' AND c.bot_key=? AND c.is_enabled=1 AND s.is_active=1 AND s.channel='max' AND s.handling_mode IN('manager','ask') ORDER BY c.id LIMIT 9");
           $q->execute([$identity['project_key'],$identity['bot_key']]);$channels=$q->fetchAll();
           $pdo->rollBack();
           $out['channel_limit_exceeded']=count($channels)>8;
           $safe=static fn($s)=>is_string($s)&&preg_match('/\A[a-z_]{0,96}\z/',$s)?$s:'redacted';
           $types=static function($aa){$r=[];foreach((array)$aa as $a){$t=$a['type']??'';$t=in_array($t,['image','video','audio','file','sticker','inline_keyboard'],true)?$t:'other';$r[$t]=($r[$t]??0)+1;}return $r;};
           $now=(int)floor(microtime(true)*1000);
           foreach(array_slice($channels,0,8)as $rank=>$c){
            $channel=$registry->channel($identity['project_key'],'max',$identity['bot_key'],(string)$c['channel_id']);
            if(!$channel)throw new RuntimeException();
            $known=['-77309177991187'=>'spb','-72182945320979'=>'reported_channel_2','-80095447388179'=>'test'];
            $item=['rank'=>$rank+1,'label'=>$known[(string)$c['channel_id']]??('channel_'.($rank+1)),'posts'=>[]];
            $q=$pdo->prepare('SELECT enabled_since_ms,completed_through_ms,scan_until_ms,last_checked_at,error_reason FROM post_channel_reconciliation WHERE post_channel_id=?');
            $q->execute([(int)$c['id']]);$cursor=$q->fetch();
            $item['cursor']=$cursor;$item['rights']=(new ChannelPostButtonTransport())->verifyChannel($channel);
            $q=$pdo->prepare('SELECT v.state,v.error_reason,COUNT(*) AS n FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id=? GROUP BY v.state,v.error_reason');
            $q->execute([(int)$c['id']]);$item['registered_states']=array_map(static fn($r)=>['state'=>$safe($r['state']),'reason'=>$safe($r['error_reason']),'count'=>(int)$r['n']],$q->fetchAll());
            $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>(string)$c['channel_id'],'from'=>$now,'to'=>$now-7*86400000,'count'=>12],null);
            $item['provider_http']=(int)($r['http']??0);$item['transport_error']=!empty($r['transport_error']);
            foreach(array_slice((array)($r['data']['messages']??[]),0,12)as $m){
             if(!is_array($m)||(string)($m['recipient']['chat_id']??'')!==(string)$c['channel_id']||($m['recipient']['chat_type']??'')!=='channel')throw new RuntimeException();
             $s=ChannelPostIncomingAdapter::maxSnapshot($m);$mid=(string)($m['body']['mid']??'');
             $q=$pdo->prepare('SELECT p.id FROM post_publications p WHERE p.post_channel_id=? AND p.external_message_id=? LIMIT 1');
             $q->execute([(int)$c['id'],$mid]);$pid=(int)$q->fetchColumn();$p=$pid?$registry->publication($pid):null;
             $url=$p?ChannelPostButtonTransport::buttonUrl($p):'';
             $count=0;$buttonTypes=[];foreach((array)($s['keyboard']??[])as $row)foreach((array)$row as $b){$type=$safe($b['type']??'');$buttonTypes[$type]=($buttonTypes[$type]??0)+1;if($url!==''&&($b['url']??'')===$url)$count++;}
             $item['posts'][]=['published_ms'=>(int)($m['timestamp']??0),'published_utc'=>gmdate('c',(int)floor((int)($m['timestamp']??0)/1000)),'after_activation'=>(int)($m['timestamp']??0)>=(int)($cursor['enabled_since_ms']??$now),'registered'=>$p!==null,'version'=>$p?(int)$p['version_number']:null,'state'=>$p?$safe($p['state']):null,'reason'=>$p?$safe($p['error_reason']):null,'write_attempts'=>$p?(int)$p['write_attempts']:null,'content_equals_snapshot'=>$p&&is_array($s)?ChannelPostIncomingAdapter::contentFingerprint($p['snapshot'])===ChannelPostIncomingAdapter::contentFingerprint($s):null,'attachments'=>$types($m['body']['attachments']??[]),'only_our_button'=>$url!==''&&is_array($s)&&ChannelPostIncomingAdapter::containsOnlyButton($s,$url,(string)$channel['button_text']),'our_button_count'=>$count,'button_types'=>$buttonTypes,'capability_reason'=>$safe($s['metadata']['capability_reason']??'')];
            }
            $out['channels'][]=$item;
           }
           $cron=(string)shell_exec('crontab -l 2>/dev/null');
           $out['worker_cron_count']=preg_match_all('/^[^#\r\n]*channel_post_worker\.php[^\r\n]*--platform=max[^\r\n]*--run[^\r\n]*--reconcile[^\r\n]*$/m',$cron);
           $out['server_utc']=gmdate('c');$out['ok']=!$out['channel_limit_exceeded'];
          }catch(Throwable $e){$out['error']='bounded_channel_audit_failed';}
          echo json_encode($out,JSON_UNESCAPED_SLASHES),PHP_EOL;exit($out['ok']?0:2);
          PHP
          php -l "$RUNNER_TEMP/post-diagnostic.php"
      - name: Prepare established SSH key
        env:
          DIAGNOSTIC_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/diagnostic_key"
          raw="$DIAGNOSTIC_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 2
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read fixed channel publication metadata and provider status
        env:
          DIAGNOSTIC_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DIAGNOSTIC_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/diagnostic_key" "$DIAGNOSTIC_USER@$DIAGNOSTIC_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/post-diagnostic.php" > "$RUNNER_TEMP/post-diagnostic.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/post-diagnostic.json') as f: d=json.load(f)
          assert d['ok'] is True and d['mode']=='read_only'
          assert d['database_writes']==0 and d['provider_writes']==0
          print(json.dumps(d,sort_keys=True))
          PY
      - name: Remove ephemeral diagnostic files
        if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic_key" "$RUNNER_TEMP/post-diagnostic.php" "$RUNNER_TEMP/post-diagnostic.json"
