name: Restore reported MAX button 20261020
on:
  push:
    branches: [test/max-post-button-20261020]
    paths: [.github/workflows/max-post-button-20261020.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-post-button-20261020
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 9f840db6e4e5c3daa9054e9a816f0a725b2be128
jobs:
  inspect:
    if: github.ref == 'refs/heads/test/max-post-button-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f840db6e4e5c3daa9054e9a816f0a725b2be128
      - name: Verify authoritative release before read-only diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          current=$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)
          test "$current" = "$EXPECTED_PRODUCTION_SHA"
          release=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=50" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$release" = success
      - name: Prepare fixed read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/post-diagnostic.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          $out=['ok'=>false,'state'=>'blocked','target_published_ms'=>1792498928543];
          try {
           $root=getcwd();ob_start();try{require $root.'/config.php';}finally{ob_end_clean();}
           require_once $root.'/services/ChannelPostRuntime.php';
           $identity=ChannelPostRuntime::identity('max');
           if(!is_array($identity)||$identity['project_key']!=='anytour'||$identity['bot_key']!=='id9704048781_1_bot')throw new RuntimeException();
           $registry=new ChannelPostRegistryService();$pdo=ConversationDb::connection();
           $channel=$registry->channel('anytour','max',$identity['bot_key'],'-77309177991187');
           if(!$channel||$channel['source_key']!=='max_anytour_spb')throw new RuntimeException();
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>'-77309177991187','from'=>1792498928543,'to'=>1792498928543,'count'=>2],null);
           $messages=$r['data']['messages']??[];
           if(($r['http']??0)!==200||!empty($r['transport_error'])||count($messages)!==1)throw new RuntimeException();
           $m=$messages[0];$mid=(string)($m['body']['mid']??'');
           if(!preg_match('/\A[A-Za-z0-9_.-]{1,191}\z/',$mid)||(string)($m['recipient']['chat_id']??'')!=='-77309177991187'||($m['recipient']['chat_type']??'')!=='channel'||(int)($m['timestamp']??0)!==1792498928543)throw new RuntimeException();
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.rawurlencode($mid),[],null);$current=$r['data']??null;
           if(($r['http']??0)!==200||!empty($r['transport_error'])||!is_array($current)||($current['body']['mid']??'')!==$mid||(string)($current['recipient']['chat_id']??'')!=='-77309177991187')throw new RuntimeException();
           $snapshot=ChannelPostIncomingAdapter::maxSnapshot($current);
           $expectedHash='0d7646f6be129e9a59c516cd20c2fa6001b97e0f35e4667a12b845a9aedd46bf';
           if(!$snapshot||($snapshot['metadata']['capability']??'')!=='supported'||count($snapshot['attachments'])!==1||ChannelPostIncomingAdapter::contentFingerprint($snapshot)!==$expectedHash||ChannelPostIncomingAdapter::contentFingerprint(ChannelPostIncomingAdapter::maxSnapshot($m))!==$expectedHash)throw new RuntimeException();
           $q=$pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=? LIMIT 1');$q->execute([(int)$channel['id'],$mid]);$id=(int)$q->fetchColumn();
           $old=$registry->publication($id);
           if(!$old||(int)$old['version_number']!==1||$old['state']!=='requires_attention'||$old['error_reason']!=='post_changed_since_event'||(int)$old['write_attempts']!==0||$old['source_key']!=='max_anytour_spb')throw new RuntimeException();
           $prior=$old['snapshot'];
           $hash=static fn($v)=>hash('sha256',json_encode($v,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));
           $media=static fn($s)=>array_map(static fn($a)=>[$a['type']??'',(string)($a['photo_id']??'')],$s['attachments']??[]);
           if($hash($prior['text'])!==$hash($snapshot['text'])||$hash($media($prior))!==$hash($media($snapshot))||$hash($prior['metadata']['link']??null)!==$hash($snapshot['metadata']['link']??null))throw new RuntimeException();
           $canon=static function($v)use(&$canon){if(!is_array($v))return $v;if(!array_is_list($v))ksort($v);foreach($v as &$x)$x=$canon($x);return $v;};
           $out['markup_object_key_order_only']=$canon($prior['markup']??null)===$canon($snapshot['markup']??null);
           $shape=static fn($a)=>array_map(static fn($e)=>is_array($e)?['keys'=>array_keys($e),'type'=>in_array($e['type']??'', ['strong','emphasized','monospaced','strikethrough','underline','link','user_mention','heading','bold','italic'],true)?$e['type']:'other','from'=>$e['from']??null,'length'=>$e['length']??null]:gettype($e),is_array($a)?$a:[]);
           $out['markup_shapes']=['stored'=>$shape($prior['markup']??null),'current'=>$shape($snapshot['markup']??null)];
           $snapshot['content_hash']=$expectedHash;
           $observed=(string)(int)floor(microtime(true)*1000);
           $snapshot['metadata']['observation_kind']='owner_authorized_provider_read';
           $snapshot['metadata']['observed_at_ms']=$observed;
           $snapshot['metadata']['source_revision_ms']=$observed;
           $snapshot['metadata']['source_revision_scope']='provider_read_observation_time';
           $snapshot['metadata']['source_event_id']='owner-provider-recovery-20261020:'.$id.':'.$expectedHash;
           $before=$registry->publication($id);
           if(!$before||(int)$before['version_id']!==(int)$old['version_id']||(int)$before['channel']['config_version']!==(int)$channel['config_version']||$before['state']!=='requires_attention'||(int)$before['write_attempts']!==0)throw new RuntimeException();
           $out['state']='registration_started';
           $fresh=$registry->registerPublication('anytour','max',$identity['bot_key'],'-77309177991187',$mid,$snapshot);
           if(!$fresh||(int)$fresh['publication_id']!==$id||(int)$fresh['version_number']!==2||$fresh['start_payload']!==$old['start_payload']||$fresh['content_hash']!==$expectedHash||$fresh['state']!=='pending'||!empty($fresh['stale_observation'])||!empty($fresh['duplicate_event']))throw new RuntimeException();
           $out['state']='canonical_operation_started';
           $result=(new ChannelPostAutomationService($registry))->processPublication('anytour','max',$identity['bot_key'],$id,(int)$fresh['version_id']);
           $out['state']=$result['state']??'unknown';$out['reason']=$result['reason']??'unknown';
           $out['receipt']=array_intersect_key((array)($result['receipt']??[]),array_flip(['request_count','write_attempts','http_results','content_preserved','button_verified']));
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.rawurlencode($mid),[],null);$after=$r['data']??null;
           $final=is_array($after)?ChannelPostIncomingAdapter::maxSnapshot($after):null;
           $url=ChannelPostButtonTransport::buttonUrl($fresh);
           $out['final_readback']=['same_mid'=>is_array($after)&&($after['body']['mid']??'')===$mid,'same_channel'=>is_array($after)&&(string)($after['recipient']['chat_id']??'')==='-77309177991187','content_preserved'=>is_array($final)&&ChannelPostIncomingAdapter::contentFingerprint($final)===$expectedHash,'only_our_button'=>is_array($final)&&ChannelPostIncomingAdapter::containsOnlyButton($final,$url,(string)$channel['button_text']),'image_count'=>count($final['attachments']??[])];
           $out['ok']=$out['state']==='sent'&&!in_array(false,$out['final_readback'],true)&&$out['final_readback']['image_count']===1;
           $out['server_utc']=gmdate('c');
          }catch(Throwable $ignored){$out['error']='recovery_stopped_no_replay';}
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($out['ok']?0:2);
          PHP
          php -l "$RUNNER_TEMP/post-diagnostic.php"
      - name: Prepare established SSH key
        env:
          DIAGNOSTIC_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/diagnostic_key"
          raw="$DIAGNOSTIC_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 2
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read fixed channel publication metadata and provider status
        env:
          DIAGNOSTIC_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DIAGNOSTIC_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/diagnostic_key" "$DIAGNOSTIC_USER@$DIAGNOSTIC_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/post-diagnostic.php" > "$RUNNER_TEMP/post-diagnostic.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/post-diagnostic.json') as f: d=json.load(f)
          print(json.dumps(d,sort_keys=True))
          assert d['ok'] is True and d['state']=='sent'
          assert d['receipt']['write_attempts']==1 and d['receipt']['button_verified'] is True and d['receipt']['content_preserved'] is True
          PY
      - name: Remove ephemeral diagnostic files
        if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic_key" "$RUNNER_TEMP/post-diagnostic.php" "$RUNNER_TEMP/post-diagnostic.json"
