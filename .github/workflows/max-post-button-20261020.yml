name: Inspect reported MAX button 20261020
on:
  push:
    branches: [test/max-post-button-20261020]
    paths: [.github/workflows/max-post-button-20261020.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-post-button-20261020
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 9f840db6e4e5c3daa9054e9a816f0a725b2be128
jobs:
  inspect:
    if: github.ref == 'refs/heads/test/max-post-button-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f840db6e4e5c3daa9054e9a816f0a725b2be128
      - name: Verify authoritative release before read-only diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          current=$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)
          test "$current" = "$EXPECTED_PRODUCTION_SHA"
          release=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=50" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$release" = success
      - name: Prepare fixed read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/post-diagnostic.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          $out=['ok'=>false,'mode'=>'read_only','database_writes'=>0,'provider_writes'=>0];
          try {
           $root=getcwd();ob_start();try {require $root.'/config.php';} finally {ob_end_clean();}
           require_once $root.'/services/ChannelPostRuntime.php';
           $pdo=ConversationDb::connection();$pdo->exec('START TRANSACTION READ ONLY');
           $target='https://max.ru/c/-77309177991187/AaFZQwufL_o';
           $q=$pdo->prepare('SELECT * FROM post_channels WHERE platform=? AND channel_id=? LIMIT 1');
           $q->execute(['max','-77309177991187']);$channel=$q->fetch();
           $out['channel_enabled']=is_array($channel)&&!empty($channel['is_enabled']);
           $identity=ChannelPostRuntime::identity('max');
           $out['runtime_matches']=is_array($channel)&&is_array($identity)&&$channel['bot_key']===$identity['bot_key'];
           $safe=static fn($v):string=>is_string($v)&&preg_match('/\A[a-z0-9_]{0,96}\z/',$v)?$v:'redacted';
           $types=static function(array $aa):array{$cc=[];foreach($aa as $a){$t=in_array($a['type']??'',['image','video','audio','file','sticker','inline_keyboard','share','location','contact'],true)?$a['type']:'other';$cc[$t]=($cc[$t]??0)+1;}return $cc;};
           $out['recent_publications']=[];
           if(is_array($channel)){
            $q=$pdo->prepare('SELECT p.external_message_id,p.start_payload,p.created_at,v.version_number,v.state,v.error_reason,v.write_attempts,v.snapshot_json,v.receipt_json FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id=? ORDER BY p.id DESC LIMIT 12');
            $q->execute([(int)$channel['id']]);$rows=$q->fetchAll();
            foreach($rows as $row){$s=json_decode((string)$row['snapshot_json'],true)?:[];$rc=json_decode((string)$row['receipt_json'],true)?:[];$out['recent_publications'][]=['published_utc'=>$s['published_at']??null,'created_utc'=>$row['created_at'],'target_url_match'=>($s['post_url']??'')===$target||($s['raw_body']['url']??'')===$target,'state'=>$safe($row['state']),'error_reason'=>$safe($row['error_reason']),'version_number'=>(int)$row['version_number'],'write_attempts'=>(int)$row['write_attempts'],'capability_reason'=>$safe($s['metadata']['capability_reason']??''),'attachments'=>$types((array)($s['attachments']??[])),'button_verified'=>$rc['button_verified']??false,'content_preserved'=>$rc['content_preserved']??false];}
            $q=$pdo->prepare('SELECT enabled_since_ms,completed_through_ms,scan_until_ms,before_ms,claimed_at,last_checked_at,error_reason FROM post_channel_reconciliation WHERE post_channel_id=?');
            $q->execute([(int)$channel['id']]);$out['reconciliation']=$q->fetch();
           }
           if($pdo->inTransaction())$pdo->rollBack();
           $out['channel_verification']=is_array($channel)?(new ChannelPostButtonTransport())->verifyChannel($channel):null;
           $now=(int)floor(microtime(true)*1000);
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>'-77309177991187','from'=>$now,'to'=>$now-7*86400000,'count'=>20],null);
           $out['provider_http']=(int)($r['http']??0);$out['provider_transport_error']=!empty($r['transport_error']);$out['provider_posts']=[];
           foreach(array_slice((array)($r['data']['messages']??[]),0,20)as $m){
            if(!is_array($m)||(string)($m['recipient']['chat_id']??'')!=='-77309177991187')continue;
            $s=ChannelPostIncomingAdapter::maxSnapshot($m);$mid=(string)($m['body']['mid']??'');
            $q=$pdo->prepare('SELECT p.start_payload,v.state,v.error_reason,v.write_attempts,v.snapshot_json FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id WHERE p.post_channel_id=? AND p.external_message_id=? LIMIT 1');
            $q->execute([(int)($channel['id']??0),$mid]);$db=$q->fetch();
            $only=false;$equal=null;
            if(is_array($db)&&is_array($s)){$u=ChannelPostButtonTransport::buttonUrl(['start_payload'=>$db['start_payload'],'channel'=>$channel]);$only=ChannelPostIncomingAdapter::containsOnlyButton($s,$u,(string)$channel['button_text']);$old=json_decode((string)$db['snapshot_json'],true);$equal=is_array($old)&&ChannelPostIncomingAdapter::contentFingerprint($old)===ChannelPostIncomingAdapter::contentFingerprint($s);}
            $out['provider_posts'][]=['published_ms'=>(int)($m['timestamp']??0),'published_utc'=>gmdate('c',(int)floor((int)($m['timestamp']??0)/1000)),'target_url_match'=>($m['url']??'')===$target,'url_available'=>is_string($m['url']??null)&&$m['url']!=='','attachments'=>$types((array)($m['body']['attachments']??[])),'capability_reason'=>$safe($s['metadata']['capability_reason']??''),'registered'=>is_array($db),'state'=>is_array($db)?$safe($db['state']):null,'error_reason'=>is_array($db)?$safe($db['error_reason']):null,'only_our_button'=>$only,'content_equals_snapshot'=>$equal];
           }
           $cron=(string)shell_exec('crontab -l 2>/dev/null');
           $out['worker_cron_count']=preg_match_all('/^[^#\r\n]*channel_post_worker\.php[^\r\n]*$/m',$cron);
           $out['worker_cron_reconcile']=preg_match('/^[^#\r\n]*channel_post_worker\.php[^\r\n]*--reconcile/m',$cron)===1;
           $out['server_utc']=gmdate('c');$out['ok']=true;
          }catch(Throwable $ignored){$out['error']='read_only_diagnostic_unavailable';}
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($out['ok']?0:2);
          PHP
          php -l "$RUNNER_TEMP/post-diagnostic.php"
      - name: Prepare established SSH key
        env:
          DIAGNOSTIC_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/diagnostic_key"
          raw="$DIAGNOSTIC_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 2
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read fixed channel publication metadata and provider status
        env:
          DIAGNOSTIC_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DIAGNOSTIC_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/diagnostic_key" "$DIAGNOSTIC_USER@$DIAGNOSTIC_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/post-diagnostic.php" > "$RUNNER_TEMP/post-diagnostic.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/post-diagnostic.json') as f: d=json.load(f)
          assert d['ok'] is True and d['mode']=='read_only'
          assert d['database_writes']==0 and d['provider_writes']==0
          print(json.dumps(d,sort_keys=True))
          PY
      - name: Remove ephemeral diagnostic files
        if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic_key" "$RUNNER_TEMP/post-diagnostic.php" "$RUNNER_TEMP/post-diagnostic.json"
