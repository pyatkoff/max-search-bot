name: Encrypted read-only manager reply pilot

on:
  push:
    branches: [analysis/manager-draft-pilot-20261019]
    paths:
      - '.github/workflows/manager-draft-pilot-20261019.yml'
      - 'services/ManagerDraftPilotCollector.php'
      - 'tests/run_manager_draft_pilot*'
      - 'tools/pilot-manager-draft-20261019/**'

permissions:
  contents: read

concurrency:
  group: manager-draft-pilot-20261019
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Verify exact source and synthetic contracts before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/analysis/manager-draft-pilot-20261019'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = '4c0e35b3f8a2362efcc7ba12348b041b8f1eba40'
          php -l services/ManagerDraftPilotCollector.php
          php tests/run_manager_draft_pilot_collector_regression.php
          node tests/run_manager_draft_pilot_seal_regression.cjs
          umask 077
          mkdir -p "$RUNNER_TEMP/manager-draft-pilot-private"
          python3 tools/pilot-manager-draft-20261019/bundle.py > "$RUNNER_TEMP/manager-draft-pilot-private/remote.php"
          php -l "$RUNNER_TEMP/manager-draft-pilot-private/remote.php"
      - name: Prepare SSH key and pinned host
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/manager-draft-pilot-private/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          printf '%s\n' 'anytour-manager-pilot-prod ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA' > "$RUNNER_TEMP/manager-draft-pilot-private/known_hosts"
      - name: Capture through PHP stdin and encrypt before transfer
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/manager-draft-pilot-private"
          ssh_opts=(-i "$private_dir/deploy_key" -o BatchMode=yes -o HostKeyAlias=anytour-manager-pilot-prod -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private_dir/known_hosts" -o ConnectTimeout=10)
          if ! timeout 120 ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '/var/www/anytoour/data/www/app.anytoour.ru' && php -d display_errors=0 -d log_errors=0" < "$private_dir/remote.php" > "$private_dir/snapshot.json" 2> "$private_dir/ssh.stderr"; then
            printf '%s\n' 'pilot_capture_failed_private_details_discarded' >&2
            exit 1
          fi
          node tools/pilot-manager-draft-20261019/seal.cjs "$private_dir/snapshot.json" tools/pilot-manager-draft-20261019/task.json "$RUNNER_TEMP/manager-draft-pilot.enc.json"
          rm -f "$private_dir/snapshot.json" "$private_dir/ssh.stderr" "$private_dir/deploy_key"
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: manager-draft-pilot-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-draft-pilot.enc.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove all private transport files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/manager-draft-pilot-private"
          rm -f "$RUNNER_TEMP/manager-draft-pilot.enc.json"
