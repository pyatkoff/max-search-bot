name: Read Telegram and MAX Metrika mechanics
on:
  push:
    branches: [audit/telegram-metrika-20261025]
    paths:
      - .github/workflows/telegram-metrika-readonly.yml
      - audit/telegram-metrika-readonly.php
      - audit/telegram-metrika-runner.py
permissions:
  contents: read
concurrency:
  group: telegram-metrika-owner-20261025
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check PHP reader syntax
        run: php -l audit/telegram-metrika-readonly.php
      - name: Read aggregate bot mechanics with existing server credentials
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 735ff6ce918398f495043b2f20556e42adbbda1af7c44031e5fc0280ee93f065
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/telegram-metrika-runner.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-metrika-mechanics-20261018-20261024
          path: encrypted-goals/*.enc.json
          retention-days: 3
          if-no-files-found: error
