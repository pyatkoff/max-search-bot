name: Correct reviewed AppleService39 Telegram covers in place
on:
  push:
    branches: [ops/appleservice39-tg-model-covers-20261119-ready]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom
          coverage: none

      - name: Check the exact media operation source
        run: php -l 'tools/appleservice39_tg_model_covers.php'

      - name: Confirm one owner-approved launch on the accepted installed application
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('node:fs');
          const R = require('./tools/deployment_release');
          const env = process.env;
          const event = JSON.parse(fs.readFileSync(env.GITHUB_EVENT_PATH,'utf8'));
          const ref = 'refs/heads/ops/appleservice39-tg-model-covers-20261119-ready';
          (async () => {
            R.requireValue(env.GITHUB_EVENT_NAME === 'push' && env.GITHUB_REPOSITORY === R.REPOSITORY
              && env.GITHUB_ACTOR_ID === '226193297' && env.GITHUB_RUN_ATTEMPT === '1'
              && env.GITHUB_REF === ref && event.ref === ref && event.created === true
              && event.before === '0'.repeat(40) && event.after === env.GITHUB_SHA
              && event.forced === false && event.deleted === false, 'media_launch_not_authorized');
            const api = R.makeReadApi(env.GITHUB_TOKEN);
            const original = await api('GET', R.API_ROOT+'/actions/runs/44540957918');
            R.runIdentity(original, {id:44540957918,attempt:1,head:'c4e1ab8794b1c73a17749950a7f26c49019cf87f',
              workflow:'.github/workflows/continue-appleservice39-telegram-catalogue.yml',
              event:'push',branch:'ops/appleservice39-telegram-catalogue-continue-20261119'});
            const stopped = await api('GET',R.API_ROOT+'/actions/runs/44544044334');
            R.runIdentity(stopped,{id:44544044334,attempt:1,head:'c44fa74ebdfef6711ea5051f4431c9f76fc618c0',
              workflow:'.github/workflows/appleservice39-tg-model-covers.yml',event:'push',branch:'ops/appleservice39-tg-model-covers-20261119',conclusion:'failure'});
            const job = await api('GET',R.API_ROOT+'/actions/jobs/135629708849');
            R.requireValue(job.run_id === 44544044334 && job.run_attempt === 1 && job.head_sha === 'c44fa74ebdfef6711ea5051f4431c9f76fc618c0'
              && job.steps.some(s=>s.name==='Replace only the confirmed photos and verify the public channel' && s.conclusion==='skipped'),
              'original_media_write_not_excluded');
            for (let i=0; i<18; i++) {
              const main = (await api('GET', R.API_ROOT+'/git/ref/heads/main')).object.sha;
              const location = await R.readRecord(api);
              let resolution;
              try { resolution = await R.resolveCurrent(api,{sha:main},location,{defer:true}); }
              catch(e) {
                if (e.code !== 'diagnostics_unconfirmed') throw e;
                await new Promise(r=>setTimeout(r,20000));
                continue;
              }
              if (resolution.ready && resolution.perform_actions && R.sha(resolution.application_sha)) {
                const latest = await R.readRecord(api);
                if (latest.blob === location.blob
                    && (await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha === main) {
                  fs.appendFileSync(env.GITHUB_OUTPUT, 'application_sha='+resolution.application_sha+'\n');
                  console.log('Installed release confirmed for the existing posts.');
                  return;
                }
              }
              await new Promise(r=>setTimeout(r,20000));
            }
            throw new Error('accepted_installation_unavailable');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS

      - name: Replace only the confirmed photos and verify the public channel
        env:
          TARGET_APP: ${{ steps.runtime.outputs.application_sha }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_APP" =~ ^[0-9a-f]{40}$ ]]
          key_file="$(mktemp "$RUNNER_TEMP/as39-tg-cover-key.XXXXXX")"
          trap 'rm -f -- "$key_file"' EXIT
          chmod 600 "$key_file"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 2
            printf '%s\n' "$decoded" > "$key_file"
          fi
          unset DEPLOY_SSH_KEY_VALUE raw decoded
          ssh-keygen -y -f "$key_file" >/dev/null
          command="cd /var/www/anytoour/data/www/app.anytoour.ru && AS39_TARGET_APP=$TARGET_APP php -d display_errors=0"
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" "$command" < 'tools/appleservice39_tg_model_covers.php'
