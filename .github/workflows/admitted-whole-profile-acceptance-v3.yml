name: Accept bounded current admitted whole profiles
on:
  push:
    branches: [audit/admitted-whole-profile-acceptance-20261027-v3]
permissions:
  contents: read
concurrency:
  group: anytour-admitted-whole-profile-acceptance-v3
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pin current installed main before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = '90e29306298b6ad8ebccb0a1edfc37e5c9fa41da'
      - name: Prepare existing encryption dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/evidence-python"
          "$RUNNER_TEMP/evidence-python/bin/pip" install --disable-pip-version-check --only-binary=:all: --require-hashes -q -r tools/requirements-encrypted-evidence.txt
      - name: Prepare existing canonical SSH credential
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read only frozen automatic profiles and admitted referenced journal rows
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
           chdir('/var/www/anytoour/data/www/app.anytoour.ru');
           $expected='5582b79f05a87a4e2ac1de939e27bbe1853e0932b616785afe8b6a5ebe8d668c';
           if(hash_file('sha256','tools/extract_conversion_profiles.py')!==$expected)throw new RuntimeException('source');
           require_once 'config.php';require_once 'services/ProjectAccessService.php';require_once 'services/ModeledConversionProfiles.php';
           if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('project');
           ProjectAccessService::initializeReadOnly();$p=ConversationDb::connection();
           $p->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();
           $status=(new ModeledConversionProfiles($p))->status();
           $minimum=1793041301;
           $sql="SELECT MAX(id) AS id FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND platform='max' AND observed_at_unix>=? AND JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.extractor_sha256'))=? AND JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.adapter.version'))='admitted_journal_profile_v1_2' GROUP BY platform,customer_key,conversation_id ORDER BY id DESC LIMIT 4";
           $q=$p->prepare($sql);$q->execute([$minimum,$expected]);$ids=$q->fetchAll(PDO::FETCH_ASSOC);
           $pack=['schema_version'=>1,'purpose'=>'current_whole_profile_semantic_acceptance','repository'=>'pyatkoff/max-search-bot','production_sha'=>'90e29306298b6ad8ebccb0a1edfc37e5c9fa41da','captured_at'=>gmdate('Y-m-d\\TH:i:s\\Z'),'extractor_sha256'=>$expected,'status'=>$status,'selection'=>'latest_distinct_max_automatic_scopes_current_extractor_adapter_v1_2_profile_receipt_gte_1793041301_equal_early_cutoff_no_budget_manager_stage_filter','cases'=>[],'native_source_reads'=>0,'model_calls'=>0,'provider_calls'=>0,'customer_calls'=>0,'conversion_uploads'=>0,'database_writes'=>false];
           $rawBytes=0;$profileBytes=0;$reads=count($ids);$limited=false;
           foreach($ids as$pos=>$m) {
            if($reads>495){$limited=true;break;}
            $q=$p->prepare("SELECT OCTET_LENGTH(profile_json) FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND id=?");$q->execute([$m['id']]);$bytes=(int)$q->fetchColumn();$reads++;
            if($profileBytes+$bytes>1048576){$limited=true;break;}
            $q=$p->prepare("SELECT id,observed_at_unix,profile_json FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND id=?");$q->execute([$m['id']]);$v=$q->fetch(PDO::FETCH_ASSOC);$reads++;
            if(!$v||strlen($v['profile_json'])!==$bytes)throw new RuntimeException('profile');
            $profileBytes+=$bytes;$item=json_decode($v['profile_json'],true,128,JSON_THROW_ON_ERROR);
            if((int)$v['observed_at_unix']<$minimum||($item['profile']['extractor_sha256']??'')!==$expected||($item['adapter']['version']??'')!=='admitted_journal_profile_v1_2'||($item['access_status']??'')!=='allowed'||($item['subject']['platform']??'')!=='max')continue;
            $refs=$item['source_references']??[];if(count($refs)>50)throw new RuntimeException('refs');
            $subject=$item['subject'];$rows=[];$denied=false;$window=false;
            foreach($refs as$ref) {
             if($reads>=498){$limited=true;$window=true;break;}
             $sql="SELECT id,source_kind,source_id,version_no,observed_at_unix,OCTET_LENGTH(snapshot_json) AS bytes FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND id=?";
             $q=$p->prepare($sql);$q->execute([$ref['journal_id']]);$meta=$q->fetch(PDO::FETCH_ASSOC);$reads++;
             if(!$meta)throw new RuntimeException('reference');
             $q=$p->prepare("SELECT JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_status')) AS status,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.platform')) AS platform,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.customer_key')) AS customer_key,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.conversation_id')) AS conversation_id FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND source_kind=? AND source_id=? ORDER BY id DESC LIMIT 1");
             $q->execute([$meta['source_kind'],$meta['source_id']]);$current=$q->fetch(PDO::FETCH_ASSOC);$reads++;
             if(!$current||$current['status']==='scope_excluded'||($current['status']==='present'&&($current['platform']!==$subject['platform']||(string)$current['customer_key']!==(string)$subject['customer_key']||(string)$current['conversation_id']!==(string)$subject['conversation_id']))){$denied=true;break;}
             if($rawBytes+(int)$meta['bytes']>1048576||$reads>=499){$limited=true;$window=true;break;}
             $q=$p->prepare("SELECT snapshot_json FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND id=?");$q->execute([$meta['id']]);$raw=$q->fetchColumn();$reads++;
             if(!is_string($raw)||strlen($raw)!==(int)$meta['bytes'])throw new RuntimeException('snapshot');
             $snap=json_decode($raw,true,64,JSON_THROW_ON_ERROR);
             if((string)$meta['source_id']!==(string)$ref['source_id']||(int)$meta['version_no']!==(int)$ref['source_version_no'])throw new RuntimeException('reference_identity');
             $rawBytes+=strlen($raw);
             $rows[]=['journal_id'=>(string)$meta['id'],'source_kind'=>$meta['source_kind'],'source_id'=>(string)$meta['source_id'],'source_version_no'=>(int)$meta['version_no'],'observed_at_unix'=>(int)$meta['observed_at_unix'],'snapshot'=>$snap,'progress_journal_id'=>(string)($ref['progress_journal_id']??$meta['id'])];
            }
            if($denied){$pack['cases'][]=['alias'=>'case-'.($pos+1),'excluded'=>'current_admitted_scope_not_allowed','source_rows_copied'=>0];continue;}
            $pack['cases'][]=['alias'=>'case-'.($pos+1),'profile_version_id'=>(string)$v['id'],'automatic_profile'=>$item,'rows'=>$rows,'read_window_limited'=>$window,'exposure'=>'unknown','previous_review_match'=>'not_checked'];
           }
           $p->rollBack();
           $pack['bounds']=['metadata_and_payload_rows'=>$reads,'journal_snapshot_bytes'=>$rawBytes,'profile_json_bytes'=>$profileBytes,'limit_reached'=>$limited];
           $json=json_encode($pack,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
           if(strlen($json)>2097152||$reads>500)throw new RuntimeException('budget');
           echo $json;
          } catch(Throwable $e) {
           if(isset($p)&&$p->inTransaction())$p->rollBack();
           fwrite(STDERR,"admitted_profile_review_failed\n");exit(1);
          }
          
          PHP
          python3 - "$DEPLOY_HOST" "$RUNNER_TEMP/admitted_profile_known_hosts" <<'PIN'
          import base64,hashlib,socket,subprocess,sys
          host=sys.argv[1];dest=sys.argv[2]
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:
              raise SystemExit('canonical_target_changed')
          pinned=[]
          for _ in range(2):
              scan=subprocess.run(['ssh-keyscan','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0].startswith('#'): continue
                  try: fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError: continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0' and line not in pinned: pinned.append(line)
          if not pinned: raise SystemExit('canonical_host_pin_not_seen')
          open(dest,'w').write('\n'.join(pinned)+'\n')
          PIN
          chmod 600 "$RUNNER_TEMP/admitted_profile_known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/admitted_profile_known_hosts" -o ConnectTimeout=10)
          dir="/tmp/anytour-whole-profile-review-${GITHUB_RUN_ID}"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; umask 077; mkdir '$dir'; chmod 700 '$dir'"
          trap 'ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$dir/read.php\"; rmdir \"$dir\"" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/admitted_profile_known_hosts"' EXIT
          scp "${opts[@]}" "$RUNNER_TEMP/read.php" "$DEPLOY_USER@$DEPLOY_HOST:$dir/read.php"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '90e29306298b6ad8ebccb0a1edfc37e5c9fa41da'; php -d display_errors=0 '$dir/read.php'; test \"\$(git rev-parse HEAD)\" = '90e29306298b6ad8ebccb0a1edfc37e5c9fa41da'" > "$RUNNER_TEMP/profiles-private.json"
          "$RUNNER_TEMP/evidence-python/bin/python" - "$RUNNER_TEMP/profiles-private.json" "$RUNNER_TEMP/profiles.age" <<'PY'
          import json,sys,pathlib,hashlib
          import pyrage
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          p=json.loads(raw)
          assert len(raw)<=2097152 and len(p["cases"])<=4 and p["bounds"]["metadata_and_payload_rows"]<=500
          assert p["bounds"]["journal_snapshot_bytes"]<=1048576
          assert p["native_source_reads"]==p["model_calls"]==p["provider_calls"]==p["customer_calls"]==p["conversion_uploads"]==0
          for c in p["cases"]:
              for r in c.get("rows",[]):
                  ref=next(x for x in c["automatic_profile"]["source_references"] if x["journal_id"]==r["journal_id"])
                  assert hashlib.sha256(json.dumps(r["snapshot"],sort_keys=True,separators=(",",":"),ensure_ascii=True).encode()).hexdigest()==ref["snapshot_sha256"]
          recipient=pyrage.x25519.Recipient.from_str(pathlib.Path("docs/diagnostics-recipient.txt").read_text().strip())
          pathlib.Path(sys.argv[2]).write_bytes(pyrage.encrypt(raw,[recipient]))
          print(json.dumps({"ok":True,"mode":"read_only_admitted_journal","cases":len(p["cases"]),"bounds":p["bounds"],"native_source_reads":0,"model_calls":0,"provider_calls":0,"customer_calls":0,"conversion_uploads":0,"sha":"90e29306298b6ad8ebccb0a1edfc37e5c9fa41da"}))
          PY
          rm -f "$RUNNER_TEMP/profiles-private.json"
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-whole-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profiles.age
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner credentials and private data
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/admitted_profile_known_hosts" "$RUNNER_TEMP/read.php" "$RUNNER_TEMP/profiles-private.json" "$RUNNER_TEMP/profiles.age"
