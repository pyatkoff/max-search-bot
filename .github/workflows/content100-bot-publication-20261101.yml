name: Verify exact rejected flight number classification without any new quote
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-remaining1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41930421093
          path: ${{ runner.temp }}/remaining1
      - name: Classify only the new rejected response and original declared-error categories
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-commercial-price-20261104-remaining1.py
      - name: Retain safe bounded inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-remaining1-inspection2
          path: |
            ${{ runner.temp }}/price-focus-inspection.json
          retention-days: 14
          if-no-files-found: warn
