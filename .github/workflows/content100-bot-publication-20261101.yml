name: Finish only the 18 unstarted owner-approved hotel caption edits
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 85b500236de471f62fde547e5f799d12509e47c4
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Prepare immutable approved inputs and original read-only scope
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 - <<'PY'
        import hashlib,pathlib
        p=pathlib.Path('tools/direct_demand/operations/commercial-caption-repair-20261113-complete-unstarted-batch.py')
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='494e065eaa7b0bfe802903536e75a4c1c59a357fac1451302c11f545323d3b3e'
        PY
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-complete-unstarted-batch.py prepare
        php -l "$RUNNER_TEMP/caption-repair-private/reader.php"
    - name: Verify the original 158 results and proof batch004 never started
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        private="$RUNNER_TEMP/caption-repair-private"
        gh api repos/pyatkoff/max-search-bot/actions/runs/43327630710 > "$private/original-run.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/43327630710/jobs?per_page=30" > "$private/original-jobs.json"
        gh api repos/pyatkoff/max-search-bot/actions/artifacts/13994670839/zip > "$private/original-result.zip"
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-complete-unstarted-batch.py original
    - name: Require original current-source release and health gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -m 700 "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" > "$evidence/current-runs.json"
        python3 - <<'PY'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');sha=os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'main.json').read_text())['object']['sha']==sha
        runs=json.loads((p/'current-runs.json').read_text())['workflow_runs']
        paths=['deploy.yml','max-tls-preflight.yml','modeled-conversion-value-export.yml','max-production-health.yml','telegram-production-health.yml','live-session-diagnostics.yml','modeled-conversion-monitor.yml','tour-selection-host.yml','publish-conversation-diagnostics.yml']
        selected={}
        for name in paths:
         candidates=[r for r in runs if r['head_sha']==sha and r['head_branch']=='main' and r['path']=='.github/workflows/'+name and r['run_attempt']==1]
         assert candidates, 'original current-source gate missing: '+name
         r=max(candidates,key=lambda r:r['id']);assert r['status']=='completed' and r['conclusion']=='success', 'gate not successful: '+name
         selected[name]=r
         (p/('verify_run.json' if name=='deploy.yml' else 'tls_run.json' if name=='max-tls-preflight.yml' else 'gate-'+name+'.json')).write_text(json.dumps(r))
        (p/'gate-receipts.json').write_text(json.dumps({n:{'run_id':r['id'],'head_sha':r['head_sha'],'run_attempt':r['run_attempt'],'conclusion':r['conclusion']} for n,r in selected.items()},indent=2)+'\n')
        (p/'deploy-id').write_text(str(selected['deploy.yml']['id']))
        PY
        deploy_id="$(cat "$evidence/deploy-id")"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$deploy_id/jobs?per_page=30" > "$evidence/verify_jobs.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');jobs=json.loads((p/'verify_jobs.json').read_text())['jobs']
        assert len(jobs)==6 and all(j['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
        PY
        cp "$evidence/gate-receipts.json" "$RUNNER_TEMP/caption-repair-safe/source-gate-receipts.json"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read all 176 current posts and prepare only the unstarted original batch004
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$private/main-before-operation.json"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$private/carrier-before-operation.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$private/active-before-operation.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$private/queued-before-operation.json"
        python3 - <<'PY'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private')
        assert json.loads((p/'main-before-operation.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'carrier-before-operation.json').read_text())['object']['sha']==os.environ['GITHUB_SHA']
        active=json.loads((p/'active-before-operation.json').read_text());queued=json.loads((p/'queued-before-operation.json').read_text())
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs'])
        assert queued['total_count']==0
        PY
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/reader.php" > "$RUNNER_TEMP/caption-repair-safe/before-completion-snapshot.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-complete-unstarted-batch.py before "$status"
        php -l "$private/batch004.php"
    - name: 'First execution of the original unstarted batch004: 18 captions only'
      id: batch004
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$private/main-before-operation.json"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$private/carrier-before-operation.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$private/active-before-operation.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$private/queued-before-operation.json"
        python3 - <<'PY'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private')
        assert json.loads((p/'main-before-operation.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'carrier-before-operation.json').read_text())['object']['sha']==os.environ['GITHUB_SHA']
        active=json.loads((p/'active-before-operation.json').read_text());queued=json.loads((p/'queued-before-operation.json').read_text())
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs'])
        assert queued['total_count']==0
        PY
        test ! -e "$RUNNER_TEMP/caption-repair-safe/batch004.started"
        printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/caption-repair-safe/batch004.started"
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/batch004.php" > "$private/batch004.runtime.jsonl" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-verify.py result batch004 "$status"
    - name: Verify all 176 current captions and preserved button/photo identities
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        private="$RUNNER_TEMP/caption-repair-private"
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/reader.php" > "$RUNNER_TEMP/caption-repair-safe/final-snapshot.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-complete-unstarted-batch.py final "$status"
    - name: Retain original results and final public readback
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-caption-repair-20261113-completion-result
        path: ${{ runner.temp }}/caption-repair-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and compiled private files
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/caption-repair-private" "$RUNNER_TEMP/channel_key"
        "$RUNNER_TEMP/channel_known_hosts"
