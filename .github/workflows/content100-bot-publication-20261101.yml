name: Prepare next ten hotel links from exact current noquote contexts
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: b4a266482184b6c9edff7f0b4c005eddbde0c342
  LINK_SCOPE_FILENAME: commercial-hotel-search-links-20261105-context19-ten3-scope.json
  EXPECTED_LINK_SCOPE_SHA256: 1f2480694661553fc0de7e735d483dcf417970b0993ea84adb355561f4c8af50
  LINK_CONTEXT_RUN: 42017191827
  LINK_CONTEXT_SOURCE_SHA: b4a266482184b6c9edff7f0b4c005eddbde0c342
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context19-ten3
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42017191827
          path: ${{ runner.temp }}/original-link-context
      - name: Prepare data-bound native hotel search URLs and only new current-input cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-data-bound.py
          python3 tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-data-bound.py
          for file in "$RUNNER_TEMP"/hotel-search-links-prepared/*/update.php; do
            php -l "$file"
            ANYTOUR_CURRENT_LINK_OFFER_NEW_INPUT_CASES=1 php "$file"
          done
      - name: Retain original private frozen noquote manifests approvals frames scripts and intent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-ten3-prepared1
          path: ${{ runner.temp }}/hotel-search-links-prepared
          retention-days: 14
          if-no-files-found: warn
