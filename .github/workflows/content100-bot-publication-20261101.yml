name: Correct146 existing hotel captions after complete editorial review
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 5fbb61990706ae4289e539df2c26c60e409032f4
  EXPECTED_DEPLOY_RUN_ID: '43449271575'
  EXPECTED_TLS_RUN_ID: '43451381784'
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Compile and validate four exact finite caption batches without sends
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-private"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-safe"
        python3 - <<'PY'
        import pathlib,hashlib,base64,gzip,json,os
        o=pathlib.Path('tools/direct_demand/operations');p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private')
        packed=(o/'commercial-caption-review73-20261113-edit-inputs.json.gz.b64').read_bytes()
        assert hashlib.sha256(packed).hexdigest()=='3e1fe8c0e002a15adafd758c70e2eabe251fbad10b6f37ed9dd3c204a343da36'
        files=json.loads(gzip.decompress(base64.b64decode(packed)))
        assert set(files)=={'approved-cohort.json','source-snapshot.json','read-proof.json','canary.manifest.json','batch001.manifest.json','batch002.manifest.json','batch003.manifest.json'}
        for name,text in files.items():(p/name).write_text(text)
        c=json.loads(files['approved-cohort.json'])
        assert hashlib.sha256(files['approved-cohort.json'].encode()).hexdigest()=='4d8f9340e3fd5b62d7c5828bd889a9828d87c91a343a98b2d5db8c5de46b9fab'
        assert hashlib.sha256(files['source-snapshot.json'].encode()).hexdigest()=='7f3f2d28ffbb21762878f72caff5c2cd6a0433950168dc0bdbd3aa9f1a58831e'
        executor=(o/'commercial-caption-review73-20261113-executor.php').read_text();verifier=(o/'commercial-caption-review73-20261113-verify.py').read_bytes()
        assert hashlib.sha256(executor.encode()).hexdigest()=='cb30dbd22432224bed30d0e8c0121b58a393ffcbd3263a09614b7d083fa88c2e'
        assert hashlib.sha256(verifier).hexdigest()=='8273e0884d1711db99e0e5f0ee3a99f57324fc16bd8c135c1dba6e1918000d5e'
        allrows=[]
        for index,name in enumerate(['canary', 'batch001', 'batch002', 'batch003']):
         m=json.loads(files[name+'.manifest.json']);allrows+=m['rows']
         assert len(m['rows'])==[8, 46, 46, 46][index] and m['snapshot']['sha256']==c['source_read_sha256']
         defs={'EXPECTED_INSTALLED_SHA':'5fbb61990706ae4289e539df2c26c60e409032f4','APPROVED_UPDATE_OPERATION':m['operation'],'APPROVED_MANIFEST_SHA256':hashlib.sha256(files[name+'.manifest.json'].encode()).hexdigest(),'MANIFEST_BASE64':base64.b64encode(files[name+'.manifest.json'].encode()).decode(),'REPAIR_COHORT_SHA256':'4d8f9340e3fd5b62d7c5828bd889a9828d87c91a343a98b2d5db8c5de46b9fab','REPAIR_PUBLICATION_IDS_BASE64':base64.b64encode(json.dumps([x['publication_id'] for x in m['rows']]).encode()).decode(),'REPAIR_BATCH_INDEX':str(index)}
         constants='\n'.join("define('%s', '%s');"%(k,v) for k,v in defs.items())
         compiled=executor.replace('declare(strict_types=1);','declare(strict_types=1);\n'+constants,1)
         (p/(name+'.php')).write_text(compiled)
         pure=compiled.split("$out = ['operation'",1)[0]
         (p/(name+'-validate.php')).write_text(pure+"$m=json_decode(base64_decode(MANIFEST_BASE64,true),true,128,JSON_THROW_ON_ERROR); validateManifest($m); echo 'MANIFEST_VALIDATED',PHP_EOL;")
        assert allrows==c['rows'] and len(allrows)==146 and len({r['publication_id'] for r in allrows})==146
        reader=(o/'commercial-caption-review73-20261113-read-scope.php').read_text();scope=(o/'commercial-caption-review73-20261113-scope.json').read_bytes()
        assert hashlib.sha256(reader.encode()).hexdigest()=='5158f1e4157984cce98acc085329a0227f6b78c93829bd5984d247e8b629c95e'
        assert hashlib.sha256(scope).hexdigest()=='9ee88848bb9c5cd0c238267acdaddbbf76f1365173a0e6bf2d58ce0e9c184ea6'
        defs={'EXPECTED_INSTALLED_SHA':'5fbb61990706ae4289e539df2c26c60e409032f4','APPROVED_MANIFEST_SHA256':hashlib.sha256(scope).hexdigest(),'MANIFEST_BASE64':base64.b64encode(scope).decode()}
        (p/'reader.php').write_text(reader.replace('declare(strict_types=1);','declare(strict_types=1);\n'+'\n'.join("define('%s', '%s');"%(k,v) for k,v in defs.items()),1))
        compile(verifier.decode(),'<verifier>','exec')
        print('EXACT_146_REVISIONS_COMPILED_NO_SEND')
        PY
        for name in canary batch001 batch002 batch003; do
         php -l "$RUNNER_TEMP/caption-repair-private/$name.php"
         php "$RUNNER_TEMP/caption-repair-private/$name-validate.php"
        done
        php -l "$RUNNER_TEMP/caption-repair-private/reader.php"
    - name: Authenticate original read artifact and exact preimage
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import subprocess,json,hashlib,zipfile,io,pathlib,os
        run=43452943496;head='0ee5bd9a06f2ec01399e0ef377b5bccb09b03ae6';aid=14052745776;digest='644a584a90434b662ac38a6de0a58efca8d7db544df474dbfe4df9b801ac04d1'
        r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/runs/{run}']))
        assert r['id']==run and r['head_sha']==head and r['run_attempt']==1 and r['event']=='push' and r['head_branch']=='audit/content100-bot-publication-20261101' and r['path']=='.github/workflows/content100-bot-publication-20261101.yml' and r['status']=='completed' and r['conclusion']=='success'
        a=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/artifacts/{aid}']))
        assert a['id']==aid and a['name']=='commercial-caption-review73-20261113-current' and a['expired'] is False and a['digest']=='sha256:'+digest and a['workflow_run']['id']==run and a['workflow_run']['head_sha']==head
        raw=subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/artifacts/{aid}/zip']);assert hashlib.sha256(raw).hexdigest()==digest
        z=zipfile.ZipFile(io.BytesIO(raw));assert len(z.infolist())<=10 and all(not i.filename.startswith('/') and '..' not in pathlib.PurePosixPath(i.filename).parts for i in z.infolist())
        xs=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name=='current-snapshot.json'];assert len(xs)==1 and xs[0].file_size<5000000
        snapshot=z.read(xs[0]);assert hashlib.sha256(snapshot).hexdigest()=='7f3f2d28ffbb21762878f72caff5c2cd6a0433950168dc0bdbd3aa9f1a58831e'
        assert snapshot==pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private','source-snapshot.json').read_bytes()
        print('ORIGINAL_READ_ARTIFACT_AUTHENTICATED_EXACT_SNAPSHOT')
        PY
