name: Read the existing Side Star media operation without another write
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: b6006b5494a8f256d152f0482faf23a03bc85313
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42358679367 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/42358679367/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42359145278 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - uses: actions/download-artifact@v4
        with:
          run-id: 42357448787
          name: commercial-hotel-caption-cta-dedup-20261107-1-result
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-cta-dedup
      - name: Bind the committed cover to the two exact current Side Star contexts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          umask 077
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib
          base=pathlib.Path('tools/direct_demand/operations');tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=(base/'commercial-side-star-media-20261107-1-inputs.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='8a2c35513bb5f77071496afede8c9758842aa5fc6237185d698c025e47b862b4'
          media=json.loads(raw);assert media['hotel_id']==1095 and media['canva_committed_transaction_id']=='220071900505793444'
          receipt=json.loads((tmp/'prior-cta-dedup'/'channel-preflight.json').read_text().splitlines()[-1])
          assert receipt['ok'] and receipt['operation']=='commercial-hotel-caption-cta-dedup-20261107-1-v1' and receipt['commercial_text_updates']==6 and receipt['new_posts_created']==0
          selected=[r for r in receipt['posts'] if r['logical_id']=='commercial-side-star-resort-1095-v1']
          assert len(selected)==2 and {r['version_id'] for r in selected}=={929,932} and all(r['text_sha256']==media['text_sha256'] for r in selected)
          payload={'operation':media['operation'],'media':media,'prior_result':receipt}
          raw=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode();(tmp/'side-star-media-input.json').write_bytes(raw)
          source=(base/'read-side-star-media-original-receipt-20261107-template.php').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='71800121e0c0f1d3c2c36d8128e7a2ddf01a6a80129eda12557efd894a40fa48'
          constants="\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst APPROVED_MEDIA_OPERATION='commercial-side-star-media-20261107-1-v1';\nconst APPROVED_MANIFEST_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\nconst MANIFEST_BASE64='"+base64.b64encode(raw).decode()+"';\n"
          assert source.count('declare(strict_types=1);')==1
          (tmp/'channel-preflight.php').write_text(source.replace('declare(strict_types=1);','declare(strict_types=1);'+constants,1))
          print(json.dumps({'operation':payload['operation'],'exact_existing_posts':2,'new_sends':0,'caption_changes':0,'server_calls':0}))
          PYCODE
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - name: Retain exact approved media intent before provider access
        uses: actions/upload-artifact@v4
        with:
          name: commercial-side-star-media-20261107-1-read1-inputs
          path: ${{ runner.temp }}/side-star-media-input.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read the original receipt and current MAX state once without retry
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import pathlib,json,os
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((tmp/'channel-preflight.json').read_text().splitlines()[-1])
          print(json.dumps({k:d[k] for k in ('operation','mode','ok','provider_writes','registry_writes','new_posts_created','error','max_readback_summary','next_candidate_registry_clearance') if k in d},ensure_ascii=False,sort_keys=True))
          assert d['operation']=='commercial-side-star-media-20261107-1-read1' and d['ok'] is True
          assert d['provider_writes']==d['registry_writes']==d['new_posts_created']==0
          print('SIDE_STAR_ORIGINAL_RECEIPT_AND_CURRENT_STATE_READ_NO_WRITE')
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-side-star-media-20261107-1-read1-result
          path: ${{ runner.temp }}/channel-preflight.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json"

