name: Validate bounded commercial batch preparation
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate new bounded preparation without server or bot access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/check-commercial-batch-preparation.py
      - name: Check prepared PHP syntax without executing any publisher
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/commercial-batch-check/"*.php; do php -l "$file"; done
      - name: Retain only the preparation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-scale-500-batch-preparation
          path: commercial-batch-preparation-validation.json
          retention-days: 14
          if-no-files-found: warn
