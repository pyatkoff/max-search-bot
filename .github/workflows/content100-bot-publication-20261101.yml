name: Prepare nine exact legacy price context bindings without any server or provider calls
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Bind approved legacy source records without publishing or resolving private IDs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-legacy9-price-contexts-20261105.py
          php -l "$RUNNER_TEMP/legacy9-read.php"
          ANYTOUR_LEGACY9_ROLE_FIXTURE=1 php "$RUNNER_TEMP/legacy9-read.php"
      - name: Retain private prepared input without approving server execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read1-prepared
          path: |
            ${{ runner.temp }}/legacy9-approved-bindings.private.json
          retention-days: 14
          if-no-files-found: warn
