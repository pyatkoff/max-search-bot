name: Read exact nine existing hotel pairs for owner caption correction
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 4ab42ce44669919abf9d7bb54d075f380720c5f1
  EXPECTED_DEPLOY_RUN_ID: '43425407400'
  EXPECTED_TLS_RUN_ID: '43427001454'
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Compile exact nine-pair read-only capture
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-private"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-safe"
        python3 - <<'PY'
        import pathlib,hashlib,base64,os,json
        r=pathlib.Path('tools/direct_demand/operations/commercial-caption-batch16-20261113-read-scope.php').read_bytes();s=pathlib.Path('tools/direct_demand/operations/commercial-caption-batch16-20261113-scope.json').read_bytes()
        assert hashlib.sha256(r).hexdigest()=='085edcc133fa0fe3b16d5f28413414b8b24f23d77687b1cc7c9363ca1274ea4b'
        assert hashlib.sha256(s).hexdigest()=='91cf744c6b013b8aa75627769a149fea277c6440cc9782bd10815d2c8bd5d895'
        assert len(json.loads(s)['rows'])==9
        defs={'EXPECTED_INSTALLED_SHA':'4ab42ce44669919abf9d7bb54d075f380720c5f1','APPROVED_MANIFEST_SHA256':hashlib.sha256(s).hexdigest(),'MANIFEST_BASE64':base64.b64encode(s).decode()}
        compiled=r.decode().replace('declare(strict_types=1);','declare(strict_types=1);\n'+'\n'.join("define('%s', '%s');"%(k,v) for k,v in defs.items()),1)
        pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private','reader.php').write_text(compiled)
        PY
        php -l "$RUNNER_TEMP/caption-repair-private/reader.php"
    - name: Verify nine original source gates and the unchanged 22 publishing pins
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'SOURCE9'
        import json,os,pathlib,subprocess
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        gates=[(43425407400, '.github/workflows/deploy.yml', 'push'), (43427001454, '.github/workflows/max-tls-preflight.yml', 'workflow_run'), (43427001616, '.github/workflows/telegram-production-health.yml', 'workflow_run'), (43427001679, '.github/workflows/max-production-health.yml', 'workflow_run'), (43427001637, '.github/workflows/modeled-conversion-value-export.yml', 'workflow_run'), (43427001717, '.github/workflows/publish-conversation-diagnostics.yml', 'workflow_run'), (43427001495, '.github/workflows/modeled-conversion-monitor.yml', 'workflow_run'), (43427001510, '.github/workflows/tour-selection-host.yml', 'workflow_run'), (43427001432, '.github/workflows/live-session-diagnostics.yml', 'workflow_run')]
        assert len(gates)==9 and len({x[0] for x in gates})==9
        for run_id,path,event in gates:
         r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))
         assert r['id']==run_id and r['run_attempt']==1 and r['head_sha']==expected
         assert r['head_branch']=='main' and r['path']==path and r['event']==event
         assert r['status']=='completed' and r['conclusion']=='success'
         if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43425407400:1'
         pathlib.Path(os.environ['RUNNER_TEMP'],f'commercial-source-gate-{run_id}.json').write_text(json.dumps(r))
        print('NINE_ORIGINAL_SOURCE_GATES_SUCCESS_ATTEMPT1')
        SOURCE9
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -p "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 - <<'PYPIN'
        import hashlib,pathlib
        assert hashlib.sha256(pathlib.Path('tools/direct_demand/operations/verify-commercial-source.py').read_bytes()).hexdigest()=='5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'
        PYPIN
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read exact 18 current captions and verify nine live MAX messages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/caption-repair-private/main.json"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$RUNNER_TEMP/caption-repair-private/carrier.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$RUNNER_TEMP/caption-repair-private/active.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$RUNNER_TEMP/caption-repair-private/queued.json"
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private')
        assert json.loads((p/'main.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'carrier.json').read_text())['object']['sha']==os.environ['GITHUB_SHA']
        active=json.loads((p/'active.json').read_text());queued=json.loads((p/'queued.json').read_text())
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs'])
        assert queued['total_count']==0
        PY
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/caption-repair-private/reader.php" > "$RUNNER_TEMP/caption-repair-safe/current-snapshot.json"
        python3 - <<'PY'
        import pathlib,os,json
        r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-safe','current-snapshot.json').read_text())
        assert r['ok'] is True and r['post_write_attempts']==0 and r['provider_calls']==9 and len(r['posts'])==18
        assert all(p['status']=='sent' and p['button_resolves_to_current_post'] for p in r['posts'])
        assert [p['hotel_id'] for p in r['posts'][::2]]==[81358,343,432,65254,443,107940,32356,195,20288]
        assert all(p['provider_live_verified'] is (p['platform']=='max') for p in r['posts'])
        assert r['monitor_pending'] is False
        print(json.dumps({'existing_posts_read':len(r['posts']),'post_writes':0,'provider_calls':9}))
        PY
    - name: Retain exact current public snapshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-caption-batch16-20261113-current
        path: ${{ runner.temp }}/caption-repair-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and compiled private files
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/caption-repair-private" "$RUNNER_TEMP/channel_key"
        "$RUNNER_TEMP/channel_known_hosts"
