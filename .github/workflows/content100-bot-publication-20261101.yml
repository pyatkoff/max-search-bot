name: Inspect the exact Siva Grand Beach native promotional PNG
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        inspect_group: [1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect only selected readonly media group
        env:
          INSPECT_GROUP: ${{ matrix.inspect_group }}
          MEDIA_GROUP: 0
          COVER_GROUP: 0
        run: |
          set -euo pipefail
          if [ "$INSPECT_GROUP" = 0 ]; then
            python3 tools/direct_demand/operations/inspect-hotel-primary-images-20261103-20.py
          else
            python3 tools/direct_demand/operations/inspect-canva-covers-20261102-3.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch21-native-cover-group-${{ matrix.inspect_group }}
          path: |
            primary-image-inspection.json
            native-cover-receipt.json
            covers/
          retention-days: 14
          if-no-files-found: error
