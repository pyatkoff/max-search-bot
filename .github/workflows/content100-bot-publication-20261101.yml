name: Inspect18 different declared property photographs for four of ten proven stock41 hotels
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Inspect only fixed public owner material without server calls
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 -m py_compile tools/direct_demand/operations/inspect-hotel-primary-images-20261103-20.py
          python3 tools/direct_demand/operations/inspect-hotel-primary-images-20261103-20.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch48-contact-${{ matrix.media_group }}
          path: |
            primary-image-inspection.json
            contact.png
            accepted-primary-raw
          retention-days: 14
          if-no-files-found: error
