name: Inspect Moscow picture ID metadata and validate the new 72h historical price slice
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41932708020
          path: ${{ runner.temp }}/moscow-source
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read9
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41898354901
          path: ${{ runner.temp }}/retained-read9
      - name: Compare only original public feed filters and retained native-name proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-moscow-picture-ids-20261104.py
          python3 tools/direct_demand/operations/validate-read10-72h-scope-20261104.py
          php -l tools/direct_demand/operations/read-commercial-price-monitor-20261104-read10-72h.php
          ANYTOUR_PRICE72_NEW_EXTENSION_FIXTURE=1 php tools/direct_demand/operations/read-commercial-price-monitor-20261104-read10-72h.php
      - name: Retain safe bounded crosswalk summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-picture-id-inspection1
          path: ${{ runner.temp }}/moscow-picture-id-summary.json
          retention-days: 14
          if-no-files-found: warn
