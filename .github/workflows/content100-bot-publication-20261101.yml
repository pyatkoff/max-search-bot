name: Inspect six public hotel feed destinations without searches
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact delivered public destination contract and prepare six CSV rows
        run: python3 tools/direct_demand/operations/inspect-hotel-feed-contract-20261103.py
      - name: Retain public feed preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-feed-20261103-contract1
          path: |
            ${{ runner.temp }}/commercial-hotel-feed-20261103-contract1.csv
            ${{ runner.temp }}/commercial-hotel-feed-20261103-contract1.json
          retention-days: 14
          if-no-files-found: error
