name: Materialize saved expansion20 photographs without production writes
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '3081eb0c61e984a7c461e88a3624800b2b8b5551' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source and authenticate existing retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/audit/content100-bot-publication-20261101
          test "$(git rev-parse HEAD^)" = 3081eb0c61e984a7c461e88a3624800b2b8b5551
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          p=tools/direct_demand/operations
          echo "4eba37e0660541799029cf9b73daf1b912d282e5dd16095236c3e9aba12dc5e3  $p/materialize-expansion20-photos-20261116.py" | sha256sum --check
          python3 -m py_compile "$p/materialize-expansion20-photos-20261116.py"
          umask 077
          mkdir "$RUNNER_TEMP/expansion20-media"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43845928034 > "$RUNNER_TEMP/expansion20-media/source-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14214743619 > "$RUNNER_TEMP/expansion20-media/source-artifact.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14214743619/zip > "$RUNNER_TEMP/retained-content.zip"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'expansion20-media'
          r=json.loads((p/'source-run.json').read_bytes());a=json.loads((p/'source-artifact.json').read_bytes())
          assert r['id']==43845928034 and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='6c158a34792b6d28109473ed892784895ee3fa82'
          assert a['id']==14214743619 and not a['expired'] and a['workflow_run']['id']==43845928034
          assert a['digest']=='sha256:e3f02fb97b0e9080b26f9a91b0ad58f1fbad410764140e7355d7f6319c2086a0'
          PY
          python3 "$p/materialize-expansion20-photos-20261116.py" --plan-only "$RUNNER_TEMP/retained-content.zip" "$RUNNER_TEMP/expansion20-media"
      - name: Fetch only saved public images once with no production connection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/materialize-expansion20-photos-20261116.py --fetch "$RUNNER_TEMP/retained-content.zip" "$RUNNER_TEMP/expansion20-media"
      - name: Retain images and exact per-file download evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion20-saved-media-${{ github.run_id }}
          path: ${{ runner.temp }}/expansion20-media/
          if-no-files-found: error
          retention-days: 14
