name: Read the exact already verified Neo Ivory PDF with its missing text tool installed
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply the exact missing readonly PDF text dependency before any request
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - name: Read only one current official Neo Ivory PDF and verify its known source hash
        run: python3 tools/direct_demand/operations/inspect-public-hotel-pdf-20261103-22.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch22-neo-ivory-current-factsheet
          path: primary-pdf-text.json
          retention-days: 14
          if-no-files-found: error
