name: Read expansion100 country-scoped catalogue variants
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '7687c165d6bcbc18a6cab8df8b565887e0ab6e25' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source and one-time lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/audit/content100-bot-publication-20261101
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 7687c165d6bcbc18a6cab8df8b565887e0ab6e25
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          echo 'd416fe4f7f1133b974f2fe9cd62720b8085e8265e6a2f1b0d80437e778700838  tools/direct_demand/operations/read-expansion100-name-variants-20261116.php' | sha256sum --check
          php -l tools/direct_demand/operations/read-expansion100-name-variants-20261116.php
          umask 077
          mkdir "$RUNNER_TEMP/catalogue-variants"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read eleven existing catalogue queries without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          umask 077
          status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" php < tools/direct_demand/operations/read-expansion100-name-variants-20261116.php > "$RUNNER_TEMP/catalogue-variants/result.json" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/catalogue-variants/exit-code.txt"
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'catalogue-variants';d=json.loads((p/'result.json').read_text())
          queries=d.pop('queries',[]);d['query_count']=len(queries)
          print('CATALOGUE_VARIANTS_SUMMARY='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
          for row in queries:print('CATALOGUE_VARIANTS='+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          PY
          exit "$status"
      - name: Retain exact catalogue responses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion100-country-variants-20261116-${{ github.run_id }}
          path: ${{ runner.temp }}/catalogue-variants/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
