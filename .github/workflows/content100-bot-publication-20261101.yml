name: Materialize all remaining 33 hotel dossiers and saved photographs
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '1bd415315a77ebc45c38e6d50b5588a57c7ef6b5' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate existing source and exclude the published twenty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 1bd415315a77ebc45c38e6d50b5588a57c7ef6b5
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          script=tools/direct_demand/operations/materialize-expansion33-photos-20261116.py
          test "$(git hash-object "$script")" = e6bb3f1ab923d2ac8362c412f653dd72cba39da2
          python3 -m py_compile "$script"
          umask 077
          mkdir "$RUNNER_TEMP/remaining33"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43845928034 > "$RUNNER_TEMP/remaining33/source-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14214743619 > "$RUNNER_TEMP/remaining33/source-artifact.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14214743619/zip > "$RUNNER_TEMP/source.zip"
          python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining33';r=json.loads((p/'source-run.json').read_bytes());a=json.loads((p/'source-artifact.json').read_bytes())
          assert r['id']==43845928034 and r['run_attempt']==1 and r['conclusion']=='success' and r['head_sha']=='6c158a34792b6d28109473ed892784895ee3fa82'
          assert a['id']==14214743619 and not a['expired'] and a['workflow_run']['id']==43845928034
          assert a['digest']=='sha256:e3f02fb97b0e9080b26f9a91b0ad58f1fbad410764140e7355d7f6319c2086a0'
          PY
          python3 "$script" --plan-only "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/remaining33"
      - name: Download the finite saved image set without SSH or supplier searches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/materialize-expansion33-photos-20261116.py --fetch "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/remaining33"
      - name: Retain every result without retrying completed downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion33-existing-media-${{ github.run_id }}
          path: ${{ runner.temp }}/remaining33/
          if-no-files-found: error
          retention-days: 14
