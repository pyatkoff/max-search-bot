        \ for n,r in selected.items()},indent=2)+'\\n')\n(p/'deploy-id').write_text(str(selected['deploy.yml']['id']))\n\
        PY\ndeploy_id=\"$(cat \"$evidence/deploy-id\")\"\ngh api \"repos/pyatkoff/max-search-bot/actions/runs/$deploy_id/jobs?per_page=30\"\
        \ > \"$evidence/verify_jobs.json\"\ngh api \"repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA\"\
        \ > \"$evidence/source_commit.json\"\ntree_sha=\"$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[\"\
