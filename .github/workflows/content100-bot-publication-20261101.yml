name: Validate only proposed single-attempt source adaptation without server or API calls
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Validate only the five new single-request outcomes with original121scope
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/prepare-published-price-single-attempt-candidate-20261105.py --fixture
          php -l "$RUNNER_TEMP/manual-refresh.php"
          ANYTOUR_MANUAL_SINGLE_ATTEMPT_FIXTURE=1 php "$RUNNER_TEMP/manual-refresh.php"
