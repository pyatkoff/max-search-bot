name: Inspect native AnyTour promotional covers
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect three native cover images without provider or server writes
        run: python3 tools/direct_demand/operations/inspect-canva-covers-20261102-3.py
      - name: Retain native media receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-three-20261102-3-native-covers
          path: |
            native-cover-receipt.json
            covers/
          retention-days: 14
          if-no-files-found: warn
