name: Complete the exact original112914 pending operation after canonical confirmation
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 77dfb182148d9df9903e8e21fb8f29e986d4fd5f
jobs:
  recover:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Require actual recovery admission and exact frozen inputs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        sha256sum -c <<'PINS'
        5e5126c2cab821d05279f61924b0dcd0f43f5e7131c317a8712a3f16ece8bf23  tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1.php
        afbe6d6e5432b3da5cff79f3c346ed3b12f7b37dc18cae31a4745aa74556e077  tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json
        de4c15c2a3d95b94a0c25367fee5a3a13edd72c8990fb8f8b5a102a2151c4acf  tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-evidence.py
        5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb  tools/direct_demand/operations/verify-commercial-source.py
        PINS
        python3 - <<'ADMISSION'
        import importlib.util,json,pathlib
        p=pathlib.Path('tools/direct_demand/operations/')
        s=importlib.util.spec_from_file_location('recovery',p/'commercial-monitor-price-h112914-recovery-20261113-1-evidence.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
        m.require_admission(json.loads((p/'commercial-monitor-price-h112914-recovery-20261113-1-plan.json').read_bytes()))
        ADMISSION
        cp tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1.php "$RUNNER_TEMP/original-monitor-recovery.php"
        php -l "$RUNNER_TEMP/original-monitor-recovery.php"
    - name: Authenticate original readiness2 and accepted canonical core
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-evidence.py authenticate --plan tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json --evidence "$RUNNER_TEMP/recovery-evidence"
    - name: Require original current-source release and health gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -m 700 "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" > "$evidence/current-runs.json"
        python3 - <<'PY'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');sha=os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'main.json').read_text())['object']['sha']==sha
        runs=json.loads((p/'current-runs.json').read_text())['workflow_runs']
        paths=['deploy.yml','max-tls-preflight.yml','modeled-conversion-value-export.yml','max-production-health.yml','telegram-production-health.yml','live-session-diagnostics.yml','modeled-conversion-monitor.yml','tour-selection-host.yml','publish-conversation-diagnostics.yml']
        selected={}
        for name in paths:
         candidates=[r for r in runs if r['head_sha']==sha and r['head_branch']=='main' and r['path']=='.github/workflows/'+name and r['run_attempt']==1]
         assert candidates, 'original current-source gate missing: '+name
         r=max(candidates,key=lambda r:r['id']);assert r['status']=='completed' and r['conclusion']=='success', 'gate not successful: '+name
         selected[name]=r
         (p/('verify_run.json' if name=='deploy.yml' else 'tls_run.json' if name=='max-tls-preflight.yml' else 'gate-'+name+'.json')).write_text(json.dumps(r))
        (p/'gate-receipts.json').write_text(json.dumps({n:{'run_id':r['id'],'head_sha':r['head_sha'],'run_attempt':r['run_attempt'],'conclusion':r['conclusion']} for n,r in selected.items()},indent=2)+'\n')
        (p/'deploy-id').write_text(str(selected['deploy.yml']['id']))
        PY
        deploy_id="$(cat "$evidence/deploy-id")"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$deploy_id/jobs?per_page=30" > "$evidence/verify_jobs.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');jobs=json.loads((p/'verify_jobs.json').read_text())['jobs']
        assert len(jobs)==6 and all(j['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
        PY
        cp "$evidence/gate-receipts.json" "$RUNNER_TEMP/recovery-evidence/source-gate-receipts.json"
        python3 - <<'BOUNDGATES'
        import json,os,pathlib
        p=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json').read_bytes());actual=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-evidence/source-gate-receipts.json').read_bytes())
        assert actual==p['current_source_acceptance']['source_gates'],'actual accepted source gates changed'
        BOUNDGATES
    - name: Retain exact recovery inputs before credentials
      uses: actions/upload-artifact@v4
      with:
        name: commercial-monitor-price-h112914-recovery-20261113-1-inputs
        path: |-
          tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1.php
          tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json
          tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-evidence.py
          tools/direct_demand/operations/verify-commercial-source.py
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Require exact recovery owner and carrier lease
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/recovery-evidence/lease"
        mkdir -p "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$evidence/carrier.json"
        gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 > "$evidence/owner.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$GITHUB_RUN_ID" > "$evidence/run.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$GITHUB_SHA" > "$evidence/commit.json"
        gh api 'repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30' > "$evidence/active.json"
        gh api 'repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30' > "$evidence/queued.json"
        python3 - <<'PYLEASE'
        import hashlib,json,os,pathlib
        p=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json').read_bytes())
        assert p['ready'] is True,'owner pin has not been supplied'
        e=pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-evidence/lease')
        get=lambda n:json.loads((e/(n+'.json')).read_bytes())
        assert get('main')['object']['sha']==p['expected_installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert get('carrier')['object']['sha']==os.environ['GITHUB_SHA']
        comment=get('owner');pin=p['owner_pin']
        assert comment['id']==pin['comment_id'] and comment['user']['login']==pin['owner']
        assert comment['updated_at']==pin['updated_at'] and hashlib.sha256(comment['body'].encode()).hexdigest()==pin['body_sha256']
        assert pin['required_scope_line'] in comment['body'].splitlines()
        run=get('run')
        assert str(run['id'])==os.environ['GITHUB_RUN_ID'] and run['run_attempt']==1 and run['status']=='in_progress'
        assert run['event']=='push' and run['head_sha']==os.environ['GITHUB_SHA'] and run['head_branch']=='audit/content100-bot-publication-20261101'
        assert run['path']=='.github/workflows/content100-bot-publication-20261101.yml'
        assert run['actor']['login']==run['triggering_actor']['login']==os.environ['GITHUB_ACTOR']=='pyatkoff'
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes());commit=get('commit')
        assert event['before']==p['expected_parent_head'] and event['after']==os.environ['GITHUB_SHA']
        assert commit['sha']==os.environ['GITHUB_SHA'] and [x['sha'] for x in commit['parents']]==[p['expected_parent_head']]
        active=get('active');queued=get('queued')
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs']) and queued['total_count']==0
        (e/'lease.json').write_text(json.dumps({'ok':True,'operation':p['operation'],'owner_pin':pin,'installed_sha':p['expected_installed_sha'],'parent_head':p['expected_parent_head'],'carrier_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1},indent=2)+'\n')
        print('BATCH9_OWNER_SOURCE_CARRIER_LEASE_OK')
        PYLEASE
    - name: Complete only the original pending operation once
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        python3 - <<'INTENT'
        import hashlib,json,os,pathlib
        p=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json').read_bytes())
        assert p['ready'] is True and p['execution_authorized'] is True
        raw=json.dumps(p,ensure_ascii=False,separators=(',',':')).encode()
        e=pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-evidence')
        m={'operation':p['operation'],'ready_plan_sha256':hashlib.sha256(raw).hexdigest(),
           'readiness_result_sha256':p['readiness_result_sha256'],'current_installed_sha':p['expected_current_installed_sha'],
           'run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'run_attempt':1,
           'compiled_sha256':hashlib.sha256(pathlib.Path(os.environ['RUNNER_TEMP'],'original-monitor-recovery.php').read_bytes()).hexdigest(),
           'retry_authorized':False}
        with (e/'recovery.started').open('x') as f:
         f.write(json.dumps(m,ensure_ascii=False,indent=2)+'\n');f.flush();os.fsync(f.fileno())
        INTENT
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/original-monitor-recovery.php" > "$RUNNER_TEMP/recovery-evidence/result.json" 2> "$RUNNER_TEMP/recovery.stderr" || status=$?
        python3 - "$status" <<'TRANSPORT'
        import hashlib,json,os,pathlib,sys
        e=pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-evidence');raw=(e/'result.json').read_bytes();err=pathlib.Path(os.environ['RUNNER_TEMP'],'recovery.stderr').read_bytes()
        r={'ssh_status':int(sys.argv[1]),'read_only':False,'retry_authorized':False,'run_id':os.environ['GITHUB_RUN_ID'],
           'head_sha':os.environ['GITHUB_SHA'],'run_attempt':1,'stdout_sha256':hashlib.sha256(raw).hexdigest(),
           'stdout_bytes':len(raw),'stderr_sha256':hashlib.sha256(err).hexdigest(),'stderr_bytes':len(err),
           'started_sha256':hashlib.sha256((e/'recovery.started').read_bytes()).hexdigest()}
        (e/'transport.json').write_text(json.dumps(r,indent=2)+'\n')
        print(json.dumps(r))
        TRANSPORT
        python3 tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-evidence.py verify-result --plan tools/direct_demand/operations/commercial-monitor-price-h112914-recovery-20261113-1-plan.json --evidence "$RUNNER_TEMP/recovery-evidence"
        test "$status" = 0
    - name: Retain original proof and actual recovery outcome
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-monitor-price-h112914-recovery-20261113-1-result
        path: ${{ runner.temp }}/recovery-evidence
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and compiled recovery files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/original-monitor-recovery.php" "$RUNNER_TEMP/recovery.stderr"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
