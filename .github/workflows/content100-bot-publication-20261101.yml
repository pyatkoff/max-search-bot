name: Continue saved hotel prices within existing bounded maintenance
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 80ebb725c0a954bae7d2ae78ba6e7c48056248a6
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate bounded continuation and unchanged saved-price publisher
      shell: bash
      run: 'set -euo pipefail

        umask 077

        test "$GITHUB_RUN_ATTEMPT" = 1

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        mkdir -p "$RUNNER_TEMP/monitor-price-incident-private" "$RUNNER_TEMP/monitor-price-incident-safe"

        python3 - <<''PY''

        import hashlib,pathlib

        assert hashlib.sha256(pathlib.Path(''tools/direct_demand/operations/verify-commercial-source.py'').read_bytes()).hexdigest()==''5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb''

        PY

        php -l tools/direct_demand/operations/monitor-price-after-collection.php

        php -l tools/direct_demand/operations/update-commercial-price-20261104-remaining1.php

        php tools/direct_demand/operations/test-monitor-price-contract.php

        php tools/direct_demand/operations/test-monitor-price-hook.php

        php tools/direct_demand/operations/test-monitor-price-nightly-policy.php

        python3 tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-incident-private/validated-hook.php"

        php -l "$RUNNER_TEMP/monitor-price-incident-private/validated-hook.php"

        python3 tools/direct_demand/operations/test-continue-saved-monitor-prices-20261114.py

        '
    - name: Authenticate accepted current installation without rerunning it
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\numask 077\nevidence=\"$RUNNER_TEMP/monitor-price-incident-private/source\"\nmkdir -p \"$evidence\"\
        \npython3 - <<'PY'\nimport concurrent.futures,json,os,pathlib,subprocess\nexpected=os.environ['EXPECTED_PRODUCTION_SHA']\n\
        gates=[(43581055548,'.github/workflows/deploy.yml','push'),(43581055574,'.github/workflows/retired-domain-guard.yml','push'),(43581950208,'.github/workflows/max-tls-preflight.yml','workflow_run'),(43581950228,'.github/workflows/max-production-health.yml','workflow_run'),(43581950209,'.github/workflows/telegram-production-health.yml','workflow_run'),(43581950210,'.github/workflows/publish-conversation-diagnostics.yml','workflow_run'),(43581950157,'.github/workflows/live-session-diagnostics.yml','workflow_run'),(43581950234,'.github/workflows/tour-selection-host.yml','workflow_run'),(43581950216,'.github/workflows/modeled-conversion-monitor.yml','workflow_run')]\n\
        def check(g):\n rid,path,event=g\n r=json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control:\
        \ no-cache',f'repos/pyatkoff/max-search-bot/actions/runs/{rid}']))\n assert r['id']==rid and r['run_attempt']==1 and\
        \ r['head_sha']==expected and r['head_branch']=='main'\n assert r['path']==path and r['event']==event and r['status']=='completed'\
        \ and r['conclusion']=='success'\n if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43581055548:1'\n\
        \ return {'run_id':rid,'path':path,'conclusion':'success','attempt':1}\nwith concurrent.futures.ThreadPoolExecutor(max_workers=5)\
        \ as pool:results=list(pool.map(check,gates))\npathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-safe','original-installation.json').write_text(json.dumps({'installed_sha':expected,'gates':results}))\n\
        PY\ngh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/main > \"$evidence/main.json\"\
        \ngh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43581055548 > \"$evidence/verify_run.json\"\
        \ngh api --method GET -H 'Cache-Control: no-cache' 'repos/pyatkoff/max-search-bot/actions/runs/43581055548/jobs?per_page=20'\
        \ > \"$evidence/verify_jobs.json\"\ngh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43581950208\
        \ > \"$evidence/tls_run.json\"\ngh api --method GET -H 'Cache-Control: no-cache' \"repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA\"\
        \ > \"$evidence/source_commit.json\"\ntree_sha=\"$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[\"\
        tree\"][\"sha\"])' \"$evidence/source_commit.json\")\"\ngh api --method GET -H 'Cache-Control: no-cache' \"repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1\"\
        \ > \"$evidence/source_tree.json\"\npython3 tools/direct_demand/operations/verify-commercial-source.py --expected-source\
        \ \"$EXPECTED_PRODUCTION_SHA\" --evidence-dir \"$evidence\"\n"
    - name: Authenticate same owner, exact continuation and previous completed pass
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport json,os,pathlib,subprocess\nrepo='repos/pyatkoff/max-search-bot/'\n\
        def get(path):return json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control: no-cache',repo+path]))\n\
        assert get('git/ref/heads/main')['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']\nassert get('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA']\n\
        owner=get('issues/comments/6818332618')\nassert owner['user']['id']==226193297 and owner['body'].startswith('ACTIVE14Nov:\
        \ saved-price continuation; same carrier, 1800s total; no replay.')\nrun=get('actions/runs/'+os.environ['GITHUB_RUN_ID'])\n\
        assert run['event']=='push' and run['run_attempt']==1 and run['head_sha']==os.environ['GITHUB_SHA']\nassert run['head_branch']=='audit/content100-bot-publication-20261101'\
        \ and run['path']=='.github/workflows/content100-bot-publication-20261101.yml'\nassert run['actor']['id']==run['triggering_actor']['id']==226193297\n\
        commit=get('git/commits/'+os.environ['GITHUB_SHA'])\nassert [p['sha'] for p in commit['parents']]==['f71e4642a56cc94cb06c96cb74678a515f40914d']\n\
        previous=get('actions/runs/43580948623')\nassert previous['run_attempt']==1 and previous['head_sha']=='f71e4642a56cc94cb06c96cb74678a515f40914d'\n\
        assert previous['status']=='completed' and previous['conclusion']=='success' and previous['event']=='push'\nassert\
        \ previous['head_branch']==run['head_branch'] and previous['path']==run['path']\nassert previous['actor']['id']==previous['triggering_actor']['id']==226193297\n\
        proof={'current_source':os.environ['GITHUB_SHA'],'parent':previous['head_sha'],'previous_run_id':43580948623,'previous_attempt':1,'previous_status':'success','same_owner':True,'no_retirement_replay':True}\n\
        root=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-safe')\n(root/'continuation-admission.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\\\
        n')\nprint('SAVED_PRICE_CONTINUATION_ADMISSION='+json.dumps(proof))\n# One metadata GET diagnoses the absent hourly\
        \ collector events. It neither enables nor dispatches it.\nmeta={'workflow_id':346454799,'read_attempts':1,'method':'GET','available':False,'writes':0}\n\
        try:\n    p=subprocess.run(['gh','api','--method','GET','-H','Cache-Control: no-cache','repos/pyatkoff/poisk-turov-test/actions/workflows/346454799'],capture_output=True,timeout=25)\n\
        \    if p.returncode==0:\n        data=json.loads(p.stdout)\n        assert data['id']==346454799 and data['path']=='.github/workflows/collect-anytour-tours.yml'\n\
        \        meta.update({'available':True,'workflow':{k:data.get(k) for k in ['id','name','path','state','created_at','updated_at']}})\n\
        \    else:meta.update({'error':'metadata_get_failed','exit_code':p.returncode})\nexcept (subprocess.TimeoutExpired,ValueError,AssertionError,KeyError):meta['error']='metadata_get_unavailable'\n\
        (root/'collector-workflow-state.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\\n')\nprint('COLLECTOR_WORKFLOW_METADATA='+json.dumps(meta))\n\
        PY\n"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"$raw\" == *\"PRIVATE KEY\"* ]]; then\n  if\
        \ [[ \"$raw\" == *'\\n'* ]]; then printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; else printf\
        \ '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse\n  printf '%s' \"$raw\" | base64 --decode\
        \ > \"$RUNNER_TEMP/channel_key\"\nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\nhost=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\n\
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\n\
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\n\
        matches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n  if len(fields)<3 or fields[0].startswith('#'):continue\n\
        \  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n\
        \  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\n\
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(matches)+'\\n')\nPY\n"
    - name: Apply successive existing saved-price passes within one total budget
      shell: bash
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: "set -euo pipefail\numask 077\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\npython3 tools/direct_demand/operations/continue-saved-monitor-prices-20261114.py\
        \ \\\n  --hook \"$RUNNER_TEMP/monitor-price-incident-private/validated-hook.php\" \\\n  --output-dir \"$RUNNER_TEMP/monitor-price-incident-safe\"\
        \ \\\n  --key \"$RUNNER_TEMP/channel_key\" \\\n  --known-hosts \"$RUNNER_TEMP/channel_known_hosts\"\n"
    - name: Retain every original pass and final continuation outcome
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monitor-price-saved-continuation-20261114
        path: ${{ runner.temp }}/monitor-price-incident-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and private source evidence
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/monitor-price-incident-private" "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
