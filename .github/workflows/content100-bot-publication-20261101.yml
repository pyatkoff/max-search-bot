name: Read new normal663 retained price inputs for150 published hotels
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 17400f819817593b3b4428b43a8dbe24b109c428
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41810617957 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41810617957/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41811237447 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Prepare exact150 scope and thirty-hour policy after new real collection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,re
          source=pathlib.Path('tools/direct_demand/operations/read-commercial-price-monitor-20261104-read7.php').read_text()
          plan=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-price-monitor-20261104-read7-plan.json').read_text())
          scope=json.loads(re.search(r"<<<'_ANYTOUR_PRICE150_SCOPE_'\n([\s\S]*?)\n_ANYTOUR_PRICE150_SCOPE_",source).group(1));ids=[r['local_tv_id'] for r in scope]
          assert ids==plan['catalog_ids'] and len(ids)==len(set(ids))==150 and ids[:146]==plan['previous_catalog_ids'] and ids[-4:]==[1199,1464,9322,1672]
          assert sum(r['identity_provenance']=='accepted_typed_bridge' for r in scope)==15 and all(r['expected_country_id']==4 for r in scope[-4:])
          assert [r['expected_name'] for r in scope[-4:]]==['GLORIA SERENITY RESORT','ROYAL WINGS HOTEL','PALOMA PASHA RESORT','KEMPINSKI BARBAROSS BAY HOTEL']
          def exact_scope(values):return values==plan['catalog_ids'] and len(values)==150
          assert exact_scope(ids) and not exact_scope(ids[:-4])
          assert not exact_scope([1446 if v==1146 else 12144 if v==12114 else v for v in ids])
          assert 1146 in ids and 12114 in ids and 1446 not in ids and 12144 not in ids
          assert 'START TRANSACTION READ ONLY' in source and 'information_schema' not in source
          assert 'UNIX_TIMESTAMP(created_at)>=1793783292' in source and plan['freshness_seconds']==108000
          assert plan['expected_installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          prefix="<?php\ndeclare(strict_types=1);\n";assert source.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP'],'channel-preflight.php').write_text(header+source[len(prefix):])
          print('FRESH150_AFTER699_SCOPE_OK new_cases=3 previous146_preserved=1 typed15_preserved=1 exactnew4_names=1 mutated_ids_rejected=1 policy_hours=30 server_calls=0')
          PY
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read150 new retained contexts without provider or message calls
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import pathlib,json,os
          lines=pathlib.Path(os.environ['RUNNER_TEMP']+'/channel-preflight.json').read_text().splitlines()
          d=json.loads(lines[-1])
          assert d['operation']=='commercial-price-monitor-20261104-read7' and d['mode']=='read_existing_monitored_price_inputs'
          assert d['ok'] is True
          plan=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-price-monitor-20261104-read7-plan.json').read_text())
          expected=plan['catalog_ids']
          assert len(expected)==len(set(expected))==150 and 1146 in expected and 12114 in expected
          assert [h['local_tv_id'] for h in d['hotels']]==expected
          assert all(len(h['observations'])<=2 for h in d['hotels'])
          assert d['db_writes']==d['provider_calls']==d['message_sends']==d['price_block_updates']==0
          now=d['readback_epoch_utc']; recent=[]
          for hotel in d['hotels']:
              if any(0<=now-int(r.get('created_at_stored_epoch_utc') or 0)<=108000 for r in hotel['observations']):
                  recent.append(hotel['local_tv_id'])
          summary={'operation':d['operation'],'ok':True,'scope_hotels':len(d['hotels']),'hotels_with_rows':sum(bool(h['observations']) for h in d['hotels']),'candidate_rows':sum(len(h['observations']) for h in d['hotels']),'recent_within30h_catalog_ids':recent,'identity_name_review_catalog_ids':[h['local_tv_id'] for h in d['hotels'] if not h.get('current_name_matches_expected',False)],'full_total_verified':False,'schema_discovery':False,'provider_calls':0,'db_writes':0,'message_edits':0,'readback_epoch_utc':now}
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          pathlib.Path(os.environ['RUNNER_TEMP']+'/read7-summary.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True)+'\n')
          PY
          test "$probe_status" = 0
      - name: Retain bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read7
          path: |
            ${{ runner.temp }}/channel-preflight.json
            ${{ runner.temp }}/read7-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/read7-summary.json"

