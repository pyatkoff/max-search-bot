name: Verify batch35 covers and reassess retained prices with approved30hour window
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cover_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact native PNG bytes and dimensions without server calls
        env:
          COVER_GROUP: ${{ matrix.cover_group }}
        run: python3 tools/direct_demand/operations/inspect-canva-covers-20261102-3.py
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read6
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41786947561
          path: ${{ runner.temp }}/original-read6
      - name: Reassess the original retained rows with the user confirmed30hour window
        env:
          RETAINED_PATH: ${{ runner.temp }}/original-read6
        run: python3 tools/direct_demand/operations/inspect-commercial-retained-price30h-20261104-1.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-retained30h1
          path: |
            ${{ runner.temp }}/quote-candidate-input.json
            ${{ runner.temp }}/retained30h-summary.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch35-covers-${{ matrix.cover_group }}
          path: |
            native-cover-receipt.json
            covers/
          retention-days: 14
          if-no-files-found: error
