name: View one new original Cullinan hero candidate at native resolution without HTTP
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-batch51-contact-0
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41968724003
          path: ${{ runner.temp }}/photo51-cullinan
      - name: Read only exact original new role file and emit original native bytes
        run: python3 tools/direct_demand/operations/view-native-photo51-hero-candidate-20261105.py
