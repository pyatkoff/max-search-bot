name: Read ten exact owner pages for new proven stock41 hotels without price collection
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Read fixed official public sources without server or provider calls
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: python3 tools/direct_demand/operations/inspect-hotel-primary-sources-20261105-stock41.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-stock41-primary1-${{ matrix.media_group }}
          path: public-media-sources.json
          retention-days: 14
          if-no-files-found: error
