name: Read only the newly approved 72h historical price slice for published hotels
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 0a80b95fa31e3a90267daa8984adae24d6aaa6bb
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41933468218 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41933468218/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41934272551 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41934272665 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - name: Prepare the exact previously validated new 72h slice without repeating old or pure cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import hashlib,os,pathlib
          source=pathlib.Path('tools/direct_demand/operations/read-commercial-price-monitor-20261104-read10-72h.php').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='ddfa54ff247af046e25fcae7b0ca594864ff105901999d2c4f33f5d121d94f14'
          prefix="<?php\ndeclare(strict_types=1);\n"
          assert source.startswith(prefix) and "count($scope)===159" in source
          assert "UNIX_TIMESTAMP(created_at)<?" in source and "$now-259200" in source and "LIMIT 2" in source
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read.php').write_text(header+source[len(prefix):])
          print('NEW_USER72H_HISTORICAL_SLICE_FROZEN_INPUT_OK scope159 old157slice_excludes_closed_read9 new2previously_unread old_pure_cases_rerun0 server_calls0')
          PY
          php -l "$RUNNER_TEMP/price-read.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only the new historical extension and previously unread new two hotels
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/price-read.php" > "$RUNNER_TEMP/price-readback.json" || probe_status=$?
          python3 - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'price-readback.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261104-read10-72h-extension1' and d['ok'] and d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          assert len(d['hotels'])==159 and len({r['local_tv_id'] for r in d['hotels']})==159
          assert d['db_writes']==d['provider_calls']==d['message_sends']==d['price_block_updates']==0
          assert d['max_age_seconds']==259200 and d['historical_slice_exclusive_upper_epoch_utc']==1793812524
          assert d['new_two_hotels_full72h_unread_scope']==[17480,1100] and all(len(r['observations'])<=2 for r in d['hotels'])
          for h in d['hotels']:
              if h['local_tv_id'] not in (17480,1100):
                  assert all(int(x['created_at_stored_epoch_utc'])<1793812524 for x in h['observations'])
          summary={'operation':d['operation'],'ok':True,'scope_hotels':159,'hotels_with_new_retained_rows':sum(bool(r['observations']) for r in d['hotels']),'new_retained_rows':sum(len(r['observations']) for r in d['hotels']),'eligible_current_name_hotels':sum(bool(r['observations']) and r.get('current_name_matches_expected') is True for r in d['hotels']),'readback_epoch_utc':d['readback_epoch_utc'],'lower_persistence_epoch_utc':d['created_after_persistence_epoch_utc'],'historical_exclusive_upper_epoch_utc':1793812524,'max_age_seconds':259200,'old_read9_slice_reread':False,'db_writes':0,'provider_calls':0,'message_sends':0,'price_block_updates':0}
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read10-summary.json').write_text(json.dumps(summary)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded private price inputs only in authenticated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-72h-extension1
          path: |
            ${{ runner.temp }}/price-readback.json
            ${{ runner.temp }}/price-read10-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and read scripts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/price-read.php" "$RUNNER_TEMP/price-readback.json" "$RUNNER_TEMP/price-read10-summary.json" "$RUNNER_TEMP/current-diagnostics-run.json"
