name: Inspect original retained price read5 result without another server read
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261103-read5
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41741553762
          path: ${{ runner.temp }}/original-read5
      - name: Inspect only safe metadata from the exact original private result
        env:
          RETAINED_PATH: ${{ runner.temp }}/original-read5
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RETAINED_PATH'])
          files=list(root.rglob('channel-preflight.json'));assert len(files)==1
          d=json.loads(files[0].read_text().splitlines()[-1])
          assert d.get('operation')=='commercial-price-monitor-20261103-read5'
          hotels=d.get('hotels',[])
          safe={'operation':'commercial-price-monitor-20261103-read5-original-artifact-inspection','original_run':41741553762,'original_ok':d.get('ok'),'error':d.get('error'),'original_operation':d.get('operation'),'original_mode':d.get('mode'),'completed_hotel_rows':len(hotels),'hotels_with_observations':sum(bool(h.get('observations')) for h in hotels),'observation_rows':sum(len(h.get('observations',[])) for h in hotels),'last_completed_catalog_ids':[h.get('local_tv_id') for h in hotels[-3:]],'readback_epoch_utc':d.get('readback_epoch_utc'),'schema_proof':d.get('schema_contract_proof'),'full_tuples_exported':0,'server_connections':0,'provider_calls':0,'db_writes':0,'message_edits':0}
          print(json.dumps(safe,sort_keys=True))
          PY
