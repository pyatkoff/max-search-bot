name: Prepare six native inline price links without provider access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 43564b38db46a02a102ddcab9e8f9bbf34ad2a1d
  LINK_SCOPE_FILENAME: commercial-hotel-search-links-20261105-priced6c-inline6-scope.json
  EXPECTED_LINK_SCOPE_SHA256: d7410bce2f0dc1a5680426f45bad23f85a7190b22cc4de2d7612d09eb7a6a7af
  LINK_CONTEXT_RUN: '42093416544'
  LINK_CONTEXT_SOURCE_SHA: 43564b38db46a02a102ddcab9e8f9bbf34ad2a1d
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context27-priced-inline6
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42093416544
          path: ${{ runner.temp }}/original-link-context
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Prepare frozen native link entities and exercise new actual input cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-priced-hotel-inline-price-link-20261105-data-bound.py
          python3 tools/direct_demand/operations/prepare-priced-hotel-inline-price-link-20261105-data-bound.py
          for target in "$RUNNER_TEMP"/hotel-search-links-prepared/*/update.php; do
            php -l "$target"
            ANYTOUR_INLINE_PRICE_LINK_NEW_CASES=1 php "$target"
          done
      - name: Retain frozen private manifests approval scripts and intents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-priced6c-inline6-prepared1
          path: ${{ runner.temp }}/hotel-search-links-prepared
          retention-days: 14
          if-no-files-found: warn
