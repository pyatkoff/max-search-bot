    - name: Verify all three exact public results once and retain actual XML bytes
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'READBACK'
        import base64,datetime,hashlib,json,os,pathlib,urllib.request
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed-tail';intent=json.loads((p/'write-intent.json').read_bytes());plan=json.loads((p/'source.json').read_bytes())
        writer=json.loads((p/'writer-receipt.json').read_bytes().splitlines()[-1]);assert writer['ok'] is True
        class NoRedirect(urllib.request.HTTPRedirectHandler):
         def redirect_request(self,*args,**kwargs):return None
        opener=urllib.request.build_opener(NoRedirect);verified=[]
        for expected in intent['files']:
         url='https://app.anytoour.ru/feed/'+expected['name']
         with opener.open(urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=20) as response:
          assert response.status==200 and response.geturl()==url;raw=response.read(4000001)
         assert len(raw)==expected['bytes'] and hashlib.sha256(raw).hexdigest()==expected['sha256'],'PUBLIC_FEED_READBACK_CHANGED'
         local=next(f for f in writer['files'] if f['name']==expected['name']);assert local['sha256']==expected['sha256']
         (p/('public-'+expected['name'])).write_bytes(raw)
         verified.append({**{k:expected[k] for k in ('name','sha256','bytes','rows')},'http_status':200,'public_url':url,'public_sha256':hashlib.sha256(raw).hexdigest(),'writer_sha256':local['sha256'],'public_content_base64':base64.b64encode(raw).decode()})
        result={'operation':os.environ['FEED_OPERATION'],'ok':True,'installed_sha':os.environ['EXPECTED_PRODUCTION_SHA'],'files':verified,'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'post_write_attempts':0,'provider_calls':0,'db_writes':0}
        (p/'public-readback.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
        summary={'ok':True,'operation':os.environ['FEED_OPERATION'],'schema_version':4,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'head_sha':os.environ['GITHUB_SHA'],'installed_sha':os.environ['EXPECTED_PRODUCTION_SHA'],'publication_installed_sha':plan['expected_installed_sha'],'previous_logical_hotels':575,'new_hotel_ids':[9287,1013,4185,14140,468],'logical_hotels':580,'offer_counts':[580,580,1160],'old575_offer_blocks_byte_exact':True,'old_price_blocks_byte_exact':True,'writer_attempts':1,'retry_authorized':False,'post_write_attempts':0,'provider_calls':0,'db_writes':0,'files':[{k:f[k] for k in ('name','sha256','bytes','rows')} for f in verified],'source_sha256':hashlib.sha256((p/'source.json').read_bytes()).hexdigest(),'input_sha256':intent['input_sha256'],'writer_receipt_sha256':hashlib.sha256((p/'writer-receipt.json').read_bytes()).hexdigest(),'readback_sha256':hashlib.sha256((p/'public-readback.json').read_bytes()).hexdigest(),'publication_summary_sha256':plan['publisher']['publication_summary_sha256'],'bound_read_sha256':plan['publisher']['bound_read_sha256'],'route_proof_sha256':plan['route']['route_proof_sha256'],'verified_at_utc':result['verified_at_utc']}
        summary.update({'qualified_continuation_id':plan['continuation']['id'],'original_feed_run_id':43340115672,'recovery_terminal_run_id':plan['recovery_terminal']['run_id']})
        (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
        print(json.dumps(summary,ensure_ascii=False))
        READBACK
