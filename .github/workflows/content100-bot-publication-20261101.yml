name: Validate ten new stock inputs and targeted projection without a server connection
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 2f7cff9ab66f59003af8df8a7f18ef2b93bca93d
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Check only new input preparation and targeted projection cases without SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-commercial-stock-20261104-40.py
          php -l "$RUNNER_TEMP/channel-preflight.php"
          ANYTOUR_STOCK40_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-preflight.php"
      - name: Remove the ephemeral pure script
        if: always()
        run: rm -f "$RUNNER_TEMP/channel-preflight.php"
