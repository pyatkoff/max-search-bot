name: Complete remaining33 preparation with isolated image dependency
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'da4d2ef93ddf7701ced6021ad3bc95255430a5f8' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact unchanged preparation and original no-server failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = da4d2ef93ddf7701ced6021ad3bc95255430a5f8
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^:.github/workflows/content100-bot-publication-20261101.yml)" = 22c1d32070ab4f5223ad7f977ae077cdaef3a7c9
          p=tools/direct_demand/operations
          test "$(git hash-object "$p/commercial-expansion33-authored-20261116.json")" = fd421a0ea1c5f2cfe6476f49aaf6708b561a8436
          test "$(git hash-object "$p/read-expansion20-release-clearance-20261116.php")" = 90eb8a24b7b38e7cdf065256a50a4d3ed201cbb7
          test "$(git hash-object "$p/commercial-batch-template-20261102.php")" = 353d5125d212df7584d24fd04d0f692d90176edb
          test "$(git hash-object "$p/commercial-expansion100-catalogue-candidates-20261116.json")" = 728ce08a9eed7745cfcba015ecd42c20431ef9bf
          umask 077
          mkdir "$RUNNER_TEMP/remaining33-release"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43920622217/jobs?per_page=100 > "$RUNNER_TEMP/remaining33-release/original-failed-jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43918096119 > "$RUNNER_TEMP/remaining33-release/media-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14250287562 > "$RUNNER_TEMP/remaining33-release/media-artifact.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14250287562/zip > "$RUNNER_TEMP/media33.zip"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/remaining33-release/main-at-read.json"
          python3 - <<'PY'
          import json,pathlib,hashlib,zipfile,os,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining33-release'
          j=json.loads((out/'original-failed-jobs.json').read_bytes());assert j['total_count']==1
          job=j['jobs'][0];assert job['id']==133486609853 and job['conclusion']=='failure'
          steps={s['name']:s for s in job['steps']}
          assert steps['Build exact captions, source-photo covers and read-only clearance input']['conclusion']=='failure'
          for name in ['Prepare existing server connection','Pin existing server identity','Read current identities and publication duplicates for all33 without mutation']:assert steps[name]['conclusion']=='skipped'
          r=json.loads((out/'media-run.json').read_bytes());a=json.loads((out/'media-artifact.json').read_bytes())
          assert r['id']==43918096119 and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure' and r['head_sha']=='a897e401243fa809541434cd0872f64a26a5554b'
          assert a['id']==14250287562 and not a['expired'] and a['workflow_run']['id']==43918096119
          raw=(out.parent/'media33.zip').read_bytes();assert hashlib.sha256(raw).hexdigest()=='3dc72e0e5005c20a0832cd927ca627196869e7764f519f9aa37ad75ccae3f8fe' and a['digest']=='sha256:'+hashlib.sha256(raw).hexdigest()
          with zipfile.ZipFile(out.parent/'media33.zip') as z:
            assert z.testzip() is None and all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(out/'media')
          m=json.loads((out/'media/manifest.json').read_text());assert m['hotels']==33 and m['downloaded']==196 and m['failed']==2
          assert {(x['tourvisor_id'],x['source_image_index']) for x in m['rows'] if not x['downloaded']}=={(43569,26),(2470,14)}
          # Retain the already-reviewed exact commands. Only the missing dependency changes.
          original=subprocess.check_output(['git','show','da4d2ef93ddf7701ced6021ad3bc95255430a5f8:.github/workflows/content100-bot-publication-20261101.yml']).decode()
          names=['Build exact captions, source-photo covers and read-only clearance input','Prepare existing server connection','Pin existing server identity','Read current identities and publication duplicates for all33 without mutation']
          commands=[]
          for i,name in enumerate(names):
            marker='      - name: '+name+'\n';assert original.count(marker)==1
            part=original.split(marker,1)[1].split('\n      - ',1)[0];assert part.count('        run: |\n')==1
            lines=part.split('        run: |\n',1)[1].splitlines();assert all(not line or line.startswith('          ') for line in lines)
            body='\n'.join(line[10:] if line else '' for line in lines)+'\n'
            target=out/f'step-{i}.sh';target.write_text(body);commands.append({'name':name,'sha256':hashlib.sha256(body.encode()).hexdigest()})
          (out/'reused-command-proof.json').write_text(json.dumps({'original_workflow_blob':'22c1d32070ab4f5223ad7f977ae077cdaef3a7c9','commands':commands,'prior_server_steps':'skipped','new_supplier_image_gets':0},indent=2)+'\n')
          print('ORIGINAL_MEDIA_REUSED new_image_downloads=0 prior_server_steps=skipped')
          PY
      - name: Install the missing image library only into the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --target "$RUNNER_TEMP/remaining33-python" Pillow==12.0.0
          echo "PYTHONPATH=$RUNNER_TEMP/remaining33-python" >> "$GITHUB_ENV"
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Build exact captions and original-source photo covers
        shell: bash
        run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/remaining33-release/step-0.sh"
      - name: Prepare the existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/remaining33-release/step-1.sh"
      - name: Verify unchanged server identity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/remaining33-release/step-2.sh"
      - name: Perform the previously unstarted native33 read without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/remaining33-release/step-3.sh"
      - name: Retain exact prepared inputs and original read evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining33-prepared-clearance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/remaining33-release/prepared33.json
            ${{ runner.temp }}/remaining33-release/clearance-input.json
            ${{ runner.temp }}/remaining33-release/clearance.json
            ${{ runner.temp }}/remaining33-release/source-proof.json
            ${{ runner.temp }}/remaining33-release/main-at-read.json
            ${{ runner.temp }}/remaining33-release/exit-code.txt
            ${{ runner.temp }}/remaining33-release/reused-command-proof.json
            ${{ runner.temp }}/remaining33-release/original-failed-jobs.json
            ${{ runner.temp }}/remaining33-release/covers/
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
