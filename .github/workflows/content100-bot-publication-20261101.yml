name: Validate original no-write monitor recovery and hold handling
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate exact repair source and current main before credentials
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_RUN_ATTEMPT" = 1

        php -l tools/direct_demand/operations/monitor-price-hook-contract.php

        php -l tools/direct_demand/operations/monitor-price-after-collection.php

        php -l tools/direct_demand/operations/reconcile-monitor-price-no-write-20261112.php

        php tools/direct_demand/operations/test-monitor-price-contract.php

        php tools/direct_demand/operations/test-monitor-price-hook.php

        python3 tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-hook.php"

        php -l "$RUNNER_TEMP/monitor-price-hook.php"

        python3 tools/direct_demand/operations/build-monitor-no-write-reconciliation.py
        "$RUNNER_TEMP/monitor-no-write-reconciliation.php"

        php -l "$RUNNER_TEMP/monitor-no-write-reconciliation.php"

        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/main-before-operation.json"

        python3 - <<''PYCURRENT''

        import json,os,pathlib

        actual=json.loads(pathlib.Path(os.environ[''RUNNER_TEMP''],''main-before-operation.json'').read_text())[''object''][''sha'']

        assert actual==os.environ[''EXPECTED_PRODUCTION_SHA''],''CURRENT_MAIN_CHANGED_BEFORE_CREDENTIALS''

        PYCURRENT

        '
    - name: Record built source digests
      shell: bash
      run: sha256sum "$RUNNER_TEMP/monitor-price-hook.php" "$RUNNER_TEMP/monitor-no-write-reconciliation.php"
env:
  EXPECTED_PRODUCTION_SHA: d1c79f5753d7d254d17921072f5ce59520082f4d
