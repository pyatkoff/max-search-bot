name: Merge exact nine legacy contexts and validate new price updater bindings without actualization or edits
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41941025252
          path: ${{ runner.temp }}/context-read1
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read2
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41941689331
          path: ${{ runner.temp }}/context-read2
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read4
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41943048307
          path: ${{ runner.temp }}/context-read4
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-72h-extension1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41934633857
          path: ${{ runner.temp }}/original-read10
      - name: Merge only accepted source bindings and evaluate original unquoted contexts at actual UTC date
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-legacy9-canonical-price-inputs-20261105.py
          php -l "$RUNNER_TEMP/legacy9-price-guard-fixture.php"
          ANYTOUR_LEGACY9_PRICE_BINDING_FIXTURE=1 php "$RUNNER_TEMP/legacy9-price-guard-fixture.php"
      - name: Retain private canonical inputs and pure updater proof without execution approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-legacy9-20261105-canonical-price-inputs
          path: |
            ${{ runner.temp }}/legacy9-canonical-frames.private.json
            ${{ runner.temp }}/legacy9-price-candidates.private.json
            ${{ runner.temp }}/legacy9-merge-summary.json
          retention-days: 14
          if-no-files-found: warn
