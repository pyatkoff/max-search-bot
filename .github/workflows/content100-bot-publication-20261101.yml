name: Project only native8208 metadata from the original authenticated TOP500 result
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-top500-internal-base-20261105-ten1-result
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42165764181
          path: ${{ runner.temp }}/original-ten1
      - name: Validate new one-property projection and canonical closed-contact metadata
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python3 -m py_compile tools/direct_demand/operations/project-top500-internal-base-20261106-8208-metadata1.py
          python3 tools/direct_demand/operations/project-top500-internal-base-20261106-8208-metadata1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-top500-internal-base-20261106-8208-metadata1
          path: |
            ${{ runner.temp }}/top500-8208-metadata.private.json
            ${{ runner.temp }}/top500-8208-summary.json
          retention-days: 14
          if-no-files-found: warn
