name: Read nine fixed official hotel media pages for batch19
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0,1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only the fixed official public source group
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain bounded native image evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-batch19-public-source-group-${{ matrix.media_group }}
          path: |
            public-media-sources.json
          retention-days: 14
          if-no-files-found: error
