name: Prepare all 72h basket manifests privately while the current production release is pending
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 704ab1c4b0ee17fec46c471180fe7cfb0a6a5711
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-72h-pass1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41935232491
          path: ${{ runner.temp }}/price72-pass1
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41932708020
          path: ${{ runner.temp }}/moscow-source
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read9
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41898354901
          path: ${{ runner.temp }}/retained-read9
      - name: Prepare exact real-flight full-basket manifests with no server connection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/prepare-commercial-price-update-20261104-72h-pass1.py
          find "$RUNNER_TEMP/price72-pass1" -name update.php -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'price72-pass1','preparation-only-not-execution-approval.json')
          p.write_text(json.dumps({'state':'OFFLINE_FROZEN_BASKETS_ONLY_CURRENT_RELEASE_APPROVAL_STILL_REQUIRED','execution_approval':False,'original_quote_source':'0a80b95fa31e3a90267daa8984adae24d6aaa6bb','provisional_target_source':os.environ['EXPECTED_PRODUCTION_SHA'],'server_calls':0,'provider_calls':0,'edits':0})+'\n')
          PY
      - name: Verify only the supplied picture ID country and name correspondence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/verify-moscow-picture-native-ids-20261104.py
      - name: Retain safe source picture-ID correspondence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-picture-native-binding1
          path: ${{ runner.temp }}/moscow-picture-native-binding-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain provisional frozen baskets privately without approving execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-update-20261104-72h-pass1-prepared
          path: ${{ runner.temp }}/price72-pass1
          retention-days: 14
          if-no-files-found: warn
