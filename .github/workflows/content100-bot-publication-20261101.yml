name: Validate inactive manual refresh execution guards and read only source helper presence
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 25a2d5e31aec7243b45c47e836a544e659e28b1d
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937182905 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41937182905/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963662 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963780 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - name: Validate only the five new execution gates and freeze the read-only route probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import ast,pathlib
          for f in ['prepare-published-price-refresh-execution-20261105.py','run-published-price-refresh-execution-20261105.py']:
           ast.parse(pathlib.Path('tools/direct_demand/operations',f).read_text())
          PY
          python3 tools/direct_demand/operations/prepare-published-price-refresh-execution-20261105.py --fixture
          php -l "$RUNNER_TEMP/manual-refresh.php"
          ANYTOUR_MANUAL_REFRESH2_EXECUTION_FIXTURE=1 php "$RUNNER_TEMP/manual-refresh.php"
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path('tools/direct_demand/operations/read-published-price-refresh-route-preflight-20261105.php').read_text()
          prefix="<?php\ndeclare(strict_types=1);\n";assert source.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read.php').write_text(header+source[len(prefix):])
          PY
          php -l "$RUNNER_TEMP/price-read.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Check only existence and hashes of the existing source helper files without importing private config
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/price-read.php" > "$RUNNER_TEMP/price-readback.json" || probe_status=$?
          python3 - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'price-readback.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-source-refresh-20261105-pass1-readonly-route-preflight' and d['ok'] and d['installed_source']==os.environ['EXPECTED_PRODUCTION_SHA']
          assert d['provider_calls']==d['db_calls']==d['writes']==d['secret_values_exported']==0 and d['private_source_config_read'] is False
          assert d['pinned_helper_count']==8
          pathlib.Path(os.environ['RUNNER_TEMP'],'manual-refresh-route-summary.json').write_text(json.dumps(d)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded private price inputs only in authenticated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-refresh-20261105-pass1-route-preflight
          path: |
            ${{ runner.temp }}/price-readback.json
            ${{ runner.temp }}/manual-refresh-route-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and read scripts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/price-read.php" "$RUNNER_TEMP/price-readback.json" "$RUNNER_TEMP/manual-refresh-route-summary.json" "$RUNNER_TEMP/current-diagnostics-run.json"
