name: Read existing32 publication bindings for routes and feeds
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '8059484b47906cf01f890bdbabacd827c886f494' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: ec72fcffa24ace22a997b642c33ea7fb6fb251d9
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate original receipts and complete current source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 8059484b47906cf01f890bdbabacd827c886f494
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          umask 077
          w="$RUNNER_TEMP/bindings32";e="$w/source-evidence";mkdir -p "$e"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43922854551 > "$w/publication-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14254468446/zip > "$w/publication-intent.zip"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14253254475/zip > "$w/publication-result.zip"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14228391968/zip > "$w/old-reader.zip"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$e/main.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_SOURCE&per_page=100" > "$e/runs.json"
          python3 - <<'PY'
          import os,json,pathlib
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'bindings32';e=w/'source-evidence';sha=os.environ['EXPECTED_SOURCE']
          p=json.loads((w/'publication-run.json').read_bytes());assert p['id']==43922854551 and p['run_attempt']==1 and p['head_sha']=='0b340cafc6125cfa9967cb6597d03029462261dd' and p['conclusion']=='success' and p['status']=='completed'
          assert json.loads((e/'main.json').read_bytes())['object']['sha']==sha
          runs=json.loads((e/'runs.json').read_bytes());assert runs['total_count']<=100
          paths=['deploy.yml','max-tls-preflight.yml','modeled-conversion-value-export.yml','max-production-health.yml','telegram-production-health.yml','live-session-diagnostics.yml','modeled-conversion-monitor.yml','tour-selection-host.yml','publish-conversation-diagnostics.yml'];selected={}
          for name in paths:
            eligible=[r for r in runs['workflow_runs'] if r['head_sha']==sha and r['head_branch']=='main' and r['path']=='.github/workflows/'+name and r['run_attempt']==1 and r['event'] in ['push','workflow_run']]
            assert len(eligible)==1,'original gate not unique: '+name
            r=eligible[0];assert r['status']=='completed' and r['conclusion']=='success','gate not successful: '+name
            (e/('verify_run.json' if name=='deploy.yml' else 'tls_run.json' if name=='max-tls-preflight.yml' else 'gate-'+name+'.json')).write_text(json.dumps(r))
            selected[name]={'run_id':r['id'],'head_sha':sha,'run_attempt':1,'conclusion':r['conclusion']}
          (e/'deploy-id.txt').write_text(str(selected['deploy.yml']['run_id']));(e/'gate-receipts.json').write_text(json.dumps(selected,indent=2)+'\n')
          PY
          deploy="$(cat "$e/deploy-id.txt")"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/$deploy/jobs?per_page=100" > "$e/verify_jobs.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_SOURCE" > "$e/source_commit.json"
          tree="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$e/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree?recursive=1" > "$e/source_tree.json"
          python3 tools/direct_demand/operations/prepare-remaining32-current-bindings-20261116.py "$w"
      - name: Prepare existing pinned server connection
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only four bounded existing-publication groups
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/bindings32"
          for group in 22 23 24 25; do
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SOURCE"
            status=0
            ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && GIT_OPTIONAL_LOCKS=0 php' < "$w/$group/read.php" > "$w/$group/bound-read.json" || status=$?
            printf '%s\n' "$status" > "$w/$group/read-exit.txt"
            cat "$w/$group/bound-read.json"
            test "$status" = 0
            GROUP="$group" python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bindings32'/os.environ['GROUP'];r=json.loads((p/'bound-read.json').read_bytes());a=json.loads((p/'approval.json').read_bytes());pub=json.loads((p/'publication.json').read_bytes());ids=a['hotel_ids']
          assert r['ok'] and r['installed_sha']==os.environ['EXPECTED_SOURCE'] and r['scope_hotels']==r['feed_rows']==r['private_binding_count']==len(ids) and r['deferred_count']==0
          assert all(r[k]==0 for k in ['db_writes','provider_calls','message_sends'])
          assert [x['hotel_id'] for x in r['rows']]==[x['hotel_id'] for x in r['private_max_bindings']]==ids
          for row,b in zip(r['rows'],r['private_max_bindings']):
            posts={x['platform']:x for x in pub['posts'] if x['hotel_id']==row['hotel_id']}
            assert row['max_post_url']==b['post_url']==posts['max']['post_url'] and row['telegram_post_url']==posts['telegram']['post_url']
            assert b['publication_id']==posts['max']['publication_id'] and b['version_id']==posts['max']['version_id']
          print('CURRENT_BINDINGS_CONFIRMED group='+os.environ['GROUP']+' pairs='+str(len(ids)))
          PY
          done
      - name: Retain all original read evidence without replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-current-bindings-${{ github.run_id }}
          path: ${{ runner.temp }}/bindings32/
          retention-days: 30
          if-no-files-found: error
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
