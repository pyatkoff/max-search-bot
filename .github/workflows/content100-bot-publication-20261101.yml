name: Read the current Rixos Premium Seagate Telegram caption
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  telegram_readback:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact public Telegram caption without writing
        run: python3 tools/direct_demand/operations/read-rixos-telegram-caption-20261107.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-read-rixos-telegram-caption-20261107-result
          path: rixos-telegram-public-readback.json
          retention-days: 14
          if-no-files-found: error
