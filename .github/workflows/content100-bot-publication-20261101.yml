name: Read saved monitor conditions for two held or deferred hotels
'on':
  push:
    branches:
      - audit/content100-bot-publication-20261101
    paths:
      - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact readonly reader and run its pure checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import hashlib,pathlib
          base=pathlib.Path('tools/direct_demand/operations')
          expected={
              'monitor-price-contract.php':'62e8ab1ab0c08eea9dd42ac6dbb362f0015e397e90e2617d7f44aa6be0c7f690',
              'read-monitor-two-hotels-20261112.php':'df27ad89c370a9d104a5e588d0202788e8fa81011f6fa2b99e3edc1a2b8d2b6c',
              'test-monitor-two-hotels-20261112.php':'fe828d80d3af1f3f1a6ed5ea75c154a3596cb743046743fed4782ec29fd7eb74',
          }
          for name,digest in expected.items():
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest,'READONLY_DIAGNOSTIC_SOURCE_CHANGED'
          print('READONLY_DIAGNOSTIC_SOURCE_OK')
          PY
          php -l tools/direct_demand/operations/read-monitor-two-hotels-20261112.php
          php -l tools/direct_demand/operations/test-monitor-two-hotels-20261112.php
          php tools/direct_demand/operations/test-monitor-two-hotels-20261112.php
      - name: Read saved monitoring for TV1142 and TV43060 once without credentials
        shell: bash
        run: |
          set -euo pipefail
          php tools/direct_demand/operations/read-monitor-two-hotels-20261112.php | tee "$RUNNER_TEMP/monitor-two-hotel-diagnostics.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-two-hotel-readonly-diagnostics
          path: ${{ runner.temp }}/monitor-two-hotel-diagnostics.jsonl
          retention-days: 14
