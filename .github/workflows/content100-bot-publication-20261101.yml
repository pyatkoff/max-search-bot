name: Correct 176 existing hotel captions explicitly approved by owner
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8d3dfec0e6bce70e16b8717312d5dd6faf954fc1
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate and compile the exact 176 owner-approved caption edits
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-private"
        mkdir -m 700 "$RUNNER_TEMP/caption-repair-safe"
        python3 - <<'PY'
        import pathlib,hashlib,base64,gzip,json,os
        o=pathlib.Path('tools/direct_demand/operations');p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-private')
        packed=(o/'commercial-caption-repair-20261113-inputs.json.gz.b64').read_bytes()
        assert hashlib.sha256(packed).hexdigest()=='66f3238c74e256967e6c50b8e4abd2d0a7c865bc8b881ea99bc40cd22e8305f0'
        files=json.loads(gzip.decompress(base64.b64decode(packed)))
        assert set(files)==set(['approved-cohort.json', 'index.json', 'current-snapshot.json'])
        for name,text in files.items(): (p/name).write_text(text)
        cohort=json.loads(files['approved-cohort.json']);index=json.loads(files['index.json'])
        assert len(cohort['rows'])==176 and index['cohort_sha256']==hashlib.sha256(files['approved-cohort.json'].encode()).hexdigest()
        executor=(o/'commercial-caption-repair-20261113-executor.php').read_bytes();verifier=(o/'commercial-caption-repair-20261113-verify.py').read_bytes()
        assert hashlib.sha256(executor).hexdigest()=='20e945d5c421dfdc69c0182f9529b6c1d7cbfa743a4bb6a9f60cfc3882e9a9fc' and hashlib.sha256(verifier).hexdigest()=='e8724f8cd98cd52c2e2e29e407ff6e6246b52cfc234ba48d0e41906b5abb599e'
        assert hashlib.sha256(files['current-snapshot.json'].encode()).hexdigest()==cohort['source_read_sha256']
        snapshot=json.loads(files['current-snapshot.json']);byid={r['publication_id']:r for r in cohort['rows']};previous=None
        for b in index['batches']:
         m={'schema_version':1,'operation':b['operation'],'expected_installed_sha':'8d3dfec0e6bce70e16b8717312d5dd6faf954fc1','update_kind':'approved_existing_caption_quality_revision','snapshot':{'operation':snapshot['operation'],'installed_sha':'8d3dfec0e6bce70e16b8717312d5dd6faf954fc1','post_count':176,'sha256':cohort['source_read_sha256'],'observed_at_utc':snapshot['observed_at_utc']},'button_text':'✈️ Узнать стоимость тура','throttle_microseconds':3200000,'row_count':b['post_count'],'rows':[byid[i] for i in b['publication_ids']],'quality_cohort_sha256':index['cohort_sha256'],'quality_authorization':cohort['authorization'],'batch_index':b['index'],'batch_kind':'canary' if b['index']==0 else 'batch','predecessor':previous}
         raw=(json.dumps(m,ensure_ascii=False,indent=2)+'\n').encode();(p/(b['name']+'.manifest.json')).write_bytes(raw)
         assert hashlib.sha256(raw).hexdigest()==b['manifest_sha256'] and len(m['rows'])==b['post_count']
         defs={'EXPECTED_INSTALLED_SHA':'8d3dfec0e6bce70e16b8717312d5dd6faf954fc1','APPROVED_UPDATE_OPERATION':m['operation'],'APPROVED_MANIFEST_SHA256':b['manifest_sha256'],'MANIFEST_BASE64':base64.b64encode(raw).decode(),'REPAIR_COHORT_SHA256':index['cohort_sha256'],'REPAIR_BATCH_INDEX':str(b['index']),'REPAIR_PUBLICATION_IDS_BASE64':base64.b64encode(json.dumps(b['publication_ids']).encode()).decode()}
         constants='\n'.join("define('%s', '%s');"%(k,v) for k,v in defs.items())
         compiled=executor.decode().replace('declare(strict_types=1);','declare(strict_types=1);\n'+constants,1)
         (p/(b['name']+'.php')).write_text(compiled)
         previous={'operation':m['operation'],'manifest_sha256':b['manifest_sha256']}
         reader=(o/'commercial-caption-repair-20261113-read-scope.php').read_text();scope=(o/'commercial-caption-repair-20261113-scope.json').read_bytes()
         defs={'EXPECTED_INSTALLED_SHA':'8d3dfec0e6bce70e16b8717312d5dd6faf954fc1','APPROVED_MANIFEST_SHA256':hashlib.sha256(scope).hexdigest(),'MANIFEST_BASE64':base64.b64encode(scope).decode()}
         (p/'reader.php').write_text(reader.replace('declare(strict_types=1);','declare(strict_types=1);\n'+'\n'.join("define('%s', '%s');"%(k,v) for k,v in defs.items()),1))
        compile(verifier.decode(),'<verifier>','exec')
        print(json.dumps({'approved_hotels':88,'existing_captions':176,'batches':5,'price_blocks_retained':22}))
        PY
        for file in "$RUNNER_TEMP/caption-repair-private/"*.php; do php -l "$file"; done
    - name: Require original current-source release and health gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -m 700 "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api repos/pyatkoff/max-search-bot/actions/runs/43320721962 > "$evidence/verify_run.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/43320721962/jobs?per_page=30" > "$evidence/verify_jobs.json"
        gh api repos/pyatkoff/max-search-bot/actions/runs/43323005689 > "$evidence/tls_run.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        for run_id in 43323005645 43323005680 43323005607 43323005643 43323005854 43323005720 43323005843; do
          gh api "repos/pyatkoff/max-search-bot/actions/runs/$run_id" > "$evidence/gate-$run_id.json"
        done
        python3 - <<'PY'
        import json,os,pathlib
        t=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');sha=os.environ['EXPECTED_PRODUCTION_SHA']
        deploy=json.loads((t/'verify_run.json').read_text());assert deploy['status']=='completed' and deploy['conclusion']=='success' and deploy['head_sha']==sha
        jobs=json.loads((t/'verify_jobs.json').read_text());assert len(jobs['jobs'])==6 and all(j['status']=='completed' and j['conclusion']=='success' and j['head_sha']==sha for j in jobs['jobs'])
        expected={43323005645:'modeled-conversion-value-export.yml',43323005680:'max-production-health.yml',43323005607:'telegram-production-health.yml',43323005643:'live-session-diagnostics.yml',43323005854:'modeled-conversion-monitor.yml',43323005720:'tour-selection-host.yml',43323005843:'publish-conversation-diagnostics.yml'}
        for rid,name in expected.items():
            r=json.loads((t/f'gate-{rid}.json').read_text());assert r['id']==rid and r['head_sha']==sha and r['path']=='.github/workflows/'+name and r['status']=='completed' and r['conclusion']=='success'
        print('ORIGINAL_CURRENT_SOURCE_GATES_ACCEPTED reviewed_publishing_blobs=22 no_checks_dispatched=1')
        PY
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
