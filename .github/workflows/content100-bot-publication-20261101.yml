name: Read the ten selected official hotel media sources
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only the finite official pages for the next hotel batch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain public promotional cover observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-batch10-public-media
          path: |
            public-media-sources.json
          retention-days: 14
