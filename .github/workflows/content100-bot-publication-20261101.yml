name: Verify new bounded one to ten hotel link contracts only
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  LINK_SCOPE_FILENAME: commercial-hotel-search-links-20261105-context23-ten7-scope.json
jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify only new bounded native and Python functions without server or provider access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-hotel-search-links-current-contexts-20261105-data-bound.py tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-data-bound.py tools/direct_demand/operations/check-hotel-search-links-bounded-scope-20261105.py
          php -l tools/direct_demand/operations/read-hotel-search-links-current-contexts-20261105-data-bound.php
          php -l tools/direct_demand/operations/update-hotel-search-links-explicit-noquote-20261105-data-bound.php
          python3 tools/direct_demand/operations/check-hotel-search-links-bounded-scope-20261105.py
