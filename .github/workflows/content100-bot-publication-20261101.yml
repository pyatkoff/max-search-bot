name: Publish immutable assets for the eligible remaining32 hotels
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'd29252c9991aebb6f3c658e1deff6f2833db1889' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate the original successful clearance and actual reviewed covers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = d29252c9991aebb6f3c658e1deff6f2833db1889
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          umask 077
          mkdir "$RUNNER_TEMP/remaining32-assets"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43921478505 > "$RUNNER_TEMP/remaining32-assets/clearance-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14253362790/zip > "$RUNNER_TEMP/prepared33.zip"
          python3 - <<'PY'
          import os,pathlib,json,hashlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP']);out=p/'remaining32-assets';r=json.loads((out/'clearance-run.json').read_bytes())
          assert r['id']==43921478505 and r['run_attempt']==1 and r['conclusion']=='success' and r['head_sha']=='d29252c9991aebb6f3c658e1deff6f2833db1889'
          raw=(p/'prepared33.zip').read_bytes();assert hashlib.sha256(raw).hexdigest()=='3ded6f36973acc239104fa7f4f66d39b9e2347559c5e08c43790b34e9dfff150'
          with zipfile.ZipFile(p/'prepared33.zip') as z:
            assert z.testzip() is None and all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(out/'prepared')
          def load(name,digest):
            b=(out/'prepared'/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest;return json.loads(b)
          prepared=load('prepared33.json','f5ad1989883965879f2d2f5882beaf8988b5a627d46e3c4ecfb720a3e828a934')
          clearance=load('clearance.json','4200a8e56e53dc264ddadf1a6e090e1957c50c6133da75b386568ccf1d513384')
          assert clearance['ok'] and clearance['clear_count']==33 and clearance['blocked_count']==0
          assert clearance['runtime']=={'head':'372823d98e580e708169bc8ac9367245376a803b','tracked_clean':True,'component_mismatches':[]}
          assert clearance['monitor']['pending'] is None and clearance['monitor']['cycle']['state']=='budget_exhausted'
          assert len(prepared['rows'])==33 and prepared['media_hold']==[108165]
          rows=[]
          for row in prepared['rows']:
            if row['hotel_id']==108165:
              assert row['media_hold'] and row['cover'] is None;continue
            assert not row['media_hold'] and row['cover'] and row['new_price'] is None
            raw=(out/'prepared'/row['cover']['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==row['cover']['sha256'] and raw.startswith(b'\x89PNG\r\n\x1a\n')
            assert hashlib.sha256(row['text'].encode()).hexdigest()==row['text_sha256'] and len(row['text'].encode('utf-16-le'))//2<=1024
            rows.append(row)
          assert len(rows)==32 and len({r['hotel_id'] for r in rows})==32 and len({r['cover']['sha256'] for r in rows})==32
          review={'schema':'remaining32_channel_editorial_review_v1','scope_issue':1142,'scope_comment':6923781196,'prepared_sha256':'f5ad1989883965879f2d2f5882beaf8988b5a627d46e3c4ecfb720a3e828a934','clearance_run':43921478505,'all32_actual_rendered_covers_reviewed':True,'review_basis':'Four actual contact sheets built from the downloaded and checksum-verified artifact14253362790; legible headings, scene variety and no blank/corrupt chosen frames. The uncertain Soneva Secret media is excluded.','content_basis':'Retained exact hotel dossiers with primary-source checks recorded in the authored input. No price, tariff availability or free-service entitlement inferred.','new_copyright_permission_claimed':False,'knowledge_admission_claimed':False,'new_channel_messages':0,'held_ids':[108165],'rows':rows}
          (out/'reviewed32.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          print('REVIEWED_ASSET_SCOPE hotels=32 held=1 old_published_excluded=20')
          PY
      - name: Retain original inputs before publishing image-only repository objects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-assets-intent-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/remaining32-assets/reviewed32.json
            ${{ runner.temp }}/remaining32-assets/clearance-run.json
            ${{ runner.temp }}/remaining32-assets/prepared/
          if-no-files-found: error
          retention-days: 30
      - name: Create immutable image assets once with exact readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json,hashlib,base64,urllib.request,urllib.error
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining32-assets';review=json.loads((p/'reviewed32.json').read_bytes());repo='pyatkoff/max-search-bot';branch='assets/hotel-expansion33-20261116';base=os.environ['GITHUB_SHA']
          result={'ok':False,'branch':branch,'parent':base,'channel_writes':0,'server_connections':0,'held_ids':[108165],'blobs':[],'ref_write_attempted':False}
          def save():(p/'asset-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          def api(method,path,value=None):
            raw=None if value is None else json.dumps(value,separators=(',',':')).encode();req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=raw,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          save()
          try:
            try:api('GET','git/ref/heads/'+branch)
            except urllib.error.HTTPError as e:assert e.code==404
            else:raise RuntimeError('asset_ref_exists_no_replay')
            assert api('GET','git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==base
            parent=api('GET','git/commits/'+base);tree=[]
            for r in review['rows']:
              raw=(p/'prepared'/r['cover']['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==r['cover']['sha256'];path='.github/traffic-publish/commercial-expansion33-20261116/'+str(r['hotel_id'])+'.png'
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest();b=api('POST','git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'});assert b['sha']==expected
              tree.append({'path':path,'mode':'100644','type':'blob','sha':b['sha']});result['blobs'].append({'hotel_id':r['hotel_id'],'path':path,'git_blob':b['sha'],'sha256':r['cover']['sha256']});save()
            assert len(tree)==32 and len({r['sha'] for r in tree})==32
            t=api('POST','git/trees',{'base_tree':parent['tree']['sha'],'tree':tree});c=api('POST','git/commits',{'message':'assets: thirty-two reviewed remaining hotel covers; Soneva Secret held','tree':t['sha'],'parents':[base]});result['asset_commit']=c['sha'];save()
            result['ref_write_attempted']=True;save();api('POST','git/refs',{'ref':'refs/heads/'+branch,'sha':c['sha']})
            assert api('GET','git/ref/heads/'+branch)['object']['sha']==c['sha']
            diff=api('GET','compare/'+base+'...'+c['sha']);assert len(diff['files'])==32 and {r['filename'] for r in diff['files']}=={r['path'] for r in tree} and all(r['status']=='added' for r in diff['files'])
            for row in result['blobs']:row['url']='https://raw.githubusercontent.com/'+repo+'/'+c['sha']+'/'+row['path']
            result['ok']=True;save();print('IMMUTABLE_ASSETS_READY='+json.dumps({'asset_commit':c['sha'],'covers':32,'post_writes':0,'held':1}))
          except Exception as e:result['error_type']=type(e).__name__;save();raise
          PY
      - name: Retain every actual asset outcome without automatic retry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-assets-result-${{ github.run_id }}
          path: ${{ runner.temp }}/remaining32-assets/asset-result.json
          if-no-files-found: ignore
          retention-days: 30
