name: Read nineteen new feed bindings without repeated candidate clearance
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 840287a325da73df049a0dce8ee0b1f51aaacc10
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42415428080 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/42415428080/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42415937675 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Bind only the nineteen confirmed hotel pairs and their current approved images
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          umask 077
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib
          base=pathlib.Path('tools/direct_demand/operations');tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=(base/'commercial-channel-hotel-feeds-20261107-read46-inputs.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2fffa484a0c5cb2acd660e5a2e994683e8386f0ab639373de74e27da36c9039c'
          rows=json.loads(raw);assert [r['hotel_id'] for r in rows]==[70033,57652,57650,23766,4078,24778,4054,14133,4074,4079,80915,22791,57064,57039,65266,116934,681,8008,119046]
          (tmp/'feed-read46-inputs.json').write_bytes(raw)
          source=(base/'read-commercial-channel-hotel-feeds-20261107-46.php').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='a7a76101779df761255835c5432f203cb9443f211303f678807ffac04cce7fcd'
          constants="\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst FEED_EXPORT_INPUT_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\nconst FEED_EXPORT_INPUT_B64='"+base64.b64encode(raw).decode()+"';\n"
          candidate_raw=(base/'commercial-channel-hotel-feeds-20261107-read46-candidates.json').read_bytes()
          assert hashlib.sha256(candidate_raw).hexdigest()=='37517e5f3dc66819f61f5a7bb8ace1921282415f10551d2defa5c3eb0985b570'
          assert len(json.loads(candidate_raw))==0
          (tmp/'feed-read46-candidates.json').write_bytes(candidate_raw)
          constants+="\nconst CANDIDATE_INPUT_SHA256='37517e5f3dc66819f61f5a7bb8ace1921282415f10551d2defa5c3eb0985b570';\nconst CANDIDATE_INPUT_B64='"+base64.b64encode(candidate_raw).decode()+"';\n"
          (tmp/'channel-preflight.php').write_text(source.replace('declare(strict_types=1);','declare(strict_types=1);'+constants,1))
          print(json.dumps({'operation':'commercial-channel-hotel-feeds-20261107-read46','new_hotels':19,'old161_read':0,'provider_calls':0,'writes':0}))
          PYCODE
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - name: Retain exact new feed binding scope
        uses: actions/upload-artifact@v4
        with:
          name: commercial-channel-hotel-feeds-20261107-read46-inputs
          path: |
            ${{ runner.temp }}/feed-read46-inputs.json
            ${{ runner.temp }}/feed-read46-candidates.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only the nineteen new current pair bindings
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import pathlib,json,os
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((tmp/'channel-preflight.json').read_text().splitlines()[-1])
          print(json.dumps({k:v for k,v in d.items() if k not in ('private_max_bindings','candidate_clearance')},ensure_ascii=False,sort_keys=True))
          assert d['operation']=='commercial-channel-hotel-feeds-20261107-read46' and d['ok'] is True
          assert d['scope_hotels']==d['feed_rows']==d['private_binding_count']==19 and d['deferred_count']==0
          assert d['db_writes']==d['provider_calls']==d['message_sends']==0
          assert d['candidate_count']==len(d['candidate_clearance'])==0
          print(json.dumps({'candidate_clearance':[{'native_hotel_id':r['native_hotel_id'],'clear':r['clear'],'matches':[{'platform':m['platform'],'post_url':m['post_url']} for m in r['matches']]} for r in d['candidate_clearance']]},ensure_ascii=False))
          assert [r['hotel_id'] for r in d['rows']]==[70033,57652,57650,23766,4078,24778,4054,14133,4074,4079,80915,22791,57064,57039,65266,116934,681,8008,119046]
          print('NEW_EIGHTEEN_CURRENT_FEED_BINDINGS_READ older474_unchanged provider_calls=0 writes=0')
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-channel-hotel-feeds-20261107-read46-result
          path: ${{ runner.temp }}/channel-preflight.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json"

