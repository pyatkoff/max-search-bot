name: Capture six new legacy priced pairs with explicit nullable publisher and native entities
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: a0b3ae4ac9d035b554c25fe87e333d1846f26b5b
  LINK_SCOPE_FILENAME: commercial-hotel-search-links-20261105-context28-legacy6-scope.json
  EXPECTED_LINK_SCOPE_SHA256: eb577d3917c19fb228c3f3b7a6b1ef2cec1d32f4fc967f3b8bbb6bb94c60f2a9
  EXPECTED_INLINE_CONTEXT_READER_SHA256: 899126768bf42f9e1489be79e2c1996d0e67a99adf54ee9099aaa00061103ab5
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed current publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42096003931 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/42096003931/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42097023328 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful same-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/42097023519 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-legacy6-input-projection1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42096493873
          path: ${{ runner.temp }}/original-priced-input
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Validate new actual legacy roles and exact declared read bounds
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-legacy-priced-hotel-inline-contexts-20261105.py
          python3 tools/direct_demand/operations/prepare-legacy-priced-hotel-inline-contexts-20261105.py
          php -l "$RUNNER_TEMP/link-context.php"
          ANYTOUR_CURRENT_LINK_CONTEXT_NEW_INPUT_CASES=1 php "$RUNNER_TEMP/link-context.php"
      - name: Retain exact private scope before server and owned-post access
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context28-legacy6-input
          path: |
            ${{ runner.temp }}/link-context-input.private.json
            ${{ runner.temp }}/link-context.php
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Capture only six new owned current posts and canonical counterparts without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/run-hotel-search-links-current-contexts-20261105-data-bound.py
      - name: Retain private current native contexts and safe counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context28-legacy6
          path: |
            ${{ runner.temp }}/link-context-input.private.json
            ${{ runner.temp }}/link-context-readback.private.json
            ${{ runner.temp }}/link-context-summary.json
          retention-days: 14
          if-no-files-found: warn
