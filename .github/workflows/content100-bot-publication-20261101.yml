name: Resolve original quote7 and read ten new targeted catalogue groups
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 2f7cff9ab66f59003af8df8a7f18ef2b93bca93d
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-quote7
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41920783291
          path: ${{ runner.temp }}/quote7-original
      - name: Resolve the original quote7 response contract without another request
        run: python3 tools/direct_demand/operations/inspect-commercial-price-20261104-quote7-contract1.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-quote7-contract1
          path: ${{ runner.temp }}/quote7-contract-state.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41917839854 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41917839854/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41918925110 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41918925124 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - name: Prepare ten distinct named stock lookups and targeted public projection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 tools/direct_demand/operations/prepare-commercial-stock-20261104-40.py
          php -l "$RUNNER_TEMP/channel-preflight.php"
          ANYTOUR_STOCK40_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-preflight.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only ten new named catalogue groups and their targeted registry matches
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/stock40-readback.json" || probe_status=$?
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'stock40-readback.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-stock-20261104-40-read1' and d['db_writes']==d['provider_calls']==d['message_sends']==0
          groups=[]
          for g in d.get('candidates',[]):
           eligible=[h['id'] for h in g['matches'] if len(g['matches'])==1 and h['is_active']==1 and h['country_id']==4 and h['existing_registry_matches']=={'telegram':0,'max':0}]
           groups.append({'key':g['key'],'match_count':len(g['matches']),'new_unique_unpublished_native_ids':eligible})
          print(json.dumps({'operation':d['operation'],'ok':d['ok'],'error':d.get('error'),'lookup_groups':len(d.get('candidates',[])),'targeted_registry_rows':d.get('targeted_registry_rows'),'whole_previous159_registry_read':d.get('whole_previous159_registry_read'),'groups':groups,'provider_calls':0,'db_writes':0,'message_sends':0,'ready_for_send':0,'new_posts':0}))
          assert d['ok'] is True and len(d['candidates'])==10 and d['whole_previous159_registry_read'] is False
          PY
          test "$probe_status" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-stock-20261104-40-read1
          path: ${{ runner.temp }}/stock40-readback.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/stock40-readback.json"
