name: Source checks only for approved Waldorf66198 correction
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  source-check:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push'
      && github.event.before == '8d77a136f44264f5f5d8f4d1eac38c80a6f879a6' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
        sparse-checkout: tools/direct_demand/operations
    - name: Prepare PHP for source tests
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring,dom,pdo_sqlite,curl
        coverage: none
    - name: Check the exact caption and XML correction sources
      shell: bash
      run: |
        set -euo pipefail
        python3 tools/direct_demand/operations/content66198-correction/test_prepare.py --ops tools/direct_demand/operations --php php
        python3 tools/direct_demand/operations/content66198-correction/feed/test_feed.py --ops tools/direct_demand/operations --php php
        python3 tools/direct_demand/operations/content66198-correction/test_workflow_helpers.py
        node --check tools/direct_demand/operations/content66198-correction/admission.js
        python3 - <<'PY'
        import hashlib,json,pathlib
        root=pathlib.Path('tools/direct_demand/operations/content66198-correction')
        files=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts)
        proof={'state':'CONTENT66198_SOURCE_CHECKED_NO_PRIVATE_ACCESS','files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},'provider_calls':0,'post_writes':0,'xml_writes':0}
        pathlib.Path('content66198-source-proof.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
        print(json.dumps(proof,sort_keys=True))
        PY
    - name: Retain source proof only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: content66198-source-proof
        path: content66198-source-proof.json
        if-no-files-found: error
        retention-days: 30
