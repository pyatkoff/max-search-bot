name: Read six existing post contexts for authorized monitor prices
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8164359eba9a633f3f25d743e534386ecffe622f
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Bind exact six existing pairs and lint read-only capture
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_RUN_ATTEMPT" = 1
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/current-main.json"
        python3 - <<'PYBUILD'
        import base64,hashlib,json,os,pathlib
        p=pathlib.Path('tools/direct_demand/operations');t=pathlib.Path(os.environ['RUNNER_TEMP'])
        assert json.loads((t/'current-main.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        raw=(p/'monitor-price-six-context-20261111-input.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='52f8922fbf5e86909c53dcdbaa17d402bfaaf968344a55d129825500312467bf'
        values={'EXPECTED_INSTALLED_SHA':os.environ['EXPECTED_PRODUCTION_SHA'],'APPROVED_CONTEXT_INPUT_B64':base64.b64encode(raw).decode(),'APPROVED_CONTEXT_INPUT_SHA256':hashlib.sha256(raw).hexdigest(),'APPROVED_CONTEXT_PINS_B64':''}
        s=(p/'read-monitor-price-post-context.php').read_text();prefix="<?php\ndeclare(strict_types=1);\n";assert s.startswith(prefix)
        (t/'channel-preflight.php').write_text(prefix+''.join('const '+k+'='+json.dumps(v)+';\n' for k,v in values.items())+s[len(prefix):])
        PYBUILD
        php -l "$RUNNER_TEMP/channel-preflight.php"
        php tools/direct_demand/operations/test-monitor-price-contract.php
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read canonical receipts and current messages without edits
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/main-before-context.json"
        python3 - <<'PYCHECK'
        import os,json,pathlib
        assert json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'main-before-context.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        PYCHECK
        probe_status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/monitor-price-context.json" || probe_status=$?
        python3 - <<'PYRESULT'
        import os,json,pathlib
        raw=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-context.json').read_text();d=json.loads(raw.splitlines()[-1]);print('MONITOR_PRICE_CONTEXT='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
        assert d['ok'] and d['db_writes']==d['message_writes']==d['supplier_calls']==0
        PYRESULT
        test "$probe_status" = 0
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitor-price-six-context-20261111-v1
        path: ${{ runner.temp }}/monitor-price-context.json
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and script files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php"
