name: Read the exact held MAX captions without editing
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 6d193b7740dc212b92b1893041f0a1047b179635
jobs:
  readback:
    name: Correct 30 older hotel headings and resort lines
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42387774695 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/42387774695/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42388210320 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42392295835 > "$evidence/caption-readback-parent.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert (r["status"],r["conclusion"],r["head_sha"]) == ("completed","success","53010637812848947555060adf2bb4dec284b020")' "$evidence/caption-readback-parent.json"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only the existing MAX posts with a provider caption mismatch
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64,hashlib,os,pathlib
          root=pathlib.Path('tools/direct_demand/operations')
          raw=(root/'read-held-max-captions-20261107-inputs.json').read_bytes()
          source=(root/'read-held-max-captions-20261107-template.php').read_text()
          assert hashlib.sha256(raw).hexdigest()=='fefde6beebd2e4d2a9344dc78c870763b0be6fbc43cafe637b9ac7e6b3a1c4d3'
          assert hashlib.sha256(source.encode()).hexdigest()=='0d3e25ba534e67c564b0d3444302b9d58621b6e0928996772065701cd56934e7'
          constants="\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst APPROVED_MANIFEST_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\nconst MANIFEST_BASE64='"+base64.b64encode(raw).decode()+"';\n"
          assert source.count('declare(strict_types=1);')==1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'held-max-readback.php').write_text(source.replace('declare(strict_types=1);','declare(strict_types=1);'+constants,1))
          PYCODE
          php -l "$RUNNER_TEMP/held-max-readback.php"
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/held-max-readback.php" > "$RUNNER_TEMP/held-max-readback.json" || audit_status=$?
          python3 - <<'PY'
          import json,os,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((tmp/'held-max-readback.json').read_text())
          print(json.dumps({'ok':d['ok'],'provider_reads':d['provider_reads'],'post_write_attempts':d['post_write_attempts'],'error':d.get('error')}))
          assert d['ok'] and d['provider_reads']==len(d['posts'])==1 and d['post_write_attempts']==0
          PY
          test "${audit_status:-0}" = 0
      - name: Retain safe provider readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-read-held-max-captions-20261107-result
          path: ${{ runner.temp }}/held-max-readback.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/held-max-readback.php"
