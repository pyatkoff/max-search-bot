name: Inspect three new AnyTour batch18 native covers
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cover_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect only the exact authorized native Canva PNG group
        env:
          COVER_GROUP: ${{ matrix.cover_group }}
        run: python3 tools/direct_demand/operations/inspect-canva-covers-20261102-3.py
      - name: Retain bounded native image evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-batch18-native-group-${{ matrix.cover_group }}
          path: |
            native-cover-receipt.json
            covers/
          retention-days: 14
          if-no-files-found: error
