name: Actualize one justified Delphin Imperial retained quote within30hours
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 0a8f5ec6f049369e67f36372ffb8917059b9fda7
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41789056393 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41789056393/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41789990320 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-retained30h1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41788687781
          path: ${{ runner.temp }}/retained30h1
      - name: Prepare the exact retained9432 input and durable one request intent
        env:
          RETAINED_PATH: ${{ runner.temp }}/retained30h1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,time
          source=pathlib.Path('tools/direct_demand/operations/check-commercial-price-20261104-quote2.php').read_text()
          paths=list(pathlib.Path(os.environ['RETAINED_PATH']).rglob('quote-candidate-input.json'));assert len(paths)==1
          retained=json.loads(paths[0].read_text());assert retained['original_run']==41786947561 and retained['max_age_seconds']==108000
          assert len(retained['selected'])==1
          chosen=retained['selected'][0];assert chosen['hotel']['local_tv_id']==9432 and chosen['hotel']['expected_country_id']==4 and chosen['hotel']['current_name_matches_expected'] is True
          approved=dict(chosen['retained']);approved['hotel_id']=9432
          assert 0<=int(time.time())-int(approved['created_at_stored_epoch_utc'])<=108000
          raw=(json.dumps(approved,ensure_ascii=False,separators=(',',':'))+'\n').encode()
          prefix="<?php\ndeclare(strict_types=1);\n";assert source.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"+"const APPROVED_CANDIDATE_B64='"+base64.b64encode(raw).decode()+"';\n"+"const APPROVED_CANDIDATE_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\n"
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp/'channel-preflight.php').write_text(header+source[len(prefix):])
          intent={'operation':'commercial-price-monitor-20261104-quote2','state':'EXACT_ONE_JUSTIFIED_QUOTE_INTENT_BEFORE_PROVIDER','catalog_id':9432,'expected_source':os.environ['EXPECTED_PRODUCTION_SHA'],'approved_candidate_sha256':hashlib.sha256(raw).hexdigest(),'retained_artifact_run':41788687781,'max_age_hours':30,'max_gateway_requests':1,'automatic_retry_allowed':False}
          (temp/'quote-intent.json').write_text(json.dumps(intent,indent=2)+'\n')
          PY
          php -l "$RUNNER_TEMP/channel-preflight.php"
          ANYTOUR_QUOTE30H_FIXTURE=1 php "$RUNNER_TEMP/channel-preflight.php"
      - name: Retain exact private quote intent before the one gateway request
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-quote2-intent
          path: ${{ runner.temp }}/quote-intent.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Make the one justified existing gateway actualization
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'channel-preflight.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261104-quote2' and d['mode']=='one_existing_gateway_quote_contract'
          assert d['db_writes']==d['message_sends']==d['price_block_updates']==0 and d['gateway_requests_attempted']<=1
          safe={k:d.get(k) for k in ['operation','ok','error','catalog_id','gateway_requests_attempted','quote_state','http_status','response_bytes','response_sha256','request_started_epoch_utc','response_received_epoch_utc','automatic_retry_allowed','full_total_verified','current_availability_verified']}
          print(json.dumps(safe,sort_keys=True))
          assert d['ok'] is True
          PY
          test "$probe_status" = 0
      - name: Retain bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-quote2
          path: |
            ${{ runner.temp }}/channel-preflight.json
            ${{ runner.temp }}/quote-intent.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/quote-intent.json"

