name: Prepare only two new copy-only hotel prices and search links without editing posts
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 95dcf9893fb161b1e4fb52c02ad2d982604e7518
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261105-manual1-quote-pass2-two-copy
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41990592178
          path: ${{ runner.temp }}/original-quotes
      - name: Admit whole real baskets and build hotel-specific search link fallback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-copy-only-two-hotel-offers-20261105.py
          for script in "$RUNNER_TEMP"/price-manual1-two-copy/*/update.php; do
            php -l "$script"
            ANYTOUR_COPY_TWO_OFFER_NEW_BOUND_CASES=1 php "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-offer-update-20261105-manual1-two-copy-prepared1
          path: |
            ${{ runner.temp }}/price-manual1-two-copy/update-index.json
            ${{ runner.temp }}/price-manual1-two-copy/prepare-summary.json
            ${{ runner.temp }}/price-manual1-two-copy/closed-no-edit.json
            ${{ runner.temp }}/price-manual1-two-copy/all-update-intents.json
            ${{ runner.temp }}/price-manual1-two-copy/*/update.php
            ${{ runner.temp }}/price-manual1-two-copy/*/update-manifest.json
            ${{ runner.temp }}/price-manual1-two-copy/*/update-approval.json
            ${{ runner.temp }}/price-manual1-two-copy/*/update-intent.json
            ${{ runner.temp }}/price-manual1-two-copy/*/candidate.json
          retention-days: 14
          if-no-files-found: error
