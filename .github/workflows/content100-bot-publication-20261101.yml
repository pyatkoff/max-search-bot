name: Resolve six exact public hotel feed photo sources and prepare Savoy offline
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        inspect_group: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read fixed primary photos or validate the exact prepared input without server calls
        env:
          INSPECT_GROUP: ${{ matrix.inspect_group }}
          MEDIA_GROUP: ${{ matrix.inspect_group }}
        run: |
          set -euo pipefail
          if [ "$INSPECT_GROUP" = 2 ]; then
            python3 tools/direct_demand/operations/prepare-commercial-batch.py --manifest tools/direct_demand/operations/commercial-batch-20261103-20-manifest.json --approval tools/direct_demand/operations/commercial-batch-20261103-20-approval.json --output "$RUNNER_TEMP/savoy-prepared.php"
            php -l "$RUNNER_TEMP/savoy-prepared.php"
          else
            python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.inspect_group != 2
        with:
          name: commercial-hotel-feed-six-photos-group-${{ matrix.inspect_group }}
          path: public-media-sources.json
          retention-days: 14
          if-no-files-found: error
