name: Publish the approved AnyTour hotel batch in both channels
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_DEPLOY_RUN_ID: '43292589237'
  EXPECTED_TLS_RUN_ID: '43294858255'
  EXPECTED_PRODUCTION_SHA: 1f00068a34de996ada54d6ff51824553c5806b48
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        evidence="$RUNNER_TEMP/commercial-source-evidence"

        mkdir -p "$evidence"

        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"

        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"

        tree_sha="$(python3 -c ''import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])'' "$evidence/source_commit.json")"

        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"

        python3 - <<''PYPIN''

        import hashlib,pathlib

        assert hashlib.sha256(pathlib.Path(''tools/direct_demand/operations/verify-commercial-source.py'').read_bytes()).hexdigest()==''51270e4ce241914001ddc307e581ffdac69234c3880e77bd99a7be6b4e5d4a7a''

        PYPIN

        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA"
        --evidence-dir "$evidence"

        '
    - name: Authenticate exact original zero-send failure and eight clear candidates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PYPROOF'\nimport hashlib,json,pathlib,subprocess,zipfile,io,os\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'batch6-zero-send-proof';p.mkdir(mode=0o700)\ndef api(path,name):\n\
        \ raw=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+path],timeout=60);(p/name).write_bytes(raw);return\
        \ raw\nr=json.loads(api('actions/runs/43299336765','failed-original-run.json'))\nassert r['head_sha']=='809be18364f31b0e1a1d594ebb0c8a16bca88b90'\
        \ and r['run_attempt']==1 and r['conclusion']=='failure'\nassert r['path']=='.github/workflows/content100-bot-publication-20261101.yml'\
        \ and r['head_branch']=='audit/content100-bot-publication-20261101'\nmeta=json.loads(api('actions/artifacts/13980153343','failed-original-artifact.json'))\n\
        assert meta['workflow_run']['id']==43299336765 and meta['digest']=='sha256:462c6ee575734befac06781e416d0d623a807ecc16fabac639ae977b45f3b19f'\
        \ and meta['expired'] is False\nraw=api('actions/artifacts/13980153343/zip','failed-original.zip');assert\
        \ hashlib.sha256(raw).hexdigest()=='462c6ee575734befac06781e416d0d623a807ecc16fabac639ae977b45f3b19f'\n\
        z=zipfile.ZipFile(io.BytesIO(raw));members=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name=='channel-preflight.json'];assert\
        \ len(members)==1 and members[0].file_size<10000\nf=json.loads(z.read(members[0]).splitlines()[-1]);assert\
        \ f=={'operation':'commercial-hotel-batch-20261112-6-v1','mode':'publish_approved_commercial_batch','ok':False,'post_write_attempts':0,'channels':[],'error':'hotel_already_in_registry_no_duplicate'}\n\
        r=json.loads(api('actions/runs/43299918237','clearance-run.json'));assert r['head_sha']=='e2b9ac129ea50c026c7b2465ccaf094be29ec9ca'\
        \ and r['run_attempt']==1 and r['conclusion']=='success'\nraw=api('actions/artifacts/13980632560/zip','clearance.zip');assert\
        \ hashlib.sha256(raw).hexdigest()=='b324b18f8ae8e3d9176127bb8ddab3867e6229865914fab6d2f015346ef33653'\n\
        z=zipfile.ZipFile(io.BytesIO(raw));members=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name=='channel-feed-read.json'];assert\
        \ len(members)==1 and members[0].file_size<100000\nc=json.loads(z.read(members[0]).splitlines()[-1]);assert\
        \ c['ok'] and c['candidate_count']==9 and all(c[k]==0 for k in ['provider_calls','db_writes','message_sends'])\n\
        ids=[418,1335,1212,13844,21476,1569,65779,1369]\nassert [r['native_hotel_id'] for r in c['candidate_clearance']\
        \ if r['clear'] and r['matches']==[]]==ids\napproval=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-batch-20261112-6-approval.json').read_bytes());assert\
        \ approval['hotel_ids']==ids\nprint('ORIGINAL_ZERO_SEND_AND_EXACT_EIGHT_CLEARANCE_ACCEPTED no completed_or_unknown_replay=1')\n\
        PYPROOF\n"
    - name: Prepare and validate the exact sender and bounded read
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_RUN_ATTEMPT" = 1

        umask 077

        python3 - <<''PY''

        import hashlib,json,os,pathlib

        base=pathlib.Path(''tools/direct_demand/operations'')

        assert hashlib.sha256((base/''prepare-commercial-batch.py'').read_bytes()).hexdigest()==''ccda43ff0360de931ee7c04f9f151c1232e531820335a9cc21a2591634f2157f''

        pins={''prepare-publication-tail.py'': ''0de4315c4480274d66dcc560cf7cef4280422ede369ee7c7d858b9f5a73d1f38''}

        for name,sha in pins.items():assert hashlib.sha256((base/name).read_bytes()).hexdigest()==sha,name

        approval=json.loads((base/''commercial-batch-20261112-6-approval.json'').read_text())

        assert approval[''expected_installed_sha'']==os.environ[''EXPECTED_PRODUCTION_SHA'']

        assert approval[''operation'']==''commercial-hotel-batch-20261112-6-v1'' and approval[''hotel_ids'']==[418,1335,1212,13844,21476,1569,65779,1369]

        PY

        python3 tools/direct_demand/operations/prepare-commercial-batch.py --manifest tools/direct_demand/operations/commercial-batch-20261112-6-manifest.json
        --approval tools/direct_demand/operations/commercial-batch-20261112-6-approval.json --output "$RUNNER_TEMP/channel-preflight.php"

        php -l "$RUNNER_TEMP/channel-preflight.php"

        python3 tools/direct_demand/operations/prepare-publication-tail.py reader --manifest tools/direct_demand/operations/commercial-batch-20261112-6-manifest.json
        --approval tools/direct_demand/operations/commercial-batch-20261112-6-approval.json --reader-template tools/direct_demand/operations/read-commercial-channel-hotel-feeds-20261108-48.php
        --reader-operation commercial-channel-hotel-feeds-20261112-read6 --output "$RUNNER_TEMP/channel-feed-read.php"

        php -l "$RUNNER_TEMP/channel-feed-read.php"

        ANYTOUR_CHANNEL_BATCH51_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-feed-read.php"

        '
    - name: Retain exact approved inputs before any channel write
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261112-6-inputs
        path: 'tools/direct_demand/operations/commercial-batch-20261112-6-manifest.json

          tools/direct_demand/operations/commercial-batch-20261112-6-approval.json

          '
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"$raw\" == *\"PRIVATE KEY\"* ]];\
        \ then\n  if [[ \"$raw\" == *'\\n'* ]]; then printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"\
        ; else printf '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse\n  printf '%s' \"\
        $raw\" | base64 --decode > \"$RUNNER_TEMP/channel_key\"\nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\"\
        \ >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\nhost=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\n\
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\n\
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\n\
        matches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n  if len(fields)<3 or fields[0].startswith('#'):continue\n\
        \  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n\
        \  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\n\
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(matches)+'\\n')\nPY\n"
    - name: Publish the exact approved hotel posts with canonical buttons and no duplicates
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\nssh -i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes -o ConnectTimeout=10\
        \ -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"\
        $RUNNER_TEMP/channel_known_hosts\" \"$DEPLOY_USER@$DEPLOY_HOST\" \"set -e; cd /var/www/anytoour/data/www/app.anytoour.ru;\
        \ test \\\"\\$(git rev-parse HEAD)\\\" = '$EXPECTED_PRODUCTION_SHA'; test -z \\\"\\$(git status --porcelain\
        \ --untracked-files=no)\\\"; php\" < \"$RUNNER_TEMP/channel-preflight.php\" > \"$RUNNER_TEMP/channel-preflight.json\"\
        \ || probe_status=$?\npython3 - <<'PY'\nimport pathlib,json,os\nlines=pathlib.Path(os.environ['RUNNER_TEMP']+'/channel-preflight.json').read_text().splitlines()\n\
        d=json.loads(lines[-1])\nprint(json.dumps({k:v for k,v in d.items() if k!='posts'},ensure_ascii=False,sort_keys=True))\n\
        print(json.dumps({'new_post_urls':[{'platform':p['platform'],'logical_id':p['logical_id'],'post_url':p['post_url'],'verified':p['body_photo_button_verified']}\
        \ for p in d.get('posts',[])]},ensure_ascii=False))\nassert d['operation']=='commercial-hotel-batch-20261112-6-v1'\
        \ and d['mode']=='publish_approved_commercial_batch'\nassert d['ok'] is True and len(d['posts'])==16\nassert\
        \ d['post_write_attempts']<=16 and d['new_posts']<=16\nassert len({(p['platform'],p['logical_id']) for p\
        \ in d['posts']})==16\nassert all(p['body_photo_button_verified'] and p['button_text']=='\u2708\uFE0F \u0423\
        \u0437\u043D\u0430\u0442\u044C \u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C \u0442\u0443\u0440\
        \u0430' for p in d['posts'])\nPY\ntest \"${probe_status:-0}\" = 0\n"
    - name: Read only the confirmed canonical pairs and native MAX bindings
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\nssh -i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes -o ConnectTimeout=10\
        \ -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"\
        $RUNNER_TEMP/channel_known_hosts\" \"$DEPLOY_USER@$DEPLOY_HOST\" \"set -e; cd /var/www/anytoour/data/www/app.anytoour.ru;\
        \ php\" < \"$RUNNER_TEMP/channel-feed-read.php\" > \"$RUNNER_TEMP/channel-feed-read.json\" || read_status=$?\n\
        python3 - <<'PYREAD'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])\nreceipt=json.loads((p/'channel-preflight.json').read_text().splitlines()[-1])\n\
        d=json.loads((p/'channel-feed-read.json').read_text().splitlines()[-1])\nids=[418,1335,1212,13844,21476,1569,65779,1369]\n\
        assert d['ok'] is True and d['operation']=='commercial-channel-hotel-feeds-20261112-read6'\nassert d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']\n\
        assert d['scope_hotels']==d['feed_rows']==d['private_binding_count']==8 and d['deferred_count']==0\nassert\
        \ [r['hotel_id'] for r in d['rows']]==[r['hotel_id'] for r in d['private_max_bindings']]==ids\nassert all(d[k]==0\
        \ for k in ('db_writes','provider_calls','message_sends'))\nby_pair={(r['hotel_id'],r['platform']):r for\
        \ r in receipt['posts']}\nfor r,b in zip(d['rows'],d['private_max_bindings']):\n  for platform in ('telegram','max'):assert\
        \ r[platform+'_post_url']==by_pair[(r['hotel_id'],platform)]['post_url']\n  assert str(b['publication_id'])==str(by_pair[(r['hotel_id'],'max')]['publication_id'])\n\
        print(json.dumps({k:d[k] for k in ('operation','ok','scope_hotels','feed_rows','private_binding_count','deferred_count','provider_calls','db_writes','message_sends')}))\n\
        PYREAD\ntest \"${read_status:-0}\" = 0\n"
    - name: Retain bounded route evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261112-6-publication-and-read
        path: '${{ runner.temp }}/channel-preflight.json

          ${{ runner.temp }}/channel-feed-read.json

          '
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and script files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php"
        "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/channel-feed-read.php" "$RUNNER_TEMP/channel-feed-read.json"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
