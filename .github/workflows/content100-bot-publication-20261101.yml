name: Read only Palace Beach candidate before any sender
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_DEPLOY_RUN_ID: '43651374281'
  EXPECTED_TLS_RUN_ID: '43652446896'
  EXPECTED_PRODUCTION_SHA: 62fc5cf8cf5cb3e41b370a808c2281d27ae83da7
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Authenticate the same CONTENT owner and one original scoped push
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'ADMISSION'
        import json,os,re,subprocess
        repo='repos/pyatkoff/max-search-bot/'
        parent='7022b7fdfc765309d3f01b5aee318b2b1e4fb413'
        assert re.fullmatch(r'[a-f0-9]{40}',parent),'exact_parent_must_be_bound_before_original_push'
        def get(path):return json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control: no-cache',repo+path]))
        assert get('git/ref/heads/main')['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert get('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA']
        owner=get('issues/comments/6818332618')
        assert owner['user']['id']==226193297 and owner['body'].startswith('ACTIVE CONTENT — 15 Nov: next release / #1142; same owner, no replay.')
        publisher=get('issues/comments/6775467253')
        assert publisher['user']['id']==226193297 and publisher['body'].strip()=='PR1541: установлено, выпуск свободен'
        run=get('actions/runs/'+os.environ['GITHUB_RUN_ID'])
        assert run['event']=='push' and run['run_attempt']==1 and run['head_sha']==os.environ['GITHUB_SHA']
        assert run['head_branch']=='audit/content100-bot-publication-20261101' and run['path']=='.github/workflows/content100-bot-publication-20261101.yml'
        assert run['actor']['id']==run['triggering_actor']['id']==226193297
        assert [x['sha'] for x in get('git/commits/'+os.environ['GITHUB_SHA'])['parents']]==[parent]
        print('EXACT_SAME_CONTENT_OWNER_ORIGINAL_PUSH_ACCEPTED')
        ADMISSION
    - name: Verify nine original source gates and the unchanged 22 publishing pins
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'SOURCE9'
        import json,os,pathlib,subprocess
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        gates=[(43651374281, '.github/workflows/deploy.yml', 'push'), (43652446896, '.github/workflows/max-tls-preflight.yml', 'workflow_run'), (43652446908, '.github/workflows/telegram-production-health.yml', 'workflow_run'), (43652446895, '.github/workflows/max-production-health.yml', 'workflow_run'), (43652446875, '.github/workflows/modeled-conversion-value-export.yml', 'workflow_run'), (43652446872, '.github/workflows/publish-conversation-diagnostics.yml', 'workflow_run'), (43652446960, '.github/workflows/modeled-conversion-monitor.yml', 'workflow_run'), (43652446907, '.github/workflows/tour-selection-host.yml', 'workflow_run'), (43652446977, '.github/workflows/live-session-diagnostics.yml', 'workflow_run')]
        assert len(gates)==9 and len({x[0] for x in gates})==9
        for run_id,path,event in gates:
         r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))
         assert r['id']==run_id and r['run_attempt']==1 and r['head_sha']==expected
         assert r['head_branch']=='main' and r['path']==path and r['event']==event
         assert r['status']=='completed' and r['conclusion']=='success'
         if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43651374281:1'
         pathlib.Path(os.environ['RUNNER_TEMP'],f'commercial-source-gate-{run_id}.json').write_text(json.dumps(r))
        print('NINE_ORIGINAL_SOURCE_GATES_SUCCESS_ATTEMPT1')
        SOURCE9
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -p "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 - <<'PYPIN'
        import hashlib,pathlib
        assert hashlib.sha256(pathlib.Path('tools/direct_demand/operations/verify-commercial-source.py').read_bytes()).hexdigest()=='5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'
        PYPIN
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
    - name: Validate exact bounded read-only duplicate scope
      shell: bash
      run: |
        set -euo pipefail
        sha256sum -c <<'PINS'
        aea0c126691281932cc5be7a70773cefe70c323bc7f301e7d491d8388f3a46ea  tools/direct_demand/operations/commercial-batch-20261115-2-duplicate-read.php
        PINS
        cp tools/direct_demand/operations/commercial-batch-20261115-2-duplicate-read.php "$RUNNER_TEMP/channel-feed-read.php"
        php -l "$RUNNER_TEMP/channel-feed-read.php"
        ANYTOUR_CHANNEL_BATCH51_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-feed-read.php"
        sha256sum -c <<'ASSETS'
        58e96b98aa0e8373d80375a7f6880691d106a4b47bbdcb4365236b7e40f63b2d  .github/traffic-publish/commercial-batch-20261115-2/206.png
        ASSETS
    - name: Retain exact Palace candidate inputs before any channel write
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261115-2-candidate-inputs
        path: |
          tools/direct_demand/operations/commercial-batch-20261115-2-candidates.json
          tools/direct_demand/operations/commercial-batch-20261115-2-duplicate-read.php
          tools/direct_demand/operations/commercial-batch-20261115-2-reviewed-source.json
          tools/direct_demand/operations/commercial-batch-20261115-2-visual-review.json
          tools/direct_demand/operations/commercial-batch-20261115-2-cover-receipt.json
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read only exact Palace candidate matches without writes
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php" < "$RUNNER_TEMP/channel-feed-read.php" > "$RUNNER_TEMP/channel-feed-read.json" || read_status=$?
        python3 - <<'PYREAD'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP']);d=json.loads((p/'channel-feed-read.json').read_text().splitlines()[-1])
        assert d['ok'] and d['operation']=='commercial-channel-hotel-feeds-20261115-read3'
        assert d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['candidate_count']==1
        assert [r['native_hotel_id'] for r in d['candidate_clearance']]==[206]
        assert all(d[k]==0 for k in ['db_writes','provider_calls','message_sends'])
        print(json.dumps({'operation':d['operation'],'clearance':[{'hotel_id':r['native_hotel_id'],'clear':r['clear'],'matches':[{'platform':x['platform'],'hotel_catalog_id':x['hotel_catalog_id'],'first_line':x['first_line'],'post_url':x['post_url'],'reasons':x['match_reasons']} for x in r['matches']]} for r in d['candidate_clearance']]}))
        PYREAD
        test "${read_status:-0}" = 0
    - name: Retain bounded route evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261115-2-duplicate-clearance
        path: ${{ runner.temp }}/channel-feed-read.json
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and script files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/channel-feed-read.php" "$RUNNER_TEMP/channel-feed-read.json"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
