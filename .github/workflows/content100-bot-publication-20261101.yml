name: Read Coral Sea galleries after the exact nullable alt parser correction
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact null alt regression before HTTP reads
        env:
          MEDIA_GROUP: 0
          SOURCE_INSPECTOR_FIXTURE: 1
        run: python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Read only fixed official hotel descriptions and public photo references
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch27-coral-gallery-primary-sources-${{ matrix.media_group }}
          path: public-media-sources.json
          retention-days: 14
          if-no-files-found: error
