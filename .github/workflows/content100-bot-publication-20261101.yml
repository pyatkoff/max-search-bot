name: Inspect three declared official Movenpick El Gouna photographs
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect only fixed public owner material without server calls
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-hotel-primary-images-20261103-20.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch23-owner-material-read3-${{ matrix.media_group }}
          path: |
            primary-image-inspection.json
          retention-days: 14
          if-no-files-found: error
