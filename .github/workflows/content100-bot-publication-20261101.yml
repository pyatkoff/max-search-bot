name: Append the seventeen confirmed hotel pairs to the existing public feeds
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: e3ef9591402da618e7b22fe4a8f4eb2291c4d10c
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the exact approved458 route receipt and additive feed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/current-main.json"
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib,re,xml.etree.ElementTree as ET
          p=pathlib.Path('tools/direct_demand/operations');t=pathlib.Path(os.environ['RUNNER_TEMP']);b=pathlib.Path('.github/traffic-publish')
          assert json.loads((t/'current-main.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          evidence=(p/'commercial-max458-installed-safe-evidence-20261107.json').read_bytes();assert hashlib.sha256(evidence).hexdigest()=='f714d01f3b7f6fa8529bb52caa52d149fa5050f910a3a5daa2a4be72d21b9bed'
          e=json.loads(evidence);r=e['result'];assert e['run_id']==42413159483 and e['job_id']==128525418871 and e['result_artifact_id']==13589723973 and r['ok'] and r['state']=='INSTALLED_AND_NATIVE_VERIFIED'
          assert r['checks']['exact_total_routes']==458 and r['checks']['new_native_routes_verified']==17 and r['checks']['previous441_rows_identical'] and r['checks']['private_projection_http_status']==404 and r['checks']['save_calls']==0
          plan=json.loads((p/'commercial-channel-hotel-feeds-20261107-update42-plan.json').read_text());baseline=json.loads((p/'commercial-channel-hotel-feeds-20261107-update42-baseline.json').read_text())
          assert plan['new_hotel_ids']==[54621,1579,1218,52925,49083,42928,1712,1647,109655,108942,59116,9260,106,114,1959,288,415] and plan['target_rows']==[458,458,916] and plan['previous441_offer_blocks_identical']
          files=[]
          for x in plan['files']:
              raw=(b/x['name']).read_bytes();base=baseline[x['name']];assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              blocks={m[1]:m[0] for m in re.finditer(r'<offer\b[^>]*\bid="([^"]+)"[^>]*>[\s\S]*?</offer>',raw.decode())};assert len(blocks)==x['rows']
              assert set(blocks)==set(base['previous_offer_blocks_sha256'])|set(base['new_offer_blocks_sha256'])
              for k,h in {**base['previous_offer_blocks_sha256'],**base['new_offer_blocks_sha256']}.items():assert hashlib.sha256(blocks[k].encode()).hexdigest()==h
              outside=re.sub(r'<yml_catalog date="[^"]+">','<yml_catalog date="__DATE__">',re.sub(r'<offers>[\s\S]*?</offers>','<offers>__OFFERS__</offers>',raw.decode(),count=1)).encode();assert hashlib.sha256(outside).hexdigest()==base['outside_offers_sha256']
              assert len(ET.fromstring(raw).findall('shop/offers/offer'))==x['rows']
              files.append({'name':x['name'],'sha256':x['sha256'],'bytes':x['bytes'],'rows':x['rows'],'expected_previous_sha256':x['expected_previous_sha256'],'content_base64':base64.b64encode(raw).decode()})
          payload={'schema_version':2,'operation':plan['operation'],'files':files};raw=json.dumps(payload,separators=(',',':')).encode();(t/'feed-update42-input.json').write_bytes(raw)
          source=(p/'publish-commercial-channel-hotel-feeds-20261103-1.php').read_text();assert hashlib.sha256(source.encode()).hexdigest()=='2c5afa39924770d30bb541c05d483f44569e5aeae652abcb553cff89ef1f3a6e'
          constants="\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst PUBLIC_STATIC_FEED_OPERATION='"+plan['operation']+"';\nconst PUBLIC_STATIC_FEED_INPUT_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\nconst PUBLIC_STATIC_FEED_INPUT_B64='"+base64.b64encode(raw).decode()+"';\n"
          (t/'channel-preflight.php').write_text(source.replace('declare(strict_types=1);','declare(strict_types=1);'+constants,1))
          print('FEED458_ADD_ONLY_PREPARED existing441_offer_blocks_unchanged=1 aliases458_confirmed=1 provider_calls=0')
          PYCODE
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-channel-hotel-feeds-20261107-update42-intent
          path: ${{ runner.temp }}/feed-update42-input.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Atomically replace only the three feeds with exact previous hash guards
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'channel-preflight.json').read_text().splitlines()[-1]);print(json.dumps(d,sort_keys=True))
          assert d['operation']=='commercial-channel-hotel-feeds-20261107-update42' and d['ok'] and len(d['files'])==3 and [x['rows'] for x in d['files']]==[458,458,916]
          assert d['db_writes']==d['provider_calls']==d['message_sends']==0
          PY
          test "${probe_status:-0}" = 0
      - name: Read back only the three new public feed files once
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,urllib.request,xml.etree.ElementTree as ET
          t=pathlib.Path(os.environ['RUNNER_TEMP']);d=json.loads((t/'channel-preflight.json').read_text().splitlines()[-1]);assert d['ok']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          def get(row):
              op=urllib.request.build_opener(NoRedirect);url=row['public_url']
              with op.open(urllib.request.Request(url,headers={'User-Agent':'AnyTour new458 feed readback','Cache-Control':'no-cache'}),timeout=20) as response:
                  status=response.status;raw=response.read(1000001)
              assert status==200 and len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
              offers=ET.fromstring(raw).findall('shop/offers/offer');assert len(offers)==row['rows']
              return {'name':row['name'],'public_url':url,'http':status,'bytes':len(raw),'sha256':row['sha256'],'rows':len(offers),'exact_published_bytes':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(get,d['files']))
          result={'operation':'commercial-channel-hotel-feeds-20261107-update42-public-readback','ok':True,'files':rows,'public_gets':3,'provider_calls':0,'message_sends':0,'db_writes':0};(t/'public-feed-readback.json').write_text(json.dumps(result,sort_keys=True));print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-channel-hotel-feeds-20261107-update42-result
          path: |
            ${{ runner.temp }}/channel-preflight.json
            ${{ runner.temp }}/public-feed-readback.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json"
