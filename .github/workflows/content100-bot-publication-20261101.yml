name: Synchronize 73 corrected hotel pairs and preserve 274 priced pairs
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8d6ac35dd17614b2cadb3aa3af7637c74280c01c
  EXPECTED_DEPLOY_RUN_ID: '43456259794'
  EXPECTED_TLS_RUN_ID: '43458415792'
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Prepare immutable 73-pair caption sources and existing feed contract
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        assert hashlib.sha256(Path('tools/direct_demand/operations/commercial-caption-review73-20261113-feed-plan.json').read_bytes()).hexdigest()=='a7331833670d3f315294fdfed51c49573d5453eba42b8524e2b323db75e6a01a'
        assert hashlib.sha256(Path('tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py').read_bytes()).hexdigest()=='2ad457e01d5e9395b3911e1601542b537a9410c6da75e7c624ffc348c3cc846d'
        PY
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py prepare
    - name: Authenticate original 54 and completion 92 edits and exact final receipts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43455664622 > "$private/original-caption-run.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/artifacts/14054371257 > "$private/original-caption-artifact.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/artifacts/14054371257/zip > "$private/original-caption.zip"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/43455664622/jobs?per_page=30" > "$private/original-caption-jobs.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43463340468 > "$private/completion-caption-run.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/artifacts/14057478292 > "$private/completion-caption-artifact.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/artifacts/14057478292/zip > "$private/completion-caption.zip"
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py terminal
        php -l "$private/feed-capture.php"
        php -l tools/direct_demand/operations/commercial-caption-review73-20261113-feed-prepare.php
        php -l tools/direct_demand/operations/commercial-caption-review73-20261113-feed-readback.php
    - name: Validate actual price baselines through unchanged PHP contracts
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PRICE_INPUT'
        from pathlib import Path
        import base64,gzip,hashlib,json,os
        ops=Path('tools/direct_demand/operations');p=json.loads((ops/('commercial-caption-review73-20261113-feed-plan.json')).read_bytes());v=p['price_validation']
        private=Path(os.environ['RUNNER_TEMP'])/'caption-repair-private'
        roster=(ops/v['roster_file']).read_bytes();packed=(ops/v['fixture_file']).read_bytes()
        assert hashlib.sha256(roster).hexdigest()==v['roster_gzip_sha256']
        assert hashlib.sha256(packed).hexdigest()==v['fixture_base64_sha256']
        fixture_gzip=base64.b64decode(packed.strip(),validate=True)
        assert hashlib.sha256(fixture_gzip).hexdigest()==v['fixture_gzip_sha256']
        for name,body,expected in [('price-roster.json',gzip.decompress(roster),v['roster_sha256']),('price-fixture.json',gzip.decompress(fixture_gzip),v['fixture_sha256'])]:
         assert hashlib.sha256(body).hexdigest()==expected
         with (private/name).open('xb') as out:out.write(body)
        assert hashlib.sha256((ops/v['test_file']).read_bytes()).hexdigest()==v['test_sha256']
        PRICE_INPUT
        php -l tools/direct_demand/operations/commercial-caption-review73-20261113-test-price-roster.php
        php tools/direct_demand/operations/commercial-caption-review73-20261113-test-price-roster.php tools/direct_demand/operations "$RUNNER_TEMP/caption-repair-private/price-roster.json" "$RUNNER_TEMP/caption-repair-private/price-fixture.json" > "$RUNNER_TEMP/caption-repair-safe/price-native-validation.json"
        python3 - <<'PRICE_CHECK'
        from pathlib import Path
        import json,os
        p=json.loads(Path('tools/direct_demand/operations/commercial-caption-review73-20261113-feed-plan.json').read_bytes());v=p['price_validation']
        r=json.loads((Path(os.environ['RUNNER_TEMP'])/'caption-repair-safe/price-native-validation.json').read_bytes())
        assert r['ok'] is True and r['fixture_only'] is True and r['roster_sha256']==v['roster_sha256'] and r['fixture_sha256']==v['fixture_sha256']
        for name in ['original_caption_run_id','completion_caption_run_id','editorial_pairs','template_only_pairs','drafts_validated','priced_baseline_pairs','unpriced_pairs_without_baseline','negative_admission_checks','assertions']:assert r[name]==v[name]
        assert r['special_proofs_validated']=={'legacy':5,'caption':3} and r['original_cta_failures_reproduced']==6 and r['maximum_probe_utf16_units']<=1024
        assert r['supplier_calls']==r['provider_calls']==r['database_calls']==r['external_writes']==0
        print(json.dumps({'native_price_contract_verified':True,'drafts':152,'actual_baselines':27,'unpriced_without_baseline':46,'external_writes':0}))
        PRICE_CHECK
    - name: Verify installed CONTENT source and retain the failed release closure
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'SOURCE9'
        import json,os,pathlib,subprocess
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        gates=[(43456259794, '.github/workflows/deploy.yml', 'push'), (43458415792, '.github/workflows/max-tls-preflight.yml', 'workflow_run'), (43458412715, '.github/workflows/telegram-production-health.yml', 'workflow_run'), (43458412674, '.github/workflows/max-production-health.yml', 'workflow_run'), (43456259765, '.github/workflows/retired-domain-guard.yml', 'push'), (43458415744, '.github/workflows/publish-conversation-diagnostics.yml', 'workflow_run'), (43458412487, '.github/workflows/modeled-conversion-monitor.yml', 'workflow_run'), (43458412489, '.github/workflows/tour-selection-host.yml', 'workflow_run'), (43458412698, '.github/workflows/live-session-diagnostics.yml', 'workflow_run')]
        assert len(gates)==9 and len({x[0] for x in gates})==9
        for run_id,path,event in gates:
         r=json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control: no-cache',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))
         assert r['id']==run_id and r['run_attempt']==1 and r['head_sha']==expected
         assert r['head_branch']=='main' and r['path']==path and r['event']==event
         assert r['status']=='completed' and r['conclusion']=='success'
         if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43456259794:1'
         pathlib.Path(os.environ['RUNNER_TEMP'],f'commercial-source-gate-{run_id}.json').write_text(json.dumps(r))
        print('NINE_ACTUAL_CONTENT_SOURCE_GATES_SUCCESS_ATTEMPT1')
        SOURCE9
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -p "$evidence"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 - <<'PYPIN'
        import hashlib,pathlib
        assert hashlib.sha256(pathlib.Path('tools/direct_demand/operations/verify-commercial-source.py').read_bytes()).hexdigest()=='5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'
        PYPIN
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-verify-content-source.py --evidence-dir "$evidence"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Capture fresh 604 feeds and original 146 caption journals without writes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/ref/heads/main" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.main.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.carrier.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/issues/comments/6818332618" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.owner.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/commits/$GITHUB_SHA" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.commit.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.active.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$RUNNER_TEMP/caption-repair-private/lease-before-capture.queued.json"
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py lease before-capture
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/feed-capture.php" > "$RUNNER_TEMP/caption-repair-safe/capture.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py capture "$status"
        php tools/direct_demand/operations/commercial-caption-review73-20261113-feed-prepare.php
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py prepared
        php -l "$private/writer.php"
        php -l "$private/feed-readback.php"
    - name: Project only 146 confirmed descriptions through the existing writer once
      id: feed_write
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/ref/heads/main" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.main.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.carrier.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/issues/comments/6818332618" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.owner.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/commits/$GITHUB_SHA" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.commit.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.active.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$RUNNER_TEMP/caption-repair-private/lease-before-write.queued.json"
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py lease before-write
        test "$GITHUB_RUN_ATTEMPT" = 1
        test ! -e "$RUNNER_TEMP/caption-repair-safe/feed-writer.started"
        python3 - <<'PY'
        import json,pathlib,os
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'caption-repair-safe')
        prep=json.loads((p/'preparation.json').read_text())
        with (p/'feed-writer.started').open('x') as out:
         out.write(json.dumps({'operation':prep['operation'],'input_sha256':prep['input_sha256'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'writer_attempts':1,'retry_authorized':False})+'\n')
        PY
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/writer.php" > "$RUNNER_TEMP/caption-repair-safe/writer-receipt.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py writer "$status"
    - name: Verify three exact local and public XML hashes without retries
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        private="$RUNNER_TEMP/caption-repair-private"
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/feed-readback.php" > "$RUNNER_TEMP/caption-repair-safe/public-readback.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-feed-tools.py readback "$status"
    - name: Retain actual input and original feed verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-channel-hotel-feeds-20261113-update19-result
        path: ${{ runner.temp }}/caption-repair-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and compiled private files
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/caption-repair-private" "$RUNNER_TEMP/channel_key"
        "$RUNNER_TEMP/channel_known_hosts"
