name: Apply six authorized monitor prices to existing posts and feeds
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8164359eba9a633f3f25d743e534386ecffe622f
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Prepare six price edits and retain exact current feed bytes
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/main-before-operation.json"
        python3 - <<'PYCURRENT'
        import os,json,pathlib
        assert json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'main-before-operation.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        PYCURRENT
        test "$GITHUB_RUN_ATTEMPT" = 1
        python3 tools/direct_demand/operations/prepare-monitor-price-six-20261111.py
        php tools/direct_demand/operations/test-monitor-price-contract.php
        for id in 1183 117935 27426 13869 1151 1173; do php -l "$RUNNER_TEMP/monitor-$id.php"; done
        python3 - <<'PYFEEDS'
        import concurrent.futures,hashlib,json,os,pathlib,urllib.request
        class NoRedirect(urllib.request.HTTPRedirectHandler):
         def redirect_request(self,*a,**kw):return None
        def get(name):
         with urllib.request.build_opener(NoRedirect).open(urllib.request.Request('https://app.anytoour.ru/feed/'+name,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
          assert r.status==200;raw=r.read(4000001)
         assert len(raw)<4000000
         pathlib.Path(os.environ['RUNNER_TEMP'],'before-'+name).write_bytes(raw)
         return {'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(get,['hotel-posts-telegram.xml','hotel-posts-max.xml','hotel-posts-all.xml']))
        pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-feed-before.json').write_text(json.dumps(rows));print(json.dumps(rows))
        PYFEEDS
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Update existing MAX and Telegram messages once per monitor record
      env: &id001
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/main-before-operation.json"
        python3 - <<'PYCURRENT'
        import os,json,pathlib
        assert json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'main-before-operation.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        PYCURRENT
        for id in 1183 117935 27426 13869 1151 1173; do
          probe_status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/monitor-$id.php" > "$RUNNER_TEMP/monitor-$id-result.json" || probe_status=$?
          python3 - "$id" <<'PYPOST'
        import os,json,pathlib,sys
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-'+sys.argv[1]+'-result.json');d=json.loads(p.read_text().splitlines()[-1]);print('MONITOR_PRICE_POST_RESULT='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
        assert d['ok'] and d['new_posts_created']==0 and len(d['posts'])==2 and all(x['body_photo_button_verified'] and x['existing_message_reused'] for x in d['posts'])
        PYPOST
          test "$probe_status" = 0
        done
    - name: Update existing feeds from both confirmed post journals
      env: *id001
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/main-before-operation.json"
        python3 - <<'PYCURRENT'
        import os,json,pathlib
        assert json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'main-before-operation.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        PYCURRENT
        php tools/direct_demand/operations/prepare-monitor-price-feeds-20261111.php
        php -l "$RUNNER_TEMP/monitor-feed.php"
        probe_status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/monitor-feed.php" > "$RUNNER_TEMP/monitor-feed-result.json" || probe_status=$?
        python3 - <<'PYFEEDRESULT'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-feed-result.json');d=json.loads(p.read_text().splitlines()[-1]);print('MONITOR_PRICE_FEED_RESULT='+json.dumps(d,separators=(',',':')))
        assert d['ok'] and len(d['files'])==3 and [x['rows'] for x in d['files']]==[509,509,1018] and d['db_writes']==d['provider_calls']==d['message_sends']==0
        PYFEEDRESULT
        test "$probe_status" = 0
    - name: Read back exact public feed bytes
      shell: bash
      run: |
        python3 - <<'PYBACK'
        import os,json,pathlib,hashlib,urllib.request,concurrent.futures,xml.etree.ElementTree as ET
        p=pathlib.Path(os.environ['RUNNER_TEMP']);d=json.loads((p/'monitor-feed-result.json').read_text().splitlines()[-1]);assert d['ok']
        class NoRedirect(urllib.request.HTTPRedirectHandler):
         def redirect_request(self,*a,**kw):return None
        def get(row):
         with urllib.request.build_opener(NoRedirect).open(urllib.request.Request(row['public_url'],headers={'Cache-Control':'no-cache'}),timeout=30) as r:
          assert r.status==200;raw=r.read(4000001)
         assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
         offers=ET.fromstring(raw).findall('shop/offers/offer');assert len(offers)==row['rows']
         return {'name':row['name'],'sha256':row['sha256'],'rows':row['rows'],'price_rows':len([x for x in offers if x.find('price') is not None]),'exact_public_readback':True}
        with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(get,d['files']))
        result={'ok':True,'files':rows,'new_posts':0,'supplier_calls':0};(p/'monitor-public-readback.json').write_text(json.dumps(result));print('MONITOR_PRICE_PUBLIC_READBACK='+json.dumps(result,separators=(',',':')))
        PYBACK
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitor-price-six-20261111-results
        path: ${{ runner.temp }}/monitor-*.json
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and scripts
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP"/monitor-*.php
