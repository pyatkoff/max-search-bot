name: Prepare new normal hotel prices and exact owned-link block replacements without editing posts
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: da54e30f9f8b3bde427554ee3e3a2cc02b9ffd97
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261105-normal674-quote-pass1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41998126412
          path: ${{ runner.temp }}/original-quotes
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261105-read14-new674-unpriced1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41993389158
          path: ${{ runner.temp }}/normal-read14
      - name: Admit whole real baskets and replace only exact previously owned link blocks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-new-normal674-hotel-offers-20261105.py
          for script in "$RUNNER_TEMP"/price-normal674-pass1/*/update.php; do
            php -l "$script"
            ANYTOUR_NORMAL674_OFFER_NEW_CASES=1 php "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-offer-update-20261105-normal674-prepared1
          path: |
            ${{ runner.temp }}/price-normal674-pass1/update-index.json
            ${{ runner.temp }}/price-normal674-pass1/prepare-summary.json
            ${{ runner.temp }}/price-normal674-pass1/closed-no-edit.json
            ${{ runner.temp }}/price-normal674-pass1/all-update-intents.json
            ${{ runner.temp }}/price-normal674-pass1/*/update.php
            ${{ runner.temp }}/price-normal674-pass1/*/update-manifest.json
            ${{ runner.temp }}/price-normal674-pass1/*/update-approval.json
            ${{ runner.temp }}/price-normal674-pass1/*/update-intent.json
            ${{ runner.temp }}/price-normal674-pass1/*/candidate.json
          retention-days: 14
          if-no-files-found: error
