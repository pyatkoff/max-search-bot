name: Classify only the nine unquoted retained contexts after completing the19 price updates
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-72h-extension1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41934633857
          path: ${{ runner.temp }}/retained-read10
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-72h-pass1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41935232491
          path: ${{ runner.temp }}/original-quotes
      - name: Inspect only remaining unquoted admission reasons without server or provider calls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-read10-unquoted9-20261104.py
      - name: Retain bounded reason evidence without full private contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-unselected9-inspection1
          path: ${{ runner.temp }}/read10-unselected9-summary.json
          retention-days: 14
          if-no-files-found: warn
