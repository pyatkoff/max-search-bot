name: Recover original no-write hotel price operation and continue bounded callback
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - name: Verify accepted native proof, compatible collector and exact bundles before
        credentials
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ngit rev-parse HEAD^\
        \ > \"$RUNNER_TEMP/repair-source-parent.sha\"\ngit diff --exit-code \"$EXPECTED_SOURCE_SHA\"\
        \ HEAD -- tools/direct_demand/operations\ngh api repos/pyatkoff/max-search-bot/actions/runs/43181493179\
        \ > \"$RUNNER_TEMP/accepted-source-validation.json\"\ngh api repos/pyatkoff/max-search-bot/git/ref/heads/main\
        \ > \"$RUNNER_TEMP/main-before-operation.json\"\ngh api repos/pyatkoff/poisk-turov-test/git/ref/heads/main\
        \ > \"$RUNNER_TEMP/collector-main-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/contents/.github/workflows/collect-anytour-tours.yml?ref=main'\
        \ > \"$RUNNER_TEMP/collector-source-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/actions/runs?event=schedule&status=in_progress&per_page=100'\
        \ > \"$RUNNER_TEMP/collector-active-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/actions/runs?event=schedule&status=queued&per_page=100'\
        \ > \"$RUNNER_TEMP/collector-queued-before-operation.json\"\npython3 - <<'PYCURRENT'\n\
        import base64,hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        read=lambda name:json.loads((root/name).read_text())\nassert (root/'repair-source-parent.sha').read_text().strip()==os.environ['EXPECTED_SOURCE_SHA'],'SOURCE_PARENT_CHANGED'\n\
        run=read('accepted-source-validation.json')\nassert run['id']==43181493179\
        \ and run['head_sha']==os.environ['EXPECTED_SOURCE_SHA'] and run['run_attempt']==1\
        \ and run['status']=='completed' and run['conclusion']=='success','ORIGINAL_NATIVE_SOURCE_PROOF_NOT_ACCEPTED'\n\
        assert read('main-before-operation.json')['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA'],'CURRENT_MAIN_CHANGED_BEFORE_CREDENTIALS'\n\
        assert read('collector-main-before-operation.json')['object']['sha']==os.environ['EXPECTED_COLLECTOR_MAIN_SHA'],'COLLECTOR_MAIN_CHANGED_BEFORE_CREDENTIALS'\n\
        code=base64.b64decode(read('collector-source-before-operation.json')['content'])\n\
        assert hashlib.sha256(code).hexdigest()==os.environ['EXPECTED_COLLECTOR_FILE_SHA256'],'COLLECTOR_CALLBACK_SOURCE_CHANGED'\n\
        for name in ('collector-active-before-operation.json','collector-queued-before-operation.json'):\n\
        \    runs=read(name)\n    assert runs['total_count']<100,'ACTIVE_RUN_INVENTORY_TRUNCATED'\n\
        \    for active in runs['workflow_runs']:\n        assert active['name']!='Collect\
        \ AnyTour tour observations' or active['head_sha']==os.environ['EXPECTED_COLLECTOR_MAIN_SHA'],'OLD_COLLECTOR_CALLBACK_STILL_ACTIVE'\n\
        print('ORIGINAL_SOURCE_AND_COLLECTOR_ADMISSION_OK')\nPYCURRENT\npython3 tools/direct_demand/operations/build-monitor-price-hook.py\
        \ \"$RUNNER_TEMP/monitor-price-hook.php\"\npython3 tools/direct_demand/operations/build-monitor-no-write-reconciliation.py\
        \ \"$RUNNER_TEMP/monitor-no-write-reconciliation.php\"\npython3 - <<'PYBUNDLES'\n\
        import hashlib,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        for name,key in [('monitor-price-hook.php','EXPECTED_HOOK_SHA256'),('monitor-no-write-reconciliation.php','EXPECTED_RECONCILE_SHA256')]:\n\
        \    assert hashlib.sha256((root/name).read_bytes()).hexdigest()==os.environ[key],'NATIVE_TESTED_BUNDLE_BYTES_CHANGED'\n\
        print('EXACT_NATIVE_TESTED_BUNDLES_OK')\nPYBUNDLES\nphp -l \"$RUNNER_TEMP/monitor-price-hook.php\"\
        \nphp -l \"$RUNNER_TEMP/monitor-no-write-reconciliation.php\"\n"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"\
        $raw\" == *\"PRIVATE KEY\"* ]]; then\n  if [[ \"$raw\" == *'\\n'* ]]; then\
        \ printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; else\
        \ printf '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\n\
        else\n  printf '%s' \"$raw\" | base64 --decode > \"$RUNNER_TEMP/channel_key\"\
        \nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\n\
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',host)\
        \ and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\n\
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\n\
        matches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n\
        \  if len(fields)<3 or fields[0].startswith('#'):continue\n  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n\
        \  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\n\
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(matches)+'\\n')\nPY\n"
    - name: Append exact expired no-write outcome and hold without editing posts
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o
        IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST"
        ''cd /var/www/anytoour/data/www/app.anytoour.ru && php'' < "$RUNNER_TEMP/monitor-no-write-reconciliation.php"
        | tee "$RUNNER_TEMP/monitor-no-write-reconciliation.jsonl"

        '
    - name: Continue the existing callback once with at most 30 other hotel pairs
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o
        IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST"
        ''cd /var/www/anytoour/data/www/app.anytoour.ru && php'' < "$RUNNER_TEMP/monitor-price-hook.php"
        | tee "$RUNNER_TEMP/monitor-price-hook-recovered-pass.jsonl"

        '
    - name: Inspect the current 481-hotel roster without writes
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o
        IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST"
        ''cd /var/www/anytoour/data/www/app.anytoour.ru && ANYTOUR_MONITOR_HOOK_INSPECT=1
        php'' < "$RUNNER_TEMP/monitor-price-hook.php" | tee "$RUNNER_TEMP/monitor-price-after-recovery-inspection.jsonl"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitor-price-original-operation-recovery
        path: '${{ runner.temp }}/monitor-no-write-reconciliation.jsonl

          ${{ runner.temp }}/monitor-price-hook-recovered-pass.jsonl

          ${{ runner.temp }}/monitor-price-after-recovery-inspection.jsonl'
        retention-days: 14
    - name: Remove ephemeral connection and bundle
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/monitor-price-hook.php"
        "$RUNNER_TEMP/monitor-no-write-reconciliation.php"
env:
  EXPECTED_PRODUCTION_SHA: d1c79f5753d7d254d17921072f5ce59520082f4d
  EXPECTED_SOURCE_SHA: 8f7faaeea18e2d5e1d6d07d660c761c51ccf7a6c
  EXPECTED_COLLECTOR_MAIN_SHA: 17449ef5eb74edf1c60197ef3b9f00e40feaf485
  EXPECTED_COLLECTOR_FILE_SHA256: e186d3dbc534d37d956a863a468ea81c1a120e514dc412bc73d0fbb5645b0cd0
  EXPECTED_HOOK_SHA256: c165dc1a01e46e5e74da119a205caf8cde32b04b03fead67ae530d64efb15727
  EXPECTED_RECONCILE_SHA256: 57b8c89adcda8a2257760e72b9ee6ea52b105797e1e8f2a220955aa5ebf8fc91
