name: Inspect next three official hotel photo sources
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect fixed public source pages without server or bot access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain public source observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-three-20261102-4-public-photo-sources
          path: public-media-sources.json
          retention-days: 14
