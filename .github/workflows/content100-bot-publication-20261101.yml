name: Project current Old Palace gallery declarations without repeating owner access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  SOURCE_METADATA_PROJECTION_PLAN_FILENAME: commercial-batch-20261105-58-primary-metadata-projection1-plan.json
  EXPECTED_SOURCE_METADATA_PROJECTION_PLAN_SHA256: 490e7dffdde1fa9a1613aa7e89b3732ae56019bbc3ef99e7f0295bb06097582a
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-batch58-primary-0
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42110612108
          path: ${{ runner.temp }}/source58
      - name: Validate original current owner source and project only declaration metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/project-hotel-primary-metadata-20261105-batch58.py
          python3 tools/direct_demand/operations/project-hotel-primary-metadata-20261105-batch58.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-batch58-current-owner-metadata1
          path: ${{ runner.temp }}/source58-owner-metadata.json
          retention-days: 14
          if-no-files-found: warn
