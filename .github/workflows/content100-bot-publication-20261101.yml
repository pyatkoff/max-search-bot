name: Inspect only changed Crystal Bay and Holidays covers
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect exact native covers without server or bot access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-canva-covers-20261102-3.py
      - name: Retain public promotional cover observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-three-20261102-8-two-updated-covers
          path: |
            native-cover-receipt.json
            covers/
          retention-days: 14
