name: Append four confirmed hotel pairs with existing nightly guard and fresh lease
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 77dfb182148d9df9903e8e21fb8f29e986d4fd5f
  EXPECTED_PUBLICATION_SHA: 77dfb182148d9df9903e8e21fb8f29e986d4fd5f
  FEED_OPERATION: commercial-channel-hotel-feeds-20261113-update11
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Authenticate original publication and root-admitted private route proof before connection credentials
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\
        \numask 077\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,re,subprocess,zipfile\nbase=pathlib.Path('tools/direct_demand/operations')\n\
        work=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed-tail'\nevidence=work/'source-evidence';evidence.mkdir(parents=True,mode=0o700)\n\
        source_raw=(base/'commercial-channel-hotel-feeds-20261113-update11-source.json').read_bytes()\nassert hashlib.sha256(source_raw).hexdigest()=='5fcb5a6d18c34c984d5c427c1398b93a3461a4aefa9201e6006c95c011f4ffe5'\n\
        plan=json.loads(source_raw)\nassert plan['ready'] is True and plan['publisher']['qualified_outcome']=={'original_run_conclusion':'failure','failure_stage':'post_send_wrapper_count_assertion','actual_sent_receipt_verified':True,'actual_new_posts':8,'reused':0},\
        \ 'QUALIFIED_CONTINUATION_NOT_READY'\nassert re.fullmatch(r'[a-f0-9]{40}',plan['current_installed_sha']\
        \ or '') and plan['current_installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']\nassert plan['current_source_acceptance']\
        \ is not None and re.fullmatch(r'[a-f0-9]{64}',plan['current_source_acceptance']['verifier_sha256'])\nassert\
        \ plan['schema_version']==1 and plan['operation']==os.environ['FEED_OPERATION']\nassert plan['expected_installed_sha']==os.environ['EXPECTED_PUBLICATION_SHA']\
        \ and plan['previous_count']==580\ndef sha(b):return hashlib.sha256(b).hexdigest()\ndef hex64(v):assert\
        \ isinstance(v,str) and re.fullmatch(r'[a-f0-9]{64}',v), 'EXACT_REAL_HASH_REQUIRED'\ndef positive(v):assert\
        \ type(v) is int and v>0, 'EXACT_ORIGINAL_RUN_OR_ARTIFACT_ID_REQUIRED'\npins={'prepare-publication-tail.py':'6db0ef9d8bb51d897387140c6f5c1d9e5b68bc33ffff41c9cea98621c927c4b8',\n\
        \      'publish-commercial-channel-hotel-feeds-20261103-1.php':'8609a2cf06d4a46738f934047d46744bdc54d3863e7c2921fdfec1a9be4b7a5e',\n\
        \      'monitor-price-contract.php':'62e8ab1ab0c08eea9dd42ac6dbb362f0015e397e90e2617d7f44aa6be0c7f690',\n\
        \      'verify-commercial-source.py':plan['current_source_acceptance']['verifier_sha256'],\n      'commercial-channel-hotel-feeds-20261113-update10-nightly-guard.php':'0c60e5a851ae014de9a1542f268449b7a1d0fb0ba9f3104db8da650035ea8486'}\n\
        for name,h in pins.items():assert sha((base/name).read_bytes())==h, 'FROZEN_TAIL_CODE_CHANGED'\nfor name,key\
        \ in [('commercial-batch-20261113-10-manifest.json','manifest_sha256'),('commercial-batch-20261113-10-approval.json','approval_sha256')]:\n\
        \  hex64(plan[key]);assert sha((base/name).read_bytes())==plan[key], 'ORIGINAL_APPROVED_INPUT_CHANGED'\n\
        publisher=plan['publisher']\nassert publisher['repository']=='pyatkoff/max-search-bot'\nassert publisher['head_branch']=='audit/content100-bot-publication-20261101'\n\
        assert publisher['workflow_path']=='.github/workflows/content100-bot-publication-20261101.yml'\npositive(publisher['run_id']);assert\
        \ publisher['run_attempt']==1\nassert publisher['head_sha']=='1386463de6c28f5f27985717f2363c7ff35135d0'\n\
        for key in ('publication_summary_sha256','bound_read_sha256'):hex64(publisher[key])\nartifact=publisher['artifact'];positive(artifact['id']);hex64(artifact['zip_sha256'])\n\
        assert artifact['name']=='commercial-batch-20261113-10-publication-and-read'\nroute=plan['route']\nassert\
        \ route['source_method']=='root_authenticated_private_artifacts'\nassert route['repository']=='pyatkoff/tour-max'\
        \ and route['run_attempt']==1\nassert route['operation']=='commercial-max584-private-route-extension-20261113-10-install1'\n\
        assert route['run_id']==43359006895 and route['head_sha']=='f2f23f4afc340e410b2e5649c3befcbd151ed707'\n\
        for key in ('original_manifest_sha256','manifest_projection_sha256','map_sha256','module_sha256','receipt_sha256','route_proof_sha256'):hex64(route[key])\n\
        # These three safe files were derived by root from authenticated private originals.\n# No tour-max API request\
        \ and no private route map is supplied to this workflow.\nroute_dir=work/'accepted/route';route_dir.mkdir(parents=True,mode=0o700)\n\
        safe_files=[('commercial-max584-20261113-10-route-proof.json','route_proof_sha256'),\n            ('commercial-max584-20261113-10-route-manifest-projection.json','manifest_projection_sha256'),\n\
        \            ('commercial-max584-20261113-10-route-result.json','receipt_sha256')]\nfor name,key in safe_files:\n\
        \  raw=(base/name).read_bytes();assert sha(raw)==route[key], 'ROOT_AUTHENTICATED_ROUTE_PROJECTION_CHANGED'\n\
        \  (route_dir/name).write_bytes(raw)\nproof=json.loads((route_dir/safe_files[0][0]).read_bytes())\nassert\
        \ proof['kind']=='root_authenticated_private_route_extension'\nassert proof['original_route_manifest_sha256']==route['original_manifest_sha256']\n\
        assert proof['original_route_map_sha256']==route['map_sha256'] and proof['original_route_module_sha256']==route['module_sha256']\n\
        assert proof['route_manifest_projection_sha256']==route['manifest_projection_sha256'] and proof['route_receipt_sha256']==route['receipt_sha256']\n\
        assert proof['publication_summary_sha256']==publisher['publication_summary_sha256'] and proof['bound_read_sha256']==publisher['bound_read_sha256']\n\
        for key in ('repository','run_id','run_attempt','head_sha','head_branch','workflow_path','candidate_artifact','result_artifact'):\n\
        \  assert proof['source'][key]==route[key], 'ROOT_ROUTE_PROOF_PROVENANCE_CHANGED'\ndef api(path,out,raw=False):\n\
        \  assert path.startswith('repos/pyatkoff/max-search-bot/'), 'PUBLICATION_REPOSITORY_ONLY'\n  command=['gh','api']\n\
        \  if raw:command+=['-H','Accept: application/vnd.github.raw+json']\n  command+=[path]\n  with out.open('wb')\
        \ as f:subprocess.run(command,stdout=f,check=True,timeout=60)\n  return out.read_bytes()\nrun=json.loads(api('repos/pyatkoff/max-search-bot/actions/runs/'+str(publisher['run_id']),evidence/'publication-run.json'))\n\
        assert run['id']==publisher['run_id'] and run['run_attempt']==1\nassert run['head_sha']==publisher['head_sha']\
        \ and run['head_branch']==publisher['head_branch'] and run['path']==publisher['workflow_path']\nassert run['event']=='push'\
        \ and run['status']=='completed' and run['conclusion']=='failure', 'ORIGINAL_POST_SEND_WRAPPER_FAILURE_REQUIRED'\n\
        meta=json.loads(api('repos/pyatkoff/max-search-bot/actions/artifacts/'+str(artifact['id']),evidence/'publication-artifact.json'))\n\
        assert meta['id']==artifact['id'] and meta['name']==artifact['name'] and meta['expired'] is False\nassert\
        \ meta['digest']=='sha256:'+artifact['zip_sha256']\nassert meta['workflow_run']['id']==publisher['run_id']\
        \ and meta['workflow_run']['head_sha']==publisher['head_sha']\narchive=work/'publication.zip'\napi('repos/pyatkoff/max-search-bot/actions/artifacts/'+str(artifact['id'])+'/zip',archive)\n\
        assert sha(archive.read_bytes())==artifact['zip_sha256'], 'ORIGINAL_PUBLICATION_ZIP_CHANGED'\ndestination=work/'accepted/publication';destination.mkdir(parents=True,mode=0o700)\n\
        with zipfile.ZipFile(archive) as z:\n  assert sum(i.file_size for i in z.infolist())<8000000, 'ARTIFACT_SIZE_BOUND'\n\
        \  for name in ['channel-preflight.json']:\n    matches=[i for i in z.infolist() if not i.is_dir() and pathlib.PurePosixPath(i.filename).name==name]\n\
        \    assert len(matches)==1 and 0<matches[0].file_size<4000000, 'ARTIFACT_FILE_NOT_UNIQUE'\n    member=pathlib.PurePosixPath(matches[0].filename)\n\
        \    assert not member.is_absolute() and '..' not in member.parts, 'UNSAFE_ARTIFACT_MEMBER'\n    (destination/name).write_bytes(z.read(matches[0]))\n\
        reader=plan['bound_reader']\nassert reader['run_id']==43358539473 and reader['head_sha']=='7c49eeb2f97c5c58ecb23709194287d8cb0f61ad'\
        \ and reader['run_attempt']==1\nrr=json.loads(api('repos/pyatkoff/max-search-bot/actions/runs/'+str(reader['run_id']),evidence/'reader-run.json'))\n\
        assert rr['run_attempt']==1 and rr['head_sha']==reader['head_sha'] and rr['head_branch']==publisher['head_branch']\
        \ and rr['path']==publisher['workflow_path'] and rr['status']=='completed' and rr['conclusion']=='success'\n\
        ra=reader['artifact'];meta2=json.loads(api('repos/pyatkoff/max-search-bot/actions/artifacts/'+str(ra['id']),evidence/'reader-artifact.json'))\n\
        assert meta2['id']==14007490826 and meta2['digest']=='sha256:'+ra['zip_sha256'] and not meta2['expired']\
        \ and meta2['workflow_run']['id']==reader['run_id'] and meta2['workflow_run']['head_sha']==reader['head_sha']\n\
        rz=work/'reader.zip';api('repos/pyatkoff/max-search-bot/actions/artifacts/'+str(ra['id'])+'/zip',rz);assert\
        \ sha(rz.read_bytes())==ra['zip_sha256']\nwith zipfile.ZipFile(rz) as z:\n assert sum(i.file_size for i\
        \ in z.infolist())<8000000\n for name in ['channel-preflight.json','channel-feed-read.json']:\n  matches=[i\
        \ for i in z.infolist() if not i.is_dir() and pathlib.PurePosixPath(i.filename).name==name];assert len(matches)==1\
        \ and 0<matches[0].file_size<4000000\n  data=z.read(matches[0])\n  if name=='channel-preflight.json':assert\
        \ data==(destination/name).read_bytes()\n  else:(destination/name).write_bytes(data)\nassert sha((destination/'channel-feed-read.json').read_bytes())==reader['bound_read_sha256']==publisher['bound_read_sha256']\n\
        manifest_name='commercial-batch-20261113-10-manifest.json'\noriginal=api('repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/'+manifest_name+'?ref='+publisher['head_sha'],evidence/'original-published-manifest.json',True)\n\
        assert sha(original)==plan['manifest_sha256'], 'PUBLISHED_SOURCE_MANIFEST_CHANGED'\npub=(destination/'channel-preflight.json').read_bytes().splitlines()[-1]\n\
        read=(destination/'channel-feed-read.json').read_bytes()\nassert sha(pub)==publisher['publication_summary_sha256']\
        \ and sha(read)==publisher['bound_read_sha256'], 'ORIGINAL_PUBLICATION_RECEIPT_CHANGED'\np=json.loads(pub);r=json.loads(read.splitlines()[-1]);installed=json.loads((route_dir/safe_files[2][0]).read_bytes())\n\
        assert p['ok'] is True and p['operation']=='commercial-hotel-batch-20261113-10-v1' and p['new_posts']==p['post_write_attempts']==len(p['posts'])==8\
        \ and p['reused']==0 and all(x['state']=='sent' and x['body_photo_button_verified'] for x in p['posts'])\n\
        assert r['ok'] is True and r['operation']=='commercial-channel-hotel-feeds-20261113-read10'\nassert installed['ok']\
        \ is True and installed['operation']==route['operation'] and installed['state']=='INSTALLED_AND_NATIVE_VERIFIED'\n\
        (work/'source.json').write_bytes(source_raw)\nprint(json.dumps({'operation':plan['operation'],'original_publication_run_authenticated':True,'exact_publication_archive':1,\n\
        \                  'route_admission':'root_authenticated_private_artifacts','private_map_downloads':0,\n\
        \                  'publication_posts':8,'native_route_state':installed['state'],'post_write_attempts':0,'provider_calls':0}))\n\
        PY\n"
    - name: Require original current-source release and health gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\nevidence=\"$RUNNER_TEMP/commercial-source-evidence\"\nmkdir -m 700 \"\
        $evidence\"\ngh api repos/pyatkoff/max-search-bot/git/ref/heads/main > \"$evidence/main.json\"\ngh api \"\
        repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100\" > \"$evidence/current-runs.json\"\
        \npython3 - <<'PY'\nimport os,json,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');sha=os.environ['EXPECTED_PRODUCTION_SHA']\n\
        assert json.loads((p/'main.json').read_text())['object']['sha']==sha\nruns=json.loads((p/'current-runs.json').read_text())['workflow_runs']\n\
        paths=['deploy.yml','max-tls-preflight.yml','modeled-conversion-value-export.yml','max-production-health.yml','telegram-production-health.yml','live-session-diagnostics.yml','modeled-conversion-monitor.yml','tour-selection-host.yml','publish-conversation-diagnostics.yml']\n\
        selected={}\nexpected=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'feed-tail/source.json').read_bytes())['current_source_acceptance']['source_gates']\n\
        for name in paths:\n candidates=[r for r in runs if r['head_sha']==sha and r['head_branch']=='main' and\
        \ r['path']=='.github/workflows/'+name and r['run_attempt']==1 and r['id']==expected[name]['run_id']]\n\
        \ assert candidates, 'original current-source gate missing: '+name\n r=max(candidates,key=lambda r:r['id']);assert\
        \ r['status']=='completed' and r['conclusion']=='success', 'gate not successful: '+name\n selected[name]=r\n\
