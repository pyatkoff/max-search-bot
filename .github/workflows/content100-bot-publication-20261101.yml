name: Read PR1567 release admission and preserve the existing hotel owner record
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'a901323f00576c8dc4d5f25f36fc6eeaf6090af2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3c76952bd3b6f7e3d04b0f6aae876816188f906f
          path: accepted-main
          persist-credentials: false
      - name: Read exact source CI and complete current coordination; archive original record once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = a901323f00576c8dc4d5f25f36fc6eeaf6090af2
          umask 077
          mkdir "$RUNNER_TEMP/pr1567-admission"
          python3 - <<'PY'
          import subprocess,json,hashlib,pathlib,os,re,datetime
          repo='pyatkoff/max-search-bot';prefix='repos/'+repo+'/'
          branch='audit/content100-bot-publication-20261101'
          base='3c76952bd3b6f7e3d04b0f6aae876816188f906f';head='b97c92dfe3131017cb5f7acff1f51c8fa8b8b8f0'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1567-admission'
          def api(path,body=None,method=None):
            cmd=['gh','api',prefix+path]
            if body is not None:cmd+=['--method',method or 'POST','--input','-']
            return json.loads(subprocess.check_output(cmd,input=None if body is None else json.dumps(body,ensure_ascii=False).encode(),timeout=30))
          def save(name,data):
            (out/name).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          assert api('git/ref/heads/'+branch)['object']['sha']==os.environ['GITHUB_SHA']
          assert api('git/ref/heads/main')['object']['sha']==base
          pr=api('pulls/1567');save('pr.json',pr)
          assert pr['state']=='open' and not pr['draft'] and pr['head']['sha']==head and pr['base']['sha']==base
          for rid,kind in [(43892355524,'regression'),(43892355522,'guard')]:
            run=api('actions/runs/'+str(rid));save(kind+'-run.json',run)
            assert run['head_sha']==head and run['event']=='pull_request' and run['run_attempt']==1 and run['status']=='completed' and run['conclusion']=='success'
            jobs=api('actions/runs/'+str(rid)+'/jobs?per_page=100');save(kind+'-jobs.json',jobs)
            assert jobs['total_count']==len(jobs['jobs']) and jobs['total_count']<100
            assert any(j['name']==kind and j['conclusion']=='success' for j in jobs['jobs'])
            assert all(j['status']=='completed' and j['conclusion'] in ('success','skipped') for j in jobs['jobs'])
          issue=api('issues/1122');comments=[]
          for page in range(1,21):
            batch=api('issues/1122/comments?per_page=100&page='+str(page));assert isinstance(batch,list)
            comments.extend(batch)
            if len(batch)<100:break
          else:raise RuntimeError('coordination_page_bound')
          assert len(comments)==issue['comments'] and len({c['id'] for c in comments})==len(comments)
          save('coordination.json',comments)
          busy=[{'id':c['id'],'body':c['body'],'updated_at':c['updated_at']} for c in comments if re.fullmatch(r'PR[1-9][0-9]*: выпуск занят',c['body'].strip())]
          assert not busy,('publisher_busy',busy)
          record=api('issues/comments/6818332618');save('owner-record.json',record)
          assert record['id']==6818332618 and record['user']['id']==226193297
          assert record['issue_url']=='https://api.github.com/repos/'+repo+'/issues/1122'
          assert record['updated_at']=='2026-11-15T15:37:22Z' and record['body'].startswith('FREE CONTENT — 15 Nov:')
          raw=record['body'].encode();(out/'owner-record-original.md').write_bytes(raw)
          original_sha=hashlib.sha256(raw).hexdigest()
          # Preserve the public owner history before its existing record is reused.
          # Only this data checkpoint changes on the existing non-runtime carrier.
          path='tools/direct_demand/operations/checkpoints/source6818332618-before-pr1567-20261116.md'
          blob=api('git/blobs',{'content':record['body'],'encoding':'utf-8'})
          assert blob['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          parent=api('git/commits/'+os.environ['GITHUB_SHA'])
          tree=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':[{'path':path,'mode':'100644','type':'blob','sha':blob['sha']}]})
          commit=api('git/commits',{'message':'checkpoint: preserve original hotel owner record before PR1567 release','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          assert api('git/ref/heads/'+branch)['object']['sha']==os.environ['GITHUB_SHA']
          api('git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},'PATCH')
          assert api('git/ref/heads/'+branch)['object']['sha']==commit['sha']
          assert api('contents/'+path+'?ref='+commit['sha'])['sha']==blob['sha']
          summary={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pr':1567,'head':head,'base':base,'comments_read':len(comments),'active_publishers':busy,'owner_comment':6818332618,'owner_id':226193297,'owner_updated_at':record['updated_at'],'owner_original_sha256':original_sha,'checkpoint_commit':commit['sha'],'checkpoint_blob':blob['sha'],'checkpoint_path':path,'main_writes':0,'publisher_writes':0,'production_calls':0,'provider_calls':0}
          save('summary.json',summary);print('ADMISSION_SNAPSHOT='+json.dumps(summary,ensure_ascii=False))
          PY
      - name: Run the existing final priority decision without a lease or merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: pyatkoff/max-search-bot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C accepted-main hash-object tools/release_priority.js)" = 3e99ee1bb51fc9536cf6214fde82c7a8f03a13d8
          node accepted-main/tools/release_priority.js --admit 1567 b97c92dfe3131017cb5f7acff1f51c8fa8b8b8f0 3c76952bd3b6f7e3d04b0f6aae876816188f906f | tee "$RUNNER_TEMP/pr1567-admission/priority.log"
      - name: Preserve the complete original admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1567-current-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/pr1567-admission/
          if-no-files-found: error
          retention-days: 14
