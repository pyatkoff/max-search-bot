name: Read original TV2651 pending journal without writes
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - name: Validate exact readonly reader before credentials
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_RUN_ATTEMPT" = 1
        printf '%s  %s\n' "$EXPECTED_READER_SHA256" "tools/direct_demand/operations/read-pending-2651-20261112.php" | sha256sum --check
        php -l tools/direct_demand/operations/read-pending-2651-20261112.php
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read only the original pending journal
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && test "$(git rev-parse --verify HEAD)" = 7a96af3e9d0e262a2ff5a257295dc9e9764e9d53 && php' < "$GITHUB_WORKSPACE/tools/direct_demand/operations/read-pending-2651-20261112.php" | tee "$RUNNER_TEMP/monitor-pending-2651-read.jsonl"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitor-pending-2651-readonly
        path: ${{ runner.temp }}/monitor-pending-2651-read.jsonl
        retention-days: 14
    - name: Remove ephemeral connection
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
env:
  EXPECTED_READER_SHA256: 38620846507c0b9bed93ff76bf8c29ce79e34c182addeacf9f633afc5b32613b
