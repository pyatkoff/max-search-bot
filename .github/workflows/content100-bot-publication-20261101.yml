name: Inspect public hotel photo sources
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read fixed public hotel sources without server credentials or publication
        run: python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain bounded public source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-three-20261102-3-public-media-sources
          path: public-media-sources.json
          retention-days: 14
          if-no-files-found: warn
