name: Read exact canonical bindings for all150 hotel miniapp routes
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 300fcabd2277f337755f0e41fc74851491cf3dc7
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /tools/direct_demand/operations/
            /.github/traffic-publish/hotel-posts-telegram.xml
            /.github/traffic-publish/hotel-posts-max.xml
          sparse-checkout-cone-mode: false
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41803690611 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41803690611/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41804747539 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Validate finite canonical scope and private projection before server connection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          MINIAPP_BINDING_FIXTURE=1 php tools/direct_demand/operations/read-commercial-miniapp-canonical-150-20261104-1.php
          python3 - <<'PY'
          import pathlib,hashlib,json,os,base64,re,xml.etree.ElementTree as ET
          root=pathlib.Path('.github/traffic-publish')
          rows=[]
          expected={'telegram':('tg','807da5b17cbda96860c952417bd880091246991e39504ba1e65520f392d70d70'),'max':('max','a0599641898a173c2286e65d9c1ac15cfd138c2e3cf5934367e3ac2d096229f5')}
          scope={}
          for platform,(prefix,digest) in expected.items():
              raw=(root/('hotel-posts-'+platform+'.xml')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest
              offers=ET.fromstring(raw).findall('.//offer');assert len(offers)==150
              ids=[]
              for offer in offers:
                  m=re.fullmatch(prefix+r'_([1-9][0-9]*)',offer.attrib['id']);assert m
                  hotel_id=int(m[1]);url=offer.findtext('url')
                  assert isinstance(url,str) and url.startswith('https://')
                  rows.append({'hotel_id':hotel_id,'platform':platform,'post_url':url});ids.append(hotel_id)
              scope[platform]=ids
          assert scope['telegram']==scope['max'] and len(set(scope['max']))==150
          raw=json.dumps(rows,ensure_ascii=False,separators=(',',':')).encode()
          src=pathlib.Path('tools/direct_demand/operations/read-commercial-miniapp-canonical-150-20261104-1.php').read_text()
          prefix="<?php\ndeclare(strict_types=1);\n";assert src.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"+"const MINIAPP_BINDING_INPUT_B64='"+base64.b64encode(raw).decode()+"';\n"+"const MINIAPP_BINDING_INPUT_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP'],'channel-preflight.php').write_text(header+src[len(prefix):])
          intent={'operation':'commercial-miniapp-canonical-150-bindings-read1','mode':'bounded_read_only','logical_hotels':150,'expected_bindings':300,'input_sha256':hashlib.sha256(raw).hexdigest(),'provider_calls':0,'runtime_writes':0}
          pathlib.Path(os.environ['RUNNER_TEMP'],'miniapp-binding-intent.json').write_text(json.dumps(intent,sort_keys=True))
          print('MINIAPP150_EXACT_CURRENT_FEED_SCOPE_OK private_projection_to_authenticated_artifact=1')
          PY
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-miniapp-canonical-150-bindings-read1-intent
          path: ${{ runner.temp }}/miniapp-binding-intent.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read exact current registry bindings without bodies buttons or provider receipts
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'channel-preflight.json').read_text().splitlines()[-1])
          safe={k:d.get(k) for k in ['operation','ok','error','scope_hotels','binding_count','installed_sha','provider_calls','db_writes','message_sends','runtime_writes']}
          print(json.dumps(safe,sort_keys=True))
          assert d['ok'] and d['operation']=='commercial-miniapp-canonical-150-bindings-read1' and d['scope_hotels']==150 and d['binding_count']==300
          assert all(d[k]==0 for k in ['provider_calls','db_writes','message_sends','runtime_writes'])
          assert {r['platform'] for r in d['bindings']}=={'telegram','max'}
          assert len({r['public_route_alias'] for r in d['bindings']})==300
          PY
          test "${probe_status:-0}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-miniapp-canonical-150-bindings-read1
          path: ${{ runner.temp }}/channel-preflight.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove ephemeral connection and private projection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/miniapp-binding-intent.json"
