name: Final read-only admission for the already acquired PR1567 publisher
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'c62357eae8b86e0e2c20fda43e04581419075aaf' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: de4c64dd0790a9cf71027268d354dd871cce0728
          persist-credentials: false
      - name: Validate the exact original current-source checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git hash-object tools/release_priority.js)" = 3e99ee1bb51fc9536cf6214fde82c7a8f03a13d8
          umask 077
          mkdir "$RUNNER_TEMP/pr1567-final"
          python3 - <<'PY'
          import json,subprocess,pathlib,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1567-final'
          for rid in [43899136789,43899136696]:
            raw=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/runs/'+str(rid)],timeout=15)
            r=json.loads(raw)
            assert r['head_sha']=='9159120afb7b28def6884ceacc46c2a5e5540585' and r['event']=='pull_request' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
            (out/(str(rid)+'.json')).write_bytes(raw)
          PY
      - name: Apply unchanged canonical final admission to the original owned tuple
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: pyatkoff/max-search-bot
        shell: bash
        run: |
          set -euo pipefail
          node tools/release_priority.js --admit 1567 9159120afb7b28def6884ceacc46c2a5e5540585 de4c64dd0790a9cf71027268d354dd871cce0728 --publisher 6818332618 226193297 2026-11-16T16:00:56Z | tee "$RUNNER_TEMP/pr1567-final/priority.log"
      - name: Retain final read-only decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1567-final-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/pr1567-final/
          if-no-files-found: error
          retention-days: 14
