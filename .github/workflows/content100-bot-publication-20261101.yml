name: Prepare ten noquote hotel search link edits with exact current captions
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: a95f6e3514eb48f2b7dcda36ac1f40ab31d0ff99
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context17-ten1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42009478360
          path: ${{ runner.temp }}/original-context17
      - name: Prepare explicit noquote search URLs and verify new native context bindings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-ten1.py
          python3 tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-ten1.py
          for file in "$RUNNER_TEMP"/hotel-search-links-ten1/*/update.php; do
            php -l "$file"
            ANYTOUR_SEARCH_LINK17_NEW_CASES=1 php "$file"
          done
      - name: Retain original private frozen noquote link manifests approvals frames and scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-ten1-prepared1
          path: ${{ runner.temp }}/hotel-search-links-ten1
          retention-days: 14
          if-no-files-found: warn
