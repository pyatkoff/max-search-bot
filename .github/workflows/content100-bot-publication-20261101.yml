name: Inspect retained Moscow feed price terms without another source request
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41932708020
          path: ${{ runner.temp }}/moscow-source
      - name: Inspect only retained public source terms and destination classes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/inspect-retained-moscow-yml-terms-20261104.py
      - name: Retain original public source privately with bounded schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection2
          path: |
            ${{ runner.temp }}/moscow-yml-inspection2-summary.json
          retention-days: 14
          if-no-files-found: warn
