name: Read one current public Telegram miniapp entry
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Read one declared public entry without signed user context
        run: python3 tools/direct_demand/operations/read-commercial-miniapp-public-tg-20261104-1.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-miniapp-current-public-tg-read1
          path: public-tg-miniapp-contract.json
          retention-days: 14
          if-no-files-found: error
