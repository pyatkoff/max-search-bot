name: Correct only the six existing hotel captions without new sends
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: c21ee260e70b8f879e6f788405186ea9dab11543
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42353354646 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/42353354646/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/42353811651 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - uses: actions/download-artifact@v4
        with:
          run-id: 42354637509
          name: commercial-batch-20261107-1-publication
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-three-publication
      - name: Bind exact revised captions to original six confirmed messages
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          umask 077
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib
          base=pathlib.Path('tools/direct_demand/operations');tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          newraw=(base/'commercial-hotel-caption-correction-20261107-1-inputs.json').read_bytes()
          assert hashlib.sha256(newraw).hexdigest()=='959615d738a7f5c1a372a59a925c8ee07baf6b64843af82ab7c706d08899ac80'
          new=json.loads(newraw);assert new['status']=='EDITORIAL_CORRECTION_READY_NOT_USER_ACCEPTED'
          oldraw=(base/'commercial-batch-20261107-1-manifest.json').read_bytes()
          assert hashlib.sha256(oldraw).hexdigest()=='c1ca5c8191c56620a02b32800bfd69fb7eb3687a446e9bb919c808d182c70c44'
          old=json.loads(oldraw)
          proof=(tmp/'original-three-publication'/'channel-preflight.json').read_text().splitlines()
          receipt=json.loads(proof[-1]);assert receipt['ok'] and receipt['operation']=='commercial-hotel-batch-20261107-1-v1' and receipt['new_posts']==6 and receipt['reused']==0
          assert [r['hotel_id'] for r in new['rows']]==[27426,1216,1095]
          rows=[]
          for nr in new['rows']:
              previous=next(r for r in old['rows'] if r['hotel_id']==nr['hotel_id'])
              assert hashlib.sha256(nr['new_text'].encode()).hexdigest()==nr['new_text_sha256']
              assert 0<len(nr['new_text'].encode('utf-16-le'))//2<=1024 and nr['new_text']!=previous['text']
              rows.append({'hotel_id':nr['hotel_id'],'key':previous['logical_id'],'logical_id':previous['logical_id'],'old_text':previous['text'],'old_text_sha256':previous['text_sha256'],'new_text':nr['new_text'],'new_text_sha256':nr['new_text_sha256'],'photo_sha256':previous['photo_sha256'],'update_text':True})
          payload={'operation':'commercial-hotel-caption-correction-20261107-1-v1','button_text':'✈️ Узнать стоимость тура','update_kind':'caption_only','search_link_included':False,'rows':rows,'original_publication_result':receipt}
          raw=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode();(tmp/'caption-correction-input.json').write_bytes(raw)
          source=(base/'update-existing-three-captions-20261107-template.php').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='ad184d2cb3d42c88f2e51fec3ad9da44dbc0f883a841f547821d5c139d39745c'
          constants="\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst APPROVED_UPDATE_OPERATION='commercial-hotel-caption-correction-20261107-1-v1';\nconst APPROVED_MANIFEST_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\nconst MANIFEST_BASE64='"+base64.b64encode(raw).decode()+"';\n"
          assert source.count('declare(strict_types=1);')==1
          (tmp/'channel-preflight.php').write_text(source.replace('declare(strict_types=1);','declare(strict_types=1);'+constants,1))
          print(json.dumps({'operation':payload['operation'],'prepared_existing_posts':6,'new_sends':0,'server_calls':0,'copy_quality_user_accepted':False}))
          PYCODE
          php -l "$RUNNER_TEMP/channel-preflight.php"
      - name: Retain exact caption edit intent before provider access
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-caption-correction-20261107-1-inputs
          path: ${{ runner.temp }}/caption-correction-input.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Correct only captions on the same six messages and verify retained context
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json" || probe_status=$?
          python3 - <<'PY'
          import pathlib,json,os
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((tmp/'channel-preflight.json').read_text().splitlines()[-1])
          print(json.dumps({k:v for k,v in d.items() if k!='posts'},ensure_ascii=False,sort_keys=True))
          assert d['operation']=='commercial-hotel-caption-correction-20261107-1-v1' and d['mode']=='update_existing_hotel_captions_no_price_or_search'
          assert d['ok'] is True and len(d['posts'])==6 and d['post_write_attempts']==6 and d['new_posts_created']==0
          assert d['price_block_updates']==d['search_link_post_updates']==d['tour_search_calls']==d['price_queries']==0
          assert d['commercial_text_updates']==6 and d['configuration_write_attempts']==0
          source=json.loads((tmp/'caption-correction-input.json').read_text())
          prior={(p['platform'],p['logical_id']):p for p in source['original_publication_result']['posts']}
          rows={r['logical_id']:r for r in source['rows']}
          assert len({(p['platform'],p['logical_id']) for p in d['posts']})==6
          for p in d['posts']:
              old=prior[(p['platform'],p['logical_id'])]
              assert all(p[k]==old[k] for k in ('publication_id','message_id','post_url','button_url','source_key'))
              assert p['previous_version_id']==old['version_id'] and p['version_id']!=old['version_id']
              assert p['text_sha256']==rows[p['logical_id']]['new_text_sha256'] and p['body_photo_button_verified'] and p['existing_message_reused'] and p['content_updated']
          print('EXISTING_SIX_CAPTIONS_CORRECTED same_urls_photos_buttons_tokens=verified new_sends=0 feeds_changed=0 quality_user_accepted=false')
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-caption-correction-20261107-1-result
          path: ${{ runner.temp }}/channel-preflight.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and script files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json"

