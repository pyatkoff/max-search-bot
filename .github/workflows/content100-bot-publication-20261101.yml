        private="$RUNNER_TEMP/caption-repair-private"
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$private/reader.php" > "$RUNNER_TEMP/caption-repair-safe/final-snapshot.json" || status=$?
        python3 tools/direct_demand/operations/commercial-caption-repair-20261113-verify.py final "$status"
    - name: Retain original results and final public readback
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-caption-repair-20261113-result
        path: ${{ runner.temp }}/caption-repair-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and compiled private files
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/caption-repair-private" "$RUNNER_TEMP/channel_key"
        "$RUNNER_TEMP/channel_known_hosts"
