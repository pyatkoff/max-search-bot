name: Read new normal670 price inputs for157 published hotels
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 9678e8c617734dd3bd5054eabf3585e396e3ca12
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41870011689 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41870011689/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41895849007 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41895848933 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - name: Prepare immutable157scope30h reader without repeating closed pure cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path('tools/direct_demand/operations/read-commercial-price-monitor-20261104-read8.php').read_text()
          prefix="<?php\ndeclare(strict_types=1);\n"
          assert source.startswith(prefix)
          assert "count($scope)===157" in source
          assert "max(1793812524,$now-108000)" in source
          assert "LIMIT 2" in source and "'2026-11-04','2027-02-02'" in source
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read.php').write_text(header+source[len(prefix):])
          print('PRICE_READ8_EXACT_EXECUTION_INPUTS_OK scope157 max_age_seconds108000 new_source5399 old_scope_cases_rerun0 server_calls0')
          PY
          php -l "$RUNNER_TEMP/price-read.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read one bounded current157price scope through the existing strict server route
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/price-read.php" > "$RUNNER_TEMP/price-readback.json" || probe_status=$?
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'price-readback.json')
          d=json.loads(p.read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261104-read8' and d['mode']=='read_existing_monitored_price_inputs'
          assert d['ok'] is True and d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          assert len(d['hotels'])==157 and len({r['local_tv_id'] for r in d['hotels']})==157
          assert d['db_writes']==d['provider_calls']==d['message_sends']==d['price_block_updates']==0
          assert d['max_age_seconds']==108000 and d['source_collection_persistence_epoch_utc']==1793812524
          assert all(len(r['observations'])<=2 for r in d['hotels'])
          count=sum(len(r['observations']) for r in d['hotels'])
          hotels=sum(bool(r['observations']) for r in d['hotels'])
          summary={'operation':d['operation'],'ok':True,'scope_hotels':157,'hotels_with_retained_rows':hotels,'retained_rows':count,'eligible_current_name_hotels':sum(bool(r['observations']) and r.get('current_name_matches_expected') is True for r in d['hotels']),'readback_epoch_utc':d['readback_epoch_utc'],'created_after_persistence_epoch_utc':d['created_after_persistence_epoch_utc'],'max_age_seconds':108000,'db_writes':0,'provider_calls':0,'message_sends':0,'price_block_updates':0}
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read8-summary.json').write_text(json.dumps(summary)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded private price inputs only in authenticated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read8
          path: |
            ${{ runner.temp }}/price-readback.json
            ${{ runner.temp }}/price-read8-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and read scripts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/price-read.php" "$RUNNER_TEMP/price-readback.json" "$RUNNER_TEMP/price-read8-summary.json" "$RUNNER_TEMP/current-diagnostics-run.json"
