name: Read the interrupted collector journal and exact pending context once
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8d6ac35dd17614b2cadb3aa3af7637c74280c01c
  EXPECTED_DEPLOY_RUN_ID: '43456259794'
  EXPECTED_TLS_RUN_ID: '43458415792'
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify pinned existing reader and native PHP syntax before credentials
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 - <<'PARENT'
        import json,os,subprocess
        e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
        assert os.environ['GITHUB_EVENT_NAME']=='push' and e['before']=='01471cd5deaa150ddbb4719f2067b4a976c862d3'
        parents=[x.split(' ',1)[1] for x in subprocess.check_output(['git','cat-file','-p','HEAD'],text=True).splitlines() if x.startswith('parent ')]
        assert parents==['01471cd5deaa150ddbb4719f2067b4a976c862d3']
        PARENT
        mkdir -p "$RUNNER_TEMP/monitor-readiness-private" "$RUNNER_TEMP/monitor-readiness-safe"
        sha256sum -c <<'PINS'
        b1870e29b87658db8e1fa624df05212c791eb8c3fd88a99d28cb0595b9965a38  tools/direct_demand/operations/commercial-monitor-collector43461519720-readiness-20261113-v1.php
        44c5189a0209d7351ac887110b72a0c06af7974c990326e15056c0339ef6ec2f  tools/direct_demand/operations/commercial-monitor-collector43461519720-readiness-20261113-v1-plan.json
        176db2d3162758bd45b15062b47031e4729e3ddaf8aac12dc29de8f14ae9f2ca  tools/direct_demand/operations/commercial-caption-review73-20261113-verify-content-source.py
        5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb  tools/direct_demand/operations/verify-commercial-source.py
        PINS
        cp tools/direct_demand/operations/commercial-monitor-collector43461519720-readiness-20261113-v1.php "$RUNNER_TEMP/monitor-readiness-private/reader.php"
        cp tools/direct_demand/operations/commercial-monitor-collector43461519720-readiness-20261113-v1-plan.json "$RUNNER_TEMP/monitor-readiness-safe/plan.json"
        php -l "$RUNNER_TEMP/monitor-readiness-private/reader.php"
    - name: Verify installed CONTENT source and retain the failed release closure
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'SOURCE9'
        import json,os,pathlib,subprocess
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        gates=[(43456259794, '.github/workflows/deploy.yml', 'push'), (43458415792, '.github/workflows/max-tls-preflight.yml', 'workflow_run'), (43458412715, '.github/workflows/telegram-production-health.yml', 'workflow_run'), (43458412674, '.github/workflows/max-production-health.yml', 'workflow_run'), (43456259765, '.github/workflows/retired-domain-guard.yml', 'push'), (43458415744, '.github/workflows/publish-conversation-diagnostics.yml', 'workflow_run'), (43458412487, '.github/workflows/modeled-conversion-monitor.yml', 'workflow_run'), (43458412489, '.github/workflows/tour-selection-host.yml', 'workflow_run'), (43458412698, '.github/workflows/live-session-diagnostics.yml', 'workflow_run')]
        assert len(gates)==9 and len({x[0] for x in gates})==9
        for run_id,path,event in gates:
         r=json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control: no-cache',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))
         assert r['id']==run_id and r['run_attempt']==1 and r['head_sha']==expected
         assert r['head_branch']=='main' and r['path']==path and r['event']==event
         assert r['status']=='completed' and r['conclusion']=='success'
         if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43456259794:1'
         pathlib.Path(os.environ['RUNNER_TEMP'],f'commercial-source-gate-{run_id}.json').write_text(json.dumps(r))
        print('NINE_ACTUAL_CONTENT_SOURCE_GATES_SUCCESS_ATTEMPT1')
        SOURCE9
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -p "$evidence"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 - <<'PYPIN'
        import hashlib,pathlib
        assert hashlib.sha256(pathlib.Path('tools/direct_demand/operations/verify-commercial-source.py').read_bytes()).hexdigest()=='5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'
        PYPIN
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        python3 tools/direct_demand/operations/commercial-caption-review73-20261113-verify-content-source.py --evidence-dir "$evidence" --safe-dir "$RUNNER_TEMP/monitor-readiness-safe" --private-dir "$RUNNER_TEMP/monitor-readiness-private"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Read one existing global journal and its actual pending child without writes
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        set -euo pipefail
        umask 077
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/main > "$RUNNER_TEMP/monitor-readiness-private/main.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$RUNNER_TEMP/monitor-readiness-private/carrier.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30" > "$RUNNER_TEMP/monitor-readiness-private/active.json"
        gh api -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30" > "$RUNNER_TEMP/monitor-readiness-private/queued.json"
        gh api -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/issues/comments/6818332618 > "$RUNNER_TEMP/monitor-readiness-private/owner.json"
        python3 - <<'PY'
        import json,os,pathlib,hashlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-readiness-private')
        assert json.loads((p/'main.json').read_text())['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'carrier.json').read_text())['object']['sha']==os.environ['GITHUB_SHA']
        active=json.loads((p/'active.json').read_text());queued=json.loads((p/'queued.json').read_text())
        print(json.dumps({'admission':'before_monitor_journal_read','active_total':active['total_count'],'queued_total':queued['total_count'],'active':[{'id':r['id'],'status':r['status']} for r in active['workflow_runs']],'queued':[{'id':r['id'],'status':r['status']} for r in queued['workflow_runs']]},sort_keys=True))
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs'])
        assert queued['total_count']==0
        owner=json.loads((p/'owner.json').read_text());assert owner['id']==6818332618 and hashlib.sha256(owner['body'].encode()).hexdigest()=='90de12e3defd5f6d79c116d46f7f976e0ae6e6c84d1cd9e26a4d09658d6b2895'
        PY


        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/monitor-readiness-private/reader.php" > "$RUNNER_TEMP/monitor-readiness-safe/result.json" || status=$?
        python3 - "$status" <<'READ_RESULT'
        import hashlib,json,os,pathlib,sys
        safe=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-readiness-safe');raw=(safe/'result.json').read_bytes()
        transport={'operation':'commercial-monitor-collector43461519720-readiness-20261113-v1','ssh_status':int(sys.argv[1]),'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'head_sha':os.environ['GITHUB_SHA'],'expected_installed_sha':os.environ['EXPECTED_PRODUCTION_SHA'],'stdout_sha256':hashlib.sha256(raw).hexdigest(),'stdout_bytes':len(raw),'retry_authorized':False,'read_only':True,'feed_continuation_authorized':False}
        (safe/'transport.json').write_text(json.dumps(transport,indent=2)+'\n')
        try:r=json.loads(raw)
        except Exception:
         (safe/'read-status.json').write_text(json.dumps({'status':'UNKNOWN','reason':'no_valid_reader_json','feed_continuation_authorized':False})+'\n');raise SystemExit(2)
        assert r['operation']=='commercial-monitor-collector43461519720-readiness-20261113-v1' and r['feed_continuation_authorized'] is False
        assert all(r[k]==0 for k in ['db_write_attempts','journal_write_attempts','post_write_attempts','configuration_write_attempts','provider_write_attempts','feed_write_attempts'])
        native=r.get('native_max',{})
        if native:
         assert native.get('provider_gets',0)<=3
         for k in ['db_write_attempts','journal_write_attempts','post_write_attempts','provider_write_attempts','before_write_callback_calls']:assert native.get(k,0)==0
        status={'status':'READ_COMPLETE' if r.get('ok') is True and transport['ssh_status']==0 else 'READ_INCOMPLETE','global_lock_available':r.get('global_lock_available'),'global_pending_is_null':r.get('global_pending_is_null'),'pending':r.get('pending'),'nightly_cycle':r.get('nightly_cycle'),'child_disposition':r.get('child_disposition'),'native_confirmed':native.get('native_confirmed',False),'error':r.get('error'),'feed_continuation_authorized':False,'original_hook_outcome_not_relabelled':True}
        (safe/'read-status.json').write_text(json.dumps(status,indent=2)+'\n');print(json.dumps(status))
        assert r.get('ok') is True and transport['ssh_status']==0
        READ_RESULT
        test "$status" = 0
    - name: Preserve actual read and scoped source evidence including UNKNOWN
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-monitor-collector43461519720-readiness-20261113-v1-result
        path: ${{ runner.temp }}/monitor-readiness-safe
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and reader files
      if: always()
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/monitor-readiness-private/reader.php"
