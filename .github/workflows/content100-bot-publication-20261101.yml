name: Read eight exact official hotel factsheets
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare temporary public PDF text parser
        run: python3 -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/pdf-deps" 'pypdf>=5,<7'
      - name: Read only the eight exact public factsheets
        env:
          PYTHONPATH: ${{ runner.temp }}/pdf-deps
        run: python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain bounded public facts
        uses: actions/upload-artifact@v4
        with:
          name: commercial-batch12-facts-20261102-read1
          path: public-hotel-facts.json
          retention-days: 14
          if-no-files-found: error
