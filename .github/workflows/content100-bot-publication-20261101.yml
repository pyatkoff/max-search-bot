name: Inspect one newly declared Casa Cook gallery without provider or post access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  PRIMARY_SOURCE_INDEX_FILENAME: commercial-batch-20261105-54-source-index.json
  EXPECTED_PRIMARY_SOURCE_INDEX_SHA256: 21f045b224b72745fd1d753e5d5749ce5e73a9241e23be4677fc22795653572e
  EXPECTED_PRIMARY_NATIVE_SCOPE_SHA256: aaec42cca5a24be13995f589596074389d587603afda7100a9c771e742128241
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        media_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Check new scope and dedup metadata before one exact official gallery GET
        env:
          MEDIA_GROUP: ${{ matrix.media_group }}
        run: python3 tools/direct_demand/operations/inspect-hotel-primary-sources-20261105-batch54.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-batch54-primary-${{ matrix.media_group }}
          path: |
            public-media-sources.json
            public-media-sources-summary.json
          retention-days: 14
          if-no-files-found: warn
