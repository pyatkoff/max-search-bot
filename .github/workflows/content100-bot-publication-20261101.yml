name: Inspect the corrected Papillon Zeugma native preview with reset hero crop
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        media_group: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Read fixed official public sources without server or provider calls
        env:
          COVER_GROUP: ${{ matrix.media_group }}
        run: python3 tools/direct_demand/operations/inspect-canva-covers-20261105-49.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-batch49-native-cover-${{ matrix.media_group }}
          path: |
            covers
            native-cover-receipt.json
          retention-days: 14
          if-no-files-found: error
