name: Read nine exact legacy publication contexts without prices or provider calls
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 25a2d5e31aec7243b45c47e836a544e659e28b1d
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937182905 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41937182905/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963662 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963780 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read1-prepared
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41940690288
          path: ${{ runner.temp }}/legacy9-input
      - name: Bind exact frozen source roles without repeating closed role cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);p=list((temp/'legacy9-input').rglob('legacy9-approved-bindings.private.json'));assert len(p)==1
          raw=p[0].read_bytes();assert hashlib.sha256(raw).hexdigest()=='9bc8d10e1326522fb11fba91c79cd313ff61562b49bb6e8a6b67e995764c0bb4'
          d=json.loads(raw);assert len(d)==9 and {r['native_hotel_id'] for r in d}=={240,1981,46672,498,9373,469,381,310,1971}
          source=pathlib.Path('tools/direct_demand/operations/read-commercial-legacy9-price-contexts-20261105.php').read_text();assert hashlib.sha256(source.encode()).hexdigest()=='d586b05846c3bc8b69470815632acf30da7832302ce759f844fa71e937d69b00'
          prefix="<?php\ndeclare(strict_types=1);\n";assert source.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"+"const APPROVED_BINDINGS_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\n"+"const APPROVED_BINDINGS_B64='"+base64.b64encode(raw).decode()+"';\n"
          (temp/'legacy9-read.php').write_text(header+source[len(prefix):])
          print('LEGACY9_FROZEN_CANONICAL_READ_INPUT_OK scope9 source_roles_preserved old_role_cases_rerun0 server_calls0')
          PY
          php -l "$RUNNER_TEMP/legacy9-read.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only original confirmed receipts and current canonical contexts in read-only transactions
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          read_status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/legacy9-read.php" > "$RUNNER_TEMP/legacy9-readback.json" || read_status=$?
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);d=json.loads((temp/'legacy9-readback.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-legacy9-contexts-20261105-read1' and d['ok'] and d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          assert d['db_writes']==d['provider_calls']==d['gateway_calls']==d['message_sends']==d['price_edits']==0
          assert len(d['bindings'])+len(d['deferred'])==9 and all(set(r['contexts'])=={'telegram','max'} for r in d['bindings'])
          summary={'operation':d['operation'],'ok':True,'requested_hotels':9,'canonical_context_hotels':len(d['bindings']),'canonical_platform_contexts':sum(len(r['contexts']) for r in d['bindings']),'accepted_native_ids':[r['native_hotel_id'] for r in d['bindings']],'deferred':d['deferred'],'readback_epoch_utc':d['captured_epoch_utc'],'canonical_source_receipts_read':d['canonical_source_receipts_read'],'readonly_connection_mode':d['readonly_connection_mode'],'provider_calls':0,'gateway_calls':0,'db_writes':0,'price_edits':0}
          (temp/'legacy9-read-summary.json').write_text(json.dumps(summary)+'\n');print(json.dumps(summary))
          PY
          test "$read_status" = 0
      - name: Retain private canonical current bindings in the original authenticated result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-legacy9-contexts-20261105-read1
          path: |
            ${{ runner.temp }}/legacy9-readback.json
            ${{ runner.temp }}/legacy9-read-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and read files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/legacy9-read.php" "$RUNNER_TEMP/legacy9-readback.json"
