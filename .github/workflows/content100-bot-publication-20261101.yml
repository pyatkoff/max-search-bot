name: Validate new157 price scope and current30h persistence cutoff only
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Check new input scope and PHP without server or provider calls
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/validate-price-read8-scope-20261104.py
          php -l tools/direct_demand/operations/read-commercial-price-monitor-20261104-read8.php
          ANYTOUR_PRICE157_INPUT_FIXTURE=1 php tools/direct_demand/operations/read-commercial-price-monitor-20261104-read8.php
