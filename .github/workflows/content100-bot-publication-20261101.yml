name: Validate scoped AnyTour publication source admission
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 75ea095a60e52d43b9c664e16bd56430edcd7957
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the focused publication source admission boundaries without providers
        run: python3 tools/direct_demand/operations/verify-commercial-source.py --self-test
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41596474080 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41596474080/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41596474072 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"

