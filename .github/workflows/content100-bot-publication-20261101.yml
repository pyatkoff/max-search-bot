name: Validate corrected660 price roster without production operations
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '2bd06daaeed85325df1571291bdda53613cf4c71' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: db99af43e8ab11b3675fdbf7875da6e8ea6849ee
          path: previous-publisher
          persist-credentials: false
      - name: Authenticate unchanged628 callback and original binding-feed outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 2bd06daaeed85325df1571291bdda53613cf4c71
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(git hash-object tools/direct_demand/operations/prepare-remaining32-monitor-20261116.py)" = 1e54a7a5a12a1c5a3b6dc6acaf05d217beb3d717
          umask 077
          mkdir "$RUNNER_TEMP/monitor660"
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib,os
          p=pathlib.Path('tools/direct_demand/operations');old=pathlib.Path('previous-publisher')/p
          for name in ['monitor-price-contract.php','monitor-price-hook-contract.php','monitor-price-after-collection.php','update-commercial-price-20261104-remaining1.php','publish-commercial-channel-hotel-feeds-20261103-1.php','build-monitor-price-hook.py','monitor-price-expanded-roster-20261111.json.gz','test-monitor-price-hook.php','test-monitor-price-expansion20.php']:
            assert (p/name).read_bytes()==(old/name).read_bytes(),('CURRENT_CALLBACK_CHANGED',name)
          original=(p/'test-monitor-price-expansion20.php').read_text()
          bad="'monitor-price-expansion20-proof-20261116.json'";good="'/monitor-price-expansion20-proof-20261116.json'"
          assert original.count(bad)==0 and original.count(good)==1
          print('ORIGINAL_PATH_ANCHOR_FAILURE_REPRODUCED; CORRECT_SLASH_ANCHOR_UNIQUE')
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'monitor660'
          for tag,run_id,head,aid,digest in [('bound',43927951309,'785416481e95c39cf790a539fdd00d28cfc5da3b',14255918310,'7d1ae9812083058edf9ce65f8e63af28b98f2dabc1f44b878d4718aaf507960b'),('feed',43929964963,'116eebd0bdb09f16e340a9b13a60dc16f280697c',14257044679,'bb54b091d782b38e52395f43cba52a532119500c5cf3cb88ab473774cabbce34')]:
            def api(s):return subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+s],timeout=90)
            run=api('actions/runs/'+str(run_id));r=json.loads(run);assert r['id']==run_id and r['head_sha']==head and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
            meta=api('actions/artifacts/'+str(aid));a=json.loads(meta);assert a['id']==aid and not a['expired'] and a['workflow_run']['id']==run_id and a['digest']=='sha256:'+digest
            raw=api('actions/artifacts/'+str(aid)+'/zip');assert hashlib.sha256(raw).hexdigest()==digest
            (w/(tag+'.zip')).write_bytes(raw);(w/(tag+'-run.json')).write_bytes(run);(w/(tag+'-artifact.json')).write_bytes(meta)
          print('EXACT628_CALLBACK_AND_PUBLISHED_ROUTED_FED32_AUTHENTICATED')
          PY
      - name: Generate660 and run all original guards plus both expansion cohorts
        shell: bash
        run: |
          set -euo pipefail
          p=tools/direct_demand/operations;w="$RUNNER_TEMP/monitor660"
          php "$p/test-monitor-price-expansion20.php" | tee "$w/old628-cohort-original-test.txt"
          python3 "$p/prepare-remaining32-monitor-20261116.py" "$p" "$w/bound.zip" "$w/feed.zip" "$w/generated" | tee "$w/preparation.txt"
          cp "$w/generated/monitor-price-expanded-roster-20261111.json.gz" "$p/"
          cp "$w/generated/monitor-price-expansion32-proof-20261116.json" "$p/"
          cp "$w/generated/update-commercial-price-20261104-remaining1.php" "$p/"
          cp "$w/generated/test-monitor-price-expansion20.php" "$p/"
          cp "$w/generated/test-monitor-price-expansion32.php" "$p/"
          {
            php "$p/test-monitor-price-contract.php"
            php "$p/test-monitor-price-hook.php"
            php "$p/test-monitor-price-nightly-policy.php"
            php "$p/test-monitor-price-link.php"
            php "$p/test-monitor-price-expansion20.php"
            php "$p/test-monitor-price-expansion32.php"
            python3 "$p/build-monitor-price-hook.py" "$w/monitor-price-hook.php"
            php -l "$w/monitor-price-hook.php"
            git diff --check
          } | tee "$w/native-validation.txt"
      - name: Verify all compiled source pins against actual repository trees
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,base64,pathlib,os,subprocess
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'monitor660';s=(w/'monitor-price-hook.php').read_text()
          assert 'const HOOK_ROSTER_COUNT=660;' in s
          pins=json.loads(base64.b64decode(re.search(r'const HOOK_RUNTIME_PINS_B64="([^"]+)";',s)[1]));assert len(pins)==23
          assert pins['services/ChannelPostEntryService.php']=='1982ff7368763edf8b7238c3142e3cc28579e991' and pins['services/ChannelPostRegistryService.php']=='7304af19cc19666f00ca4ead1b04c2bdce719646'
          assert pins['services/ConversationRecordClock.php']=='8f1d5b9a4888174a0867408594a164fc776ddbe4'
          def api(s):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+s],timeout=60))
          current=api('git/ref/heads/main')['object']['sha'];proof=[]
          for source in dict.fromkeys(['ec72fcffa24ace22a997b642c33ea7fb6fb251d9',current]):
            commit=api('git/commits/'+source);tree=api('git/trees/'+commit['tree']['sha']+'?recursive=1');assert not tree.get('truncated')
            blobs={r['path']:r['sha'] for r in tree['tree'] if r['type']=='blob'}
            mismatches=[p for p,b in pins.items() if blobs.get(p)!=b];assert not mismatches,('RUNTIME_PIN_DRIFT',source,mismatches)
            proof.append({'source':source,'pins_verified':len(pins),'mismatches':mismatches})
          (w/'runtime-pin-proof.json').write_text(json.dumps({'ok':True,'tree_reads_only':True,'runtime_installation_claimed':False,'proof':proof},indent=2)+'\n')
          print('EXACT660_BUNDLE_AND_ALL23_RUNTIME_PINS_VERIFIED '+json.dumps(proof))
          PY
      - name: Retain generated immutable blobs without branch or server mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib,base64,os
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'monitor660';records=[]
          for name in ['monitor-price-expanded-roster-20261111.json.gz','monitor-price-expansion32-proof-20261116.json','update-commercial-price-20261104-remaining1.php','test-monitor-price-expansion20.php','test-monitor-price-expansion32.php']:
            raw=(w/'generated'/name).read_bytes();blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/pyatkoff/max-search-bot/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),timeout=60));assert result['sha']==blob
            records.append({'path':'tools/direct_demand/operations/'+name,'sha':blob,'mode':'100644','type':'blob','sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          output={'source_head':os.environ['GITHUB_SHA'],'base_callback':'db99af43e8ab11b3675fdbf7875da6e8ea6849ee','rows':660,'previous_rows_preserved':628,'new_pairs':32,'reviewed_runtime_pin_changes':2,'added_dependency_pins':1,'blobs':records,'branch_updates':0,'production_connections':0,'supplier_calls':0,'post_writes':0,'feed_writes':0}
          (w/'git-blobs.json').write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n');print('MONITOR660_SOURCE_READY='+json.dumps(output,separators=(',',':')))
          PY
      - name: Retain original evidence and tested candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-monitor660-prepared-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monitor660/generated/
            ${{ runner.temp }}/monitor660/*.json
            ${{ runner.temp }}/monitor660/*.txt
            ${{ runner.temp }}/monitor660/monitor-price-hook.php
          if-no-files-found: error
          retention-days: 30
