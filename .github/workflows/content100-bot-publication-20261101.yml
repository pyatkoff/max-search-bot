        START
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/feed-tail/write.php" > "$RUNNER_TEMP/feed-tail/writer-receipt.json" || feed_status=$?
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed-tail'
        d=json.loads((p/'writer-receipt.json').read_text().splitlines()[-1]);intent=json.loads((p/'write-intent.json').read_bytes())
        print(json.dumps(d,ensure_ascii=False,sort_keys=True))
        assert d['operation']==os.environ['FEED_OPERATION'] and d['mode']=='publish_three_static_public_direct_yml_feeds'
        assert d['ok'] is True and all(d[k]==0 for k in ('db_writes','provider_calls','message_sends'))
        assert len(d['files'])==3
        for actual,expected in zip(d['files'],intent['files']):
