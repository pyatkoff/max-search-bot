name: Complete existing32 binding read without repeating the proved first10
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '7ee4b8f3118f385c1fe3dfce174107d3486bddba' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: ec72fcffa24ace22a997b642c33ea7fb6fb251d9
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Recover original successful first group and exact unexecuted readers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 7ee4b8f3118f385c1fe3dfce174107d3486bddba
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SOURCE"
          umask 077
          w="$RUNNER_TEMP/bindings32";mkdir -p "$w"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14257152517/zip > "$RUNNER_TEMP/original-read.zip"
          python3 - <<'PY'
          import os,pathlib,json,hashlib,zipfile,re
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'bindings32';p=pathlib.Path(os.environ['RUNNER_TEMP'])/'original-read.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='6a367c25e54100d569a90fc46bca447fdeea4cb64b056c342ec6f0fee4bf965c'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None and sum(i.file_size for i in z.infolist())<40000000 and all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(w)
          r=json.loads((w/'22/bound-read.json').read_bytes());assert (w/'22/read-exit.txt').read_text().strip()=='0' and r['ok'] and r['scope_hotels']==10
          pub=json.loads((w/'22/publication.json').read_bytes());known={x['hotel_id']:x for x in pub['posts'] if x['platform']=='max'}
          for b in r['private_max_bindings']:
            p=known[b['hotel_id']];assert isinstance(b['publication_id'],str) and re.fullmatch('[1-9][0-9]*',b['publication_id']) and type(p['publication_id']) is int
            assert b['publication_id']==str(p['publication_id']) and b['version_id']==p['version_id'] and b['post_url']==p['post_url']
          for g in (23,24,25):assert not (w/str(g)/'bound-read.json').exists() and not (w/str(g)/'read-exit.txt').exists()
          intent=json.loads((w/'reader-intent.json').read_bytes());assert intent['source']==os.environ['EXPECTED_SOURCE'] and [g['group'] for g in intent['groups']]==[22,23,24,25]
          for g in intent['groups']:assert hashlib.sha256((w/str(g['group'])/'read.php').read_bytes()).hexdigest()==g['script_sha256']
          print('ORIGINAL_FIRST10_READ_RETAINED no_repeat=1 remaining_groups=3')
          PY
      - name: Prepare existing pinned server connection
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only groups23to25 and verify all original identities
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/bindings32"
          for group in 23 24 25; do
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SOURCE"
            test ! -e "$w/$group/bound-read.json"
            status=0
            ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && GIT_OPTIONAL_LOCKS=0 php' < "$w/$group/read.php" > "$w/$group/bound-read.json" || status=$?
            printf '%s\n' "$status" > "$w/$group/read-exit.txt"
            cat "$w/$group/bound-read.json"
            test "$status" = 0
          done
          python3 - <<'PY'
          import os,json,pathlib,re,hashlib
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'bindings32';summary=[]
          for group in (22,23,24,25):
            p=w/str(group);raw=(p/'bound-read.json').read_bytes();r=json.loads(raw);a=json.loads((p/'approval.json').read_bytes());pub=json.loads((p/'publication.json').read_bytes());ids=a['hotel_ids']
            assert r['ok'] and r['installed_sha']==os.environ['EXPECTED_SOURCE'] and r['scope_hotels']==r['feed_rows']==r['private_binding_count']==len(ids) and r['deferred_count']==0
            assert all(r[k]==0 for k in ['db_writes','provider_calls','message_sends']) and (p/'read-exit.txt').read_text().strip()=='0'
            assert [x['hotel_id'] for x in r['rows']]==[x['hotel_id'] for x in r['private_max_bindings']]==ids
            for row,b in zip(r['rows'],r['private_max_bindings']):
              posts={x['platform']:x for x in pub['posts'] if x['hotel_id']==row['hotel_id']}
              assert row['max_post_url']==b['post_url']==posts['max']['post_url'] and row['telegram_post_url']==posts['telegram']['post_url']
              assert isinstance(b['publication_id'],str) and re.fullmatch('[1-9][0-9]*',b['publication_id']) and type(posts['max']['publication_id']) is int
              assert b['publication_id']==str(posts['max']['publication_id']) and b['version_id']==posts['max']['version_id']
            summary.append({'group':group,'hotel_ids':ids,'read_sha256':hashlib.sha256(raw).hexdigest(),'read_at_utc':r['read_at_utc']})
          result={'ok':True,'hotels':32,'original_first10_run':43927604117,'groups':summary,'new_post_sends':0,'db_writes':0,'feed_writes':0,'supplier_calls':0}
          (w/'summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n');print('ALL32_BINDINGS_CONFIRMED='+json.dumps(result))
          PY
      - name: Retain completed bounded evidence without replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-complete-bindings-${{ github.run_id }}
          path: ${{ runner.temp }}/bindings32/
          retention-days: 30
          if-no-files-found: error
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
