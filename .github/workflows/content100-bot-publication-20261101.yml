name: Read existing price scheduler and installed module
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '94442c26b6cbbd9120bbbf8e33aba7bb96de05f1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Validate bounded read-only source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 94442c26b6cbbd9120bbbf8e33aba7bb96de05f1
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          echo '09a497d9e816b574ca0868f75c0512fef0d5cf8355ec480b1005ef0772ea38eb  tools/direct_demand/operations/inspect-monitor660-readiness-20261116.php' | sha256sum --check
          php -l tools/direct_demand/operations/inspect-monitor660-readiness-20261116.php
          umask 077
          mkdir "$RUNNER_TEMP/monitor660-readiness"
      - name: Read existing workflow status and actual recent runs without dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess
          root='repos/pyatkoff/poisk-turov-test/'
          requests={'workflow':root+'actions/workflows/346454799','scheduled':root+'actions/workflows/346454799/runs?event=schedule&per_page=8','latest':root+'actions/workflows/346454799/runs?per_page=8','main':root+'git/ref/heads/main'}
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'GET_only_existing_workflow','requests':0,'workflow_mutations':0,'dispatches':0,'results':{}}
          for label,url in requests.items():
            result=subprocess.run(['gh','api','--method','GET',url],capture_output=True,text=True,timeout=30);report['requests']+=1
            if result.returncode!=0:
              report['results'][label]={'read_ok':False,'exit_code':result.returncode};continue
            data=json.loads(result.stdout)
            if label=='workflow':value={k:data.get(k) for k in ['id','name','path','state','created_at','updated_at']}
            elif label=='main':value={'ref':data.get('ref'),'sha':data.get('object',{}).get('sha')}
            else:value={'total_count':data.get('total_count'),'runs':[{k:r.get(k) for k in ['id','head_sha','head_branch','event','status','conclusion','created_at','run_started_at','updated_at','run_attempt']} for r in data.get('workflow_runs',[])]}
            report['results'][label]={'read_ok':True,**value}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'monitor660-readiness/scheduler.json';out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('EXISTING_SCHEDULER_READ='+json.dumps(report,separators=(',',':')))
          PY
      - name: Prepare existing server connection with retained host pin
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Inspect installed bundle and final journal state once
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          result="$RUNNER_TEMP/monitor660-readiness/runtime.json"
          status=0
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; GIT_OPTIONAL_LOCKS=0 php' < tools/direct_demand/operations/inspect-monitor660-readiness-20261116.php > "$result" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/monitor660-readiness/exit-code.txt"
          cat "$result"
          exit "$status"
      - name: Retain bounded observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monitor660-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/monitor660-readiness/
          retention-days: 14
          if-no-files-found: error
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
