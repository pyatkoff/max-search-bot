        \ > \"$evidence/source_tree.json\"\npython3 tools/direct_demand/operations/verify-commercial-source.py --expected-source\
        \ \"$EXPECTED_PRODUCTION_SHA\" --evidence-dir \"$evidence\"\npython3 - <<'PY'\nimport json,os,pathlib\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');jobs=json.loads((p/'verify_jobs.json').read_text())['jobs']\n\
        assert len(jobs)==6 and all(j['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and j['status']=='completed'\
        \ and j['conclusion']=='success' for j in jobs)\nPY\ncp \"$evidence/gate-receipts.json\" \"$RUNNER_TEMP/feed-tail/source-gate-receipts.json\"\
        \npython3 - <<'BOUNDGATES'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed-tail';source=json.loads((p/'source.json').read_bytes())\n\
        actual=json.loads((p/'source-gate-receipts.json').read_bytes())\nassert actual==source['current_source_acceptance']['source_gates'],'actual\
