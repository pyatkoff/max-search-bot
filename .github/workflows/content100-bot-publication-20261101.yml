name: Read only previously unread retained price intervals before considering manual collection
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 25a2d5e31aec7243b45c47e836a544e659e28b1d
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          evidence="$RUNNER_TEMP/commercial-source-evidence"
          mkdir -p "$evidence"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937182905 > "$evidence/verify_run.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs/41937182905/jobs?per_page=20" > "$evidence/verify_jobs.json"
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963662 > "$evidence/tls_run.json"
          gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
          tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
          gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
          python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
      - name: Require successful current-source production diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/max-search-bot/actions/runs/41937963780 > "$RUNNER_TEMP/current-diagnostics-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'current-diagnostics-run.json').read_text())
          assert d['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and d['path']=='.github/workflows/publish-conversation-diagnostics.yml'
          assert d['status']=='completed' and d['conclusion']=='success'
          print('CURRENT_PRODUCTION_DIAGNOSTICS_HEALTH_OK server_calls=0')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read9
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41898354901
          path: ${{ runner.temp }}/original-read9-exclusions
      - name: Bind the proven unread intervals and exclude prior observation IDs without reusing quotes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);base=pathlib.Path('tools/direct_demand/operations')
          paths=list((temp/'original-read9-exclusions').rglob('price-readback.json'));assert len(paths)==1
          d=json.loads(paths[0].read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261104-read9' and d['ok'] and len(d['hotels'])==157 and d['installed_sha']=='9678e8c617734dd3bd5054eabf3585e396e3ca12'
          ids=sorted(int(r['observation_id']) for h in d['hotels'] for r in h['observations'])
          assert len(ids)==len(set(ids))==16 and min(ids)>0
          raw=(json.dumps(ids,separators=(',',':'))+'\n').encode()
          (temp/'prior-read9-observation-exclusions.private.json').write_bytes(raw)
          source=(base/'read-commercial-price-monitor-20261105-read12-unread-interval1.php').read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='db2db6f63e26cb0f199ad0f68d2ab23b7edbea2e68724181e6ef2598b5867e08'
          original=(base/'read-commercial-price-monitor-20261105-read11-new672.php').read_text()
          def scope(s):
           a="$scope=json_decode(<<<'_ANYTOUR_PRICE157_SCOPE_'";b="_ANYTOUR_PRICE157_SCOPE_,true,512,JSON_THROW_ON_ERROR);"
           return s[s.index(a):s.index(b)+len(b)]
          assert scope(source)==scope(original)
          prefix="<?php\ndeclare(strict_types=1);\n";assert source.startswith(prefix)
          header=prefix+"const EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\n"
          header+="const PRIOR_READ9_OBSERVATION_IDS_B64='"+base64.b64encode(raw).decode()+"';\n"
          header+="const PRIOR_READ9_OBSERVATION_IDS_SHA256='"+hashlib.sha256(raw).hexdigest()+"';\n"
          (temp/'price-read.php').write_text(header+source[len(prefix):])
          summary={'operation':'commercial-price-monitor-20261105-read12-unread-interval1','scope159_prefix_unchanged':True,'typed15_preserved':True,'prior_observation_ids_excluded':len(ids),'original_read9_source_preserved':'9678e8c617734dd3bd5054eabf3585e396e3ca12','old157_scheduled_lower':1793820511,'old157_user_hot_lower':1793820951,'new2_lower':1793835214,'exclusive_upper':1793835598,'provider_calls':0,'db_calls':0}
          (temp/'read12-input-binding-summary.json').write_text(json.dumps(summary)+'\n');print(json.dumps(summary))
          PY
          php -l "$RUNNER_TEMP/price-read.php"
          ANYTOUR_PRICE12_NEW_INTERVAL_FIXTURE=1 php "$RUNNER_TEMP/price-read.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read only new unread intervals with prior rows and already priced hotels excluded
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/price-read.php" > "$RUNNER_TEMP/price-readback.json" || probe_status=$?
          python3 - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'price-readback.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261105-read12-unread-interval1' and d['ok'] and d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
          assert len(d['hotels'])==159 and d['max_age_seconds']==259200 and d['unread_interval_exclusive_upper_epoch_utc']==1793835598
          assert d['db_writes']==d['provider_calls']==d['message_sends']==d['price_block_updates']==0 and d['prior_read9_observation_ids_excluded_count']==16
          prior=set(json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'prior-read9-observation-exclusions.private.json').read_text()))
          priced=set(d['coverage_excluded_already_priced_native_ids']);assert len(priced)==32
          for h in d['hotels']:
           assert len(h['observations'])<=2
           for r in h['observations']:
            assert h['local_tv_id'] not in priced and int(r['observation_id']) not in prior
            lower=d['new2_all_sources_lower_epoch_utc'] if h['local_tv_id'] in (17480,1100) else (d['old157_scheduled_lower_epoch_utc'] if r['retained_source']=='scheduled_monitor' else d['old157_user_hot_lower_epoch_utc'])
            assert lower<=int(r['created_at_stored_epoch_utc'])<1793835598 and r['departure_date']>='2026-11-06'
          summary={'operation':d['operation'],'ok':True,'scope_hotels':159,'new_retained_rows':sum(len(h['observations']) for h in d['hotels']),'new_native_hotel_ids':[h['local_tv_id'] for h in d['hotels'] if h['observations']],'old157_scheduled_lower_epoch_utc':d['old157_scheduled_lower_epoch_utc'],'old157_user_hot_lower_epoch_utc':d['old157_user_hot_lower_epoch_utc'],'new2_lower_epoch_utc':d['new2_all_sources_lower_epoch_utc'],'exclusive_upper_epoch_utc':1793835598,'prior_observation_ids_excluded':16,'priced_hotels_excluded':32,'readback_epoch_utc':d['readback_epoch_utc'],'db_writes':0,'provider_calls':0,'price_block_updates':0}
          pathlib.Path(os.environ['RUNNER_TEMP'],'price-read12-summary.json').write_text(json.dumps(summary)+'\n');print(json.dumps(summary,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded private price inputs only in authenticated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261105-read12-unread-interval1
          path: |
            ${{ runner.temp }}/price-readback.json
            ${{ runner.temp }}/price-read12-summary.json
            ${{ runner.temp }}/read12-input-binding-summary.json
            ${{ runner.temp }}/prior-read9-observation-exclusions.private.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral connection and read scripts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/price-read.php" "$RUNNER_TEMP/price-readback.json" "$RUNNER_TEMP/price-read12-summary.json" "$RUNNER_TEMP/current-diagnostics-run.json"
