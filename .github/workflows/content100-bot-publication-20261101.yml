name: Inspect two exact newly declared JAZ Maraya photos without provider access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  CONTACT_SOURCE_INDEX_FILENAME: commercial-batch-20261105-56-contact-source-index.json
  EXPECTED_CONTACT_SOURCE_INDEX_SHA256: 808ecb5a8273a9d934047a6c31f212081c0faf6e967a861b1002af30963487b4
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Validate new declared photo inputs before bounded raw GETs
        env:
          MEDIA_GROUP: '0'
        run: python3 tools/direct_demand/operations/inspect-hotel-primary-images-20261105-batch56.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-batch56-contact-0
          path: |
            primary-image-inspection.json
            contact.png
            accepted-primary-raw
          retention-days: 14
          if-no-files-found: warn
