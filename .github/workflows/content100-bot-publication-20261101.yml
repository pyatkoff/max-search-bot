name: Validate original context metadata failure offline and prepare next noquote hotel links
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 1fec9202b45a8e1a6343750a8896a6e5072e1880
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context18-ten2
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42012518360
          path: ${{ runner.temp }}/original-context18
      - name: Recover only exact immutable public original reader and preparer for final metadata proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/read-hotel-search-links-current-contexts-20261105-context18.php?ref=182d52db6fd9538221440506380f7ea3ce1cb564" > "$RUNNER_TEMP/context18-original-reader.json"
          gh api "repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/prepare-hotel-search-links-current-contexts-20261105-context18.py?ref=182d52db6fd9538221440506380f7ea3ce1cb564" > "$RUNNER_TEMP/context18-original-preparer.json"
      - name: Prove exact original final metadata error without any server or provider read replay
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          php -l tools/direct_demand/operations/check-context18-original-final-metadata-20261105.php
          php tools/direct_demand/operations/check-context18-original-final-metadata-20261105.php "$RUNNER_TEMP/original-context18/context18-input.private.json" "$RUNNER_TEMP/context18-final-metadata-native-proof.private.json"
          python3 -m py_compile tools/direct_demand/operations/validate-context18-original-final-metadata-20261105.py
          python3 tools/direct_demand/operations/validate-context18-original-final-metadata-20261105.py
      - name: Prepare only admitted original noquote contexts and run three new data-bound cases each
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m py_compile tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-ten2.py
          python3 tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-ten2.py
          for file in "$RUNNER_TEMP"/hotel-search-links-ten2/*/update.php; do
            php -l "$file"
            ANYTOUR_SEARCH_LINK18_NEW_SCOPE_CASES=1 php "$file"
          done
      - name: Retain original failed-readback provenance separately from admitted private bindings and frozen updates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-ten2-prepared1
          path: |
            ${{ runner.temp }}/hotel-search-links-ten2
            ${{ runner.temp }}/context18-admitted-bindings.private.json
            ${{ runner.temp }}/context18-offline-proof-safe.json
            ${{ runner.temp }}/context18-final-metadata-native-proof.private.json
          retention-days: 14
          if-no-files-found: warn
