name: Project ten original prior price manifests for new search links without provider access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-2-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41792503183
          path: ${{ runner.temp }}/prior2
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-3-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41900165853
          path: ${{ runner.temp }}/prior3
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-4-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41906507292
          path: ${{ runner.temp }}/prior4
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-5-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41916096810
          path: ${{ runner.temp }}/prior5
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-6-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41919613567
          path: ${{ runner.temp }}/prior6
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-8-intent
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41926364313
          path: ${{ runner.temp }}/prior8
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261104-72h-pass1-prepared
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41936372259
          path: ${{ runner.temp }}/prior19
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-72h-extension1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41934633857
          path: ${{ runner.temp }}/identity10
      - name: Project only declared ten native identities and original intent manifests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/project-priced-hotel-search-link-original-manifests-20261105.py
          python3 tools/direct_demand/operations/project-priced-hotel-search-link-original-manifests-20261105.py
      - name: Retain exact private projected original inputs and safe summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-priced10-original-projection1
          path: |
            ${{ runner.temp }}/priced-original-input.private.json
            ${{ runner.temp }}/priced-original-summary.json
          retention-days: 14
          if-no-files-found: warn
