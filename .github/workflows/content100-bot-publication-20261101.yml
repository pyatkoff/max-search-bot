name: Bind actual approved search inputs and exact existing hotel search links offline
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-source-refresh-20261105-pass1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41976677950
          path: ${{ runner.temp }}/actual-source
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read9
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41898354901
          path: ${{ runner.temp }}/old-read9
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read10-72h-extension1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41934633857
          path: ${{ runner.temp }}/old-read10
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41932708020
          path: ${{ runner.temp }}/original-xml
      - name: Project only new fingerprints and exact original public search URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/project-approved-price-source-and-search-links-20261105.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-refresh-20261105-pass1-offline-input-and-search-links1
          path: |
            ${{ runner.temp }}/approved-source-new-scope.private.json
            ${{ runner.temp }}/existing-feed-hotel-search-links.public.json
            ${{ runner.temp }}/source-projection-summary.json
          retention-days: 14
          if-no-files-found: error
