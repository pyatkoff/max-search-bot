name: Project six new legacy price manifests and explicit original publisher roles offline
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  LINK_PROJECTION_PLAN_FILENAME: commercial-hotel-search-links-20261105-legacy6-input-projection1-plan.json
  EXPECTED_LINK_PROJECTION_PLAN_SHA256: 30a45b80c73857d65a145a2588fde0edde6b2c23154f92dea9cd2d40f076893e
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-update-20261105-legacy9-pass1-intents
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41945166136
          path: ${{ runner.temp }}/legacy-original-intents
      - name: Project only six original preprovider inputs and exercise new actual role bindings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/project-legacy-priced-hotel-inline-inputs-20261105.py
          python3 tools/direct_demand/operations/project-legacy-priced-hotel-inline-inputs-20261105.py
      - name: Retain exact private projected inputs and safe counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-legacy6-input-projection1
          path: |
            ${{ runner.temp }}/priced-original-input.private.json
            ${{ runner.temp }}/priced-original-summary.json
          retention-days: 14
          if-no-files-found: warn
