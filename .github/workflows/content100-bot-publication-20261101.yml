name: Complete exact reliability660 source checks without production
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'f5aec3bcdb823d04b8e8f9556648413ecf93868c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c6e6b7fc57d599ae7fcf8bba4aed1ed3315a00b0
          path: source-pr
          persist-credentials: false
          fetch-depth: 5
      - name: Complete original source integration with all eight original suites and expansion32
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = f5aec3bcdb823d04b8e8f9556648413ecf93868c
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,os
          original=subprocess.check_output(['git','show','f5aec3bcdb823d04b8e8f9556648413ecf93868c:.github/workflows/content100-bot-publication-20261101.yml'])
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='c44acc7e7bad0cd1bc2596c89e2ac2bdd66b697f'
          steps={}
          for chunk in original.decode().split('      - name: ')[1:]:
            name=chunk.split('\n',1)[0]
            marker='        run: |\n'
            if marker not in chunk:continue
            lines=[]
            for line in chunk.split(marker,1)[1].splitlines():
              if line and not line.startswith('          '):break
              lines.append(line[10:] if line.startswith('          ') else '')
            steps[name]='\n'.join(lines)+'\n'
          names=['Integrate only the original reliability scope and preserve current660','Run original reliability checks and both admitted expansion cohorts','Retain tested source tree without moving branches or installing code']
          assert set(steps)==set(names)
          first=steps[names[0]]
          assert first.count('fbcec3b211c0b0910fd41ff1678d609d402baa18')==1
          first=first.replace('fbcec3b211c0b0910fd41ff1678d609d402baa18','f5aec3bcdb823d04b8e8f9556648413ecf93868c',1)
          old=r'(test-monitor-price-[a-z0-9-]+\.php)';new=r'((?:test-monitor-price-[a-z0-9-]+|test-reconcile-stale-feed-20261116)\.php)'
          assert first.count(old)==1 and first.count('assert len(tests)>=8')==1
          first=first.replace(old,new,1).replace('assert len(tests)>=8','assert len(tests)==8',1)
          steps[names[0]]=first
          for index,name in enumerate(names,1):
            path=pathlib.Path(os.environ['RUNNER_TEMP'])/('reliability660-step-'+str(index)+'.sh')
            path.write_text(steps[name]);subprocess.run(['bash','-n',str(path)],check=True)
            print('BEGIN_EXACT_SOURCE_STAGE '+name,flush=True)
            subprocess.run(['bash',str(path)],check=True,timeout=360)
          PY
      - name: Preserve exact integration and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliability660-compatible-source-${{ github.run_id }}
          path: ${{ runner.temp }}/reliability660/
          retention-days: 30
          if-no-files-found: error
