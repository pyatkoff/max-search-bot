name: Read only four already-sent hotel pairs; original failed wrapper retained
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_DEPLOY_RUN_ID: '43350270066'
  EXPECTED_TLS_RUN_ID: '43351917787'
  EXPECTED_PRODUCTION_SHA: 77dfb182148d9df9903e8e21fb8f29e986d4fd5f
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Authenticate eight original sent posts without relabeling failed run
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        python3 - <<''VERIFY''

        import subprocess,json,pathlib,hashlib,zipfile,io,os

        r=json.loads(subprocess.check_output([''gh'',''api'',''repos/pyatkoff/max-search-bot/actions/runs/43358127823'']))

        assert r[''run_attempt'']==1 and r[''status'']==''completed'' and r[''conclusion'']==''failure'' and r[''head_sha'']==''1386463de6c28f5f27985717f2363c7ff35135d0''

        a=json.loads(subprocess.check_output([''gh'',''api'',''repos/pyatkoff/max-search-bot/actions/runs/43358127823/artifacts?per_page=100'']));assert
        a[''total_count'']==2

        x=next(x for x in a[''artifacts''] if x[''id'']==14006987622);assert x[''digest'']==''sha256:63f47c14306a666d914ef0b40dbbbe64d8b2f640e4f0eda634febb83e69a5b63''
        and not x[''expired'']

        raw=subprocess.check_output([''gh'',''api'',''repos/pyatkoff/max-search-bot/actions/artifacts/14006987622/zip'']);assert
        hashlib.sha256(raw).hexdigest()==x[''digest''][7:]

        z=zipfile.ZipFile(io.BytesIO(raw));receipt=z.read(''channel-preflight.json'');d=json.loads(receipt.splitlines()[-1]);assert
        hashlib.sha256(receipt.splitlines()[-1]).hexdigest()==''0510d0536d3aa00d7d719b13ad3b64ab0f2344a14ac98f808babd35e648f27b3''

        assert d[''ok''] and d[''operation'']==''commercial-hotel-batch-20261113-10-v1'' and d[''new_posts'']==d[''post_write_attempts'']==len(d[''posts''])==8
        and d[''reused'']==0

        assert {(x[''hotel_id''],x[''platform'']) for x in d[''posts'']}=={(i,c) for i in [1330,983,497,231] for
        c in [''max'',''telegram'']}

        assert all(x[''state'']==''sent'' and x[''body_photo_button_verified''] for x in d[''posts''])

        pathlib.Path(os.environ[''RUNNER_TEMP''],''channel-preflight.json'').write_bytes(receipt)

        pathlib.Path(os.environ[''RUNNER_TEMP''],''original-send-provenance.json'').write_text(json.dumps({''original_run'':r[''id''],''original_attempt'':1,''original_run_conclusion'':r[''conclusion''],''original_head'':r[''head_sha''],''artifact_id'':x[''id''],''zip_sha256'':x[''digest''][7:],''receipt_terminal_sha256'':hashlib.sha256(receipt.splitlines()[-1]).hexdigest(),''original_verified_new_posts'':8,''this_run_new_posts'':0}))

        print(''ACTUAL_EIGHT_SENT_RECEIPTS_AUTHENTICATED reader_only=1 sends_in_this_run=0'')

        VERIFY

        '
    - name: Verify exact reviewed publishing conditions independently of unrelated aggregate jobs
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        evidence="$RUNNER_TEMP/commercial-source-evidence"

        mkdir -p "$evidence"

        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID" > "$evidence/verify_run.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20" > "$evidence/verify_jobs.json"

        gh api "repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID" > "$evidence/tls_run.json"

        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"

        tree_sha="$(python3 -c ''import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])'' "$evidence/source_commit.json")"

        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"

        python3 - <<''PYPIN''

        import hashlib,pathlib

        assert hashlib.sha256(pathlib.Path(''tools/direct_demand/operations/verify-commercial-source.py'').read_bytes()).hexdigest()==''5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb''

        PYPIN

        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA"
        --evidence-dir "$evidence"

        '
    - name: Prepare and validate the exact sender and bounded read
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_RUN_ATTEMPT" = 1

        umask 077

        python3 - <<''PY''

        import hashlib,json,os,pathlib

        base=pathlib.Path(''tools/direct_demand/operations'')

        assert hashlib.sha256((base/''prepare-commercial-batch.py'').read_bytes()).hexdigest()==''b3b46889004a992351f681032400dc6da04a36b756a27ba54af41275cc531f1d''

        pins={''prepare-publication-tail.py'': ''6db0ef9d8bb51d897387140c6f5c1d9e5b68bc33ffff41c9cea98621c927c4b8''}

        for name,sha in pins.items():assert hashlib.sha256((base/name).read_bytes()).hexdigest()==sha,name

        approval=json.loads((base/''commercial-batch-20261113-10-approval.json'').read_text())

        assert approval[''expected_installed_sha'']==os.environ[''EXPECTED_PRODUCTION_SHA'']

        assert approval[''operation'']==''commercial-hotel-batch-20261113-10-v1'' and approval[''hotel_ids'']==[1330,983,497,231]

        PY

        python3 tools/direct_demand/operations/prepare-publication-tail.py reader --manifest tools/direct_demand/operations/commercial-batch-20261113-10-manifest.json
        --approval tools/direct_demand/operations/commercial-batch-20261113-10-approval.json --reader-template tools/direct_demand/operations/read-commercial-channel-hotel-feeds-20261108-48.php
        --reader-operation commercial-channel-hotel-feeds-20261113-read10 --output "$RUNNER_TEMP/channel-feed-read.php"

        php -l "$RUNNER_TEMP/channel-feed-read.php"

        ANYTOUR_CHANNEL_BATCH51_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-feed-read.php"

        '
    - name: Retain exact approved inputs before any channel write
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261113-10-inputs
        path: 'tools/direct_demand/operations/commercial-batch-20261113-10-manifest.json

          tools/direct_demand/operations/commercial-batch-20261113-10-approval.json

          '
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"$raw\" == *\"PRIVATE KEY\"* ]];\
        \ then\n  if [[ \"$raw\" == *'\\n'* ]]; then printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"\
        ; else printf '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse\n  printf '%s' \"\
        $raw\" | base64 --decode > \"$RUNNER_TEMP/channel_key\"\nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\"\
        \ >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\nhost=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\n\
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\n\
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\n\
        matches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n  if len(fields)<3 or fields[0].startswith('#'):continue\n\
        \  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n\
        \  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\n\
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(matches)+'\\n')\nPY\n"
    - name: Read only the confirmed canonical pairs and native MAX bindings
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\nssh -i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes -o ConnectTimeout=10\
        \ -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"\
        $RUNNER_TEMP/channel_known_hosts\" \"$DEPLOY_USER@$DEPLOY_HOST\" \"set -e; cd /var/www/anytoour/data/www/app.anytoour.ru;\
        \ php\" < \"$RUNNER_TEMP/channel-feed-read.php\" > \"$RUNNER_TEMP/channel-feed-read.json\" || read_status=$?\n\
        python3 - <<'PYREAD'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])\nreceipt=json.loads((p/'channel-preflight.json').read_text().splitlines()[-1])\n\
        d=json.loads((p/'channel-feed-read.json').read_text().splitlines()[-1])\nids=[1330,983,497,231]\nassert\
        \ d['ok'] is True and d['operation']=='commercial-channel-hotel-feeds-20261113-read10'\nassert d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']\n\
        assert d['scope_hotels']==d['feed_rows']==d['private_binding_count']==4 and d['deferred_count']==0\nassert\
        \ [r['hotel_id'] for r in d['rows']]==[r['hotel_id'] for r in d['private_max_bindings']]==ids\nassert all(d[k]==0\
        \ for k in ('db_writes','provider_calls','message_sends'))\nby_pair={(r['hotel_id'],r['platform']):r for\
        \ r in receipt['posts']}\nfor r,b in zip(d['rows'],d['private_max_bindings']):\n  for platform in ('telegram','max'):assert\
        \ r[platform+'_post_url']==by_pair[(r['hotel_id'],platform)]['post_url']\n  assert str(b['publication_id'])==str(by_pair[(r['hotel_id'],'max')]['publication_id'])\n\
        print(json.dumps({k:d[k] for k in ('operation','ok','scope_hotels','feed_rows','private_binding_count','deferred_count','provider_calls','db_writes','message_sends')}))\n\
        PYREAD\ntest \"${read_status:-0}\" = 0\n"
    - name: Retain bounded route evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261113-10-read-only-after-verified-send
        path: '${{ runner.temp }}/channel-preflight.json

          ${{ runner.temp }}/channel-feed-read.json


          ${{ runner.temp }}/original-send-provenance.json'
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and script files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php"
        "$RUNNER_TEMP/channel-preflight.json" "$RUNNER_TEMP/channel-feed-read.php" "$RUNNER_TEMP/channel-feed-read.json"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
