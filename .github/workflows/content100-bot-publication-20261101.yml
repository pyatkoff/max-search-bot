name: Read existing public native meal catalog
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read one fixed public native dictionary without tour searches
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          url='https://anytoour.ru/api-v2.php?action=meals'
          assert urllib.parse.urlsplit(url).netloc=='anytoour.ru'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise ValueError('unexpected_redirect')
          out={'operation':'commercial-price-monitor-20261102-native-meals-read1','mode':'read_existing_public_native_meal_catalog','tour_searches':0,'message_edits':0,'server_connections':0,'ok':False}
          try:
           with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'AnyTour public catalog inspection'}),timeout=30) as r:
            raw=r.read(100001);assert r.status==200 and len(raw)<=100000
            out['http_status']=r.status
           d=json.loads(raw)
           candidates=[]
           def visit(v,depth=0):
            if depth>3:return
            if isinstance(v,list):
             rows=[x for x in v if isinstance(x,dict) and isinstance(x.get('id'),(int,str)) and any(isinstance(x.get(k),str) for k in ('name','russianName','code'))]
             if rows and len(rows)==len(v) and len(rows)<=200:candidates.append(rows)
            elif isinstance(v,dict):
             for key in ('data','items','meals','results','result'):
              if key in v:visit(v[key],depth+1)
           visit(d)
           assert len(candidates)==1,'unrecognized_catalog_shape'
           out['meals']=[{k:v for k,v in row.items() if k in ('id','name','russianName','code') and isinstance(v,(int,str)) and len(str(v))<=200} for row in candidates[0]]
           out['ok']=True
          except Exception as e:
           out['error']=type(e).__name__
           if hasattr(e,'code'):out['http_status']=e.code
          print(json.dumps(out,ensure_ascii=False))
          open('public-native-meals-receipt.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Retain bounded public catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-native-meals-20261102-read1
          path: public-native-meals-receipt.json
          retention-days: 14
          if-no-files-found: error
