name: Append routed remaining32 to three existing feeds
on:
  push:
    branches: ['audit/content100-bot-publication-20261101']
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '10307c74bf01b7c09642d7a75a36f94e7562bd56' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE: ec72fcffa24ace22a997b642c33ea7fb6fb251d9
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate unchanged adapter and confirmed current bindings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 10307c74bf01b7c09642d7a75a36f94e7562bd56
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
          p=tools/direct_demand/operations
          test "$(git hash-object "$p/prepare-remaining32-feed-tail-20261116.py")" = 6f4c7550b257d836a95f154bae2758cf073d668c
          test "$(git hash-object "$p/prepare-publication-tail.py")" = 83af97a1a54e3ee3f2319301bc0897ab42d928ba
          echo "64f1ee3efcd24b0be6422b68df798baa029f97ff7e39a869d6579e1d20f98454  $p/remaining32-native-route-proofs-20261116.json" | sha256sum --check
          python3 -m py_compile "$p/prepare-remaining32-feed-tail-20261116.py"
          umask 077
          w="$RUNNER_TEMP/feed32";e="$w/evidence";mkdir -p "$e" "$w/bound" "$w/preimages"
          gh api repos/pyatkoff/max-search-bot/actions/runs/43927951309 > "$e/read-run.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14255918310 > "$e/read-artifact.json"
          gh api repos/pyatkoff/max-search-bot/actions/artifacts/14255918310/zip > "$e/read.zip"
          gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$e/main.json"
          gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_SOURCE&per_page=100" > "$e/current-runs.json"
          gh api repos/pyatkoff/max-search-bot/issues/comments/6925038313 > "$e/owner-scope.json"
          python3 - <<'PY'
          import os,pathlib,json,hashlib,zipfile
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed32';e=w/'evidence';load=lambda n:json.loads((e/n).read_bytes())
          r=load('read-run.json');a=load('read-artifact.json');raw=(e/'read.zip').read_bytes()
          assert r['id']==43927951309 and r['run_attempt']==1 and r['head_sha']=='785416481e95c39cf790a539fdd00d28cfc5da3b' and r['status']=='completed' and r['conclusion']=='success'
          assert a['id']==14255918310 and not a['expired'] and a['workflow_run']['id']==r['id'] and a['digest']=='sha256:7d1ae9812083058edf9ce65f8e63af28b98f2dabc1f44b878d4718aaf507960b'
          assert hashlib.sha256(raw).hexdigest()==a['digest'].split(':')[1]
          with zipfile.ZipFile(e/'read.zip') as z:
            assert z.testzip() is None and sum(x.file_size for x in z.infolist())<40000000
            assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(w/'bound')
          current=os.environ['EXPECTED_SOURCE'];assert load('main.json')['object']['sha']==current
          gates=json.loads((w/'bound/source-evidence/gate-receipts.json').read_bytes());runs=load('current-runs.json');assert len(gates)==9 and runs['total_count']<=100
          for name,g in gates.items():
            matches=[r for r in runs['workflow_runs'] if r['id']==g['run_id']];assert len(matches)==1
            r=matches[0];assert r['head_sha']==current and r['head_branch']=='main' and r['path']=='.github/workflows/'+name and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
          c=load('owner-scope.json');assert c['id']==6925038313 and c['user']['id']==226193297 and 'CONTENT33' in c['body'] and 'фидам' in c['body']
          (e/'owner-pin.json').write_text(json.dumps({'id':c['id'],'updated_at':c['updated_at'],'body_sha256':hashlib.sha256(c['body'].encode()).hexdigest()}))
          PY
      - name: Read fresh public preimages and prepare four guarded additions
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/feed32";p=tools/direct_demand/operations
          python3 - <<'PY'
          import os,pathlib,urllib.request,json,hashlib,datetime
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed32';evidence=[]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect())
          for name in ['hotel-posts-telegram.xml','hotel-posts-max.xml','hotel-posts-all.xml']:
            url='https://app.anytoour.ru/feed/'+name
            with opener.open(urllib.request.Request(url,headers={'User-Agent':'AnyTour confirmed feed extension','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=25) as response:
              assert response.status==200 and response.geturl()==url
              raw=response.read(4000001);assert 1000<len(raw)<4000000 and raw.startswith(b'<?xml version="1.0" encoding="UTF-8"?>')
              (w/'preimages'/name).write_bytes(raw)
              evidence.append({'name':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'read_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'http':200})
          (w/'evidence/preimage-read.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
          python3 "$p/prepare-remaining32-feed-tail-20261116.py" "$w/bound" "$p/remaining32-native-route-proofs-20261116.json" "$w/preimages" "$w/prepared"
      - name: Retain exact four-stage intent before feed writes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-feed-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/feed32/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare existing pinned connection
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Write each exact addition once and verify three public feeds before next
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          w="$RUNNER_TEMP/feed32/prepared"
          for g in 22 23 24 25; do
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SOURCE"
            test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 --jq .object.sha)" = "$GITHUB_SHA"
            gh api repos/pyatkoff/max-search-bot/issues/comments/6925038313 > "$RUNNER_TEMP/feed32/evidence/owner-before-write.json"
            GROUP="$g" python3 - <<'PY'
          import os,pathlib,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed32';e=root/'evidence';c=json.loads((e/'owner-before-write.json').read_bytes());pin=json.loads((e/'owner-pin.json').read_bytes())
          assert c['id']==pin['id'] and c['user']['id']==226193297 and c['updated_at']==pin['updated_at'] and hashlib.sha256(c['body'].encode()).hexdigest()==pin['body_sha256']
          g=int(os.environ['GROUP']);intent=next(x for x in json.loads((root/'prepared/intent.json').read_bytes())['groups'] if x['group']==g)
          assert hashlib.sha256((root/'prepared'/str(g)/'write.php').read_bytes()).hexdigest()==intent['script_sha256']
          PY
            test ! -e "$w/$g/execution-started.txt"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$w/$g/execution-started.txt"
            status=0
            ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && GIT_OPTIONAL_LOCKS=0 php' < "$w/$g/write.php" > "$w/$g/result.json" || status=$?
            printf '%s\n' "$status" > "$w/$g/exit-code.txt"
            cat "$w/$g/result.json"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            GROUP="$g" python3 - <<'PY'
          import os,pathlib,json,hashlib,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'feed32/prepared';g=int(os.environ['GROUP']);p=root/str(g)
          result=json.loads((p/'result.json').read_bytes().splitlines()[-1]);intent=next(x for x in json.loads((root/'intent.json').read_bytes())['groups'] if x['group']==g)
          assert result['ok'] and result['operation']==intent['operation'] and all(result[k]==0 for k in ['db_writes','provider_calls','message_sends']) and len(result['files'])==3
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect());verified=[]
          for actual,expected in zip(result['files'],intent['files']):
            assert all(actual[k]==expected[k] for k in ['name','sha256','bytes','rows']) and actual['write_action']=='replace'
            url='https://app.anytoour.ru/feed/'+actual['name']
            with opener.open(urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=25) as response:
              assert response.status==200 and response.geturl()==url;raw=response.read(4000001)
            assert hashlib.sha256(raw).hexdigest()==actual['sha256']
            (p/('public-'+actual['name'])).write_bytes(raw);verified.append({'name':actual['name'],'http':200,'sha256':actual['sha256'],'rows':actual['rows']})
          (p/'public-readback.json').write_text(json.dumps({'ok':True,'operation':result['operation'],'files':verified},indent=2)+'\n')
          print('THREE_PUBLIC_FEEDS_VERIFIED '+json.dumps(verified))
          PY
          done
      - name: Retain original outcomes without retries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining32-feed-outcome-${{ github.run_id }}
          path: ${{ runner.temp }}/feed32/
          retention-days: 30
          if-no-files-found: error
      - name: Remove runner-only connection files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
