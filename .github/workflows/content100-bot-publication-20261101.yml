name: Add the adults-only condition to the existing W Dubai Mina Seyahi pair
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/content100-bot-publication-20261101.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  caption-current-pair:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '1b797d5b7fea22c1cee007467e792e613d3bdd72' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: tools/direct_demand/operations
      - name: Verify original run terminal and unchanged caption transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json
          def info(path):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+path],timeout=60))
          app='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          assert info('git/ref/heads/main')['object']['sha']==app
          r=info('actions/runs/44230281892');assert r['status']=='completed' and r['head_sha']=='8398d22a088be9cd3c5d58b7bc091bb3df646cce' and r['run_attempt']==1
          a=info('actions/artifacts/14394559384');assert a['workflow_run']['id']==44230281892 and a['digest']=='sha256:edbe4cba52dbd2beff1e8af990a68bd56dd3a97c4d047076bc6a491f2a73129d'
          active=info('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')['workflow_runs']
          assert not [x for x in active if x['status'] in {'requested','queued','in_progress','waiting','pending'}]
          import zipfile,io,hashlib
          previous=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14394443836/zip'],timeout=90)
          assert hashlib.sha256(previous).hexdigest()=='75e8b24ee462dbea593b1fb8ba7397d32f2d4ce47e227df2d2a59c492d2ea40d'
          with zipfile.ZipFile(io.BytesIO(previous)) as prior:
              assert set(prior.namelist())=={'read-scope.json','read-result.json'}
              stopped=json.loads(prior.read('read-result.json'))
              assert stopped['error']=='monitor_journal_incomplete' and stopped['post_write_attempts']==stopped['provider_calls']==0 and stopped['posts']==[]
          
          second_run=info('actions/runs/44231952250')
          assert second_run['status']=='completed' and second_run['conclusion']=='failure' and second_run['run_attempt']==1
          assert second_run['head_sha']=='b1991920bccb791b55d325bef51a83d5f48b81fd'
          second=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14394604046/zip'],timeout=90)
          assert hashlib.sha256(second).hexdigest()=='e4cf77ef95fcff124d8621fe0fb7fb166c16a479091d07b06ff631c48d2613c9'
          with zipfile.ZipFile(io.BytesIO(second)) as prior:
              assert set(prior.namelist())=={'journal-metadata.json','read-scope.json','read-result.json'}
              stopped=json.loads(prior.read('read-result.json'))
              assert stopped['error']=='monitor_journal_incomplete' and stopped['post_write_attempts']==stopped['provider_calls']==0 and stopped['posts']==[]
          for path,expected in [('commercial-caption-review73-20261113-executor.php','cd2d8390f7723a25ec06e9cd90239c0cc9623ad2'),('commercial-caption-review73-20261113-read-scope.php','0f6e34762ddc280dd896b4f5eabc8e334d4534f1')]:
              assert subprocess.check_output(['git','hash-object','tools/direct_demand/operations/'+path],text=True).strip()==expected
          PY
          python3 -m py_compile tools/direct_demand/operations/prepare-w9-78929-adults-caption-20261118.py
          python3 tools/direct_demand/operations/prepare-w9-78929-adults-caption-20261118.py read
          php -l caption78929/read.php
          php -l tools/direct_demand/operations/commercial-w9-78929-price-journal-20261118.php
          php tools/direct_demand/operations/test-commercial-w9-78929-price-journal-20261118.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read the two current versions without changing them
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < caption78929/read.php > caption78929/read-result.json
      - name: Bind the exact sentence insertion and reject any broader edit
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/prepare-w9-78929-adults-caption-20261118.py edit
          php -l caption78929/edit.php
          php caption78929/scope-tests.php
      - name: Edit existing two messages ONCE using the established caption executor
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          rc=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < caption78929/edit.php > caption78929/original-edit-output.jsonl || rc=$?
          printf '%s\n' "$rc" > caption78929/original-edit-exit.txt
          cat caption78929/original-edit-output.jsonl
          exit "$rc"
      - name: Verify both existing posts, IDs, body, photos, button and price lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('caption78929');m=json.loads((p/'manifest.json').read_bytes());raw=(p/'original-edit-output.jsonl').read_bytes();r=json.loads(raw.splitlines()[-1])
          assert (p/'original-edit-exit.txt').read_text().strip()=='0' and r['ok'] and r['operation']==m['operation'] and r['mode']=='approved_existing_caption_quality_revision'
          assert r['manifest_sha256']==hashlib.sha256((p/'manifest.json').read_bytes()).hexdigest()
          assert len(r['posts'])==r['post_write_attempts']==r['caption_updates']==r['preflight_existing_messages']==2
          for k in ['new_posts_created','configuration_write_attempts','button_write_attempts','tour_search_calls','price_queries']:assert r[k]==0
          targets={x['publication_id']:x for x in m['rows']}
          for post in r['posts']:
              x=targets[post['publication_id']]
              for k in ['hotel_id','platform','message_id','post_url','photo_signature','button_url_sha256','source_key','monitor_price_record_id']:assert post[k]==x[k]
              assert post['previous_version_id']==x['version_id'] and post['version_id']!=x['version_id'] and post['text_sha256']==x['new_text_sha256'] and post['previous_attachments_sha256']==x['attachments_sha256']
              for k in ['body_photo_button_verified','formatting_verified','existing_message_reused','existing_token_resolves_to_current_version']:assert post[k] is True
          (p/'terminal-verified.json').write_text(json.dumps({'state':'EXISTING_78929_ADULTS_CONDITION_VERIFIED_BOTH','new_posts':0,'posts_edited':2,'native_result':r,'manifest':m},ensure_ascii=False,indent=2)+'\n')
          print('EXISTING_78929_ADULTS_CONDITION_VERIFIED_BOTH')
          PY
      - name: Preserve original caption correction evidence including UNKNOWN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing78929-adults-caption-one-attempt-20261118
          path: |
            caption78929/read-scope.json
            caption78929/read-result.json
            caption78929/manifest.json
            caption78929/original-edit-output.jsonl
            caption78929/original-edit-exit.txt
            caption78929/terminal-verified.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only credentials and compiled inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" caption78929/*.php
