name: Publish exact three cleared accepted hotel pairs
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_DEPLOY_RUN_ID: '43651374281'
  EXPECTED_TLS_RUN_ID: '43652446896'
  EXPECTED_PRODUCTION_SHA: 62fc5cf8cf5cb3e41b370a808c2281d27ae83da7
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Authenticate the same CONTENT owner and one original scoped push
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''ADMISSION''

        import json,os,re,subprocess

        repo=''repos/pyatkoff/max-search-bot/''

        parent=''96a1d286a56505c1a87cfe22c8d7a691a0f3bcaf''

        assert re.fullmatch(r''[a-f0-9]{40}'',parent),''exact_parent_must_be_bound_before_original_push''

        def get(path):return json.loads(subprocess.check_output([''gh'',''api'',''--method'',''GET'',''-H'',''Cache-Control:
        no-cache'',repo+path]))

        assert get(''git/ref/heads/main'')[''object''][''sha'']==os.environ[''EXPECTED_PRODUCTION_SHA'']

        assert get(''git/ref/heads/audit/content100-bot-publication-20261101'')[''object''][''sha'']==os.environ[''GITHUB_SHA'']

        owner=get(''issues/comments/6818332618'')

        assert owner[''user''][''id'']==226193297 and owner[''body''].startswith(''ACTIVE 15 Nov: publish three cleared accepted
        hotel pairs; same carrier; no replay.'')

        publisher=get(''issues/comments/6775467253'')

        assert publisher[''user''][''id'']==226193297 and publisher[''body''].strip()==''PR1541: установлено, выпуск свободен''

        run=get(''actions/runs/''+os.environ[''GITHUB_RUN_ID''])

        assert run[''event'']==''push'' and run[''run_attempt'']==1 and run[''head_sha'']==os.environ[''GITHUB_SHA'']

        assert run[''head_branch'']==''audit/content100-bot-publication-20261101'' and run[''path'']==''.github/workflows/content100-bot-publication-20261101.yml''

        assert run[''actor''][''id'']==run[''triggering_actor''][''id'']==226193297

        assert [x[''sha''] for x in get(''git/commits/''+os.environ[''GITHUB_SHA''])[''parents'']]==[parent]

        print(''EXACT_SAME_CONTENT_OWNER_ORIGINAL_PUSH_ACCEPTED'')

        ADMISSION

        '
    - name: Verify nine original source gates and the unchanged 22 publishing pins
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'SOURCE9'\nimport json,os,pathlib,subprocess\nassert os.environ['GITHUB_RUN_ATTEMPT']=='1'\n\
        expected=os.environ['EXPECTED_PRODUCTION_SHA']\ngates=[(43651374281, '.github/workflows/deploy.yml', 'push'), (43652446896,\
        \ '.github/workflows/max-tls-preflight.yml', 'workflow_run'), (43652446908, '.github/workflows/telegram-production-health.yml',\
        \ 'workflow_run'), (43652446895, '.github/workflows/max-production-health.yml', 'workflow_run'), (43652446875, '.github/workflows/modeled-conversion-value-export.yml',\
        \ 'workflow_run'), (43652446872, '.github/workflows/publish-conversation-diagnostics.yml', 'workflow_run'), (43652446960,\
        \ '.github/workflows/modeled-conversion-monitor.yml', 'workflow_run'), (43652446907, '.github/workflows/tour-selection-host.yml',\
        \ 'workflow_run'), (43652446977, '.github/workflows/live-session-diagnostics.yml', 'workflow_run')]\nassert len(gates)==9\
        \ and len({x[0] for x in gates})==9\nfor run_id,path,event in gates:\n r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))\n\
        \ assert r['id']==run_id and r['run_attempt']==1 and r['head_sha']==expected\n assert r['head_branch']=='main' and\
        \ r['path']==path and r['event']==event\n assert r['status']=='completed' and r['conclusion']=='success'\n if event=='workflow_run':assert\
        \ r['display_title']=='deploy-proof:v1:43651374281:1'\n pathlib.Path(os.environ['RUNNER_TEMP'],f'commercial-source-gate-{run_id}.json').write_text(json.dumps(r))\n\
        print('NINE_ORIGINAL_SOURCE_GATES_SUCCESS_ATTEMPT1')\nSOURCE9\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\n\
        evidence=\"$RUNNER_TEMP/commercial-source-evidence\"\nmkdir -p \"$evidence\"\ngh api repos/pyatkoff/max-search-bot/git/ref/heads/main\
        \ > \"$evidence/main.json\"\ngh api \"repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_DEPLOY_RUN_ID\" > \"$evidence/verify_run.json\"\
        \ngh api \"repos/pyatkoff/max-search-bot/actions/runs/${EXPECTED_DEPLOY_RUN_ID}/jobs?per_page=20\" > \"$evidence/verify_jobs.json\"\
        \ngh api \"repos/pyatkoff/max-search-bot/actions/runs/$EXPECTED_TLS_RUN_ID\" > \"$evidence/tls_run.json\"\ngh api\
        \ \"repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA\" > \"$evidence/source_commit.json\"\ntree_sha=\"\
        $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[\"tree\"][\"sha\"])' \"$evidence/source_commit.json\"\
        )\"\ngh api \"repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1\" > \"$evidence/source_tree.json\"\npython3\
        \ - <<'PYPIN'\nimport hashlib,pathlib\nassert hashlib.sha256(pathlib.Path('tools/direct_demand/operations/verify-commercial-source.py').read_bytes()).hexdigest()=='5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'\n\
        PYPIN\npython3 tools/direct_demand/operations/verify-commercial-source.py --expected-source \"$EXPECTED_PRODUCTION_SHA\"\
        \ --evidence-dir \"$evidence\"\n"
    - name: Authenticate original exact bounded candidate clearance
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'CLEAR'\nimport json,pathlib,hashlib,subprocess,zipfile,io,os,re\nrun_id=int('43655518261')\n\
        head='d82de385003c9cfd8a785b5d19f018cbe4a3ace9'\nartifact_id=int('14137753511')\nartifact_sha='62518f4eaaad2cc21d42e0b0be33c71699c0604514d630e67d9ca2516ce6825d'\n\
        assert run_id>0 and artifact_id>0 and re.fullmatch(r'[a-f0-9]{40}',head) and re.fullmatch(r'[a-f0-9]{64}',artifact_sha)\n\
        r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/runs/{run_id}']))\nassert\
        \ r['id']==run_id and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'\nassert r['head_sha']==head\
        \ and r['event']=='push'\nassert r['head_branch']=='audit/content100-bot-publication-20261101' and r['path']=='.github/workflows/content100-bot-publication-20261101.yml'\n\
        a=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/artifacts/{artifact_id}']))\n\
        assert a['id']==artifact_id and a['name']=='commercial-batch-20261115-1-duplicate-clearance' and a['expired'] is False\n\
        assert a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']\nassert a['digest']=='sha256:'+artifact_sha\n\
        raw=subprocess.check_output(['gh','api',f'repos/pyatkoff/max-search-bot/actions/artifacts/{artifact_id}/zip'])\nassert\
        \ hashlib.sha256(raw).hexdigest()==artifact_sha\nz=zipfile.ZipFile(io.BytesIO(raw))\nassert len(z.infolist())<=20\n\
        assert all(not i.filename.startswith('/') and '..' not in pathlib.PurePosixPath(i.filename).parts for i in z.infolist())\n\
        files=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name=='channel-feed-read.json']\nassert len(files)==1\
        \ and files[0].file_size<200000\nclearance_raw=z.read(files[0])\nassert hashlib.sha256(clearance_raw).hexdigest()=='ae5710861ee11b2259ff94ef76779c00397b4810cfed3eb3246644eb20637166'\n\
        c=json.loads(clearance_raw.splitlines()[-1])\nassert c['ok'] is True and c['operation']=='commercial-channel-hotel-feeds-20261115-read1'\n\
        assert c['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and c['candidate_count']==4\nassert all(c[k]==0 for\
        \ k in ['db_writes','provider_calls','message_sends'])\nall_read_ids=[59114,74036,475,473]\nids=[59114,475,473]\n\
        assert [r['native_hotel_id'] for r in c['candidate_clearance']]==all_read_ids\nassert set(ids)==set(all_read_ids)-{74036}\n\
        base=pathlib.Path('tools/direct_demand/operations')\ncandidate_raw=(base/'commercial-batch-20261115-1-candidates.json').read_bytes()\n\
        assert hashlib.sha256(candidate_raw).hexdigest()=='9951a3362810d845a7a40d1da4bb507270d0d06c4b02a6aa75c18df91b23b93b'\n\
        input_by={r['hotel_id']:r for r in json.loads(candidate_raw)}\nassert list(input_by)==all_read_ids\nclear_by={r['native_hotel_id']:r\
        \ for r in c['candidate_clearance']}\nfor hid in all_read_ids:\n assert clear_by[hid]['logical_id']==input_by[hid]['logical_id']\
        \ and clear_by[hid]['aliases']==input_by[hid]['aliases'] and clear_by[hid]['scope']==input_by[hid]['scope']\nblocked=clear_by[74036]\n\
        assert blocked['clear'] is False and blocked['limit_reached'] is False and len(blocked['matches'])==1\nold_max=blocked['matches'][0]\n\
        assert old_max['publication_id']==60 and old_max['version_id']==72 and old_max['platform']=='max' and old_max['state']=='sent'\n\
        assert old_max['hotel_catalog_id'] is None and old_max['logical_id'] is None and old_max['post_url']=='https://max.ru/channel_anytour/AaF1Af9VDuA'\n\
        manifest_raw=(base/'commercial-batch-20261115-1-manifest.json').read_bytes()\napproval_raw=(base/'commercial-batch-20261115-1-approval.json').read_bytes()\n\
        assert hashlib.sha256(manifest_raw).hexdigest()=='446bf9af9a92d3e642f047816d9288ab459f4b7754505f6a7e43e8fae01c944e'\n\
        assert hashlib.sha256(approval_raw).hexdigest()=='042d330e554ccd48aa7f16a976323178424256728412a7d7d4be4ec37fa9a3aa'\n\
        m=json.loads(manifest_raw);approval=json.loads(approval_raw)\nassert approval=={'schema_version':1,'operation':'commercial-hotel-batch-20261115-1-v1','expected_installed_sha':os.environ['EXPECTED_PRODUCTION_SHA'],'hotel_ids':ids,'manifest_sha256':hashlib.sha256(manifest_raw).hexdigest()}\n\
        assert m['operation']==approval['operation'] and m['state']=='PREPARED_NOT_SENT' and [r['hotel_id'] for r in m['rows']]==ids\n\
        asset_commit='d82de385003c9cfd8a785b5d19f018cbe4a3ace9'\nassert re.fullmatch(r'[a-f0-9]{40}',asset_commit)\nby={r['native_hotel_id']:r\
        \ for r in c['candidate_clearance']}\nfor row in m['rows']:\n x=by[row['hotel_id']];i=input_by[row['hotel_id']]\n\
        \ assert x['clear'] is True and x['matches']==[] and x['limit_reached'] is False\n assert x['logical_id']==i['logical_id']==row['logical_id']\
        \ and x['aliases']==i['aliases']==row['aliases']\n assert i['expected_text_sha256']==row['text_sha256']==hashlib.sha256(row['text'].encode()).hexdigest()\n\
        \ assert row['photo_url']==f\"https://raw.githubusercontent.com/pyatkoff/max-search-bot/{asset_commit}/.github/traffic-publish/commercial-batch-20261115-1/{row['hotel_id']}.png\"\
        \nprint('ORIGINAL_FOUR_READ_PRESERVED; THREE_CLEAR_SELECTED; REWAYA_EXCLUDED; sender rechecks duplicates before writes')\n\
        CLEAR\n"
    - name: Prepare and validate the exact sender and bounded read
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_RUN_ATTEMPT" = 1

        umask 077

        python3 - <<''PY''

        import hashlib,json,os,pathlib

        base=pathlib.Path(''tools/direct_demand/operations'')

        assert hashlib.sha256((base/''prepare-commercial-batch.py'').read_bytes()).hexdigest()==''b3b46889004a992351f681032400dc6da04a36b756a27ba54af41275cc531f1d''

        pins={''prepare-publication-tail.py'': ''6db0ef9d8bb51d897387140c6f5c1d9e5b68bc33ffff41c9cea98621c927c4b8'', ''commercial-channel-hotel-feeds-20261113-update10-nightly-guard.php'':
        ''19c921720bfc3c1a1ca06e1d43854420e8f4f8c0a44b9fb80c76ed0cefe038fa'', ''test-commercial-feed-monitor-tail-guard.php'':
        ''32274c8eb2d8d8604b709b3cc98b2992ddd9dbb32303432a2b900ccb01a9d287''}

        for name,sha in pins.items():assert hashlib.sha256((base/name).read_bytes()).hexdigest()==sha,name

        approval=json.loads((base/''commercial-batch-20261115-1-approval.json'').read_text())

        assert approval[''expected_installed_sha'']==os.environ[''EXPECTED_PRODUCTION_SHA'']

        assert approval[''operation'']==''commercial-hotel-batch-20261115-1-v1'' and approval[''hotel_ids'']==[59114,475,473]

        PY

        php -l tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-nightly-guard.php

        php tools/direct_demand/operations/test-commercial-feed-monitor-tail-guard.php

        python3 tools/direct_demand/operations/prepare-commercial-batch.py --manifest tools/direct_demand/operations/commercial-batch-20261115-1-manifest.json
        --approval tools/direct_demand/operations/commercial-batch-20261115-1-approval.json --output "$RUNNER_TEMP/channel-preflight.php"

        php -l "$RUNNER_TEMP/channel-preflight.php"

        python3 tools/direct_demand/operations/prepare-publication-tail.py reader --manifest tools/direct_demand/operations/commercial-batch-20261115-1-manifest.json
        --approval tools/direct_demand/operations/commercial-batch-20261115-1-approval.json --reader-template tools/direct_demand/operations/read-commercial-channel-hotel-feeds-20261108-48.php
        --reader-operation commercial-channel-hotel-feeds-20261115-read2 --output "$RUNNER_TEMP/channel-feed-read.php"

        php -l "$RUNNER_TEMP/channel-feed-read.php"

        ANYTOUR_CHANNEL_BATCH51_SCOPE_FIXTURE=1 php "$RUNNER_TEMP/channel-feed-read.php"

        '
    - name: Retain exact approved inputs before any channel write
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261115-1-inputs
        path: 'tools/direct_demand/operations/commercial-batch-20261115-1-manifest.json

          tools/direct_demand/operations/commercial-batch-20261115-1-approval.json

          '
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"$raw\" == *\"PRIVATE KEY\"* ]]; then\n  if\
        \ [[ \"$raw\" == *'\\n'* ]]; then printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; else printf\
        \ '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse\n  printf '%s' \"$raw\" | base64 --decode\
        \ > \"$RUNNER_TEMP/channel_key\"\nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\nhost=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\n\
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\n\
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\n\
        matches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n  if len(fields)<3 or fields[0].startswith('#'):continue\n\
        \  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n\
        \  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\n\
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(matches)+'\\n')\nPY\n"
    - name: Publish the exact approved hotel posts with canonical buttons and no duplicates
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST"
        "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = ''$EXPECTED_PRODUCTION_SHA'';
        test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preflight.php" > "$RUNNER_TEMP/channel-preflight.json"
        || probe_status=$?

        python3 - <<''PY''

        import pathlib,json,os

        lines=pathlib.Path(os.environ[''RUNNER_TEMP'']+''/channel-preflight.json'').read_text().splitlines()

        d=json.loads(lines[-1])

        print(json.dumps({k:v for k,v in d.items() if k!=''posts''},ensure_ascii=False,sort_keys=True))

        print(json.dumps({''new_post_urls'':[{''platform'':p[''platform''],''logical_id'':p[''logical_id''],''post_url'':p[''post_url''],''verified'':p[''body_photo_button_verified'']}
        for p in d.get(''posts'',[])]},ensure_ascii=False))

        assert d[''operation'']==''commercial-hotel-batch-20261115-1-v1'' and d[''mode'']==''publish_approved_commercial_batch''

        assert d[''ok''] is True and d[''installed_sha'']==os.environ[''EXPECTED_PRODUCTION_SHA''] and len(d[''posts''])==6

        assert {(p[''hotel_id''],p[''platform'']) for p in d[''posts'']}=={(h,p) for h in [59114,475,473] for p in [''telegram'',''max'']}

        assert d[''post_write_attempts'']==6 and d[''new_posts'']==6 and d[''reused'']==0

        assert len({(p[''platform''],p[''logical_id'']) for p in d[''posts'']})==6

        assert all(p[''body_photo_button_verified''] and p[''button_text'']==''✈️ Узнать стоимость тура'' for p in d[''posts''])

        PY

        test "${probe_status:-0}" = 0

        '
    - name: Read only the confirmed canonical pairs and native MAX bindings
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\nssh -i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes\
        \ -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"$RUNNER_TEMP/channel_known_hosts\"\
        \ \"$DEPLOY_USER@$DEPLOY_HOST\" \"set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php\" < \"$RUNNER_TEMP/channel-feed-read.php\"\
        \ > \"$RUNNER_TEMP/channel-feed-read.json\" || read_status=$?\npython3 - <<'PYREAD'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        receipt=json.loads((p/'channel-preflight.json').read_text().splitlines()[-1])\nd=json.loads((p/'channel-feed-read.json').read_text().splitlines()[-1])\n\
        ids=[59114,475,473]\nassert d['ok'] is True and d['operation']=='commercial-channel-hotel-feeds-20261115-read2'\n\
        assert d['installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']\nassert d['scope_hotels']==d['feed_rows']==d['private_binding_count']==3\
        \ and d['deferred_count']==0\nassert [r['hotel_id'] for r in d['rows']]==[r['hotel_id'] for r in d['private_max_bindings']]==ids\n\
        assert all(d[k]==0 for k in ('db_writes','provider_calls','message_sends'))\nby_pair={(r['hotel_id'],r['platform']):r\
        \ for r in receipt['posts']}\nfor r,b in zip(d['rows'],d['private_max_bindings']):\n  for platform in ('telegram','max'):assert\
        \ r[platform+'_post_url']==by_pair[(r['hotel_id'],platform)]['post_url']\n  assert str(b['publication_id'])==str(by_pair[(r['hotel_id'],'max')]['publication_id'])\n\
        print(json.dumps({k:d[k] for k in ('operation','ok','scope_hotels','feed_rows','private_binding_count','deferred_count','provider_calls','db_writes','message_sends')}))\n\
        PYREAD\ntest \"${read_status:-0}\" = 0\n"
    - name: Retain bounded route evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-batch-20261115-1-publication-and-read
        path: '${{ runner.temp }}/channel-preflight.json

          ${{ runner.temp }}/channel-feed-read.json

          '
        retention-days: 14
        if-no-files-found: warn
    - name: Remove ephemeral connection and script files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preflight.php" "$RUNNER_TEMP/channel-preflight.json"
        "$RUNNER_TEMP/channel-feed-read.php" "$RUNNER_TEMP/channel-feed-read.json"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
