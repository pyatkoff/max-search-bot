name: Prepare exact verified prices and feed-style search links without changing posts
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 8f209b1ac93090ab399c1b8225151849fceb4fd0
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261105-manual1-quote-pass1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41980943154
          path: ${{ runner.temp }}/original-quotes
      - name: Admit whole real baskets and build hotel-specific search link fallback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/direct_demand/operations/prepare-current-hotel-offer-updates-20261105-manual1.py
          for script in "$RUNNER_TEMP"/price-manual1-pass1/*/update.php; do
            php -l "$script"
            ANYTOUR_OFFER1_NEW_BOUND_INPUT_CASES=1 php "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-offer-update-20261105-manual1-prepared1
          path: |
            ${{ runner.temp }}/price-manual1-pass1/update-index.json
            ${{ runner.temp }}/price-manual1-pass1/prepare-summary.json
            ${{ runner.temp }}/price-manual1-pass1/closed-no-edit.json
            ${{ runner.temp }}/price-manual1-pass1/all-update-intents.json
            ${{ runner.temp }}/price-manual1-pass1/*/update.php
            ${{ runner.temp }}/price-manual1-pass1/*/update-manifest.json
            ${{ runner.temp }}/price-manual1-pass1/*/update-approval.json
            ${{ runner.temp }}/price-manual1-pass1/*/update-intent.json
            ${{ runner.temp }}/price-manual1-pass1/*/candidate.json
          retention-days: 14
          if-no-files-found: error
