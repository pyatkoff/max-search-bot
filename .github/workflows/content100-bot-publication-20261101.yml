name: Inspect two newly declared Old Palace gallery images without provider access
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  CONTACT_SOURCE_INDEX_FILENAME: commercial-batch-20261105-58-contact-source-index.json
  EXPECTED_CONTACT_SOURCE_INDEX_SHA256: 383e82a7a931f7317ef67a3e5727dd0e1322e8ce7ff4936c4307ffc4ad10efad
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Validate new declared photo inputs before bounded raw GETs
        env:
          MEDIA_GROUP: '0'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 -m py_compile tools/direct_demand/operations/inspect-hotel-primary-images-20261105-batch58.py
          python3 tools/direct_demand/operations/inspect-hotel-primary-images-20261105-batch58.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-batch58-contact-0
          path: |
            primary-image-inspection.json
            contact.png
            accepted-primary-raw
          retention-days: 14
          if-no-files-found: warn
