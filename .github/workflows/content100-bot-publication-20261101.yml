name: Prepare a scoped fresh price collection proposal without source calls
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261104-read9
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41898354901
          path: ${{ runner.temp }}/retained-read9
      - name: Prepare exact public native scope and finite search limits without making searches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/direct_demand/operations/prepare-published-price-refresh-proposal-20261104.py
      - name: Retain safe bounded inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261104-published-refresh-proposal1
          path: |
            ${{ runner.temp }}/published-price-refresh-proposal.json
          retention-days: 14
          if-no-files-found: warn
