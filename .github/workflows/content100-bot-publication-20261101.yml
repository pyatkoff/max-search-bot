name: Read only the existing nightly pending journal and exact native MAX state
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: cc58204bcaae562d237351e7dd8d23c6be9e3e36
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate exact bounded read-only source and PHP syntax
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        sha256sum -c <<'PINS'
        1c496e9b3035be8e0251b1c07c603762d04547c1ab9471c47c9b8d01c8da3b3e  tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1.php
        39275eab0e6cccd6d12368a12a3d1a243c6f2acabb32df8f0915488773da8c8f  tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1-plan.json
        51270e4ce241914001ddc307e581ffdac69234c3880e77bd99a7be6b4e5d4a7a  tools/direct_demand/operations/verify-commercial-source.py
        PINS
        cp tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1.php "$RUNNER_TEMP/nightly-pending-read.php"
        php -l "$RUNNER_TEMP/nightly-pending-read.php"
    - name: Authenticate exact original prewrite refusal and preserve its receipt
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 - <<'AUTH'
        import hashlib,io,json,os,pathlib,subprocess,zipfile
        base=pathlib.Path('tools/direct_demand/operations');plan=json.loads((base/'commercial-channel-hotel-feeds-20261113-update10-readiness1-plan.json').read_bytes());b=plan['original_feed_attempt']
        e=pathlib.Path(os.environ['RUNNER_TEMP'],'readiness-evidence');e.mkdir(mode=0o700)
        def api(path):return subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+path])
        run=json.loads(api('actions/runs/'+str(b['run_id'])));meta=json.loads(api('actions/artifacts/'+str(b['artifact_id'])))
        assert run['id']==b['run_id'] and run['run_attempt']==1 and run['head_sha']==b['head_sha'] and run['status']=='completed' and run['conclusion']=='failure'
        assert run['path']=='.github/workflows/content100-bot-publication-20261101.yml' and run['head_branch']=='audit/content100-bot-publication-20261101'
        assert meta['id']==b['artifact_id'] and meta['name']==b['artifact_name'] and meta['expired'] is False and meta['digest']=='sha256:'+b['artifact_sha256']
        assert meta['workflow_run']['id']==b['run_id'] and meta['workflow_run']['head_sha']==b['head_sha']
        raw=api('actions/artifacts/'+str(b['artifact_id'])+'/zip');assert hashlib.sha256(raw).hexdigest()==b['artifact_sha256']
        with zipfile.ZipFile(io.BytesIO(raw)) as z:
         assert sum(i.file_size for i in z.infolist())<20000000
         def one(name):
          members=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name];assert len(members)==1 and members[0].file_size<200000;return z.read(members[0])
         receipt_raw=one('writer-receipt.json');marker=json.loads(one('feed-writer.started'));wrapper=json.loads(one('wrapper-proof.json'))
         assert hashlib.sha256(receipt_raw).hexdigest()==b['writer_receipt_sha256']
         r=json.loads(receipt_raw.splitlines()[-1]);assert r['operation']=='commercial-channel-hotel-feeds-20261113-update10' and r['ok'] is False and r['error']=='monitor_already_running' and r['files']==[]
         assert all(r[k]==0 for k in ['db_writes','provider_calls','message_sends'])
         assert marker['operation']==r['operation'] and marker['input_sha256']==b['input_sha256'] and str(marker['run_id'])==str(b['run_id']) and marker['writer_attempts']==1 and marker['retry_authorized'] is False
         assert wrapper['nightly_guard_sha256']==b['nightly_guard_sha256'] and wrapper['frozen_writer_body_preserved'] is True and wrapper['journal_write_attempts']==0
         (e/'original-guard-receipt.json').write_bytes(receipt_raw)
         (e/'original-started.json').write_text(json.dumps(marker,indent=2)+'\n')
         (e/'original-wrapper-proof.json').write_text(json.dumps(wrapper,indent=2)+'\n')
        (e/'original-failure-binding.json').write_text(json.dumps({'verified':True,**b},indent=2)+'\n')
        print('ORIGINAL_PREWRITE_GUARD_REFUSAL_VERIFIED; no feed continuation authorized')
        AUTH
    - name: Require original current-source release and health gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/commercial-source-evidence"
        mkdir -m 700 "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" > "$evidence/current-runs.json"
        python3 - <<'PY'
        import os,json,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');sha=os.environ['EXPECTED_PRODUCTION_SHA']
        assert json.loads((p/'main.json').read_text())['object']['sha']==sha
        runs=json.loads((p/'current-runs.json').read_text())['workflow_runs']
        paths=['deploy.yml','max-tls-preflight.yml','modeled-conversion-value-export.yml','max-production-health.yml','telegram-production-health.yml','live-session-diagnostics.yml','modeled-conversion-monitor.yml','tour-selection-host.yml','publish-conversation-diagnostics.yml']
        selected={}
        for name in paths:
         candidates=[r for r in runs if r['head_sha']==sha and r['head_branch']=='main' and r['path']=='.github/workflows/'+name and r['run_attempt']==1]
         assert candidates, 'original current-source gate missing: '+name
         r=max(candidates,key=lambda r:r['id']);assert r['status']=='completed' and r['conclusion']=='success', 'gate not successful: '+name
         selected[name]=r
         (p/('verify_run.json' if name=='deploy.yml' else 'tls_run.json' if name=='max-tls-preflight.yml' else 'gate-'+name+'.json')).write_text(json.dumps(r))
        (p/'gate-receipts.json').write_text(json.dumps({n:{'run_id':r['id'],'head_sha':r['head_sha'],'run_attempt':r['run_attempt'],'conclusion':r['conclusion']} for n,r in selected.items()},indent=2)+'\n')
        (p/'deploy-id').write_text(str(selected['deploy.yml']['id']))
        PY
        deploy_id="$(cat "$evidence/deploy-id")"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$deploy_id/jobs?per_page=30" > "$evidence/verify_jobs.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'commercial-source-evidence');jobs=json.loads((p/'verify_jobs.json').read_text())['jobs']
        assert len(jobs)==6 and all(j['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
        PY
        cp "$evidence/gate-receipts.json" "$RUNNER_TEMP/readiness-evidence/source-gate-receipts.json"
    - name: Retain exact read-only inputs before credentials
      uses: actions/upload-artifact@v4
      with:
        name: commercial-channel-hotel-feeds-20261113-update10-readiness1-inputs
        path: |-
          tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1.php
          tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1-plan.json
        retention-days: 14
        if-no-files-found: error
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Require exact read-only owner and carrier lease before inspection
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/readiness-evidence/lease"
        mkdir -p "$evidence"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api repos/pyatkoff/max-search-bot/git/ref/heads/audit/content100-bot-publication-20261101 > "$evidence/carrier.json"
        gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 > "$evidence/owner.json"
        gh api "repos/pyatkoff/max-search-bot/actions/runs/$GITHUB_RUN_ID" > "$evidence/run.json"
        gh api "repos/pyatkoff/max-search-bot/git/commits/$GITHUB_SHA" > "$evidence/commit.json"
        gh api 'repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=in_progress&per_page=30' > "$evidence/active.json"
        gh api 'repos/pyatkoff/max-search-bot/actions/runs?branch=audit%2Fcontent100-bot-publication-20261101&status=queued&per_page=30' > "$evidence/queued.json"
        python3 - <<'PYLEASE'
        import hashlib,json,os,pathlib
        p=json.loads(pathlib.Path('tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-readiness1-plan.json').read_bytes())
        assert p['ready'] is True,'owner pin has not been supplied'
        e=pathlib.Path(os.environ['RUNNER_TEMP'],'readiness-evidence/lease')
        get=lambda n:json.loads((e/(n+'.json')).read_bytes())
        assert get('main')['object']['sha']==p['expected_installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert get('carrier')['object']['sha']==os.environ['GITHUB_SHA']
        comment=get('owner');pin=p['owner_pin']
        assert comment['id']==pin['comment_id'] and comment['user']['login']==pin['owner']
        assert comment['updated_at']==pin['updated_at'] and hashlib.sha256(comment['body'].encode()).hexdigest()==pin['body_sha256']
        assert pin['required_scope_line'] in comment['body'].splitlines()
        run=get('run')
        assert str(run['id'])==os.environ['GITHUB_RUN_ID'] and run['run_attempt']==1 and run['status']=='in_progress'
        assert run['event']=='push' and run['head_sha']==os.environ['GITHUB_SHA'] and run['head_branch']=='audit/content100-bot-publication-20261101'
        assert run['path']=='.github/workflows/content100-bot-publication-20261101.yml'
        assert run['actor']['login']==run['triggering_actor']['login']==os.environ['GITHUB_ACTOR']=='pyatkoff'
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes());commit=get('commit')
        assert event['before']==p['expected_parent_head'] and event['after']==os.environ['GITHUB_SHA']
        assert commit['sha']==os.environ['GITHUB_SHA'] and [x['sha'] for x in commit['parents']]==[p['expected_parent_head']]
        active=get('active');queued=get('queued')
        assert active['total_count']<=1 and all(str(r['id'])==os.environ['GITHUB_RUN_ID'] for r in active['workflow_runs']) and queued['total_count']==0
        (e/'lease.json').write_text(json.dumps({'ok':True,'operation':p['operation'],'owner_pin':pin,'installed_sha':p['expected_installed_sha'],'parent_head':p['expected_parent_head'],'carrier_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1},indent=2)+'\n')
        print('BATCH9_OWNER_SOURCE_CARRIER_LEASE_OK')
        PYLEASE
    - name: Read existing pending and native MAX once without state changes
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        status=0
        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/nightly-pending-read.php" > "$RUNNER_TEMP/readiness-evidence/result.json" || status=$?
        python3 - "$status" <<'CHECK'
        import json,os,pathlib,sys
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'readiness-evidence');raw=(p/'result.json').read_bytes();d=json.loads(raw.splitlines()[-1])
        assert d['operation']=='commercial-channel-hotel-feeds-20261113-update10-readiness1' and d['feed_continuation_authorized'] is False
        assert all(d[k]==0 for k in ['db_write_attempts','journal_write_attempts','post_write_attempts','configuration_write_attempts','provider_write_attempts','feed_write_attempts'])
        (p/'transport.json').write_text(json.dumps({'ssh_status':int(sys.argv[1]),'read_only':True,'retry_authorized':False,'run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'run_attempt':1},indent=2)+'\n')
        print(json.dumps(d,ensure_ascii=False))
        assert d['ok'] is True
        CHECK
        test "$status" = 0
    - name: Retain actual bounded inspection and original failure evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commercial-channel-hotel-feeds-20261113-update10-readiness1-result
        path: ${{ runner.temp }}/readiness-evidence
        retention-days: 14
        if-no-files-found: error
    - name: Remove ephemeral connection and reader files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/nightly-pending-read.php"
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
