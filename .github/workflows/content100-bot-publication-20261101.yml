name: Release only the verified TV13941 no-write hold
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 62fc5cf8cf5cb3e41b370a808c2281d27ae83da7
  EXPECTED_READER_MAIN_SHA: 4bcc3c52ed9c6bff98ff2a26707144cca71426ff
  EXPECTED_READER_DELIVERY_RUN_ID: '43590528854'
  EXPECTED_READER_DELIVERY_PATH: .github/workflows/bootstrap-anytour-data.yml
  EXPECTED_READER_DELIVERY_EVENT: push
  EXPECTED_READER_SOURCE_SHA256: 6628fe156013bb6e856313bc2d7f058a54da21325768fbc9fb1886ce749134e3
jobs:
  inspect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/content100-bot-publication-20261101' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate the exact hold-only instance before credentials
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        mkdir -p "$RUNNER_TEMP/monitor-price-incident-private" "$RUNNER_TEMP/monitor-price-incident-safe"
        python3 - <<'PY'
        import ast,hashlib,pathlib
        root=pathlib.Path('tools/direct_demand/operations')
        pins={'release-monitor-price-h13941-no-write-hold-20261115.php': 'ed81ebae3cbef567694a8d18c820808e18535aea269f1e1d617e261f13c0af7d', 'test-release-monitor-price-h13941-no-write-hold-20261115.php': '2202145892756766a9d0647fdece356f3e5f5ae04791ebfc0a69ce8f82329c29', 'monitor-price-hook-contract.php': 'e07d3dee887c0801c9832fc24ba6e3325c6c2d246353b56a489674cb2c4b5439', 'monitor-price-contract.php': 'd5382b0bf62ca90f1f87c3c8c69b7cd095dc6f2f34d05e7b832aa0aa387b0445', 'verify-commercial-source.py': '5e2a31e62984792225fc57f512b508c5975d1ec463413f18bddb29bfa0aa82fb'}
        for name,sha in pins.items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
        ast.parse((root/'verify-commercial-source.py').read_text())
        PY
        php -n -l tools/direct_demand/operations/release-monitor-price-h13941-no-write-hold-20261115.php
        php -n tools/direct_demand/operations/test-release-monitor-price-h13941-no-write-hold-20261115.php
        python3 - <<'PY'
        import pathlib,os,hashlib
        root=pathlib.Path('tools/direct_demand/operations');prefix='<?php\ndeclare(strict_types=1);\n'
        def source(name):
         raw=(root/name).read_text();assert raw.startswith(prefix),name;return raw[len(prefix):]
        contract=source('monitor-price-contract.php')
        hook=source('monitor-price-hook-contract.php');assert hook.count("require_once __DIR__.'/monitor-price-contract.php';")==1
        release=source('release-monitor-price-h13941-no-write-hold-20261115.php');assert release.count("require_once __DIR__.'/monitor-price-hook-contract.php';")==1
        bundle=prefix+contract+'\n'+hook.replace("require_once __DIR__.'/monitor-price-contract.php';",'')+'\n'+release.replace("require_once __DIR__.'/monitor-price-hook-contract.php';",'')
        assert hashlib.sha256(bundle.encode()).hexdigest()=='4cb3afb5674aea980eb91ea7fbe53fc9c0d82f217c1c9fbd9f0bd77c6af9067c'
        pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-private','validated-h13941-release.php').write_text(bundle)
        print('H13941_BUNDLE_SHA256=4cb3afb5674aea980eb91ea7fbe53fc9c0d82f217c1c9fbd9f0bd77c6af9067c')
        PY
        php -n -l "$RUNNER_TEMP/monitor-price-incident-private/validated-h13941-release.php"
    - name: Authenticate accepted current installation without rerunning it
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/monitor-price-incident-private/source"
        mkdir -p "$evidence"
        python3 - <<'PY'
        import concurrent.futures,json,os,pathlib,subprocess
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        gates=[(43651374281,'.github/workflows/deploy.yml','push'),(43651374337,'.github/workflows/retired-domain-guard.yml','push'),(43652446896,'.github/workflows/max-tls-preflight.yml','workflow_run'),(43652446895,'.github/workflows/max-production-health.yml','workflow_run'),(43652446908,'.github/workflows/telegram-production-health.yml','workflow_run'),(43652446872,'.github/workflows/publish-conversation-diagnostics.yml','workflow_run'),(43652446977,'.github/workflows/live-session-diagnostics.yml','workflow_run'),(43652446907,'.github/workflows/tour-selection-host.yml','workflow_run'),(43652446960,'.github/workflows/modeled-conversion-monitor.yml','workflow_run')]
        def check(g):
         rid,path,event=g
         r=json.loads(subprocess.check_output(['gh','api','--method','GET','-H','Cache-Control: no-cache',f'repos/pyatkoff/max-search-bot/actions/runs/{rid}']))
         assert r['id']==rid and r['run_attempt']==1 and r['head_sha']==expected and r['head_branch']=='main'
         assert r['path']==path and r['event']==event and r['status']=='completed' and r['conclusion']=='success'
         if event=='workflow_run':assert r['display_title']=='deploy-proof:v1:43651374281:1'
         return {'run_id':rid,'path':path,'conclusion':'success','attempt':1}
        with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(check,gates))
        pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-safe','original-installation.json').write_text(json.dumps({'installed_sha':expected,'gates':results}))
        PY
        gh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/git/ref/heads/main > "$evidence/main.json"
        gh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43651374281 > "$evidence/verify_run.json"
        gh api --method GET -H 'Cache-Control: no-cache' 'repos/pyatkoff/max-search-bot/actions/runs/43651374281/jobs?per_page=20' > "$evidence/verify_jobs.json"
        gh api --method GET -H 'Cache-Control: no-cache' repos/pyatkoff/max-search-bot/actions/runs/43652446896 > "$evidence/tls_run.json"
        gh api --method GET -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/commits/$EXPECTED_PRODUCTION_SHA" > "$evidence/source_commit.json"
        tree_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "$evidence/source_commit.json")"
        gh api --method GET -H 'Cache-Control: no-cache' "repos/pyatkoff/max-search-bot/git/trees/$tree_sha?recursive=1" > "$evidence/source_tree.json"
        python3 tools/direct_demand/operations/verify-commercial-source.py --expected-source "$EXPECTED_PRODUCTION_SHA" --evidence-dir "$evidence"
    - name: Authenticate the original hold proof and one new exact release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import hashlib,io,json,os,pathlib,subprocess,zipfile
        repo='repos/pyatkoff/max-search-bot/'
        parent='52f4c8ff746d42a1a686cc799fc9acbde71bda8b'
        safe=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-safe')
        def raw_get(path):return subprocess.check_output(['gh','api','--allow-escape-sequences','--method','GET','-H','Cache-Control: no-cache',path],stderr=subprocess.PIPE)
        def get(path):return json.loads(raw_get(repo+path))
        assert get('git/ref/heads/main')['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert get('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA']
        owner=get('issues/comments/6818332618')
        assert owner['user']['id']==226193297 and owner['body'].startswith('ACTIVE 15 Nov: release verified TV13941 hold; preserve old terminal; no replay.')
        publisher=get('issues/comments/6775467253')
        assert publisher['user']['id']==226193297 and publisher['body'].strip()=='PR1541: установлено, выпуск свободен'
        event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
        assert event['before']==parent and event['after']==os.environ['GITHUB_SHA'] and event['ref']=='refs/heads/audit/content100-bot-publication-20261101'
        assert event['deleted'] is False and event['forced'] is False
        run=get('actions/runs/'+os.environ['GITHUB_RUN_ID'])
        assert run['event']=='push' and run['run_attempt']==1 and run['head_sha']==os.environ['GITHUB_SHA']
        assert run['head_branch']=='audit/content100-bot-publication-20261101' and run['path']=='.github/workflows/content100-bot-publication-20261101.yml'
        assert run['actor']['id']==run['triggering_actor']['id']==226193297
        assert [p['sha'] for p in get('git/commits/'+os.environ['GITHUB_SHA'])['parents']]==[parent]

        read=get('actions/runs/43656538207')
        assert read['id']==43656538207 and read['run_attempt']==1 and read['event']=='push' and read['head_sha']==parent
        assert read['head_branch']==run['head_branch'] and read['path']==run['path'] and read['status']=='completed' and read['conclusion']=='success'
        assert owner['updated_at']>=read['updated_at']
        read_job=get('actions/jobs/132636184443')
        assert read_job['run_id']==43656538207 and read_job['run_attempt']==1 and read_job['head_sha']==parent
        assert read_job['name']=='inspect' and read_job['status']=='completed' and read_job['conclusion']=='success'
        artifact=get('actions/artifacts/14138910437');zip_sha='1dcdeab55158c51fbd3cd3a832abc692f92e364410326dac65ca28cbcbf2fea2'
        assert artifact['id']==14138910437 and artifact['expired'] is False and artifact['digest']=='sha256:'+zip_sha and artifact['size_in_bytes']==127655
        assert artifact['workflow_run']['id']==43656538207 and artifact['workflow_run']['head_sha']==parent
        archive=raw_get(repo+'actions/artifacts/14138910437/zip')
        assert len(archive)==127655 and hashlib.sha256(archive).hexdigest()==zip_sha
        with zipfile.ZipFile(io.BytesIO(archive)) as z:
         infos=z.infolist();names=[i.filename for i in infos]
         assert len(names)==len(set(names))<=16 and all(i.file_size<=1000000 for i in infos) and sum(i.file_size for i in infos)<4000000
         raw=z.read('held-price-read.json')
        payload_sha='e150e148cdba131eb65dec6c7f32c9bf227ea2f208921443dc0ab40d834be619'
        assert raw.endswith(b'\n') and hashlib.sha256(raw[:-1]).hexdigest()==payload_sha
        d=json.loads(raw);assert d['ok'] is True and d['mode']=='read_only_monitor_hold_reconciliation'
        assert d['original_run_id']=='43654792363' and d['target_tourvisor_hotel_id']==13941 and d['expected_installed_sha']==os.environ['EXPECTED_PRODUCTION_SHA']
        assert d['read_complete'] is True and d['held_files_unchanged'] is True and d['pending'] is None and d['held_hotel_ids']==[13941]
        assert {k:d['global_journal'][k] for k in ['sha256','bytes','line_count']}=={'sha256':'9ef0201977d5b54db1d4cc8a3de738d8a57e6e7230456afeb3f830eb2cd06fbe','bytes':211053266,'line_count':2609}
        assert d['completed_count']==523 and d['completed_tuple_sha256']=='5059293b995932fae3d21cba2c886ac1e5170717c38fe3dd51883488f8dd2f09'
        assert d['target_completed']['operation']=='commercial-monitor-price-h13941-33b7f724aadc7638537fa700b6a00152519eace32577cc4166983039f6555ad0'
        assert d['target_completed']['tuple_sha256']=='3872ccc7e2b7a7e850f9a80b05861377b504ef5fd9637cbba71d9c150723b791'
        assert d['held_child_journal']['sha256']=='2bec9d162fd7333f1559cd114ae29d79e6de3338dc9bfa1e4342496df17c7a74'
        assert d['held_child']['operation']=='commercial-monitor-price-h13941-6e54afb665548e85bb631cc09587f695f7b0c708a39a4add65f22402cc82a3c9'
        assert d['held_child']['all_history_posts_configs_empty'] is True and d['held_child']['all_history_complete_false'] is True
        assert d['held_child']['terminal']['preflight_error']=='max_read_failed' and d['held_child']['terminal']['child_exit_code']==2
        assert d['held_child']['current_native_message_readback'] is False
        assert all(type(d[k]) is int and d[k]==0 for k in ['journal_writes','database_calls','provider_calls','network_calls','hook_executions','process_signals'])
        (safe/'original-h13941-read.json').write_bytes(raw)

        original=get('actions/runs/43654792363')
        assert original['run_attempt']==1 and original['event']=='push' and original['head_sha']=='f773d5bb8ff7b04273e65e6ef2d781d46b3eafda'
        assert original['status']=='completed' and original['conclusion']=='failure'
        prior=get('actions/runs/43537828604')
        assert prior['id']==43537828604 and prior['run_attempt']==1 and prior['event']=='push' and prior['head_sha']=='f28bd5213b48c8ddb14fd39ee0e19b67446de750'
        assert prior['head_branch']==run['head_branch'] and prior['path']==run['path'] and prior['status']=='completed' and prior['conclusion']=='success'
        pa=get('actions/artifacts/14090747887');prior_zip_sha='ef20cfa070be9e083a57e0db8e74a60ad8eb3bda4e47d3e5f6a6ebae76f51d5c'
        assert pa['id']==14090747887 and pa['expired'] is False and pa['digest']=='sha256:'+prior_zip_sha and pa['size_in_bytes']==43548
        assert pa['workflow_run']['id']==43537828604 and pa['workflow_run']['head_sha']==prior['head_sha']
        prior_archive=raw_get(repo+'actions/artifacts/14090747887/zip')
        assert len(prior_archive)==43548 and hashlib.sha256(prior_archive).hexdigest()==prior_zip_sha
        with zipfile.ZipFile(io.BytesIO(prior_archive)) as z:
         assert set(z.namelist())=={'maintenance.json','maintenance.stdout','original-installation.json'} and len(z.infolist())==3
         prior_raw=z.read('maintenance.json')
        assert hashlib.sha256(prior_raw).hexdigest()=='e59492435071d14e2eb374eaab03416b7d83675852d05e6aab58a16d0b341b31'
        u=next(x for x in json.loads(prior_raw)['updates'] if x['tourvisor_hotel_id']==13941)
        assert u['operation']==d['target_completed']['operation'] and u['feed_operation']==d['target_completed']['feed_operation']
        assert {p['platform']:(p['publication_id'],p['version_id']) for p in u['posts']}=={'max':(587,4893),'telegram':(578,4894)}
        (safe/'original-prior-maintenance13941.json').write_text(json.dumps(u,ensure_ascii=False,indent=2)+'\n')
        proof={'mode':'exact_hotel_hold_only_release','target_hotel':13941,'current_source':os.environ['GITHUB_SHA'],'parent':parent,
         'read_run_id':43656538207,'read_artifact_id':14138910437,'read_zip_sha256':zip_sha,'read_payload_sha256':payload_sha,
         'original_run_id':43654792363,'original_conclusion':'failure','prior_maintenance_run_id':43537828604,'prior_zip_sha256':prior_zip_sha,
         'old_record_replay':False,'same_owner':True,'publisher_free':True,'new_original_push':True,'price_hook_execution_authorized':False,
         'allowed_mutation':'exactly one global state append removing only hold13941; preserve original terminal and every completed entry'}
        (safe/'h13941-release-admission.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
        print('MONITOR_H13941_RELEASE_ADMISSION='+json.dumps(proof,ensure_ascii=False))
        PY
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        raw="$DEPLOY_SSH_KEY_VALUE"
        if [[ "$raw" == *"PRIVATE KEY"* ]]; then
          if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
        else
          printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
        fi
        ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import os,re,subprocess,base64,hashlib,pathlib
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
        assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
        scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
        matches=[]
        for line in scan.stdout.splitlines():
          fields=line.split()
          if len(fields)<3 or fields[0].startswith('#'):continue
          try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
          except Exception:continue
          if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
        assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
        pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
        PY
    - name: Release only the exact global hold once with current native MAX proof
      shell: bash
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re,shlex,subprocess
        safe=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-safe')
        private=pathlib.Path(os.environ['RUNNER_TEMP'],'monitor-price-incident-private')
        expected=os.environ['EXPECTED_PRODUCTION_SHA']
        assert expected=='62fc5cf8cf5cb3e41b370a808c2281d27ae83da7'
        host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
        assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
        source=(private/'validated-h13941-release.php').read_bytes()
        assert hashlib.sha256(source).hexdigest()=='4cb3afb5674aea980eb91ea7fbe53fc9c0d82f217c1c9fbd9f0bd77c6af9067c'
        remote="""set -eu
        cd /var/www/anytoour/data/www/app.anytoour.ru
        test "$(git --no-optional-locks -c core.fsmonitor=false rev-parse --verify HEAD)" = EXPECTED_SHA
        test -z "$(git --no-optional-locks -c core.fsmonitor=false status --porcelain --untracked-files=no)"
        set +e
        php -d display_errors=0 -d log_errors=0
        release_rc=$?
        set -e
        test "$(git --no-optional-locks -c core.fsmonitor=false rev-parse --verify HEAD)" = EXPECTED_SHA
        test -z "$(git --no-optional-locks -c core.fsmonitor=false status --porcelain --untracked-files=no)"
        printf 'RUNTIME_SOURCE_HOLD_RELEASE_CHECK=%s\n' EXPECTED_SHA
        exit "$release_rc"
        """.replace('EXPECTED_SHA',shlex.quote(expected))
        argv=['ssh','-i',os.environ['RUNNER_TEMP']+'/channel_key','-o','BatchMode=yes','-o','ConnectTimeout=10',
         '-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','GlobalKnownHostsFile=/dev/null',
         '-o','UserKnownHostsFile='+os.environ['RUNNER_TEMP']+'/channel_known_hosts',user+'@'+host,remote]
        # One invocation; no hook, continuation, retry, rename or replay after any outcome.
        result=subprocess.run(argv,input=source,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
        (safe/'h13941-release.stdout').write_bytes(result.stdout)
        prefix=b'MONITOR_H13941_HOLD_RELEASE='
        payloads=[line[len(prefix):] for line in result.stdout.splitlines() if line.startswith(prefix)]
        transport={'ssh_exit_code':result.returncode,'stdout_sha256':hashlib.sha256(result.stdout).hexdigest(),
         'marker_count':len(payloads),'stderr_present':bool(result.stderr),'retry_allowed':False,'write_outcome':'unknown_until_exact_receipt'}
        if len(payloads)==1:
         (safe/'h13941-release.json').write_bytes(payloads[0]+b'\n');transport['result_sha256']=hashlib.sha256(payloads[0]).hexdigest()
        (safe/'h13941-release-transport.json').write_text(json.dumps(transport,indent=2)+'\n')
        print('MONITOR_H13941_RELEASE_TRANSPORT='+json.dumps(transport))
        if len(payloads)==1:print(prefix.decode()+payloads[0].decode())
        assert result.returncode==0 and len(payloads)==1,'hold_release_not_confirmed_read_original_result'
        d=json.loads(payloads[0])
        assert d['ok'] is True and d['mode']=='release_exact_hotel_no_write_hold' and d['tourvisor_hotel_id']==13941
        assert d['operation']=='commercial-monitor-price-h13941-6e54afb665548e85bb631cc09587f695f7b0c708a39a4add65f22402cc82a3c9'
        assert d['journal_write_attempts']==d['journal_appends']==1 and d['write_outcome']=='global_append_verified' and d['hold_removed'] is True
        assert all(type(d[k]) is int and d[k]==0 for k in ['child_journal_writes','database_writes','post_edits','new_posts','feed_writes','configuration_writes','supplier_calls','site_writes','provider_write_requests'])
        assert d['provider_read_requests']==7 and d['pending'] is None and d['preserved_completed'] is True and d['preserved_completed_count']==523
        before=d['before'];after=d['after']
        assert before['global']=={'sha256':'9ef0201977d5b54db1d4cc8a3de738d8a57e6e7230456afeb3f830eb2cd06fbe','bytes':211053266,'lines':2609}
        assert after['global']['lines']==2610 and 211053266<after['global']['bytes']<=213053266
        assert after['hold_present'] is False and after['pending'] is None
        assert before['child']==after['child']=={'sha256':'2bec9d162fd7333f1559cd114ae29d79e6de3338dc9bfa1e4342496df17c7a74','bytes':15144,'lines':2}
