name: Prepare finite noquote hotel links from original current contexts
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: f486099f3aaaa79b4eccad148eb2d4a80981688a
  LINK_SCOPE_FILENAME: commercial-hotel-search-links-20261105-context22-ten6-scope.json
  EXPECTED_LINK_SCOPE_SHA256: 79649aec85cb577cfd08dafa709e4d97e76228b669bc5889ba77e489b3b3b07e
  LINK_CONTEXT_RUN: 42030425796
  LINK_CONTEXT_SOURCE_SHA: 28e3741fa40240e4287c8f3b0340891f3b57beab
jobs:
  prepare:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-context22-ten6
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 42030425796
          path: ${{ runner.temp }}/original-link-context
      - name: Prepare exact native filters and only new actual-input cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -m py_compile tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-data-bound.py
          python3 tools/direct_demand/operations/prepare-hotel-search-links-explicit-noquote-20261105-data-bound.py
          for file in "$RUNNER_TEMP"/hotel-search-links-prepared/*/update.php; do
            php -l "$file"
            ANYTOUR_CURRENT_LINK_OFFER_NEW_INPUT_CASES=1 php "$file"
          done
      - name: Retain only original private frozen manifests approvals frames scripts and intent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-hotel-search-links-20261105-ten6-prepared1
          path: ${{ runner.temp }}/hotel-search-links-prepared
          retention-days: 14
          if-no-files-found: warn
