name: Inspect only the retained Palace quote response
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consume the already-retained quote without a new gateway request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41609029830 --repo pyatkoff/max-search-bot --name commercial-price-monitor-20261103-quote1 --dir "$RUNNER_TEMP/retained-quote1"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'retained-quote1/channel-preflight.json').read_text().splitlines()[-1])
          assert d['operation']=='commercial-price-monitor-20261103-quote1' and d['gateway_requests_attempted']==1 and d['http_status']==200 and d['ok']
          q=d['gateway_response'];assert isinstance(q,dict) and isinstance(q['flights'],list) and 1<=len(q['flights'])<=30
          def leg(v):
              return {'number':v.get('number'),'company_name':(v.get('company') or {}).get('name'),'plane':v.get('plane'),'class':v.get('class'),'departure':{k:v.get('departure',{}).get(k) for k in ('date','time')},'arrival':{k:v.get('arrival',{}).get(k) for k in ('date','time')},'onDemand':v.get('onDemand'),'noPlaces':v.get('noPlaces'),'baggage':v.get('baggage'),'carryOn':v.get('carryOn')}
          rows=[{'index':i,'isDefault':f.get('isDefault'),'dateForward':f.get('dateForward'),'dateBackward':f.get('dateBackward'),'price':f.get('price'),'fuelCharge':f.get('fuelCharge'),'forward':[leg(v) for v in f.get('forward',[])],'backward':[leg(v) for v in f.get('backward',[])]} for i,f in enumerate(q['flights'])]
          out={'operation':'commercial-price-monitor-20261103-quote1-retained-inspect','mode':'inspect_retained_quote_only','new_gateway_requests':0,'server_connections':0,'message_edits':0,'source_response_sha256':d['response_sha256'],'request_started_epoch_utc':d['request_started_epoch_utc'],'response_received_epoch_utc':d['response_received_epoch_utc'],'retained_terms':d['retained_terms'],'info':q.get('info'),'error':q.get('error'),'quotes':rows}
          print(json.dumps(out,ensure_ascii=False))
          PY
