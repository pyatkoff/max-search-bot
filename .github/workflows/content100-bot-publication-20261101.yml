name: Read seven newly resolved official hotel factsheets
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read seven fixed newly resolved public PDF factsheets
        run: |
          python3 -m pip install --quiet pypdf==6.1.1
          python3 tools/direct_demand/operations/inspect-hotel-media-20261102-3.py
      - name: Retain bounded public media source evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-batch15-new-factsheets-20261103-read1
          path: public-media-sources.json
          retention-days: 14
          if-no-files-found: error
