name: Apply approved content quality revision to 159 existing hotel cards
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 160e019701165cd53dd5a9be0fa3db533d82120e
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify approved text, legacy title behavior and native formatting before credentials
      shell: bash
      run: "set -euo pipefail\numask 077\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\npython3 - <<'PY'\n\
        import hashlib,pathlib\np=pathlib.Path('tools/direct_demand/operations')\npins={'title-only-executor-template.php': '5ca5508525e1e5d29d627633c4fc6e00bbd49920f1db5ddf8bc2d487e86c4e7b',\
        \ 'caption-quality-functions.php': 'ce97ba5666b3b2786c2d433209feca119801863b9af10726d0bc4a3dba23e9f1', 'test-caption-quality.php': '6e1042fe779dd8b2daaeb8830669298ae21f1b612c5c3eb82191f9d4dac2a034',\
        \ 'prepare-caption-quality.py': '9ee96ff958c535f39e16e73c1cd5e04fcaa993a11f832141e5581aa53348287a', 'commercial-content-quality-20261108-inputs.json.gz':\
        \ '5628cca7b6fc1919bb28178423c2066b773c5bd903ede56ed7e69d4891f0230f', 'title-only-markup-functions.php': 'cd5ff08ef287c1103d881514c8f7be0eb9cc24b552130cec2f5005899e96c1eb',\
        \ 'test-title-only-markup.php': 'e5632aa71cf0e7718d5709ba8ef059dc9d9d484f4156acb025eb6f1936573860', 'read-short-heading-scope-20261108.php':\
        \ '16b2f660709bda1995fa4edbf90e67651338d54d25244e1b54cdabf36ec2aaea', 'short-heading-scope-20261107.json': 'd1c11d29609483213cd8988aeb398fca48c9d78b8a3588297066cf4926398724'}\n\
        for name,digest in pins.items():\n    assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,(name,'reviewed_script_changed')\n\
        executor=(p/'title-only-executor-template.php').read_text()\nfor name in ['title-only-markup-functions.php','caption-quality-functions.php']:\n\
        \    assert (p/name).read_text().split('declare(strict_types=1);',1)[1].strip() in executor\ncompile((p/'prepare-caption-quality.py').read_text(),str(p/'prepare-caption-quality.py'),'exec')\n\
        PY\nphp -l tools/direct_demand/operations/title-only-executor-template.php\nphp -l tools/direct_demand/operations/caption-quality-functions.php\n\
        php -l tools/direct_demand/operations/test-caption-quality.php\nphp tools/direct_demand/operations/test-title-only-markup.php\nphp tools/direct_demand/operations/test-caption-quality.php\n\
