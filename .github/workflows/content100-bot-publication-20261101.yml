name: Complete original TV2651 operation and inspect all 481 hotels
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/content100-bot-publication-20261101.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - name: Verify original recovery inspection and identical bundle before credentials
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ngh api repos/pyatkoff/max-search-bot/actions/runs/43196343227 > \"$RUNNER_TEMP/accepted-recovery-inspection.json\"\npython3 - <<'PYRECOVERYPROOF'\nimport json,os,pathlib\np=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'accepted-recovery-inspection.json').read_text())\nassert p['id']==43196343227 and p['run_attempt']==1 and p['head_sha']=='7fbb2b2da5909c279698ba1383d2608aa33162ec' and p['status']=='completed' and p['conclusion']=='success','ORIGINAL_RECOVERY_INSPECTION_NOT_ACCEPTED'\nprint('ORIGINAL_RECOVERY_INSPECTION_ACCEPTED')\nPYRECOVERYPROOF\ngh api repos/pyatkoff/max-search-bot/actions/runs/43181493179 > \"$RUNNER_TEMP/accepted-source-validation.json\"\ngh api repos/pyatkoff/max-search-bot/actions/runs/43194108781 > \"$RUNNER_TEMP/original-deployment-before-operation.json\"\ngh api repos/pyatkoff/max-search-bot/git/ref/heads/main > \"$RUNNER_TEMP/main-before-operation.json\"\ngh api repos/pyatkoff/poisk-turov-test/git/ref/heads/main > \"$RUNNER_TEMP/collector-main-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/contents/.github/workflows/collect-anytour-tours.yml?ref=main' > \"$RUNNER_TEMP/collector-source-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/actions/workflows/collect-anytour-tours.yml/runs?event=schedule&status=in_progress&per_page=100' > \"$RUNNER_TEMP/collector-active-before-operation.json\"\ngh api 'repos/pyatkoff/poisk-turov-test/actions/workflows/collect-anytour-tours.yml/runs?event=schedule&status=queued&per_page=100' > \"$RUNNER_TEMP/collector-queued-before-operation.json\"\npython3 - <<'PYCURRENT'\nimport base64,hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\nread=lambda name:json.loads((root/name).read_text())\nvalidation=read('accepted-source-validation.json')\nassert validation['id']==43181493179 and validation['head_sha']==os.environ['EXPECTED_SOURCE_SHA'] and validation['run_attempt']==1 and validation['status']=='completed' and validation['conclusion']=='success','ORIGINAL_NATIVE_SOURCE_PROOF_NOT_ACCEPTED'\ndeployment=read('original-deployment-before-operation.json')\nassert deployment['id']==43194108781 and deployment['head_sha']==os.environ['EXPECTED_PRODUCTION_SHA'] and deployment['run_attempt']==1 and deployment['status']=='completed' and deployment['conclusion']=='success','ORIGINAL_DEPLOYMENT_NOT_ACCEPTED'\nassert read('main-before-operation.json')['object']['sha']==os.environ['EXPECTED_PRODUCTION_SHA'],'CURRENT_MAIN_CHANGED_BEFORE_CREDENTIALS'\nassert read('collector-main-before-operation.json')['object']['sha']==os.environ['EXPECTED_COLLECTOR_MAIN_SHA'],'COLLECTOR_MAIN_CHANGED_BEFORE_CREDENTIALS'\ncode=base64.b64decode(read('collector-source-before-operation.json')['content'],validate=False)\nassert hashlib.sha256(code).hexdigest()==os.environ['EXPECTED_COLLECTOR_FILE_SHA256'],'COLLECTOR_CALLBACK_SOURCE_CHANGED'\nfor name in ('collector-active-before-operation.json','collector-queued-before-operation.json'):\n    runs=read(name)\n    assert runs['total_count']<100 and len(runs['workflow_runs'])==runs['total_count'],'ACTIVE_RUN_INVENTORY_TRUNCATED'\n    for active in runs['workflow_runs']:\n        assert active['head_sha']==os.environ['EXPECTED_COLLECTOR_MAIN_SHA'],'OLD_COLLECTOR_CALLBACK_STILL_ACTIVE'\nprint('ORIGINAL_SOURCE_DEPLOYMENT_AND_COLLECTOR_ADMISSION_OK')\nPYCURRENT\npython3 tools/direct_demand/operations/build-monitor-price-hook.py \"$RUNNER_TEMP/monitor-price-hook.php\"\npython3 - <<'PYHOOK'\nimport hashlib,os,pathlib\nbundle=pathlib.Path(os.environ['RUNNER_TEMP'])/'monitor-price-hook.php'\nassert hashlib.sha256(bundle.read_bytes()).hexdigest()==os.environ['EXPECTED_HOOK_SHA256'],'NATIVE_TESTED_HOOK_BYTES_CHANGED'\nprint('EXACT_NATIVE_TESTED_HOOK_OK')\nPYHOOK\nprintf '%s  %s\\n' \"$EXPECTED_RECOVERY_DRIVER_SHA256\" \"tools/direct_demand/operations/reconcile-pending-2651.php\" | sha256sum --check\nprintf '%s  %s\\n' \"$EXPECTED_RECOVERY_BUILDER_SHA256\" \"tools/direct_demand/operations/build-reconcile-pending-2651.py\" | sha256sum --check\npython3 tools/direct_demand/operations/build-reconcile-pending-2651.py \"$RUNNER_TEMP/monitor-price-hook.php\" \"$RUNNER_TEMP/reconcile-pending-2651.php\"\nprintf '%s  %s\\n' \"$EXPECTED_RECOVERY_BUNDLE_SHA256\" \"$RUNNER_TEMP/reconcile-pending-2651.php\" | sha256sum --check\n"
    - name: Prepare existing server connection
      env:
        DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\nraw=\"$DEPLOY_SSH_KEY_VALUE\"\nif [[ \"$raw\" == *\"PRIVATE KEY\"* ]]; then\n  if [[ \"$raw\" == *'\\n'* ]]; then printf '%b\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; else printf '%s\\n' \"$raw\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse\n  printf '%s' \"$raw\" | base64 --decode > \"$RUNNER_TEMP/channel_key\"\nfi\nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\n"
    - name: Pin existing server host-key continuity
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re,subprocess,base64,hashlib,pathlib\nhost=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',user)\nscan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)\nmatches=[]\nfor line in scan.stdout.splitlines():\n  fields=line.split()\n  if len(fields)<3 or fields[0].startswith('#'):continue\n  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')\n  except Exception:continue\n  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)\nassert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\n'.join(matches)+'\\n')\nPY\n"
    - name: Complete only the proven original TV2651 operation once
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" ''cd /var/www/anytoour/data/www/app.anytoour.ru && test "$(git rev-parse --verify HEAD)" = 53652e9230f2778d900ca4423557a484cdbd0ea4 && ANYTOUR_MONITOR_PENDING_RECONCILE_APPLY=1 php'' < "$RUNNER_TEMP/reconcile-pending-2651.php" | tee "$RUNNER_TEMP/monitor-pending-2651-reconciliation.jsonl"

        '
    - name: Inspect the current 481-hotel roster without writes
      env:
        DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        umask 077

        ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" ''cd /var/www/anytoour/data/www/app.anytoour.ru && test "$(git rev-parse --verify HEAD)" = 53652e9230f2778d900ca4423557a484cdbd0ea4 && ANYTOUR_MONITOR_HOOK_INSPECT=1 php'' < "$RUNNER_TEMP/monitor-price-hook.php" | tee "$RUNNER_TEMP/monitor-price-post-recovery-inspection.jsonl"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitor-pending-2651-original-recovery
        path: '${{ runner.temp }}/monitor-pending-2651-reconciliation.jsonl

          ${{ runner.temp }}/monitor-price-post-recovery-inspection.jsonl'
        retention-days: 14
    - name: Remove ephemeral connection and bundle
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/monitor-price-hook.php" "$RUNNER_TEMP/reconcile-pending-2651.php"
env:
  EXPECTED_PRODUCTION_SHA: 53652e9230f2778d900ca4423557a484cdbd0ea4
  EXPECTED_SOURCE_SHA: 8f7faaeea18e2d5e1d6d07d660c761c51ccf7a6c
  EXPECTED_COLLECTOR_MAIN_SHA: 17449ef5eb74edf1c60197ef3b9f00e40feaf485
  EXPECTED_COLLECTOR_FILE_SHA256: e186d3dbc534d37d956a863a468ea81c1a120e514dc412bc73d0fbb5645b0cd0
  EXPECTED_HOOK_SHA256: c165dc1a01e46e5e74da119a205caf8cde32b04b03fead67ae530d64efb15727
  EXPECTED_RECOVERY_DRIVER_SHA256: 0db3708f28b43d8988fe4bc4715adfa93c9daa62c20becf25da460e968a60d43
  EXPECTED_RECOVERY_BUILDER_SHA256: 5148159d460e425bd369f77298749a745f0a614da47dfc2462787c0d9b3c8c76
  EXPECTED_RECOVERY_BUNDLE_SHA256: c0438233942e2e4abf6a3abbf9fe14a81a0f781f79fcd26499d931ee8f694a1d
