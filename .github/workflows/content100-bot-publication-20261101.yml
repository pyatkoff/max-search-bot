name: Prepare exact unpriced hotel search proposal without permission or supplier execution
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/content100-bot-publication-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: commercial-price-monitor-20261105-read11-new672-input1
          github-token: ${{ github.token }}
          repository: pyatkoff/max-search-bot
          run-id: 41945775526
          path: ${{ runner.temp }}/original-read11
      - name: Prepare current unpriced native scope without any server, source or supplier calls
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 tools/direct_demand/operations/prepare-published-price-refresh-proposal-20261105-2.py
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-price-monitor-20261105-published-refresh-proposal2
          path: ${{ runner.temp }}/published-price-refresh-proposal2.json
          retention-days: 14
          if-no-files-found: error
