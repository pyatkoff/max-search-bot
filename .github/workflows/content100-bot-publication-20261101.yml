name: Inspect Pavel supplied Moscow YML once without searches or price edits
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: [.github/workflows/content100-bot-publication-20261101.yml]
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations
          sparse-checkout-cone-mode: true
      - name: Read the exact newly supplied public feed once with a strict size and time limit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 tools/direct_demand/operations/inspect-pavel-moscow-yml-20261104.py
      - name: Retain original public source privately with bounded schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-price-source-20261104-moscow-yml-inspection1
          path: |
            ${{ runner.temp }}/moscow_any.source.xml
            ${{ runner.temp }}/moscow-yml-inspection-summary.json
          retention-days: 14
          if-no-files-found: warn
