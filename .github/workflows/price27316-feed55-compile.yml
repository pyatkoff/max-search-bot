          fetch_source tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-nightly-guard.php 26fd1f24bc79f39cacc8cd112b6bd5e9dcde9f0bfde6061363955272435b4029
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"feed55/source-repo/tools/direct_demand/operations/commercial-channel-hotel-feeds-20261113-update10-nightly-guard.php"
          old=b"483f9f1cd853fdf1808523e72d466e2acd0866ec6ae35de049ada38b5cc128f9"
          new=b"7245b007e8b7fe2d0c3e0fe7b60a9cdff108d0d8d7a6a7b9ef74d69d191baf3e"
          raw=p.read_bytes()
          assert raw.count(old)==1 and new not in raw
          patched=raw.replace(old,new,1)
          assert hashlib.sha256(patched).hexdigest()=="408c7d92b54282cec82a29fd6b5a1b77f25d262ab189c9666791b5c242030209"
          p.write_bytes(patched)
          PY
          cp tools/direct_demand/operations/feed55/write/route-p*.json "$source/tools/direct_demand/operations/feed55/write/"
          fetch_artifact() {
            local id="$1" expected="$2" output="$3"
            gh api --method GET "/repos/pyatkoff/max-search-bot/actions/artifacts/$id/zip" >"$output"
            echo "$expected  $output" | sha256sum --check --strict
          }
          fetch_artifact 14372083310 17fba152e52af6491df4110994fb5a3122fd72485c7224c034459b9ac93d5e38 "$root/a1.zip"
          fetch_artifact 14374865792 05fa07cfa2e7677866f572d31a87943b068753c27bde27b186532ddb0361f49c "$root/a2.zip"
          fetch_artifact 14379078087 f159212971e5674ec1088a561189eb031ad17a15a07e7f23035e4dd645ee6507 "$root/a4.zip"
          fetch_artifact 14380765022 b1ef1f78f85964673d747316b60081ece6c2923358791cdb748a61f97e98e3a0 "$root/a5.zip"
          fetch_artifact 14379089645 ad1b3da319be33b3dfd94b133f280c1d41c188e217869ec063b43dbefc0636d3 "$root/a9.zip"
          fetch_artifact 14384311288 091b7ccd139f208831bc5e7815b6e4453ad1281d96cd3be8bbfd978b10109f2a "$root/a12.zip"
          fetch_artifact 14384490756 dd760398c6f560372870a1294526c7161ceaa3afa5d123d26b10034c042b2790 "$root/a13.zip"
          fetch_artifact 14610338662 28d9fe3c426c8ada2eb9a0f6f5649a791ee28135ef91ef20e6cef9f3eea3662e "$root/preflight.zip"
          fetch_artifact 14609494319 ebcdb26f9798e69137ac755a89b2c9ba7fdf808d0b535183301d8d7cab1d5feb "$root/runtime-preflight.zip"
          for pair in "14372083310 1" "14374865792 2" "14379078087 4" "14380765022 5" "14379089645 9" "14384311288 12" "14384490756 13"; do
            set -- $pair
            mkdir "$root/originals/orig-$1"
            unzip -q "$root/a$2.zip" -d "$root/originals/orig-$1"
          done
          unzip -q "$root/preflight.zip" -d "$root/preflight"
          unzip -q "$root/runtime-preflight.zip" -d "$root/runtime-preflight"
          jq -e '.ok==true and .runtime_sha=="b4b65daaa472c15426a244b87ede3e6c0394626b" and .hook_sha256=="7245b007e8b7fe2d0c3e0fe7b60a9cdff108d0d8d7a6a7b9ef74d69d191baf3e" and .lock_available==true and .pending==null and .writes==0 and .provider_calls==0 and .message_sends==0' "$root/runtime-preflight/server.json" >/dev/null
          curl --fail --silent --show-error --max-time 45 --proto '=https' --tlsv1.2 \
            https://app.anytoour.ru/feed/hotel-posts-telegram.xml -o "$root/preimages/hotel-posts-telegram.xml"
          curl --fail --silent --show-error --max-time 45 --proto '=https' --tlsv1.2 \
            https://app.anytoour.ru/feed/hotel-posts-max.xml -o "$root/preimages/hotel-posts-max.xml"
          curl --fail --silent --show-error --max-time 45 --proto '=https' --tlsv1.2 \
            https://app.anytoour.ru/feed/hotel-posts-all.xml -o "$root/preimages/hotel-posts-all.xml"
      - name: Compile seven exact native writers without production access
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/feed55"
          python3 tools/direct_demand/operations/feed55/write/compile_feed55.py \
            --repo "$root/source-repo" \
            --config tools/direct_demand/operations/feed55/write/config.json \
            --config-sha256 "$CONFIG_SHA256" \
            --execution-run-id "$GITHUB_RUN_ID" \
            --originals "$root/originals" \
            --reads "$root/preflight/feed55-preflight" \
            --preimages "$root/preimages" \
            --out "$root/compiled"
          test "$(jq -r .state "$root/compiled/intent.json")" = FEED55_PREPARED_NOT_WRITTEN
          test "$(jq -r .final_pairs "$root/compiled/intent.json")" = 1055
          test "$(jq -r '[.groups[].hotels]|add' "$root/compiled/intent.json")" = 55
          test "$(jq -r .production_writes "$root/compiled/intent.json")" = 0
          test "$(find "$root/compiled" -name write.php | wc -l)" = 7
          find "$root/compiled" -name write.php -print0 | xargs -0 -n1 php -l
          mkdir "$root/deliver"
          cp "$root/compiled/intent.json" "$root/deliver/plan.json"
          jq '{state,previous_pairs,final_pairs,hotels,production_writes,groups:[.groups[]|{batch,operation,hotels,script_sha256,input_sha256,files}]}' \
            "$root/compiled/intent.json" >"$root/deliver/summary.json"
      - name: Preserve bounded compile-only plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed55-compile-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/feed55/deliver/
          retention-days: 7
          if-no-files-found: error
      - name: Prepare unchanged server connection and host pin
        if: github.event_name == 'push'
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Prepare authenticated production plan without writes
