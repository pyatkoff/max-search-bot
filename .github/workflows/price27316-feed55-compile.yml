name: FEED55 exact finite production carrier
on:
  push:
    branches: ['audit/feed55-production-20261120']
    paths: ['tools/direct_demand/operations/feed55/write/production-config.json']
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/price27316-feed55-compile.yml'
      - 'tools/direct_demand/operations/feed55/write/**'
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.run_attempt == 1 && ((github.event_name == 'push') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit/feed55-production-20261120'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIG_SHA256: 13bafa258998592fd9bbdbdc454112d05ef6b801081eb071725c89502d7a64e4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify reviewed compiler and exact root projections
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SUMS'
          ce1f237016c86dfb10364aa1d7c98e804f67151a3f0a5a2d3187a3d7c6ca75c1  tools/direct_demand/operations/feed55/write/compile_feed55.py
          d58088748ebba00b47804136d01d9586011fb35c529270cc5edcacf85159d9cb  tools/direct_demand/operations/feed55/write/owner_permit_gate.py
          4bd4aa4a58548e5bf875b63c40c38547f9d512d406fc274b78852d1e3e93922c  tools/direct_demand/operations/feed55/write/execute_feed55.py
          13bafa258998592fd9bbdbdc454112d05ef6b801081eb071725c89502d7a64e4  tools/direct_demand/operations/feed55/write/config.json
          39fc9acbde4be0caf215cdaab800d27527e7399be4e64ea134df2e1216b55d8a  tools/direct_demand/operations/feed55/write/route-p01.json
          0eb45d35679c1320af7d91e5026c991a2e8aa76c6a0a0341f8459086c6fb3531  tools/direct_demand/operations/feed55/write/route-p02.json
          7e60aa57d3b794258d2f631af6362a58068dbb556a8463fb09cb1018525e00a5  tools/direct_demand/operations/feed55/write/route-p04.json
          acf37cc5d3f2102e3498dbf7a2721ff129326712bec159edfc80305189b5387c  tools/direct_demand/operations/feed55/write/route-p05.json
          6d3ab9a57e391b0e45e82426555cacfa48f6010b504a252ed83fbc5ac9c91b90  tools/direct_demand/operations/feed55/write/route-p09.json
          3fedbb6a074e10a56dd91356289d5d7fff0053bdb30517898fb45ca61a1719be  tools/direct_demand/operations/feed55/write/route-p12.json
          384a89ca7b869bf104052cc71469f95e554217958f0439f48fb084d16f279145  tools/direct_demand/operations/feed55/write/route-p13.json
          SUMS
          python3 -m py_compile \
            tools/direct_demand/operations/feed55/write/compile_feed55.py \
            tools/direct_demand/operations/feed55/write/owner_permit_gate.py \
            tools/direct_demand/operations/feed55/write/execute_feed55.py
          python3 -m json.tool tools/direct_demand/operations/feed55/write/config.json >/dev/null
          python3 -m json.tool tools/direct_demand/operations/feed55/write/production-config.json >/dev/null
