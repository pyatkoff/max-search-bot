        run: python3 tools/direct_demand/operations/feed55/write/execute_feed55.py step 0
      - name: Preserve group 1 progress
        if: ${{ always() && github.event_name == 'push' && (steps.p01.outcome == 'success' || steps.p01.outcome == 'failure') }}
