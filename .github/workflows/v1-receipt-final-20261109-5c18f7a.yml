              diagnostic_php="<?php\ndeclare(strict_types=1);ini_set('display_errors','0');ini_set('log_errors','0');error_reporting(0);\n$level=ob_get_level();ob_start(static fn(string $s):string=>'');$ok=false;\ntry{\n $root='/var/www/anytoour/data/www/app.anytoour.ru';\n require $root.'/config.php';require_once $root.'/services/ProjectAccessService.php';require_once $root.'/services/ModeledConversionVisitProof.php';\n ProjectAccessService::initializeReadOnly();$p=ConversationDb::connection();$p->exec('SET SESSION TRANSACTION READ ONLY');\n if(ProjectConfig::projectId()!=='anytour'||(string)METRIKA_COUNTER_ID!=='98615635')throw new RuntimeException();\n $cache=ModeledConversionVisitProof::readCache(time());if(($cache['available']??false)!==true)throw new RuntimeException();\n $receipt=$cache['receipt'];$rows=ModeledConversionVisitProof::ledger($p);$byId=[];foreach($rows as$r)$byId[(string)$r['id']]=$r;\n $get=static function(string$path):array{\n  $body='';$ch=curl_init('https://api-metrika.yandex.net/'.$path);\n  curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_PROTOCOLS=>CURLPROTO_HTTPS,CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>10,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,\n   CURLOPT_HTTPHEADER=>['Authorization: OAuth '.(string)METRIKA_OAUTH_TOKEN,'Accept: application/json'],\n   CURLOPT_WRITEFUNCTION=>static function($ch,string$x)use(&$body):int{if(strlen($body)+strlen($x)>131072)return 0;$body.=$x;return strlen($x);}]);\n  $done=curl_exec($ch);$http=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);$err=curl_errno($ch);curl_close($ch);\n  if($done===false||$err!==0||$http!==200)throw new RuntimeException();\n  $d=json_decode($body,true,24,JSON_BIGINT_AS_STRING|JSON_THROW_ON_ERROR);if(!is_array($d))throw new RuntimeException();return $d;\n };\n $counter=$get('management/v1/counter/98615635')['counter']??null;\n if(!is_array($counter)||(string)$counter['id']!=='98615635'||!in_array($counter['time_zone_name']??null,DateTimeZone::listIdentifiers(DateTimeZone::ALL_WITH_BC),true))throw new RuntimeException();\n $zone=new DateTimeZone($counter['time_zone_name']);\n foreach($receipt['events']as&$e)if($e['cohort']&&$e['upload_status']==='LINKAGE_FAILURE'){\n  $r=$byId[$e['outbox_id']]??null;if(!is_array($r)||!hash_equals($e['fingerprint'],ModeledConversionVisitProof::fingerprint($r)))throw new RuntimeException();\n  $cid=(string)$r['client_id'];if(preg_match('/\\A[1-9][0-9]{0,39}\\z/D',$cid)!==1)throw new RuntimeException();\n  $filter=\"ym:s:clientID=='\".$cid.\"'\";$metrics=['ym:s:visits'];$dims=['ym:s:clientID','ym:s:dateTime'];\n  $q=['ids'=>'98615635','metrics'=>implode(',',$metrics),'dimensions'=>implode(',',$dims),'filters'=>$filter,'date1'=>gmdate('Y-m-d',(int)$r['event_unix']-22*86400),'date2'=>'today','accuracy'=>'full','limit'=>101];\n  $d=$get('stat/v1/data?'.http_build_query($q,'','&',PHP_QUERY_RFC3986));$scope=$d['query']??[];\n  if(array_map('strval',$scope['ids']??[])!==['98615635']||($scope['metrics']??null)!==$metrics||($scope['dimensions']??null)!==$dims\n   ||(($scope['filters']??null)!==$filter)||($d['sampled']??null)!==false||!is_array($d['data']??null)\n   ||count($d['data'])>=101||(int)($d['total_rows']??-1)!==count($d['data']))throw new RuntimeException();\n  $eligible=0;$later=0;$all=0;$last=null;\n  foreach($d['data']as$v){\n   if((string)($v['dimensions'][0]['name']??$v['dimensions'][0]['id']??'')!==$cid||count($v['metrics']??[])!==1)throw new RuntimeException();\n   $count=$v['metrics'][0];if(!is_numeric($count)||(float)$count<0||(float)$count!==floor((float)$count))throw new RuntimeException();\n   $date=(string)($v['dimensions'][1]['name']??$v['dimensions'][1]['id']??'');$at=DateTimeImmutable::createFromFormat('!Y-m-d H:i:s',$date,$zone);\n   if(!$at||$at->format('Y-m-d H:i:s')!==$date||$at->getTimestamp()>time())throw new RuntimeException();\n   $all+=(int)$count;$age=(int)$r['event_unix']-$at->getTimestamp();\n   if($age<0)$later+=(int)$count;elseif($age<=21*86400){$eligible+=(int)$count;$iso=gmdate('Y-m-d\\TH:i:s\\Z',$at->getTimestamp());if($last===null||$iso>$last)$last=$iso;}\n  }\n  $reason=$eligible>0?'eligible_counter_visit_but_provider_rejected':($all===0?'no_reported_client_visits':($later===$all?'only_later_client_visits':'no_eligible_counter_visit'));\n  $e['reason']=$reason;$e['failure_diagnosis']=['status'=>$reason,'eligible_visits'=>$eligible,'later_visits'=>$later,'last_eligible_visit_at'=>$last,'counter_visits'=>$all];\n }\n unset($e);\n $q=$p->prepare(\"SELECT tracker_observed_unix FROM max_channel_conversion_outbox WHERE id=? AND project_key='anytour' AND counter_id='98615635' AND transport_target=? AND value_contract=? LIMIT 1\");\n foreach($receipt['events']as&$e)if($e['cohort']){\n   $r=$byId[$e['outbox_id']]??null;if(!is_array($r)||!hash_equals($e['fingerprint'],ModeledConversionVisitProof::fingerprint($r)))throw new RuntimeException();\n   if($e['upload_status']==='LINKAGE_FAILURE'){\n     $q->execute([$r['id'],ModeledConversionValueContract::TARGET,ModeledConversionValueContract::VERSION]);$at=$q->fetchColumn();$q->closeCursor();\n     if($e['reason']==='no_reported_client_visits'&&is_numeric($at)&&(int)$r['event_unix']-(int)$at>21*86400)\n       $e['reason']='no_reported_client_visits;source_click_expired_at_signal';\n   }elseif($e['upload_status']==='PROCESSED'){\n     $filter=\"ym:s:clientID=='\".(string)$r['client_id'].\"' AND ym:s:goal==678187097\";\n     $metrics=['ym:s:visits','ym:s:goal678187097reaches','ym:s:goal678187097convertedRUBRevenue'];$dims=['ym:s:clientID','ym:s:dateTime'];\n     $query=['ids'=>'98615635','metrics'=>implode(',',$metrics),'dimensions'=>implode(',',$dims),'filters'=>$filter,\n       'date1'=>gmdate('Y-m-d',(int)$r['event_unix']-22*86400),'date2'=>'today','accuracy'=>'full','limit'=>101];\n     $report=$get('stat/v1/data?'.http_build_query($query,'','&',PHP_QUERY_RFC3986));$scope=$report['query']??[];\n     if(array_map('strval',$scope['ids']??[])!==['98615635']||($scope['metrics']??null)!==$metrics||($scope['dimensions']??null)!==$dims\n       ||($scope['filters']??null)!==$filter||($report['sampled']??null)!==false||!is_array($report['data']??null)\n       ||count($report['data'])>=101||(int)($report['total_rows']??-1)!==count($report['data']))throw new RuntimeException();\n   }\n }\n unset($e);$receipt['failure_diagnosis_checked_at']=gmdate('Y-m-d\\TH:i:s\\Z');\n ModeledConversionVisitProof::save($receipt);$ok=true;\n}catch(Throwable $ignored){}\nwhile(ob_get_level()>$level)ob_end_clean();echo json_encode(['ok'=>$ok,'provider_write_requests'=>false,'source_writes'=>false],JSON_THROW_ON_ERROR).\"\\n\";exit($ok?0:1);\n"
              diagnosed=subprocess.run(command,input=diagnostic_php.encode(),capture_output=True,timeout=60)
              assert len(diagnosed.stdout)<=4096 and len(diagnosed.stderr)<=4096
