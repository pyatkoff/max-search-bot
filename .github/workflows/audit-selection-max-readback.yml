name: Readonly existing MAX selection readback
on:
  push:
    branches: [audit/selection-max-readback-20261025]
permissions:
  contents: read
concurrency:
  group: readonly-selection-max-readback-20261025
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin authoritative source before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = '1f5e4e6d4e0033bf054cc11d19c9708a1f5518f6'
          test "$(git rev-parse HEAD^)" = '1f5e4e6d4e0033bf054cc11d19c9708a1f5518f6'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/audit-selection-max-readback.yml'
      - name: Prepare existing runtime credential
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/selection_readback_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: One readonly existing-MID comparison
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/readback.php"
          php -l "$RUNNER_TEMP/readback.php" >/dev/null
          ssh -i "$RUNNER_TEMP/selection_readback_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/anytoour/data/www/app.anytoour.ru && test \"\$(git rev-parse HEAD)\" = '1f5e4e6d4e0033bf054cc11d19c9708a1f5518f6' && git diff --quiet && git diff --cached --quiet && php -d display_errors=0" < "$RUNNER_TEMP/readback.php" 2>/dev/null
      - name: Remove ephemeral runner files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/selection_readback_key" "$RUNNER_TEMP/readback.php"
