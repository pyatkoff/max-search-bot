name: First publication of 39 remaining hotels after confirmed MAX upload refusal
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-wave7-remaining39-native-publish-20261118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'd799fa8fb114f2a9c7419579d8c11ef565f4b16d' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Verify 39 untouched inputs, photos and installed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import io
          import json
          from pathlib import Path
          import subprocess
          import zipfile
          
          REPO = 'pyatkoff/max-search-bot'
          COMMIT = '10cd3713e13a762c5585434072f9fb6fcd0e2eff'
          APP = 'cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          ORIGIN = '5f4cb9b6e0da2e2f870a11cd88aa62656f91c0d5'
          GROUPS = json.loads('''[{"number":52,"operation":"commercial-hotel-batch-20261118-52-v1","hotel_ids":[121821,76226,64998,37209,78964,46323,1589,127349,115677,2161]},{"number":53,"operation":"commercial-hotel-batch-20261118-53-v1","hotel_ids":[236,13853,48795,12104,2686,1518,64330,57682,47023,164]},{"number":54,"operation":"commercial-hotel-batch-20261118-54-v1","hotel_ids":[73893,1615,13875,73509,16943,118906,8988,1517,438,27478]},{"number":55,"operation":"commercial-hotel-batch-20261118-55-v1","hotel_ids":[1253,143,46727,1683,234,76940,1428,307,57476,56424]},{"number":56,"operation":"commercial-hotel-batch-20261118-56-v1","hotel_ids":[357,22676,59084,4518,65342,76109,135442,28470,359]}]''')
          EXPECTED = json.loads('''{"registry-receipt.json":"ae860ddc82d851965c414b46eea99679b484a484732fdb0591ba63cbfc99f38d","image-receipt.json":"739db2a87289b1d3c48a2f1f5528ed918bc41b531202dda0c1bc5bdf65ee66cd","p52-manifest.json":"73cde8a71353cb2b7b9f1d3e5813102aa616c36b169e752d231b696af150c04d","p52-approval.json":"af20dc84c41ec028b717dbc42d451dc26910c7fa281d6541f85f2ba214d31e25","p52-publisher-unexecuted.php":"c4a93bf8cc88cd8e518f744d5e10ce5d3385498a22bfdc99c789e7aea24f7781","p53-manifest.json":"4414fb8ce0d65c3363793fee6118bd94902394ff370644b907c92c6fa921dd00","p53-approval.json":"5f59fd2f1a386cf589a740f19efb34acc36c4417aab95da22a62ab3b136ed30e","p53-publisher-unexecuted.php":"9ad296a8f441e024f8433aa15fa456689fbe9de295efe19a94c412faf76bff43","p54-manifest.json":"1d275ea585b168fbd4ba5b59f8f2ed8049e1b0fbfec36fe615449f4c39a7a5c2","p54-approval.json":"e45cc704a16386b81e818c1ccf34426ec6d9df3a3b213d9cde5d3c1f14227c8d","p54-publisher-unexecuted.php":"4385389c3be6daf4c36a3e40d44cc1829b7d2b3d3f3889ad143684eb18cbd1d5","p55-manifest.json":"163690153a2c7fcead80833d249bfd3109d4e6cc8980960c68548f2b23d93386","p55-approval.json":"42e4265f3a2df7b3aaad70bffc4dfff02a4604f9bec6ba0f34f0f9abff4c3e41","p55-publisher-unexecuted.php":"e30054131caa62c833037a6418d02b924fed18eb807f76578cc6d58d5a880359","p56-manifest.json":"9dd1caf003a44151f01be6c86042a38dbd7c683e9dbdb1fefa577ed14c0e463a","p56-approval.json":"80ef5db48f4961636a9453e93abe8d731236935851b24b1c786a125fdad362c8","p56-publisher-unexecuted.php":"63e3f31dc5a2cd4fcf1a2870c931935423914fd47485c12fb125b1346f9fdab8"}''')
          
          def api(path):
              return subprocess.check_output(['gh','api',f'repos/{REPO}/{path}'],timeout=70)
          
          def info(path):
              return json.loads(api(path))
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          assert info('git/ref/heads/main')['object']['sha']==APP
          d=json.loads(base64.b64decode(info('contents/deploy_status.json?ref=diagnostics')['content']))
          release=d['repository_release']
          assert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP
          assert str(release['release']['run_id'])=='44187866614' and all(s['result']=='success' for s in release['stages'].values())
          required={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml',
                    'telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml',
                    'tour-selection-host.yml','modeled-conversion-monitor.yml'}
          gates={g['path'].rsplit('/',1)[-1]:g for g in release['closure']['gates']}
          assert required <= gates.keys()
          assert all(gates[p]['conclusion']=='success' and gates[p]['head_sha']==APP and gates[p]['run_attempt']==1 for p in required)
          
          run=info('actions/runs/44204566222')
          assert run['conclusion']=='success' and run['head_sha']==ORIGIN and run['run_attempt']==1
          a=info('actions/artifacts/14382752595')
          assert not a['expired'] and a['workflow_run']['id']==44204566222 and a['digest']=='sha256:3335a1481400d1fb793c8980775b067f40a19ee0efbd9cd494e28c13ff7fa464'
          failed_run=info('actions/runs/44205074290')
          assert failed_run['head_sha']=='d799fa8fb114f2a9c7419579d8c11ef565f4b16d' and failed_run['run_attempt']==1 and failed_run['conclusion']=='failure'
          jobs=info('actions/runs/44205074290/jobs')['jobs']
          assert len(jobs)==1
          steps={s['name']:s['conclusion'] for s in jobs[0]['steps']}
          assert steps['P52 invoke original bounded publisher ONCE; no retry']=='failure'
          assert all(steps[f'P{g["number"]} invoke original bounded publisher ONCE; no retry']=='skipped' for g in GROUPS[1:])
          checkpoint=info('actions/artifacts/14383203255')
          assert not checkpoint['expired'] and checkpoint['workflow_run']['id']==44205074290 and checkpoint['digest']=='sha256:6424c16b75211f5d92d5a2e63fcc3160cef8ec779a8cf68e78d0ca10fe71d928'
          original=api('actions/artifacts/14383203255/zip')
          assert digest(original)=='6424c16b75211f5d92d5a2e63fcc3160cef8ec779a8cf68e78d0ca10fe71d928'
          with zipfile.ZipFile(io.BytesIO(original)) as original_zip:
              original_output=original_zip.read('original-native-output.jsonl')
              assert digest(original_output)=='3921a650084409f8bc031eed5c447ffd9b3210a0f4f824eb0812ffe48b8d8988'
              partial=json.loads(original_output.splitlines()[-1])
              assert partial['operation']==GROUPS[0]['operation'] and partial['ok'] is False
              assert partial['error']=='upload_endpoint_unconfirmed' and partial['post_write_attempts']==partial['new_posts']==16 and partial['reused']==0
              assert partial['current']=={'platform':'max','logical_id':'commercial-hotel-1589-v1'}
              assert {p['hotel_id'] for p in partial['posts'] if p['platform']=='telegram'}==set(GROUPS[0]['hotel_ids'])
              assert {p['hotel_id'] for p in partial['posts'] if p['platform']=='max'}==set(GROUPS[0]['hotel_ids'][:6])
              assert all(p['state']=='sent' and p['body_photo_button_verified'] for p in partial['posts'])
          raw=api('actions/artifacts/14382752595/zip')
          assert digest(raw)=='3335a1481400d1fb793c8980775b067f40a19ee0efbd9cd494e28c13ff7fa464'
          root=Path('pub')
          root.mkdir()
          media=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert set(archive.namelist())==set(EXPECTED)|{'source-receipt.json'}
              contents={name:archive.read(name) for name in archive.namelist()}
              assert all(digest(contents[name])==sha for name,sha in EXPECTED.items())
              assert digest(contents['source-receipt.json'])=='991f55ae93555199241ffdf70a4bc5d05ca4dcb8945869c081cb2a77affc0e0a'
              receipt=json.loads(contents['source-receipt.json'])
              assert receipt['state']=='WAVE7_SOURCE_ACCEPTED_COVERS_STAGED'
              assert receipt['expected_app_sha']==APP and receipt['cover_commit']==COMMIT and receipt['groups']==GROUPS
              (root/'accepted-source-receipt.json').write_bytes(contents['source-receipt.json'])
              (root/'original-p52-summary.json').write_text(json.dumps(partial,ensure_ascii=False)+'\n')
              for entry in GROUPS[1:]:
                  number=entry['number']
                  directory=root/f'p{number}'
                  directory.mkdir()
                  mapping={'manifest.json':f'p{number}-manifest.json','approval.json':f'p{number}-approval.json',
                           'wave2-once.php':f'p{number}-publisher-unexecuted.php','source-receipt.json':'source-receipt.json'}
                  for name,source_name in mapping.items():
                      (directory/name).write_bytes(contents[source_name])
                  manifest=json.loads((directory/'manifest.json').read_bytes())
                  approval=json.loads((directory/'approval.json').read_bytes())
                  assert manifest['operation']==approval['operation']==entry['operation']
                  assert manifest['state']=='PREPARED_NOT_SENT' and manifest['button_text']=='✈️ Узнать стоимость тура'
                  assert approval['expected_installed_sha']==APP
                  assert approval['manifest_sha256']==digest((directory/'manifest.json').read_bytes())
                  assert manifest['photo_freeze_commit']==COMMIT
                  assert len(manifest['rows'])==len(entry['hotel_ids']) and [x['hotel_id'] for x in manifest['rows']]==approval['hotel_ids']==entry['hotel_ids']
                  media.extend(manifest['rows'])
          
          def verify_photo(row):
              url=f"https://raw.githubusercontent.com/{REPO}/{COMMIT}/.github/traffic-publish/commercial-wave7-20261118/{row['hotel_id']}.png"
              assert row['photo_url']==url
              data=subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20',url],timeout=25)
              assert digest(data)==row['photo_sha256']
          
          assert len(media)==39 and len({row['hotel_id'] for row in media})==39
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(verify_photo,media))
          PY
          for file in pub/p*/wave2-once.php; do php -l "$file"; done
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: P53 fresh read-only admission for exactly 10 hotels
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          base='repos/pyatkoff/max-search-bot'
          def data(path):
              return json.loads(subprocess.check_output(['gh','api',base+'/'+path],timeout=40))
          assert data('git/ref/heads/main')['object']['sha']=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          feed=data('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')
          active=[x['id'] for x in feed['workflow_runs'] if x['status'] in {'requested','queued','in_progress','waiting','pending'}]
          if active:
              raise SystemExit('Current feed owner has an active operation: '+str(active))
          PY
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0; app=/var/www/anytoour/data/www/app.anytoour.ru; test -d "$app/.git" && test ! -L "$app"; cd "$app"; test "$(git rev-parse HEAD)" = cc017ee5bb669f4c7c13efc91d5c5812a50e55f2; test -z "$(git status --porcelain --untracked-files=no)"; test ! -e /var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261118-53-v1; command -v php >/dev/null; printf "CURRENT_PRODUCTION_SOURCE_VERIFIED\\n"' > pub/p53/preflight.txt
          grep -Fx 'CURRENT_PRODUCTION_SOURCE_VERIFIED' pub/p53/preflight.txt
      - name: P53 invoke original bounded publisher ONCE; no retry
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          rc=0
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/p53/wave2-once.php > pub/p53/original-native-output.jsonl || rc=$?
          printf '%s\n' "$rc" > pub/p53/original-exit.txt
          cat pub/p53/original-native-output.jsonl
          exit "$rc"
      - name: P53 verify all 20 actual posts before the next original operation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,pathlib
          p=pathlib.Path('pub/p53')
          lines=[json.loads(l) for l in (p/'original-native-output.jsonl').read_text().splitlines() if l.strip().startswith('{')]
          assert (p/'original-exit.txt').read_text().strip()=='0' and lines
          r=lines[-1];assert r['ok'] and r['operation']=='commercial-hotel-batch-20261118-53-v1' and r['installed_sha']=='cc017ee5bb669f4c7c13efc91d5c5812a50e55f2'
          assert r['new_posts']==r['post_write_attempts']==20 and r['reused']==0 and len(r['posts'])==20
          expected=set([236,13853,48795,12104,2686,1518,64330,57682,47023,164]);manifest=json.loads((p/'manifest.json').read_bytes());rows={x['hotel_id']:x for x in manifest['rows']}
          by=collections.defaultdict(set)
          for x in r['posts']:
              assert x['state']=='sent' and x['body_photo_button_verified'] and not x['reused']
              assert x['hotel_id'] in expected and x['platform'] in ['max','telegram']
              assert x['button_text']=='✈️ Узнать стоимость тура'
              assert all(x[k]==rows[x['hotel_id']][k] for k in ['logical_id','text_sha256','photo_sha256','photo_url'])
              assert x['source_key']==('max_anytour_msk1' if x['platform']=='max' else 'tg_anytour_msk')
              assert x['channel_id']==('-80492244209683' if x['platform']=='max' else '-1002262666616')
              assert x['post_url'].startswith('https://max.ru/channel_anytour/' if x['platform']=='max' else 'https://t.me/any_toour/')
              assert x['button_url'].startswith('https://max.ru/id9704048781_1_bot?start=p_' if x['platform']=='max' else 'https://t.me/anyru_bot?start=p_')
              by[x['platform']].add(x['hotel_id'])
          assert by['max']==by['telegram']==expected and len(set(x['post_url'] for x in r['posts']))==20
          out={'state':'20_NATIVE_POSTS_VERIFIED','unique_new_hotels':10,'telegram':10,'max':10,'operation':r['operation'],'original_output_sha256':hashlib.sha256((p/'original-native-output.jsonl').read_bytes()).hexdigest(),'feed_rows_added':0,'posts':r['posts']}
          (p/'terminal-verified.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('P53_NATIVE_POSTS_VERIFIED '+json.dumps({'hotels':10,'original_output_sha256':out['original_output_sha256']},separators=(',',':')))
          PY
      - name: P53 preserve original one-attempt outcome including UNKNOWN
