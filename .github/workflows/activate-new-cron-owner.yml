name: Activate new cron owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-new-cron-owner.yml'
  workflow_dispatch: # manual recovery/retry after runtime cutover fixes

permissions:
  contents: read

concurrency:
  group: max-search-cron-cutover
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "Invalid SSH key"; exit 1; }
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Wait for exact new-server SHA
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST"
          for attempt in $(seq 1 40); do
            deployed="$(ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" 'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              echo "NEW_SERVER_SHA_VERIFIED=$deployed"
              exit 0
            fi
            echo "Waiting for exact SHA $EXPECTED_SHA (current: ${deployed:-unavailable}, attempt $attempt/40)"
            sleep 5
          done
          echo "New server did not reach exact SHA" >&2
          exit 1

      - name: Verify runtime and current cron state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          legacy="$DEPLOY_USER@$DEPLOY_HOST"
          new="$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$new" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=OFF"
            php tools/max_webhook_status.php >/tmp/max-cron-cutover-health.json
            php -r '\''$d=json_decode(file_get_contents("/tmp/max-cron-cutover-health.json"),true); $reason=(string)($d["reason"]??""); $count=(int)($d["subscription_count"]??0); $urls=$d["subscription_urls"]??[]; $expected="https://app.anytoour.ru/webhook.php"; $legacy="https://anytour.online/max-search/webhook.php"; $unexpected=$d["unexpected_subscription_urls"]??[]; $single=($reason==="healthy"&&$count===1&&$urls===[$expected]); $dual=($reason==="healthy_cutover_dual"&&$count===2&&in_array($expected,$urls,true)&&in_array($legacy,$urls,true)&&count($unexpected)===0); if(empty($d["ok"])||(!$single&&!$dual)){exit(1);} echo "MAX_HEALTH=OK reason={$reason}\n";'\''
            php tools/lead_bridge_probe.php
          '
          legacy_count="$(ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$legacy" 'crontab -l 2>/dev/null || true' | grep -Ec '(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)' || true)"
          new_count="$(ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$new" 'crontab -l 2>/dev/null || true' | grep -Ec '(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)' || true)"
          echo "LEGACY_FOLLOWUP_CRON_COUNT=$legacy_count"
          echo "NEW_FOLLOWUP_CRON_COUNT=$new_count"
          [[ "$legacy_count" == "0" ]]
          [[ "$new_count" == "0" || "$new_count" == "1" ]]

      - name: Install canonical followup cron on new server
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -euo pipefail
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l 2>/dev/null >"$before" || true
            cp "$before" "$after"
            sed -i -E "/cron_followup\.php/d;/# max-search-bot followup owner/d" "$after"
            {
              printf "%s\n" "# max-search-bot followup owner"
              printf "%s\n" "* * * * * flock -n /tmp/max-search-followup-cron.lock /usr/bin/php /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.php >> /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.cron.log 2>&1"
            } >>"$after"
            rollback() { crontab "$before" || true; rm -f "$before" "$after"; }
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -E "(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            crontab -l | grep -Fqx "* * * * * flock -n /tmp/max-search-followup-cron.lock /usr/bin/php /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.php >> /var/www/anytoour/data/www/app.anytoour.ru/cron_followup.cron.log 2>&1"
            trap - ERR
            rm -f "$before" "$after"
            echo "NEW_FOLLOWUP_CRON_INSTALLED=YES"
          '

      - name: Verify single cron owner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          legacy="$DEPLOY_USER@$DEPLOY_HOST"
          new="$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST"
          legacy_count="$(ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$legacy" 'crontab -l 2>/dev/null || true' | grep -Ec '(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)' || true)"
          new_count="$(ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$new" 'crontab -l 2>/dev/null || true' | grep -Ec '(^|[[:space:]])([^#[:space:]]*/)?cron_followup\.php([[:space:]]|$)' || true)"
          echo "LEGACY_FOLLOWUP_CRON_COUNT=$legacy_count"
          echo "NEW_FOLLOWUP_CRON_COUNT=$new_count"
          [[ "$legacy_count" == "0" && "$new_count" == "1" ]]
          echo "BOT_CRON_OWNERSHIP=NEW_ONLY"
