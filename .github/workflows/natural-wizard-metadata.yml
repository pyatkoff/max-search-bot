name: Check finite natural wizard metadata
on:
  push:
    branches: [audit/natural-wizard-metadata-20261026]
permissions:
  contents: read
concurrency:
  group: anytour-finite-natural-wizard-metadata
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify current main before credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = '79a4c66f19948403d378106111807126df242c44'
      - name: Prepare existing canonical SSH credential
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Single read-only admitted metadata check
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
          chdir('/var/www/anytoour/data/www/app.anytoour.ru');
          require_once 'config.php';require_once 'services/ProjectAccessService.php';
          if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('scope');
          ProjectAccessService::initializeReadOnly();$p=ConversationDb::connection();
          $p->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();
          $since=1793031790;
          $sql="SELECT source_kind,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_status')) AS status,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.event_type')) AS event_type,JSON_UNQUOTE(JSON_EXTRACT(JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.payload_json')),'$.origin')) AS origin,JSON_UNQUOTE(JSON_EXTRACT(JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.payload_json')),'$.version')) AS version,JSON_UNQUOTE(JSON_EXTRACT(JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.payload_json')),'$.field')) AS field FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND observed_at_unix>=? ORDER BY id DESC LIMIT 480";
          $q=$p->prepare($sql);$q->execute([$since]);$n=0;$events=0;$applied=0;$fields=[];
          while($r=$q->fetch(PDO::FETCH_ASSOC)) {
          $n++;
          // Only receipt origin/version/field metadata is returned; no values or IDs.
          if($r['source_kind']!=='event'||$r['status']!=='present'||$r['event_type']!=='wizard_value_applied')continue;
          $events++;if((string)$r['version']!=='1'||$r['origin']!=='existing_wizard_step_application')continue;
          $f=$r['field'];
          if(!is_string($f)||!in_array($f,['adults','children','child_ages','city','country','stars','meal','nights','date'],true))continue;
          $applied++;$fields[$f]=($fields[$f]??0)+1;
          }
          $sql="SELECT observed_at_unix,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.adapter.version')) AS adapter,JSON_EXTRACT(profile_json,'$.coverage.applied_wizard_fields') AS applied,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.party.adults.status')) AS adults,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.party.children.status')) AS children,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.fields.duration.status')) AS nights,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.party.adults.basis')) AS adults_basis FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND id IN (SELECT id FROM (SELECT MAX(id) AS id FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND observed_at_unix>=? GROUP BY platform,customer_key,conversation_id ORDER BY id DESC LIMIT 4) selected_profiles)";
          $q=$p->prepare($sql);$q->execute([$since]);$profiles=0;$using=0;$known=['adults'=>0,'children'=>0,'nights'=>0];$current=0;
          while($r=$q->fetch(PDO::FETCH_ASSOC)){$profiles++;if($r['adapter']==='admitted_journal_profile_v1_2')$current++;if((int)$r['applied']>0)$using++;foreach(array_keys($known)as$k)if($r[$k]==='known')$known[$k]++;}
          $states=[];
          foreach(['modeled_conversion_stream_state','modeled_conversion_profiles_state']as$table){
          $q=$p->query("SELECT enabled,ticks,last_receipt_json FROM ".$table." WHERE project_key='anytour'");$r=$q->fetch(PDO::FETCH_ASSOC);$receipt=$r?json_decode((string)$r['last_receipt_json'],true):null;
          $allowed=[];foreach(['observed_at_unix','processed_revisions','profiles_written','pending_revisions','limit_reached','duration_ms']as$key)if(isset($receipt[$key])&&(is_int($receipt[$key])||is_bool($receipt[$key])))$allowed[$key]=$receipt[$key];
          $states[$table]=['enabled'=>$r?(bool)$r['enabled']:false,'ticks'=>$r?(int)$r['ticks']:0,'last_receipt'=>$allowed];
          }
          $p->rollBack();
          $out=['ok'=>true,'sha'=>'79a4c66f19948403d378106111807126df242c44','at'=>gmdate('c'),'since_utc'=>'2026-10-26T16:23:10Z','journal_metadata_rows'=>$n,'window_may_be_limited'=>$n===480,'natural_event_rows'=>$events,'valid_application_receipts'=>$applied,'applied_field_counts'=>$fields,'profile_scopes_sampled'=>$profiles,'current_adapter_scopes'=>$current,'scopes_with_applied_fields'=>$using,'known_status_counts'=>$known,'states'=>$states,'native_source_reads'=>0,'copied_text_bytes'=>0,'model_calls'=>0,'conversion_uploads'=>0,'database_writes'=>false];
          $json=json_encode($out,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES);if(strlen($json)>65536)throw new RuntimeException('bound');echo $json.PHP_EOL;
          }catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();fwrite(STDERR,"natural_wizard_metadata_unavailable\n");exit(1);}
          PHP
          opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          dir="/tmp/anytour-natural-metadata-${GITHUB_RUN_ID}"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; umask 077; mkdir '$dir'; chmod 700 '$dir'"
          trap 'ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$dir/read.php\"; rmdir \"$dir\"" >/dev/null 2>&1 || true' EXIT
          scp "${opts[@]}" "$RUNNER_TEMP/read.php" "$DEPLOY_USER@$DEPLOY_HOST:$dir/read.php"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '79a4c66f19948403d378106111807126df242c44'; git diff --quiet; php -d display_errors=0 '$dir/read.php'; test \"\$(git rev-parse HEAD)\" = '79a4c66f19948403d378106111807126df242c44'"
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/read.php"
