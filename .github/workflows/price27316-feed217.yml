      - name: Publish bounded progress for batch 26 while job is running
        if: ${{ always() && (steps.batch26.outcome == 'success' || steps.batch26.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed217-progress-p26-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/feed217/progress/p26/
            ${{ runner.temp }}/feed217/failure.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve bounded failure metadata
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed217-stop-${{ github.run_id }}
          path: ${{ runner.temp }}/feed217/failure.json
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
