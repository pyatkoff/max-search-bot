# REVIEW PROPOSAL ONLY. Closed config literal and exact parent/claim/source admission gate execution.
name: Exact suffix207 offline compilation only; no native writer
on:
  push:
    branches: ['audit/price660-27316-resume-readiness-20261117']
    paths: ['.github/workflows/price27316-feed217.yml']
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'ff6b461aa5161ea0941629350e7ff70b7f587ce7'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify independently reviewed immutable config before credentials
        run: |
          python3 - <<'PYCODE'
          import hashlib, pathlib, re, sys
          sys.path.insert(0,'tools/direct_demand/operations')
          import finite_feed217 as runner
          raw=pathlib.Path('tools/direct_demand/operations/feed217-reviewed-config.json').read_bytes()
          assert re.fullmatch('[a-f0-9]{64}',runner.REVIEWED_CONFIG_SHA256)
          assert hashlib.sha256(raw).hexdigest()==runner.REVIEWED_CONFIG_SHA256
          PYCODE
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Prepare sanitized root-coordinated finite plan (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: python3 tools/direct_demand/operations/finite_feed217.py tools/direct_demand/operations/feed217-reviewed-config.json prepare
      - name: Publish sanitized plan artifact while job is running
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed217-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/feed217/deliver-plan/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve complete offline compilation proof; no writer invocation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed207-compile-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/feed217/compiled/
            ${{ runner.temp }}/feed217/compilation-admission.json
            ${{ runner.temp }}/feed217/execution-context.json
            ${{ runner.temp }}/feed217/reviewed-config.json
            ${{ runner.temp }}/feed217/prefix-history/
            ${{ runner.temp }}/feed217/probe-initial/
            ${{ runner.temp }}/feed217/read-refresh-proof.json
            ${{ runner.temp }}/feed217/prepare-rate-budget.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve bounded failure metadata
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed217-stop-${{ github.run_id }}
          path: ${{ runner.temp }}/feed217/failure.json
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
