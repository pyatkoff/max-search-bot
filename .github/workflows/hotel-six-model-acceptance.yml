name: Six hotel knowledge model acceptance

on:
  push:
    branches: [audit/hotel-six-model-acceptance-20261025]

permissions:
  contents: read

concurrency:
  group: hotel-six-model-acceptance
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_INSTALLED_SHA: 0e56c5549f5d3dd91a6484cd1c152ad4f237f53e
      EXPECTED_CONTROL_SHA256: 07414f16b3daad66e8bc29db089879a8d61e6ed6cb9221739b17b399bbbf07a5
    steps:
      - name: Checkout the accepted installed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_INSTALLED_SHA }}
          fetch-depth: 0
      - name: Verify current main and prepare the exact synthetic control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          [[ "$EXPECTED_INSTALLED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_CONTROL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_INSTALLED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_INSTALLED_SHA"
          cat > "$RUNNER_TEMP/control.php" <<'CONTROL_PHP'
          <?php
          declare(strict_types=1);
          
          /** Fixed synthetic comparison. No bootstrap, DB, cached drafts or delivery. */
          ini_set('display_errors', '0');
          error_reporting(0);
          umask(0077);
          const APP_ROOT = '/var/www/anytoour/data/www/app.anytoour.ru';
          const CONTROL_SCHEMA = 'hotel_six_synthetic_model_acceptance_v1';
          const MAX_RECEIPT_BYTES = 524288;
          const MAX_MODEL_CALLS = 12;
          
          function encoded(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);
          }
          function sourceSha(string $root): ?string
          {
              $process = proc_open(['git', 'rev-parse', 'HEAD'], [0=>['pipe','r'],1=>['pipe','w'],2=>['pipe','w']], $pipes, $root);
              if (!is_resource($process)) return null;
              fclose($pipes[0]);
              $value = stream_get_contents($pipes[1],128); fclose($pipes[1]);
              stream_get_contents($pipes[2],1024); fclose($pipes[2]);
              $status = proc_close($process);
              $sha = trim(is_string($value) ? $value : '');
              return $status === 0 && preg_match('/\A[a-f0-9]{40}\z/D',$sha) === 1 ? $sha : null;
          }
          function flushReceipt($stream, array $receipt): void
          {
              $bytes = encoded($receipt)."\n";
              if (strlen($bytes)>MAX_RECEIPT_BYTES || !rewind($stream) || !ftruncate($stream,0)
                  || fwrite($stream,$bytes)!==strlen($bytes) || !fflush($stream)
                  || (function_exists('fsync') && !fsync($stream))) throw new RuntimeException('receipt_write_failed');
          }
          function failBeforeCalls(string $reason, string $expected): never
          {
              echo encoded(['schema'=>CONTROL_SCHEMA,'status'=>'held','reason'=>$reason,
                  'expected_installed_sha'=>$expected,'model_calls_started'=>0,'automatic_retry_allowed'=>false])."\n";
              exit(2);
          }
          
          $expected = $argv[1] ?? '';
          $preflightOnly = count($argv) === 3 && $argv[2] === '--preflight';
          if ((!$preflightOnly && count($argv)!==2) || preg_match('/\A[a-f0-9]{40}\z/D',$expected)!==1) failBeforeCalls('invalid_arguments','');
          $root = $preflightOnly ? (string)getcwd() : APP_ROOT;
          if (realpath((string)getcwd())!==realpath($root) || sourceSha($root)!==$expected) failBeforeCalls('source_mismatch',$expected);
          
          // All questions are newly authored synthetic controls, not archived customers.
          // Criteria are frozen before any provider output and never added to its input.
          $cases = [
              ['key'=>'makadi_room_categories','source_id'=>'241','anytour_id'=>81,'facts'=>4,'sources'=>2,
                  'name'=>'ALBATROS MAKADI RESORT','room'=>'Makadi Splash',
                  'question'=>'Нас двое взрослых и трое детей 4, 8 и 12 лет. В Albatros Makadi смотрим Makadi Splash. Чем он отличается от Family Deluxe и Family Connecting? Можно ли уже гарантировать всем размещение в одном номере, две спальни с дверью и две дополнительные кровати?',
                  'criteria'=>['Separate Splash103, Connecting106 and FamilyDeluxe53; no category equivalence.',
                      'Use the published category distinctions conditionally; do not guarantee occupancy for 2 adults and children4/8/12 from 3+3 or4+2.',
                      'Retain 12+ adult policy and conflict between named two extra beds and general one-bed limit.',
                      'Give useful differences and precise selected-category/age/bed checks; no repeated party questionnaire.']],
              ['key'=>'happy_meal_entitlement','source_id'=>'240','anytour_id'=>80,'facts'=>3,'sources'=>2,
                  'name'=>'HAPPY LIFE VILLAGE','room'=>'Standard / HB',
                  'question'=>'В Happy Life Village у нас вариант с питанием HB. Раз в отеле есть всё включено и ресторан Love Boat, значит обеды, перекусы и напитки тоже входят? Что именно здесь можно подтвердить?',
                  'criteria'=>['Keep purchased HB separate from available AI; restaurant presence proves no entitlement.',
                      'AI published breakfast/lunch/dinner/snacks and selected local drinks10–23 may be explained only as source-specific AI description.',
                      'No current/future AI service, restaurant quality or free Love Boat guarantee.',
                      'Answer the known meal-plan distinction without asking again which plan was stated.']],
              ['key'=>'saraya_five_person_apartment','source_id'=>'268','anytour_id'=>99,'facts'=>5,'sources'=>2,
                  'name'=>'JAZ MAKADI SARAYA RESORT (EX. IBEROTEL MAKADI SARAYA RESORT)','room'=>'2 Bedroom Apartment Garden View',
                  'question'=>'Jaz Makadi Saraya Resort, двое взрослых и дети 15, 11 и 5 лет. Подойдёт ли нам 2 Bedroom Apartment Garden View, если нужны две закрывающиеся спальни и отдельное место каждому? Или можно взять Family Deluxe? Ещё нам важна первая линия.',
                  'criteria'=>['Keep TwoBedroom100/5+1 separate from FamilyDeluxe55/2+2or3+1.',
                      'No guaranteed 2+3, fifth sleeping place, decoded child ages or closed internal doors.',
                      'Retain second-line/300m evidence and flag first-line requirement conflict.',
                      'Do not silently substitute SarayaPalms or another JAZ; useful factual distinction plus operator room-code/bed checks.']],
              ['key'=>'neo_conflicting_family_room','source_id'=>'1981','anytour_id'=>877,'facts'=>4,'sources'=>4,
                  'name'=>'JAZ NEO NAAMA BAY (EX. SOLYMAR NAAMA BAY)','room'=>'Superior Family Garden View',
                  'question'=>'В Jaz Neo Naama Bay выбрали Superior Family Garden View для четверых взрослых и ребёнка 10 лет. Можно ли рассчитывать на 70 м², две отдельные спальни и гарантированное размещение впятером? Family Suite такого же размера — это тот же номер?',
                  'criteria'=>['Retain conflicting official70/4AD+1CH, JoinUp40/max4 and PAKS/TEZ40–70 descriptions.',
                      'No guarantee that the exact GardenView contract is the official70 room or admits the stated child.',
                      'FamilySuite70 is not automatically SuperiorFamily70; no guaranteed doors or connecting.',
                      'Give the conflict and exact room-code/ages/beds checks, not a resolved maximum invented from one source.']],
              ['key'=>'movenpick_step_free_beach','source_id'=>'12111','anytour_id'=>1654,'facts'=>3,'sources'=>3,
                  'name'=>'MOVENPICK RESORT SHARM EL SHEIKH NAAMA BAY','room'=>'Classic Sea View',
                  'question'=>'Смотрим Mövenpick Resort Sharm El Sheikh Naama Bay для человека, которому тяжело ходить по ступенькам. Пять песчаных пляжей означают, что от любого номера есть короткий путь без лестниц и удобный вход в море? Можно ли на это рассчитывать при выборе?',
                  'criteria'=>['Use elevated terrain, terrace route and up to300m depending on accommodation.',
                      'Five advertised beaches do not prove five open or equally accessible bathing entries.',
                      'Do not guarantee step-free route, lift/ramp, depth, safe entry or current operation.',
                      'Explain why chosen-building route needs confirmation; do not confuse SomaBay or ask the mobility limitation again.']],
              ['key'=>'titanic_checkout_and_palace','source_id'=>'498','anytour_id'=>228,'facts'=>4,'sources'=>2,
                  'name'=>'TITANIC BEACH SPA & AQUA PARK','room'=>'Family / All Inclusive',
                  'question'=>'У нас Titanic Beach Spa & Aqua Park, всё включено и поздний выезд из отеля около 18:00. Питание и напитки сохранятся бесплатно до отъезда? А в соседнем Titanic Palace можно бесплатно пользоваться вообще всем без записи? Едем с детьми — не получается, что отель только для взрослых?',
                  'criteria'=>['Retained leaflet ends AI at12checkout day and later services are paid; distinguish actual departure and room checkout.',
                      'Beach guest access to Palace is directional and does not prove reciprocal rights or free-everything.',
                      'Reservations and availability apply; free visit quota/document edition/current trip rights remain unknown.',
                      '18+/VIP restrictions are venue/package-specific, not whole-hotel adults-only; do not guarantee current entitlement.']],
          ];
          $generalCriteria = ['Customer draft must use the supported evidence conditionally and answer the current question.',
              'No invented price, availability, completed checks/actions or promise of a search that was not run.',
              'No unrelated hotel facts, repeated known conditions or hidden source conflict in draft/reason/checks.',
              'Safety-only refusal is insufficient when a useful supported distinction is available.',
              'Single generated pair per hotel is a bounded development control, not independent accuracy or natural/UI evidence.'];
          
          $receipt = ['schema'=>CONTROL_SCHEMA,'status'=>'preflighting','installed_sha'=>$expected,
              'started_at_utc'=>gmdate('Y-m-d\TH:i:s\Z'),'model_calls_started'=>0,'max_model_calls'=>MAX_MODEL_CALLS,
              'automatic_retry_allowed'=>false,'synthetic_only'=>true,
              'selector_kind'=>'explicitly_synthetic_capability_not_native_SQL_proof',
              'general_review_criteria'=>$generalCriteria,'frozen_cases'=>$cases,
              'criteria_sha256'=>hash('sha256',encoded(['general'=>$generalCriteria,'cases'=>$cases])),
              'natural_customer_or_UI_confirmation'=>false,'production_data_writes'=>0,'customer_sends'=>0,
              'preflight'=>[],'results'=>[]];
          $stream = null;
          try {
              if (!$preflightOnly) {
                  ob_start();
                  try { require APP_ROOT.'/config.php'; } finally { ob_end_clean(); }
              }
              require $root.'/services/ManagerAiDraftService.php';
              $work = [];
              foreach ($cases as $index=>$case) {
                  $id = 910000 + $index*10;
                  $context = ['conversation_id'=>900100+$index,'as_of_message_id'=>$id+3,
                      'history_incomplete'=>false,'media_unread'=>false,'selections_link_unread'=>false,'messages'=>[
                          ['id'=>$id+1,'sender_type'=>'customer','event_type'=>'message','text'=>$case['question']],
                          ['id'=>$id+2,'sender_type'=>'manager','event_type'=>'message','text'=>'В выбранной веб-подборке указан вариант '.$case['room'].'. Условия конкретного тарифа ещё не подтверждены.'],
                          ['id'=>$id+3,'sender_type'=>'customer','event_type'=>'unknown','text'=>'Обращение из веб-подборки · вариант 1: '.$case['name']],
                      ]];
                  $selector = ['project_key'=>'anytour',
                      'source_identity'=>['adapter'=>'tourvisor-snapshot-v1','hotel'=>$case['source_id'],'country'=>'1'],
                      'selected_hotel'=>$case['name'],'selected_room'=>$case['room'],
                      'provenance'=>['message_id'=>$id+3,'event_id'=>990100+$index,
                          'publication_sha256'=>hash('sha256','synthetic-six-publication-'.$case['key']),
                          'source_sha256'=>hash('sha256','synthetic-six-source-'.$case['key'])]];
                  $hotel = ManagerHotelKnowledge::capture($selector,time());
                  if (($hotel['status']??null)!=='available' || count($hotel['facts']??[])!==$case['facts']
                      || count($hotel['sources']??[])!==$case['sources']
                      || ($hotel['hotel_ref']??null)!==['catalog'=>'anytour','id'=>$case['anytour_id']]) throw new RuntimeException('accepted_group_unavailable');
                  $class = new ReflectionClass(ManagerAiDraftReferenceContext::class);
                  $reference = $class->newInstanceWithoutConstructor();
                  $binding = (new ReflectionMethod(ManagerAiDraftReferenceContext::class,'binding'))->invoke(null,$context);
                  $class->getConstructor()->invoke($reference,$binding,['hotel_reference'=>$hotel]);
                  $baseline = ManagerAiDraftService::prepareInput($context);
                  $candidate = ManagerAiDraftService::prepareInput($context,null,null,$reference);
                  if (!isset($baseline['context'],$candidate['context']) || ($baseline['preflight']??null)!==null
                      || ($candidate['preflight']??null)!==null || !empty($baseline['images']) || !empty($candidate['images'])
                      || ($candidate['context']['hotel_reference']??null)!==$hotel) throw new RuntimeException('input_unavailable');
                  $plain = $candidate['context']; unset($plain['hotel_reference']);
                  if ($plain!==$baseline['context']) throw new RuntimeException('non_hotel_context_difference');
                  $order = $index%2===0 ? ['baseline','candidate'] : ['candidate','baseline'];
                  $receipt['preflight'][$case['key']] = ['frozen_context'=>$context,
                      'frozen_context_sha256'=>hash('sha256',encoded($context)),
                      'binding_revision'=>$hotel['binding_revision'],'knowledge_revision'=>$hotel['knowledge_revision'],
                      'claim_ids'=>array_column($hotel['facts'],'id'),'source_ids'=>array_column($hotel['sources'],'id'),
                      'record_hashes'=>$hotel['record_hashes'],'admission'=>$candidate['hotel_reference_admission'],
                      'call_order'=>$order,'arms'=>[]];
                  foreach ($order as $arm) {
                      $prepared = $arm==='baseline' ? $baseline : $candidate;
                      $instructions = ManagerAiDraftService::instructions($prepared['context']);
                      $body = ManagerDraftClient::requestBody($instructions,$prepared['context'],[]);
                      if (($body['model']??null)!=='gpt-6.1-sol' || ($body['reasoning']['effort']??null)!=='low'
                          || ($body['service_tier']??null)!=='default' || ($body['store']??null)!==false
                          || strlen(encoded($body))>ManagerDraftClient::MAX_REQUEST_BYTES) throw new RuntimeException('profile_or_wire_mismatch');
                      $receipt['preflight'][$case['key']]['arms'][$arm] = ['request_sha256'=>hash('sha256',encoded($body)),
                          'instructions_sha256'=>hash('sha256',$instructions),'request_bytes'=>strlen(encoded($body)),
                          'requested_profile'=>['model'=>$body['model'],'reasoning'=>$body['reasoning'],'service_tier'=>$body['service_tier'],'store'=>$body['store']]];
                      $work[] = ['case_key'=>$case['key'],'arm'=>$arm,'context'=>$context,
                          'capability'=>$arm==='baseline' ? null : $reference,'body'=>$body];
                  }
              }
              if (count($work)!==MAX_MODEL_CALLS || sourceSha($root)!==$expected) throw new RuntimeException('workload_or_source_mismatch');
              $receipt['hotel_policy_sha256'] = hash('sha256',ManagerHotelKnowledge::instructions());
              $receipt['protocol_sha256'] = hash_file('sha256',__FILE__);
              $receipt['status'] = 'preflight_complete';
              if ($preflightOnly) { echo encoded($receipt)."\n"; exit(0); }
          
              $directory = '/tmp/anytour-hotel-model-control';
              if (!file_exists($directory) && !mkdir($directory,0700)) throw new RuntimeException('private_directory_unavailable');
              $stat = @lstat($directory);
              if (!is_array($stat) || ($stat['mode']&0170000)!==0040000 || ($stat['mode']&0777)!==0700
                  || (function_exists('posix_geteuid') && $stat['uid']!==posix_geteuid())) throw new RuntimeException('private_directory_invalid');
              $path = $directory.'/'.$expected.'-six-v1.json';
              $stream = @fopen($path,'x');
              if (!is_resource($stream)) failBeforeCalls('existing_or_unavailable_receipt_do_not_repeat',$expected);
              if (!chmod($path,0600) || !flock($stream,LOCK_EX|LOCK_NB)) throw new RuntimeException('receipt_lock_failed');
              flushReceipt($stream,$receipt);
          
              foreach ($work as $item) {
                  if (sourceSha($root)!==$expected || $receipt['model_calls_started']>=MAX_MODEL_CALLS) throw new RuntimeException('source_or_call_budget_mismatch');
                  $key = $item['case_key'].':'.$item['arm'];
                  $receipt['status'] = 'model_call_started_outcome_unknown';
                  $receipt['model_calls_started']++;
                  $receipt['results'][$key] = ['state'=>'started_outcome_unknown','case_key'=>$item['case_key'],'arm'=>$item['arm'],
                      'request_sha256'=>hash('sha256',encoded($item['body'])),'model_metadata'=>null];
                  flushReceipt($stream,$receipt);
                  $metadata = null; $body = $item['body']; $started = microtime(true);
                  $result = ManagerAiDraftService::generate($item['context'],
                      static function(string $policy,array $payload,array $images) use (&$metadata,$body):array {
                          if (ManagerDraftClient::requestBody($policy,$payload,$images)!==$body) return ['_error'=>'provider_unavailable'];
                          return ManagerDraftClient::requestJson($policy,$payload,static function(array $value) use (&$metadata):void {$metadata=$value;},$images);
                      },null,null,$item['capability']);
                  $receipt['results'][$key] += ['duration_ms'=>(int)round((microtime(true)-$started)*1000)];
                  $receipt['results'][$key]['state'] = !empty($result['ok']) ? 'validated_response' : 'error_or_unknown';
                  $receipt['results'][$key]['model_metadata'] = $metadata;
                  $receipt['results'][$key]['validated_result_or_safe_error'] = $result;
                  $receipt['results'][$key]['installed_sha_after_call'] = sourceSha($root);
                  $receipt['status'] = 'arm_finished';
                  flushReceipt($stream,$receipt);
                  if ($receipt['results'][$key]['installed_sha_after_call']!==$expected || empty($result['ok'])) throw new RuntimeException('arm_or_source_not_validated');
              }
              $receipt['status'] = 'completed_requires_content_review';
              $receipt['finished_at_utc'] = gmdate('Y-m-d\TH:i:s\Z');
              $receipt['model_use_accepted'] = null;
              flushReceipt($stream,$receipt);
              echo encoded($receipt)."\n";
          } catch (Throwable $ignored) {
              $receipt['status'] = 'stopped_no_automatic_retry';
              $receipt['finished_at_utc'] = gmdate('Y-m-d\TH:i:s\Z');
              if (is_resource($stream)) { try { flushReceipt($stream,$receipt); } catch (Throwable $alsoIgnored) {} }
              echo encoded($receipt)."\n";
              exit(2);
          } finally {
              if (is_resource($stream)) {flock($stream,LOCK_UN);fclose($stream);}
          }
          CONTROL_PHP
          test "$(sha256sum "$RUNNER_TEMP/control.php" | cut -d' ' -f1)" = "$EXPECTED_CONTROL_SHA256"
          chmod 600 "$RUNNER_TEMP/control.php"
      - name: Prepare the existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Canonical SSH identity unavailable'; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Check installed source and perform at most twelve unsent synthetic model calls
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          # Only the separately reviewed synthetic program goes to a mode-0600
          # temporary file. No application, config or database data is copied.
          remote_script="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; cd '$root'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_INSTALLED_SHA'; git diff --quiet; git diff --cached --quiet; mktemp /tmp/hotel-reference-control-$EXPECTED_INSTALLED_SHA.XXXXXX.php")"
          [[ "$remote_script" =~ ^/tmp/hotel-reference-control-[a-f0-9]{40}\.[A-Za-z0-9]{6}\.php$ ]]
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; cat > '$remote_script'; chmod 600 '$remote_script'; test \"\$(sha256sum '$remote_script' | cut -d' ' -f1)\" = '$EXPECTED_CONTROL_SHA256'" < "$RUNNER_TEMP/control.php"
          set +e
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; cd '$root'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_INSTALLED_SHA'; git diff --quiet; git diff --cached --quiet; php '$remote_script' '$EXPECTED_INSTALLED_SHA' 2>/dev/null" > "$RUNNER_TEMP/hotel-model-control.json"
          status=$?
          set -e
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$remote_script'" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/control.php"
          # Provider errors/outcome-unknown must remain visible, not retried.
          python3 - "$RUNNER_TEMP/hotel-model-control.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.stat().st_size > 524288:
              raise SystemExit('Synthetic receipt exceeds approved bound')
          d = json.loads(p.read_text())
          assert d['schema'] == 'hotel_six_synthetic_model_acceptance_v1'
          assert d.get('model_calls_started', 0) <= 12
          print(json.dumps({'status': d['status'], 'calls_started': d.get('model_calls_started', 0), 'automatic_retry_allowed': False}))
          PY
          exit "$status"
      - name: Preserve the synthetic-only result for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-six-model-acceptance-${{ env.EXPECTED_INSTALLED_SHA }}
          path: ${{ runner.temp }}/hotel-model-control.json
          if-no-files-found: warn
          retention-days: 7

