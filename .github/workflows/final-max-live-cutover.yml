name: Final MAX live cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-max-live-cutover.yml'
      - 'tools/max_shadow_mode.php'
      - 'handlers/MaxUpdateHandler.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-search-final-max-live-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare standby SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/standby_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "STANDBY_DEPLOY_SSH_KEY is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Wait for exact new-server SHA
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          for attempt in $(seq 1 40); do
            deployed="$(ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" 'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              echo "NEW_SERVER_SHA_VERIFIED=$deployed"
              exit 0
            fi
            echo "Waiting for new-server SHA $EXPECTED_SHA (current: ${deployed:-unavailable}, attempt $attempt/40)"
            sleep 5
          done
          echo "New server never reached exact cutover SHA" >&2
          exit 1

      - name: Verify safe pre-cutover state
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -euo pipefail
            cd /var/www/anytoour/data/www/app.anytoour.ru
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=ON"
            php tools/max_webhook_status.php > /tmp/max-pre-live-health.json
            php -r '\''$d=json_decode(file_get_contents("/tmp/max-pre-live-health.json"),true); if(!is_array($d)||empty($d["ok"])||($d["reason"]??"")!=="healthy_cutover_dual"||($d["subscription_count"]??0)!==2){exit(1);} echo "MAX_PRE_CUTOVER_HEALTH=OK\n";'\''
            php tools/lead_bridge_probe.php
          '

      - name: Switch MAX live with automatic rollback
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -euo pipefail
            cd /var/www/anytoour/data/www/app.anytoour.ru
            export MAX_SEARCH_ALLOW_STANDBY_CONFIG_WRITE=1
            rollback() {
              rc=$?
              trap - ERR
              echo "MAX_FINAL_CUTOVER_ROLLBACK=STARTED" >&2
              php tools/max_shadow_mode.php --shadow >/dev/null 2>&1 || php tools/max_shadow_mode.php --rollback >/dev/null 2>&1 || true
              php tools/max_subscription_cutover.php --rollback-old >/tmp/max-final-rollback.txt 2>&1 || true
              php tools/max_webhook_status.php || true
              echo "MAX_FINAL_CUTOVER_ROLLBACK=FINISHED" >&2
              exit "$rc"
            }
            trap rollback ERR

            # The new endpoint is still shadow here. Remove legacy first so two
            # live processors can never overlap; then immediately enable new live processing.
            php tools/max_subscription_cutover.php --activate-new | tee /tmp/max-final-subscription.txt
            grep -qx "MAX_SUBSCRIPTION_LEGACY_COUNT=0" /tmp/max-final-subscription.txt
            grep -qx "MAX_SUBSCRIPTION_NEW_COUNT=1" /tmp/max-final-subscription.txt
            grep -qx "MAX_SUBSCRIPTION_TARGET_OK=YES" /tmp/max-final-subscription.txt

            php tools/max_shadow_mode.php --live | grep -qx "MAX_SHADOW_MODE=OFF"
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=OFF"

            php tools/max_webhook_status.php > /tmp/max-final-health.json
            php -r '\''$d=json_decode(file_get_contents("/tmp/max-final-health.json"),true); $urls=$d["subscription_urls"]??[]; if(!is_array($d)||empty($d["ok"])||($d["reason"]??"")!=="healthy"||($d["subscription_count"]??0)!==1||count($urls)!==1||($urls[0]??"")!=="https://app.anytoour.ru/webhook.php"){exit(1);} echo "MAX_NEW_ONLY_HEALTH=OK\n";'\''
            php tools/lead_bridge_probe.php

            php tools/max_shadow_mode.php --commit | grep -qx "MAX_SHADOW_COMMIT=OK"
            trap - ERR
            echo "MAX_FINAL_LIVE_CUTOVER=COMPLETE"
          '

      - name: Verify rollback path remains available
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$remote" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            php tools/max_shadow_mode.php --status | grep -qx "MAX_SHADOW_MODE=OFF"
            grep -q -- "--rollback-old" tools/max_subscription_cutover.php
            echo "MAX_ROLLBACK_PATH_AVAILABLE=YES"
          '
