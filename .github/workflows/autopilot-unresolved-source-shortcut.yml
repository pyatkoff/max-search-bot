name: Temporary unresolved source shortcut patch

on:
  push:
    branches:
      - autopilot/unresolved-source-shortcut

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[source-shortcut-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/unresolved-source-shortcut
          fetch-depth: 0
      - name: Add unresolved source shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page=Path('manager/index.php')
          s=page.read_text()
          old='<div class="taskShortcuts" role="group" aria-label="Быстрые фильтры задач"><button class="taskShortcut" type="button" data-task-filter="action" aria-pressed="false">⚡ Нужно действие</button>'
          new='<div class="taskShortcuts" role="group" aria-label="Быстрые фильтры лидов"><button class="taskShortcut sourceShortcut" type="button" data-source-filter="-1" aria-pressed="false">⚠ Без источника</button><button class="taskShortcut" type="button" data-task-filter="action" aria-pressed="false">⚡ Нужно действие</button>'
          if s.count(old)!=1: raise SystemExit(f'page shortcut anchor count={s.count(old)}')
          page.write_text(s.replace(old,new,1))

          filters=Path('manager/assets/workspace-v2-filters.js')
          f=filters.read_text()
          old="function syncTaskShortcuts(){document.querySelectorAll('.taskShortcut[data-task-filter]').forEach(button=>{const active=String(S.leadTaskFilter||'')===String(button.dataset.taskFilter||'');button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}"
          new=old+"\nfunction syncSourceShortcuts(){document.querySelectorAll('.sourceShortcut[data-source-filter]').forEach(button=>{const active=Number(S.leadSourceFilter||0)===Number(button.dataset.sourceFilter||0);button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}"
          if f.count(old)!=1: raise SystemExit(f'sync shortcut anchor count={f.count(old)}')
          f=f.replace(old,new,1)
          old="if(panel&&toggle)toggle.setAttribute('aria-expanded',String(!panel.classList.contains('hidden')));syncTaskShortcuts()}"
          new="if(panel&&toggle)toggle.setAttribute('aria-expanded',String(!panel.classList.contains('hidden')));syncTaskShortcuts();syncSourceShortcuts()}"
          if f.count(old)!=1: raise SystemExit(f'sync ui anchor count={f.count(old)}')
          f=f.replace(old,new,1)
          old="async function setTaskShortcut(value){const next=String(S.leadTaskFilter||'')===String(value||'')?'':String(value||'');S.leadTaskFilter=next;const task=$('leadTaskFilter');if(task)task.value=next;ensureTaskQueue();await apply()}"
          new=old+"\nasync function setSourceShortcut(value){const target=Number(value||0),next=Number(S.leadSourceFilter||0)===target?0:target;S.leadSourceFilter=next;const source=$('leadSourceFilter');if(source)source.value=String(next);await apply()}"
          if f.count(old)!=1: raise SystemExit(f'set task shortcut anchor count={f.count(old)}')
          f=f.replace(old,new,1)
          old="document.querySelectorAll('.taskShortcut[data-task-filter]').forEach(button=>button.onclick=()=>setTaskShortcut(button.dataset.taskFilter||''));$('leadSearch').oninput="
          new="document.querySelectorAll('.taskShortcut[data-task-filter]').forEach(button=>button.onclick=()=>setTaskShortcut(button.dataset.taskFilter||''));document.querySelectorAll('.sourceShortcut[data-source-filter]').forEach(button=>button.onclick=()=>setSourceShortcut(button.dataset.sourceFilter||0));$('leadSearch').oninput="
          if f.count(old)!=1: raise SystemExit(f'bind shortcut anchor count={f.count(old)}')
          f=f.replace(old,new,1)
          old="syncFilterUi,syncTaskShortcuts,setTaskShortcut,loadSavedFilterState"
          new="syncFilterUi,syncTaskShortcuts,syncSourceShortcuts,setTaskShortcut,setSourceShortcut,loadSavedFilterState"
          if f.count(old)!=1: raise SystemExit(f'export shortcut anchor count={f.count(old)}')
          filters.write_text(f.replace(old,new,1))

          Path('.github/workflows/autopilot-unresolved-source-shortcut.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manager/index.php manager/assets/workspace-v2-filters.js .github/workflows/autopilot-unresolved-source-shortcut.yml
          git commit -m "Add one-click unresolved source filter [source-shortcut-patched]"
          git push origin HEAD:autopilot/unresolved-source-shortcut
