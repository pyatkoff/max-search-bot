name: One owner-admitted modeled episode check
on:
  push:
    branches: [audit/owner-model-episodes-20261026b]
permissions:
  contents: read
jobs:
  private-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXPECTED_RUNTIME_SHA: 19a839536e02b5fb9006d4cab64719b1fdf8769f
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned runner-only encryption dependency
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/owner-model-venv"
          "$RUNNER_TEMP/owner-model-venv/bin/pip" download --only-binary=:all: --no-deps --require-hashes -r tools/requirements-encrypted-evidence.txt --dest "$RUNNER_TEMP/owner-model-wheel"
          "$RUNNER_TEMP/owner-model-venv/bin/pip" install --no-index --no-deps --require-hashes --find-links "$RUNNER_TEMP/owner-model-wheel" -r tools/requirements-encrypted-evidence.txt
      - name: Prepare existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/owner_model_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo invalid_existing_identity; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read one admitted bounded prefix set privately
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/owner-model-venv/bin/python" tools/audit_owner_model_episodes.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-model-episodes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-model-artifact/
          retention-days: 1
          if-no-files-found: error
      - name: Remove private runner material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/owner_model_key" "$RUNNER_TEMP/owner_model_hosts" "$RUNNER_TEMP/owner-model-artifact" "$RUNNER_TEMP/owner-model-venv" "$RUNNER_TEMP/owner-model-wheel"
