name: Promote owner and Alisha to admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-owner-alisha-admin.yml'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]]
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Promote owner and Alisha
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            /opt/php81/bin/php -r '
              require "config.php";
              require "services/ConversationDb.php";
              $pdo=ConversationDb::connection();
              $rows=$pdo->query("SELECT id,login,display_name,role,is_active FROM managers ORDER BY id ASC")->fetchAll();
              foreach($rows as $r){echo "BEFORE id={$r["id"]} login={$r["login"]} display={$r["display_name"]} role={$r["role"]} active={$r["is_active"]}\n";}
              $q=$pdo->prepare("SELECT id,login FROM managers WHERE is_active=1 AND login NOT IN (?,?) ORDER BY id ASC LIMIT 1");
              $q->execute(["Anastasia","Svetlana"]);
              $owner=$q->fetch();
              if(!$owner) throw new RuntimeException("owner_not_found");
              $pdo->prepare("UPDATE managers SET role=\"admin\" WHERE id=?")->execute([(int)$owner["id"]]);
              $pdo->prepare("UPDATE managers SET role=\"admin\" WHERE login=\"Alisha\"")->execute();
              echo "PROMOTED_OWNER id={$owner["id"]} login={$owner["login"]}\n";
              echo "PROMOTED_ALISHA\n";
              $rows=$pdo->query("SELECT id,login,display_name,role,is_active FROM managers ORDER BY id ASC")->fetchAll();
              foreach($rows as $r){echo "AFTER id={$r["id"]} login={$r["login"]} display={$r["display_name"]} role={$r["role"]} active={$r["is_active"]}\n";}
            '
