name: Upload one fixed owner sample feed without a campaign
on:
  push:
    branches: [audit/direct-feed-sample-20261026]
    paths:
      - .github/workflows/direct-feed-sample-upload.yml
      - audit/direct-feed-sample-upload.py
      - audit/direct-feed-sample-runner.py
permissions:
  contents: read
concurrency:
  group: direct-feed-sample-owner-20261026
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upload only the fixed sample feed using the existing server token
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 1c1914c6c7207c336212e197513e7d22e162360140aa246262eb5cc22b67285e
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/direct-feed-sample-runner.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-feed-sample-owner-20261026
          path: encrypted-direct-feed-upload/*.enc.json
          retention-days: 3
          if-no-files-found: error
