name: Read installed advertising signal status
on:
  push:
    branches: [audit/advertising-signals-installed-20261025]
permissions:
  contents: read
jobs:
  installed-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_RUNTIME_SHA: 7254dc1765ea6f17dc435814645a121371f46283
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/signal_status_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo invalid_existing_identity; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Verify installed source and read aggregate status only
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, socket, subprocess, base64, hashlib, json
          from pathlib import Path
          host=os.environ['DEPLOY_HOST']; user=os.environ['DEPLOY_USER']; expected=os.environ['EXPECTED_RUNTIME_SHA']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host) or not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}',user) or not re.fullmatch(r'[a-f0-9]{40}',expected):
              raise SystemExit('invalid_fixed_target')
          addresses={v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}
          if addresses != {'5.45.122.54'}: raise SystemExit('canonical_host_changed')
          scan=subprocess.run(['ssh-keyscan','-T','10',host],capture_output=True,text=True,timeout=30)
          wanted='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0'
          pinned=[]
          for line in scan.stdout.splitlines():
              parts=line.split()
              if len(parts)!=3 or parts[0].startswith('#'): continue
              try: fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
              except ValueError: continue
              if fp==wanted: pinned.append(line)
          if not pinned: raise SystemExit('canonical_host_key_changed')
          known=Path(os.environ['RUNNER_TEMP'])/'signal_status_known_hosts';known.write_text('\n'.join(pinned)+'\n');known.chmod(0o600)
          pins={"migrations/064_advertising_signals.sql":"0d0223939a41b92f5e6b73f68156cf621032bee3","services/AdvertisingSignalRepository.php":"4c3495b98f34367035e5d2a3b799215bf66c0155","services/AdvertisingSignalService.php":"7055c7af93d2bee551db306f1f3d8b09220832e3","services/AdvertisingVisitContract.php":"c38a4d4ba4af9fcd10e9efade1e4aadf4dc3a7f4","services/ConversationDb.php":"bb6281faf55aca7beeae7f8a57389d19751936f7","services/IncomingUpdateDispatcher.php":"fabb4fb750dc936d745f66eec33753aaee7480e6","services/MetrikaConversionGoalService.php":"7d46d05d6de1b22a95a1144cce59d2226c0641b0","services/ProjectConfig.php":"538b596981f2c61fbf524e18756bf672578948f6","tools/advertising_signals.php":"4323167034c3d907ed56d5764f8e7c143127481b"}
          commands=['set -euo pipefail','cd /var/www/anytoour/data/www/app.anytoour.ru',f'test "$(git rev-parse HEAD)" = "{expected}"']
          for path,sha in pins.items():
              if not re.fullmatch(r'[A-Za-z0-9_./-]+',path) or '..' in path or not re.fullmatch(r'[a-f0-9]{40}',sha): raise SystemExit('invalid_source_pin')
              commands.append(f'test "$(git hash-object {path})" = "{sha}"')
          scope=' --project_key=anytour --source_key=tgmini --platform=telegram --counter_id=98615635'
          commands+=['php tools/advertising_signals.php status'+scope,'php tools/advertising_signals.php preview'+scope+' --after_id=0 --limit=100']
          run=subprocess.run(['ssh','-i',str(Path(os.environ['RUNNER_TEMP'])/'signal_status_key'),'-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=10',user+'@'+host,'bash -se'],input='\n'.join(commands)+'\n',capture_output=True,text=True,timeout=70)
          if run.returncode!=0 or run.stderr: raise SystemExit('installed_signal_read_failed')
          lines=run.stdout.splitlines()
          if len(lines)!=2: raise SystemExit('unexpected_status_output')
          status,preview=map(json.loads,lines)
          if status.get('database_writes') is not False or preview.get('database_writes') is not False or status.get('conversion_uploads')!=0 or preview.get('conversion_uploads')!=0: raise SystemExit('readonly_contract_failed')
          if set(status.get('signals',{}))!={'customer_activity','manager_request','customer_reply'} or set(preview.get('identity',{}))!={'missing','unique','ambiguous'}: raise SystemExit('aggregate_contract_failed')
          for values in [status['signals'],preview['identity']]:
              if any(type(v) is not int or v<0 for v in values.values()): raise SystemExit('invalid_aggregate')
          if type(preview.get('signals_read')) is not int or not 0<=preview['signals_read']<=100 or sum(preview['identity'].values())!=preview['signals_read']: raise SystemExit('invalid_preview_bound')
          print(json.dumps({'installed_sha':expected,'source_pins_verified':len(pins),'signals':status['signals'],'preview_limit':100,'preview_signals':preview['signals_read'],'identity':preview['identity'],'database_writes':False,'conversion_uploads':0}))
          PY
      - name: Remove runner-only private identity
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/signal_status_key" "$RUNNER_TEMP/signal_status_known_hosts"
