name: Finite read-only admission for Cape Fahn recovery PR1612
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/cape-fahn1612-release-admission-20261117.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: anytour-cape-fahn1612-read-only-admission
  cancel-in-progress: false
jobs:
  before-publisher:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '21b3964dcd2b4875129fa5971544047640ce86a2' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8281b387f258932601439eb789560f6b2cbabd4d
          persist-credentials: false
          sparse-checkout: tools
      - name: Authenticate unchanged canonical admission source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8281b387f258932601439eb789560f6b2cbabd4d
          test "$(git hash-object tools/release_priority.js)" = c2a8ec2df2af881f1b2eea5640476d9b945f9572
          test "$(git hash-object tools/deployment_release.js)" = 250bd3d8fdf144a0cbdec3db3fc6b6a718cb3166
          test "$(git hash-object tools/release_slot_close.js)" = d42b1969bb5dbddb4ccc26054eb590d3821c3de7
      - name: Execute canonical fresh pre-publisher admission with native reads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1612 8734fbfd029dd9541c57b742636025aa35a5100c 8281b387f258932601439eb789560f6b2cbabd4d
  after-publisher:
    needs: before-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8281b387f258932601439eb789560f6b2cbabd4d
          persist-credentials: false
          sparse-checkout: tools
      - name: Authenticate unchanged canonical admission source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8281b387f258932601439eb789560f6b2cbabd4d
          test "$(git hash-object tools/release_priority.js)" = c2a8ec2df2af881f1b2eea5640476d9b945f9572
          test "$(git hash-object tools/deployment_release.js)" = 250bd3d8fdf144a0cbdec3db3fc6b6a718cb3166
          test "$(git hash-object tools/release_slot_close.js)" = d42b1969bb5dbddb4ccc26054eb590d3821c3de7
      - name: Read only until this source owner binds its actual publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,re,subprocess,time
          def get(path):
              return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+path],timeout=10))
          for observation in range(60):
              pr=get('pulls/1612')
              assert pr['state']=='open' and not pr['draft']
              assert pr['head']['sha']=='8734fbfd029dd9541c57b742636025aa35a5100c'
              assert pr['base']['sha']=='8281b387f258932601439eb789560f6b2cbabd4d'
              markers=re.findall(r'<!--\s*release-slot-close:v1\s+(\{.*?\})\s*-->',pr.get('body') or '')
              assert len(markers)<=1
              if markers:
                  b=json.loads(markers[0])
                  assert set(b)=={'comment_id','owner_id','head_sha','updated_at'}
                  assert b['head_sha']=='8734fbfd029dd9541c57b742636025aa35a5100c'
                  assert b['owner_id']==226193297 and isinstance(b['comment_id'],int) and b['comment_id']>0
                  assert re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ',b['updated_at'])
                  record=get('issues/comments/'+str(b['comment_id']))
                  assert record['user']['id']==b['owner_id'] and record['updated_at']==b['updated_at']
                  assert record['body']=='PR1612: выпуск занят'
                  with open(os.environ['GITHUB_ENV'],'a') as target:
                      target.write('PUBLISHER_COMMENT='+str(b['comment_id'])+'\n')
                      target.write('PUBLISHER_OWNER='+str(b['owner_id'])+'\n')
                      target.write('PUBLISHER_ACQUIRED='+b['updated_at']+'\n')
                  print(json.dumps({'binding_read':True,**b}))
                  break
              if observation==59: raise RuntimeError('publisher_binding_not_observed')
              time.sleep(5)
          PY
      - name: Execute canonical fresh bound admission with native reads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1612 8734fbfd029dd9541c57b742636025aa35a5100c 8281b387f258932601439eb789560f6b2cbabd4d --publisher "$PUBLISHER_COMMENT" "$PUBLISHER_OWNER" "$PUBLISHER_ACQUIRED"
