name: Configure the fixed regional manager setup once

on:
  push:
    branches:
      - audit/regional-manager-provision-20261111
    paths:
      - '.github/workflows/regional-manager-provision.yml'
      - 'tools/provision_regional_managers.php'
      - 'tests/run_regional_manager_provision_regression.php'
      - 'tests/fixtures/provision-openssl.cnf.txt'
      - 'audit/regional-manager-plan.enc.json'

permissions:
  contents: read

concurrency:
  group: regional-manager-provision-20261111
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/audit/regional-manager-provision-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The release owner pins the accepted installed feature SHA before the
      # first push. This placeholder deliberately cannot pass the source gate.
      EXPECTED_APPLICATION_SHA: 28a87f74f52b848d95131fd13754e3182af500aa
      # Reviewed literal; reprepare/apply/status are separate explicit updates.
      PROVISION_OPERATION: reprepare
      # Used only by explicit reprepare of an expired, unwritten receipt.
      PROVISION_PRIOR_REQUEST_ID: da7c944dc2fc4d69d137ae4d10c51405
      PROVISION_PRIOR_APPLICATION_SHA: 7aaaba7b1e2d86aaeac66b06eeb1466523e3628f
    steps:
      - name: Check out the exact standalone operator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/provision_regional_managers.php
            /tests/run_regional_manager_provision_regression.php
            /tests/fixtures/provision-openssl.cnf.txt
            /audit/regional-manager-plan.enc.json

      - name: Verify the local crypto and fail-closed state machine
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/provision_regional_managers.php
          php tests/run_regional_manager_provision_regression.php

      - name: Prepare the existing canonical connection
        env:
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/regional_provision_key"
          raw="$STANDBY_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'REGIONAL_MANAGER_PROVISION_ERROR=CANONICAL_KEY_UNAVAILABLE' >&2; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null 2>/dev/null || { echo 'REGIONAL_MANAGER_PROVISION_ERROR=CANONICAL_KEY_UNAVAILABLE' >&2; exit 1; }

      - name: Execute only the reviewed fixed operation
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$PROVISION_OPERATION" in prepare|reprepare|apply|status) ;; *) exit 1 ;; esac
          runner="$RUNNER_TEMP/regional-provision-run.php"
          output="$RUNNER_TEMP/regional-provision-output.json"
          diagnostics="$RUNNER_TEMP/regional-provision.stderr"
          # Only ciphertext is embedded in the CLI stream. No plaintext account
          # plan, password, browser session or bearer is passed to Actions.
          python3 - "$runner" <<'PY'
          import base64,json,os,pathlib,re,sys
          def require(ok):
              if not ok: raise ValueError('fixed_operator_input_invalid')
          mode=os.environ['PROVISION_OPERATION']; sha=os.environ['EXPECTED_APPLICATION_SHA']
          require(mode in ('prepare','reprepare','apply','status') and re.fullmatch(r'[a-f0-9]{40}',sha))
          source=pathlib.Path('tools/provision_regional_managers.php').read_text()
          prefix='<?php\ndeclare(strict_types=1);\n'
          require(source.startswith(prefix))
          envelope=''
          if mode=='apply':
              path=pathlib.Path('audit/regional-manager-plan.enc.json')
              require(path.is_file() and not path.is_symlink() and path.stat().st_size<=524288)
              envelope=path.read_text(); p=json.loads(envelope)
              require(set(p)=={'version','algorithm','encrypted_key','nonce','tag','ciphertext'} and p['version']==1 and p['algorithm']=='RSA-OAEP-SHA1+A256GCM')
              for key in ('encrypted_key','nonce','tag','ciphertext'):
                  require(isinstance(p[key],str) and base64.b64encode(base64.b64decode(p[key],validate=True)).decode()==p[key])
              require(len(base64.b64decode(p['encrypted_key']))==384 and len(base64.b64decode(p['nonce']))==12 and len(base64.b64decode(p['tag']))==16)
          values={'REGIONAL_PROVISION_MODE':mode,'REGIONAL_PROVISION_EXPECTED_SHA':sha,'REGIONAL_PROVISION_ENVELOPE':envelope}
          if mode=='reprepare':
              prior_request=os.environ['PROVISION_PRIOR_REQUEST_ID']; prior_sha=os.environ['PROVISION_PRIOR_APPLICATION_SHA']
              require(re.fullmatch(r'[a-f0-9]{32}',prior_request) and re.fullmatch(r'[a-f0-9]{40}',prior_sha))
              values.update(REGIONAL_PROVISION_PRIOR_REQUEST_ID=prior_request,REGIONAL_PROVISION_PRIOR_APPLICATION_SHA=prior_sha)
          prelude=''.join("define('"+key+"',base64_decode('"+base64.b64encode(value.encode()).decode()+"'));\n" for key,value in values.items())
          pathlib.Path(sys.argv[1]).write_text(prefix+prelude+source[len(prefix):])
          PY
          # These are the existing canonical STANDBY connection options; this
          # task does not alter the production SSH policy or use another host.
          if ! ssh -i "$RUNNER_TEMP/regional_provision_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -eu; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_APPLICATION_SHA'; ALLOW_REGIONAL_MANAGER_PROVISION_WRITE=1 php -d display_errors=0 -d log_errors=0" \
            < "$runner" > "$output" 2> "$diagnostics"; then
            python3 - "$diagnostics" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read(8192)
          codes=re.findall(r'^REGIONAL_MANAGER_PROVISION_ERROR=([A-Z_]{1,80})$',text,re.M)
          print('REGIONAL_MANAGER_PROVISION_ERROR='+(codes[-1] if codes else 'CANONICAL_OPERATION_UNAVAILABLE'),file=sys.stderr)
          PY
            exit 1
          fi
          python3 - "$output" <<'PY'
          import base64,json,sys
          raw=open(sys.argv[1],encoding='utf-8').read(524289)
          prefix='REGIONAL_MANAGER_PROVISION_PACKET='
          assert len(raw)<=524288 and raw.startswith(prefix) and raw.endswith('\n') and raw.count('\n')==1
          p=json.loads(raw[len(prefix):])
          assert set(p)=={'version','algorithm','encrypted_key','nonce','tag','ciphertext'} and p['version']==1 and p['algorithm']=='RSA-OAEP-SHA1+A256GCM'
          for key in ('encrypted_key','nonce','tag','ciphertext'):
              assert isinstance(p[key],str) and base64.b64encode(base64.b64decode(p[key],validate=True)).decode()==p[key]
          assert len(base64.b64decode(p['encrypted_key']))==384 and len(base64.b64decode(p['nonce']))==12 and len(base64.b64decode(p['tag']))==16
          print(raw.strip())
          PY

      - name: Remove ephemeral runner connection and ciphertext files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/regional_provision_key" "$RUNNER_TEMP/regional-provision-run.php" "$RUNNER_TEMP/regional-provision-output.json" "$RUNNER_TEMP/regional-provision.stderr"
