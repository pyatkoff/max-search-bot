name: Inspect original PR1505 metadata reads without writes
on:
  push:
    branches: [audit/hotel503-reads-20261112]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-modeled-value-configuration
  cancel-in-progress: false
jobs:
  release-slot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read original evidence through the actual native read capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),{createRequire}=require('node:module');
          const file=path.resolve('tools/release_slot_close.js'),text=fs.readFileSync(file,'utf8').replace(/^#![^\n]*\n/,''),m={exports:{}};
          new Function('require','module','exports',text+'\nmodule.exports.inspectPredecessors=continuationPredecessors;')(createRequire(file),m,m.exports);
          const C=m.exports,R=require('./tools/deployment_release'),p=R.TERMINAL_RECOVERY,raw=R.makeReadApi(process.env.GITHUB_TOKEN);
          const trace=async(action,label)=>{try{const v=await action();process.stdout.write('AUDIT_READ_OK '+label+'\n');return v;}catch(e){process.stdout.write('AUDIT_READ_REFUSED '+label+' '+e.code+'\n');throw e;}};
          const api=async(method,url,body,rawMode)=>{if(method!=='GET')throw Error('writes_forbidden');return trace(()=>raw(method,url,body,rawMode),url.replace(R.API_ROOT+'/',''));};
          api.artifact=meta=>trace(()=>raw.artifact(meta),'artifact:'+meta.id);
          api.jobLog=id=>trace(()=>raw.jobLog(id),'job_log:'+id);
          const read=C.terminalReads(api),get=url=>read('GET',R.API_ROOT+url);
          (async()=>{
           await C.inspectPredecessors(read);
           const original=await R.readRecord(read,p.commit);
           R.requireValue(original.blob===p.blob&&original.record_digest===p.record_digest,'original_terminal_changed');R.validateRelease(original.record);
           const run=await get('/actions/runs/'+p.run_id);
           R.runIdentity(run,{id:p.run_id,attempt:1,head:p.sha,workflow:R.CLOSER,event:'workflow_run',conclusion:'failure'});
           C.recoveryLog(await read.jobLog(p.job_id));
           const meta=await R.findArtifact(read,run,R.publicationName('pending_terminal',p.run_id,1));
           const proof=await R.artifactJson(read,meta,R.PUBLICATION_FILE,run,meta.name);R.validatePublication(proof,original.record);
           await R.requireAncestry(read,proof.commit,p.commit);
           const c={sha:p.sha,deploy:Number(original.record.run_id),run:Number(p.run_id),configure:'skipped',activation:false,terminalRecovery:true};
           const selected=await C.selectReleaseRuns(await get('/actions/runs?head_sha='+p.sha+'&per_page=100'),c,get);
           R.requireValue(C.gateState(selected.runs,c)==='ready'&&!selected.waiting,'gates_changed');
           R.requireValue(R.same(C.gateReferences(selected.runs),original.record.repository_release.closure.gates),'gates_changed');
           C.verifyConfigure(await get('/actions/runs/'+p.run_id+'/attempts/1/jobs?per_page=100'),c);
           await R.deploymentProof(read,R.installationReceipt(original.record));await R.requireOps(read,p.sha);
           const current=await R.readRecord(read);R.requireValue(current.blob===p.blob&&current.record_digest===p.record_digest,'prepared_result_changed');
           const b=C.binding(await get('/pulls/'+p.pr),p.sha);R.requireValue(C.recordState(await get('/issues/comments/'+p.comment_id),b)==='active','publisher_changed');
           R.requireValue((await get('/git/ref/heads/main')).object.sha===p.sha,'main_changed');
           process.stdout.write('AUDIT_OBSERVATION_ONLY '+JSON.stringify({original_proof_read:true,all_original_gates_read:true,publisher_unchanged:true,record_write_attempts:0})+'\n');
          })().catch(e=>{process.stderr.write('AUDIT_REFUSED '+(e.code||e.message)+'\n');process.exitCode=1;});
          
          JS
