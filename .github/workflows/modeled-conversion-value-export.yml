name: Inspect the stopped PR1505 continuation context
on:
  push:
    branches: [ops/recover-pr1505-terminal-20261112]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-modeled-value-configuration
  cancel-in-progress: false
jobs:
  release-slot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only allowlisted native event and run identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const e=require(process.env.GITHUB_EVENT_PATH),names=['GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_WORKFLOW_REF','GITHUB_JOB','GITHUB_RUN_ATTEMPT','GITHUB_RUN_ID','GITHUB_SHA'];
          const result={env:Object.fromEntries(names.map(n=>[n,process.env[n]])),event:{repository:e.repository?.full_name,ref:e.ref,before:e.before,after:e.after,created:e.created,deleted:e.deleted,forced:e.forced}};
          (async()=>{const r=await fetch('https://api.github.com/repos/pyatkoff/max-search-bot/actions/runs/'+process.env.GITHUB_RUN_ID,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('api_http_'+r.status);const x=await r.json();result.native={id:x.id,status:x.status,actor_id:x.actor?.id,head_sha:x.head_sha,head_branch:x.head_branch,event:x.event,path:x.path,run_attempt:x.run_attempt};process.stdout.write('TERMINAL_CONTEXT '+JSON.stringify(result)+'\n');})().catch(e=>{process.stderr.write(e.message+'\n');process.exitCode=1});
          JS
