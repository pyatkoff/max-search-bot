name: Prune legacy base once

on:
  push:
    branches: [main]
    paths:
      - 'tools/prune_legacy_base.php'
      - '.github/workflows/prune-legacy-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Prune extracted legacy methods
        run: php tools/prune_legacy_base.php

      - name: Verify syntax
        run: php -l maxsearchbaseclass.php

      - name: Commit cleanup when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- maxsearchbaseclass.php; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maxsearchbaseclass.php
          git commit -m 'Prune extracted methods from legacy base'
          git push origin HEAD:main
