name: Autopilot prune legacy tour links

on:
  push:
    branches:
      - autopilot/prune-legacy-tour-link-methods

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/prune-legacy-tour-link-methods
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Prune superseded methods
        run: |
          php tools/prune_legacy_base.php
          ! grep -q '/poisk-turov-tg/' maxsearchbaseclass.php
          ! grep -q 'function getLatestClaimLink' maxsearchbaseclass.php
          ! grep -q 'function showChannelOffer' maxsearchbaseclass.php
          php -l maxsearchbaseclass.php
          php -l maxsearchclass.php
          php tests/run_v2_architecture_regression.php
      - name: Commit pruned source and remove helper workflow
        run: |
          rm .github/workflows/autopilot-prune-legacy-tour-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maxsearchbaseclass.php .github/workflows/autopilot-prune-legacy-tour-link.yml
          git commit -m 'Remove superseded legacy tour link methods'
          git push origin HEAD:autopilot/prune-legacy-tour-link-methods
