# DRAFT ONLY: intended to replace the existing path on the fixed diagnostic ref, never main.
name: Manager2 overlay context diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: manager2-overlay-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  overlay-cause:
    name: overlay-cause / chromium (diagnostic only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository ==
      'pyatkoff/max-search-bot' && github.ref ==
      'refs/heads/codex/manager2-overlay-ci-diagnostic-20261102' &&
      github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash /opt/manager2-qa/run {0}
    timeout-minutes: 8
    env:
      TZ: UTC
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      NODE_PATH: /opt/manager2-qa/node_modules
      DIAG_PRODUCT_ROOT: ${{ github.workspace }}/product
      DIAG_OBSERVER_ROOT: ${{ github.workspace }}/diagnostic/tools/diagnostics/manager2-overlay
      DIAG_OUTPUT_DIR: ${{ runner.temp }}/manager2-overlay-causal
      M2_QA_SOURCE_ROOT: ${{ github.workspace }}/product
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}/product
    steps:
      - name: Read reviewed diagnostic code on the isolated ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          fetch-depth: 1
          persist-credentials: false
      - name: Freeze the original tested product separately
        uses: actions/checkout@v4
        with:
          ref: adb00d866c6c816964c1cd0ba1a2c5b208d89e9a
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the evidence directory
        working-directory: product
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_OUTPUT_DIR"
          chown "$(id -u):$(id -g)" "$HOME"
      - name: Verify pinned runtime and execute one observed original case
        working-directory: product
        run: |
          set -euo pipefail
          node "$DIAG_OBSERVER_ROOT/run-once.cjs" --execute-once
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager2-overlay-cause-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager2-overlay-causal/
          if-no-files-found: error
          overwrite: false
          retention-days: 14
