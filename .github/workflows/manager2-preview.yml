name: Manager2 preview checks

on:
  push:
    branches: ['m2-preview/**']
    paths:
      - 'manager/**'
      - 'manager2/**'
      - 'tests/visual/**'
      - '.github/workflows/manager2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager2-preview-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preview-smoke:
    name: preview-smoke / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Setup PHP for real Manager shell
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache pinned npm and browser downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: manager2-preview-${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-${{ matrix.browser }}
      - name: Install pinned browser including system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npm install --prefer-offline --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps "$BROWSER"
      - name: Start local synthetic fixture server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview-server.log"
          exit 1
      # Eight existing real-shell scenarios per engine; all APIs are synthetic.
      # This separate status never satisfies the full PR screenshots gate.
      - name: Check mobile and desktop preview
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/visual/manager2-workspace.spec.js --grep 'compact header keeps native tools|actual shell boots, preserves canonical paths' --browser="$BROWSER" --reporter=line --workers=1
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager2-preview-${{ github.sha }}-${{ matrix.browser }}
          overwrite: true
          path: |
            manager2-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 7
