name: Manager2 preview checks

on:
  push:
    branches: ['m2-preview/**']
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'manager/**'
      - 'manager2/**'
      - 'tests/visual/**'
      - '.github/workflows/manager2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: manager2-preview-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preview-smoke:
    name: preview-smoke / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Start local synthetic fixture server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview-server.log"
          exit 1
      # Eight existing real-shell scenarios per engine; all APIs are synthetic.
      # This separate status never satisfies the full PR screenshots gate.
      - name: Check mobile and desktop preview
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/visual/manager2-workspace.spec.js --grep 'compact header keeps native tools|actual shell boots, preserves canonical paths' --browser="$BROWSER" --reporter=line --workers=1
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager2-preview-${{ github.sha }}-${{ matrix.browser }}
          overwrite: true
          path: |
            manager2-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 7
