          receipt={'state':'REMAINING70_CLASSIFIED_SOURCE_ONLY_NO_SEND','rows':recs,'prepared_count':len(prepared),'held_count':70-len(prepared),'sender_calls':0,'feed_writes':0,'qa_sheets':sheets,'native_screen':screen}
