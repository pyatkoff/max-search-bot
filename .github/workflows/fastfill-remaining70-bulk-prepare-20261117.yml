                      if len(selected)==3:break
                  assert len(selected)==3,'fewer_than_three_valid_source_images'
                  b=m['encode_png'](m['draw_cover'](r['hotel'],selected,logo.copy()))
                  (root/(str(hid)+'.png')).write_bytes(b)
