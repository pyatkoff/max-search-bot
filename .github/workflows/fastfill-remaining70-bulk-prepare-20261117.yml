              if hid in matched:rec['reason']='existing_native_or_alias_publication';return rec,None
              if r['editorial_hold']:rec['reason']=r['editorial_hold'];return rec,None
              try:
                  data=json.loads(get(r['source_api_url']))
                  found=[]
                  def walk(v):
                      if isinstance(v,dict):
                          if v.get('id')==hid:found.append(v)
                          for x in v.values():walk(x)
                      elif isinstance(v,list):
                          for x in v:walk(x)
                  walk(data);assert len(found)==1,'ambiguous_native_identity'
                  d=found[0];cid=d['country']['id']
                  assert html.unescape(d['name']).strip()==html.unescape(r['provider_name']).strip(),'provider_name_changed'
                  assert d['country']['name']==r['provider_country'],'provider_country_changed'
                  images=json.dumps(d['images'],ensure_ascii=False);selected=[];photo_receipts=[]
