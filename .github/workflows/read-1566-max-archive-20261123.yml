name: "Reproduce the MAX caption call on the exact before and after source"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  verify_public:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '6b048fd0deb930b1a1f883852fd218ee16f07912' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 251331bb4cb4984e34e3c24e82fb8c2e7fdb29fe
          path: before
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: caa0e2b376b1e7fc11eae261fcca9e29b8bf763b
          path: after
          persist-credentials: false
      - name: Check the exact caller and production parser against a two-post landing page
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = 251331bb4cb4984e34e3c24e82fb8c2e7fdb29fe
          test "$(git -C after rev-parse HEAD)" = caa0e2b376b1e7fc11eae261fcca9e29b8bf763b
          php -l after/tools/anytour_existing_post_batch.php
          cat > "$RUNNER_TEMP/max-caption-call.php" <<'PHP'
          <?php
          declare(strict_types=1);
          final class PromotedHotelPriceWriter {
              public const URL='https://max.ru/anytour/AaBI6Jfvad8';
              public static function publicBytes(string $url): string {
                  if($url!==self::URL) throw new RuntimeException('wrong_fetch_url');
                  return 'public_html_fixture';
              }
              public static function maxPublicCaption(string $html,?string $expectedUrl=null):string {
                  if($html!=='public_html_fixture'||$expectedUrl!==self::URL)throw new RuntimeException('wrong_or_missing_public_url');
                  return 'Moreno Horizon Spa & Resort';
              }
          }
          require getcwd().'/'.$argv[1].'/tools/anytour_existing_post_batch.php';
          try {
              $read=AnyTour\ExistingPostBatch\publicHotelPost(['platform'=>'max','url'=>PromotedHotelPriceWriter::URL]);
              if($argv[1]!=='after'||$read!==['text'=>'Moreno Horizon Spa & Resort']) exit(1);
              echo "CONTENT_READER_EXACT_URL=verified\n";
          } catch(RuntimeException $e) {
              if($argv[1]!=='before'||$e->getMessage()!=='wrong_or_missing_public_url') throw $e;
              echo "PREVIOUS_CONTENT_READER_MISSING_URL=reproduced\n";
          }
          PHP
          php "$RUNNER_TEMP/max-caption-call.php" before
          php "$RUNNER_TEMP/max-caption-call.php" after
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'after/services/PromotedHotelPriceWriter.php';
          $exact='https://max.ru/anytour/AaBI6Jfvad8';
          $other='https://max.ru/anytour/AZ_rrRmlYz0';
          $page=static fn($url,$text)=>'message:{id:1234,link:'.json_encode($url,JSON_UNESCAPED_SLASHES).
              ',createdAt:"2026-11-20T09:03:17.000Z",updatedAt:null,text:'.json_encode($text).',attachments:[]}';
          $body=$page($other,'Recommendation')."\n".$page($exact,'Moreno Horizon Spa &amp; Resort');
          if(PromotedHotelPriceWriter::maxPublicCaption($body,$exact)!=='Moreno Horizon Spa & Resort') exit(1);
          try {
              PromotedHotelPriceWriter::maxPublicCaption($body,'https://max.ru/anytour/AaC42fW_AY0');
          } catch(RuntimeException $e) {
              if($e->getMessage()!=='max_public_caption_unavailable')throw $e;
              echo "STRICT_MAX_CAPTION=exact_match_and_wrong_url_rejected\n";
              exit(0);
          }
          exit(1);
          PHP
