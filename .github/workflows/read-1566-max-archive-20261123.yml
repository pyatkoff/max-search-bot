name: "#1566 Verify both live feeds for seventeen active older MAX routes"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '52119f688014a00e7ae49d0b40fb56301b5afc4a' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only current offer identities and context macros
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,re,urllib.request,xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone,timedelta
          urls={'max':'https://app.anytoour.ru/feed/hotel-posts-max.xml',
                'all':'https://app.anytoour.ru/feed/hotel-posts-all.xml'}
          identity=re.compile(r'(?:\bSO\s*/?\s*(?:Ras[\s-]+Al[\s-]+Khaimah|Рас[\s-]+Аль[\s-]+Хайма)|\bSO\s*/\s*Ras\b)',re.I)
          known={"max_12107":"h1_67ef3ba3193b1712dd26aaa72b84c53b","max_132":"h1_9012b098a7f4a0274327378f9c2ea1b1","max_469":"h1_49bc026db7ab1e7a8c362f336fb2d1eb","max_12111":"h1_55ccf842729a16e4f7db54841b6e7d5f","max_70048":"h1_671fd7c3e4c3ea3b90376b27ea865c68","max_82606":"h1_08a126f7c674d2a94bea6294042071a6","max_1344":"h1_bb9e6c662f29331b61bf6722d81d3ac4","max_260":"h1_42bde90366927f834271bb2e5a4376a2","max_2493":"h1_0881361a66855795ecc591b6056f1c69","max_3452":"h1_7dff10d97577ac44a5681487e35ba946","max_4181":"h1_a2c2bc5059137308cc19a3cf33bf7887","max_37668":"h1_ed063381a2fd22c6c44d635a92e20024","max_43676":"h1_8259ce86f3d70e7d6528537e42050138","max_64895":"h1_0279ea0e0bf95050bada0ed3aa07a034","max_73974":"h1_b029c6da4006a0b3f1169f6a71e73005","max_74503":"h1_6992e43fbd907df3327e69e934a6df63","max_99713":"h1_7c7cb5975c74ed29b0b444251c014bd3"}
          def inspect(entry):
              label,url=entry
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=12) as r:
                  assert r.status==200 and r.geturl()==url
                  raw=r.read(8000001)
              assert 0<len(raw)<=8000000 and b'<!DOCTYPE' not in raw.upper()
              offers=ET.fromstring(raw).findall('./shop/offers/offer')
              seen=set()
              rows=[]
              near=[]
              for offer in offers:
                  offer_id=offer.get('id')
                  assert offer_id and offer_id not in seen
                  seen.add(offer_id)
                  if not offer_id.startswith("max_"):
                      continue
                  title=offer.findtext('name','')
                  names=" ".join([title,offer.findtext('model','')]+[(x.text or '') for x in offer.findall('param')])
                  test=offer_id in known
                  if not test and title and re.search(r'Ras\s+Al\s+Khaimah|Рас[- ]эль[- ]Хайм',title,re.I):
                      near.append({'offer_id':offer_id,'name':title[:160]})
                  if not test:
                      continue
                  href=offer.findtext('url','')
                  token=re.search(r'_ctx1_([A-Za-z0-9_-]+)',href)
                  c=json.loads(base64.urlsafe_b64decode(token[1]+'='*(-len(token[1])%4))) if token else {}
                  item={'offer_id':offer_id,'name':title[:170],'exact_alias_match':c.get('post_id')==known[offer_id],
                        'context_offer_matches':c.get('offer_id')==offer_id,'source_alias':c.get('post_id'),
                        'has_attribution_macros':all(k in href for k in ('{yclid}','{campaign_id}','{region_id}')),
                        'ad_url_sha256':hashlib.sha256(href.encode()).hexdigest() if href else None,
                        'image_present':bool(offer.findtext('picture',''))}
                  price=offer.findtext('price','')
                  observation=re.findall(r'Цена найдена мониторингом (\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\.',offer.findtext('description',''))
                  item['numeric_price_present']=bool(re.fullmatch(r'[1-9][0-9]*(?:\.[0-9]{1,2})?',price))
                  stamp=datetime.strptime(observation[0],'%d.%m.%Y, %H:%M').replace(tzinfo=timezone(timedelta(hours=3))) if len(observation)==1 else None
                  item['observed_at_msk']=stamp.isoformat() if stamp else None
                  item['fresh_within_36h']=bool(stamp and timedelta(0)<=datetime.now(timezone.utc)-stamp<timedelta(hours=36))
                  rows.append(item)
              return label,{'offer_count':len(seen),'exact_and_reference_rows':rows,'other_ras_titles':near[:12]}
          with ThreadPoolExecutor(max_workers=2) as pool:
              reads=dict(pool.map(inspect,urls.items()))
          out={'observed_utc':datetime.now(timezone.utc).isoformat(),'reads':reads,'ad_clicks':0,'writes':0}
          pathlib.Path('pub/observed.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX17_ACTIVE_EXACT_FEED_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max17-active-exact-offer-readback
          path: pub/observed.json
          retention-days: 7
