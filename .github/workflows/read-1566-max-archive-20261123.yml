          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          digest=lambda data: hashlib.sha256(data).hexdigest()
          scope=json.loads(pathlib.Path("draft.json").read_bytes())
          for key,expected in (("archive",scope["archive_sha256"]),("native",scope["native_source"]["zip_sha256"])):
              raw=pathlib.Path(key+".zip")
              assert raw.stat().st_size<300000 and digest(raw.read_bytes())==expected
              with zipfile.ZipFile(raw) as z:
                  assert z.namelist()==["registry.json"] and z.getinfo("registry.json").file_size<2000000
                  pathlib.Path("stage/"+key+".json").write_bytes(z.read("registry.json"))
          stage=pathlib.Path("stage")
          assert digest((stage/"archive.json").read_bytes())==scope["archive_registry_sha256"]
          nativebytes=(stage/"native.json").read_bytes()
          scope["native_source"]["json_sha256"]=digest(nativebytes)
          observed=json.loads(nativebytes)
          assert observed["ok"] is True and [r["hotel_id"] for r in observed["rows"]]==[r["hotel_id"] for r in scope["rows"]]
          observations=[]
          for row,source in zip(scope["rows"],observed["rows"]):
              assert source["source_id"]==row["source_id"] and source["target_mid"]==row["target_mid"]
              row["source_mid"]=source["source_mid"]
              identity=[source[k] for k in ("hotel_id","source_id","source_mid","native_source_date_ms","source_version","source_content_sha256","source_photo_sha256","source_caption_sha256","target_mid")]
              legacy=digest(json.dumps(identity,ensure_ascii=False,separators=(",",":")).encode())
              assert row["original_legacy_identity_sha256"] in (None,legacy)
              row["original_legacy_identity_sha256"]=legacy
              assert re.fullmatch(r"mid\.[0-9a-f]{32}",row["source_mid"])
              observations.append({"hotel_id":row["hotel_id"],"version":source["source_version"],"stored_price_record":source["source_price_record_ref"],"stored_price_observation":source["source_price_observation_text"]})
          scope["price_review"].update({"source_versions":observations,"checked_utc":observed["groups"][-1]["read_utc"]})
          scopebytes=(json.dumps(scope,ensure_ascii=False,indent=2)+"\n").encode()
          (stage/"scope.json").write_bytes(scopebytes)
          entry=stage/"batch_entry.php"
          content,n=re.subn(r"(const MAX_BATCH_SCOPE_SHA256 = ')[a-f0-9]{64}(')",lambda m:m[1]+digest(scopebytes)+m[2],entry.read_text())
          assert n==1
          entry.write_text(content)
          PY
          php -l stage/batch_entry.php
