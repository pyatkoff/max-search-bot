name: "#1566 Read further ranked MAX hotel sources from the remaining verified demand cohort"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'c23af3431ccb00de95a6becd898bc20194f98767' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe ranked source cards and existing offer aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45385556709 > pub/rank-run.json
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14915463382 > pub/rank-meta.json
          curl -fsSL --max-time 25 --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/pyatkoff/max-search-bot/actions/artifacts/14915463382/zip -o pub/rank.zip
          gh api /repos/pyatkoff/max-search-bot/git/blobs/ba5ac7207da7fe185c1d864726bc240ba273976d --jq .content | base64 --decode > pub/bindings.json
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import zipfile
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          excluded = set([106,109,111,114,125,132,133,139,150,174,195,206,218,231,236,240,241,246,247,253,260,263,266,268,272,287,288,293,302,325,341,352,358,371,381,389,393,408,415,418,435,441,454,465,466,469,483,497,513,547,599,632,706,713,768,800,932,948,949,954,955,975,996,1032,1033,1035,1055,1067,1074,1096,1100,1105,1124,1142,1143,1149,1151,1221,1257,1260,1313,1334,1336,1344,1402,1420,1421,1429,1439,1451,1569,1588,1589,1647,1959,1960,1971,1972,1981,2435,2436,2457,2458,2470,2478,2493,2522,2588,2794,3405,3415,3452,4054,4060,4074,4079,4091,4181,4270,7458,8020,8094,9321,9373,11791,12107,12111,12114,12125,13870,14135,14140,15693,15873,15879,22791,23723,24909,26844,27426,27652,28272,28327,28460,28509,28581,28754,30158,32322,32342,37668,40222,41149,41495,43676,43689,45496,46670,47025,50869,51238,54605,56092,57028,59114,63191,64895,64914,64918,65877,70048,73343,73974,74503,75100,76588,77914,79071,82106,82606,85417,99713,107938,118475,132016])
          reserve = json.loads("[{\"url\":\"https://max.ru/anytour/AZwEq2zVLGY\",\"mid\":\"mid.ffffc1752b045fed019c04ab6cd52c66\",\"hotel_name\":\"The Marin Phuket\"},{\"url\":\"https://max.ru/anytour/AZwpDhM0dC0\",\"mid\":\"mid.ffffc1752b045fed019c290e1334742d\",\"hotel_name\":\"Akka Alinda Hotel\"},{\"url\":\"https://max.ru/anytour/AZxcpmMWNUI\",\"mid\":\"mid.ffffc1752b045fed019c5ca663163542\",\"hotel_name\":\"Address Beach Resort Fujairah\"},{\"url\":\"https://max.ru/anytour/AZ82fl5vOjg\",\"mid\":\"mid.ffffc1752b045fed019f367e5e6f3a38\",\"hotel_name\":\"SO/ Ras Al Khaimah\"}]")
          rank_run = json.loads(pathlib.Path("pub/rank-run.json").read_bytes())
          rank_meta = json.loads(pathlib.Path("pub/rank-meta.json").read_bytes())
          digest = "b41f4d47c1041204ed6830730d7ab8805af15a0647787aa5658eecca398314fe"
          assert (rank_run["id"], rank_run["run_attempt"], rank_run["conclusion"]) == (45385556709, 1, "success")
          assert rank_meta["id"] == 14915463382 and rank_meta["workflow_run"]["id"] == rank_run["id"] and not rank_meta["expired"]
          assert rank_meta["digest"] == "sha256:" + digest and hashlib.sha256(pathlib.Path("pub/rank.zip").read_bytes()).hexdigest() == digest
          with zipfile.ZipFile("pub/rank.zip") as source:
              assert source.namelist() == ["registry.json"] and source.getinfo("registry.json").file_size < 1_000_000
              ranked = json.loads(source.read("registry.json"))
          assert ranked["ok"] and ranked["ranked_hotels"] == len(ranked["rows"]) == 184
          map_bytes = pathlib.Path("pub/bindings.json").read_bytes()
          assert hashlib.sha1(b"blob " + str(len(map_bytes)).encode() + b"\0" + map_bytes).hexdigest() == "ba5ac7207da7fe185c1d864726bc240ba273976d"
          canonical = json.loads(map_bytes)
          by_offer = {x["offer_id"]:x for x in canonical["bindings_by_post_id"].values()}
          assert len(by_offer) == canonical["binding_count"] == 1055
          candidates = []
          for priority, row in enumerate(ranked["rows"], 1):
              if row["hotel_id"] in excluded:
                  continue
              binding = by_offer.get(row["max_offer"])
              if not binding or int(binding["hotel_id"]) != row["hotel_id"]:
                  continue
              assert re.fullmatch(r"https://max.ru/channel_anytour/[A-Za-z0-9_-]{11}",binding["post_url"])
              candidates.append({"hotel_id":row["hotel_id"],"rank":priority,"rank_name":row["hotel_name"],
                                 "offer_id":row["max_offer"],"source_url":binding["post_url"],"source_alias":binding["alias"],
                                 "publication_id":int(binding["publication_id"]),"demand":row["source"]})
          assert 0 < len(candidates) <= 40
          assert len(candidates) == len({x["offer_id"] for x in candidates})
          feed_url = "https://app.anytoour.ru/feed/hotel-posts-max.xml"

          def load(url, limit):
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "*/*"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  assert response.geturl() == url
                  body = response.read(limit + 1)
                  assert body and len(body) <= limit
                  return body

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.meta = {}
                  self.parts = []
                  self.hidden = 0
              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if tag in ("script", "style"):
                      self.hidden += 1
                  if tag == "meta":
                      key = attrs.get("property", attrs.get("name", ""))
                      if key and attrs.get("content"):
                          self.meta[key] = attrs["content"]
              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.hidden:
                      self.hidden -= 1
              def handle_data(self, data):
                  if not self.hidden and data.strip():
                      self.parts.append(data.strip())

          def page(url):
              try:
                  raw = load(url, 3_000_000)
                  parsed = Page()
                  parsed.feed(raw.decode("utf-8", errors="replace"))
                  return {"url":url,"http":200,"title":parsed.meta.get("og:title",""),
                          "description":parsed.meta.get("og:description",parsed.meta.get("description","")),
                          "has_preview_image":bool(parsed.meta.get("og:image")),
                          "visible_text":"\n".join(parsed.parts)[:7000]}
              except urllib.error.HTTPError as error:
                  return {"url":url,"http":error.code}
              except (AssertionError, OSError, ValueError) as error:
                  return {"url":url,"error":type(error).__name__}

          wanted={row["offer_id"]:row for row in candidates}
          offers=[]
          reserve_matches=[]
          def normalized(name):
              return re.sub(r'[^a-z0-9]+', '', re.sub(r'^(?:туры|путевки|путёвки) в ', '', name.strip().casefold()))
          feed_error=None
          feed_sha=None
          try:
              raw=load(feed_url, 4_000_000)
              feed_sha=hashlib.sha256(raw).hexdigest()
              for item in ET.fromstring(raw).findall(".//offer"):
                  url=item.findtext("url","")
                  parts=re.search(r"_ctx1_([A-Za-z0-9_-]+)",url)
                  if not parts:
                      continue
                  token=parts[1]+"="*(-len(parts[1])%4)
                  key=json.loads(base64.urlsafe_b64decode(token))
                  referenced = by_offer.get(key.get("offer_id"))
                  for target in reserve:
                      if normalized(item.findtext("name",""))==normalized(target["hotel_name"]) and referenced and key.get("post_id")==referenced["alias"]:
                          reserve_matches.append({"target":target,"source":referenced})
                  if key.get("offer_id") not in wanted:
                      continue
                  c=wanted[key["offer_id"]]
                  matches=key.get("post_id")==c["source_alias"] and all(part in url for part in ("{yclid}","{campaign_id}","{region_id}"))
                  offers.append({"offer_id":key["offer_id"],"binding_matches":matches,"name":item.findtext("name",""),
                                 "description":item.findtext("description",""),"has_preview_image":item.find("picture") is not None})
          except urllib.error.HTTPError as error:
              feed_error=f"HTTP_{error.code}"
          except (AssertionError, OSError, ValueError, ET.ParseError) as error:
              feed_error=type(error).__name__
          def source_present(item):
              title = item.get("title", "")
              return (item.get("http") == 200 and item.get("has_preview_image") and
                      "@channel_anytour" in item.get("visible_text", "") and "Горящие туры - AnyTour" in title)

          with ThreadPoolExecutor(max_workers=4) as executor:
              pages = list(executor.map(page, [x["source_url"] for x in candidates]))
          retry_indices = [index for index, item in enumerate(pages) if not source_present(item)]
          if retry_indices:
              from time import sleep
              sleep(2)
              with ThreadPoolExecutor(max_workers=2) as executor:
                  refreshed = executor.map(page, [pages[i]["url"] for i in retry_indices])
                  for index, item in zip(retry_indices, refreshed):
                      pages[index] = item
          assert len(pages) == len({p["url"] for p in pages}) == len(candidates)
          result={"observed_utc":datetime.now(timezone.utc).isoformat(),"feed_sha256":feed_sha,"feed_error":feed_error,
                  "offers":offers,"pages":pages,"candidates":candidates,"same_hotel_album_references":reserve_matches,"production_writes":0}
          pathlib.Path("pub/observation.json").write_text(json.dumps(result,ensure_ascii=False))
          print("MAX_MORE_PREPARATION=" + json.dumps({"feed_error":feed_error,"feed_sha256":feed_sha,"matched_offers":sum(x["binding_matches"] for x in offers),
                 "source_public":sum(bool(source_present(x)) for x in pages),"reviewed":len(candidates),"retried":len(retry_indices),"unmatched_ranked":sum(row["hotel_id"] not in excluded for row in ranked["rows"])-len(candidates)}))
          by_address={x["url"]:x for x in pages}
          by_key={x["offer_id"]:x for x in offers}
          for candidate in candidates:
              source = by_address[candidate["source_url"]]
              offer = by_key.get(candidate["offer_id"],{})
              public = source.get("visible_text","").split("Другие публикации канала",1)[0][:1550]
              print("MAX_MORE_CARD="+json.dumps({"candidate":candidate,"http":source.get("http"),"picture":source.get("has_preview_image"),
                      "description":offer.get("description"),"binding_matches":offer.get("binding_matches"),"public":public},ensure_ascii=False))
          print("MAX_MORE_RESERVE="+json.dumps(reserve_matches,ensure_ascii=False))
          PY
      - name: Retain public preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-max-ranked-public-observation
          path: pub/observation.json
          retention-days: 7
