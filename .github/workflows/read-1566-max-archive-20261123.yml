name: "#1566 Count additional old commercial MAX photo formats from the original archive"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'd4d663f469729f8eafc64a695b89c0b69ceeac0d' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the prepared allocation used by HOTEL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8d6c68aef6d97d77730fff9a32a8a1a1c200c366
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations/max-existing-photo/next-native-input-20261124.json
          sparse-checkout-cone-mode: false
      - name: Verify the original archive receipt and count fit for the existing editor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATA_DIR="$RUNNER_TEMP/hotel-max-capacity"
          mkdir "$DATA_DIR"
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45373389110 > "$DATA_DIR/run.json"
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14910511299 > "$DATA_DIR/artifact.json"
          curl --fail --silent --show-error --location --max-time 25 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/pyatkoff/max-search-bot/actions/artifacts/14910511299/zip \
            --output "$DATA_DIR/archive.zip"
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import zipfile

          directory = pathlib.Path(os.environ["DATA_DIR"])
          run = json.loads((directory / "run.json").read_bytes())
          artifact = json.loads((directory / "artifact.json").read_bytes())
          expected = "e1e3d25e42522639e2b82b4bdf32b155a547a184"
          digest = "c46ce092bfb91935ce829c871026a1136bf465920a3caa9184604f052c55798c"
          assert (run["id"], run["head_sha"], run["run_attempt"], run["conclusion"]) == (45373389110, expected, 1, "success")
          assert artifact["id"] == 14910511299 and not artifact["expired"] and artifact["digest"] == "sha256:" + digest
          assert artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == expected
          archive_file = directory / "archive.zip"
          assert archive_file.stat().st_size == artifact["size_in_bytes"]
          assert hashlib.sha256(archive_file.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(archive_file) as archive:
              assert archive.namelist() == ["registry.json"] and archive.getinfo("registry.json").file_size <= 1_000_000
              receipt = json.loads(archive.read("registry.json"))
          assert receipt["history_complete"] and receipt["production_writes"] == receipt["provider_writes"] == 0
          assert receipt["operation"] == "hotel_archive_main_max_registry" and str(receipt["native_run_id"]) == str(run["id"])
          rows = receipt["rows"]
          by_url = {row["url"]: row for row in rows}
          assert len(rows) == len(by_url) == len({row["mid"] for row in rows}) == receipt["messages"]
          status = collections.Counter(row["status"] for row in rows)
          assert dict(status) == receipt["categories"]

          completed = set(["https://max.ru/anytour/AZwjaZt4Kz8","https://max.ru/anytour/AZ5qgiujRlo","https://max.ru/anytour/AZ6sX9HGLTk","https://max.ru/anytour/AZ6wa60cTlw","https://max.ru/anytour/AZ61r6_QcAI","https://max.ru/anytour/AZ7KT8ynMm8","https://max.ru/anytour/AZ7PcvbibFA","https://max.ru/anytour/AZ7UVbXteP8","https://max.ru/anytour/AZ7Z4K9JJNQ","https://max.ru/anytour/AZ7pU2e2Znw","https://max.ru/anytour/AZ8DSRZpHNw","https://max.ru/anytour/AZ8r4R9vT_Q","https://max.ru/anytour/AZ9k6MvNF94","https://max.ru/anytour/AZ-OUsaPJjg","https://max.ru/anytour/AZ-tLRx7Jzw","https://max.ru/anytour/AZ_MDV0gO_I","https://max.ru/anytour/AZ_RB3FVXFc","https://max.ru/anytour/AZ7exN6EPIU","https://max.ru/anytour/AZ87_EUJEiI","https://max.ru/anytour/AZ-yESbCL_Q","https://max.ru/anytour/AZ-3aA0tG-E","https://max.ru/anytour/AZ_bVraKfqs","https://max.ru/anytour/AZ_1bEjVO3Q","https://max.ru/anytour/AaAQRP74HIo","https://max.ru/anytour/AZ_BkAiveNQ"])
          assert len(completed) == 25 and completed <= by_url.keys()
          pending = [row for row in rows if row["url"] not in completed]
          def present_shape(row):
              return row["media"] == ["image"] and not row["keyboard_present"] and not row["linked_message"]
          format_compatible = [row for row in pending if present_shape(row)]
          unoccupied = [row for row in format_compatible if not row["registered"]]

          prepared_path = pathlib.Path("tools/direct_demand/operations/max-existing-photo/next-native-input-20261124.json")
          assert hashlib.sha256(prepared_path.read_bytes()).hexdigest() == "c8faafd2fba5652aa1abce95f09091e96f746049839cfc684966ccecdc7b0dca"
          prepared = json.loads(prepared_path.read_bytes())
          targets = prepared["rows"]
          assert len(targets) == len({row["target_url"] for row in targets}) == 20
          for target in targets:
              match = by_url[target["target_url"]]
              assert match["url"] not in completed and match["mid"] == target["original_native_target"]["mid"]
              assert present_shape(match) and not match["registered"]

          blocked = [row for row in pending if row["status"] == "other_format"]
          output = {
              "goal": 330,
              "archive_run": run["id"],
              "archive_read_utc": receipt["read_utc"],
              "archive_messages": len(rows),
              "completed_old_mids": len(completed),
              "pending_old_mids": len(pending),
              "without_single_photo": sum(row["media"] != ["image"] for row in pending),
              "with_keyboard": sum(row["keyboard_present"] for row in pending),
              "with_linked_message": sum(row["linked_message"] for row in pending),
              "registered_pending": sum(row["registered"] for row in pending),
              "other_format_pending": len(blocked),
              "single_photo_no_keyboard_no_link_pending": len(format_compatible),
              "unoccupied_structural_upper_bound_pending": len(unoccupied),
              "absolute_bound_current_editor_with_25": len(completed) + len(unoccupied),
              "gap_to_330_current_editor_at_minimum": max(0, 330 - len(completed) - len(unoccupied)),
              "unoccupied_by_historical_status": dict(collections.Counter(row["status"] for row in unoccupied)),
              "prepared_targets_in_archive": len(targets),
              "prepared_first_five": [row["hotel_id"] for row in targets[:5]],
              "production_requests": 0,
              "writes": 0,
          }

          import re
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          reserved={x["target_url"] for x in targets} | completed | set(["https://max.ru/anytour/AaAkdvyEBXQ","https://max.ru/anytour/AZ9AsoswVYw","https://max.ru/anytour/AZ-d-XrfADw","https://max.ru/anytour/AaBnNxELfuU","https://max.ru/anytour/AaBxuxe-Jxk","https://max.ru/anytour/AaCAxCRDffc","https://max.ru/anytour/AaC42fW_AY0","https://max.ru/anytour/AaDD8UQLQ4U","https://max.ru/anytour/AaDYcRGJKpQ","https://max.ru/anytour/AaELd0cFVAQ","https://max.ru/anytour/AaEba-dgJKk","https://max.ru/anytour/AaEl-MVcT8Q","https://max.ru/anytour/AaEwSMavEQU","https://max.ru/anytour/AaE0q57XSGk","https://max.ru/anytour/AaE6sgknSuc","https://max.ru/anytour/AaAuJeZbQAc","https://max.ru/anytour/AZxcNpG8Qfk","https://max.ru/anytour/AZrE5K3jCFs","https://max.ru/anytour/AZ-DqmRQHF8","https://max.ru/anytour/AaBhZRPRMt4","https://max.ru/anytour/AZ6mZd9cP1Y","https://max.ru/anytour/AZ-nsUrqXuU","https://max.ru/anytour/AaBI6Jfvad8","https://max.ru/anytour/AZ_rrRmlYz0"])
          eligible=[r for r in rows if r.get("url") not in reserved and not r.get("registered")
                    and not r.get("keyboard_present") and not r.get("linked_message")
                    and all(m=="image" for m in r.get("media",[]))]
          photo_albums=[r for r in eligible if len(r.get("media",[]))>=2]
          photo_known=[r for r in eligible if r.get("media")==["image"] and r.get("status")=="already_known"]
          attributed=[r for r in eligible if r.get("media")==["image"] and r.get("status")=="attributed_link_present"]
          output["unassigned_photo_album_shape_only_count"]=len(photo_albums)
          output["unassigned_single_photo_previously_screened_count"]=len(photo_known)
          output["old_single_photo_with_attributed_links_held_count"]=len(attributed)
          pending_targets=sorted(photo_known,key=lambda r:r["published_ms"],reverse=True)[:8] + sorted(photo_albums,key=lambda r:r["published_ms"],reverse=True)[:8]
          assert len(pending_targets)<=16
          class Preview(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.metadata={}
              def handle_starttag(self,tag,attributes):
                  if tag=="meta":
                      d=dict(attributes)
                      if d.get("property"): self.metadata[d["property"]]=d.get("content","")
          def review(row):
              result={field:row[field] for field in ("mid","url","published_ms","fingerprint","status","media")}
              try:
                  req=urllib.request.Request(row["url"],headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=10) as response:
                      assert response.geturl()==row["url"] and response.status==200
                      raw=response.read(3000001)
                  assert len(raw)<=3000000
                  p=Preview()
                  p.feed(raw.decode("utf-8"))
                  snippet=re.sub(r"\s+"," ",p.metadata.get("og:description","")).strip()
                  negative=re.search(r"отзыв|отдыхал[аи]?|мы отдых|мы жили|вернул[аи]сь|вернулся|наш[аи]? турист|от турист|видео|влог|обзор от менеджера|доминикан|пунта.кан",snippet,re.I)
                  positive=re.search(r"подборк|пут[её]вк|горящ|предложен|путешестви|туры?\b|тур[ауы]\b|заброниров|стоимость|₽|руб[.л]",snippet,re.I)
                  result["screen"]="protected_or_ambiguous" if negative or not snippet or not positive or not p.metadata.get("og:image") else "public_commercial_candidate"
                  if result["screen"]=="public_commercial_candidate":
                      result["commercial_preview"]=snippet[:190]
              except (OSError,ValueError,AssertionError):
                  result["screen"]="public_read_unavailable"
              return result
          with ThreadPoolExecutor(max_workers=3) as workers:
              candidates=list(workers.map(review,pending_targets))
          output["existing_editor_candidates_after_exclusions"]=candidates
          output["screen_only"]=True
          output["production_requests"]=0
          output["public_reads"]=len(candidates)
          print("MAX_PHOTO_FORMAT_RESERVE_READ=" + json.dumps(output,ensure_ascii=False,separators=(",",":")))
          PY
