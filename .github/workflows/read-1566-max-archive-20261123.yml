name: "#1566 Independently verify the nine edited public MAX cards"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'dfbb6aebf24fc74d618c90de9686ebda08508784' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read each same public MAX address independently
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,re,time
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from datetime import datetime,timezone
          plans=json.loads(r'[{"id":2470,"url":"https://max.ru/anytour/AaC42fW_AY0","title":"Sun Siyam Olhuveli","caption":"✈️ Туры в Sun Siyam Olhuveli\n📍 Южный Мале, Мальдивы\nПляжи, бассейны и водные развлечения. Для семей есть детский клуб и подходящие номера и виллы. Отдельная зона Romance предназначена для взрослых."},{"id":56092,"url":"https://max.ru/anytour/AaDD8UQLQ4U","title":"Gravity Hotel and Aqua Park Hurghada","caption":"✈️ Туры в Gravity Hotel and Aqua Park Hurghada\n📍 Хургада, Египет\nСобственный пляж у лагуны и аквапарк с десятью горками. Помимо основного ресторана работают итальянский La Piazza и азиатский Akina."},{"id":59114,"url":"https://max.ru/anytour/AaDYcRGJKpQ","title":"Akdora Elite Hotel and Spa","caption":"✈️ Туры в Akdora Elite Hotel and Spa\n📍 Сиде, Турция\nДо собственного песчаного пляжа около 300 м. На территории открытые бассейны и спа. Рядом стройка, возможен шум."},{"id":63191,"url":"https://max.ru/anytour/AaELd0cFVAQ","title":"Jumeirah Saadiyat Island","caption":"✈️ Туры в Jumeirah Saadiyat Island\n📍 Саадият, Абу-Даби, ОАЭ\nПесчаный пляж, бассейны и просторные номера. Для детей и подростков есть отдельные клубы, для взрослых — спа и рестораны у моря."},{"id":76588,"url":"https://max.ru/anytour/AaEba-dgJKk","title":"Liu Resorts","caption":"✈️ Туры в Liu Resorts\n📍 Сиде, Турция\nСобственный песчаный пляж примерно в 300 м. В Breeze выступают живые группы и диджеи. Для поездки вдвоём можно рассмотреть Superior Corner с видом на море."},{"id":77914,"url":"https://max.ru/anytour/AaEl-MVcT8Q","title":"Sunrise Tucana Resort","caption":"✈️ Туры в Sunrise Tucana Resort\n📍 Хургада, Египет\nСобственный пляж и рестораны с обслуживанием по меню. Для отдыха с детьми есть клуб для ребят от 3 до 12 лет."},{"id":106,"url":"https://max.ru/anytour/AaEwSMavEQU","title":"Aladdin Beach Resort","caption":"✈️ Туры в Aladdin Beach Resort\n📍 Хургада, Египет\nОтель на первой линии с песчано-галечным пляжем. По вечерам проходят шоу и выступают музыканты."},{"id":111,"url":"https://max.ru/anytour/AaE0q57XSGk","title":"Pickalbatros Palace Resort Hurghada","caption":"✈️ Туры в Pickalbatros Palace Resort Hurghada\n📍 Хургада, Египет\nСобственный пляж, четыре бассейна и пять детских горок для ребят от 4 до 12 лет. Два бассейна подогревают с ноября по апрель в зависимости от погоды."},{"id":114,"url":"https://max.ru/anytour/AaE6sgknSuc","title":"Ali Baba Palace","caption":"✈️ Туры в Ali Baba Palace\n📍 Хургада, Египет\nСобственный песчаный пляж. У входа в море встречается галька, поэтому для купания удобно взять специальную обувь."}]')
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hide=0; self.meta={}
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.hide+=1
                  if t=='meta':
                      d=dict(a)
                      key=d.get('property') or d.get('name')
                      if key: self.meta[key]=d.get('content','')
              def handle_endtag(self,t):
                  if t in ('script','style') and self.hide: self.hide-=1
              def handle_data(self,v):
                  if not self.hide and v.strip(): self.parts.append(v.strip())
          def norm(v):
              return re.sub(r'\s+',' ',v).strip()
          def read(row):
              try:
                  req=urllib.request.Request(row['url'],headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(3000001)
                      status,url=r.status,r.geturl()
                  assert len(raw)<=3000000 and url==row['url']
                  p=Page();p.feed(raw.decode('utf-8'))
                  visible=norm('\n'.join(p.parts).split('Другие публикации канала',1)[0])
                  declared=norm(p.meta.get('og:description',''))
                  exact=norm(row['caption'])
                  out={'hotel_id':row['id'],'url':url,'http':status,'named':row['title'] in visible or row['title'] in declared,
                       'caption_matches':exact in visible or exact in declared,'photo_preview':bool(p.meta.get('og:image')),
                       'public_button_label_visible':'Рассчитать на мои даты' in visible,
                       'page_sha256':hashlib.sha256(raw).hexdigest(),
                       'escaped_variant_visible': '&amp;' in visible or '&amp;' in declared}
                  out['verified']=out['named'] and out['caption_matches'] and out['photo_preview']
                  return out
              except (OSError,ValueError,AssertionError) as e:
                  return {'hotel_id':row['id'],'url':row['url'],'error':type(e).__name__,'verified':False}
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(read,plans))
          if not all(r['verified'] for r in results):
              time.sleep(5)
              results=[r if r['verified'] else read(p) for r,p in zip(results,plans)]
          out={'observed_utc':datetime.now(timezone.utc).isoformat(),'rows':results,'writes':0,'ad_clicks':0}
          Path('pub/observation.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX_NEXT_NINE_PUBLIC_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Preserve independent public readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-next-nine-independent-public-readback
          path: pub/observation.json
          retention-days: 7
