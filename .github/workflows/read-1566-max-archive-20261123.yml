name: "#1566 Check existing scoped MAX PRICE admission on the current release"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '09692ba5b079463fe0d4973174ada26d4623dad5' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 84c8422b39c755b5c7ad396f05a58cf5870c9bec
          persist-credentials: false
      - name: Read the standard PRICE release admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1719 e7ffb257449438f76a1636f1c98d38caa3e903bd 84c8422b39c755b5c7ad396f05a58cf5870c9bec
