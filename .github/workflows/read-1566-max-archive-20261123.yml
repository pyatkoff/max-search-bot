name: "Verify current hotel XML offers and Sultan Gardens image"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  verify_public:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'b5cc3edb08b2e892529c33eaac8fe8d22872ddc6' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read both public XML endpoints without visiting advertising links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import base64
          import datetime
          from zoneinfo import ZoneInfo
          import hashlib
          import json
          import urllib.request
          import html
          from html.parser import HTMLParser
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse
          import xml.etree.ElementTree as ET

          def read(scope):
              url=f"https://app.anytoour.ru/feed/hotel-posts-{scope}.xml"
              output=pathlib.Path(os.environ["RUNNER_TEMP"])/(scope+".xml")
              proc=subprocess.run(["curl","--silent","--show-error","--connect-timeout","5","--max-time","15","--max-filesize","8000000",
                   "--proto","=https","--write-out","%{http_code} %{time_connect} %{time_appconnect} %{time_starttransfer} %{size_download}",
                   "--output",str(output),url],capture_output=True,text=True,timeout=18)
              detail={"exit":proc.returncode,"http_and_timings":proc.stdout.strip()}
              if proc.returncode or not proc.stdout.startswith("200 "):
                  return scope,detail
              try:
                  data=output.read_bytes()
                  root=ET.fromstring(data)
                  rows=root.findall(".//offer")
                  ids=[o.get("id") for o in rows]
                  ids_unique=all(ids) and len(ids)==len(set(ids))
                  expected=json.loads('{"max_99713":null,"max_73343":null,"max_43689":null,"max_139":null,"max_2470":null,"max_56092":null,"max_59114":null,"max_63191":null,"max_76588":null,"max_77914":null,"max_106":null,"max_111":null,"max_114":null,"max_2588":null,"max_57028":null,"max_65877":null,"max_63674":null,"max_64918":null,"max_358":null,"max_107938":null,"max_954":null,"max_73055":null,"max_47025":null,"max_12107":null,"max_132":null,"max_469":null,"max_12111":null,"max_70048":null,"max_82606":null,"max_1344":null,"max_260":null,"max_2493":null,"max_3452":null,"max_4181":null,"max_37668":null,"max_43676":null,"max_64895":null,"max_73974":null,"max_74503":null,"max_1972":null,"max_32342":null,"max_241":null,"max_15693":null,"max_293":null,"max_408":null,"max_1260":null,"max_24909":null,"max_800":null,"max_949":null}')
                  exact={}
                  for o in rows:
                      oid=o.get("id")
                      if oid not in expected:
                          continue
                      url=o.findtext("url","")
                      plain=urllib.parse.unquote(url)
                      match=re.search(r"_ctx1_([A-Za-z0-9_-]+)",plain)
                      context=json.loads(base64.urlsafe_b64decode(match[1]+"="*(-len(match[1])%4))) if match else {}
                      ts=re.findall(r"Цена найдена мониторингом (\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\.",o.findtext("description",""))
                      stamp=datetime.datetime.strptime(ts[0],"%d.%m.%Y, %H:%M").replace(tzinfo=ZoneInfo("Europe/Moscow")) if len(ts)==1 else None
                      freshness=datetime.datetime.now(ZoneInfo("Europe/Moscow"))-stamp if stamp else None
                      exact[oid]={"offer_context":context.get("offer_id")==oid,"alias":context.get("post_id"),"origin_host":urllib.parse.urlsplit(url).hostname,"direct_anytour":urllib.parse.urlsplit(url).hostname in ("max.ru","www.max.ru") and urllib.parse.urlsplit(url).path.startswith("/anytour/"),
                                  "observed_msk":stamp.isoformat() if stamp else None,
                                  "price_within_36h":freshness is not None and 0<=freshness.total_seconds()<=129600,
                                  "url_sha256":hashlib.sha256(url.encode()).hexdigest(),
                                  "attribution_macros":all("{"+k+"}" in plain for k in ("yclid","campaign_id","region_id")),
                                  "price":o.findtext("price",""),"picture_present":bool(o.findtext("picture",""))}
                  return scope,dict(detail,offers=len(ids),unique=ids_unique,exact=exact)
              except (ET.ParseError,OSError,ValueError) as exc:
                  return scope,dict(detail,error=type(exc).__name__)

          class Preview(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.meta={}
              def handle_starttag(self, tag, attrs):
                  if tag=="meta":
                      d=dict(attrs)
                      if d.get("property"):
                          self.meta[d["property"]]=d.get("content","")

          def page(entry):
              key,url=entry
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(3000001)
                      assert r.status==200 and r.geturl()==url and len(raw)<=3000000
                  parser=Preview()
                  parser.feed(raw.decode("utf-8"))
                  caption=parser.meta.get("og:description","")
                  img=parser.meta.get("og:image","").strip()
                  image_response=None
                  if key in ("469_source","469_target") and img:
                      target=urllib.parse.urlsplit(img)
                      assert target.scheme=="https" and target.port in (None,443) and target.username is None and target.password is None
                      assert re.fullmatch(r"[a-z0-9.-]+\.[a-z]{2,}",target.hostname or "") and len(img)<1800
                      probe=subprocess.run(["curl","--silent","--show-error","--proto","=https","--connect-timeout","4","--max-time","10","--max-filesize","8000000","--range","0-255","--output","/dev/null","--write-out","%{http_code} %{content_type} %{size_download}",img],capture_output=True,text=True,timeout=12)
                      fields=probe.stdout.strip().split()
                      image_response={"verified":probe.returncode==0 and len(fields)==3 and fields[0] in ("200","206") and fields[1].startswith("image/") and fields[2].isdigit() and int(fields[2])>0,
                         "http":fields[0] if fields else None,"content_type":fields[1] if len(fields)>1 else None}
                  return key,{"image_response":image_response,"photo_preview":bool(img),"photo_sha256":hashlib.sha256(img.encode()).hexdigest() if img else None,
                       "sultan_gardens_heading":"Sultan Gardens" in caption[:180],
                       "literal_amp_escape":bool(re.search(r"&amp;|&#0*38;|&#x0*26;",caption,re.I)),
                       "amp_character_present":"&" in caption,
                       "heading":caption.splitlines()[0][:120] if caption else None}
              except (OSError,ValueError,AssertionError):
                  return key,{"result":"public_read_unavailable"}

          with ThreadPoolExecutor(max_workers=3) as pool:
              feeds=dict(pool.map(read,("max","all")))
              pages=dict(pool.map(page,{"469_source":"https://max.ru/channel_anytour/AaF5iOO-R8w","469_target":"https://max.ru/anytour/AZ6sX9HGLTk"}.items()))
          print("HOTEL_FEED_RECOVERY_READ="+json.dumps({"observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "feeds":feeds,"public_posts":pages,"route_writes":0,"feed_writes":0,"ad_clicks":0},separators=(",",":")))
          PY
