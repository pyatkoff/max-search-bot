name: "#1566 Verify the exact acquired PRICE fix publisher before merge"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'cd343613d7d32f81c2c716681bd4f56b7367d622' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c0fc7cb2f256f2adec8ef2433ea4cf6a4a73f512
          persist-credentials: false
      - name: Await exact required source checks and inspect native release eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=""
          for attempt in $(seq 1 26); do
            result="$(gh api repos/pyatkoff/max-search-bot/commits/4da1c3b125e31672e7bec1fdfb4995a8cb0f9d90/check-runs?per_page=40 --jq '[.check_runs[] | select(.name=="regression" or .name=="guard") | [.name,.conclusion]] | unique | sort')"
            if [[ "$result" == '[["guard","success"],["regression","success"]]' ]]; then break; fi
            if [[ "$result" == *'"failure"'* || "$result" == *'"cancelled"'* || "$result" == *'"timed_out"'* ]]; then exit 2; fi
            if [[ "$attempt" -lt 26 ]]; then sleep 15; fi
          done
          test "$result" = '[["guard","success"],["regression","success"]]'
          node tools/release_priority.js --admit 1718 4da1c3b125e31672e7bec1fdfb4995a8cb0f9d90 c0fc7cb2f256f2adec8ef2433ea4cf6a4a73f512 --publisher 6928374515 226193297 2026-11-25T06:57:24Z
