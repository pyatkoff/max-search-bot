name: "#1566 Identify the active public MAX caption fields for PRICE"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '5db142ac5925f235894f81cef10a40064ab6eb8c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect the exact public post layout without calling the editor
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import json,re,urllib.request,html
          from html.parser import HTMLParser
          from datetime import datetime,timezone
          from pathlib import Path
          expected=[('https://max.ru/anytour/AZ-d-XrfADw','Туры в Vesna Hotel'),
                    ('https://max.ru/anytour/AaC42fW_AY0','Туры в Sun Siyam Olhuveli')]
          class PostLayout(HTMLParser):
              def __init__(self, title):
                  super().__init__(convert_charrefs=True)
                  self.title=title
                  self.stack=[]
                  self.paths=[]
              def handle_starttag(self,tag,attrs):
                  if tag not in ('area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'):
                      attrs=dict(attrs)
                      self.stack.append((tag,attrs.get('class','')[:100],list(attrs.keys())[:10]))
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i]
                          break
              def handle_data(self,text):
                  if self.title in text and self.stack and self.stack[-1][0] != 'script':
                      self.paths.append(self.stack[-8:])
          out=[]
          for url,title in expected:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=12) as r:
                  b=r.read(3000001)
                  assert len(b)<=3000000 and r.status==200 and r.geturl()==url
              body=b.decode('utf-8')
              paths=PostLayout(title);paths.feed(body)
              args=[]
              for m in list(re.finditer(r'\bmessage\s*:',body))[:5]:
                  around=body[max(0,m.start()-25):m.start()+200]
                  args.append(re.sub(r'(?s)(["\'])(?:[^"\'\\]|\\.)*\1','"..."',around))
              snippets=[]
              for match in list(re.finditer(re.escape(title),body))[:8]:
                  snippets.append(body[max(0,match.start()-115):match.start()+len(title)+32])
              out.append({'url':url,'message_shapes':args,'title_containers':paths.paths[:6],'title_markup_snippets':snippets})
          value={'observed_utc':datetime.now(timezone.utc).isoformat(),'rows':out,'writes':0}
          Path('pub/structure.json').write_text(json.dumps(value,ensure_ascii=False))
          print('MAX_PRICE_PUBLIC_LAYOUT='+json.dumps(value,ensure_ascii=False,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-price-public-layout-posts-only
          path: pub/structure.json
          retention-days: 7
