name: "#1566 Check scoped MAX PRICE release admission"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'f88115ac74dd876c62e46974b4977091ffd44e54' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 878c680627d54297c364254687577a03ac5aef6b
          persist-credentials: false
      - name: Await exact required checks and run existing release admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const R = require('./tools/deployment_release')
          const api = R.makeReadApi(process.env.GITHUB_TOKEN)
          const {setTimeout: wait} = require('node:timers/promises')
          async function run() {
            const head = '1060a866a1ebdc0fd5aca25cbce59e302cd5aa47'
            const base = '878c680627d54297c364254687577a03ac5aef6b'
            const want = ['regression','guard']
            for (let n = 0; n < 46; n++) {
              const pr = await api('GET', R.API_ROOT+'/pulls/1719')
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== head || pr.base.sha !== base ||
                  (await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha !== base) throw Error('release_source_changed')
              const checks = (await api('GET',R.API_ROOT+'/commits/'+head+'/check-runs?per_page=50')).check_runs
              const status = want.map(name=>checks.filter(c=>c.name===name).sort((a,b)=>b.id-a.id)[0])
              if (status.some(c=>c?.status==='completed' && c.conclusion!=='success')) throw Error('required_check_failed')
              if (status.every(c=>c?.status==='completed' && c.conclusion==='success')) {
                console.log('MAX_PRICE_REQUIRED_CHECKS='+JSON.stringify(status.map(c=>c.id)))
                return
              }
              if (n < 45) await wait(15000)
            }
            throw Error('required_checks_pending')
          }
          run().catch(e=>{console.error(e.message);process.exitCode=1})
          NODE
          node tools/release_priority.js --admit 1719 1060a866a1ebdc0fd5aca25cbce59e302cd5aa47 878c680627d54297c364254687577a03ac5aef6b
