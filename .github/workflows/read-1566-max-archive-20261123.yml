name: "Check whether both public hotel XML feeds recovered"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  verify_public:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '3f6f7c9a266e1e3ca9e0f4fd95e3e0f5ddf0cf4e' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read both public XML endpoints without visiting advertising links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse
          import xml.etree.ElementTree as ET

          def read(scope):
              url=f"https://app.anytoour.ru/feed/hotel-posts-{scope}.xml"
              output=pathlib.Path(os.environ["RUNNER_TEMP"])/(scope+".xml")
              proc=subprocess.run(["curl","--silent","--show-error","--connect-timeout","5","--max-time","15","--max-filesize","8000000",
                   "--proto","=https","--write-out","%{http_code} %{time_connect} %{time_appconnect} %{time_starttransfer} %{size_download}",
                   "--output",str(output),url],capture_output=True,text=True,timeout=18)
              detail={"exit":proc.returncode,"http_and_timings":proc.stdout.strip()}
              if proc.returncode or not proc.stdout.startswith("200 "):
                  return scope,detail
              try:
                  data=output.read_bytes()
                  root=ET.fromstring(data)
                  rows=root.findall(".//offer")
                  ids=[o.get("id") for o in rows]
                  ids_unique=all(ids) and len(ids)==len(set(ids))
                  expected={"max_99713","max_47025","max_2470","max_65877"}
                  exact={}
                  for o in rows:
                      oid=o.get("id")
                      if oid not in expected:
                          continue
                      url=o.findtext("url","")
                      qp=urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
                      plain=urllib.parse.unquote(url)
                      exact[oid]={"offer_context":qp.get("offer")==[oid],
                                  "url_sha256":hashlib.sha256(url.encode()).hexdigest(),
                                  "attribution_macros":all("{"+k+"}" in plain for k in ("yclid","campaign_id","region_id")),
                                  "price":o.findtext("price",""),"picture_present":bool(o.findtext("picture",""))}
                  return scope,dict(detail,offers=len(ids),unique=ids_unique,exact=exact)
              except (ET.ParseError,OSError,ValueError) as exc:
                  return scope,dict(detail,error=type(exc).__name__)

          with ThreadPoolExecutor(max_workers=2) as pool:
              feeds=dict(pool.map(read,("max","all")))
          print("HOTEL_FEED_RECOVERY_READ="+json.dumps({"observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "feeds":feeds,"route_writes":0,"feed_writes":0,"ad_clicks":0},separators=(",",":")))
          PY
