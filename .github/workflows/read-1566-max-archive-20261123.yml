name: "Verify both active feed images for Beach Albatros"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  verify_public:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 && github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'ed382c4bb0d5387012222d6889eef2734794a68e' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify the actual Beach Albatros image in both public feeds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,re,subprocess,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor

          def feed(key):
              u=f"https://app.anytoour.ru/feed/hotel-posts-{key}.xml"
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=12) as r:
                  assert r.status==200 and r.geturl()==u
                  body=r.read(8000001)
              assert len(body)<=8000000
              obj=ET.fromstring(body)
              hit=[i for i in obj.findall(".//offer") if i.get("id")=="max_132"]
              assert len(hit)==1 and hit[0].findtext("price","")=="105167"
              link=hit[0].findtext("picture","").strip()
              p=urllib.parse.urlsplit(link)
              assert p.scheme=="https" and p.port in (None,443) and p.username is None and p.password is None
              assert re.fullmatch(r"[a-z0-9.-]+\.[a-z]{2,}",p.hostname or "") and len(link)<1500
              return key,link

          with ThreadPoolExecutor(max_workers=2) as pool:
              links=dict(pool.map(feed,("max","all")))
          tested={}
          for target in set(links.values()):
              res=subprocess.run(["curl","--silent","--show-error","--proto","=https","--connect-timeout","5","--max-time","12",
                  "--max-filesize","8000000","--range","0-255","--output","/dev/null","--write-out","%{http_code} %{content_type} %{size_download}",target],
                  capture_output=True,text=True,timeout=14)
              parts=res.stdout.strip().split(maxsplit=2)
              status=int(parts[0]) if len(parts)==3 and parts[0].isdigit() else 0
              media=parts[1].lower() if len(parts)==3 else ""
              size=int(parts[2]) if len(parts)==3 and parts[2].isdigit() else 0
              tested[target]={"url_hash":hashlib.sha256(target.encode()).hexdigest(),"status":status,"mime":media[:40],
                  "accessible":res.returncode==0 and status in (200,206) and media.startswith("image/") and size>0}
          result={key:tested[link] for key,link in links.items()}
          print("BEACH_ALBATROS_FEED_IMAGE="+json.dumps({"offer":"max_132","observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "feeds":result,"same_image":links["max"]==links["all"],"ad_clicks":0,"writes":0},separators=(",",":")))
          PY
