name: "#1566 Validate the next twelve native MAX receipts against the existing editor"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'a5e9b42fb71fca13c3cce1bc2fc73ceffee28c1d' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the prepared allocation used by HOTEL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8d6c68aef6d97d77730fff9a32a8a1a1c200c366
          persist-credentials: false
          sparse-checkout: |
            tools/direct_demand/operations/max-existing-photo/next-native-input-20261124.json
          sparse-checkout-cone-mode: false
      - name: Verify the native receipts with the existing MAX editor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATA_DIR="$RUNNER_TEMP/hotel-max-next-twelve"
          mkdir "$DATA_DIR"
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45506100672 > "$DATA_DIR/native-run.json"
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/14973573608 > "$DATA_DIR/native-artifact.json"
          curl --fail --silent --show-error --location --max-time 25 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/pyatkoff/max-search-bot/actions/artifacts/14973573608/zip \
            --output "$DATA_DIR/native.zip"
          gh api '/repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/max-existing-photo/batch_input.php?ref=b62a8739ab56d1b7930c71b0b21e6c49837cb782' \
            --jq .content | base64 --decode > "$DATA_DIR/batch_input.php"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          folder = pathlib.Path(os.environ["DATA_DIR"])
          run = json.loads((folder / "native-run.json").read_bytes())
          artifact = json.loads((folder / "native-artifact.json").read_bytes())
          head = "55d6947c9e1ba29d5774eed4509a2e4dc6bef63b"
          assert (run["id"], run["head_sha"], run["run_attempt"], run["conclusion"]) == (45506100672, head, 1, "success")
          assert artifact["id"] == 14973573608 and artifact["workflow_run"]["head_sha"] == head and not artifact["expired"]
          digest = "c3c52b4a082a6775e73b4ff32b034d286858e0183ad18c33b6bcd818ad5a634b"
          assert artifact["digest"] == "sha256:" + digest
          archive_file = folder / "native.zip"
          assert archive_file.stat().st_size == artifact["size_in_bytes"] <= 100_000
          assert hashlib.sha256(archive_file.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(archive_file) as archive:
              assert archive.namelist() == ["registry.json"] and archive.getinfo("registry.json").file_size <= 100_000
              data = archive.read("registry.json")
          native = json.loads(data)
          assert native["ok"] and native["operation"] == "max_next_twelve_read_only"
          assert native["application_sha"] == native["repository_sha"] == "7b96c69c1f6974fb6ff09f52551a4581ffcdf171"
          assert native["archive_run"] == 45373389110 and len(native["groups"]) == 3 and all("failure" not in group for group in native["groups"])
          assert native["db_writes"] == native["provider_writes"] == native["bot_starts"] == 0
          (folder / "native.json").write_bytes(data)
          code = (folder / "batch_input.php").read_bytes()
          assert hashlib.sha1(b"blob " + str(len(code)).encode() + b"\0" + code).hexdigest() == "979c91fddf879d792937f26aaac4a4f1d778346d"
          PY
          php <<'PHP'
          <?php
          declare(strict_types=1);
          function maxEditNeed(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function maxEditJson(array $value): string {
              return json_encode($value, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR);
          }
          $folder = getenv('DATA_DIR');
          require $folder.'/batch_input.php';
          $native = json_decode(file_get_contents($folder.'/native.json'), true, 32, JSON_THROW_ON_ERROR);
          $allocation = file_get_contents('tools/direct_demand/operations/max-existing-photo/next-native-input-20261124.json');
          maxEditNeed(hash('sha256', $allocation) === 'c8faafd2fba5652aa1abce95f09091e96f746049839cfc684966ccecdc7b0dca', 'allocation_changed');
          $prepared = json_decode($allocation, true, 32, JSON_THROW_ON_ERROR);
          $protected = ['AZ-DqmRQHF8','AaBhZRPRMt4','AZ6mZd9cP1Y','AZ-nsUrqXuU','AaB7HKAZCt0','AaCvgMVScas','AaCz6C1IGtk','AaAZbG-VQzQ'];
          $planned = array_values(array_filter(array_slice($prepared['rows'], 5),
              static fn(array $row): bool => !in_array(basename($row['target_url']), $protected, true)));
          maxEditNeed(count($planned) === 12, 'target_scope_changed');
          maxEditNeed(array_column($planned,'hotel_id') === array_column($native['rows'],'hotel_id'), 'source_scope_changed');
          $ready = [];
          $held = [];
          foreach ($planned as $i => $row) {
              $o = $native['rows'][$i];
              $id = $row['hotel_id'];
              try {
                  $sourceSlug = rtrim(strtr(base64_encode(hex2bin(substr($o['source_mid'], -16))), '+/', '-_'), '=');
                  maxEditNeed($row['source_url'] === 'https://max.ru/channel_anytour/'.$sourceSlug, 'public_source_identity_changed');
                  maxEditNeed(!in_array(basename($row['target_url']), $protected, true), 'protected_review');
                  $identity = [];
                  foreach (['hotel_id','source_id','source_mid','native_source_date_ms','source_version','source_content_sha256','source_photo_sha256','source_caption_sha256','target_mid'] as $key) {
                      $identity[] = $o[$key] ?? null;
                  }
                  $approved = [
                      'hotel_id'=>$id, 'source_id'=>$row['source_publication_id'], 'source_mid'=>$o['source_mid'],
                      'target_mid'=>$row['original_native_target']['mid'], 'target_url'=>$row['target_url'],
                      'original_legacy_identity_sha256'=>hash('sha256', maxEditJson($identity))
                  ];
                  maxBatchValidateNativeRow($approved, $o);
                  $ready[] = ['hotel_id'=>$id,'source_version'=>$o['source_version'],'legacy_identity_sha256'=>$approved['original_legacy_identity_sha256']];
              } catch (RuntimeException $err) { $held[$id] = $err->getMessage(); }
          }
          echo 'MAX_NEXT_TWELVE_EDITOR_EVIDENCE=', maxEditJson(['ready_for_target_attribution_check'=>$ready, 'held'=>$held,
              'writes'=>0, 'native_run'=>45506100672, 'price_is_publish_gate'=>false]), PHP_EOL;
          PHP
