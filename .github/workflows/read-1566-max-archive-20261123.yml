name: "#1566 Read the original hotel and public links in the commercial Phuket album"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == 'ec6f573096187f7fc8813777379c7f864afe61ed' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read each same public MAX address independently
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,re,time
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlparse,parse_qs
          target="https://max.ru/anytour/AZwEq2zVLGY"
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hide=0; self.meta={}
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.hide+=1
                  if t=='meta':
                      d=dict(a)
                      key=d.get('property') or d.get('name')
                      if key: self.meta[key]=d.get('content','')
              def handle_endtag(self,t):
                  if t in ('script','style') and self.hide: self.hide-=1
              def handle_data(self,v):
                  if not self.hide and v.strip(): self.parts.append(v.strip())
          def norm(v):
              return re.sub(r'\s+',' ',v).strip()
          req=urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=10) as r:
              raw=r.read(3000001)
              assert r.status==200 and r.geturl()==target and len(raw)<=3000000
          p=Page()
          p.feed(raw.decode('utf-8'))
          visible=norm('\n'.join(p.parts).split('Другие публикации канала',1)[0])
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      href=dict(attrs).get('href','')
                      if href.startswith('https://'): self.urls.append(href)
          anchors=Links();anchors.feed(raw.decode('utf-8'))
          out=dict(url=target,text_excerpt=visible[:2200],preview_image=bool(p.meta.get("og:image")),
                   outbound_hosts=sorted({urlparse(h).hostname for h in anchors.urls if urlparse(h).hostname not in ('max.ru','apps.apple.com','play.google.com')}),
                   has_attribution_markers=any(re.search(r'ctx1_|yclid|region_id|campaign_id|/channel_anytour/|/any_toour/',h,re.I) for h in anchors.urls),
                   writes=0,ad_clicks=0,raw_sha256=hashlib.sha256(raw).hexdigest(),
                   observed_utc=datetime.now(timezone.utc).isoformat())
          Path('pub/observation.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX_ALBUM_ORIGINAL_PUBLIC_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Preserve independent public readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-phuket-album-public-readback
          path: pub/observation.json
          retention-days: 7
