name: "Keep archive and PRICE readbacks independent of feed timeouts"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '099d9050d9a73a5a2da0a6f585336afa2d572688' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact new archive receipt and recheck eligible commercial candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATA_DIR="$RUNNER_TEMP/hotel-max-capacity"
          mkdir "$DATA_DIR"
          gh api /repos/pyatkoff/max-search-bot/actions/runs/45630394590 > "$DATA_DIR/run.json"
          gh api /repos/pyatkoff/max-search-bot/actions/artifacts/15032515599 > "$DATA_DIR/artifact.json"
          curl --fail --silent --show-error --location --max-time 25 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/pyatkoff/max-search-bot/actions/artifacts/15032515599/zip \
            --output "$DATA_DIR/archive.zip"
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import zipfile

          directory = pathlib.Path(os.environ["DATA_DIR"])
          run = json.loads((directory / "run.json").read_bytes())
          artifact = json.loads((directory / "artifact.json").read_bytes())
          expected = "3a9195debcfbeb703a220895871f5a40a61d3010"
          digest = "354407dec77c2ffc3b8ed739e5a3f3aac422a0120578c0501183bbe36ea8d795"
          assert (run["id"], run["head_sha"], run["run_attempt"], run["conclusion"]) == (45630394590, expected, 1, "success")
          assert artifact["id"] == 15032515599 and not artifact["expired"] and artifact["digest"] == "sha256:" + digest
          assert artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == expected
          archive_file = directory / "archive.zip"
          assert archive_file.stat().st_size == artifact["size_in_bytes"]
          assert hashlib.sha256(archive_file.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(archive_file) as archive:
              assert archive.namelist() == ["registry.json"] and archive.getinfo("registry.json").file_size <= 1_000_000
              receipt = json.loads(archive.read("registry.json"))
          assert receipt["history_complete"] and receipt["production_writes"] == receipt["provider_writes"] == 0
          assert receipt["operation"] == "hotel_archive_main_max_registry" and str(receipt["native_run_id"]) == str(run["id"])
          rows = receipt["rows"]
          by_url = {row["url"]: row for row in rows}
          assert len(rows) == len(by_url) == len({row["mid"] for row in rows}) == receipt["messages"]
          status = collections.Counter(row["status"] for row in rows)
          assert dict(status) == receipt["categories"]

          assert receipt["application_sha"] == receipt["repository_sha"] == "ad970aaa2c89ccc6eb2fcded3c56b5146fffeaf5"
          assert receipt["price_content_shared_lease"] is True
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlsplit
          from urllib.request import Request, urlopen
          import datetime
          import re
          import xml.etree.ElementTree as ET

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag == "meta":
                      fields = dict(attrs)
                      key = fields.get("property") or fields.get("name")
                      if key:
                          self.meta[key] = fields.get("content", "")

          def read(url, limit):
              request = Request(url, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"})
              with urlopen(request, timeout=9) as response:
                  assert response.geturl() == url and response.status == 200
                  data = response.read(limit + 1)
              assert len(data) <= limit
              return data

          def page(url):
              result = Page()
              result.feed(read(url, 3_000_000).decode("utf-8"))
              return result.meta

          def inspect(row):
              assert re.fullmatch(r"https://max\.ru/anytour/[A-Za-z0-9_-]{11}", row["url"])
              out = {k:row[k] for k in ("url","mid","media","fingerprint","published_ms")}
              try:
                  m = page(out["url"])
                  s = re.sub(r"\s+"," ",m.get("og:description","")).strip()
                  protected = re.search(r"отзыв|отдыхал[аи]?|мы отдых|мы жили|вернул[аи]сь|вернулся|наш[аи]? турист|от турист|видео|влог|обзор от менеджера|доминикан|пунта.кан",s,re.I)
                  sale = re.search(r"заброниров|брониру|рассчита|подбер[её]м|стоимость|₽|руб[.л]|от\s+\d[\d\s,]+[кk]\b|горящ(?:ий|ие)\s+тур",s,re.I)
                  out["screen"] = "commercial_candidate" if sale and not protected and m.get("og:image") else "protected_or_ambiguous"
                  if out["screen"] == "commercial_candidate":
                      out["preview"] = s[:240]
              except (OSError, ValueError, AssertionError):
                  out["screen"] = "public_read_unavailable"
              return out

          def feed(args):
              name, url = args
              root = ET.fromstring(read(url, 5_000_000))
              offers = root.findall(".//offer")
              ids = [o.get("id") for o in offers]
              assert len(ids) == len(set(ids)) and all(ids)
              result = {}
              for oid in ("max_99713","max_47025"):
                  matches = [o for o in offers if o.get("id")==oid]
                  assert len(matches)==1
                  o = matches[0]
                  href = o.findtext("url","")
                  query = parse_qs(urlsplit(href).query)
                  result[oid] = {"url_sha256":hashlib.sha256(href.encode()).hexdigest(),"attribution_macros":all("{" + k + "}" in href for k in ("yclid", "campaign_id","region_id")),
                       "image_present":bool(o.findtext("picture","")),"declared_price":o.findtext("price",""),
                       "name":o.findtext("name",""),"path":urlsplit(href).path}
              return name, {"count":len(ids),"rows":result}

          def recover(args):
              name,url=args
              for _ in range(2):
                  try:
                      return feed((name,url))
                  except (OSError,ValueError,AssertionError,ET.ParseError) as error:
                      reason=type(error).__name__
              return name,{"error":reason}

          singles=[r for r in rows if r["status"]=="needs_content_and_route_review"]
          albums=[r for r in rows if not r["registered"] and not r["keyboard_present"] and not r["linked_message"]
                  and 2<=len(r["media"])<=10 and set(r["media"])=={"image"}]
          assert len(singles)<=30 and len(albums)<=15
          assert all(not r["registered"] and not r["keyboard_present"] and not r["linked_message"] for r in singles)
          with ThreadPoolExecutor(max_workers=4) as pool:
              candidates=list(pool.map(inspect,singles+albums))
              feeds=dict(pool.map(recover,[("max","https://app.anytoour.ru/feed/hotel-posts-max.xml"),("all","https://app.anytoour.ru/feed/hotel-posts-all.xml")]))
          try:
              m=page("https://max.ru/anytour/AZ_RB3FVXFc")
          except (OSError,ValueError,AssertionError) as error:
              m={"error":type(error).__name__}
          public_description=m.get("og:description","")
          print("MAX_FRESH_ARCHIVE_SCREEN="+json.dumps({"archive_run":run["id"], "messages":len(rows),
              "screened_singles":len(singles),"screened_albums":len(albums),
              "held_count":sum(r["screen"]=="protected_or_ambiguous" for r in candidates),
              "unavailable":[r["url"] for r in candidates if r["screen"]=="public_read_unavailable"],
              "candidates":[r for r in candidates if r["screen"]=="commercial_candidate"],
              "feeds":feeds,"anantara":{"name_confirmed":"Anantara" in public_description,
              "error":m.get("error"),"price_lines":[l.strip()[:130] for l in public_description.splitlines() if "₽" in l or "руб" in l.lower()][:3],
              "image_present":bool(m.get("og:image"))},"writes":0,"ad_clicks":0,
              "observed_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False,separators=(",",":")))
          PY
