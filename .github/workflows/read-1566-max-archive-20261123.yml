                      $out['held'][$id] = $e->getMessage();
                  }
              }
              return $out;
          }
          
          function maxBatchValidateNativeRow(array $row, array $observed): void
          {
              $id = $row['hotel_id'];
              $missing=$observed['blockers'] ?? null;
              $catalog=$observed['source_catalog_id'] ?? null;
