name: "#1566 Check the live public caption contract of the installed PRICE reader"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '52db059d7a0a9f24c844d18c455257c8c544737a' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "7aa0a9a05a250cbd19d7dfab5745927012be5546"
          persist-credentials: false
      - name: Read two live captions using the production PRICE reader without invoking its writer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/scope.json <<'JSON'
          [{"hotel_id":65877,"url":"https://max.ru/anytour/AZ-d-XrfADw","caption":"✈️ Туры в Vesna Hotel\n📍 Нячанг, Вьетнам\nГородской отель для поездки с семьёй. До пляжа около 50 метров через дорогу."},{"hotel_id":2470,"url":"https://max.ru/anytour/AaC42fW_AY0","caption":"✈️ Туры в Sun Siyam Olhuveli\n📍 Южный Мале, Мальдивы\nПляжи, бассейны и водные развлечения. Для семей есть детский клуб и подходящие номера и виллы. Отдельная зона Romance предназначена для взрослых."}]
          JSON
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'services/PromotedHotelPriceWriter.php';
          $plans=json_decode(file_get_contents('pub/scope.json'),true,16,JSON_THROW_ON_ERROR);
          $rows=[];
          foreach($plans as $p) {
              $r=['hotel_id'=>$p['hotel_id'],'url'=>$p['url'],'public_read'=>false,'production_parser'=>false,'exact_expected_caption'=>false];
              try {
                  $html=PromotedHotelPriceWriter::publicBytes($p['url']);
                  $r['public_read']=true;
                  $r['html_sha256']=hash('sha256',$html);
                  $r['old_ssr_marker_present']=str_contains($html,'message:{text:');
                  $r['exact_post_slug_present']=str_contains($html,basename($p['url']));
                  $r['new_ssr_field_markers']=array_values(array_filter(['"message":','"text":','message:','post__description','post__text','og:description','data-page'],static fn($x)=>str_contains($html,$x)));
                  $caption=PromotedHotelPriceWriter::maxPublicCaption($html);
                  $r['production_parser']=true;
                  $r['exact_expected_caption']=$caption===$p['caption'];
              } catch(Throwable $error) {
                  $r['failure']=preg_match('/\A[a-z_]{3,65}\z/D',$error->getMessage())?$error->getMessage():'public_read_failed';
              }
              $rows[]=$r;
          }
          $out=['observed_utc'=>gmdate(DATE_ATOM),'provider_writes'=>0,'db_writes'=>0,'rows'=>$rows];
          file_put_contents('pub/observation.json',json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));
          echo 'MAX_PRICE_PUBLIC_READER_CONTRACT=',json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-price-public-caption-contract
          path: pub/observation.json
          retention-days: 7
