name: "#1566 Independently verify the five edited public MAX cards"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '803daa16ad3cced63ef9149785265cd97d1d846b' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read each same public MAX address independently
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,re,time
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from datetime import datetime,timezone
          plans=json.loads(r'[{"id":1972,"url":"https://max.ru/anytour/AaBI6Jfvad8","title":"Moreno Horizon Spa & Resort","caption":"✈️ Туры в Moreno Horizon Spa & Resort\n📍 Хургада, Египет\nСобственный пляж, бассейны для взрослых и детей и аквапарк с горками. На территории проходят развлекательные программы."},{"id":2588,"url":"https://max.ru/anytour/AaAkdvyEBXQ","title":"Jumeirah Beach Hotel","caption":"✈️ Туры в Jumeirah Beach Hotel\n📍 Дубай, ОАЭ\nПляжный отдых с видом на Burj Al Arab. На территории есть бассейны, водные развлечения и отдельные программы для детей."},{"id":32342,"url":"https://max.ru/anytour/AZ_rrRmlYz0","title":"Vinpearl Resort & Spa Phu Quoc","caption":"✈️ Туры в Vinpearl Resort & Spa Phu Quoc\n📍 Фукуок, Вьетнам\nДо пляжа можно дойти пешком. Для отдыха с семьёй или компанией можно выбрать номер или виллу."},{"id":57028,"url":"https://max.ru/anytour/AZ9AsoswVYw","title":"Pickalbatros Aqua Park Sharm","caption":"✈️ Туры в Pickalbatros Aqua Park Sharm\n📍 Шарм-эль-Шейх, Египет\nАквапарк с детскими горками, аттракционы Midway Street и клуб Alba для детей от 4 до 12 лет."},{"id":65877,"url":"https://max.ru/anytour/AZ-d-XrfADw","title":"Vesna Hotel","caption":"✈️ Туры в Vesna Hotel\n📍 Нячанг, Вьетнам\nГородской отель для поездки с семьёй. До пляжа около 50 метров через дорогу."}]')
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hide=0; self.meta={}
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.hide+=1
                  if t=='meta':
                      d=dict(a)
                      key=d.get('property') or d.get('name')
                      if key: self.meta[key]=d.get('content','')
              def handle_endtag(self,t):
                  if t in ('script','style') and self.hide: self.hide-=1
              def handle_data(self,v):
                  if not self.hide and v.strip(): self.parts.append(v.strip())
          def norm(v):
              return re.sub(r'\s+',' ',v).strip()
          def read(row):
              try:
                  req=urllib.request.Request(row['url'],headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(3000001)
                      status,url=r.status,r.geturl()
                  assert len(raw)<=3000000 and url==row['url']
                  p=Page();p.feed(raw.decode('utf-8'))
                  visible=norm('\n'.join(p.parts).split('Другие публикации канала',1)[0])
                  declared=norm(p.meta.get('og:description',''))
                  exact=norm(row['caption'])
                  out={'hotel_id':row['id'],'url':url,'http':status,'named':row['title'] in visible or row['title'] in declared,
                       'caption_matches':exact in visible or exact in declared,'photo_preview':bool(p.meta.get('og:image')),
                       'public_button_label_visible':'Рассчитать на мои даты' in visible,
                       'page_sha256':hashlib.sha256(raw).hexdigest(),
                       'escaped_variant_visible': '&amp;' in visible or '&amp;' in declared}
                  out['verified']=out['named'] and out['caption_matches'] and out['photo_preview']
                  return out
              except (OSError,ValueError,AssertionError) as e:
                  return {'hotel_id':row['id'],'url':row['url'],'error':type(e).__name__,'verified':False}
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(read,plans))
          if not all(r['verified'] for r in results):
              time.sleep(5)
              results=[r if r['verified'] else read(p) for r,p in zip(results,plans)]
          out={'observed_utc':datetime.now(timezone.utc).isoformat(),'rows':results,'writes':0,'ad_clicks':0}
          Path('pub/observation.json').write_text(json.dumps(out,ensure_ascii=False))
          print('MAX_FIRST_FIVE_PUBLIC_READ='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Preserve independent public readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-first-five-independent-public-readback
          path: pub/observation.json
          retention-days: 7
