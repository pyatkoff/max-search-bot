name: "#1566 Verify the existing publisher binding before merging the MAX editor correction"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.event.forced == false &&
      github.event.before == '71cefc21457681eb71421e13707377fb0bcbfd24' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the accepted existing admission mechanism
        uses: actions/checkout@v4
        with:
          ref: 703b239adbcfb1f480265f3a7beea566f6d07002
          persist-credentials: false
      - name: Read exact source CI and final ordinary1728 admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pub
          node - <<'NODE'
          const fs=require('node:fs'),P=require('./tools/release_priority'),R=require('./tools/deployment_release');
          async function check(){
            const api=R.makeReadApi(process.env.GITHUB_TOKEN),root=R.API_ROOT;
            const head='59f8cb22491e943b4aa0bb99e957277e4f948217',base='703b239adbcfb1f480265f3a7beea566f6d07002';
            const pr=await api('GET',root+'/pulls/1728');
            if(pr.state!=='open'||pr.draft||pr.head.sha!==head||pr.base.sha!==base)throw Error('target_changed');
            const checks=[];
            for(const [id,path] of [['45687369928','.github/workflows/regression-tests.yml'],['45687369924','.github/workflows/retired-domain-guard.yml']]){
              let run;
              const started=performance.now();
              for(let observation=0;observation<11;observation++){
                run=await api('GET',root+'/actions/runs/'+id);
                if(run.head_sha!==head||run.event!=='pull_request'||run.run_attempt!==1||run.path!==path)throw Error('required_ci_identity_changed');
                if(run.status==='completed')break;
                if(!['queued','in_progress','waiting','pending'].includes(run.status)||run.conclusion!==null||observation===10||performance.now()-started>300000)throw Error('required_ci_wait_exhausted');
                await new Promise(resolve=>setTimeout(resolve,30000));
              }
              if(run.status!=='completed'||run.conclusion!=='success')throw Error('required_ci_not_complete');
              checks.push({id,path,status:run.status,conclusion:run.conclusion,head_sha:run.head_sha});
            }
            const publisher=await api('GET',root+'/issues/comments/6818332618');
            if(publisher.user.id!==226193297||publisher.body!=='PR1728: выпуск занят'||publisher.updated_at!=='2026-11-25T20:41:12Z')throw Error('own_publisher_changed');
            const result=await P.runGuard({env:process.env,fetchImpl:fetch,admission:{repository:'pyatkoff/max-search-bot',prNumber:1728,headSha:head,baseSha:base}});
            fs.writeFileSync('pub/admission.json',JSON.stringify({read_only:true,provider_writes:0,production_writes:0,pr:1728,head,base,checks,publisher:{id:publisher.id,owner:publisher.user.id,body:publisher.body,updated_at:publisher.updated_at},result,checked_at_utc:new Date().toISOString()})+'\n');
            console.log(JSON.stringify({read_only:true,pr:1728,head,base,result}));
            if(!result.allowed)throw Error('ordinary_admission_refused');
          }
          check().catch(e=>{console.error('ordinary1728_read_refused',e.code||e.message);process.exitCode=1});
          NODE
      - name: Preserve exact original admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-ordinary1728-admission
          path: pub/admission.json
          retention-days: 7
          if-no-files-found: warn
