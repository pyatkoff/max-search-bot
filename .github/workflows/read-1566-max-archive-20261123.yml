          <?php
          require 'stage/editor.php';
          require 'stage/batch_input.php';
          $scope=file_get_contents('stage/scope.json');
          $binding=json_decode($scope,true,32,JSON_THROW_ON_ERROR)['native_source'];
          $compiled=maxBatchInput($scope,hash('sha256',$scope),file_get_contents('stage/archive.json'),file_get_contents('stage/native.json'),$binding['json_sha256'],$binding['repository_sha'],$binding['application_sha']);
          foreach ($compiled['ready'] as $approval) {
              $file=tempnam(sys_get_temp_dir(),'reviewed-max-plan-');
              try {
                  file_put_contents($file,maxEditJson($approval['plan']));
                  maxEditPlan($file,$approval['sha256'],$approval);
              } finally { unlink($file); }
          }
          echo 'MAX_NEXT_THREE_COMPILER=',maxEditJson(['ready'=>array_keys($compiled['ready']),'held'=>$compiled['held'],'provider_writes'=>0]),PHP_EOL;
