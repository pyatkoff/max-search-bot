name: "#1566 Read public ad feed context for 17 MAX hotel targets"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '60bfd0fa800598f31bf4e30de8a4e40d5a90c2d6' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare the MAX and combined public XML without opening advertising URLs
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from urllib.parse import unquote

          plans = json.loads('[{"offer":"max_1972","alias":"h1_7cdc48f2dd799f91ad74d98b53f7c324","source_id":"887","source_url":"https://max.ru/channel_anytour/AaG3WcDqe3Y","slug":"AaBI6Jfvad8"},{"offer":"max_2588","alias":"h1_b0ad50d1f7b72fbb0d8d3f44d551294a","source_id":"1533","source_url":"https://max.ru/channel_anytour/AaHpO-hTO-w","slug":"AaAkdvyEBXQ"},{"offer":"max_32342","alias":"h1_832e474d233e3ff903264f8017890723","source_id":"584","source_url":"https://max.ru/channel_anytour/AaG2QuDYdKE","slug":"AZ_rrRmlYz0"},{"offer":"max_57028","alias":"h1_4e6688447a8d76c946868b2d04224fd8","source_id":"238","source_url":"https://max.ru/channel_anytour/AaGeHp92NlE","slug":"AZ9AsoswVYw"},{"offer":"max_65877","alias":"h1_12c9e98c83db2198ba35799b9e761ec7","source_id":"563","source_url":"https://max.ru/channel_anytour/AaG2NPXdL0M","slug":"AZ-d-XrfADw"},{"offer":"max_73343","alias":"h1_d5c8a692e27557a88b5dd2ddf469c74d","source_id":"1253","source_url":"https://max.ru/channel_anytour/AaHQ_ZjzcEA","slug":"AaBnNxELfuU"},{"offer":"max_43689","alias":"h1_2a8f28fdeb4e5e47932fa629571e0f86","source_id":"1912","source_url":"https://max.ru/channel_anytour/AaHqSql-Q40","slug":"AaBxuxe-Jxk"},{"offer":"max_139","alias":"h1_0dd8e79eb59d7c04a8ebba12384fd9f8","source_id":"367","source_url":"https://max.ru/channel_anytour/AaGjHF7dGOQ","slug":"AaCAxCRDffc"},{"offer":"max_2470","alias":"h1_f6ff5a979401dbe0a1a4d6eb763fe29a","source_id":"1468","source_url":"https://max.ru/channel_anytour/AaHlf5z_ODQ","slug":"AaC42fW_AY0"},{"offer":"max_56092","alias":"h1_f8a64964fafb102a6f0c82703205f9b2","source_id":"283","source_url":"https://max.ru/channel_anytour/AaGeilyCad0","slug":"AaDD8UQLQ4U"},{"offer":"max_59114","alias":"h1_43c901391df4e5c2132497a01db66fca","source_id":"1374","source_url":"https://max.ru/channel_anytour/AaHcqEDjA3Y","slug":"AaDYcRGJKpQ"},{"offer":"max_63191","alias":"h1_b0abe530d9ef80315f4ce241ee2acd1c","source_id":"1496","source_url":"https://max.ru/channel_anytour/AaHlgTobEZw","slug":"AaELd0cFVAQ"},{"offer":"max_76588","alias":"h1_a710b1b43c4287fe5e8f8c11bcb9b887","source_id":"718","source_url":"https://max.ru/channel_anytour/AaG2zkytfiM","slug":"AaEba-dgJKk"},{"offer":"max_77914","alias":"h1_464e4ce1c4a476d9f8a9b7e1fb3dad4a","source_id":"181","source_url":"https://max.ru/channel_anytour/AaGc6ZyuFlA","slug":"AaEl-MVcT8Q"},{"offer":"max_106","alias":"h1_ffd75d0ae4d3b308154fa24f436f95b7","source_id":"1042","source_url":"https://max.ru/channel_anytour/AaG3snxOWfo","slug":"AaEwSMavEQU"},{"offer":"max_111","alias":"h1_b25fef02b0842659d3da3dbe12e66f76","source_id":"355","source_url":"https://max.ru/channel_anytour/AaGisi-ve3Q","slug":"AaE0q57XSGk"},{"offer":"max_114","alias":"h1_17116714af190238cf991ca60d867ae6","source_id":"1043","source_url":"https://max.ru/channel_anytour/AaG3soUIZh0","slug":"AaE6sgknSuc"}]')
          expected = {p["offer"]: p for p in plans}
          assert len(expected) == len({p["slug"] for p in plans}) == 17
          endpoints = {"max":"https://app.anytoour.ru/feed/hotel-posts-max.xml","combined":"https://app.anytoour.ru/feed/hotel-posts-all.xml"}

          def inspect(label):
              url = endpoints[label]
              req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  assert response.status == 200 and response.geturl() == url
                  raw = response.read(8000001)
              assert 0 < len(raw) <= 8000000 and b"<!DOCTYPE" not in raw.upper()
              offers = ET.fromstring(raw).findall("./shop/offers/offer")
              by_id = {}
              target_references = {p["slug"]:[] for p in plans}
              for item in offers:
                  offer = item.get("id")
                  assert offer and offer not in by_id
                  href = item.findtext("url", "")
                  by_id[offer] = href
                  urls = [unquote(n.text or "") for n in item if n.tag in ("url","mobile_url")]
                  for slug, linked_offers in target_references.items():
                      if any(re.search(r"https?://max[.]ru/[A-Za-z0-9_-]+/"+re.escape(slug)+r"(?![A-Za-z0-9_-])", value) for value in urls):
                          linked_offers.append(offer)
              assert by_id
              rows = {}
              for offer, p in expected.items():
                  href = by_id.get(offer, "")
                  token = re.search(r"_ctx1_([A-Za-z0-9_-]+)",href)
                  data = json.loads(base64.urlsafe_b64decode(token[1]+"="*(-len(token[1])%4))) if token else {}
                  rows[offer] = {"source_alias_matches":data.get("post_id")==p["alias"] and data.get("offer_id")==offer,
                      "has_attribution_macros":all(k in href for k in ("{yclid}","{campaign_id}","{region_id}")),
                      "ad_url_sha256":hashlib.sha256(href.encode()).hexdigest() if href else None,
                      "direct_target_offer_ids":target_references[p["slug"]]}
              return {"offer_count":len(by_id),"max_offer_count":sum(key.startswith("max_") for key in by_id),
                  "tg_offer_count":sum(key.startswith("tg_") for key in by_id),"sha256":hashlib.sha256(raw).hexdigest(),"rows":rows}

          with ThreadPoolExecutor(max_workers=2) as executor:
              reads = dict(zip(endpoints,executor.map(inspect,endpoints)))
          result = {"observed_at":datetime.now(timezone.utc).isoformat(),"reads":reads,"ad_urls_opened":0,"writes":0}
          pathlib.Path("pub/observation.json").write_text(json.dumps(result,ensure_ascii=False))
          print("MAX_FIVE_AND_TWELVE_FEED_READ="+json.dumps(result,separators=(",",":")))
          PY
      - name: Save the current feed readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-17-feed-and-attribution-readback
          path: pub/observation.json
          retention-days: 7
