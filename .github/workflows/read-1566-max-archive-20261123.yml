name: "#1566 Confirm existing PRICE admission after the release recovery"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'f0bd378370e80d94affe329593a67183c312d5c9' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 938d86d69864c41569f6c6225b0576dffaa5854e
          persist-credentials: false
      - name: Read exact current source checks and request standard read-only release admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const R=require('./tools/deployment_release')
          const api=R.makeReadApi(process.env.GITHUB_TOKEN)
          const head='cdac2729bd4849c871a93db053ed412bdbe80e7f'
          const base='938d86d69864c41569f6c6225b0576dffaa5854e'
          async function run() {
            const p=await api('GET',R.API_ROOT+'/pulls/1719')
            if(p.state!=='open'||p.draft||p.head.sha!==head||p.base.sha!==base)throw Error('price_source_changed')
            const checks=(await api('GET',R.API_ROOT+'/commits/'+head+'/check-runs?per_page=100')).check_runs
            const want=['regression','guard']
            const status=want.map(name=>checks.filter(c=>c.name===name).sort((a,b)=>b.id-a.id)[0])
            if(status.some(c=>c?.status!=='completed'||c.conclusion!=='success'))throw Error('required_price_checks_not_ready')
          }
          run().catch(e=>{console.error(e.code||e.message);process.exitCode=1})
          NODE
          node tools/release_priority.js --admit 1719 cdac2729bd4849c871a93db053ed412bdbe80e7f 938d86d69864c41569f6c6225b0576dffaa5854e
