name: "#1566 Check admission for the existing MAX PRICE release"
on:
  push:
    branches: [ops/1566-max-archive-inventory-20261123]
    paths: ['.github/workflows/read-1566-max-archive-20261123.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-1566-public-archive-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 && github.event.sender.id == 226193297 &&
      github.actor == 'pyatkoff' && github.event.created == false &&
      github.event.before == '0755b7ba83dd276d0309a5cf85b7a4a32709b644' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d8a0d794321ea89d8ac62205a22079656aa73d6a
          persist-credentials: false
      - name: Read the official release admission without claiming the publisher slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1716 d62af590516c0e9d832a95217c258f53f658b329 d8a0d794321ea89d8ac62205a22079656aa73d6a
