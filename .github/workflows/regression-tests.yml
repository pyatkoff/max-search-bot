name: Regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Verify required regression inventory
        run: php tests/run_required_checks_inventory_regression.php

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  required:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        group: [architecture, dialogue, website, manager, diagnostics]
    runs-on: ubuntu-latest
    name: required / ${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Run required group
        run: php tests/run_required_group.php "${{ matrix.group }}"

  regression:
    name: regression
    needs: [inventory, php-syntax, required]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SYNTAX_RESULT: ${{ needs.php-syntax.result }}
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: |
          printf 'inventory=%s\nsyntax=%s\nrequired=%s\n' "$INVENTORY_RESULT" "$SYNTAX_RESULT" "$REQUIRED_RESULT"
          test "$INVENTORY_RESULT" = success
          test "$SYNTAX_RESULT" = success
          test "$REQUIRED_RESULT" = success
