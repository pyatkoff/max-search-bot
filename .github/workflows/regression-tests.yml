name: Regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded read-only PR runs cannot certify the new head. Keep manual
# runs isolated, and never share a cancellation group with deployment.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    uses: ./.github/workflows/ci-change-scope.yml

  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Verify required regression inventory
        run: php tests/run_required_checks_inventory_regression.php
      - name: Verify complete isolated MySQL groups
        run: python3 tests/check_ci_mysql_groups.py

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  required:
    if: needs.change-scope.outputs.mode == 'full' || needs.change-scope.outputs.mode == 'tour-selection'
    needs: [inventory, change-scope]
    strategy:
      fail-fast: false
      matrix:
        group: [architecture, dialogue, website, manager, diagnostics]
        # Only an exact styling-only PR may omit unchanged server owners.
        exclude: ${{ fromJSON(needs.change-scope.outputs.mode == 'tour-selection' && needs.change-scope.outputs.backend == 'selection-style' && '[{"group":"dialogue"},{"group":"website"},{"group":"manager"},{"group":"diagnostics"}]' || '[]') }}
    runs-on: ubuntu-latest
    name: required / ${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Run required group
        env:
          REQUIRED_CHECK_REPORT: ${{ runner.temp }}/required-check-${{ matrix.group }}.json
        run: php tests/run_required_group.php "${{ matrix.group }}"
      - name: Upload required-check timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-check-report-${{ matrix.group }}
          path: ${{ runner.temp }}/required-check-${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 14

  prepared-mysql:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full' || (needs.change-scope.outputs.mode == 'tour-selection' && needs.change-scope.outputs.backend != 'selection-style')
    # Each matrix job owns a fresh MySQL service and runner. Never run these
    # destructive fixtures concurrently against one shared database.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [replies, migrations, queues]
    name: prepared-mysql / ${{ matrix.group }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prepared-fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: maxbot_prepared_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprepared-fixture-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Verify native MySQL group
        shell: bash
        env:
          MYSQL_TEST_GROUP: ${{ matrix.group }}
          PREPARED_REPLY_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=maxbot_prepared_test;charset=utf8mb4'
          PREPARED_REPLY_MYSQL_USER: root
          PREPARED_REPLY_MYSQL_PASS: prepared-fixture-only
        run: |
          set -euo pipefail
          case "$MYSQL_TEST_GROUP" in
            replies)
              php tests/run_manager_prepared_reply_regression.php
              ;;
            migrations)
              php tests/mysql/manager-preparation-migrations.php
              php tests/mysql/virtual-reply-sampling.php
              php tests/mysql/virtual-reply-controls.php
              php tests/mysql/manager-tour-delivery.php
              ;;
            queues)
              php tests/mysql/hotel-work-queue.php
              php tests/mysql/hotel-work-events.php
              php tests/mysql/development-work-queue.php
              php tests/mysql/development-work-events.php
              ;;
            *) exit 2 ;;
          esac

  oauth:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom
          coverage: none
      - name: Execute OAuth, MCP and HTTP boundary regressions
        run: |
          php tests/run_manager_preparation_oauth_regression.php
          php tests/run_manager_preparation_mcp_regression.php
          php tests/run_manager_preparation_endpoint_regression.php
          php tests/run_manager_http_boundary_regression.php

  regression:
    name: regression
    needs: [change-scope, inventory, php-syntax, required, prepared-mysql, oauth]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 2
    steps:
      - name: Require every gate
        id: source_checks
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          CI_MODE: ${{ needs.change-scope.outputs.mode }}
          BACKEND_PROFILE: ${{ needs.change-scope.outputs.backend }}
          OAUTH_RESULT: ${{ needs.oauth.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SYNTAX_RESULT: ${{ needs.php-syntax.result }}
          REQUIRED_RESULT: ${{ needs.required.result }}
          PREPARED_MYSQL_RESULT: ${{ needs.prepared-mysql.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$INVENTORY_RESULT" = success
          test "$SYNTAX_RESULT" = success
          case "$CI_MODE:$BACKEND_PROFILE" in
            oauth:full)
              test "$OAUTH_RESULT" = success
              test "$REQUIRED_RESULT" = skipped
              test "$PREPARED_MYSQL_RESULT" = skipped
              ;;
            full:full|tour-selection:full)
              test "$REQUIRED_RESULT" = success
              test "$PREPARED_MYSQL_RESULT" = success
              test "$OAUTH_RESULT" = skipped
              ;;
            tour-selection:selection-style)
              test "$REQUIRED_RESULT" = success
              test "$PREPARED_MYSQL_RESULT" = skipped
              test "$OAUTH_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout release admission
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Respect ready release priority
        id: release_admission
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release_priority.js
      # Presentation only: both mandatory steps above retain their exit status.
      # No extra job, workflow, API read or test run is needed to explain a refusal.
      - name: Summarize source checks and release admission
        if: always()
        continue-on-error: true
        env:
          SOURCE_CHECK_RESULT: ${{ steps.source_checks.outcome }}
          RELEASE_ADMISSION_RESULT: ${{ steps.release_admission.outcome }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo '## Regression checks and release admission'
            case "$SOURCE_CHECK_RESULT" in
              success) echo 'Regression source checks: PASSED.' ;;
              failure) echo 'Regression source checks: FAILED.' ;;
              *) echo 'Regression source checks: NOT CONFIRMED.' ;;
            esac
            if [ "$SOURCE_CHECK_RESULT" != success ]; then
              echo 'Release priority: NOT CONFIRMED. Resolve the failed or incomplete source checks first.'
            elif [ "$CI_EVENT_NAME" = workflow_dispatch ]; then
              echo 'Release priority: NOT REQUESTED. Manual validation does not grant merge admission.'
            elif [ "$CI_EVENT_NAME" != pull_request ]; then
              echo 'Release priority: NOT CONFIRMED. Unsupported event.'
            elif [ "$RELEASE_ADMISSION_RESULT" = success ]; then
              echo 'Release priority: PASSED. This does not acquire the shared publisher or confirm installation.'
            elif [ "$RELEASE_ADMISSION_RESULT" = failure ]; then
              echo 'Release priority: REFUSED. Source tests passed; inspect Respect ready release priority for the actual reason.'
              echo 'A refusal may mean another priority, a changed base, invalid metadata or an unavailable API; do not assume the queue alone is responsible.'
              echo 'Only after a priority-only blocker clears, with source and dependencies unchanged, rerun the failed regression job rather than the whole workflow.'
              echo 'A changed base or dependency requires its ordinary integration checks; an unresolved API failure is not permission to merge.'
            else
              echo 'Release priority: NOT CONFIRMED. No successful admission result exists.'
            fi
            echo 'This summary is informational and covers this regression workflow only. Other required checks, fresh admission and the existing publisher remain mandatory.'
          } >> "$GITHUB_STEP_SUMMARY"
