name: Regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run deterministic regression suite
        run: php tests/run_regression.php

      - name: Run conversation regression suite
        run: php tests/run_conversation_regression.php

      - name: Run conversation catalog suite
        run: php tests/run_conversation_catalog.php
