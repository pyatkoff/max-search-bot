name: Regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  change-scope:
    uses: ./.github/workflows/ci-change-scope.yml

  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Verify required regression inventory
        run: php tests/run_required_checks_inventory_regression.php

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  required:
    if: needs.change-scope.outputs.mode == 'full'
    needs: [inventory, change-scope]
    strategy:
      fail-fast: false
      matrix:
        group: [architecture, dialogue, website, manager, diagnostics]
    runs-on: ubuntu-latest
    name: required / ${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Run required group
        env:
          REQUIRED_CHECK_REPORT: ${{ runner.temp }}/required-check-${{ matrix.group }}.json
        run: php tests/run_required_group.php "${{ matrix.group }}"
      - name: Upload required-check timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-check-report-${{ matrix.group }}
          path: ${{ runner.temp }}/required-check-${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 14

  prepared-mysql:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prepared-fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: maxbot_prepared_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprepared-fixture-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Verify prepared replies against native MySQL and forward migration
        env:
          PREPARED_REPLY_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=maxbot_prepared_test;charset=utf8mb4'
          PREPARED_REPLY_MYSQL_USER: root
          PREPARED_REPLY_MYSQL_PASS: prepared-fixture-only
        run: |
          php tests/run_manager_prepared_reply_regression.php
          php tests/mysql/manager-preparation-migrations.php
          php tests/mysql/virtual-reply-sampling.php

  oauth:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom
          coverage: none
      - name: Execute OAuth, MCP and HTTP boundary regressions
        run: |
          php tests/run_manager_preparation_oauth_regression.php
          php tests/run_manager_preparation_mcp_regression.php
          php tests/run_manager_preparation_endpoint_regression.php
          php tests/run_manager_http_boundary_regression.php

  regression:
    name: regression
    needs: [change-scope, inventory, php-syntax, required, prepared-mysql, oauth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          CI_MODE: ${{ needs.change-scope.outputs.mode }}
          OAUTH_RESULT: ${{ needs.oauth.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SYNTAX_RESULT: ${{ needs.php-syntax.result }}
          REQUIRED_RESULT: ${{ needs.required.result }}
          PREPARED_MYSQL_RESULT: ${{ needs.prepared-mysql.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$INVENTORY_RESULT" = success
          test "$SYNTAX_RESULT" = success
          case "$CI_MODE" in
            oauth)
              test "$OAUTH_RESULT" = success
              test "$REQUIRED_RESULT" = skipped
              test "$PREPARED_MYSQL_RESULT" = skipped
              ;;
            full)
              test "$REQUIRED_RESULT" = success
              test "$PREPARED_MYSQL_RESULT" = success
              test "$OAUTH_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
