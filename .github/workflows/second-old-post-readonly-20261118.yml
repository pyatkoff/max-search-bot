name: Main AnyTour bounded read-only access diagnosis
on:
  push:
    branches: [audit/second-old-post-readonly-20261118]
    paths: ['.github/workflows/second-old-post-readonly-20261118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: main-anytour-readonly-diagnosis
  cancel-in-progress: false
jobs:
  read-only:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'bd8e248f7138ea75cb9fda2dcf44beb631c633a5' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare bounded read-only diagnosis; no sender
        shell: bash
        run: |
          set -euo pipefail
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='bd8e248f7138ea75cb9fda2dcf44beb631c633a5')exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';require_once getcwd().'/integrations/ChannelPostApiTransport.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          $out=['mode'=>'MAIN_ANYTOUR_READ_ONLY','db_writes'=>0,'provider_write_attempts'=>0,'channels'=>[],'target_found'=>false];
          try{
          $q=$pdo->query("SELECT id,external_message_id,start_payload FROM post_publications WHERE post_channel_id=4 AND id<>5 ORDER BY id LIMIT 1");$post=$q->fetch(PDO::FETCH_ASSOC);if(!$post)throw new RuntimeException('NO_SECOND_POST');
          $mid=(string)$post['external_message_id'];if(!preg_match('/\A[A-Za-z0-9_.-]{1,200}\z/',$mid))throw new RuntimeException('INVALID_MID');$out['publication']=$post;
          $q=$pdo->prepare("SELECT version_number,state,write_attempts,error_reason,receipt_json,snapshot_json FROM post_versions WHERE publication_id=? ORDER BY version_number DESC LIMIT 3");$q->execute([$post['id']]);$out['versions']=[];
          foreach($q->fetchAll(PDO::FETCH_ASSOC) as $v){$snap=json_decode($v['snapshot_json'],true);$receipt=json_decode($v['receipt_json'],true);unset($v['snapshot_json'],$v['receipt_json']);$v['snapshot_text']=mb_substr((string)($snap['text']??''),0,600);$v['receipt']=array_intersect_key($receipt??[],array_flip(['verified','content_preserved','button_verified','message_id','url','ok']));$out['versions'][]=$v;}
          $p=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.$mid,[],null);$d=$p['data']??[];
          $out['http']=$p['http'];$out['message_id']=$d['body']['mid']??null;$out['recipient']=$d['recipient']??null;$out['url']=$d['url']??null;$out['timestamp']=$d['timestamp']??null;$out['sender_present']=array_key_exists('sender',$d);$out['sender_id']=$d['sender']['user_id']??null;$out['text']=mb_substr((string)($d['body']['text']??''),0,1000);$out['attachment_types']=array_column($d['body']['attachments']??[],'type');$out['buttons']=[];
          foreach($d['body']['attachments']??[] as $a){if(($a['type']??'')==='inline_keyboard')$out['buttons']=$a['payload']['buttons']??[];}
          $out['ok']=true;
          }finally{$pdo->rollBack();}
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read main channel registry and provider metadata without writes
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = bd8e248f7138ea75cb9fda2dcf44beb631c633a5
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; test -z "$(git status --porcelain --untracked-files=no)"; php' < pub/read-only.php > pub/result.json
          cat pub/result.json
      - name: Preserve original diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-old-post-readonly-20261118
          path: pub/result.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
