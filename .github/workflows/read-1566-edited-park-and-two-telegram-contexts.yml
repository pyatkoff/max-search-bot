name: "#1566 Verify the existing Park Regency MAX and two original Telegram edits"
on:
  push:
    branches: [audit/1566-main-hotel-registry-20261119]
    paths: ['.github/workflows/read-1566-edited-park-and-two-telegram-contexts.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '49bb317e1342ed561b09dff1abfbbc34a01dc3f7' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SELECT-only program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          $result = ['ok'=>false,'writes'=>0,'rows'=>[]];
          try {
              if (PHP_SAPI !== 'cli' || trim((string)shell_exec('git rev-parse HEAD')) !== 'fe623086b716b3077e4ec0d4551095fc63db37e3') {
                  throw new RuntimeException('installed_checkout_changed');
              }
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/services/ChannelPostButtonTransport.php';
              } finally { ob_end_clean(); }
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry=new ChannelPostRegistryService($pdo);
              $query=$pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=?');
              foreach ([
                  [4,260,'mid.ffffc1752b045fed019ed455b5ed78ff','https://max.ru/anytour/AZ7UVbXteP8','max'],
                  [6,12107,'809','https://t.me/anytour/809','telegram'],
                  [6,3452,'1148','https://t.me/anytour/1148','telegram']
              ] as [$channel,$hotel,$mid,$url,$platform]) {
                  $query->execute([$channel,$mid]);
                  $id=(int)$query->fetchColumn();
                  $post=$registry->publication($id);
                  $entry=is_array($post)?ChannelPostEntryService::resolve($platform,(string)$post['start_payload'],$registry):null;
                  $version=(int)($post['version_id']??0);
                  $receipt=$post['receipt']??[];
                  $row=['hotel_id'=>$hotel,'platform'=>$platform,'post_url'=>$url,'publication_id'=>$id,'version_id'=>$version,
                      'state'=>$post['state']??null,'registry_reason'=>$post['error_reason']??null,
                      'write_attempts'=>(int)($post['write_attempts']??0),
                      'receipt_http'=>array_values(array_map(static fn($r)=>['operation'=>$r['operation']??'','http'=>$r['http']??0,'transport_error'=>$r['transport_error']??false],$receipt['http_results']??[])),
                      'expected_context_verified'=>(int)($entry['publication_id']??0)===$id && (int)($entry['version_id']??0)===$version && $id>0
                        && (int)($entry['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel
                        && ($entry['snapshot']['post_url']??'')===$url,
                      'native_button_verified'=>!empty($receipt['button_verified'])&&!empty($receipt['content_preserved'])];
                  if ($platform==='max') {
                      $live=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.$mid,[],null);
                      $source=ChannelPostApiTransport::buttonRequest('max','GET','/messages/mid.ffffb6caf0606fed01a1a0dcfbfd745f',[],null);
                      $snap=ChannelPostIncomingAdapter::maxSnapshot($live['data']??[])??[];
                      $sourceSnap=ChannelPostIncomingAdapter::maxSnapshot($source['data']??[])??[];
                      $row['identity_verified']=($live['http']??0)===200 && ($snap['post_url']??'')===$url
                           && ($live['data']['body']['mid']??'')===$mid && (int)($live['data']['timestamp']??0)===1781678847469;
                      $row['photo_verified']=($source['http']??0)===200 && count($snap['attachments']??[])===1
                          && !empty($sourceSnap['attachments'][0]['photo_id']) && ($snap['attachments'][0]['photo_id']??'')===$sourceSnap['attachments'][0]['photo_id'];
                      $row['caption_verified']=($snap['text']??'')===($post['snapshot']['text']??null)
                           && str_contains(($snap['text']??''),'Park Regency Sharm El Sheikh');
                      $row['native_button_verified']=is_array($post)&&ChannelPostIncomingAdapter::containsOnlyButton(
                          $snap,ChannelPostButtonTransport::buttonUrl($post),$post['channel']['button_text']);
                  }
                  $result['rows'][]=$row;
              }
              $pdo->rollBack();
              $result['ok']=true;
          } catch (Throwable) {
              if (isset($pdo)&&$pdo->inTransaction()) $pdo->rollBack();
              $result['failed']=true;
          }
          echo json_encode($result,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($result['ok']?0:2);
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read exact old messages and current context without edits
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); assert d["ok"] and d["writes"]==0; print(json.dumps(d))'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1566-park-fanara-liberty-readback
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
