name: First analysis of the completed private capture
on:
  push:
    branches: [ops/archive-prefix-first-analysis-20261106-23c5a2a]
    paths: [.github/workflows/archive-prefix-first-analysis-20261106-23c5a2a.yml]
permissions:
  contents: read
concurrency:
  group: anytour-private-archive-predictive-study
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pyatkoff/max-search-bot' && github.event_name == 'push' && github.ref == 'refs/heads/ops/archive-prefix-first-analysis-20261106-23c5a2a' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the one purpose source envelope
        env:
          API_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: 23c5a2a8bd7c919d7e248ffd77306f3c8eaadee1
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess,urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL)
          try:
              expected=os.environ['ACCEPTED_MAIN_SHA']
              head=os.environ['GITHUB_SHA']
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              assert len(expected)==40 and all(c in '0123456789abcdef' for c in expected)
              assert event['repository']['full_name']=='pyatkoff/max-search-bot'
              assert event['ref']=='refs/heads/ops/archive-prefix-first-analysis-20261106-23c5a2a'
              assert event['before']==expected and event['after']==head
              assert not event.get('forced') and not event.get('deleted')
              assert git('rev-parse','HEAD').decode().strip()==head
              assert git('rev-list','--parents','-n','1',head).decode().split()==[head,expected]
              changed=git('diff','--name-status',expected,head).decode()
              assert changed=='A\t.github/workflows/archive-prefix-first-analysis-20261106-23c5a2a.yml\n'
              request=urllib.request.Request(
                  'https://api.github.com/repos/pyatkoff/max-search-bot/git/ref/heads/main',
                  headers={'Authorization':'Bearer '+os.environ['API_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert json.load(response)['object']['sha']==expected
              paths=[
                  'services/ArchiveResearchReadService.php','services/ArchiveResearchSemanticExtractor.php',
                  'services/ManagerAiTextRedactor.php','services/InternalOwnerDialogueScope.php',
                  'services/ModeledConversionSemanticPrediction.php','services/ArchivePredictiveStudyAtoms.php',
                  'services/ModeledConversionTextSignals.php','services/ArchivePredictiveStudyStore.php',
                  'services/ArchivePredictiveRelativeWeights.php','tools/archive_predictive_study.php',
                  'tools/archive_predictive_study.py']
              hashes={}
              for name in paths:
                  source=git('show',expected+':'+name)
                  path=pathlib.Path(name)
                  assert stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
                  assert path.read_bytes()==source
                  hashes[name]=hashlib.sha256(source).hexdigest()
              destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-source.json'
              destination.write_text(json.dumps({'source_commit':expected,'hashes':hashes},separators=(',',':')))
              destination.chmod(0o600)
          except Exception:
              print('{"ok":false,"source_envelope_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"source_envelope_verified":true}')
          PY
      - name: Prepare the existing identity and strict canonical host pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,re,socket,subprocess
          try:
              host=os.environ['TARGET']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host)
              assert {a[4][0] for a in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}=={'5.45.122.54'}
              key=os.environ['K']
              raw=key.replace('\\n','\n').replace('\r','').encode() if 'PRIVATE KEY' in key else base64.b64decode(key,validate=True)
              keypath=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-key'
              keypath.write_bytes(raw.rstrip(b'\n')+b'\n')
              keypath.chmod(0o600)
              check=subprocess.run(['ssh-keygen','-y','-f',str(keypath)],capture_output=True,timeout=10)
              assert check.returncode==0
              approved=set()
              for attempt in range(2):
                  try:
                      scan=subprocess.run(['ssh-keyscan','-t','ed25519','-T','10',host],capture_output=True,text=True,timeout=30)
                      lines=scan.stdout.splitlines()
                  except subprocess.TimeoutExpired as error:
                      output=error.stdout or b''
                      lines=(output.decode(errors='replace') if isinstance(output,bytes) else output).splitlines()
                  for line in lines:
                      fields=line.split()
                      if len(fields)!=3 or fields[1]!='ssh-ed25519':continue
                      try:
                          material=base64.b64decode(fields[2],validate=True)
                      except ValueError:continue
                      fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(material).digest()).decode().rstrip('=')
                      if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':
                          approved.add(host+' ssh-ed25519 '+fields[2])
                  if approved:break
              assert len(approved)==1
              known=pathlib.Path(os.environ['RUNNER_TEMP'])/'study-hosts'
              known.write_text('\n'.join(sorted(approved))+'\n')
              known.chmod(0o600)
          except Exception:
              print('{"ok":false,"canonical_host_verified":false}')
              raise SystemExit(1)
          print('{"ok":true,"canonical_host_verified":true}')
          PY
      - name: Perform the finite build with a technical receipt
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_ACCOUNT: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,re,socket,subprocess
          try:
              host=os.environ['TARGET']
              account=os.environ['SSH_ACCOUNT']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}',host)
              assert re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}',account)
              assert {a[4][0] for a in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}=={'5.45.122.54'}
              temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
              contract=json.loads((temporary/'study-source.json').read_text())
              remote_header='CONTRACT='+repr(contract)+'\nRUN_ID="archive-prefix-v2-20261106-23c5a2a"\nPARENT_RUN_ID="archive-prefix-study-20261105-d2505db"\n'
              remote_body=r"""
          import hashlib,json,os,pathlib,stat,subprocess,sys
          receipt={'ok':False,'operator_verified':False,'source_verified':False,'study_completed':False,
                   'private_outputs_written':False,'live_files_changed':False,'reason':'none','stage':'admission'}
          def verify_source(root):
              environment=dict(os.environ)
              environment['GIT_OPTIONAL_LOCKS']='0'
              head=subprocess.check_output(['/usr/bin/git','-C',str(root),'rev-parse','HEAD'],
                                           stderr=subprocess.DEVNULL,timeout=10,env=environment).decode().strip()
              assert head==CONTRACT['source_commit']
              for arguments in (['diff','--quiet','HEAD'],['diff','--cached','--quiet']):
                  subprocess.run(['/usr/bin/git','-C',str(root),*arguments],stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL,timeout=10,check=True,env=environment)
              for name,digest in CONTRACT['hashes'].items():
                  path=root/name
                  assert path.resolve()==path and stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          try:
              root=pathlib.Path('/var/www/anytoour/data/www/app.anytoour.ru')
              assert root.resolve()==root and root.stat().st_uid==1012 and os.geteuid()==1012
              os.chdir(root)
              receipt['operator_verified']=True
              verify_source(root)
              receipt['source_verified']=True
              study=pathlib.Path('/var/www/anytoour/data/private/archive-predictive-study')/RUN_ID
              assert study.resolve()==study and study.is_dir() and not study.is_symlink()
              info=study.lstat()
              assert info.st_uid==1012 and stat.S_IMODE(info.st_mode)==0o700
              cp=study/'checkpoint.json'
              ci=cp.lstat()
              assert stat.S_ISREG(ci.st_mode) and not cp.is_symlink() and ci.st_uid==1012 and stat.S_IMODE(ci.st_mode)==0o600 and ci.st_nlink==1 and ci.st_size<=262144
              saved=json.loads(cp.read_bytes())
              assert saved['run_id']==RUN_ID and saved['complete'] is True and saved['position'] is None
              assert saved['lineage']['parent_run_id']==PARENT_RUN_ID
              assert saved['provenance']['source_commit']==CONTRACT['source_commit'] and saved['provenance']['code_hashes']==CONTRACT['hashes']
              assert saved['provenance']['analyzer_sha256']==CONTRACT['hashes']['tools/archive_predictive_study.py']
              assert all(not (study/name).exists() and not (study/name).is_symlink() for name in ['analysis-intent.json','analysis','analysis-complete.json'])
              process=subprocess.run(
                  ['/usr/bin/php','-d','auto_prepend_file=','-d','auto_append_file=',
                   '-d','opcache.enable_cli=0','-d','display_errors=0','-d','log_errors=0',
                   'tools/archive_predictive_study.php','build',RUN_ID,CONTRACT['source_commit']],
                  capture_output=True,timeout=2200)
              assert len(process.stdout)<=8192 and len(process.stderr)<=8192
              proof=json.loads(process.stdout)
              if isinstance(proof,dict) and proof.get('ok') is False:
                  if proof.get('reason') in ["study_arguments","study_operator_denied","study_installed_source_changed","study_source_unavailable","study_source_changed","study_busy","study_provenance_changed","study_existing_intent","study_capture_complete","study_source_scope_changed","study_page_contract","study_expected_contract","study_window_contract","study_message_contract","study_page_reconciliation","study_position_contract","study_source_order","study_chunk_limit","study_orphan_conflict","study_corpus_reconciliation","study_chunk_changed","study_capture_incomplete","study_analysis_intent_changed","study_analysis_unknown","study_analysis_contract","study_analysis_binding","study_analysis_receipt_changed","study_analysis_failed","study_capture_limit","study_review_hash","study_candidate_changed","study_weights_not_eligible","study_activation_readback","study_process_unavailable","study_process_output_limit","study_process_timeout","study_summary_limit","study_summary_identity","study_raw_source_refused","study_checkpoint","study_checkpoint_limit","study_file","study_file_changed","study_file_limit","study_directory","study_directory_sync","study_scope","study_derive_arguments","study_derive_parent_incomplete","study_derive_target_exists","study_derive_source_changed","study_derive_parent_changed","study_derive_state_changed","study_operation_failed","study_public_output_contract"]:receipt['reason']=proof['reason']
                  if proof.get('stage') in ["arguments","operator","store","derivation_scope","derivation","activation_scope","activation","source_page","projection","checkpoint","analysis_intent","analysis","publication","admission","complete"]:receipt['stage']=proof['stage']
              assert isinstance(proof,dict) and proof.get('ok') is True
              assert all(isinstance(v,bool) for v in proof.values())
              assert process.returncode==0 and proof.get('completed') is True
              assert proof.get('live_files_changed',False) is False
              verify_source(root)
              receipt['study_completed']=True
              receipt['private_outputs_written']=True
              receipt['stage']='complete'
              receipt['ok']=True
          except Exception:
              pass
          print(json.dumps(receipt,separators=(',',':')))
          sys.exit(0 if receipt['ok'] else 1)
          """
              command=['ssh','-i',str(temporary/'study-key'),
                       '-o','BatchMode=yes','-o','IdentitiesOnly=yes',
                       '-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(temporary/'study-hosts'),
                       '-o','HostKeyAlgorithms=ssh-ed25519','-o','ConnectTimeout=10',
                       '-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3',
                       account+'@'+host,'/usr/bin/python3 -I -B -']
              result=subprocess.run(command,input=(remote_header+remote_body).encode(),
                                    capture_output=True,timeout=2250)
              assert len(result.stdout)<=8192 and len(result.stderr)<=8192
              proof=json.loads(result.stdout)
              keys={'ok','operator_verified','source_verified','study_completed','private_outputs_written','live_files_changed','reason','stage'}
              assert isinstance(proof,dict) and set(proof)==keys and all(isinstance(v,bool) for k,v in proof.items() if k not in ('reason','stage'))
              assert proof['reason'] in ["none","study_arguments","study_operator_denied","study_installed_source_changed","study_source_unavailable","study_source_changed","study_busy","study_provenance_changed","study_existing_intent","study_capture_complete","study_source_scope_changed","study_page_contract","study_expected_contract","study_window_contract","study_message_contract","study_page_reconciliation","study_position_contract","study_source_order","study_chunk_limit","study_orphan_conflict","study_corpus_reconciliation","study_chunk_changed","study_capture_incomplete","study_analysis_intent_changed","study_analysis_unknown","study_analysis_contract","study_analysis_binding","study_analysis_receipt_changed","study_analysis_failed","study_capture_limit","study_review_hash","study_candidate_changed","study_weights_not_eligible","study_activation_readback","study_process_unavailable","study_process_output_limit","study_process_timeout","study_summary_limit","study_summary_identity","study_raw_source_refused","study_checkpoint","study_checkpoint_limit","study_file","study_file_changed","study_file_limit","study_directory","study_directory_sync","study_scope","study_derive_arguments","study_derive_parent_incomplete","study_derive_target_exists","study_derive_source_changed","study_derive_parent_changed","study_derive_state_changed","study_operation_failed","study_public_output_contract"]
              assert proof['stage'] in ["arguments","operator","store","derivation_scope","derivation","activation_scope","activation","source_page","projection","checkpoint","analysis_intent","analysis","publication","admission","complete"]
              assert proof['live_files_changed'] is False
              print(json.dumps(proof,separators=(',',':')))
              raise SystemExit(0 if result.returncode==0 and proof['ok'] else 1)
          except Exception:
              print('{"ok":false,"technical_receipt_verified":false}')
              raise SystemExit(1)
          PY
      - name: Remove runner credentials and temporary technical files
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('study-key','study-hosts','study-source.json'):
              (temporary/name).unlink(missing_ok=True)
          print('{"ok":true,"runner_credentials_removed":true}')
          PY
