name: Advertising visit storage
on:
  pull_request:
    paths:
      - services/AdvertisingVisit*.php
      - migrations/063_advertising_visits.sql
      - tests/run_advertising_visits_regression.php
      - tests/mysql/advertising-visits.php
      - .github/workflows/advertising-visits.yml
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: advertising-fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: maxbot_advertising_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -padvertising-fixture-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - run: php tests/run_advertising_visits_regression.php
      - name: Verify the actual forward migration and imports on native MySQL
        env:
          ADVERTISING_VISITS_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=maxbot_advertising_test;charset=utf8mb4
          ADVERTISING_VISITS_MYSQL_USER: root
          ADVERTISING_VISITS_MYSQL_PASS: advertising-fixture-only
        run: php tests/mysql/advertising-visits.php
