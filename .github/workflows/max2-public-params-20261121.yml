name: Read natural MAX2 public visit parameters on 21 Nov 2026
on:
  push:
    branches: [audit/max2-public-params-20261121]
    paths:
      - .github/workflows/max2-public-params-20261121.yml
      - audit/max2-public-params-20261121/reader.py
      - audit/max2-public-params-20261121/runner.py
      - audit/max2-public-params-20261121/test_public_params.py
permissions:
  contents: read
concurrency:
  group: max2-public-params-readonly-owner-20261121
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.run_attempt == '1' && github.event.created == true && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the bounded read with mocked API responses
        run: python3 -m unittest discover -s audit/max2-public-params-20261121 -p test_public_params.py && python3 -m py_compile audit/max2-public-params-20261121/reader.py audit/max2-public-params-20261121/runner.py
      - name: Read the fixed counter with existing server credentials
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 88cbdc066c4381c4c84c5f0440ec9d35f8996ce518129c2966017c0e7fc433d2
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/max2-public-params-20261121/runner.py
      - name: Retain the encrypted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max2-public-params-98615635-20261121
          path: encrypted-max2-public-params/*.enc.json
          retention-days: 3
          if-no-files-found: error
