name: Validate alternate Telegram post 925 for Stella Makadi
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/read-1566-stella-alternate-candidates.yml]
permissions: {}
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read existing archive posts, registry, and current ads
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$USER_VALUE@$HOST_VALUE" 'bash -s' <<'REMOTE'
          set -eu
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = 'de6282c79cf533e316980a765acdd58a5227b05d' || test "$(git rev-parse HEAD)" = '0689691b5aa4b8cd5fbf2f3629d9e9dc76df7e9b'
          php -d display_errors=0 <<'PHP'
          <?php
          require 'tools/anytour_existing_post_batch.php';
          use function AnyTour\ExistingPostBatch\requirePost;
          use function AnyTour\ExistingPostBatch\transferChannelRights;
          use function AnyTour\ExistingPostBatch\transferSource;
          use function AnyTour\ExistingPostBatch\transferNoTarget;
          use function AnyTour\ExistingPostBatch\transferPlanFromBytes;
          use function AnyTour\ExistingPostBatch\transferMessageIdRejected;
          
          $id='925';
          $plan=transferPlanFromBytes(file_get_contents('config/anytour_existing_post_transfer_next_20261123.json'),
              '30f93518da51279979f7669538f7c09f6096733e9423f755dc21981af821b98d', true);
          $row=$plan['rows'][2];
          requirePost($row['hotel_id']===466 && $row['source_message_id']==='473' && $row['target_message_id']==='1101','stella_scope_changed');
          $journal=AnyTour\ExistingPostBatch\POST_OPS.'/anytour-issue1566-historical-tg-media-1101-v1/receipt.jsonl';
          $events=array_map(static fn(string $l): array=>json_decode($l,true,64,JSON_THROW_ON_ERROR),
              explode("\n",rtrim((string)file_get_contents($journal,false,null,0,1_000_001),"\r\n")));
          $byState=array_column($events,null,'state');
          requirePost(($byState['intent_saved']['execution']['native_run_id']??null)==='45272173038'
              && ($byState['provider_message_id_rejected']['message_id']??null)==='1101'
              && transferMessageIdRejected($byState['provider_response_saved']['response']??[]),'previous_stella_refusal_unconfirmed');
          $row['target_message_id']=$id;
          $target='https://t.me/anytour/'.$id;
          $newJournal=AnyTour\ExistingPostBatch\POST_OPS.'/anytour-issue1566-historical-tg-media-'.$id.'-v1';
          requirePost(!file_exists($newJournal)&&!is_link($newJournal),'alternate_telegram_journal_occupied');
          ob_start();
          try {
              require_once 'config.php';
              require_once 'services/ChannelPostRegistryService.php';
              require_once 'services/ChannelPostButtonTransport.php';
              require_once 'services/ChannelPostRuntime.php';
              require_once 'integrations/ChannelPostApiTransport.php';
              require_once 'hotel-posts-telegram-main19.php';
          } finally { ob_end_clean(); }
          $pdo=ConversationDb::connection();
          $pdo->exec('SET TRANSACTION READ ONLY');
          $pdo->beginTransaction();
          try {
              $registry=new ChannelPostRegistryService($pdo);
              transferChannelRights($registry);
              transferSource($pdo,$registry,$row);
              transferNoTarget($pdo,$row);
          } finally { $pdo->rollBack(); }
          $feed=anytourTelegramFeedOfferUrls(anytourTelegramFeedRead());
          $routes=anytourTelegramFeedDestinationPosts($feed);
          requirePost(($feed['tg_466']??null)==='https://t.me/any_toour/473'
              && ($routes['tg_466']??null)==='https://t.me/any_toour/473'
              && !in_array($target,$routes,true) && !in_array($target,$feed,true),'alternate_telegram_feed_in_use');
          $channel=ChannelPostApiTransport::buttonRequest('telegram','POST','getChat',[],['chat_id'=>'-1001845835645']);
          $chat=$channel['data']['result']??[];
          requirePost($channel['http']===200 && $channel['data']['ok']===true && ($chat['username']??null)==='anytour'
              && (string)($chat['pinned_message']['message_id']??'')!==$id, 'alternate_telegram_pinned');
          $context=stream_context_create(['http'=>['method'=>'GET','timeout'=>12,'follow_location'=>0,
              'header'=>"User-Agent: Mozilla/5.0\r\n"],'ssl'=>['verify_peer'=>true,'verify_peer_name'=>true]]);
          $body=file_get_contents($target.'?embed=1&mode=tme',false,$context,0,1_000_001);
          requirePost(is_string($body)&&strlen($body)<=1_000_000,'alternate_telegram_public_unavailable');
          $doc=new DOMDocument('1.0','UTF-8');
          requirePost(@$doc->loadHTML($body,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'alternate_telegram_public_invalid');
          $xp=new DOMXPath($doc);
          $posts=$xp->query('//*[@data-post="anytour/'.$id.'"]');
          requirePost($posts&&$posts->length===1,'alternate_telegram_id_changed');
          $p=$posts->item(0);
          $ts=$xp->query('.//time[@datetime]',$p);
          $caption=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_text ")]',$p);
          $media=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_photo_wrap ")]',$p);
          requirePost($ts&&$caption&&$media&&$ts->length===1&&$caption->length===1&&$media->length===1,'alternate_telegram_type_changed');
          $html='';
          foreach ($caption->item(0)->childNodes as $child) $html.=$doc->saveHTML($child);
          $text=html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$html)),ENT_QUOTES|ENT_HTML5,'UTF-8');
          $photo=$media->item(0);
          $marker=trim($photo->getAttribute('class'));
          $date=(new DateTimeImmutable($ts->item(0)->getAttribute('datetime')))->getTimestamp();
          requirePost($date===1731241439&&hash('sha256',$text)==='f73587cf7dcc1fafa3c303bd8948dbafbdf3fc8ae07992acf5472e8f0d6a220e'
              && hash('sha256',$marker)==='00581a7eaa9f78288dfc78567412b44ab4cd8b12ba195548a2cb3272f5a6573e'&& $photo->getAttribute('href')===$target,'alternate_public_fingerprint_changed');
          requirePost(preg_match('~background-image:\s*url\([\'"]?(https://[^\'")]+)[\'"]?\)~',$photo->getAttribute('style'),$match)===1,'alternate_telegram_photo_missing');
          $photoUrl=parse_url($match[1]);
          requirePost(is_array($photoUrl)&&($photoUrl['scheme']??'')==='https'&&!isset($photoUrl['port'],$photoUrl['user'],$photoUrl['pass'])
              && preg_match('/\A(?:[a-z0-9-]+\.)*(?:cdn-telegram\.org|telegram-cdn\.org|telesco\.pe)\z/D',$photoUrl['host']??'')===1,'alternate_telegram_photo_invalid');
          echo json_encode(['hotel_id'=>466,'target'=>$id,'source'=>'473','date'=>$date,'caption_sha256'=>hash('sha256',$text),
              'photo_sha256'=>hash('sha256',$marker),'previous_post_excerpt'=>mb_substr($text,0,1200),
              'public_single_photo'=>true,'not_current_pinned_message'=>true,'vacant_registry_and_routing'=>true,
              'source_current'=>true,'previous_explicit_rejection'=>true,'writes'=>0],JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          REMOTE
      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
