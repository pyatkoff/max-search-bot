name: Read original Stella925 pre-write refusal without replay
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/read-1566-stella-alternate-candidates.yml]
permissions: {}
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '6297778264285e1186847f5a5d3399c9ca9b0c56' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read existing archive posts, registry, and current ads
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$USER_VALUE@$HOST_VALUE" 'bash -s' <<'REMOTE' | tee stella-original-read.json
          set -eu
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = '8d723f1c08f094fd845c7c34da29607fc294ff46'
          php -d display_errors=0 <<'PHP'
          <?php
          use function AnyTour\ExistingPostBatch\{requirePost,transferRuntime,transferPlanFromBytes,transferSource,transferNoTarget,parseTransferPublic,transferReason};
          ini_set('display_errors','0');ini_set('log_errors','0');
          require 'tools/anytour_existing_post_batch.php';
          $root=getcwd();$sha='8d723f1c08f094fd845c7c34da29607fc294ff46';
          transferRuntime($root,$sha);
          $digest='c71a7e945c0978910267ecb729dd25449a45b66e5fa4874c669c7592fae27aab';
          $plan=transferPlanFromBytes(file_get_contents('config/anytour_stella_alternate_20261123.json'),$digest,$digest);
          requirePost(count($plan['rows'])===1,'read_scope_changed');$row=$plan['rows'][0];
          requirePost($row['hotel_id']===466&&$row['target_message_id']==='925'&&$row['source_message_id']==='473','read_scope_changed');
          $dir=AnyTour\ExistingPostBatch\POST_OPS.'/anytour-issue1566-historical-tg-media-925-v1';
          requirePost(!file_exists($dir)&&!is_link($dir),'stella_operation_present_do_not_replay');
          $lease=AnyTour\ExistingPostBatch\POST_OPS.'/monitor-price-after-collection-v1.jsonl';
          requirePost(is_file($lease)&&!is_link($lease),'price_lock_unavailable');$lock=fopen($lease,'rb');
          requirePost(is_resource($lock)&&flock($lock,LOCK_SH|LOCK_NB),'price_content_busy');
          ob_start();try{require_once 'config.php';require_once 'services/ChannelPostRegistryService.php';require_once 'services/ChannelPostButtonTransport.php';require_once 'services/ChannelPostRuntime.php';require_once 'integrations/ChannelPostApiTransport.php';}finally{ob_end_clean();}
          $pdo=ConversationDb::connection();$pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
          try{$registry=new ChannelPostRegistryService($pdo);transferSource($pdo,$registry,$row);transferNoTarget($pdo,$row);}finally{$pdo->rollBack();}
          $out=['ok'=>true,'original_run_id'=>'45349080956','application_sha'=>$sha,'operation_directory_absent'=>true,'target_registry_absent'=>true,'source_current'=>true,'provider_write_attempts'=>0,'db_writes'=>0,'bot_starts'=>0,'public'=>[]];
          foreach([['any_toour','473'],['anytour','925']] as [$channel,$id])foreach(['embed','history'] as $kind){
           $url=$kind==='embed'?'https://t.me/'.$channel.'/'.$id.'?embed=1&mode=tme':'https://t.me/s/'.$channel.'?before='.((int)$id+1);
           $body='';$c=curl_init($url);curl_setopt_array($c,[CURLOPT_FOLLOWLOCATION=>false,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>20,CURLOPT_USERAGENT=>'Mozilla/5.0',CURLOPT_WRITEFUNCTION=>static function($c,string $s)use(&$body):int{if(strlen($body)+strlen($s)>1000000)return 0;$body.=$s;return strlen($s);}]);
           $ok=curl_exec($c)!==false&&curl_errno($c)===0;$http=(int)curl_getinfo($c,CURLINFO_HTTP_CODE);curl_close($c);
           $p=['channel'=>$channel,'message_id'=>$id,'kind'=>$kind,'http'=>$http,'bytes'=>strlen($body),'sha256'=>hash('sha256',$body),'parsed'=>false];
           try{requirePost($ok&&$http===200,'public_transport_unavailable');$v=parseTransferPublic($body,$channel,$id,$digest);$p+=['caption_sha256'=>$v['caption_sha256'],'single_photo'=>$v['single_photo'],'published_unixtime'=>$v['published_unixtime']];$p['parsed']=true;}catch(Throwable $e){$p['reason']=transferReason($e);}
           $out['public'][]=$p;
          }
          transferRuntime($root,$sha);clearstatcache(true,$dir);requirePost(!file_exists($dir)&&!is_link($dir),'operation_changed_during_read');fclose($lock);
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          REMOTE
      - name: Preserve original bounded readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stella925-original-readback
          path: stella-original-read.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
