name: Read Metrika goals for the completed owner-requested week
on:
  push:
    branches: [audit/yandex-goals-weekly-20261025]
    paths:
      - .github/workflows/yandex-goals-weekly-readonly.yml
      - audit/yandex-goals-weekly-readonly.py
      - audit/yandex-goals-weekly-runner.py
permissions:
  contents: read
concurrency:
  group: metrika-goals-weekly-owner-20261025
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read fixed counter with existing server credentials
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 5e545517ca7318be2db9569313f8b2f72df7b6ddc8537a3f70ceb17239a4d511
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/yandex-goals-weekly-runner.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrika-goals-98615635-week-20261018-20261024
          path: encrypted-goals/*.enc.json
          retention-days: 3
          if-no-files-found: error
