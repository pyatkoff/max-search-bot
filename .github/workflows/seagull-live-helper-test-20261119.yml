name: Seagull exact Telegram bounded read-only access diagnosis
on:
  push:
    branches: [audit/seagull-live-helper-test-20261119]
    paths: ['.github/workflows/seagull-live-helper-test-20261119.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: seagull-live-helper-test-diagnosis
  cancel-in-progress: false
jobs:
  read-only:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'bd8e248f7138ea75cb9fda2dcf44beb631c633a5' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare bounded read-only diagnosis; no sender
        shell: bash
        run: |
          set -euo pipefail
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);function need(bool $ok,string $reason):void{if(!$ok)throw new RuntimeException($reason);}
          function verifySeagullTelegramPublic(array $row): void {
           need($row['platform']==='telegram' && $row['publication_id']===20 && $row['message_id']==='1754','tg_live_scope_changed');
           $body='';$c=curl_init('https://t.me/anytour/1754?embed=1&mode=tme');
           curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_CONNECTTIMEOUT=>4,CURLOPT_TIMEOUT=>12,CURLOPT_WRITEFUNCTION=>static function($h,$x)use(&$body){if(strlen($body)+strlen($x)>262144)return 0;$body.=$x;return strlen($x);}]);
           $ok=curl_exec($c);$http=curl_getinfo($c,CURLINFO_HTTP_CODE);$errno=curl_errno($c);curl_close($c);need($ok===true && $http===200 && $errno===0,'tg_live_read_failed');
           $dom=new DOMDocument();libxml_use_internal_errors(true);$dom->loadHTML($body);$xp=new DOMXPath($dom);$roots=$xp->query('//*[@data-post="anytour/1754"]');need($roots->length===1,'tg_live_identity_changed');$root=$roots->item(0);
           $texts=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_text ")]',$root);need($texts->length===1,'tg_live_caption_missing');$html='';foreach($texts->item(0)->childNodes as $node)$html.=$dom->saveHTML($node);
           $text=html_entity_decode(strip_tags(preg_replace('~<br\\s*/?>~i',"\n",$html)),ENT_QUOTES|ENT_HTML5,'UTF-8');need($text===$row['old_text'],'tg_live_caption_changed');
           $photos=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_photo_wrap ")]',$root);
           need($photos->length===1 && $photos->item(0)->getAttribute('href')==='https://t.me/anytour/1754' && $photos->item(0)->getAttribute('class')==='tgme_widget_message_photo_wrap 5381876321958436942 1253065728_460005454' && str_contains($photos->item(0)->getAttribute('style'),'background-image'),'tg_live_photo_changed');
          }
          
          $row=json_decode(base64_decode(''),true);verifySeagullTelegramPublic($row);echo 'TG_EXACT_LIVE_PREFLIGHT_PASS',PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read main channel registry and provider metadata without writes
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = bd8e248f7138ea75cb9fda2dcf44beb631c633a5
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; test -z "$(git status --porcelain --untracked-files=no)"; php' < pub/read-only.php > pub/result.json
          cat pub/result.json
      - name: Preserve original diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seagull-live-helper-test-20261119
          path: pub/result.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
