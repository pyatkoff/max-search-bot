name: Fast bot cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-cutover.yml'
      - 'tools/standby_enable_standalone.php'
      - 'tools/repair_standby_external_config.php'
      - 'tools/max_subscription_cutover.php'
      - 'services/MaxTlsConfig.php'
      - 'integrations/MaxWebhookHealth.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-search-fast-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record expected revision
        shell: bash
        run: echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Install pinned MAX CA bundle on new server
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          root_ca="$RUNNER_TEMP/russian_trusted_root_ca_pem.crt"
          expected_sha256='d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31'
          curl -kfsSL --connect-timeout 8 --max-time 30 \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            -o "$root_ca"
          openssl x509 -in "$root_ca" -noout -subject -issuer | grep -Fq 'Russian Trusted Root CA'
          actual_sha256="$(openssl x509 -in "$root_ca" -outform DER | sha256sum | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
          standby="${STANDBY_DEPLOY_USER}@${STANDBY_DEPLOY_HOST}"
          cat "$root_ca" | ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$standby" '
            set -e
            umask 077
            mkdir -p /var/www/anytoour/data/config
            cat > /var/www/anytoour/data/config/max-ca-bundle.crt
            chmod 600 /var/www/anytoour/data/config/max-ca-bundle.crt
            test -s /var/www/anytoour/data/config/max-ca-bundle.crt
            actual=$(openssl x509 -in /var/www/anytoour/data/config/max-ca-bundle.crt -outform DER | sha256sum | awk '\''{print $1}'\'')
            test "$actual" = "d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31"
            curl --cacert /var/www/anytoour/data/config/max-ca-bundle.crt --connect-timeout 8 --max-time 20 -sS -o /dev/null https://platform-api2.max.ru/subscriptions
            echo MAX_CA_BUNDLE_VERIFIED=YES
          '

      - name: Synchronize and configure new server
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; git fetch origin main; git reset --hard '$EXPECTED_SHA'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; export MAX_SEARCH_ALLOW_STANDBY_CONFIG_WRITE=1; php tools/repair_standby_external_config.php | grep -qx 'STANDBY_EXTERNAL_CONFIG_REPAIR=OK'; php tools/standby_enable_standalone.php --enable; php tools/standalone_readiness.php | grep -qx 'STANDALONE_READY=YES'; php tools/standby_enable_standalone.php --commit; php tools/webhook_target_status.php | tee /tmp/max-search-cutover-targets.txt; grep -q 'TELEGRAM_WEBHOOK_TARGET_HOST=app.anytoour.ru' /tmp/max-search-cutover-targets.txt; grep -q 'MAX_WEBHOOK_TARGET_HOST=app.anytoour.ru' /tmp/max-search-cutover-targets.txt"

      - name: Detect partial cutover ownership
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/telegram_webhook_status.php")"
          if printf '%s\n' "$status" | grep -Fq '"url": "https://app.anytoour.ru/telegram_webhook.php"'; then
            echo 'TELEGRAM_ALREADY_NEW=1' >> "$GITHUB_ENV"
            echo 'PARTIAL_CUTOVER_RESUME=YES'
          else
            echo 'TELEGRAM_ALREADY_NEW=0' >> "$GITHUB_ENV"
            echo 'PARTIAL_CUTOVER_RESUME=NO'
          fi

      - name: Back up current new-server conversation database
        if: env.TELEGRAM_ALREADY_NEW != '1'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; cnf=/tmp/max-search-standby-${GITHUB_RUN_ID}.cnf; trap 'rm -f \"\$cnf\"' EXIT; php tools/conversation_db_mysql_defaults.php --write-defaults \"\$cnf\" >/dev/null; db=\$(php tools/conversation_db_mysql_defaults.php --database-name); umask 077; mysqldump --defaults-extra-file=\"\$cnf\" --single-transaction --quick --skip-lock-tables --no-tablespaces \"\$db\" | gzip -1 > /tmp/max-search-pre-fast-cutover-${GITHUB_RUN_ID}.sql.gz; test -s /tmp/max-search-pre-fast-cutover-${GITHUB_RUN_ID}.sql.gz"

      - name: Copy a fresh live conversation snapshot to new server
        if: env.TELEGRAM_ALREADY_NEW != '1'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          target="/tmp/max-search-fast-cutover-${GITHUB_RUN_ID}.sql.gz"
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd ~/www/anytour.online/max-search; cnf=/tmp/max-search-prod-${GITHUB_RUN_ID}.cnf; trap 'rm -f \"\$cnf\"' EXIT; /opt/php81/bin/php tools/conversation_db_mysql_defaults.php --write-defaults \"\$cnf\" >/dev/null; db=\$(/opt/php81/bin/php tools/conversation_db_mysql_defaults.php --database-name); mysqldump --defaults-extra-file=\"\$cnf\" --single-transaction --quick --skip-lock-tables --no-tablespaces \"\$db\" | gzip -1" | ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "umask 077; cat > '$target'; test -s '$target'"

      - name: Import live snapshot and migrate
        if: env.TELEGRAM_ALREADY_NEW != '1'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          target="/tmp/max-search-fast-cutover-${GITHUB_RUN_ID}.sql.gz"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; cnf=/tmp/max-search-standby-${GITHUB_RUN_ID}.cnf; trap 'rm -f \"\$cnf\" '$target'' EXIT; php tools/conversation_db_mysql_defaults.php --write-defaults \"\$cnf\" >/dev/null; db=\$(php tools/conversation_db_mysql_defaults.php --database-name); gzip -dc '$target' | mysql --defaults-extra-file=\"\$cnf\" \"\$db\"; php tools/conversation_db.php migrate; php tools/standalone_readiness.php | grep -qx 'STANDALONE_READY=YES'; echo FAST_DB_IMPORT=OK"

      - name: Switch Telegram webhook to new server
        if: env.TELEGRAM_ALREADY_NEW != '1'
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php -r 'parse_str(\"action=set\", \$_GET); require \"telegram_webhook_admin.php\";' | tee /tmp/telegram-cutover.txt; grep -q 'https://app.anytoour.ru/telegram_webhook.php' /tmp/telegram-cutover.txt; grep -q '\"ok\": true' /tmp/telegram-cutover.txt"

      - name: Add MAX subscription on new server and preserve legacy
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/max_subscription_cutover.php --add-new | tee /tmp/max-cutover.txt; grep -qx 'MAX_SUBSCRIPTION_TARGET_OK=YES' /tmp/max-cutover.txt; grep -qx 'MAX_SUBSCRIPTION_LEGACY_COUNT=1' /tmp/max-cutover.txt; grep -qx 'MAX_SUBSCRIPTION_NEW_COUNT=1' /tmp/max-cutover.txt"

      - name: Verify messenger providers and lead bridge
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/telegram_webhook_status.php; php tools/max_webhook_status.php | tee /tmp/max-health.txt; grep -q '\"ok\": true' /tmp/max-health.txt; grep -q '\"reason\": \"healthy_cutover_dual\"' /tmp/max-health.txt; php tools/lead_bridge_probe.php; echo BOT_CUTOVER=COMPLETE"

      - name: Record accepted fast-cutover tradeoff
        shell: bash
        run: |
          echo 'Fast cutover used a consistent live DB snapshot without freezing old writes.'
          echo 'A small number of conversations created after the dump started and before webhook switch may not exist on the new DB.'
          echo 'If Telegram was already owned by the new server, resume mode skipped DB overwrite and Telegram mutation.'
          echo 'MAX keeps both legacy and new verified subscriptions during observation; legacy is not removed by this workflow.'
          echo 'The old Bitrix lead receiver remains intentionally active.'
