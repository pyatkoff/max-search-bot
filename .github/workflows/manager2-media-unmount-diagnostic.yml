name: Manager2 media retirement confirmation
on:
  push:
    branches: [diagnosis/manager2-media-retirement-confirm-20261018]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39141379497
          name: manager2-measurement-input-2ddb0ff079d2682fef5d02a42d31ece3625fd870
          path: installed
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Confirm exact candidate through30 full cycles and clean shutdown
        run: node tools/confirm_manager2_media_retirement.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager2-media-confirmation-${{ github.sha }}
          path: media-confirmation/
          if-no-files-found: error
          retention-days: 30
