name: Check fifty screened non-Dominican hotel IDs in both publication registries
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/commercial-wave7-native-registry-read-20261118.yml']
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  registry-screen:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'c4fb9b86f233c09f706b4133f5a690300467d7b3' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the read-only HOTEL CONTENT check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p pub
          cat > pub/registry-read.php <<'PHP'
          <?php
          declare(strict_types=1);
          
          ini_set('display_errors', '0');
          $installed = trim((string)shell_exec('git rev-parse HEAD'));
          if (PHP_SAPI !== 'cli' || $installed !== 'cc017ee5bb669f4c7c13efc91d5c5812a50e55f2') {
              fwrite(STDERR, "Installed application changed before registry read\n");
              exit(2);
          }
          if (trim((string)shell_exec('git status --porcelain --untracked-files=no')) !== '') {
              fwrite(STDERR, "Tracked production files differ from the installed release\n");
              exit(2);
          }
          $pins = json_decode(base64_decode('', true), true, 64, JSON_THROW_ON_ERROR);
          foreach ($pins as $path => $expected) {
              if (trim((string)shell_exec('git hash-object -- ' . escapeshellarg($path))) !== $expected) {
                  throw new RuntimeException('Pinned publication component differs from the installed release');
              }
          }
          $manifest = json_decode(base64_decode('', true), true, 64, JSON_THROW_ON_ERROR);
          if (count($manifest) !== 50 || count(array_unique(array_column($manifest, 0))) !== 50) {
              throw new RuntimeException('Unexpected intake scope');
          }
          
          ob_start();
          require getcwd() . '/config.php';
          require_once getcwd() . '/services/ChannelPostRuntime.php';
          ob_end_clean();
          
          $pdo = ConversationDb::connection();
          $pdo->exec('SET SESSION TRANSACTION READ ONLY');
          $pdo->beginTransaction();
          $result = ['installed_sha' => $installed, 'checked_at' => gmdate(DATE_ATOM),
              'native_hotel_ids' => array_column($manifest, 0), 'channels' => [], 'matches' => []];
          try {
              $query = $pdo->prepare('SELECT p.id, p.current_version_id, v.snapshot_json
                  FROM post_publications p JOIN post_versions v ON v.id = p.current_version_id
                  WHERE p.post_channel_id = ? ORDER BY p.id');
              foreach (['telegram' => 10, 'max' => 9] as $platform => $channel) {
                  $query->execute([$channel]);
                  $rows = $query->fetchAll(PDO::FETCH_ASSOC);
                  if (count($rows) < 1186) {
                      throw new RuntimeException('Publication registry is below the verified baseline');
                  }
                  $result['channels'][$platform] = count($rows);
                  foreach ($rows as $record) {
                      $post = json_decode($record['snapshot_json'], true, 64, JSON_THROW_ON_ERROR);
                      $title = explode("\n", (string)($post['text'] ?? ''), 2)[0];
                      $metadata = $post['metadata'] ?? [];
                      $native = (int)($metadata['hotel_catalog_id'] ?? 0);
                      foreach ($manifest as [$id, $aliases]) {
                          $reason = [];
                          if ($native === $id || ($metadata['logical_id'] ?? '') === "commercial-hotel-$id-v1") {
                              $reason[] = 'identity';
                          }
                          foreach ($aliases as $alias) {
                              if ($alias !== '' && mb_stripos($title, $alias, 0, 'UTF-8') !== false) {
                                  $reason[] = 'title';
                                  break;
                              }
                          }
                          if ($reason !== []) {
                              $result['matches'][] = ['requested_id' => $id, 'registry_hotel_id' => $native,
                                  'platform' => $platform, 'publication_id' => (int)$record['id'],
                                  'version_id' => (int)$record['current_version_id'], 'reason' => $reason,
                                  'title' => mb_substr($title, 0, 180, 'UTF-8')];
                          }
                      }
                  }
              }
          } finally {
              $pdo->rollBack();
          }
          echo json_encode($result, JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          php -l pub/registry-read.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Check both publication registries in a read-only transaction
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'cd /var/www/anytoour/data/www/app.anytoour.ru && php' < pub/registry-read.php > pub/registry-receipt.json
          python3 -c 'import json; p=json.load(open("pub/registry-receipt.json")); print({"checked":len(p["native_hotel_ids"]), "registry_counts":p["channels"], "matches":len(p["matches"])})'
      - name: Preserve exact duplicate screening
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave10-native-registry-read-20261118
          path: pub/registry-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/registry-read.php

