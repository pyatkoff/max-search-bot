name: Read existing W11 approved ten pairs after terminal W13 without edits
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  read-existing-w11-approved10:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '0f8bac12837d945a7b359ac7343ebd27f81f3afd'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
        sparse-checkout: tools/direct_demand/operations
    - name: Verify terminal W13, current release and exact read-only package
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport subprocess,json,base64,os\nREPO='pyatkoff/max-search-bot'\nAPP='bd8e248f7138ea75cb9fda2dcf44beb631c633a5'\n\
        def api(path):\n    return subprocess.check_output(['gh','api',f'repos/{REPO}/{path}'],timeout=70)\n\ndef info(path):\n\
        \    return json.loads(api(path))\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\nassert info('git/ref/heads/main')['object']['sha']==APP\n\
        d=json.loads(base64.b64decode(info('contents/deploy_status.json?ref=diagnostics')['content']))\nrelease=d['repository_release']\n\
        assert release['kind']=='installed' and release['repository_sha']==release['application_sha']==d['sha']==APP\nassert\
        \ str(release['release']['run_id'])=='44329290180' and all(s['result']=='success' for s in release['stages'].values())\n\
        required={'deploy.yml','retired-domain-guard.yml','max-tls-preflight.yml','max-production-health.yml',\n         \
        \ 'telegram-production-health.yml','publish-conversation-diagnostics.yml','live-session-diagnostics.yml',\n      \
        \    'tour-selection-host.yml','modeled-conversion-monitor.yml'}\ngates={g['path'].rsplit('/',1)[-1]:g for g in release['closure']['gates']}\n\
        assert required <= gates.keys()\nassert all(gates[p]['conclusion']=='success' and gates[p]['head_sha']==APP and gates[p]['run_attempt']==1\
        \ for p in required)\n\nr=info('actions/runs/44375796597')\nassert r['status']=='completed' and r['conclusion']=='success'\
        \ and r['run_attempt']==1 and r['head_sha']=='0f8bac12837d945a7b359ac7343ebd27f81f3afd', 'W13_NOT_TERMINAL_SUCCESS_STOP'\n\
        feed=info('actions/runs?branch=audit%2Fprice660-27316-resume-readiness-20261117&per_page=5')\nassert not [r for r\
        \ in feed['workflow_runs'] if r['status'] in {'requested','queued','in_progress','waiting','pending'}], 'ACTIVE_FEED_OWNER_STOP'\n\
        assert info('git/ref/heads/audit/content100-bot-publication-20261101')['object']['sha']==os.environ['GITHUB_SHA'],\
        \ 'CARRIER_ADVANCED_STOP'\nfrom pathlib import Path\nimport hashlib\nroot=Path('tools/direct_demand/operations/w11-approved-corrections')\n\
        expected={'prepare-read-stage.py': 'fb6a50c321c0d808c1051da2bbac762732114bca8ad1e2b29b5d0c642719a27c', 'bound-w11-posts.json':\
        \ '84dbec5a506b7308e2f78a33dacc401a18bf9fa9ff6c84c1d82f57f4da0680ed', 'approved-texts.json': '2a55fda496c5d4e18bc7170e40e86409ee7610c3f5c9f2920d2a940ce38ca3c4'}\n\
        for name,sha in expected.items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha\nPY\npython3 tools/direct_demand/operations/w11-approved-corrections/prepare-read-stage.py\
        \ metadata --ops tools/direct_demand/operations --out caption-w11-read\nphp -l caption-w11-read/journal-metadata.php\n"
    - name: Pin established SSH host continuity and authentication identity
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE']\
        \ or '')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')\nPY\nif [[ \"$KEY_VALUE\" == *\"PRIVATE\
        \ KEY\"* ]]; then\n  if [[ \"$KEY_VALUE\" == *'\\n'* ]]; then printf '%b\\n' \"$KEY_VALUE\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"\
        ; else printf '%s\\n' \"$KEY_VALUE\" | tr -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse printf '%s' \"$KEY_VALUE\"\
        \ | base64 --decode > \"$RUNNER_TEMP/channel_key\"; fi\nchmod 600 \"$RUNNER_TEMP/channel_key\"\nssh-keygen -y -f \"\
        $RUNNER_TEMP/channel_key\" >/dev/null\npython3 - <<'PY'\nimport base64,hashlib,os,pathlib,subprocess\nscan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]\n\
        for s in scan.stdout.splitlines():\n    q=s.split()\n    if len(q)<3 or q[0].startswith('#'):continue\n    try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')\n\
        \    except Exception:continue\n    if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)\n\
        assert found,'HOST_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(found)+'\\n')\nprint('ESTABLISHED_HOST_PIN_VERIFIED')\nPY\n"
    - name: Read fresh journal metadata without changing the journal
      env: &id001
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")

        ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" ''set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE
        GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0;
        cd /var/www/anytoour/data/www/app.anytoour.ru; php'' < caption-w11-read/journal-metadata.php > caption-w11-read/journal-metadata.json

        python3 tools/direct_demand/operations/w11-approved-corrections/prepare-read-stage.py read --ops tools/direct_demand/operations
        --out caption-w11-read --journal-meta caption-w11-read/journal-metadata.json

        php -l caption-w11-read/read.php

        '
    - name: Read exact 20 current publications and existing price lineage; no edits
      env: *id001
      shell: bash
      run: "set -euo pipefail\noptions=(-i \"$RUNNER_TEMP/channel_key\" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes\
        \ -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=\"$RUNNER_TEMP/channel_known_hosts\"\
        )\nssh \"${options[@]}\" \"$USER_VALUE@$HOST_VALUE\" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE\
        \ GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0;\
        \ cd /var/www/anytoour/data/www/app.anytoour.ru; php' < caption-w11-read/read.php > caption-w11-read/read-result.json\n\
        python3 - <<'PY'\nimport json,pathlib\np=pathlib.Path('caption-w11-read');d=json.loads((p/'read-result.json').read_bytes());m=json.loads((p/'journal-metadata.json').read_bytes());s=json.loads((p/'read-scope.json').read_bytes())\n\
        assert d['ok'] is True and d['operation']==s['operation'] and d['installed_sha']==m['installed_sha']\nassert d['post_write_attempts']==0\
        \ and d['provider_calls']==10 and len(d['posts'])==20\nassert d['monitor_pending'] is False and d['monitor_journal_sha256']==m['journal_pin']['sha256']\
        \ and d['journal_pin']==m['journal_pin']\nexpected={(r['hotel_id'],platform):r for r in s['rows'] for platform in\
        \ ['max','telegram']};seen=set()\nfor row in d['posts']:\n key=(row['hotel_id'],row['platform']);assert key in expected\
        \ and key not in seen;seen.add(key);bound=expected[key]\n assert row['publication_id']==bound[row['platform']+'_publication_id']\
        \ and row['post_url']==bound[row['platform']+'_url']\n assert row['status']=='sent' and row['button_resolves_to_current_post']\
        \ is True and row['media_count']==1\n assert row['provider_live_verified'] is (row['platform']=='max')\n if row['platform']=='telegram':assert\
        \ row['message_id']==str(bound['telegram_message_id'])\nassert seen==set(expected)\nprint('W11_APPROVED10_READONLY_SNAPSHOT_VERIFIED_NO_EDITS')\n\
        PY\n"
    - name: Preserve read-only snapshot and fresh journal pin
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: w11-approved10-caption-readonly-20261118
        path: 'caption-w11-read/journal-metadata.json

          caption-w11-read/read-scope.json

          caption-w11-read/read-result.json

          '
        retention-days: 30
        if-no-files-found: warn
    - name: Remove runner-only key and compiled readers
      if: always()
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" caption-w11-read/*.php
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/commercial-wave7-native-registry-read-20261118.yml
