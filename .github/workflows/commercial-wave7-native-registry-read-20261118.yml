name: Read post-W20 three accepted hotel identities; zero provider writes
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  registry-screen:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
      && github.event.before == '4aacc65b49648d9b38be7801d971c11379838305' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Require current installed release and original closure gates
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import subprocess,json,base64

        def data(p):return json.loads(subprocess.check_output([''gh'',''api'',''repos/pyatkoff/max-search-bot/''+p],timeout=60))

        app=''9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e''

        assert data(''git/ref/heads/main'')[''object''][''sha'']==app

        d=json.loads(base64.b64decode(data(''contents/deploy_status.json?ref=diagnostics'')[''content'']));r=d[''repository_release'']

        assert r[''kind'']==''installed'' and r[''repository_sha'']==r[''application_sha'']==d[''sha'']==app

        assert str(r[''release''][''run_id''])==''44595114412'' and all(s[''result'']==''success''
        for s in r[''stages''].values())

        required={''deploy.yml'',''retired-domain-guard.yml'',''max-tls-preflight.yml'',''max-production-health.yml'',''telegram-production-health.yml'',''publish-conversation-diagnostics.yml'',''live-session-diagnostics.yml'',''tour-selection-host.yml'',''modeled-conversion-monitor.yml''}

        g={v[''path''].rsplit(''/'',1)[-1]:v for v in r[''closure''][''gates'']};assert
        required<=g.keys()

        assert all(g[x][''conclusion'']==''success'' and g[x][''head_sha'']==app and
        g[x][''run_attempt'']==1 for x in required)

        assert ''PR1631: установлено, выпуск свободен'' in data(''issues/comments/6682640708'')[''body'']

        print(''CURRENT_EXACT_RELEASE_ADMITTED_READ_ONLY'')

        PY

        '
    - name: Prepare the read-only HOTEL CONTENT check
      shell: bash
      run: "set -euo pipefail\numask 077\nmkdir -p pub\ncat > pub/registry-read.php\
        \ <<'PHP'\n<?php\ndeclare(strict_types=1);\n\nini_set('display_errors', '0');\n\
        $installed = trim((string)shell_exec('git rev-parse HEAD'));\nif (PHP_SAPI\
        \ !== 'cli' || $installed !== '9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e')\
        \ {\n    fwrite(STDERR, \"Installed application changed before registry read\\\
        n\");\n    exit(2);\n}\nif (trim((string)shell_exec('git status --porcelain\
        \ --untracked-files=no')) !== '') {\n    fwrite(STDERR, \"Tracked production\
        \ files differ from the installed release\\n\");\n    exit(2);\n}\n$pins =\
        \ json_decode(base64_decode('',\
        \ true), true, 64, JSON_THROW_ON_ERROR);\nforeach ($pins as $path => $expected)\
        \ {\n    if (trim((string)shell_exec('git hash-object -- ' . escapeshellarg($path)))\
        \ !== $expected) {\n        throw new RuntimeException('Pinned publication\
        \ component differs from the installed release');\n    }\n}\n$manifest = [[116719,['Bliss\
        \ Hoi An','Bliss HoiAn']],[28569,['Twin Lotus']],[32354,['Phu Quoc Eco Beach','Eco\
        \ Beach Resort']]];\n\nob_start();\nrequire getcwd() . '/config.php';\nrequire_once\
        \ getcwd() . '/services/ChannelPostRuntime.php';\nob_end_clean();\n\n$pdo\
        \ = ConversationDb::connection();\n$pdo->exec('SET SESSION TRANSACTION READ\
        \ ONLY');\n$pdo->beginTransaction();\n$result = ['installed_sha' => $installed,\
        \ 'checked_at' => gmdate(DATE_ATOM),\n    'native_hotel_ids' => array_column($manifest,\
        \ 0), 'channels' => [], 'matches' => []];\ntry {\n    $query = $pdo->prepare('SELECT\
        \ p.id, p.current_version_id, v.snapshot_json\n        FROM post_publications\
        \ p JOIN post_versions v ON v.id = p.current_version_id\n        WHERE p.post_channel_id\
        \ = ? ORDER BY p.id');\n    foreach (['telegram' => 10, 'max' => 9] as $platform\
        \ => $channel) {\n        $query->execute([$channel]);\n        $rows = $query->fetchAll(PDO::FETCH_ASSOC);\n\
        \        if (count($rows) < 1692) {\n            throw new RuntimeException('Publication\
        \ registry is below the verified baseline');\n        }\n        $result['channels'][$platform]\
        \ = count($rows);\n        foreach ($rows as $record) {\n            $post\
        \ = json_decode($record['snapshot_json'], true, 64, JSON_THROW_ON_ERROR);\n\
        \            $title = explode(\"\\n\", (string)($post['text'] ?? ''), 2)[0];\n\
        \            $metadata = $post['metadata'] ?? [];\n            $native = (int)($metadata['hotel_catalog_id']\
        \ ?? 0);\n            $result['rows'][] = ['platform'=>$platform,'publication_id'=>(int)$record['id'],'native_id'=>$native,'logical_id'=>(string)($metadata['logical_id']??''),'title'=>$title];\n\
        \            foreach ($manifest as [$id, $aliases]) {\n                $reason\
        \ = [];\n                if ($native === $id || ($metadata['logical_id'] ??\
        \ '') === \"commercial-hotel-$id-v1\") {\n                    $reason[] =\
        \ 'identity';\n                }\n                foreach ($aliases as $alias)\
        \ {\n                    if ($alias !== '' && mb_stripos($title, $alias, 0,\
        \ 'UTF-8') !== false) {\n                        $reason[] = 'title';\n  \
        \                      break;\n                    }\n                }\n\
        \                if ($reason !== []) {\n                    $result['matches'][]\
        \ = ['requested_id' => $id, 'registry_hotel_id' => $native,\n            \
        \            'platform' => $platform, 'publication_id' => (int)$record['id'],\n\
        \                        'version_id' => (int)$record['current_version_id'],\
        \ 'reason' => $reason,\n                        'title' => mb_substr($title,\
        \ 0, 180, 'UTF-8')];\n                }\n            }\n        }\n    }\n\
        } finally {\n    $pdo->rollBack();\n}\necho json_encode($result, JSON_UNESCAPED_UNICODE\
        \ | JSON_THROW_ON_ERROR), PHP_EOL;\nPHP\nphp -l pub/registry-read.php\n"
    - name: Pin established SSH host continuity and authentication identity
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport os,re\nassert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE']\
        \ or '')\nassert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or\
        \ '')\nPY\nif [[ \"$KEY_VALUE\" == *\"PRIVATE KEY\"* ]]; then\n  if [[ \"\
        $KEY_VALUE\" == *'\\n'* ]]; then printf '%b\\n' \"$KEY_VALUE\" | tr -d '\\\
        r' > \"$RUNNER_TEMP/channel_key\"; else printf '%s\\n' \"$KEY_VALUE\" | tr\
        \ -d '\\r' > \"$RUNNER_TEMP/channel_key\"; fi\nelse printf '%s' \"$KEY_VALUE\"\
        \ | base64 --decode > \"$RUNNER_TEMP/channel_key\"; fi\nchmod 600 \"$RUNNER_TEMP/channel_key\"\
        \nssh-keygen -y -f \"$RUNNER_TEMP/channel_key\" >/dev/null\npython3 - <<'PY'\n\
        import base64,hashlib,os,pathlib,subprocess\nscan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]\n\
        for s in scan.stdout.splitlines():\n    q=s.split()\n    if len(q)<3 or q[0].startswith('#'):continue\n\
        \    try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')\n\
        \    except Exception:continue\n    if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)\n\
        assert found,'HOST_PIN_MISMATCH_STOP'\npathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\\\
        n'.join(found)+'\\n')\nprint('ESTABLISHED_HOST_PIN_VERIFIED')\nPY\n"
    - name: Check both publication registries in a read-only transaction
      env:
        HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
        USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
      shell: bash
      run: 'set -euo pipefail

        options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
        -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")

        ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" ''cd /var/www/anytoour/data/www/app.anytoour.ru
        && php'' < pub/registry-read.php > pub/registry-receipt.json

        python3 -c ''import json; p=json.load(open("pub/registry-receipt.json"));
        print({"checked":len(p["native_hotel_ids"]), "registry_counts":p["channels"],
        "matches":len(p["matches"])})''

        '
    - name: Preserve exact duplicate screening
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: postw20-three-registry-read
        path: pub/registry-receipt.json
        retention-days: 30
        if-no-files-found: warn
    - name: Remove runner-only credentials
      if: always()
      run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/registry-read.php
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/commercial-wave7-native-registry-read-20261118.yml

