name: Workspace photo opening

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'manager/assets/workspace-v2-conversation.*'
      - 'services/ManagerHandoffContextService.php'
      - 'services/ManagerMessageMediaService.php'
      - 'manager/api.php'
      - 'tests/visual/workspace-handoff-media.spec.js'
      - 'tests/visual/fixtures/handoff-media.php'
      - 'tests/visual/workspace-v2-photo-viewer.spec.js'
      - 'tests/visual/workspace-v2-fixture.html'
      - '.github/workflows/workspace-photo-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  photo-opening:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Start fixture server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/photo-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test photo taps and lifecycle
        run: npx playwright test tests/visual/workspace-v2-photo-viewer.spec.js tests/visual/workspace-handoff-media.spec.js --browser=${{ matrix.browser }} --reporter=line --workers=1
      - name: Upload synthetic photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-opening-${{ matrix.browser }}-${{ github.sha }}
          path: photo-viewer-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
