name: Workspace photo opening

on:
  pull_request:
    branches: [main]
    paths:
      - 'manager/assets/workspace-v2-conversation.*'
      - 'tests/visual/workspace-v2-photo-viewer.spec.js'
      - 'tests/visual/workspace-v2-fixture.html'
      - '.github/workflows/workspace-photo-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start fixture server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/photo-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test photo taps and lifecycle
        run: npx playwright test tests/visual/workspace-v2-photo-viewer.spec.js --browser=${{ matrix.browser }} --reporter=line --workers=1
      - name: Upload synthetic photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-opening-${{ matrix.browser }}-${{ github.sha }}
          path: photo-viewer-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
