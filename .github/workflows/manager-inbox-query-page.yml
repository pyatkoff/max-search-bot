name: Manager inbox native query page

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/ManagerConversationService.php'
      - 'services/ManagerConversationAccessPolicy.php'
      - 'services/RoutingAccessService.php'
      - 'tests/mysql/manager-inbox-query-page.php'
      - '.github/workflows/manager-inbox-query-page.yml'

permissions:
  contents: read

jobs:
  native-mysql:
    name: inbox query page / native MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: inbox-page-test-only
          MYSQL_DATABASE: manager_inbox_query_page_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pinbox-page-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Retain the exact accepted production service for paired evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          baseline_sha='038888fb9f5297ce0700f20187208006e0dee2e1'
          git cat-file -e "$baseline_sha^{commit}"
          git merge-base --is-ancestor "$baseline_sha" HEAD
          baseline_file="$RUNNER_TEMP/manager-inbox-query-baseline.php"
          git show "$baseline_sha:services/ManagerConversationService.php" > "$baseline_file"
          echo "MANAGER_INBOX_QUERY_BASELINE_FILE=$baseline_file" >> "$GITHUB_ENV"
      - name: Compare canonical Mine pages and same-data native costs
        env:
          MANAGER_INBOX_QUERY_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=manager_inbox_query_page_test;charset=utf8mb4
          MANAGER_INBOX_QUERY_TEST_MYSQL_USER: root
          MANAGER_INBOX_QUERY_TEST_MYSQL_PASSWORD: inbox-page-test-only
        run: php tests/mysql/manager-inbox-query-page.php
