# One-shot read-only; reviewed admission-config pins must be populated before publication.
name: Existing bounded174 registry read-only
on:
  push:
    branches: ['audit/price660-27316-resume-readiness-20261117']
    paths: ['.github/workflows/price27316-read-next174.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Exact reviewed admission and runner before credentials
        run: |
          set -euo pipefail
          echo '9d2ba5e3fb8d316e100f2efb4baf70bb7f615f63b4da8459243f3b39ba7231a1  tools/direct_demand/operations/next174-read/admit174.py' | sha256sum --check --strict
          echo 'e1a3503db1ff016f82b75e8e269d715eecf0617e2a7cf65f30acf2977314e332  tools/direct_demand/operations/next174-read/run174.py' | sha256sum --check --strict
      - name: Lint exact23 bounded readers before credentials
        run: |
          python3 - <<'PYLINT'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('tools/direct_demand/operations/next174-read')
          intent=json.loads((root/'intent.json').read_bytes())
          assert len(intent['groups'])==23
          for group in intent['groups']:
              path=root/f"p{group['batch']:02d}"/'read.php'
              assert hashlib.sha256(path.read_bytes()).hexdigest()==group['reader_sha256']
              subprocess.run(['php','-n','-l',str(path)],check=True,timeout=30)
          PYLINT
      - name: Fresh source owner and competing-run admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/direct_demand/operations/next174-read/admit174.py tools/direct_demand/operations/next174-read "$RUNNER_TEMP/fresh-admission.json"
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Single sequential existing bounded readers; no retries
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: python3 tools/direct_demand/operations/next174-read/run174.py tools/direct_demand/operations/next174-read "$RUNNER_TEMP/private174-result" "$RUNNER_TEMP/fresh-admission.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-current174-read-${{ github.run_id }}
          path: ${{ runner.temp }}/private174-result/
          retention-days: 7
          if-no-files-found: error
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
