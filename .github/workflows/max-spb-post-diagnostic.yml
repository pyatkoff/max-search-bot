name: Read-only SPB MAX post diagnostic
on:
  push:
    branches: [test/max-spb-post-diagnostic-20261015]
    paths:
      - .github/workflows/max-spb-post-diagnostic.yml
      - tools/max_spb_post_diagnostic.php
      - tests/run_max_spb_post_diagnostic.php
permissions:
  contents: read
concurrency:
  group: max-spb-post-diagnostic-20261015
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/test/max-spb-post-diagnostic-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed diagnostic syntax and redaction
        run: |
          set -euo pipefail
          php -l tools/max_spb_post_diagnostic.php
          php tests/run_max_spb_post_diagnostic.php
      - name: Verify authoritative main before loading credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)
          test "$current" = 5c4689c885f1b867614565a20dcb1387fafcd75c
      - name: Prepare established SSH key
        env:
          DIAGNOSTIC_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/diagnostic_key"
          raw="$DIAGNOSTIC_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || exit 2
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read exact channel status without provider requests or DB writes
        env:
          DIAGNOSTIC_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DIAGNOSTIC_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$DIAGNOSTIC_USER@$DIAGNOSTIC_HOST"
          opts=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/diagnostic_key")
          remote_tmp=''
          cleanup() {
            if [[ "$remote_tmp" =~ ^/tmp/max-spb-post-diagnostic\.[A-Za-z0-9]+$ ]]; then ssh "${opts[@]}" "$remote" "rm -rf -- '$remote_tmp'" >/dev/null 2>&1 || true; fi
            rm -f "$RUNNER_TEMP/diagnostic_key"
          }
          trap cleanup EXIT
          ssh "${opts[@]}" "$remote" 'set -euo pipefail; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = 5c4689c885f1b867614565a20dcb1387fafcd75c; git diff --quiet; git diff --cached --quiet'
          remote_tmp=$(ssh "${opts[@]}" "$remote" 'umask 077; mktemp -d /tmp/max-spb-post-diagnostic.XXXXXXXX')
          [[ "$remote_tmp" =~ ^/tmp/max-spb-post-diagnostic\.[A-Za-z0-9]+$ ]] || exit 2
          scp -q "${opts[@]}" tools/max_spb_post_diagnostic.php "$remote:$remote_tmp/readback.php"
          ssh "${opts[@]}" "$remote" "php '$remote_tmp/readback.php' --expected-sha=5c4689c885f1b867614565a20dcb1387fafcd75c"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic_key"
