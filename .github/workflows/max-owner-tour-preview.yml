name: MAX owner tour preview

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'tools/max_owner_tour_preview.php'
      - 'tools/max_owner_preview_images.php'
      - 'tools/telegram_owner_tour_preview.php'
      - 'tools/owner_tour_selection_preview.php'
      - 'tools/owner_tour_card_emphasis_preview.php'
      - 'tests/run_max_owner_tour_preview_regression.php'
      - 'tests/run_telegram_owner_tour_preview_regression.php'
      - 'tests/run_owner_tour_selection_preview_regression.php'
      - 'tests/run_owner_tour_card_emphasis_preview_regression.php'
      - 'tests/run_max_owner_tour_workflow_regression.py'
      - '.github/workflows/max-owner-tour-preview.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full installed main SHA
        type: string
        required: true
      confirm_owner_send:
        description: Send one fixed demo card to the verified owner private dialogue once
        type: boolean
        required: true
        default: false
      confirm_owner_recovery:
        description: Authorize the single guarded owner recovery attempt
        type: boolean
        required: true
        default: false
      confirm_owner_comparison:
        description: Send the separately requested compact comparison card once
        type: boolean
        required: true
        default: false
      confirm_owner_variants:
        description: Send the two separately requested native caption variants once each
        type: boolean
        required: true
        default: false
      confirm_owner_telegram:
        description: Send the two requested native Telegram card formats to the verified owner once each
        type: boolean
        required: true
        default: false
      confirm_owner_trio:
        description: Send the three fixed hotel examples to both verified owner private chats once each
        type: boolean
        required: true
        default: false
      confirm_owner_emphasis:
        description: Send the fixed Imperial emoji comparison to both verified owner private chats once each
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: max-owner-tour-preview
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name != 'issue_comment' || (github.repository == 'pyatkoff/max-search-bot' && github.event.issue.number == 55 && !github.event.issue.pull_request && github.event.comment.user.login == 'pyatkoff' && github.event.comment.user.id == 226193297 && (startsWith(github.event.comment.body, '/owner-tour-preview ') || startsWith(github.event.comment.body, '/owner-tour-preview-recover ') || startsWith(github.event.comment.body, '/owner-tour-preview-compare ') || startsWith(github.event.comment.body, '/owner-tour-preview-variants ') || startsWith(github.event.comment.body, '/owner-tour-preview-telegram ') || startsWith(github.event.comment.body, '/owner-tour-preview-trio ') || startsWith(github.event.comment.body, '/owner-tour-preview-emphasis ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite
          coverage: none
      - name: Verify fixed recipient, private once receipt and bounded send
        run: php tests/run_max_owner_tour_preview_regression.php
      - name: Verify fixed Telegram owner recognition and native format receipts
        run: php tests/run_telegram_owner_tour_preview_regression.php
      - name: Verify three-hotel owner-only batch and separate channel receipts
        run: php tests/run_owner_tour_selection_preview_regression.php
      - name: Verify fixed owner emphasis comparison and separate once receipts
        run: php tests/run_owner_tour_card_emphasis_preview_regression.php
      - name: Verify fixed manual workflow command and stop gates
        run: python3 tests/run_max_owner_tour_workflow_regression.py

  owner-send:
    if: github.repository == 'pyatkoff/max-search-bot' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && (inputs.confirm_owner_send == true || inputs.confirm_owner_recovery == true || inputs.confirm_owner_comparison == true || inputs.confirm_owner_variants == true || inputs.confirm_owner_telegram == true || inputs.confirm_owner_trio == true || inputs.confirm_owner_emphasis == true)) || (github.event_name == 'issue_comment' && github.event.issue.number == 55 && !github.event.issue.pull_request && github.event.comment.user.login == 'pyatkoff' && github.event.comment.user.id == 226193297 && (startsWith(github.event.comment.body, '/owner-tour-preview ') || startsWith(github.event.comment.body, '/owner-tour-preview-recover ') || startsWith(github.event.comment.body, '/owner-tour-preview-compare ') || startsWith(github.event.comment.body, '/owner-tour-preview-variants ') || startsWith(github.event.comment.body, '/owner-tour-preview-telegram ') || startsWith(github.event.comment.body, '/owner-tour-preview-trio ') || startsWith(github.event.comment.body, '/owner-tour-preview-emphasis '))))
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact installed main SHA before loading credentials
        id: authorize
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_OWNER_SEND: ${{ inputs.confirm_owner_send }}
          CONFIRM_OWNER_RECOVERY: ${{ inputs.confirm_owner_recovery }}
          CONFIRM_OWNER_COMPARISON: ${{ inputs.confirm_owner_comparison }}
          CONFIRM_OWNER_VARIANTS: ${{ inputs.confirm_owner_variants }}
          CONFIRM_OWNER_TELEGRAM: ${{ inputs.confirm_owner_telegram }}
          CONFIRM_OWNER_TRIO: ${{ inputs.confirm_owner_trio }}
          CONFIRM_OWNER_EMPHASIS: ${{ inputs.confirm_owner_emphasis }}
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          repository = 'pyatkoff/max-search-bot'
          owner = {'login': 'pyatkoff', 'id': 226193297}
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          if (os.environ.get('GITHUB_REPOSITORY') != repository
                  or event.get('repository', {}).get('full_name') != repository
                  or event.get('repository', {}).get('default_branch') != 'main'
                  or os.environ.get('GITHUB_REF') != 'refs/heads/main'
                  or os.environ.get('GITHUB_WORKFLOW_REF') != repository + '/.github/workflows/max-owner-tour-preview.yml@refs/heads/main'):
              raise SystemExit(2)
          if os.environ.get('GITHUB_EVENT_NAME') == 'issue_comment':
              issue, comment = event.get('issue', {}), event.get('comment', {})
              if (event.get('action') != 'created' or issue.get('number') != 55 or 'pull_request' in issue
                      or any(comment.get('user', {}).get(key) != value for key, value in owner.items())
                      or any(event.get('sender', {}).get(key) != value for key, value in owner.items())
                      or os.environ.get('GITHUB_ACTOR') != owner['login']
                      or os.environ.get('GITHUB_ACTOR_ID') != str(owner['id'])):
                  raise SystemExit(2)
              command = re.fullmatch(r'/owner-tour-preview(-recover|-compare|-variants|-telegram|-trio|-emphasis)? ([0-9a-f]{40})', comment.get('body', ''))
              if command is None:
                  raise SystemExit(2)
              expected = command.group(2)
              mode = {'-recover': 'recover', '-compare': 'compare', '-variants': 'variants', '-telegram': 'telegram', '-trio': 'trio', '-emphasis': 'emphasis', None: 'send'}[command.group(1)]
          elif os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              send = os.environ.get('CONFIRM_OWNER_SEND') == 'true'
              recover = os.environ.get('CONFIRM_OWNER_RECOVERY') == 'true'
              compare = os.environ.get('CONFIRM_OWNER_COMPARISON') == 'true'
              variants = os.environ.get('CONFIRM_OWNER_VARIANTS') == 'true'
              telegram = os.environ.get('CONFIRM_OWNER_TELEGRAM') == 'true'
              trio = os.environ.get('CONFIRM_OWNER_TRIO') == 'true'
              emphasis = os.environ.get('CONFIRM_OWNER_EMPHASIS') == 'true'
              if sum([send, recover, compare, variants, telegram, trio, emphasis]) != 1:
                  raise SystemExit(2)
              expected = os.environ.get('EXPECTED_SHA', '')
              mode = 'emphasis' if emphasis else ('trio' if trio else ('telegram' if telegram else ('variants' if variants else ('compare' if compare else ('recover' if recover else 'send')))))
          else:
              raise SystemExit(2)
          if mode in ['recover', 'compare', 'variants', 'telegram', 'trio', 'emphasis'] and (os.environ.get('GITHUB_ACTOR') != owner['login'] or os.environ.get('GITHUB_ACTOR_ID') != str(owner['id'])):
              raise SystemExit(2)
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or expected != os.environ.get('GITHUB_SHA'):
              raise SystemExit(2)
          # Independently refresh current main before deployment credentials exist.
          try:
              token = os.environ.get('REPOSITORY_READ_TOKEN', '')
              if not token:
                  raise SystemExit(2)
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              request = urllib.request.Request('https://api.github.com/repos/pyatkoff/max-search-bot/git/ref/heads/main',
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=15) as response:
                  raw = response.read(65537)
                  if response.status != 200 or len(raw) > 65536:
                      raise SystemExit(2)
                  head = json.loads(raw)
          except Exception:
              raise SystemExit(2)
          if head.get('ref') != 'refs/heads/main' or head.get('object', {}).get('type') != 'commit' or head.get('object', {}).get('sha') != expected:
              raise SystemExit(2)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('expected_sha=' + expected + '\nowner_mode=' + mode + '\n')
          PY

      - name: Prepare existing deployment SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo 'Invalid deployment SSH key'; exit 2; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Run one fixed owner demo send with redacted output
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.authorize.outputs.expected_sha }}
          OWNER_MODE: ${{ steps.authorize.outputs.owner_mode }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$OWNER_MODE" == send || "$OWNER_MODE" == recover || "$OWNER_MODE" == compare || "$OWNER_MODE" == variants || "$OWNER_MODE" == telegram || "$OWNER_MODE" == trio || "$OWNER_MODE" == emphasis ]] || exit 2
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$EXPECTED_SHA" "$OWNER_MODE" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          owner_mode="$2"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$expected_sha"
          git diff --quiet
          git diff --cached --quiet
          case "$owner_mode" in
            send) php tools/max_owner_tour_preview.php --expected-sha="$expected_sha" --confirm-owner-send ;;
            recover) php tools/max_owner_tour_preview.php --expected-sha="$expected_sha" --confirm-owner-recovery ;;
            compare) php tools/max_owner_tour_preview.php --expected-sha="$expected_sha" --confirm-owner-comparison ;;
            variants) php tools/max_owner_tour_preview.php --expected-sha="$expected_sha" --confirm-owner-variants ;;
            telegram) php tools/telegram_owner_tour_preview.php --expected-sha="$expected_sha" --confirm-owner-telegram ;;
            trio) php tools/owner_tour_selection_preview.php --expected-sha="$expected_sha" --confirm-owner-trio ;;
            emphasis) php tools/owner_tour_card_emphasis_preview.php --expected-sha="$expected_sha" --confirm-owner-emphasis ;;
            *) exit 2 ;;
          esac
          REMOTE

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deploy_key"
