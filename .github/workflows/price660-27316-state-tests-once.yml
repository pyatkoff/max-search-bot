name: PRICE27316 source-only terminal-and-telegram tests
on:
  push:
    branches: ['audit/price660-27316-resume-readiness-20261117']
    paths: ['.github/workflows/price660-27316-state-tests-once.yml']
permissions:
  contents: read
jobs:
  isolated-php-pure:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event_name == 'push' &&
      github.event.before == 'ca56799b540b3136bbd6bcbe9c629fa234a77c5f' &&
      github.event.head_commit.message == 'test(price660): validate pure cycle and TG entity projections once' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Run pure recovery readiness, interrupted cycle and Telegram link selftests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ca56799b540b3136bbd6bcbe9c629fa234a77c5f
          p=tools/direct_demand/operations
          for name in price660-27316-resume-readiness-source-only.php price660-27316-interrupted-cycle-pure.php price660-27316-telegram-entity-pure.php; do
            php -l "$p/$name"
            php "$p/$name" --self-test
            if grep -Ein 'file_put_contents|fopen|flock|curl_|PDO|MaxTransport::request|--apply|workflow_dispatch|supplier_call\(' "$p/$name"; then
              echo 'SIDE_EFFECT_SURFACE_PRESENT' >&2; exit 2
            fi
          done
          echo 'PRICE27316_THREE_PURE_SOURCE_TESTS_PASSED'
