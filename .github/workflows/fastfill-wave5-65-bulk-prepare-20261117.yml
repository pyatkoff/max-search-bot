              if hid in matched:rec['reason']='existing_native_or_alias_publication';return rec,None
              if r['editorial_hold']:rec['reason']=r['editorial_hold'];return rec,None
              try:
                  data=json.loads(get(r['source_api_url']))
                  found=[]
                  def walk(v):
                      if isinstance(v,dict):
                          if v.get('id')==hid:found.append(v)
                          for x in v.values():walk(x)
