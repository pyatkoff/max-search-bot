              for i,record in enumerate(periods):
                  if not isinstance(record,dict) or set(record)!={"period_days","available","reason","metric_conservation","view_accepts","has_inquiries","has_valid_pairs","elapsed_ms","slowest_query"}:raise ValueError()
                  if type(record["period_days"]) is not int or type(record["available"]) is not bool or not timing(record["elapsed_ms"]) or not query(record["slowest_query"]):raise ValueError()
                  if any(record[k] is not None and type(record[k]) is not bool for k in ["metric_conservation","view_accepts","has_inquiries","has_valid_pairs"]):raise ValueError()
                  if record["reason"] not in {None,"record_limit","time_limit","byte_limit","source_shape_limit","source_changed","storage_unavailable","outer_transaction"}:raise ValueError()
                  if record["available"] and record["reason"] is not None:raise ValueError()
                  if not record["available"] and (record["reason"] is None or any(record[k] is not None for k in ["metric_conservation","view_accepts","has_inquiries","has_valid_pairs"])):raise ValueError()
                  if i<len(periods)-1 and (not record["available"] or record["metric_conservation"] is not True or record["view_accepts"] is not True):raise ValueError()
              if value["installed_passed"] and (not value["ok"] or len(periods)!=3 or any(not x["available"] or x["metric_conservation"] is not True or x["view_accepts"] is not True for x in periods)):raise ValueError()
              if value["ok"] and (value["reason"] is not None or not all(value["checks"].values()) or not periods):raise ValueError()
              if not value["ok"] and value["reason"] not in reasons:raise ValueError()
              value["checks"].update(installed_reader_source_verified=True,diagnostic_syntax_valid=True,installed_source_before_after=True)
              out=value
          except Exception:
              pass
          encoded=json.dumps(out,sort_keys=True,separators=(",",":"))
          if len(encoded.encode("utf-8"))>4096:raise SystemExit("technical_report_limit")
          print(encoded)
          raise SystemExit(0 if out["ok"] and out["installed_passed"] else 1)
          
          ACQUISITION_INSTALLED_ACCEPTANCE

      - name: Remove ephemeral SSH credential and host continuity file
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/modeled-acquisition-installed-acceptance-key" "$RUNNER_TEMP/modeled-acquisition-installed-acceptance-hosts"
