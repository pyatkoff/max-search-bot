name: W17 fresh cached intake and original cover preparation, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/fastfill-wave4-100-catalogue-20261117.yml
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
      && github.event.before == '1d30490e43de3b57c1202808b869493de28b58ea' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0
        requests==2.32.5
    - name: Prepare preserved licensed sources only
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/direct_demand/operations/prepare-wave17-intake-20261118.py
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave17-source-intake-preview
        path: 'wave17/*.jpg

          wave17/receipt.json

          wave17/profiles.json'
        retention-days: 30
        if-no-files-found: warn
