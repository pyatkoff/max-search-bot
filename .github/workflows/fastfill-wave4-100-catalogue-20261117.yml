name: W19 fresh cached intake and original cover preparation, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/fastfill-wave4-100-catalogue-20261117.yml
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'ad34e1f1719cc0a09ca9c4502b7db6a23d37db57'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 requests==2.32.5
    - name: Prepare preserved licensed sources only
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'echo ''d93e4fe97586d70d0857fcd8a2388753acf4bd29415329029bf2e0dea5fcdac9  tools/direct_demand/operations/prepare-wave19-intake-20261118.py''
        | sha256sum -c -

        echo ''13b990f007cb1d676761b99eae7bdec46a552459c4bd8f0628df9067d314e078  tools/direct_demand/operations/wave19-prior-classified.json''
        | sha256sum -c -

        python3 tools/direct_demand/operations/prepare-wave19-intake-20261118.py'
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave19-source-intake-preview
        path: 'wave19/*.jpg

          wave19/receipt.json

          wave19/profiles.json'
        retention-days: 30
        if-no-files-found: warn
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
