name: W20 fresh cached intake and original cover preparation, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/fastfill-wave4-100-catalogue-20261117.yml
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '08eca15041a65b359257e33f38e54ba5faa68209'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 requests==2.32.5
    - name: Prepare preserved licensed sources only
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'echo ''0e25a5039e3fa9a93a9100cd2214b0ed9645da9971aa09e5fd0bd9cc481572dc  tools/direct_demand/operations/prepare-wave20-intake-20261118.py''
        | sha256sum -c -

        echo ''1cbdbd4a25a5ec262be517b8bcd6943667b5928c014a6d513ea3ead429cb45f6  tools/direct_demand/operations/wave20-prior-classified.json''
        | sha256sum -c -

        python3 tools/direct_demand/operations/prepare-wave20-intake-20261118.py'
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave20-source-intake-preview
        path: 'wave20/*.jpg

          wave20/receipt.json

          wave20/profiles.json'
        retention-days: 30
        if-no-files-found: warn
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
