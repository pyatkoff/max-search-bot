name: Accept three post-W20 source-bound hotel rows; zero sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/verify-wave7-publisher-input-20261118.yml
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
      && github.event.before == '96f827fda086f3c6c03db9318f06a3fcb6f33f10' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - name: Validate three accepted rows with original compiler and current release
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 tools/direct_demand/operations/postw20-accept-ten-20261119.py

        for f in accepted-source/*-publisher-unexecuted.php; do php -l "$f"; done

        '
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: postw20-three-accepted-source
        path: accepted-source/
        retention-days: 30
        if-no-files-found: warn
