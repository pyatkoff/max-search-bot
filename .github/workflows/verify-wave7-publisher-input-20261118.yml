name: Accept W17 reviewed hotel source inputs, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/verify-wave7-publisher-input-20261118.yml
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'dad95ec5e65ac9cf1b73cf703db150cb28adf60c'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - name: Bind W17 exact photos, editorial and original compiler
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        echo ''55a8d829f9f8111591da06221fc293338a09e612936c6a947a719bf638456878  tools/direct_demand/operations/accept-wave17-source-20261118.py''
        | sha256sum -c -

        echo ''f78b2cab7a11f7417a2fcd75c916628898116c982cbdf43df5b68e19d74bbbdf  tools/direct_demand/operations/wave17-acceptance.json''
        | sha256sum -c -

        python3 tools/direct_demand/operations/accept-wave17-source-20261118.py

        for f in accepted-source/*-publisher-unexecuted.php; do php -l "$f"; done'
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave17-accepted-source
        path: accepted-source/
        retention-days: 30
        if-no-files-found: warn
