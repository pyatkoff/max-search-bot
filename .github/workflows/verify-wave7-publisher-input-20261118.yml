name: Accept W16 reviewed hotel source inputs, no sends
'on':
  push:
    branches:
    - audit/content100-bot-publication-20261101
    paths:
    - .github/workflows/verify-wave7-publisher-input-20261118.yml
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '12c0ab12531fd0f110246b21e92cbbb91f035419'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        sparse-checkout: 'tools/direct_demand/operations

          .github/traffic-publish/brand'
    - name: Bind W16 exact photos, editorial and original compiler
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        echo ''bc9ee9d7048af0d7687648e309c347865fe47cb06c521420aff9919946535c79  tools/direct_demand/operations/accept-wave16-source-20261118.py''
        | sha256sum -c -

        echo ''59eec7d9a1f8438b33c6c8d314fc6dd048fa159c389e62174670b324a25d9e95  tools/direct_demand/operations/wave16-acceptance.json''
        | sha256sum -c -

        python3 tools/direct_demand/operations/accept-wave16-source-20261118.py

        for f in accepted-source/*-publisher-unexecuted.php; do php -l "$f"; done'
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wave16-accepted-source
        path: accepted-source/
        retention-days: 30
        if-no-files-found: warn
