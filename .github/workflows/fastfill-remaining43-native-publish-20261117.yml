name: One-shot FASTFILL 43 paired hotels in five original bounded operations
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-remaining43-native-publish-20261117.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-five-sequential-once:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'a79df675feee45fbf55a7b4df2e7d4eefeb34e46' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Authenticate all accepted source bytes for five fixed bounded operations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^)" = a79df675feee45fbf55a7b4df2e7d4eefeb34e46
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zipfile
          APP='fd9b28dab2147f13f3b0d0f7f856b14392b141d2';MAIN='970e1bab10e44b2ab8148e609840be8630f5d5db'
          EXPECTED=json.loads(r'''{"p9-manifest.json":"6492b45d30af5c357c2031699c52982372173188df54cec13baf69a631f3ec81","p9-approval.json":"6dbde23c7413b4d5ea0605850720d49ec816af5e060df18cef17d1b8281afbd6","p9-publisher-unexecuted.php":"6b26b8fec399bcebe23fe86d3a3a9af36c5fe93a13ff81020b8bdd105f8396a6","p10-manifest.json":"9d21984a97313fba2bfbf4b486d6b99a0118875e5ec8aa3fb29da74e4d49547b","p10-approval.json":"be7d0d5e76c5fd1a461ea99aa759656a81a4af0ff4f65c6ba922aa598d39f4b5","p10-publisher-unexecuted.php":"ec9205632b3b62a6283256be0a84211b8757c48e864dc2ff5f63318524a2862a","p11-manifest.json":"f1f040fe6ed1ee6903be05661aca5231ac7269ea10099ec4230811892d4b0ac6","p11-approval.json":"2998224929f45b01310b4db583c8c4802cd216fc7e4c770c0f90b68e8f2d04db","p11-publisher-unexecuted.php":"5ab5212272ab1a7751efa28fc16e9d5a38b856d3788f627e5253a48125a5cd14","p12-manifest.json":"b470702e273cbe98b2276a8c11cc2ad2a39e26f32533b56d0edf3b7369a9699a","p12-approval.json":"71f529ca04a0c12ac5975861be974911647324a308ba53e109aed2770359d8aa","p12-publisher-unexecuted.php":"7d94838cc437a189101a9a8a46eb9d9a2e26c34dcc6467725d8d6d0a222ffc2e","p13-manifest.json":"5e00afde2147efacbaffe6af78dd5dae083448da050f1ec58a97025226644d4f","p13-approval.json":"5e0c630718662ca349881c075582b0130f1e6145ac4172df7c516f565900ff51","p13-publisher-unexecuted.php":"00fafca80ddc3a28ed0a9164cf2665c4ec596e6de7dd6bc69a709b98d2e3ebf1","provider-facts.json":"09fb147d54418dc17086feb28c5e072e867e11754c991997178737c3309d8cab","cover-receipt-original.json":"3fb425dc0dca348b61c7549b32f8bebfd4c39abd543a1585e912ad144a1ecf87","runtime-readonly.txt":"6033ec39b3254c37e93fe336948cade59a0e0ef1f96936f1b2847530843b567b"}''')
          BATCHES=json.loads(r'''[{"batch":9,"operation":"commercial-hotel-batch-20261117-9-v1","ids":[1028,1071,1149,1563,28460,112391,127009,17603,17682,66450],"rows":10,"publisher_sha256":"6b26b8fec399bcebe23fe86d3a3a9af36c5fe93a13ff81020b8bdd105f8396a6"},{"batch":10,"operation":"commercial-hotel-batch-20261117-10-v1","ids":[37470,99608,102321,37165,72910,82106,103273,1980,266,159],"rows":10,"publisher_sha256":"ec9205632b3b62a6283256be0a84211b8757c48e864dc2ff5f63318524a2862a"},{"batch":11,"operation":"commercial-hotel-batch-20261117-11-v1","ids":[344,125550,143790,76208,104626,2554,65170,80397,82023,2549],"rows":10,"publisher_sha256":"5ab5212272ab1a7751efa28fc16e9d5a38b856d3788f627e5253a48125a5cd14"},{"batch":12,"operation":"commercial-hotel-batch-20261117-12-v1","ids":[2553,8917,8999,56236,110597,2519,2591,2936,8945,13837],"rows":10,"publisher_sha256":"7d94838cc437a189101a9a8a46eb9d9a2e26c34dcc6467725d8d6d0a222ffc2e"},{"batch":13,"operation":"commercial-hotel-batch-20261117-13-v1","ids":[80431,78845,8918],"rows":3,"publisher_sha256":"00fafca80ddc3a28ed0a9164cf2665c4ec596e6de7dd6bc69a709b98d2e3ebf1"}]''')
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+p],timeout=60))
          assert api('git/ref/heads/main')['object']['sha']==MAIN
          r=api('actions/runs/44102583498');assert r['conclusion']=='success' and r['run_attempt']==1 and r['head_sha']=='a79df675feee45fbf55a7b4df2e7d4eefeb34e46'
          old=api('actions/runs/44079440323');assert old['conclusion']=='success' and old['run_attempt']==1 and old['head_sha']==APP
          a=api('actions/artifacts/14335554086')
          assert not a['expired'] and a['workflow_run']['id']==44102583498 and a['digest']=='sha256:185894b479717b3265aec094fa7790d70b9135a3c972069387403110f9ca44e4'
          raw=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14335554086/zip'],timeout=90)
          assert hashlib.sha256(raw).hexdigest()=='185894b479717b3265aec094fa7790d70b9135a3c972069387403110f9ca44e4'
          p=pathlib.Path('pub');p.mkdir()
          (p/'source.zip').write_bytes(raw)
          with zipfile.ZipFile(p/'source.zip') as z:
              assert z.testzip() is None and set(z.namelist())==set(EXPECTED)|{'receipt.json'}
              blobs={n:z.read(n) for n in EXPECTED};rec=json.loads(z.read('receipt.json'))
          assert rec['state']=='FORTY_THREE_EDITORIAL_ACCEPTED_EXISTING_PUBLISHER_SOURCE_ONLY'
