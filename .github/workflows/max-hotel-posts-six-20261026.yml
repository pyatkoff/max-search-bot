name: Publish approved six hotel posts to MAX
on:
  push:
    branches: [audit/max-hotel-posts-six-20261026]
    paths: [.github/workflows/max-hotel-posts-six-20261026.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-hotel-posts-six-20261026
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: 90e29306298b6ad8ebccb0a1edfc37e5c9fa41da
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/max-hotel-posts-six-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current released production source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          conclusion=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$conclusion" = success
      - name: Prepare exact approved six-post payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,base64,os,hashlib,pathlib,gzip
          folder=pathlib.Path('.github/traffic-publish/hotel-six-20261026')
          raw=(folder/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='313734ad01954fdc3590f31e0a20c70f0fd5a18233b07f75027d5458999a1423'
          payload=json.loads(raw);assert payload['row_count']==6
          assert [r['key']for r in payload['rows']]==['golf','sultan','rixos','rehana','solara','palace']
          for row in payload['rows']:
            raw=(folder/row['cover_file']).read_bytes()
            assert raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw)==row['cover_bytes']
            assert hashlib.sha256(raw).hexdigest()==row['cover_sha256']
            assert hashlib.sha256(row['text'].encode()).hexdigest()==row['text_sha256']
            assert len(row['text'].encode('utf-16-le'))//2<=1024 and row['source_canva_committed']is True
            row['cover_png_base64']=base64.b64encode(raw).decode()
          encoded=base64.b64encode(gzip.compress(json.dumps(payload,separators=(',',':')).encode(),mtime=0)).decode()
          script=pathlib.Path('tools/direct_demand/operations/publish-hotel-posts-six.php').read_text()
          assert script.startswith('<?php\ndeclare(strict_types=1);\n')
          assert hashlib.sha256(script.encode()).hexdigest()=='20959584dc14b210751a7858024e1de6dbcd1a71f2d7e952bb740f98fad0fa84'
          for mode in ['preview','apply']:
            header="<?php\ndeclare(strict_types=1);\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst OP_MODE='"+mode+"';\nconst ROWS_GZIP_BASE64='"+encoded+"';\n"
            pathlib.Path(os.environ['RUNNER_TEMP']+'/channel-'+mode+'.php').write_text(header+script.split('<?php\ndeclare(strict_types=1);\n',1)[1])
          PY
          php -l "$RUNNER_TEMP/channel-preview.php"
          php -l "$RUNNER_TEMP/channel-apply.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Pin existing server host-key continuity
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          matches=[]
          for line in scan.stdout.splitlines():
            fields=line.split()
            if len(fields)<3 or fields[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Preview the exact six approved posts without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preview.php" > "$RUNNER_TEMP/channel-preview.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-preview.json')as f:d=json.load(f)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          assert d['operation']=='channel-hotel-six-20261026-v1' and d['mode']=='preview' and d['target']=='https://max.ru/channel_anytour'
          assert d['ok']is True and d['post_write_attempts']<=6 and d['upload_attempts']<=6
          assert d['post_write_attempts']==0 and d['upload_attempts']==0 and len(d['ready_rows'])==6
          PY
          test "${probe_status:-0}" = 0
      - name: Publish the approved six and verify individual canonical buttons
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-apply.php" > "$RUNNER_TEMP/channel-apply.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-apply.json')as f:d=json.load(f)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          assert d['operation']=='channel-hotel-six-20261026-v1' and d['mode']=='apply' and d['target']=='https://max.ru/channel_anytour'
          assert d['ok']is True and d['post_write_attempts']<=6 and d['upload_attempts']<=6
          assert len(d['posts'])==6 and all(p['body_photo_button_verified']and p['canonical_token_resolved']for p in d['posts'])
          PY
          test "${probe_status:-0}" = 0
      - name: Retain bounded public-post receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-hotel-six-publication-receipts
          path: |
            ${{ runner.temp }}/channel-preview.json
            ${{ runner.temp }}/channel-apply.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preview.php" "$RUNNER_TEMP/channel-preview.json" "$RUNNER_TEMP/channel-apply.php" "$RUNNER_TEMP/channel-apply.json"

# Six owner-approved single-hotel posts; no old operation or unknown-create retry.

