    paths: ['.github/workflows/fastfill-wave3-72-native-publish-20261117.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  publish-eight-sequential-once:
