name: Native MySQL PR1746 ordinary release admission
on:
  push:
    branches: [ops/admit-native-mysql-1746-20261126]
    paths: ['.github/workflows/mysql-pr1746-release-admission.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  admission:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == '1e9a88c7418f8e1af171571ef1df66f2856968e4' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e9a88c7418f8e1af171571ef1df66f2856968e4
          persist-credentials: false
      - name: Fresh ordinary release admission for PR1746
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1746 a02920f34e3126da621e7b06133e96a5f86c27e7 1e9a88c7418f8e1af171571ef1df66f2856968e4
