name: Read AppleService39 conversion readiness
run-name: Read effective AppleService39 model and conversion queue

on:
  push:
    branches: [audit/appleservice39-conversion-preflight-20261116]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: appleservice39-content
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_REPOSITORY_SHA: f7672e01b2be618fb16138debe653bcef742da15
      EXPECTED_APPLICATION_SHA: f7672e01b2be618fb16138debe653bcef742da15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,pdo_mysql,pdo_sqlite,sodium
          coverage: none
      - name: Check finite read-only source and regression
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = pyatkoff/max-search-bot
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/appleservice39-conversion-preflight-20261116
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_REPOSITORY_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = "$(printf '%s\n' .github/workflows/setup-appleservice39-connection.yml tests/run_appleservice39_conversion_preflight.php tools/appleservice39_conversion_preflight.php)"
          php -l tools/appleservice39_conversion_preflight.php
          php -l tests/run_appleservice39_conversion_preflight.php
          php tests/run_appleservice39_conversion_preflight.php
      - name: Verify accepted installed source before loading credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const d=require('./tools/deployment_release.js');
          (async()=>{
            const event=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            d.requireValue(event.created===true&&event.deleted===false&&event.forced===false&&event.before==='0'.repeat(40)&&event.after===process.env.GITHUB_SHA,'untrusted_readonly_creation');
            const api=d.makeReadApi(process.env.GITHUB_TOKEN),base=d.API_ROOT;
            const ref=await api('GET',base+'/git/ref/heads/main');
            d.requireValue(ref.object.sha===process.env.EXPECTED_REPOSITORY_SHA,'current_main_changed');
            const own=await api('GET',base+'/actions/runs/'+process.env.GITHUB_RUN_ID);
            d.requireValue(own.event==='push'&&own.run_attempt===1&&own.head_sha===process.env.GITHUB_SHA&&own.head_branch==='audit/appleservice39-conversion-preflight-20261116'&&own.head_repository.full_name===d.REPOSITORY,'untrusted_readonly_run');
            const location=await d.readRecord(api),receipt=d.installationReceipt(location.record);
            d.requireValue(receipt.sha===process.env.EXPECTED_APPLICATION_SHA&&receipt.run_id==='43907714855'&&receipt.install_attempt===1,'actual_application_changed');
            const proof=await d.deploymentProof(api,receipt);
            d.requireValue(proof.run.id===Number('43907714855')&&proof.attempt===1&&proof.run.conclusion==='success','actual_installation_checks_unconfirmed');
            const {release:r}=d.validateRelease(location.record);
            d.requireValue(r.kind==='installed'&&r.application_sha===receipt.sha&&r.repository_sha===ref.object.sha&&r.closure.binding.comment_id===Number('6682640708')&&r.closure.binding.pr===Number('1569')&&r.closure.binding.head_sha==='1ff5c919bd16eab11274d2a5c72828f81b2e9930'&&r.closure.run_id==='43910390329'&&r.closure.run_attempt===1&&r.closure.job==='release-slot','wrong_readonly_installation_binding');
            await d.authenticatePublication(api,location,{closed:true});
            await d.requireOps(api,receipt.sha);
            console.log(JSON.stringify({ok:true,scope:'appleservice39_conversion_preflight',actual_application_sha:receipt.sha,installation_run:receipt.run_id,actual_checks:'success',writes:0}));
          })().catch(e=>{console.error(e.code||e.message);process.exit(1)});
          JS
      - name: Read scoped settings and queue using the existing server connection
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          pin='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0'
          os.umask(0o077)
          try:
              host,user=os.environ['SSH_HOST'],os.environ['SSH_USER']
              expected=os.environ['EXPECTED_APPLICATION_SHA']
              assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
              assert re.fullmatch(r'[A-Za-z0-9_-]+',user) and re.fullmatch(r'[a-f0-9]{40}',expected)
              with tempfile.TemporaryDirectory(prefix='apple-conversion-read-',dir=os.environ['RUNNER_TEMP']) as temp:
                  work=Path(temp)
                  raw=os.environ['SSH_KEY'].replace('\r','')
                  raw=raw.replace('\\n','\n') if 'PRIVATE KEY' in raw else base64.b64decode(raw,validate=True).decode()
                  key=work/'key';key.write_text(raw.rstrip()+'\n');key.chmod(0o600)
                  os.environ.pop('SSH_KEY',None);raw=''
                  scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
                  matches=[]
                  for line in scan.stdout.splitlines():
                      fields=line.split()
                      if len(fields)<3 or fields[0].startswith('#'):continue
                      try: fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2],validate=True)).digest()).decode().rstrip('=')
                      except Exception:continue
                      if fingerprint==pin:matches.append(line)
                  if not matches:raise RuntimeError('host_continuity_pin_mismatch')
                  known=work/'known_hosts';known.write_text('\n'.join(matches)+'\n')
                  source=Path('tools/appleservice39_conversion_preflight.php').read_bytes()
                  options=['-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(known),'-o','GlobalKnownHostsFile=/dev/null','-o','ConnectTimeout=10','-o','ServerAliveInterval=10','-o','ServerAliveCountMax=2']
                  result=subprocess.run(['ssh',*options,user+'@'+host,'php -d display_errors=0 -d log_errors=0 /dev/stdin '+expected],input=source,capture_output=True,timeout=80)
                  if len(result.stdout)>16384:raise RuntimeError('report_size_bound')
                  report=json.loads(result.stdout)
                  assert report.get('scope')=='appleservice39_conversion_preflight'
                  assert report.get('schema_version')==1
                  assert all(report.get(k)==0 for k in ('database_writes','provider_reads','provider_mutations','conversion_requests','customer_messages'))
                  if report.get('ok') is True:
                      assert report.get('application_sha')==expected
                      settings=report.get('settings')
                      assert isinstance(settings,dict)
                      assert settings.get('mode') in ('off','collect','send')
                      assert settings.get('fixed_scope_matches') is True
                  else:
                      assert isinstance(report.get('reason'),str)
                  print(json.dumps(report,ensure_ascii=False,separators=(',',':')))
                  if result.returncode:raise RuntimeError('remote_read_refused')
          except Exception as error:
              safe={'host_continuity_pin_mismatch','report_size_bound','remote_read_refused'}
              print(json.dumps({'ok':False,'reason':str(error) if str(error) in safe else 'bounded_read_transport_failed','database_writes':0,'provider_reads':0,'provider_mutations':0,'conversion_requests':0,'customer_messages':0}))
              raise SystemExit(1)
          PY
