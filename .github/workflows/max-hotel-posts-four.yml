name: Publish approved four hotel posts to MAX
on:
  push:
    branches: [audit/max-hotel-posts-four-20261026]
    paths: [.github/workflows/max-hotel-posts-four.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-hotel-posts-four-20261026
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: aed4d04ad3fdd6c06f5ce3d8fc9ac3ae57d56bfa
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/max-hotel-posts-four-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current released production source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          conclusion=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$conclusion" = success
      - name: Prepare exact approved four-post payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,base64,os,hashlib,pathlib,gzip
          folder=pathlib.Path('.github/traffic-publish/hotel-four-20261026')
          raw=(folder/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c7b27ff152aca36ec75fb3cf31e21d1ebdc5da190b9e08c7ae0ee8bc999872b3'
          payload=json.loads(raw);assert payload['row_count']==4
          assert [r['key']for r in payload['rows']]==['remal_beach','remal_resort','rewaya_inn','v_hotel']
          for row in payload['rows']:
            raw=(folder/row['cover_file']).read_bytes()
            assert raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw)==row['cover_bytes']
            assert hashlib.sha256(raw).hexdigest()==row['cover_sha256']
            assert hashlib.sha256(row['text'].encode()).hexdigest()==row['text_sha256']
            assert len(row['text'].encode('utf-16-le'))//2<=1024 and row['source_canva_committed']is True
            row['cover_png_base64']=base64.b64encode(raw).decode()
          encoded=base64.b64encode(gzip.compress(json.dumps(payload,separators=(',',':')).encode(),mtime=0)).decode()
          script=pathlib.Path('tools/direct_demand/operations/publish-hotel-posts-four.php').read_text()
          assert script.startswith('<?php\ndeclare(strict_types=1);\n')
          for mode in ['preview','apply']:
            header="<?php\ndeclare(strict_types=1);\nconst EXPECTED_INSTALLED_SHA='"+os.environ['EXPECTED_PRODUCTION_SHA']+"';\nconst OP_MODE='"+mode+"';\nconst ROWS_GZIP_BASE64='"+encoded+"';\n"
            pathlib.Path(os.environ['RUNNER_TEMP']+'/channel-'+mode+'.php').write_text(header+script.split('<?php\ndeclare(strict_types=1);\n',1)[1])
          PY
          php -l "$RUNNER_TEMP/channel-preview.php"
          php -l "$RUNNER_TEMP/channel-apply.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Preview the exact four approved posts without writes
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-preview.php" > "$RUNNER_TEMP/channel-preview.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-preview.json')as f:d=json.load(f)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          assert d['operation']=='channel-hotel-four-20261026-v1' and d['mode']=='preview' and d['target']=='https://max.ru/channel_anytour'
          assert d['ok']is True and d['post_write_attempts']<=4 and d['upload_attempts']<=4
          assert d['post_write_attempts']==0 and d['upload_attempts']==0 and len(d['ready_rows'])==4
          PY
          test "${probe_status:-0}" = 0
      - name: Publish the approved four and verify individual canonical buttons
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-apply.php" > "$RUNNER_TEMP/channel-apply.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-apply.json')as f:d=json.load(f)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          assert d['operation']=='channel-hotel-four-20261026-v1' and d['mode']=='apply' and d['target']=='https://max.ru/channel_anytour'
          assert d['ok']is True and d['post_write_attempts']<=4 and d['upload_attempts']<=4
          assert len(d['posts'])==4 and all(p['body_photo_button_verified']and p['canonical_token_resolved']for p in d['posts'])
          PY
          test "${probe_status:-0}" = 0
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-preview.php" "$RUNNER_TEMP/channel-preview.json" "$RUNNER_TEMP/channel-apply.php" "$RUNNER_TEMP/channel-apply.json"

# Four owner-approved single-hotel posts; no old operation or unknown-create retry.
