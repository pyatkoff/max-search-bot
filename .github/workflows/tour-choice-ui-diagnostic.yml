name: Temporary tour choice UI geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'manager/assets/workspace-v2-tour-choices.css'
      - 'tests/visual/manager2-workspace.spec.js'
      - '.github/workflows/tour-choice-ui-diagnostic.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-chromium-browser-v1
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure the actual Manager2 choice panel
        run: npx playwright test tests/visual/manager2-workspace.spec.js --browser=chromium --grep 'Manager2 saved tour choice stays' --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-choice-geometry-${{ github.run_id }}
          path: |
            manager2-artifacts/*tour-choice.png
            test-results/**/error-context.md
