name: Hotel catalogue PR1750 native appendix rehearsal and release admission
on:
  push:
    branches: [ops/admit-hotel-catalogue-publisher-1750-20261127]
    paths: ['.github/workflows/hotel-catalogue-publisher-1750-admission.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  admission:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff' && github.event.before == 'ec5332b4ddb0c76ac109d9603f2cdc9c9b42d80b' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout the exact candidate and already accepted catalogue history
        uses: actions/checkout@v4
        with:
          ref: 3f2193bf23aea44d2c0f8a34130872737067aaa7
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Activate and independently roll back the 14 already admitted dossiers in an isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          previous=61e05da2e6bcf88082a9a6bb46858d05040a603f
          accepted=2959179c360d359481dcf0ae47d0c2ef496237dd
          root="$(mktemp -d "$RUNNER_TEMP/hotel-rehearsal.XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          test "$(git rev-parse HEAD)" = 3f2193bf23aea44d2c0f8a34130872737067aaa7
          app="$root/app"
          target="$root/admitted"
          releases="$root/max-search-bot-private-logs/hotel-catalogue-releases"
          reader="$app/services/ManagerHotelKnowledge.php"
          install -d -m 0700 "$app/services" "$target" "$releases"
          git archive "$previous" knowledge/hotels | tar -x -C "$app"
          git archive "$accepted" knowledge/hotels | tar -x -C "$target"
          added="$(git diff --name-only --diff-filter=A "$previous" "$accepted" -- knowledge/hotels | awk '/\/anytour-[0-9]+-.*\.json$/ {++count} END {print count + 0}')"
          test "$added" = 14
          cp services/ManagerHotelKnowledge.php "$reader"
          git -C "$app" init -q --object-format=sha1
          git -C "$app" add services knowledge
          git -C "$app" -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm fixture
          app_sha="$(git -C "$app" rev-parse HEAD)"
          archive="$root/admitted.json"
          node tools/hotel_catalogue_package.js build "$app/knowledge/hotels" "$reader" "$target/knowledge/hotels" "$archive" > "$root/built.json"
          approved="$(node -p 'require(process.argv[1]).package_sha256' "$root/built.json")"
          node tools/hotel_catalogue_release.js activate "$app" "$app_sha" bundled "$archive" "$approved" accepted-14-activation > "$root/activated.json"
          version="$(node -p 'require(process.argv[1]).to' "$root/activated.json")"
          test "$(readlink "$releases/current")" = "$releases/$version"
          diff -rq "$releases/$version/hotels" "$target/knowledge/hotels"
          php tools/hotel_catalogue_compatibility.php "$app" "$reader" > "$root/compatible.json"
          test "$(node -p 'require(process.argv[1]).status' "$root/compatible.json")" = compatible
          node tools/hotel_catalogue_release.js rollback "$app" "$app_sha" accepted-14-activation accepted-14-rollback > "$root/rolled-back.json"
          test "$(node -p 'require(process.argv[1]).state' "$root/rolled-back.json")" = rolled_back
          test ! -L "$releases/current"
          test "$(git -C "$app" rev-parse HEAD)" = "$app_sha"
          test -z "$(git -C "$app" status --porcelain)"
          printf 'Isolated approved catalogue additions activated and rolled back: %s\n' "$added"
      - name: Fresh ordinary release admission for PR1750
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_priority.js --admit 1750 3f2193bf23aea44d2c0f8a34130872737067aaa7 ec5332b4ddb0c76ac109d9603f2cdc9c9b42d80b
