name: "Big-channel transfer: verify archive candidates for 50 hotels"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '3dafb10e40ab0df2b517caeb7f63509c8e97f438' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare read-only demand and destination audit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $clips=[];
              foreach ($xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_video_duration').']',$root) as $v) {
                  $clips[]=[$v->tagName,$v->getAttribute('class'),$v->getAttribute('src'),$v->getAttribute('poster'),$v->getAttribute('style'),trim($v->textContent)];
              }
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'video_sha256s'=>array_map(static fn(array $x):string=>hash('sha256',json_encode($x,JSON_THROW_ON_ERROR)),$clips),
                  'video_duration_text'=>array_values(array_map(static fn(array $x):string=>$x[5],array_filter($clips,static fn(array $x):bool=>str_contains($x[1],'video_duration')))),
                  'caption'=>$caption,'caption_html'=>$captionHtml,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function priceRows(array $ids): array {
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_xml');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_xml');
              $xp=new DOMXPath($doc);
              $result = [];
              $now=new DateTimeImmutable('now',new DateTimeZone('Europe/Moscow'));
              foreach($ids as $id) {
                  try {
                      $pair=[];
                      foreach(['max','tg'] as $platform){
                          $q=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$platform.'_'.$id.'"]');
                          requireEdit($q->length===1,'missing_or_duplicate_feed_offer');
                          $o=$q->item(0);
                          $get=static function(string $name) use($xp,$o):string{
                              $x=$xp->query('./'.$name,$o);
                              requireEdit($x->length===1,'invalid_'.$name);
                              return $x->item(0)->textContent;
                          };
                          $desc=$get('description');
                          $pattern='~^💰 От (?<amount>[0-9][0-9 ,.\x{00a0}\x{202f}]*) ₽ за двоих\n✈️ Вылет из [^\n]+ (?<date>\d{2}\.\d{2}\.\d{4}) · [1-9][0-9]* ноч(?:ь|и|ей)\n👥 2 взрослых\n🛏 [^\n]+\n🍽 [^\n]+\nЦена найдена мониторингом (?<observed>\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\. Стоимость и наличие могут измениться\.$~mu';
                          requireEdit(preg_match_all($pattern,$desc,$m,PREG_SET_ORDER)===1,'missing_or_ambiguous_price_block');
                          $a=$m[0];$value=str_replace(',','.',preg_replace('/[\s\x{00a0}\x{202f}]/u','',$a['amount']));
                          $price=$get('price');
                          requireEdit($get('currencyId')==='RUB'&&preg_match('/^[1-9][0-9]*(?:\.[0-9]{1,2})?$/D',$price)&& (float)$value===(float)$price,'amount_mismatch');
                          $obs=DateTimeImmutable::createFromFormat('!d.m.Y, H:i',$a['observed'],$now->getTimezone());
                          $departure=DateTimeImmutable::createFromFormat('!d.m.Y',$a['date'],$now->getTimezone());
                          requireEdit($obs && $obs->format('d.m.Y, H:i')===$a['observed'] && $obs<=$now
                              && $now->getTimestamp()-$obs->getTimestamp()<129600,'observation_outside_36h');
                          requireEdit($departure && $departure->format('d.m.Y')===$a['date'] && $departure>=$now->setTime(0,0),'past_departure');
                          $pair[]= ['block'=>$a[0],'price'=>$price,'observation'=>$obs->format(DATE_ATOM),'departure'=>$departure->format('Y-m-d')];
                      }
                      requireEdit($pair[0]===$pair[1],'platform_offer_mismatch');
                      $result[$id]=$pair[0];
                  } catch (Throwable $e) {
                      $result[$id]=['reason'=>$e->getMessage()];
                  }
              }
              return $result;
          }
          function normalizedArchiveText(string $s): string {
              return trim((string)preg_replace('/[^\p{L}\p{N}]+/u',' ',mb_strtolower($s,'UTF-8')));
          }
          function archiveHotelMatches(string $title,string $text,array $aliases): array {
              $h=' '.normalizedArchiveText($title).' ';
              $all=' '.normalizedArchiveText(mb_substr($text,0,950,'UTF-8')).' ';
              $found=[];
              foreach($aliases as $id=>$alias) {
                  if(str_contains($h,$alias))$found[$id]='heading';
                  elseif(str_contains($all,$alias))$found[$id]='body';
              }
              return count($found)===1?$found:[];
          }
          $out=['ok'=>false,'db_writes'=>0,'provider_writes'=>0,'telegram_pages'=>0,'max_pages'=>0];
          try {
              installedEdit('9385571c86c45189c31d9c4aa904c23970e3b11a');
              ob_start();
              try { require getcwd().'/config.php';require_once getcwd().'/services/PromotedHotelPriceWriter.php';require_once getcwd().'/services/ChannelPostEntryService.php'; }
              finally {ob_end_clean();}
              $target=json_decode(<<<'TARGETS'
          [[241,"Путевки в Pickalbatros Makadi Resort"],[15693,"Путевки в The Makadi Spa"],[293,"Путевки в Pickalbatros Laguna Vista"],[408,"Путевки в Savoy Sharm El Sheikh"],[800,"Путевки в Sugar Marina Resort Art Karon Beach"],[949,"Путевки в Adam & Eve"],[1260,"Путевки в IC Hotels Santai Family Resort"],[1972,"Путевки в Moreno Horizon Spa & Resort"],[2588,"Путевки в Jumeirah Beach Hotel"],[24909,"Путевки в Graceland Khao Lak Beach Resort"],[32342,"Путевки в Vinpearl Resort & Spa Phu Quoc"],[57028,"Путевки в Pickalbatros Aqua Park Sharm"],[65877,"Путевки в Vesna Hotel"],[73343,"Путевки в The Grand Palace"],[43689,"Путевки в Fusion Resort Cam Ranh"],[47025,"Путевки в Adalya Elite Lara"],[139,"Путевки в Brayka Bay Resort"],[435,"Путевки в Sheraton Soma Bay Resort"],[513,"Путевки в Naama Bay Hotel & Resort"],[2470,"Путевки в Sun Siyam Olhuveli"],[56092,"Путевки в Gravity Hotel & Aqua Park Hurghada"],[59114,"Путевки в Akdora Elite Hotel & Spa"],[63191,"Путевки в Jumeirah Saadiyat Island"],[76588,"Путевки в LIU Resorts"],[77914,"Путевки в Sunrise Tucana Resort"],[106,"Путевки в Aladdin Beach Resort"],[111,"Путевки в Pickalbatros Palace Resort Hurghada"],[114,"Путевки в Ali Baba Palace"],[140,"Путевки в Golden Beach Resort"],[178,"Путевки в Desert Rose"],[195,"Путевки в Dreams Beach Resort"],[206,"Путевки в Palace Beach Hotel"],[231,"Путевки в The Grand Makadi"],[246,"Путевки в JAZ Fayrouz"],[263,"Путевки в Steigenberger Coraya Beach"],[266,"Путевки в Lido Sharm"],[268,"Путевки в JAZ Makadi Saraya Resort"],[310,"Путевки в Pickalbatros Golf Beach Resort"],[358,"Путевки в Rixos Sharm El Sheikh"],[371,"Путевки в Reef Oasis Beach Resort"],[381,"Путевки в Rehana Royal Beach Resort Aqua Park & Spa"],[389,"Путевки в Pickalbatros Royal Moderna"],[416,"Путевки в Sunrise Crystal Bay Resort"],[465,"Путевки в Stella Di Mare Beach Hotel & Spa"],[497,"Путевки в Titanic Resort & Aqua Park"],[932,"Путевки в Titanic Palace"],[948,"Путевки в Adalya Bliss"],[964,"Путевки в Crystal Aura Aqua Collection"],[975,"Путевки в Nirvana Dolce Vita"],[1013,"Путевки в Sunis Elita Beach Resort & Spa"]]
          TARGETS,true,16,JSON_THROW_ON_ERROR);
              requireEdit(count($target)===50 && count(array_unique(array_column($target,0)))===50,'batch_scope');
              $alias=[];
              foreach($target as [$hotel,$name]) {
                  $clean=normalizedArchiveText($name);
                  $clean=preg_replace('/^(?:путевки|путёвки|туры)\s+в\s+/u','',$clean);
                  if(mb_strlen($clean,'UTF-8')>=9)$alias[$hotel]=' '.$clean.' ';
              }
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $q=$pdo->query("SELECT p.id,p.post_channel_id,p.external_message_id,v.state,v.id AS version,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id')) AS hotel_id
                  FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id AND v.publication_id=p.id
                  WHERE p.post_channel_id IN (4,6) AND JSON_VALID(v.snapshot_json) LIMIT 2501");
              $reg=$q->fetchAll(PDO::FETCH_ASSOC);
              $pdo->rollBack();
              requireEdit(count($reg)<2501,'registry_limit_hit');
              $bindings=[];
              foreach($reg as $r){$bindings[(int)$r['post_channel_id']][$r['external_message_id']]=[
                  'publication_id'=>(int)$r['id'],'version'=>(int)$r['version'],'state'=>$r['state'],'hotel_id'=>(int)$r['hotel_id']];}
              $matches=['max'=>[],'telegram'=>[]];
              $chat='-68765999669267';
              $before=(int)ceil(microtime(true)*1000);
              $seen=[];
              for($page=0;$page<8;++$page) {
                  $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>$chat,'from'=>$before,'to'=>1,'count'=>100],null);
                  $msgs=$r['data']['messages']??null;
                  requireEdit(($r['http']??0)===200 && empty($r['transport_error']) && is_array($msgs) && array_is_list($msgs) && count($msgs)<=100,'max_history_read_failed');
                  ++$out['max_pages'];$last=$before;
                  foreach($msgs as $m){
                      $mid=$m['body']['mid']??'';
                      requireEdit((string)($m['recipient']['chat_id']??'')===$chat && preg_match('/\Amid\.[0-9a-f]{32}\z/D',$mid)&& isset($m['timestamp']),'max_message_identity');
                      $last=min($last,(int)$m['timestamp']);
                      if(isset($seen[$mid]))continue;
                      $seen[$mid]=true;
                      $post=ChannelPostIncomingAdapter::maxSnapshot($m);
                      if(!is_array($post)||!is_string($post['text']??null))continue;
                      $text=$post['text'];
                      foreach(archiveHotelMatches(explode("\n",$text,2)[0],$text,$alias) as $id=>$scope){
                          $slug=rtrim(strtr(base64_encode(hex2bin(substr($mid,-16))),'+/','-_'),'=');
                          $matches['max'][$id][]=['url'=>'https://max.ru/anytour/'.$slug,'mid'=>$mid,'date_ms'=>(int)$m['timestamp'],
                              'match'=>$scope,'media_types'=>array_column($post['attachments'],'type'),'registry'=>$bindings[4][$mid]??null];
                      }
                  }
                  if(count($msgs)<100){$out['max_complete']=true;break;}
                  requireEdit($last<$before,'max_nonprogress');$before=$last;
              }
              $out['max_messages']=count($seen);
              $seen=[];$tgIssue=null;
              for($p=0;$p<32;$p++) {
                  $url='https://t.me/s/anytour'.(isset($next)?'?before='.$next:'');
                  try{$raw=PromotedHotelPriceWriter::publicBytes($url,2000000);}
                  catch(Throwable){$tgIssue='telegram_public_page_unavailable';break;}
                  $doc=new DOMDocument();
                  requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'tg_public_dom');
                  $xp=new DOMXPath($doc);
                  $roots=$xp->query('//*[starts-with(@data-post,"anytour/")]');
                  if(!$roots->length)break;
                  ++$out['telegram_pages'];$last=null;
                  foreach($roots as $root){
                      if(!preg_match('/\Aanytour\/([1-9][0-9]*)\z/D',$root->getAttribute('data-post'),$m))continue;
                      $mid=$m[1];$last=$last===null?(int)$mid:min($last,(int)$mid);
                      if(isset($seen[$mid]))continue;
                      $seen[$mid]=true;
                      $x=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_text ")]',$root);
                      if($x->length!==1)continue;
                      $html='';foreach($x->item(0)->childNodes as $node)$html.=$doc->saveHTML($node);
                      $text=html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$html)),ENT_QUOTES|ENT_HTML5,'UTF-8');
                      foreach(archiveHotelMatches(explode("\n",$text,2)[0],$text,$alias) as $id=>$scope) {
                          $dates=$xp->query('.//time[@datetime]',$root);
                          $pics=$xp->query('.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_photo_wrap ")]',$root)->length;
                          $vids=$xp->query('.//video|.//*[contains(concat(" ",normalize-space(@class)," ")," tgme_widget_message_video_thumb ")]',$root)->length;
                          $matches['telegram'][$id][]=['url'=>'https://t.me/anytour/'.$mid,'mid'=>$mid,
                             'date'=>$dates->length===1?$dates->item(0)->getAttribute('datetime'):'','match'=>$scope,
                             'photos'=>$pics,'video_nodes'=>$vids,'registry'=>$bindings[6][$mid]??null];
                      }
                  }
                  if($last===null||$last<=1||isset($next)&&$last>=$next)break;
                  $next=$last;
              }
              $out['telegram_messages']=count($seen);$out['telegram_oldest_cursor']=$next??null;
              $out['telegram_read_limit']=$tgIssue??($out['telegram_pages']===32?'planned_page_cap':null);
              $out['matches']=$matches;$out['ok']=true;
          } catch(Throwable $e) {
              if(isset($pdo)&&$pdo->inTransaction())$pdo->rollBack();
              $m=$e->getMessage();$out['reason']=preg_match('/^[a-z_0-9]{1,100}$/D',$m)?$m:'archive_audit_failed';
          }
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read fresh demand, paired prices and big-channel bindings
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("BIG_CHANNEL_ARCHIVE_50="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("provider_writes")==0 and d.get("db_writes")==0'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: big-channel-archive-50
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
