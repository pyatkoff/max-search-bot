name: Read AnyTour hotel campaign bindings
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths:
      - .github/workflows/anytour-hotel-ads-readonly-20261117.yml
      - audit/anytour-hotel-ads-readonly-20261117.py
      - audit/anytour-hotel-ads-runner-20261117.py
permissions:
  contents: read
concurrency:
  group: anytour-hotel-ads-owner-20261117
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read hotel campaign bindings without repeating statistical reports
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: bd6759cc222a538b14ad168029442e36a3893f04e67712a0ad742b1fc71a967e
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/anytour-hotel-ads-runner-20261117.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-hotel-ads-details-20261117
          path: encrypted-hotel-ads/*.enc.json
          retention-days: 7
          if-no-files-found: error


