name: "Edit only Aloft after the explicit Telegram rejection and unchanged source check"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '50f25a435916a9b535146fb0976ceeee4f184149' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Validate the seven exact caption plans and scoped editor
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          const INSTALLED_SHA='e262bf139da2b78623e1be3a891630fd10924180';
          const PAYLOAD=<<<'PACKET'
          [{"mid":1043,"hotel_id":61159,"source_mid":428,"source":{"id":951,"version":11658,"hash":"8a434f15b7133380b6249fb7cf0984dc3b1a37cc3099d1982f0648675d90b21d","state":"sent","hotel_id":61159,"url":"https://t.me/any_toour/428","media_types":["image"]},"date":"2025-03-12T13:12:05+00:00","photos":["5371031731395751709"],"caption_sha256":"dfcf39da85384b66f09589a0b0ce68bf293f1516837e8468874717cb072fb8c5","old_buttons":[{"text":"СВЯЗАТЬСЯ С МЕНЕДЖЕРОМ 📱","url":"https://t.me/AnyTour_MSK"}],"links":[{"text":"Подписаться на канал AnyTour - Горящие туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}],"price":{"block":"💰 От 89 843 ₽ за двоих\n✈️ Вылет из Москвы 22.12.2026 · 5 ночей\n👥 2 взрослых\n🛏 aloft room king /twin\n🍽 Завтраки\nЦена найдена мониторингом 19.11.2026, 04:01 МСК. Стоимость и наличие могут измениться.","price":"89843","observation":"2026-11-19T04:01:00+03:00","departure":"2026-12-22"},"channel_config":2,"prefix":"Aloft Palm Jumeirah\n📍 Палм-Джумейра, Дубай\n\nРесторан на крыше с панорамным видом на Дубай и променад для прогулок. Отель располагает частной зоной пляжа примерно в 300 метрах."}]
          PACKET;
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'caption'=>$caption,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function priceRows(array $ids): array {
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_xml');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_xml');
              $xp=new DOMXPath($doc);
              $result = [];
              $now=new DateTimeImmutable('now',new DateTimeZone('Europe/Moscow'));
              foreach($ids as $id) {
                  try {
                      $pair=[];
                      foreach(['max','tg'] as $platform){
                          $q=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$platform.'_'.$id.'"]');
                          requireEdit($q->length===1,'missing_or_duplicate_feed_offer');
                          $o=$q->item(0);
                          $get=static function(string $name) use($xp,$o):string{
                              $x=$xp->query('./'.$name,$o);
                              requireEdit($x->length===1,'invalid_'.$name);
                              return $x->item(0)->textContent;
                          };
                          $desc=$get('description');
                          $pattern='~^💰 От (?<amount>[0-9][0-9 ,.\x{00a0}\x{202f}]*) ₽ за двоих\n✈️ Вылет из [^\n]+ (?<date>\d{2}\.\d{2}\.\d{4}) · [1-9][0-9]* ноч(?:ь|и|ей)\n👥 2 взрослых\n🛏 [^\n]+\n🍽 [^\n]+\nЦена найдена мониторингом (?<observed>\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\. Стоимость и наличие могут измениться\.$~mu';
                          requireEdit(preg_match_all($pattern,$desc,$m,PREG_SET_ORDER)===1,'missing_or_ambiguous_price_block');
                          $a=$m[0];$value=str_replace(',','.',preg_replace('/[\s\x{00a0}\x{202f}]/u','',$a['amount']));
                          $price=$get('price');
                          requireEdit($get('currencyId')==='RUB'&&preg_match('/^[1-9][0-9]*(?:\.[0-9]{1,2})?$/D',$price)&& (float)$value===(float)$price,'amount_mismatch');
                          $obs=DateTimeImmutable::createFromFormat('!d.m.Y, H:i',$a['observed'],$now->getTimezone());
                          $departure=DateTimeImmutable::createFromFormat('!d.m.Y',$a['date'],$now->getTimezone());
                          requireEdit($obs && $obs->format('d.m.Y, H:i')===$a['observed'] && $obs<=$now
                              && $now->getTimestamp()-$obs->getTimestamp()<129600,'observation_outside_36h');
                          requireEdit($departure && $departure->format('d.m.Y')===$a['date'] && $departure>=$now->setTime(0,0),'past_departure');
                          $pair[]= ['block'=>$a[0],'price'=>$price,'observation'=>$obs->format(DATE_ATOM),'departure'=>$departure->format('Y-m-d')];
                      }
                      requireEdit($pair[0]===$pair[1],'platform_offer_mismatch');
                      $result[$id]=$pair[0];
                  } catch (Throwable $e) {
                      $result[$id]=['reason'=>$e->getMessage()];
                  }
              }
              return $result;
          }
          function fromRegistry(PDO $pdo, ChannelPostRegistryService $registry,int $channel,int $mid): ?array {
              $q=$pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=? LIMIT 2');
              $q->execute([$channel,(string)$mid]); $ids=$q->fetchAll(PDO::FETCH_COLUMN);$q->closeCursor();
              requireEdit(count($ids)<=1,'publication_duplicate');
              return $ids ? $registry->publication((int)$ids[0]) : null;
          }
          function recordVersion(?array $post): ?array {
              if ($post===null) return null;
              return ['id'=>$post['publication_id'],'version'=>$post['version_id'],'state'=>$post['state'],
                  'hash'=>$post['content_hash'],'hotel_id'=>$post['snapshot']['metadata']['hotel_catalog_id']??null,
                  'url'=>$post['snapshot']['post_url']??null,'caption'=>$post['snapshot']['text']??null,
                  'media_types'=>array_column($post['snapshot']['attachments']??[],'type')];
          }
          
          const LABEL='✈️ Рассчитать на мои даты';
          const TARGET='-1001845835645';
          const CHANNEL_ID=6;
          function capture($file,array $row):void{
              $line=json_encode($row,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL;
              requireEdit(fwrite($file,$line)===strlen($line) && fflush($file) && fsync($file),'journal_write_failed');
          }
          function linkEvidence(array $links):array {
              return array_map(static fn(array $r):array=>['text'=>trim($r['text']),'url'=>$r['url']],$links);
          }
          function captionPlan(array $row):array {
              $caption=trim($row['prefix']);
              $entities=[];
              if($row['links']) $caption.="\n\n";
              foreach($row['links'] as $link){
                  if($entities) $caption.=" · ";
                  $offset=strlen(mb_convert_encoding($caption,'UTF-16LE','UTF-8'))/2;
                  $entities[]=['type'=>'text_link','offset'=>(int)$offset,
                      'length'=>(int)(strlen(mb_convert_encoding($link['text'],'UTF-16LE','UTF-8'))/2),'url'=>$link['url']];
                  $caption.=$link['text'];
              }
              return [PromotedHotelPriceWriter::revision($caption,$row['price']['block'],true),$entities];
          }
          function requireFreshPrice(array $row,array $prices):void {
              $fresh=$prices[$row['hotel_id']]??null;
              requireEdit($fresh===$row['price'],'price_changed_or_unavailable');
              $stamp=new DateTimeImmutable($row['price']['observation']);
              requireEdit($stamp->getTimestamp()<=time() && time()-$stamp->getTimestamp()<129600,'price_expired');
          }
          function exactRegisterRow(PDO $pdo, ChannelPostRegistryService $registry,array $r):void {
              requireEdit(fromRegistry($pdo,$registry,CHANNEL_ID,$r['mid'])===null,'target_has_a_registered_version');
              $s=recordVersion(fromRegistry($pdo,$registry,10,$r['source_mid']));
              if($s!==null)unset($s['caption']);
              requireEdit(is_array($s) && $s==$r['source'] && (int)$s['hotel_id']===$r['hotel_id'],'source_version_changed');
          }
          function exactOriginal(array $r):array {
              $current=publicTelegram($r['mid']);
              requireEdit($current['date']===$r['date'] && $current['videos']===0 && $current['photos']===$r['photos']
                 && $current['caption_sha256']===$r['caption_sha256'] && $current['buttons']===$r['old_buttons']
                 && $current['links']===$r['links'],'old_post_changed');
              return $current;
          }
          function verifyPublished(array $r,string $caption,string $url):bool{
              $p=publicTelegram($r['mid']);
              return $p['date']===$r['date'] && $p['photos']===$r['photos'] && $p['videos']===0 && $p['caption']===$caption
                  && $p['buttons']===[['text'=>LABEL,'url'=>$url]] && linkEvidence($p['links'])===linkEvidence($r['links']);
          }
          $out=['ok'=>false,'rows'=>[]];
          try {
              installedEdit(INSTALLED_SHA);
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/services/ChannelPostAutomationService.php';
              } finally {ob_end_clean();}
              $pdo=ConversationDb::connection();
              $registry=new ChannelPostRegistryService($pdo);
              $identity=ChannelPostRuntime::identity('telegram');
              $bot=(string)($identity['bot_key']??'');
              $channel=$registry->channel('anytour','telegram',$bot,TARGET);
              requireEdit(is_array($channel)&&(int)$channel['id']===CHANNEL_ID && $channel['source_key']==='tg_anytour_msk'
                  && $channel['button_text']===LABEL && $channel['bot_url']==='https://t.me/anyru_bot','admission_channel_mismatch');
              requireEdit((new ChannelPostButtonTransport())->verifyChannel($channel)['state']==='ready','native_edit_rights');
              $base='/var/www/anytoour/data/channel-post-operations';
              requireEdit(realpath($base)===$base && is_dir($base),'journal_root');
              $rows=json_decode(PAYLOAD,true,16,JSON_THROW_ON_ERROR);
              requireEdit(array_column($rows,'mid')===[1043], 'batch_scope');
              $prices=priceRows(array_column($rows,'hotel_id'));
              foreach($rows as $r) {
                  $mid=$r['mid']; $hotel=$r['hotel_id']; $u='https://t.me/anytour/'.$mid;
                  $result=['mid'=>$mid,'hotel_id'=>$hotel,'url'=>$u,'price'=>$r['price']['price'],'departure'=>$r['price']['departure'],
                      'observation'=>$r['price']['observation'],'provider_calls'=>0];
                  $key='anytour-issue1566-seven-tg-caption-'.$mid.'-v2';
                  $priorKey='anytour-issue1566-seven-tg-caption-'.$mid.'-v1';
                  $original=$base.'/'.$priorKey.'/receipt.jsonl';
                  requireEdit(is_file($original)&&!is_link($original)&&filesize($original)<65536,'prior_rejection_receipt_missing');
                  $lines=file($original,FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES);
                  $prior=json_decode((string)end($lines),true,12,JSON_THROW_ON_ERROR);
                  requireEdit(($prior['mid']??null)===$mid && ($prior['caption_http']??null)===400
                    && ($prior['reason']??null)==='caption_outcome_unconfirmed_no_retry','prior_rejection_receipt_changed');
                  $journal=null;$lock=false;
                  try {
                      installedEdit(INSTALLED_SHA);
                      requireEdit((int)$channel['config_version']===$r['channel_config']
                          && $registry->channel('anytour','telegram',$bot,TARGET)===$channel,'channel_version_changed');
                      requireFreshPrice($r,$prices);
                      exactRegisterRow($pdo,$registry,$r);
                      exactOriginal($r);
                      [$caption,$entities]=captionPlan($r);
                      foreach([$key,'anytour-issue1566-historical-tg-media-'.$mid.'-v1'] as $op)
                          requireEdit(!file_exists($base.'/'.$op)&&!is_link($base.'/'.$op),'previous_edit_receipt_hold');
                      $q=$pdo->prepare('SELECT GET_LOCK(?,0)');
                      $q->execute([$key]);$lock=(int)$q->fetchColumn()===1;$q->closeCursor();
                      requireEdit($lock,'target_lock_busy');
                      exactRegisterRow($pdo,$registry,$r);
                      requireEdit(!file_exists($base.'/'.$key) && mkdir($base.'/'.$key,0700),'edit_receipt_already_exists');
                      $journal=fopen($base.'/'.$key.'/receipt.jsonl','x');
                      requireEdit(is_resource($journal),'edit_receipt_unavailable');
                      capture($journal,$result+['state'=>'caption_attempt_started','before'=>$r['caption_sha256'],
                         'photo'=>$r['photos'],'date'=>$r['date'],'new_caption_sha256'=>hash('sha256',$caption)]);
                      ++$result['provider_calls'];
                      $response=ChannelPostApiTransport::captionRequest('telegram',TARGET,(string)$mid,[
                          'caption'=>$caption,
                          'caption_entities'=>$entities,
                          'reply_markup'=>['inline_keyboard'=>[]],
                      ]);
                      $m=$response['data']['result']??null;
                      $result['caption_http']=(int)($response['http']??0);
                      if ($result['caption_http']>=400 && $result['caption_http']<500) {
                          $result['provider_description']=mb_substr(preg_replace('/[^a-z0-9 :_().-]/i','',(string)($response['data']['description']??'')),0,140);
                      }
                      requireEdit($result['caption_http']===200 && empty($response['transport_error'])
                          && ($response['data']['ok']??false) === true && is_array($m),'caption_outcome_unconfirmed_no_retry');
                      unset($response);
                      requireEdit((string)($m['chat']['id']??'')===TARGET && ($m['chat']['username']??'')==='anytour'
                          && (int)($m['message_id']??0)===$mid && (int)($m['date']??0)===(new DateTimeImmutable($r['date']))->getTimestamp()
                          && (int)($m['edit_date']??0)>0,'native_message_or_date_mismatch_no_retry');
                      $snap=ChannelPostIncomingAdapter::telegramSnapshot($m);
                      requireEdit(is_array($snap) && $snap['text']===$caption && $snap['post_url']===$u
                          && count($snap['attachments']??[])===1 && ($snap['attachments'][0]['type']??'')==='image'
                          && !empty($snap['attachments'][0]['file_unique_id']),'native_caption_or_photo_unconfirmed_no_retry');
                      $snap['metadata']['hotel_catalog_id']=$hotel;
                      $snap['metadata']['logical_id']='commercial-main-hotel-'.$hotel.'-v1';
                      $snap['metadata']['source_event_id']=$key.':'.$m['edit_date'];
                      $snap['metadata']['observation_kind']='authorized_admin_content_edit';
                      $snap['metadata']['promoted_price_observed_at']=(new DateTimeImmutable($r['price']['observation']))->format(DATE_ATOM);
                      $snap['content_hash']=ChannelPostIncomingAdapter::contentFingerprint($snap,'',$channel['bot_url']);
                      $p=$registry->registerPublication('anytour','telegram',$bot,TARGET,(string)$mid,$snap);
                      requireEdit(is_array($p) && ($p['external_message_id']??'')===(string)$mid
                          && (int)($p['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel && $p['snapshot']['text']===$caption,
                          'binding_unconfirmed_no_retry');
                      $id=(int)$p['publication_id'];$version=(int)$p['version_id'];
                      $result['publication_id']=$id;$result['version_id']=$version;
                      $url=ChannelPostButtonTransport::buttonUrl($p);
                      $context=ChannelPostEntryService::resolve('telegram',$p['start_payload'],$registry);
                      requireEdit((int)($context['publication_id']??0)===$id
                        && (int)($context['version_id']??0)===$version
                        && (int)($context['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel
                        && ($context['snapshot']['post_url']??'')===$u,'context_unconfirmed_no_retry');
                      capture($journal,$result+['state'=>'hotel_bound','button_hash'=>hash('sha256',$url)]);
                      if($p['state']==='pending') {
                          $transport=new ChannelPostButtonTransport(static function($platform,$method,$path,$query,$body)use($mid){
                              requireEdit($platform==='telegram' && $method==='POST' && $query===[]
                                 && (in_array($path,['getMe','getChat','getChatMember'],true)
                                   || ($path==='editMessageReplyMarkup'&&(string)($body['chat_id']??'')===TARGET
                                     && (int)($body['message_id']??0)===$mid)), 'outside_exact_button_scope');
                              return ChannelPostApiTransport::buttonRequest($platform,$method,$path,$query,$body);
                          });
                          (new ChannelPostAutomationService($registry,$transport))->processPublication('anytour','telegram',$bot,$id,$version);
                      }
                      $verified=false;
                      for($i=0;$i<3;$i++){
                          if($i>0)sleep(2);
                          try {if(verifyPublished($r,$caption,$url)){$verified=true;break;}}catch(Throwable $ignore){}
                      }
                      requireEdit($verified,'public_post_or_button_unconfirmed_no_retry');
                      $final=$registry->publication($id);
                      requireEdit(is_array($final) && (int)$final['version_id']===$version,'final_registry_version_changed');
                      if($final['state']==='unknown') {
                          // A public exact photo/date/caption plus the single expected hotel button
                          // confirms the prior operation without an additional provider request.
                          $registry->confirmObservedButton($id,$version,[
                              'verified'=>true,'button_verified'=>true,'content_preserved'=>true,
                              'reconciled'=>true,'write_attempts'=>0,
                          ]);
                          $final=$registry->publication($id);
                      }
                      $result['registry_state']=$final['state'];
                      $result['published_date_preserved']=true;
                      $result['single_hotel_button_verified']=true;
                      $result['original_photo_and_text_links_verified']=true;
                      $result['state']='verified';
                  } catch(Throwable $e){
                      $result['state']=$result['provider_calls']>0?'held_no_retry':'not_written';
                      $value=$e->getMessage();
                      $result['reason']=preg_match('/^[a-z_]{1,100}$/D',$value)?$value:'operation_failed';
                  } finally {
                      if(is_resource($journal)){
                          try{capture($journal,$result);}catch(Throwable $ignore){}
                          fclose($journal);
                      }
                      if($lock){$q=$pdo->prepare('SELECT RELEASE_LOCK(?)');$q->execute([$key]);$q->closeCursor();}
                  }
                  $out['rows'][]=$result;
              }
              $out['installed']=INSTALLED_SHA;
              $out['ok']=true;
          } catch(Throwable $e) {
              $msg=$e->getMessage();
              $out['reason']=preg_match('/^[a-z_]{1,100}$/D',$msg)?$msg:'batch_failed';
          }
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($out['ok']?0:2);
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Edit the seven Telegram posts and independently read all results
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 - <<'PY'
          import json
          d=json.load(open('pub/registry.json'))
          print('SEVEN_TELEGRAM_RESULT='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
          assert d.get('ok') and len(d.get('rows',[]))==1
          PY
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aloft-telegram-edit-and-readback
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
