name: "PR 1641: canonical read-only release admission"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  canonical-admission:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'f35994cdc94391815e15b60d0be86c0326638749' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the accepted main source for the original verifier
        uses: actions/checkout@v4
        with:
          ref: cb08ade02e0d4588dfef8e4f0a8a5253b04d26c6
          persist-credentials: false
      - name: Verify exact PR using the normal release guard and previous terminal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'cb08ade02e0d4588dfef8e4f0a8a5253b04d26c6'
          node tools/release_priority.js --admit 1641 eac5683232986c4e67ab65cfc993bff287b78747 cb08ade02e0d4588dfef8e4f0a8a5253b04d26c6
