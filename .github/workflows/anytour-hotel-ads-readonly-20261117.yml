name: "Three existing Big MAX posts: exact read-only price preflight"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '75e5e90eecb121592a17419559801e111f42d407' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare exact MAX registry and post reads
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function parsedPrice(string $text): ?int {
              if (!preg_match('/^💰 От ([0-9\x{00a0}\x{202f} ]+) ₽ за двоих/mu',$text,$m)) return null;
              return (int)preg_replace('/\D/','',$m[1]);
          }
          $report=['ok'=>false,'provider_writes'=>0,'db_writes'=>0];
          try {
              installedEdit('cb08ade02e0d4588dfef8e4f0a8a5253b04d26c6');
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
              } finally { ob_end_clean(); }
              $path='/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl';
              $lk=is_file($path) && !is_link($path) ? fopen($path,'rb') : null;
              $hasLock=is_resource($lk) && flock($lk,LOCK_SH|LOCK_NB);
              $report['price_lock_observation']=$hasLock?'free':(is_resource($lk)?'busy':'unavailable');
              if(is_resource($lk)) fclose($lk);
              $targetSet=json_decode(file_get_contents('config/promoted_hotel_price_targets.json'),true,32,JSON_THROW_ON_ERROR);
              $targets=[];
              foreach($targetSet as $target) if($target['platform']==='max') $targets[$target['hotel_id']]=$target['publication_id'];
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry=new ChannelPostRegistryService($pdo);
              $sql=$pdo->prepare("SELECT p.id, JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id')) AS hotel_id,
                  (SELECT COUNT(*) FROM post_versions pv WHERE pv.publication_id=p.id AND
                      (pv.state IN ('claimed','write_started','unknown') OR pv.claim_token IS NOT NULL OR pv.claimed_at IS NOT NULL)) AS pending_claims
                  FROM post_publications p JOIN post_channels c ON c.id=p.post_channel_id
                  JOIN post_versions v ON v.id=p.current_version_id AND v.publication_id=p.id
                  WHERE c.platform='max' AND c.channel_id=? AND c.is_enabled=1 AND JSON_VALID(v.snapshot_json)
                    AND (p.id=3670 OR JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id')) IN ('352','90236','67910'))
                  ORDER BY p.id LIMIT 12");
              $channel='-68765999669267';
              $sql->execute([$channel]);
              $rows=[];
              foreach($sql->fetchAll(PDO::FETCH_ASSOC) as $row) {
                  $id=(int)$row['id'];
                  $hotel=(int)($row['hotel_id']??0);
                  if($id===3670 && $hotel===0) $hotel=352;
                  $rows[]=['id'=>$id,'hotel'=>$hotel,'pending'=>(int)$row['pending_claims'],'post'=>$registry->publication($id)];
              }
              $pdo->rollBack();
              $report['rows']=[];
              foreach($rows as $row) {
                  $post=$row['post'];
                  $snap=$post['snapshot']??[];
                  $mid=$post['external_message_id']??'';
                  $url=$snap['post_url']??'';
                  $item=['hotel'=>$row['hotel'],'publication'=>$row['id'],'url'=>$url,'state'=>$post['state']??null,
                      'pending_claims'=>$row['pending'],'price_writer_target'=>($targets[$row['hotel']]??null)===$row['id'],
                      'registry_price'=>parsedPrice((string)($snap['text']??''))];
                  try {
                      requireEdit(preg_match('~\Ahttps://max\.ru/anytour/[A-Za-z0-9_-]{11}\z~D',$url)===1,'max_public_url_invalid');
                      requireEdit(is_string($mid)&&preg_match('~\A[A-Za-z0-9_.-]{1,160}\z~D',$mid)===1,'bad_native_id');
                      $native=ChannelPostApiTransport::buttonRequest('max','GET','/messages/'.$mid,[],null);
                      $raw=$native['data']??[];
                      $item['native_http']=$native['http']??null;
                      requireEdit(!$native['transport_error'] && $native['http']===200 && ($raw['body']['mid']??null)===$mid
                          && (string)($raw['recipient']['chat_id']??'')===$channel && ($raw['recipient']['chat_type']??'')==='channel',
                          'max_read_unverified');
                      $actual=ChannelPostIncomingAdapter::maxSnapshot($raw);
                      requireEdit(is_array($actual)&&($actual['post_url']??null)===$url,'max_snapshot_invalid');
                      $actualText=$actual['text']??'';
                      $item['native_price']=parsedPrice($actualText);
                      $button=ChannelPostButtonTransport::buttonUrl($post);
                      $label=(string)($post['channel']['button_text']??'');
                      $item['cta_label']=$label;
                      $item['cta_matches']=$button!=='' && $label!=='' && ChannelPostIncomingAdapter::containsOnlyButton($actual,$button,$label);
                      $photo=$actual['attachments'][0]['photo_id']??null;
                      $item['same_photo']=count($actual['attachments']??[])===1 && ($actual['attachments'][0]['type']??'')==='image'
                          && is_string($photo) && $photo!=='' && $photo===($snap['attachments'][0]['photo_id']??null);
                      $item['native_text_matches_registry']=($snap['text']??null)===$actualText;
                      $item['public_caption_matches_native']=PromotedHotelPriceWriter::maxPublicCaption(
                          PromotedHotelPriceWriter::publicBytes($url))===$actualText;
                  }catch(Throwable $error) {
                      $message=$error->getMessage();
                      $item['hold']=preg_match('/\A[a-z_0-9]{1,100}\z/D',$message)?$message:'native_or_public_read_failed';
                  }
                  $report['rows'][]=$item;
              }
              $report['at']=gmdate(DATE_ATOM);
              $report['ok']=true;
          }catch(Throwable $error) {
              if(isset($pdo)&&$pdo->inTransaction()) $pdo->rollBack();
              $message=$error->getMessage();
              $report['hold']=preg_match('/\A[a-z_0-9]{1,100}\z/D',$message)?$message:'max_registry_read_failed';
          }
          echo json_encode($report,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read only three existing MAX posts
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("MAX_THREE_PRICE_PREFLIGHT="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("provider_writes")==0 and d.get("db_writes")==0'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-max-price-preflight
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
