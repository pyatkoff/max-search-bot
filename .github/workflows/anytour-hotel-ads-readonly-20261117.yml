name: "Telegram 927: confirm one existing original version"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '4fe8639ddd3efc0a0643bcf972cdb96293a325c7' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare exact 3690 and 13471 confirmation without Telegram writes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'caption'=>$caption,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function safeReason(Throwable $e): string {
              $m=$e->getMessage();
              return preg_match('/\A[a-z_0-9]{1,100}\z/D',$m)?$m:'exact_preflight_failed';
          }
          function telegramOperationReceipt(int $mid,int $id,int $version,string $caption,string $button): array {
              $root='/var/www/anytoour/data/channel-post-operations';
              $key='anytour-issue1566-seven-tg-caption-'.$mid.'-v1';
              $dir=$root.'/'.$key;
              $file=$dir.'/receipt.jsonl';
              requireEdit(realpath($dir)===$dir && !is_link($file) && is_file($file),'original_receipt_missing');
              $bytes=file_get_contents($file,false,null,0,65537);
              requireEdit(is_string($bytes)&&strlen($bytes)<=65536,'original_receipt_invalid');
              $rows=[];
              foreach(preg_split('/\R/u',trim($bytes)) as $line) {
                  $value=json_decode($line,true,24,JSON_THROW_ON_ERROR);
                  requireEdit(is_array($value)&&($value['mid']??null)===$mid,'original_receipt_wrong_post');
                  $rows[$value['state']]=$value;
              }
              $begin=$rows['caption_attempt_started']??[];
              $bound=$rows['hotel_bound']??[];
              $done=$rows['held_no_retry']??$rows['verified']??[];
              return ['present'=>true,'ended'=>$done['state']??null,'caption_http'=>$bound['caption_http']??null,
                      'caption_matches_original'=>hash_equals((string)($begin['new_caption_sha256']??''),hash('sha256',$caption)),
                      'button_matches_original'=>hash_equals((string)($bound['button_hash']??''),hash('sha256',$button)),
                      'same_original_version'=>($bound['publication_id']??null)===$id&&($bound['version_id']??null)===$version
                          && ($done['publication_id']??null)===$id&&($done['version_id']??null)===$version];
          }
          $target=json_decode(<<<'DATA'
          {"mid":927,"hotel_id":73055,"date":"2024-11-13T11:09:13+00:00","photos":["5303281113382381294"],"links":[{"text":"Подписаться на канал AnyTour - любые туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}],"publication":3690,"version":13471}
          DATA,true,24,JSON_THROW_ON_ERROR);
          $out=['ok'=>false,'publication'=>3690,'version'=>13471,'telegram_writes'=>0,'registry_updates'=>0];
          try {
              installedEdit('c3d763f828d2f88e006d222766c6be3b3656afe9');
              umask(0077);
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
              } finally {ob_end_clean();}
              requireEdit(ProjectConfig::projectId()==='anytour','wrong_project');
              $base='/var/www/anytoour/data/channel-post-operations';
              $path=$base.'/monitor-price-after-collection-v1.jsonl';
              requireEdit(is_file($path)&&!is_link($path),'original_price_lock_missing');
              $file=fopen($path,'rb');
              requireEdit(is_resource($file)&&flock($file,LOCK_EX|LOCK_NB),'shared_editor_busy');

              $pdo=ConversationDb::connection();
              $reg=new ChannelPostRegistryService($pdo);
              $id=3690;$vid=13471;$mid=927;$hotel=73055;$url='https://t.me/anytour/927';
              $key='anytour-issue1566-seven-tg-caption-927-v1';
              $stmt=$pdo->prepare('SELECT GET_LOCK(?,0)');
              $stmt->execute([$key]);$targetLock=(int)$stmt->fetchColumn()===1;$stmt->closeCursor();
              requireEdit($targetLock,'target_lock_busy');
              $p=$reg->publication($id);
              requireEdit(is_array($p)&&$p['project_key']==='anytour'&&$p['platform']==='telegram'&&$p['channel_id']==='-1001845835645'
                  &&$p['external_message_id']===(string)$mid&&$p['version_id']===$vid&&($p['snapshot']['post_url']??null)===$url
                  &&(int)($p['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel,'original_version_binding_changed');
              $snap=$p['snapshot'];
              $raw=ChannelPostIncomingAdapter::telegramSnapshot($snap['raw_body']);
              $page=publicTelegram($mid);
              $button=ChannelPostButtonTransport::buttonUrl($p);
              $context=ChannelPostEntryService::resolve('telegram',$p['start_payload'],$reg);
              requireEdit(is_array($raw)&&$raw['text']===$snap['text']&&($snap['raw_body']['message_id']??0)===$mid
                  &&(string)($snap['raw_body']['chat']['id']??'')===$p['channel_id']&&count($snap['attachments'])===1
                  &&!empty($snap['attachments'][0]['file_unique_id'])&&
                  ($raw['attachments'][0]['file_unique_id']??null)===$snap['attachments'][0]['file_unique_id'],'original_telegram_response_mismatch');
              requireEdit($page['caption']===$snap['text']&&$page['date']===$target['date']&&$page['photos']===$target['photos']&&$page['videos']===0
                  &&$page['links']===$target['links']&&$button!==''&&$page['buttons']===[['text'=>$p['channel']['button_text'],'url'=>$button]]
                  &&(int)($context['publication_id']??0)===$id&&(int)($context['version_id']??0)===$vid
                  &&(int)($context['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel,'public_evidence_mismatch_no_write');
              $receipt=telegramOperationReceipt($mid,$id,$vid,$snap['text'],$button);
              requireEdit($receipt['caption_http']===200&&$receipt['caption_matches_original']&&$receipt['button_matches_original']
                  &&$receipt['same_original_version']&&$receipt['ended']==='held_no_retry','original_durable_receipt_mismatch');
              $out['original_http']=200;$out['original_photo_and_public_cta']=true;
              $out['before']=$p['state'];
              if($p['state']==='sent') {
                  $out['after']='sent';
              }else {
                  requireEdit($p['state']==='unknown'&&$p['error_reason']==='edit_outcome_unknown'
                      &&$p['write_attempts']===1&&$p['claim_token']===null&&$p['claimed_at']===null,'unknown_operation_state_changed');
                  $pdo->beginTransaction();
                  $row=$pdo->prepare('SELECT current_version_id FROM post_publications WHERE id=? FOR UPDATE');
                  $row->execute([$id]);
                  requireEdit((int)$row->fetchColumn()===$vid,'publication_version_changed');
                  $row->closeCursor();
                  $row=$pdo->prepare('SELECT id FROM post_versions WHERE id=? AND publication_id=? FOR UPDATE');
                  $row->execute([$vid,$id]);
                  requireEdit((int)$row->fetchColumn()===$vid,'pinned_version_unavailable');
                  $row->closeCursor();
                  requireEdit($reg->publication($id)===$p,'original_operation_claim_or_version_changed');
                  $before=$p['receipt'];
                  $confirmation=array_replace($before,['verified'=>true,'button_verified'=>true,'content_preserved'=>true,
                      'reconciled'=>true,'message_id'=>(string)$mid,'http_status'=>200]);
                  requireEdit($reg->confirmObservedButton($id,$vid,$confirmation),'original_version_confirmation_failed');
                  $saved=$reg->publication($id);
                  requireEdit($saved['state']==='sent'&&$saved['version_id']===$vid&&$saved['snapshot']===$snap
                      &&$saved['write_attempts']===$p['write_attempts']&&$saved['start_payload']===$p['start_payload'],
                      'confirmation_readback_mismatch');
                  $pdo->commit();
                  $out['registry_updates']=1;
                  $out['after']=$saved['state'];
              }
              $out['ok']=$out['after']==='sent';
          }catch(Throwable $error){
              if(isset($pdo)&&$pdo->inTransaction())$pdo->rollBack();
              $out['hold']=safeReason($error);
          }finally{
              if(!empty($targetLock)){
                  $unlock=$pdo->prepare('SELECT RELEASE_LOCK(?)');$unlock->execute([$key]);$unlock->closeCursor();
              }
              if(isset($file)&&is_resource($file))fclose($file);
          }
          $out['at']=gmdate(DATE_ATOM);
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Confirm the same 13471 in the registry without editing Telegram
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("ADDRESS_927_ORIGINAL_CONFIRM="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("telegram_writes")==0 and d.get("version")==13471'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-927-original-confirmation
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
