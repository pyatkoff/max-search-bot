name: "HOTEL: independently reconcile the three attempted MAX edits"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '9a5340c27476b96afe94b9c29bea3483a1b451d5' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact installed provenance source
        uses: actions/checkout@v4
        with:
          ref: 21b8e93418be0357cc2c7858cd1b0d970a62f4a7
          persist-credentials: false
      - name: Verify current main and accepted application without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '21b8e93418be0357cc2c7858cd1b0d970a62f4a7'
          node - <<'NODE'
          const R = require('./tools/deployment_release')
          const expected = '21b8e93418be0357cc2c7858cd1b0d970a62f4a7'
          async function read() {
            const api = R.makeReadApi(process.env.GITHUB_TOKEN)
            const current = async () => (await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha
            if (await current() !== expected) throw Error('changed_release')
            const prior = R.API_ROOT+'/actions/runs/45373389110'
            const archive = await api('GET',prior)
            const receipts = await api('GET',prior+'/artifacts?per_page=30')
            const digest = 'sha256:c46ce092bfb91935ce829c871026a1136bf465920a3caa9184604f052c55798c'
            if (archive.id!==45373389110 || archive.head_sha!=='e1e3d25e42522639e2b82b4bdf32b155a547a184' || archive.run_attempt!==1 ||
                archive.repository.id!==1342493152 || archive.head_branch!=='ops/1566-max-archive-inventory-20261123' ||
                archive.status!=='completed' || archive.conclusion!=='success' || receipts.total_count!==1 ||
                receipts.artifacts[0].id!==14910511299 || receipts.artifacts[0].digest!==digest ||
                receipts.artifacts[0].expired || receipts.artifacts[0].name!=='issue-1566-main-max-archive-inventory') throw Error('previous_archive_unverified')
            const {setTimeout: pause} = require('node:timers/promises')
            for (let attempt = 0; attempt < 44; attempt++) {
              if (await current() !== expected) throw Error('changed_release')
              const install = await api('GET',R.API_ROOT+'/actions/runs/45535726710')
              if (install.id !== 45535726710 || install.repository.id !== 1342493152 ||
                  install.head_sha !== expected || install.run_attempt !== 1 ||
                  install.event !== 'push' || install.path !== '.github/workflows/deploy.yml') throw Error('installation_identity_changed')
              if (install.status === 'completed') {
                if (install.conclusion !== 'success') throw Error('current_installation_failed')
                try {
                  const record = await R.readRecord(api)
                  const actual = await R.resolveCurrent(api, {sha:expected}, record)
                  if (!actual.ready || !/^[a-f0-9]{40}$/.test(actual.application_sha) ||
                      actual.repository_sha !== expected) throw Error('accepted_release_mismatch')
                  // This job uses the installed reader under the shared read lease.
                  // Publisher admission remains in the write workflow.
                  const latest = await R.readRecord(api)
                  if (record.blob !== latest.blob || record.record_digest !== latest.record_digest ||
                      await current() !== expected) throw Error('accepted_release_changed')
                  require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'VERIFIED_MAX_APP='+actual.application_sha+'\n')
                  console.log('MAX_NEXT_TWELVE_RELEASE_ACCEPTED='+expected)
                  return
                } catch (error) {
                  if (!['release_pending','diagnostics_unconfirmed','accepted_release_mismatch'].includes(error.code || error.message)) throw error
                }
              }
              if (attempt < 43) await pause(15000)
            }
            throw Error('current_installation_timeout')
          }
          read().catch(e=>{console.error('release_refused='+(e.code||e.message||'accepted_release_unavailable'));process.exitCode=1})
          NODE
      - name: Prepare the scoped MAX and registry readback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          use function AnyTour\ExistingPostBatch\maxTransferRead;
          ini_set('display_errors','0');
          function checkEvidence(bool $ok,string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          $root='/var/www/anytoour/data/www/app.anytoour.ru';
          $sha='VERIFIED_MAX_APPLICATION_SHA';
          $base='/var/www/anytoour/data/channel-post-operations';
          $channelId='-68765999669267';
          $out=['application_sha'=>$sha,'ok'=>false,'provider_writes'=>0,'db_writes'=>0,'rows'=>[]];
          ob_start();
          try {
              checkEvidence(getcwd()===$root && trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD'))===$sha,'installed_release_changed');
              require_once $root.'/config.php';
              require_once $root.'/services/ChannelPostEntryService.php';
              require_once $root.'/services/ChannelPostButtonTransport.php';
              require_once $root.'/tools/anytour_existing_post_max_transfer.php';
              checkEvidence(ProjectConfig::projectId()==='anytour','unexpected_project');
              $lockPath=$base.'/monitor-price-after-collection-v1.jsonl';
              checkEvidence(is_file($lockPath)&&!is_link($lockPath),'editor_lock_unavailable');
              $lease=fopen($lockPath,'rb'); checkEvidence(is_resource($lease)&&flock($lease,LOCK_SH|LOCK_NB),'editor_busy');
              $db=ConversationDb::connection();
              $db->exec('SET TRANSACTION READ ONLY');
              $db->beginTransaction();
              try {
                  $registry=new ChannelPostRegistryService($db);
                  foreach (json_decode('[{"hotel_id":73343,"target_url":"https://max.ru/anytour/AaBnNxELfuU","target_mid":"mid.ffffc1752b045fed01a06737110b7ee5","target_ms":1788438057227,"caption_sha":"f6665336d33164b48e1d9ebbe0741e98ba19e00f85a2bbc5233156c816111dec","source_photo_id":"50802552584"},{"hotel_id":43689,"target_url":"https://max.ru/anytour/AaBxuxe-Jxk","target_mid":"mid.ffffc1752b045fed01a071bb17be2719","target_ms":1788614481854,"caption_sha":"fc14f13e536336708ede644d2404776f1c9160825b6984aa5aa3fe850d9521f6","source_photo_id":"51698605832"},{"hotel_id":139,"target_url":"https://max.ru/anytour/AaCAxCRDffc","target_mid":"mid.ffffc1752b045fed01a080c424437df7","target_ms":1788866733123,"caption_sha":"595fae8339931d1fe2e82fcbf3934bc9eb481a601e99d3814625b7e41c9350a9","source_photo_id":"49100459784"}]',true,16,JSON_THROW_ON_ERROR) as $row) {
                      try {
                          $mid=$row['target_mid'];
                          $p=$base.'/anytour-1566-main-max-'.substr(hash('sha256',$channelId.'|'.$mid),0,36).'/receipt.jsonl';
                          checkEvidence(is_file($p)&&!is_link($p)&&filesize($p)<65536,'durable_receipt_unavailable');
                          $events=[];
                          foreach (file($p,FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES) as $line) {
                              $e=json_decode($line,true,32,JSON_THROW_ON_ERROR);
                              $events[]=array_intersect_key($e,array_flip(['state','publication_id','version_id','reason','provider_explicit_success','provider_error_http']));
                          }
                          [$message,$snapshot]=maxTransferRead(['message_id'=>$mid,'url'=>$row['target_url'],'channel_id'=>$channelId]);
                          $q=$db->prepare('SELECT id FROM post_publications WHERE post_channel_id=4 AND external_message_id=? LIMIT 3');
                          $q->execute([$mid]);
                          $matches=$q->fetchAll(PDO::FETCH_COLUMN);
                          $q->closeCursor();
                          $pr=count($matches)===1?$registry->publication((int)$matches[0]):null;
                          $button=is_array($pr)?ChannelPostButtonTransport::buttonUrl($pr):'';
                          $resolved=is_array($pr)?ChannelPostEntryService::resolve('max',$pr['start_payload'],$registry):null;
                          $one=is_array($pr)&&$button!==''&&ChannelPostIncomingAdapter::containsOnlyButton($snapshot,$button,(string)$pr['channel']['button_text']);
                          $out['rows'][]=['hotel_id'=>$row['hotel_id'],'target_mid'=>$mid,'target_url'=>$row['target_url'],
                              'history_identity'=>(int)$message['timestamp']===$row['target_ms'] && ($snapshot['post_url']??null)===$row['target_url'],
                              'caption_matches'=>hash_equals($row['caption_sha'],hash('sha256',$snapshot['text'])),
                              'source_photo_matches'=>count($snapshot['attachments'])===1 && (string)($snapshot['attachments'][0]['photo_id']??'')===$row['source_photo_id'],
                              'native_one_expected_button'=>$one,'registry_match_count'=>count($matches),
                              'registry_state'=>$pr['state']??null,'registry_publication_id'=>$pr['publication_id']??null,'registry_version'=>$pr['version_id']??null,
                              'registry_hotel'=>(int)($pr['snapshot']['metadata']['hotel_catalog_id']??0),
                              'registry_price_ref'=>(int)($pr['snapshot']['metadata']['monitor_price_record_id']??0),
                              'resolved_hotel_context'=>is_array($resolved)&&is_array($pr)&&(int)($resolved['publication_id']??0)===(int)$pr['publication_id']
                                  &&(int)($resolved['version_id']??0)===(int)$pr['version_id']&&(int)($resolved['snapshot']['metadata']['hotel_catalog_id']??0)===$row['hotel_id'],
                              'durable_events'=>$events];
                      } catch(Throwable $e) {
                          $out['rows'][]=['hotel_id'=>$row['hotel_id'],'failure'=>preg_match('/\A[a-z_]{3,64}\z/D',$e->getMessage())?$e->getMessage():'read_failed'];
                      }
                  }
              } finally { $db->rollBack();fclose($lease); }
              checkEvidence(trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD'))===$sha,'installed_release_changed');
              $out['observed_utc']=gmdate(DATE_ATOM);
              $out['ok']=true;
          } catch(Throwable $e) { $out['failure']=preg_match('/\A[a-z_]{3,64}\z/D',$e->getMessage())?$e->getMessage():'read_failed'; }
          ob_end_clean();
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($out['ok']?0:2);
          PHP
          python3 - <<'PYBIND'
          import os,pathlib,re
          path=pathlib.Path('pub/read-only.php')
          source=path.read_text()
          app=os.environ['VERIFIED_MAX_APP']
          assert re.fullmatch('[a-f0-9]{40}',app) and source.count('VERIFIED_MAX_APPLICATION_SHA')==1
          path.write_text(source.replace('VERIFIED_MAX_APPLICATION_SHA',app))
          PYBIND
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read three exact edited MIDs, their registry versions and durable receipts
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); assert d.get("ok") and d.get("provider_writes")==d.get("db_writes")==0 and [r["hotel_id"] for r in d["rows"]]==[73343,43689,139]; print("MAX_ATTEMPTED_THREE_SERVER_READ="+json.dumps(d,separators=(",",":"))); print("MAX_NATIVE_JSON_SHA256="+__import__("hashlib").sha256(open("pub/registry.json","rb").read()).hexdigest())'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-attempted-three-server-readback
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
