name: "Telegram 927: one fresh offer after confirmed original version"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '72fcb74f54732b7a03b4c2d6482f40f173383195' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare one new offer for the recovered Telegram post
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'caption'=>$caption,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function priceRows(array $ids): array {
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_xml');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_xml');
              $xp=new DOMXPath($doc);
              $result = [];
              $now=new DateTimeImmutable('now',new DateTimeZone('Europe/Moscow'));
              foreach($ids as $id) {
                  try {
                      $pair=[];
                      foreach(['max','tg'] as $platform){
                          $q=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$platform.'_'.$id.'"]');
                          requireEdit($q->length===1,'missing_or_duplicate_feed_offer');
                          $o=$q->item(0);
                          $get=static function(string $name) use($xp,$o):string{
                              $x=$xp->query('./'.$name,$o);
                              requireEdit($x->length===1,'invalid_'.$name);
                              return $x->item(0)->textContent;
                          };
                          $desc=$get('description');
                          $pattern='~^💰 От (?<amount>[0-9][0-9 ,.\x{00a0}\x{202f}]*) ₽ за двоих\n✈️ Вылет из [^\n]+ (?<date>\d{2}\.\d{2}\.\d{4}) · [1-9][0-9]* ноч(?:ь|и|ей)\n👥 2 взрослых\n🛏 [^\n]+\n🍽 [^\n]+\nЦена найдена мониторингом (?<observed>\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\. Стоимость и наличие могут измениться\.$~mu';
                          requireEdit(preg_match_all($pattern,$desc,$m,PREG_SET_ORDER)===1,'missing_or_ambiguous_price_block');
                          $a=$m[0];$value=str_replace(',','.',preg_replace('/[\s\x{00a0}\x{202f}]/u','',$a['amount']));
                          $price=$get('price');
                          requireEdit($get('currencyId')==='RUB'&&preg_match('/^[1-9][0-9]*(?:\.[0-9]{1,2})?$/D',$price)&& (float)$value===(float)$price,'amount_mismatch');
                          $obs=DateTimeImmutable::createFromFormat('!d.m.Y, H:i',$a['observed'],$now->getTimezone());
                          $departure=DateTimeImmutable::createFromFormat('!d.m.Y',$a['date'],$now->getTimezone());
                          requireEdit($obs && $obs->format('d.m.Y, H:i')===$a['observed'] && $obs<=$now
                              && $now->getTimestamp()-$obs->getTimestamp()<129600,'observation_outside_36h');
                          requireEdit($departure && $departure->format('d.m.Y')===$a['date'] && $departure>=$now->setTime(0,0),'past_departure');
                          $pair[]= ['block'=>$a[0],'price'=>$price,'observation'=>$obs->format(DATE_ATOM),'departure'=>$departure->format('Y-m-d')];
                      }
                      requireEdit($pair[0]===$pair[1],'platform_offer_mismatch');
                      $result[$id]=$pair[0];
                  } catch (Throwable $e) {
                      $result[$id]=['reason'=>$e->getMessage()];
                  }
              }
              return $result;
          }
          function priceValue(string $text): ?int {
              if(!preg_match('/^💰 От ([0-9\x{00A0}\x{202F} ]+) ₽ за двоих/mu',$text,$m)) return null;
              return (int)preg_replace('/\D/u','',$m[1]);
          }
          function safeReason(Throwable $e): string {
              $m=$e->getMessage();
              return preg_match('/\A[a-z_0-9]{1,100}\z/D',$m)?$m:'exact_preflight_failed';
          }
          function feedBlock(string $platform,string $offerId): array {
              $file='hotel-posts-'.$platform.'.xml';
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/'.$file,12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_split_feed');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_split_feed');
              $xp=new DOMXPath($doc);
              $offer=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$offerId.'"]');
              requireEdit($offer->length===1,'split_offer_identity_changed');
              $fields=[];
              foreach(['price','currencyId','description'] as $key) {
                  $values=$xp->query('./'.$key,$offer->item(0));
                  requireEdit($values->length===1,'invalid_split_offer');
                  $fields[]=$values->item(0)->textContent;
              }
              return $fields;
          }
          function persistRevision(string $path,array $receipt,bool $initial=false): void {
              $staged=$initial?$path:tempnam(dirname($path),'price-');
              requireEdit(is_string($staged)&&!is_link($path),'price_revision_path_invalid');
              try {
                  $handle=fopen($staged,$initial?'x':'wb');
                  requireEdit(is_resource($handle),'price_revision_open_failed');
                  try{
                      $data=json_encode($receipt,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
                      requireEdit(fwrite($handle,$data)===strlen($data)&&fflush($handle)&&fsync($handle),'price_revision_sync_failed');
                  }finally{fclose($handle);}
                  if(!$initial) requireEdit(!is_link($path)&&rename($staged,$path),'price_revision_commit_failed');
              } finally {if(!$initial&&is_file($staged)) unlink($staged);}
          }
          function priceClaims(PDOStatement $q,int $id): int {
              $q->execute([$id]);$c=(int)$q->fetchColumn();$q->closeCursor();return $c;
          }
          $target=json_decode(<<<'DATA'
          {"mid":927,"hotel_id":73055,"date":"2024-11-13T11:09:13+00:00","photos":["5303281113382381294"],"links":[{"text":"Подписаться на канал AnyTour - любые туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}],"publication":3690,"version":13471}
          DATA,true,24,JSON_THROW_ON_ERROR);
          $out=['ok'=>false,'publication'=>3690,'old_version'=>13471,'mid'=>927,'telegram_writes'=>0];
          try {
              installedEdit('c3d763f828d2f88e006d222766c6be3b3656afe9');
              umask(0077);
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
              }finally{ob_end_clean();}
              requireEdit(ProjectConfig::projectId()==='anytour','wrong_project');
              $ops='/var/www/anytoour/data/channel-post-operations';
              $path=$ops.'/monitor-price-after-collection-v1.jsonl';
              requireEdit(is_file($path)&&!is_link($path),'original_price_lock_missing');
              $lock=fopen($path,'rb');
              requireEdit(is_resource($lock)&&flock($lock,LOCK_EX|LOCK_NB),'shared_editor_busy');
              $journal=$ops.'/promoted-hotel-price-revisions-v1';
              requireEdit(is_dir($journal)&&!is_link($journal)&&realpath($journal)===$journal&&(fileperms($journal)&0077)===0,'invalid_journal_permissions');
              $receiptFile=$journal.'/3690.json';
              $pdo=ConversationDb::connection();
              $registry=new ChannelPostRegistryService($pdo);
              $id=3690;$vid=13471;$mid=927;$hotel=73055;$url='https://t.me/anytour/927';$channel='-1001845835645';
              $post=$registry->publication($id);
              requireEdit(is_array($post)&&$post['state']==='sent'&&$post['platform']==='telegram'&&$post['channel_id']===$channel
                  &&$post['project_key']==='anytour'&&$post['external_message_id']===(string)$mid
                  &&($post['snapshot']['post_url']??null)===$url&&(int)($post['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel,
                  'confirmed_address_binding_unavailable');
              $snap=$post['snapshot'];
              $photo=$snap['attachments'][0]['file_unique_id']??'';
              $button=ChannelPostButtonTransport::buttonUrl($post);
              $label=$post['channel']['button_text'];
              $expectedButtons=[['text'=>$label,'url'=>$button]];
              $page=publicTelegram($mid);
              $context=ChannelPostEntryService::resolve('telegram',$post['start_payload'],$registry);
              requireEdit($photo!==''&&count($snap['attachments'])===1&&$button!==''&&$page['caption']===$snap['text']
                  &&$page['date']===$target['date']&&$page['photos']===$target['photos']&&$page['videos']===0&&$page['links']===$target['links']
                  &&$page['buttons']===$expectedButtons&&(int)($context['publication_id']??0)===$id&&
                  (int)($context['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel,'address_public_preimage_changed');
              $out['previous_amount']=priceValue($page['caption']);
              $max=feedBlock('max','max_'.$hotel);
              $tg=feedBlock('telegram','tg_'.$hotel);
              $offer=priceRows([$hotel])[$hotel];
              requireEdit(isset($offer['block'],$offer['price'],$offer['observation']),'fresh_address_offer_unavailable');
              requireEdit($max[0]===$offer['price']&&$tg[0]===$offer['price']&&$max[1]==='RUB'&&$tg[1]==='RUB'&&
                  substr_count($max[2],$offer['block'])===1&&substr_count($tg[2],$offer['block'])===1,'split_feeds_and_combined_disagree');
              $out['offer']=['amount'=>(int)$offer['price'],'lines'=>explode("\n",$offer['block']),
                  'observed'=>$offer['observation'],'departure'=>$offer['departure']];
              $next=PromotedHotelPriceWriter::revision($snap['text'],$offer['block'],true);
              if($next===$page['caption']){
                  requireEdit(str_ends_with($next,$offer['block']),'newer_price_already_present');
                  $out['writer']='already_current';$out['version']=$post['version_id'];$out['public_verified']=true;$out['ok']=true;
              }else{
                  requireEdit((int)$post['version_id']===$vid&&$out['previous_amount']===126963&&!file_exists($receiptFile)&&!is_link($receiptFile),
                      'address_version_or_prior_price_journal_changed');
                  $claim=$pdo->prepare("SELECT COUNT(*) FROM post_versions WHERE publication_id=? AND
                      (state IN ('claimed','write_started','unknown') OR claim_token IS NOT NULL OR claimed_at IS NOT NULL)");
                  requireEdit(priceClaims($claim,$id)===0,'publication_has_active_writer');
                  $entities=$snap['markup'];
                  $old16=mb_convert_encoding($snap['text'],'UTF-16LE','UTF-8');
                  $next16=mb_convert_encoding($next,'UTF-16LE','UTF-8');
                  foreach($entities as $span){
                      $start=$span['offset']??null;$length=$span['length']??null;
                      requireEdit(is_int($start)&&$start>=0&&is_int($length)&&$length>0&&($start+$length)*2<=min(strlen($old16),strlen($next16))
                          &&substr($old16,$start*2,$length*2)===substr($next16,$start*2,$length*2),'address_price_overlaps_original_link');
                  }
                  requireEdit((new ChannelPostButtonTransport())->verifyChannel($post['channel'])['state']==='ready','channel_edit_rights_unavailable');
                  $now=time();$observed=strtotime($offer['observation']);
                  requireEdit(is_int($observed)&&$observed<=$now&&$now-$observed<129600&&$registry->publication($id)===$post
                      &&priceClaims($claim,$id)===0,'publication_or_price_changed_before_write');
                  $receipt=['state'=>'started','platform'=>'telegram','hotel'=>$hotel,'url'=>$url,'version'=>$vid,
                        'at'=>(int)floor(microtime(true)*1000),'next_hash'=>hash('sha256',$next)];
                  persistRevision($receiptFile,$receipt,true);
                  $out['telegram_writes']=1;
                  $response=ChannelPostApiTransport::captionRequest('telegram',$channel,(string)$mid,
                      ['caption'=>$next,'caption_entities'=>$entities,'reply_markup'=>['inline_keyboard'=>[$expectedButtons]]]);
                  $out['provider_http']=$response['http'];
                  $raw=$response['data']['result']??null;
                  requireEdit(!$response['transport_error']&&$response['http']===200&&($response['data']['ok']??null)===true
                      &&is_array($raw)&&(int)($raw['message_id']??0)===$mid&&(string)($raw['chat']['id']??'')===$channel
                      &&($raw['chat']['username']??null)==='anytour'&&(int)($raw['edit_date']??0)>0,'provider_caption_response_unverified_no_retry');
                  $after=ChannelPostIncomingAdapter::telegramSnapshot($raw);
                  $out['same_photo']=is_array($after)&&count($after['attachments'])===1&&($after['attachments'][0]['file_unique_id']??null)===$photo;
                  $out['same_button']=is_array($after)&&ChannelPostIncomingAdapter::containsOnlyButton($after,$button,$label);
                  $out['same_date']=(int)($raw['date']??0)===(new DateTimeImmutable($target['date']))->getTimestamp();
                  $out['same_links']=is_array($after)&&$after['markup']===$entities;
                  requireEdit($out['same_photo']&&$out['same_button']&&$out['same_date']&&$out['same_links']
                      &&$after['post_url']===$url&&$after['text']===$next,'native_caption_readback_mismatch_no_retry');
                  $after['metadata']=array_replace($snap['metadata'],$after['metadata'],[
                      'source_event_id'=>'promoted-price:'.$id.':'.$receipt['at'],'observation_kind'=>'authorized_admin_content_edit',
                      'source_revision_ms'=>(string)((int)$raw['edit_date']*1000),'promoted_price_observed_at'=>gmdate(DATE_ATOM,$observed),
                  ]);
                  unset($after['metadata']['source_sequence'],$after['metadata']['source_sequence_scope']);
                  $after['content_hash']=ChannelPostIncomingAdapter::contentFingerprint($after,'',(string)$post['channel']['bot_url']);
                  $saved=$registry->registerPublication('anytour','telegram',$post['bot_key'],$channel,(string)$mid,$after);
                  requireEdit(is_array($saved)&&(int)$saved['publication_id']===$id&&$saved['start_payload']===$post['start_payload']
                      &&$saved['snapshot']['text']===$next,'price_registry_receipt_mismatch_no_retry');
                  if($saved['state']!=='sent'){
                      requireEdit($saved['state']==='pending'&&$registry->confirmObservedButton($id,(int)$saved['version_id'],
                          ['verified'=>true,'button_verified'=>true,'content_preserved'=>true,'write_attempts'=>0]),'price_registry_confirmation_failed_no_retry');
                  }
                  $final=$registry->publication($id);
                  requireEdit($final['state']==='sent'&&$final['snapshot']['text']===$next&&$final['version_id']===$saved['version_id'],
                      'price_registry_readback_mismatch_no_retry');
                  $receipt['state']='provider_verified';$receipt['new_version']=(int)$final['version_id'];
                  persistRevision($receiptFile,$receipt);
                  $out['writer']='provider_verified_public_pending';$out['version']=$final['version_id'];$out['public_verified']=false;
                  for($read=0;$read<3;$read++){
                      if($read>0)sleep(2);
                      try{
                          $seen=publicTelegram($mid);$out['last_public_amount']=priceValue($seen['caption']);
                          if($seen['caption']===$next&&$seen['date']===$page['date']&&$seen['photos']===$page['photos']
                              &&$seen['links']===$page['links']&&$seen['buttons']===$expectedButtons){
                              $out['public_verified']=true;$out['writer']='updated';
                              $receipt['state']='verified';persistRevision($receiptFile,$receipt);break;
                          }
                      }catch(Throwable $ignore){}
                  }
                  $out['ok']=$out['public_verified'];
              }
          }catch(Throwable $error){$out['hold']=safeReason($error);}
          finally{if(isset($lock)&&is_resource($lock))fclose($lock);}
          $out['at']=gmdate(DATE_ATOM);
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Use the installed caption editor for only Telegram 927
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("ADDRESS_927_FRESH_PRICE="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("telegram_writes") in (0,1) and d.get("publication")==3690'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-927-fresh-price
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
