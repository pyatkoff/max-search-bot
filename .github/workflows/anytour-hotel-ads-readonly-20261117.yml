name: Read Telegram hotel campaign candidates
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths:
      - .github/workflows/anytour-hotel-ads-readonly-20261117.yml
      - audit/anytour-hotel-ads-readonly-20261117.py
      - audit/anytour-hotel-ads-runner-20261117.py
permissions:
  contents: read
concurrency:
  group: anytour-hotel-ads-owner-20261117
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read Telegram feed, inactive campaigns and configured budgets
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: 6bbc7612bdb0c39ebc4e04e5a3d151f69be02afc742e7d4e4cdf61e089d62ed1
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/anytour-hotel-ads-runner-20261117.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-tg-campaign-audit-20261119
          path: encrypted-hotel-ads/*.enc.json
          retention-days: 7
          if-no-files-found: error


