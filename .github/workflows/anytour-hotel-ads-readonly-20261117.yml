name: "Aloft 1207: authorized caption and exact hotel button"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: anytour-authorized-channel-publication
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '9d74c11b46d1cb8f78404880abaa9257e10cfd3c' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out exact accepted server release tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9385571c86c45189c31d9c4aa904c23970e3b11a
          persist-credentials: false
          path: release-source
      - name: Authenticate the closed production installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const release = require('./release-source/tools/deployment_release');
          const source = '9385571c86c45189c31d9c4aa904c23970e3b11a';
          (async () => {
            const api = release.makeReadApi(process.env.GITHUB_TOKEN);
            const path = release.API_ROOT;
            const main = async () => (await api('GET', path + '/git/ref/heads/main'))?.object?.sha;
            const slot = () => api('GET', path + '/issues/comments/6682640708');
            const closed = x => x?.body === 'PR1633: установлено, выпуск свободен' &&
              x?.user?.id === 226193297 && x?.updated_at === '2026-11-20T01:05:28Z';
            if (await main() !== source || !closed(await slot())) throw new Error('release_source_or_slot_changed');
            const snapshot = await release.readRecord(api);
            const r = await release.resolveCurrent(api, {sha: source}, snapshot);
            const current = await release.readRecord(api);
            if (!r.ready || r.repository_sha !== source || r.application_sha !== source ||
                current.blob !== snapshot.blob || current.record_digest !== snapshot.record_digest ||
                await main() !== source || !closed(await slot())) throw new Error('closed_release_readback_changed');
            console.log('ALOFT1207_RELEASE_CLOSED=' + source);
          })().catch(e => { console.error(e?.code || e?.message || 'release_read_failed'); process.exitCode = 2; });
          JS
      - name: Prepare exact caption and hotel button program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $clips=[];
              foreach ($xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_video_duration').']',$root) as $v) {
                  $clips[]=[$v->tagName,$v->getAttribute('class'),$v->getAttribute('src'),$v->getAttribute('poster'),$v->getAttribute('style'),trim($v->textContent)];
              }
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'video_sha256s'=>array_map(static fn(array $x):string=>hash('sha256',json_encode($x,JSON_THROW_ON_ERROR)),$clips),
                  'video_duration_text'=>array_values(array_map(static fn(array $x):string=>$x[5],array_filter($clips,static fn(array $x):bool=>str_contains($x[1],'video_duration')))),
                  'caption'=>$caption,'caption_html'=>$captionHtml,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function priceRows(array $ids): array {
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_xml');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_xml');
              $xp=new DOMXPath($doc);
              $result = [];
              $now=new DateTimeImmutable('now',new DateTimeZone('Europe/Moscow'));
              foreach($ids as $id) {
                  try {
                      $pair=[];
                      foreach(['max','tg'] as $platform){
                          $q=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$platform.'_'.$id.'"]');
                          requireEdit($q->length===1,'missing_or_duplicate_feed_offer');
                          $o=$q->item(0);
                          $get=static function(string $name) use($xp,$o):string{
                              $x=$xp->query('./'.$name,$o);
                              requireEdit($x->length===1,'invalid_'.$name);
                              return $x->item(0)->textContent;
                          };
                          $desc=$get('description');
                          $pattern='~^💰 От (?<amount>[0-9][0-9 ,.\x{00a0}\x{202f}]*) ₽ за двоих\n✈️ Вылет из [^\n]+ (?<date>\d{2}\.\d{2}\.\d{4}) · [1-9][0-9]* ноч(?:ь|и|ей)\n👥 2 взрослых\n🛏 [^\n]+\n🍽 [^\n]+\nЦена найдена мониторингом (?<observed>\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\. Стоимость и наличие могут измениться\.$~mu';
                          requireEdit(preg_match_all($pattern,$desc,$m,PREG_SET_ORDER)===1,'missing_or_ambiguous_price_block');
                          $a=$m[0];$value=str_replace(',','.',preg_replace('/[\s\x{00a0}\x{202f}]/u','',$a['amount']));
                          $price=$get('price');
                          requireEdit($get('currencyId')==='RUB'&&preg_match('/^[1-9][0-9]*(?:\.[0-9]{1,2})?$/D',$price)&& (float)$value===(float)$price,'amount_mismatch');
                          $obs=DateTimeImmutable::createFromFormat('!d.m.Y, H:i',$a['observed'],$now->getTimezone());
                          $departure=DateTimeImmutable::createFromFormat('!d.m.Y',$a['date'],$now->getTimezone());
                          requireEdit($obs && $obs->format('d.m.Y, H:i')===$a['observed'] && $obs<=$now
                              && $now->getTimestamp()-$obs->getTimestamp()<129600,'observation_outside_36h');
                          requireEdit($departure && $departure->format('d.m.Y')===$a['date'] && $departure>=$now->setTime(0,0),'past_departure');
                          $pair[]= ['block'=>$a[0],'price'=>$price,'observation'=>$obs->format(DATE_ATOM),'departure'=>$departure->format('Y-m-d')];
                      }
                      requireEdit($pair[0]===$pair[1],'platform_offer_mismatch');
                      $result[$id]=$pair[0];
                  } catch (Throwable $e) {
                      $result[$id]=['reason'=>$e->getMessage()];
                  }
              }
              return $result;
          }
          function fromRegistry(PDO $pdo, ChannelPostRegistryService $registry,int $channel,int $mid): ?array {
              $q=$pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=? LIMIT 2');
              $q->execute([$channel,(string)$mid]); $ids=$q->fetchAll(PDO::FETCH_COLUMN);$q->closeCursor();
              requireEdit(count($ids)<=1,'publication_duplicate');
              return $ids ? $registry->publication((int)$ids[0]) : null;
          }
          function recordVersion(?array $post): ?array {
              if ($post===null) return null;
              return ['id'=>$post['publication_id'],'version'=>$post['version_id'],'state'=>$post['state'],
                  'hash'=>$post['content_hash'],'hotel_id'=>$post['snapshot']['metadata']['hotel_catalog_id']??null,
                  'url'=>$post['snapshot']['post_url']??null,'caption'=>$post['snapshot']['text']??null,
                  'media_types'=>array_column($post['snapshot']['attachments']??[],'type')];
          }
          
          
          $baseline=json_decode(<<<'BASE'
          {"date":"2025-09-23T10:27:57+00:00","captionHash":"b2f19ba15412fbff79de5c560617cb85e52d276c8ba972bae659975825805346","buttons":[{"text":"СВЯЗАТЬСЯ С МЕНЕДЖЕРОМ 📱","url":"https://t.me/AnyTour_MSK"}],"video":["8e893fc0574e6f7e7dbf00c1d6910ba1e735962880a8c11e53d9b18c9469cdc1","ab19e4b3015a33d11a71376906c28d6822625a42a00432847b57d9d8f290c7c8"],"links":[{"text":"201 061 RUB","url":"https://anytour.online/poisk-turov/7q8s8lo4r0/"},{"text":"Подписаться на канал AnyTour - Горящие туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}]}
          BASE,true,10,JSON_THROW_ON_ERROR);
          function capture($file,array $row):void{
              $line=json_encode($row,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL;
              requireEdit(fwrite($file,$line)===strlen($line) && fflush($file) && fsync($file),'journal_write_failed');
          }
          
          const INSTALLED='9385571c86c45189c31d9c4aa904c23970e3b11a';
          const TARGET='-1001845835645';
          const MID=1207;
          const CHANNEL=6;
          const HOTEL=61159;
          const POST_DATE=1758623277;
          const POST_URL='https://t.me/anytour/1207';
          const LABEL='✈️ Рассчитать на мои даты';
          const OP='anytour-issue1566-aloft-telegram-1207-caption-v1';
          const JOURNAL='/var/www/anytoour/data/channel-post-operations';
          
          function bootAloft(): void {
              installedEdit(INSTALLED);
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/services/ChannelPostAutomationService.php';
              } finally { ob_end_clean(); }
          }
          
          function samePublicVideo(array $public,array $original): bool {
              return $public['date']===$original['date'] && $public['photos']===[] && $public['videos']===2
                  && $public['video_sha256s']===$original['video'];
          }
          
          function utf16Length(string $s): int {
              return intdiv(strlen(mb_convert_encoding($s,'UTF-16LE','UTF-8')),2);
          }
          
          function captionEntity(string $caption,string $needle,string $type): array {
              $pos=strpos($caption,$needle);
              requireEdit($pos!==false && strpos($caption,$needle,$pos+strlen($needle))===false,'entity_anchor_changed');
              return ['type'=>$type,'offset'=>utf16Length(substr($caption,0,$pos)),'length'=>utf16Length($needle)];
          }
          
          function plannedCaption(string $original,array $offer,array $subscription): array {
              $start=strpos($original,"\n\nПредложение на двоих взрослых с вылетом из Москвы:");
              $end=strpos($original,"\n\nПо кнопке ниже вы можете быстро и легко забронировать подходящий вам тур");
              requireEdit($start!==false && $end!==false && $end>$start
                  && str_ends_with($original,"\n\n".$subscription['text']), 'old_offer_boundaries_changed');
              $description=substr($original,0,$start);
              $remaining=substr($original,$end);
              $caption="Aloft Palm Jumeirah\n\n".$description."\n\n".$offer['block'].$remaining;
              requireEdit(utf16Length($caption)<=1024
                  && str_contains($caption,$description) && !str_contains($caption,'201 061 RUB'),'caption_scope_or_length');
              $links=[
                  captionEntity($caption,'Очень популярный отель в Дубае на острове Пальм Джумейра🧡','bold'),
                  captionEntity($caption,'Aloft Palm Jumeirah 4*','italic'),
                  captionEntity($caption,'Плюсы отеля:','underline'),
                  captionEntity($caption,$subscription['text'],'text_link')+['url'=>$subscription['url']],
                  captionEntity($caption,$subscription['text'],'bold'),
                  captionEntity($caption,$subscription['text'],'underline'),
              ];
              return [$caption,$links];
          }
          
          function nativeSnapshot(array $msg,string $caption): array {
              requireEdit((string)($msg['chat']['id']??'')===TARGET && ($msg['chat']['username']??'')==='anytour'
                  && ($msg['message_id']??0)===MID && ($msg['date']??0)===POST_DATE
                  && ($msg['edit_date']??0)>0,'native_message_or_date_mismatch');
              $snap=ChannelPostIncomingAdapter::telegramSnapshot($msg);
              requireEdit(is_array($snap) && $snap['text']===$caption && $snap['post_url']===POST_URL
                  && ($snap['metadata']['capability']??'')==='supported'
                  && (int)($snap['metadata']['hotel_catalog_id']??0)===HOTEL
                  && count($snap['attachments']??[])===1 && ($snap['attachments'][0]['type']??'')==='video'
                  && ($snap['attachments'][0]['provider']??'')==='telegram'
                  && !empty($snap['attachments'][0]['file_unique_id']),'native_caption_or_video_unconfirmed');
              return $snap;
          }
          
          function videoProof(array $snap): string {
              return hash('sha256',$snap['attachments'][0]['file_unique_id']);
          }
          
          function exactContext(ChannelPostRegistryService $registry,array $registered): bool {
              $ctx=ChannelPostEntryService::resolve('telegram',$registered['start_payload'],$registry);
              return (int)($ctx['publication_id']??0)===(int)$registered['publication_id']
                  && (int)($ctx['version_id']??0)===(int)$registered['version_id']
                  && (int)($ctx['snapshot']['metadata']['hotel_catalog_id']??0)===HOTEL
                  && ($ctx['snapshot']['post_url']??'')===POST_URL;
          }
          
          $out=['ok'=>false,'mid'=>MID,'hotel_id'=>HOTEL,'url'=>POST_URL,'state'=>'not_written','provider_writes'=>0];
          $lock=false;
          $journal=null;
          try {
              bootAloft();
              $pdo=ConversationDb::connection();
              $registry=new ChannelPostRegistryService($pdo);
              $bot=(string)(ChannelPostRuntime::identity('telegram')['bot_key']??'');
              $channel=$registry->channel('anytour','telegram',$bot,TARGET);
              requireEdit(is_array($channel) && (int)$channel['id']===CHANNEL && (int)$channel['config_version']===2
                  && $channel['source_key']==='tg_anytour_msk' && $channel['button_text']===LABEL
                  && $channel['bot_url']==='https://t.me/anyru_bot','channel_mismatch');
              requireEdit((new ChannelPostButtonTransport())->verifyChannel($channel)['state']==='ready','native_edit_rights_unavailable');
              requireEdit(realpath(JOURNAL)===JOURNAL && is_dir(JOURNAL),'journal_root_invalid');
              $journalPath=JOURNAL.'/'.OP;
              requireEdit(!file_exists($journalPath) && !is_link($journalPath),'existing_receipt_hold');
              $q=$pdo->prepare('SELECT GET_LOCK(?,0)');
              $q->execute([OP]);
              $lock=(int)$q->fetchColumn()===1;
              $q->closeCursor();
              requireEdit($lock,'target_lock_busy');
          
              $current=publicTelegram(MID);
              requireEdit(samePublicVideo($current,$baseline) && $current['caption_sha256']===$baseline['captionHash']
                  && $current['links']===$baseline['links'] && $current['buttons']===$baseline['buttons'],'original_post_changed');
              requireEdit(fromRegistry($pdo,$registry,CHANNEL,MID)===null,'existing_target_requires_readback');
              $source=recordVersion(fromRegistry($pdo,$registry,10,428));
              requireEdit(is_array($source) && (int)$source['hotel_id']===HOTEL && (int)$source['id']===951
                  && $source['state']==='sent' && $source['url']==='https://t.me/any_toour/428','source_hotel_mapping_changed');
              $offer=priceRows([HOTEL])[HOTEL];
              requireEdit(isset($offer['block']),'fresh_offer_unavailable_'.($offer['reason']??'unknown'));
              [$caption,$entities]=plannedCaption($current['caption'],$offer,$baseline['links'][1]);
              $fixture=['chat'=>['id'=>(int)TARGET,'type'=>'channel','username'=>'anytour'],'message_id'=>MID,'date'=>POST_DATE,
                  'edit_date'=>time(),'video'=>['file_id'=>'preflight-only','file_unique_id'=>'preflight-only'],'caption'=>$caption,
                  'caption_entities'=>$entities,'reply_markup'=>['inline_keyboard'=>[$current['buttons']]]];
              nativeSnapshot($fixture,$caption);
              $fixture['caption']=$current['caption'];
              requireEdit((ChannelPostIncomingAdapter::telegramSnapshot($fixture)['metadata']['capability']??'')==='requires_attention',
                  'unexpected_legacy_caption_support');
              requireEdit($registry->channel('anytour','telegram',$bot,TARGET)===$channel
                  && fromRegistry($pdo,$registry,CHANNEL,MID)===null,'write_target_changed');
              installedEdit(INSTALLED);
              $out['preflight']=['passed'=>true,'ready_editor'=>true,'old_video_and_date_match'=>true,'legacy_caption_ineligible'=>true,
                  'planned_caption_supported'=>true,'planned_caption_units'=>utf16Length($caption),'source_version'=>(int)$source['version']];
              $out['offer']=$offer;
              $out['caption_sha256']=hash('sha256',$caption);
              requireEdit(!file_exists($journalPath) && !is_link($journalPath) && mkdir($journalPath,0700),'edit_receipt_already_exists');
              $journal=fopen($journalPath.'/receipt.jsonl','x');
              requireEdit(is_resource($journal),'edit_receipt_unavailable');
              capture($journal,array_replace($out,['state'=>'caption_attempt_started']));
              $out['state']='caption_unknown_hold';
              ++$out['provider_writes'];
              $response=ChannelPostApiTransport::captionRequest('telegram',TARGET,(string)MID,[
                  'caption'=>$caption,'caption_entities'=>$entities,'reply_markup'=>['inline_keyboard'=>[$current['buttons']]],
              ]);
              $out['caption_http']=(int)($response['http']??0);
              $data=$response['data']??null;
              if (!(empty($response['transport_error']) && $out['caption_http']===200
                  && ($data['ok']??false)===true && is_array($data['result']??null))) {
                  if (empty($response['transport_error']) && in_array($out['caption_http'],[400,401,403,404,429],true)
                      && ($data['ok']??null)===false) {
                      $out['state']='caption_rejected';
                      $out['telegram_error']=(int)($data['error_code']??0);
                      $description=(string)($data['description']??'');
                      if (preg_match('/\A[A-Za-z0-9 .,():_!\-]{1,200}\z/D',$description)) $out['telegram_description']=$description;
                  }
                  throw new RuntimeException('caption_provider_not_confirmed');
              }
              $msg=$data['result'];
              $snap=nativeSnapshot($msg,$caption);
              $snap['metadata']['logical_id']='commercial-main-hotel-61159-v1';
              $snap['metadata']['source_event_id']=OP.':'.$msg['edit_date'];
              $snap['metadata']['observation_kind']='authorized_admin_content_edit';
              $snap['metadata']['promoted_price_observed_at']=$offer['observation'];
              $snap['content_hash']=ChannelPostIncomingAdapter::contentFingerprint($snap,'',$channel['bot_url']);
              $videoHash=videoProof($snap);
              $out['caption_confirmed']=true;
              $out['state']='caption_confirmed_button_pending';
              capture($journal,$out+['video_binding'=>$videoHash]);
              $p=$registry->registerPublication('anytour','telegram',$bot,TARGET,(string)MID,$snap);
              requireEdit(is_array($p) && ($p['external_message_id']??'')===(string)MID
                  && ($p['snapshot']['text']??'')===$caption && ($p['snapshot']['post_url']??'')===POST_URL
                  && videoProof($p['snapshot'])===$videoHash && exactContext($registry,$p),'hotel_button_context_unconfirmed');
              $out['publication_id']=(int)$p['publication_id'];
              $out['version_id']=(int)$p['version_id'];
              $out['context_verified']=true;
              $buttonUrl=ChannelPostButtonTransport::buttonUrl($p);
              requireEdit(str_starts_with($buttonUrl,'https://t.me/anyru_bot?start='),'button_destination_invalid');
          
              $nativeButtonVerified=false;
              $stableVideo=false;
              $transport=new ChannelPostButtonTransport(static function ($platform,$method,$path,$query,$body)
                  use (&$out,&$nativeButtonVerified,&$stableVideo,$videoHash,$caption,$buttonUrl) {
                  requireEdit($platform==='telegram' && $method==='POST' && $query===[]
                      && (in_array($path,['getMe','getChat','getChatMember'],true) ||
                          ($path==='editMessageReplyMarkup' && (string)($body['chat_id']??'')===TARGET
                              && (int)($body['message_id']??0)===MID
                              && ($body['reply_markup']['inline_keyboard']??[])===[[['text'=>LABEL,'url'=>$buttonUrl]]]
                              && !isset($body['media']))),'outside_exact_button_scope');
                  if ($path==='editMessageReplyMarkup') {
                      ++$out['provider_writes'];
                      $out['state']='button_unknown_hold';
                  }
                  $resp=ChannelPostApiTransport::buttonRequest($platform,$method,$path,$query,$body);
                  if ($path==='editMessageReplyMarkup') {
                      $out['button_http']=(int)($resp['http']??0);
                      $native=$resp['data']['result']??null;
                      if ($out['button_http']===200 && ($resp['data']['ok']??false)===true && is_array($native)) {
                          $after=nativeSnapshot($native,$caption);
                          $stableVideo=hash_equals($videoHash,videoProof($after));
                          $nativeButtonVerified=$stableVideo && ChannelPostIncomingAdapter::containsOnlyButton($after,$buttonUrl,LABEL);
                          requireEdit($nativeButtonVerified,'native_button_or_video_unconfirmed');
                      }
                  }
                  return $resp;
              });
              if ($p['state']==='pending') {
                  $work=(new ChannelPostAutomationService($registry,$transport))
                      ->processPublication('anytour','telegram',$bot,$out['publication_id'],$out['version_id']);
                  $out['worker_state']=$work['state']??'unknown';
                  $out['worker_reason']=$work['reason']??'unknown';
              }
              $out['native_button_verified']=$nativeButtonVerified;
              $out['file_unique_id_unchanged_across_native_receipts']=$stableVideo;
              $fresh=$registry->publication($out['publication_id']);
              $out['registry_state']=$fresh['state']??'missing';
              requireEdit($nativeButtonVerified && ($fresh['state']??'')==='sent'
                  && (int)$fresh['version_id']===$out['version_id'] && exactContext($registry,$fresh)
                  && hash_equals($videoHash,videoProof($fresh['snapshot'])),'final_native_confirmation_missing');
              capture($journal,$out+['video_binding'=>$videoHash,'native_receipt_verified'=>true]);
              $out['ok']=true;
              $out['state']='native_verified';
          } catch(Throwable $e) {
              $m=$e->getMessage();
              $out['reason']=preg_match('/^[a-z_0-9]{1,100}$/D',$m)?$m:'operation_failed';
          } finally {
              if (is_resource($journal)) {
                  try { capture($journal,$out); } catch(Throwable $e) { $out['journal_completion_failed']=true; }
                  fclose($journal);
              }
              if ($lock) {
                  $q=$pdo->prepare('SELECT RELEASE_LOCK(?)');
                  $q->execute([OP]);
                  $q->closeCursor();
              }
          }
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Apply caption and button only to existing Aloft 1207
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("ALOFT1207_NATIVE_EDIT="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("state")=="native_verified"'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aloft-1207-native-edit-receipt
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
