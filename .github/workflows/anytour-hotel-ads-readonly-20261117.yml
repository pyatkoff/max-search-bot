name: "Aloft 1207: isolated Telegram bot administrator read"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '721672627aabd2a8fbb3a7a776e6d2f3ddbd96cc' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated integration code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: source
      - name: Check and assemble the read-only integration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          php -l source/integrations/AnyTourTelegramAdministratorRead.php
          php -r '
            require "source/integrations/AnyTourTelegramAdministratorRead.php";
            if (AnyTourTelegramAdministratorRead::read(-1001845835644, true)["state"]!=="outside_exact_read_scope"
              || AnyTourTelegramAdministratorRead::read(-1001845835645, false)["state"]!=="outside_exact_read_scope") exit(2);
            $method = new ReflectionMethod(AnyTourTelegramAdministratorRead::class,"botRights");
            $supplied = [
              ["user"=>["is_bot"=>false,"username"=>"human_fixture","id"=>123],"can_edit_messages"=>true],
              ["user"=>["is_bot"=>true,"username"=>"example_bot","id"=>234],"can_edit_messages"=>true],
              ["user"=>["is_bot"=>true,"username"=>"invalid fixture"]],
            ];
            $expected=[["username"=>"example_bot","can_edit_messages"=>true,"can_post_messages"=>false]];
            if ($method->invoke(null,$supplied)!==$expected) exit(3);
            echo "EXACT_SCOPE_AND_BOT_ONLY_PROJECTION_VERIFIED\n";
          '
          cat source/integrations/AnyTourTelegramAdministratorRead.php > pub/read-only.php
          cat >> pub/read-only.php <<'PHP'
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          $out=['ok'=>false,'provider_writes'=>0];
          try {
              $sha='9385571c86c45189c31d9c4aa904c23970e3b11a';
              if (PHP_SAPI!=='cli' || getcwd()!=='/var/www/anytoour/data/www/app.anytoour.ru'
                  || trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD'))!==$sha
                  || trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no'))!=='') {
                  throw new RuntimeException('installed_checkout_changed');
              }
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
              } finally { ob_end_clean(); }
              $me=ChannelPostApiTransport::buttonRequest('telegram','POST','getMe',[],[]);
              $user=$me['data']['result']??null;
              if (($me['http']??0)!==200 || ($me['data']['ok']??false)!==true
                  || ($user['is_bot']??false)!==true || ($user['username']??'')!=='anyru_bot') {
                  throw new RuntimeException('installed_bot_identity_unconfirmed');
              }
              unset($me,$user);
              $out['verified_bot']='anyru_bot';
              $result=AnyTourTelegramAdministratorRead::read(-1001845835645,true);
              $out=array_replace($out,$result);
              $out['admin_read_attempts']=1;
          } catch(Throwable $e) {
              $value=$e->getMessage();
              $out['state']=preg_match('/\A[a-z_]{1,65}\z/D',$value)?$value:'isolated_read_failed';
          }
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read the Telegram bot-admin list through the isolated integration
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("TELEGRAM_ISOLATED_ADMIN_READ="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("provider_writes")==0'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-isolated-admin-read-receipt
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
