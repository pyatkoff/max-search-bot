name: "PRICE 70030 and 1439: run the existing hook for two catalog pairs"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'b126d3c4c60b959db7be7f50d6a91bb34a021c9f' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare the existing PRICE hook for the two exact roster rows
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors', '0');
          ini_set('log_errors', '0');
          
          const APPROVED_HOOK = '/var/www/anytoour/data/www/anytoour.ru/data/monitor-price-hook.php';
          const APPROVED_HOOK_HASH = '7245b007e8b7fe2d0c3e0fe7b60a9cdff108d0d8d7a6a7b9ef74d69d191baf3e';
          const ROSTER_BLOB = '9110e5237804ec3766d96ea5a26809822b296852';
          const HOTELS = [70030, 1439];
          
          function need(bool $condition, string $reason): void
          {
              if (!$condition) throw new RuntimeException($reason);
          }
          
          function canonicalSource(): string
          {
              need(realpath(APPROVED_HOOK) === APPROVED_HOOK && !is_link(APPROVED_HOOK), 'installed_hook_not_found');
              $source = file_get_contents(APPROVED_HOOK, false, null, 0, 2000001);
              need(is_string($source) && strlen($source) <= 2000000 && hash('sha256', $source) === APPROVED_HOOK_HASH,
                  'installed_hook_digest_changed');
              return $source;
          }
          
          function scopedSource(string $source): string
          {
              $packedPattern = '~^const HOOK_ROSTER_GZIP_B64="([A-Za-z0-9+/=]+)";$~m';
              need(preg_match_all($packedPattern, $source, $match) === 1, 'canonical_roster_constant_missing');
              $gzip = base64_decode($match[1][0], true);
              need(is_string($gzip) && sha1('blob '.strlen($gzip)."\0".$gzip) === ROSTER_BLOB, 'installed_roster_blob_changed');
              $full = json_decode(gzdecode($gzip), true, 64, JSON_THROW_ON_ERROR);
              need(is_array($full['rows'] ?? null), 'installed_roster_unreadable');
              $rows = array_values(array_filter($full['rows'], static fn(array $row): bool =>
                  in_array($row['tourvisor_hotel_id'] ?? null, HOTELS, true)));
              $ids = array_column($rows, 'tourvisor_hotel_id');
              sort($ids);
              need($ids === [1439,70030], 'requested_roster_rows_missing_or_duplicate');
              foreach ($rows as $row) {
                  $id = $row['tourvisor_hotel_id'];
                  $binding = $row['feed_binding']['offer_ids'] ?? [];
                  need(($binding['max'] ?? null) === 'max_'.$id && ($binding['telegram'] ?? null) === 'tg_'.$id, 'commercial_feed_identity_changed');
              }
              $full['rows'] = $rows;
              $packed = base64_encode(gzencode(json_encode($full, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR)));
              $source = preg_replace($packedPattern, 'const HOOK_ROSTER_GZIP_B64="'.$packed.'";', $source, 1, $replacements);
              need($replacements === 1, 'scoped_roster_generation_failed');
              $source = preg_replace('~^const HOOK_ROSTER_COUNT=[0-9]+;$~m', 'const HOOK_ROSTER_COUNT=2;', $source, 1, $replacements);
              need($replacements === 1, 'scoped_roster_count_missing');
          
              // This one-off pass never resumes a different pending operation or collector.
              // The stock hook makes these checks while holding the original PRICE lock.
              $boundary = "    \$state=\$history['state']??['schema'=>1,'pending'=>null,'completed'=>[]];";
              need(substr_count($source, $boundary) === 1, 'stock_journal_boundary_changed');
              $guard = <<<'CODE'
              hook_need($history['state']!==null && $state['pending']===null,'existing_price_operation_pending_stop');
              hook_need(($state['nightly_cycle']['state']??null)!=='started','existing_collector_cycle_started_stop');
          CODE;
              return str_replace($boundary, $boundary."\n".$guard, $source);
          }
          
          function executeScoped(string $file, bool $inspect): array
          {
              $args = [PHP_BINARY, $file];
              if ($inspect) $args[] = '--inspect';
              $process = proc_open($args,[['file','/dev/null','r'],['pipe','w'],['file','/dev/null','w']],$pipes);
              need(is_resource($process), 'stock_hook_could_not_start');
              $bytes = stream_get_contents($pipes[1], 2000001);
              fclose($pipes[1]);
              $exit = proc_close($process);
              need(is_string($bytes) && strlen($bytes) <= 2000000, 'stock_hook_output_invalid');
              $prefix = 'MONITOR_POST_FEED_RESULT=';
              $lines = array_values(array_filter(explode("\n", $bytes), static fn(string $line): bool => str_starts_with($line, $prefix)));
              need(count($lines) === 1, 'stock_hook_receipt_missing');
              $result = json_decode(substr($lines[0], strlen($prefix)), true, 64, JSON_THROW_ON_ERROR);
              need(is_array($result), 'stock_hook_receipt_invalid');
              return [$exit, $result];
          }
          
          function publicReceipt(int $exit, array $raw): array
          {
              $keys = ['ok','mode','installed_sha','roster_pairs','scanned_pairs','eligible_pairs','held_pairs',
                  'updated_pairs','verified_ids','eligible_ids','unchanged_ids','held_ids','deferred','error','timings_ms'];
              $out = array_intersect_key($raw, array_flip($keys));
              $out['exit'] = $exit;
              if (isset($raw['child_failure']['error'])) $out['child_error'] = $raw['child_failure']['error'];
              $out['updates'] = [];
              foreach ($raw['updates'] ?? [] as $row) {
                  need(in_array($row['tourvisor_hotel_id'] ?? null, HOTELS, true), 'unexpected_hotel_in_stock_receipt');
                  $out['updates'][] = array_intersect_key($row, array_flip(['tourvisor_hotel_id','price','record_id','feed_operation']));
              }
              foreach (['verified_ids','eligible_ids','unchanged_ids','held_ids'] as $key) {
                  foreach ($out[$key] ?? [] as $id) need(in_array($id, HOTELS, true), 'stock_receipt_scope_changed');
              }
              return $out;
          }
          
          $out = ['ok'=>false,'hotels'=>HOTELS,'stage'=>'prepare','apply_started'=>false];
          $temp = null;
          try {
              need(PHP_SAPI === 'cli', 'cli_required');
              umask(0077);
              $scope = scopedSource(canonicalSource());
              $temp = tempnam(sys_get_temp_dir(), 'anytour-price-two-');
              need(is_string($temp) && chmod($temp, 0600) && file_put_contents($temp, $scope) === strlen($scope),
                  'scoped_temporary_file_failed');
              $out['stage'] = 'inspect';
              [$inspectCode, $inspect] = executeScoped($temp, true);
              $out['inspect'] = publicReceipt($inspectCode, $inspect);
              need($inspectCode === 0 && ($inspect['ok'] ?? false) === true && ($inspect['roster_pairs'] ?? null) === 2,
                  'stock_inspection_refused');
              $eligible = $out['inspect']['eligible_ids'] ?? [];
              if ($eligible !== []) {
                  need(canonicalSource() !== '', 'installed_hook_digest_changed');
                  $out['stage'] = 'apply';
                  $out['apply_started'] = true;
                  [$writeCode, $write] = executeScoped($temp, false);
                  $out['apply'] = publicReceipt($writeCode, $write);
                  need($writeCode === 0 && ($write['ok'] ?? false) === true, 'stock_apply_stopped_read_journal_before_retry');
              }
              $out['stage'] = 'done';
              $out['ok'] = true;
          } catch (Throwable $error) {
              $reason = $error->getMessage();
              $out['hold'] = preg_match('/\A[a-z_0-9]{1,100}\z/D', $reason) ? $reason : 'scoped_price_operation_failed';
          } finally {
              if (is_string($temp) && is_file($temp)) unlink($temp);
          }
          echo json_encode($out, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Inspect and apply only the two requested catalog pairs
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("TWO_COMMERCIAL_PRICE_RESULT="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok")'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial-price-70030-1439
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
