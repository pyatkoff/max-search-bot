      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Edit the verified MAX hotels on their existing Telegram posts
        env:
          VERIFIED_MAX: ${{ needs.edit_existing.outputs.verified_hotel_ids }}
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          remote='set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru'
          mkdir pub/out
          [[ "$VERIFIED_MAX" =~ ^[0-9[:space:]]*$ ]]
          for link in 612:253 579:218 230:12125 237:547 232:1074 501:240 208:325 300:418 1548:4079 270:28581 277:341 540:352 325:132016; do
            mid="${link%%:*}"
            hotel="${link##*:}"
            if [[ " $VERIFIED_MAX " != *" $hotel "* ]]; then continue; fi
            if ! ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" "$remote; ANYTOUR_1566_MEDIA_MODE=check ANYTOUR_1566_MEDIA_MESSAGE=$mid php" < pub/read-only.php > "pub/out/$mid-check.json"; then
              echo "Old message $mid failed read-only eligibility"
              continue
            fi
            if ! digest="$(python3 -c 'import json,re,sys; d=json.load(open(sys.argv[1])); assert d["state"] == "ready_read_only" and d["writes"]==0 and str(d["message_id"])==sys.argv[2]; h=d["checkpoint_sha256"]; assert re.fullmatch("[a-f0-9]{64}", h); print(h)' "pub/out/$mid-check.json" "$mid")"; then
              continue
            fi
            if ! [[ "$digest" =~ ^[a-f0-9]{64}$ ]]; then continue; fi
            if ! ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" "$remote; ANYTOUR_1566_MEDIA_MODE=apply ANYTOUR_1566_MEDIA_MESSAGE=$mid ANYTOUR_1566_MEDIA_CHECKPOINT=$digest php" < pub/read-only.php > "pub/out/$mid-final.json"; then
              echo "Old message $mid has a saved hold; continuing without repeating it"
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json,pathlib
          base=pathlib.Path('pub/out')
          result=[]
          for mid in "612 579 230 237 232 501 208 300 1548 270 277 540 325".split():
              p=base / f'{mid}-final.json'
              if not p.is_file(): p=base / f'{mid}-check.json'
              try: row=json.loads(p.read_text())
              except (OSError,ValueError): row={'state':'missing_or_unreadable_receipt'}
              result.append(row)
              print(json.dumps({**{'id':mid},**{k:row[k] for k in ('hotel_id','state','reason','target_url','url','body_photo_button_verified') if k in row}}))
          (base/'summary.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Save exact original and final message receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-main-telegram-replacements-20261119
          path: pub/out/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
