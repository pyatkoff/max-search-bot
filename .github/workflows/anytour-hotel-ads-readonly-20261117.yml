name: "PR 1642: canonical read-only release admission"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  canonical-admission:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '1b4c268edd2c5bea564c76c74e836bb1b9a8bbf8' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout accepted main for the original verifier
        uses: actions/checkout@v4
        with:
          ref: c3d763f828d2f88e006d222766c6be3b3656afe9
          persist-credentials: false
      - name: Verify exact PR with the normal release guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c3d763f828d2f88e006d222766c6be3b3656afe9'
          node tools/release_priority.js --admit 1642 9ef4034b1a2647d2aa44fcd0dcce69d480e9dfd0 c3d763f828d2f88e006d222766c6be3b3656afe9
