name: "Verify every Telegram replacement and its public hotel button"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '237a33bd3c24245db9566c5408a4760dbb607382' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SELECT-only program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          function at1566Require(bool $valid, string $reason): void
          {
              if (!$valid) throw new RuntimeException($reason);
          }
          
          function at1566Json(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR);
          }
          
          function at1566Sha(string $value): string
          {
              return hash('sha256', $value);
          }
          
          function at1566Http(string $url): array
          {
              $body = '';
              $handle = curl_init($url);
              at1566Require($handle !== false, 'http_unavailable');
              $options = [
                  CURLOPT_FOLLOWLOCATION => false, CURLOPT_SSL_VERIFYPEER => true, CURLOPT_SSL_VERIFYHOST => 2,
                  CURLOPT_CONNECTTIMEOUT => 5, CURLOPT_TIMEOUT => 18, CURLOPT_USERAGENT => 'Mozilla/5.0',
                  CURLOPT_WRITEFUNCTION => static function ($unused, string $chunk) use (&$body): int {
                      if (strlen($body) + strlen($chunk) > 1_000_000) return 0;
                      $body .= $chunk;
                      return strlen($chunk);
                  },
              ];
              curl_setopt_array($handle, $options);
              $ok = curl_exec($handle) !== false && curl_errno($handle) === 0;
              $status = (int) curl_getinfo($handle, CURLINFO_HTTP_CODE);
              curl_close($handle);
              return [$ok, $status, $body];
          }
          
          function at1566Widget(string $message): array
          {
              $url = 'https://t.me/anytour/' . $message;
              [$ok, $status, $raw] = at1566Http($url . '?embed=1&mode=tme');
              at1566Require($ok && $status === 200, 'public_post_unavailable');
              $doc = new DOMDocument('1.0', 'UTF-8');
              $prior = libxml_use_internal_errors(true);
              try {
                  $loaded = $doc->loadHTML($raw, LIBXML_NONET);
              } finally {
                  libxml_clear_errors();
                  libxml_use_internal_errors($prior);
              }
              at1566Require($loaded, 'invalid_public_post');
              $xpath = new DOMXPath($doc);
              $base = $xpath->query('//*[@data-post="anytour/' . $message . '"]');
              at1566Require($base !== false && $base->length === 1, 'public_post_identity_changed');
              $element = $base->item(0);
              $class = static fn(string $value): string => 'contains(concat(" ",normalize-space(@class)," ")," ' . $value . ' ")';
              $caption = $xpath->query('.//*[' . $class('tgme_widget_message_text') . ']', $element);
              $photos = $xpath->query('.//*[' . $class('tgme_widget_message_photo_wrap') . ']', $element);
              $dates = $xpath->query('.//time[@datetime]', $element);
              $excluded = $xpath->query('.//video|.//audio|.//*[' . $class('tgme_widget_message_video_thumb')
                  . ' or ' . $class('tgme_widget_message_roundvideo') . ' or ' . $class('tgme_widget_message_grouped') . ']', $element);
              at1566Require($caption && $photos && $dates && $excluded && $caption->length === 1 && $photos->length === 1
                  && $dates->length === 1 && $excluded->length === 0, 'old_post_is_not_single_photo');
              $photo = $photos->item(0);
              $marker = trim($photo->getAttribute('class'));
              at1566Require($photo->getAttribute('href') === $url && str_contains($photo->getAttribute('style'), 'background-image')
                  && preg_match('/(?:^|\s)[0-9]{5,}(?:_[0-9]+)?(?:\s|$)/D', $marker) === 1, 'photo_marker_unavailable');
              $html = '';
              foreach ($caption->item(0)->childNodes as $child) $html .= $doc->saveHTML($child);
              $text = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i', "\n", $html)), ENT_QUOTES | ENT_HTML5, 'UTF-8');
              at1566Require(is_string($text) && $text !== '' && mb_check_encoding($text, 'UTF-8'), 'caption_unavailable');
              $buttons = $xpath->query('.//a[contains(@class, "tgme_widget_message_inline_button")]', $element);
              $buttonDigests = [];
              if ($buttons) foreach ($buttons as $button) {
                  $buttonDigests[] = hash('sha256', $button->getAttribute('href'));
              }
              return [
                  'button_digests' => $buttonDigests,
                  'published_unixtime' => (new DateTimeImmutable($dates->item(0)->getAttribute('datetime')))->getTimestamp(),
                  'caption' => $text, 'caption_sha256' => at1566Sha($text), 'html_sha256' => at1566Sha($html),
                  'photo_marker_sha256' => at1566Sha($marker), 'url' => $url,
              ];
          }
          

          $result=['ok'=>false,'writes'=>0,'rows'=>[]];
          try {
              if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e') throw new RuntimeException();
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/services/ChannelPostButtonTransport.php';
              } finally { ob_end_clean(); }
              $targets=json_decode(<<<'JSON'
          [["612",253,"Safir Sharm Waterfalls Resort\n📍 Шарм-эль-Шейх, Египет\n\nСобственный пляж с причалом, семь бассейнов и дайвинг-центр. Подойдёт, если хочется совместить отдых у моря с погружениями или теннисом.\n\nПодберём тур на ваши даты.","2024-05-12T10:36:58Z","757a4329d0c0599451557be21398c9217f10ef6a3eae7579b7ccdcc096191482","06b9d88354f8e92a1cb87f5eb2beb675fe511baff7b1f4f51b48a6f0b235982b"],["579",218,"Four Seasons Resort Sharm El Sheikh\n📍 Шарм-эль-Шейх, Египет\n\nСобственный пляж и домашний риф для снорклинга. Для семей есть детский клуб и просторные номера, а для спокойных вечеров — рестораны с видом на море.\n\nПодберём тур на ваши даты.","2024-04-27T09:53:00Z","19f84c2ae00a7ace1f3725cd325f940cf4f73c7e3fcb4968c45230c1992bf081","650768c64fec1206227733f010c19e58c6e9cfedd508829e162239bd03369136"],["230",12125,"OZEN Reserve Bolifushi\n📍 Южный Мале, Мальдивы\n\nВиллы с собственным бассейном на берегу и над лагуной, белый песок и детский клуб Kuda Koli. Для отдыха с включёнными услугами есть концепция RESERVE.\n\nПодберём тур на ваши даты.","2023-12-11T07:54:15Z","d1d7aa5b6d706f3ae355cdb0eacd22fd5922f07118ec41cdf34fd3bb859f340a","7b24da50f90a0280417d6b080872feb4d6b5cc3b332efc06e57692e2d2429e8b"],["237",547,"Anantara Mai Khao Phuket Villas\n📍 Май Кхао, Пхукет\n\nВиллы с частными бассейнами и зелёная территория у пляжа. Для семей есть виллы с двумя спальнями и детский клуб, для отдыха вдвоём — спа.\n\nПодберём тур на ваши даты.","2023-12-13T15:24:34Z","b164557f1997c4a45ffa3ea3f23b2876e932e4a490da731dc8191ffecd6c88f0","16487d83cd1359491033367bf8fda6863ef5321d71ae476bcb1e30188195a5ae"],["232",1074,"Gural Premier Belek\n📍 Белек, Турция\n\nСобственный пляж, большой аквапарк и просторные семейные номера. Удобный выбор для отдыха с детьми, когда хочется проводить весь день на территории.\n\nПодберём тур на ваши даты.","2023-12-11T18:20:29Z","3b4b3367a703a96290c84ddf739f50b6c4b054feec73e72dc10b12e464db5b0e","f70cdf127a3be060a21a506197b3918fb782efb86cc5bd4a3e0cba2a2180e3af"],["501",240,"Happy Life Village Dahab\n📍 Дахаб, Египет\n\nКрасное море и горы Синая. Отель расположен в долине Конай, рядом пешие подходы к местам для дайвинга. Подойдёт для спокойного отдыха и погружений.\n\nПодберём тур на ваши даты.","2024-03-20T07:40:58Z","f6163ab1c63192005f587395c5dce953b2038a5844fe83a8b35fabb642147cd8","ee784ae5c689d79c970161171dafc346fcf7061ccd57239f5a31c677ba876d02"],["208",325,"Minamark Resort & Spa\n📍 Хургада, Египет\n\nСобственный песчаный пляж в центре Саккалы. Днём можно отдыхать у моря, а вечером — выйти на прогулку по городу. Для детей есть клуб и водные горки.\n\nПодберём тур на ваши даты.","2023-12-03T14:10:48Z","b6899d5b7b770aaa14430965bd3772c9ad05472d6fa7ccef6cd020ee5059a048","52dfb50853dc21a074e059bac99bb67ad061d36ae79d97d7327f495da90f918d"],["300",418,"SRNTY Sea Reef\n📍 Макади-Бей, Египет\n\nКоралловый риф с выходом с пирса и два бассейна с морской водой. Один из бассейнов только для взрослых. Выход на пирс зависит от погоды.\n\nПодберём тур на ваши даты.","2024-01-03T13:15:44Z","39f1fcf79db9e1bda1924d43f8116681145d1f3385da84a76f1a524e31a5b7f1","7f1158fa1602c34b692ab54336fc1e60a86dd4c827f5a415dab25937f6427016"],["1548",4079,"Sunny Beach Resort & Spa\n📍 Муйне, Вьетнам\n\nПляжный отель на первой линии. На собственном пляже есть лежаки и зонты. Подойдёт для спокойного отпуска вдвоём у моря.\n\nПодберём тур на ваши даты.","2026-05-27T16:10:31Z","dbb35f741f56edf38b063f75e1b3fc400d93e9a5cb4ffd83d5075aa37d4af8fb","674a3cdd48c76d39845414b5485e916c240738d6ba8441df21b2a49376e6f8c9"],["270",28581,"Ma Biche Kemer by Werde Hotels\n📍 Гёйнюк, Турция\n\nСобственный пляж рядом с отелем. Вечером устраивают шоу, играет живая музыка и работает дискотека.\n\nПодберём тур на ваши даты.","2023-12-24T11:47:39Z","33ed44a023fdb961bca7ed086c6753b9458437118d7133a8f8ff4ca62caaa77d","f6217a5f29c1ab7eb8955d6224c58ebba2dc18b02ba3d354bf53de26545e86cb"],["277",341,"Nubian Village\n📍 Набк-Бей, Шарм-эль-Шейх\n\nСобственный пляж с пирсом, водные горки для детей и взрослых и детский клуб. Вариант для семейного отдыха на Красном море.\n\nПодберём тур на ваши даты.","2023-12-26T15:25:14Z","c4f64b7f26daabffa3eb3a504c21837d212d3b84b49307f1db12b893fbcedbef","ce56d2f207616ece3970f2a12a0db14db67b968c6f6b3536059705fcc2d5a9e6"],["540",352,"Parrotel Aqua Park Resort\n📍 Шарм-эль-Шейх, Египет\n\nОтель с аквапарком и трансфером к пляжу. Вход в море с общего понтона подойдёт тем, кто любит плавать у рифа.\n\nПодберём тур на ваши даты.","2024-04-09T07:11:19Z","0c376829fc668da00f28907ea0c517760b46f99d9c6dff6a4c20a2f7df2fca3a","155eee28c98b49470a860db4bfc7e8b71fbc3f97a632b55339e40310e5fee67c"],["325",132016,"Voyage Kundu\n📍 Кунду, Анталья\n\nПесчаный пляж, аквапарк и детский клуб Tugi Kids World. Для отдыха у бассейна есть номера Lagoon Swim Up с прямым выходом к воде.\n\nПодберём тур на ваши даты.","2024-01-12T12:09:02Z","47a300d68f7ac172f656b1a2829ea19b054bc91351d799dd957c32de6fd1169d","256c852a357c83166af58ad435164322b47f7ff328310175f7946b307595744b"]]
          JSON,true,20,JSON_THROW_ON_ERROR);
              if(count($targets)!==13) throw new RuntimeException();
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry=new ChannelPostRegistryService($pdo);
              $q=$pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=6 AND external_message_id=?');
              foreach($targets as [$mid,$hotel,$caption,$publishedAt,$oldCaption,$oldPhoto]){
                  $q->execute([$mid]); $id=(int)$q->fetchColumn(); $q->closeCursor();
                  $post=$registry->publication($id);
                  $url='https://t.me/anytour/'.$mid;
                  $row=['id'=>$mid,'hotel_id'=>$hotel,'url'=>$url,'state'=>$post['state']??null];
                  if($post&&$post['project_key']==='anytour'&&$post['channel_id']==='-1001845835645'
                      &&$post['external_message_id']===$mid&&$post['snapshot']['post_url']===$url
                      &&(int)($post['snapshot']['metadata']['hotel_catalog_id']??0)===$hotel
                      &&($caption===''||$post['snapshot']['text']===$caption)&&count($post['snapshot']['attachments']??[])===1
                      &&($post['snapshot']['attachments'][0]['type']??'')==='image'){
                      $context=ChannelPostEntryService::resolve('telegram',$post['start_payload'],$registry);
                      if($context&&(int)$context['publication_id']===$id&&(int)$context['version_id']===(int)$post['version_id']){
                          $row['caption_sha256']=hash('sha256',$post['snapshot']['text']);
                          $row['button_sha256']=hash('sha256',ChannelPostButtonTransport::buttonUrl($post));
                          $row['button_label']=$post['channel']['button_text'];
                          $row['resolved']=true;
                      }
                  }
                  $row['registry_reason']=$post['error_reason']??null;
                  try {
                      $p=at1566Widget($mid);
                      $row['public_native_id_and_date']=($p['published_unixtime']??0)===(new DateTimeImmutable($publishedAt))->getTimestamp();
                      $row['public_new_caption']=$p['caption']===$caption;
                      $row['public_old_caption']=hash_equals($oldCaption,$p['caption_sha256']);
                      $row['public_photo_changed']=!hash_equals($oldPhoto,$p['photo_marker_sha256']);
                      $row['public_button_count']=count($p['button_digests']);
                      $row['public_button_matches']=isset($row['button_sha256'])
                          && $p['button_digests']===[$row['button_sha256']];
                  } catch(Throwable $e) {
                      $row['public_read']='unavailable';
                  }
                  $result['rows'][]=$row;
              }
              $pdo->rollBack();
              $result['ok']=true;
          } catch(Throwable) {
              if(isset($pdo)&&$pdo->inTransaction()) $pdo->rollBack();
          }
          echo json_encode($result,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR),PHP_EOL;
          exit($result['ok']?0:2);
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read only approved old Telegram post and context fingerprints
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); assert d["ok"] and d["writes"]==0; print(json.dumps(d,ensure_ascii=False))'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-main-telegram-public-readback
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
