name: "Big MAX: reconcile Parrotel journal and candidate bindings"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '5c9dc797f7770f3c9673ef1f2984a06a15e74120' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the bounded read-only journal and post reconciliation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          $out=['ok'=>false,'provider_writes'=>0,'db_writes'=>0,'evidence'=>[]];
          try {
              installedEdit('cb08ade02e0d4588dfef8e4f0a8a5253b04d26c6');
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
                  require_once getcwd().'/tools/anytour_existing_post_batch.php';
              } finally { ob_end_clean(); }
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry=new ChannelPostRegistryService($pdo);
              $channel='-68765999669267';
              foreach([3670=>'AaCF4YtORgI',92=>'AaGL2WYPAfo',1141=>'AaG7dXpgV8Q',0=>'AZ_rrRmlYz0'] as $id=>$slug) {
                  $item=['publication'=>$id?:null,'url'=>'https://max.ru/anytour/'.$slug];
                  try {
                      $mid='mid.ffffc1752b045fed'.bin2hex(base64_decode(strtr($slug,'-_','+/').'=',true));
                      $p=$id?$registry->publication($id):null;
                      if($id) requireEdit(is_array($p)&&$p['external_message_id']===$mid,'registry_mid_mismatch');
                      $native=AnyTour\ExistingPostBatch\readHotelMax($mid,$channel);
                      requireEdit($native['post_url']===$item['url'],'native_target_url_mismatch');
                      $s=$p['snapshot']??[];
                      $item['media']=array_column($native['attachments']??[],'type');
                      $item['markup_types']=array_count_values(array_column($native['markup']??[],'type'));
                      $item['registry_same_caption']=($s['text']??null)===$native['text'];
                      $item['catalogue_id']=$s['metadata']['hotel_catalog_id']??null;
                      $item['state']=$p['state']??null;
                      $item['named_rixos']=preg_match('/rixos|риксос/ui',$native['text'])===1;
                      $item['magawish']=preg_match('/magawish|магавиш/ui',$native['text'])===1;
                      if($p) {
                          $start=ChannelPostEntryService::resolve('max',$p['start_payload'],$registry);
                          $item['exact_context']=($start['external_message_id']??null)===$mid && (int)($start['publication_id']??0)===$id;
                          $item['context_hotel_id']=$start['hotel_catalog_id']??null;
                          $item['same_cta']=ChannelPostIncomingAdapter::containsOnlyButton($native,ChannelPostButtonTransport::buttonUrl($p),(string)$p['channel']['button_text']);
                      }
                      if($id===3670) {
                          $public=AnyTour\ExistingPostBatch\publicHotelPost(['platform'=>'max','url'=>$item['url']]);
                          $item['public_same_caption']=$public['text']===$native['text'];
                          $dir='/var/www/anytoour/data/channel-post-operations';
                          $path=$dir.'/promoted-hotel-price-revisions-v1/3670.json';
                          requireEdit(!is_link(dirname($path))&&!is_link($path)&&is_file($path),'expected_original_price_journal_missing');
                          $raw=file_get_contents($path,false,null,0,4097);
                          requireEdit(is_string($raw)&&strlen($raw)<=4096,'invalid_price_journal');
                          $j=json_decode($raw,true,16,JSON_THROW_ON_ERROR);
                          $st=$j['state']??null;
                          requireEdit(in_array($st,['started','provider_verified','verified'],true),'invalid_price_journal_state');
                          $hash=$j['next_hash']??'';
                          $item['price_journal']=['state'=>$st,'updated_at'=>isset($j['at'])?gmdate(DATE_ATOM,intdiv((int)$j['at'],1000)):null,
                              'expected_equals_native'=>hash_equals($hash,hash('sha256',$native['text'])),
                              'expected_equals_public'=>hash_equals($hash,hash('sha256',$public['text'])),
                              'expected_equals_registry'=>hash_equals($hash,hash('sha256',$s['text']))];
                          $item['shared_post_journal_exists']=is_file($dir.'/issue-1566-edit-existing-3670.jsonl');
                      }
                  } catch(Throwable $error) {
                      $message=$error->getMessage();
                      $item['hold']=preg_match('/\A[a-z_0-9]{1,100}\z/D',$message)?$message:'exact_read_failed';
                  }
                  $out['evidence'][]=$item;
              }
              $pdo->rollBack();
              $out['ok']=true;
          }catch(Throwable $error) {
              if(isset($pdo)&&$pdo->inTransaction()) $pdo->rollBack();
              $message=$error->getMessage();
              $out['hold']=preg_match('/\A[a-z_0-9]{1,100}\z/D',$message)?$message:'exact_read_failed';
          }
          $out['at']=gmdate(DATE_ATOM);
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Reconcile native, public and journal evidence without edits
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("MAX_EXACT_JOURNAL_READ="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("provider_writes")==0 and d.get("db_writes")==0'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: big-max-price-journal-read
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
