name: "PRICE 1046: exact native inspection without a write"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '1401c5b8fb9bad33db55db2f231af23abf1da6b7' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the stock read-only inspection for one post
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'caption'=>$caption,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function feedBlock(string $platform,string $offerId): array {
              $file='hotel-posts-'.$platform.'.xml';
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/'.$file,12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_split_feed');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_split_feed');
              $xp=new DOMXPath($doc);
              $offer=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$offerId.'"]');
              requireEdit($offer->length===1,'split_offer_identity_changed');
              $fields=[];
              foreach(['price','currencyId','description'] as $key) {
                  $values=$xp->query('./'.$key,$offer->item(0));
                  requireEdit($values->length===1,'invalid_split_offer');
                  $fields[]=$values->item(0)->textContent;
              }
              return $fields;
          }
          function stockPlan(string $xml): array {
              $process=proc_open(['/usr/bin/python3','tools/prepare_promoted_hotel_prices.py','-'],
                  [['pipe','r'],['pipe','w'],['file','/dev/null','w']],$pipes);
              requireEdit(is_resource($process),'price_planner_unavailable');
              $sent=fwrite($pipes[0],$xml);
              fclose($pipes[0]);
              $result=stream_get_contents($pipes[1],4000001);
              fclose($pipes[1]);
              requireEdit(proc_close($process)===0&&$sent===strlen($xml)&&is_string($result)&&strlen($result)<=4000000,'price_planner_failed');
              return json_decode($result,true,32,JSON_THROW_ON_ERROR);
          }
          function amount(string $caption): ?int {
              if(!preg_match('/^💰 От ([0-9 \x{00A0}\x{202F}]+) ₽ за двоих/mu',$caption,$m)) return null;
              return (int)preg_replace('/\D/u','',$m[1]);
          }
          function exactPost(ChannelPostRegistryService $registry): array {
              $post=$registry->publication(3685);
              requireEdit(is_array($post)&&$post['project_key']==='anytour'&&$post['platform']==='telegram'&&
                  $post['channel_id']==='-1001845835645'&&$post['external_message_id']==='1046'&&$post['state']==='sent'&&
                  (int)($post['snapshot']['metadata']['hotel_catalog_id']??0)===12112&&
                  ($post['snapshot']['post_url']??null)==='https://t.me/anytour/1046','original_sunrise_binding_changed');
              return $post;
          }
          $out=['ok'=>false,'target'=>1046,'publication'=>3685,'provider_writes'=>0,'db_writes'=>0];
          try {
              installedEdit('c3d763f828d2f88e006d222766c6be3b3656afe9');
              umask(0077);
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
              } finally { ob_end_clean(); }
              requireEdit(ProjectConfig::projectId()==='anytour','wrong_project');
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry=new ChannelPostRegistryService($pdo);
              $operations='/var/www/anytoour/data/channel-post-operations';
              $lockFile=$operations.'/monitor-price-after-collection-v1.jsonl';
              requireEdit(is_file($lockFile)&&!is_link($lockFile),'original_price_lock_missing');
              $lock=fopen($lockFile,'rb');
              requireEdit(is_resource($lock)&&flock($lock,LOCK_SH|LOCK_NB),'shared_editor_busy');
              $journal=$operations.'/promoted-hotel-price-revisions-v1';
              requireEdit(is_dir($journal)&&!is_link($journal)&&realpath($journal)===$journal&&(fileperms($journal)&0077)===0,'invalid_journal_permissions');

              $out['price_lock_observation']='available_for_shared_read';
              $journalFile=$journal.'/3685.json';
              requireEdit(!is_link($journalFile),'revision_journal_link');
              $out['original_price_operation']='none';
              if(is_file($journalFile)){
                  $prior=file_get_contents($journalFile,false,null,0,4097);
                  requireEdit(is_string($prior)&&strlen($prior)<=4096,'invalid_revision_journal');
                  $revision=json_decode($prior,true,16,JSON_THROW_ON_ERROR);
                  requireEdit(in_array($revision['state']??null,['started','provider_verified','verified'],true),'invalid_revision_journal');
                  $out['original_price_operation']=$revision['state'];
              }
              $post=exactPost($registry);
              $out['registry_version']=$post['version_id'];
              $out['registry_state']=$post['state'];
              $original=publicTelegram(1046);
              $rawPhoto=$post['snapshot']['attachments'][0]['file_unique_id']??'';
              $button=ChannelPostButtonTransport::buttonUrl($post);
              $buttonLabel=$post['channel']['button_text'];
              $context=ChannelPostEntryService::resolve('telegram',$post['start_payload'],$registry);
              requireEdit($rawPhoto!==''&&count($post['snapshot']['attachments'])===1&&$original['videos']===0
                  &&$original['photos']===['5375555620448627948']&&$original['date']==='2025-03-13T08:43:18+00:00'
                  &&$original['caption']===$post['snapshot']['text']
                  &&$original['buttons']===[['text'=>$buttonLabel,'url'=>$button]]
                  &&(int)($context['publication_id']??0)===3685&&(int)($context['snapshot']['metadata']['hotel_catalog_id']??0)===12112,'sunrise_preimage_changed');
              $out['before_price']=amount($original['caption']);

              $rawTargets=file_get_contents('config/promoted_hotel_price_targets.json');
              $targets=json_decode($rawTargets,true,32,JSON_THROW_ON_ERROR);
              $selection=array_values(array_filter($targets,static fn(array $t):bool=>$t['hotel_id']===12112));
              requireEdit(count($targets)===61&&$selection===[['hotel_id'=>12112,'platform'=>'telegram',
                  'publication_id'=>3685,'url'=>'https://t.me/anytour/1046']],'pr1641_manifest_mismatch');

              $max=feedBlock('max','max_12112');
              $telegram=feedBlock('telegram','tg_12112');
              $xml=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              $feedHash=hash('sha256',$xml);
              $plan=stockPlan($xml);
              $jobs=PromotedHotelPriceWriter::jobsForPlan($plan,$feedHash,$rawTargets);
              $one=array_values(array_filter($jobs,static fn(array $job):bool=>$job['hotel']===12112));
              requireEdit(count($one)===1&&$one[0]['platform']==='telegram'&&$one[0]['publication']===3685,'fresh_sunrise_plan_missing');
              $block=$one[0]['price_block'];
              $out['feed_price']=amount($block);
              requireEdit($out['feed_price']>0&&$max[0]===(string)$out['feed_price']&&$telegram[0]===$max[0]&&$max[1]==='RUB'&&$telegram[1]==='RUB'
                  &&substr_count($max[2],$block)===1&&substr_count($telegram[2],$block)===1,'split_feed_versus_plan_mismatch');

              $only=[];
              foreach($plan['plans'] as $candidate) {
                  if($candidate['hotel_id']===12112) $only[]=$candidate;
                  else $plan['held'][]=['hotel_id'=>$candidate['hotel_id'],'reason'=>'outside_pr1641_first_readback_scope'];
              }
              $plan['plans']=$only;
              $plan['eligible_hotels']=count($only);
              requireEdit(PromotedHotelPriceWriter::jobsForPlan($plan,$feedHash,$rawTargets)===$one,'sunrise_single_job_not_proved');
              if(str_ends_with($original['caption'],$block)) $out['writer_state']='already_current_public';
              else {
                  $written=(new PromotedHotelPriceWriter($pdo,$registry,$journal))->run($plan,$feedHash,false);
                  $out['writer_state']=$written[0]['result']??'no_receipt';
                  $out['writer_reason']=$written[0]['reason']??null;
              }
              $after=publicTelegram(1046);
              $final=exactPost($registry);
              $out['published']=['price'=>amount($after['caption']),'full_fresh_block'=>str_ends_with($after['caption'],$block),
                  'caption_matches_registry'=>$after['caption']===$final['snapshot']['text'],'same_cta'=>$after['buttons']===$original['buttons']
                      &&$final['start_payload']===$post['start_payload'],
                  'same_date'=>$after['date']===$original['date'],'same_photo'=>$after['photos']===$original['photos']
                      &&($final['snapshot']['attachments'][0]['file_unique_id']??null)===$rawPhoto,
                  'same_text_links'=>$after['links']===$original['links'],'version'=>$final['version_id'],
                  'offer_lines'=>explode("\n",$block)];
              $p=$out['published'];
              $out['ok']=$p['caption_matches_registry']&&$p['same_cta']&&$p['same_date']&&$p['same_photo']&&$p['same_text_links'];
          }catch(Throwable $e) {
              $m=$e->getMessage();
              $out['hold']=preg_match('/\A[a-z_0-9]{1,100}\z/D',$m)?$m:'sunrise_exact_price_pass_failed';
          }finally {
              if(isset($pdo)&&$pdo->inTransaction())$pdo->rollBack();
              if(isset($lock)&&is_resource($lock))fclose($lock);
          }
          $out['at']=gmdate(DATE_ATOM);
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Run the stock PRICE service in inspection mode only
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("SUNRISE_EXACT_NATIVE_INSPECT="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok")'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-1046-native-inspect
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
