name: Audit current AnyTour hotel feeds and bindings
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths:
      - .github/workflows/anytour-hotel-ads-readonly-20261117.yml
      - audit/anytour-hotel-ads-readonly-20261117.py
      - audit/anytour-hotel-ads-runner-20261117.py
permissions:
  contents: read
concurrency:
  group: anytour-hotel-ads-owner-20261117
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read current feeds and active ad bindings; reports through 18 November
        env:
          SSH_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          READER_SHA256: f2a4308878012d933a4a9ed5b1b26cd93e37614506ff9427bf38a674ad6270ff
          REPORT_PUBLIC_KEY_B64: 
        run: python3 audit/anytour-hotel-ads-runner-20261117.py
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-hotel-feed-audit-20261119
          path: encrypted-hotel-ads/*.enc.json
          retention-days: 7
          if-no-files-found: error


