name: "Read existing generic posts and the exact hotel source photos"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-hotel-main-channel-priority-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '899805707a518b9897f127b27f2080fa5deec5e9' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare SELECT-only program
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors', '0');
          ini_set('log_errors', '0');
          $installed = '9b1e17f94f39d8d2cc6260a9a6f45b1d1f38bb3e';
          function at1566Require(bool $valid, string $reason): void
          {
              if (!$valid) throw new RuntimeException($reason);
          }
          
          function at1566Json(array $value): string
          {
              return json_encode($value, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR);
          }
          
          function at1566Sha(string $value): string
          {
              return hash('sha256', $value);
          }
          
          function at1566Http(string $url): array
          {
              $body = '';
              $handle = curl_init($url);
              at1566Require($handle !== false, 'http_unavailable');
              $options = [
                  CURLOPT_FOLLOWLOCATION => false, CURLOPT_SSL_VERIFYPEER => true, CURLOPT_SSL_VERIFYHOST => 2,
                  CURLOPT_CONNECTTIMEOUT => 5, CURLOPT_TIMEOUT => 18, CURLOPT_USERAGENT => 'Mozilla/5.0',
                  CURLOPT_WRITEFUNCTION => static function ($unused, string $chunk) use (&$body): int {
                      if (strlen($body) + strlen($chunk) > 1_000_000) return 0;
                      $body .= $chunk;
                      return strlen($chunk);
                  },
              ];
              curl_setopt_array($handle, $options);
              $ok = curl_exec($handle) !== false && curl_errno($handle) === 0;
              $status = (int) curl_getinfo($handle, CURLINFO_HTTP_CODE);
              curl_close($handle);
              return [$ok, $status, $body];
          }
          
          function at1566Widget(string $message): array
          {
              $url = 'https://t.me/anytour/' . $message;
              [$ok, $status, $raw] = at1566Http($url . '?embed=1&mode=tme');
              at1566Require($ok && $status === 200, 'public_post_unavailable');
              $doc = new DOMDocument('1.0', 'UTF-8');
              $prior = libxml_use_internal_errors(true);
              try {
                  $loaded = $doc->loadHTML($raw, LIBXML_NONET);
              } finally {
                  libxml_clear_errors();
                  libxml_use_internal_errors($prior);
              }
              at1566Require($loaded, 'invalid_public_post');
              $xpath = new DOMXPath($doc);
              $base = $xpath->query('//*[@data-post="anytour/' . $message . '"]');
              at1566Require($base !== false && $base->length === 1, 'public_post_identity_changed');
              $element = $base->item(0);
              $class = static fn(string $value): string => 'contains(concat(" ",normalize-space(@class)," ")," ' . $value . ' ")';
              $caption = $xpath->query('.//*[' . $class('tgme_widget_message_text') . ']', $element);
              $photos = $xpath->query('.//*[' . $class('tgme_widget_message_photo_wrap') . ']', $element);
              $dates = $xpath->query('.//time[@datetime]', $element);
              $excluded = $xpath->query('.//video|.//audio|.//*[' . $class('tgme_widget_message_video_thumb')
                  . ' or ' . $class('tgme_widget_message_roundvideo') . ' or ' . $class('tgme_widget_message_grouped') . ']', $element);
              at1566Require($caption && $photos && $dates && $excluded && $caption->length === 1 && $photos->length === 1
                  && $dates->length === 1 && $excluded->length === 0, 'old_post_is_not_single_photo');
              $photo = $photos->item(0);
              $marker = trim($photo->getAttribute('class'));
              at1566Require($photo->getAttribute('href') === $url && str_contains($photo->getAttribute('style'), 'background-image')
                  && preg_match('/(?:^|\s)[0-9]{5,}(?:_[0-9]+)?(?:\s|$)/D', $marker) === 1, 'photo_marker_unavailable');
              $html = '';
              foreach ($caption->item(0)->childNodes as $child) $html .= $doc->saveHTML($child);
              $text = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i', "\n", $html)), ENT_QUOTES | ENT_HTML5, 'UTF-8');
              at1566Require(is_string($text) && $text !== '' && mb_check_encoding($text, 'UTF-8'), 'caption_unavailable');
              return [
                  'published_unixtime' => (new DateTimeImmutable($dates->item(0)->getAttribute('datetime')))->getTimestamp(),
                  'caption' => $text, 'caption_sha256' => at1566Sha($text), 'html_sha256' => at1566Sha($html),
                  'photo_marker_sha256' => at1566Sha($marker), 'url' => $url,
              ];
          }
          
          function at1566PublicationForMessage(PDO $pdo, ChannelPostRegistryService $registry, int $channel, string $message): ?array
          {
              $query = $pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=?');
              $query->execute([$channel, $message]);
              $id = (int) $query->fetchColumn();
              $query->closeCursor();
              return $id > 0 ? $registry->publication($id) : null;
          }
          
          function genericPromotion(string $text): bool {
              return mb_strlen($text) >= 75
                  && preg_match('/(?:горящ|подборк|туры в|туры на|пут[её]вк|предложени)/iu', $text) === 1
                  && preg_match('/(?:отзыв|видео|кружок|конкурс|розыгрыш|реквизит|важн(?:ая|ое)\s+информац|официальн)/iu', $text) === 0
                  && preg_match('/(?:RUB|₽|рубл|тысяч|пут[её]вк|отелей)/iu', $text) === 1;
          }
          $targets = json_decode(<<<'JSON'
          [[253,"Safir Sharm Waterfalls Resort","AaGjSa3TJ40","144"],[218,"Four Seasons Resort Sharm El Sheikh","AaHlgTBdBoI","673"],[12125,"OZEN Reserve Bolifushi","AaHkMMxScBw","626"],[547,"Anantara Mai Khao Phuket Villas","AaHkMLgMGpU","624"],[1074,"Gural Premier Belek","AaG1yNfoLas","189"],[240,"Happy Life Village Dahab","AaGa3G0Ba0I","22"],[325,"Minamark Resort & Spa","AaHTI-iFZ5E","599"],[418,"SRNTY Sea Reef","AaHRceBGDBw","566"],[4079,"Sunny Beach Resort","AaG38IYfRTk","498"],[28581,"Ma Biche Kemer","AaG3AEh9LSA","326"],[341,"Nubian Village","AaG2y39LWpo","298"],[352,"Parrotel Aqua Park Resort","AaG3GJ5uQ8w","346"],[132016,"Voyage Kundu","AaHQYu_Vdyw","550"]]
          JSON, true, 16, JSON_THROW_ON_ERROR);
          
          $result = ['issue'=>1566, 'ok'=>false, 'production_writes'=>0, 'ad_clicks'=>0, 'bot_starts'=>0];
          $stage = 'release';
          try {
              if (PHP_SAPI !== 'cli' || trim((string) shell_exec('git rev-parse HEAD')) !== $installed
                  || trim((string) shell_exec('git status --porcelain --untracked-files=no')) !== '') {
                  throw new RuntimeException();
              }
              ob_start();
              try {
                  require getcwd() . '/config.php';
                  require_once getcwd() . '/services/ChannelPostEntryService.php';
                  require_once getcwd() . '/services/ChannelPostButtonTransport.php';
              } finally {
                  ob_end_clean();
              }
              if (ProjectConfig::projectId() !== 'anytour' || count($targets) !== 13) {
                  throw new RuntimeException();
              }
              $pdo = ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $registry = new ChannelPostRegistryService($pdo);
              $stage = 'channel_identity';
              $maxId = '-68765999669267';
              $tgId = '-1001845835645';
              $maxIdentity = ChannelPostRuntime::identity('max');
              $tgIdentity = ChannelPostRuntime::identity('telegram');
              $maxChannel = $maxIdentity ? $registry->channel('anytour', 'max', $maxIdentity['bot_key'], $maxId) : null;
              $tgChannel = $tgIdentity ? $registry->channel('anytour', 'telegram', $tgIdentity['bot_key'], $tgId) : null;
              if (!is_array($maxChannel) || (int) $maxChannel['id'] !== 4 || !is_array($tgChannel) || (int) $tgChannel['id'] !== 6) {
                  throw new RuntimeException();
              }
              $stage = 'read_exact_rows';
              $q = $pdo->prepare('SELECT id FROM post_publications WHERE post_channel_id=? AND external_message_id=? LIMIT 2');
              $lookup = static function (int $channel, string $message) use ($q): array {
                  $q->execute([$channel, $message]);
                  $rows = $q->fetchAll(PDO::FETCH_COLUMN);
                  $q->closeCursor();
                  return $rows;
              };
              foreach ($targets as [$id, $name, $slug, $telegramMid]) {
                  $rows = [];
                  $binary = base64_decode(strtr($slug, '-_', '+/'), true);
                  at1566Require($binary !== false && strlen($binary) === 8, 'invalid_max_source_slug');
                  $maxMid = 'mid.' . bin2hex(pack('J', -80492244209683)) . bin2hex($binary);
                  foreach ([9=>[$maxMid, 'https://max.ru/channel_anytour/' . $slug], 10=>[$telegramMid, 'https://t.me/any_toour/' . $telegramMid]] as $channelId => [$mid, $url]) {
                      $found = $lookup($channelId, $mid);
                      $post = count($found) === 1 ? $registry->publication((int)$found[0]) : null;
                      $s = $post['snapshot'] ?? [];
                      $m = $s['attachments'] ?? [];
                      $typed = (int) ($s['metadata']['hotel_catalog_id'] ?? 0);
                      $caption = (string) ($s['text'] ?? '');
                      $rows[$channelId] = [
                          'id'=>$post['publication_id'] ?? null, 'version'=>$post['version_id'] ?? null,
                          'hash'=>$post['content_hash'] ?? null, 'state'=>$post['state'] ?? null, 'typed_id'=>$typed,
                          'url'=>$s['post_url'] ?? null, 'mid'=>$mid, 'caption'=>mb_substr($caption, 0, 1900),
                          'image'=>count($m) === 1 && ($m[0]['type'] ?? '') === 'image',
                          'photo_reusable'=>count($m) === 1 && !empty($m[0][$channelId === 9 ? 'token' : 'telegram_file_id']),
                          'source_match'=>($s['post_url'] ?? null) === $url && ($typed === 0 || $typed === $id)
                              && mb_stripos(mb_substr($caption, 0, 150), $name) !== false,
                      ];
                  }
                  $result['sources'][$id] = $rows;
              }
              $pdo->rollBack();
              $result['installed_sha'] = $installed;
              $result['read_at_utc'] = gmdate(DATE_ATOM);
              $result['max_targets'] = [];
              $result['tg_targets'] = [];
              $result['tg_history'] = [];
              $stage = 'telegram_public_history';
              foreach ([220,420,620,830,1030,1220,1410,1550] as $before) {
                  [$pass, $http, $body] = at1566Http('https://t.me/s/anytour?before=' . $before);
                  $result['tg_history'][$before] = $http;
                  if (!$pass || $http !== 200) continue;
                  $doc = new DOMDocument('1.0','UTF-8');
                  libxml_use_internal_errors(true);
                  $parsed = $doc->loadHTML($body, LIBXML_NONET);
                  libxml_clear_errors();
                  if (!$parsed) continue;
                  $xp = new DOMXPath($doc);
                  foreach ($xp->query('//*[@data-post]') as $post) {
                      if (!preg_match('~^anytour/([1-9][0-9]+)$~D', $post->getAttribute('data-post'), $m)) continue;
                      $mid = $m[1];
                      if (isset($result['tg_targets'][$mid])) continue;
                      $caption = $xp->query('.//*[contains(@class,"tgme_widget_message_text")]', $post)->item(0);
                      $t = $caption ? $caption->textContent : '';
                      if (!genericPromotion($t) || $lookup(6, $mid)) continue;
                      if (count($result['tg_targets']) >= 45) break 2;
                      try {
                          $candidate = at1566Widget($mid);
                          if ($candidate['published_unixtime'] > strtotime('2026-06-01T00:00:00Z')) continue;
                          if (!genericPromotion($candidate['caption'])) continue;
                          $candidate['caption'] = mb_substr($candidate['caption'], 0, 850);
                          $result['tg_targets'][$mid] = $candidate;
                      } catch (Throwable) {}
                  }
              }

              $stage = 'max_history';
              $seen = [];
              $before = (int) ceil(microtime(true) * 1000);
              $complete = false;
              $pages = 0;
              $unreadableBodies = 0;
              for ($page = 0; $page < 20; ++$page) {
                  $response = ChannelPostApiTransport::buttonRequest(
                      'max', 'GET', '/messages', ['chat_id'=>$maxId, 'from'=>$before, 'to'=>1, 'count'=>100], null
                  );
                  $messages = $response['data']['messages'] ?? null;
                  if (($response['http'] ?? 0) !== 200 || !empty($response['transport_error'])
                      || !is_array($messages) || !array_is_list($messages) || count($messages) > 100) {
                      $result['max_history_http'] = (int) ($response['http'] ?? 0);
                      throw new RuntimeException();
                  }
                  ++$pages;
                  $last = $before;
                  $pageIds = [];
                  foreach ($messages as $message) {
                      $timestamp = $message['timestamp'] ?? null;
                      $messageId = $message['body']['mid'] ?? null;
                      if ((string) ($message['recipient']['chat_id'] ?? '') !== $maxId
                          || ($message['recipient']['chat_type'] ?? '') !== 'channel'
                          || !is_string($messageId) || !preg_match('/\A[A-Za-z0-9_.-]{1,191}\z/D', $messageId)
                          || (!is_int($timestamp) && !is_string($timestamp))
                          || !preg_match('/\A[1-9][0-9]{0,15}\z/D', (string) $timestamp)
                          || (int) $timestamp > $before || isset($pageIds[$messageId])) {
                          $stage = 'max_history_page_identity';
                          throw new RuntimeException();
                      }
                      $pageIds[$messageId] = true;
                      $last = min($last, (int) $timestamp);
                      if (isset($seen[$messageId])) {
                          continue;
                      }
                      $seen[$messageId] = true;
                      $snapshot = ChannelPostIncomingAdapter::maxSnapshot($message);
                      if ($snapshot === null) {
                          ++$unreadableBodies;
                          continue;
                      }
                      $text = $snapshot['text'];
                      $url = $snapshot['post_url'];
                      if (!str_starts_with($url, 'https://max.ru/anytour/') && preg_match('/\Amid\.[0-9a-f]{32}\z/D', $messageId)) {
                          $slug = rtrim(strtr(base64_encode(hex2bin(substr($messageId, -16))), '+/', '-_'), '=');
                          $url = 'https://max.ru/anytour/' . $slug;
                      }
                      $a = $snapshot['attachments'] ?? [];
                      if ((int)$timestamp > strtotime('2026-06-01T00:00:00Z') * 1000
                          || ($snapshot['metadata']['capability'] ?? '') !== 'supported' || count($a) !== 1
                          || ($a[0]['provider'] ?? '') !== 'max' || ($a[0]['type'] ?? '') !== 'image'
                          || empty($a[0]['photo_id']) || !empty($snapshot['keyboard']) || !empty($message['link'])
                          || !genericPromotion($text) || $lookup(4, $messageId)) continue;
                      if (count($result['max_targets']) < 70) {
                          $result['max_targets'][] = [
                              'url'=>$url,'mid'=>$messageId,'ms'=>(int)$timestamp,
                              'fingerprint'=>ChannelPostIncomingAdapter::contentFingerprint($snapshot),
                              'caption'=>mb_substr($text, 0, 850),
                          ];
                      }
                  }
                  if (count($messages) < 100) {
                      $complete = true;
                      break;
                  }
                  if ($last >= $before) {
                      $stage = 'max_history_boundary';
                      throw new RuntimeException();
                  }
                  $before = $last;
              }
              $result['history'] = ['pages'=>$pages, 'visible_messages'=>count($seen), 'complete'=>$complete, 'unparsed_bodies'=>$unreadableBodies];
              $result['ok'] = $complete && $unreadableBodies === 0;
          } catch (Throwable) {
              if (isset($pdo) && $pdo->inTransaction()) {
                  $pdo->rollBack();
              }
              $result['failed_stage'] = $stage;
          }
          echo json_encode($result, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR), PHP_EOL;
          exit($result['ok'] ? 0 : 2);
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read existing publications and official native MAX history
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); assert d["ok"]; print({k:len(d[k]) for k in ("sources","max_targets","tg_targets")})'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel-reuse-photo-preflight-20261119
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
