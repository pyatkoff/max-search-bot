name: "Big-channel hotel transfer: rank and verify the next batch"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == '5dcfff9ea13b39eea06d2e47a1d2de052a1cbf00' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare read-only demand and destination audit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');
          
          function requireEdit(bool $ok, string $reason): void {
              if (!$ok) throw new RuntimeException($reason);
          }
          function installedEdit(string $expected): void {
              requireEdit(PHP_SAPI === 'cli' && getcwd() === '/var/www/anytoour/data/www/app.anytoour.ru', 'app_root');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD')) === $expected, 'installed_checkout_changed');
              requireEdit(trim((string) shell_exec('GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false status --porcelain --untracked-files=no')) === '', 'installed_checkout_dirty');
          }
          function publicTelegram(int $mid): array {
              $doc = new DOMDocument();
              $url = 'https://t.me/s/anytour?before=' . ($mid + 1);
              $raw = PromotedHotelPriceWriter::publicBytes($url);
              requireEdit(@$doc->loadHTML('<?xml encoding="UTF-8">'.$raw, LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING), 'public_dom');
              $xp = new DOMXPath($doc);
              $roots = $xp->query('//*[@data-post="anytour/'.$mid.'"]');
              requireEdit($roots->length === 1,'public_id');
              $root = $roots->item(0);
              $class = static fn(string $v):string => 'contains(concat(" ",normalize-space(@class)," ")," '.$v.' ")';
              $text = $xp->query('.//*['.$class('tgme_widget_message_text').']',$root);
              $time = $xp->query('.//time[@datetime]',$root);
              requireEdit($text->length===1 && $time->length===1,'public_body_or_date');
              $photos = [];
              foreach ($xp->query('.//*['.$class('tgme_widget_message_photo_wrap').']',$root) as $img) {
                  $marker = trim($img->getAttribute('class'));
                  preg_match('/(?:^|\s)([0-9]{5,}(?:_[0-9]+)?)(?:\s|$)/D',$marker,$m);
                  $photos[] = $m[1] ?? ('class:'.hash('sha256',$marker));
              }
              $videos = $xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_roundvideo').']',$root)->length;
              $clips=[];
              foreach ($xp->query('.//video|.//*['.$class('tgme_widget_message_video_thumb').' or '.$class('tgme_widget_message_video_duration').']',$root) as $v) {
                  $clips[]=[$v->tagName,$v->getAttribute('class'),$v->getAttribute('src'),$v->getAttribute('poster'),$v->getAttribute('style'),trim($v->textContent)];
              }
              $captionHtml='';
              foreach ($text->item(0)->childNodes as $node) $captionHtml.=$doc->saveHTML($node);
              $caption = html_entity_decode(strip_tags(preg_replace('~<br\s*/?>~i',"\n",$captionHtml)),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $buttons=[];
              foreach($xp->query('.//a['.$class('tgme_widget_message_inline_button').']',$root) as $a) {
                  $buttons[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              $links=[];
              foreach($xp->query('.//a[@href]',$text->item(0)) as $a) {
                  $links[]=['text'=>trim($a->textContent),'url'=>$a->getAttribute('href')];
              }
              return ['date'=>$time->item(0)->getAttribute('datetime'),'photos'=>$photos,'videos'=>$videos,
                  'video_sha256s'=>array_map(static fn(array $x):string=>hash('sha256',json_encode($x,JSON_THROW_ON_ERROR)),$clips),
                  'video_duration_text'=>array_values(array_map(static fn(array $x):string=>$x[5],array_filter($clips,static fn(array $x):bool=>str_contains($x[1],'video_duration')))),
                  'caption'=>$caption,'caption_html'=>$captionHtml,'caption_sha256'=>hash('sha256',$caption),'buttons'=>$buttons,'links'=>$links];
          }
          function priceRows(array $ids): array {
              $raw=PromotedHotelPriceWriter::publicBytes('https://app.anytoour.ru/feed/hotel-posts-all.xml',12000000);
              requireEdit(!preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$raw),'invalid_xml');
              $doc=new DOMDocument();
              requireEdit(@$doc->loadXML($raw,LIBXML_NONET|LIBXML_NOERROR|LIBXML_NOWARNING),'invalid_xml');
              $xp=new DOMXPath($doc);
              $result = [];
              $now=new DateTimeImmutable('now',new DateTimeZone('Europe/Moscow'));
              foreach($ids as $id) {
                  try {
                      $pair=[];
                      foreach(['max','tg'] as $platform){
                          $q=$xp->query('/yml_catalog/shop/offers/offer[@id="'.$platform.'_'.$id.'"]');
                          requireEdit($q->length===1,'missing_or_duplicate_feed_offer');
                          $o=$q->item(0);
                          $get=static function(string $name) use($xp,$o):string{
                              $x=$xp->query('./'.$name,$o);
                              requireEdit($x->length===1,'invalid_'.$name);
                              return $x->item(0)->textContent;
                          };
                          $desc=$get('description');
                          $pattern='~^💰 От (?<amount>[0-9][0-9 ,.\x{00a0}\x{202f}]*) ₽ за двоих\n✈️ Вылет из [^\n]+ (?<date>\d{2}\.\d{2}\.\d{4}) · [1-9][0-9]* ноч(?:ь|и|ей)\n👥 2 взрослых\n🛏 [^\n]+\n🍽 [^\n]+\nЦена найдена мониторингом (?<observed>\d{2}\.\d{2}\.\d{4}, \d{2}:\d{2}) МСК\. Стоимость и наличие могут измениться\.$~mu';
                          requireEdit(preg_match_all($pattern,$desc,$m,PREG_SET_ORDER)===1,'missing_or_ambiguous_price_block');
                          $a=$m[0];$value=str_replace(',','.',preg_replace('/[\s\x{00a0}\x{202f}]/u','',$a['amount']));
                          $price=$get('price');
                          requireEdit($get('currencyId')==='RUB'&&preg_match('/^[1-9][0-9]*(?:\.[0-9]{1,2})?$/D',$price)&& (float)$value===(float)$price,'amount_mismatch');
                          $obs=DateTimeImmutable::createFromFormat('!d.m.Y, H:i',$a['observed'],$now->getTimezone());
                          $departure=DateTimeImmutable::createFromFormat('!d.m.Y',$a['date'],$now->getTimezone());
                          requireEdit($obs && $obs->format('d.m.Y, H:i')===$a['observed'] && $obs<=$now
                              && $now->getTimestamp()-$obs->getTimestamp()<129600,'observation_outside_36h');
                          requireEdit($departure && $departure->format('d.m.Y')===$a['date'] && $departure>=$now->setTime(0,0),'past_departure');
                          $pair[]= ['block'=>$a[0],'price'=>$price,'observation'=>$obs->format(DATE_ATOM),'departure'=>$departure->format('Y-m-d')];
                      }
                      requireEdit($pair[0]===$pair[1],'platform_offer_mismatch');
                      $result[$id]=$pair[0];
                  } catch (Throwable $e) {
                      $result[$id]=['reason'=>$e->getMessage()];
                  }
              }
              return $result;
          }
          $out=['ok'=>false,'db_writes'=>0,'provider_writes'=>0];
          try {
              installedEdit('9385571c86c45189c31d9c4aa904c23970e3b11a');
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/PromotedHotelPriceWriter.php';
                  require_once getcwd().'/services/ChannelPostEntryService.php';
              } finally { ob_end_clean(); }
              $exclude=array_fill_keys([132,174,218,240,253,260,325,341,352,415,418,469,547,1074,1344,2493,3452,4079,4181,12107,12111,12125,28581,37668,43676,64895,70048,73974,74503,82606,99713,132016,12112,70030,1273,1439,91404,73055,61159],true);
              $msk=new DateTimeZone('Europe/Moscow');
              $utc=new DateTimeZone('UTC');
              $end=(new DateTimeImmutable('today',$msk))->setTimezone($utc);
              $start=$end->modify('-7 day');
              $out['period_utc']=['from'=>$start->format(DATE_ATOM),'until'=>$end->format(DATE_ATOM)];
              $pdo=ConversationDb::connection();
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $channels=$pdo->query('SELECT id,platform,channel_id,display_name FROM post_channels WHERE id IN (4,6,9,10) ORDER BY id')->fetchAll(PDO::FETCH_ASSOC);
              requireEdit(array_map('intval',array_column($channels,'id'))===[4,6,9,10]
                  && array_column($channels,'platform')===['max','telegram','max','telegram'],'channel_registry_changed');
              $out['channels']=$channels;
              $q=$pdo->prepare("SELECT p.id AS publication_id,p.post_channel_id,COUNT(*) AS entries,COUNT(DISTINCT e.conversation_id) AS dialogues,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id')) AS hotel_id,
                  SUBSTRING_INDEX(JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.text')),CHAR(10),1) AS title,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.post_url')) AS url
                FROM post_entries e JOIN post_publications p ON p.id=e.publication_id
                JOIN post_versions v ON v.id=p.current_version_id AND v.publication_id=p.id
                WHERE p.post_channel_id IN (9,10) AND e.created_at>=? AND e.created_at<?
                GROUP BY p.id,p.post_channel_id,v.id,v.snapshot_json ORDER BY dialogues DESC,entries DESC,p.id LIMIT 1501");
              $q->execute([$start->format('Y-m-d H:i:s'),$end->format('Y-m-d H:i:s')]);
              $demand=$q->fetchAll(PDO::FETCH_ASSOC);
              $q->closeCursor();
              requireEdit(count($demand)<1501,'demand_limit_reached');
              $out['source_posts']=count($demand);
              $out['unbound_source_posts']=0;
              $hotels=[];
              foreach($demand as $row) {
                  $hotel=(int)$row['hotel_id'];
                  if($hotel<=0){++$out['unbound_source_posts'];continue;}
                  if(isset($exclude[$hotel]))continue;
                  $platform=(int)$row['post_channel_id']===9?'max':'telegram';
                  if(!isset($hotels[$hotel])) $hotels[$hotel]=['hotel_id'=>$hotel,'title'=>$row['title'],'demand'=>[]];
                  if(!isset($hotels[$hotel]['demand'][$platform]))
                      $hotels[$hotel]['demand'][$platform]=['dialogues'=>(int)$row['dialogues'],'entries'=>(int)$row['entries'],'url'=>$row['url']];
              }
              $rows=[];
              foreach($hotels as $hotel=>$value) {
                  $value['strongest_post_dialogues']=max(array_column(array_values($value['demand']),'dialogues'));
                  $value['strongest_post_entries']=max(array_column(array_values($value['demand']),'entries'));
                  $rows[]=$value;
              }
              usort($rows,static fn($a,$b)=>$b['strongest_post_dialogues']<=>$a['strongest_post_dialogues']
                  ?:($b['strongest_post_entries']<=>$a['strongest_post_entries'])?:($a['hotel_id']<=>$b['hotel_id']));
              $out['ranked_total']=count($rows);
              $rows=array_slice($rows,0,65);
              $ids=array_column($rows,'hotel_id');
              requireEdit($ids!==[],'no_ranked_hotels');
              $placeholders=implode(',',array_fill(0,count($ids),'?'));
              $native="CAST(JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.hotel_catalog_id')) AS UNSIGNED)";
              $reg=$pdo->prepare("SELECT p.id AS publication_id,p.post_channel_id,p.external_message_id,v.id AS version_id,v.state,v.write_attempts,
                  v.error_reason,$native AS hotel_id,JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.post_url')) AS url,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.metadata.capability')) AS capability,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.attachments[0].type')) AS media_type,
                  JSON_LENGTH(JSON_EXTRACT(v.snapshot_json,'$.attachments')) AS media_count,
                  JSON_UNQUOTE(JSON_EXTRACT(v.snapshot_json,'$.text')) AS caption
                FROM post_publications p JOIN post_versions v ON v.id=p.current_version_id AND v.publication_id=p.id
                WHERE p.post_channel_id IN (4,6) AND $native IN ($placeholders) ORDER BY p.id DESC LIMIT 401");
              $reg->execute($ids);
              $registryMatches=$reg->fetchAll(PDO::FETCH_ASSOC);
              $reg->closeCursor();
              requireEdit(count($registryMatches)<401,'channel_match_limit_reached');
              $pdo->rollBack();
              $prices=priceRows($ids);
              $matches=[];
              foreach($registryMatches as $m) {
                  $title=explode("\n",(string)$m['caption'],2)[0];
                  $price=$prices[(int)$m['hotel_id']]['block']??'';
                  $m['title']=$title;
                  $m['current_feed_price_in_registry']=$price!=='' && str_contains((string)$m['caption'],$price);
                  unset($m['caption']);
                  $matches[(int)$m['hotel_id']][(int)$m['post_channel_id']===4?'max':'telegram'][]=$m;
              }
              foreach($rows as &$row) {
                  $id=$row['hotel_id'];
                  $price=$prices[$id];
                  $row['offer']=isset($price['block'])?['price'=>$price['price'],'observation'=>$price['observation'],'departure'=>$price['departure']]
                      :['reason'=>$price['reason']??'unavailable'];
                  $row['big']=$matches[$id]??[];
              }
              $out['rows']=$rows;
              $out['ok']=true;
          } catch(Throwable $e) {
              if(isset($pdo)&&$pdo->inTransaction())$pdo->rollBack();
              $m=$e->getMessage();
              $out['reason']=preg_match('/^[a-z_0-9]{1,100}$/D',$m)?$m:'registry_candidate_read_failed';
          }
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read fresh demand, paired prices and big-channel bindings
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 -c 'import json; d=json.load(open("pub/registry.json")); print("BIG_CHANNEL_BATCH_AUDIT="+json.dumps(d,ensure_ascii=False,separators=(",",":"))); assert d.get("ok") and d.get("provider_writes")==0 and d.get("db_writes")==0'
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: big-channel-next-batch-audit
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php
