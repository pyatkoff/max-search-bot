 и наличие могут измениться.","price":"171243","observation":"2026-11-19T23:18:00+03:00","departure":"2026-12-24"},"prefix":"Swissôtel Sharm El Sheikh\n📍 Наама-Бей, Египет\n\nСемейная зона и отдельная зона для взрослых. На территории есть аквапарк, бассейны с подогревом и детский клуб. Отель занимает участки на первой и второй береговой линии."},{"mid":927,"hotel_id":73055,"date":"2024-11-13T11:09:13+00:00","photos":["5303281113382381294"],"links":[{"text":"Подписаться на канал AnyTour - любые туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}],"old_buttons":[],"caption_sha256":"f4c88446988a12270df01c3eb5573b7df6211a798621388fbba849f545667bf1","price":{"block":"💰 От 126 963 ₽ за двоих\n✈️ Вылет из Москвы 21.12.2026 · 5 ночей\n👥 2 взрослых\n🛏 deluxe room mountain view\n🍽 Завтрак и ужин\nЦена найдена мониторингом 19.11.2026, 02:30 МСК. Стоимость и наличие могут измениться.","price":"126963","observation":"2026-11-19T02:30:00+03:00","departure":"2026-12-21"},"prefix":"Address Beach Resort Fujairah\n📍 Фуджейра, ОАЭ\n\nПесчаный пляж между океаном и горами Хаджар. Три бассейна, включая бассейн для взрослых. Для семей есть детский клуб и отдельный детский бассейн."},{"mid":1043,"hotel_id":61159,"date":"2025-03-12T13:12:05+00:00","photos":["5371031731395751709"],"links":[{"text":"Подписаться на канал AnyTour - Горящие туры","url":"https://t.me/+gGloLUt4d8s3NDcy"}],"old_buttons":[{"text":"СВЯЗАТЬСЯ С МЕНЕДЖЕРОМ 📱","url":"https://t.me/AnyTour_MSK"}],"caption_sha256":"dfcf39da85384b66f09589a0b0ce68bf293f1516837e8468874717cb072fb8c5","price":{"block":"💰 От 89 843 ₽ за двоих\n✈️ Вылет из Москвы 22.12.2026 · 5 ночей\n👥 2 взрослых\n🛏 aloft room king /twin\n🍽 Завтраки\nЦена найдена мониторингом 19.11.2026, 04:01 МСК. Стоимость и наличие могут измениться.","price":"89843","observation":"2026-11-19T04:01:00+03:00","departure":"2026-12-22"},"prefix":"Aloft Palm Jumeirah\n📍 Палм-Джумейра, Дубай\n\nРесторан на крыше с панорамным видом на Дубай и променад для прогулок. Отель располагает частной зоной пляжа примерно в 300 метрах."}]
          DATA,true,16,JSON_THROW_ON_ERROR);
          $out=['ok'=>false,'writes'=>0,'rows'=>[]];
          try {
