name: "HOTEL: read the current Sugar Marina MAX button"
on:
  push:
    branches: [audit/anytour-hotel-ads-20261117]
    paths: ['.github/workflows/anytour-hotel-ads-readonly-20261117.yml']
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: anytour-issue-1566-registry-read
  cancel-in-progress: false
jobs:
  registry:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.repository.id == 1342493152 &&
      github.event.sender.id == 226193297 &&
      github.event.created == false &&
      github.actor == 'pyatkoff' &&
      github.event.before == '9838b4301727c7969ad0ff4dc585460c5d27986a' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact installed provenance source
        uses: actions/checkout@v4
        with:
          ref: e56ae1d83b643afeca7d890030198e0bcdb71083
          persist-credentials: false
      - name: Verify current main and accepted application without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e56ae1d83b643afeca7d890030198e0bcdb71083'
          node - <<'NODE'
          const R = require('./tools/deployment_release')
          const P = require('./tools/release_priority')
          const expected = 'e56ae1d83b643afeca7d890030198e0bcdb71083'
          async function read() {
            const api = R.makeReadApi(process.env.GITHUB_TOKEN)
            const current = async () => (await api('GET',R.API_ROOT+'/git/ref/heads/main')).object.sha
            if (await current() !== expected) throw Error('changed_release')
            const install = await api('GET',R.API_ROOT+'/actions/runs/45381779393')
            const slot = await api('GET',R.API_ROOT+'/issues/comments/6818332618')
            if (install.head_sha!==expected || install.run_attempt!==1 || install.status!=='completed' ||
                install.conclusion!=='success' || slot.body!=='PR1694: установлено, выпуск свободен') throw Error('current_installation_not_accepted')
            const prior=await api('GET',R.API_ROOT+'/actions/runs/45385556709')
            const receipts=await api('GET',R.API_ROOT+'/actions/runs/45385556709/artifacts?per_page=30')
            if(prior.head_sha!=='9838b4301727c7969ad0ff4dc585460c5d27986a' || prior.run_attempt!==1 || prior.repository.id!==1342493152 ||
                prior.status!=='completed' || prior.conclusion!=='success' || receipts.total_count!==1 || receipts.artifacts[0].id!==14915463382 ||
                receipts.artifacts[0].digest!=='sha256:b41f4d47c1041204ed6830730d7ab8805af15a0647787aa5658eecca398314fe') throw Error('prior_archive_read_unverified')
            const record = await R.readRecord(api)
            const actual = await R.resolveCurrent(api, {sha:expected}, record)
            if (!actual.ready || !/^[a-f0-9]{40}$/.test(actual.application_sha) || actual.repository_sha !== expected) {
              throw new Error('accepted_release_mismatch')
            }
            await P.verifyPreviousRelease({repository:R.REPOSITORY,baseSha:expected}, process.env.GITHUB_TOKEN, fetch)
            if (await current() !== expected) throw Error('changed_release')
            require('node:fs').appendFileSync(process.env.GITHUB_ENV,'VERIFIED_HOTEL_APP='+actual.application_sha+'\n')
            console.log('RANK_RELEASE_ACCEPTED='+expected)
          }
          read().catch(e=>{console.error('release_refused='+(e.code||'accepted_release_unavailable'));process.exitCode=1})
          NODE
      - name: Prepare the read-only Sugar Marina post check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir pub
          cat > pub/read-only.php <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          function must(bool $ok, string $reason): void { if (!$ok) throw new RuntimeException($reason); }
          function installed(string $root, string $expected): bool {
              return getcwd()===$root && realpath($root)===$root
                  && trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD'))===$expected
                  && trim((string)shell_exec('GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=no'))==='';
          }
          $result=['ok'=>false,'operation'=>'sugar_800_native_read','production_writes'=>0,'provider_writes'=>0,'bot_starts'=>0];
          ob_start();
          try {
              $root='/var/www/anytoour/data/www/app.anytoour.ru';
              $app='VERIFIED_HOTEL_APPLICATION_SHA';
              must(PHP_SAPI==='cli' && installed($root,$app),'installation_changed');
              $file='/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl';
              must(!is_link($file) && is_file($file),'editor_state_unknown');
              $lock=fopen($file,'rb');
              must($lock && flock($lock,LOCK_SH|LOCK_NB),'editor_busy');
              try {
                  require_once $root.'/config.php';
                  require_once $root.'/services/ChannelPostEntryService.php';
                  require_once $root.'/services/ChannelPostRegistryService.php';
                  require_once $root.'/services/ChannelPostRuntime.php';
                  require_once $root.'/integrations/ChannelPostIncomingAdapter.php';
                  require_once $root.'/integrations/ChannelPostApiTransport.php';
                  require_once $root.'/tools/anytour_existing_post_max_transfer.php';
                  must(ProjectConfig::projectId()==='anytour','project_mismatch');
                  $plan=\AnyTour\ExistingPostBatch\maxTransferPlan($root,\AnyTour\ExistingPostBatch\MAX_TRANSFER_DIGEST);
                  $target=$plan['target'];$db=ConversationDb::connection();
                  $db->exec('SET TRANSACTION READ ONLY');$db->beginTransaction();
                  try {
                      $registry=new ChannelPostRegistryService($db);$pub=$registry->publication(3722);
                      must(is_array($pub) && $pub['project_key']==='anytour' && $pub['platform']==='max' && $pub['state']==='sent'
                          && $pub['publication_id']===3722 && $pub['version_id']===14300 && $pub['message_id']===$target['message_id']
                          && (string)$pub['channel_id']===$target['channel_id'] && $pub['snapshot']['metadata']['hotel_catalog_id']===800,'registry_target_changed');
                      $resolved=$registry->resolveToken('anytour','max',$pub['bot_key'],$pub['start_payload']);
                      must(($resolved['publication_id']??null)===3722 && $resolved['version_id']===14300
                          && $resolved['snapshot']['metadata']['hotel_catalog_id']===800,'button_context_changed');
                      [$message,$snapshot]=\AnyTour\ExistingPostBatch\maxTransferRead($target);
                      $button=rtrim($pub['channel']['bot_url'],'/').'?start='.rawurlencode($pub['start_payload']);
                      must(ChannelPostIncomingAdapter::containsOnlyButton($snapshot,$button,$pub['channel']['button_text'])
                          && (string)$message['timestamp']===(string)$target['published_timestamp']
                          && hash('sha256',$snapshot['text'])==='c3ea7d302c9d98112677c8246350f67fd73f5c80bcf849efe6ea6e0fe24c7c66'
                          && hash('sha256',(string)$snapshot['attachments'][0]['photo_id'])===$plan['source']['photo_sha256'],'native_evidence_changed');
                  } finally {$db->rollBack();}
                  must(installed($root,$app),'installation_changed');
                  $result['ok']=true;
                  $result+=['publication_id'=>3722,'version_id'=>14300,'channel_id'=>$target['channel_id'],'mid'=>$target['message_id'],
                      'target_url'=>$target['url'],'button_hotel_id'=>800,'button_count'=>1,'native_caption_sha256'=>hash('sha256',$snapshot['text']),
                      'native_photo_sha256'=>$plan['source']['photo_sha256'],'provider_gets'=>1,'application_sha'=>$app,'observed_at'=>gmdate(DATE_ATOM)];
              } finally {fclose($lock);}
          } catch(Throwable $e){$reason=$e->getMessage();$result['error']=preg_match('/\A[a-z_]{2,65}\z/D',$reason)?$reason:'read_failed';}
          ob_end_clean();echo json_encode($result,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;exit($result['ok']?0:2);
          PHP
          python3 - <<'PYBIND'
          import os,pathlib,re
          path=pathlib.Path('pub/read-only.php')
          source=path.read_text()
          app=os.environ['VERIFIED_HOTEL_APP']
          assert re.fullmatch('[a-f0-9]{40}',app) and source.count('VERIFIED_HOTEL_APPLICATION_SHA')==1
          path.write_text(source.replace('VERIFIED_HOTEL_APPLICATION_SHA',app))
          PYBIND
          php -l pub/read-only.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read the registered target and its one MAX button
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10
                   -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                   -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; cd /var/www/anytoour/data/www/app.anytoour.ru; php' < pub/read-only.php > pub/registry.json
          python3 - <<'PYVERIFY'
          import json
          d=json.load(open('pub/registry.json'))
          assert d['ok'] and d['production_writes']==d['provider_writes']==d['bot_starts']==0
          assert d['provider_gets']==d['button_count']==1 and (d['publication_id'],d['version_id'],d['button_hotel_id'])==(3722,14300,800)
          print('SUGAR_NATIVE_RECEIPT='+json.dumps(d,sort_keys=True,separators=(',',':')))
          PYVERIFY
      - name: Save bounded match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sugar-800-current-native-receipt
          path: pub/registry.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove runner-only connection material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/read-only.php

