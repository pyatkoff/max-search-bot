name: Cutover preflight

on:
  workflow_dispatch:
    inputs:
      require_data_match:
        description: 'Require production and standby conversation stores to match exactly'
        required: true
        default: false
        type: boolean
      require_legacy_host_independence:
        description: 'Full old-host retirement only: require no dependency on legacy anytour.online; not required for bot cutover'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expected main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record expected revision
        shell: bash
        run: echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare SSH keys
        env:
          PROD_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STANDBY_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          write_key() {
            local raw="$1" out="$2" decoded
            rm -f "$out"
            if [[ "$raw" == *"PRIVATE KEY"* ]]; then
              if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$out"; else printf '%s\n' "$raw" | tr -d '\r' > "$out"; fi
            else
              decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
              printf '%s\n' "$decoded" | tr -d '\r' > "$out"
            fi
            chmod 600 "$out"
            ssh-keygen -y -f "$out" >/dev/null
          }
          write_key "$PROD_KEY" "$RUNNER_TEMP/prod_key"
          write_key "$STANDBY_KEY" "$RUNNER_TEMP/standby_key"

      - name: Read production state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd ~/www/anytour.online/max-search; printf '%s' \"\$(git rev-parse HEAD)\"" > "$RUNNER_TEMP/prod.sha"
          ssh -i "$RUNNER_TEMP/prod_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd ~/www/anytour.online/max-search; /opt/php81/bin/php tools/cutover_data_snapshot.php" > "$RUNNER_TEMP/prod.json"
          python3 -m json.tool "$RUNNER_TEMP/prod.json" >/dev/null

      - name: Read standby state
        env:
          STANDBY_DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          STANDBY_DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; printf '%s' \"\$(git rev-parse HEAD)\"" > "$RUNNER_TEMP/standby.sha"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/standalone_readiness.php" > "$RUNNER_TEMP/standby-readiness.txt"
          grep -qx 'STANDALONE_READY=YES' "$RUNNER_TEMP/standby-readiness.txt"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/cutover_legacy_host_dependency.php" > "$RUNNER_TEMP/standby-legacy-host.txt"
          ssh -i "$RUNNER_TEMP/standby_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$STANDBY_DEPLOY_USER@$STANDBY_DEPLOY_HOST" \
            "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/cutover_data_snapshot.php" > "$RUNNER_TEMP/standby.json"
          python3 -m json.tool "$RUNNER_TEMP/standby.json" >/dev/null

      - name: Evaluate cutover blockers
        env:
          REQUIRE_DATA_MATCH: ${{ inputs.require_data_match }}
          REQUIRE_LEGACY_HOST_INDEPENDENCE: ${{ inputs.require_legacy_host_independence }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = os.environ['EXPECTED_SHA'].strip()
          prod_sha = root.joinpath('prod.sha').read_text().strip()
          standby_sha = root.joinpath('standby.sha').read_text().strip()
          prod = json.loads(root.joinpath('prod.json').read_text())
          standby = json.loads(root.joinpath('standby.json').read_text())
          require_match = os.environ.get('REQUIRE_DATA_MATCH', 'false').lower() == 'true'
          require_legacy_independence = os.environ.get('REQUIRE_LEGACY_HOST_INDEPENDENCE', 'false').lower() == 'true'
          legacy_lines = root.joinpath('standby-legacy-host.txt').read_text().splitlines()
          legacy_values = {}
          for line in legacy_lines:
              if '=' in line:
                  key, value = line.split('=', 1)
                  legacy_values.setdefault(key, []).append(value)
          legacy_dependency = legacy_values.get('LEGACY_HOST_DEPENDENCY', ['YES'])[0] == 'YES'
          receiver_host = legacy_values.get('LEAD_RECEIVER_HOST', [''])[0]

          blockers = []
          if prod_sha != expected:
              blockers.append(f'production_sha_mismatch:{prod_sha}:{expected}')
          if standby_sha != expected:
              blockers.append(f'standby_sha_mismatch:{standby_sha}:{expected}')

          all_equal = True
          print('CUTOVER_PREFLIGHT')
          print('expected_sha=' + expected)
          print('production_sha=' + prod_sha)
          print('standby_sha=' + standby_sha)
          print('lead_receiver_host=' + receiver_host)
          print('legacy_host_dependency=' + ('YES' if legacy_dependency else 'NO'))
          print('legacy_host_retirement_ready=' + ('NO' if legacy_dependency else 'YES'))
          print('require_legacy_host_independence=' + ('YES' if require_legacy_independence else 'NO'))
          for dependency in legacy_values.get('LEGACY_DEPENDENCY', []):
              print('legacy_dependency=' + dependency)
          print('table\tproduction\tstandby\tdelta')
          for table, p in prod.get('tables', {}).items():
              s = standby.get('tables', {}).get(table, {'row_count': -1, 'max_id': -1})
              p_count = int(p['row_count'])
              s_count = int(s['row_count'])
              equal = p_count == s_count and int(p['max_id']) == int(s['max_id'])
              all_equal = all_equal and equal
              print(f'{table}\t{p_count}\t{s_count}\t{p_count - s_count}')

          print('data_match=' + ('YES' if all_equal else 'NO'))
          print('require_data_match=' + ('YES' if require_match else 'NO'))
          if require_match and not all_equal:
              blockers.append('conversation_data_mismatch')

          bot_cutover_ready = not blockers
          print('BOT_CUTOVER_READY=' + ('YES' if bot_cutover_ready else 'NO'))
          if legacy_dependency:
              print('BOT_CUTOVER_LEGACY_BRIDGE=ALLOWED')

          if require_legacy_independence and legacy_dependency:
              blockers.append('legacy_host_dependency_for_full_retirement')

          if blockers:
              print('CUTOVER_PREFLIGHT_READY=NO')
              for blocker in blockers:
                  print('BLOCKER=' + blocker)
              sys.exit(1)

          print('CUTOVER_PREFLIGHT_READY=YES')
          PY

      - name: Confirm read-only policy
        shell: bash
        run: |
          echo "Preflight only reads code revision, standalone readiness, legacy-host dependency and conversation-store snapshots."
          echo "A legacy lead bridge may remain for bot cutover; legacy-host independence is required only when retiring the old host."
          echo "It never freezes traffic, dumps/imports databases, changes webhooks, starts cron, or performs cutover."
