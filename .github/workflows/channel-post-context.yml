name: Channel post context

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'services/ChannelPost*'
      - 'services/SourceHandlingService.php'
      - 'integrations/ChannelPost*'
      - 'handlers/MaxUpdateHandler.php'
      - 'handlers/TelegramWebhookHandler.php'
      - 'telegram_webhook.php'
      - 'project.php'
      - 'manager/**'
      - 'manager2/**'
      - 'migrations/033_channel_post_context.sql'
      - 'tests/visual/manager-post-context.spec.js'
      - 'tests/visual/fixtures/post-channel-shell.php'
      - 'tests/mysql/channel-post-registry.php'
      - '.github/workflows/channel-post-context.yml'
      - '.github/workflows/ci-change-scope.yml'
      - 'tools/ci_change_scope.js'
      - 'tests/run_ci_change_scope_regression.js'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  change-scope:
    uses: ./.github/workflows/ci-change-scope.yml

  browser:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Check actual workspace and channel setup
        env:
          M2_ARTIFACT_ROOT: ${{ github.workspace }}/post-context-visual-artifacts
        run: npx playwright test tests/visual/manager-post-context.spec.js --browser=${{ matrix.browser }} --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-context-${{ matrix.browser }}-${{ github.sha }}
          path: |
            post-context-visual-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

  native-mysql:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: post-context-test-only
          MYSQL_DATABASE: channel_post_registry_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppost-context-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Apply actual migration and exercise native registry
        env:
          CHANNEL_POST_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=channel_post_registry_test;charset=utf8mb4
          CHANNEL_POST_TEST_MYSQL_USER: root
          CHANNEL_POST_TEST_MYSQL_PASSWORD: post-context-test-only
        run: php tests/mysql/channel-post-registry.php
