name: Channel post context

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/ChannelPost*'
      - 'services/SourceHandlingService.php'
      - 'integrations/ChannelPost*'
      - 'handlers/MaxUpdateHandler.php'
      - 'handlers/TelegramWebhookHandler.php'
      - 'telegram_webhook.php'
      - 'project.php'
      - 'manager/**'
      - 'manager2/**'
      - 'migrations/033_channel_post_context.sql'
      - 'tests/visual/manager-post-context.spec.js'
      - 'tests/visual/fixtures/post-channel-shell.php'
      - 'tests/mysql/channel-post-registry.php'
      - '.github/workflows/channel-post-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check actual workspace and channel setup
        env:
          M2_ARTIFACT_ROOT: ${{ github.workspace }}/post-context-visual-artifacts
        run: npx playwright test tests/visual/manager-post-context.spec.js --browser=${{ matrix.browser }} --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-context-${{ matrix.browser }}-${{ github.sha }}
          path: |
            post-context-visual-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

  native-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: post-context-test-only
          MYSQL_DATABASE: channel_post_registry_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppost-context-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Apply actual migration and exercise native registry
        env:
          CHANNEL_POST_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=channel_post_registry_test;charset=utf8mb4
          CHANNEL_POST_TEST_MYSQL_USER: root
          CHANNEL_POST_TEST_MYSQL_PASSWORD: post-context-test-only
        run: php tests/mysql/channel-post-registry.php
