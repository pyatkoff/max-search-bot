name: Qualification offline test dependency (tools only)
on:
  push:
    branches: [tools/qualification-native-runtime-20260921]
permissions:
  contents: read
jobs:
  dependency:
    if: github.repository == 'pyatkoff/max-search-bot' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Download existing hash-pinned test dependency, without repository or production data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheels"
          printf '%s\n' 'pyrage==1.3.0 --hash=sha256:ab066b22925c5a0ec5fead2e21e4586b21d5da730055c7e46caa978bd99de936' > "$RUNNER_TEMP/requirements.txt"
          python3 -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/requirements.txt" --dest "$RUNNER_TEMP/wheels"
          sha256sum "$RUNNER_TEMP/wheels/"*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-pinned-test-wheel
          path: ${{ runner.temp }}/wheels/*.whl
          retention-days: 1
          if-no-files-found: error
