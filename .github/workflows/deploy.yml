name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run deterministic regression suite
        run: php tests/run_regression.php

      - name: Run AI context regression suite
        run: php tests/run_ai_context_regression.php

      - name: Run conversation regression suite
        run: php tests/run_conversation_regression.php

      - name: Run conversation catalog suite
        run: php tests/run_conversation_catalog.php

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            git fetch origin main
            git pull --ff-only origin main
            php -l webhook.php
            php export_debug_logs.php
