name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run deterministic regression suite
        run: php tests/run_regression.php

      - name: Run AI context regression suite
        run: php tests/run_ai_context_regression.php

      - name: Run TripState regression suite
        run: php tests/run_trip_state_regression.php

      - name: Run V2 architecture regression suite
        run: php tests/run_v2_architecture_regression.php

      - name: Run V2 action layer regression suite
        run: php tests/run_v2_action_layer_regression.php

      - name: Run integration contracts regression suite
        run: php tests/run_integration_contracts_regression.php

      - name: Run messenger adapter regression suite
        run: php tests/run_messenger_adapters_regression.php

      - name: Run Telegram webhook regression suite
        run: php tests/run_telegram_webhook_regression.php

      - name: Run Telegram smoke test
        run: php tools/telegram_smoke_test.php

      - name: Run dialogue application regression suite
        run: php tests/run_dialogue_application_regression.php

      - name: Run dialogue controller regression suite
        run: php tests/run_dialogue_controller_regression.php

      - name: Run callback controller regression suite
        run: php tests/run_callback_controller_regression.php

      - name: Run dialogue view regression suite
        run: php tests/run_dialogue_view_regression.php

      - name: Run calendar view model regression suite
        run: php tests/run_calendar_view_model_regression.php

      - name: Run tour results regression suite
        run: php tests/run_tour_results_regression.php

      - name: Run manager request regression suite
        run: php tests/run_manager_request_regression.php

      - name: Run post-tour regression suite
        run: php tests/run_post_tour_regression.php

      - name: Run messenger-neutral handler regression suite
        run: php tests/run_messenger_neutral_handlers_regression.php

      - name: Run wizard free-text regression suite
        run: php tests/run_state_free_text_regression.php

      - name: Run missing-field question regression suite
        run: php tests/run_missing_field_questions_regression.php

      - name: Run platform boundary regression suite
        run: php tests/run_platform_boundary_regression.php

      - name: Run shadow dialogue regression suite
        run: php tests/run_shadow_dialogue_regression.php

      - name: Run shadow comparison regression suite
        run: php tests/run_shadow_comparison_regression.php

      - name: Run V2 early action regression suite
        run: php tests/run_v2_early_action_regression.php

      - name: Run state repository regression suite
        run: php tests/run_state_repository_regression.php

      - name: Run claim regression suite
        run: php tests/run_claim_regression.php

      - name: Run travel directory regression suite
        run: php tests/run_directory_regression.php

      - name: Run conversation regression suite
        run: php tests/run_conversation_regression.php

      - name: Run conversation catalog suite
        run: php tests/run_conversation_catalog.php

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for deploy telemetry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH probe
        id: ssh_probe
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            echo "SSH probe OK: $(pwd)"

      - name: Sync production checkout
        id: sync
        if: steps.ssh_probe.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            git fetch origin main

            if ! git diff --quiet || ! git diff --cached --quiet; then
              backup_name="autodeploy-backup-$(date +%Y%m%d-%H%M%S)"
              echo "Tracked production changes detected; saving them as ${backup_name}"
              git status --short
              git stash push -m "${backup_name}"
            fi

            git reset --hard origin/main
            echo "Deployed commit: $(git rev-parse HEAD)"

      - name: Production smoke checks
        id: smoke
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            php -l webhook.php
            php -l telegram_webhook.php
            php -l telegram_webhook_admin.php
            php tools/telegram_smoke_test.php
            /opt/php81/bin/php tools/telegram_start_smoke.php
            php export_debug_logs.php

      - name: Publish deploy stage status
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PROBE_OUTCOME: ${{ steps.ssh_probe.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          printf '{"sha":"%s","run_id":"%s","probe":"%s","sync":"%s","smoke":"%s","reported_at":"%s"}\n' \
            "$DEPLOY_SHA" "$RUN_ID" "$PROBE_OUTCOME" "$SYNC_OUTCOME" "$SMOKE_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > deploy_status.json
          git add deploy_status.json
          git commit -m "Report deploy status for ${DEPLOY_SHA}" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then
              exit 0
            fi
            git pull --rebase origin diagnostics
          done
          exit 1

      - name: Fail failed deployment
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.ssh_probe.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -e
          test "$PROBE_OUTCOME" = "success"
          test "$SYNC_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
