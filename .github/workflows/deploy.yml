name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Run required checks
        run: bash tests/run_required_checks.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare canonical SSH private key
        id: ssh_key
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Build exact deployment bundle
        id: bundle
        if: steps.ssh_key.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/production-deploy.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/production-deploy.bundle"

      - name: Sync canonical production checkout
        id: sync
        if: steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          bundle_file="$RUNNER_TEMP/production-deploy.bundle"
          remote_bundle="/tmp/max-search-production-$EXPECTED_SHA.bundle"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          scp "${ssh_opts[@]}" "$bundle_file" "$DEPLOY_USER@$DEPLOY_HOST:$remote_bundle"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; if ! git diff --quiet || ! git diff --cached --quiet; then echo 'ERROR: tracked production drift detected'; git status --short; rm -f '$remote_bundle'; exit 1; fi; git fetch '$remote_bundle' HEAD; git cat-file -e '$EXPECTED_SHA^{commit}'; git reset --hard '$EXPECTED_SHA'; rm -f '$remote_bundle'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; echo production_sha=\$(git rev-parse HEAD)"

      - name: Apply database migrations
        id: migration
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/conversation_db.php migrate'

      - name: Reconcile canonical MAX webhook ownership
        id: max_webhook_reconcile
        if: steps.migration.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/max_webhook_reconcile.php --apply'

      - name: Production smoke checks
        id: smoke
        if: steps.max_webhook_reconcile.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; php -l webhook.php; php -l telegram_webhook.php; php -l telegram_webhook_admin.php; php tools/telegram_smoke_test.php; bash tools/manager_http_smoke.sh; rm -f ai_debug.log handlers/ai_debug.log handlers/ai_errors.log; php tools/ai_runtime_log_smoke.php; rm -f diag-tdxAcIvIkZwuvgwq86B1x9fFMJo3GfRa-*.json; rm -rf diagnostics; rm -rf '/tmp/max-search-diagnostics-$EXPECTED_SHA'; install -d -m 700 '/tmp/max-search-diagnostics-$EXPECTED_SHA'; MAX_SEARCH_DIAGNOSTICS_OUTPUT_DIR='/tmp/max-search-diagnostics-$EXPECTED_SHA' php export_debug_logs.php; test -n \"\$(find '/tmp/max-search-diagnostics-$EXPECTED_SHA' -maxdepth 1 -type f -name '*.json' -print -quit)\""
          for path in ai_debug.log handlers/ai_debug.log handlers/ai_errors.log; do
            status="$(curl --max-time 15 -sS -o /dev/null -I -w '%{http_code}' "https://app.anytoour.ru/$path")"
            case "$status" in 403|404) ;; *) echo "Public AI log containment failed for $path: HTTP $status" >&2; exit 1;; esac
          done

      - name: Download production diagnostics
        id: download_diagnostics
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production-diagnostics
          mkdir -p production-diagnostics
          remote_diag_dir="/tmp/max-search-diagnostics-$EXPECTED_SHA"
          cleanup_remote_diagnostics() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$remote_diag_dir'" || true
          }
          trap cleanup_remote_diagnostics EXIT
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST:$remote_diag_dir/*.json" production-diagnostics/
          test -n "$(find production-diagnostics -maxdepth 1 -type f -name '*.json' -print -quit)"
          cleanup_remote_diagnostics
          trap - EXIT

      - name: Publish deploy stage status
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          KEY_OUTCOME: ${{ steps.ssh_key.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          MAX_WEBHOOK_OUTCOME: ${{ steps.max_webhook_reconcile.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_diagnostics.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          rm -rf production-diagnostics
          find . -maxdepth 1 -type f -name '*.json' ! -name 'deploy_status.json' ! -name 'ops_status.json' ! -name 'autopilot_snapshot.json' ! -name 'architecture_inventory.json' ! -name 'public_live_status.json' ! -name 'public_daily_status.json' -delete
          rm -f migration.log
          printf '{"sha":"%s","run_id":"%s","key":"%s","bundle":"%s","sync":"%s","migration":"%s","max_webhook":"%s","smoke":"%s","diagnostics":"%s","reported_at":"%s"}\n' "$DEPLOY_SHA" "$RUN_ID" "$KEY_OUTCOME" "$BUNDLE_OUTCOME" "$SYNC_OUTCOME" "$MIGRATION_OUTCOME" "$MAX_WEBHOOK_OUTCOME" "$SMOKE_OUTCOME" "$DOWNLOAD_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy_status.json
          git add -A
          git commit -m "Report deploy status for ${DEPLOY_SHA}" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then exit 0; fi
            git pull --rebase origin diagnostics
          done
          exit 1

      - name: Fail failed deployment
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.ssh_key.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          MAX_WEBHOOK_OUTCOME: ${{ steps.max_webhook_reconcile.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_diagnostics.outcome }}
        shell: bash
        run: |
          set -e
          test "$KEY_OUTCOME" = "success"
          test "$BUNDLE_OUTCOME" = "success"
          test "$SYNC_OUTCOME" = "success"
          test "$MIGRATION_OUTCOME" = "success"
          test "$MAX_WEBHOOK_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
          test "$DOWNLOAD_OUTCOME" = "success"
