name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Verify required inventory and architecture
        run: php tests/run_required_group.php architecture

  verify-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  verify-groups:
    needs: verify-inventory
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: diagnostics
            groups: diagnostics
          - lane: application
            groups: dialogue website manager
    runs-on: ubuntu-latest
    name: verify / ${{ matrix.lane }}
    steps:
      - name: Checkout exact verification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Run every required group in this lane
        env:
          DEPLOY_CHECK_GROUPS: ${{ matrix.groups }}
        run: |
          test -n "$DEPLOY_CHECK_GROUPS"
          for check_group in $DEPLOY_CHECK_GROUPS; do
            php tests/run_required_group.php "$check_group"
          done

  deploy:
    if: always()
    needs: [verify-inventory, verify-syntax, verify-groups]
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete deployment verification
        env:
          INVENTORY_RESULT: ${{ needs.verify-inventory.result }}
          SYNTAX_RESULT: ${{ needs.verify-syntax.result }}
          CHECK_GROUPS_RESULT: ${{ needs.verify-groups.result }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$INVENTORY_RESULT" = success
          test "$SYNTAX_RESULT" = success
          test "$CHECK_GROUPS_RESULT" = success

      - name: Checkout exact deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify deployment SHA is current main
        id: provenance
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: bash tools/verify_deploy_main_provenance.sh

      - name: Prepare canonical SSH private key
        id: ssh_key
        if: steps.provenance.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Build exact deployment bundle
        id: bundle
        if: steps.ssh_key.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/production-deploy.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/production-deploy.bundle"

      - name: Sync canonical production checkout
        id: sync
        if: steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          bundle_file="$RUNNER_TEMP/production-deploy.bundle"
          remote_bundle="/tmp/max-search-production-$EXPECTED_SHA.bundle"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          scp "${ssh_opts[@]}" "$bundle_file" "$DEPLOY_USER@$DEPLOY_HOST:$remote_bundle"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; if ! git diff --quiet || ! git diff --cached --quiet; then echo 'ERROR: tracked production drift detected'; git status --short; rm -f '$remote_bundle'; exit 1; fi; git fetch '$remote_bundle' HEAD; git cat-file -e '$EXPECTED_SHA^{commit}'; git reset --hard '$EXPECTED_SHA'; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; php tools/structured_runtime_log_smoke.php; rm -f '$remote_bundle'; echo production_sha=\$(git rev-parse HEAD)"
          status="$(curl --max-time 15 -sS -o /dev/null -I -w '%{http_code}' 'https://app.anytoour.ru/structured_events.log')"
          case "$status" in 403|404) ;; *) echo "Public structured log containment failed: HTTP $status" >&2; exit 1;; esac

      - name: Apply database migrations and fence the old hotel contour
        id: migration
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /var/www/anytoour/data/www/app.anytoour.ru
            run_hotel_op() {
              rc=0
              /usr/bin/php tools/hotel_retirement_ops.php "$1" || rc=$?
              if [ "$rc" -eq 3 ] && [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
                sudo -n -- /usr/bin/php tools/hotel_retirement_ops.php "$1"
              else
                return "$rc"
              fi
            }
            run_hotel_op migrate083
            php tools/conversation_db.php migrate
            run_hotel_op retire-old
          '

      - name: Reconcile canonical MAX webhook ownership
        id: max_webhook_reconcile
        if: steps.migration.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; php tools/max_webhook_reconcile.php --apply'

      - name: Ensure Metrika offline uploader cron
        id: metrika_cron
        if: steps.max_webhook_reconcile.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            root=/var/www/anytoour/data/www/app.anytoour.ru
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l 2>/dev/null >"$before" || true
            cp "$before" "$after"
            sed -i -E "/cron_metrika\\.php/d;/# max-search-bot metrika uploader/d" "$after"
            {
              echo "# max-search-bot metrika uploader"
              echo "*/5 * * * * flock -n /tmp/max-search-metrika-cron.lock /usr/bin/php $root/cron_metrika.php >> $root/metrika_upload.log 2>&1"
            } >>"$after"
            rollback() { crontab "$before" || true; rm -f "$before" "$after"; }
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -E "(^|[[:space:]])([^#[:space:]]*/)?cron_metrika\\.php([[:space:]]|$)" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            trap - ERR
            rm -f "$before" "$after"
            echo "METRIKA_CRON_COUNT=1"
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l >"$before"
            cp "$before" "$after"
            sed -i "/^# max-search-bot channel post recovery$/d" "$after"
            grep -F -v "$root/tools/channel_post_worker.php --platform=max --run --reconcile" "$after" >"$after.filtered" || [[ "$?" == "1" ]]
            mv "$after.filtered" "$after"
            {
              echo "# max-search-bot channel post recovery"
              echo "* * * * * flock -n /tmp/max-search-channel-post-cron.lock /usr/bin/php $root/tools/channel_post_worker.php --platform=max --run --reconcile >/dev/null 2>&1"
            } >>"$after"
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -F "$root/tools/channel_post_worker.php --platform=max --run --reconcile" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            trap - ERR
            rm -f "$before" "$after"
            echo "CHANNEL_POST_CRON_COUNT=1"
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l >"$before"
            cp "$before" "$after"
            sed -i "/^# max-search-bot manager preparation$/d" "$after"
            grep -F -v "$root/tools/manager_prepared_replies.php tick" "$after" >"$after.filtered" || [[ "$?" == "1" ]]
            mv "$after.filtered" "$after"
            {
              echo "# max-search-bot manager preparation"
              echo "* * * * * flock -n /tmp/max-search-manager-preparation.lock /usr/bin/php $root/tools/manager_prepared_replies.php tick >/dev/null 2>&1"
            } >>"$after"
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -F "$root/tools/manager_prepared_replies.php tick" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            trap - ERR
            rm -f "$before" "$after"
            echo "MANAGER_PREPARATION_CRON_COUNT=1"
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l >"$before"
            cp "$before" "$after"
            sed -i "/^# max-search-bot hotel readiness$/d" "$after"
            grep -F -v "$root/tools/hotel_work.php tick" "$after" >"$after.filtered" || [[ "$?" == "1" ]]
            mv "$after.filtered" "$after"
            {
              echo "# max-search-bot hotel readiness"
              echo "* * * * * HOTEL_WORK_TRIGGER=cron flock -n /tmp/max-search-hotel-work.lock /usr/bin/php $root/tools/hotel_work.php tick >/dev/null 2>&1"
            } >>"$after"
            trap rollback ERR
            crontab "$after"
            count="$(crontab -l | grep -F "$root/tools/hotel_work.php tick" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            # Keep the hotel rollback boundary until both required observers finish.
            # Configuration writes remain serial; only the read-only observers overlap.
            hotel_before="$before"
            rm -f "$after"
            cleanup_pending_crons() {
              rm -f "$hotel_before" "$before" "$after"
            }
            rollback_pending_crons() {
              crontab "$hotel_before" || true
              cleanup_pending_crons
            }
            trap cleanup_pending_crons EXIT
            trap rollback_pending_crons ERR
            before="$(mktemp)"
            after="$(mktemp)"
            crontab -l >"$before"
            cp "$before" "$after"
            sed -i "/^# max-search-bot development readiness$/d" "$after"
            grep -F -v "$root/tools/development_work.php tick" "$after" >"$after.filtered" || [[ "$?" == "1" ]]
            mv "$after.filtered" "$after"
            {
              echo "# max-search-bot development readiness"
              echo "* * * * * DEVELOPMENT_WORK_TRIGGER=cron flock -n /tmp/max-search-development-work.lock /usr/bin/php $root/tools/development_work.php tick >/dev/null 2>&1"
            } >>"$after"
            crontab "$after"
            count="$(crontab -l | grep -F "$root/tools/development_work.php tick" | wc -l | tr -d " ")"
            [[ "$count" == "1" ]]
            verification_result=0
            bash "$root/tools/verify_deploy_crons.sh" || verification_result=$?
            if [[ "$verification_result" != "0" ]]; then
              trap - ERR
              if [[ "$verification_result" == "2" ]]; then
                # Hotel passed: retain it and restore only the development boundary.
                rollback
                rm -f "$hotel_before"
              else
                # Hotel failed or the observer pair could not complete.
                rollback_pending_crons
              fi
              exit "$verification_result"
            fi
            trap - ERR
            cleanup_pending_crons
            trap - EXIT
            echo "HOTEL_WORK_CRON_COUNT=1"
            echo "DEVELOPMENT_WORK_CRON_COUNT=1"
            bash "$root/tools/reconcile_modeled_conversion_monitor_cron.sh"
          '


      - name: Apply profile and retain exact diagnostic snapshot
        id: installed
        if: steps.metrika_cron.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$EXPECTED_SHA" "$GITHUB_RUN_ID" <<'INSTALL_REMOTE'
          set -euo pipefail
          umask 077
          EXPECTED_SHA="$1"
          run_id="$2"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          MAX_SEARCH_APPLY_AI_PROFILE=1 php tools/ai_profile_rollout.php --apply; php tools/ai_profile_rollout.php --verify;
          php tools/virtual_reply_learning.php control-status
          rm -f ai_debug.log handlers/ai_debug.log handlers/ai_errors.log tmp_in.txt tmp_out.txt
          php tools/ai_runtime_log_smoke.php
          php tools/webhook_runtime_log_smoke.php
          rm -f diag-tdxAcIvIkZwuvgwq86B1x9fFMJo3GfRa-*.json;
          rm -rf diagnostics
          snapshot="/tmp/max-search-diagnostics-$EXPECTED_SHA-$run_id"
          # Existing input is UNKNOWN, never clear it and repeat the export.
          test ! -e "$snapshot"
          install -d -m 700 "$snapshot"
          MAX_SEARCH_DIAGNOSTICS_OUTPUT_DIR="$snapshot" php export_debug_logs.php
          test -n "$(find "$snapshot" -maxdepth 1 -type f -name '*.json' -print -quit)"
          (cd "$snapshot"; tar -cf snapshot.tar -- *.json; sha256sum snapshot.tar > snapshot.sha256)
          chmod 400 "$snapshot/snapshot.tar" "$snapshot/snapshot.sha256"
          INSTALL_REMOTE

      - name: Fail failed installation
        if: always()
        env:
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          KEY_OUTCOME: ${{ steps.ssh_key.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          MAX_WEBHOOK_OUTCOME: ${{ steps.max_webhook_reconcile.outcome }}
          METRIKA_CRON_OUTCOME: ${{ steps.metrika_cron.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        run: |
          test "$PROVENANCE_OUTCOME" = success
          test "$KEY_OUTCOME" = success
          test "$BUNDLE_OUTCOME" = success
          test "$SYNC_OUTCOME" = success
          test "$MIGRATION_OUTCOME" = success
          test "$MAX_WEBHOOK_OUTCOME" = success
          test "$METRIKA_CRON_OUTCOME" = success
          test "$INSTALLED_OUTCOME" = success

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact installed verification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Admit only unfinished verification without installation
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release_slot_close.js --admit-verification >> "$GITHUB_OUTPUT"
      - name: Prepare canonical SSH private key
        id: ssh_key
        if: steps.admission.outcome == 'success'
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "canonical deploy key is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null


      - name: Verify installed production checks
        id: check
        if: steps.admission.outputs.run_check == 'true'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$EXPECTED_SHA" <<'CHECK_REMOTE'
          set -euo pipefail
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$1"
          php -l webhook.php
          php -l telegram_webhook.php
          php -l telegram_webhook_admin.php
          php tools/telegram_smoke_test.php
          php tools/search_destination_smoke.php --http
          bash tools/manager_http_smoke.sh
          php tools/manager_preparation_smoke.php
          php tools/ai_runtime_log_smoke.php --check-only
          php tools/webhook_runtime_log_smoke.php --check-only
          php tools/structured_runtime_log_smoke.php --check-only
          CHECK_REMOTE
          for path in ai_debug.log handlers/ai_debug.log handlers/ai_errors.log tmp_in.txt tmp_out.txt structured_events.log; do
            status="$(curl --max-time 15 -sS -o /dev/null -I -w '%{http_code}' "https://app.anytoour.ru/$path")"
            case "$status" in 403|404) ;; *) echo "Public runtime log containment failed for $path: HTTP $status" >&2; exit 1;; esac
          done

      - name: Download exact installed diagnostic snapshot
        id: download
        if: steps.admission.outputs.run_download == 'true' && (steps.check.outcome == 'success' || steps.admission.outputs.check_result == 'success')
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          snapshot="/tmp/max-search-diagnostics-$EXPECTED_SHA-$GITHUB_RUN_ID"
          local_snapshot="$RUNNER_TEMP/production-diagnostics"
          mkdir -m 700 "$local_snapshot"
          # A failed transfer retains the original protected server snapshot.
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA'; cd '$snapshot'; sha256sum -c snapshot.sha256 >/dev/null"
          scp -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST:$snapshot/snapshot.tar" "$DEPLOY_USER@$DEPLOY_HOST:$snapshot/snapshot.sha256" "$local_snapshot/"
          (cd "$local_snapshot"; sha256sum -c snapshot.sha256 >/dev/null)

      - name: Publish verification stage status
        id: status
        if: always() && steps.admission.outputs.run_status == 'true' && steps.ssh_key.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_ATTEMPT: ${{ steps.admission.outputs.smoke_attempt }}
          DIAGNOSTICS_ATTEMPT: ${{ steps.admission.outputs.diagnostics_attempt }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_ACCEPTED: ${{ steps.admission.outputs.check_result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          DOWNLOAD_ACCEPTED: ${{ steps.admission.outputs.download_result }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/release_slot_close.js --stage-status > "$RUNNER_TEMP/deploy-status.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          rm -rf production-diagnostics "$RUNNER_TEMP/production-diagnostics"
          find . -maxdepth 1 -type f -name '*.json' ! -name 'deploy_status.json' ! -name 'ops_status.json' ! -name 'autopilot_snapshot.json' ! -name 'architecture_inventory.json' ! -name 'public_live_status.json' ! -name 'public_daily_status.json' -delete
          rm -f migration.log
          if test -f deploy_status.json && node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync("deploy_status.json"));const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/deploy-status.json"));delete a.reported_at;process.exit(JSON.stringify(a)===JSON.stringify(b)?0:1)'; then exit 0; fi
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/deploy-status.json"));p.reported_at=new Date().toISOString().replace(/\.\d{3}Z$/,"Z");fs.writeFileSync("deploy_status.json",JSON.stringify(p)+"\n")'
          git add -A
          git commit -m "Report installed verification status" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then exit 0; fi
            git fetch origin diagnostics
            git show origin/diagnostics:deploy_status.json > "$RUNNER_TEMP/remote-deploy-status.json"
            if node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/remote-deploy-status.json"));const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/deploy-status.json"));delete a.reported_at;process.exit(JSON.stringify(a)===JSON.stringify(b)?0:1)'; then exit 0; fi
            git rebase origin/diagnostics
          done
          exit 1

      - name: Remove acknowledged diagnostic snapshot
        id: cleanup
        if: steps.admission.outputs.run_cleanup == 'true' && (steps.download.outcome == 'success' || steps.admission.outputs.download_result == 'success') && (steps.status.outcome == 'success' || steps.admission.outputs.status_result == 'success')
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$EXPECTED_SHA" "$GITHUB_RUN_ID" <<'CLEAN_REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          [[ "$2" =~ ^[1-9][0-9]*$ ]]
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "$1"
          snapshot="/tmp/max-search-diagnostics-$1-$2"
          # Reconcile a lost cleanup response before considering another delete.
          if test ! -e "$snapshot"; then exit 0; fi
          test -d "$snapshot" && test ! -L "$snapshot" && test -O "$snapshot"
          (cd "$snapshot"; sha256sum -c snapshot.sha256 >/dev/null)
          rm -rf -- "$snapshot"
          test ! -e "$snapshot"
          CLEAN_REMOTE

      - name: Require complete installed verification
        if: always()
        env:
          ADMISSION: ${{ steps.admission.outcome }}
          KEY: ${{ steps.ssh_key.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CHECK_ACCEPTED: ${{ steps.admission.outputs.check_result }}
          DOWNLOAD: ${{ steps.download.outcome }}
          DOWNLOAD_ACCEPTED: ${{ steps.admission.outputs.download_result }}
          STATUS: ${{ steps.status.outcome }}
          STATUS_ACCEPTED: ${{ steps.admission.outputs.status_result }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          CLEANUP_ACCEPTED: ${{ steps.admission.outputs.cleanup_result }}
        run: |
          test "$ADMISSION" = success
          test "$KEY" = success
          test "$CHECK" = success || test "$CHECK_ACCEPTED" = success
          test "$DOWNLOAD" = success || test "$DOWNLOAD_ACCEPTED" = success
          test "$STATUS" = success || test "$STATUS_ACCEPTED" = success
          test "$CLEANUP" = success || test "$CLEANUP_ACCEPTED" = success
