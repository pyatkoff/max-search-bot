name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Run required checks
        run: bash tests/run_required_checks.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for deploy telemetry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH private key
        id: ssh_key
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"

          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi

          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH private key parsed successfully"

      - name: SSH probe
        id: ssh_probe
        if: steps.ssh_key.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            echo "SSH probe OK: $(pwd)"

      - name: Sync production checkout
        id: sync
        if: steps.ssh_probe.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          envs: EXPECTED_SHA
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            git fetch origin main

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: tracked production drift detected; refusing to overwrite local changes"
              git status --short
              exit 1
            fi

            git cat-file -e "$EXPECTED_SHA^{commit}"
            git reset --hard "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            echo "Deployed commit: $(git rev-parse HEAD)"

      - name: Apply database migrations
        id: migration
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            /opt/php81/bin/php tools/conversation_db.php migrate

      - name: Production smoke checks
        id: smoke
        if: steps.migration.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/max-search
            /opt/php81/bin/php -l webhook.php
            /opt/php81/bin/php -l telegram_webhook.php
            /opt/php81/bin/php -l telegram_webhook_admin.php
            /opt/php81/bin/php tools/telegram_smoke_test.php
            bash tools/manager_http_smoke.sh
            /opt/php81/bin/php export_debug_logs.php
            rm -rf diagnostics
            mkdir -p diagnostics
            cp diag-tdxAcIvIkZwuvgwq86B1x9fFMJo3GfRa-*.json diagnostics/

      - name: Download production diagnostics
        id: download_diagnostics
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production-diagnostics
          mkdir -p production-diagnostics
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -i "$RUNNER_TEMP/deploy_key" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:www/anytour.online/max-search/diagnostics/*.json" \
            production-diagnostics/
          test -n "$(find production-diagnostics -maxdepth 1 -type f -name '*.json' -print -quit)"

      - name: Publish deploy stage status
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          KEY_OUTCOME: ${{ steps.ssh_key.outcome }}
          PROBE_OUTCOME: ${{ steps.ssh_probe.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_diagnostics.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          if [ -d ../production-diagnostics ]; then
            find ../production-diagnostics -maxdepth 1 -type f -name '*.json' -exec cp {} . \;
          fi
          printf '{"sha":"%s","run_id":"%s","key":"%s","probe":"%s","sync":"%s","migration":"%s","smoke":"%s","diagnostics":"%s","reported_at":"%s"}\n' \
            "$DEPLOY_SHA" "$RUN_ID" "$KEY_OUTCOME" "$PROBE_OUTCOME" "$SYNC_OUTCOME" "$MIGRATION_OUTCOME" "$SMOKE_OUTCOME" "$DOWNLOAD_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > deploy_status.json
          git add deploy_status.json *.json
          git commit -m "Report deploy status for ${DEPLOY_SHA}" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then
              exit 0
            fi
            git pull --rebase origin diagnostics
          done
          exit 1

      - name: Fail failed deployment
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.ssh_key.outcome }}
          PROBE_OUTCOME: ${{ steps.ssh_probe.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_diagnostics.outcome }}
        shell: bash
        run: |
          set -e
          test "$KEY_OUTCOME" = "success"
          test "$PROBE_OUTCOME" = "success"
          test "$SYNC_OUTCOME" = "success"
          test "$MIGRATION_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
          test "$DOWNLOAD_OUTCOME" = "success"
