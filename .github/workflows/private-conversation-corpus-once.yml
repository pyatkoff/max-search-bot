name: Private complete conversation analysis (one-shot)

on:
  push:
    branches: ['analysis/full-conversation-corpus-20261017']

permissions:
  contents: read

concurrency:
  group: private-conversation-corpus-20261017
  cancel-in-progress: false

env:
  PRODUCTION_SHA: fb8811b93ed13568bd7b3bfca68e2d041f787f61

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: private-corpus-fixture-only
          MYSQL_DATABASE: private_corpus_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprivate-corpus-fixture-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required checks on the exact source
        run: bash tests/run_required_checks.sh
      - name: Native MySQL read-only snapshot, paging and unchanged-data checks
        env:
          PRIVATE_CORPUS_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=private_corpus_test_ci;charset=utf8mb4
          PRIVATE_CORPUS_MYSQL_USER: root
          PRIVATE_CORPUS_MYSQL_PASSWORD: private-corpus-fixture-only
        run: php tests/run_private_conversation_corpus_regression.php

  capture:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact approved production before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF_NAME" = 'analysis/full-conversation-corpus-20261017'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PRODUCTION_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s tools/export_private_conversation_corpus.php
          test -s tools/private_conversation_corpus_crypto.py
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/private-corpus"
          python3 -m venv "$RUNNER_TEMP/private-corpus/python"
          "$RUNNER_TEMP/private-corpus/python/bin/pip" install --disable-pip-version-check --only-binary=:all: --require-hashes -q -r tools/requirements-encrypted-evidence.txt
      - name: Prepare existing SSH identity privately
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/private-corpus/ssh_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read one consistent complete corpus without installing server files
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/private-corpus"
          ssh_opts=(-i "$private_dir/ssh_key" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$private_dir/known_hosts" -o ConnectTimeout=10)
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          deployed="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && git rev-parse HEAD" 2>/dev/null)"
          test "$deployed" = "$PRODUCTION_SHA"
          # PHP source is sent on stdin. No export code or file is installed on the server.
          # Every database statement is inside the collector's read-only consistent snapshot.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && php -d display_errors=0 -d log_errors=0 /dev/stdin --production-sha '$PRODUCTION_SHA'" < tools/export_private_conversation_corpus.php > "$private_dir/corpus.jsonl"
          chmod 600 "$private_dir/corpus.jsonl"
          "$private_dir/python/bin/python" tools/private_conversation_corpus_crypto.py encrypt \
            --recipient docs/diagnostics-recipient.txt --sha "$PRODUCTION_SHA" \
            --input "$private_dir/corpus.jsonl" --output "$private_dir/corpus.age" \
            --manifest "$private_dir/manifest.json"
          deployed_after="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && git rev-parse HEAD" 2>/dev/null)"
          test "$deployed_after" = "$PRODUCTION_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PRODUCTION_SHA"
          rm -f "$private_dir/corpus.jsonl" "$private_dir/ssh_key"
      - name: Upload ciphertext and aggregate coverage manifest only
        uses: actions/upload-artifact@v4
        with:
          name: private-conversation-corpus-${{ env.PRODUCTION_SHA }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-corpus/corpus.age
            ${{ runner.temp }}/private-corpus/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove all ephemeral private material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-corpus"
