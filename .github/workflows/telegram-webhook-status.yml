name: Telegram webhook status

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Telegram webhook operation
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - preview_channel_posts
          - enable_channel_posts
          - reconcile_channel_posts
      expected_sha:
        description: Full installed application SHA, required for channel post operations
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-channel-post-webhook-setup
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact repository source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Resolve accepted repository and application
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deployment_release.js resolve-consumer >> "$GITHUB_OUTPUT"

      - name: Validate explicit operation and installed SHA
        env:
          OPERATION: ${{ inputs.operation || 'inspect' }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPLICATION_SHA: ${{ steps.release.outputs.application_sha }}
          RELEASE_READY: ${{ steps.release.outputs.ready }}
          PERFORM_ACTIONS: ${{ steps.release.outputs.perform_actions }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$RELEASE_READY" = true
          test "$PERFORM_ACTIONS" = true
          case "$OPERATION" in
            inspect) ;;
            preview_channel_posts|enable_channel_posts|reconcile_channel_posts)
              [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character hexadecimal installed SHA is required" >&2; exit 2; }
              test "${EXPECTED_SHA,,}" = "$APPLICATION_SHA"
              ;;
            *) echo "Unsupported Telegram webhook operation" >&2; exit 2 ;;
          esac

      - name: Prepare SSH private key
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            test "$decoded" != ""
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect or explicitly configure Telegram channel post updates
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.perform_actions == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          OPERATION: ${{ inputs.operation || 'inspect' }}
          EXPECTED_SHA: ${{ steps.release.outputs.application_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 2
          case "$OPERATION" in
            inspect|preview_channel_posts|enable_channel_posts|reconcile_channel_posts) ;;
            *) exit 2 ;;
          esac
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$EXPECTED_SHA" "$OPERATION" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          operation="$2"
          [[ "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]] || exit 2
          cd /var/www/anytoour/data/www/app.anytoour.ru
          test "$(git rev-parse HEAD)" = "${expected_sha,,}"
          if [[ "$operation" == inspect ]]; then
            php tools/telegram_webhook_status.php
            exit 0
          fi
          git diff --quiet
          git diff --cached --quiet
          export CHANNEL_POST_WEBHOOK_STATE_DIR=/var/www/anytoour/data/channel-post-operations/webhook
          case "$operation" in
            preview_channel_posts) php tools/channel_post_webhook_updates.php telegram ;;
            enable_channel_posts) php tools/channel_post_webhook_updates.php telegram --apply ;;
            reconcile_channel_posts) php tools/channel_post_webhook_updates.php telegram --reconcile ;;
            *) exit 2 ;;
          esac
          REMOTE
