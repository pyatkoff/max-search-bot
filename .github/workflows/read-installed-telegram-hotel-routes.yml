name: Check installed Telegram hotel advertising links
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.event.workflow_run.path == '.github/workflows/deploy.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_ID: ${{ github.event.workflow_run.id }}
      INSTALLED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select installations that changed the hotel resolver
        id: routes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTALLED_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$INSTALLED_SHA"
          route=hotel-posts-telegram-main19.php
          if git diff --quiet HEAD^1 HEAD -- "$route"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/route-read"
          git show "HEAD^1:$route" > "$RUNNER_TEMP/route-read/before.php"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Locate original verified route candidates and read the current raw feed
        if: steps.routes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/route-read"
          curl --silent --show-error --fail --proto '=https' --max-time 25 --max-filesize 4000000 \
            --output "$out/current.xml" 'https://app.anytoour.ru/feed/hotel-posts-telegram.xml'
          python3 tools/collect_ranked_route_manifests.py "$out/manifests" "$out/verified-artifacts.json" "$out/current.xml"
      - name: Read each changed advertising link and compare its exact destination
        if: steps.routes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/route-read"
          python3 tools/verify_installed_telegram_routes.py --before "$out/before.php" \
            --after hotel-posts-telegram-main19.php --feed "$out/current.xml" --manifests "$out/manifests" \
            --deploy-run-id "$DEPLOY_ID" --installed-sha "$INSTALLED_SHA" --output "$out/ad-readback.json"
      - name: Retain the observed destinations and candidate identities
        if: always() && steps.routes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-ranked-routes-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-read-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/route-read/ad-readback.json
            ${{ runner.temp }}/route-read/verified-artifacts.json
          retention-days: 14
          if-no-files-found: warn
