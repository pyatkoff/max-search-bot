name: Inspect production MAX webhook

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact production source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          upstream_run_id=none
          upstream_run_attempt=none
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              metadata="$(jq -er '
                if .action == "completed"
                  and .workflow_run.name == "Deploy production"
                  and .workflow_run.status == "completed"
                  and .workflow_run.conclusion == "success"
                  and .workflow_run.head_repository.full_name == "pyatkoff/max-search-bot"
                  and .workflow_run.head_branch == "main"
                  and (.workflow_run.event == "push" or .workflow_run.event == "workflow_dispatch")
                  and (.workflow_run.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (.workflow_run.id | type == "number" and . >= 1 and . == floor)
                  and (.workflow_run.run_attempt | type == "number" and . >= 1 and . == floor)
                then [.workflow_run.head_sha, .workflow_run.id, .workflow_run.run_attempt] | @tsv
                else error("untrusted_production_deploy_event") end
              ' "$GITHUB_EVENT_PATH")"
              IFS=$'\t' read -r target_sha upstream_run_id upstream_run_attempt <<< "$metadata"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = 'refs/heads/main'
              target_sha="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported production gate event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\nupstream_run_id=%s\nupstream_run_attempt=%s\n' "$target_sha" "$upstream_run_id" "$upstream_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'Selected production source: event=%s upstream_run_id=%s upstream_run_attempt=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$upstream_run_id" "$upstream_run_attempt" "$target_sha"

      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Verify exact source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "STANDBY_DEPLOY_SSH_KEY is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Wait for exact active-server SHA and collect MAX health
        id: health
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          matched=0
          for attempt in $(seq 1 30); do
            deployed_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
              'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              matched=1
              echo "Active server SHA verified: $deployed_sha"
              break
            fi
            echo "Waiting for active-server SHA $EXPECTED_SHA (current: ${deployed_sha:-unavailable}, attempt $attempt/30)"
            sleep 5
          done
          if [[ "$matched" != "1" ]]; then
            echo "reason=sha_not_deployed" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stderr_file="$RUNNER_TEMP/max-health-stderr.txt"
          set +e
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
            'cd /var/www/anytoour/data/www/app.anytoour.ru && php tools/max_webhook_status.php' 2>"$stderr_file")"
          rc=$?
          set -e
          if [[ -s "$stderr_file" ]]; then
            echo 'MAX health diagnostic stderr:'
            cat "$stderr_file"
          fi
          printf '%s\n' "$result"

          if ! printf '%s\n' "$result" | jq -e . >/dev/null 2>&1; then
            echo "reason=invalid_diagnostic_output" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "diagnostic_rc=$rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reason="$(printf '%s\n' "$result" | jq -r '.reason // "unknown"')"
          ok="$(printf '%s\n' "$result" | jq -r 'if .ok == true then "true" else "false" end')"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "diagnostic_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: MAX webhook healthy
        if: steps.health.outputs.ok == 'true'
        run: echo "MAX webhook ownership is healthy on the active server."

      - name: MAX webhook missing expected owner
        if: steps.health.outputs.reason == 'expected_subscription_missing'
        run: echo "Expected MAX webhook subscription is missing."

      - name: MAX webhook has dual ownership
        if: steps.health.outputs.reason == 'extra_subscriptions'
        run: echo "More than one MAX webhook subscription is active."

      - name: MAX webhook transport or API failure
        if: steps.health.outputs.reason == 'transport_error' || steps.health.outputs.reason == 'invalid_api_response' || steps.health.outputs.reason == 'request_exception'
        run: echo "MAX API health request failed before ownership could be verified."

      - name: MAX health diagnostic unavailable
        if: steps.health.outputs.reason == 'sha_not_deployed' || steps.health.outputs.reason == 'invalid_diagnostic_output' || steps.health.outputs.reason == 'missing_token' || steps.health.outputs.reason == 'unknown'
        run: echo "MAX webhook ownership could not be verified because the diagnostic itself is unavailable or incomplete."

      - name: Fail unhealthy MAX webhook state
        if: steps.health.outputs.ok != 'true'
        env:
          REASON: ${{ steps.health.outputs.reason }}
        run: |
          echo "MAX webhook health failed: $REASON" >&2
          exit 1
