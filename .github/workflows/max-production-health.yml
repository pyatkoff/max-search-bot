name: Inspect production MAX webhook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo "DEPLOY_SSH_KEY is invalid"; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Wait for exact production SHA and inspect MAX subscription without mutation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          for attempt in $(seq 1 30); do
            deployed_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
              'cd ~/www/anytour.online/max-search && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production SHA verified: $deployed_sha"
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/deploy_key" "$remote" \
                'cd ~/www/anytour.online/max-search && /opt/php81/bin/php tools/max_webhook_status.php'
              exit 0
            fi
            echo "Waiting for production SHA $EXPECTED_SHA (current: ${deployed_sha:-unavailable}, attempt $attempt/30)"
            sleep 5
          done
          echo "Production did not reach expected SHA $EXPECTED_SHA before MAX webhook inspection" >&2
          exit 1
