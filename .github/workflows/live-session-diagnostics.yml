name: Publish live session diagnostics

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '25 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    concurrency:
      group: production-live-session-diagnostics
      cancel-in-progress: false
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'schedule' || github.event.schedule == '25 * * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact production source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          upstream_run_id=none
          upstream_run_attempt=none
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              metadata="$(jq -er '
                if .action == "completed"
                  and .workflow_run.name == "Deploy production"
                  and .workflow_run.status == "completed"
                  and .workflow_run.conclusion == "success"
                  and .workflow_run.head_repository.full_name == "pyatkoff/max-search-bot"
                  and .workflow_run.head_branch == "main"
                  and (.workflow_run.event == "push" or .workflow_run.event == "workflow_dispatch")
                  and (.workflow_run.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (.workflow_run.id | type == "number" and . >= 1 and . == floor)
                  and (.workflow_run.run_attempt | type == "number" and . >= 1 and . == floor)
                then [.workflow_run.head_sha, .workflow_run.id, .workflow_run.run_attempt] | @tsv
                else error("untrusted_production_deploy_event") end
              ' "$GITHUB_EVENT_PATH")"
              IFS=$'\t' read -r target_sha upstream_run_id upstream_run_attempt <<< "$metadata"
              ;;
            workflow_dispatch|schedule)
              test "$GITHUB_REF" = 'refs/heads/main'
              target_sha="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported production gate event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\nupstream_run_id=%s\nupstream_run_attempt=%s\n' "$target_sha" "$upstream_run_id" "$upstream_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'Selected production source: event=%s upstream_run_id=%s upstream_run_attempt=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$upstream_run_id" "$upstream_run_attempt" "$target_sha"

      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify exact source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Wait for production SHA
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          for attempt in $(seq 1 36); do
            production_sha="$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && git rev-parse HEAD' 2>/dev/null || true)"
            if [[ "$production_sha" == "$EXPECTED_SHA" ]]; then
              echo "production_sha=$production_sha"
              exit 0
            fi
            echo "waiting_for_production_sha expected=$EXPECTED_SHA actual=${production_sha:-unavailable} attempt=$attempt/36"
            sleep 5
          done
          echo "production_sha_mismatch expected=$EXPECTED_SHA actual=${production_sha:-unavailable}" >&2
          exit 1

      - name: Capture production live sessions
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          root='/var/www/anytoour/data/www/app.anytoour.ru'

          capture_remote() {
            local remote_command="$1"
            local output_file="$2"
            local tmp_file="${output_file}.tmp"
            for attempt in 1 2 3; do
              rm -f "$tmp_file"
              if ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && $remote_command" > "$tmp_file"; then
                mv "$tmp_file" "$output_file"
                return 0
              fi
              echo "diagnostic_ssh_retry file=$output_file attempt=$attempt/3" >&2
              sleep $((attempt * 2))
            done
            rm -f "$tmp_file"
            echo "diagnostic_ssh_failed file=$output_file" >&2
            return 1
          }

          capture_remote 'php tools/live_session_snapshot.php 1' live_sessions.json
          capture_remote 'php tools/live_session_snapshot.php today' daily_sessions.json
          php -r '$j=json_decode(file_get_contents("live_sessions.json"),true); if(!is_array($j)||empty($j["ok"])) {fwrite(STDERR,"live_session_snapshot_not_ok\n");exit(1);}'
          php -r '$j=json_decode(file_get_contents("daily_sessions.json"),true); if(!is_array($j)||empty($j["ok"])||($j["window_type"]??"")!=="calendar_day"||($j["timezone"]??"")!=="Europe/Kaliningrad"||!isset($j["summary"]["calendar_day"]["conversations_started"],$j["summary"]["calendar_day"]["needs_collected_from_started"],$j["summary"]["calendar_day"]["tours_opened_from_started"],$j["summary"]["calendar_day"]["manager_requested"],$j["summary"]["calendar_day"]["manager_replied"])) {fwrite(STDERR,"daily_session_snapshot_not_ok\n");exit(1);}'
          php tools/compose_live_anomalies.php live_sessions.json > live_anomalies.json
          php -r '$j=json_decode(file_get_contents("live_anomalies.json"),true); if(!is_array($j)||empty($j["ok"])) {fwrite(STDERR,"live_anomalies_not_ok\n");exit(1);}'
          php tools/sanitize_public_diagnostics.php live_sessions.json > public_live_status.json
          php tools/sanitize_public_diagnostics.php daily_sessions.json > public_daily_status.json

      - name: Publish diagnostics
        shell: bash
        run: |
          set -euo pipefail
          live_out="$RUNNER_TEMP/public_live_status.json"
          daily_out="$RUNNER_TEMP/public_daily_status.json"
          cp public_live_status.json "$live_out"
          cp public_daily_status.json "$daily_out"
          rm -f live_sessions.json daily_sessions.json live_anomalies.json public_live_status.json public_daily_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin diagnostics
          git checkout -B diagnostics origin/diagnostics
          rm -rf production-diagnostics
          find . -maxdepth 1 -type f -name '*.json' ! -name 'deploy_status.json' ! -name 'ops_status.json' ! -name 'autopilot_snapshot.json' ! -name 'architecture_inventory.json' ! -name 'public_live_status.json' ! -name 'public_daily_status.json' -delete
          rm -f migration.log
          cp "$live_out" public_live_status.json
          cp "$daily_out" public_daily_status.json
          git add -A
          git commit -m "Update live session diagnostics" || true
          for attempt in 1 2 3; do
            if git push origin diagnostics; then exit 0; fi
            git pull --rebase origin diagnostics
          done
          exit 1

  monitor:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'schedule' || github.event.schedule == '2-59/5 * * * *')
    concurrency:
      group: anytour-modeled-conversion-monitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve exact production source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/max-search-bot'
          upstream_run_id=none
          upstream_run_attempt=none
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              metadata="$(jq -er '
                if .action == "completed"
                  and .workflow_run.name == "Deploy production"
                  and .workflow_run.status == "completed"
                  and .workflow_run.conclusion == "success"
                  and .workflow_run.head_repository.full_name == "pyatkoff/max-search-bot"
                  and .workflow_run.head_branch == "main"
                  and (.workflow_run.event == "push" or .workflow_run.event == "workflow_dispatch")
                  and (.workflow_run.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (.workflow_run.id | type == "number" and . >= 1 and . == floor)
                  and (.workflow_run.run_attempt | type == "number" and . >= 1 and . == floor)
                then [.workflow_run.head_sha, .workflow_run.id, .workflow_run.run_attempt] | @tsv
                else error("untrusted_production_deploy_event") end
              ' "$GITHUB_EVENT_PATH")"
              IFS=$'\t' read -r target_sha upstream_run_id upstream_run_attempt <<< "$metadata"
              ;;
            workflow_dispatch|schedule)
              test "$GITHUB_REF" = 'refs/heads/main'
              target_sha="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported production gate event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\nupstream_run_id=%s\nupstream_run_attempt=%s\n' "$target_sha" "$upstream_run_id" "$upstream_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'Selected production source: event=%s upstream_run_id=%s upstream_run_attempt=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$upstream_run_id" "$upstream_run_attempt" "$target_sha"

      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify exact source is current main
        id: provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash tools/verify_deploy_main_provenance.sh

      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Prepare existing pinned encrypted evidence runtime
        env:
          MODELED_CONVERSION_ALERT_CHAT_ID: ${{ secrets.MODELED_CONVERSION_ALERT_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODELED_CONVERSION_ALERT_CHAT_ID"
          umask 077
          mkdir -p "$RUNNER_TEMP/monitor-cache" "$RUNNER_TEMP/monitor-intent" "$RUNNER_TEMP/monitor-final"
          python3 -m venv "$RUNNER_TEMP/monitor-python"
          "$RUNNER_TEMP/monitor-python/bin/pip" install --disable-pip-version-check --only-binary=:all: --require-hashes -q -r tools/requirements-encrypted-evidence.txt

      - name: Locate latest retained encrypted monitor state
        id: retained
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Set(['modeled-monitor-private-intent', 'modeled-monitor-private-final']);
            let found = [];
            for (let page = 1; page <= 5; page++) {
              const r = await github.rest.actions.listArtifactsForRepo({...context.repo, per_page: 100, page});
              found = r.data.artifacts.filter(a => names.has(a.name) && !a.expired && a.workflow_run?.head_branch === 'main');
              if (found.length || r.data.artifacts.length < 100) break;
            }
            found.sort((a,b) => b.created_at.localeCompare(a.created_at) || b.id-a.id);
            const latest = found[0];
            core.setOutput('present', latest ? 'true' : 'false');
            if (latest) {
              core.setOutput('run_id', String(latest.workflow_run.id));
              core.setOutput('name', latest.name);
            }

      - name: Download retained ciphertext only
        if: steps.retained.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.retained.outputs.run_id }}
          name: ${{ steps.retained.outputs.name }}
          path: ${{ runner.temp }}/monitor-cache

      - name: Read fixed installed technical health and bootstrap route when required
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          ssh_opts=(-i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          if ! ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && timeout 15s php tools/modeled_conversion_monitor.php health" > "$RUNNER_TEMP/monitor-health.json" 2>/dev/null; then
            printf '%s\n' '{"schema_version":1,"project":"anytour","counter_id":"98615635","status":"unavailable","flags":["monitor_transport_unavailable"]}' > "$RUNNER_TEMP/monitor-health.json"
          fi
          if [ ! -s "$RUNNER_TEMP/monitor-cache/state.age" ]; then
            if ! ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && timeout 15s php tools/modeled_conversion_monitor.php route" > "$RUNNER_TEMP/monitor-route.json" 2>/dev/null; then
              rm -f "$RUNNER_TEMP/monitor-route.json"
            fi
          fi

      - name: Prepare one immutable notification intent
        env:
          MODELED_CONVERSION_ALERT_CHAT_ID: ${{ secrets.MODELED_CONVERSION_ALERT_CHAT_ID }}
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          route_args=()
          if [ -s "$RUNNER_TEMP/monitor-route.json" ]; then route_args=(--route "$RUNNER_TEMP/monitor-route.json"); fi
          "$RUNNER_TEMP/monitor-python/bin/python" tools/modeled_conversion_monitor.py --phase prepare \
            --health "$RUNNER_TEMP/monitor-health.json" "${route_args[@]}" \
            --cache "$RUNNER_TEMP/monitor-cache/state.age" --key-file "$RUNNER_TEMP/deploy_key" \
            --output-cache "$RUNNER_TEMP/monitor-intent/state.age" --run-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/monitor-decision.json" || true
          python3 - "$RUNNER_TEMP/monitor-decision.json" "$GITHUB_OUTPUT" <<'MONITOR_DECISION'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: d=json.load(f)
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write('send='+('true' if d.get('intent_prepared') is True else 'false')+'\n')
          MONITOR_DECISION
          if [ -s "$RUNNER_TEMP/monitor-intent/state.age" ]; then
            cp "$RUNNER_TEMP/monitor-intent/state.age" "$RUNNER_TEMP/monitor-final/state.age"
          fi
          cp "$RUNNER_TEMP/monitor-decision.json" "$RUNNER_TEMP/monitor-result.json"

      - name: Persist encrypted intent before any Telegram send
        id: durable_intent
        if: steps.decision.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: modeled-monitor-private-intent
          path: ${{ runner.temp }}/monitor-intent/state.age
          retention-days: 7
          if-no-files-found: error

      - name: Send only this original retained intent
        if: steps.decision.outputs.send == 'true' && steps.durable_intent.outcome == 'success'
        env:
          INTENT_ARTIFACT_ID: ${{ steps.durable_intent.outputs.artifact-id }}
          MODELED_CONVERSION_ALERT_CHAT_ID: ${{ secrets.MODELED_CONVERSION_ALERT_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INTENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          "$RUNNER_TEMP/monitor-python/bin/python" tools/modeled_conversion_monitor.py --phase send \
            --cache "$RUNNER_TEMP/monitor-intent/state.age" --key-file "$RUNNER_TEMP/deploy_key" \
            --output-cache "$RUNNER_TEMP/monitor-final/state.age" --prepared-this-run --run-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/monitor-result.json" || true

      - name: Retain final encrypted state
        if: always() && steps.decision.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: modeled-monitor-private-final
          path: ${{ runner.temp }}/monitor-final/state.age
          retention-days: 7
          if-no-files-found: error

      - name: Record sanitized external monitoring receipt
        if: always() && steps.decision.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          MONITOR_EVENT: ${{ github.event_name }}
          MONITOR_RUN_ID: ${{ github.run_id }}
          MONITOR_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$MONITOR_EVENT" in schedule|workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          [[ "$MONITOR_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MONITOR_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          root='/var/www/anytoour/data/www/app.anytoour.ru'
          if ! ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" "cd '$root' && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_SHA' && timeout 15s php tools/modeled_conversion_monitor.php record --event='$MONITOR_EVENT' --run-id='$MONITOR_RUN_ID' --run-attempt='$MONITOR_RUN_ATTEMPT' --source-sha='$EXPECTED_SHA'" < "$RUNNER_TEMP/monitor-result.json" > /dev/null 2>/dev/null; then
            echo 'external_monitor_receipt_unavailable'
          fi

      - name: Verify technical monitoring result
        if: always() && steps.decision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/monitor-result.json" <<'MONITOR_RESULT'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: d=json.load(f)
          print(json.dumps(d,sort_keys=True,separators=(',',':')))
          if d.get('ok') is not True: raise SystemExit(1)
          MONITOR_RESULT

      - name: Remove private ephemeral monitor data
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/monitor-route.json" "$RUNNER_TEMP/monitor-health.json" "$RUNNER_TEMP/monitor-decision.json" "$RUNNER_TEMP/monitor-result.json"
          rm -rf "$RUNNER_TEMP/monitor-python" "$RUNNER_TEMP/monitor-cache" "$RUNNER_TEMP/monitor-intent" "$RUNNER_TEMP/monitor-final"
