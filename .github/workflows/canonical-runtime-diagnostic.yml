name: Canonical runtime diagnostic

on:
  push:
    branches: [diagnose/canonical-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect canonical PHP runtime
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && php -r '\''require "config.php"; require_once "integrations/TelegramIncomingAdapter.php"; $r=new ReflectionClass("IncomingMessage"); echo "IncomingMessage=".$r->getFileName()."\n"; $r=new ReflectionClass("TelegramIncomingAdapter"); echo "TelegramIncomingAdapter=".$r->getFileName()."\n"; $u=["update_id"=>1,"message"=>["message_id"=>2,"from"=>["id"=>3,"first_name"=>"Smoke"],"chat"=>["id"=>3,"type"=>"private"],"date"=>time(),"text"=>"Хочу в Турцию в сентябре"]]; var_export(TelegramIncomingAdapter::fromUpdate($u)); echo "\n";'\'''
