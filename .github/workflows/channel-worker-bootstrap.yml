name: Check channel worker bootstrap without execution
on:
  push:
    branches: [audit/channel-worker-bootstrap-20261027]
    paths: [.github/workflows/channel-worker-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: anytour-channel-worker-bootstrap-20261027
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = d304689512e426fcde5f0a782396b72436be054b
      - name: Prepare existing identity and strict canonical pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$K" == *"PRIVATE KEY"* ]]; then printf '%b\n' "$K" | tr -d '\r' > "$RUNNER_TEMP/membership-key"; else printf '%s' "$K" | base64 --decode > "$RUNNER_TEMP/membership-key"; fi
          chmod 600 "$RUNNER_TEMP/membership-key"
          ssh-keygen -y -f "$RUNNER_TEMP/membership-key" >/dev/null
          python3 - "$TARGET" "$RUNNER_TEMP/membership-hosts" <<'PY'
          import base64,hashlib,socket,subprocess,sys
          host,dest=sys.argv[1:]
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:raise SystemExit('canonical_target_changed')
          pinned=[]
          for _ in range(2):
              scan=subprocess.run(['ssh-keyscan','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0].startswith('#'):continue
                  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError:continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0' and line not in pinned:pinned.append(line)
              if pinned:break
          if not pinned:raise SystemExit('canonical_host_pin_not_seen')
          open(dest,'w').write('\n'.join(pinned)+'\n')
          PY
      - name: One read-only metadata snapshot
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/membership-read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function safeFailure(Throwable $e):array{
           $m=$e->getMessage();$category=$e instanceof PDOException?'sql_prepare':($e instanceof Error?'php_bootstrap':'runtime');
           foreach(['Unknown column'=>'unknown_column','ambiguous'=>'ambiguous_column','Illegal mix of collations'=>'mixed_collation','not found'=>'missing_class_or_file','metrika_config_missing'=>'metrika_config_missing']as$needle=>$label)if(str_contains($m,$needle)){$category=$label;break;}
           $code=(string)$e->getCode();return['ok'=>false,'category'=>$category,'sqlstate'=>preg_match('/\A[A-Z0-9]{5}\z/D',$code)?$code:null];
          }
          final class EmptyStatement extends PDOStatement{
           public function __construct(){}
           public function execute(?array $params=null):bool{return true;}
           public function fetchAll(int $mode=PDO::FETCH_DEFAULT,mixed ...$args):array{return [];}
           public function fetch(int $mode=PDO::FETCH_DEFAULT,int $orientation=PDO::FETCH_ORI_NEXT,int $offset=0):mixed{return false;}
           public function fetchColumn(int $column=0):mixed{return false;}
           public function rowCount():int{return 0;}
          }
          final class PrepareOnly extends PDO{
           public int $prepared=0;
           public function __construct(private PDO $real){}
           public function getAttribute(int $attribute):mixed{return $attribute===PDO::ATTR_DRIVER_NAME?'mysql':$this->real->getAttribute($attribute);}
           public function prepare(string $query,array $options=[]):PDOStatement|false{$this->real->prepare($query,$options);$this->prepared++;return new EmptyStatement();}
           public function query(string $query,?int $fetchMode=null,mixed ...$fetchModeArgs):PDOStatement|false{return $this->prepare($query);}
           public function exec(string $statement):int|false{throw new RuntimeException('execution_forbidden');}
          }
          chdir('/var/www/anytoour/data/www/app.anytoour.ru');$out=['sampled_at'=>gmdate('Y-m-d\TH:i:s\Z'),'steps'=>[],'business_statement_executions'=>0,'native_rows'=>0,'worker_ticks'=>0,'API_POST_model_provider_customer_calls'=>0];
          try{require_once 'config.php';require_once 'services/MaxChannelConversionWorker.php';$out['steps']['worker_bootstrap']=['ok'=>true];}catch(Throwable $e){$out['steps']['worker_bootstrap']=safeFailure($e);}
          try{require_once 'maxsearchclass.php';require_once 'services/MetrikaConversionGoalService.php';$out['steps']['collector_bootstrap']=['ok'=>true,'callable'=>is_callable([MetrikaConversionGoalService::class,'reconcileChannelConversation'])];}catch(Throwable $e){$out['steps']['collector_bootstrap']=safeFailure($e);}
          $out['config_presence']=['counter_valid'=>defined('METRIKA_COUNTER_ID')&&(string)METRIKA_COUNTER_ID==='98615635','token_present'=>defined('METRIKA_OAUTH_TOKEN')&&trim((string)METRIKA_OAUTH_TOKEN)!==''];
          try{
           $p=ConversationDb::connection();$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();$fake=new PrepareOnly($p);$repo=new MaxChannelConversionOutbox($fake);
           $settings=['project_key'=>'anytour','mode'=>'send','goal_set'=>'shared','shared_goals_activated_at_unix'=>1793092733,'membership_receipts_activated_at_unix'=>1793092733,'membership_receipts_outbox_cursor'=>0,'message_cursor'=>0,'request_event_cursor'=>0];
           foreach(['recover','pending','membershipCandidates','collect']as$method){try{
             match($method){'recover'=>$repo->recover(time()),'pending'=>$repo->pending(time()),'membershipCandidates'=>$repo->membershipCandidates($settings,time(),5),'collect'=>$repo->collect($settings,static function(){throw new RuntimeException('callback_forbidden');})};
             $out['steps'][$method]=['ok'=>true];
            }catch(Throwable $e){$out['steps'][$method]=safeFailure($e);}}
           $out['native_prepares']=$fake->prepared;$p->rollBack();
          }catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();$out['steps']['connection']=safeFailure($e);}
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          PHP
          php -l "$RUNNER_TEMP/membership-read.php"
          ssh -i "$RUNNER_TEMP/membership-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/membership-hosts" -o ConnectTimeout=10 "$USER@$TARGET" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = d304689512e426fcde5f0a782396b72436be054b; php -d display_errors=0 -d log_errors=0; test "$(git rev-parse HEAD)" = d304689512e426fcde5f0a782396b72436be054b' < "$RUNNER_TEMP/membership-read.php" > "$RUNNER_TEMP/membership-metadata.json"
          python3 - "$RUNNER_TEMP/membership-metadata.json" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(raw)<=65536
          obj=json.loads(raw)
          assert obj['business_statement_executions']==obj['native_rows']==obj['worker_ticks']==obj['API_POST_model_provider_customer_calls']==0
          print(json.dumps(obj,ensure_ascii=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: membership-path-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/membership-metadata.json
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/membership-key" "$RUNNER_TEMP/membership-hosts" "$RUNNER_TEMP/membership-read.php" "$RUNNER_TEMP/membership-metadata.json"
