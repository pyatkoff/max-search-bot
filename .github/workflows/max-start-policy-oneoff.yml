name: Read MAX start policy once

on:
  push:
    branches: [fix/max-start-source-policy-20260928]
    paths: [.github/workflows/max-start-policy-oneoff.yml]

permissions:
  contents: read

jobs:
  policy:
    if: github.repository == 'pyatkoff/max-search-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_MAIN: b7961d3a8dab51c4ee76cdf3c35b85e42977bfe8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7961d3a8dab51c4ee76cdf3c35b85e42977bfe8
          persist-credentials: true
      - name: Verify authoritative main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
      - name: Prepare existing deployment key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/max-policy-key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read only the reported source policy
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/max-policy-read.php" <<'PHP'
          <?php
          ini_set('display_errors', '0');
          set_error_handler(static function () { throw new RuntimeException('read_failed'); });
          try {
              require getcwd().'/config.php';
              require_once getcwd().'/services/ConversationDb.php';
              require_once getcwd().'/services/ProjectConfig.php';
              $pdo=ConversationDb::connection();
              $pdo->exec('SET TRANSACTION READ ONLY');
              $pdo->beginTransaction();
              $q=$pdo->prepare("SELECT s.handling_mode,s.channel,s.is_active,s.primary_group_id,s.fallback_mode,s.fallback_group_id,g.is_active AS group_active FROM conversation_sources s JOIN projects p ON p.id=s.project_id LEFT JOIN manager_groups g ON g.id=s.primary_group_id AND g.project_id=p.id WHERE p.project_key=? AND s.source_key=? LIMIT 2");
              $q->execute([ProjectConfig::projectId(),'max_anytour_msk1']);
              $rows=$q->fetchAll(PDO::FETCH_ASSOC);
              if(count($rows)!==1) throw new RuntimeException('source_not_unique');
              $s=$rows[0];
              $mode=in_array($s['handling_mode'],['ai','ask','manager'],true)?$s['handling_mode']:'invalid';
              $q=$pdo->prepare("SELECT COUNT(DISTINCT m.id) FROM managers m JOIN manager_group_members gm ON gm.manager_id=m.id JOIN manager_groups g ON g.id=gm.group_id JOIN projects p ON p.id=g.project_id JOIN manager_projects mp ON mp.manager_id=m.id AND mp.project_id=p.id WHERE p.project_key=? AND g.id=? AND g.is_active=1 AND m.is_active=1 AND m.is_working=1");
              $q->execute([ProjectConfig::projectId(),(int)$s['primary_group_id']]);
              $working=(int)$q->fetchColumn();
              $pdo->rollBack();
              echo json_encode(['ok'=>true,'source'=>'max_anytour_msk1','handling_mode'=>$mode,'max_channel'=>$s['channel']==='max','source_active'=>(int)$s['is_active']===1,'primary_group_configured'=>(int)$s['primary_group_id']>0,'primary_group_active'=>(int)$s['group_active']===1,'working_primary_managers'=>$working,'fallback_mode'=>in_array($s['fallback_mode'],['none','delayed','immediate'],true)?$s['fallback_mode']:'invalid','fallback_group_configured'=>(int)$s['fallback_group_id']>0],JSON_UNESCAPED_SLASHES).PHP_EOL;
          } catch(Throwable $e) {
              if(isset($pdo)&&$pdo->inTransaction()) $pdo->rollBack();
              fwrite(STDERR,"source_policy_read_failed\n");
              exit(1);
          }
          PHP
          ssh -i "$RUNNER_TEMP/max-policy-key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/anytoour/data/www/app.anytoour.ru && test \"\$(git rev-parse HEAD)\" = '$EXPECTED_MAIN' && php" < "$RUNNER_TEMP/max-policy-read.php"
      - name: Remove temporary key and read script
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/max-policy-key" "$RUNNER_TEMP/max-policy-read.php"
