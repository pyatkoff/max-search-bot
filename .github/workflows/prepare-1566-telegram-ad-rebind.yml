            };
          }
          
          function main() {
            const [input, flag, output] = process.argv.slice(2);
            assert.ok(input && isAbsolute(input) && (!flag || flag === "--emit") && Boolean(flag) === Boolean(output),
              "Usage: node prepare-rebind.mjs ABSOLUTE_COPY_DIR [--emit ABSOLUTE_NEW_REVIEW_DIR]");
            const before = Object.fromEntries(fileNames.map(name => [name, readFileSync(join(input, name))]));
            const { after, receipt } = prepareCopies(before);
            if (output) {
              assert.ok(isAbsolute(output), "Expected an absolute new review directory");
              const helper = readFileSync(new URL("./transition-tg415.php", import.meta.url));
              const transition = prepareTransitionHook(before[hookName], helper);
              const transitionName = "monitor-price-hook.transition.preview.php";
              receipt.transition = { name: transitionName, sha256: sha256(transition), bytes: transition.length };
              mkdirSync(output, { mode: 0o700 });
              for (const [name, bytes] of Object.entries(after)) {
                writeFileSync(join(output, name), bytes, { flag: "wx", mode: 0o600 });
              }
              writeFileSync(join(output, transitionName), transition, { flag: "wx", mode: 0o600 });
              writeFileSync(join(output, "receipt.json"), JSON.stringify(receipt, null, 2) + "\n", {
                flag: "wx",
                mode: 0o600
              });
            }
            process.stdout.write(JSON.stringify(receipt, null, 2) + "\n");
