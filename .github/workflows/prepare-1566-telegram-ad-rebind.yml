          declare(strict_types=1);
          /** Require agreement between both ad feeds before the price editor touches either scoped hotel. */
          function hook_telegram_1566_destination(array $row): array {
              $hotelId = $row['tourvisor_hotel_id'] ?? null;
              [$old, $new] = match ($hotelId) {
                  174 => ['https://t.me/any_toour/67', 'https://t.me/anytour/1792'],
                  415 => ['https://t.me/any_toour/472', 'https://t.me/anytour/1754'],
                  default => throw new RuntimeException('hook_tg1566_feed_rebind_deferred'),
              };
              $offerId = 'tg_' . $hotelId;
              $reason = 'hook_tg1566_feed_rebind_deferred';
              hook_need(($row['posts']['telegram'] ?? null) === $old
                  && ($row['feed_binding']['posts']['telegram'] ?? null) === $old
                  && ($row['feed_binding']['offer_ids']['telegram'] ?? null) === $offerId
                  && ($row['feed_binding']['destinations']['telegram'] ?? null) === $old, $reason);
              $urls = [];
              foreach (['hotel-posts-telegram.xml', 'hotel-posts-all.xml'] as $name) {
                  $path = getcwd() . '/feed/' . $name;
                  try {
                      $xml = hook_read($path, 4000000);
                  } catch (RuntimeException $error) {
                      throw new RuntimeException($reason, 0, $error);
                  }
                  hook_need(stripos($xml, '<!DOCTYPE') === false && stripos($xml, '<!ENTITY') === false, $reason);
                  $dom = new DOMDocument();
                  $previous = libxml_use_internal_errors(true);
                  try {
                      $loaded = $dom->loadXML($xml, LIBXML_NONET);
                  } finally {
                      libxml_clear_errors();
                      libxml_use_internal_errors($previous);
                  }
                  hook_need($loaded && $dom->documentElement?->tagName === 'yml_catalog', $reason);
                  $xpath = new DOMXPath($dom);
                  $offers = $xpath->query('/yml_catalog/shop/offers/offer[@id="' . $offerId . '"]');
                  hook_need($offers !== false && $offers->length === 1, $reason);
                  $nodes = $xpath->query('./url', $offers->item(0));
                  hook_need($nodes !== false && $nodes->length === 1, $reason);
                  $urls[] = $nodes->item(0)->textContent;
              }
              hook_need($urls[0] === $urls[1] && in_array($urls[0], [$old, $new], true), $reason);
              $row['feed_binding']['destinations']['telegram'] = $urls[0];
              return $row;
          }
