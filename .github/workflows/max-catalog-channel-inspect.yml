name: Inspect owner MAX catalog channel
on:
  push:
    branches: [audit/max-catalog-channel-20261025]
    paths: [.github/workflows/max-catalog-channel-inspect.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: max-catalog-channel-read-20261025
  cancel-in-progress: false
env:
  EXPECTED_PRODUCTION_SHA: dd477798e06b6727b6e4cc84fa7fbb4763dc18da
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/max-catalog-channel-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_PRODUCTION_SHA }}
          persist-credentials: false
      - name: Verify current released production source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_PRODUCTION_SHA"
          conclusion=$(gh api "repos/pyatkoff/max-search-bot/actions/runs?head_sha=$EXPECTED_PRODUCTION_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name=="Deploy production")] | max_by(.id) | .conclusion')
          test "$conclusion" = success
      - name: Prepare fixed GET-only channel probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/channel-probe.php" <<'PHP'
          <?php
          declare(strict_types=1);
          if(PHP_SAPI!=='cli')exit(2);
          ini_set('display_errors','0');ini_set('log_errors','0');
          $out=['ok'=>false,'mode'=>'read_only','target'=>'https://max.ru/channel_anytour','database_writes'=>0,'provider_writes'=>0,'http'=>[]];
          try{
           ob_start();try{require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';}finally{ob_end_clean();}
           $identity=ChannelPostRuntime::identity('max');
           if(!$identity||$identity['project_key']!=='anytour'||$identity['bot_key']!=='id9704048781_1_bot')throw new RuntimeException('configured_bot_mismatch');
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/me',[],null);
           $out['http'][]=['operation'=>'bot_identity','status'=>(int)($r['http']??0)];
           if(!empty($r['transport_error'])||(int)($r['http']??0)!==200||($r['data']['is_bot']??false)!==true||($r['data']['username']??'')!=='id9704048781_1_bot')throw new RuntimeException('provider_bot_mismatch');
           $out['bot_username']=$r['data']['username'];
           $pdo=ConversationDb::connection();$pdo->exec('START TRANSACTION READ ONLY');
           try{
            $q=$pdo->prepare("SELECT c.channel_id,c.display_name,c.is_enabled,s.source_key FROM post_channels c JOIN projects p ON p.id=c.project_id JOIN conversation_sources s ON s.id=c.source_id AND s.project_id=c.project_id WHERE p.project_key=? AND c.platform='max' AND c.bot_key=? ORDER BY c.id LIMIT 26");
            $q->execute(['anytour',$identity['bot_key']]);$candidates=$q->fetchAll(PDO::FETCH_ASSOC);
            $q=$pdo->prepare("SELECT s.id,s.source_key,s.handling_mode FROM conversation_sources s JOIN projects p ON p.id=s.project_id WHERE p.project_key=? AND p.is_active=1 AND s.channel='max' AND s.is_active=1 AND s.handling_mode IN('manager','ask') ORDER BY s.id LIMIT 20");
            $q->execute(['anytour']);$out['eligible_sources']=$q->fetchAll(PDO::FETCH_ASSOC);
           }finally{$pdo->rollBack();}
           // Public MAX page https://max.ru/channel_anytour returns linkInfo.channel.channelId=80492244209683.
           // Treat as candidate only; provider GET must verify exact public link before any further action.
           $candidates[]=['channel_id'=>'-80492244209683','source_key'=>'unregistered_public_metadata','is_enabled'=>0];
           $out['registered_candidates']=[];$matches=[];
           if(count($candidates)>25)throw new RuntimeException('registry_read_limit');
           foreach($candidates as $candidate){
            $id=(string)$candidate['channel_id'];if(!preg_match('/\A-[1-9][0-9]{0,19}\z/',$id))continue;
            $r=ChannelPostApiTransport::buttonRequest('max','GET','/chats/'.$id,[],null);
            $out['http'][]=['operation'=>'registered_channel_metadata','status'=>(int)($r['http']??0)];
            $chat=$r['data']??[];
            if(!empty($r['transport_error'])||(int)($r['http']??0)!==200||!is_array($chat))continue;
            if(($chat['type']??'')!=='channel'||(string)($chat['chat_id']??'')!==$id)continue;
            $link=(string)($chat['link']??'');$u=parse_url($link);
            $out['registered_candidates'][]=['channel_id'=>$id,'title'=>(string)($chat['title']??''),'link'=>$link,'status'=>$chat['status']??null,'source_key'=>$candidate['source_key'],'is_enabled'=>(bool)$candidate['is_enabled']];
            if(!is_array($u)||($u['scheme']??'')!=='https'||($u['host']??'')!=='max.ru'||rtrim((string)($u['path']??''),'/')!=='/channel_anytour')continue;
            $matches[$id]=['channel_id'=>$id,'title'=>(string)($chat['title']??''),'link'=>$link,'participants_count'=>$chat['participants_count']??null];
           }
           if(count($matches)!==1)throw new RuntimeException(count($matches)>1?'target_ambiguous':'target_not_in_registry');
           $target=array_values($matches)[0];$id=$target['channel_id'];$out['channel']=$target;
           $channel=['platform'=>'max','channel_id'=>$id,'bot_key'=>$identity['bot_key'],'canonical_bot_username'=>$identity['canonical_bot_username']??$identity['bot_key'],'bot_url'=>$identity['bot_url']];
           $out['rights']=(new ChannelPostButtonTransport())->verifyChannel($channel);
           if(($out['rights']['state']??'')!=='ready')throw new RuntimeException('target_rights_not_ready');
           $r=ChannelPostApiTransport::buttonRequest('max','GET','/messages',['chat_id'=>$id,'from'=>(int)floor(microtime(true)*1000),'to'=>1,'count'=>10],null);
           $out['http'][]=['operation'=>'target_posts','status'=>(int)($r['http']??0)];
           if(!empty($r['transport_error'])||(int)($r['http']??0)!==200||!is_array($r['data']['messages']??null))throw new RuntimeException('posts_read_failed');
           $out['posts']=[];
           foreach($r['data']['messages']as $m){
            if((string)($m['recipient']['chat_id']??'')!==$id||($m['recipient']['chat_type']??'')!=='channel')throw new RuntimeException('unexpected_post_channel');
            $types=[];foreach((array)($m['body']['attachments']??[])as $a){$t=(string)($a['type']??'other');$types[$t]=($types[$t]??0)+1;}
            $out['posts'][]=['message_id'=>(string)($m['body']['mid']??''),'published_ms'=>$m['timestamp']??null,'text'=>mb_substr((string)($m['body']['text']??''),0,4500,'UTF-8'),'attachment_types'=>$types,'public_url'=>$m['url']??null,'accepted_snapshot_url'=>ChannelPostIncomingAdapter::maxSnapshot($m)['post_url']??null];
           }
           $pdo=ConversationDb::connection();$pdo->exec('START TRANSACTION READ ONLY');
           try{
            $q=$pdo->prepare('SELECT c.id,c.channel_id,c.display_name,c.is_enabled,c.button_text,s.source_key,s.handling_mode,s.is_active AS source_active FROM post_channels c JOIN projects p ON p.id=c.project_id JOIN conversation_sources s ON s.id=c.source_id AND s.project_id=c.project_id WHERE p.project_key=? AND c.platform=? AND c.bot_key=? AND c.channel_id=? ORDER BY c.id LIMIT 2');
            $q->execute(['anytour','max',$identity['bot_key'],$id]);$out['target_registry']=$q->fetchAll(PDO::FETCH_ASSOC);
            $q=$pdo->prepare("SELECT s.id,s.source_key,s.handling_mode FROM conversation_sources s JOIN projects p ON p.id=s.project_id WHERE p.project_key=? AND p.is_active=1 AND s.channel='max' AND s.is_active=1 AND s.handling_mode IN('manager','ask') ORDER BY s.id LIMIT 20");
            $q->execute(['anytour']);$out['eligible_sources']=$q->fetchAll(PDO::FETCH_ASSOC);
           }finally{$pdo->rollBack();}
           $out['server_utc']=gmdate('c');$out['ok']=true;
          }catch(Throwable $e){$allowed=['registry_read_limit','target_not_in_registry','configured_bot_mismatch','provider_bot_mismatch','invalid_target_id','pagination_repeated','target_ambiguous','target_not_in_bot_chats','target_not_found_in_read_limit','target_rights_not_ready','posts_read_failed','unexpected_post_channel'];$out['error']=in_array($e->getMessage(),$allowed,true)?$e->getMessage():'bounded_probe_failed';}
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;exit($out['ok']?0:2);
          PHP
          php -l "$RUNNER_TEMP/channel-probe.php"
      - name: Prepare existing server connection
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$raw" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$RUNNER_TEMP/channel_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
      - name: Read target channel through existing bot API
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_PRODUCTION_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; php" < "$RUNNER_TEMP/channel-probe.php" > "$RUNNER_TEMP/channel-probe.json" || probe_status=$?
          python3 - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/channel-probe.json')as f:d=json.load(f)
          assert d['mode']=='read_only' and d['database_writes']==0 and d['provider_writes']==0
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
          test "${probe_status:-0}" = 0
      - name: Remove ephemeral files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" "$RUNNER_TEMP/channel-probe.php" "$RUNNER_TEMP/channel-probe.json"
