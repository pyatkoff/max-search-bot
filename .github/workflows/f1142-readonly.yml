# Finite read-only audit. Disabled unless exact independent admission is present.
name: Finite F1142 binding audit proposal
on:
  push:
    branches: [audit/f1142-app-carrier-20261027-1]
permissions:
  contents: read
concurrency:
  group: f1142-owner2-readonly-20261027-1
  cancel-in-progress: false
jobs:
  finite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check current main and independent admission before credentials
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = f82fd39a2e54f3ff814ea7c3c9b59f00e64aeb4a
          python3 source/carrier.py --preflight-metadata
          python3 -m venv "$RUNNER_TEMP/f1142-python"
          "$RUNNER_TEMP/f1142-python/bin/pip" install --require-hashes --only-binary=:all: -q -r tools/requirements-encrypted-evidence.txt
          "$RUNNER_TEMP/f1142-python/bin/python" source/carrier.py --preflight
      - name: Use existing canonical identity only
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/f1142-existing-key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            printf '%s' "$raw" | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: One admitted execution only
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
          F1142_EXISTING_IDENTITY_FILE: ${{ runner.temp }}/f1142-existing-key
        run: |
          "$RUNNER_TEMP/f1142-python/bin/python" source/carrier.py --output "$RUNNER_TEMP/f1142.age"
      - uses: actions/upload-artifact@v4
        with:
          name: f1142-ciphertext-only-${{ github.run_id }}
          path: ${{ runner.temp }}/f1142.age
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup existing credential
        if: always()
        run: rm -f "$RUNNER_TEMP/f1142-existing-key" "$RUNNER_TEMP/f1142.age"
