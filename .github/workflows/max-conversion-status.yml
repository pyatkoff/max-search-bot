name: Read current MAX conversion totals
on:
  push:
    branches: [test/max-conversion-status-20261015-2214]
    paths: [.github/workflows/max-conversion-status.yml]
permissions:
  contents: read
concurrency:
  group: max-attribution-control
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare established canonical identity
        env:
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          raw="$KEY_VALUE"; key="$RUNNER_TEMP/key"
          if [[ "$raw" == *'PRIVATE KEY'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key"; else printf '%s' "$raw" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Read exact enabled mode, event clocks and last natural scheduler receipt only
        env:
          HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = "753515d5877fd89e6baf9138b3c296eaa13470a3"; php -d display_errors=0 -d log_errors=0' <<'PHP'
          <?php
          ini_set('display_errors','0');ini_set('log_errors','0');error_reporting(0);
          try{
            require 'config.php';require 'services/MaxChannelConversionWorker.php';
            $p=ConversationDb::connection();$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();$s=MaxChannelConversionOutbox::settings($p);
            if(!$s||$s['mode']!=='send')throw new RuntimeException('mode');
            $counts=[];$q=$p->query("SELECT state,COUNT(*) AS c FROM max_channel_conversion_outbox WHERE project_key='anytour' AND counter_id='98615635' GROUP BY state");
            foreach($q->fetchAll(PDO::FETCH_ASSOC) as $row)$counts[$row['state']]=(int)$row['c'];
            $repo=new MaxChannelConversionOutbox($p);$events=0;$bad=0;$clockIssues=[];
            $q=$p->query("SELECT o.*,c.external_chat_id FROM max_channel_conversion_outbox o JOIN conversations c ON c.id=o.conversation_id WHERE o.project_key='anytour' AND o.counter_id='98615635' ORDER BY o.id DESC LIMIT 25");
            foreach($q->fetchAll(PDO::FETCH_ASSOC) as $row){
              $events++;$c=$repo->conversation((string)$row['conversation_id'],(string)$row['external_chat_id'],$s);
              $event=$c?$repo->event($c,(string)$row['target'],$s):null;
              if(!$event||MaxSubscriptionAttributionPolicy::eventTimeUnix((string)$event['created_at'],new DateTimeZone('UTC'))!==(int)$row['event_unix']){$bad++;$kind=!$c?'conversation_not_currently_eligible':(!$event?'event_not_currently_eligible':'different_rediscovered_event');$delta=$event?MaxSubscriptionAttributionPolicy::eventTimeUnix((string)$event['created_at'],new DateTimeZone('UTC'))-(int)$row['event_unix']:null;$key=(string)$row['target'].'|'.(string)$row['state'].'|'.$kind.'|'.($delta===null?'null':(string)$delta);$clockIssues[$key]=($clockIssues[$key]??0)+1;}
            }
            $groups=$p->query("SELECT target,state,COALESCE(upload_status,'') AS upload_status,COUNT(*) AS events,SUM(upload_id IS NOT NULL) AS receipts,SUM(attempts>0) AS attempted_events,MIN(event_unix) AS first_event_unix,MAX(event_unix) AS last_event_unix,MAX(claimed_at_unix) AS last_claim_unix FROM max_channel_conversion_outbox WHERE project_key='anytour' AND counter_id='98615635' GROUP BY target,state,upload_status ORDER BY target,state,upload_status")->fetchAll(PDO::FETCH_ASSOC);
            $totals=$p->query("SELECT COUNT(*) AS events,COUNT(DISTINCT conversation_id) AS conversations,SUM(upload_id IS NOT NULL) AS receipt_events,SUM(client_id IS NULL) AS without_client_id,SUM(event_unix>1792076443) AS events_after_prior_check,MIN(event_unix) AS first_event_unix,MAX(event_unix) AS last_event_unix,MAX(claimed_at_unix) AS last_claim_unix FROM max_channel_conversion_outbox WHERE project_key='anytour' AND counter_id='98615635'")->fetch(PDO::FETCH_ASSOC);
            $apiStates=[];$api=new MetrikaOfflineClient($s['counter_id'],(string)METRIKA_OAUTH_TOKEN);
            $q=$p->query("SELECT upload_id FROM max_channel_conversion_outbox WHERE project_key='anytour' AND counter_id='98615635' AND state IN ('accepted','processed','unmatched') AND upload_id IS NOT NULL ORDER BY id DESC LIMIT 3");
            foreach($q->fetchAll(PDO::FETCH_ASSOC) as $row){$status=$api->poll((string)$row['upload_id']);$key=is_array($status)?(string)($status['status']??'unavailable'):'unavailable';if(!in_array($key,['PREPARED','UPLOADED','EXPORTED','MATCHED','PROCESSED','LINKAGE_FAILURE'],true))$key='unavailable';$apiStates[$key]=($apiStates[$key]??0)+1;}
            $p->rollBack();
            $path='metrika_upload.log';$text='';
            if(is_file($path)){$f=fopen($path,'rb');if($f){$size=filesize($path);if($size>65536)fseek($f,-65536,SEEK_END);$text=(string)stream_get_contents($f,65536);fclose($f);}}
            $last=null;$lastTime=null;
            foreach(explode("\n",$text) as $line){
              if(preg_match('/\A([0-9-]{10} [0-9:]{8}) MAX_CHANNEL (.+)\z/D',$line,$m)){
                $d=json_decode($m[2],true);$last=is_array($d)?$d:null;
                $time=DateTimeImmutable::createFromFormat('!Y-m-d H:i:s',$m[1],new DateTimeZone(date_default_timezone_get()));$lastTime=$time?$time->getTimestamp():null;
              }
            }
            $worker=[];foreach(['collected','resolved','accepted','processed','unknown','errors'] as $key)$worker[$key]=(int)($last[$key]??-1);
            $fresh=is_int($lastTime)&&time()-$lastTime>=-5&&time()-$lastTime<=360;
            $healthy=$fresh&&($last['mode']??'')==='send'&&$worker['errors']===0&&$bad===0;
            echo json_encode(['ok'=>$healthy,'mode'=>$s['mode'],'counter_id'=>$s['counter_id'],'activated_at_unix'=>(int)$s['activated_at_unix'],'captured_at_utc'=>gmdate('c'),'queue_counts'=>$counts,'totals'=>$totals,'stage_groups'=>$groups,'event_clocks_checked'=>$events,'event_clock_mismatches'=>$bad,'clock_mismatch_kinds'=>$clockIssues,'scheduler_recent'=>$fresh,'last_worker'=>$worker,'api_upload_statuses'=>$apiStates,'verification_conversion_requests'=>0])."\n";
            if(!$healthy)exit(1);
          }catch(Throwable $ignored){echo "{\"ok\":false,\"reason\":\"runtime_verification_failed\",\"verification_conversion_requests\":0}\n";exit(1);}
          PHP
      - name: Remove temporary SSH credential
        if: always()
        run: python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"key"); os.path.exists(p) and os.unlink(p)'

