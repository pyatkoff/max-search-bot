name: One-shot P7 original duplicate diagnosis, read only
on:
  push:
    branches: [audit/content100-bot-publication-20261101]
    paths: ['.github/workflows/fastfill-p7-duplicate-readonly-20261117.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect-existing-publications:
    if: >-
      github.repository == 'pyatkoff/max-search-bot' &&
      github.actor == 'pyatkoff' &&
      github.event.before == 'd41a2c73acdd4c7a8c3af57ed50d6345f7c22317' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Freeze the exact original unattempted P7 manifest for read only diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zipfile,io
          expected='5494dab3ec6d522b2922648595df649f3b5b1608aebf38171f7b5e796a23e966'
          b=subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/actions/artifacts/14331649887/zip'],timeout=90)
          assert hashlib.sha256(b).hexdigest()=='405dff0e21bb3afd2ac8e31bb1a5482257f59c1a50cb546536c1f27c0bfebd1f'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              m=z.read('p7-manifest.json')
          assert hashlib.sha256(m).hexdigest()==expected
          body=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');ini_set('log_errors','0');
          if(PHP_SAPI!=='cli'||trim((string)shell_exec('git rev-parse HEAD'))!=='fd9b28dab2147f13f3b0d0f7f856b14392b141d2')exit(2);
          $m=json_decode(base64_decode(MANIFEST_B64,true),true,64,JSON_THROW_ON_ERROR);
          if(($m['operation']??'')!=='commercial-hotel-batch-20261117-7-v1'||count($m['rows'])!==10)exit(2);
          ob_start();require getcwd().'/config.php';require_once getcwd().'/services/ChannelPostRuntime.php';ob_end_clean();
          $pdo=ConversationDb::connection();$pdo->exec('SET SESSION TRANSACTION READ ONLY');$pdo->beginTransaction();
          $out=['mode'=>'READ_ONLY_P7_ORIGINAL_DUPLICATE_DIAGNOSIS','db_writes'=>0,'provider_calls'=>0,'sender_calls'=>0,'rows'=>[]];
          try{
          foreach(['telegram'=>10,'max'=>9] as $platform=>$cid){
          $q=$pdo->prepare('SELECT pp.id,pp.current_version_id,v.snapshot_json FROM post_publications pp JOIN post_versions v ON v.id=pp.current_version_id WHERE pp.post_channel_id=? ORDER BY pp.id LIMIT 2000');$q->execute([$cid]);$existing=$q->fetchAll(PDO::FETCH_ASSOC);
          foreach($m['rows'] as $row){
              foreach($existing as $e){
                  $s=json_decode($e['snapshot_json'],true,64,JSON_THROW_ON_ERROR);$text=(string)($s['text']??'');$meta=(array)($s['metadata']??[]);
                  $reasons=[];$aliases=[];$first=explode("\n",$text,2)[0];
                  if(($meta['logical_id']??'')===$row['logical_id'])$reasons[]='logical_id';
                  if((int)($meta['hotel_catalog_id']??0)===(int)$row['hotel_id'])$reasons[]='native_id';
                  foreach($row['aliases'] as $a)if(mb_strpos(mb_strtolower($first,'UTF-8'),mb_strtolower($a,'UTF-8'),0,'UTF-8')!==false){$reasons[]='alias';$aliases[]=$a;}
                  if($reasons)$out['rows'][]=['hotel_id'=>$row['hotel_id'],'platform'=>$platform,'publication_id'=>(int)$e['id'],'version_id'=>(int)$e['current_version_id'],'first_line'=>$first,'post_url'=>$s['post_url']??null,'matched_by'=>array_values(array_unique($reasons)),'matched_aliases'=>$aliases,'same_text_sha256'=>hash('sha256',$text)===$row['text_sha256']];
              }
          }}
          $dir='/var/www/anytoour/data/channel-post-operations/commercial-hotel-batch-20261117-7-v1';
          $paths=glob($dir.'/*');$out['original_operation_files']=array_map('basename',$paths);
          $out['original_send_or_upload_state_files']=array_values(array_filter($out['original_operation_files'],static fn($n)=>$n!=='three-hotels.lock'&&$n!=='publication-summary.json'));
          $original=json_decode(file_get_contents($dir.'/publication-summary.json'),true,64,JSON_THROW_ON_ERROR);
          $out['original_result']=['ok'=>$original['ok']??null,'error'=>$original['error']??null,'post_write_attempts'=>$original['post_write_attempts']??null];
          if($out['original_send_or_upload_state_files']!==[]||($original['post_write_attempts']??null)!==0)throw new RuntimeException('prior_write_not_absent');
          $out['ok']=true;
          }finally{$pdo->rollBack();}
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),PHP_EOL;
          '''
          prefix="<?php\nconst MANIFEST_B64='"+base64.b64encode(m).decode()+"';\n"
          # strict_types must remain the first PHP statement.
          body=body.replace("declare(strict_types=1);","declare(strict_types=1);\nconst MANIFEST_B64='"+base64.b64encode(m).decode()+"';",1)
          pathlib.Path('pub').mkdir();pathlib.Path('pub/duplicate-readonly.php').write_text(body)
          PY
          php -l pub/duplicate-readonly.php
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35);found=[]
          for s in scan.stdout.splitlines():
              q=s.split()
              if len(q)<3 or q[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(q[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(s)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read-only current production application HEAD and clean tracked files
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = fd9b28dab2147f13f3b0d0f7f856b14392b141d2
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'set -eu; unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES; export GIT_OPTIONAL_LOCKS=0; app=/var/www/anytoour/data/www/app.anytoour.ru; test -d "$app/.git" && test ! -L "$app"; cd "$app"; test "$(git rev-parse HEAD)" = fd9b28dab2147f13f3b0d0f7f856b14392b141d2; test -z "$(git status --porcelain --untracked-files=no)"; command -v php >/dev/null; printf "CURRENT_PRODUCTION_SOURCE_VERIFIED\\n"' > pub/preflight.txt
          grep -Fx 'CURRENT_PRODUCTION_SOURCE_VERIFIED' pub/preflight.txt
      - name: Inspect original duplicate matches with a read only rolled back transaction; no provider calls
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          options=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts")
          ssh "${options[@]}" "$USER_VALUE@$HOST_VALUE" 'cd /var/www/anytoour/data/www/app.anytoour.ru && php' < pub/duplicate-readonly.php > pub/duplicate-readonly-result.json
          cat pub/duplicate-readonly-result.json
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastfill-p7-duplicate-readonly-20261117
          path: pub/duplicate-readonly-result.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove runner-only credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts" pub/duplicate-readonly.php
