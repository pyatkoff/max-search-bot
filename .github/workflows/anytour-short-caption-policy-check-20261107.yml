name: Verify shortened AnyTour titles offline
on:
  push:
    branches: [audit/anytour-short-caption-policy-20261107]
    paths:
      - .github/workflows/anytour-short-caption-policy-check-20261107.yml
      - tools/direct_demand/operations/prepare-commercial-batch.py
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify old approvals and compile the short title format without channel access
        run: python3 tools/direct_demand/operations/verify-short-caption-policy-20261107.py
