name: Read exact B07 correction prerequisites once through the existing private channel
on:
  push:
    branches: [ops/hotel-server-private-activation-20261102]
    paths: [.github/workflows/hotel-server-private-readiness-20261102.yml]
permissions:
  contents: read
concurrency:
  group: hotel-server-private-activation
  cancel-in-progress: false
jobs:
  private_incident:
    if: github.ref == 'refs/heads/ops/hotel-server-private-activation-20261102' && github.event.before == 'dc1258a99ab1aeb44c28d17598ffaddaf804db6a' && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pin the exact operator and reviewed offline builder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api 'repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/hotel-server-private-readiness.php?ref=${{ github.sha }}' >"$RUNNER_TEMP/hotel_handoff_source.json"
          gh api 'repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/build_hotel_server_handoff.py?ref=${{ github.sha }}' >"$RUNNER_TEMP/hotel_handoff_builder.json"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          operator_blob = 'f62fa5f87844af113780fe52c483e1a9e8d16593'
          operator_sha = '6ab65bb0830b3366973e12ba69eafb42f5be71f31307f1e6af7d934030728b7e'
          builder_blob = 'd2bbe82a97ae8229005db2ffcc1825ce2be37a04'
          builder_sha = '94296118e08221cbcd33e949cfd69c2247fcb6f9ca4a4d7a7b0ab8eb528ffecc'
          for input_name,output_name,expected_blob,expected_sha,limit in [
              ('hotel_handoff_source.json','hotel_handoff.php',operator_blob,operator_sha,196608),
              ('hotel_handoff_builder.json','build_hotel_server_handoff.py',builder_blob,builder_sha,65536)]:
              d=json.loads((root/input_name).read_text())
              assert d['encoding']=='base64' and d['sha']==expected_blob
              b=base64.b64decode(''.join(d['content'].split()),validate=True);assert 0<len(b)<limit
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==expected_blob
              assert hashlib.sha256(b).hexdigest()==expected_sha
              assert not re.search(rb'__[A-Z0-9_]+__',b)
              (root/output_name).write_bytes(b)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Lint and verify refusal outside the fixed server before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          php -l "$RUNNER_TEMP/hotel_handoff.php" >/dev/null
          set +e
          php "$RUNNER_TEMP/hotel_handoff.php" >"$RUNNER_TEMP/hotel_handoff_refusal.json"
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import os,json,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_handoff_refusal.json').read_text())
          assert d=={'operation':'hotel-server-private-incident-v1','state':'HOLD','reason':'target_unconfirmed','operator_provider_calls':0}
          PY
      - name: Verify local diagnostic encryption before loading server credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/build_hotel_server_handoff.py" --check-runner-diagnostics "$RUNNER_TEMP/hotel_handoff.php"
      - name: Load the independently reviewed correction source for the isolated fixture
        uses: actions/checkout@v4
        with:
          repository: pyatkoff/max-search-bot
          ref: 7f96ed9340aeacf65cdfe8c464f2ee44f14c7994
          path: hotel-core-fixture
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the bounded correction on synthetic SQLite before server credentials
        env:
          HOTEL_WORK_NATIVE_MYSQL: '0'
          HOTEL_CORE_SOURCE_SHA: 7f96ed9340aeacf65cdfe8c464f2ee44f14c7994
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hotel-core-fixture"
          test "$(git rev-parse HEAD)" = "$HOTEL_CORE_SOURCE_SHA"
          php -v
          php tests/run_hotel_server_cycle_regression.php | tee "$RUNNER_TEMP/hotel_core_focused.txt"
          php -r 'echo json_encode(["schema"=>"hotel-core-focused-v1","source_sha"=>getenv("HOTEL_CORE_SOURCE_SHA"),"php_version"=>PHP_VERSION,"suite"=>"tests/run_hotel_server_cycle_regression.php","backend"=>"isolated_synthetic_sqlite","state"=>"passed","production_credentials_loaded"=>false,"production_provider_calls"=>0,"required_pr_ci_passed"=>false], JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR), "\n";' >"$RUNNER_TEMP/hotel_core_focused.json"
      - name: Prepare the existing administrator connection and approved host continuity
        env:
          CONNECTION_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$CONNECTION_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_handoff_key"; else printf '%s\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_handoff_key"; fi
          else
            printf '%s' "$raw" | base64 --decode >"$RUNNER_TEMP/hotel_handoff_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/hotel_handoff_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['CONNECTION_HOST'];user=os.environ['CONNECTION_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          approved=[]
          for line in scan.stdout.splitlines():
              f=line.split()
              if len(f)<3 or f[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':approved.append(line)
          assert approved,'Existing host continuity mismatch; STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_handoff_hosts').write_text('\n'.join(approved)+'\n')
          PY
      - name: Read exact B07 stage0 candidate and correction prerequisites once
        id: handoff
        env:
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          timeout 150 ssh -i "$RUNNER_TEMP/hotel_handoff_key" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o IdentitiesOnly=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/hotel_handoff_hosts" "$CONNECTION_USER@$CONNECTION_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; HOTEL_OPERATION_RUN_ID='${{ github.run_id }}' /usr/bin/php" <"$RUNNER_TEMP/hotel_handoff.php" >"$RUNNER_TEMP/hotel_handoff_raw.private" 2>"$RUNNER_TEMP/hotel_handoff_stderr.private"
          status=$?
          set -e
          printf '%s\n' "$status" >"$RUNNER_TEMP/hotel_handoff_status.private"
          export HOTEL_HANDOFF_STATUS="$status"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP']);ok=False;status=int(os.environ['HOTEL_HANDOFF_STATUS'])
          safe={'operation':'hotel-server-private-incident-v1','state':'HOLD','reason':'readback_result_unconfirmed','operator_provider_calls':0}
          try:
              p=root/'hotel_handoff_raw.private';assert 0<p.stat().st_size<=786432
              d=json.loads(p.read_text());assert type(d) is dict
              assert d['operation']=='hotel-server-private-incident-v1' and type(d['operator_provider_calls']) is int and d['operator_provider_calls']==0
              if d['state']=='sealed':
                  assert set(d)=={'operation','state','operator_provider_calls','algorithm','recipient_sha256','aad','key','nonce','tag','ciphertext','ciphertext_sha256'}
                  assert d['algorithm']=='RSA-OAEP-SHA1+A256GCM' and d['recipient_sha256']=='71f2b177d6baa924fa466765027c37f51a00f23f803a6d900060bf42944d237d'
                  assert d['aad']=='hotel-server-private-incident-v1|17400f819817593b3b4428b43a8dbe24b109c428|90b00f80c62dccb911eb4a0082c634685f2bb55155d17a10a531783cd9fbf9f8'
                  decoded={k:base64.b64decode(d[k],validate=True) for k in ['key','nonce','tag','ciphertext']}
                  assert len(decoded['key'])==384 and len(decoded['nonce'])==12 and len(decoded['tag'])==16
                  assert 0<len(decoded['ciphertext'])<=524288 and hashlib.sha256(decoded['ciphertext']).hexdigest()==d['ciphertext_sha256']
                  safe=d;ok=True
              else:
                  assert status!=0 and set(d)=={'operation','state','reason','operator_provider_calls'} and d['state']=='HOLD'
                  assert d['reason'] in {'target_unconfirmed','sealed_readback_result_unconfirmed'}
                  safe=d
          except Exception:pass
          (root/'hotel_handoff_sealed.json').write_text(json.dumps(safe,sort_keys=True)+'\n')
          print(json.dumps({'operation':safe['operation'],'sealed_result':ok,'server_command_exit_code':status,'operator_provider_calls':0,'private_payload_printed':False}))
          sys.exit(0 if ok and status==0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-server-private-correction-preflight-sealed
          path: ${{ runner.temp }}/hotel_handoff_sealed.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain encrypted runner diagnostics for an unsuccessful original observation
        id: runner_diagnostic
        if: always() && steps.handoff.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ! -e "$RUNNER_TEMP/hotel_handoff_raw.private" && ! -L "$RUNNER_TEMP/hotel_handoff_raw.private" && ! -e "$RUNNER_TEMP/hotel_handoff_stderr.private" && ! -L "$RUNNER_TEMP/hotel_handoff_stderr.private" && ! -e "$RUNNER_TEMP/hotel_handoff_status.private" && ! -L "$RUNNER_TEMP/hotel_handoff_status.private" ]]; then
            printf '%s\n' '{"runner_diagnostic":"SKIPPED","reason":"no_runner_capture","server_commands_executed":0}'
            exit 0
          fi
          diagnostic_result="$(python3 -B "$RUNNER_TEMP/build_hotel_server_handoff.py" --seal-runner-diagnostics "$RUNNER_TEMP/hotel_handoff.php" --diagnostic-root "$RUNNER_TEMP" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow-sha "$GITHUB_SHA")"
          python3 - 3<<<"$diagnostic_result" <<'PY'
          import os,json,sys
          def unique_object(pairs):
              result={}
              for key,value in pairs:
                  if key in result:raise ValueError()
                  result[key]=value
              return result
          try:
              with os.fdopen(3) as handle:raw=handle.read(1025)
              if len(raw)>1024:raise ValueError()
              d=json.loads(raw,object_pairs_hook=unique_object)
              sealed=(type(d) is dict and set(d)=={'runner_diagnostic','runtime_outcome_confirmed','acceptance_confirmed','server_commands_executed'}
                      and d['runner_diagnostic']=='SEALED' and d['runtime_outcome_confirmed'] is False
                      and d['acceptance_confirmed'] is False and type(d['server_commands_executed']) is int and d['server_commands_executed']==0)
              skipped=(type(d) is dict and set(d)=={'runner_diagnostic','reason','server_commands_executed'}
                       and d['runner_diagnostic']=='SKIPPED' and d['reason']=='no_runner_capture'
                       and type(d['server_commands_executed']) is int and d['server_commands_executed']==0)
              if not sealed and not skipped:raise ValueError()
              if sealed:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as handle:handle.write('sealed=true\n')
              print(json.dumps(d,sort_keys=True))
          except Exception:
              print('{"runner_diagnostic":"HOLD","reason":"diagnostic_result_unconfirmed","runtime_outcome_confirmed":false,"server_commands_executed":0}',file=sys.stderr)
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.runner_diagnostic.outcome == 'success' && steps.runner_diagnostic.outputs.sealed == 'true'
        with:
          name: hotel-server-private-correction-preflight-diagnostic
          path: ${{ runner.temp }}/hotel_handoff_runner_diagnostic.sealed.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve the exact synthetic focused-test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-b07-core-focused
          path: |
            ${{ runner.temp }}/hotel_core_focused.json
            ${{ runner.temp }}/hotel_core_focused.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove only this run's ephemeral files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/hotel_handoff_source.json" "$RUNNER_TEMP/hotel_handoff_builder.json" "$RUNNER_TEMP/build_hotel_server_handoff.py" "$RUNNER_TEMP/hotel_boundary_fixture.php" "$RUNNER_TEMP/hotel_handoff.php" "$RUNNER_TEMP/hotel_handoff_refusal.json" "$RUNNER_TEMP/hotel_handoff_key" "$RUNNER_TEMP/hotel_handoff_hosts" "$RUNNER_TEMP/hotel_handoff_raw.private" "$RUNNER_TEMP/hotel_handoff_stderr.private" "$RUNNER_TEMP/hotel_handoff_status.private" "$RUNNER_TEMP/hotel_handoff_sealed.json" "$RUNNER_TEMP/hotel_handoff_runner_diagnostic.sealed.json"

