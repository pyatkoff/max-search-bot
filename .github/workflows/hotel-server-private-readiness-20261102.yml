name: Start one prepared HOTEL successor with a resolved terminal boundary
on:
  push:
    branches: [ops/hotel-server-private-activation-20261102]
    paths: [.github/workflows/hotel-server-private-readiness-20261102.yml]
permissions:
  contents: read
concurrency:
  group: hotel-server-private-activation
  cancel-in-progress: false
jobs:
  private_handoff:
    if: github.ref == 'refs/heads/ops/hotel-server-private-activation-20261102' && github.event.before == '965ded6d776b1872ea483d61f0584d24539fe4a3' && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pin the exact operator and reviewed offline builder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api 'repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/hotel-server-private-readiness.php?ref=${{ github.sha }}' >"$RUNNER_TEMP/hotel_handoff_source.json"
          gh api 'repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/build_hotel_server_handoff.py?ref=${{ github.sha }}' >"$RUNNER_TEMP/hotel_handoff_builder.json"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          operator_blob = 'a761ed5c0a5f2b668e52f9435878ca24d92e72dd'
          operator_sha = '2232a1bc434917adf56ffa7581ac47a2e85022d22f753fa9be36ae8678b49ab7'
          builder_blob = '4b6ff083124354cce47871f74adc47da2a120c0e'
          builder_sha = '8fc050e61776819976f4544513bc7b197d091718c444fe0ebe44126250243f94'
          for input_name,output_name,expected_blob,expected_sha,limit in [
              ('hotel_handoff_source.json','hotel_handoff.php',operator_blob,operator_sha,196608),
              ('hotel_handoff_builder.json','build_hotel_server_handoff.py',builder_blob,builder_sha,65536)]:
              d=json.loads((root/input_name).read_text())
              assert d['encoding']=='base64' and d['sha']==expected_blob
              b=base64.b64decode(''.join(d['content'].split()),validate=True);assert 0<len(b)<limit
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==expected_blob
              assert hashlib.sha256(b).hexdigest()==expected_sha
              assert not re.search(rb'__[A-Z0-9_]+__',b)
              (root/output_name).write_bytes(b)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and verify refusal outside the fixed server before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          php -l "$RUNNER_TEMP/hotel_handoff.php" >/dev/null
          set +e
          php "$RUNNER_TEMP/hotel_handoff.php" >"$RUNNER_TEMP/hotel_handoff_refusal.json"
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import os,json,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_handoff_refusal.json').read_text())
          assert d=={'operation':'hotel-server-private-forward-handoff-v2','state':'HOLD','reason':'target_unconfirmed','operator_provider_calls':0}
          PY
      - name: Validate only prepared data and reject incomplete or foreign terminal boundaries before credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/build_hotel_server_handoff.py" --check-source "$RUNNER_TEMP/hotel_handoff.php"
          python3 -B "$RUNNER_TEMP/build_hotel_server_handoff.py" --emit-boundary-fixture "$RUNNER_TEMP/hotel_handoff.php" >"$RUNNER_TEMP/hotel_boundary_fixture.php"
          php "$RUNNER_TEMP/hotel_boundary_fixture.php"
      - name: Prepare the existing administrator connection and approved host continuity
        env:
          CONNECTION_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$CONNECTION_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_handoff_key"; else printf '%s\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_handoff_key"; fi
          else
            printf '%s' "$raw" | base64 --decode >"$RUNNER_TEMP/hotel_handoff_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/hotel_handoff_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['CONNECTION_HOST'];user=os.environ['CONNECTION_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          approved=[]
          for line in scan.stdout.splitlines():
              f=line.split()
              if len(f)<3 or f[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':approved.append(line)
          assert approved,'Existing host continuity mismatch; STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_handoff_hosts').write_text('\n'.join(approved)+'\n')
          PY
      - name: Handoff once and observe the first result produced only by the existing cron
        env:
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          timeout 360 ssh -i "$RUNNER_TEMP/hotel_handoff_key" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o IdentitiesOnly=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/hotel_handoff_hosts" "$CONNECTION_USER@$CONNECTION_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; HOTEL_OPERATION_RUN_ID='${{ github.run_id }}' /usr/bin/php" <"$RUNNER_TEMP/hotel_handoff.php" >"$RUNNER_TEMP/hotel_handoff_raw.private" 2>"$RUNNER_TEMP/hotel_handoff_stderr.private"
          status=$?
          set -e
          export HOTEL_HANDOFF_STATUS="$status"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP']);ok=False;status=int(os.environ['HOTEL_HANDOFF_STATUS'])
          safe={'operation':'hotel-server-private-forward-handoff-v2','state':'HOLD','reason':'handoff_result_unconfirmed','operator_provider_calls':0}
          try:
              p=root/'hotel_handoff_raw.private';assert 0<p.stat().st_size<=98304
              d=json.loads(p.read_text());assert type(d) is dict
              assert d['operation']=='hotel-server-private-forward-handoff-v2' and type(d['operator_provider_calls']) is int and d['operator_provider_calls']==0
              if d['state']=='sealed':
                  assert set(d)=={'operation','state','operator_provider_calls','algorithm','recipient_sha256','aad','key','nonce','tag','ciphertext','ciphertext_sha256'}
                  assert d['algorithm']=='RSA-OAEP-SHA1+A256GCM' and d['recipient_sha256']=='71f2b177d6baa924fa466765027c37f51a00f23f803a6d900060bf42944d237d'
                  assert d['aad']=='hotel-server-private-forward-handoff-v2|0c3d826bc91e534c2232136df9ab9cd318d089f6|5a8ea8b6732af3d32a5e9c126c65a8d58a595af587306e49590669f2e4d99022'
                  decoded={k:base64.b64decode(d[k],validate=True) for k in ['key','nonce','tag','ciphertext']}
                  assert len(decoded['key'])==384 and len(decoded['nonce'])==12 and len(decoded['tag'])==16
                  assert 0<len(decoded['ciphertext'])<=65536 and hashlib.sha256(decoded['ciphertext']).hexdigest()==d['ciphertext_sha256']
                  safe=d;ok=True
              else:
                  assert status!=0 and set(d)=={'operation','state','reason','operator_provider_calls'} and d['state']=='HOLD'
                  assert d['reason'] in {'target_unconfirmed','sealed_handoff_result_unconfirmed'}
                  safe=d
          except Exception:pass
          (root/'hotel_handoff_sealed.json').write_text(json.dumps(safe,sort_keys=True)+'\n')
          print(json.dumps({'operation':safe['operation'],'sealed_result':ok,'server_command_exit_code':status,'operator_provider_calls':0,'private_payload_printed':False}))
          sys.exit(0 if ok and status==0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-server-private-handoff-sealed
          path: ${{ runner.temp }}/hotel_handoff_sealed.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove only this run's ephemeral files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/hotel_handoff_source.json" "$RUNNER_TEMP/hotel_handoff_builder.json" "$RUNNER_TEMP/build_hotel_server_handoff.py" "$RUNNER_TEMP/hotel_boundary_fixture.php" "$RUNNER_TEMP/hotel_handoff.php" "$RUNNER_TEMP/hotel_handoff_refusal.json" "$RUNNER_TEMP/hotel_handoff_key" "$RUNNER_TEMP/hotel_handoff_hosts" "$RUNNER_TEMP/hotel_handoff_raw.private" "$RUNNER_TEMP/hotel_handoff_stderr.private" "$RUNNER_TEMP/hotel_handoff_sealed.json"
