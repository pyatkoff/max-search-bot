name: Confirm B02 completion and preserve exact accepted records
on:
  push:
    branches: [ops/hotel-server-private-activation-20261102]
    paths: [.github/workflows/hotel-server-private-readiness-20261102.yml]
permissions:
  contents: read
concurrency:
  group: hotel-server-private-activation
  cancel-in-progress: false
jobs:
  private_forward_completion:
    if: github.ref == 'refs/heads/ops/hotel-server-private-activation-20261102' && github.event.before == '5899d11e198ad5e65003a8353fed8cdf6aa4693e' && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pin the exact read-only B02 completion reader
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api 'repos/pyatkoff/max-search-bot/contents/tools/direct_demand/operations/hotel-server-private-readiness.php?ref=${{ github.sha }}' >"$RUNNER_TEMP/hotel_forward_completion_source.json"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);d=json.loads((root/'hotel_forward_completion_source.json').read_text())
          assert d['encoding']=='base64' and d['sha']=='8c73112850e455d6912a669c0ca1aa64afe9e0db'
          b=base64.b64decode(d['content']);assert len(b)<65536
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==d['sha']
          assert hashlib.sha256(b).hexdigest()=='f203a2eccdf1790fb0429773abb0fd336fc5dbeea1413c9fecb9c0a16e622c01'
          assert b'__PIN_' not in b
          (root/'hotel_forward_completion.php').write_bytes(b)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and verify refusal outside the fixed server before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          php -l "$RUNNER_TEMP/hotel_forward_completion.php" >/dev/null
          set +e
          php "$RUNNER_TEMP/hotel_forward_completion.php" >"$RUNNER_TEMP/hotel_forward_completion_refusal.json"
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import os,json,pathlib
          d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_forward_completion_refusal.json').read_text())
          assert d=={'operation':'hotel-server-private-forward-completion-v1','state':'HOLD','reason':'target_unconfirmed','operator_provider_calls':0}
          PY
      - name: Prepare the existing administrator connection and approved host continuity
        env:
          CONNECTION_KEY: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw="$CONNECTION_KEY"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_forward_completion_key"; else printf '%s\n' "$raw" | tr -d '\r' >"$RUNNER_TEMP/hotel_forward_completion_key"; fi
          else
            printf '%s' "$raw" | base64 --decode >"$RUNNER_TEMP/hotel_forward_completion_key"
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/hotel_forward_completion_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['CONNECTION_HOST'];user=os.environ['CONNECTION_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35)
          approved=[]
          for line in scan.stdout.splitlines():
              f=line.split()
              if len(f)<3 or f[0].startswith('#'):continue
              try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':approved.append(line)
          assert approved,'Existing host continuity mismatch; STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/hotel_forward_completion_hosts').write_text('\n'.join(approved)+'\n')
          PY
      - name: Read B02 completion and exact accepted chain once
        env:
          CONNECTION_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          CONNECTION_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          timeout 150 ssh -i "$RUNNER_TEMP/hotel_forward_completion_key" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o IdentitiesOnly=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/hotel_forward_completion_hosts" "$CONNECTION_USER@$CONNECTION_HOST" "set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; HOTEL_OPERATION_RUN_ID='${{ github.run_id }}' /usr/bin/php" <"$RUNNER_TEMP/hotel_forward_completion.php" >"$RUNNER_TEMP/hotel_forward_completion_raw.private" 2>"$RUNNER_TEMP/hotel_forward_completion_stderr.private"
          status=$?
          set -e
          export HOTEL_FORWARD_COMPLETION_EXIT="$status"
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP']);ok=False;status=int(os.environ['HOTEL_FORWARD_COMPLETION_EXIT'])
          safe={'operation':'hotel-server-private-forward-completion-v1','state':'HOLD','reason':'readback_result_unconfirmed','operator_provider_calls':0}
          try:
              p=root/'hotel_forward_completion_raw.private';assert 0<p.stat().st_size<=196608
              d=json.loads(p.read_text());assert type(d) is dict
              assert d['operation']=='hotel-server-private-forward-completion-v1' and type(d['operator_provider_calls']) is int and d['operator_provider_calls']==0
              if d['state']=='sealed':
                  assert set(d)=={'operation','state','operator_provider_calls','algorithm','recipient_sha256','aad','key','nonce','tag','ciphertext','ciphertext_sha256'}
                  assert d['algorithm']=='RSA-OAEP-SHA1+A256GCM' and d['recipient_sha256']=='71f2b177d6baa924fa466765027c37f51a00f23f803a6d900060bf42944d237d'
                  assert d['aad']=='hotel-server-private-forward-completion-v1|eba94cba614ac275b13ab87b8d9b05effdbebd12|c44e7842f84ad562518f9a3ed736aadff58a11616761801ff437fd901d732094'
                  decoded={k:base64.b64decode(d[k],validate=True) for k in ['key','nonce','tag','ciphertext']}
                  assert len(decoded['key'])==384 and len(decoded['nonce'])==12 and len(decoded['tag'])==16
                  assert 0<len(decoded['ciphertext'])<=131072 and hashlib.sha256(decoded['ciphertext']).hexdigest()==d['ciphertext_sha256']
                  safe=d;ok=True
              else:
                  assert status!=0 and set(d)=={'operation','state','reason','operator_provider_calls'} and d['state']=='HOLD'
                  assert d['reason'] in {'target_unconfirmed','sealed_readback_result_unconfirmed'}
                  safe=d
          except Exception:pass
          (root/'hotel_forward_completion_sealed.json').write_text(json.dumps(safe,sort_keys=True)+'\n')
          print(json.dumps({'operation':safe['operation'],'sealed_result':ok,'server_command_exit_code':status,'operator_provider_calls':0,'private_payload_printed':False}))
          sys.exit(0 if ok and status==0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-server-private-forward-completion-sealed
          path: ${{ runner.temp }}/hotel_forward_completion_sealed.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove only this run's ephemeral files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/hotel_forward_completion_source.json" "$RUNNER_TEMP/hotel_forward_completion.php" "$RUNNER_TEMP/hotel_forward_completion_refusal.json" "$RUNNER_TEMP/hotel_forward_completion_key" "$RUNNER_TEMP/hotel_forward_completion_hosts" "$RUNNER_TEMP/hotel_forward_completion_raw.private" "$RUNNER_TEMP/hotel_forward_completion_stderr.private" "$RUNNER_TEMP/hotel_forward_completion_sealed.json"
