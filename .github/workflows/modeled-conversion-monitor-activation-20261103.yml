name: Activate existing modeled conversion monitor once

on:
  push:
    branches: ['ops/modeled-monitor-activation-20261103']
    paths: ['.github/workflows/modeled-conversion-monitor-activation-20261103.yml']

permissions:
  contents: read
  actions: write

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: modeled-monitor-activation-20261103-original
      cancel-in-progress: false
    steps:
      - name: Verify one original exact-source activation and prepare intent
        id: intent
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const expected = '43dbb386de45d180ef3586b148c1409bab394ed3';
            const branch = 'ops/modeled-monitor-activation-20261103';
            if (context.repo.owner !== 'pyatkoff' || context.repo.repo !== 'max-search-bot' ||
                context.eventName !== 'push' || context.ref !== 'refs/heads/' + branch ||
                process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('original_invocation_required');
            const main = await github.rest.git.getRef({...context.repo, ref:'heads/main'});
            if (main.data.object.sha !== expected) throw new Error('current_main_changed');
            
            const workflow = await github.rest.actions.getWorkflow({...context.repo, workflow_id:'live-session-diagnostics.yml'});
            if (workflow.data.state !== 'active' || workflow.data.path !== '.github/workflows/live-session-diagnostics.yml') throw new Error('canonical_workflow_unavailable');
            const commit = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            if (commit.data.parents.length !== 1 || commit.data.parents[0].sha !== expected) throw new Error('original_ops_parent_required');
            const diff = await github.rest.repos.compareCommits({...context.repo, base:expected, head:context.sha});
            if (diff.data.total_commits !== 1 || diff.data.files?.length !== 1 ||
                diff.data.files[0].filename !== '.github/workflows/modeled-conversion-monitor-activation-20261103.yml' || diff.data.files[0].status !== 'added') throw new Error('one_helper_path_required');
            const fs = require('fs');
            const output = process.env.RUNNER_TEMP + '/modeled-monitor-activation';
            fs.mkdirSync(output,{recursive:true,mode:0o700});
            fs.writeFileSync(output + '/intent.json', JSON.stringify({
              operation:'modeled-monitor-activation-20261103-original',
              helper_run_id:context.runId, helper_sha:context.sha, expected_main:expected,
              workflow_id:workflow.data.id, workflow_path:workflow.data.path, ref:'main',
              created_at:new Date().toISOString(), policy:'single_post_no_retry'
            })+'\n',{mode:0o600});
            core.setOutput('workflow_id',String(workflow.data.id));
            core.info('original_dispatch_intent_prepared');

      - name: Retain technical intent before dispatch
        id: durable
        uses: actions/upload-artifact@v4
        with:
          name: modeled-monitor-activation-original-intent
          path: ${{ runner.temp }}/modeled-monitor-activation/intent.json
          retention-days: 7
          if-no-files-found: error

      - name: Dispatch existing current-main monitor once
        if: steps.durable.outcome == 'success'
        uses: actions/github-script@v7
        env:
          INTENT_ARTIFACT_ID: ${{ steps.durable.outputs.artifact-id }}
          TARGET_WORKFLOW_ID: ${{ steps.intent.outputs.workflow_id }}
        with:
          retries: 0
          script: |
            const expected = '43dbb386de45d180ef3586b148c1409bab394ed3';
            const branch = 'ops/modeled-monitor-activation-20261103';
            if (context.repo.owner !== 'pyatkoff' || context.repo.repo !== 'max-search-bot' ||
                context.eventName !== 'push' || context.ref !== 'refs/heads/' + branch ||
                process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('original_invocation_required');
            const main = await github.rest.git.getRef({...context.repo, ref:'heads/main'});
            if (main.data.object.sha !== expected) throw new Error('current_main_changed');
            
            if (!/^[1-9][0-9]*$/.test(process.env.INTENT_ARTIFACT_ID || '') ||
                !/^[1-9][0-9]*$/.test(process.env.TARGET_WORKFLOW_ID || '')) throw new Error('retained_intent_required');
            const fs = require('fs');
            const output = process.env.RUNNER_TEMP + '/modeled-monitor-activation';
            const intent = JSON.parse(fs.readFileSync(output + '/intent.json','utf8'));
            if (intent.helper_run_id !== context.runId || intent.helper_sha !== context.sha ||
                intent.expected_main !== expected || String(intent.workflow_id) !== process.env.TARGET_WORKFLOW_ID ||
                Date.now()-Date.parse(intent.created_at) > 300000) throw new Error('intent_scope_changed');
            let receipt={operation:intent.operation,helper_run_id:context.runId,expected_main:expected,outcome:'dispatch_outcome_unconfirmed'};
            fs.writeFileSync(output + '/receipt.json',JSON.stringify(receipt)+'\n',{mode:0o600});
            try {
              const response = await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',{
                ...context.repo,workflow_id:Number(process.env.TARGET_WORKFLOW_ID),ref:'main',
                headers:{'X-GitHub-Api-Version':'2026-03-10'},request:{timeout:15000}
              });
              if (response.status !== 200 && response.status !== 204) throw new Error('unexpected_dispatch_response');
              receipt.outcome='dispatch_accepted';
              receipt.http_status=response.status;
              const id=response.data?.workflow_run_id;
              if (Number.isSafeInteger(id) && id>0) receipt.target_run_id=id;
              fs.writeFileSync(output + '/receipt.json',JSON.stringify(receipt)+'\n',{mode:0o600});
              core.info(JSON.stringify(receipt));
            } catch (error) {
              core.error('dispatch_outcome_unconfirmed_do_not_repeat');
              throw new Error('original_dispatch_failed_or_unconfirmed');
            }

      - name: Preserve original dispatch receipt
        if: always() && steps.durable.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: modeled-monitor-activation-original-receipt
          path: ${{ runner.temp }}/modeled-monitor-activation/receipt.json
          retention-days: 7
          if-no-files-found: error
