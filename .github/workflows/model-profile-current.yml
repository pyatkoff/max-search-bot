name: Read private current model profiles
on:
  push:
    branches: [audit/model-profile-current-20261025]
permissions:
  contents: read
jobs:
  private-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_RUNTIME_SHA: fd95108ac398ccf1c8e4ed641d429adf33ae4e4e
      PROFILE_MODE: capture
      EXPECTED_INPUT_DIGEST: ''
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned runner-only age dependency
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/profile-venv"
          "$RUNNER_TEMP/profile-venv/bin/pip" download --only-binary=:all: --no-deps --require-hashes -r tools/requirements-encrypted-evidence.txt --dest "$RUNNER_TEMP/profile-wheel"
          "$RUNNER_TEMP/profile-venv/bin/pip" install --no-index --no-deps --require-hashes --find-links "$RUNNER_TEMP/profile-wheel" -r tools/requirements-encrypted-evidence.txt
      - name: Prepare the existing canonical SSH identity
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/model_profile_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            [[ "$decoded" == *"PRIVATE KEY"* ]] || { echo invalid_existing_identity; exit 1; }
            printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Read fixed authorized input privately
        env:
          DEPLOY_HOST: ${{ secrets.STANDBY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/profile-venv/bin/python" tools/audit_model_profile_current.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-model-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-profile-artifact/
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner-only identity and private work
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/model_profile_key" "$RUNNER_TEMP/model_profile_hosts" "$RUNNER_TEMP/model-profile-artifact" "$RUNNER_TEMP/profile-venv" "$RUNNER_TEMP/profile-wheel"

