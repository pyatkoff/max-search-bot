name: Workspace V2 visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'manager/**'
      - 'manager2/**'
      - 'tests/visual/**'
      - '.github/workflows/workspace-v2-visual-qa.yml'
      - 'tools/verify_manager2_visual_evidence.js'
      - 'tests/run_manager2_visual_gate_regression.js'
      - 'tests/run_workspace_v2_visual_qa_contract_regression.php'
  workflow_dispatch:

permissions:
  contents: read

# Only superseded read-only PR runs may be cancelled. Manual evidence runs have
# unique groups, and this workflow never groups with deployment workflows.
concurrency:
  group: workspace-v2-visual-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # Engines run on isolated runners. Preserve workers=1 within each engine
    # because the fixtures share ports and output names inside their own job.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP for real Manager shell
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-${{ matrix.browser }}-npm-v1

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-${{ matrix.browser }}-browser-v1

      - name: Install Playwright
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          # OS packages are required even when the pinned browser cache is warm.
          npx playwright install-deps "$QA_BROWSER"
          npx playwright install "$QA_BROWSER"

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workspace-v2-mobile.css' tests/visual/workspace-v2-fixture.html
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/visual-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/visual-server.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-kanban-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-theme-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-activity-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-startup-failure-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-load-failure-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-task-edit-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/admin-audit-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/pipeline-admin-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/visual-server.log"
          exit 1

      # Exercise real HTTP cache in isolated normal profiles before the longer
      # layout suite. Each of the four cases runs exactly once per engine.
      - name: Verify daily avatar HTTP cache
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/visual/manager-avatar-cache.spec.js --browser="$QA_BROWSER" --reporter=line --workers=1

      - name: Assert responsive layout contracts
        if: matrix.browser == 'chromium'
        run: npx playwright test tests/visual/workspace-v2-layout.spec.js tests/visual/workspace-send-feedback.spec.js tests/visual/workspace-notification-diagnostics.spec.js tests/visual/manager-browser-push-state.spec.js tests/visual/workspace-emoji-picker.spec.js tests/visual/workspace-timezone.spec.js tests/visual/workspace-conversation-scroll.spec.js tests/visual/manager2-workspace.spec.js tests/visual/manager2-messenger-layout.spec.js tests/visual/manager-admin-load.spec.js tests/visual/manager-admin-workspace.spec.js tests/visual/manager-quick-replies.spec.js tests/visual/manager-personal-workspace.spec.js tests/visual/manager-manual-groups.spec.js tests/visual/manager-internal-notes.spec.js tests/visual/manager-customer-name.spec.js tests/visual/manager2-customer-avatar.spec.js tests/visual/manager-media-compose.spec.js tests/visual/manager-handoff-cancellation.spec.js tests/visual/manager-handoff-cancellation-shell.spec.js tests/visual/manager-transcript-history.spec.js --reporter=line --workers=1

      - name: Check send feedback in WebKit
        if: matrix.browser == 'webkit'
        run: npx playwright test tests/visual/workspace-send-feedback.spec.js tests/visual/workspace-notification-diagnostics.spec.js tests/visual/manager-browser-push-state.spec.js tests/visual/workspace-emoji-picker.spec.js tests/visual/workspace-timezone.spec.js tests/visual/workspace-conversation-scroll.spec.js tests/visual/manager2-workspace.spec.js tests/visual/manager2-messenger-layout.spec.js tests/visual/manager-admin-load.spec.js tests/visual/manager-admin-workspace.spec.js tests/visual/manager-quick-replies.spec.js tests/visual/manager-personal-workspace.spec.js tests/visual/manager-manual-groups.spec.js tests/visual/manager-internal-notes.spec.js tests/visual/manager-customer-name.spec.js tests/visual/manager2-customer-avatar.spec.js tests/visual/manager-media-compose.spec.js tests/visual/manager-handoff-cancellation.spec.js tests/visual/manager-handoff-cancellation-shell.spec.js tests/visual/manager-transcript-history.spec.js --browser=webkit --reporter=line --workers=1
      - name: Capture responsive screenshots
        if: matrix.browser == 'chromium'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          url='http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html'
          kanban='http://127.0.0.1:4173/tests/visual/workspace-v2-kanban-fixture.html'
          theme='http://127.0.0.1:4173/tests/visual/workspace-v2-theme-fixture.html'
          activity='http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-activity-fixture.html'
          startup='http://127.0.0.1:4173/tests/visual/workspace-v2-startup-failure-fixture.html'
          inboxFailure='http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-load-failure-fixture.html'
          taskEdit='http://127.0.0.1:4173/tests/visual/workspace-v2-task-edit-fixture.html'
          adminAudit='http://127.0.0.1:4173/tests/visual/admin-audit-fixture.html'
          pipelineAdmin='http://127.0.0.1:4173/tests/visual/pipeline-admin-fixture.html'
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url" visual-artifacts/workspace-v2-390-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url?view=conversation" visual-artifacts/workspace-v2-390-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url?view=conversation&stress=chat" visual-artifacts/workspace-v2-390-conversation-stress.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$url" visual-artifacts/workspace-v2-430-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$url?view=lead" visual-artifacts/workspace-v2-430-lead.png
          npx playwright screenshot --browser chromium --viewport-size='768,1024' --full-page "$url?view=conversation" visual-artifacts/workspace-v2-768-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$url" visual-artifacts/workspace-v2-1440-desktop.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$url?view=conversation&stress=chat" visual-artifacts/workspace-v2-1440-conversation-stress.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$kanban" visual-artifacts/workspace-v2-390-kanban.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$kanban" visual-artifacts/workspace-v2-1440-kanban.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$theme" visual-artifacts/workspace-v2-theme-390-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$theme?view=lead" visual-artifacts/workspace-v2-theme-430-lead.png
          npx playwright screenshot --browser chromium --viewport-size='768,1024' --full-page "$theme?view=conversation" visual-artifacts/workspace-v2-theme-768-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$theme" visual-artifacts/workspace-v2-theme-1440-desktop.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$activity" visual-artifacts/workspace-v2-390-inbox-activity.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$activity" visual-artifacts/workspace-v2-1440-inbox-activity.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$startup" visual-artifacts/workspace-v2-390-startup-failure.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$startup" visual-artifacts/workspace-v2-1440-startup-failure.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$inboxFailure" visual-artifacts/workspace-v2-390-inbox-load-failure.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$inboxFailure" visual-artifacts/workspace-v2-1440-inbox-load-failure.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$taskEdit" visual-artifacts/workspace-v2-task-edit-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$taskEdit" visual-artifacts/workspace-v2-task-edit-1440.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$adminAudit" visual-artifacts/admin-audit-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$adminAudit" visual-artifacts/admin-audit-1440.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$pipelineAdmin" visual-artifacts/pipeline-admin-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$pipelineAdmin" visual-artifacts/pipeline-admin-1440.png
          test "$(find visual-artifacts -type f -name '*.png' | wc -l)" -eq 34
          find visual-artifacts -type f -name '*.png' -size +10k | grep -q .

      # A receipt is created only after every test and capture for this engine
      # passed. captureCount records the actual visual-artifacts PNG count:
      # eight layout screenshots plus 26 CLI captures in Chromium, zero in
      # WebKit. Other evidence directories contain further spec screenshots.
      - name: Record complete engine evidence
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_TESTED_SHA: ${{ github.sha }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const browser = process.env.QA_BROWSER;
          fs.writeFileSync('visual-receipt.json', JSON.stringify({
            mode: 'full', browser, testedSha: process.env.QA_TESTED_SHA,
            headSha: process.env.QA_HEAD_SHA, runId: process.env.QA_RUN_ID,
            runAttempt: process.env.QA_RUN_ATTEMPT,
            specCount: browser === 'chromium' ? 21 : 20,
            captureCount: browser === 'chromium' ? 34 : 0, completed: true
          }, null, 2) + '\n');
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-${{ matrix.browser }}
          overwrite: true
          path: |
            visual-receipt.json
            visual-artifacts/*.png
            send-feedback-artifacts/*.png
            notification-diagnostic-artifacts/*.png
            conversation-scroll-artifacts/*.png
            emoji-picker-artifacts/*.png
            timezone-artifacts/*.png
            manager2-artifacts/*.png
            manager-media-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  firefox-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP for real Manager shell
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-firefox-npm-v1
      - name: Cache Playwright Firefox
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-firefox-browser-v1
      - name: Install Firefox
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install-deps firefox
          npx playwright install firefox
      - name: Start isolated history fixture server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/firefox-history-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firefox-history-server.log"
          exit 1
      # Actual PHP shell and canonical modules; only local synthetic API replies.
      - name: Verify older history transport in Firefox
        run: npx playwright test tests/visual/manager-transcript-history.spec.js --grep 'older transport' --browser=firefox --reporter=line --workers=1
      - name: Upload Firefox history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-history-${{ github.sha }}
          overwrite: true
          path: |
            manager2-artifacts/history-*firefox*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  firefox-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-firefox-npm-v1
      - name: Cache Playwright Firefox
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node22-playwright1.55.0-firefox-browser-v1
      - name: Install Firefox
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install-deps firefox
          npx playwright install firefox
      - name: Start isolated static fixture server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/firefox-notifications-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firefox-notifications-server.log"
          exit 1
      # Browser/HTTP failures are controlled fixtures, not provider delivery tests.
      - name: Verify notification setup in Firefox
        run: npx playwright test tests/visual/workspace-notification-diagnostics.spec.js tests/visual/manager-browser-push-state.spec.js --browser=firefox --reporter=line --workers=1
      - name: Upload Firefox notification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-notifications-${{ github.sha }}
          overwrite: true
          path: |
            notification-diagnostic-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  # Keep the required check name stable. A failed, cancelled or skipped engine,
  # missing artifact/receipt or mismatched provenance must never become green.
  screenshots:
    if: always()
    needs: [browser-tests, firefox-history, firefox-notifications]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download Chromium evidence
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-chromium
          path: evidence/chromium
      - name: Download WebKit evidence
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-webkit
          path: evidence/webkit
      - name: Validate full evidence and all required browser jobs
        if: always()
        env:
          QA_TESTED_SHA: ${{ github.sha }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_BROWSER_RESULT: ${{ needs.browser-tests.result }}
          QA_FIREFOX_HISTORY_RESULT: ${{ needs.firefox-history.result }}
          QA_FIREFOX_NOTIFICATIONS_RESULT: ${{ needs.firefox-notifications.result }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/verify_manager2_visual_evidence.js evidence "$QA_TESTED_SHA" "$QA_HEAD_SHA" "$QA_BROWSER_RESULT" "$QA_FIREFOX_HISTORY_RESULT" "$QA_FIREFOX_NOTIFICATIONS_RESULT" "$QA_RUN_ID" "$QA_RUN_ATTEMPT"
      # The canonical artifact now contains chromium/ and webkit/ directories;
      # original per-engine evidence directories remain intact below each one.
      - name: Upload complete visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}
          overwrite: true
          path: evidence/
          if-no-files-found: error
          retention-days: 14
