name: Workspace V2 visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'services/ManagerPreparationOAuth.php'
      - 'services/ManagerTourSelection*.php'
      - 'services/TourSelectionPhotoStore.php'
      - 'tests/run_manager_tour_*_regression.php'
      - 'tests/support/manager-tour-selection.php'
      - 'tests/support/manager-tour-collector.php'
      - 'tests/run_manager_tour_collector_behavior_regression.js'
      - 'tests/mysql/manager-tour-collector.php'
      - 'extensions/selection-collector/**'
      - '!extensions/selection-collector/README.md'
      - 'tests/run_manager_preparation_oauth_regression.php'
      - 'manager/**'
      - 'manager2/**'
      - 'selection/**'
      - 'tests/visual/**'
      - '.github/workflows/workspace-v2-visual-qa.yml'
      - 'tools/verify_manager2_visual_evidence.js'
      - 'tools/manager2_visual_inventory.js'
      - 'tools/manager2_visual_reuse.js'
      - 'tools/manager2_visual_shards.js'
      - 'tools/manager2_visual_artifact.py'
      - 'tests/run_manager2_visual_gate_regression.js'
      - 'tests/run_manager2_visual_selection_regression.js'
      - 'tests/run_workspace_v2_visual_qa_contract_regression.php'
      - '.github/workflows/ci-change-scope.yml'
      - 'tools/verify_oauth_browser_report.js'
      - 'tools/verify_tour_selection_browser_report.js'
      - 'tests/run_oauth_browser_report_regression.js'
      - 'tests/check_ci_workflow_scopes.py'
      - 'tools/ci_change_scope.js'
      - 'tests/run_ci_change_scope_regression.js'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

# Only superseded read-only PR runs may be cancelled. Manual evidence runs have
# unique groups, and this workflow never groups with deployment workflows.
concurrency:
  group: workspace-v2-visual-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    uses: ./.github/workflows/ci-change-scope.yml

  selection:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      donor-run: ${{ steps.donor.outputs.run }}
      donor-name: ${{ steps.donor.outputs.name }}
      donor-id: ${{ steps.donor.outputs.id }}
      donor-digest: ${{ steps.donor.outputs.digest }}
      plan-id: ${{ steps.plan-artifact.outputs.artifact-id }}
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
      QA_TESTED_SHA: ${{ github.sha }}
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}
      QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Checkout full ancestry for same-PR donor validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Locate immutable successful same-PR full evidence
        id: donor
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner,repo} = context.repo;
            const pr = context.payload.pull_request;
            const runs = await github.rest.actions.listWorkflowRuns({owner,repo,
              workflow_id:'workspace-v2-visual-qa.yml',event:'pull_request',status:'success',per_page:20});
            for (const run of runs.data.workflow_runs) {
              if (run.id >= context.runId || run.status !== 'completed' || run.conclusion !== 'success' ||
                  run.path !== '.github/workflows/workspace-v2-visual-qa.yml' ||
                  run.head_repository?.full_name !== context.payload.repository.full_name ||
                  run.head_branch !== pr.head.ref || !run.pull_requests.some(item=>item.number===pr.number)) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id,per_page:100});
              const artifact = artifacts.data.artifacts.find(item=>!item.expired &&
                /^workspace-v2-visual-[a-f0-9]{40}$/.test(item.name) && /^sha256:[a-f0-9]{64}$/.test(item.digest||'') &&
                artifacts.data.artifacts.some(marker=>!marker.expired&&marker.name==='workspace-v2-full-index-'+item.name.slice('workspace-v2-visual-'.length)));
              if (!artifact) continue;
              const metadata={repository:context.payload.repository.full_name,prNumber:String(pr.number),
                workflow:run.path,runId:String(run.id),runAttempt:String(run.run_attempt),
                status:run.status,conclusion:run.conclusion,event:run.event,headSha:run.head_sha,
                testedSha:artifact.name.slice('workspace-v2-visual-'.length),
                artifactId:String(artifact.id),artifactName:artifact.name,artifactDigest:artifact.digest};
              fs.writeFileSync('donor-meta.json',JSON.stringify(metadata,null,2)+'\n');
              core.setOutput('run',String(run.id));core.setOutput('name',artifact.name);
              core.setOutput('id',String(artifact.id));core.setOutput('digest',artifact.digest);
              break;
            }
      - name: Read candidate donor without making it release evidence
        if: steps.donor.outputs.run != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DONOR_ARTIFACT_ID: ${{ steps.donor.outputs.id }}
          DONOR_ARTIFACT_DIGEST: ${{ steps.donor.outputs.digest }}
        with:
          script: |
            const fs=require('node:fs'),cp=require('node:child_process');
            const response=await github.rest.actions.downloadArtifact({...context.repo,
              artifact_id:Number(process.env.DONOR_ARTIFACT_ID),archive_format:'zip'});
            fs.writeFileSync('baseline.zip',Buffer.from(response.data));
            cp.execFileSync('python3',['tools/manager2_visual_artifact.py','baseline.zip','baseline',process.env.DONOR_ARTIFACT_DIGEST],{stdio:'inherit'});
      - name: Plan fail-closed full or audited spec-only coverage
        id: plan
        run: node tools/manager2_visual_reuse.js plan
      - name: Publish exact current selection plan
        id: plan-artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager2-visual-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: selection-plan.json
          if-no-files-found: error
          retention-days: 14

  browser-parts:
    name: browser part (${{ matrix.browser }}, ${{ matrix.part }})
    needs: selection
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    # Whole-spec parts run on isolated runners. Preserve workers=1 within each
    # part because the fixtures share ports and output names inside that job.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        part: [0, 1]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
      QA_TESTED_SHA: ${{ github.sha }}
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}
      QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Require the immutable selection plan artifact ID
        env:
          PLAN_ARTIFACT_ID: ${{ needs.selection.outputs.plan-id }}
        run: '[[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Read exact current selection plan
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.selection.outputs.plan-id }}
          merge-multiple: true
          path: .
      - name: Read immutable donor in separate namespace
        if: needs.selection.outputs.mode == 'affected'
        uses: actions/github-script@v7
        env:
          DONOR_ARTIFACT_ID: ${{ needs.selection.outputs.donor-id }}
          DONOR_ARTIFACT_DIGEST: ${{ needs.selection.outputs.donor-digest }}
        with:
          script: |
            const fs=require('node:fs'),cp=require('node:child_process');
            const response=await github.rest.actions.downloadArtifact({...context.repo,
              artifact_id:Number(process.env.DONOR_ARTIFACT_ID),archive_format:'zip'});
            fs.writeFileSync('baseline.zip',Buffer.from(response.data));
            cp.execFileSync('python3',['tools/manager2_visual_artifact.py','baseline.zip','baseline',process.env.DONOR_ARTIFACT_DIGEST],{stdio:'inherit'});
      - name: Require valid donor or full coverage on the actual browser runner
        id: coverage
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: node tools/manager2_visual_reuse.js prepare
      - name: Collect full inventory and the exact whole-spec partition
        run: node tools/manager2_visual_shards.js inventory "${{ matrix.browser }}" "${{ matrix.part }}"

      - name: Start static server
        shell: "bash /opt/manager2-qa/run {0}"
        run: |
          set -euo pipefail
          grep -q 'workspace-v2-mobile.css' tests/visual/workspace-v2-fixture.html
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/visual-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/visual-server.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-kanban-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-theme-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-activity-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-startup-failure-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-load-failure-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-task-edit-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/admin-audit-fixture.html >/dev/null && curl -fsS http://127.0.0.1:4173/tests/visual/pipeline-admin-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/visual-server.log"
          exit 1

      # Exercise real HTTP cache in isolated normal profiles before the longer
      # layout suite. Each of the four cases runs exactly once per engine.
      - name: Verify daily avatar HTTP cache
        if: matrix.part == 0
        env:
          QA_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-reports/cache.json
        run: npx playwright test tests/visual/manager-avatar-cache.spec.js --browser="$QA_BROWSER" --reporter=line,json --workers=1

      # Every existing spec executes once, workers=1 in its isolated runner.
      # Unknown/shared/product changes remain FULL, not a narrower selection.
      - name: Assert responsive layout contracts for the exact spec partition
        run: node tools/manager2_visual_shards.js run-part "${{ matrix.browser }}" "${{ matrix.part }}"

      - name: Capture responsive screenshots
        if: matrix.browser == 'chromium' && matrix.part == 0
        shell: "bash /opt/manager2-qa/run {0}"
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          url='http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html'
          kanban='http://127.0.0.1:4173/tests/visual/workspace-v2-kanban-fixture.html'
          theme='http://127.0.0.1:4173/tests/visual/workspace-v2-theme-fixture.html'
          activity='http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-activity-fixture.html'
          startup='http://127.0.0.1:4173/tests/visual/workspace-v2-startup-failure-fixture.html'
          inboxFailure='http://127.0.0.1:4173/tests/visual/workspace-v2-inbox-load-failure-fixture.html'
          taskEdit='http://127.0.0.1:4173/tests/visual/workspace-v2-task-edit-fixture.html'
          adminAudit='http://127.0.0.1:4173/tests/visual/admin-audit-fixture.html'
          pipelineAdmin='http://127.0.0.1:4173/tests/visual/pipeline-admin-fixture.html'
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url" visual-artifacts/workspace-v2-390-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url?view=conversation" visual-artifacts/workspace-v2-390-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$url?view=conversation&stress=chat" visual-artifacts/workspace-v2-390-conversation-stress.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$url" visual-artifacts/workspace-v2-430-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$url?view=lead" visual-artifacts/workspace-v2-430-lead.png
          npx playwright screenshot --browser chromium --viewport-size='768,1024' --full-page "$url?view=conversation" visual-artifacts/workspace-v2-768-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$url" visual-artifacts/workspace-v2-1440-desktop.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$url?view=conversation&stress=chat" visual-artifacts/workspace-v2-1440-conversation-stress.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$kanban" visual-artifacts/workspace-v2-390-kanban.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$kanban" visual-artifacts/workspace-v2-1440-kanban.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$theme" visual-artifacts/workspace-v2-theme-390-inbox.png
          npx playwright screenshot --browser chromium --viewport-size='430,932' --full-page "$theme?view=lead" visual-artifacts/workspace-v2-theme-430-lead.png
          npx playwright screenshot --browser chromium --viewport-size='768,1024' --full-page "$theme?view=conversation" visual-artifacts/workspace-v2-theme-768-conversation.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$theme" visual-artifacts/workspace-v2-theme-1440-desktop.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$activity" visual-artifacts/workspace-v2-390-inbox-activity.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$activity" visual-artifacts/workspace-v2-1440-inbox-activity.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$startup" visual-artifacts/workspace-v2-390-startup-failure.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$startup" visual-artifacts/workspace-v2-1440-startup-failure.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$inboxFailure" visual-artifacts/workspace-v2-390-inbox-load-failure.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$inboxFailure" visual-artifacts/workspace-v2-1440-inbox-load-failure.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$taskEdit" visual-artifacts/workspace-v2-task-edit-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$taskEdit" visual-artifacts/workspace-v2-task-edit-1440.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$adminAudit" visual-artifacts/admin-audit-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$adminAudit" visual-artifacts/admin-audit-1440.png
          npx playwright screenshot --browser chromium --viewport-size='390,844' --full-page "$pipelineAdmin" visual-artifacts/pipeline-admin-390.png
          npx playwright screenshot --browser chromium --viewport-size='1440,1000' --full-page "$pipelineAdmin" visual-artifacts/pipeline-admin-1440.png
          test "$(find visual-artifacts -type f -name '*.png' | wc -l)" -eq 34
          find visual-artifacts -type f -name '*.png' -size +10k | grep -q .

      # A part receipt records only this runner's actual cases and captures.
      # Part 0 owns cache and Chromium's eight layout plus 26 CLI screenshots;
      # an engine receipt is built only after all of its isolated parts pass.
      - name: Record exact partition evidence
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_TESTED_SHA: ${{ github.sha }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/manager2_visual_shards.js record-part "${{ matrix.browser }}" "${{ matrix.part }}"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-part-${{ github.sha }}-${{ matrix.browser }}-${{ matrix.part }}
          overwrite: true
          path: |
            partition-receipt.json
            visual-reports/*.json
            donor/**
            visual-artifacts/*.png
            send-feedback-artifacts/*.png
            notification-diagnostic-artifacts/*.png
            conversation-scroll-artifacts/*.png
            emoji-picker-artifacts/*.png
            timezone-artifacts/*.png
            manager2-artifacts/*.png
            manager-media-artifacts/*.png
            report-attachment-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  # Preserve the existing per-engine check contexts and canonical artifacts.
  # No flat merge of reports or PNGs from different isolated browser runners.
  browser-tests:
    if: always() && needs.change-scope.result == 'success' && needs.change-scope.outputs.mode == 'full'
    needs: [change-scope, selection, browser-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_TESTED_SHA: ${{ github.sha }}
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}
      QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      QA_PARTS_RESULT: ${{ needs.browser-parts.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download original part 0 evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-part-${{ github.sha }}-${{ matrix.browser }}-0
          path: parts/${{ matrix.browser }}/part-0
      - name: Download original part 1 evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-part-${{ github.sha }}-${{ matrix.browser }}-1
          path: parts/${{ matrix.browser }}/part-1
      - name: Require every child and assemble exact full engine proof
        if: always()
        run: |
          test "$QA_PARTS_RESULT" = success
          node tools/manager2_visual_shards.js assemble "${{ matrix.browser }}" parts "engine-evidence/${{ matrix.browser }}"
      - name: Upload verified engine evidence
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-${{ matrix.browser }}
          overwrite: true
          path: engine-evidence/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14

  firefox-history:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 8
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Start isolated history fixture server
        shell: "bash /opt/manager2-qa/run {0}"
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/firefox-history-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firefox-history-server.log"
          exit 1
      # Actual PHP shell and canonical modules; only local synthetic API replies.
      - name: Verify older history transport in Firefox
        run: npx playwright test tests/visual/manager-transcript-history.spec.js --grep 'older transport' --browser=firefox --reporter=line --workers=1
      - name: Upload Firefox history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-history-${{ github.sha }}
          overwrite: true
          path: |
            manager2-artifacts/history-*firefox*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  firefox-notifications:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 8
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Start isolated static fixture server
        shell: "bash /opt/manager2-qa/run {0}"
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/firefox-notifications-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/visual/workspace-v2-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firefox-notifications-server.log"
          exit 1
      # Browser/HTTP failures are controlled fixtures, not provider delivery tests.
      - name: Verify notification setup in Firefox
        run: npx playwright test tests/visual/workspace-notification-diagnostics.spec.js tests/visual/manager-browser-push-state.spec.js --browser=firefox --reporter=line --workers=1
      - name: Upload Firefox notification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-notifications-${{ github.sha }}
          overwrite: true
          path: |
            notification-diagnostic-artifacts/*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  # Keep the required check name stable. A failed, cancelled or skipped engine,
  # missing artifact/receipt or mismatched provenance must never become green.
  full-screenshots:
    if: always() && needs.browser-tests.result == 'success'
    needs: [browser-tests, firefox-history, firefox-notifications]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download Chromium evidence
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-chromium
          path: evidence/chromium
      - name: Download WebKit evidence
        uses: actions/download-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}-webkit
          path: evidence/webkit
      - name: Validate full evidence and all required browser jobs
        id: verify
        if: always()
        env:
          QA_TESTED_SHA: ${{ github.sha }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_BROWSER_RESULT: ${{ needs.browser-tests.result }}
          QA_FIREFOX_HISTORY_RESULT: ${{ needs.firefox-history.result }}
          QA_FIREFOX_NOTIFICATIONS_RESULT: ${{ needs.firefox-notifications.result }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: node tools/verify_manager2_visual_evidence.js evidence "$QA_TESTED_SHA" "$QA_HEAD_SHA" "$QA_BROWSER_RESULT" "$QA_FIREFOX_HISTORY_RESULT" "$QA_FIREFOX_NOTIFICATIONS_RESULT" "$QA_RUN_ID" "$QA_RUN_ATTEMPT"
      # The canonical artifact now contains chromium/ and webkit/ directories;
      # original per-engine evidence directories remain intact below each one.
      - name: Upload complete visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-visual-${{ github.sha }}
          overwrite: true
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Index only fully executed evidence for future same-PR leaf fixes
        if: steps.verify.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-v2-full-index-${{ github.sha }}
          overwrite: true
          path: evidence/visual-evidence.json
          if-no-files-found: error
          retention-days: 14

  oauth-browser:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'oauth'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Run only native OAuth consent and callback cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: oauth-browser.json
        run: npx playwright test tests/visual/manager-ai-draft.spec.js --grep 'OAuth native (allow|deny|legacy policy control)' --browser=${{ matrix.browser }} --reporter=line,json --workers=1 --forbid-only
      - name: Require executed consent cases, including both decisions
        run: node tools/verify_oauth_browser_report.js oauth-browser.json ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            oauth-browser.json
            manager2-artifacts/ai-draft-*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 7

  tour-browser:
    needs: change-scope
    # Rule edits still run the full suite and also commission this shorter path.
    if: needs.change-scope.outputs.mode == 'tour-selection' || needs.change-scope.outputs.tour-proof == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
      QA_TESTED_SHA: ${{ github.sha }}
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}
      QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: List the complete component inventory
        run: npx playwright test tests/visual/manager-tour-selection.spec.js --browser=${{ matrix.browser }} --workers=1 --forbid-only --list --reporter=json > tour-selection-expected.json
      - name: Execute every selection case on all four widths
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tour-selection-browser.json
        run: npx playwright test tests/visual/manager-tour-selection.spec.js --browser=${{ matrix.browser }} --workers=1 --forbid-only --reporter=line,json
      - name: Require complete current-source component evidence
        run: node tools/verify_tour_selection_browser_report.js tour-selection-browser.json tour-selection-expected.json ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-selection-browser-${{ matrix.browser }}-${{ github.sha }}
          overwrite: true
          path: |
            tour-selection-receipt.json
            tour-selection-browser.json
            tour-selection-expected.json
            manager2-artifacts/tour-selection-*.png
            test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 14

  screenshots:
    if: always()
    needs: [change-scope, full-screenshots, oauth-browser, tour-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected current-run evidence
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          CI_MODE: ${{ needs.change-scope.outputs.mode }}
          FULL_RESULT: ${{ needs.full-screenshots.result }}
          OAUTH_RESULT: ${{ needs.oauth-browser.result }}
          TOUR_RESULT: ${{ needs.tour-browser.result }}
          TOUR_PROOF: ${{ needs.change-scope.outputs.tour-proof }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$CI_MODE:$TOUR_PROOF" in
            oauth:false)
              test "$OAUTH_RESULT" = success
              test "$FULL_RESULT" = skipped
              test "$TOUR_RESULT" = skipped
              ;;
            tour-selection:false)
              test "$TOUR_RESULT" = success
              test "$FULL_RESULT" = skipped
              test "$OAUTH_RESULT" = skipped
              ;;
            full:false|full:true)
              test "$FULL_RESULT" = success
              test "$OAUTH_RESULT" = skipped
              if test "$TOUR_PROOF" = true; then
                test "$TOUR_RESULT" = success
              else
                test "$TOUR_RESULT" = skipped
              fi
              ;;
            *) exit 1 ;;
          esac
