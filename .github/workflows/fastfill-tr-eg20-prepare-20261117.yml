                  candidates=[]
                  def walk(v):
                      if isinstance(v,dict):
                          if v.get('id')==hid:candidates.append(v)
                          for x in v.values():walk(x)
                      elif isinstance(v,list):
                          for x in v:walk(x)
                  walk(data);assert len(candidates)==1,(hid,'native_identity')
                  d=candidates[0]
              cid=4 if r['country']=='TR' else 1
              assert d['country']['id']==cid,(hid,'country')
              assert html.unescape(d['name']).strip()==html.unescape(r['provider_name']).strip(),(hid,'brand_changed')
              images=d['images'];image_text=json.dumps(images,ensure_ascii=False)
              selected=[];receipts=[]
