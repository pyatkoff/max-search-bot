                  if len(selected)==3:break
              assert len(selected)==3,(hid,'fewer_than_three_photos')
              b=m['encode_png'](m['draw_cover'](r['hotel'],selected,logo.copy()))
              (root/(str(hid)+'.png')).write_bytes(b)
              info={k:v for k,v in d.items() if k!='images'}
              rec={'id':hid,'work_id':r['work_id'],'name':r['hotel'],'country_id':cid,'source':r['source_api_url'],'photo_sources':receipts,'png_sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'visual_approval':False,'send_allowed':False}
              return rec,info
