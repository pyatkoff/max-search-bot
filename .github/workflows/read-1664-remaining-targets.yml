name: Verify unstarted Telegram hotel targets from PR1664
on:
  push:
    branches: [audit/1566-next-release-admission-1664]
    paths: [.github/workflows/read-1664-remaining-targets.yml]
permissions: {}
jobs:
  read:
    if: github.repository == 'pyatkoff/max-search-bot' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin established SSH host continuity and authentication identity
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
          KEY_VALUE: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',os.environ['HOST_VALUE'] or '')
          assert re.fullmatch(r'[A-Za-z0-9_-]+',os.environ['USER_VALUE'] or '')
          PY
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          chmod 600 "$RUNNER_TEMP/channel_key"
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,subprocess
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',os.environ['HOST_VALUE']],capture_output=True,text=True,timeout=35)
          found=[]
          for line in scan.stdout.splitlines():
              fields=line.split()
              if len(fields)<3 or fields[0].startswith('#'):continue
              try:fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(fields[2])).digest()).decode().rstrip('=')
              except Exception:continue
              if fingerprint=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':found.append(line)
          assert found,'HOST_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(found)+'\n')
          print('ESTABLISHED_HOST_PIN_VERIFIED')
          PY
      - name: Read remaining identities and current channel permissions
        env:
          HOST_VALUE: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.STANDBY_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" "$USER_VALUE@$HOST_VALUE" 'bash -s' <<'REMOTE'
          set -eu
          cd /var/www/anytoour/data/www/app.anytoour.ru
          php -d display_errors=0 <<'PHP'
          <?php
          namespace AnyTour\ExistingPostBatch;
          
          require 'tools/anytour_existing_post_batch.php';
          
          function transferNextRemainingRows(array $plan, string $approvedDigest, string $journal): array
          {
              requirePost($approvedDigest === '30f93518da51279979f7669538f7c09f6096733e9423f755dc21981af821b98d'
                  && $plan['operation'] === NEXT_TRANSFER_OPERATION
                  && array_column($plan['rows'], 'target_message_id') === ['1588', '997', '1101'],
                  'transfer_remaining_plan_changed');
              requirePost(strlen($journal) <= 1_000_000 && str_ends_with($journal, "\n"),
                  'transfer_original_journal_invalid');
              $lines = explode("\n", substr($journal, 0, -1), 7);
              $events = array_map(static fn(string $line): array => json_decode($line, true, 64, JSON_THROW_ON_ERROR), $lines);
              requirePost(array_column($events, 'state') === [
                  'intent_saved', 'identity_reserved', 'request_prepared', 'provider_edit_started',
                  'provider_response_saved', 'response_saved_completion_requires_readback',
              ], 'transfer_original_journal_invalid');
              [$intent, $reserved, , $attempt, $saved, $terminal] = $events;
              $response = $saved['response'] ?? [];
              requirePost(($intent['operation'] ?? null) === NEXT_TRANSFER_OPERATION
                  && ($intent['plan_sha256'] ?? null) === $approvedDigest
                  && ($intent['row'] ?? null) === $plan['rows'][0]
                  && ($intent['execution'] ?? null) === [
                      'native_run_id'=>'45235830990',
                      'application_sha'=>'bb7d0bde64092cbd24a69084e651ff44336ba8b5',
                      'native_preflight'=>$plan['native_preflight'],
                  ]
                  && ($reserved['reservation']['publication_id'] ?? null) === 3709
                  && ($attempt['provider_write_attempts'] ?? null) === 1
                  && ($response['http'] ?? null) === 400 && ($response['transport_error'] ?? null) === false
                  && ($response['data']['ok'] ?? null) === false && ($response['data']['error_code'] ?? null) === 400
                  && ($response['data']['description'] ?? null) === 'Bad Request: MESSAGE_ID_INVALID'
                  && ($terminal['ok'] ?? null) === false && ($terminal['hotel_id'] ?? null) === 800
                  && ($terminal['message_id'] ?? null) === '1588'
                  && ($terminal['operation'] ?? null) === 'anytour-issue1566-historical-tg-media-1588-v1'
                  && ($terminal['reason'] ?? null) === 'hotel_transfer_response_unconfirmed'
                  && ($terminal['provider_write_attempts'] ?? null) === 1
                  && ($terminal['reserved_publication_id'] ?? null) === 3709,
                  'transfer_original_rejection_unconfirmed');
              return array_slice($plan['rows'], 1);
          }
          
          transferRuntime(getcwd(), '3bff152819b85e68a56fe3f50adb268cef3b9dfb');
          $digest = '30f93518da51279979f7669538f7c09f6096733e9423f755dc21981af821b98d';
          $plan = transferPlanFromBytes(file_get_contents(NEXT_TRANSFER_PLAN_FILE), $digest, true);
          $path = POST_OPS.'/anytour-issue1566-historical-tg-media-1588-v1/receipt.jsonl';
          requirePost(is_file($path) && realpath($path) === $path, 'transfer_original_journal_invalid');
          $selected = transferNextRemainingRows($plan, $digest, file_get_contents($path, false, null, 0, 1_000_001));
          $unstarted = [];
          foreach ($selected as $row) {
              $operation = POST_OPS.'/anytour-issue1566-historical-tg-media-'.$row['target_message_id'].'-v1';
              requirePost(!file_exists($operation) && !is_link($operation), 'transfer_previous_operation_do_not_replay');
              $unstarted[] = $row['target_message_id'];
          }
          ob_start();
          try {
              require_once 'config.php';
          } finally {
              ob_end_clean();
          }
          $pdo = \ConversationDb::connection();
          $pdo->exec('SET TRANSACTION READ ONLY');
          $pdo->beginTransaction();
          try {
              $q = $pdo->prepare('SELECT current_version_id, observed_revision_ms, telegram_sequence FROM post_publications WHERE id=? AND post_channel_id=? AND external_message_id=?');
              $q->execute([3709,6,'1588']);
              $reservation = $q->fetch(\PDO::FETCH_ASSOC);
              requirePost($reservation === [
                  'current_version_id'=>null,'observed_revision_ms'=>null,'telegram_sequence'=>null,
              ], 'original_hotel_reservation_changed');
          } finally {
              $pdo->rollBack();
          }
          echo json_encode(['original_journal_matches'=>true,'original_reservation_is_pending'=>true,
              'selected_targets'=>$unstarted,'provider_writes'=>0,'production_writes'=>0], JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          REMOTE
      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
