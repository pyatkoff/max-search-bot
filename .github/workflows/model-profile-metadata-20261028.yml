name: Consume one new admitted envelope metadata
on:
  push:
    branches: [audit/model-profile-metadata-exec-20261028]
    paths: [.github/workflows/model-profile-metadata-20261028.yml]
permissions:
  contents: read
concurrency:
  group: anytour-model-profile-metadata-20261028
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = 271e68b5867b54cb28b462e939257a950fd8b1cc
      - name: Prepare existing identity and strict canonical pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$K" == *"PRIVATE KEY"* ]]; then printf '%b\n' "$K" | tr -d '\r' > "$RUNNER_TEMP/membership-key"; else printf '%s' "$K" | base64 --decode > "$RUNNER_TEMP/membership-key"; fi
          chmod 600 "$RUNNER_TEMP/membership-key"
          ssh-keygen -y -f "$RUNNER_TEMP/membership-key" >/dev/null
          python3 - "$TARGET" "$RUNNER_TEMP/membership-hosts" <<'PY'
          import base64,hashlib,socket,subprocess,sys
          host,dest=sys.argv[1:]
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:raise SystemExit('canonical_target_changed')
          pinned=[]
          for _ in range(2):
              scan=subprocess.run(['ssh-keyscan','-t','ed25519','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0].startswith('#'):continue
                  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError:continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0' and line not in pinned:pinned.append(line)
              if pinned:break
          if not pinned:raise SystemExit('canonical_host_pin_not_seen')
          open(dest,'w').write('\n'.join(pinned)+'\n')
          PY
      - name: Prepare pinned official age binary
        run: |
          set -euo pipefail
          curl -fsSL --retry 0 --connect-timeout 10 --max-time 40 -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age
          test "$("$RUNNER_TEMP/age/age" --version)" = "v1.3.2"
      - name: Read immutable metadata only and encrypt
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/comparison-read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
           $began=hrtime(true);$deadline=$began+5000000000;
           $check=static function()use($deadline):int{$ms=(int)floor(($deadline-hrtime(true))/1000000);if($ms<50)throw new RuntimeException('deadline');return min(4000,$ms-25);};
           chdir('/var/www/anytoour/data/www/app.anytoour.ru');
           require_once 'config.php';require_once 'services/ProjectAccessService.php';require_once 'services/ConversationDb.php';
           if(ProjectConfig::projectId()!=='anytour')throw new RuntimeException('project');
           ProjectAccessService::initializeReadOnly();$p=ConversationDb::connection();
           $p->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$p->exec('SET TRANSACTION READ ONLY');$p->beginTransaction();
           $run=static function(string $sql,array $args)use($p,$check){$ms=$check();$p->exec('SET SESSION MAX_EXECUTION_TIME='.$ms);$check();$q=$p->prepare($sql);$q->execute($args);$check();return $q;};
           $after=strtotime('2026-10-27T14:28:41Z');$through=strtotime('2026-10-28T00:35:00Z');
           $sql="SELECT id,project_key,platform,customer_key,conversation_id,observed_at_unix,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.access_status')) AS access_status,JSON_UNQUOTE(JSON_EXTRACT(profile_json,'$.profile.prediction_at')) AS prediction_at,CASE WHEN OCTET_LENGTH(JSON_EXTRACT(profile_json,'$.source_references'))<=20000 THEN JSON_EXTRACT(profile_json,'$.source_references') ELSE NULL END AS refs FROM modeled_conversion_profile_versions WHERE project_key='anytour' AND observed_at_unix>? AND observed_at_unix<=? ORDER BY observed_at_unix,id LIMIT 50";
           $q=$run($sql,[$after,$through]);$profiles=$q->fetchAll(PDO::FETCH_ASSOC);$check();
           $out=['schema_version'=>2,'purpose'=>'new_admitted_envelope_consumer_metadata','production_sha'=>'271e68b5867b54cb28b462e939257a950fd8b1cc','sampled_at'=>gmdate('Y-m-d\\TH:i:s\\Z'),'range'=>['after_exclusive'=>$after,'through_inclusive'=>$through],'selection'=>'first_eligible_message_among_first_50_profiles_max_500_refs_no_refill','candidate'=>null,'profiles_examined'=>0,'journal_rows_examined'=>0,'selection_incomplete'=>false,'native_source_reads'=>0,'old_snapshot_rows'=>0,'texts_values_returned'=>0,'database_writes'=>0];
           $profileBytes=0;
           foreach($profiles as $c){
            $out['profiles_examined']++;
            $profileBytes+=strlen($c['refs']??'');if($profileBytes>1048576){$out['selection_incomplete']=true;break;}
            if(!in_array($c['platform'],['max','telegram'],true)||$c['access_status']!=='allowed')continue;
            if($c['refs']===null){$out['selection_incomplete']=true;continue;}$refs=json_decode($c['refs'],true);if(!is_array($refs)||!array_is_list($refs)||count($refs)<1||count($refs)>40)continue;
            $cutoff=strtotime($c['prediction_at']??'');if($cutoff===false)continue;
            $new=[];$refmap=[];$bad=false;
            foreach($refs as $ref){
             if(!is_array($ref)||!isset($ref['journal_id'],$ref['source_kind'],$ref['source_id'],$ref['source_version_no'],$ref['observed_at'])){$bad=true;break;}
             $id=(string)$ref['journal_id'];$at=strtotime($ref['observed_at']);
             if(!preg_match('/^[1-9][0-9]{0,19}$/',$id)||isset($refmap[$id])||$at===false){$bad=true;break;}
             $refmap[$id]=$ref;
             if($at>$after&&$at<=$through&&$at<=$cutoff)$new[]=$id;
            }
            if($bad||!$new)continue;
            if($out['journal_rows_examined']+count($new)>500){$out['selection_incomplete']=true;break;}
            $marks=implode(',',array_fill(0,count($new),'?'));
            $meta="JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.metadata_json'))";
            $safe="CASE WHEN JSON_VALID($meta) THEN $meta ELSE '{}' END";
            $jsql="SELECT id,source_kind,source_id,version_no,observed_at_unix,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_status')) AS source_status,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_kind')) AS snapshot_kind,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_id')) AS snapshot_id,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.project_key')) AS project_key,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.platform')) AS platform,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.customer_key')) AS customer_key,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.conversation_id')) AS conversation_id,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload_status')) AS payload_status,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_timestamp_basis')) AS clock_basis,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.source_created_at_unix')) AS recorded_unix,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.direction')) AS direction,JSON_UNQUOTE(JSON_EXTRACT(snapshot_json,'$.payload.sender_type')) AS sender_type,CASE WHEN $meta IS NULL OR JSON_VALID($meta) THEN 0 ELSE 1 END AS invalid_metadata,JSON_UNQUOTE(JSON_EXTRACT($safe,'$.type')) AS message_type FROM modeled_conversion_stream_versions WHERE project_key='anytour' AND id IN ($marks) AND observed_at_unix>? AND observed_at_unix<=?";
            $j=$run($jsql,array_merge($new,[$after,$through]))->fetchAll(PDO::FETCH_ASSOC);$check();$out['journal_rows_examined']+=count($new);
            if(count($j)!==count($new))continue;
            $eligible=false;$valid=true;
            foreach($j as &$row){
             $ref=$refmap[(string)$row['id']]??null;
             if(!$ref||(string)$row['source_kind']!==(string)$ref['source_kind']||(string)$row['source_id']!==(string)$ref['source_id']||(int)$row['version_no']!==(int)$ref['source_version_no']||(int)$row['observed_at_unix']!==strtotime($ref['observed_at'])||(int)$row['observed_at_unix']>$cutoff){$valid=false;break;}
             if((string)$row['snapshot_kind']!==(string)$row['source_kind']||(string)$row['snapshot_id']!==(string)$row['source_id']){$valid=false;break;} if(in_array($row['source_status'],['deleted','scope_excluded'],true))continue;
             if($row['source_status']!=='present'){$valid=false;break;}
             foreach(['project_key','platform','customer_key','conversation_id']as$k)if((string)$row[$k]!== (string)$c[$k]){$valid=false;break;}
             if(!$valid)break;
             if($row['source_kind']==='message'&&$row['payload_status']==='copied'&&$row['direction']==='inbound'&&$row['sender_type']==='customer'&&(int)$row['invalid_metadata']===0&&$row['message_type']==='message'&&in_array($row['clock_basis'],['database_session_timezone_to_unix','canonical_recording_unix_v1'],true)&&(int)$row['recorded_unix']>=946684800&&(int)$row['recorded_unix']<=(int)$row['observed_at_unix'])$eligible=true;
            }unset($row);
            if(!$valid||!$eligible)continue;
            $c['source_references']=$refs;unset($c['refs']);$c['new_references']=$j;$out['candidate']=$c;break;
           }
           if(count($profiles)===50&&$out['candidate']===null)$out['selection_incomplete']=true;
           $p->rollBack();$check();$raw=json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);if(strlen($raw)>65536)throw new RuntimeException('output');echo $raw;
          }catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();fwrite(STDERR,"new_envelope_metadata_failed\n");exit(1);}
          PHP
          php -l "$RUNNER_TEMP/comparison-read.php"
          timeout 25 ssh -i "$RUNNER_TEMP/membership-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/membership-hosts" -o ConnectTimeout=10 "$USER@$TARGET" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = 271e68b5867b54cb28b462e939257a950fd8b1cc; php -d display_errors=0 -d log_errors=0; test "$(git rev-parse HEAD)" = 271e68b5867b54cb28b462e939257a950fd8b1cc' < "$RUNNER_TEMP/comparison-read.php" > "$RUNNER_TEMP/comparison-metadata.json"
          python3 - "$RUNNER_TEMP/comparison-metadata.json" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(raw)<=65536
          obj=json.loads(raw)
          assert obj['native_source_reads']==obj['old_snapshot_rows']==obj['texts_values_returned']==obj['database_writes']==0
          PY
          "$RUNNER_TEMP/age/age" -R docs/diagnostics-recipient.txt -o "$RUNNER_TEMP/comparison-metadata.age" "$RUNNER_TEMP/comparison-metadata.json"
          python3 - "$RUNNER_TEMP/comparison-metadata.json" "$RUNNER_TEMP/comparison-metadata.age" <<'PY'
          import hashlib,json,pathlib,sys
          obj=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          cipher=pathlib.Path(sys.argv[2]).read_bytes()
          print(json.dumps({'metadata_only':True,'candidate_present':obj['candidate'] is not None,'cipher_bytes':len(cipher),'cipher_sha256':hashlib.sha256(cipher).hexdigest(),'native_source_reads':0,'texts_returned':0,'database_writes':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modeled-profile-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison-metadata.age
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/membership-key" "$RUNNER_TEMP/membership-hosts" "$RUNNER_TEMP/comparison-read.php" "$RUNNER_TEMP/comparison-metadata.json" "$RUNNER_TEMP/comparison-metadata.age"

