name: Read one ordinary worker failure category
on:
  push:
    branches: [audit/worker-category-receipt-20261027]
    paths: [.github/workflows/worker-category-receipt.yml]
permissions:
  contents: read
concurrency:
  group: anytour-worker-category-receipt-20261027
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = fcdb858149f46f1d8633d3b0b682316592dfe8d5
      - name: Prepare existing identity and strict canonical pin
        env:
          K: ${{ secrets.STANDBY_DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$K" == *"PRIVATE KEY"* ]]; then printf '%b\n' "$K" | tr -d '\r' > "$RUNNER_TEMP/membership-key"; else printf '%s' "$K" | base64 --decode > "$RUNNER_TEMP/membership-key"; fi
          chmod 600 "$RUNNER_TEMP/membership-key"
          ssh-keygen -y -f "$RUNNER_TEMP/membership-key" >/dev/null
          python3 - "$TARGET" "$RUNNER_TEMP/membership-hosts" <<'PY'
          import base64,hashlib,socket,subprocess,sys
          host,dest=sys.argv[1:]
          if {v[4][0] for v in socket.getaddrinfo(host,22,type=socket.SOCK_STREAM)}!={'5.45.122.54'}:raise SystemExit('canonical_target_changed')
          pinned=[]
          for _ in range(2):
              scan=subprocess.run(['ssh-keyscan','-T','10',host],capture_output=True,text=True,timeout=30)
              for line in scan.stdout.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0].startswith('#'):continue
                  try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(parts[2],validate=True)).digest()).decode().rstrip('=')
                  except ValueError:continue
                  if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0' and line not in pinned:pinned.append(line)
              if pinned:break
          if not pinned:raise SystemExit('canonical_host_pin_not_seen')
          open(dest,'w').write('\n'.join(pinned)+'\n')
          PY
      - name: One read-only metadata snapshot
        env:
          TARGET: ${{ secrets.STANDBY_DEPLOY_HOST }}
          USER: ${{ secrets.STANDBY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/membership-read.php" <<'PHP'
          <?php
          declare(strict_types=1);
          chdir('/var/www/anytoour/data/www/app.anytoour.ru');
          $out=['purpose'=>'first_ordinary_worker_category_after_1191','sampled_at'=>gmdate('Y-m-d\TH:i:s\Z'),'available'=>false,'native_rows'=>0,'database_writes'=>0,'worker_ticks'=>0,'API_POST_model_provider_customer_calls'=>0];
          $f=@fopen('metrika_upload.log','rb');
          if($f){$size=fstat($f)['size'];$offset=max(0,$size-65536);fseek($f,$offset);$tail=stream_get_contents($f,65536);fclose($f);$lines=explode("\n",$tail);if($offset>0)array_shift($lines);array_pop($lines);
           foreach(array_reverse(array_slice($lines,-512))as$line){
            if(!preg_match('/^([0-9-]{10} [0-9:]{8}) MAX_CHANNEL (.+)$/D',$line,$m))continue;
            $out['wallclock']=$m[1];$out['clock_basis']='naive_wallclock_not_proved_UTC';
            if(str_starts_with($m[2],'background_failed ')){
             $j=json_decode(substr($m[2],18),true);
             $cats=['database_exception','stage_capture_failed','metrika_config_unavailable','tracker_transport_failed','tracker_response_invalid','php_error','runtime_exception','diagnostic_unavailable'];
             if(!is_array($j)||!in_array($j['category']??null,$cats,true))break;
             $out['available']=true;$out['outcome']='background_failed';$out['category']=$j['category'];
             $v=$j['sqlstate']??null;$out['sqlstate']=is_string($v)&&preg_match('/\A[A-Z0-9]{5}\z/D',$v)?$v:null;
             $v=$j['location']??null;$out['location']=is_string($v)&&preg_match('/\A(?:cron_metrika|MaxChannelConversionWorker|MaxChannelConversionOutbox|MetrikaConversionGoalService|MetrikaOfflineClient|MaxTrackerLookupClient)\.php:[1-9][0-9]{0,5}\z/D',$v)?$v:null;
            }else{
             $j=json_decode($m[2],true);if(!is_array($j)||!in_array($j['mode']??null,['off','collect','send'],true))break;
             $out['available']=true;$out['outcome']='worker_returned';$out['mode']=$j['mode'];$out['membership']=[];
             foreach(['inserted','unchanged','conflicts','errors']as$k){$v=$j['membership'][$k]??null;$out['membership'][$k]=is_int($v)&&$v>=0?$v:null;}
            }
            break;
           }
          }
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          PHP
          php -l "$RUNNER_TEMP/membership-read.php"
          ssh -i "$RUNNER_TEMP/membership-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/membership-hosts" -o ConnectTimeout=10 "$USER@$TARGET" 'set -e; cd /var/www/anytoour/data/www/app.anytoour.ru; test "$(git rev-parse HEAD)" = fcdb858149f46f1d8633d3b0b682316592dfe8d5; php -d display_errors=0 -d log_errors=0; test "$(git rev-parse HEAD)" = fcdb858149f46f1d8633d3b0b682316592dfe8d5' < "$RUNNER_TEMP/membership-read.php" > "$RUNNER_TEMP/membership-metadata.json"
          python3 - "$RUNNER_TEMP/membership-metadata.json" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(raw)<=65536
          obj=json.loads(raw)
          assert obj['native_rows']==obj['database_writes']==obj['worker_ticks']==obj['API_POST_model_provider_customer_calls']==0
          print(json.dumps(obj,ensure_ascii=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: membership-path-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/membership-metadata.json
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/membership-key" "$RUNNER_TEMP/membership-hosts" "$RUNNER_TEMP/membership-read.php" "$RUNNER_TEMP/membership-metadata.json"
