name: Manager personal workspace capacity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/browser-qa/**'
      - 'tools/browser_qa_environment.json'
      - 'tools/browser_qa_environment.js'
      - 'manager/assets/workspace-v2-personal-workspace.*'
      - 'manager2/assets/manager2.css'
      - 'tests/visual/manager-personal-capacity.spec.js'
      - '.github/workflows/manager-personal-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  capacity:
    name: personal workspace / capacity
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: "bash /opt/manager2-qa/run {0}"
    timeout-minutes: 12
    env:
      QA_BROWSER_IMAGE: ghcr.io/pyatkoff/max-search-bot-browser-qa@sha256:7b95d1abd4105d9fa3d2af76a7e3c832e5bfe6afe43d091bbe8cdc18814a9c5a
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Verify the prepared native runtime
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node /opt/manager2-qa/verify-runtime.js --require-source
      - name: Retain exact pre-fix PHP shell and assets for paired evidence
        run: |
          git fetch --no-tags --depth=1 origin 5a4c209d62a8ae25e55c6ebafa4b27f90d3dbb3a
          git worktree add --detach "$RUNNER_TEMP/manager-personal-capacity-before" 5a4c209d62a8ae25e55c6ebafa4b27f90d3dbb3a
          echo "M2_CAPACITY_BASE_ROOT=$RUNNER_TEMP/manager-personal-capacity-before" >> "$GITHUB_ENV"
      - name: Real pointer and keyboard capacity in Chromium
        run: npx playwright test tests/visual/manager-personal-capacity.spec.js --reporter=line --workers=1
      - name: Real pointer and keyboard capacity in WebKit
        run: npx playwright test tests/visual/manager-personal-capacity.spec.js --browser=webkit --reporter=line --workers=1
      - name: Upload paired viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-capacity-${{ github.event.pull_request.head.sha || github.sha }}
          path: manager2-artifacts/personal-capacity-*.png
          if-no-files-found: error
