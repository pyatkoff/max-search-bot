name: Verify MAX public post URL source
on:
  push:
    branches: [audit/max-post-url-focused-20261025]
    paths: [.github/workflows/traffic-post-url-focused.yml]
permissions:
  contents: read
concurrency:
  group: traffic-post-url-focused-20261025
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a461aa1b276c02f72e7195a14d2ab5fe6d67840
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo_sqlite
          coverage: none
      - name: Reproduce old adapter and verify current source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7a461aa1b276c02f72e7195a14d2ab5fe6d67840
          source_file=integrations/ChannelPostIncomingAdapter.php
          cp "$source_file" "$RUNNER_TEMP/fixed-adapter.php"
          trap 'cp "$RUNNER_TEMP/fixed-adapter.php" "$source_file"' EXIT
          git show 02ba06a3bc4c9f0b7493d20671dfa565722c166d:"$source_file" > "$source_file"
          set +e
          php tests/run_channel_post_automation_regression.php > "$RUNNER_TEMP/original-result.txt" 2>&1
          original_status=$?
          set -e
          test "$original_status" != 0
          grep -F 'FAIL  MAX provider public-slug permalink retained' "$RUNNER_TEMP/original-result.txt"
          cp "$RUNNER_TEMP/fixed-adapter.php" "$source_file"
          php -l "$source_file"
          php tests/run_channel_post_automation_regression.php
          php tests/run_channel_post_registry_regression.php
          git diff --exit-code
